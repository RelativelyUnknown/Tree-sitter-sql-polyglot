dialect: hive
engine: Apache Hive
version: "4.x"
source: https://hive.apache.org/docs/latest/language/languagemanual/

statements:
  - id: drop_function
    name: DROP [TEMPORARY] FUNCTION
    doc: https://hive.apache.org/docs/latest/language/languagemanual-ddl/
    tier: high
    probes:
      - id: drop_function
        sql: "DROP FUNCTION f;"
      - id: drop_function_if_exists
        sql: "DROP FUNCTION IF EXISTS f;"
      - id: drop_function_qualified
        sql: "DROP FUNCTION IF EXISTS db.f;"
      - id: drop_temporary_function
        sql: "DROP TEMPORARY FUNCTION f;"
      - id: drop_temporary_function_if_exists
        sql: "DROP TEMPORARY FUNCTION IF EXISTS f;"

  - id: reload_function
    name: RELOAD FUNCTION
    doc: https://hive.apache.org/docs/latest/language/languagemanual-ddl/
    tier: high
    probes:
      - id: reload_function
        sql: "RELOAD FUNCTION;"
      - id: reload_functions
        sql: "RELOAD FUNCTIONS;"
