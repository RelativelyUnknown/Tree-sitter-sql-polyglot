dialect: db2
engine: IBM Db2 for Linux, UNIX and Windows
version: "11.5"
source: https://www.ibm.com/docs/en/db2/11.5.x?topic=reference-statements

statements:
  - id: create_tablespace
    name: CREATE TABLESPACE
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-create-tablespace
    tier: medium
    probes:
      - id: basic
        sql: "CREATE TABLESPACE ts;"
      - id: typed_automatic_storage
        sql: "CREATE LARGE TABLESPACE ts IN DATABASE PARTITION GROUP g PAGESIZE 8 K MANAGED BY AUTOMATIC STORAGE USING STOGROUP sg;"
      - id: size_attributes
        sql: "CREATE TABLESPACE ts MANAGED BY AUTOMATIC STORAGE AUTORESIZE YES INITIALSIZE 100 M INCREASESIZE 10 PERCENT MAXSIZE 1 G;"
      - id: managed_by_system
        sql: "CREATE REGULAR TABLESPACE ts MANAGED BY SYSTEM USING ('/tbsp/c1', '/tbsp/c2');"
      - id: managed_by_database_file
        sql: "CREATE USER TEMPORARY TABLESPACE ts MANAGED BY DATABASE USING (FILE 'dbtmp/f1' 50000, DEVICE '/dev/d1' 10000) EXTENTSIZE 256;"
      - id: on_dbpartitionnum
        sql: "CREATE TABLESPACE ts MANAGED BY DATABASE USING (DEVICE '/dev/d1' 10000) ON DBPARTITIONNUM (1);"
      - id: io_options
        sql: "CREATE TABLESPACE ts PREFETCHSIZE AUTOMATIC BUFFERPOOL bp OVERHEAD 12.67 TRANSFERRATE 0.18 NO FILE SYSTEM CACHING DATA TAG 1 DROPPED TABLE RECOVERY ON;"
    examples:
      - "CREATE TABLESPACE PAYROLL MANAGED BY DATABASE USING ( DEVICE '/dev/rhdisk6' 10000, DEVICE '/dev/rhdisk7' 10000, DEVICE '/dev/rhdisk8' 10000) OVERHEAD 12.67 TRANSFERRATE 0.18;"
      - "CREATE TABLESPACE ACCOUNTING MANAGED BY SYSTEM USING ('/tbsp/acc1', '/tbsp/acc2', '/tbsp/acc3') EXTENTSIZE 64 PREFETCHSIZE 32;"
      - "CREATE TEMPORARY TABLESPACE TEMPSPACE2 MANAGED BY DATABASE USING ( FILE 'dbtmp/tempspace2.f1' 50000, FILE 'dbtmp/tempspace2.f2' 50000) EXTENTSIZE 256;"

  - id: create_trigger
    name: CREATE TRIGGER
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-create-trigger
    tier: medium
    probes:
      - id: after_insert_row
        sql: "CREATE TRIGGER trg AFTER INSERT ON t FOR EACH ROW UPDATE s SET n = n + 1;"
      - id: or_replace_no_cascade_before
        sql: "CREATE OR REPLACE TRIGGER trg NO CASCADE BEFORE UPDATE OF c ON t REFERENCING NEW AS n FOR EACH ROW SET n.c = 1;"
      - id: instead_of_view
        sql: "CREATE TRIGGER trg INSTEAD OF INSERT ON v REFERENCING NEW AS n FOR EACH ROW INSERT INTO t VALUES (n.c);"
      - id: event_or_list
        sql: "CREATE TRIGGER trg AFTER INSERT OR DELETE OR UPDATE ON t FOR EACH ROW INSERT INTO log VALUES (1);"
      - id: referencing_old_new
        sql: "CREATE TRIGGER trg AFTER UPDATE ON t REFERENCING OLD AS o NEW AS n FOR EACH ROW WHEN (n.c > o.c) INSERT INTO log VALUES (n.c);"
      - id: transition_tables_statement
        sql: "CREATE TRIGGER trg AFTER UPDATE ON t REFERENCING OLD TABLE AS ot NEW TABLE AS nt FOR EACH STATEMENT INSERT INTO log SELECT c FROM nt;"
      - id: secured
        sql: "CREATE TRIGGER trg AFTER INSERT ON t SECURED FOR EACH ROW INSERT INTO log VALUES (1);"
      - id: compound_atomic
        sql: "CREATE TRIGGER trg AFTER UPDATE ON t REFERENCING NEW TABLE AS nt FOR EACH STATEMENT BEGIN ATOMIC SELECT f(c) FROM nt; END;"
      - id: when_signal
        sql: "CREATE TRIGGER trg AFTER UPDATE OF c ON t REFERENCING NEW AS n OLD AS o FOR EACH ROW WHEN (n.c > 1.1 * o.c) SIGNAL SQLSTATE '75000' SET MESSAGE_TEXT = 'too big';"
    examples:
      - "CREATE TRIGGER NEW_HIRED AFTER INSERT ON EMPLOYEE FOR EACH ROW UPDATE COMPANY_STATS SET NBEMP = NBEMP + 1;"
      - "CREATE TRIGGER FORMER_EMP AFTER DELETE ON EMPLOYEE FOR EACH ROW UPDATE COMPANY_STATS SET NBEMP = NBEMP - 1;"
      - "CREATE TRIGGER RAISE_LIMIT AFTER UPDATE OF SALARY ON EMPLOYEE REFERENCING NEW AS N OLD AS O FOR EACH ROW WHEN (N.SALARY > 1.1 * O.SALARY) SIGNAL SQLSTATE '75000' SET MESSAGE_TEXT ='Salary increase>10%';"

  - id: create_type_array
    name: CREATE TYPE (array)
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-create-type-array
    tier: medium
    probes:
      - id: ordinary_array
        sql: "CREATE TYPE phones AS DECIMAL(10,0) ARRAY[50];"
      - id: default_max
        sql: "CREATE TYPE nums AS DECFLOAT(34) ARRAY[];"
      - id: or_replace
        sql: "CREATE OR REPLACE TYPE nums AS INTEGER ARRAY[10];"
      - id: associative_varchar
        sql: "CREATE TYPE caps AS VARCHAR(30) ARRAY[VARCHAR(20)];"
      - id: associative_integer
        sql: "CREATE TYPE caps AS VARCHAR(30) ARRAY[INTEGER];"
      - id: anchored_element
        sql: "CREATE TYPE arr AS ANCHOR DATA TYPE TO t.c ARRAY[5];"
    examples:
      - "CREATE TYPE PHONENUMBERS AS DECIMAL (10,0) ARRAY[ 50 ];"
      - "CREATE TYPE GENERIC.NUMBERS AS DECFLOAT( 34 ) ARRAY[];"
      - "CREATE TYPE PERSONALPHONENUMBERS AS DECIMAL( 16, 0 ) ARRAY[VARCHAR( 8 )];"

  - id: create_type_cursor
    name: CREATE TYPE (cursor)
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-create-type-cursor
    tier: medium
    probes:
      - id: untyped_cursor
        sql: "CREATE TYPE curs AS CURSOR;"
      - id: row_type_cursor
        sql: "CREATE TYPE curs AS rowtype CURSOR;"
      - id: or_replace
        sql: "CREATE OR REPLACE TYPE curs AS CURSOR;"
      - id: anchored_row_of_table
        sql: "CREATE TYPE curs AS ANCHOR DATA TYPE TO ROW OF t CURSOR;"
    examples:
      - "CREATE TYPE EMPCURSOR AS CURSOR;"
      - "CREATE TYPE DEPTCURSOR AS DEPTROW CURSOR;"

  - id: create_type_distinct
    name: CREATE TYPE (distinct)
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-create-type-distinct
    tier: medium
    probes:
      - id: basic
        sql: "CREATE TYPE shoesize AS INTEGER;"
      - id: strong_type_rules
        sql: "CREATE TYPE miles AS DOUBLE WITH STRONG TYPE RULES;"
      - id: weak_check
        sql: "CREATE TYPE bonus AS INTEGER WITH WEAK TYPE RULES CHECK (VALUE >= 0 AND VALUE <= 100);"
      - id: not_null_constraint
        sql: "CREATE TYPE salary AS DOUBLE WITH WEAK TYPE RULES NOT NULL CHECK (VALUE < 100000);"
      - id: parameterized_source
        sql: "CREATE TYPE money AS DECIMAL(9,2);"
      - id: anchored_source
        sql: "CREATE TYPE ty AS ANCHOR DATA TYPE TO t.c;"
    examples:
      - "CREATE TYPE SHOESIZE AS INTEGER;"
      - "CREATE TYPE MILES AS DOUBLE;"
      - "CREATE TYPE BONUS AS INTEGER WITH WEAK TYPE RULES CHECK( VALUE >= 0 AND VALUE <= 100 );"

  - id: create_type_row
    name: CREATE TYPE (row)
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-create-type-row
    tier: medium
    probes:
      - id: field_list
        sql: "CREATE TYPE emprow AS ROW (id INTEGER, name VARCHAR(30));"
      - id: or_replace
        sql: "CREATE OR REPLACE TYPE emprow AS ROW (id INTEGER, name VARCHAR(30));"
      - id: anchored_field
        sql: "CREATE TYPE emprow AS ROW (id ANCHOR DATA TYPE TO t.c, name VARCHAR(30));"
      - id: anchored_row
        sql: "CREATE TYPE emprow AS ANCHOR DATA TYPE TO ROW OF t;"
      - id: nested_row_type_field
        sql: "CREATE TYPE outerrow AS ROW (a emprow, b INTEGER);"

  - id: create_type_structured
    name: CREATE TYPE (structured)
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-create-type-structured
    tier: medium
    probes:
      - id: basic
        sql: "CREATE TYPE dept AS (dept_name VARCHAR(20), max_emps INT) MODE DB2SQL;"
      - id: ref_using
        sql: "CREATE TYPE dept AS (dept_name VARCHAR(20), max_emps INT) REF USING INT MODE DB2SQL;"
      - id: under_supertype
        sql: "CREATE TYPE mgr UNDER emp AS (bonus DECIMAL(10,2)) MODE DB2SQL;"
      - id: not_final_instantiable
        sql: "CREATE TYPE addr AS (street VARCHAR(30)) NOT INSTANTIABLE NOT FINAL WITHOUT COMPARISONS INLINE LENGTH 100 MODE DB2SQL;"
      - id: with_function_access
        sql: "CREATE TYPE addr AS (street VARCHAR(30)) NOT FINAL MODE DB2SQL WITH FUNCTION ACCESS;"
      - id: ref_cast_functions
        sql: "CREATE TYPE dept AS (n INT) REF USING INT CAST (SOURCE AS REF) WITH f1 CAST (REF AS SOURCE) WITH f2 MODE DB2SQL;"
      - id: sql_method
        sql: "CREATE TYPE address_t AS (street VARCHAR(30), zip CHAR(15)) NOT FINAL MODE DB2SQL METHOD samezip (addr address_t) RETURNS INTEGER LANGUAGE SQL DETERMINISTIC CONTAINS SQL NO EXTERNAL ACTION;"
      - id: external_method
        sql: "CREATE TYPE address_t AS (street VARCHAR(30)) NOT FINAL MODE DB2SQL METHOD distance (address_t) RETURNS FLOAT LANGUAGE C DETERMINISTIC PARAMETER STYLE SQL NO SQL NO EXTERNAL ACTION;"
      - id: overriding_method
        sql: "CREATE TYPE germany_addr_t UNDER address_t AS (family_name VARCHAR(30)) NOT FINAL MODE DB2SQL OVERRIDING METHOD samezip (addr address_t) RETURNS INTEGER SELF AS RESULT LANGUAGE SQL CONTAINS SQL;"
    examples:
      - "CREATE TYPE DEPT AS (DEPT_NAME VARCHAR(20), MAX_EMPS INT) REF USING INT MODE DB2SQL;"
      - "CREATE TYPE EMP AS (NAME VARCHAR (32), SERIALNUM INT , DEPT REF (DEPT), SALARY DECIMAL (10,2)) MODE DB2SQL;"
      - "CREATE TYPE MGR UNDER EMP AS (BONUS DECIMAL (10,2)) MODE DB2SQL;"

  - id: create_variable
    name: CREATE VARIABLE
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-create-variable
    tier: medium
    probes:
      - id: basic
        sql: "CREATE VARIABLE v INTEGER;"
      - id: default_constant
        sql: "CREATE VARIABLE s.v VARCHAR(30) DEFAULT 'Default printer';"
      - id: default_expression
        sql: "CREATE VARIABLE s.gv INTEGER DEFAULT (GET_SECURITY_LEVEL(SESSION_USER));"
      - id: default_subquery
        sql: "CREATE VARIABLE s.gv INTEGER DEFAULT ((SELECT deptno FROM hr.employees WHERE empuser = SESSION_USER));"
      - id: or_replace_constant
        sql: "CREATE OR REPLACE VARIABLE v INTEGER CONSTANT (5);"
      - id: default_special_register
        sql: "CREATE VARIABLE v VARCHAR(128) DEFAULT SESSION_USER;"
      - id: cursor_constant
        sql: "CREATE VARIABLE staffjobs CURSOR CONSTANT (CURSOR (whichjob CHAR(5)) FOR SELECT name, dept FROM staff WHERE job = whichjob ORDER BY dept);"
      - id: xml_type
        sql: "CREATE VARIABLE myschema.customer_history_var XML;"
      - id: anchored_type
        sql: "CREATE VARIABLE v ANCHOR DATA TYPE TO t.c;"
    examples:
      - "CREATE VARIABLE MYSCHEMA.MYJOB_PRINTER VARCHAR (30) DEFAULT 'Default printer';"
      - "CREATE VARIABLE SCHEMA1.GV_DEPTNO INTEGER DEFAULT (( SELECT DEPTNO FROM HR.EMPLOYEES WHERE EMPUSER = SESSION_USER ));"
      - "CREATE VARIABLE MYSCHEMA.CUSTOMER_HISTORY_VAR XML;"

  - id: declare_global_temporary_table
    name: DECLARE GLOBAL TEMPORARY TABLE
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-declare-global-temporary-table
    tier: medium
    probes:
      - id: column_definitions
        sql: "DECLARE GLOBAL TEMPORARY TABLE session.t (c1 CHAR(6) NOT NULL, c2 DECIMAL(9,2)) ON COMMIT PRESERVE ROWS;"
      - id: like_table
        sql: "DECLARE GLOBAL TEMPORARY TABLE t1 LIKE base_t INCLUDING IDENTITY ON COMMIT PRESERVE ROWS;"
      - id: as_fullselect_with_data
        sql: "DECLARE GLOBAL TEMPORARY TABLE t1 AS (SELECT c FROM t) WITH DATA ON COMMIT DELETE ROWS;"
      - id: as_fullselect_no_data
        sql: "DECLARE GLOBAL TEMPORARY TABLE t1 AS (SELECT c FROM t) WITH NO DATA;"
      - id: logging_rollback
        sql: "DECLARE GLOBAL TEMPORARY TABLE t1 (c INT) ON COMMIT DELETE ROWS NOT LOGGED ON ROLLBACK PRESERVE ROWS;"
      - id: with_replace_in_tablespace
        sql: "DECLARE GLOBAL TEMPORARY TABLE t1 (c INT) WITH REPLACE IN usertemp1;"
      - id: organize_by
        sql: "DECLARE GLOBAL TEMPORARY TABLE t1 (c INT) ORGANIZE BY COLUMN;"
      - id: distribute_by_hash
        sql: "DECLARE GLOBAL TEMPORARY TABLE t1 (c INT, d INT) DISTRIBUTE BY HASH (c);"
      - id: identity_column
        sql: "DECLARE GLOBAL TEMPORARY TABLE t1 (id INT GENERATED ALWAYS AS IDENTITY (START WITH 1 INCREMENT BY 1), c INT WITH DEFAULT 0);"
    examples:
      - "DECLARE GLOBAL TEMPORARY TABLE SESSION.TEMP_EMP (EMPNO CHAR(6) NOT NULL , SALARY DECIMAL(9, 2), BONUS DECIMAL(9, 2), COMM DECIMAL(9, 2)) ON COMMIT PRESERVE ROWS;"
      - "DECLARE GLOBAL TEMPORARY TABLE TEMPTAB1 LIKE USER1.EMPTAB INCLUDING IDENTITY ON COMMIT PRESERVE ROWS;"

  - id: describe_input
    name: DESCRIBE INPUT
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-describe-input
    tier: medium
    probes:
      - id: basic
        sql: "DESCRIBE INPUT s1 INTO d1;"
        note: "Syntax is DESCRIBE INPUT statement-name INTO descriptor-name; the descriptor is an SQLDA (embedded/CLI use)."
