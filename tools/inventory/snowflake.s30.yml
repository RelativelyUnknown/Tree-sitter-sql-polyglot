    probes:
      - id: basic
        sql: "SHOW NOTEBOOKS;"
      - id: filters
        sql: "SHOW NOTEBOOKS LIKE '%n%' IN SCHEMA s STARTS WITH 'a' LIMIT 10;"
      - id: limit_from
        sql: "SHOW NOTEBOOKS LIMIT 10 FROM 'a';"
