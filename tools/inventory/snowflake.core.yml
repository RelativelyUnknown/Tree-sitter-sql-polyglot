  - id: merge
    name: "MERGE"
    doc: https://docs.snowflake.com/en/sql-reference/sql/merge
    tier: high
    probes:
      - { id: matched_update, sql: "MERGE INTO t USING s ON t.id = s.id WHEN MATCHED THEN UPDATE SET t.d = s.d;" }
      - { id: matched_update_multiple, sql: "MERGE INTO t USING s ON t.id = s.id WHEN MATCHED THEN UPDATE SET val = s.newval, status = s.newstatus;" }
      - { id: matched_delete, sql: "MERGE INTO t USING s ON t.k = s.k WHEN MATCHED AND s.v <= 12 THEN DELETE;" }
      - { id: matched_and_condition, sql: "MERGE INTO t USING s ON t.k = s.k WHEN MATCHED AND s.v = 11 THEN UPDATE SET t.v = s.v;" }
      - { id: not_matched_insert, sql: "MERGE INTO t USING s ON t.id = s.id WHEN NOT MATCHED THEN INSERT (id, d) VALUES (s.id, s.d);" }
      - { id: not_matched_insert_no_columns, sql: "MERGE INTO t USING s ON t.id = s.id WHEN NOT MATCHED THEN INSERT VALUES (s.id, s.d);" }
      - { id: not_matched_and_condition, sql: "MERGE INTO t USING s ON t.id = s.id WHEN NOT MATCHED AND s.flag = 1 THEN INSERT (id) VALUES (s.id);" }
      - { id: multiple_clauses, sql: "MERGE INTO t USING s ON t.id = s.id WHEN MATCHED AND s.marked = 'Y' THEN DELETE WHEN MATCHED AND s.isnew = 1 THEN UPDATE SET val = s.newval WHEN MATCHED THEN UPDATE SET val = s.newval WHEN NOT MATCHED THEN INSERT (id, val) VALUES (s.id, s.newval);" }
      - { id: update_all_by_name, sql: "MERGE INTO t USING s ON t.id = s.id WHEN MATCHED THEN UPDATE ALL BY NAME;" }
      - { id: insert_all_by_name, sql: "MERGE INTO t USING s ON t.id = s.id WHEN NOT MATCHED THEN INSERT ALL BY NAME;" }
      - { id: source_subquery, sql: "MERGE INTO t USING (SELECT k, MAX(v) AS v FROM s GROUP BY k) AS b ON t.k = b.k WHEN MATCHED THEN UPDATE SET v = b.v;" }
      - { id: target_alias, sql: "MERGE INTO t AS x USING s AS y ON x.id = y.id WHEN MATCHED THEN DELETE;" }
    examples:
      - |-
        MERGE INTO merge_example_target
          USING merge_example_source
          ON merge_example_target.id = merge_example_source.id
          WHEN MATCHED THEN
            UPDATE SET merge_example_target.description = merge_example_source.description;
      - |-
        MERGE INTO merge_example_mult_target
          USING merge_example_mult_source
          ON merge_example_mult_target.id = merge_example_mult_source.id
          WHEN MATCHED AND merge_example_mult_source.marked = 'Y'
            THEN DELETE
          WHEN MATCHED AND merge_example_mult_source.isnewstatus = 1
            THEN UPDATE SET val = merge_example_mult_source.newval, status = merge_example_mult_source.newstatus
          WHEN MATCHED
            THEN UPDATE SET val = merge_example_mult_source.newval
          WHEN NOT MATCHED
            THEN INSERT (id, val, status) VALUES (
              merge_example_mult_source.id,
              merge_example_mult_source.newval,
              merge_example_mult_source.newstatus);
      - |-
        MERGE INTO merge_example_target_all
          USING merge_example_source_all
          ON merge_example_target_all.id = merge_example_source_all.id
          WHEN MATCHED THEN
            UPDATE ALL BY NAME
          WHEN NOT MATCHED THEN
            INSERT ALL BY NAME;
      - |-
        MERGE INTO merge_example_target
          USING merge_example_source
          ON merge_example_target.id = merge_example_source.id
          WHEN MATCHED THEN
            UPDATE SET merge_example_target.description = merge_example_source.description
          WHEN NOT MATCHED THEN
            INSERT (id, description) VALUES
              (merge_example_source.id, merge_example_source.description);
      - |-
        MERGE INTO merge_example_target_clone
          USING merge_example_src
          ON merge_example_target_clone.k = merge_example_src.k
          WHEN MATCHED AND merge_example_src.v = 11 THEN DELETE
          WHEN MATCHED THEN UPDATE SET merge_example_target_clone.v = merge_example_src.v;

