dialect: spanner
engine: Google Cloud Spanner (GoogleSQL dialect)
version: "current managed service (docs as of 2026-10)"
source: https://cloud.google.com/spanner/docs/reference/standard-sql/data-definition-language

statements:
  - id: drop_index
    name: DROP INDEX
    doc: https://cloud.google.com/spanner/docs/reference/standard-sql/data-definition-language#drop-index
    tier: high
    probes:
      - id: basic
        sql: "DROP INDEX idx;"
      - id: if_exists
        sql: "DROP INDEX IF EXISTS idx;"

  - id: create_view
    name: CREATE [OR REPLACE] VIEW
    doc: https://cloud.google.com/spanner/docs/reference/standard-sql/data-definition-language#create-view
    tier: high
    probes:
      - id: create_view_invoker
        sql: "CREATE VIEW v SQL SECURITY INVOKER AS SELECT c FROM t;"
      - id: create_view_definer
        sql: "CREATE VIEW v SQL SECURITY DEFINER AS SELECT c FROM t;"
      - id: create_or_replace_invoker
        sql: "CREATE OR REPLACE VIEW v SQL SECURITY INVOKER AS SELECT c FROM t;"
      - id: create_or_replace_definer
        sql: "CREATE OR REPLACE VIEW v SQL SECURITY DEFINER AS SELECT c FROM t;"
