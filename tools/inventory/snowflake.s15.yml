dialect: snowflake
engine: Snowflake
version: "current (docs read 2026-10-04)"
source: https://docs.snowflake.com/en/sql-reference/sql-all

statements:
  - id: show_caller_grants
    name: SHOW CALLER GRANTS
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-caller-grants
    tier: medium
    probes:
      - id: on_object
        sql: "SHOW CALLER GRANTS ON TABLE t;"
      - id: on_account
        sql: "SHOW CALLER GRANTS ON ACCOUNT;"
      - id: to_role
        sql: "SHOW CALLER GRANTS TO ROLE r;"
      - id: to_database_role
        sql: "SHOW CALLER GRANTS TO DATABASE ROLE db.r;"
    examples:
      - "SHOW CALLER GRANTS ON TABLE t1;"
      - "SHOW CALLER GRANTS ON ACCOUNT;"
      - "SHOW CALLER GRANTS TO DATABASE ROLE db.owner_role;"

  - id: show_columns
    name: SHOW COLUMNS
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-columns
    tier: medium
    probes:
      - id: basic
        sql: "SHOW COLUMNS;"
      - id: like
        sql: "SHOW COLUMNS LIKE '%c%';"
      - id: in_account
        sql: "SHOW COLUMNS IN ACCOUNT;"
      - id: in_database
        sql: "SHOW COLUMNS IN DATABASE d;"
      - id: in_schema
        sql: "SHOW COLUMNS IN SCHEMA d.s;"
      - id: in_table
        sql: "SHOW COLUMNS IN TABLE t;"
      - id: in_view
        sql: "SHOW COLUMNS IN VIEW v;"
      - id: in_application
        sql: "SHOW COLUMNS IN APPLICATION a;"
      - id: in_application_package
        sql: "SHOW COLUMNS IN APPLICATION PACKAGE p;"
    examples:
      - "SHOW COLUMNS IN TABLE test_show_columns;"

  - id: show_data_metric_functions
    name: SHOW DATA METRIC FUNCTIONS
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-data-metric-functions
    tier: medium
    probes:
      - id: basic
        sql: "SHOW DATA METRIC FUNCTIONS;"
      - id: like
        sql: "SHOW DATA METRIC FUNCTIONS LIKE '%null%';"
      - id: in_account
        sql: "SHOW DATA METRIC FUNCTIONS IN ACCOUNT;"
      - id: in_database
        sql: "SHOW DATA METRIC FUNCTIONS IN DATABASE d;"
      - id: in_schema
        sql: "SHOW DATA METRIC FUNCTIONS IN SCHEMA d.s;"
      - id: starts_with
        sql: "SHOW DATA METRIC FUNCTIONS STARTS WITH 'my';"
    examples:
      - "SHOW DATA METRIC FUNCTIONS;"

  - id: show_database_roles
    name: SHOW DATABASE ROLES
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-database-roles
    tier: medium
    probes:
      - id: basic
        sql: "SHOW DATABASE ROLES IN DATABASE d;"
      - id: limit
        sql: "SHOW DATABASE ROLES IN DATABASE d LIMIT 10;"
      - id: limit_from
        sql: "SHOW DATABASE ROLES IN DATABASE d LIMIT 10 FROM 'r';"
    examples:
      - "SHOW DATABASE ROLES IN DATABASE mydb LIMIT 10 FROM 'db_role2';"

  - id: show_databases
    name: SHOW DATABASES
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-databases
    tier: medium
    probes:
      - id: basic
        sql: "SHOW DATABASES;"
      - id: terse
        sql: "SHOW TERSE DATABASES;"
      - id: history
        sql: "SHOW DATABASES HISTORY;"
      - id: like
        sql: "SHOW DATABASES LIKE '%test%';"
      - id: starts_with
        sql: "SHOW DATABASES STARTS WITH 'my';"
      - id: limit
        sql: "SHOW DATABASES LIMIT 10;"
      - id: limit_from
        sql: "SHOW DATABASES LIMIT 10 FROM 'my';"
      - id: with_privileges
        sql: "SHOW DATABASES WITH PRIVILEGES USAGE, MODIFY;"
    examples:
      - "SHOW DATABASES;"
      - "SHOW DATABASES HISTORY;"
      - "SHOW DATABASES WITH PRIVILEGES USAGE, MODIFY;"

  - id: show_external_functions
    name: SHOW EXTERNAL FUNCTIONS
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-external-functions
    tier: medium
    probes:
      - id: basic
        sql: "SHOW EXTERNAL FUNCTIONS;"
      - id: like
        sql: "SHOW EXTERNAL FUNCTIONS LIKE 'f%';"
      - id: in_application
        sql: "SHOW EXTERNAL FUNCTIONS IN APPLICATION a;"
      - id: in_application_package
        sql: "SHOW EXTERNAL FUNCTIONS IN APPLICATION PACKAGE p;"
    examples:
      - "SHOW EXTERNAL FUNCTIONS;"
      - "SHOW EXTERNAL FUNCTIONS LIKE 'SQUARE%';"

  - id: show_file_formats
    name: SHOW FILE FORMATS
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-file-formats
    tier: medium
    probes:
      - id: basic
        sql: "SHOW FILE FORMATS;"
      - id: like
        sql: "SHOW FILE FORMATS LIKE '%csv%';"
      - id: in_account
        sql: "SHOW FILE FORMATS IN ACCOUNT;"
      - id: in_database
        sql: "SHOW FILE FORMATS IN DATABASE d;"
      - id: in_schema
        sql: "SHOW FILE FORMATS IN SCHEMA d.s;"
      - id: in_application
        sql: "SHOW FILE FORMATS IN APPLICATION a;"
      - id: in_application_package
        sql: "SHOW FILE FORMATS IN APPLICATION PACKAGE p;"
    examples:
      - "SHOW FILE FORMATS;"
      - "SHOW FILE FORMATS IN DATABASE testdb;"
      - "SHOW FILE FORMATS IN SCHEMA testdb.public;"

  - id: show_functions
    name: SHOW FUNCTIONS
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-functions
    tier: medium
    probes:
      - id: basic
        sql: "SHOW FUNCTIONS;"
      - id: like
        sql: "SHOW FUNCTIONS LIKE 'f%';"
      - id: in_account
        sql: "SHOW FUNCTIONS IN ACCOUNT;"
      - id: in_class
        sql: "SHOW FUNCTIONS IN CLASS c;"
      - id: in_database
        sql: "SHOW FUNCTIONS IN DATABASE d;"
      - id: in_schema
        sql: "SHOW FUNCTIONS IN SCHEMA d.s;"
      - id: in_bare_schema
        sql: "SHOW FUNCTIONS IN s;"
    examples:
      - "SHOW FUNCTIONS;"
      - "SHOW FUNCTIONS LIKE 'SQUARE';"

  - id: show_grants
    name: SHOW GRANTS
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-grants
    tier: medium
    probes:
      - id: basic
        sql: "SHOW GRANTS;"
      - id: basic_limit
        sql: "SHOW GRANTS LIMIT 10;"
      - id: on_account
        sql: "SHOW GRANTS ON ACCOUNT;"
      - id: on_object
        sql: "SHOW GRANTS ON TABLE t;"
      - id: to_role
        sql: "SHOW GRANTS TO ROLE r;"
      - id: to_user
        sql: "SHOW GRANTS TO USER u;"
      - id: to_share
        sql: "SHOW GRANTS TO SHARE s;"
      - id: to_share_in_application_package
        sql: "SHOW GRANTS TO SHARE s IN APPLICATION PACKAGE p;"
      - id: to_application
        sql: "SHOW GRANTS TO APPLICATION a;"
      - id: to_application_role
        sql: "SHOW GRANTS TO APPLICATION ROLE a.r;"
      - id: to_service_role
        sql: "SHOW GRANTS TO SERVICE ROLE svc!r;"
      - id: to_class_role
        sql: "SHOW GRANTS TO SNOWFLAKE.CORE.BUDGET ROLE b!admin;"
      - id: to_role_limit
        sql: "SHOW GRANTS TO ROLE r LIMIT 10;"
      - id: of_role
        sql: "SHOW GRANTS OF ROLE r;"
      - id: of_application_role
        sql: "SHOW GRANTS OF APPLICATION ROLE r;"
      - id: of_service_role
        sql: "SHOW GRANTS OF SERVICE ROLE svc!r;"
      - id: of_share
        sql: "SHOW GRANTS OF SHARE s;"
      - id: future_in_schema
        sql: "SHOW FUTURE GRANTS IN SCHEMA d.s;"
      - id: future_in_database
        sql: "SHOW FUTURE GRANTS IN DATABASE d;"
      - id: future_to_role
        sql: "SHOW FUTURE GRANTS TO ROLE r;"
      - id: future_to_database_role
        sql: "SHOW FUTURE GRANTS TO DATABASE ROLE d.r;"
    examples:
      - "SHOW GRANTS ON DATABASE sales;"
      - "SHOW GRANTS TO ROLE analyst;"
      - "SHOW GRANTS TO USER user1;"
      - "SHOW GRANTS OF ROLE analyst;"
      - "SHOW FUTURE GRANTS IN SCHEMA sales.public;"

  - id: show_indexes
    name: SHOW INDEXES
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-indexes
    tier: medium
    probes:
      - id: basic
        sql: "SHOW INDEXES;"
      - id: terse
        sql: "SHOW TERSE INDEXES;"
      - id: like
        sql: "SHOW INDEXES LIKE '%idx%';"
      - id: in_account
        sql: "SHOW INDEXES IN ACCOUNT;"
      - id: in_database
        sql: "SHOW INDEXES IN DATABASE d;"
      - id: in_schema
        sql: "SHOW INDEXES IN SCHEMA d.s;"
      - id: in_table
        sql: "SHOW INDEXES IN TABLE t;"
      - id: starts_with
        sql: "SHOW INDEXES STARTS WITH 'i';"
      - id: limit_from
        sql: "SHOW INDEXES LIMIT 10 FROM 'i';"
    examples:
      - "SHOW TERSE INDEXES LIKE '%DEVICE%';"
