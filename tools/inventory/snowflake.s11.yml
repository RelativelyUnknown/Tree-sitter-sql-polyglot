dialect: snowflake
engine: Snowflake
version: "current (docs read 2026-10-04)"
source: https://docs.snowflake.com/en/sql-reference/sql-all

statements:
  - id: describe_secret
    name: DESCRIBE SECRET
    doc: https://docs.snowflake.com/en/sql-reference/sql/desc-secret
    tier: medium
    probes:
      - { id: describe, sql: "DESCRIBE SECRET s;" }
      - { id: desc, sql: "DESC SECRET s;" }
    examples:
      - "DESC SECRET service_now_creds_pw;"

  - id: describe_sequence
    name: DESCRIBE SEQUENCE
    doc: https://docs.snowflake.com/en/sql-reference/sql/desc-sequence
    tier: medium
    probes:
      - { id: describe, sql: "DESCRIBE SEQUENCE s;" }
      - { id: desc, sql: "DESC SEQUENCE s;" }
    examples:
      - "DESC SEQUENCE my_sequence;"

  - id: describe_share
    name: DESCRIBE SHARE
    doc: https://docs.snowflake.com/en/sql-reference/sql/desc-share
    tier: medium
    probes:
      - { id: outbound, sql: "DESCRIBE SHARE s;" }
      - { id: inbound, sql: "DESC SHARE acct.s;" }
    examples:
      - "DESC SHARE sales_s;"
      - "DESC SHARE ab67890.sales_s;"

  - id: describe_stage
    name: DESCRIBE STAGE
    doc: https://docs.snowflake.com/en/sql-reference/sql/desc-stage
    tier: medium
    probes:
      - { id: describe, sql: "DESCRIBE STAGE s;" }
      - { id: desc, sql: "DESC STAGE s;" }
    examples:
      - "DESC STAGE my_s3_stage;"

  - id: describe_stream
    name: DESCRIBE STREAM
    doc: https://docs.snowflake.com/en/sql-reference/sql/desc-stream
    tier: medium
    probes:
      - { id: describe, sql: "DESCRIBE STREAM s;" }
      - { id: desc, sql: "DESC STREAM s;" }
    examples:
      - "DESC STREAM mystream;"

  - id: describe_table
    name: DESCRIBE TABLE
    doc: https://docs.snowflake.com/en/sql-reference/sql/desc-table
    tier: medium
    probes:
      - { id: describe, sql: "DESCRIBE TABLE t;" }
      - { id: desc, sql: "DESC TABLE t;" }
      - { id: type_columns, sql: "DESC TABLE t TYPE = COLUMNS;" }
      - { id: type_stage, sql: "DESCRIBE TABLE t TYPE = STAGE;" }
    examples:
      - "DESCRIBE TABLE desc_example;"
      - "DESCRIBE TABLE desc_example TYPE = STAGE;"

  - id: describe_task
    name: DESCRIBE TASK
    doc: https://docs.snowflake.com/en/sql-reference/sql/desc-task
    tier: medium
    probes:
      - { id: describe, sql: "DESCRIBE TASK t;" }
      - { id: desc, sql: "DESC TASK t;" }
    examples:
      - "DESC TASK mytask;"

  - id: describe_transaction
    name: DESCRIBE TRANSACTION
    doc: https://docs.snowflake.com/en/sql-reference/sql/desc-transaction
    tier: medium
    probes:
      - { id: describe, sql: "DESCRIBE TRANSACTION 1651535571261000000;" }
      - { id: desc, sql: "DESC TRANSACTION 1651535571261000000;" }
    examples:
      - "DESC TRANSACTION 1651535571261000000;"

  - id: describe_type
    name: DESCRIBE TYPE
    doc: https://docs.snowflake.com/en/sql-reference/sql/desc-type
    tier: medium
    probes:
      - { id: describe, sql: "DESCRIBE TYPE ty;" }
      - { id: desc, sql: "DESC TYPE ty;" }
    examples:
      - "DESC TYPE age;"

  - id: describe_user
    name: DESCRIBE USER
    doc: https://docs.snowflake.com/en/sql-reference/sql/desc-user
    tier: medium
    probes:
      - { id: describe, sql: "DESCRIBE USER u;" }
      - { id: desc, sql: "DESC USER u;" }
    examples:
      - "DESCRIBE USER my_user;"
