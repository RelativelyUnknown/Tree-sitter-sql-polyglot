      - { id: union_fullselect, sql: "CREATE VIEW v AS SELECT x FROM t UNION ALL SELECT x FROM u;" }
      - { id: with_check_option, sql: "CREATE VIEW v AS SELECT * FROM t WHERE x > 0 WITH CHECK OPTION;" }
      - { id: with_cascaded_check_option, sql: "CREATE VIEW v AS SELECT * FROM t WHERE x > 0 WITH CASCADED CHECK OPTION;" }
      - { id: with_local_check_option, sql: "CREATE VIEW v AS SELECT * FROM t WHERE x > 0 WITH LOCAL CHECK OPTION;" }
      - { id: with_row_movement, sql: "CREATE VIEW v AS SELECT * FROM t WITH ROW MOVEMENT;" }
      - { id: with_no_row_movement, sql: "CREATE VIEW v AS SELECT * FROM t WITH NO ROW MOVEMENT;" }
      - { id: check_option_row_movement, sql: "CREATE VIEW v AS SELECT * FROM t WHERE x > 0 WITH CASCADED CHECK OPTION WITH ROW MOVEMENT;" }
      - { id: of_type_root, sql: "CREATE VIEW v OF emp_type MODE DB2SQL (REF IS oid USER GENERATED) AS SELECT * FROM t;" }
      - { id: of_type_root_with_options, sql: "CREATE VIEW v OF emp_type MODE DB2SQL (REF IS oid USER GENERATED, c WITH OPTIONS READ ONLY) AS SELECT * FROM t;" }
      - { id: of_type_root_scope, sql: "CREATE VIEW v OF emp_type MODE DB2SQL (REF IS oid USER GENERATED, r WITH OPTIONS SCOPE typed_tab) AS SELECT * FROM t;" }
      - { id: of_type_root_no_mode, sql: "CREATE VIEW v OF emp_type (REF IS oid USER GENERATED) AS SELECT * FROM t;" }
      - { id: of_type_subview_under, sql: "CREATE VIEW v OF emp_type MODE DB2SQL UNDER sup INHERIT SELECT PRIVILEGES AS SELECT * FROM t;" }
      - { id: of_type_subview_with_options, sql: "CREATE VIEW v OF emp_type MODE DB2SQL UNDER sup INHERIT SELECT PRIVILEGES (c WITH OPTIONS READ ONLY) AS SELECT * FROM t;" }
      - { id: of_type_subview_extend, sql: "CREATE VIEW v OF emp_type MODE DB2SQL UNDER sup INHERIT SELECT PRIVILEGES (EXTEND c WITH OPTIONS READ ONLY) AS SELECT * FROM t;" }
      - { id: of_type_subview_unchecked, sql: "CREATE VIEW v OF emp_type MODE DB2SQL UNDER sup INHERIT SELECT PRIVILEGES (REF IS oid USER GENERATED UNCHECKED) AS SELECT * FROM t;" }
    examples:
      - "CREATE VIEW MA_PROJ AS SELECT * FROM PROJECT WHERE SUBSTR( PROJNO, 1, 2 ) = 'MA';"
      - "CREATE VIEW MA_PROJ ( PROJNO, PROJNAME, IN_CHARGE ) AS SELECT PROJNO, PROJNAME, RESPEMP FROM PROJECT WHERE SUBSTR( PROJNO, 1, 2 ) = 'MA';"
      - "CREATE VIEW PRJ_LEADER AS SELECT PROJNO, PROJNAME, DEPTNO, RESPEMP, LASTNAME, SALARY+BONUS+COMM AS TOTAL_PAY FROM PROJECT, EMPLOYEE WHERE RESPEMP = EMPNO AND PRSTAFF > 1;"
