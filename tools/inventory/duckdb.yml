  - id: pivot
    name: PIVOT
    doc: https://duckdb.org/docs/stable/sql/statements/pivot
    tier: high
    probes:
      - { id: on_using, sql: "PIVOT t ON year USING sum(population);" }
      - { id: on_only, sql: "PIVOT t ON year;" }
      - { id: pivot_wider, sql: "PIVOT_WIDER t ON year USING sum(population);" }
      - { id: group_by, sql: "PIVOT t ON year USING sum(population) GROUP BY country;" }
      - { id: on_in_filter, sql: "PIVOT t ON year IN (2000, 2010) USING sum(population) GROUP BY country;" }
      - { id: multiple_on, sql: "PIVOT t ON country, name USING sum(population);" }
      - { id: on_expression, sql: "PIVOT t ON country || '_' || name USING sum(population);" }
      - { id: multiple_using_aliases, sql: "PIVOT t ON year USING sum(population) AS total, max(population) AS max GROUP BY country;" }
      - { id: multiple_group_by, sql: "PIVOT t ON year USING sum(population) GROUP BY country, name;" }
      - { id: order_by_limit_offset, sql: "PIVOT t ON year USING sum(population) GROUP BY country ORDER BY country DESC LIMIT 10 OFFSET 1;" }
      - { id: subquery_source, sql: "PIVOT (SELECT * FROM t) ON year USING sum(population);" }
      - { id: table_function_source, sql: "PIVOT read_csv('cities.csv') ON year USING sum(population);" }
      - { id: in_cte, sql: "WITH p AS (PIVOT t ON year USING sum(population) GROUP BY country) SELECT * FROM p;" }
      - { id: in_subquery, sql: "SELECT * FROM (PIVOT t ON year USING sum(population) GROUP BY country) p;" }
      - { id: in_join, sql: "SELECT * FROM (PIVOT t ON year USING sum(population) GROUP BY country) a JOIN (PIVOT t ON name USING sum(population) GROUP BY country) b USING (country);" }
      - { id: standard_pivot, sql: "SELECT * FROM t PIVOT (sum(population) FOR year IN (2000, 2010, 2020) GROUP BY country);" }
      - { id: standard_pivot_multiple_for, sql: "SELECT * FROM t PIVOT (sum(population) AS total, count(population) AS count FOR year IN (2000, 2010) country IN ('NL', 'US'));" }
      - { id: standard_pivot_no_group_by, sql: "SELECT * FROM t PIVOT (sum(population) FOR year IN (2000, 2010));" }
      - { id: standard_pivot_alias, sql: "SELECT * FROM t PIVOT (sum(population) FOR year IN (2000, 2010)) AS p;" }
    examples:
      - "PIVOT cities\nON year\nUSING sum(population);"
      - "PIVOT cities\nON year IN (2000, 2010)\nUSING sum(population)\nGROUP BY country;"
      - "PIVOT cities\nON year\nUSING sum(population) AS total, max(population) AS max\nGROUP BY country;"
      - "SELECT *\nFROM (PIVOT cities ON year USING sum(population) GROUP BY country) year_pivot\nJOIN (PIVOT cities ON name USING sum(population) GROUP BY country) name_pivot\nUSING (country);"
      - "SELECT *\nFROM cities\nPIVOT (\n    sum(population) AS total,\n    count(population) AS count\n    FOR\n        year IN (2000, 2010)\n        country IN ('NL', 'US')\n);"

  - id: unpivot
    name: UNPIVOT
    doc: https://duckdb.org/docs/stable/sql/statements/unpivot
    tier: high
    probes:
      - { id: manual, sql: "UNPIVOT t ON jan, feb, mar INTO NAME month VALUE sales;" }
      - { id: pivot_longer, sql: "PIVOT_LONGER t ON jan, feb, mar INTO NAME month VALUE sales;" }
      - { id: on_only, sql: "UNPIVOT t ON jan, feb, mar;" }
      - { id: columns_expression, sql: "UNPIVOT t ON COLUMNS(* EXCLUDE (empid, dept)) INTO NAME month VALUE sales;" }
      - { id: multiple_value_columns, sql: "UNPIVOT t ON (jan, feb, mar) AS q1, (apr, may, jun) AS q2 INTO NAME quarter VALUE m1, m2, m3;" }
      - { id: subquery_source_expressions, sql: "UNPIVOT (SELECT 42 AS col1, 'woot' AS col2) ON (col1 * 2)::VARCHAR, col2;" }
      - { id: order_by_limit, sql: "UNPIVOT t ON jan, feb INTO NAME month VALUE sales ORDER BY month LIMIT 10;" }
      - { id: in_cte, sql: "WITH u AS (UNPIVOT t ON COLUMNS(* EXCLUDE (empid, dept)) INTO NAME month VALUE sales) SELECT * FROM u;" }
      - { id: in_subquery, sql: "SELECT * FROM (UNPIVOT t ON jan, feb INTO NAME month VALUE sales) u;" }
      - { id: standard, sql: "FROM t UNPIVOT (sales FOR month IN (jan, feb, mar, apr, may, jun));" }
      - { id: standard_select, sql: "SELECT * FROM t UNPIVOT (sales FOR month IN (jan, feb, mar));" }
      - { id: standard_include_nulls, sql: "FROM t UNPIVOT INCLUDE NULLS (sales FOR month IN (jan, feb, mar));" }
      - { id: standard_columns, sql: "FROM t UNPIVOT (sales FOR month IN (columns(* EXCLUDE (empid, dept))));" }
      - { id: standard_multiple_values, sql: "FROM t UNPIVOT ((m1, m2, m3) FOR quarter IN ((jan, feb, mar) AS q1, (apr, may, jun) AS q2));" }
    examples:
      - "UNPIVOT monthly_sales\nON jan, feb, mar, apr, may, jun\nINTO\n    NAME month\n    VALUE sales;"
      - "UNPIVOT monthly_sales\nON COLUMNS(* EXCLUDE (empid, dept))\nINTO\n    NAME month\n    VALUE sales;"
      - "UNPIVOT monthly_sales\n    ON (jan, feb, mar) AS q1, (apr, may, jun) AS q2\n    INTO\n        NAME quarter\n        VALUE month_1_sales, month_2_sales, month_3_sales;"
      - "FROM monthly_sales UNPIVOT (\n    sales\n    FOR month IN (jan, feb, mar, apr, may, jun)\n);"
      - "FROM monthly_sales\nUNPIVOT (\n    (month_1_sales, month_2_sales, month_3_sales)\n    FOR quarter IN (\n        (jan, feb, mar) AS q1,\n        (apr, may, jun) AS q2\n    )\n);"

