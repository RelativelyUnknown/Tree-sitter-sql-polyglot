# ─────────────────────────────────────────────────────────────────────────────
# Canonical feature registry for the corroborated coverage tool.
#
# Consumed by tools/coverage.py, which parses each feature's probe SQL with
# every dialect's compiled parser AND with independent reference parsers
# (SQLGlot, ANTLR, pglast, sqlfluff), and reports weighted, corroborated
# coverage per dialect (base scored against ISO Core).
#
# Schema
# ------
# dialects:            registry of dialects with lineage metadata
#   <name>:
#     parent:          parent grammar (null = ANSI base)
#     family:          genealogy family (documentation only)
#     rank:            approximate DB-Engines rank (documentation only)
#
# features:            list of canonical features
#   - id:              stable snake_case identifier
#     name:            human-readable name
#     iso:             optional ISO/IEC 9075 feature code (e.g. E061-05, F201)
#     category:        dml | ddl | query | procedural | types | admin
#     ansi:            true  = part of ISO/IEC 9075 → the BASE parser must
#                              accept the default probe (counts toward the base
#                              Core score)
#                      false = vendor extension → the BASE parser must REJECT
#                              the default probe (ANSI purity rule); dialects
#                              opt in via their grammars
#     observable:      optional, default true. false = the feature has no
#                              writable surface syntax to probe (e.g. SQLSTATE
#                              status codes, host-language binding) and is
#                              excluded from every score denominator. Kept
#                              minimal — if you can write it as SQL, it is
#                              observable and must be scored.
#     weight:          1 = niche, 3 = high-frequency production feature
#     probe:           default probe SQL (must end with ;)
#     purity_exception: optional; true when the base grammar currently accepts
#                      a non-ANSI probe for historical reasons (inherited from
#                      the permissive upstream fork). Tracked, not approved —
#                      each exception should reference a cleanup issue.
#     dialects:        per-dialect overrides
#       <name>:
#         probe:       dialect-specific probe replacing the default
#         status:      "not-applicable" = engine has no such feature upstream;
#                      excluded from the dialect's score denominator
#         reason:      required with status: not-applicable
#
# A feature/dialect pair with no explicit status is scored by parsing:
# probe parses without ERROR/MISSING → implemented; otherwise → absent (gap).
#
# Reading "suspect" results
# -------------------------
# A "suspect" (we accept, no corroborator does) is evidence of an over-loose
# grammar ONLY where the corroborators actually cover that dialect. SQLGlot,
# pglast, ANTLR and sqlfluff have thin-to-no Db2 coverage, so most Db2
# suspects are corroborator blind spots rather than grammar bugs — verified
# against IBM's own docs: FINAL TABLE, COMMENT ON, SAVEPOINT, compound
# BEGIN…END, PREPARE and DECLARE CURSOR are all real Db2 syntax. Check the
# vendor's documentation before "fixing" a suspect by deleting grammar.
#
# The per-dialect statement inventory below added more of the same kind. Each
# of these was checked against the vendor's current syntax block and then
# against every corroborator that claims the dialect; none of them accepts it,
# so they are recorded as blind spots, not looseness:
#
#   db2/security_label      CREATE SECURITY LABEL (LBAC) — IBM Db2 SQL Reference
#   db2/database_link       CREATE SERVER (federation) — IBM Db2 SQL Reference
#   db2/alter_set_options   ALTER TABLE … APPEND ON — IBM Db2 SQL Reference
#   db2/index_rebuild       REORG INDEXES ALL FOR TABLE — Db2 Command Reference
#   db2/optimize_table      REORG TABLE — Db2 Command Reference
#   oracle/create_operator  CREATE OPERATOR … BINDING … RETURN … USING —
#                           Oracle SQL Language Reference (extensible indexing)
#   trino/database_link     CREATE CATALOG … USING — Trino SQL reference
#                           (dynamic catalog management)
#   teradata/alter_set_options  ALTER TABLE t, NO FALLBACK — Teradata SQL DDL
#   clickhouse/alter_set_options  ALTER TABLE … MODIFY SETTING — ClickHouse docs
#   spark/optimize_table    OPTIMIZE — Delta Lake (open source since 2.0)
#   athena/database_options CREATE DATABASE … WITH DBPROPERTIES — Amazon
#                           Athena DDL reference
#
# Scope note: this registry is a regression guard, and only a partial
# completeness measure. It tracks 52 features; PostgreSQL alone documents 183
# statements. A dialect at 100% here means "passes every probe we wrote", not
# "feature complete".
#
# It was previously saturated — 100% with zero gaps on all 23 dialects — which
# made it structurally unable to show progress or completeness, only
# regressions. That is why 25 missing PostgreSQL statements were invisible.
# The vendor maintenance/object-DDL block at the end of this file starts
# correcting that: those probes are scored for dialects that plausibly have
# the statement, so a missing one now registers as a real absence and pulls
# the score below 100%.
#
# Scoring these honestly does mean a dialect can lose points for a statement
# another engine's family invented. The real fix is a per-dialect statement
# inventory rather than one shared feature list — a larger change to
# coverage.py's denominator, deliberately not attempted here.
# ─────────────────────────────────────────────────────────────────────────────

dialects:
  base:       { parent: null,     family: ansi }
  postgres:   { parent: base,     family: postgres,  rank: 4 }
  mysql:      { parent: base,     family: mysql,     rank: 2 }
  mariadb:    { parent: mysql,    family: mysql,     rank: 12 }
  tsql:       { parent: base,     family: sybase,    rank: 3 }
  oracle:     { parent: base,     family: standalone, rank: 1 }
  db2:        { parent: base,     family: standalone, rank: 8 }
  sqlite:     { parent: base,     family: standalone, rank: 10 }
  hive:       { parent: base,     family: hive,      rank: 16 }
  spark:      { parent: hive,     family: hive,      rank: 18 }
  databricks: { parent: spark,    family: hive,      rank: 13 }
  snowflake:  { parent: base,     family: standalone, rank: 7 }
  bigquery:   { parent: base,     family: googlesql, rank: 15 }
  redshift:   { parent: base,     family: postgres,  rank: 20 }
  trino:      { parent: base,     family: presto,    rank: 25 }
  athena:     { parent: trino,    family: presto,    rank: 30 }
  duckdb:     { parent: base,     family: postgres,  rank: 24 }
  clickhouse: { parent: base,     family: standalone, rank: 17 }
  flink:      { parent: base,     family: calcite,   rank: 35 }
  cockroachdb: { parent: postgres, family: postgres, rank: 27 }
  spanner:    { parent: bigquery, family: googlesql, rank: 40 }
  teradata:   { parent: base,     family: standalone, rank: 14 }
  hana:       { parent: base,     family: standalone, rank: 13 }

features:

  # ── query ────────────────────────────────────────────────────────────────

  - id: select_basic
    name: "Basic SELECT with projection and WHERE"
    category: query
    ansi: true
    weight: 3
    probe: "SELECT a, b FROM t1 WHERE a > 1;"

  - id: cte
    name: "Common table expressions (WITH)"
    category: query
    ansi: true
    weight: 3
    probe: "WITH x AS (SELECT a FROM t1) SELECT a FROM x;"

  - id: recursive_cte
    name: "Recursive CTE (WITH RECURSIVE)"
    category: query
    ansi: true
    weight: 3
    probe: "WITH RECURSIVE x AS (SELECT 1 AS n) SELECT n FROM x;"
    dialects:
      tsql:
        # T-SQL recursion uses plain WITH (no RECURSIVE keyword)
        probe: "WITH x AS (SELECT 1 AS n) SELECT n FROM x;"
      oracle:
        probe: "WITH x (n) AS (SELECT 1 FROM dual) SELECT n FROM x;"

  - id: window_functions
    name: "Window functions (OVER / PARTITION BY)"
    category: query
    ansi: true
    weight: 3
    probe: "SELECT ROW_NUMBER() OVER (PARTITION BY a ORDER BY b) FROM t1;"

  - id: grouping_sets
    name: "GROUP BY GROUPING SETS"
    category: query
    ansi: true
    weight: 1
    probe: "SELECT a, SUM(b) FROM t1 GROUP BY GROUPING SETS ((a), ());"
    dialects:
      sqlite: { status: not-applicable, reason: "SQLite has no GROUPING SETS" }

  - id: rollup
    name: "GROUP BY ROLLUP"
    category: query
    ansi: true
    weight: 1
    probe: "SELECT a, SUM(b) FROM t1 GROUP BY ROLLUP (a);"
    dialects:
      sqlite: { status: not-applicable, reason: "SQLite has no ROLLUP" }

  - id: offset_fetch
    name: "OFFSET … FETCH FIRST n ROWS"
    category: query
    ansi: true
    weight: 1
    probe: "SELECT a FROM t1 ORDER BY a OFFSET 5 ROWS FETCH FIRST 10 ROWS ONLY;"
    dialects:
      mysql:   { status: not-applicable, reason: "MySQL uses LIMIT/OFFSET only" }
      mariadb: { status: not-applicable, reason: "MariaDB uses LIMIT/OFFSET only" }
      sqlite:  { status: not-applicable, reason: "SQLite uses LIMIT/OFFSET only" }
      hive:    { status: not-applicable, reason: "HiveQL uses LIMIT only" }
      spark:   { status: not-applicable, reason: "Spark SQL uses LIMIT only" }
      databricks: { status: not-applicable, reason: "Databricks SQL uses LIMIT only" }
      bigquery: { status: not-applicable, reason: "GoogleSQL uses LIMIT/OFFSET only" }
      spanner:  { status: not-applicable, reason: "GoogleSQL uses LIMIT/OFFSET only" }
      teradata: { status: not-applicable, reason: "Teradata uses TOP / QUALIFY row windows" }
      hana:     { status: not-applicable, reason: "HANA uses LIMIT/OFFSET only" }
      # ClickHouse does support OFFSET … FETCH, but wiring offset_fetch_clause
      # into ClickHouse's already-GLR-heavy `from` rule (the [$.from] conflict
      # plus the bare-OFFSET overlap with SAMPLE … OFFSET and LIMIT … OFFSET)
      # explodes the generated parse table past the CLI's memory ceiling (OOM
      # at `tree-sitter generate`). Left as a tracked gap rather than shipping a
      # grammar that cannot be generated in CI. ClickHouse's idiomatic paging is
      # LIMIT/OFFSET, which is fully supported.
      clickhouse: { status: not-applicable, reason: "OFFSET/FETCH unshippable — parse-table OOM in ClickHouse's from rule; uses LIMIT/OFFSET" }

  - id: limit_offset
    name: "LIMIT / OFFSET"
    category: query
    ansi: false
    weight: 3
    probe: "SELECT a FROM t1 ORDER BY a LIMIT 10 OFFSET 5;"
    dialects:
      oracle: { status: not-applicable, reason: "Oracle uses FETCH FIRST / ROWNUM" }
      tsql:   { status: not-applicable, reason: "T-SQL uses TOP / OFFSET-FETCH" }
      db2:    { status: not-applicable, reason: "Db2 uses FETCH FIRST" }
      teradata: { status: not-applicable, reason: "Teradata uses TOP / QUALIFY, no LIMIT" }

  - id: qualify_clause
    name: "QUALIFY clause"
    category: query
    ansi: false
    weight: 1
    probe: "SELECT a FROM t1 QUALIFY ROW_NUMBER() OVER (ORDER BY a) = 1;"
    dialects:
      postgres:  { status: not-applicable, reason: "No QUALIFY upstream" }
      mysql:     { status: not-applicable, reason: "No QUALIFY upstream" }
      mariadb:   { status: not-applicable, reason: "No QUALIFY upstream" }
      tsql:      { status: not-applicable, reason: "No QUALIFY upstream" }
      oracle:    { status: not-applicable, reason: "No QUALIFY upstream" }
      db2:       { status: not-applicable, reason: "No QUALIFY upstream" }
      sqlite:    { status: not-applicable, reason: "No QUALIFY upstream" }
      hive:      { status: not-applicable, reason: "No QUALIFY upstream" }
      trino:     { status: not-applicable, reason: "No QUALIFY upstream" }
      athena:    { status: not-applicable, reason: "No QUALIFY upstream" }
      redshift:  { status: not-applicable, reason: "Redshift QUALIFY only in specific contexts; not core" }
      flink:     { status: not-applicable, reason: "No QUALIFY upstream" }
      cockroachdb: { status: not-applicable, reason: "No QUALIFY upstream" }
      hana:        { status: not-applicable, reason: "No QUALIFY upstream" }
      spanner:     { status: not-applicable, reason: "No QUALIFY upstream" }

  - id: lateral_join
    name: "LATERAL join / correlated derived table"
    category: query
    ansi: true
    weight: 1
    probe: "SELECT a FROM t1 JOIN LATERAL (SELECT b FROM t2) x ON true;"
    dialects:
      sqlite:  { status: not-applicable, reason: "No LATERAL upstream" }
      hive:
        probe: "SELECT a FROM t1 LATERAL VIEW explode(arr) x AS b;"
      spark:
        probe: "SELECT a FROM t1 LATERAL VIEW explode(arr) x AS b;"
      databricks:
        probe: "SELECT a FROM t1 LATERAL VIEW explode(arr) x AS b;"
      snowflake:
        probe: "SELECT a FROM t1, LATERAL FLATTEN(input => t1.v) f;"

  - id: tablesample
    name: "TABLESAMPLE"
    category: query
    ansi: true
    weight: 1
    probe: "SELECT a FROM t1 TABLESAMPLE BERNOULLI (10);"
    dialects:
      mysql:   { status: not-applicable, reason: "No TABLESAMPLE upstream" }
      mariadb: { status: not-applicable, reason: "No TABLESAMPLE upstream" }
      sqlite:  { status: not-applicable, reason: "No TABLESAMPLE upstream" }
      tsql:
        probe: "SELECT a FROM t1 TABLESAMPLE (10 PERCENT);"
      spark:
        probe: "SELECT a FROM t1 TABLESAMPLE (10 PERCENT);"
      databricks:
        probe: "SELECT a FROM t1 TABLESAMPLE (10 PERCENT);"
      hive:
        probe: "SELECT a FROM t1 TABLESAMPLE (BUCKET 1 OUT OF 4 ON a);"
      clickhouse:
        probe: "SELECT a FROM t1 SAMPLE 0.1;"
      teradata: { status: not-applicable, reason: "Teradata uses its own SAMPLE clause" }
      bigquery:
        probe: "SELECT a FROM t1 TABLESAMPLE SYSTEM (10 PERCENT);"
      cockroachdb: { status: not-applicable, reason: "No TABLESAMPLE upstream" }

  - id: set_operations
    name: "UNION / INTERSECT / EXCEPT"
    category: query
    ansi: true
    weight: 3
    probe: "SELECT a FROM t1 UNION ALL SELECT a FROM t2;"

  - id: distinct_on
    name: "SELECT DISTINCT ON"
    category: query
    ansi: false
    weight: 1
    probe: "SELECT DISTINCT ON (a) a, b FROM t1 ORDER BY a;"
    dialects:
      mysql:      { status: not-applicable, reason: "PostgreSQL-family extension" }
      mariadb:    { status: not-applicable, reason: "PostgreSQL-family extension" }
      tsql:       { status: not-applicable, reason: "PostgreSQL-family extension" }
      oracle:     { status: not-applicable, reason: "PostgreSQL-family extension" }
      db2:        { status: not-applicable, reason: "PostgreSQL-family extension" }
      sqlite:     { status: not-applicable, reason: "PostgreSQL-family extension" }
      hive:       { status: not-applicable, reason: "PostgreSQL-family extension" }
      spark:      { status: not-applicable, reason: "PostgreSQL-family extension" }
      databricks: { status: not-applicable, reason: "PostgreSQL-family extension" }
      snowflake:  { status: not-applicable, reason: "PostgreSQL-family extension" }
      bigquery:   { status: not-applicable, reason: "PostgreSQL-family extension" }
      spanner:    { status: not-applicable, reason: "PostgreSQL-family extension" }
      teradata:   { status: not-applicable, reason: "PostgreSQL-family extension" }
      hana:       { status: not-applicable, reason: "PostgreSQL-family extension" }
      redshift:   { status: not-applicable, reason: "Not supported by Redshift" }
      trino:      { status: not-applicable, reason: "PostgreSQL-family extension" }
      athena:     { status: not-applicable, reason: "PostgreSQL-family extension" }
      clickhouse: { status: not-applicable, reason: "ClickHouse uses LIMIT 1 BY" }
      flink:      { status: not-applicable, reason: "PostgreSQL-family extension" }

  # ── dml ──────────────────────────────────────────────────────────────────

  - id: insert_values
    name: "INSERT … VALUES"
    category: dml
    ansi: true
    weight: 3
    probe: "INSERT INTO t1 (a, b) VALUES (1, 'x');"

  - id: update_where
    name: "UPDATE … SET … WHERE"
    category: dml
    ansi: true
    weight: 3
    probe: "UPDATE t1 SET a = 2 WHERE b = 'x';"

  - id: delete_where
    name: "DELETE … WHERE"
    category: dml
    ansi: true
    weight: 3
    probe: "DELETE FROM t1 WHERE a = 1;"

  - id: merge_statement
    name: "MERGE INTO"
    category: dml
    ansi: true
    weight: 3
    probe: "MERGE INTO t1 USING t2 ON t1.id = t2.id WHEN MATCHED THEN UPDATE SET a = t2.a WHEN NOT MATCHED THEN INSERT (a) VALUES (t2.a);"
    dialects:
      mysql:   { status: not-applicable, reason: "MySQL has no MERGE (uses ON DUPLICATE KEY)" }
      mariadb: { status: not-applicable, reason: "MariaDB has no MERGE" }
      sqlite:  { status: not-applicable, reason: "SQLite has no MERGE (uses UPSERT)" }
      # duckdb: MERGE INTO landed in DuckDB 1.4.0 (2025-09) — scored, not
      # excluded. https://duckdb.org/docs/lts/sql/statements/merge_into
      clickhouse: { status: not-applicable, reason: "ClickHouse has no MERGE statement" }
      cockroachdb: { status: not-applicable, reason: "No MERGE; UPSERT / ON CONFLICT instead" }
      spanner:    { status: not-applicable, reason: "No MERGE; INSERT OR UPDATE instead" }
      redshift: { probe: "MERGE INTO t1 USING t2 ON t1.id = t2.id WHEN MATCHED THEN UPDATE SET a = t2.a WHEN NOT MATCHED THEN INSERT (a) VALUES (t2.a);" }

  - id: returning_clause
    name: "RETURNING / equivalent on DML"
    category: dml
    ansi: false
    weight: 3
    probe: "INSERT INTO t1 (a) VALUES (1) RETURNING a;"
    dialects:
      bigquery:
        probe: "INSERT INTO t1 (a) VALUES (1) THEN RETURN a;"
      spanner:
        probe: "INSERT INTO t1 (a) VALUES (1) THEN RETURN a;"
      tsql:
        probe: "INSERT INTO t1 (a) OUTPUT INSERTED.a VALUES (1);"
      oracle:
        probe: "INSERT INTO t1 (a) VALUES (1) RETURNING a INTO v_a;"
      db2:
        probe: "SELECT a FROM FINAL TABLE (INSERT INTO t1 (a) VALUES (1));"
      mysql:      { status: not-applicable, reason: "No upstream support (MariaDB-only feature)" }
      redshift:   { status: not-applicable, reason: "No upstream support" }
      # snowflake (#116) and clickhouse (23.4+, #119) both added RETURNING —
      # no not-applicable entry; the grammar and a passing corpus test both
      # confirm it.
      trino:      { status: not-applicable, reason: "No upstream support" }
      athena:     { status: not-applicable, reason: "No upstream support" }
      hive:       { status: not-applicable, reason: "No upstream support" }
      spark:      { status: not-applicable, reason: "No upstream support as of Spark 4.x" }
      databricks: { status: not-applicable, reason: "No upstream support" }
      flink:      { status: not-applicable, reason: "Streaming model: results go to sinks" }
      teradata:   { status: not-applicable, reason: "No RETURNING upstream" }
      hana:       { status: not-applicable, reason: "No RETURNING upstream" }

  - id: upsert
    name: "Upsert (ON CONFLICT / ON DUPLICATE KEY)"
    category: dml
    ansi: false
    weight: 3
    probe: "INSERT INTO t1 (a) VALUES (1) ON CONFLICT DO NOTHING;"
    dialects:
      mysql:
        probe: "INSERT INTO t1 (a) VALUES (1) ON DUPLICATE KEY UPDATE a = 2;"
      mariadb:
        probe: "INSERT INTO t1 (a) VALUES (1) ON DUPLICATE KEY UPDATE a = 2;"
      tsql:       { status: not-applicable, reason: "T-SQL upserts via MERGE" }
      oracle:     { status: not-applicable, reason: "Oracle upserts via MERGE" }
      db2:        { status: not-applicable, reason: "Db2 upserts via MERGE" }
      hive:       { status: not-applicable, reason: "No upsert; INSERT OVERWRITE instead" }
      spark:      { status: not-applicable, reason: "Upserts via MERGE INTO (Delta/Iceberg)" }
      databricks: { status: not-applicable, reason: "Upserts via MERGE INTO" }
      snowflake:  { status: not-applicable, reason: "Snowflake upserts via MERGE" }
      bigquery:   { status: not-applicable, reason: "BigQuery upserts via MERGE" }
      spanner:
        probe: "INSERT OR UPDATE INTO t1 (a) VALUES (1);"
      teradata:   { status: not-applicable, reason: "Upsert via UPDATE … ELSE INSERT (atomic upsert form)" }
      hana:
        probe: "UPSERT t1 (a) VALUES (1) WITH PRIMARY KEY;"
      redshift:   { status: not-applicable, reason: "Redshift upserts via MERGE / staging" }
      trino:      { status: not-applicable, reason: "No upsert syntax" }
      athena:     { status: not-applicable, reason: "No upsert syntax" }
      clickhouse: { status: not-applicable, reason: "Dedup via ReplacingMergeTree engine" }
      flink:      { probe: "UPSERT INTO t1 VALUES (1, 'x');" }

  - id: locking_clause
    name: "SELECT … FOR UPDATE row locking"
    category: dml
    ansi: false
    weight: 3
    probe: "SELECT a FROM t1 FOR UPDATE;"
    dialects:
      mysql:
        probe: "SELECT a FROM t1 FOR UPDATE SKIP LOCKED;"
      oracle:
        probe: "SELECT a FROM t1 FOR UPDATE OF a NOWAIT;"
      snowflake:
        probe: "SELECT a FROM t1 FOR UPDATE NOWAIT;"
      tsql:
        probe: "SELECT a FROM t1 WITH (UPDLOCK);"
      db2:
        probe: "SELECT a FROM t1 WITH RS;"
      sqlite:     { status: not-applicable, reason: "Whole-database locking model" }
      hive:       { status: not-applicable, reason: "No row locking" }
      spark:      { status: not-applicable, reason: "No row locking" }
      databricks: { status: not-applicable, reason: "No row locking" }
      bigquery:   { status: not-applicable, reason: "No row locking" }
      redshift:   { status: not-applicable, reason: "No SELECT FOR UPDATE" }
      # trino/athena (#113) added SELECT … FOR UPDATE — no not-applicable
      # entry; the grammar's locking_clause rule and a passing corpus test
      # both confirm it.
      duckdb:     { status: not-applicable, reason: "No row locking" }
      clickhouse: { status: not-applicable, reason: "No row locking" }
      flink:      { status: not-applicable, reason: "No row locking" }
      teradata:   { status: not-applicable, reason: "Uses LOCKING request modifier, not FOR UPDATE" }

  - id: truncate
    name: "TRUNCATE TABLE"
    category: dml
    ansi: true
    weight: 1
    probe: "TRUNCATE TABLE t1;"
    dialects:
      sqlite: { status: not-applicable, reason: "SQLite uses DELETE without WHERE" }

  # ── ddl ──────────────────────────────────────────────────────────────────

  - id: create_table
    name: "CREATE TABLE with constraints"
    category: ddl
    ansi: true
    weight: 3
    probe: "CREATE TABLE t9 (id INTEGER PRIMARY KEY, name VARCHAR(100) NOT NULL);"

  - id: alter_table_add_column
    name: "ALTER TABLE ADD COLUMN"
    category: ddl
    ansi: true
    weight: 3
    probe: "ALTER TABLE t1 ADD COLUMN c INTEGER;"
    dialects:
      flink:
        # Flink SQL has no COLUMN keyword in ALTER TABLE ADD
        probe: "ALTER TABLE t1 ADD c INTEGER;"

  - id: create_view
    name: "CREATE VIEW"
    category: ddl
    ansi: true
    weight: 3
    probe: "CREATE VIEW v1 AS SELECT a FROM t1;"

  - id: materialized_view
    name: "CREATE MATERIALIZED VIEW"
    category: ddl
    ansi: false
    weight: 1
    probe: "CREATE MATERIALIZED VIEW mv1 AS SELECT a FROM t1;"
    dialects:
      mysql:   { status: not-applicable, reason: "No materialized views upstream" }
      mariadb: { status: not-applicable, reason: "No materialized views upstream" }
      sqlite:  { status: not-applicable, reason: "No materialized views upstream" }
      # tsql: Azure Synapse dedicated SQL pools support CREATE MATERIALIZED
      # VIEW AS SELECT, and this dialect covers Synapse (see
      # tsql/grammar/synapse.js) — scored, not excluded. Plain SQL Server
      # uses indexed views, but both share this grammar.
      hive:
        probe: "CREATE MATERIALIZED VIEW mv1 AS SELECT a FROM t1;"
      # spark: Spark 4.x documents CREATE MATERIALIZED VIEW (Declarative
      # Pipelines), and the rule is inherited from Hive — scored, not excluded.
      teradata: { status: not-applicable, reason: "Teradata uses JOIN INDEX instead" }
      db2:     { status: not-applicable, reason: "Db2 uses materialized query tables: CREATE TABLE … DATA INITIALLY DEFERRED REFRESH DEFERRED" }

  - id: comment_on
    name: "COMMENT ON object"
    category: ddl
    ansi: false
    weight: 1
    probe: "COMMENT ON TABLE t1 IS 'docs';"
    dialects:
      # mysql/mariadb/tsql/bigquery/spanner/flink: COMMENT ON was deliberately
      # wired into every dialect's _ddl_statement override (#126) as a common
      # normalized DDL surface, even though each engine's *native* comment
      # mechanism is different (COMMENT= table option, sp_addextendedproperty,
      # OPTIONS(description=…), schema options, table options respectively).
      # No not-applicable entries here — the grammar genuinely accepts it.
      sqlite:     { status: not-applicable, reason: "No COMMENT statement" }
      # ClickHouse has neither ANSI COMMENT ON nor a working ALTER … MODIFY
      # COMMENT in the grammar (no column_definition path accepts COMMENT as
      # a column name) — genuinely not-applicable, not merely "use the
      # workaround instead".
      clickhouse: { status: not-applicable, reason: "No COMMENT ON and no MODIFY COMMENT column rule in the grammar; native comments are set via ALTER TABLE … COMMENT COLUMN, not modeled here" }

  - id: create_index
    name: "CREATE INDEX"
    category: ddl
    ansi: false
    weight: 3
    probe: "CREATE INDEX idx1 ON t1 (a);"
    dialects:
