dialect: db2
engine: IBM Db2 for Linux, UNIX and Windows
version: "11.5"
source: https://www.ibm.com/docs/en/db2/11.5.x?topic=reference-statements

statements:
  - id: commit
    name: COMMIT
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-commit
    tier: high
    probes:
      - id: commit
        sql: "COMMIT;"
      - id: commit_work
        sql: "COMMIT WORK;"

  - id: compound_sql_inlined
    name: Compound SQL (inlined)
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-compound-sql-inlined
    tier: high
    probes:
      - id: begin_atomic_single
        sql: "BEGIN ATOMIC INSERT INTO t VALUES (1); END;"
      - id: begin_atomic_multiple
        sql: "BEGIN ATOMIC INSERT INTO t VALUES (1); UPDATE t SET c = 2 WHERE c = 1; DELETE FROM t WHERE c = 2; END;"
      - id: label_begin_and_end
        sql: "lbl: BEGIN ATOMIC INSERT INTO t VALUES (1); END lbl;"
      - id: label_begin_only
        sql: "lbl: BEGIN ATOMIC INSERT INTO t VALUES (1); END;"
      - id: declare_variable
        sql: "BEGIN ATOMIC DECLARE v INTEGER; SET v = 1; END;"
      - id: declare_variable_default_null
        sql: "BEGIN ATOMIC DECLARE v INTEGER DEFAULT NULL; SET v = 1; END;"
      - id: declare_variable_default_constant
        sql: "BEGIN ATOMIC DECLARE v INTEGER DEFAULT 5; SET v = v + 1; END;"
      - id: declare_variable_list
        sql: "BEGIN ATOMIC DECLARE a, b VARCHAR(10) DEFAULT 'x'; SET a = b; END;"
      - id: declare_condition
        sql: "BEGIN ATOMIC DECLARE cnd CONDITION FOR SQLSTATE '70001'; SIGNAL cnd; END;"
      - id: declare_condition_value
        sql: "BEGIN ATOMIC DECLARE cnd CONDITION FOR SQLSTATE VALUE '70001'; SIGNAL cnd; END;"
      - id: statement_call
        sql: "BEGIN ATOMIC CALL p(1); END;"
      - id: statement_for
        sql: "BEGIN ATOMIC FOR r AS SELECT c FROM t DO INSERT INTO u VALUES (r.c); END FOR; END;"
      - id: statement_with_fullselect
        sql: "BEGIN ATOMIC WITH x(a) AS (SELECT c FROM t) SELECT a FROM x; END;"
      - id: statement_fullselect
        sql: "BEGIN ATOMIC VALUES (1); END;"
      - id: statement_get_diagnostics
        sql: "BEGIN ATOMIC DECLARE n INTEGER; INSERT INTO t VALUES (1); GET DIAGNOSTICS n = ROW_COUNT; END;"
      - id: statement_if
        sql: "BEGIN ATOMIC DECLARE v INTEGER DEFAULT 0; IF v = 0 THEN SET v = 1; ELSEIF v = 1 THEN SET v = 2; ELSE SET v = 3; END IF; END;"
      - id: statement_iterate
        sql: "BEGIN ATOMIC lp: FOR r AS SELECT c FROM t DO IF r.c = 1 THEN ITERATE lp; END IF; END FOR lp; END;"
      - id: statement_leave
        sql: "lbl: BEGIN ATOMIC INSERT INTO t VALUES (1); LEAVE lbl; END lbl;"
      - id: statement_merge
        sql: "BEGIN ATOMIC MERGE INTO t USING s ON t.c = s.c WHEN MATCHED THEN UPDATE SET d = s.d; END;"
      - id: statement_return
        sql: "BEGIN ATOMIC RETURN 1; END;"
      - id: statement_searched_delete
        sql: "BEGIN ATOMIC DELETE FROM t WHERE c = 1; END;"
      - id: statement_searched_update
        sql: "BEGIN ATOMIC UPDATE t SET c = 2 WHERE c = 1; END;"
      - id: statement_set_variable
        sql: "BEGIN ATOMIC DECLARE v INTEGER; SET v = (SELECT MAX(c) FROM t); END;"
      - id: statement_signal
        sql: "BEGIN ATOMIC SIGNAL SQLSTATE '75001' SET MESSAGE_TEXT = 'bad'; END;"
      - id: statement_while
        sql: "BEGIN ATOMIC DECLARE v INTEGER DEFAULT 0; WHILE v < 3 DO SET v = v + 1; END WHILE; END;"
    examples:
      - |-
        BEGIN ATOMIC
          FOR ROW AS
            SELECT PK, C1, DISCRETIZE(C1) AS D FROM SOURCE
          DO
            IF ROW.D IS NULL THEN
              INSERT INTO EXCEPT VALUES (ROW.PK, ROW.C1);
            ELSE
              INSERT INTO TARGET VALUES (ROW.PK, ROW.D);
            END IF;
          END FOR;
        END;
