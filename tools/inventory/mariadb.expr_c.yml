dialect: mariadb
engine: MariaDB Server
version: "11.x (current)"
source: https://mariadb.com/docs/server/reference/sql-statements

statements: []

expressions:
  - id: c_aggregate_basic
    name: Aggregate functions (COUNT, SUM, AVG, MIN, MAX, DISTINCT)
    doc: https://mariadb.com/docs/server/reference/sql-functions/aggregate-functions/count
    tier: high
    probes:
      - { id: count_star, sql: "SELECT COUNT(*) FROM t;" }
      - { id: count_expr, sql: "SELECT COUNT(c) FROM t;" }
      - { id: count_distinct, sql: "SELECT COUNT(DISTINCT c) FROM t;" }
      - { id: count_distinct_multi, sql: "SELECT COUNT(DISTINCT c1, c2) FROM t;" }
      - { id: count_distinct_parenthesized, sql: "SELECT COUNT(DISTINCT (c)) FROM t;" }
      - { id: sum_expr, sql: "SELECT SUM(c) FROM t;" }
      - { id: sum_distinct, sql: "SELECT SUM(DISTINCT c) FROM t;" }
      - { id: avg_distinct, sql: "SELECT AVG(DISTINCT c) FROM t;" }
      - { id: min_max, sql: "SELECT MIN(c), MAX(c) FROM t;" }
      - { id: min_max_distinct, sql: "SELECT MIN(DISTINCT c), MAX(DISTINCT c) FROM t;" }
      - { id: bit_aggregates, sql: "SELECT BIT_AND(c), BIT_OR(c), BIT_XOR(c) FROM t;" }
      - { id: std_family, sql: "SELECT STD(c), STDDEV(c), STDDEV_POP(c), STDDEV_SAMP(c) FROM t;" }
      - { id: variance_family, sql: "SELECT VAR_POP(c), VAR_SAMP(c), VARIANCE(c) FROM t;" }
      - { id: group_by_having, sql: "SELECT a, COUNT(*) FROM t GROUP BY a HAVING COUNT(*) > 1;" }
    examples:
      - "SELECT COUNT(DISTINCT (name)) FROM student;"

  - id: c_group_concat
    name: GROUP_CONCAT
    doc: https://mariadb.com/docs/server/reference/sql-functions/aggregate-functions/group_concat
    tier: high
    probes:
      - { id: basic, sql: "SELECT GROUP_CONCAT(c) FROM t;" }
      - { id: distinct, sql: "SELECT GROUP_CONCAT(DISTINCT c) FROM t;" }
      - { id: multiple_exprs, sql: "SELECT GROUP_CONCAT(a, b) FROM t;" }
      - { id: order_by, sql: "SELECT GROUP_CONCAT(c ORDER BY c) FROM t;" }
      - { id: order_by_desc, sql: "SELECT GROUP_CONCAT(c ORDER BY d DESC) FROM t;" }
      - { id: order_by_multi, sql: "SELECT GROUP_CONCAT(c ORDER BY d DESC, e ASC) FROM t;" }
      - { id: order_by_position, sql: "SELECT GROUP_CONCAT(c ORDER BY 1) FROM t;" }
      - { id: separator, sql: "SELECT GROUP_CONCAT(c SEPARATOR ';') FROM t;" }
      - { id: empty_separator, sql: "SELECT GROUP_CONCAT(c SEPARATOR '') FROM t;" }
      - { id: order_by_separator, sql: "SELECT GROUP_CONCAT(c ORDER BY c SEPARATOR ', ') FROM t;" }
      - { id: distinct_order_by_separator, sql: "SELECT GROUP_CONCAT(DISTINCT c ORDER BY c SEPARATOR ', ') FROM t;" }
      - { id: limit, sql: "SELECT GROUP_CONCAT(c ORDER BY c LIMIT 1) FROM t;" }
      - { id: limit_offset_comma, sql: "SELECT GROUP_CONCAT(c ORDER BY c LIMIT 1, 2) FROM t;" }
      - { id: limit_offset_keyword, sql: "SELECT GROUP_CONCAT(c ORDER BY c LIMIT 2 OFFSET 1) FROM t;" }
      - { id: separator_limit, sql: "SELECT GROUP_CONCAT(c ORDER BY c SEPARATOR ',' LIMIT 3) FROM t;" }
      - { id: nested_in_function, sql: "SELECT SUBSTRING_INDEX(GROUP_CONCAT(CONCAT_WS(':', dd, cc) ORDER BY cc DESC), ',', 1) FROM d;" }
    examples:
      - |-
        SELECT GROUP_CONCAT(DISTINCT User ORDER BY User SEPARATOR '\n')
           FROM mysql.user;
      - |-
        SELECT User, GROUP_CONCAT(Host ORDER BY Host SEPARATOR ', ') 
           FROM mysql.user GROUP BY User ORDER BY User;
      - |-
        SELECT GROUP_CONCAT(CONCAT_WS(":",dd,cc) ORDER BY cc DESC LIMIT 1) FROM d;

  - id: c_json_aggregates
    name: JSON_ARRAYAGG and JSON_OBJECTAGG
    doc: https://mariadb.com/docs/server/reference/sql-functions/aggregate-functions/json_arrayagg
    tier: medium
    probes:
      - { id: arrayagg, sql: "SELECT JSON_ARRAYAGG(a) FROM t;" }
      - { id: arrayagg_group_by, sql: "SELECT JSON_ARRAYAGG(a) FROM t GROUP BY b;" }
      - { id: objectagg, sql: "SELECT JSON_OBJECTAGG(k, v) FROM t;" }
      - { id: objectagg_group_by, sql: "SELECT JSON_OBJECTAGG(k, v) FROM t GROUP BY g;" }
    examples:
      - "SELECT JSON_ARRAYAGG(a), JSON_ARRAYAGG(b) FROM t1;"
      - "SELECT JSON_ARRAYAGG(a), JSON_ARRAYAGG(b) FROM t1 GROUP BY b;"

  - id: c_aggregate_over
    name: Aggregate functions as window functions
    doc: https://mariadb.com/docs/server/reference/sql-functions/special-functions/window-functions/window-functions-overview
    tier: high
    probes:
      - { id: count_star_over_order, sql: "SELECT COUNT(*) OVER (ORDER BY c) FROM t;" }
      - { id: count_over_partition, sql: "SELECT COUNT(c) OVER (PARTITION BY d) FROM t;" }
      - { id: sum_over_empty, sql: "SELECT SUM(c) OVER () FROM t;" }
      - { id: avg_over_partition, sql: "SELECT AVG(c) OVER (PARTITION BY d) AS avg_by_d FROM t;" }
      - { id: min_max_over, sql: "SELECT MIN(c) OVER (PARTITION BY d), MAX(c) OVER (PARTITION BY d) FROM t;" }
      - { id: bit_and_over, sql: "SELECT BIT_AND(c) OVER (PARTITION BY d) FROM t;" }
      - { id: bit_or_over, sql: "SELECT BIT_OR(c) OVER (ORDER BY d) FROM t;" }
      - { id: bit_xor_over, sql: "SELECT BIT_XOR(c) OVER (PARTITION BY d ORDER BY e) FROM t;" }
      - { id: std_stddev_over, sql: "SELECT STD(c) OVER (PARTITION BY d), STDDEV(c) OVER (PARTITION BY d), STDDEV_POP(c) OVER (PARTITION BY d), STDDEV_SAMP(c) OVER (PARTITION BY d) FROM t;" }
      - { id: variance_over, sql: "SELECT VAR_POP(c) OVER (PARTITION BY d), VAR_SAMP(c) OVER (PARTITION BY d), VARIANCE(c) OVER (PARTITION BY d) FROM t;" }
    examples:
      - "SELECT COUNT(*) OVER (ORDER BY column) FROM table;"

  - id: c_window_over
    name: Window specification (OVER, PARTITION BY, ORDER BY)
    doc: https://mariadb.com/docs/server/reference/sql-functions/special-functions/window-functions/window-functions-overview
    tier: high
    probes:
      - { id: over_empty, sql: "SELECT SUM(score) OVER () AS total_score FROM t;" }
      - { id: over_partition, sql: "SELECT AVG(score) OVER (PARTITION BY test) AS avg_by_test FROM t;" }
      - { id: over_partition_multi, sql: "SELECT AVG(score) OVER (PARTITION BY a, b) FROM t;" }
      - { id: over_order, sql: "SELECT SUM(score) OVER (ORDER BY score) AS total_score FROM t;" }
      - { id: over_order_desc, sql: "SELECT SUM(score) OVER (ORDER BY score DESC) FROM t;" }
      - { id: over_order_multi, sql: "SELECT SUM(score) OVER (ORDER BY a ASC, b DESC) FROM t;" }
      - { id: over_partition_order, sql: "SELECT SUM(score) OVER (PARTITION BY test ORDER BY score) FROM t;" }
      - { id: over_expression_partition, sql: "SELECT SUM(score) OVER (PARTITION BY a + b ORDER BY c * 2) FROM t;" }
      - { id: multiple_over_clauses, sql: "SELECT SUM(c) OVER (PARTITION BY a), AVG(c) OVER (PARTITION BY b ORDER BY d) FROM t;" }
      - { id: window_in_order_by, sql: "SELECT name, test, score FROM t ORDER BY SUM(score) OVER (PARTITION BY name);" }
      - { id: window_in_subquery, sql: "SELECT * FROM (SELECT score, ROW_NUMBER() OVER (ORDER BY score) AS rn FROM t) AS x WHERE rn = 1;" }
    examples:
      - |-
        SELECT name, test, score, SUM(score) 
          OVER () AS total_score 
          FROM student_test;
      - |-
        SELECT name, test, score, SUM(score) 
          OVER (ORDER BY score) AS total_score 
          FROM student_test ORDER BY score;

  - id: c_window_frames
    name: Window frames (ROWS and RANGE)
    doc: https://mariadb.com/docs/server/reference/sql-functions/special-functions/window-functions/window-frames
    tier: high
    probes:
      - { id: rows_unbounded_preceding, sql: "SELECT SUM(c) OVER (ORDER BY d ROWS UNBOUNDED PRECEDING) FROM t;" }
      - { id: rows_current_row, sql: "SELECT SUM(c) OVER (ORDER BY d ROWS CURRENT ROW) FROM t;" }
      - { id: rows_n_preceding, sql: "SELECT SUM(c) OVER (ORDER BY d ROWS 2 PRECEDING) FROM t;" }
      - { id: rows_between_unbounded_current, sql: "SELECT SUM(c) OVER (ORDER BY d ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) FROM t;" }
      - { id: rows_between_current_unbounded, sql: "SELECT SUM(c) OVER (ORDER BY d ROWS BETWEEN CURRENT ROW AND UNBOUNDED FOLLOWING) FROM t;" }
      - { id: rows_between_unbounded_both, sql: "SELECT SUM(c) OVER (ORDER BY d ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING) FROM t;" }
      - { id: rows_between_n_preceding_following, sql: "SELECT SUM(c) OVER (ORDER BY d ROWS BETWEEN 1 PRECEDING AND 1 FOLLOWING) FROM t;" }
      - { id: rows_between_n_preceding_current, sql: "SELECT SUM(c) OVER (ORDER BY d ROWS BETWEEN 6 PRECEDING AND CURRENT ROW) FROM t;" }
      - { id: rows_between_current_n_following, sql: "SELECT SUM(c) OVER (ORDER BY d ROWS BETWEEN CURRENT ROW AND 2 FOLLOWING) FROM t;" }
      - { id: rows_between_n_preceding_m_following, sql: "SELECT SUM(c) OVER (ORDER BY d ROWS BETWEEN 6 PRECEDING AND 3 FOLLOWING) FROM t;" }
      - { id: range_unbounded_preceding, sql: "SELECT SUM(c) OVER (ORDER BY d RANGE UNBOUNDED PRECEDING) FROM t;" }
      - { id: range_between_unbounded_current, sql: "SELECT SUM(c) OVER (ORDER BY d RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) FROM t;" }
      - { id: range_between_current_unbounded, sql: "SELECT SUM(c) OVER (ORDER BY d RANGE BETWEEN CURRENT ROW AND UNBOUNDED FOLLOWING) FROM t;" }
      - { id: range_between_n_preceding_current, sql: "SELECT SUM(c) OVER (ORDER BY d RANGE BETWEEN 6 PRECEDING AND CURRENT ROW) FROM t;" }
      - { id: range_between_current_n_following, sql: "SELECT SUM(c) OVER (ORDER BY d RANGE BETWEEN CURRENT ROW AND 2 FOLLOWING) FROM t;" }
      - { id: range_between_n_preceding_m_following, sql: "SELECT SUM(c) OVER (ORDER BY d RANGE BETWEEN 6 PRECEDING AND 3 FOLLOWING) FROM t;" }
      - { id: frame_with_partition, sql: "SELECT AVG(c) OVER (PARTITION BY a ORDER BY d ROWS BETWEEN 2 PRECEDING AND CURRENT ROW) FROM t;" }
      - { id: rows_and_range_together, sql: "SELECT score, SUM(score) OVER (ORDER BY score ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS rows_sum, SUM(score) OVER (ORDER BY score RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS range_sum FROM t;" }
    examples:
      - |-
        SELECT name, test, score, SUM(score) 
          OVER (ORDER BY score RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS total_score 
          FROM student_test ORDER BY score;
      - |-
        SELECT name, test, score, SUM(score) 
          OVER (ORDER BY score RANGE BETWEEN CURRENT ROW AND UNBOUNDED FOLLOWING) AS total_score 
          FROM student_test ORDER BY score;

  - id: c_named_windows
    name: Named windows (WINDOW clause)
    doc: https://mariadb.com/docs/server/reference/sql-functions/special-functions/window-functions/window-functions-overview
    tier: high
    probes:
      - { id: window_clause, sql: "SELECT SUM(score) OVER w AS running_total FROM student WINDOW w AS (ORDER BY score);" }
      - { id: window_clause_frame, sql: "SELECT SUM(score) OVER w AS running_total, AVG(score) OVER w AS running_avg FROM student WINDOW w AS (ORDER BY score ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW);" }
      - { id: window_clause_partition, sql: "SELECT SUM(score) OVER w FROM student WINDOW w AS (PARTITION BY test);" }
      - { id: window_clause_empty, sql: "SELECT SUM(score) OVER w FROM student WINDOW w AS ();" }
      - { id: over_parenthesized_name, sql: "SELECT SUM(score) OVER (w) FROM student WINDOW w AS (PARTITION BY test ORDER BY score);" }
      - { id: over_name_with_order, sql: "SELECT SUM(score) OVER (w ORDER BY score) FROM student WINDOW w AS (PARTITION BY test);" }
      - { id: multiple_named_windows, sql: "SELECT SUM(c) OVER w1, AVG(c) OVER w2 FROM t WINDOW w1 AS (PARTITION BY a), w2 AS (ORDER BY b);" }
      - { id: window_references_window, sql: "SELECT SUM(c) OVER w2 FROM t WINDOW w1 AS (PARTITION BY a), w2 AS (w1 ORDER BY b);" }
      - { id: window_with_group_by, sql: "SELECT a, SUM(c) OVER w FROM t GROUP BY a, c WINDOW w AS (PARTITION BY a);" }
    examples:
      - |-
        SELECT
          SUM(score) OVER w AS running_total,
          AVG(score) OVER w AS running_avg
        FROM student
        WINDOW w AS (
          ORDER BY score
          ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
        );

  - id: c_window_ranking
    name: Ranking window functions (ROW_NUMBER, RANK, DENSE_RANK, PERCENT_RANK, CUME_DIST, NTILE)
    doc: https://mariadb.com/docs/server/reference/sql-functions/special-functions/window-functions/rank
    tier: high
    probes:
      - { id: row_number, sql: "SELECT ROW_NUMBER() OVER (ORDER BY c) FROM t;" }
      - { id: row_number_partition, sql: "SELECT ROW_NUMBER() OVER (PARTITION BY a ORDER BY c) FROM t;" }
      - { id: row_number_empty_over, sql: "SELECT ROW_NUMBER() OVER () FROM t;" }
      - { id: rank, sql: "SELECT RANK() OVER (ORDER BY c) FROM t;" }
      - { id: rank_partition, sql: "SELECT RANK() OVER (PARTITION BY a ORDER BY c DESC) FROM t;" }
      - { id: dense_rank, sql: "SELECT DENSE_RANK() OVER (ORDER BY c) FROM t;" }
      - { id: dense_rank_partition, sql: "SELECT DENSE_RANK() OVER (PARTITION BY a ORDER BY c) FROM t;" }
      - { id: percent_rank, sql: "SELECT PERCENT_RANK() OVER (ORDER BY c) FROM t;" }
      - { id: percent_rank_partition, sql: "SELECT PERCENT_RANK() OVER (PARTITION BY a ORDER BY c) FROM t;" }
      - { id: cume_dist, sql: "SELECT CUME_DIST() OVER (ORDER BY c) FROM t;" }
      - { id: cume_dist_partition, sql: "SELECT CUME_DIST() OVER (PARTITION BY a ORDER BY c) FROM t;" }
      - { id: ntile, sql: "SELECT NTILE(4) OVER (ORDER BY c) FROM t;" }
      - { id: ntile_partition, sql: "SELECT NTILE(2) OVER (PARTITION BY a ORDER BY c) FROM t;" }
      - { id: ranking_in_cte, sql: "WITH r AS (SELECT c, RANK() OVER (PARTITION BY a ORDER BY c) AS rk FROM t) SELECT * FROM r WHERE rk = 1;" }

  - id: c_window_value
    name: Value window functions (FIRST_VALUE, LAST_VALUE, NTH_VALUE, LAG, LEAD)
    doc: https://mariadb.com/docs/server/reference/sql-functions/special-functions/window-functions/lag
    tier: high
    probes:
      - { id: first_value, sql: "SELECT FIRST_VALUE(c) OVER (ORDER BY d) FROM t;" }
      - { id: first_value_partition, sql: "SELECT FIRST_VALUE(c) OVER (PARTITION BY a ORDER BY d) FROM t;" }
      - { id: first_value_no_order, sql: "SELECT FIRST_VALUE(c) OVER (PARTITION BY a) FROM t;" }
      - { id: last_value, sql: "SELECT LAST_VALUE(c) OVER (PARTITION BY a ORDER BY d) FROM t;" }
      - { id: nth_value, sql: "SELECT NTH_VALUE(c, 2) OVER (PARTITION BY a ORDER BY d) FROM t;" }
      - { id: nth_value_no_row, sql: "SELECT NTH_VALUE(c) OVER (ORDER BY d) FROM t;" }
      - { id: lag, sql: "SELECT LAG(c) OVER (ORDER BY d) FROM t;" }
      - { id: lag_offset, sql: "SELECT LAG(c, 2) OVER (PARTITION BY a ORDER BY d) FROM t;" }
      - { id: lead, sql: "SELECT LEAD(c) OVER (ORDER BY d) FROM t;" }
      - { id: lead_offset, sql: "SELECT LEAD(c, 2) OVER (PARTITION BY a ORDER BY d) FROM t;" }
      - { id: first_value_with_frame, sql: "SELECT FIRST_VALUE(c) OVER (PARTITION BY a ORDER BY d ROWS BETWEEN 1 PRECEDING AND 1 FOLLOWING) FROM t;" }

  - id: c_window_percentile
    name: PERCENTILE_CONT, PERCENTILE_DISC and MEDIAN
    doc: https://mariadb.com/docs/server/reference/sql-functions/special-functions/window-functions/percentile_cont
    tier: medium
    probes:
      - { id: percentile_cont, sql: "SELECT PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY star_rating) OVER (PARTITION BY name) AS pc FROM book_rating;" }
      - { id: percentile_cont_over_empty, sql: "SELECT PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY c) OVER () FROM t;" }
      - { id: percentile_disc, sql: "SELECT PERCENTILE_DISC(0.5) WITHIN GROUP (ORDER BY star_rating) OVER (PARTITION BY name) AS pc FROM book_rating;" }
      - { id: percentile_disc_over_empty, sql: "SELECT PERCENTILE_DISC(0.25) WITHIN GROUP (ORDER BY c) OVER () FROM t;" }
      - { id: median, sql: "SELECT MEDIAN(c) OVER (PARTITION BY a) FROM t;" }
      - { id: median_over_empty, sql: "SELECT MEDIAN(c) OVER () FROM t;" }
    examples:
      - |-
        SELECT name, PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY star_rating) 
          OVER (PARTITION BY name) AS pc 
          FROM book_rating;
      - |-
        SELECT name, PERCENTILE_DISC(0.5) WITHIN GROUP (ORDER BY star_rating)
          OVER (PARTITION BY name) AS pc FROM book_rating;

  - id: c_json_constructors
    name: JSON constructors (JSON_ARRAY, JSON_OBJECT, JSON_QUOTE)
    doc: https://mariadb.com/docs/server/reference/sql-functions/special-functions/json-functions/json_object
    tier: high
    probes:
      - { id: json_array_empty, sql: "SELECT JSON_ARRAY();" }
      - { id: json_array_values, sql: "SELECT JSON_ARRAY(56, 3.1416, 'My name is \"Foo\"', NULL);" }
      - { id: json_array_nested, sql: "SELECT JSON_ARRAY(1, JSON_ARRAY(2, 3), JSON_OBJECT('a', 1));" }
      - { id: json_array_columns, sql: "SELECT JSON_ARRAY(a, b) FROM t;" }
      - { id: json_object_empty, sql: "SELECT JSON_OBJECT();" }
      - { id: json_object_pairs, sql: "SELECT JSON_OBJECT('id', 87, 'name', 'carrot');" }
      - { id: json_object_nested, sql: "SELECT JSON_OBJECT('a', JSON_ARRAY(1, 2), 'b', JSON_OBJECT('c', 3));" }
      - { id: json_object_columns, sql: "SELECT JSON_OBJECT('id', id, 'name', name) FROM t;" }
      - { id: json_quote, sql: "SELECT JSON_QUOTE('gnu');" }
      - { id: json_unquote_quote, sql: "SELECT JSON_UNQUOTE(JSON_QUOTE('gnu'));" }
      - { id: json_in_insert, sql: "INSERT INTO t (j) VALUES (JSON_OBJECT('a', 1));" }
      - { id: json_in_where, sql: "SELECT * FROM t WHERE JSON_EXTRACT(j, '$.a') = 1;" }

  - id: c_json_access
    name: JSON access and inspection functions
    doc: https://mariadb.com/docs/server/reference/sql-functions/special-functions/json-functions/json_extract
    tier: high
    probes:
      - { id: json_extract, sql: "SELECT JSON_EXTRACT('[1, 2, [3, 4]]', '$[1]');" }
      - { id: json_extract_multi_path, sql: "SELECT JSON_EXTRACT(j, '$.a', '$.b') FROM t;" }
      - { id: json_extract_nested_index, sql: "SELECT JSON_EXTRACT('[1, 2, [3, 4]]', '$[2][1]');" }
      - { id: json_extract_wildcard, sql: "SELECT JSON_EXTRACT(j, '$.a[*].b') FROM t;" }
      - { id: json_value, sql: "SELECT JSON_VALUE('{\"key1\":123}', '$.key1');" }
      - { id: json_value_column, sql: "SELECT JSON_VALUE(j, '$.name') FROM t;" }
      - { id: json_query, sql: "SELECT JSON_QUERY('{\"key1\":{\"a\":1, \"b\":[1,2]}}', '$.key1');" }
      - { id: json_unquote, sql: "SELECT JSON_UNQUOTE(JSON_EXTRACT(j, '$.name')) FROM t;" }
      - { id: json_exists, sql: "SELECT JSON_EXISTS('{\"key1\":\"xxxx\", \"key2\":[1, 2, 3]}', '$.key2');" }
      - { id: json_exists_where, sql: "SELECT * FROM t WHERE JSON_EXISTS(j, '$.a');" }
      - { id: json_contains, sql: "SELECT JSON_CONTAINS('{\"A\": 0, \"B\": {\"C\": 1}, \"D\": 2}', '2', '$.A');" }
      - { id: json_contains_no_path, sql: "SELECT JSON_CONTAINS(j, '1') FROM t;" }
      - { id: json_search, sql: "SELECT JSON_SEARCH('[\"A\", [{\"B\": \"1\"}], {\"C\":\"AB\"}, {\"D\":\"BC\"}]', 'one', 'AB');" }
      - { id: json_search_all_escape_path, sql: "SELECT JSON_SEARCH(j, 'all', 'a%', NULL, '$.x') FROM t;" }
      - { id: json_type, sql: "SELECT JSON_TYPE('{\"A\": 1, \"B\": 2, \"C\": 3}');" }
      - { id: json_length, sql: "SELECT JSON_LENGTH('[1, 2, {\"a\": 3}]'), JSON_LENGTH(j, '$.a') FROM t;" }
      - { id: json_depth, sql: "SELECT JSON_DEPTH('[10, {\"a\": 20}]');" }
      - { id: json_keys, sql: "SELECT JSON_KEYS('{\"A\": 1, \"B\": {\"C\": 2}}'), JSON_KEYS(j, '$.B') FROM t;" }
      - { id: json_overlaps, sql: "SELECT JSON_OVERLAPS('{\"A\": 1, \"B\": {\"C\":2}}', '{\"A\": 2, \"B\": {\"C\":2}}') AS is_overlap;" }
    examples:
      - "SELECT JSON_EXTRACT('{\"id\":\"1\", \"name\":\"Name\"}', '$.name') `name`;"
      - "SELECT JSON_EXISTS('{\"key1\":\"xxxx\", \"key2\":[1, 2, 3]}', \"$.key2\");"
      - "SELECT json_query('{\"key1\":{\"a\":1, \"b\":[1,2]}}', '$.key1');"

  - id: c_json_modify
    name: JSON modification functions
    doc: https://mariadb.com/docs/server/reference/sql-functions/special-functions/json-functions/json_set
    tier: medium
    probes:
      - { id: json_set, sql: "SELECT JSON_SET('{\"a\": 1}', '$.b', 2);" }
      - { id: json_set_multi, sql: "SELECT JSON_SET(j, '$.a', 10, '$.b', 20) FROM t;" }
      - { id: json_insert, sql: "SELECT JSON_INSERT('{\"a\": 1}', '$.b', 2);" }
      - { id: json_insert_multi, sql: "SELECT JSON_INSERT(j, '$.a', 1, '$.b', 2) FROM t;" }
      - { id: json_replace, sql: "SELECT JSON_REPLACE('{\"a\": 1}', '$.a', 2);" }
      - { id: json_replace_multi, sql: "SELECT JSON_REPLACE(j, '$.a', 1, '$.b', 2) FROM t;" }
      - { id: json_remove, sql: "SELECT JSON_REMOVE('{\"a\": 1, \"b\": 2}', '$.b');" }
      - { id: json_remove_multi, sql: "SELECT JSON_REMOVE(j, '$.a', '$.b') FROM t;" }
      - { id: json_array_append, sql: "SELECT JSON_ARRAY_APPEND('[1, 2]', '$', 3);" }
      - { id: json_array_append_multi, sql: "SELECT JSON_ARRAY_APPEND(j, '$[0]', 1, '$[1]', 2) FROM t;" }
      - { id: json_array_insert, sql: "SELECT JSON_ARRAY_INSERT('[1, 2]', '$[0]', 0);" }
      - { id: json_array_insert_multi, sql: "SELECT JSON_ARRAY_INSERT(j, '$[0]', 1, '$[1]', 2) FROM t;" }
      - { id: json_merge_patch, sql: "SELECT JSON_MERGE_PATCH('{\"a\": 1}', '{\"b\": 2}');" }
      - { id: json_merge_patch_three, sql: "SELECT JSON_MERGE_PATCH(j1, j2, j3) FROM t;" }
      - { id: update_with_json_set, sql: "UPDATE t SET j = JSON_SET(j, '$.a', 1) WHERE id = 1;" }

  - id: c_json_utility
    name: JSON utility functions (VALID, NORMALIZE, DETAILED, SCHEMA_VALID, array and object helpers)
    doc: https://mariadb.com/docs/server/reference/sql-functions/special-functions/json-functions/json_valid
    tier: medium
    probes:
      - { id: json_valid, sql: "SELECT JSON_VALID('{\"a\": 1}');" }
      - { id: json_valid_where, sql: "SELECT * FROM t WHERE JSON_VALID(j);" }
