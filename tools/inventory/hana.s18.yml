dialect: hana
engine: SAP HANA Platform
version: "2.0 SPS 08 (2.0.08)"
source: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/3bc1a0d4611d40c4a6e3fc7c8e80395d.html?version=2.0.08

statements:
  - id: alter_system_cancel_work_in_session
    name: ALTER SYSTEM CANCEL [WORK IN] SESSION
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/20d0eb287519101498c4ecb8114cab17.html?version=2.0.08
    tier: medium
    probes:
      - id: cancel_session
        sql: "ALTER SYSTEM CANCEL SESSION '203927';"
      - id: cancel_work_in_session
        sql: "ALTER SYSTEM CANCEL WORK IN SESSION '203927';"

  - id: alter_system_clear_sql_plan_cache
    name: ALTER SYSTEM CLEAR SQL PLAN CACHE
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/20d107c875191014b8aecbb218720fd9.html?version=2.0.08
    tier: medium
    probes:
      - id: basic
        sql: "ALTER SYSTEM CLEAR SQL PLAN CACHE;"
    examples:
      - "ALTER SYSTEM CLEAR SQL PLAN CACHE;"

  - id: alter_system_disconnect_session
    name: ALTER SYSTEM DISCONNECT SESSION
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/20d1524e751910148706e0aab4063a0f.html?version=2.0.08
    tier: medium
    probes:
      - id: basic
        sql: "ALTER SYSTEM DISCONNECT SESSION '203927';"

  - id: alter_user
    name: ALTER USER
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/20d3459f75191014a7bbeb670bad8850.html?version=2.0.08
    tier: medium
    probes:
      - id: password
        sql: "ALTER USER u PASSWORD Password1;"
      - id: password_no_force_change
        sql: "ALTER USER u PASSWORD Password1 NO FORCE_FIRST_PASSWORD_CHANGE;"
      - id: password_valid_from_until
        sql: "ALTER USER u PASSWORD Password1 VALID FROM '2030-01-01 00:00:00' UNTIL '2031-01-01 00:00:00';"
      - id: valid_from_now_until_forever
        sql: "ALTER USER u VALID FROM NOW UNTIL FOREVER;"
      - id: set_parameter
        sql: "ALTER USER u SET PARAMETER CLIENT = '100', LOCALE = 'en-US', TIME ZONE = 'UTC';"
      - id: set_statement_limits
        sql: "ALTER USER u SET PARAMETER STATEMENT MEMORY LIMIT = '10', STATEMENT THREAD LIMIT = '5';"
      - id: clear_parameter
        sql: "ALTER USER u CLEAR PARAMETER CLIENT, LOCALE;"
      - id: clear_all_parameters
        sql: "ALTER USER u CLEAR ALL PARAMETERS;"
      - id: set_usergroup
        sql: "ALTER USER u SET USERGROUP g;"
      - id: unset_usergroup
        sql: "ALTER USER u UNSET USERGROUP;"
      - id: identified_externally
        sql: "ALTER USER u IDENTIFIED EXTERNALLY AS 'krbuser@EXAMPLE.COM';"
      - id: reset_connect_attempts
        sql: "ALTER USER u RESET CONNECT ATTEMPTS;"
      - id: drop_connect_attempts
        sql: "ALTER USER u DROP CONNECT ATTEMPTS;"
      - id: enable_password_lifetime
        sql: "ALTER USER u ENABLE PASSWORD LIFETIME;"
      - id: disable_password_lifetime
        sql: "ALTER USER u DISABLE PASSWORD LIFETIME;"
      - id: force_password_change
        sql: "ALTER USER u FORCE PASSWORD CHANGE;"
      - id: activate
        sql: "ALTER USER u ACTIVATE USER NOW;"
      - id: deactivate
        sql: "ALTER USER u DEACTIVATE;"
      - id: enable_authentication
        sql: "ALTER USER u ENABLE KERBEROS;"
      - id: disable_authentication_saml
        sql: "ALTER USER u DISABLE SAML;"
      - id: add_identity_kerberos
        sql: "ALTER USER u ADD IDENTITY 'testkerberosName' FOR KERBEROS;"
      - id: add_identity_saml
        sql: "ALTER USER u ADD IDENTITY ANY FOR SAML PROVIDER p;"
      - id: add_identity_x509
        sql: "ALTER USER u ADD IDENTITY 'CN=subject' ISSUER 'CN=issuer' FOR X509;"
      - id: add_identity_jwt
        sql: "ALTER USER u ADD IDENTITY 'mapped' FOR JWT PROVIDER p;"
      - id: add_identity_logon_ticket
        sql: "ALTER USER u ADD IDENTITY FOR SAP LOGON TICKET;"
      - id: drop_identity_saml
        sql: "ALTER USER u DROP IDENTITY FOR SAML PROVIDER p;"
      - id: drop_identity_kerberos
        sql: "ALTER USER u DROP IDENTITY FOR KERBEROS;"
      - id: add_remote_identity
        sql: "ALTER USER u ADD REMOTE IDENTITY ru AT DATABASE db1;"
      - id: drop_remote_identity
        sql: "ALTER USER u DROP REMOTE IDENTITY ru AT DATABASE db1;"
      - id: client_connect
        sql: "ALTER USER u DISABLE CLIENT CONNECT;"
      - id: special_privilege_grant
        sql: "ALTER USER u GRANT CREATE ANY ON OWN SCHEMA;"
      - id: special_privilege_revoke_public
        sql: "ALTER USER u REVOKE ROLE PUBLIC;"
      - id: ldap_authorization
        sql: "ALTER USER u AUTHORIZATION LDAP;"
    examples:
      - "ALTER USER new_user FORCE PASSWORD CHANGE;"
      - "ALTER USER new_user DISABLE SAML;"
      - "ALTER USER new_user DROP IDENTITY FOR SAML PROVIDER ac_saml_provider;"

  - id: alter_usergroup
    name: ALTER USERGROUP
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/aa94ca874c01458da5a275aac8883c23.html?version=2.0.08
    tier: medium
    probes:
      - id: enable_user_admin
        sql: "ALTER USERGROUP g ENABLE USER ADMIN;"
      - id: disable_user_admin
        sql: "ALTER USERGROUP g DISABLE USER ADMIN;"
      - id: set_parameter
        sql: "ALTER USERGROUP g SET PARAMETER 'minimal_password_length'='10';"
      - id: clear_parameter
        sql: "ALTER USERGROUP g CLEAR PARAMETER 'minimal_password_length';"
      - id: enable_parameter_set
        sql: "ALTER USERGROUP g ENABLE PARAMETER SET 'password policy';"
      - id: disable_parameter_set
        sql: "ALTER USERGROUP g DISABLE PARAMETER SET 'password policy';"
      - id: enable_client_connect
        sql: "ALTER USERGROUP g ENABLE CLIENT CONNECT;"
      - id: disable_client_connect
        sql: "ALTER USERGROUP g DISABLE CLIENT CONNECT;"
      - id: enable_connect_restriction
        sql: "ALTER USERGROUP g ENABLE CONNECT RESTRICTION r1, r2;"
      - id: disable_connect_restriction_all
        sql: "ALTER USERGROUP g DISABLE CONNECT RESTRICTION ALL;"
      - id: drop_connect_restriction
        sql: "ALTER USERGROUP g DROP CONNECT RESTRICTION r1;"
      - id: add_connect_restriction
        sql: "ALTER USERGROUP g ADD CONNECT RESTRICTION (r1 IP ('1.2.3.4', '1.2.3.4/8'), r2 APPLICATION ALLOW ('app1'));"
      - id: alter_connect_restriction
        sql: "ALTER USERGROUP g ALTER CONNECT RESTRICTION (IPS_V4 IP ('1.2.3.4', '1.2.3.4/8'), IPS_V6 IP ('1:2:3:4:5:6:7:8/16'));"
    examples:
      - "ALTER USERGROUP MyUserGroup ENABLE USER ADMIN;"
      - "ALTER USERGROUP MyUserGroup DISABLE PARAMETER SET 'password policy';"
      - "ALTER USERGROUP my_usergroup1 DISABLE CONNECT RESTRICTION ALL;"

  - id: alter_virtual_table
    name: ALTER VIRTUAL TABLE
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/51826981a2d24e7aa872f4278220b579.html?version=2.0.08
    tier: medium
    probes:
      - id: set_property
        sql: "ALTER VIRTUAL TABLE vt SET PROPERTY 'name1' = 'value1', 'name2' = 'value2';"
      - id: unset_property
        sql: "ALTER VIRTUAL TABLE vt UNSET PROPERTY 'name1', 'name2';"
      - id: alter_column_set_property
        sql: "ALTER VIRTUAL TABLE s.vt ALTER c SET PROPERTY 'name1' = 'value1';"
      - id: alter_column_unset_property
        sql: "ALTER VIRTUAL TABLE vt ALTER c UNSET PROPERTY 'name1';"
      - id: refresh_definition
        sql: "ALTER VIRTUAL TABLE vt REFRESH DEFINITION;"
    examples:
      - "ALTER VIRTUAL TABLE REMOTE1_VT SET PROPERTY 'name1' = 'value1';"
      - "ALTER VIRTUAL TABLE REMOTE1_VT UNSET PROPERTY 'name1';"
      - "ALTER VIRTUAL TABLE REMOTE1_VT ALTER A SET PROPERTY 'name1' = 'value1';"

  - id: annotate
    name: ANNOTATE
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/534df83ee61946b884e7594d21459e35.html?version=2.0.08
    tier: medium
    probes:
      - id: table_set
        sql: "ANNOTATE t SET 'priority'='high';"
      - id: table_unset
        sql: "ANNOTATE t UNSET 'priority';"
      - id: table_unset_all
        sql: "ANNOTATE s.t UNSET ALL;"
      - id: column_set
        sql: "ANNOTATE COLUMN t.c SET 'datatype'='integer';"
      - id: column_unset_all
        sql: "ANNOTATE COLUMN t.c UNSET ALL;"
      - id: parameter_set
        sql: "ANNOTATE PARAMETER f.p SET 'currency'='USD';"
      - id: parameter_unset
        sql: "ANNOTATE PARAMETER f.p UNSET 'currency';"
    examples:
      - "ANNOTATE add_shipping_func SET 'region'='EMEA';"
      - "ANNOTATE PARAMETER add_shipping_func.price SET 'currency'='USD';"
      - "ANNOTATE COLUMN t1.col1 UNSET ALL;"

  - id: comment_on
    name: COMMENT ON
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/20d3817075191014ba7bcfdbab508d0e.html?version=2.0.08
    tier: medium
    probes:
      - id: table
        sql: "COMMENT ON TABLE s.t IS 'a table';"
      - id: view
        sql: "COMMENT ON VIEW v IS 'a view';"
      - id: column
        sql: "COMMENT ON COLUMN t.c IS 'a column';"
      - id: user
        sql: "COMMENT ON USER u IS 'a user';"
      - id: role
        sql: "COMMENT ON ROLE r IS 'a role';"
      - id: usergroup
        sql: "COMMENT ON USERGROUP g IS 'a group';"
      - id: rolegroup
        sql: "COMMENT ON ROLEGROUP rg IS 'a role group';"
      - id: scheduler_job
        sql: "COMMENT ON SCHEDULER JOB j IS 'a job';"
      - id: certificate
        sql: "COMMENT ON CERTIFICATE cert IS 'a certificate';"
      - id: public_key
        sql: "COMMENT ON PUBLIC KEY k IS 'a key';"
      - id: null_comment
        sql: "COMMENT ON VIEW v IS NULL;"
    examples:
      - "COMMENT ON TABLE COMMENT_ON_EX IS 'Used for comment on examples';"
      - "COMMENT ON COLUMN COMMENT_ON_EX.A IS 'This is an example column comment';"
      - "COMMENT ON VIEW COMMENT_ON_EX_VIEW IS NULL;"

  - id: connect
    name: CONNECT
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/20d3b9ad751910148cdccc8205563a87.html?version=2.0.08
    tier: medium
    probes:
      - id: user_password
        sql: "CONNECT u PASSWORD Password1;"
      - id: with_saml_assertion
        sql: "CONNECT WITH SAML ASSERTION '<saml>assertion</saml>';"
      - id: with_jwt
        sql: "CONNECT WITH JWT 'eyJhbGciOiJSUzI1NiJ9.e30.sig';"
    examples:
      - "CONNECT new_user PASSWORD Password1;"

  - id: create_database
    name: CREATE DATABASE
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/65cd51970fa44f36a4c9083915cf3162.html?version=2.0.08
    tier: medium
    probes:
      - id: system_user_password
        sql: "CREATE DATABASE db0 SYSTEM USER PASSWORD Manager1;"
      - id: at_location
        sql: "CREATE DATABASE db1 AT LOCATION 'host_a:30147' SYSTEM USER PASSWORD Manager1;"
      - id: add_service_at_location
        sql: "CREATE DATABASE db2 AT LOCATION 'host_a' ADD 'indexserver' AT 'host_b' ADD 'scriptserver' SYSTEM USER PASSWORD Manager1;"
      - id: as_replica_of
        sql: "CREATE DATABASE db3 AS REPLICA OF db0 AT LOCATION 'host_a:30140';"
      - id: key_management_configuration
        sql: "CREATE DATABASE db3 KEY MANAGEMENT CONFIGURATION 'cfg1';"
      - id: os_user_group
        sql: "CREATE DATABASE db4 OS USER 'osuser' OS GROUP 'osgroup' SYSTEM USER PASSWORD Manager1;"
      - id: no_start
        sql: "CREATE DATABASE db5 SYSTEM USER PASSWORD Manager1 NO START;"
      - id: restart_mode
        sql: "CREATE DATABASE db6 SYSTEM USER PASSWORD Manager1 NO RESTART;"
    examples:
      - "CREATE DATABASE DB0 SYSTEM USER PASSWORD Manager1;"
      - "CREATE DATABASE DB1 AT LOCATION 'HOST_A:30147' SYSTEM USER PASSWORD Manager1;"
      - "CREATE DATABASE DB2 AT LOCATION 'HOST_A' ADD 'indexserver' AT 'HOST_B' ADD 'scriptserver' SYSTEM USER PASSWORD Manager1;"
