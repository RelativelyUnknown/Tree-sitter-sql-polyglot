  - id: a_interval_literals
    name: INTERVAL literals
    doc: https://docs.teradata.com/reader/lRnURD5njdYWi5Bs8dw7og/jvYWH7wa0op34PmORYY4~A
    tier: high
    probes:
      - { id: year, sql: "SELECT INTERVAL '2' YEAR;" }
      - { id: year_negative, sql: "SELECT INTERVAL -'2' YEAR;" }
      - { id: year_to_month, sql: "SELECT INTERVAL '2-06' YEAR TO MONTH;" }
      - { id: month, sql: "SELECT INTERVAL '18' MONTH;" }
      - { id: day, sql: "SELECT INTERVAL '30' DAY;" }
      - { id: day_to_hour, sql: "SELECT INTERVAL '30 12' DAY TO HOUR;" }
      - { id: day_to_minute, sql: "SELECT INTERVAL '30 12:30' DAY TO MINUTE;" }
      - { id: day_to_second, sql: "SELECT INTERVAL '30 12:30:30.5' DAY TO SECOND;" }
      - { id: hour, sql: "SELECT INTERVAL '12' HOUR;" }
      - { id: hour_to_minute, sql: "SELECT INTERVAL '12:30' HOUR TO MINUTE;" }
      - { id: hour_to_second, sql: "SELECT INTERVAL '12:30:30' HOUR TO SECOND;" }
      - { id: minute, sql: "SELECT INTERVAL '30' MINUTE;" }
      - { id: minute_to_second, sql: "SELECT INTERVAL '30:30.5' MINUTE TO SECOND;" }
      - { id: second, sql: "SELECT INTERVAL '30.5' SECOND;" }
      - { id: arithmetic, sql: "SELECT CURRENT_DATE + INTERVAL '1' DAY;" }
    examples:
      - "SELECT INTERVAL -'2' YEAR + CURRENT_DATE;"
      - "SELECT INTERVAL '30 12:30:30.5' DAY TO SECOND + CURRENT_TIMESTAMP;"

  - id: a_period_literals
    name: PERIOD literals
    doc: https://docs.teradata.com/reader/lRnURD5njdYWi5Bs8dw7og/_aPoANwkAW6La0yYkXMiAw
    tier: medium
    probes:
      - { id: date_comma, sql: "SELECT PERIOD '(2005-02-03, 2006-02-04)';" }
      - { id: date_hyphen, sql: "SELECT PERIOD '(2005-02-03 - 2006-02-04)';" }
      - { id: date_until_changed, sql: "SELECT PERIOD '(2009-10-01, UNTIL_CHANGED)';" }
      - { id: date_until_closed, sql: "SELECT PERIOD '(2009-10-01, UNTIL_CLOSED)';" }
      - { id: time, sql: "SELECT PERIOD '(08:00:00, 15:40:00)';" }
      - { id: time_zone, sql: "SELECT PERIOD '(08:00:00-08:00 - 15:40:00-05:00)';" }
      - { id: timestamp, sql: "SELECT PERIOD '(2005-02-03 08:00:00, 2006-02-04 15:40:00)';" }
    examples:
      - |-
        INSERT INTO Policy
           (Policy_ID, Customer_ID, Policy_Type, Policy_Details, Validity)
           VALUES (497201, 304779902, 'AU', 'STD-CH-524-WXY-00',
                   PERIOD '(2005-02-03, 2006-02-04)');
      - |-
        INSERT INTO Policy
           (Policy_ID, Customer_ID, Policy_Type, Policy_Details, Validity)
           VALUES (541008, 246824626, 'AU', 'STD-CH-345-NXY-00',
                   PERIOD '(2009-10-01, UNTIL_CHANGED)');
      - |-
        UPDATE schedule
           SET flight_period = PERIOD '(08:00:00-08:00 - 15:40:00-05:00)'
           WHERE flight_no = 243;

  - id: a_null_literal
