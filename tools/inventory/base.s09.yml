dialect: base
engine: ISO SQL
version: "SQL:2016"
source: https://jakewheat.github.io/sql-overview/sql-2016-foundation-grammar.html

statements:
  - id: savepoint
    name: SAVEPOINT
    doc: https://jakewheat.github.io/sql-overview/sql-2016-foundation-grammar.html#_17_5_savepoint_statement
    tier: high
    probes:
      - id: basic
        sql: "SAVEPOINT sp;"

  - id: release_savepoint
    name: RELEASE SAVEPOINT
    doc: https://jakewheat.github.io/sql-overview/sql-2016-foundation-grammar.html#_17_6_release_savepoint_statement
    tier: high
    probes:
      - id: basic
        sql: "RELEASE SAVEPOINT sp;"
