dialect: teradata
engine: Teradata Vantage (Enterprise IntelliFlex) and VantageCloud Lake
version: "20.00"
source: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/DXllu86_qUx3dJlXfCkc6Q

statements:
  - id: signal
    name: SIGNAL
    doc: https://docs.teradata.com/reader/W_rdgXBblWWI0~tPgRlZMw/lMpDk2EMrsRDaEQGxVXFCg
    tier: high
    probes:
      - id: condition_name
        sql: "SIGNAL cond;"
      - id: sqlstate
        sql: "SIGNAL SQLSTATE '70001';"
      - id: sqlstate_value
        sql: "SIGNAL SQLSTATE VALUE '70001';"
      - id: condition_set_message
        sql: "SIGNAL cond SET MESSAGE_TEXT = 'failed';"
      - id: sqlstate_set_message
        sql: "SIGNAL SQLSTATE '70001' SET MESSAGE_TEXT = 'failed';"

  - id: resignal
    name: RESIGNAL
    doc: https://docs.teradata.com/reader/W_rdgXBblWWI0~tPgRlZMw/MqF2LuIF_ZfTD5Ci9Q1e5A
    tier: high
    probes:
      - id: bare
        sql: "RESIGNAL;"
      - id: condition_name
        sql: "RESIGNAL cond;"
      - id: sqlstate
        sql: "RESIGNAL SQLSTATE '70001';"
      - id: sqlstate_value
        sql: "RESIGNAL SQLSTATE VALUE '70001';"
      - id: set_message_only
        sql: "RESIGNAL SET MESSAGE_TEXT = 'failed';"
      - id: condition_set_message
        sql: "RESIGNAL cond SET MESSAGE_TEXT = 'failed';"
      - id: sqlstate_set_message
        sql: "RESIGNAL SQLSTATE '70001' SET MESSAGE_TEXT = 'failed';"
