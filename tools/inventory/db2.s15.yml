dialect: db2
engine: IBM Db2 for Linux, UNIX and Windows
version: "12.1"
source: https://www.ibm.com/docs/en/db2/12.1.x?topic=reference-statements

statements:
  - id: drop
    name: DROP
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-drop
    tier: high
    probes:
      - { id: alias, sql: "DROP ALIAS a;" }
      - { id: public_alias, sql: "DROP PUBLIC ALIAS a;" }
      - { id: alias_for_table, sql: "DROP ALIAS s.a FOR TABLE;" }
      - { id: alias_for_module, sql: "DROP ALIAS a FOR MODULE;" }
      - { id: alias_for_sequence, sql: "DROP ALIAS a FOR SEQUENCE;" }
      - { id: audit_policy, sql: "DROP AUDIT POLICY p;" }
      - { id: bufferpool, sql: "DROP BUFFERPOOL bp;" }
      - { id: db_partition_group, sql: "DROP DATABASE PARTITION GROUP g;" }
      - { id: event_monitor, sql: "DROP EVENT MONITOR em;" }
      - { id: external_model, sql: "DROP EXTERNAL MODEL m;" }
      - { id: external_model_restrict, sql: "DROP EXTERNAL MODEL m RESTRICT;" }
      - { id: function, sql: "DROP FUNCTION f;" }
      - { id: function_signature, sql: "DROP FUNCTION s.f (INT, FLOAT);" }
      - { id: function_restrict, sql: "DROP FUNCTION f RESTRICT;" }
      - { id: specific_function, sql: "DROP SPECIFIC FUNCTION s.f1;" }
      - { id: function_mapping, sql: "DROP FUNCTION MAPPING fm;" }
      - { id: histogram_template, sql: "DROP HISTOGRAM TEMPLATE ht;" }
      - { id: index, sql: "DROP INDEX idx;" }
      - { id: index_extension, sql: "DROP INDEX EXTENSION ie RESTRICT;" }
      - { id: mask, sql: "DROP MASK m;" }
      - { id: method, sql: "DROP METHOD m (INT) FOR t;" }
      - { id: specific_method, sql: "DROP SPECIFIC METHOD m1;" }
      - { id: module, sql: "DROP MODULE m;" }
      - { id: nickname, sql: "DROP NICKNAME n;" }
      - { id: package, sql: "DROP PACKAGE pkg;" }
      - { id: package_version, sql: "DROP PACKAGE pkg VERSION v1;" }
      - { id: permission, sql: "DROP PERMISSION p;" }
      - { id: procedure, sql: "DROP PROCEDURE p;" }
      - { id: procedure_signature, sql: "DROP PROCEDURE s.p (INT, VARCHAR(10));" }
      - { id: specific_procedure, sql: "DROP SPECIFIC PROCEDURE s.p1;" }
      - { id: role, sql: "DROP ROLE r;" }
      - { id: schema_restrict, sql: "DROP SCHEMA s RESTRICT;" }
      - { id: security_label, sql: "DROP SECURITY LABEL sl;" }
      - { id: security_label_component, sql: "DROP SECURITY LABEL COMPONENT slc;" }
      - { id: security_policy, sql: "DROP SECURITY POLICY sp;" }
      - { id: sequence_restrict, sql: "DROP SEQUENCE sq RESTRICT;" }
      - { id: server, sql: "DROP SERVER srv;" }
      - { id: service_class, sql: "DROP SERVICE CLASS sc;" }
      - { id: service_subclass, sql: "DROP SERVICE CLASS sub UNDER sup;" }
      - { id: stogroup, sql: "DROP STOGROUP sg;" }
      - { id: table, sql: "DROP TABLE t;" }
      - { id: table_if_exists, sql: "DROP TABLE IF EXISTS t;" }
      - { id: table_if_exists_after_name, sql: "DROP TABLE t IF EXISTS;" }
      - { id: table_hierarchy, sql: "DROP TABLE HIERARCHY root_t;" }
      - { id: tablespace, sql: "DROP TABLESPACE ts;" }
      - { id: tablespaces, sql: "DROP TABLESPACES ts1, ts2;" }
      - { id: transform_all, sql: "DROP TRANSFORM ALL FOR t;" }
      - { id: transforms_group, sql: "DROP TRANSFORMS g FOR t;" }
      - { id: threshold, sql: "DROP THRESHOLD th;" }
      - { id: trigger, sql: "DROP TRIGGER trg;" }
      - { id: trusted_context, sql: "DROP TRUSTED CONTEXT tc;" }
      - { id: type, sql: "DROP TYPE ty;" }
      - { id: type_restrict, sql: "DROP TYPE ty RESTRICT;" }
      - { id: type_mapping, sql: "DROP TYPE MAPPING tm;" }
      - { id: usage_list, sql: "DROP USAGE LIST ul;" }
      - { id: user_mapping_authid, sql: "DROP USER MAPPING FOR u SERVER srv;" }
      - { id: user_mapping_user, sql: "DROP USER MAPPING FOR USER SERVER srv;" }
      - { id: variable, sql: "DROP VARIABLE v;" }
      - { id: variable_restrict, sql: "DROP VARIABLE v RESTRICT;" }
      - { id: view, sql: "DROP VIEW v;" }
      - { id: view_hierarchy, sql: "DROP VIEW HIERARCHY root_v;" }
      - { id: work_action_set, sql: "DROP WORK ACTION SET was;" }
      - { id: work_class_set, sql: "DROP WORK CLASS SET wcs;" }
      - { id: workload, sql: "DROP WORKLOAD w;" }
      - { id: wrapper, sql: "DROP WRAPPER w;" }
      - { id: xsrobject, sql: "DROP XSROBJECT x;" }
    examples:
      - "DROP TABLE TDEPT;"
      - "DROP VIEW VDEPT;"
      - "DROP FUNCTION CENTER ( INT,FLOAT);"

  - id: fetch
    name: FETCH
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-fetch
    tier: high
    probes:
      - { id: into_variable, sql: "FETCH c INTO v1, v2;" }
      - { id: from_into, sql: "FETCH FROM c INTO v1;" }
      - { id: cursor_variable, sql: "FETCH FROM cv INTO v1, v2;" }
      - { id: into_global_variable, sql: "FETCH c INTO s.gv;" }
      - { id: into_array_element, sql: "FETCH c INTO arr[1];" }
      - { id: into_field_reference, sql: "FETCH c INTO r.f;" }
      - { id: using_descriptor, sql: "FETCH c USING DESCRIPTOR :sqlda3;" }
