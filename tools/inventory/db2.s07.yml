dialect: db2
engine: IBM Db2 for Linux, UNIX and Windows
version: "11.5"
source: https://www.ibm.com/docs/en/db2/11.5.x?topic=reference-statements

statements:
  - id: compound_sql_embedded
    name: Compound SQL (embedded)
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-compound-sql-embedded
    tier: high
    probes:
      - id: atomic_static
        sql: "BEGIN COMPOUND ATOMIC STATIC UPDATE t SET c = c + 1 WHERE k = 1; END COMPOUND;"
      - id: not_atomic_static
        sql: "BEGIN COMPOUND NOT ATOMIC STATIC INSERT INTO t (c) VALUES (1); END COMPOUND;"
      - id: stop_after_first
        sql: "BEGIN COMPOUND NOT ATOMIC STATIC STOP AFTER FIRST :nbr STATEMENTS INSERT INTO t (c) VALUES (1); INSERT INTO t (c) VALUES (2); END COMPOUND;"
        note: STOP AFTER FIRST host-variable STATEMENTS; the host variable is only valid in an embedded program
      - id: multiple_substatements_commit
        sql: "BEGIN COMPOUND ATOMIC STATIC UPDATE t SET c = c + 1 WHERE k = 1; DELETE FROM t WHERE k = 2; COMMIT; END COMPOUND;"
        note: COMMIT may be the last sub-statement

  - id: compound_sql_compiled
    name: Compound SQL (compiled)
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-compound-sql-compiled
    tier: high
    probes:
      - id: not_atomic_basic
        sql: "BEGIN NOT ATOMIC SET x = 1; END;"
      - id: atomic
        sql: "BEGIN ATOMIC UPDATE t SET c = 1; END;"
      - id: label
        sql: "lbl: BEGIN DECLARE v INTEGER DEFAULT 0; SET v = 1; END lbl;"
      - id: variable_default_null
        sql: "BEGIN DECLARE v INTEGER DEFAULT NULL; SET v = 1; END;"
      - id: variable_multiple
        sql: "BEGIN DECLARE a, b INTEGER DEFAULT 0; SET a = 1; END;"
      - id: variable_constant
        sql: "BEGIN DECLARE v CONSTANT INTEGER DEFAULT 5; SET x = v; END;"
      - id: variable_anchored_type
        sql: "BEGIN DECLARE v ANCHOR DATA TYPE TO t.c; SET v = 1; END;"
      - id: variable_anchored_row
        sql: "BEGIN DECLARE v ANCHOR DATA TYPE TO ROW OF t; SET v.c = 1; END;"
      - id: variable_result_set_locator
        sql: "BEGIN DECLARE rs RESULT_SET_LOCATOR VARYING; SET x = 1; END;"
      - id: variable_cursor_value
        sql: "BEGIN DECLARE c1 CURSOR; SET x = 1; END;"
      - id: type_array
        sql: "BEGIN DECLARE TYPE arr AS INTEGER ARRAY[10]; DECLARE v arr; SET v[1] = 1; END;"
      - id: type_array_unbounded
        sql: "BEGIN DECLARE TYPE arr AS VARCHAR(10) ARRAY[]; DECLARE v arr; SET v[1] = 'a'; END;"
      - id: type_row
        sql: "BEGIN DECLARE TYPE r AS ROW (a INTEGER, b VARCHAR(10)); DECLARE v r; SET v.a = 1; END;"
      - id: type_distinct
        sql: "BEGIN DECLARE TYPE money AS DECIMAL(9,2) WITH WEAK TYPE RULES; SET x = 1; END;"
      - id: condition_declaration
        sql: "BEGIN DECLARE not_found CONDITION FOR SQLSTATE VALUE '02000'; SET x = 1; END;"
      - id: condition_declaration_no_value
        sql: "BEGIN DECLARE cnd CONDITION FOR SQLSTATE '02000'; SET x = 1; END;"
      - id: return_codes_sqlstate
        sql: "BEGIN DECLARE SQLSTATE CHAR(5) DEFAULT '00000'; SET x = 1; END;"
      - id: return_codes_sqlcode
        sql: "BEGIN DECLARE SQLCODE INTEGER DEFAULT 0; SET x = 1; END;"
      - id: statement_declaration
        sql: "BEGIN DECLARE s1, s2 STATEMENT; SET x = 1; END;"
      - id: cursor_declaration
        sql: "BEGIN DECLARE c1 CURSOR FOR SELECT c FROM t; OPEN c1; CLOSE c1; END;"
      - id: cursor_with_hold
        sql: "BEGIN DECLARE c1 CURSOR WITH HOLD FOR SELECT c FROM t; OPEN c1; CLOSE c1; END;"
      - id: cursor_without_hold
        sql: "BEGIN DECLARE c1 CURSOR WITHOUT HOLD FOR SELECT c FROM t; OPEN c1; CLOSE c1; END;"
      - id: cursor_statement_name
        sql: "BEGIN DECLARE c1 CURSOR FOR s1; OPEN c1; CLOSE c1; END;"
      - id: nested_procedure_declaration
        sql: "BEGIN DECLARE PROCEDURE p1 (IN a INTEGER) BEGIN SET x = a; END; CALL p1(1); END;"
      - id: handler_continue_sqlstate
        sql: "BEGIN DECLARE CONTINUE HANDLER FOR SQLSTATE VALUE '23505' SET x = 1; INSERT INTO t (c) VALUES (1); END;"
      - id: handler_exit_not_found
        sql: "BEGIN DECLARE EXIT HANDLER FOR NOT FOUND SET x = 1; SELECT c INTO x FROM t; END;"
      - id: handler_undo_sqlexception
        sql: "BEGIN ATOMIC DECLARE UNDO HANDLER FOR SQLEXCEPTION SET x = 1; INSERT INTO t (c) VALUES (1); END;"
      - id: handler_sqlwarning_list
        sql: "BEGIN DECLARE CONTINUE HANDLER FOR SQLWARNING, NOT FOUND SET x = 1; SET y = 2; END;"
      - id: handler_condition_name
        sql: "BEGIN DECLARE cnd CONDITION FOR SQLSTATE VALUE '02000'; DECLARE CONTINUE HANDLER FOR cnd SET x = 1; SET y = 2; END;"
      - id: handler_compound_body
        sql: "BEGIN DECLARE EXIT HANDLER FOR SQLEXCEPTION BEGIN SET x = 1; END; SET y = 2; END;"
      - id: statement_labeled
        sql: "BEGIN lbl: SET x = 1; END;"
      - id: control_statements
        sql: "BEGIN DECLARE i INTEGER DEFAULT 0; WHILE i < 10 DO SET i = i + 1; END WHILE; IF i = 10 THEN SET x = 1; ELSE SET x = 2; END IF; END;"
    examples:
      - |-
        BEGIN
          CALL DBMS_OUTPUT.PUT_LINE ( 'Hello' );
        END;
      - |-
        BEGIN
          DECLARE v_numRecords INTEGER DEFAULT 1 ;
          SELECT COUNT(*) INTO v_numRecords FROM staff;
          CALL DBMS_OUTPUT.PUT_LINE (v_numRecords);
        END;
      - |-
        CREATE PROCEDURE DEPT_MEDIAN (IN deptNumber SMALLINT, OUT medianSalary DOUBLE)
        LANGUAGE SQL
        BEGIN
          DECLARE v_numRecords INTEGER DEFAULT 1;
          DECLARE v_counter INTEGER DEFAULT 0;
          DECLARE c1 CURSOR FOR
            SELECT CAST( salary AS DOUBLE )
            FROM staff
            WHERE DEPT = deptNumber
            ORDER BY salary;
          DECLARE EXIT HANDLER FOR NOT FOUND
            SET medianSalary = 6666;
          SET medianSalary = 0;
          SELECT COUNT(*) INTO v_numRecords
            FROM staff
            WHERE DEPT = deptNumber;
          OPEN c1;
          WHILE v_counter < (v_numRecords / 2 + 1) DO
            FETCH c1 INTO medianSalary;
            SET v_counter = v_counter + 1;
          END WHILE;
          CLOSE c1;
        END;
