  - id: begin_end
    name: "BEGIN...END"
    doc: https://learn.microsoft.com/en-us/sql/t-sql/language-elements/begin-end-transact-sql
    tier: high
    probes:
      - id: block
        sql: "BEGIN SELECT c FROM t; SELECT d FROM u; END;"
      - id: block_semicolon_after_begin
        sql: "BEGIN; SELECT c FROM t; END;"
        note: "BEGIN [ ; ] in the syntax block."
      - id: nested
        sql: "BEGIN BEGIN PRINT 'inner'; END PRINT 'outer'; END;"
      - id: no_terminators
        sql: |-
          BEGIN
            SELECT c FROM t
            SELECT d FROM u
          END;
      - id: if_block
        sql: "IF @@TRANCOUNT = 0 BEGIN SELECT c FROM t; ROLLBACK TRANSACTION; PRINT N'x'; END;"
      - id: label_only_block
        sql: "BEGIN unusedLabel: END;"
        note: "Doc example 'BEGIN unusedLabel: END' (a block containing only a label)."
    examples:
      - |-
        BEGIN
            unusedLabel:
        END

  - id: end_begin_end
    name: "END (BEGIN...END)"
    doc: https://learn.microsoft.com/en-us/sql/t-sql/language-elements/end-begin-end-transact-sql
    tier: high
    probes:
      - id: while_block
        sql: "WHILE @i < 10 BEGIN SELECT c FROM t WHERE d = 'Adams'; SET @i += 1 END;"

  - id: if_else
    name: "IF...ELSE"
    doc: https://learn.microsoft.com/en-us/sql/t-sql/language-elements/if-else-transact-sql
    tier: high
    probes:
      - id: if_only
        sql: "IF @a > 0 PRINT 'positive';"
      - id: if_else
        sql: "IF DATENAME(weekday, GETDATE()) IN (N'Saturday', N'Sunday') SELECT 'Weekend'; ELSE SELECT 'Weekday';"
      - id: if_else_no_semicolon
        sql: "IF 1 = 1 PRINT 'true' ELSE PRINT 'false';"
      - id: if_subquery_condition
        sql: "IF (SELECT COUNT(*) FROM t WHERE c LIKE 'x%') > 5 PRINT 'many';"
      - id: if_exists
        sql: "IF EXISTS (SELECT 1 FROM sys.tables WHERE name = N't') DROP TABLE t;"
      - id: if_not_exists
        sql: "IF NOT EXISTS (SELECT 1 FROM t WHERE id = 1) INSERT INTO t (id) VALUES (1);"
      - id: if_object_id
        sql: "IF OBJECT_ID(N'dbo.t', N'U') IS NOT NULL DROP TABLE dbo.t;"
      - id: blocks
        sql: "IF @a > 100 BEGIN PRINT 'large'; END ELSE BEGIN PRINT 'small'; END;"
      - id: else_if_chain
        sql: "IF @n > 100 PRINT 'large'; ELSE IF @n < 10 PRINT 'small'; ELSE PRINT 'medium';"
      - id: nested_in_else_block
        sql: "IF @n > 100 PRINT 'large'; ELSE BEGIN IF @n < 10 PRINT 'small'; ELSE PRINT 'medium'; END;"
    examples:
      - |-
        IF DATENAME(weekday, GETDATE()) IN (N'Saturday', N'Sunday')
            SELECT 'Weekend';
        ELSE
            SELECT 'Weekday';

  - id: else_if_else
    name: "ELSE (IF...ELSE)"
    doc: https://learn.microsoft.com/en-us/sql/t-sql/language-elements/else-if-else-transact-sql
    tier: high
    probes:
      - id: else
        sql: "IF 1 = 2 PRINT 'true' ELSE PRINT 'false';"
      - id: else_block
        sql: "IF (SELECT COUNT(*) FROM t) > 5 BEGIN SET @n = 1; PRINT 'x'; END ELSE BEGIN SET @n = 0; END;"
    examples:
      - |-
        IF 1 = 1 PRINT 'Boolean expression is true.'
        ELSE PRINT 'Boolean expression is false.';
      - |-
        IF (SELECT COUNT(*)
            FROM Production.Product
            WHERE Name LIKE 'Touring-3000%'
        ) > 5
            PRINT 'There are more than 5 Touring-3000 bicycles.'
        ELSE
            PRINT 'There are 5 or less Touring-3000 bicycles.';

  - id: while
    name: "WHILE"
    doc: https://learn.microsoft.com/en-us/sql/t-sql/language-elements/while-transact-sql
    tier: high
    probes:
      - id: single_statement
        sql: "WHILE @i < 10 SET @i = @i + 1;"
      - id: block
        sql: "WHILE (SELECT AVG(c) FROM t) < $300 BEGIN UPDATE t SET c = c * 2; SELECT MAX(c) FROM t; END;"
      - id: break_continue
        sql: "WHILE 1 = 1 BEGIN IF (SELECT MAX(c) FROM t) > $500 BREAK ELSE CONTINUE END;"
      - id: fetch_status_loop
        sql: "WHILE @@FETCH_STATUS = 0 BEGIN FETCH NEXT FROM cur INTO @a, @b; END;"
      - id: continue_statement
        sql: "WHILE @i < 10 BEGIN SET @i += 1; IF @i % 2 = 0 CONTINUE; PRINT @i; END;"

  - id: break
    name: "BREAK"
    doc: https://learn.microsoft.com/en-us/sql/t-sql/language-elements/break-transact-sql
    tier: high
    probes:
      - id: in_if_block
        sql: "WHILE (1 = 1) BEGIN IF EXISTS (SELECT * FROM ##t WHERE c = 'Done') BEGIN BREAK; END WAITFOR DELAY '00:01:30'; END;"
      - id: bare
        sql: "WHILE @i < 10 BEGIN SET @i += 1; IF @i = 5 BREAK; END;"
    examples:
      - |-
        WHILE (1=1)
        BEGIN
           IF EXISTS (SELECT * FROM ##MyTempTable WHERE EventCode = 'Done')
           BEGIN
              BREAK;  -- 'Done' row has finally been inserted and detected, so end this loop.
           END

           PRINT N'The other process is not yet done.';  -- Re-confirm the non-done status to the console.
           WAITFOR DELAY '00:01:30';  -- Sleep for 90 seconds.
        END

  - id: goto
    name: "GOTO"
    doc: https://learn.microsoft.com/en-us/sql/t-sql/language-elements/goto-transact-sql
    tier: medium
    probes:
      - id: goto_label
        sql: "GOTO Branch_One;"
      - id: label_definition
        sql: |-
          Branch_One:
          SELECT 'Jumping To Branch One.';
      - id: conditional_goto
        sql: "IF @Counter = 4 GOTO Branch_One;"
      - id: loop_with_labels
        sql: "WHILE @c < 10 BEGIN SET @c = @c + 1 IF @c = 4 GOTO b1 END b1: SELECT 'one' GOTO b3; b2: SELECT 'two' b3: SELECT 'three';"

  - id: return
    name: "RETURN"
    doc: https://learn.microsoft.com/en-us/sql/t-sql/language-elements/return-transact-sql
    tier: high
    probes:
      - id: bare
        sql: "RETURN;"
      - id: integer
        sql: "RETURN 1;"
      - id: expression
        sql: "RETURN @status + 1;"
      - id: in_if
        sql: "IF @nm IS NULL BEGIN PRINT 'You must give a user name' RETURN END;"
      - id: in_procedure
        sql: "CREATE PROCEDURE checkstate @param VARCHAR(11) AS IF (SELECT s FROM t WHERE id = @param) = 'WA' RETURN 1 ELSE RETURN 2;"
      - id: exec_return_status
        sql: "EXEC @return_status = checkstate '2';"
    examples:
      - |-
        CREATE PROCEDURE findjobs @nm sysname = NULL
        AS
        IF @nm IS NULL
            BEGIN
                PRINT 'You must give a user name'
                RETURN
            END
        ELSE
            BEGIN
                SELECT o.name, o.id, o.uid
                FROM sysobjects o INNER JOIN master..syslogins l
                    ON o.uid = l.sid
                WHERE l.name = @nm
            END;
      - |-
        CREATE PROCEDURE checkstate @param VARCHAR(11)
        AS
        IF (SELECT StateProvince FROM Person.vAdditionalContactInfo WHERE ContactID = @param) = 'WA'
            RETURN 1
        ELSE
            RETURN 2;

  - id: try_catch
    name: "TRY...CATCH"
    doc: https://learn.microsoft.com/en-us/sql/t-sql/language-elements/try-catch-transact-sql
    tier: high
    probes:
      - id: basic
        sql: "BEGIN TRY SELECT 1 / 0; END TRY BEGIN CATCH SELECT ERROR_NUMBER() AS n, ERROR_MESSAGE() AS m; END CATCH;"
      - id: no_terminators
        sql: |-
          BEGIN TRY
            SELECT 1 / 0
          END TRY
          BEGIN CATCH
            EXECUTE usp_GetErrorInfo
          END CATCH;
      - id: empty_catch
        sql: "BEGIN TRY DELETE FROM t WHERE id = 1; END TRY BEGIN CATCH END CATCH;"
        note: "BEGIN CATCH [ { sql_statement | statement_block } ] END CATCH: the CATCH block may be empty."
      - id: transaction_handling
        sql: "BEGIN TRY BEGIN TRANSACTION; DELETE FROM t WHERE id = 980; COMMIT TRANSACTION; END TRY BEGIN CATCH IF XACT_STATE() <> 0 ROLLBACK TRANSACTION; THROW; END CATCH;"
      - id: nested
        sql: "BEGIN TRY BEGIN TRY SELECT 1 / 0; END TRY BEGIN CATCH THROW; END CATCH END TRY BEGIN CATCH PRINT ERROR_MESSAGE(); END CATCH;"
    examples:
      - |-
        BEGIN TRY
            -- Generate divide-by-zero error.
            SELECT 1 / 0;
        END TRY

        BEGIN CATCH
            -- Execute error retrieval routine.
            EXECUTE usp_GetErrorInfo;
        END CATCH;
      - |-
        BEGIN TRY
            -- Table does not exist; object name resolution
            -- error not caught.
            SELECT *
            FROM NonexistentTable;
        END TRY

        BEGIN CATCH
            SELECT ERROR_NUMBER() AS ErrorNumber,
                ERROR_MESSAGE() AS ErrorMessage;
        END CATCH
      - |-
        BEGIN TRY
            EXECUTE usp_ExampleProc;
        END TRY

        BEGIN CATCH
            SELECT ERROR_NUMBER() AS ErrorNumber,
                ERROR_MESSAGE() AS ErrorMessage;
        END CATCH;
      - |-
        BEGIN TRY
            -- Generate a divide-by-zero error.
            SELECT 1 / 0;
        END TRY

        BEGIN CATCH
            SELECT ERROR_NUMBER() AS ErrorNumber,
                ERROR_SEVERITY() AS ErrorSeverity,
                ERROR_STATE() AS ErrorState,
                ERROR_PROCEDURE() AS ErrorProcedure,
                ERROR_LINE() AS ErrorLine,
                ERROR_MESSAGE() AS ErrorMessage;
        END CATCH;

  - id: throw
    name: "THROW"
    doc: https://learn.microsoft.com/en-us/sql/t-sql/language-elements/throw-transact-sql
    tier: high
    probes:
      - id: with_arguments
        sql: "THROW 51000, 'The record does not exist.', 1;"
      - id: variables
        sql: "THROW @num, @msg, @state;"
      - id: rethrow_in_catch
        sql: "BEGIN TRY INSERT t (id) VALUES (1); END TRY BEGIN CATCH PRINT 'In catch block.'; THROW; END CATCH;"
      - id: after_statement_terminated
        sql: |-
          DECLARE @msg NVARCHAR(2048) = FORMATMESSAGE(60000, 500, N'First string', N'second string');
          THROW 60000, @msg, 1;
        note: "The statement before THROW must end with a semicolon; this mirrors the doc's FORMATMESSAGE example."
    examples:
      - "THROW 51000, 'The record does not exist.', 1;"

  - id: raiserror
    name: "RAISERROR"
    doc: https://learn.microsoft.com/en-us/sql/t-sql/language-elements/raiserror-transact-sql
    tier: high
    probes:
      - id: msg_id
        sql: "RAISERROR (15600, -1, -1, 'mysp_CreateCustomer');"
      - id: msg_str_arguments
        sql: "RAISERROR (N'This is message %s %d.', 10, 1, N'number', 5);"
      - id: variable_message
        sql: "RAISERROR (@StringVariable, 10, 1, N'abcde');"
      - id: with_log
        sql: "RAISERROR ('Error raised.', 16, 1) WITH LOG;"
      - id: with_options
        sql: "RAISERROR (N'Progress %d', 0, 1, @i) WITH NOWAIT, SETERROR;"
      - id: in_catch
        sql: "BEGIN TRY RAISERROR ('Error raised in TRY block.', 16, 1); END TRY BEGIN CATCH RAISERROR (@ErrorMessage, @ErrorSeverity, @ErrorState); END CATCH;"
    examples:
      - "RAISERROR (15600, -1, -1, 'mysp_CreateCustomer');"
      - |-
        RAISERROR (N'This is message %s %d.', -- Message text.
            10, -- Severity,
            1, -- State,
            N'number', -- First argument.
            5); -- Second argument.
        -- The message text returned is: This is message number 5.
      - |-
        BEGIN TRY
            -- RAISERROR with severity 11-19 will cause execution to
            -- jump to the CATCH block.
            RAISERROR ('Error raised in TRY block.', -- Message text.
                16, -- Severity.
                1 -- State.
            );
        END TRY
        BEGIN CATCH
            DECLARE @ErrorMessage NVARCHAR(4000);
            DECLARE @ErrorSeverity INT;
            DECLARE @ErrorState INT;

            SELECT
                @ErrorMessage = ERROR_MESSAGE(),
                @ErrorSeverity = ERROR_SEVERITY(),
                @ErrorState = ERROR_STATE();

            -- Use RAISERROR inside the CATCH block to return error
            -- information about the original error that caused
            -- execution to jump to the CATCH block.
            RAISERROR (@ErrorMessage, -- Message text.
                @ErrorSeverity, -- Severity.
                @ErrorState -- State.
            );
        END CATCH;

