      - "SELECT name, dept, age, CUME_DIST() OVER (PARTITION BY dept ORDER BY age RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS cume_dist FROM employees;"

  - id: c_window_named
    name: Named windows (WINDOW clause)
    doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-qry-select-named-window
    tier: high
    probes:
      - { id: over_name, sql: "SELECT avg(c) OVER w FROM t WINDOW w AS (ORDER BY e);" }
      - { id: over_name_parens, sql: "SELECT avg(c) OVER (w) FROM t WINDOW w AS (ORDER BY e);" }
      - { id: window_partition, sql: "SELECT sum(c) OVER w FROM t WINDOW w AS (PARTITION BY d);" }
      - { id: window_partition_order, sql: "SELECT sum(c) OVER w FROM t WINDOW w AS (PARTITION BY d ORDER BY e);" }
      - { id: window_frame, sql: "SELECT min(salary) OVER win FROM t WINDOW win AS (ORDER BY age ROWS BETWEEN 2 PRECEDING AND 2 FOLLOWING);" }
      - { id: window_empty, sql: "SELECT sum(c) OVER w FROM t WINDOW w AS ();" }
      - { id: window_multiple_defs, sql: "SELECT sum(c) OVER w1, rank() OVER w2 FROM t WINDOW w1 AS (PARTITION BY d), w2 AS (ORDER BY e);" }
      - { id: window_multiple_uses, sql: "SELECT avg(a) OVER w, min(b) OVER w, max(b) OVER w FROM t WINDOW w AS (ORDER BY e);" }
      - { id: window_distribute_sort, sql: "SELECT sum(c) OVER w FROM t WINDOW w AS (DISTRIBUTE BY d SORT BY e);" }
      - { id: window_with_group_by, sql: "SELECT d, sum(sum(c)) OVER w FROM t GROUP BY d WINDOW w AS (ORDER BY d);" }
      - { id: window_with_qualify, sql: "SELECT c FROM t WINDOW w AS (PARTITION BY d ORDER BY e) QUALIFY row_number() OVER w = 1;" }
    examples:
      - "SELECT round(avg(age) OVER win, 1) AS avgage, round(avg(salary) OVER win, 1) AS avgsalary, min(salary) OVER win AS minsalary, max(salary) OVER win AS maxsalary, count(1) OVER win AS numEmps FROM employees WINDOW win AS (ORDER BY age ROWS BETWEEN 2 PRECEDING AND 2 FOLLOWING);"

  - id: c_lambda_functions
