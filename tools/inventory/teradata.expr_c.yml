    doc: https://docs.teradata.com/reader/ka4q4xtYpyQGplkKwXaNBQ/5dXKsJR3oxWnBSMuUNhgng
    tier: high
    probes:
      - { id: abs_sign, sql: "SELECT ABS(x), SIGN(x) FROM t;" }
      - { id: ceiling_floor, sql: "SELECT CEILING(x), CEIL(x), FLOOR(x) FROM t;" }
      - { id: round_trunc, sql: "SELECT ROUND(x, 2), ROUND(x), TRUNC(x, 1), TRUNC(x) FROM t;" }
      - { id: exp_ln_log, sql: "SELECT EXP(x), LN(x), LOG(x) FROM t;" }
      - { id: power_sqrt, sql: "SELECT POWER(x, 2), SQRT(x) FROM t;" }
      - { id: mod_function, sql: "SELECT MOD(x, 3) FROM t;" }
      - { id: mod_operator, sql: "SELECT x MOD 3 FROM t;", note: "MOD is also a Teradata binary operator in the arithmetic operators topic" }
      - { id: random, sql: "SELECT RANDOM(1, 100) FROM t;" }
      - { id: trigonometric, sql: "SELECT COS(x), SIN(x), TAN(x), ACOS(x), ASIN(x), ATAN(x), ATAN2(x, y) FROM t;" }
