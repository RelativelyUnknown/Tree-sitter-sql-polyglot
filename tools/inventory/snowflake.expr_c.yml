      - id: iff
        sql: |-
          SELECT IFF(c > 0, 'pos', 'neg') FROM t;
      - id: coalesce_nvl
        sql: |-
          SELECT COALESCE(a, b, 0), NVL(a, 0), NVL2(a, 'set', 'unset'), IFNULL(a, 0), NULLIF(a, 0) FROM t;
      - id: zeroifnull_nullifzero
        sql: |-
          SELECT ZEROIFNULL(a), NULLIFZERO(a), EQUAL_NULL(a, b) FROM t;
      - id: decode
        sql: |-
          SELECT DECODE(c, 1, 'one', 2, 'two', 'other') FROM t;
      - id: greatest_least_booleans
        sql: |-
          SELECT GREATEST(a, b, c), LEAST(a, b, c), BOOLAND(a, b), BOOLOR(a, b), BOOLXOR(a, b), BOOLNOT(a) FROM t;
      - id: is_null_function
        sql: |-
          SELECT IS_NULL_VALUE(v), a IS DISTINCT FROM b, a IS NOT DISTINCT FROM b FROM t;
      - id: case_with_functions
        sql: |-
          SELECT CASE WHEN IFF(a > 0, TRUE, FALSE) THEN 'x' ELSE 'y' END FROM t;
      - id: regr_nvl_nested
        sql: |-
          SELECT NVL(NULLIF(TRIM(s), ''), 'n/a') FROM t;

  - id: c_function_family_hash_encryption_misc
    name: Hash, encryption, context and system function families
    doc: https://docs.snowflake.com/en/sql-reference/functions-hash-scalar
    tier: medium
    probes:
      - id: hash_functions
        sql: |-
          SELECT HASH(a, b), HASH(*), MD5(s), SHA1(s), SHA2(s, 256), MD5_HEX(s), SHA2_HEX(s, 512) FROM t;
      - id: encryption
        sql: |-
          SELECT ENCRYPT(s, 'pass'), DECRYPT(b, 'pass'), TRY_DECRYPT(b, 'pass'), ENCRYPT_RAW(b, k, iv) FROM t;
      - id: context_functions
        sql: |-
          SELECT CURRENT_USER(), CURRENT_ROLE(), CURRENT_DATABASE(), CURRENT_SCHEMA(), CURRENT_WAREHOUSE(), CURRENT_SESSION(), CURRENT_VERSION();
      - id: context_no_parens
        sql: |-
          SELECT CURRENT_USER, CURRENT_ROLE, CURRENT_DATABASE, CURRENT_SCHEMA;
      - id: system_functions
        sql: |-
          SELECT SYSTEM$TYPEOF(c), SYSTEM$WAIT(1), SYSTEM$CLUSTERING_INFORMATION('t', '(c)');
      - id: metadata_columns
        sql: |-
          SELECT METADATA$FILENAME, METADATA$FILE_ROW_NUMBER FROM @stage;
      - id: get_ddl
        sql: |-
          SELECT GET_DDL('TABLE', 't'), GET_DDL('VIEW', 'v', TRUE);
      - id: uuid_sequence
        sql: |-
          SELECT UUID_STRING(), UUID_STRING('fe971b24-9572-4005-b22f-351e9c09274d', 'name');

  - id: c_function_family_geospatial_vector
    name: Geospatial and vector function families
    doc: https://docs.snowflake.com/en/sql-reference/functions-geospatial
    tier: medium
    probes:
      - id: geography_constructors
        sql: |-
          SELECT ST_POINT(-122.35, 37.55), ST_MAKEPOINT(1, 2), ST_GEOGFROMTEXT('POINT(1 2)'), ST_MAKELINE(a, b), ST_POLYGON(l) FROM t;
      - id: geography_measures
        sql: |-
          SELECT ST_DISTANCE(a, b), ST_AREA(g), ST_LENGTH(g), ST_PERIMETER(g), ST_X(p), ST_Y(p) FROM t;
      - id: geography_predicates
        sql: |-
          SELECT ST_CONTAINS(a, b), ST_INTERSECTS(a, b), ST_WITHIN(a, b), ST_DWITHIN(a, b, 1000) FROM t;
      - id: geography_output
        sql: |-
          SELECT ST_ASTEXT(g), ST_ASGEOJSON(g), ST_ASWKB(g), ST_CENTROID(g), ST_BUFFER(g, 10) FROM t;
      - id: vector_similarity
        sql: |-
          SELECT VECTOR_COSINE_SIMILARITY(a, b), VECTOR_INNER_PRODUCT(a, b), VECTOR_L2_DISTANCE(a, b), VECTOR_L1_DISTANCE(a, b) FROM t;
      - id: vector_cast
        sql: |-
          SELECT [1.1, 2.2, 3]::VECTOR(FLOAT, 3), c::VECTOR(INT, 16) FROM t;

