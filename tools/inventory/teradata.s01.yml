        sql: "CREATE TABLE t (a INTEGER, b INTEGER) PRIMARY INDEX (a) PARTITION BY RANGE_N(b BETWEEN 1 AND 100 EACH 10) ADD 10;"
      - id: partition_by_column
        sql: "CREATE TABLE t (a INTEGER, b INTEGER) NO PRIMARY INDEX PARTITION BY COLUMN;"
      - id: partition_by_column_auto_compress
        sql: "CREATE TABLE t (a INTEGER, b INTEGER) NO PRIMARY INDEX PARTITION BY COLUMN NO AUTO COMPRESS;"
      - id: partition_by_column_groups
        sql: "CREATE TABLE t (a INTEGER, b INTEGER, c INTEGER) NO PRIMARY INDEX PARTITION BY COLUMN ((a, b), c);"
      - id: partition_by_column_all_but
        sql: "CREATE TABLE t (a INTEGER, b INTEGER, c INTEGER) NO PRIMARY INDEX PARTITION BY COLUMN ALL BUT ((a, b), ROW (c));"
      - id: partition_by_column_and_range
        sql: "CREATE TABLE t (a INTEGER, b INTEGER) NO PRIMARY INDEX PARTITION BY (COLUMN, RANGE_N(b BETWEEN 1 AND 10 EACH 1));"
      - id: unique_secondary_index
        sql: "CREATE TABLE t (a INTEGER, b INTEGER) PRIMARY INDEX (a) UNIQUE INDEX (b);"
      - id: unique_index_named_load_identity
        sql: "CREATE TABLE t (a INTEGER, b INTEGER) PRIMARY INDEX (a), UNIQUE INDEX ui1 (b) WITH NO LOAD IDENTITY;"
      - id: secondary_index
        sql: "CREATE TABLE t (a INTEGER, b INTEGER) PRIMARY INDEX (a) INDEX (b);"
      - id: secondary_index_all_order_by
        sql: "CREATE TABLE t (a INTEGER, b INTEGER) PRIMARY INDEX (a) INDEX ix1 ALL (b) ORDER BY VALUES (b);"
      - id: secondary_index_order_by_hash
        sql: "CREATE TABLE t (a INTEGER, b INTEGER) PRIMARY INDEX (a) INDEX (b) ORDER BY HASH (b);"
      - id: multiple_indexes
        sql: "CREATE TABLE t (a INTEGER, b INTEGER, c INTEGER) PRIMARY INDEX (a), INDEX (b), INDEX (c);"
      - id: on_commit_delete
        sql: "CREATE VOLATILE TABLE t (c INTEGER) PRIMARY INDEX (c) ON COMMIT DELETE ROWS;"
      - id: ct_abbreviation
        sql: "CT t (c INTEGER);"
      - id: as_table_with_data
        sql: "CREATE TABLE t2 AS t1 WITH DATA;"
      - id: as_table_with_no_data
        sql: "CREATE TABLE t2 AS t1 WITH NO DATA;"
      - id: as_table_with_data_and_statistics
        sql: "CREATE TABLE t2 AS t1 WITH DATA AND STATISTICS;"
      - id: as_table_with_no_data_and_no_statistics
        sql: "CREATE TABLE t2 AS t1 WITH NO DATA AND NO STATISTICS;"
      - id: as_subquery_with_data
        sql: "CREATE TABLE t2 AS (SELECT a, b FROM t1) WITH DATA;"
      - id: as_subquery_with_no_data
        sql: "CREATE TABLE t2 AS (SELECT a, b FROM t1) WITH NO DATA;"
      - id: as_subquery_column_list
        sql: "CREATE TABLE t2 (x, y) AS (SELECT a, b FROM t1) WITH DATA;"
      - id: as_subquery_table_kind
        sql: "CREATE MULTISET TABLE t2 AS (SELECT a, b FROM t1) WITH DATA PRIMARY INDEX (a);"
      - id: as_subquery_no_primary_index
        sql: "CREATE TABLE t2 AS (SELECT a, b FROM t1) WITH DATA NO PRIMARY INDEX;"
      - id: as_subquery_secondary_index
        sql: "CREATE TABLE t2 AS (SELECT a, b FROM t1) WITH NO DATA UNIQUE PRIMARY INDEX (a), INDEX (b);"
      - id: as_subquery_table_options
        sql: "CREATE TABLE t2, NO FALLBACK, CHECKSUM = DEFAULT AS (SELECT a, b FROM t1) WITH DATA;"
      - id: as_subquery_volatile_on_commit
        sql: "CREATE VOLATILE TABLE t2 AS (SELECT a, b FROM t1) WITH DATA ON COMMIT PRESERVE ROWS;"
      - id: as_subquery_named_expression
        sql: "CREATE TABLE t2 AS (SELECT a, b + 1 AS b1 FROM t1) WITH NO DATA;"
      - id: as_subquery_partition_by
        sql: "CREATE TABLE t2 AS (SELECT a, b FROM t1) WITH DATA PRIMARY INDEX (a) PARTITION BY RANGE_N(b BETWEEN 1 AND 100 EACH 10);"
      - id: as_subquery_column_container
        sql: "CREATE TABLE t2 (COLUMN (a), ROW (b)) AS (SELECT a, b FROM t1) WITH DATA NO PRIMARY INDEX;"
      - id: ct_as
        sql: "CT t2 AS t1 WITH DATA;"
    examples:
      - |-
        CREATE MULTISET TABLE test_m (
          i INTEGER)
        PRIMARY INDEX(i);
      - "CREATE TABLE test_m2 AS test_m WITH DATA;"
      - |-
        CREATE TABLE target AS (SELECT column_1, column_2
                                FROM source)
        WITH DATA
        PRIMARY INDEX (column_1);

