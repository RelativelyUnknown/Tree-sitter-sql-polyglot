dialect: spark
engine: Apache Spark SQL
version: "4.x (docs/latest)"
source: https://spark.apache.org/docs/latest/sql-ref-syntax.html

statements:
  - id: cluster_by_clause
    name: CLUSTER BY Clause
    doc: https://spark.apache.org/docs/latest/sql-ref-syntax-qry-select-clusterby.html
    tier: high
    probes:
      - id: single_expression
        sql: "SELECT c FROM t CLUSTER BY c;"
      - id: multiple_expressions
        sql: "SELECT a, b FROM t CLUSTER BY a, b;"
      - id: function_expression
        sql: "SELECT a, b FROM t CLUSTER BY a + 1, lower(b);"
    examples:
      - "SELECT age, name FROM person CLUSTER BY age;"

  - id: distribute_by_clause
    name: DISTRIBUTE BY Clause
    doc: https://spark.apache.org/docs/latest/sql-ref-syntax-qry-select-distribute-by.html
    tier: high
    probes:
      - id: single_expression
        sql: "SELECT c FROM t DISTRIBUTE BY c;"
      - id: multiple_expressions
        sql: "SELECT a, b FROM t DISTRIBUTE BY a, b;"
      - id: function_expression
        sql: "SELECT a, b FROM t DISTRIBUTE BY a + 1, lower(b);"
    examples:
      - "SELECT age, name FROM person DISTRIBUTE BY age;"
