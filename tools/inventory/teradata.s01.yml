        sql: "CREATE TABLE t (a INTEGER, b INTEGER, COLUMN (c INTEGER, d INTEGER) NO AUTO COMPRESS) NO PRIMARY INDEX;"
      - id: row_container
        sql: "CREATE TABLE t (a INTEGER, ROW (b INTEGER, c INTEGER)) NO PRIMARY INDEX;"
      - id: period_for
        sql: "CREATE TABLE t (id INTEGER, vs DATE, ve DATE, PERIOD FOR vt (vs, ve));"
      - id: normalize
        sql: "CREATE TABLE t (id INTEGER, duration PERIOD(DATE), NORMALIZE ON duration);"
      - id: normalize_all_but
        sql: "CREATE TABLE t (id INTEGER, duration PERIOD(DATE), NORMALIZE ALL BUT (id) ON duration ON MEETS OR OVERLAPS);"
      - id: data_types
        sql: "CREATE TABLE t (a BYTEINT, b SMALLINT, c BIGINT, d DECIMAL(10,2), e FLOAT, f NUMBER(10,2), g TIMESTAMP(6) WITH TIME ZONE, h INTERVAL DAY(2) TO SECOND(3), i CLOB(1M), j BLOB(2000), k PERIOD(TIMESTAMP(6) WITH TIME ZONE));"
      - id: json_xml_geometry
        sql: "CREATE TABLE t (j JSON(1M) INLINE LENGTH 30000 CHARACTER SET LATIN, x XML, g ST_GEOMETRY);"
