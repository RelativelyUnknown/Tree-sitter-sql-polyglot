  - id: execute_immediate
    name: "EXECUTE IMMEDIATE"
    doc: https://docs.snowflake.com/en/sql-reference/sql/execute-immediate
    tier: high
    probes:
      - { id: string_literal, sql: "EXECUTE IMMEDIATE 'SELECT PI()';" }
      - { id: dollar_block, sql: "EXECUTE IMMEDIATE $$ DECLARE r FLOAT; BEGIN r := 3; RETURN PI() * r * r; END; $$;" }
      - { id: session_variable, sql: "EXECUTE IMMEDIATE $stmt;" }
      - { id: using_binds, sql: "EXECUTE IMMEDIATE 'SELECT * FROM t WHERE a > ? AND a < ?' USING (lo, hi);" }
      - { id: variable_in_block, sql: "DECLARE v1 VARCHAR DEFAULT 'CREATE TABLE t1 (i INTEGER)'; BEGIN EXECUTE IMMEDIATE v1; RETURN 'ok'; END;" }
      - { id: resultset_from_execute_immediate, sql: "DECLARE rs RESULTSET; q VARCHAR DEFAULT 'SELECT * FROM t WHERE p > ?'; BEGIN rs := (EXECUTE IMMEDIATE :q USING (minimum_price)); RETURN TABLE(rs); END;" }
    examples:
      - "EXECUTE IMMEDIATE $stmt;"
      - |-
        EXECUTE IMMEDIATE $$
        DECLARE
          radius_of_circle FLOAT;
          area_of_circle FLOAT;
        BEGIN
          radius_of_circle := 3;
          area_of_circle := PI() * radius_of_circle * radius_of_circle;
          RETURN area_of_circle;
        END;
        $$
        ;
      - |-
        CREATE PROCEDURE execute_immediate_local_variable()
        RETURNS VARCHAR
        AS
        DECLARE
          v1 VARCHAR DEFAULT 'CREATE TABLE temporary1 (i INTEGER)';
          v2 VARCHAR DEFAULT 'INSERT INTO temporary1 (i) VALUES (76)';
          result INTEGER DEFAULT 0;
        BEGIN
          EXECUTE IMMEDIATE v1;
          EXECUTE IMMEDIATE v2  ||  ',(80)'  ||  ',(84)';
          result := (SELECT SUM(i) FROM temporary1);
          RETURN result::VARCHAR;
        END;
      - |-
        CREATE OR REPLACE PROCEDURE min_max_invoices_sp(
            minimum_price NUMBER(12,2),
            maximum_price NUMBER(12,2))
          RETURNS TABLE (id INTEGER, price NUMBER(12, 2))
          LANGUAGE SQL
        AS
        DECLARE
          rs RESULTSET;
          query VARCHAR DEFAULT 'SELECT * FROM invoices WHERE price > ? AND price < ?';
        BEGIN
          rs := (EXECUTE IMMEDIATE :query USING (minimum_price, maximum_price));
          RETURN TABLE(rs);
        END;

