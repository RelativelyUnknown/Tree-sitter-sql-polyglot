      spark:       { status: not-applicable, reason: "No transaction synonyms" }
      databricks:  { status: not-applicable, reason: "No transaction synonyms" }
      snowflake:   { status: not-applicable, reason: "No transaction synonyms" }
      bigquery:    { status: not-applicable, reason: "No transaction synonyms" }
      spanner:     { status: not-applicable, reason: "No transaction synonyms" }
      trino:       { status: not-applicable, reason: "No transaction synonyms" }
      athena:      { status: not-applicable, reason: "No transactions" }
      flink:       { status: not-applicable, reason: "No transactions" }
      clickhouse:  { status: not-applicable, reason: "No transaction synonyms" }
