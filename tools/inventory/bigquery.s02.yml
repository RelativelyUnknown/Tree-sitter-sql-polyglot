dialect: bigquery
engine: BigQuery GoogleSQL
version: "current"
source: https://cloud.google.com/bigquery/docs/reference/standard-sql/data-definition-language

statements:
  - id: create_capacity
    name: CREATE CAPACITY
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/data-definition-language#create_capacity_statement
    tier: low
    probes:
      - id: basic
        sql: "CREATE CAPACITY `admin_project.region-us.c` OPTIONS (slot_count = 100, plan = 'ANNUAL', edition = 'ENTERPRISE');"

  - id: create_reservation
    name: CREATE RESERVATION
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/data-definition-language#create_reservation_statement
    tier: low
    probes:
      - id: basic
        sql: "CREATE RESERVATION `admin_project.region-us.r` OPTIONS (slot_capacity = 100, ignore_idle_slots = false, edition = 'STANDARD');"

  - id: create_assignment
    name: CREATE ASSIGNMENT
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/data-definition-language#create_assignment_statement
    tier: low
    probes:
      - id: basic
        sql: "CREATE ASSIGNMENT `admin_project.region-us.r.a` OPTIONS (assignee = 'projects/p', job_type = 'QUERY');"

  - id: create_data_policy
    name: CREATE DATA_POLICY
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/data-definition-language#create_data_policy_statement
    tier: low
    probes:
      - id: basic
        sql: "CREATE DATA_POLICY `p.region-us.dp` OPTIONS (data_policy_type = 'DATA_MASKING_POLICY', masking_expression = 'SHA256');"
      - id: or_replace_if_not_exists
        sql: "CREATE OR REPLACE DATA_POLICY `p.region-us.dp` OPTIONS (data_policy_type = 'DATA_MASKING_POLICY', masking_expression = 'SHA256');"
      - id: if_not_exists
        sql: "CREATE DATA_POLICY IF NOT EXISTS `p.region-us.dp` OPTIONS (data_policy_type = 'RAW_DATA_ACCESS_POLICY');"

  - id: create_connection
    name: CREATE CONNECTION
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/data-definition-language#create_connection_statement
    tier: low
    probes:
      - id: basic
        sql: "CREATE CONNECTION IF NOT EXISTS `us.conn` OPTIONS (connection_type = 'CLOUD_RESOURCE', friendly_name = 'f', description = 'd');"

  - id: alter_organization_set_options
    name: ALTER ORGANIZATION SET OPTIONS
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/data-definition-language#alter_organization_set_options_statement
    tier: low
    probes:
      - id: basic
        sql: "ALTER ORGANIZATION SET OPTIONS (`region-us.default_time_zone` = 'America/Los_Angeles');"

  - id: alter_project_set_options
    name: ALTER PROJECT SET OPTIONS
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/data-definition-language#alter_project_set_options_statement
    tier: low
    probes:
      - id: basic
        sql: "ALTER PROJECT p SET OPTIONS (`region-us.default_time_zone` = 'America/Los_Angeles');"

  - id: alter_bi_capacity_set_options
    name: ALTER BI_CAPACITY SET OPTIONS
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/data-definition-language#alter_bi_capacity_set_options_statement
    tier: low
    probes:
      - id: basic
        sql: "ALTER BI_CAPACITY `p.region-us.default` SET OPTIONS (size_gb = 250, preferred_tables = ['ds.t']);"

  - id: alter_capacity_set_options
    name: ALTER CAPACITY SET OPTIONS
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/data-definition-language#alter_capacity_set_options_statement
    tier: low
    probes:
      - id: basic
        sql: "ALTER CAPACITY `admin_project.region-us.c` SET OPTIONS (plan = 'ANNUAL', renewal_plan = 'ANNUAL');"

  - id: alter_reservation_set_options
    name: ALTER RESERVATION SET OPTIONS
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/data-definition-language#alter_reservation_set_options_statement
    tier: low
    probes:
      - id: basic
        sql: "ALTER RESERVATION `admin_project.region-us.r` SET OPTIONS (slot_capacity = 200, ignore_idle_slots = true);"

  - id: alter_data_policy
    name: ALTER DATA_POLICY
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/data-definition-language#alter_data_policy_statement
    tier: low
    probes:
      - id: basic
        sql: "ALTER DATA_POLICY `p.region-us.dp` SET OPTIONS (data_policy_type = 'DATA_MASKING_POLICY', masking_expression = 'SHA256');"
      - id: if_exists
        sql: "ALTER DATA_POLICY IF EXISTS `p.region-us.dp` SET OPTIONS (data_policy_type = 'DATA_MASKING_POLICY', masking_expression = 'SHA256');"

  - id: alter_connection_set_options
    name: ALTER CONNECTION SET OPTIONS
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/data-definition-language#alter_connection_set_options_statement
    tier: low
    probes:
      - id: basic
        sql: "ALTER CONNECTION IF EXISTS `us.conn` SET OPTIONS (friendly_name = 'f', description = 'd');"

  - id: drop_capacity
    name: DROP CAPACITY
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/data-definition-language#drop_capacity_statement
    tier: low
    probes:
      - id: basic
        sql: "DROP CAPACITY IF EXISTS `admin_project.region-us.c`;"

  - id: drop_reservation
    name: DROP RESERVATION
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/data-definition-language#drop_reservation_statement
    tier: low
    probes:
      - id: basic
        sql: "DROP RESERVATION IF EXISTS `admin_project.region-us.r`;"

  - id: drop_assignment
    name: DROP ASSIGNMENT
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/data-definition-language#drop_assignment_statement
    tier: low
    probes:
      - id: basic
        sql: "DROP ASSIGNMENT IF EXISTS `admin_project.region-us.r.a`;"

  - id: drop_data_policy
    name: DROP DATA_POLICY
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/data-definition-language#drop_data_policy
    tier: low
    probes:
      - id: basic
        sql: "DROP DATA_POLICY IF EXISTS `p.region-us.dp`;"

  - id: drop_connection
    name: DROP CONNECTION
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/data-definition-language#drop_connection_statement
    tier: low
    probes:
      - id: basic
        sql: "DROP CONNECTION IF EXISTS `us.conn`;"

  - id: alter_model
    name: ALTER MODEL
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/bigqueryml-syntax-alter-model
    tier: low
    probes:
      - id: set_options
        sql: "ALTER MODEL IF EXISTS `p.ds.m` SET OPTIONS (description = 'd', labels = [('a', 'b')]);"

  - id: export_model
    name: EXPORT MODEL
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/bigqueryml-syntax-export-model
    tier: low
    probes:
      - id: basic
        sql: "EXPORT MODEL `p.ds.m` OPTIONS (URI = 'gs://bucket/path/to/saved_model/');"
      - id: trial_id
        sql: "EXPORT MODEL `p.ds.m` OPTIONS (URI = 'gs://bucket/path/to/saved_model/', TRIAL_ID = 12);"
