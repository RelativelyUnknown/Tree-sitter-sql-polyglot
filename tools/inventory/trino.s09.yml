dialect: trino
engine: Trino
version: "483"
source: https://trino.io/docs/current/sql.html

statements:
  - id: execute_immediate
    name: EXECUTE IMMEDIATE
    doc: https://trino.io/docs/current/sql/execute-immediate.html
    tier: high
    probes:
      - id: basic
        sql: "EXECUTE IMMEDIATE 'SELECT 1';"
      - id: using_one
        sql: "EXECUTE IMMEDIATE 'SELECT name FROM t WHERE c = ?' USING 1;"
      - id: using_multiple
        sql: "EXECUTE IMMEDIATE 'SELECT name FROM t WHERE a = ? AND b < ?' USING 1, 3;"
    examples:
      - "EXECUTE IMMEDIATE 'SELECT name FROM nation';"
      - "EXECUTE IMMEDIATE 'SELECT name FROM nation WHERE regionkey = ? and nationkey < ?' USING 1, 3;"

  - id: insert
    name: INSERT
    doc: https://trino.io/docs/current/sql/insert.html
    tier: high
    probes:
      - id: select
        sql: "INSERT INTO t SELECT * FROM s;"
      - id: values_single
        sql: "INSERT INTO t VALUES (1, 'a');"
      - id: values_multi
        sql: "INSERT INTO t VALUES (1, 'a'), (2, 'b');"
      - id: column_list
        sql: "INSERT INTO t (a, b) VALUES (1, 'a');"
      - id: column_list_select
        sql: "INSERT INTO t (a, b) SELECT x, y FROM s;"
      - id: qualified_name
        sql: "INSERT INTO cat.sch.t VALUES (1);"
      - id: branch
        sql: "INSERT INTO t @ audit VALUES (1, 'a');"
      - id: branch_column_list
        sql: "INSERT INTO t @ audit (a, b) VALUES (1, 'a');"
      - id: with_query
        sql: "INSERT INTO t WITH x AS (SELECT 1 AS a) SELECT a FROM x;"
    examples:
      - "INSERT INTO orders SELECT * FROM new_orders;"
      - "INSERT INTO nation (nationkey, name, regionkey, comment) VALUES (26, 'POLAND', 3, 'no comment');"
      - "INSERT INTO cities @ audit VALUES (1, 'San Francisco');"
