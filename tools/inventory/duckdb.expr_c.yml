      - { id: split_to_table, sql: "SELECT regexp_split_to_table('a b c', ' ');" }
      - { id: matches_in_where, sql: "SELECT * FROM t WHERE regexp_matches(s, '^a.*z$');" }

  - id: c_datetime_functions
    name: Date, time, timestamp and interval functions and operators
    doc: https://duckdb.org/docs/stable/sql/functions/timestamp
    tier: high
    probes:
      - { id: date_arithmetic, sql: "SELECT DATE '1992-03-22' + 5, DATE '1992-03-22' + INTERVAL 5 DAY, DATE '1992-03-27' - DATE '1992-03-22', DATE '1992-03-27' - INTERVAL 5 DAY;" }
      - { id: variable_interval, sql: "SELECT DATE '1992-03-22' + INTERVAL (d.days) DAY FROM (VALUES (5), (11)) d(days);" }
      - { id: timestamp_arithmetic, sql: "SELECT TIMESTAMP '1992-03-22 01:02:03' + INTERVAL 5 DAY, TIMESTAMP '1992-03-27' - TIMESTAMP '1992-03-22';" }
      - { id: interval_arithmetic, sql: "SELECT INTERVAL 1 HOUR + INTERVAL 30 MINUTE, INTERVAL 2 DAY * 3, INTERVAL 6 HOUR / 2;" }
      - { id: date_part_functions, sql: "SELECT date_part('minute', TIMESTAMP '1992-09-20 20:38:40'), datepart('year', d), date_trunc('month', d), dayname(d), monthname(d), year(d), month(d), day(d), dayofweek(d), last_day(d) FROM t;" }
      - { id: date_part_list, sql: "SELECT date_part(['year', 'month', 'day'], d) FROM t;" }
      - { id: date_diff_sub, sql: "SELECT date_diff('month', d1, d2), datediff('day', d1, d2), date_sub('hour', d1, d2), datesub('day', d1, d2), date_add(d, INTERVAL 1 DAY) FROM t;" }
      - { id: age, sql: "SELECT age(TIMESTAMP '2001-04-10', TIMESTAMP '1992-09-20'), age(ts) FROM t;" }
      - { id: constructors, sql: "SELECT make_date(2020, 1, 1), make_time(1, 2, 3.5), make_timestamp(2020, 1, 1, 0, 0, 0), make_timestamptz(2020, 1, 1, 0, 0, 0, 'UTC') FROM t;" }
      - { id: current_values, sql: "SELECT current_date, current_time, current_timestamp, now(), today(), get_current_timestamp(), transaction_timestamp();" }
      - { id: epoch_functions, sql: "SELECT epoch(ts), epoch_ms(ts), epoch_us(ts), epoch_ns(ts), to_timestamp(1284352323.5) FROM t;" }
      - { id: time_bucket, sql: "SELECT time_bucket(INTERVAL '2 days', ts), time_bucket(INTERVAL '2 days', ts, TIMESTAMP '2000-01-01') FROM t;" }
      - { id: strftime_strptime, sql: "SELECT strftime(ts, '%Y-%m-%d'), strptime('2020-01-01', '%Y-%m-%d'), try_strptime(s, '%Y-%m-%d') FROM t;" }
      - { id: infinity_checks, sql: "SELECT isfinite(d), isinf(d), greatest(d1, d2), least(d1, d2) FROM t;" }
      - { id: timezone_function, sql: "SELECT timezone('America/Denver', TIMESTAMP '2001-02-16 20:38:40');" }
      - { id: interval_functions, sql: "SELECT to_days(5), to_hours(2), to_minutes(30), to_months(3), to_years(1), to_seconds(1.5), epoch(INTERVAL 1 HOUR) FROM t;" }
      - { id: time_functions, sql: "SELECT date_part('minute', TIME '14:21:13'), date_diff('hour', TIME '01:02:03', TIME '06:01:03'), TIME '14:21:13' + INTERVAL 1 HOUR;" }
      - { id: generate_series_timestamps, sql: "SELECT generate_series(TIMESTAMP '2001-04-10', TIMESTAMP '2001-04-11', INTERVAL 30 MINUTE);" }

  - id: c_blob_bit_functions
