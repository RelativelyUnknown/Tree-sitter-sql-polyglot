name: Publish Packages
on:
  release:
    types: [published]

# Deny-by-default; each job grants only what it needs.
permissions: {}

jobs:
  # OIDC trusted publishing: no NPM_TOKEN exists anywhere. npm exchanges the
  # short-lived GitHub Actions OIDC token (id-token: write) for a publish
  # token scoped to this exact repo/workflow/run, valid for minutes only.
  # Requires a Trusted Publisher configured on npmjs.com for this package
  # (org=RelativelyUnknown, repo=tree-sitter-sql-extended, workflow=publish.yml).
  npm-publish:
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@relativelyunknown/tree-sitter-sql-extended
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      # OIDC trusted publishing needs npm CLI >=11.5.1; don't rely on whatever
      # ships with the setup-node version pin.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm publish --access public --provenance

  # Same OIDC pattern via crates-io-auth-action: no CARGO_REGISTRY_TOKEN
  # secret exists. Requires a Trusted Publisher linked on the crate's
  # crates.io settings page for this repo/workflow.
  cargo-publish:
    runs-on: ubuntu-latest
    environment:
      name: crates
      url: https://crates.io/crates/tree-sitter-sql-extended
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Generates src/parser.c (and friends), which bindings/rust/build.rs
      # compiles; cargo publish fails without it.
      - run: npm ci
      # actions-rs/toolchain is unmaintained (archived, no updates since
      # 2020) and a supply-chain liability; dtolnay/rust-toolchain is the
      # actively maintained replacement.
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # PyPI: tree-sitter's reusable workflow doesn't yet support OIDC trusted
  # publishing end-to-end (pypi/warehouse#11096), so this still needs a
  # stored PYPI_API_TOKEN. The reusable workflow's own `package` job runs
  # under the "pypi" GitHub Environment (environment-name input below), so
  # storing PYPI_API_TOKEN as an environment secret on "pypi" (not a bare
  # repo secret) gets it the same environment-protection benefits as the
  # other two jobs.
  pypi-publish:
    permissions:
      contents: read
    uses: tree-sitter/workflows/.github/workflows/package-pypi.yml@main
    with:
      python-version: 3.11
      generate: true
      environment-name: pypi
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
