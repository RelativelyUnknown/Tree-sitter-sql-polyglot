dialect: hive
engine: Apache Hive
version: "4.x"
source: https://hive.apache.org/docs/latest/language/languagemanual/

statements:
  - id: create_function
    name: CREATE FUNCTION
    doc: https://hive.apache.org/docs/latest/language/languagemanual-ddl/
    tier: high
    probes:
      - id: basic
        sql: "CREATE FUNCTION f AS 'com.example.Udf';"
      - id: qualified_name
        sql: "CREATE FUNCTION db.f AS 'com.example.Udf';"
      - id: using_jar
        sql: "CREATE FUNCTION f AS 'com.example.Udf' USING JAR 'hdfs:///path/udf.jar';"
      - id: using_file
        sql: "CREATE FUNCTION f AS 'com.example.Udf' USING FILE 'hdfs:///path/file.txt';"
      - id: using_archive
        sql: "CREATE FUNCTION f AS 'com.example.Udf' USING ARCHIVE 'hdfs:///path/a.zip';"
      - id: using_multiple
        sql: "CREATE FUNCTION f AS 'com.example.Udf' USING JAR 'hdfs:///a.jar', FILE 'hdfs:///b.txt', ARCHIVE 'hdfs:///c.zip';"

  - id: create_temporary_function
    name: CREATE TEMPORARY FUNCTION
    doc: https://hive.apache.org/docs/latest/language/languagemanual-ddl/
    tier: high
    probes:
      - id: basic
        sql: "CREATE TEMPORARY FUNCTION f AS 'com.example.Udf';"
