dialect: trino
engine: Trino
version: "483"
source: https://trino.io/docs/current/sql.html

statements:
  - id: set_session
    name: SET SESSION
    doc: https://trino.io/docs/current/sql/set-session.html
    tier: medium
    probes:
      - id: system_property
        sql: "SET SESSION name = 'v';"
      - id: catalog_property
        sql: "SET SESSION catalog.name = 1;"
    examples:
      - "SET SESSION query_max_run_time = '10m';"
      - "SET SESSION example.incremental_refresh_enabled = false;"

  - id: set_time_zone
    name: SET TIME ZONE
    doc: https://trino.io/docs/current/sql/set-time-zone.html
    tier: medium
    probes:
      - id: local
        sql: "SET TIME ZONE LOCAL;"
      - id: expression
        sql: "SET TIME ZONE 'UTC';"
      - id: interval_expression
        sql: "SET TIME ZONE INTERVAL '10' HOUR;"
    examples:
      - "SET TIME ZONE LOCAL;"
      - "SET TIME ZONE '-08:00';"
      - "SET TIME ZONE INTERVAL '10' HOUR;"

  - id: show_catalogs
    name: SHOW CATALOGS
    doc: https://trino.io/docs/current/sql/show-catalogs.html
    tier: medium
    probes:
      - id: basic
        sql: "SHOW CATALOGS;"
      - id: like
        sql: "SHOW CATALOGS LIKE 't%';"
    examples:
      - "SHOW CATALOGS LIKE 't%';"

  - id: show_columns
    name: SHOW COLUMNS
    doc: https://trino.io/docs/current/sql/show-columns.html
    tier: medium
    probes:
      - id: from_table
        sql: "SHOW COLUMNS FROM t;"
      - id: like
        sql: "SHOW COLUMNS FROM t LIKE '%key';"
    examples:
      - "SHOW COLUMNS FROM nation;"
      - "SHOW COLUMNS FROM nation LIKE '%key';"

  - id: show_create_function
    name: SHOW CREATE FUNCTION
    doc: https://trino.io/docs/current/sql/show-create-function.html
    tier: medium
    probes:
      - id: basic
        sql: "SHOW CREATE FUNCTION f;"
      - id: qualified
        sql: "SHOW CREATE FUNCTION c.s.f;"
    examples:
      - "SHOW CREATE FUNCTION example.default.meaning_of_life;"

  - id: show_create_materialized_view
    name: SHOW CREATE MATERIALIZED VIEW
    doc: https://trino.io/docs/current/sql/show-create-materialized-view.html
    tier: medium
    probes:
      - id: basic
        sql: "SHOW CREATE MATERIALIZED VIEW v;"
      - id: qualified
        sql: "SHOW CREATE MATERIALIZED VIEW c.s.v;"

  - id: show_create_schema
    name: SHOW CREATE SCHEMA
    doc: https://trino.io/docs/current/sql/show-create-schema.html
    tier: medium
    probes:
      - id: basic
        sql: "SHOW CREATE SCHEMA s;"
      - id: qualified
        sql: "SHOW CREATE SCHEMA c.s;"

  - id: show_create_table
    name: SHOW CREATE TABLE
    doc: https://trino.io/docs/current/sql/show-create-table.html
    tier: medium
    probes:
      - id: basic
        sql: "SHOW CREATE TABLE t;"
      - id: qualified
        sql: "SHOW CREATE TABLE c.s.t;"
    examples:
      - "SHOW CREATE TABLE sf1.orders;"

  - id: show_create_view
    name: SHOW CREATE VIEW
    doc: https://trino.io/docs/current/sql/show-create-view.html
    tier: medium
    probes:
      - id: basic
        sql: "SHOW CREATE VIEW v;"
      - id: qualified
        sql: "SHOW CREATE VIEW c.s.v;"

  - id: show_functions
    name: SHOW FUNCTIONS
    doc: https://trino.io/docs/current/sql/show-functions.html
    tier: medium
    probes:
      - id: basic
        sql: "SHOW FUNCTIONS;"
      - id: from_schema
        sql: "SHOW FUNCTIONS FROM c.s;"
      - id: like
        sql: "SHOW FUNCTIONS LIKE 'array%';"
      - id: from_like
        sql: "SHOW FUNCTIONS FROM c.s LIKE 'a%';"
    examples:
      - "SHOW FUNCTIONS FROM example.default;"
      - "SHOW FUNCTIONS LIKE 'array%';"
      - "SHOW FUNCTIONS LIKE 'cf%';"
