      - { id: local_variable, sql: "CREATE PROCEDURE p(increment INT) BEGIN DECLARE counter INT DEFAULT 0; SET counter = counter + increment; END;" }
      - { id: global, sql: "SET GLOBAL max_connections = 1000;" }
      - { id: global_at_at, sql: "SET @@GLOBAL.max_connections = 1000;" }
      - { id: session, sql: "SET SESSION sql_mode = 'TRADITIONAL';" }
      - { id: local_keyword, sql: "SET LOCAL sql_mode = 'TRADITIONAL';" }
      - { id: session_at_at, sql: "SET @@SESSION.sql_mode = 'TRADITIONAL';" }
      - { id: local_at_at, sql: "SET @@LOCAL.sql_mode = 'TRADITIONAL';" }
      - { id: at_at_bare, sql: "SET @@sql_mode = 'TRADITIONAL';" }
      - { id: bare_system_variable, sql: "SET sql_mode = 'TRADITIONAL';" }
      - { id: persist, sql: "SET PERSIST max_connections = 1000;" }
      - { id: persist_at_at, sql: "SET @@PERSIST.max_connections = 1000;" }
      - { id: persist_only, sql: "SET PERSIST_ONLY back_log = 100;" }
      - { id: persist_only_at_at, sql: "SET @@PERSIST_ONLY.back_log = 100;" }
      - { id: default_value, sql: "SET @@SESSION.max_join_size = DEFAULT;" }
      - { id: from_global, sql: "SET @@SESSION.max_join_size = @@GLOBAL.max_join_size;" }
      - { id: mixed_scopes, sql: "SET @x = 1, SESSION sql_mode = '';" }
      - { id: on_off_values, sql: "SET GLOBAL general_log = ON, SESSION autocommit = OFF;" }
    examples:
      - "SET @total_tax = (SELECT SUM(tax) FROM taxable_transactions);"
