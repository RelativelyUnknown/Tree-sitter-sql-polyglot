      - { id: select_as, sql: "SELECT c AS alias_name FROM t;" }
      - { id: select_as_no_keyword, sql: "SELECT c alias_name FROM t;" }
      - { id: column_format, sql: "CREATE TABLE t (c DATE FORMAT 'YYYY-MM-DD');" }
      - { id: column_title, sql: "CREATE TABLE t (c INTEGER TITLE 'My Col');" }
      - { id: column_named, sql: "CREATE TABLE t (c INTEGER NAMED n);" }
      - { id: default_value, sql: "CREATE TABLE t (c INTEGER DEFAULT 0);" }
      - { id: default_user, sql: "CREATE TABLE t (c VARCHAR(30) DEFAULT USER);" }
      - { id: default_date, sql: "CREATE TABLE t (c DATE DEFAULT DATE);" }
      - { id: default_time, sql: "CREATE TABLE t (c TIME DEFAULT TIME);" }
      - { id: default_null, sql: "CREATE TABLE t (c INTEGER DEFAULT NULL);" }
      - { id: with_default, sql: "CREATE TABLE t (c INTEGER WITH DEFAULT);" }
