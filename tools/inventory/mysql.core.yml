      - { id: low_priority_ignore, sql: "UPDATE LOW_PRIORITY IGNORE t SET a = 1;" }
      - { id: table_alias, sql: "UPDATE t AS x SET x.a = 1 WHERE x.b = 2;" }
      - { id: partition, sql: "UPDATE t PARTITION (p0) SET a = 1 WHERE b = 2;" }
