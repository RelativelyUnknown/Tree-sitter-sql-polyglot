dialect: hana
engine: SAP HANA Platform
version: "2.0 SPS 08 (2.0.08)"
source: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/3bc1a0d4611d40c4a6e3fc7c8e80395d.html?version=2.0.08

statements:
  - id: alter_procedure
    name: ALTER PROCEDURE
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/20d0328875191014964a9059637c7f5f.html?version=2.0.08
    tier: high
    probes:
      - id: recompile
        sql: "ALTER PROCEDURE p RECOMPILE;"
      - id: encryption_on
        sql: "ALTER PROCEDURE p ENCRYPTION ON;"
      - id: redefine_body
        sql: "ALTER PROCEDURE p AS BEGIN SELECT 1 FROM DUMMY; END;"
      - id: redefine_schema_qualified
        sql: "ALTER PROCEDURE s.p AS BEGIN SELECT 1 FROM DUMMY; END;"
      - id: parameters
        sql: "ALTER PROCEDURE p (IN a INT, OUT b INT) AS BEGIN b = :a + 1; END;"
      - id: parameters_inout_default_array
        sql: "ALTER PROCEDURE p (IN a INT DEFAULT 1, INOUT b VARCHAR(10), IN c INT ARRAY) AS BEGIN SELECT 1 FROM DUMMY; END;"
      - id: table_type_parameters
        sql: "ALTER PROCEDURE p (IN t1 TABLE (a INT, b VARCHAR(10)), OUT t2 TABLE (a INT)) AS BEGIN t2 = SELECT a FROM :t1; END;"
      - id: any_table_parameter
        sql: "ALTER PROCEDURE p (IN itab TABLE(...), OUT otab TABLE(...)) AS BEGIN otab = SELECT * FROM :itab; END;"
      - id: language
        sql: "ALTER PROCEDURE p LANGUAGE SQLSCRIPT AS BEGIN SELECT 1 FROM DUMMY; END;"
      - id: sql_security_definer
        sql: "ALTER PROCEDURE p SQL SECURITY DEFINER AS BEGIN SELECT 1 FROM DUMMY; END;"
      - id: sql_security_invoker
        sql: "ALTER PROCEDURE p SQL SECURITY INVOKER AS BEGIN SELECT 1 FROM DUMMY; END;"
      - id: default_schema
        sql: "ALTER PROCEDURE p DEFAULT SCHEMA s AS BEGIN SELECT 1 FROM DUMMY; END;"
      - id: reads_sql_data
        sql: "ALTER PROCEDURE p READS SQL DATA AS BEGIN SELECT 1 FROM DUMMY; END;"
      - id: deterministic
        sql: "ALTER PROCEDURE p DETERMINISTIC AS BEGIN SELECT 1 FROM DUMMY; END;"
      - id: with_encryption
        sql: "ALTER PROCEDURE p WITH ENCRYPTION AS BEGIN SELECT 1 FROM DUMMY; END;"
      - id: autocommit_ddl_on
        sql: "ALTER PROCEDURE p AUTOCOMMIT DDL ON AS BEGIN SELECT 1 FROM DUMMY; END;"
      - id: autocommit_ddl_off
        sql: "ALTER PROCEDURE p AUTOCOMMIT DDL OFF AS BEGIN SELECT 1 FROM DUMMY; END;"
      - id: sequential_execution
        sql: "ALTER PROCEDURE p AS BEGIN SEQUENTIAL EXECUTION SELECT 1 FROM DUMMY; END;"
      - id: combined_options
        sql: "ALTER PROCEDURE p (IN a INT) LANGUAGE SQLSCRIPT SQL SECURITY INVOKER DEFAULT SCHEMA s READS SQL DATA AS BEGIN SELECT :a FROM DUMMY; END;"
      - id: add_variable_cache
        sql: "ALTER PROCEDURE p ADD VARIABLE CACHE ON x ENABLE;"
      - id: add_variable_cache_list
        sql: "ALTER PROCEDURE p ADD VARIABLE CACHE ON x ENABLE, y DISABLE;"
      - id: alter_variable_cache
        sql: "ALTER PROCEDURE p ALTER VARIABLE CACHE ON x DISABLE;"
      - id: drop_variable_cache
        sql: "ALTER PROCEDURE p DROP VARIABLE CACHE ON x;"
      - id: drop_variable_cache_all
        sql: "ALTER PROCEDURE p DROP VARIABLE CACHE ALL;"
    examples:
      - "ALTER PROCEDURE my_proc RECOMPILE;"
      - "ALTER PROCEDURE test_result_cache ADD VARIABLE CACHE ON X ENABLE;"

  - id: alter_table
    name: ALTER TABLE
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/20d329a6751910149d5fdbc4800f92ff.html?version=2.0.08
    tier: high
    probes:
      - id: add_column
        sql: "ALTER TABLE t ADD (d NVARCHAR(10));"
      - id: add_column_default
        sql: "ALTER TABLE t ADD (d NVARCHAR(10) DEFAULT 'x');"
      - id: add_columns_multiple
        sql: "ALTER TABLE t ADD (d INT, e VARCHAR(5));"
      - id: add_column_not_null
        sql: "ALTER TABLE t ADD (d INT NOT NULL DEFAULT 0);"
      - id: add_column_online
        sql: "ALTER TABLE t ADD (d INT) ONLINE;"
      - id: add_column_online_preferred
        sql: "ALTER TABLE t ADD (d INT) ONLINE PREFERRED;"
      - id: add_column_comment
        sql: "ALTER TABLE t ADD (d INT COMMENT 'note');"
      - id: add_column_generated_expression
        sql: "ALTER TABLE t ADD (d INT GENERATED ALWAYS AS a + 1);"
      - id: add_column_identity
        sql: "ALTER TABLE t ADD (b INT GENERATED ALWAYS AS IDENTITY (START WITH 100 INCREMENT BY 10));"
      - id: add_column_identity_by_default
        sql: "ALTER TABLE t ADD (b INT GENERATED BY DEFAULT AS IDENTITY);"
      - id: add_column_calculated
        sql: "ALTER TABLE t ADD (d INT AS a + 1);"
      - id: add_column_references
        sql: "ALTER TABLE t ADD (d INT REFERENCES r (id));"
      - id: add_column_load_unit
        sql: "ALTER TABLE t ADD (d INT PAGE LOADABLE);"
      - id: add_column_fuzzy_search_index
        sql: "ALTER TABLE t ADD (d VARCHAR(10) FUZZY SEARCH INDEX ON);"
      - id: add_column_clientside_encryption
        sql: "ALTER TABLE t ADD (d INT CLIENTSIDE ENCRYPTION ON WITH cek RANDOM);"
        note: column_specification in the syntax block takes CLIENTSIDE ENCRYPTION ON WITH <column_encryption_key_name> [RANDOM | DETERMINISTIC]
      - id: alter_column_default
        sql: "ALTER TABLE t ALTER (b INT DEFAULT 10);"
      - id: alter_columns_multiple
        sql: "ALTER TABLE t ALTER (a INT NOT NULL, b VARCHAR(20));"
      - id: alter_column_online
        sql: "ALTER TABLE t ALTER (b BIGINT) ONLINE;"
      - id: alter_column_load_unit
        sql: "ALTER TABLE t ALTER (c3 VARCHAR(80) COLUMN LOADABLE, c6 ALTER PAGE LOADABLE);"
      - id: alter_column_fuzzy_search_index_off
        sql: "ALTER TABLE t ALTER (c VARCHAR(10) FUZZY SEARCH INDEX OFF);"
      - id: alter_column_fuzzy_search_mode
        sql: "ALTER TABLE t ALTER (c NVARCHAR(10) FUZZY SEARCH MODE NULL);"
      - id: drop_column
        sql: "ALTER TABLE t DROP (a);"
      - id: drop_columns_multiple
        sql: "ALTER TABLE t DROP (a, b);"
      - id: drop_column_online
        sql: "ALTER TABLE t DROP (a) ONLINE;"
      - id: add_primary_key
        sql: "ALTER TABLE t ADD PRIMARY KEY (c, d);"
      - id: add_primary_key_inverted
        sql: "ALTER TABLE t ADD PRIMARY KEY INVERTED HASH (c);"
      - id: add_primary_key_using_index
        sql: "ALTER TABLE t ADD PRIMARY KEY USING INDEX idx;"
      - id: drop_primary_key
        sql: "ALTER TABLE t DROP PRIMARY KEY;"
      - id: primary_key_update_on
        sql: "ALTER TABLE t PRIMARY KEY UPDATE ON;"
      - id: primary_key_update_off
        sql: "ALTER TABLE t PRIMARY KEY UPDATE OFF;"
      - id: add_constraint_primary_key
        sql: "ALTER TABLE t ADD CONSTRAINT prim_key PRIMARY KEY (a, b);"
      - id: add_constraint_unique
        sql: "ALTER TABLE t ADD CONSTRAINT uq UNIQUE (a);"
      - id: add_constraint_foreign_key
        sql: "ALTER TABLE t ADD CONSTRAINT fk FOREIGN KEY (a) REFERENCES r (id);"
      - id: add_constraint_foreign_key_actions
        sql: "ALTER TABLE t ADD CONSTRAINT fk FOREIGN KEY (a) REFERENCES r (id) ON UPDATE CASCADE ON DELETE SET NULL;"
      - id: add_constraint_check
        sql: "ALTER TABLE t ADD CONSTRAINT ck CHECK (a > 0);"
      - id: add_constraint_unnamed
        sql: "ALTER TABLE t ADD UNIQUE (a);"
      - id: drop_constraint
        sql: "ALTER TABLE t DROP CONSTRAINT uq;"
      - id: alter_constraint_enforced
        sql: "ALTER TABLE t ALTER CONSTRAINT fk NOT ENFORCED;"
      - id: alter_constraint_validated
        sql: "ALTER TABLE t ALTER CONSTRAINT fk VALIDATED;"
      - id: convert_primary_key_index_type
        sql: "ALTER TABLE t ALTER PRIMARY KEY INVERTED HASH;"
      - id: convert_primary_key_index_type_online
        sql: "ALTER TABLE t ALTER PRIMARY KEY INVERTED VALUE ONLINE PREFERRED;"
      - id: convert_unique_constraint_index_type
        sql: "ALTER TABLE t ALTER CONSTRAINT uq UNIQUE INVERTED INDIVIDUAL;"
      - id: preload_all
        sql: "ALTER TABLE t PRELOAD ALL;"
      - id: preload_columns
        sql: "ALTER TABLE t PRELOAD (b, c);"
      - id: preload_none
        sql: "ALTER TABLE t PRELOAD NONE;"
      - id: convert_to_column
        sql: "ALTER TABLE t COLUMN;"
      - id: convert_to_row
        sql: "ALTER TABLE t ALTER TYPE ROW;"
      - id: convert_to_column_threads_batch
        sql: "ALTER TABLE t ALTER TYPE COLUMN THREADS 4 BATCH 100000;"
      - id: convert_to_row_threads
        sql: "ALTER TABLE t ROW THREADS 4;"
      - id: lob_reorganize
        sql: "ALTER TABLE t LOB REORGANIZE;"
      - id: lob_reorganize_columns_online
        sql: "ALTER TABLE t LOB REORGANIZE (c1, c2) ONLINE PREFERRED;"
      - id: clear_column_join_data_statistics
        sql: "ALTER TABLE t CLEAR COLUMN JOIN DATA STATISTICS;"
      - id: add_association
        sql: "ALTER TABLE t ADD ASSOCIATION (MANY TO ONE JOIN r AS assoc ON t.a = r.a WITH DEFAULT FILTER r.b = 1);"
        note: association_def syntax block ([join_cardinality] JOIN <table_name> [AS id] ON <predicate> WITH DEFAULT FILTER <predicate>)
      - id: drop_association
        sql: "ALTER TABLE t DROP ASSOCIATION assoc;"
      - id: with_annotations_set
        sql: "ALTER TABLE t WITH ANNOTATIONS (SET 'k'='v');"
      - id: with_annotations_unset_column
        sql: "ALTER TABLE t WITH ANNOTATIONS (COLUMN c UNSET 'k');"
      - id: add_system_versioning_history_table
        sql: "ALTER TABLE t ADD SYSTEM VERSIONING HISTORY TABLE h;"
      - id: add_system_versioning_validated
        sql: "ALTER TABLE t ADD SYSTEM VERSIONING HISTORY TABLE h NOT VALIDATED;"
      - id: drop_system_versioning
        sql: "ALTER TABLE t DROP SYSTEM VERSIONING;"
      - id: add_row_start_column
        sql: "ALTER TABLE t ADD (valid_from TIMESTAMP NOT NULL GENERATED ALWAYS AS ROW START);"
      - id: add_row_end_column
        sql: "ALTER TABLE t ADD (valid_to TIMESTAMP NOT NULL GENERATED ALWAYS AS ROW END);"
      - id: convert_column_to_row_start
        sql: "ALTER TABLE t ALTER (valid_from TIMESTAMP NOT NULL GENERATED ALWAYS AS ROW START);"
      - id: add_period_system_time
        sql: "ALTER TABLE t ADD PERIOD FOR SYSTEM_TIME (valid_from, valid_to);"
      - id: drop_period_system_time
        sql: "ALTER TABLE t DROP PERIOD FOR SYSTEM_TIME;"
      - id: add_period_application_time
        sql: "ALTER TABLE t ADD PERIOD FOR APPLICATION_TIME (valid_from, valid_to);"
      - id: drop_period_application_time
        sql: "ALTER TABLE t DROP PERIOD FOR APPLICATION_TIME;"
      - id: table_load_unit
        sql: "ALTER TABLE t PAGE LOADABLE;"
      - id: table_load_unit_cascade
        sql: "ALTER TABLE t COLUMN LOADABLE CASCADE;"
      - id: table_load_unit_default
        sql: "ALTER TABLE t DEFAULT LOADABLE;"
      - id: persistent_memory
        sql: "ALTER TABLE t PERSISTENT MEMORY ON;"
      - id: persistent_memory_deferred_cascade
        sql: "ALTER TABLE t PERSISTENT MEMORY DEFAULT DEFERRED CASCADE;"
      - id: partition_by_hash
        sql: "ALTER TABLE t PARTITION BY HASH (a) PARTITIONS 4;"
        note: partition clauses are on separate pages (Non-heterogeneous / Heterogeneous Alter Partition Clauses); probes written from the examples on the ALTER TABLE page
      - id: partition_by_range
        sql: "ALTER TABLE t PARTITION BY RANGE (c1) (PARTITION '0' <= VALUES < '10', PARTITION OTHERS);"
      - id: add_range_partition
        sql: "ALTER TABLE t ADD RANGE (c1) (PARTITION '0' <= VALUES < '10', PARTITION OTHERS PERSISTENT MEMORY ON DEFERRED);"
      - id: alter_partition_persistent_memory
        sql: "ALTER TABLE t ALTER PARTITION 10 PERSISTENT MEMORY DEFAULT;"
      - id: merge_partitions
        sql: "ALTER TABLE t MERGE PARTITIONS;"
        note: syntax page unreachable (partition clause page not read); form from the documented description
      - id: add_replica
        sql: "ALTER TABLE s.t ADD ASYNCHRONOUS REPLICA;"
      - id: add_replica_row_columns
        sql: "ALTER TABLE s.t ADD SYNCHRONOUS ROW REPLICA (a, b);"
      - id: add_replica_at_location
        sql: "ALTER TABLE s.t ADD REPLICA AT 'hostb:30301';"
      - id: add_replica_partition_by
        sql: "ALTER TABLE s.t ADD REPLICA PARTITION BY HASH (c2) PARTITIONS 8;"
      - id: alter_replica_set_group
        sql: "ALTER TABLE s.t ALTER REPLICA SET GROUP NAME g1 CASCADE AT 'hostb:30301';"
      - id: alter_replica_unset_group
        sql: "ALTER TABLE s.t ALTER REPLICA UNSET GROUP;"
      - id: alter_replica_unset_group_lead
        sql: "ALTER TABLE s.t ALTER REPLICA UNSET GROUP LEAD AT 'hostb:30301';"
      - id: drop_replica_all_locations
        sql: "ALTER TABLE s.t DROP REPLICA AT ALL LOCATIONS;"
      - id: drop_replica_at_location
        sql: "ALTER TABLE s.t DROP REPLICA AT 'hostb:30301';"
      - id: enable_replica
        sql: "ALTER TABLE s.t ENABLE ASYNCHRONOUS REPLICA;"
      - id: disable_replica_partition
        sql: "ALTER TABLE s.t DISABLE REPLICA PARTITION 2;"
      - id: move_replica
        sql: "ALTER TABLE t MOVE REPLICA FROM LOCATION 'hosta:30301' TO LOCATION 'hostb:30301';"
      - id: set_replica_source
        sql: "ALTER TABLE t SET REPLICA SOURCE AT 'hosta:30301';"
      - id: enable_delta_log
        sql: "ALTER TABLE t ENABLE DELTA LOG;"
      - id: disable_delta_log
        sql: "ALTER TABLE t DISABLE DELTA LOG;"
      - id: enable_automerge
        sql: "ALTER TABLE t ENABLE AUTOMERGE;"
      - id: disable_automerge
        sql: "ALTER TABLE t DISABLE AUTOMERGE;"
      - id: unload_priority
        sql: "ALTER TABLE t UNLOAD PRIORITY 2;"
      - id: enable_schema_flexibility
        sql: "ALTER TABLE t ENABLE SCHEMA FLEXIBILITY;"
      - id: disable_schema_flexibility
        sql: "ALTER TABLE t DISABLE SCHEMA FLEXIBILITY;"
      - id: alter_schema_flexibility
        sql: "ALTER TABLE t ALTER SCHEMA FLEXIBILITY DEFAULT DATA TYPE ALPHANUM;"
        note: flexibility options live in the CREATE TABLE WITH SCHEMA FLEXIBILITY section; syntax page unreachable for the exact option list
      - id: enable_trigger
        sql: "ALTER TABLE t ENABLE TRIGGER;"
      - id: disable_named_trigger
        sql: "ALTER TABLE t DISABLE TRIGGER trg;"
      - id: set_group_type_name
        sql: "ALTER TABLE t SET GROUP TYPE group_type1 GROUP NAME group_name1;"
      - id: set_group_subtype
        sql: "ALTER TABLE t SET GROUP SUBTYPE sub1;"
      - id: set_group_lead
        sql: "ALTER TABLE t SET GROUP LEAD;"
      - id: unset_group
        sql: "ALTER TABLE t UNSET GROUP;"
      - id: set_row_order
        sql: "ALTER TABLE t SET ROW ORDER (a, b);"
      - id: set_row_order_by_value
        sql: "ALTER TABLE t SET ROW ORDER BY VALUE (a);"
      - id: unset_row_order
        sql: "ALTER TABLE t UNSET ROW ORDER;"
      - id: unused_retention_period
        sql: "ALTER TABLE t UNUSED RETENTION PERIOD 3600;"
      - id: unused_retention_period_list
        sql: "ALTER TABLE t UNUSED RETENTION PERIOD (3600, 7200);"
      - id: reclaim_data_space
        sql: "ALTER TABLE t RECLAIM DATA SPACE;"
      - id: series_reorganize
        sql: "ALTER TABLE t SERIES REORGANIZE;"
      - id: series_reorganize_part_limit
        sql: "ALTER TABLE t SERIES REORGANIZE PART 1 LIMIT 1000;"
      - id: owner_to
        sql: "ALTER TABLE t OWNER TO u;"
      - id: add_mask
        sql: "ALTER TABLE t ADD MASK (c USING 'xxx');"
      - id: add_default_mask
        sql: "ALTER TABLE t ADD DEFAULT MASK (c USING 'xxx');"
      - id: add_session_user_mask
        sql: "ALTER TABLE t ADD SESSION USER MASK (c USING SUBSTRING(c, 1, 2));"
      - id: alter_mask
        sql: "ALTER TABLE t ALTER MASK (c USING 'yyy');"
      - id: drop_mask
        sql: "ALTER TABLE t DROP MASK (c);"
      - id: continue_clientside_encryption
        sql: "ALTER TABLE t CONTINUE CLIENTSIDE ENCRYPTION;"
      - id: cancel_clientside_encryption
        sql: "ALTER TABLE t CANCEL CLIENTSIDE ENCRYPTION;"
      - id: alter_column_clientside_encryption_off
        sql: "ALTER TABLE t ALTER (c ALTER CLIENTSIDE ENCRYPTION OFF);"
      - id: alter_column_clientside_encryption_on
        sql: "ALTER TABLE t ALTER (c ALTER CLIENTSIDE ENCRYPTION ( ON WITH cek DETERMINISTIC ));"
      - id: set_movable
        sql: "ALTER TABLE t SET MOVABLE;"
      - id: set_not_movable
        sql: "ALTER TABLE t SET NOT MOVABLE;"
      - id: numa_node_list
        sql: "ALTER TABLE t NUMA NODE (1, 3 TO 5);"
      - id: numa_node_null_deferred
        sql: "ALTER TABLE t NUMA NODE NULL DEFERRED;"
    examples:
      - "ALTER TABLE t ALTER (b INT DEFAULT 10);"
      - "ALTER TABLE t ADD (d NVARCHAR(10) DEFAULT 'NCHAR');"
      - "ALTER TABLE t DROP PRIMARY KEY;"
