  - id: plsql_return_statement
    name: PL/SQL RETURN statement
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/lnpls/RETURN-statement.html
    tier: high
    probes:
      - id: return_expression_in_function
        sql: "DECLARE FUNCTION f (a NUMBER) RETURN NUMBER IS BEGIN RETURN a * a; END; BEGIN NULL; END;"
      - id: return_parenthesized
        sql: "DECLARE FUNCTION f RETURN NUMBER IS v NUMBER := 1; BEGIN RETURN(v); END; BEGIN NULL; END;"
      - id: return_in_procedure
        sql: "DECLARE PROCEDURE p IS BEGIN IF x > 0 THEN RETURN; END IF; END; BEGIN p; END;"
      - id: return_in_anonymous_block
        sql: "BEGIN IF x > 0 THEN RETURN; END IF; x := 1; END;"

  - id: plsql_cursor_for_loop
    name: PL/SQL cursor FOR LOOP statement
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/lnpls/cursor-FOR-LOOP-statement.html
    tier: high
    probes:
      - id: implicit_cursor
        sql: "BEGIN FOR r IN (SELECT c, d FROM t WHERE d > 0 ORDER BY c) LOOP x := r.c; END LOOP; END;"
      - id: explicit_cursor
        sql: "DECLARE CURSOR c1 IS SELECT c FROM t; BEGIN FOR r IN c1 LOOP NULL; END LOOP; END;"
      - id: explicit_cursor_parameters
        sql: "DECLARE CURSOR c1 (j VARCHAR2, w NUMBER) IS SELECT * FROM t WHERE job = j AND sal > w; BEGIN FOR r IN c1('CLERK', 3000) LOOP NULL; END LOOP; END;"
      - id: labeled
        sql: "BEGIN <<l>> FOR r IN (SELECT c FROM t) LOOP EXIT l WHEN r.c IS NULL; END LOOP l; END;"
    examples:
      - |-
        BEGIN
          FOR item IN (
            SELECT last_name, job_id
            FROM employees
            WHERE job_id LIKE '%CLERK%'
            AND manager_id > 120
            ORDER BY last_name
          )
          LOOP
            DBMS_OUTPUT.PUT_LINE
              ('Name = ' || item.last_name || ', Job = ' || item.job_id);
          END LOOP;
        END;
        /
      - |-
        DECLARE
          CURSOR c1 (job VARCHAR2, max_wage NUMBER) IS
            SELECT * FROM employees
            WHERE job_id = job
            AND salary > max_wage;
        BEGIN
          FOR person IN c1('ST_CLERK', 3000)
          LOOP
             -- process data record
            DBMS_OUTPUT.PUT_LINE (
              'Name = ' || person.last_name || ', salary = ' ||
              person.salary || ', Job Id = ' || person.job_id
            );
          END LOOP;
        END;
        /

  - id: plsql_explicit_cursor
    name: PL/SQL explicit cursor declaration and definition
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/lnpls/explicit-cursor-declaration-and-definition.html
    tier: high
    probes:
      - id: definition
        sql: "DECLARE CURSOR c IS SELECT c FROM t WHERE d > 0; BEGIN NULL; END;"
      - id: declaration_then_definition
        sql: "DECLARE CURSOR c RETURN t%ROWTYPE; CURSOR c RETURN t%ROWTYPE IS SELECT * FROM t; BEGIN NULL; END;"
      - id: parameters_with_defaults
        sql: "DECLARE CURSOR c (j IN VARCHAR2, w NUMBER := 0, z NUMBER DEFAULT 1) IS SELECT * FROM t WHERE job = j AND sal > w; BEGIN NULL; END;"
      - id: return_record_type
        sql: "DECLARE TYPE r_t IS RECORD (a NUMBER); CURSOR c RETURN r_t IS SELECT a FROM t; BEGIN NULL; END;"
      - id: for_update
        sql: "DECLARE CURSOR c IS SELECT c FROM t FOR UPDATE OF c NOWAIT; BEGIN NULL; END;"
    examples:
      - |-
        DECLARE
          CURSOR c1 RETURN departments%ROWTYPE;    -- Declare c1
         
          CURSOR c2 IS                             -- Declare and define c2
            SELECT employee_id, job_id, salary FROM employees
            WHERE salary > 2000; 
         
          CURSOR c1 RETURN departments%ROWTYPE IS  -- Define c1,
            SELECT * FROM departments              -- repeating return type
            WHERE department_id = 110;
         
          CURSOR c3 RETURN locations%ROWTYPE;      -- Declare c3
         
          CURSOR c3 IS                             -- Define c3,
            SELECT * FROM locations                -- omitting return type
            WHERE country_id = 'JP';
        BEGIN
          NULL;
        END;
        /

  - id: plsql_open_statement
    name: PL/SQL OPEN statement
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/lnpls/OPEN-statement.html
    tier: high
    probes:
      - id: open
        sql: "DECLARE CURSOR c IS SELECT c FROM t; BEGIN OPEN c; CLOSE c; END;"
      - id: open_with_parameters
        sql: "DECLARE CURSOR c (j VARCHAR2) IS SELECT c FROM t WHERE job = j; BEGIN OPEN c('CLERK'); CLOSE c; END;"
      - id: open_named_parameters
        sql: "DECLARE CURSOR c (j VARCHAR2, w NUMBER) IS SELECT c FROM t WHERE job = j AND sal > w; BEGIN OPEN c(w => 1000, j => 'CLERK'); CLOSE c; END;"
    examples:
      - |-
        DECLARE
          CURSOR c1 IS
            SELECT last_name, job_id FROM employees
            WHERE REGEXP_LIKE (job_id, 'S[HT]_CLERK')
            ORDER BY last_name;

          v_lastname  employees.last_name%TYPE;  -- variable for last_name
          v_jobid     employees.job_id%TYPE;     -- variable for job_id

          CURSOR c2 IS
            SELECT * FROM employees
            WHERE REGEXP_LIKE (job_id, '[ACADFIMKSA]_M[ANGR]')
            ORDER BY job_id;

          v_employees employees%ROWTYPE;  -- record variable for row of table

        BEGIN
          OPEN c1;
          LOOP  -- Fetches 2 columns into variables
            FETCH c1 INTO v_lastname, v_jobid;
            EXIT WHEN c1%NOTFOUND;
            DBMS_OUTPUT.PUT_LINE( RPAD(v_lastname, 25, ' ') || v_jobid );
          END LOOP;
          CLOSE c1;
          DBMS_OUTPUT.PUT_LINE( '-------------------------------------' );

          OPEN c2;
          LOOP  -- Fetches entire row into the v_employees record
            FETCH c2 INTO v_employees;
            EXIT WHEN c2%NOTFOUND;
            DBMS_OUTPUT.PUT_LINE( RPAD(v_employees.last_name, 25, ' ') ||
                                       v_employees.job_id );
          END LOOP;
          CLOSE c2;
        END;
        /

  - id: plsql_fetch_statement
    name: PL/SQL FETCH statement
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/lnpls/FETCH-statement.html
    tier: high
    probes:
      - id: into_variables
        sql: "DECLARE CURSOR c IS SELECT a, b FROM t; x NUMBER; y NUMBER; BEGIN OPEN c; FETCH c INTO x, y; CLOSE c; END;"
      - id: into_record
        sql: "DECLARE CURSOR c IS SELECT * FROM t; r t%ROWTYPE; BEGIN OPEN c; LOOP FETCH c INTO r; EXIT WHEN c%NOTFOUND; END LOOP; CLOSE c; END;"
      - id: bulk_collect
        sql: "DECLARE TYPE nt IS TABLE OF NUMBER; a nt; CURSOR c IS SELECT c FROM t; BEGIN OPEN c; FETCH c BULK COLLECT INTO a; CLOSE c; END;"
      - id: bulk_collect_limit
        sql: "DECLARE TYPE nt IS TABLE OF t%ROWTYPE; a nt; CURSOR c IS SELECT * FROM t; BEGIN OPEN c; LOOP FETCH c BULK COLLECT INTO a LIMIT 100; EXIT WHEN a.COUNT = 0; END LOOP; CLOSE c; END;"
      - id: host_cursor_variable
        sql: "DECLARE r t%ROWTYPE; BEGIN FETCH :hcv INTO r; END;"
    examples:
      - |-
        DECLARE
          v_employees employees%ROWTYPE;
          CURSOR c1 is SELECT * FROM employees;
        BEGIN
          OPEN c1;
          -- Fetch entire row into v_employees record:
          FOR i IN 1..10 LOOP
            FETCH c1 INTO v_employees;
            EXIT WHEN c1%NOTFOUND;
            -- Process data here
          END LOOP;
          CLOSE c1;
        END;
        /
      - |-
        DECLARE
          TYPE empcurtyp IS REF CURSOR;
          TYPE namelist IS TABLE OF employees.last_name%TYPE;
          TYPE sallist IS TABLE OF employees.salary%TYPE;
          emp_cv  empcurtyp;
          names   namelist;
          sals    sallist;
        BEGIN
          OPEN emp_cv FOR
            SELECT last_name, salary FROM employees
            WHERE job_id = 'SA_REP'
            ORDER BY salary DESC;

          FETCH emp_cv BULK COLLECT INTO names, sals;
          CLOSE emp_cv;
          -- loop through the names and sals collections
          FOR i IN names.FIRST .. names.LAST
          LOOP
            DBMS_OUTPUT.PUT_LINE
              ('Name = ' || names(i) || ', salary = ' || sals(i));
          END LOOP;
        END;
        /

  - id: plsql_close_statement
    name: PL/SQL CLOSE statement
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/lnpls/CLOSE-statement.html
    tier: high
    probes:
      - id: close_cursor
        sql: "DECLARE CURSOR c IS SELECT c FROM t; BEGIN OPEN c; CLOSE c; END;"
      - id: close_cursor_variable
        sql: "DECLARE cv SYS_REFCURSOR; BEGIN OPEN cv FOR SELECT c FROM t; CLOSE cv; END;"
      - id: close_host_cursor_variable
        sql: "BEGIN CLOSE :hcv; END;"

  - id: plsql_cursor_variable
    name: PL/SQL cursor variable declaration (REF CURSOR)
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/lnpls/cursor-variable-declaration.html
    tier: high
    probes:
      - id: weak_ref_cursor
        sql: "DECLARE TYPE cur_t IS REF CURSOR; cv cur_t; BEGIN NULL; END;"
      - id: strong_ref_cursor_rowtype
        sql: "DECLARE TYPE cur_t IS REF CURSOR RETURN t%ROWTYPE; cv cur_t; BEGIN NULL; END;"
      - id: strong_ref_cursor_record_type
        sql: "DECLARE TYPE r_t IS RECORD (a NUMBER, b VARCHAR2(25)); TYPE cur_t IS REF CURSOR RETURN r_t; cv cur_t; BEGIN NULL; END;"
      - id: sys_refcursor
        sql: "DECLARE cv SYS_REFCURSOR; BEGIN NULL; END;"
      - id: ref_cursor_parameter
        sql: "CREATE OR REPLACE PROCEDURE p (cv OUT SYS_REFCURSOR) IS BEGIN OPEN cv FOR SELECT c FROM t; END;"
    examples:
      - |-
        DECLARE
          TYPE empcurtyp IS REF CURSOR RETURN employees%ROWTYPE;  -- strong type
          TYPE genericcurtyp IS REF CURSOR;                       -- weak type

          cursor1  empcurtyp;       -- strong cursor variable
          cursor2  genericcurtyp;   -- weak cursor variable
          my_cursor SYS_REFCURSOR;  -- weak cursor variable

          TYPE deptcurtyp IS REF CURSOR RETURN departments%ROWTYPE;  -- strong type
          dept_cv deptcurtyp;  -- strong cursor variable
        BEGIN
          NULL;
        END;
        /
      - |-
        DECLARE
          TYPE EmpRecTyp IS RECORD (
            employee_id NUMBER,
            last_name VARCHAR2(25),
            salary   NUMBER(8,2));

          TYPE EmpCurTyp IS REF CURSOR RETURN EmpRecTyp;
          emp_cv EmpCurTyp;
        BEGIN
          NULL;
        END;
        /

  - id: plsql_open_for_statement
    name: PL/SQL OPEN FOR statement
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/lnpls/OPEN-FOR-statement.html
    tier: high
    probes:
      - id: static_select
        sql: "DECLARE cv SYS_REFCURSOR; BEGIN OPEN cv FOR SELECT c FROM t WHERE d = 1 ORDER BY c; END;"
      - id: dynamic_string_using
        sql: "DECLARE cv SYS_REFCURSOR; s VARCHAR2(200) := 'SELECT * FROM t WHERE job = :j'; BEGIN OPEN cv FOR s USING 'MANAGER'; END;"
      - id: dynamic_literal_using_modes
        sql: "DECLARE cv SYS_REFCURSOR; BEGIN OPEN cv FOR 'SELECT c FROM t WHERE a = :1 AND b = :2' USING IN 1, x; END;"
      - id: host_cursor_variable
        sql: "BEGIN OPEN :hcv FOR SELECT c FROM t; END;"
    examples:
      - |-
        DECLARE
          TYPE EmpCurTyp  IS REF CURSOR;
          v_emp_cursor    EmpCurTyp;
          emp_record      employees%ROWTYPE;
          v_stmt_str      VARCHAR2(200);
          v_e_job         employees.job_id%TYPE;
        BEGIN
          -- Dynamic SQL statement with placeholder:
          v_stmt_str := 'SELECT * FROM employees WHERE job_id = :j';

          -- Open cursor & specify bind variable in USING clause:
          OPEN v_emp_cursor FOR v_stmt_str USING 'MANAGER';

          -- Fetch rows from result set one at a time:
          LOOP
            FETCH v_emp_cursor INTO emp_record;
            EXIT WHEN v_emp_cursor%NOTFOUND;
          END LOOP;

          -- Close cursor:
          CLOSE v_emp_cursor;
        END;
        /

  - id: plsql_named_cursor_attribute
    name: PL/SQL named cursor attribute
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/lnpls/named-cursor-attribute.html
    tier: high
    probes:
      - id: found_notfound
        sql: "DECLARE CURSOR c IS SELECT c FROM t; v NUMBER; BEGIN OPEN c; FETCH c INTO v; IF c%FOUND THEN NULL; ELSIF c%NOTFOUND THEN NULL; END IF; CLOSE c; END;"
      - id: rowcount_isopen
        sql: "DECLARE CURSOR c IS SELECT c FROM t; n NUMBER; BEGIN OPEN c; n := c%ROWCOUNT; IF c%ISOPEN THEN CLOSE c; END IF; END;"
      - id: host_cursor_variable
        sql: "BEGIN IF :hcv%ISOPEN THEN NULL; END IF; END;"

  - id: plsql_implicit_cursor_attribute
    name: PL/SQL implicit cursor attribute (SQL%)
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/lnpls/implicit-cursor-attribute.html
    tier: high
    probes:
      - id: rowcount
        sql: "DECLARE n NUMBER; BEGIN DELETE FROM t WHERE c = 1; n := SQL%ROWCOUNT; END;"
      - id: found_notfound_isopen
        sql: "BEGIN UPDATE t SET c = 1 WHERE d = 2; IF SQL%NOTFOUND THEN INSERT INTO t VALUES (1, 2); ELSIF SQL%FOUND AND NOT SQL%ISOPEN THEN NULL; END IF; END;"
      - id: bulk_rowcount
        sql: "DECLARE TYPE nt IS TABLE OF NUMBER; ids nt := nt(1, 2); BEGIN FORALL i IN 1 .. 2 DELETE FROM t WHERE id = ids(i); x := SQL%BULK_ROWCOUNT(1); END;"
      - id: bulk_exceptions
        sql: "BEGIN FOR i IN 1 .. SQL%BULK_EXCEPTIONS.COUNT LOOP x := SQL%BULK_EXCEPTIONS(i).ERROR_INDEX; y := SQL%BULK_EXCEPTIONS(i).ERROR_CODE; END LOOP; END;"

  - id: plsql_select_into_statement
    name: PL/SQL SELECT INTO statement
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/lnpls/SELECT-INTO-statement.html
    tier: high
    probes:
      - id: into_variable
        sql: "DECLARE v NUMBER; BEGIN SELECT c * 0.1 INTO v FROM t WHERE id = 100; END;"
      - id: into_variables
        sql: "DECLARE a NUMBER; b VARCHAR2(20); BEGIN SELECT c, d INTO a, b FROM t WHERE id = 1; END;"
      - id: into_record
        sql: "DECLARE r t%ROWTYPE; BEGIN SELECT * INTO r FROM t WHERE id = 1; END;"
      - id: distinct_into
        sql: "DECLARE v NUMBER; BEGIN SELECT DISTINCT c INTO v FROM t WHERE id = 1; END;"
      - id: bulk_collect_into
        sql: "DECLARE TYPE nt IS TABLE OF t.c%TYPE; a nt; BEGIN SELECT c BULK COLLECT INTO a FROM t; END;"
      - id: bulk_collect_into_multiple
        sql: "DECLARE TYPE n1 IS TABLE OF NUMBER; TYPE n2 IS TABLE OF VARCHAR2(20); a n1; b n2; BEGIN SELECT c, d BULK COLLECT INTO a, b FROM t ORDER BY c FETCH FIRST 10 ROWS ONLY; END;"
      - id: into_with_cte
        sql: "DECLARE v NUMBER; BEGIN WITH q AS (SELECT c FROM t) SELECT MAX(c) INTO v FROM q; END;"
    examples:
      - |-
        DECLARE
          bonus   NUMBER(8,2);
        BEGIN
          SELECT salary * 0.10 INTO bonus
          FROM employees
          WHERE employee_id = 100;

          DBMS_OUTPUT.PUT_LINE('bonus = ' || TO_CHAR(bonus));
        END;

        /

  - id: plsql_forall_statement
    name: PL/SQL FORALL statement
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/lnpls/FORALL-statement.html
    tier: high
    probes:
      - id: range_delete
        sql: "DECLARE TYPE nt IS TABLE OF NUMBER; ids nt := nt(10, 30, 70); BEGIN FORALL i IN ids.FIRST .. ids.LAST DELETE FROM t WHERE d = ids(i); END;"
      - id: range_insert
        sql: "DECLARE TYPE nt IS TABLE OF t%ROWTYPE; r nt; BEGIN FORALL i IN 1 .. r.COUNT INSERT INTO t VALUES r(i); END;"
      - id: range_update
        sql: "DECLARE TYPE nt IS TABLE OF NUMBER; ids nt := nt(1, 2); BEGIN FORALL i IN 1 .. 2 UPDATE t SET c = c * 1.1 WHERE id = ids(i); END;"
      - id: save_exceptions
        sql: "DECLARE TYPE nt IS TABLE OF NUMBER; ids nt := nt(1, 2); BEGIN FORALL i IN 1 .. 2 SAVE EXCEPTIONS DELETE FROM t WHERE id = ids(i); END;"
      - id: indices_of
        sql: "DECLARE TYPE nt IS TABLE OF NUMBER; ids nt := nt(1, 2, 3); BEGIN ids.DELETE(2); FORALL i IN INDICES OF ids DELETE FROM t WHERE id = ids(i); END;"
      - id: indices_of_between
        sql: "DECLARE TYPE nt IS TABLE OF NUMBER; ids nt := nt(1, 2, 3); BEGIN FORALL i IN INDICES OF ids BETWEEN 1 AND 2 DELETE FROM t WHERE id = ids(i); END;"
      - id: values_of
        sql: "DECLARE TYPE nt IS TABLE OF NUMBER; TYPE ix IS TABLE OF PLS_INTEGER INDEX BY PLS_INTEGER; ids nt := nt(1, 2, 3); k ix; BEGIN k(1) := 3; FORALL i IN VALUES OF k DELETE FROM t WHERE id = ids(i); END;"
      - id: execute_immediate
        sql: "DECLARE TYPE nt IS TABLE OF NUMBER; ids nt := nt(1, 2); BEGIN FORALL i IN 1 .. 2 EXECUTE IMMEDIATE 'DELETE FROM t WHERE id = :1' USING ids(i); END;"
      - id: returning_bulk_collect
        sql: "DECLARE TYPE nt IS TABLE OF NUMBER; ids nt := nt(1, 2); out_c nt; BEGIN FORALL i IN 1 .. 2 DELETE FROM t WHERE id = ids(i) RETURNING c BULK COLLECT INTO out_c; END;"
      - id: host_arrays
        sql: "BEGIN FORALL i IN :lower .. :upper DELETE FROM t WHERE d = :depts(i); END;"
    examples:
      - |-
        BEGIN
          FORALL i IN :lower..:upper
            DELETE FROM employees
            WHERE department_id = :depts(i);
        END;
        /

  - id: plsql_returning_into_clause
    name: PL/SQL RETURNING INTO clause
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/lnpls/RETURNING-INTO-clause.html
    tier: high
    probes:
      - id: update_returning_into
        sql: "DECLARE v NUMBER; BEGIN UPDATE t SET c = c * 1.1 WHERE id = 1 RETURNING c INTO v; END;"
      - id: insert_returning_into_record
        sql: "DECLARE TYPE r_t IS RECORD (id NUMBER, c NUMBER); r r_t; BEGIN INSERT INTO t (id, c) VALUES (s.NEXTVAL, 1) RETURNING id, c INTO r; END;"
      - id: delete_returning_bulk_collect
        sql: "DECLARE TYPE n1 IS TABLE OF NUMBER; TYPE n2 IS TABLE OF VARCHAR2(25); a n1; b n2; BEGIN DELETE FROM t WHERE d = 30 RETURNING id, name BULK COLLECT INTO a, b; END;"
      - id: return_keyword
        sql: "DECLARE v NUMBER; BEGIN DELETE FROM t WHERE id = 1 RETURN c INTO v; END;"
      - id: dynamic_returning
        sql: "DECLARE v NUMBER; BEGIN EXECUTE IMMEDIATE 'UPDATE t SET c = c + 1 WHERE id = :1 RETURNING c INTO :2' USING 1 RETURNING INTO v; END;"
    examples:
      - |-
        DECLARE
          TYPE NumList IS TABLE OF employees.employee_id%TYPE;
          enums  NumList;
          TYPE NameList IS TABLE OF employees.last_name%TYPE;
          names  NameList;
        BEGIN
          DELETE FROM emp_temp
          WHERE department_id = 30
          RETURNING employee_id, last_name
          BULK COLLECT INTO enums, names;

          DBMS_OUTPUT.PUT_LINE ('Deleted ' || SQL%ROWCOUNT || ' rows:');
          FOR i IN enums.FIRST .. enums.LAST
          LOOP
            DBMS_OUTPUT.PUT_LINE ('Employee #' || enums(i) || ': ' || names(i));
          END LOOP;
        END;
        /

  - id: plsql_bulk_collect
    name: PL/SQL BULK COLLECT clause
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/lnpls/bulk-sql-and-bulk-binding.html
    tier: high
    probes:
      - id: select_bulk_collect
        sql: "DECLARE TYPE nt IS TABLE OF NUMBER; a nt; BEGIN SELECT c BULK COLLECT INTO a FROM t SAMPLE (10); END;"
      - id: fetch_bulk_collect_limit
        sql: "DECLARE TYPE nt IS TABLE OF NUMBER INDEX BY PLS_INTEGER; a nt; CURSOR c1 IS SELECT c FROM t; BEGIN OPEN c1; LOOP FETCH c1 BULK COLLECT INTO a LIMIT 10; EXIT WHEN c1%NOTFOUND; END LOOP; CLOSE c1; END;"
      - id: execute_immediate_bulk_collect
        sql: "DECLARE TYPE nt IS TABLE OF NUMBER; a nt; BEGIN EXECUTE IMMEDIATE 'SELECT c FROM t' BULK COLLECT INTO a; END;"
      - id: host_array
        sql: "BEGIN SELECT c BULK COLLECT INTO :arr FROM t; END;"
    examples:
      - |-
        DECLARE
          TYPE SalList IS TABLE OF employees.salary%TYPE;
          sals SalList;
        BEGIN
          SELECT salary BULK COLLECT INTO sals FROM employees
            WHERE ROWNUM <= 50;
         
          SELECT salary BULK COLLECT INTO sals FROM employees
            SAMPLE (10);
         
          SELECT salary BULK COLLECT INTO sals FROM employees
            FETCH FIRST 50 ROWS ONLY;
        END;
        /
      - |-
        DECLARE
          TYPE numtab IS TABLE OF NUMBER INDEX BY PLS_INTEGER;

          CURSOR c1 IS
            SELECT employee_id
            FROM employees
            WHERE department_id = 80
            ORDER BY employee_id;

          empids  numtab;
        BEGIN
          OPEN c1;
          LOOP  -- Fetch 10 rows or fewer in each iteration
            FETCH c1 BULK COLLECT INTO empids LIMIT 10;
            DBMS_OUTPUT.PUT_LINE ('------- Results from One Bulk Fetch --------');
            FOR i IN 1..empids.COUNT LOOP
              DBMS_OUTPUT.PUT_LINE ('Employee Id: ' || empids(i));
            END LOOP;
            EXIT WHEN c1%NOTFOUND;
          END LOOP;
          CLOSE c1;
        END;
        /
      - |-
        DECLARE
          TYPE NumTab IS TABLE OF employees.employee_id%TYPE;
          TYPE NameTab IS TABLE OF employees.last_name%TYPE;
         
          enums NumTab;
          names NameTab;
         
          PROCEDURE print_first_n (n POSITIVE) IS
          BEGIN
            IF enums.COUNT = 0 THEN
              DBMS_OUTPUT.PUT_LINE ('Collections are empty.');
            ELSE
              DBMS_OUTPUT.PUT_LINE ('First ' || n || ' employees:');
         
              FOR i IN 1 .. n LOOP
                DBMS_OUTPUT.PUT_LINE (
                  '  Employee #' || enums(i) || ': ' || names(i));
              END LOOP;
            END IF;
          END;
         
        BEGIN
          SELECT employee_id, last_name
          BULK COLLECT INTO enums, names
          FROM employees
          ORDER BY employee_id;
         
          print_first_n(3);
          print_first_n(6);
        END;
        /

  - id: plsql_execute_immediate
    name: PL/SQL EXECUTE IMMEDIATE statement
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/lnpls/EXECUTE-IMMEDIATE-statement.html
    tier: high
    probes:
      - id: ddl_literal
        sql: "BEGIN EXECUTE IMMEDIATE 'CREATE TABLE t2 (c NUMBER)'; END;"
      - id: variable_statement
        sql: "DECLARE s VARCHAR2(200) := 'DELETE FROM t'; BEGIN EXECUTE IMMEDIATE s; END;"
      - id: into
        sql: "DECLARE v NUMBER; BEGIN EXECUTE IMMEDIATE 'SELECT COUNT(*) FROM t WHERE c = :1' INTO v USING 10; END;"
      - id: into_record
        sql: "DECLARE r t%ROWTYPE; BEGIN EXECUTE IMMEDIATE 'SELECT * FROM t WHERE id = :id' INTO r USING 1; END;"
      - id: using_modes
        sql: "DECLARE a NUMBER := 1; b NUMBER; BEGIN EXECUTE IMMEDIATE 'BEGIN p(:x, :y); END;' USING IN a, OUT b; END;"
      - id: using_in_out
        sql: "DECLARE a NUMBER := 1; BEGIN EXECUTE IMMEDIATE 'BEGIN p(:x); END;' USING IN OUT a; END;"
      - id: bulk_collect_into
        sql: "DECLARE TYPE nt IS TABLE OF NUMBER; a nt; BEGIN EXECUTE IMMEDIATE 'SELECT c FROM t' BULK COLLECT INTO a; END;"
      - id: using_returning_into
        sql: "DECLARE v NUMBER; BEGIN EXECUTE IMMEDIATE 'UPDATE t SET c = c + 1 WHERE id = :1 RETURNING c INTO :2' USING 1 RETURNING INTO v; END;"
      - id: concatenated_string
        sql: "DECLARE n VARCHAR2(30) := 'T'; BEGIN EXECUTE IMMEDIATE 'DROP TABLE ' || n || ' PURGE'; END;"
    examples:
      - |-
        CREATE OR REPLACE PROCEDURE p (x BOOLEAN) AUTHID DEFINER AS
        BEGIN
          IF x THEN
            DBMS_OUTPUT.PUT_LINE('x is true');
          END IF;
        END;
        /

        DECLARE
          dyn_stmt VARCHAR2(200);
          b        BOOLEAN := TRUE;
        BEGIN
          dyn_stmt := 'BEGIN p(:x); END;';
          EXECUTE IMMEDIATE dyn_stmt USING b;
        END;
        /
      - |-
        CREATE PROCEDURE calc_stats (
          w NUMBER,
          x NUMBER,
          y NUMBER,
          z NUMBER )
        IS
        BEGIN
          DBMS_OUTPUT.PUT_LINE(w + x + y + z);
        END;
        /
        DECLARE
          a NUMBER := 4;
          b NUMBER := 7;
          plsql_block VARCHAR2(100);
        BEGIN
          plsql_block := 'BEGIN calc_stats(:x, :x, :y, :x); END;';
          EXECUTE IMMEDIATE plsql_block USING a, b;  -- calc_stats(a, a, b, a)
        END;
        /

  - id: plsql_exception_declaration
    name: PL/SQL exception declaration
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/lnpls/exception-declaration.html
    tier: high
    probes:
      - id: declare_exception
        sql: "DECLARE past_due EXCEPTION; BEGIN NULL; END;"
      - id: declare_and_raise
        sql: "DECLARE e EXCEPTION; BEGIN RAISE e; EXCEPTION WHEN e THEN NULL; END;"
    examples:
      - |-
        CREATE PROCEDURE account_status (
          due_date DATE,
          today    DATE
        ) AUTHID DEFINER
        IS
          past_due  EXCEPTION;  -- declare exception
        BEGIN
          IF due_date < today THEN
            RAISE past_due;  -- explicitly raise exception
          END IF;
        EXCEPTION
          WHEN past_due THEN  -- handle exception
            DBMS_OUTPUT.PUT_LINE ('Account past due.');
        END;
        /
         
        BEGIN
          account_status (TO_DATE('01-JUL-2010', 'DD-MON-YYYY'),
                          TO_DATE('09-JUL-2010', 'DD-MON-YYYY'));
        END;
        /

  - id: plsql_exception_init_pragma
    name: PL/SQL EXCEPTION_INIT pragma
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/lnpls/EXCEPTION_INIT-pragma.html
    tier: medium
    probes:
      - id: exception_init
        sql: "DECLARE deadlock_detected EXCEPTION; PRAGMA EXCEPTION_INIT(deadlock_detected, -60); BEGIN NULL; EXCEPTION WHEN deadlock_detected THEN NULL; END;"
      - id: application_error_code
        sql: "DECLARE past_due EXCEPTION; PRAGMA EXCEPTION_INIT (past_due, -20000); BEGIN NULL; END;"
    examples:
      - |-
        CREATE OR REPLACE PROCEDURE account_status (
          due_date DATE,
          today    DATE
        ) AUTHID DEFINER
        IS
        BEGIN
          IF due_date < today THEN                   -- explicitly raise exception
            RAISE_APPLICATION_ERROR(-20000, 'Account past due.');
          END IF;
        END;
        /
         
        DECLARE
          past_due  EXCEPTION;                       -- declare exception
          PRAGMA EXCEPTION_INIT (past_due, -20000);  -- assign error code to exception
        BEGIN
          account_status (TO_DATE('01-JUL-2010', 'DD-MON-YYYY'),
                          TO_DATE('09-JUL-2010', 'DD-MON-YYYY'));   -- invoke procedure

        EXCEPTION
          WHEN past_due THEN                         -- handle exception
            DBMS_OUTPUT.PUT_LINE(TO_CHAR(SQLERRM(-20000)));
        END;
        /

  - id: plsql_raise_statement
    name: PL/SQL RAISE statement
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/lnpls/RAISE-statement.html
    tier: high
    probes:
      - id: raise_user_exception
        sql: "DECLARE e EXCEPTION; BEGIN IF x > 0 THEN RAISE e; END IF; EXCEPTION WHEN e THEN NULL; END;"
      - id: raise_predefined
        sql: "BEGIN IF x IS NULL THEN RAISE VALUE_ERROR; END IF; END;"
      - id: reraise
        sql: "BEGIN NULL; EXCEPTION WHEN OTHERS THEN ROLLBACK; RAISE; END;"
      - id: qualified_exception
        sql: "BEGIN RAISE pkg.my_error; END;"
      - id: raise_application_error
        sql: "BEGIN RAISE_APPLICATION_ERROR(-20000, 'Account past due.'); END;"
    examples:
      - |-
        DECLARE
          salary_too_high   EXCEPTION;
          current_salary    NUMBER := 20000;
          max_salary        NUMBER := 10000;
          erroneous_salary  NUMBER;
        BEGIN

          BEGIN
            IF current_salary > max_salary THEN
              RAISE salary_too_high;   -- raise exception
            END IF;
          EXCEPTION
            WHEN salary_too_high THEN  -- start handling exception
              erroneous_salary := current_salary;
              DBMS_OUTPUT.PUT_LINE('Salary ' || erroneous_salary ||' is out of range.');
              DBMS_OUTPUT.PUT_LINE ('Maximum salary is ' || max_salary || '.');
              RAISE;  -- reraise current exception (exception name is optional)
          END;

        EXCEPTION
          WHEN salary_too_high THEN    -- finish handling exception
            current_salary := max_salary;

            DBMS_OUTPUT.PUT_LINE (
              'Revising salary from ' || erroneous_salary ||
              ' to ' || current_salary || '.'
            );
        END;
        /

  - id: plsql_exception_handler
    name: PL/SQL exception handler
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/lnpls/exception-handler.html
    tier: high
    probes:
      - id: when_named
        sql: "BEGIN SELECT c INTO x FROM t WHERE id = 1; EXCEPTION WHEN NO_DATA_FOUND THEN x := NULL; END;"
      - id: when_or
        sql: "BEGIN SELECT c INTO x FROM t; EXCEPTION WHEN NO_DATA_FOUND OR TOO_MANY_ROWS THEN x := NULL; END;"
      - id: multiple_handlers_others
        sql: "BEGIN x := 1 / y; EXCEPTION WHEN ZERO_DIVIDE THEN x := 0; WHEN VALUE_ERROR THEN x := -1; WHEN OTHERS THEN x := NULL; END;"
      - id: multiple_statements
        sql: "BEGIN UPDATE t SET c = 1; EXCEPTION WHEN DUP_VAL_ON_INDEX THEN ROLLBACK; INSERT INTO log_t VALUES ('dup'); COMMIT; END;"
      - id: sqlcode_sqlerrm
        sql: "DECLARE code NUMBER; msg VARCHAR2(512); BEGIN NULL; EXCEPTION WHEN OTHERS THEN code := SQLCODE; msg := SUBSTR(SQLERRM, 1, 512); END;"
    examples:
      - |-
        DECLARE
          salary_too_high   EXCEPTION;
          current_salary    NUMBER := 20000;
          max_salary        NUMBER := 10000;
          erroneous_salary  NUMBER;
        BEGIN

          BEGIN
            IF current_salary > max_salary THEN
              RAISE salary_too_high;   -- raise exception
            END IF;
          EXCEPTION
            WHEN salary_too_high THEN  -- start handling exception
              erroneous_salary := current_salary;
              DBMS_OUTPUT.PUT_LINE('Salary ' || erroneous_salary ||' is out of range.');
              DBMS_OUTPUT.PUT_LINE ('Maximum salary is ' || max_salary || '.');
              RAISE;  -- reraise current exception (exception name is optional)
          END;

        EXCEPTION
          WHEN salary_too_high THEN    -- finish handling exception
            current_salary := max_salary;

            DBMS_OUTPUT.PUT_LINE (
              'Revising salary from ' || erroneous_salary ||
              ' to ' || current_salary || '.'
            );
        END;
        /

  - id: plsql_sqlcode_sqlerrm
    name: PL/SQL SQLCODE and SQLERRM functions
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/lnpls/SQLERRM-function.html
    tier: medium
    probes:
      - id: sqlcode
        sql: "DECLARE n NUMBER; BEGIN NULL; EXCEPTION WHEN OTHERS THEN n := SQLCODE; END;"
      - id: sqlerrm_no_argument
        sql: "DECLARE m VARCHAR2(512); BEGIN NULL; EXCEPTION WHEN OTHERS THEN m := SQLERRM; END;"
      - id: sqlerrm_error_code
        sql: "DECLARE m VARCHAR2(512); BEGIN m := SQLERRM(-20000); END;"

  - id: plsql_pipe_row
    name: PL/SQL PIPE ROW statement
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/lnpls/PIPE-ROW-statement.html
    tier: medium
    probes:
      - id: pipe_row
        sql: "CREATE FUNCTION f RETURN num_tab PIPELINED IS BEGIN FOR i IN 1 .. 3 LOOP PIPE ROW (i); END LOOP; RETURN; END;"
      - id: pipe_row_record
        sql: "CREATE FUNCTION f (c SYS_REFCURSOR) RETURN rec_tab PIPELINED IS r rec_t; BEGIN LOOP FETCH c INTO r; EXIT WHEN c%NOTFOUND; PIPE ROW (r); END LOOP; RETURN; END;"

  - id: plsql_autonomous_transaction_pragma
    name: PL/SQL AUTONOMOUS_TRANSACTION pragma
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/lnpls/AUTONOMOUS_TRANSACTION-pragma.html
    tier: medium
    probes:
      - id: in_block
        sql: "DECLARE PRAGMA AUTONOMOUS_TRANSACTION; BEGIN INSERT INTO log_t VALUES ('x'); COMMIT; END;"
      - id: in_procedure
        sql: "CREATE OR REPLACE PROCEDURE p (m VARCHAR2) AS PRAGMA AUTONOMOUS_TRANSACTION; BEGIN INSERT INTO log_t VALUES (m); COMMIT; END;"

  - id: plsql_inline_pragma
    name: PL/SQL INLINE pragma
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/lnpls/INLINE-pragma.html
    tier: low
    probes:
      - id: inline
        sql: "DECLARE FUNCTION f (a NUMBER) RETURN NUMBER IS BEGIN RETURN a; END; x NUMBER; BEGIN PRAGMA INLINE (f, 'YES'); x := f(1); END;"

  - id: plsql_deprecate_pragma
    name: PL/SQL DEPRECATE pragma
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/lnpls/DEPRECATE-pragma.html
    tier: low
    probes:
      - id: deprecate
        sql: "CREATE OR REPLACE PROCEDURE p AUTHID DEFINER IS PRAGMA DEPRECATE (p, 'Use p2 instead'); BEGIN NULL; END;"

  - id: plsql_suppresses_warning_6009_pragma
    name: PL/SQL SUPPRESSES_WARNING_6009 pragma
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/lnpls/Supresses-warning-pragma-6009.html
    tier: low
    probes:
      - id: suppress_warning
        sql: "CREATE OR REPLACE PROCEDURE p AUTHID DEFINER IS PRAGMA SUPPRESSES_WARNING_6009(p); BEGIN RAISE_APPLICATION_ERROR(-20000, 'x'); END;"
        note: "The page's syntax diagram text spells it SUPPRESS_WARNING_6009; the page title, body and examples use SUPPRESSES_WARNING_6009."
    examples:
      - |-
        CREATE PROCEDURE p1
        AUTHID DEFINER
        IS
            PRAGMA SUPPRESSES_WARNING_6009(p1);
        BEGIN
            RAISE_APPLICATION_ERROR(-20000, 'Unexpected error raised');
        END;
        /

  - id: plsql_coverage_pragma
    name: PL/SQL COVERAGE pragma
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/lnpls/COVERAGE-pragma.html
    tier: low
    probes:
      - id: not_feasible
        sql: "BEGIN IF x > 0 THEN PRAGMA COVERAGE ('NOT_FEASIBLE'); NULL; END IF; END;"

  - id: plsql_udf_pragma
    name: PL/SQL UDF pragma
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/lnpls/UDF-pragma.html
    tier: low
    probes:
      - id: udf
        sql: "CREATE OR REPLACE FUNCTION f (a NUMBER) RETURN NUMBER IS PRAGMA UDF; BEGIN RETURN a * 2; END;"

  - id: plsql_insert_statement_extension
    name: PL/SQL INSERT statement extension (VALUES record)
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/lnpls/INSERT-statement-extension.html
    tier: medium
    probes:
      - id: values_record
        sql: "DECLARE r t%ROWTYPE; BEGIN r.id := 1; INSERT INTO t VALUES r; END;"
      - id: values_record_alias
        sql: "DECLARE r t%ROWTYPE; BEGIN INSERT INTO s.t x VALUES r RETURNING x.id INTO r.id; END;"

  - id: plsql_update_statement_extensions
    name: PL/SQL UPDATE statement extensions (SET ROW, CURRENT OF)
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/lnpls/UPDATE-statement-extensions.html
    tier: medium
    probes:
      - id: set_row
        sql: "DECLARE r t%ROWTYPE; BEGIN UPDATE t SET ROW = r WHERE id = r.id; END;"
      - id: where_current_of
        sql: "DECLARE CURSOR c IS SELECT c FROM t FOR UPDATE; BEGIN FOR r IN c LOOP UPDATE t SET c = r.c * 2 WHERE CURRENT OF c; END LOOP; END;"
    examples:
      - |-
        DECLARE
          default_week  schedule%ROWTYPE;
        BEGIN
          default_week.Mon := 'Day Off';
          default_week.Tue := '0900-1800';
          default_week.Wed := '0900-1800';
          default_week.Thu := '0900-1800';
          default_week.Fri := '0900-1800';
          default_week.Sat := '0900-1800';
          default_week.Sun := 'Day Off';
         
          FOR i IN 1..3 LOOP
            default_week.week    := i;
          
            UPDATE schedule
            SET ROW = default_week
            WHERE week = i;
          END LOOP;
        END;
        /

  - id: plsql_delete_statement_extension
    name: PL/SQL DELETE statement extension (CURRENT OF)
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/lnpls/DELETE-statement-extension.html
    tier: medium
    probes:
      - id: where_current_of
        sql: "DECLARE CURSOR c IS SELECT c FROM t FOR UPDATE; BEGIN FOR r IN c LOOP IF r.c < 0 THEN DELETE FROM t WHERE CURRENT OF c; END IF; END LOOP; END;"

  - id: plsql_function_definition
    name: PL/SQL function declaration and definition (nested)
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/lnpls/function-declaration-and-definition.html
    tier: high
    probes:
      - id: definition
        sql: "DECLARE FUNCTION f (p INTEGER) RETURN INTEGER IS BEGIN RETURN p; END f; BEGIN x := f(1); END;"
      - id: forward_declaration
        sql: "DECLARE FUNCTION f (p NUMBER) RETURN NUMBER; FUNCTION g RETURN NUMBER IS BEGIN RETURN f(1); END; FUNCTION f (p NUMBER) RETURN NUMBER IS BEGIN RETURN p; END; BEGIN NULL; END;"
      - id: properties
        sql: "DECLARE FUNCTION f (p NUMBER) RETURN NUMBER DETERMINISTIC RESULT_CACHE IS BEGIN RETURN p; END; BEGIN NULL; END;"
      - id: parameter_modes_defaults
        sql: "DECLARE FUNCTION f (a IN NUMBER DEFAULT 0, b OUT NUMBER, c IN OUT NOCOPY VARCHAR2) RETURN BOOLEAN AS v NUMBER; BEGIN b := a; RETURN TRUE; END; BEGIN NULL; END;"
    examples:
      - |-
        DECLARE
          FUNCTION test (p INTEGER) RETURN INTEGER IS
          BEGIN
            DBMS_OUTPUT.PUT_LINE('p = ' || p);
            RETURN p;
          END test;
         
        BEGIN
          DBMS_OUTPUT.PUT_LINE('test(p) = ' || test(0.66));
        END;
        /

  - id: plsql_procedure_definition
    name: PL/SQL procedure declaration and definition (nested)
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/lnpls/procedure-declaration-and-definition.html
    tier: high
    probes:
      - id: definition
        sql: "DECLARE PROCEDURE p (a NUMBER, b NUMBER) IS BEGIN UPDATE t SET c = c + b WHERE id = a; END p; BEGIN p(1, 2); END;"
      - id: no_parameters
        sql: "DECLARE PROCEDURE p IS BEGIN NULL; END; BEGIN p; END;"
      - id: forward_declaration
        sql: "DECLARE PROCEDURE p2; PROCEDURE p1 IS BEGIN p2; END; PROCEDURE p2 IS BEGIN NULL; END; BEGIN p1; END;"
      - id: declare_section
        sql: "DECLARE PROCEDURE p (s NUMBER) IS bonus NUMBER := 0; updated VARCHAR2(3) := 'No'; BEGIN IF s > 0 THEN bonus := s / 4; END IF; END p; BEGIN p(100); END;"
      - id: properties
        sql: "DECLARE PROCEDURE p AUTHID CURRENT_USER IS BEGIN NULL; END; BEGIN p; END;"
