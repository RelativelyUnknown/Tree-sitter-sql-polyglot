dialect: teradata
engine: Teradata Vantage (Enterprise IntelliFlex) and VantageCloud Lake
version: "20.00"
source: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/DXllu86_qUx3dJlXfCkc6Q

statements: []

expressions:
  - id: c_aggregate_syntax
    name: Aggregate functions with DISTINCT/ALL
    doc: https://docs.teradata.com/reader/ka4q4xtYpyQGplkKwXaNBQ/lCc71nDIqu5Lc0xNN4~Mjg
    tier: high
    probes:
      - { id: count_star, sql: "SELECT COUNT(*) FROM t;" }
      - { id: count_distinct, sql: "SELECT COUNT(DISTINCT c) FROM t;" }
      - { id: count_all, sql: "SELECT COUNT(ALL c) FROM t;" }
      - { id: sum_distinct, sql: "SELECT SUM(DISTINCT x), AVG(DISTINCT x) FROM t;" }
      - { id: avg_all, sql: "SELECT AVG(ALL x) FROM t;" }
      - { id: avg_synonyms, sql: "SELECT AVERAGE(x), AVE(x) FROM t;", note: "AVG syntax: { AVERAGE | AVG | AVE }" }
      - { id: maximum_minimum, sql: "SELECT MAXIMUM(x), MINIMUM(x) FROM t;", note: "{ MAXIMUM | MAX } and { MINIMUM | MIN }" }
      - { id: max_min_distinct, sql: "SELECT MAX(DISTINCT x), MIN(ALL x) FROM t;" }
      - { id: stddev_var, sql: "SELECT STDDEV_POP(x), STDDEV_SAMP(x), VAR_POP(x), VAR_SAMP(x) FROM t;" }
      - { id: kurtosis_skew, sql: "SELECT KURTOSIS(DISTINCT x), SKEW(x) FROM t;" }
      - { id: corr_covar, sql: "SELECT CORR(x, y), COVAR_POP(x, y), COVAR_SAMP(x, y) FROM t;" }
      - { id: regr_family, sql: "SELECT REGR_AVGX(y, x), REGR_AVGY(y, x), REGR_COUNT(y, x), REGR_INTERCEPT(y, x), REGR_R2(y, x), REGR_SLOPE(y, x), REGR_SXX(y, x), REGR_SXY(y, x), REGR_SYY(y, x) FROM t;" }
      - { id: grouping_function, sql: "SELECT a, GROUPING(a), SUM(b) FROM t GROUP BY ROLLUP (a);" }
      - { id: aggregate_group_by, sql: "SELECT a, SUM(b) FROM t GROUP BY a HAVING SUM(b) > 10;" }
    examples:
      - "SELECT COUNT(DISTINCT JobTitle) FROM Employee;"
      - "SELECT SUM(DISTINCT x), AVG(DISTINCT x) FROM XTable;"
      - "SELECT SUM(DISTINCT x), SUM(DISTINCT y) FROM XYTable;"

  - id: c_within_group_aggregates
    name: PERCENTILE_CONT and PERCENTILE_DISC (WITHIN GROUP)
    doc: https://docs.teradata.com/reader/ka4q4xtYpyQGplkKwXaNBQ/8atbSgaX7n515H7sDUpClw
    tier: medium
    probes:
      - { id: percentile_cont, sql: "SELECT PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY x) FROM t;" }
      - { id: percentile_disc, sql: "SELECT PERCENTILE_DISC(0.5) WITHIN GROUP (ORDER BY x DESC) FROM t;" }
      - { id: percentile_nulls_first, sql: "SELECT PERCENTILE_CONT(0.25) WITHIN GROUP (ORDER BY x ASC NULLS FIRST) FROM t;" }
      - { id: percentile_nulls_last, sql: "SELECT PERCENTILE_DISC(0.75) WITHIN GROUP (ORDER BY x NULLS LAST) FROM t;" }
      - { id: percentile_over, sql: "SELECT PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY x) OVER (PARTITION BY a) FROM t;" }
      - { id: percentile_group_by, sql: "SELECT a, PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY x) FROM t GROUP BY a;" }

  - id: c_window_aggregate_syntax
    name: Window aggregate functions (OVER, ROWS frames)
    doc: https://docs.teradata.com/reader/ka4q4xtYpyQGplkKwXaNBQ/Q~yKPQsIV5nABGnSChPZ6g
    tier: high
    note: Teradata 20.00 documents only a ROWS frame; there is no RANGE or GROUPS frame, no named WINDOW clause and no FILTER clause.
    probes:
      - { id: over_empty, sql: "SELECT SUM(x) OVER () FROM t;" }
      - { id: over_partition_by, sql: "SELECT SUM(x) OVER (PARTITION BY a) FROM t;" }
      - { id: over_partition_multi, sql: "SELECT SUM(x) OVER (PARTITION BY a, b) FROM t;" }
      - { id: over_order_by, sql: "SELECT SUM(x) OVER (ORDER BY d) FROM t;" }
      - { id: over_order_desc, sql: "SELECT SUM(x) OVER (ORDER BY d DESC, e ASC) FROM t;" }
      - { id: over_order_nulls_first, sql: "SELECT SUM(x) OVER (ORDER BY d NULLS FIRST) FROM t;", note: "value_specification: value_expression [ ASC | DESC ] [ NULLS { FIRST | LAST } ]" }
      - { id: over_order_nulls_last, sql: "SELECT SUM(x) OVER (ORDER BY d DESC NULLS LAST) FROM t;" }
      - { id: over_partition_order, sql: "SELECT AVG(x) OVER (PARTITION BY a ORDER BY d) FROM t;" }
      - { id: reset_when, sql: "SELECT SUM(x) OVER (PARTITION BY a ORDER BY d RESET WHEN x < 0) FROM t;", note: "ORDER BY ... [ RESET WHEN condition ]" }
      - { id: rows_unbounded_preceding, sql: "SELECT SUM(x) OVER (ORDER BY d ROWS UNBOUNDED PRECEDING) FROM t;" }
      - { id: rows_n_preceding, sql: "SELECT AVG(x) OVER (ORDER BY d ROWS 2 PRECEDING) FROM t;" }
      - { id: rows_current_row, sql: "SELECT SUM(x) OVER (ORDER BY d ROWS CURRENT ROW) FROM t;" }
      - { id: rows_between_unbounded_current, sql: "SELECT SUM(x) OVER (ORDER BY d ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) FROM t;" }
      - { id: rows_between_unbounded_following, sql: "SELECT SUM(x) OVER (ORDER BY d ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING) FROM t;" }
      - { id: rows_between_n_preceding_current, sql: "SELECT AVG(x) OVER (PARTITION BY a ORDER BY d ROWS BETWEEN 2 PRECEDING AND CURRENT ROW) FROM t;" }
      - { id: rows_between_n_preceding_following, sql: "SELECT AVG(x) OVER (ORDER BY d ROWS BETWEEN 1 PRECEDING AND 1 FOLLOWING) FROM t;" }
      - { id: rows_between_n_preceding_m_preceding, sql: "SELECT AVG(x) OVER (ORDER BY d ROWS BETWEEN 3 PRECEDING AND 1 PRECEDING) FROM t;" }
      - { id: rows_between_current_following, sql: "SELECT SUM(x) OVER (ORDER BY d ROWS BETWEEN CURRENT ROW AND 2 FOLLOWING) FROM t;" }
      - { id: rows_between_current_unbounded_following, sql: "SELECT SUM(x) OVER (ORDER BY d ROWS BETWEEN CURRENT ROW AND UNBOUNDED FOLLOWING) FROM t;" }
      - { id: rows_between_following_following, sql: "SELECT SUM(x) OVER (ORDER BY d ROWS BETWEEN 1 FOLLOWING AND 3 FOLLOWING) FROM t;" }
      - { id: rows_between_following_unbounded, sql: "SELECT SUM(x) OVER (ORDER BY d ROWS BETWEEN 1 FOLLOWING AND UNBOUNDED FOLLOWING) FROM t;" }
      - { id: count_star_over, sql: "SELECT COUNT(*) OVER (PARTITION BY a) FROM t;" }
      - { id: min_max_over, sql: "SELECT MIN(x) OVER (PARTITION BY a), MAX(x) OVER (PARTITION BY a) FROM t;" }
      - { id: stat_aggregates_over, sql: "SELECT STDDEV_POP(x) OVER (ORDER BY d ROWS 4 PRECEDING), VAR_SAMP(x) OVER (ORDER BY d ROWS 4 PRECEDING) FROM t;" }
      - { id: corr_over, sql: "SELECT CORR(x, y) OVER (PARTITION BY a ORDER BY d ROWS UNBOUNDED PRECEDING) FROM t;" }
      - { id: regr_over, sql: "SELECT REGR_SLOPE(y, x) OVER (ORDER BY d ROWS BETWEEN 5 PRECEDING AND CURRENT ROW) FROM t;" }
      - { id: multiple_windows, sql: "SELECT AVG(x) OVER (PARTITION BY a ORDER BY d ROWS BETWEEN 2 PRECEDING AND CURRENT ROW), RANK() OVER (PARTITION BY a ORDER BY x DESC) FROM t;", note: "Multiple Window Specifications topic" }
      - { id: window_with_group_by, sql: "SELECT a, SUM(b), RANK() OVER (ORDER BY SUM(b) DESC) FROM t GROUP BY a;" }
    examples:
      - |-
        SELECT territory, smonth, sales,
        AVG(sales) OVER (PARTITION BY territory
                         ORDER BY smonth ROWS 2 PRECEDING)
        FROM sales_history;
      - |-
        SELECT StoreID, SMonth, ProdID, Sales,
        AVG(Sales) OVER (PARTITION BY StoreID
                         ORDER BY SMonth
                         ROWS BETWEEN 2 PRECEDING AND CURRENT ROW)
        FROM sales_tbl;
      - |-
        SELECT StoreID, SMonth, ProdID, Sales,
        AVG(Sales) OVER (PARTITION BY StoreID
                         ORDER BY SMonth
                         ROWS BETWEEN 2 PRECEDING AND CURRENT ROW),
        RANK() OVER (PARTITION BY StoreID ORDER BY Sales DESC)
        FROM sales_tbl;

  - id: c_window_ranking_functions
    name: Ranking and distribution window functions
    doc: https://docs.teradata.com/reader/ka4q4xtYpyQGplkKwXaNBQ/Q~yKPQsIV5nABGnSChPZ6g
    tier: high
    probes:
      - { id: row_number, sql: "SELECT ROW_NUMBER() OVER (ORDER BY d) FROM t;" }
      - { id: row_number_partition, sql: "SELECT ROW_NUMBER() OVER (PARTITION BY a ORDER BY d DESC) FROM t;" }
      - { id: row_number_reset_when, sql: "SELECT ROW_NUMBER() OVER (PARTITION BY a ORDER BY d RESET WHEN x < 0) FROM t;" }
      - { id: rank_ansi, sql: "SELECT RANK() OVER (PARTITION BY a ORDER BY x DESC) FROM t;" }
      - { id: rank_nulls_first, sql: "SELECT RANK() OVER (ORDER BY x DESC NULLS FIRST) FROM t;" }
      - { id: rank_with_ties_low, sql: "SELECT RANK() OVER (ORDER BY x WITH TIES LOW) FROM t;", note: "RANK() OVER ( ... [ WITH TIES { LOW | HIGH | AVG | DENSE } ] )" }
      - { id: rank_with_ties_high, sql: "SELECT RANK() OVER (ORDER BY x WITH TIES HIGH) FROM t;" }
      - { id: rank_with_ties_avg, sql: "SELECT RANK() OVER (ORDER BY x WITH TIES AVG) FROM t;" }
      - { id: rank_with_ties_dense, sql: "SELECT RANK() OVER (ORDER BY x WITH TIES DENSE) FROM t;" }
      - { id: dense_rank, sql: "SELECT DENSE_RANK() OVER (PARTITION BY a ORDER BY x) FROM t;" }
      - { id: percent_rank, sql: "SELECT PERCENT_RANK() OVER (PARTITION BY a ORDER BY x) FROM t;" }
      - { id: cume_dist, sql: "SELECT CUME_DIST() OVER (PARTITION BY a ORDER BY x) FROM t;" }
      - { id: rank_teradata, sql: "SELECT RANK(x DESC) FROM t;", note: "Teradata RANK ( sort_spec [,...] ) form" }
      - { id: rank_teradata_multi, sql: "SELECT RANK(x ASC, y DESC) FROM t;" }
      - { id: quantile, sql: "SELECT QUANTILE(100, x) FROM t;", note: "QUANTILE ( quantile_literal, sort_spec [,...] )" }
      - { id: quantile_desc, sql: "SELECT QUANTILE(4, x DESC, y ASC) FROM t;" }
      - { id: median, sql: "SELECT MEDIAN(x) FROM t;" }
      - { id: median_over, sql: "SELECT MEDIAN(x) OVER (PARTITION BY a) FROM t;" }

  - id: c_window_value_functions
    name: Value window functions (FIRST_VALUE, LAST_VALUE, LAG, LEAD)
    doc: https://docs.teradata.com/reader/ka4q4xtYpyQGplkKwXaNBQ/vSN0RZoGUdlw914fOUqfSQ
    tier: high
    probes:
      - { id: first_value, sql: "SELECT FIRST_VALUE(x) OVER (PARTITION BY a ORDER BY d) FROM t;" }
      - { id: last_value, sql: "SELECT LAST_VALUE(x) OVER (PARTITION BY a ORDER BY d ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING) FROM t;" }
      - { id: first_value_ignore_nulls, sql: "SELECT FIRST_VALUE(x IGNORE NULLS) OVER (ORDER BY d) FROM t;" }
      - { id: last_value_respect_nulls, sql: "SELECT LAST_VALUE(x RESPECT NULLS) OVER (ORDER BY d) FROM t;" }
      - { id: lag_default, sql: "SELECT LAG(x) OVER (ORDER BY d) FROM t;" }
      - { id: lag_offset, sql: "SELECT LAG(x, 2) OVER (PARTITION BY a ORDER BY d) FROM t;" }
      - { id: lag_offset_default, sql: "SELECT LAG(x, 1, 0) OVER (ORDER BY d) FROM t;" }
      - { id: lag_default_only, sql: "SELECT LAG(x, , 0) OVER (ORDER BY d) FROM t;", note: "offset_spec: [ offset_value ] [, [ default_value_expression ] ] allows omitting offset_value" }
      - { id: lead_default, sql: "SELECT LEAD(x) OVER (ORDER BY d) FROM t;" }
      - { id: lead_offset_default, sql: "SELECT LEAD(x, 2, -1) OVER (PARTITION BY a ORDER BY d) FROM t;" }
      - { id: lag_ignore_nulls_inside, sql: "SELECT LAG(x IGNORE NULLS, 1) OVER (ORDER BY d) FROM t;", note: "Teradata form: value_expression [ { IGNORE | RESPECT } NULLS ] inside the parentheses" }
      - { id: lead_respect_nulls_outside, sql: "SELECT LEAD(x, 1) RESPECT NULLS OVER (ORDER BY d) FROM t;", note: "ANSI form: [ { RESPECT | IGNORE } NULLS ] after the argument list" }
      - { id: lag_order_nulls, sql: "SELECT LAG(x) OVER (PARTITION BY a ORDER BY d DESC NULLS LAST) FROM t;" }
      - { id: lag_reset_when, sql: "SELECT LAG(x) OVER (ORDER BY d RESET WHEN x < 0) FROM t;" }

  - id: c_teradata_ordered_analytic_functions
