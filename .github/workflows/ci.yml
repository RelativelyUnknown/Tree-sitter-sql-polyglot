name: Build/test
on:
  push:
    branches:
      - "main"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - 'main'

# Cancel superseded runs of the same PR/branch — a new push obsoletes the
# previous run, so don't pay for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Corpus tests, sharded by dialect group ──────────────────────────────────
  # Grammar corpus tests are OS-independent, so they run on ubuntu only.
  # The 19 grammars are split into shards that run in parallel; each shard
  # generates and tests only its own dialects. Dialects that extend another
  # grammar (spark→hive, databricks→spark, mariadb→mysql, athena→trino) are
  # kept in the same shard as their parents.
  #
  # Caching strategy: the exact key hashes every grammar source, but
  # restore-keys falls back to the shard's most recent cache on a miss.
  # scripts/generate.js then re-generates only the grammars whose own hash
  # (including ancestor-chain files) actually changed — so a postgres-only PR
  # regenerates 1 parser, not 19. ~/.cache/tree-sitter holds the compiled
  # test libraries so `tree-sitter test` skips recompiling unchanged parsers.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Capped so at most 2 of the 5 shards claim a heavy ubuntu-latest runner
      # at once — launching all 5 (plus the coverage job) simultaneously has
      # been observed to exceed this account's concurrent-runner capacity,
      # with the runner getting reclaimed mid-generate ("The operation was
      # canceled") on whichever shards lose the race.
      max-parallel: 2
      matrix:
        include:
          - shard: base
            dialects: ""
          - shard: hive-chain
            dialects: "hive spark databricks oracle db2 hana"
          - shard: pg-mysql
            dialects: "postgres mysql mariadb sqlite duckdb cockroachdb"
          - shard: warehouse
            dialects: "snowflake bigquery spanner tsql flink"
          # ClickHouse's grammar is right at the edge of tree-sitter's LR
          # table-construction memory ceiling on its own (see the
          # offset_fetch note in tools/features.yml) — even alone, with
          # GENERATE_CONCURRENCY=1 and no other dialect sharing the runner,
          # its `tree-sitter generate` has taken 10+ minutes and gotten the
          # runner reclaimed. Isolated in its own shard so nothing else
          # competes for the runner's time/memory budget at all.
          - shard: clickhouse
            dialects: "clickhouse"
          - shard: trino-chain
            dialects: "trino athena redshift teradata"
    steps:
      - uses: actions/checkout@v4
      - uses: tree-sitter/setup-action@v2
        with:
          install-lib: false
          tree-sitter-ref: v0.26.3

      - uses: actions/cache@v4
        with:
          path: |
            src/parser.c
            src/node-types.json
            src/grammar.json
            src/tree_sitter/
            */src/parser.c
            */src/node-types.json
            */src/grammar.json
            */src/tree_sitter/
            .grammar-cache/
            ~/.cache/tree-sitter/
          key: parsers-v2-${{ matrix.shard }}-${{ hashFiles('grammar.js', 'grammar/**', '*/grammar.js', '*/grammar/**') }}
          restore-keys: |
            parsers-v2-${{ matrix.shard }}-

      # ClickHouse's tree-sitter generate peaks at ~15.4GB RSS on a 16GB
      # runner (measured locally: converges cleanly at +291s, exit 0, but
      # with only ~50MB of system memory free at the peak). That's not a
      # runaway/pathological grammar — it's a real, very large table that
      # just happens to land right at the physical ceiling, so any other
      # resident process (the runner's own agent, cache restore, etc.)
      # tips it into the OOM kill Actions reports as "the runner has
      # received a shutdown signal". Swap gives it headroom to finish
      # without needing a bigger runner.
      - name: Increase swap (ClickHouse generate is memory-bound)
        if: matrix.shard == 'clickhouse'
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      # generate.js is hash-cached per grammar (including ancestor chains), so
      # on a warm restore only the changed grammars are regenerated. Dialects
      # in a shard are generated concurrently (scripts/generate-all.js):
      # each dialect's grammar.js composes its parent grammar from JS SOURCE
      # (not the parent's compiled output), so there is no ordering
      # dependency and running tree-sitter generate for several dialects at
      # once is safe.
      - name: Generate parsers
        # Force strictly sequential generation: generate-all.js's own
        # memory-bound concurrency (6GB/worker budget) still allows 2 workers
        # on a standard 16GB runner, and two of the heavier grammars
        # (spark/databricks/oracle/db2/hana/clickhouse) generating at once has
        # been observed to exceed that and OOM the whole runner VM — which
        # Actions reports as "the runner has received a shutdown signal"
        # rather than an ordinary step failure. Trade wall-clock time for
        # reliability here.
        env:
          GENERATE_CONCURRENCY: 1
        run: |
          if [ -z "${{ matrix.dialects }}" ]; then
            node scripts/generate.js
          else
            node scripts/generate-all.js ${{ matrix.dialects }}
          fi

      # Publish this shard's freshly-generated parsers so the coverage job can
      # reuse them instead of regenerating all 22 from scratch (~86 min). The
      # globs only match what this shard actually built (base shard → root src/;
      # dialect shards → their */src/). The .grammar-cache/*.hash markers travel
      # too, so the coverage job's `generate:all` sees a full hash-cache hit and
      # no-ops. Parsers are built with tree-sitter-cli@v0.26.3 (same pin
      # coverage.py uses to parse), so they are ABI-compatible for reuse.
      - name: Upload parsers for coverage reuse
        uses: actions/upload-artifact@v4
        with:
          name: parsers-${{ matrix.shard }}
          # .grammar-cache/ is dot-prefixed; upload-artifact@v4 excludes hidden
          # paths by default, which would drop the hash markers and force the
          # coverage job to regenerate all 22 from scratch (the exact ~86 min /
          # OOM this reuse is meant to avoid). Opt them back in.
          include-hidden-files: true
          path: |
            src/parser.c
            src/*.json
            src/tree_sitter/
            */src/parser.c
            */src/*.json
            */src/tree_sitter/
            .grammar-cache/
          retention-days: 1
          if-no-files-found: warn

      # Rust build cache for the base parser-test-action (cargo test of the
      # Rust binding is the slowest part of the base shard).
      - uses: Swatinem/rust-cache@v2
        if: matrix.shard == 'base'

      - name: Run tests (base SQL)
        if: matrix.shard == 'base'
        uses: tree-sitter/parser-test-action@v3
        with:
          test-rust: true
          test-node: false
          test-python: true
          # The action defaults generate: true, which — with no dialect
          # argument of its own — walks every grammar.js it finds in the
          # checkout (all 22 dialects, not just base) and regenerates each
          # one sequentially, ignoring both the cache restored above and this
          # job's own "Generate parsers" step that already built base
          # successfully. That redundant, unbounded pass has been observed
          # to run 25+ minutes before the runner gets reclaimed. base is
          # already generated by this point — skip regenerating.
          generate: false

      - name: Keyword/highlights sync check
        if: matrix.shard == 'base'
        run: scripts/test-keywords.sh

      - name: Run dialect corpus tests
        if: matrix.dialects != ''
        run: |
          for d in ${{ matrix.dialects }}; do
            echo "::group::tree-sitter test ($d)"
            (cd "$d" && tree-sitter test)
            echo "::endgroup::"
          done

  # ── Corroborated feature coverage ───────────────────────────────────────────
  # One coverage step. tools/coverage.py parses every probe in tools/features.yml
  # with our parsers AND with independent reference parsers (SQLGlot, ANTLR
  # grammars-v4, pglast, sqlfluff), scores the base against ISO Core, and fails on
  # coverage regressions, new "suspect" probes (ours accepts, no reference does),
  # or ANSI purity violations. Baseline: tools/coverage.json.
  coverage:
    # Runs after the test matrix rather than alongside it: this job's own
    # `generate:all` redoes generation for every dialect the matrix shards
    # already cover, and running both at once was pushing simultaneous heavy
    # ubuntu-latest job count past this account's sustainable concurrency
    # (observed as runner reclaim — "The operation was canceled" — mid-generate).
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: tree-sitter/setup-action@v2
        with:
          install-lib: false
          tree-sitter-ref: v0.26.3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Parsers now come from the test matrix via download-artifact (below), so
      # this cache only carries the ANTLR reference-parser build and the
      # tree-sitter on-the-fly compile cache — the slow-to-rebuild, parser-
      # independent pieces.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/tree-sitter/
            tools/antlr/build/
            tools/antlr/*.jar
          key: coverage-deps-${{ hashFiles('tools/antlr/setup.sh') }}
          restore-keys: |
            coverage-deps-

      # Reuse the parsers the test matrix already built this run (each shard
      # uploaded its own via "Upload parsers for coverage reuse"). merge-multiple
      # reconstructs root src/ and every <dialect>/src/ in place, plus the
      # .grammar-cache/*.hash markers — so the generate:all below is a no-op.
      # This replaces the ~86-min full regeneration (and the swap it required).
      - name: Download parsers from test matrix
        uses: actions/download-artifact@v4
        with:
          pattern: parsers-*
          merge-multiple: true

      - name: Generate all parsers (no-op when artifacts restored; safety net)
        # With the downloaded parsers + .grammar-cache/*.hash markers present,
        # generate.js's hash cache skips every grammar ("unchanged — skipping
        # generate"), so this returns in seconds. It self-heals only what's
        # actually missing if an artifact failed to transport. GENERATE_CONCURRENCY=1
        # keeps that fallback path safe (see the test job's note).
        env:
          GENERATE_CONCURRENCY: 1
        run: npm run generate:all

      # Log per-grammar parser size (src/parser.c bytes), STATE_COUNT /
      # LARGE_STATE_COUNT and declared-conflict count, ranked, so GLR
      # table growth is visible in every run without regenerating.
      - name: Log grammar/parser sizes
        run: python tools/glr_scan.py --no-generate --no-stress

      - name: Install corroborators
        run: |
          pip install -r tools/requirements.txt
          bash tools/antlr/setup.sh

      # No TREE_SITTER_BIN override: coverage.py's own default pins the same
      # npx tree-sitter-cli@v0.26.3 that generate.js uses to build the parsers.
      # Overriding it to the setup-action CLI (0.26.11) parses parser.c built by
      # a different CLI version — that ABI mismatch produces false
      # "implemented → absent" regressions on some probes.
      - name: Coverage gate (regressions / suspects / purity)
        run: python tools/coverage.py --check

      # Full run for the human-readable report + job summary. Runs even if the
      # gate failed, so a red PR still gets a diagnosable report.
      - name: Build coverage report
        if: always()
        run: python tools/coverage.py

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            docs/coverage.md
            tools/coverage.json
          retention-days: 30

  # ── Node native binding (OS matrix) ─────────────────────────────────────────
  # node-gyp compiles parser.c to a native .node addon. The result is
  # platform-specific, so this job stays as a 3-OS matrix.
  test_node:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Re-use the base shard's parser cache so generation is skipped on a
      # warm restore. src/tree_sitter/ headers must be cached alongside
      # parser.c: they are generated together by tree-sitter generate and
      # required by node-gyp to compile binding.cc
      # (include_dirs: ["src"] → #include "tree_sitter/parser.h").
      - uses: actions/cache@v4
        with:
          path: |
            src/parser.c
            src/node-types.json
            src/tree_sitter/
            .grammar-cache/
          key: parsers-node-${{ runner.os }}-${{ hashFiles('grammar.js', 'grammar/**') }}
          restore-keys: |
            parsers-node-${{ runner.os }}-

      # npm ci runs the install hook: node scripts/generate.js && node-gyp-build
      # generate.js skips regeneration on cache hit; node-gyp-build compiles the
      # native addon from src/parser.c.
      - run: npm ci
      - run: node --test bindings/node/*_test.js

  # ── Validate corpus file integrity ──────────────────────────────────────────
  validate_tests:
    runs-on: ["ubuntu-latest"]
    strategy:
      fail-fast: true
    steps:
      - uses: actions/checkout@v4
      - run: |
          STATUS=0
          # Match tree-sitter error NODES in expected parse trees (the S-expression
          # forms "(ERROR", "(MISSING", "(UNEXPECTED") rather than the bare words,
          # which legitimately appear in valid SQL (e.g. EXCEPTION WHEN ERROR THEN,
          # ERROR_MESSAGE(), RAISERROR(...)). errors.txt holds intentional error tests.
          for dir in test spark/test databricks/test postgres/test mysql/test snowflake/test mariadb/test sqlite/test hive/test oracle/test db2/test duckdb/test trino/test athena/test redshift/test bigquery/test tsql/test clickhouse/test flink/test cockroachdb/test spanner/test teradata/test hana/test; do
            if [[ $(grep -rnE --exclude=errors.txt '\(ERROR' "$dir/" 2>/dev/null | wc -l) -gt 0 ]]; then
                echo "Found 'ERROR' in $dir: "
                grep -rnE --exclude=errors.txt '\(ERROR' "$dir/" | cut -f1,2 -d:
                STATUS=1
            fi
            if [[ $(grep -rnE --exclude=errors.txt '\(MISSING' "$dir/" 2>/dev/null | wc -l) -gt 0 ]]; then
                echo "Found 'MISSING' in $dir: "
                grep -rnE --exclude=errors.txt '\(MISSING' "$dir/" | cut -f1,2 -d:
                STATUS=1
            fi
            if [[ $(grep -rnE --exclude=errors.txt '\(UNEXPECTED' "$dir/" 2>/dev/null | wc -l) -gt 0 ]]; then
                echo "Found 'UNEXPECTED' in $dir: "
                grep -rnE --exclude=errors.txt '\(UNEXPECTED' "$dir/" | cut -f1,2 -d:
                STATUS=1
            fi
          done
          exit $STATUS
