dialect: mysql
engine: MySQL
version: "8.4"
source: https://dev.mysql.com/doc/refman/8.4/en/sql-statements.html

statements:
  - id: show_engines
    name: SHOW ENGINES
    doc: https://dev.mysql.com/doc/refman/8.4/en/show-engines.html
    tier: medium
    probes:
      - id: basic
        sql: "SHOW ENGINES;"
      - id: storage
        sql: "SHOW STORAGE ENGINES;"

  - id: show_errors
    name: SHOW ERRORS
    doc: https://dev.mysql.com/doc/refman/8.4/en/show-errors.html
    tier: medium
    probes:
      - id: basic
        sql: "SHOW ERRORS;"
      - id: limit
        sql: "SHOW ERRORS LIMIT 10;"
      - id: limit_offset
        sql: "SHOW ERRORS LIMIT 5, 10;"
      - id: count
        sql: "SHOW COUNT(*) ERRORS;"
    examples:
      - "SHOW COUNT(*) ERRORS;"

  - id: show_events
    name: SHOW EVENTS
    doc: https://dev.mysql.com/doc/refman/8.4/en/show-events.html
    tier: medium
    probes:
      - id: basic
        sql: "SHOW EVENTS;"
      - id: from_schema
        sql: "SHOW EVENTS FROM s;"
      - id: in_schema
        sql: "SHOW EVENTS IN s;"
      - id: like
        sql: "SHOW EVENTS LIKE 'e%';"
      - id: where
        sql: "SHOW EVENTS WHERE Status = 'ENABLED';"
      - id: from_like
        sql: "SHOW EVENTS FROM s LIKE 'e%';"
    examples:
      - "SHOW EVENTS FROM test;"

  - id: show_function_status
    name: SHOW FUNCTION STATUS
    doc: https://dev.mysql.com/doc/refman/8.4/en/show-function-status.html
    tier: medium
    probes:
      - id: basic
        sql: "SHOW FUNCTION STATUS;"
      - id: like
        sql: "SHOW FUNCTION STATUS LIKE 'f%';"
      - id: where
        sql: "SHOW FUNCTION STATUS WHERE Db = 'test';"

  - id: show_grants
    name: SHOW GRANTS
    doc: https://dev.mysql.com/doc/refman/8.4/en/show-grants.html
    tier: medium
    probes:
      - id: basic
        sql: "SHOW GRANTS;"
      - id: for_user
        sql: "SHOW GRANTS FOR 'jeffrey'@'localhost';"
      - id: for_unquoted_user
        sql: "SHOW GRANTS FOR u1;"
      - id: for_current_user
        sql: "SHOW GRANTS FOR CURRENT_USER;"
      - id: for_current_user_parens
        sql: "SHOW GRANTS FOR CURRENT_USER();"
      - id: using_role
        sql: "SHOW GRANTS FOR 'u1'@'localhost' USING 'r1';"
      - id: using_roles
        sql: "SHOW GRANTS FOR 'u1'@'localhost' USING 'r1', 'r2';"
    examples:
      - "SHOW GRANTS FOR 'jeffrey'@'localhost';"
      - "SHOW GRANTS FOR 'u1'@'localhost' USING 'r1';"
      - "SHOW GRANTS FOR 'u1'@'localhost' USING 'r1', 'r2';"

  - id: show_index
    name: SHOW INDEX
    doc: https://dev.mysql.com/doc/refman/8.4/en/show-index.html
    tier: medium
    probes:
      - id: index_from
        sql: "SHOW INDEX FROM t;"
      - id: indexes_in
        sql: "SHOW INDEXES IN t;"
      - id: keys_from
        sql: "SHOW KEYS FROM t;"
      - id: from_db
        sql: "SHOW INDEX FROM t FROM db;"
      - id: qualified_table
        sql: "SHOW INDEX FROM db.t;"
      - id: extended
        sql: "SHOW EXTENDED INDEX FROM t;"
        note: "Syntax block: SHOW [EXTENDED] {INDEX | INDEXES | KEYS} {FROM | IN} tbl_name"
      - id: where
        sql: "SHOW INDEX FROM t WHERE Key_name = 'PRIMARY';"
    examples:
      - "SHOW INDEX FROM mytable FROM mydb;"
      - "SHOW INDEX FROM mydb.mytable;"

  - id: show_privileges
    name: SHOW PRIVILEGES
    doc: https://dev.mysql.com/doc/refman/8.4/en/show-privileges.html
    tier: medium
    probes:
      - id: basic
        sql: "SHOW PRIVILEGES;"

  - id: show_procedure_status
    name: SHOW PROCEDURE STATUS
    doc: https://dev.mysql.com/doc/refman/8.4/en/show-procedure-status.html
    tier: medium
    probes:
      - id: basic
        sql: "SHOW PROCEDURE STATUS;"
      - id: like
        sql: "SHOW PROCEDURE STATUS LIKE 'sp%';"
      - id: where
        sql: "SHOW PROCEDURE STATUS WHERE Db = 'test';"

  - id: show_processlist
    name: SHOW PROCESSLIST
    doc: https://dev.mysql.com/doc/refman/8.4/en/show-processlist.html
    tier: medium
    probes:
      - id: basic
        sql: "SHOW PROCESSLIST;"
      - id: full
        sql: "SHOW FULL PROCESSLIST;"

  - id: show_status
    name: SHOW STATUS
    doc: https://dev.mysql.com/doc/refman/8.4/en/show-status.html
    tier: medium
    probes:
      - id: basic
        sql: "SHOW STATUS;"
      - id: global
        sql: "SHOW GLOBAL STATUS;"
      - id: session
        sql: "SHOW SESSION STATUS;"
      - id: like
        sql: "SHOW STATUS LIKE 'Key%';"
      - id: where
        sql: "SHOW STATUS WHERE Variable_name = 'Threads_connected';"
      - id: global_like
        sql: "SHOW GLOBAL STATUS LIKE 'Com%';"
    examples:
      - "SHOW STATUS;"
      - "SHOW STATUS LIKE 'Key%';"
