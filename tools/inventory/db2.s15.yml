dialect: db2
engine: IBM Db2 for Linux, UNIX and Windows
version: "11.5"
source: https://www.ibm.com/docs/en/db2/11.5.x?topic=reference-statements

statements:
  - id: drop
    name: DROP
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-drop
    tier: high
    probes:
      - { id: alias, sql: "DROP ALIAS a1;" }
      - { id: public_alias, sql: "DROP PUBLIC ALIAS a1;" }
      - { id: alias_for_table, sql: "DROP ALIAS a1 FOR TABLE;" }
      - { id: alias_for_module, sql: "DROP ALIAS a1 FOR MODULE;" }
      - { id: alias_for_sequence, sql: "DROP ALIAS a1 FOR SEQUENCE;" }
      - { id: audit_policy, sql: "DROP AUDIT POLICY p;" }
      - { id: bufferpool, sql: "DROP BUFFERPOOL bp;" }
      - { id: database_partition_group, sql: "DROP DATABASE PARTITION GROUP g;" }
      - { id: event_monitor, sql: "DROP EVENT MONITOR m;" }
      - { id: function, sql: "DROP FUNCTION f;" }
      - { id: function_signature, sql: "DROP FUNCTION s.f (INT, FLOAT);" }
      - { id: function_restrict, sql: "DROP FUNCTION f RESTRICT;" }
      - { id: specific_function, sql: "DROP SPECIFIC FUNCTION s.f1;" }
      - { id: function_mapping, sql: "DROP FUNCTION MAPPING fm;" }
      - { id: histogram_template, sql: "DROP HISTOGRAM TEMPLATE ht;" }
      - { id: index, sql: "DROP INDEX idx;" }
      - { id: index_extension, sql: "DROP INDEX EXTENSION ie RESTRICT;" }
      - { id: mask, sql: "DROP MASK m;" }
      - { id: method, sql: "DROP METHOD m (INT) FOR t;" }
      - { id: specific_method, sql: "DROP SPECIFIC METHOD m1;" }
      - { id: method_restrict, sql: "DROP METHOD m FOR t RESTRICT;" }
      - { id: module, sql: "DROP MODULE m;" }
      - { id: nickname, sql: "DROP NICKNAME n;" }
      - { id: package, sql: "DROP PACKAGE p;" }
      - { id: package_version, sql: "DROP PACKAGE p VERSION v1;" }
      - { id: permission, sql: "DROP PERMISSION p;" }
      - { id: procedure, sql: "DROP PROCEDURE p;" }
      - { id: procedure_signature, sql: "DROP PROCEDURE s.p (INT, VARCHAR(10));" }
      - { id: procedure_restrict, sql: "DROP PROCEDURE p RESTRICT;" }
      - { id: specific_procedure, sql: "DROP SPECIFIC PROCEDURE s.p1;" }
      - { id: role, sql: "DROP ROLE r;" }
      - { id: schema_restrict, sql: "DROP SCHEMA s RESTRICT;" }
      - { id: security_label, sql: "DROP SECURITY LABEL sl RESTRICT;" }
      - { id: security_label_component, sql: "DROP SECURITY LABEL COMPONENT slc;" }
      - { id: security_policy, sql: "DROP SECURITY POLICY sp RESTRICT;" }
      - { id: sequence, sql: "DROP SEQUENCE sq RESTRICT;" }
      - { id: server, sql: "DROP SERVER srv;" }
      - { id: service_class, sql: "DROP SERVICE CLASS sc;" }
      - { id: service_class_under, sql: "DROP SERVICE CLASS sc UNDER ssc;" }
      - { id: stogroup, sql: "DROP STOGROUP sg RESTRICT;" }
      - { id: table, sql: "DROP TABLE t;" }
      - { id: table_if_exists, sql: "DROP TABLE IF EXISTS t;" }
      - { id: table_if_exists_after_name, sql: "DROP TABLE t IF EXISTS;", note: "Netezza-compatibility form: IF EXISTS may follow table-name (syntax note 2)" }
      - { id: table_hierarchy, sql: "DROP TABLE HIERARCHY root_t;" }
      - { id: tablespace, sql: "DROP TABLESPACE ts;" }
      - { id: tablespaces, sql: "DROP TABLESPACES ts1, ts2;" }
      - { id: transform_all, sql: "DROP TRANSFORM ALL FOR t;" }
      - { id: transforms_group, sql: "DROP TRANSFORMS grp FOR t;" }
      - { id: threshold, sql: "DROP THRESHOLD th;" }
      - { id: trigger, sql: "DROP TRIGGER trg;" }
      - { id: trusted_context, sql: "DROP TRUSTED CONTEXT tc;" }
      - { id: type, sql: "DROP TYPE ty RESTRICT;" }
      - { id: type_mapping, sql: "DROP TYPE MAPPING tm;" }
      - { id: usage_list, sql: "DROP USAGE LIST ul;" }
      - { id: user_mapping_for_authid, sql: "DROP USER MAPPING FOR u SERVER srv;" }
      - { id: user_mapping_for_user, sql: "DROP USER MAPPING FOR USER SERVER srv;" }
      - { id: variable, sql: "DROP VARIABLE v RESTRICT;" }
      - { id: view, sql: "DROP VIEW v;" }
      - { id: view_hierarchy, sql: "DROP VIEW HIERARCHY root_v;" }
      - { id: work_action_set, sql: "DROP WORK ACTION SET was;" }
      - { id: work_class_set, sql: "DROP WORK CLASS SET wcs;" }
      - { id: workload, sql: "DROP WORKLOAD w;" }
      - { id: wrapper, sql: "DROP WRAPPER w;" }
      - { id: xsrobject, sql: "DROP XSROBJECT x;" }
    examples:
      - "DROP TABLE TDEPT;"
      - "DROP FUNCTION CENTER ( INT,FLOAT);"
      - "DROP SCHEMA INVENTRY RESTRICT;"

  - id: fetch
    name: FETCH
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-fetch
    tier: high
    probes:
      - { id: into, sql: "FETCH c1 INTO v1;" }
      - { id: from_into, sql: "FETCH FROM c1 INTO v1;" }
      - { id: into_list, sql: "FETCH c1 INTO v1, v2, v3;" }
      - { id: into_array_element, sql: "FETCH c1 INTO arr[1];" }
      - { id: into_field_reference, sql: "FETCH c1 INTO rv.fld;" }
      - { id: into_global_variable, sql: "FETCH c1 INTO s.gv;" }
      - { id: using_descriptor, sql: "FETCH c1 USING DESCRIPTOR :sqlda3;", note: "Dynamic embedded-SQL form with an SQLDA host variable" }
      - { id: cursor_variable, sql: "FETCH FROM cv INTO v1, v2;", note: "cursor-variable-name, valid inside a compound SQL (compiled) statement" }
