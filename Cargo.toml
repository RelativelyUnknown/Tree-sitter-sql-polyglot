[package]
name = "tree-sitter-sql-extended"
description = "Tree-sitter Grammar for SQL"
version = "1.0.0"
authors = ["relativelyunknown"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "sql"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/relativelyunknown/tree-sitter-sql-extended.git"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
    "/LICENSE", "bindings/rust/*", "grammar*", "queries/*", "src/*",
    "spark/src/*", "spark/queries/*",
    "postgres/src/*", "postgres/queries/*",
    "mysql/src/*", "mysql/queries/*",
    "databricks/src/*", "databricks/queries/*",
    "snowflake/src/*", "snowflake/queries/*",
    "bigquery/src/*", "bigquery/queries/*",
    "mariadb/src/*", "mariadb/queries/*",
    "sqlite/src/*", "sqlite/queries/*",
    "hive/src/*", "hive/queries/*",
    "oracle/src/*", "oracle/queries/*",
    "db2/src/*", "db2/queries/*",
    "tsql/src/*", "tsql/queries/*",
    "duckdb/src/*", "duckdb/queries/*",
    "trino/src/*", "trino/queries/*",
    "athena/src/*", "athena/queries/*",
    "redshift/src/*", "redshift/queries/*",
    "clickhouse/src/*", "clickhouse/queries/*",
    "flink/src/*", "flink/queries/*",
    "cockroachdb/src/*", "cockroachdb/queries/*",
    "spanner/src/*", "spanner/queries/*",
    "teradata/src/*", "teradata/queries/*",
    "hana/src/*", "hana/queries/*",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "~1.2.1"

[dev-dependencies]
tree-sitter = "~0.25.0"
