dialect: mysql
engine: MySQL
version: "8.4"
source: https://dev.mysql.com/doc/refman/8.4/en/sql-statements.html

statements:
  - id: cache_index
    name: CACHE INDEX
    doc: https://dev.mysql.com/doc/refman/8.4/en/cache-index.html
    tier: low
    probes:
      - id: tables
        sql: "CACHE INDEX t1, t2, t3 IN hot_cache;"
      - id: index_list
        sql: "CACHE INDEX t1 INDEX (idx1, idx2), t2 KEY (idx3) IN hot_cache;"
      - id: partition
        sql: "CACHE INDEX t1 PARTITION (p0, p1) IN hot_cache;"
      - id: partition_all
        sql: "CACHE INDEX t1 PARTITION (ALL) IN hot_cache;"

  - id: flush
    name: FLUSH
    doc: https://dev.mysql.com/doc/refman/8.4/en/flush.html
    tier: low
    probes:
      - id: privileges
        sql: "FLUSH PRIVILEGES;"
      - id: no_write_to_binlog_logs
        sql: "FLUSH NO_WRITE_TO_BINLOG BINARY LOGS, SLOW LOGS;"
      - id: relay_logs_channel
        sql: "FLUSH LOCAL RELAY LOGS FOR CHANNEL ch1;"
      - id: tables
        sql: "FLUSH TABLES;"
      - id: tables_with_read_lock
        sql: "FLUSH TABLES t1, t2 WITH READ LOCK;"
      - id: tables_for_export
        sql: "FLUSH TABLES t1, t2 FOR EXPORT;"

  - id: kill
    name: KILL
    doc: https://dev.mysql.com/doc/refman/8.4/en/kill.html
    tier: low
    probes:
      - id: connection
        sql: "KILL 42;"
      - id: kill_query
        sql: "KILL QUERY 42;"
      - id: kill_connection
        sql: "KILL CONNECTION 42;"

  - id: load_index_into_cache
    name: LOAD INDEX INTO CACHE
    doc: https://dev.mysql.com/doc/refman/8.4/en/load-index.html
    tier: low
    probes:
      - id: tables_ignore_leaves
        sql: "LOAD INDEX INTO CACHE t1, t2 IGNORE LEAVES;"
      - id: partition_index
        sql: "LOAD INDEX INTO CACHE t1 PARTITION (p0, p1) INDEX (idx1, idx2);"

  - id: reset
    name: RESET
    doc: https://dev.mysql.com/doc/refman/8.4/en/reset.html
    tier: low
    probes:
      - id: binary_logs_and_gtids
        sql: "RESET BINARY LOGS AND GTIDS;"
      - id: replica_list
        sql: "RESET REPLICA, BINARY LOGS AND GTIDS;"

  - id: reset_persist
    name: RESET PERSIST
    doc: https://dev.mysql.com/doc/refman/8.4/en/reset-persist.html
    tier: low
    probes:
      - id: all
        sql: "RESET PERSIST;"
      - id: if_exists_var
        sql: "RESET PERSIST IF EXISTS max_connections;"

  - id: restart
    name: RESTART
    doc: https://dev.mysql.com/doc/refman/8.4/en/restart.html
    tier: low
    probes:
      - id: basic
        sql: "RESTART;"

  - id: shutdown
    name: SHUTDOWN
    doc: https://dev.mysql.com/doc/refman/8.4/en/shutdown.html
    tier: low
    probes:
      - id: basic
        sql: "SHUTDOWN;"

  - id: help
    name: HELP
    doc: https://dev.mysql.com/doc/refman/8.4/en/help.html
    tier: low
    probes:
      - id: search_string
        sql: "HELP 'contents';"
