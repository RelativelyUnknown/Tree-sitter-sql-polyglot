dialect: oracle
engine: Oracle AI Database
version: "26ai"
source: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/toc.htm

statements:
  - id: create_pmem_filestore
    name: CREATE PMEM FILESTORE
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/create-pmem-filestore.html
    tier: low
    probes:
      - id: mountpoint_backingfile
        sql: "CREATE PMEM FILESTORE fs MOUNTPOINT '/corp/db/fs' BACKINGFILE '/var/pmem/fs_1' SIZE 2T BLOCK SIZE 8K AUTOEXTEND ON NEXT 10G MAXSIZE 3T;"
      - id: backingfile_reuse
        sql: "CREATE PMEM FILESTORE fs MOUNTPOINT '/corp/db/fs' BACKINGFILE '/var/pmem/fs_1' REUSE SIZE 2T;"

  - id: create_restore_point
    name: CREATE RESTORE POINT
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/CREATE-RESTORE-POINT.html
    tier: low
    probes:
      - id: basic
        sql: "CREATE RESTORE POINT rp;"
      - id: clean_guarantee
        sql: "CREATE CLEAN RESTORE POINT rp FOR PLUGGABLE DATABASE pdb1 AS OF SCN 1000 GUARANTEE FLASHBACK DATABASE;"

  - id: create_rollback_segment
    name: CREATE ROLLBACK SEGMENT
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/CREATE-ROLLBACK-SEGMENT.html
    tier: low
    probes:
      - id: basic
        sql: "CREATE ROLLBACK SEGMENT rs;"
      - id: public_tablespace_storage
        sql: "CREATE PUBLIC ROLLBACK SEGMENT rs TABLESPACE ts STORAGE (INITIAL 100K NEXT 100K);"

  - id: create_spfile
    name: CREATE SPFILE
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/CREATE-SPFILE.html
    tier: low
    probes:
      - id: from_pfile
        sql: "CREATE SPFILE = 'spfile_name' FROM PFILE = 'pfile_name' AS COPY;"
      - id: from_memory
        sql: "CREATE SPFILE FROM MEMORY;"

  - id: create_tablespace_set
    name: CREATE TABLESPACE SET
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/CREATE-TABLESPACE-SET.html
    tier: low
    probes:
      - id: basic
        sql: "CREATE TABLESPACE SET ts_set;"
      - id: in_shardspace_template
        sql: "CREATE TABLESPACE SET ts_set IN SHARDSPACE ss USING TEMPLATE (DATAFILE SIZE 100M BLOCKSIZE 8192 LOGGING);"

  - id: create_true_cache
    name: CREATE TRUE CACHE
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/create-true-cache.html
    tier: low
    probes:
      - id: basic
        sql: "CREATE TRUE CACHE;"

  - id: disassociate_statistics
    name: DISASSOCIATE STATISTICS
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/DISASSOCIATE-STATISTICS.html
    tier: low
    probes:
      - id: columns
        sql: "DISASSOCIATE STATISTICS FROM COLUMNS s.t.c;"
      - id: functions_force
        sql: "DISASSOCIATE STATISTICS FROM FUNCTIONS s.f FORCE;"

  - id: drop_analytic_view
    name: DROP ANALYTIC VIEW
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/DROP-ANALYTIC-VIEW.html
    tier: low
    probes:
      - id: basic
        sql: "DROP ANALYTIC VIEW av;"
      - id: if_exists_schema
        sql: "DROP ANALYTIC VIEW IF EXISTS s.av;"

  - id: drop_application_identity
    name: DROP APPLICATION IDENTITY
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/drop-application-identity.html
    tier: low
    probes:
      - id: basic
        sql: "DROP APPLICATION IDENTITY ai;"
      - id: if_exists
        sql: "DROP APPLICATION IDENTITY IF EXISTS ai;"

  - id: drop_assertion
    name: DROP ASSERTION
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/drop-assertion.html
    tier: low
    probes:
      - id: basic
        sql: "DROP ASSERTION a;"
      - id: if_exists_owner
        sql: "DROP ASSERTION IF EXISTS s.a;"

  - id: drop_attribute_dimension
    name: DROP ATTRIBUTE DIMENSION
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/DROP-ATTRIBUTE-DIMENSION.html
    tier: low
    probes:
      - id: basic
        sql: "DROP ATTRIBUTE DIMENSION ad;"
      - id: if_exists_schema
        sql: "DROP ATTRIBUTE DIMENSION IF EXISTS s.ad;"

  - id: drop_audit_policy_unified
    name: DROP AUDIT POLICY (Unified Auditing)
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/DROP-AUDIT-POLICY-Unified-Auditing.html
    tier: low
    probes:
      - id: basic
        sql: "DROP AUDIT POLICY p;"

  - id: drop_cluster
    name: DROP CLUSTER
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/DROP-CLUSTER.html
    tier: low
    probes:
      - id: basic
        sql: "DROP CLUSTER c;"
      - id: including_tables
        sql: "DROP CLUSTER IF EXISTS s.c INCLUDING TABLES CASCADE CONSTRAINTS;"

  - id: drop_data_grant
    name: DROP DATA GRANT
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/drop-data-grant.html
    tier: low
    probes:
      - id: basic
        sql: "DROP DATA GRANT g;"
      - id: if_exists_schema
        sql: "DROP DATA GRANT IF EXISTS s.g;"

  - id: drop_data_role
    name: DROP DATA ROLE
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/drop-data-role.html
    tier: low
    probes:
      - id: basic
        sql: "DROP DATA ROLE r;"
      - id: if_exists
        sql: "DROP DATA ROLE IF EXISTS r;"

  - id: drop_dimension
    name: DROP DIMENSION
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/DROP-DIMENSION.html
    tier: low
    probes:
      - id: basic
        sql: "DROP DIMENSION d;"
      - id: schema_qualified
        sql: "DROP DIMENSION s.d;"

  - id: drop_directive_validate
    name: DROP DIRECTIVE (VALIDATE)
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/drop-directive-validate.html
    tier: low
    probes:
      - id: basic
        sql: "DROP DIRECTIVE d;"

  - id: drop_diskgroup
    name: DROP DISKGROUP
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/DROP-DISKGROUP.html
    tier: low
    probes:
      - id: basic
        sql: "DROP DISKGROUP dg;"
      - id: force_including_contents
        sql: "DROP DISKGROUP dg FORCE INCLUDING CONTENTS;"
      - id: excluding_contents
        sql: "DROP DISKGROUP dg EXCLUDING CONTENTS;"

  - id: drop_edition
    name: DROP EDITION
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/DROP-EDITION.html
    tier: low
    probes:
      - id: basic
        sql: "DROP EDITION e;"
      - id: if_exists_cascade
        sql: "DROP EDITION IF EXISTS e CASCADE;"

  - id: drop_end_user
    name: DROP END USER
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/drop-end-user.html
    tier: low
    probes:
      - id: basic
        sql: "DROP END USER u;"
      - id: if_exists
        sql: "DROP END USER IF EXISTS u;"

  - id: drop_end_user_context
    name: DROP END USER CONTEXT
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/drop-end-user-context.html
    tier: low
    probes:
      - id: basic
        sql: "DROP END USER CONTEXT c;"
      - id: if_exists_schema
        sql: "DROP END USER CONTEXT IF EXISTS s.c;"

  - id: drop_flashback_archive
    name: DROP FLASHBACK ARCHIVE
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/DROP-FLASHBACK-ARCHIVE.html
    tier: low
    probes:
      - id: basic
        sql: "DROP FLASHBACK ARCHIVE fla;"

  - id: drop_hierarchy
    name: DROP HIERARCHY
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/DROP-HIERARCHY.html
    tier: low
    probes:
      - id: basic
        sql: "DROP HIERARCHY h;"
      - id: if_exists_schema
        sql: "DROP HIERARCHY IF EXISTS s.h;"

  - id: drop_indextype
    name: DROP INDEXTYPE
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/DROP-INDEXTYPE.html
    tier: low
    probes:
      - id: basic
        sql: "DROP INDEXTYPE it;"
      - id: if_exists_force
        sql: "DROP INDEXTYPE IF EXISTS s.it FORCE;"

  - id: drop_inmemory_join_group
    name: DROP INMEMORY JOIN GROUP
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/DROP-INMEMORY-JOIN-GROUP.html
    tier: low
    probes:
      - id: basic
        sql: "DROP INMEMORY JOIN GROUP jg;"
      - id: if_exists_schema
        sql: "DROP INMEMORY JOIN GROUP IF EXISTS s.jg;"

  - id: drop_java
    name: DROP JAVA
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/DROP-JAVA.html
    tier: low
    probes:
      - id: source
        sql: "DROP JAVA SOURCE s.obj;"
      - id: class_if_exists
        sql: "DROP JAVA IF EXISTS CLASS obj;"
      - id: resource
        sql: "DROP JAVA RESOURCE obj;"

  - id: drop_library
    name: DROP LIBRARY
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/DROP-LIBRARY.html
    tier: low
    probes:
      - id: basic
        sql: "DROP LIBRARY lib;"
      - id: if_exists
        sql: "DROP LIBRARY IF EXISTS lib;"

  - id: drop_lockdown_profile
    name: DROP LOCKDOWN PROFILE
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/DROP-LOCKDOWN-PROFILE.html
    tier: low
    probes:
      - id: basic
        sql: "DROP LOCKDOWN PROFILE lp;"

  - id: drop_materialized_zonemap
    name: DROP MATERIALIZED ZONEMAP
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/DROP-MATERIALIZED-ZONEMAP.html
    tier: low
    probes:
      - id: basic
        sql: "DROP MATERIALIZED ZONEMAP zm;"
      - id: schema_qualified
        sql: "DROP MATERIALIZED ZONEMAP s.zm;"

  - id: drop_mle_env
    name: DROP MLE ENV
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/drop-mle-env.html
    tier: low
    probes:
      - id: basic
        sql: "DROP MLE ENV e;"
      - id: if_exists_schema
        sql: "DROP MLE ENV IF EXISTS s.e;"

  - id: drop_mle_module
    name: DROP MLE MODULE
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/drop-mle-module.html
    tier: low
    probes:
      - id: basic
        sql: "DROP MLE MODULE m;"
      - id: if_exists_schema
        sql: "DROP MLE MODULE IF EXISTS s.m;"

  - id: drop_operator
    name: DROP OPERATOR
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/DROP-OPERATOR.html
    tier: low
    probes:
      - id: basic
        sql: "DROP OPERATOR op;"
      - id: if_exists_force
        sql: "DROP OPERATOR IF EXISTS s.op FORCE;"

  - id: drop_outline
    name: DROP OUTLINE
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/DROP-OUTLINE.html
    tier: low
    probes:
      - id: basic
        sql: "DROP OUTLINE o;"

  - id: drop_pluggable_database
    name: DROP PLUGGABLE DATABASE
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/DROP-PLUGGABLE-DATABASE.html
    tier: low
    probes:
      - id: basic
        sql: "DROP PLUGGABLE DATABASE pdb1;"
      - id: including_datafiles
        sql: "DROP PLUGGABLE DATABASE pdb1 INCLUDING DATAFILES;"
      - id: keep_datafiles
        sql: "DROP PLUGGABLE DATABASE pdb1 KEEP DATAFILES;"

  - id: drop_pmem_filestore
    name: DROP PMEM FILESTORE
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/drop-pmem-filestore.html
    tier: low
    probes:
      - id: basic
        sql: "DROP PMEM FILESTORE fs;"
      - id: force_including_contents
        sql: "DROP PMEM FILESTORE fs FORCE INCLUDING CONTENTS;"

  - id: drop_restore_point
    name: DROP RESTORE POINT
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/DROP-RESTORE-POINT.html
    tier: low
    probes:
      - id: basic
        sql: "DROP RESTORE POINT rp;"
      - id: for_pdb
        sql: "DROP RESTORE POINT rp FOR PLUGGABLE DATABASE pdb1;"

  - id: drop_rollback_segment
    name: DROP ROLLBACK SEGMENT
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/DROP-ROLLBACK-SEGMENT.html
    tier: low
    probes:
      - id: basic
        sql: "DROP ROLLBACK SEGMENT rs;"

  - id: drop_tablespace_set
    name: DROP TABLESPACE SET
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/DROP-TABLESPACE-SET.html
    tier: low
    probes:
      - id: basic
        sql: "DROP TABLESPACE SET ts_set;"
      - id: including_contents
        sql: "DROP TABLESPACE SET ts_set INCLUDING CONTENTS AND DATAFILES CASCADE CONSTRAINTS;"

  - id: flashback_database
    name: FLASHBACK DATABASE
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/FLASHBACK-DATABASE.html
    tier: low
    probes:
      - id: to_scn
        sql: "FLASHBACK DATABASE TO SCN 1000;"
      - id: to_restore_point
        sql: "FLASHBACK STANDBY DATABASE db TO RESTORE POINT rp;"
      - id: to_before_resetlogs
        sql: "FLASHBACK DATABASE TO BEFORE RESETLOGS;"
