      - { id: udt_sysudtlib, sql: "SELECT CAST(x AS SYSUDTLIB.my_udt);" }
      - { id: array_type_name, sql: "SELECT CAST(x AS phonenumbers_ary);" }
      - { id: array_type_sysudtlib, sql: "SELECT CAST(x AS SYSUDTLIB.phonenumbers_ary);" }
      - { id: udt_column_attribute, sql: "CREATE TABLE t (c my_udt NOT NULL);" }

  - id: a_cast
    name: CAST
    doc: https://docs.teradata.com/reader/lRnURD5njdYWi5Bs8dw7og/Wj~PjqhYyCZ_EKgtDR9lkQ
    tier: high
    probes:
      - { id: basic, sql: "SELECT CAST(c AS INTEGER) FROM t;" }
      - { id: spaced, sql: "SELECT CAST (c AS VARCHAR(10)) FROM t;" }
      - { id: literal, sql: "SELECT CAST('2020-01-01' AS DATE);" }
      - { id: expression, sql: "SELECT CAST(a + b AS DECIMAL(10, 2)) FROM t;" }
      - { id: nested, sql: "SELECT CAST(CAST(c AS CHAR(5)) AS INTEGER) FROM t;" }
      - { id: format_attribute, sql: "SELECT CAST(c AS DATE FORMAT 'YYYY-MM-DD') FROM t;" }
      - { id: char_with_format, sql: "SELECT CAST(d AS CHAR(10) FORMAT 'YYYY-MM-DD') FROM t;" }
      - { id: char_set_attribute, sql: "SELECT CAST(c AS VARCHAR(10) CHARACTER SET UNICODE) FROM t;" }
      - { id: named_attribute, sql: "SELECT CAST(c AS INTEGER NAMED n) FROM t;" }
      - { id: title_attribute, sql: "SELECT CAST(c AS INTEGER TITLE 'My Col') FROM t;" }
      - { id: attribute_only_format, sql: "SELECT CAST(c AS FORMAT '99999') FROM t;" }
      - { id: bigint_literal, sql: "SELECT ProdID FROM PartsTbl WHERE CustID = CAST(9876543210 AS BIGINT);" }
    examples:
      - "SELECT CAST (NULL AS DATE);"

  - id: a_teradata_conversion_syntax
    name: Teradata conversion syntax
    doc: https://docs.teradata.com/reader/lRnURD5njdYWi5Bs8dw7og/fZHid8rQSAck7XFxHosWdw
    tier: high
    probes:
      - { id: type, sql: "SELECT c (INTEGER) FROM t;" }
      - { id: char_type, sql: "SELECT c (CHAR(10)) FROM t;" }
      - { id: date_type, sql: "SELECT c (DATE) FROM t;" }
      - { id: decimal_type, sql: "SELECT c (DECIMAL(10, 2)) FROM t;" }
      - { id: format_only, sql: "SELECT c (FORMAT 'YYYY-MM-DD') FROM t;" }
      - { id: date_format, sql: "SELECT c (DATE, FORMAT 'YYYY-MM-DD') FROM t;" }
      - { id: format_then_type, sql: "SELECT c (FORMAT 'X(10)', CHAR(10)) FROM t;" }
      - { id: char_set, sql: "SELECT c (CHARACTER SET UNICODE) FROM t;" }
      - { id: char_type_char_set, sql: "SELECT c (VARCHAR(10), CHARACTER SET LATIN) FROM t;" }
      - { id: named, sql: "SELECT c (NAMED n) FROM t;" }
      - { id: title, sql: "SELECT c (TITLE 'My Column') FROM t;" }
      - { id: type_named_title, sql: "SELECT c (INTEGER, NAMED n, TITLE 'x') FROM t;" }
      - { id: chained, sql: "SELECT c (FORMAT '99') (NAMED y) FROM t;" }
      - { id: on_literal, sql: "SELECT '2020-01-01' (DATE, FORMAT 'YYYY-MM-DD');" }
      - { id: on_expression, sql: "SELECT (a + b) (FLOAT) FROM t;" }
      - { id: byte_to_byte, sql: "SELECT b (BYTE(4)) FROM t;" }

