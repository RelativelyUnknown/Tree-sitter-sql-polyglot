dialect: tsql
engine: SQL Server 2022 / Azure SQL Database
version: "2022"
source: https://learn.microsoft.com/en-us/sql/t-sql/statements/statements

statements:
- id: dbcc_freesessioncache
  name: "DBCC FREESESSIONCACHE"
  doc: "https://learn.microsoft.com/en-us/sql/t-sql/database-console-commands/dbcc-freesessioncache-transact-sql"
  tier: low
  probes:
  - id: basic
    sql: "DBCC FREESESSIONCACHE;"
  - id: no_infomsgs
    sql: "DBCC FREESESSIONCACHE WITH NO_INFOMSGS;"
- id: dbcc_freesystemcache
  name: "DBCC FREESYSTEMCACHE"
  doc: "https://learn.microsoft.com/en-us/sql/t-sql/database-console-commands/dbcc-freesystemcache-transact-sql"
  tier: low
  probes:
  - id: all
    sql: "DBCC FREESYSTEMCACHE ('ALL');"
  - id: pool_with_options
    sql: "DBCC FREESYSTEMCACHE ('ALL', default) WITH MARK_IN_USE_FOR_REMOVAL, NO_INFOMSGS;"
- id: dbcc_help
  name: "DBCC HELP"
  doc: "https://learn.microsoft.com/en-us/sql/t-sql/database-console-commands/dbcc-help-transact-sql"
  tier: low
  probes:
  - id: command
    sql: "DBCC HELP ('CHECKDB');"
  - id: question_mark
    sql: "DBCC HELP ('?') WITH NO_INFOMSGS;"
  - id: variable
    sql: "DBCC HELP (@dbcc_statement_var);"
- id: dbcc_indexdefrag
  name: "DBCC INDEXDEFRAG"
  doc: "https://learn.microsoft.com/en-us/sql/t-sql/database-console-commands/dbcc-indexdefrag-transact-sql"
  tier: low
  probes:
  - id: table
    sql: "DBCC INDEXDEFRAG (0, t);"
  - id: index_partition
    sql: "DBCC INDEXDEFRAG (db, t, idx, 0) WITH NO_INFOMSGS;"
- id: dbcc_inputbuffer
  name: "DBCC INPUTBUFFER"
  doc: "https://learn.microsoft.com/en-us/sql/t-sql/database-console-commands/dbcc-inputbuffer-transact-sql"
  tier: low
  probes:
  - id: session
    sql: "DBCC INPUTBUFFER (53);"
  - id: request
    sql: "DBCC INPUTBUFFER (53, 0) WITH NO_INFOMSGS;"
- id: dbcc_opentran
  name: "DBCC OPENTRAN"
  doc: "https://learn.microsoft.com/en-us/sql/t-sql/database-console-commands/dbcc-opentran-transact-sql"
  tier: low
  probes:
  - id: basic
    sql: "DBCC OPENTRAN;"
  - id: database_options
    sql: "DBCC OPENTRAN (db) WITH TABLERESULTS, NO_INFOMSGS;"
- id: dbcc_outputbuffer
  name: "DBCC OUTPUTBUFFER"
  doc: "https://learn.microsoft.com/en-us/sql/t-sql/database-console-commands/dbcc-outputbuffer-transact-sql"
  tier: low
  probes:
  - id: session
    sql: "DBCC OUTPUTBUFFER (53);"
  - id: request
    sql: "DBCC OUTPUTBUFFER (53, 0) WITH NO_INFOMSGS;"
- id: dbcc_pdw_showexecutionplan
  name: "DBCC PDW_SHOWEXECUTIONPLAN"
  doc: "https://learn.microsoft.com/en-us/sql/t-sql/database-console-commands/dbcc-pdw-showexecutionplan-transact-sql"
  tier: low
  status: not-applicable
  reason: "Page description: 'DBCC PDW_SHOWEXECUTIONPLAN displays the execution plan for a query running on a specific Azure Synapse Analytics compute node or control node.' Azure Synapse Analytics only: the page's monikerRange is =azure-sqldw-latest, so it is not available in SQL Server 2022 or Azure SQL Database."
- id: dbcc_pdw_showmaterializedviewoverhead
  name: "DBCC PDW_SHOWMATERIALIZEDVIEWOVERHEAD"
  doc: "https://learn.microsoft.com/en-us/sql/t-sql/database-console-commands/dbcc-pdw-showmaterializedviewoverhead-transact-sql"
  tier: low
  status: not-applicable
  reason: "Page description: '... held for materialized views for Azure Synapse Analytics.' Azure Synapse Analytics only: the page's monikerRange is =azure-sqldw-latest, so it is not available in SQL Server 2022 or Azure SQL Database."
- id: dbcc_pdw_showpartitionstats
  name: "DBCC PDW_SHOWPARTITIONSTATS"
  doc: "https://learn.microsoft.com/en-us/sql/t-sql/database-console-commands/dbcc-pdw-showpartitionstats-transact-sql"
  tier: low
  status: not-applicable
  reason: "Page description: 'DBCC PDW_SHOWPARTITIONSTATS displays the size and number of rows for each partition of a table in Azure Synapse Analytics.' Azure Synapse Analytics only: the page's monikerRange is =azure-sqldw-latest, so it is not available in SQL Server 2022 or Azure SQL Database."
- id: dbcc_pdw_showspaceused
  name: "DBCC PDW_SHOWSPACEUSED"
  doc: "https://learn.microsoft.com/en-us/sql/t-sql/database-console-commands/dbcc-pdw-showspaceused-transact-sql"
  tier: low
  status: not-applicable
  reason: "Page description: '... for all tables in Azure Synapse Analytics.' Azure Synapse Analytics only: the page's monikerRange is =azure-sqldw-latest, so it is not available in SQL Server 2022 or Azure SQL Database."
- id: dbcc_proccache
  name: "DBCC PROCCACHE"
  doc: "https://learn.microsoft.com/en-us/sql/t-sql/database-console-commands/dbcc-proccache-transact-sql"
  tier: low
  probes:
  - id: basic
    sql: "DBCC PROCCACHE;"
  - id: no_infomsgs
    sql: "DBCC PROCCACHE WITH NO_INFOMSGS;"
- id: dbcc_show_statistics
  name: "DBCC SHOW_STATISTICS"
  doc: "https://learn.microsoft.com/en-us/sql/t-sql/database-console-commands/dbcc-show-statistics-transact-sql"
  tier: low
  probes:
  - id: target
    sql: "DBCC SHOW_STATISTICS ('dbo.t', idx);"
  - id: stat_header
    sql: "DBCC SHOW_STATISTICS ('dbo.t', idx) WITH STAT_HEADER;"
  - id: multiple_options
    sql: "DBCC SHOW_STATISTICS ('dbo.t', idx) WITH NO_INFOMSGS, DENSITY_VECTOR, HISTOGRAM;"
  - id: stats_stream
    sql: "DBCC SHOW_STATISTICS ('dbo.t', idx) WITH STATS_STREAM;"
- id: dbcc_showcontig
  name: "DBCC SHOWCONTIG"
  doc: "https://learn.microsoft.com/en-us/sql/t-sql/database-console-commands/dbcc-showcontig-transact-sql"
  tier: low
  probes:
  - id: basic
    sql: "DBCC SHOWCONTIG;"
  - id: table_index
    sql: "DBCC SHOWCONTIG (t, idx);"
  - id: options
    sql: "DBCC SHOWCONTIG (t) WITH ALL_INDEXES, TABLERESULTS, FAST, ALL_LEVELS, NO_INFOMSGS;"
- id: dbcc_showresultcachespaceused
  name: "DBCC SHOWRESULTCACHESPACEUSED"
  doc: "https://learn.microsoft.com/en-us/sql/t-sql/database-console-commands/dbcc-showresultcachespaceused-transact-sql"
  tier: low
  status: not-applicable
  reason: "Page description: 'DBCC SHOWRESULTCACHESPACEUSED shows the storage space used result set caching for an Azure Synapse Analytics database.' Azure Synapse Analytics only: the page's monikerRange is =azure-sqldw-latest, so it is not available in SQL Server 2022 or Azure SQL Database."
- id: dbcc_shrinkdatabase
  name: "DBCC SHRINKDATABASE"
  doc: "https://learn.microsoft.com/en-us/sql/t-sql/database-console-commands/dbcc-shrinkdatabase-transact-sql"
  tier: low
  probes:
  - id: basic
    sql: "DBCC SHRINKDATABASE (db);"
  - id: target_percent
    sql: "DBCC SHRINKDATABASE (db, 10);"
  - id: notruncate
    sql: "DBCC SHRINKDATABASE (db, 10, NOTRUNCATE);"
  - id: truncateonly
    sql: "DBCC SHRINKDATABASE (0, TRUNCATEONLY);"
  - id: wait_at_low_priority
    sql: "DBCC SHRINKDATABASE (db, 10) WITH WAIT_AT_LOW_PRIORITY (ABORT_AFTER_WAIT = SELF), NO_INFOMSGS;"
- id: dbcc_shrinkfile
  name: "DBCC SHRINKFILE"
  doc: "https://learn.microsoft.com/en-us/sql/t-sql/database-console-commands/dbcc-shrinkfile-transact-sql"
  tier: low
  probes:
  - id: target_size
    sql: "DBCC SHRINKFILE (f1, 1);"
  - id: emptyfile
    sql: "DBCC SHRINKFILE (f1, EMPTYFILE);"
  - id: truncateonly
    sql: "DBCC SHRINKFILE (1, 1, TRUNCATEONLY);"
  - id: notruncate
    sql: "DBCC SHRINKFILE (f1, 1, NOTRUNCATE);"
  - id: wait_at_low_priority
    sql: "DBCC SHRINKFILE (f1, 1) WITH WAIT_AT_LOW_PRIORITY (ABORT_AFTER_WAIT = BLOCKERS), NO_INFOMSGS;"
- id: dbcc_shrinklog
  name: "DBCC SHRINKLOG"
  doc: "https://learn.microsoft.com/en-us/sql/t-sql/database-console-commands/dbcc-shrinklog-azure-sql-data-warehouse"
  tier: low
  status: not-applicable
  reason: "Page title 'DBCC SHRINKLOG - Azure Synapse Analytics' and description: 'DBCC SHRINKLOG reduces the size of the transaction log across the appliance for the current Azure Synapse Analytics database.' Azure Synapse Analytics only: the page's monikerRange is =azure-sqldw-latest, so it is not available in SQL Server 2022 or Azure SQL Database."
- id: dbcc_sqlperf
  name: "DBCC SQLPERF"
  doc: "https://learn.microsoft.com/en-us/sql/t-sql/database-console-commands/dbcc-sqlperf-transact-sql"
  tier: low
  probes:
  - id: logspace
    sql: "DBCC SQLPERF (LOGSPACE);"
  - id: wait_stats_clear
    sql: "DBCC SQLPERF (\"sys.dm_os_wait_stats\", CLEAR);"
  - id: latch_stats_clear
    sql: "DBCC SQLPERF (\"sys.dm_os_latch_stats\", CLEAR) WITH NO_INFOMSGS;"
- id: dbcc_traceoff
  name: "DBCC TRACEOFF"
  doc: "https://learn.microsoft.com/en-us/sql/t-sql/database-console-commands/dbcc-traceoff-transact-sql"
  tier: low
  probes:
  - id: single
    sql: "DBCC TRACEOFF (3205);"
  - id: multiple_global
    sql: "DBCC TRACEOFF (3604, 3605, -1) WITH NO_INFOMSGS;"
- id: dbcc_traceon
  name: "DBCC TRACEON"
  doc: "https://learn.microsoft.com/en-us/sql/t-sql/database-console-commands/dbcc-traceon-transact-sql"
  tier: low
  probes:
  - id: single
    sql: "DBCC TRACEON (3205);"
  - id: multiple_global
    sql: "DBCC TRACEON (3604, 3605, -1) WITH NO_INFOMSGS;"
- id: dbcc_tracestatus
  name: "DBCC TRACESTATUS"
  doc: "https://learn.microsoft.com/en-us/sql/t-sql/database-console-commands/dbcc-tracestatus-transact-sql"
  tier: low
  probes:
  - id: all
    sql: "DBCC TRACESTATUS (-1);"
  - id: list
    sql: "DBCC TRACESTATUS (2528, 3205) WITH NO_INFOMSGS;"
  - id: empty
    sql: "DBCC TRACESTATUS ();"
- id: dbcc_updateusage
  name: "DBCC UPDATEUSAGE"
  doc: "https://learn.microsoft.com/en-us/sql/t-sql/database-console-commands/dbcc-updateusage-transact-sql"
  tier: low
  probes:
  - id: database
    sql: "DBCC UPDATEUSAGE (0);"
  - id: table_index
    sql: "DBCC UPDATEUSAGE (db, t, idx);"
  - id: options
    sql: "DBCC UPDATEUSAGE (db, t) WITH NO_INFOMSGS, COUNT_ROWS;"
- id: dbcc_useroptions
  name: "DBCC USEROPTIONS"
  doc: "https://learn.microsoft.com/en-us/sql/t-sql/database-console-commands/dbcc-useroptions-transact-sql"
  tier: low
  probes:
  - id: basic
    sql: "DBCC USEROPTIONS;"
  - id: no_infomsgs
    sql: "DBCC USEROPTIONS WITH NO_INFOMSGS;"
- id: create_external_model
  name: "CREATE EXTERNAL MODEL"
  doc: "https://learn.microsoft.com/en-us/sql/t-sql/statements/create-external-model-transact-sql"
  tier: low
  probes:
  - id: basic
    sql: "CREATE EXTERNAL MODEL m WITH (LOCATION = 'https://example.openai.azure.com/openai/deployments/emb/embeddings', API_FORMAT = 'Azure OpenAI', MODEL_TYPE = EMBEDDINGS, MODEL = 'text-embedding-model-name');"
  - id: authorization_credential_parameters
    sql: "CREATE EXTERNAL MODEL m AUTHORIZATION dbo WITH (LOCATION = 'https://example.openai.azure.com/openai/deployments/emb/embeddings', API_FORMAT = 'Azure OpenAI', MODEL_TYPE = EMBEDDINGS, MODEL = 'text-embedding-model-name', CREDENTIAL = cred, PARAMETERS = '{\"valid\":\"JSON\"}', LOCAL_RUNTIME_PATH = 'C:\\onnx\\');"
- id: alter_external_model
  name: "ALTER EXTERNAL MODEL"
  doc: "https://learn.microsoft.com/en-us/sql/t-sql/statements/alter-external-model-transact-sql"
  tier: low
  probes:
  - id: basic
    sql: "ALTER EXTERNAL MODEL m SET (LOCATION = 'https://example.openai.azure.com/openai/deployments/emb/embeddings', API_FORMAT = 'Azure OpenAI', MODEL_TYPE = EMBEDDINGS, MODEL = 'text-embedding-ada-002');"
  - id: credential_parameters
    sql: "ALTER EXTERNAL MODEL m SET (LOCATION = 'https://example.openai.azure.com/openai/deployments/emb/embeddings', API_FORMAT = 'Azure OpenAI', MODEL_TYPE = EMBEDDINGS, MODEL = 'text-embedding-ada-002', CREDENTIAL = cred, PARAMETERS = '{\"valid\":\"JSON\"}');"
- id: drop_external_model
  name: "DROP EXTERNAL MODEL"
  doc: "https://learn.microsoft.com/en-us/sql/t-sql/statements/drop-external-model-transact-sql"
  tier: low
  probes:
  - id: basic
    sql: "DROP EXTERNAL MODEL m;"
- id: kill
  name: "KILL"
  doc: "https://learn.microsoft.com/en-us/sql/t-sql/language-elements/kill-transact-sql"
  tier: low
  probes:
  - id: session
    sql: "KILL 53;"
  - id: session_statusonly
    sql: "KILL 53 WITH STATUSONLY;"
  - id: uow
    sql: "KILL 'D5499C66-E398-45CA-BF7E-DC9C194B48CF';"
  - id: uow_commit
    sql: "KILL 'D5499C66-E398-45CA-BF7E-DC9C194B48CF' WITH COMMIT;"
- id: kill_query_notification_subscription
  name: "KILL QUERY NOTIFICATION SUBSCRIPTION"
  doc: "https://learn.microsoft.com/en-us/sql/t-sql/language-elements/kill-query-notification-subscription-transact-sql"
  tier: low
  probes:
  - id: all
    sql: "KILL QUERY NOTIFICATION SUBSCRIPTION ALL;"
  - id: id
    sql: "KILL QUERY NOTIFICATION SUBSCRIPTION 42;"
- id: kill_stats_job
  name: "KILL STATS JOB"
  doc: "https://learn.microsoft.com/en-us/sql/t-sql/language-elements/kill-stats-job-transact-sql"
  tier: low
  probes:
  - id: basic
    sql: "KILL STATS JOB 53;"
- id: reconfigure
  name: "RECONFIGURE"
  doc: "https://learn.microsoft.com/en-us/sql/t-sql/language-elements/reconfigure-transact-sql"
  tier: low
  probes:
  - id: basic
    sql: "RECONFIGURE;"
  - id: override
    sql: "RECONFIGURE WITH OVERRIDE;"
- id: shutdown
  name: "SHUTDOWN"
  doc: "https://learn.microsoft.com/en-us/sql/t-sql/language-elements/shutdown-transact-sql"
  tier: low
  probes:
  - id: basic
    sql: "SHUTDOWN;"
  - id: nowait
    sql: "SHUTDOWN WITH NOWAIT;"
- id: create_diagnostics_session
  name: "CREATE DIAGNOSTICS SESSION"
  doc: "https://learn.microsoft.com/en-us/sql/t-sql/language-elements/create-diagnostics-session-transact-sql"
  tier: low
  status: not-applicable
  reason: "Page states 'Applies to: Analytics Platform System (PDW)'; the statement does not exist in SQL Server or Azure SQL Database."
- id: readtext
  name: "READTEXT"
  doc: "https://learn.microsoft.com/en-us/sql/t-sql/queries/readtext-transact-sql"
  tier: low
  probes:
  - id: basic
    sql: "READTEXT t.c @ptr 0 25;"
  - id: holdlock
    sql: "READTEXT t.c @ptr 0 25 HOLDLOCK;"
- id: updatetext
  name: "UPDATETEXT"
  doc: "https://learn.microsoft.com/en-us/sql/t-sql/queries/updatetext-transact-sql"
  tier: low
  probes:
  - id: inserted_data
    sql: "UPDATETEXT t.c @ptr 0 NULL 'abc';"
  - id: with_log_delete
    sql: "UPDATETEXT t.c @ptr 5 3 WITH LOG 'abc';"
  - id: source_column
    sql: "UPDATETEXT BULK t.c @dest NULL NULL t2.c2 @src;"
- id: writetext
  name: "WRITETEXT"
  doc: "https://learn.microsoft.com/en-us/sql/t-sql/queries/writetext-transact-sql"
  tier: low
  probes:
  - id: basic
    sql: "WRITETEXT t.c @ptr 'new text';"
  - id: bulk_with_log
    sql: "WRITETEXT BULK t.c @ptr WITH LOG 'new text';"
- id: add_sensitivity_classification
  name: "ADD SENSITIVITY CLASSIFICATION"
  doc: "https://learn.microsoft.com/en-us/sql/t-sql/statements/add-sensitivity-classification-transact-sql"
  tier: low
  probes:
  - id: label_information_type
    sql: "ADD SENSITIVITY CLASSIFICATION TO dbo.t.c WITH (LABEL = 'Confidential', INFORMATION_TYPE = 'Financial');"
  - id: ids_rank_multiple
    sql: "ADD SENSITIVITY CLASSIFICATION TO dbo.t.c1, dbo.t.c2 WITH (LABEL = 'Highly Confidential', LABEL_ID = 'b1f2c3d4-0000-0000-0000-000000000001', INFORMATION_TYPE = 'Contact Info', INFORMATION_TYPE_ID = '5c503e21-22c6-81fa-620b-f369b8ec38d1', RANK = CRITICAL);"
  - id: rank_none
    sql: "ADD SENSITIVITY CLASSIFICATION TO t.c WITH (RANK = NONE);"
- id: copy
  name: "COPY"
  doc: "https://learn.microsoft.com/en-us/sql/t-sql/statements/copy-into-transact-sql"
  tier: low
  status: not-applicable
  reason: "Page description: 'Use the COPY statement in Azure Synapse Analytics and Warehouse in Microsoft Fabric to load data from Azure Storage and OneLake.' monikerRange is =azure-sqldw-latest || =fabric; not available in SQL Server 2022 or Azure SQL Database."
- id: rename
  name: "RENAME"
  doc: "https://learn.microsoft.com/en-us/sql/t-sql/statements/rename-transact-sql"
  tier: low
  status: not-applicable
  reason: "Page description: 'RENAME (Transact-SQL) renames a user-created table.' The syntax block is labelled 'Syntax for Azure Synapse Analytics' and monikerRange is =azure-sqldw-latest; not available in SQL Server 2022 or Azure SQL Database."
