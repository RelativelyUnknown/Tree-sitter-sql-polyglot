      - { id: json_loose, sql: "SELECT JSON_LOOSE('{ \"A\": 1, \"B\": [2, 3] }');" }
      - { id: json_detailed, sql: "SELECT JSON_DETAILED('{\"A\":1, \"B\":[2,3]}');" }
      - { id: json_detailed_tab_size, sql: "SELECT JSON_DETAILED('{\"A\":1, \"B\":[2,3]}', 2);" }
      - { id: json_pretty, sql: "SELECT JSON_PRETTY('{\"A\":1, \"B\":[2,3]}');" }
      - { id: json_normalize, sql: "SELECT JSON_NORMALIZE('{\"b\": 1, \"a\": 2}');" }
      - { id: json_equals, sql: "SELECT JSON_EQUALS('{\"a\": 1, \"b\": 2}', '{\"b\": 2, \"a\": 1}');" }
      - { id: json_schema_valid, sql: "SELECT JSON_SCHEMA_VALID('{\"type\": \"number\"}', '5');" }
      - { id: json_schema_valid_check, sql: "CREATE TABLE t (j JSON CHECK (JSON_SCHEMA_VALID('{\"type\": \"object\"}', j)));" }
      - { id: json_array_intersect, sql: "SELECT JSON_ARRAY_INTERSECT('[1,2,3]', '[1,2,4]');" }
