  - id: scripting_for
    name: "FOR (Snowflake Scripting)"
    doc: https://docs.snowflake.com/en/sql-reference/snowflake-scripting/for
    tier: high
    probes:
      - { id: cursor_for, sql: "DECLARE total FLOAT; c1 CURSOR FOR SELECT price FROM invoices; BEGIN total := 0.0; FOR rec IN c1 DO total := total + rec.price; END FOR; RETURN total; END;" }
      - { id: counter_for_do, sql: "DECLARE counter INTEGER DEFAULT 0; BEGIN FOR i IN 1 TO 3 DO counter := counter + 1; END FOR; RETURN counter; END;" }
      - { id: counter_for_reverse, sql: "DECLARE s VARCHAR DEFAULT ''; BEGIN FOR i IN REVERSE 1 TO 3 DO s := s || ' ' || i::VARCHAR; END FOR; RETURN s; END;" }
      - { id: counter_for_loop_keyword, sql: "DECLARE c INTEGER DEFAULT 0; BEGIN FOR i IN 1 TO 3 LOOP c := c + 1; END LOOP; RETURN c; END;" }
      - { id: for_with_label, sql: "DECLARE c INTEGER DEFAULT 0; BEGIN FOR i IN 1 TO 3 DO c := c + 1; END FOR my_loop; RETURN c; END;" }
      - { id: resultset_for, sql: "DECLARE res RESULTSET DEFAULT (SELECT price FROM invoices); t FLOAT DEFAULT 0; BEGIN FOR rec IN res DO t := t + rec.price; END FOR; RETURN t; END;" }
    examples:
      - |-
        CREATE OR REPLACE PROCEDURE for_loop_over_cursor()
        RETURNS FLOAT
        LANGUAGE SQL
        AS
        $$
        DECLARE
            total_price FLOAT;
            c1 CURSOR FOR SELECT price FROM invoices;
        BEGIN
            total_price := 0.0;
            OPEN c1;
            FOR rec IN c1 DO
                total_price := total_price + rec.price;
            END FOR;
            CLOSE c1;
            RETURN total_price;
        END;
        $$
        ;
      - |-
        CREATE PROCEDURE simple_for(iteration_limit INTEGER)
        RETURNS INTEGER
        LANGUAGE SQL
        AS
        $$
            DECLARE
                counter INTEGER DEFAULT 0;
            BEGIN
                FOR i IN 1 TO iteration_limit DO
                    counter := counter + 1;
                END FOR;
                RETURN counter;
            END;
        $$;
      - |-
        CREATE PROCEDURE reverse_loop(iteration_limit INTEGER)
        RETURNS VARCHAR
        LANGUAGE SQL
        AS
        $$
            DECLARE
                values_of_i VARCHAR DEFAULT '';
            BEGIN
                FOR i IN REVERSE 1 TO iteration_limit DO
                    values_of_i := values_of_i || ' ' || i::varchar;
                END FOR;
                RETURN values_of_i;
            END;
        $$;

  - id: scripting_while
    name: "WHILE (Snowflake Scripting)"
    doc: https://docs.snowflake.com/en/sql-reference/snowflake-scripting/while
    tier: high
    probes:
      - { id: while_do, sql: "DECLARE c INT DEFAULT 1; BEGIN WHILE (c <= 8) DO c := c + 1; END WHILE; RETURN c; END;" }
      - { id: while_loop, sql: "DECLARE c INT DEFAULT 1; BEGIN WHILE (c <= 8) LOOP c := c + 1; END LOOP; RETURN c; END;" }
      - { id: while_label, sql: "DECLARE c INT DEFAULT 1; BEGIN WHILE (c <= 8) DO c := c + 1; END WHILE outer_loop; RETURN c; END;" }
    examples:
      - |-
        CREATE PROCEDURE power_of_2()
        RETURNS NUMBER(8, 0)
        LANGUAGE SQL
        AS
        $$
        DECLARE
          counter NUMBER(8, 0);      -- Loop counter.
          power_of_2 NUMBER(8, 0);   -- Stores the most recent power of 2 that we calculated.
        BEGIN
          counter := 1;
          power_of_2 := 1;
          WHILE (counter <= 8) DO
            power_of_2 := power_of_2 * 2;
            counter := counter + 1;
          END WHILE;
          RETURN power_of_2;
        END;
        $$
        ;
      - |-
        EXECUTE IMMEDIATE $$
        BEGIN
          LET mydate := '2024-05-08';
          WHILE (mydate < '2024-05-20') DO
            mydate := DATEADD(day, 1, mydate);
          END WHILE;
          RETURN mydate;
        END;
        $$
        ;

  - id: scripting_repeat
    name: "REPEAT (Snowflake Scripting)"
    doc: https://docs.snowflake.com/en/sql-reference/snowflake-scripting/repeat
    tier: high
    probes:
      - { id: repeat_until, sql: "DECLARE c INT DEFAULT 1; BEGIN REPEAT c := c + 1; UNTIL (c > 8) END REPEAT; RETURN c; END;" }
      - { id: repeat_label, sql: "DECLARE c INT DEFAULT 1; BEGIN REPEAT c := c + 1; UNTIL (c > 8) END REPEAT my_label; RETURN c; END;" }
    examples:
      - |-
        CREATE PROCEDURE power_of_2()
        RETURNS NUMBER(8, 0)
        LANGUAGE SQL
        AS
        $$
        DECLARE
            counter NUMBER(8, 0);      -- Loop counter.
            power_of_2 NUMBER(8, 0);   -- Stores the most recent power of 2 that we calculated.
        BEGIN
            counter := 1;
            power_of_2 := 1;
            REPEAT
                power_of_2 := power_of_2 * 2;
                counter := counter + 1;
            UNTIL (counter > 8)
            END REPEAT;
            RETURN power_of_2;
        END;
        $$;

  - id: scripting_loop
