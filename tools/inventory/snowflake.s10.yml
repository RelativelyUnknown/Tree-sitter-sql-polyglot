dialect: snowflake
engine: Snowflake
version: "current (docs read 2026-10-04)"
source: https://docs.snowflake.com/en/sql-reference/sql-all

statements:
  - id: describe_function
    name: DESCRIBE FUNCTION
    doc: https://docs.snowflake.com/en/sql-reference/sql/desc-function
    tier: medium
    probes:
      - id: desc_no_args
        sql: "DESC FUNCTION f();"
      - id: describe_with_args
        sql: "DESCRIBE FUNCTION s.f(NUMBER, VARCHAR);"
    examples:
      - "DESC FUNCTION multiply ( number , number );"

  - id: describe_masking_policy
    name: DESCRIBE MASKING POLICY
    doc: https://docs.snowflake.com/en/sql-reference/sql/desc-masking-policy
    tier: medium
    probes:
      - id: desc
        sql: "DESC MASKING POLICY p;"
      - id: describe_qualified
        sql: "DESCRIBE MASKING POLICY db.s.p;"
    examples:
      - "DESC MASKING POLICY ssn_mask ;"

  - id: describe_materialized_view
    name: DESCRIBE MATERIALIZED VIEW
    doc: https://docs.snowflake.com/en/sql-reference/sql/desc-materialized-view
    tier: medium
    probes:
      - id: desc
        sql: "DESC MATERIALIZED VIEW v;"
      - id: describe_qualified
        sql: "DESCRIBE MATERIALIZED VIEW db.s.v;"
    examples:
      - "DESC MATERIALIZED VIEW emp_view ;"

  - id: describe_network_policy
    name: DESCRIBE NETWORK POLICY
    doc: https://docs.snowflake.com/en/sql-reference/sql/desc-network-policy
    tier: medium
    probes:
      - id: desc
        sql: "DESC NETWORK POLICY p;"
      - id: describe
        sql: "DESCRIBE NETWORK POLICY p;"
    examples:
      - "DESC NETWORK POLICY mypolicy ;"

  - id: describe_network_rule
    name: DESCRIBE NETWORK RULE
    doc: https://docs.snowflake.com/en/sql-reference/sql/desc-network-rule
    tier: medium
    probes:
      - id: desc
        sql: "DESC NETWORK RULE r;"
      - id: describe_qualified
        sql: "DESCRIBE NETWORK RULE db.s.r;"
    examples:
      - "DESC NETWORK RULE myrule ;"

  - id: describe_pipe
    name: DESCRIBE PIPE
    doc: https://docs.snowflake.com/en/sql-reference/sql/desc-pipe
    tier: medium
    probes:
      - id: desc
        sql: "DESC PIPE p;"
      - id: describe_qualified
        sql: "DESCRIBE PIPE db.s.p;"
    examples:
      - "desc pipe mypipe ;"

  - id: describe_procedure
    name: DESCRIBE PROCEDURE
    doc: https://docs.snowflake.com/en/sql-reference/sql/desc-procedure
    tier: medium
    probes:
      - id: desc_no_args
        sql: "DESC PROCEDURE p();"
      - id: describe_with_args
        sql: "DESCRIBE PROCEDURE s.p(FLOAT, VARCHAR);"
    examples:
      - "DESC PROCEDURE my_pi ();"
      - "DESC PROCEDURE area_of_circle ( FLOAT );"

  - id: describe_result
    name: DESCRIBE RESULT
    doc: https://docs.snowflake.com/en/sql-reference/sql/desc-result
    tier: medium
    probes:
      - id: query_id
        sql: "DESC RESULT 'f2f07bdb-6a08-4689-9ad8-a1ba968a44b6';"
      - id: last_query_id
        sql: "DESCRIBE RESULT LAST_QUERY_ID();"
    examples:
      - "DESC RESULT ' f2f07bdb-6a08-4689-9ad8-a1ba968a44b6 ';"
      - "DESC RESULT LAST_QUERY_ID ();"

  - id: describe_row_access_policy
    name: DESCRIBE ROW ACCESS POLICY
    doc: https://docs.snowflake.com/en/sql-reference/sql/desc-row-access-policy
    tier: medium
    probes:
      - id: desc
        sql: "DESC ROW ACCESS POLICY p;"
      - id: describe_qualified
        sql: "DESCRIBE ROW ACCESS POLICY db.s.p;"
    examples:
      - "DESC ROW ACCESS POLICY rap_table_employee_info ;"

  - id: describe_schema
    name: DESCRIBE SCHEMA
    doc: https://docs.snowflake.com/en/sql-reference/sql/desc-schema
    tier: medium
    probes:
      - id: desc
        sql: "DESC SCHEMA s;"
      - id: describe_qualified
        sql: "DESCRIBE SCHEMA db.s;"
    examples:
      - "DESCRIBE SCHEMA sample_schema_2 ;"
