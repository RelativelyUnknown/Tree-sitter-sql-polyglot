dialect: trino
engine: Trino
version: "483"
source: https://trino.io/docs/current/sql.html

statements:
  - id: alter_view
    name: ALTER VIEW
    doc: https://trino.io/docs/current/sql/alter-view.html
    tier: high
    probes:
      - id: rename_to
        sql: "ALTER VIEW v RENAME TO v2;"
      - id: refresh
        sql: "ALTER VIEW v REFRESH;"
      - id: set_authorization_user
        sql: "ALTER VIEW v SET AUTHORIZATION alice;"
      - id: set_authorization_user_kw
        sql: "ALTER VIEW v SET AUTHORIZATION USER alice;"
      - id: set_authorization_role
        sql: "ALTER VIEW v SET AUTHORIZATION ROLE admin;"
    examples:
      - "ALTER VIEW people RENAME TO users;"
      - "ALTER VIEW people REFRESH;"
      - "ALTER VIEW people SET AUTHORIZATION alice;"

  - id: call
    name: CALL
    doc: https://trino.io/docs/current/sql/call.html
    tier: high
    probes:
      - id: positional
        sql: "CALL p(123, 'apple');"
      - id: named
        sql: "CALL p(name => 'apple', id => 123);"
      - id: qualified
        sql: "CALL c.s.p();"
      - id: mixed_named_positional
        sql: "CALL p(1, name => 'apple');"
    examples:
      - "CALL test(123, 'apple');"
      - "CALL test(name => 'apple', id => 123);"
      - "CALL catalog.schema.test();"
