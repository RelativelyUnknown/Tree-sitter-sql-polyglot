dialect: snowflake
engine: Snowflake
version: "current (docs read 2026-10-04)"
source: https://docs.snowflake.com/en/sql-reference/sql-all

statements: []

expressions:
  - id: c_aggregate_distinct
    name: Aggregate DISTINCT and COUNT forms
    doc: https://docs.snowflake.com/en/sql-reference/functions/count
    tier: high
    probes:
      - id: count_star
        sql: |-
          SELECT COUNT(*) FROM t;
      - id: count_expr
        sql: |-
          SELECT COUNT(c) FROM t;
      - id: count_distinct
        sql: |-
          SELECT COUNT(DISTINCT c) FROM t;
      - id: count_distinct_multi
        sql: |-
          SELECT COUNT(DISTINCT c1, c2) FROM t;
      - id: count_alias_star
        sql: |-
          SELECT COUNT(n.*) FROM t AS n;
      - id: count_star_ilike
        sql: |-
          SELECT COUNT(* ILIKE 'i_c%') FROM t;
      - id: count_star_exclude
        sql: |-
          SELECT COUNT(* EXCLUDE c) FROM t;
      - id: sum_distinct
        sql: |-
          SELECT SUM(DISTINCT c) FROM t;
      - id: avg_distinct
        sql: |-
          SELECT AVG(DISTINCT c) FROM t;
      - id: group_by_count
        sql: |-
          SELECT g, COUNT(*), COUNT(DISTINCT c) FROM t GROUP BY g;
      - id: listagg_distinct
        sql: |-
          SELECT LISTAGG(DISTINCT c, ' ') FROM t;
      - id: array_agg_distinct
        sql: |-
          SELECT ARRAY_AGG(DISTINCT c) FROM t;
      - id: minhash_distinct
        sql: |-
          SELECT MINHASH(5, DISTINCT c1, c2) FROM t;
    examples:
      - |-
        SELECT COUNT(*) AS "All",
            COUNT(* ILIKE 'i_c%') AS "ILIKE",
            COUNT(* EXCLUDE i_col) AS "EXCLUDE",
            COUNT(i_col) AS "i_col",
            COUNT(DISTINCT i_col) AS "DISTINCT i_col",
            COUNT(j_col) AS "j_col",
            COUNT(DISTINCT j_col) AS "DISTINCT j_col"
          FROM basic_example;
      - |-
        SELECT i_col, COUNT(*), COUNT(j_col)
          FROM basic_example
          GROUP BY i_col
          ORDER BY i_col;
      - |-
        SELECT COUNT(n.*) FROM basic_example AS n;

  - id: c_aggregate_within_group
    name: Ordered aggregates and WITHIN GROUP
    doc: https://docs.snowflake.com/en/sql-reference/functions/listagg
    tier: high
    probes:
      - id: listagg_within_group
        sql: |-
          SELECT LISTAGG(c, ', ') WITHIN GROUP (ORDER BY o) FROM t;
      - id: listagg_within_group_desc
        sql: |-
          SELECT g, LISTAGG(c, ', ') WITHIN GROUP (ORDER BY o DESC) FROM t GROUP BY g;
      - id: listagg_distinct_within_group
        sql: |-
          SELECT LISTAGG(DISTINCT c) WITHIN GROUP (ORDER BY c) FROM t;
      - id: listagg_no_delimiter
        sql: |-
          SELECT LISTAGG(c) FROM t;
      - id: listagg_collate
        sql: |-
          SELECT LISTAGG(c, '|') WITHIN GROUP (ORDER BY COLLATE(c, 'es')) FROM t;
      - id: listagg_over
        sql: |-
          SELECT LISTAGG(c, ',') WITHIN GROUP (ORDER BY o) OVER (PARTITION BY p) FROM t;
      - id: array_agg_within_group
        sql: |-
          SELECT ARRAY_AGG(c) WITHIN GROUP (ORDER BY o ASC) FROM t;
      - id: array_agg_distinct_within_group
        sql: |-
          SELECT ARRAY_AGG(DISTINCT c) WITHIN GROUP (ORDER BY c) FROM t;
      - id: array_agg_nulls_last
        sql: |-
          SELECT ARRAY_AGG(c) WITHIN GROUP (ORDER BY o DESC NULLS LAST) FROM t;
      - id: array_agg_multi_order
        sql: |-
          SELECT ARRAY_AGG(c) WITHIN GROUP (ORDER BY o1 ASC, o2 DESC) FROM t;
      - id: arrayagg_alias
        sql: |-
          SELECT g, ARRAYAGG(c) WITHIN GROUP (ORDER BY o DESC) FROM t GROUP BY g;
      - id: array_agg_window_frame
        sql: |-
          SELECT ARRAY_AGG(c) OVER (PARTITION BY p ORDER BY o ROWS BETWEEN 3 PRECEDING AND CURRENT ROW) FROM t;
      - id: percentile_cont
        sql: |-
          SELECT PERCENTILE_CONT(0.25) WITHIN GROUP (ORDER BY v) FROM t;
      - id: percentile_disc
        sql: |-
          SELECT PERCENTILE_DISC(0.25) WITHIN GROUP (ORDER BY v) FROM t;
      - id: percentile_cont_desc
        sql: |-
          SELECT k, PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY v DESC) FROM t GROUP BY k;
      - id: percentile_cont_over
        sql: |-
          SELECT PERCENTILE_CONT(0.25) WITHIN GROUP (ORDER BY v) OVER (PARTITION BY k) FROM t;
      - id: percentile_disc_over
        sql: |-
          SELECT PERCENTILE_DISC(0.25) WITHIN GROUP (ORDER BY v) OVER (PARTITION BY k) FROM t;
    examples:
      - |-
        SELECT k, PERCENTILE_CONT(0.25) WITHIN GROUP (ORDER BY v)
          FROM aggr
          GROUP BY k
          ORDER BY k;
      - |-
        SELECT ARRAY_AGG(o_orderkey) WITHIN GROUP (ORDER BY o_orderkey ASC)
          FROM orders
          WHERE o_totalprice > 450000;
      - |-
        SELECT o_orderstatus,
           LISTAGG(o_clerk, ', ')
             WITHIN GROUP (ORDER BY o_totalprice DESC)
          FROM orders
          WHERE o_totalprice > 520000
          GROUP BY o_orderstatus;

  - id: c_aggregate_function_families
    name: Aggregate function families
    doc: https://docs.snowflake.com/en/sql-reference/functions-aggregation
    tier: medium
    probes:
      - id: general_any_value
        sql: |-
          SELECT g, ANY_VALUE(c) FROM t GROUP BY g;
      - id: general_stats
        sql: |-
          SELECT AVG(c), SUM(c), MIN(c), MAX(c), MEDIAN(c), MODE(c), COUNT_IF(c > 0) FROM t;
      - id: min_max_by
        sql: |-
          SELECT MIN_BY(a, b), MAX_BY(a, b, 3) FROM t;
      - id: stddev_variance
        sql: |-
          SELECT STDDEV(c), STDDEV_SAMP(c), STDDEV_POP(c), VAR_POP(c), VAR_SAMP(c), VARIANCE(c) FROM t;
      - id: correlation
        sql: |-
          SELECT CORR(y, x), COVAR_POP(y, x), COVAR_SAMP(y, x) FROM t;
      - id: bitwise_agg
        sql: |-
          SELECT BITAND_AGG(c), BITOR_AGG(c), BITXOR_AGG(c) FROM t;
      - id: boolean_agg
        sql: |-
          SELECT BOOLAND_AGG(c), BOOLOR_AGG(c), BOOLXOR_AGG(c) FROM t;
      - id: hash_agg
        sql: |-
          SELECT HASH_AGG(c1, c2) FROM t;
      - id: hash_agg_star
        sql: |-
          SELECT HASH_AGG(*) FROM t;
      - id: semi_structured_agg
        sql: |-
          SELECT OBJECT_AGG(k, v), ARRAY_UNION_AGG(a), ARRAY_UNIQUE_AGG(c) FROM t;
      - id: linear_regression
        sql: |-
          SELECT REGR_SLOPE(y, x), REGR_INTERCEPT(y, x), REGR_R2(y, x), REGR_COUNT(y, x) FROM t;
      - id: kurtosis
        sql: |-
          SELECT KURTOSIS(c) FROM t;
      - id: approx_count_distinct
        sql: |-
          SELECT APPROX_COUNT_DISTINCT(c), HLL(c) FROM t;
      - id: hll_state
        sql: |-
          SELECT HLL_ESTIMATE(HLL_ACCUMULATE(c)) FROM t;
      - id: approx_top_k
        sql: |-
          SELECT APPROX_TOP_K(c, 3, 100) FROM t;
      - id: approx_percentile
        sql: |-
          SELECT APPROX_PERCENTILE(c, 0.5) FROM t;
      - id: minhash
        sql: |-
          SELECT MINHASH(5, c1, c2) FROM t;
      - id: minhash_star
        sql: |-
          SELECT MINHASH(5, *) FROM t;
      - id: aggregate_window_partition
        sql: |-
          SELECT k, v, MODE(v) OVER (PARTITION BY k) FROM t;
      - id: aggregate_having
        sql: |-
          SELECT g, SUM(c) FROM t GROUP BY g HAVING COUNT(*) > 1 AND MAX(c) < 10;
    examples:
      - |-
        SELECT MIN_BY(employee_id, salary, 3) FROM employees;
      - |-
        SELECT OBJECT_AGG(k, v) FROM objectagg_example GROUP BY g;
      - |-
        SELECT customer.id , ANY_VALUE(customer.name) , SUM(orders.value)
          FROM customer
          JOIN orders ON customer.id = orders.customer_id
          GROUP BY customer.id;

  - id: c_window_over
    name: Window OVER clause
    doc: https://docs.snowflake.com/en/sql-reference/functions-window-syntax
    tier: high
    probes:
      - id: empty_over
        sql: |-
          SELECT SUM(c) OVER () FROM t;
      - id: partition_by
        sql: |-
          SELECT SUM(c) OVER (PARTITION BY p) FROM t;
      - id: partition_by_multi
        sql: |-
          SELECT SUM(c) OVER (PARTITION BY p1, p2) FROM t;
      - id: order_by
        sql: |-
          SELECT SUM(c) OVER (ORDER BY o) FROM t;
      - id: partition_order
        sql: |-
          SELECT SUM(c) OVER (PARTITION BY p ORDER BY o) FROM t;
      - id: order_desc
        sql: |-
          SELECT RANK() OVER (ORDER BY o DESC) FROM t;
      - id: order_asc_nulls_first
        sql: |-
          SELECT RANK() OVER (ORDER BY o ASC NULLS FIRST) FROM t;
      - id: order_desc_nulls_last
        sql: |-
          SELECT RANK() OVER (ORDER BY o DESC NULLS LAST) FROM t;
      - id: order_multi
        sql: |-
          SELECT RANK() OVER (PARTITION BY p ORDER BY o1 DESC, o2 ASC NULLS LAST) FROM t;
      - id: partition_expression
        sql: |-
          SELECT SUM(c) OVER (PARTITION BY p + 1 ORDER BY o * 2) FROM t;
      - id: over_in_arithmetic
        sql: |-
          SELECT 100 * RATIO_TO_REPORT(c) OVER () AS pct FROM t;
      - id: count_star_over
        sql: |-
          SELECT COUNT(*) OVER (PARTITION BY p) FROM t;
      - id: count_distinct_over
        sql: |-
          SELECT COUNT(DISTINCT c) OVER (PARTITION BY p) FROM t;
      - id: multiple_windows
        sql: |-
          SELECT COUNT(i) OVER (PARTITION BY p ORDER BY o) AS a, SUM(i) OVER (PARTITION BY p ORDER BY o) AS b FROM t;
      - id: window_in_qualify
        sql: |-
          SELECT c FROM t QUALIFY ROW_NUMBER() OVER (PARTITION BY p ORDER BY o) = 1;
      - id: window_in_order_by
        sql: |-
          SELECT c FROM t ORDER BY ROW_NUMBER() OVER (ORDER BY o);
    examples:
      - |-
        SELECT branch_ID,
               net_profit,
               100 * RATIO_TO_REPORT(net_profit) OVER () AS percent_of_chain_profit
            FROM store_sales AS s1
            ORDER BY branch_ID;
      - |-
        SELECT
            p, o, i,
            COUNT(i) OVER (PARTITION BY p ORDER BY o) count_i_Range_Pre,
            SUM(i)   OVER (PARTITION BY p ORDER BY o) sum_i_Range_Pre,
            AVG(i)   OVER (PARTITION BY p ORDER BY o) avg_i_Range_Pre,
            MIN(i)   OVER (PARTITION BY p ORDER BY o) min_i_Range_Pre,
            MAX(i)   OVER (PARTITION BY p ORDER BY o) max_i_Range_Pre
          FROM example_cumulative
          ORDER BY p,o;
      - |-
        SELECT
            salesperson_name,
            sales_in_dollars,
            RANK() OVER (ORDER BY sales_in_dollars DESC) AS sales_rank
          FROM sales_table;

  - id: c_window_frames
    name: Window frame clauses
    doc: https://docs.snowflake.com/en/sql-reference/functions-window-syntax
    tier: high
    probes:
      - id: rows_unbounded_preceding
        sql: |-
          SELECT SUM(c) OVER (ORDER BY o ROWS UNBOUNDED PRECEDING) FROM t;
      - id: rows_n_preceding
        sql: |-
          SELECT SUM(c) OVER (ORDER BY o ROWS 2 PRECEDING) FROM t;
      - id: rows_current_row
        sql: |-
          SELECT SUM(c) OVER (ORDER BY o ROWS CURRENT ROW) FROM t;
      - id: rows_between_unbounded_preceding_current_row
        sql: |-
          SELECT SUM(c) OVER (PARTITION BY p ORDER BY o ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) FROM t;
      - id: rows_between_current_row_unbounded_following
        sql: |-
          SELECT SUM(c) OVER (ORDER BY o ROWS BETWEEN CURRENT ROW AND UNBOUNDED FOLLOWING) FROM t;
      - id: rows_between_unbounded_both
        sql: |-
          SELECT SUM(c) OVER (ORDER BY o ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING) FROM t;
      - id: rows_between_n_preceding_n_following
        sql: |-
          SELECT SUM(c) OVER (ORDER BY o ROWS BETWEEN 2 PRECEDING AND 4 FOLLOWING) FROM t;
      - id: rows_between_n_preceding_n_preceding
        sql: |-
          SELECT SUM(c) OVER (ORDER BY o ROWS BETWEEN 4 PRECEDING AND 2 PRECEDING) FROM t;
      - id: rows_between_n_following_n_following
        sql: |-
          SELECT SUM(c) OVER (ORDER BY o ROWS BETWEEN 2 FOLLOWING AND 4 FOLLOWING) FROM t;
      - id: rows_between_unbounded_preceding_n_following
        sql: |-
          SELECT SUM(c) OVER (ORDER BY o ROWS BETWEEN UNBOUNDED PRECEDING AND 2 FOLLOWING) FROM t;
      - id: rows_between_unbounded_preceding_n_preceding
        sql: |-
          SELECT SUM(c) OVER (ORDER BY o ROWS BETWEEN UNBOUNDED PRECEDING AND 2 PRECEDING) FROM t;
      - id: rows_between_n_following_unbounded_following
        sql: |-
          SELECT SUM(c) OVER (ORDER BY o ROWS BETWEEN 2 FOLLOWING AND UNBOUNDED FOLLOWING) FROM t;
      - id: rows_between_n_preceding_unbounded_following
        sql: |-
          SELECT SUM(c) OVER (ORDER BY o ROWS BETWEEN 1 PRECEDING AND UNBOUNDED FOLLOWING) FROM t;
      - id: range_unbounded_preceding
        sql: |-
          SELECT SUM(c) OVER (ORDER BY o RANGE UNBOUNDED PRECEDING) FROM t;
      - id: range_n_preceding
        sql: |-
          SELECT SUM(c) OVER (ORDER BY o RANGE 2 PRECEDING) FROM t;
      - id: range_current_row
        sql: |-
          SELECT SUM(c) OVER (ORDER BY o RANGE CURRENT ROW) FROM t;
      - id: range_between_unbounded_preceding_current_row
        sql: |-
          SELECT SUM(c) OVER (PARTITION BY p ORDER BY o RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) FROM t;
      - id: range_between_current_row_unbounded_following
        sql: |-
          SELECT SUM(c) OVER (ORDER BY o RANGE BETWEEN CURRENT ROW AND UNBOUNDED FOLLOWING) FROM t;
      - id: range_between_unbounded_both
        sql: |-
          SELECT SUM(c) OVER (ORDER BY o RANGE BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING) FROM t;
      - id: range_between_n_preceding_n_following
        sql: |-
          SELECT SUM(c) OVER (ORDER BY o RANGE BETWEEN 2 PRECEDING AND 4 FOLLOWING) FROM t;
      - id: range_between_n_preceding_n_preceding
        sql: |-
          SELECT SUM(c) OVER (ORDER BY o RANGE BETWEEN 4 PRECEDING AND 2 PRECEDING) FROM t;
      - id: range_between_n_following_n_following
        sql: |-
          SELECT SUM(c) OVER (ORDER BY o RANGE BETWEEN 2 FOLLOWING AND 4 FOLLOWING) FROM t;
      - id: range_between_unbounded_preceding_n_following
        sql: |-
          SELECT SUM(c) OVER (ORDER BY o RANGE BETWEEN UNBOUNDED PRECEDING AND 2 FOLLOWING) FROM t;
      - id: range_between_unbounded_preceding_n_preceding
        sql: |-
          SELECT SUM(c) OVER (ORDER BY o RANGE BETWEEN UNBOUNDED PRECEDING AND 2 PRECEDING) FROM t;
      - id: range_between_n_following_unbounded_following
        sql: |-
          SELECT SUM(c) OVER (ORDER BY o RANGE BETWEEN 2 FOLLOWING AND UNBOUNDED FOLLOWING) FROM t;
      - id: range_between_n_preceding_unbounded_following
        sql: |-
          SELECT SUM(c) OVER (ORDER BY o RANGE BETWEEN 1 PRECEDING AND UNBOUNDED FOLLOWING) FROM t;
      - id: range_between_interval
        sql: |-
          SELECT SUM(c) OVER (ORDER BY d RANGE BETWEEN INTERVAL '1 day' PRECEDING AND CURRENT ROW) FROM t;
        note: |-
          The window-frame page says that for DATE ORDER BY columns n can be an INTERVAL constant in RANGE BETWEEN frames.
      - id: frame_with_nulls_last
        sql: |-
          SELECT SUM(c2) OVER (ORDER BY c1 NULLS LAST RANGE BETWEEN 1 PRECEDING AND 1 FOLLOWING) FROM t;
      - id: frame_first_value
        sql: |-
          SELECT FIRST_VALUE(c) OVER (PARTITION BY p ORDER BY o ROWS BETWEEN 1 PRECEDING AND 1 FOLLOWING) FROM t;
      - id: frame_count_alias_star
        sql: |-
          SELECT COUNT(t1.*) OVER (ORDER BY col1 RANGE BETWEEN 1 PRECEDING AND 1 FOLLOWING) FROM t1;
    examples:
      - |-
        SELECT p, o, r AS r_col,
            SUM(r) OVER (PARTITION BY p ORDER BY o ROWS BETWEEN 4 PRECEDING AND 2 PRECEDING) sum_r_4P_2P,
            sum(r) over (partition by p ORDER BY o ROWS BETWEEN 2 FOLLOWING AND 4 FOLLOWING) sum_r_2F_4F,
            sum(r) over (partition by p ORDER BY o ROWS BETWEEN 2 PRECEDING AND 4 FOLLOWING) sum_r_2P_4F
          FROM example_sliding
          ORDER BY p, o;

  - id: c_window_function_families
    name: Window function families
    doc: https://docs.snowflake.com/en/sql-reference/functions-window
    tier: high
    probes:
      - id: row_number
        sql: |-
          SELECT ROW_NUMBER() OVER (PARTITION BY p ORDER BY o) FROM t;
      - id: rank_dense_rank
        sql: |-
          SELECT RANK() OVER (ORDER BY o), DENSE_RANK() OVER (ORDER BY o) FROM t;
      - id: ntile
        sql: |-
          SELECT NTILE(4) OVER (PARTITION BY p ORDER BY o) FROM t;
      - id: percent_rank_cume_dist
        sql: |-
          SELECT PERCENT_RANK() OVER (ORDER BY o), CUME_DIST() OVER (ORDER BY o) FROM t;
      - id: lag_default
        sql: |-
          SELECT revenue - LAG(revenue, 1, 0) OVER (PARTITION BY emp_id ORDER BY year) FROM t;
      - id: lead_offset
        sql: |-
          SELECT LEAD(c, 2) OVER (ORDER BY o) FROM t;
      - id: lag_ignore_nulls
        sql: |-
          SELECT LAG(c) IGNORE NULLS OVER (ORDER BY o) FROM t;
      - id: lead_respect_nulls
        sql: |-
          SELECT LEAD(c, 1) RESPECT NULLS OVER (PARTITION BY p ORDER BY o) FROM t;
      - id: first_value
        sql: |-
          SELECT FIRST_VALUE(c) OVER (PARTITION BY p ORDER BY o) FROM t;
      - id: last_value_ignore_nulls
        sql: |-
          SELECT LAST_VALUE(c) IGNORE NULLS OVER (PARTITION BY p ORDER BY o ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING) FROM t;
      - id: first_value_respect_nulls
        sql: |-
          SELECT FIRST_VALUE(c) RESPECT NULLS OVER (ORDER BY o) FROM t;
      - id: nth_value
        sql: |-
          SELECT NTH_VALUE(c, 2) OVER (PARTITION BY p ORDER BY o) FROM t;
      - id: nth_value_from_last
        sql: |-
          SELECT NTH_VALUE(c, 2) FROM LAST OVER (PARTITION BY p ORDER BY o) FROM t;
      - id: nth_value_from_first_ignore_nulls
        sql: |-
          SELECT NTH_VALUE(c, 2) FROM FIRST IGNORE NULLS OVER (PARTITION BY p ORDER BY o) FROM t;
      - id: ratio_to_report
        sql: |-
          SELECT RATIO_TO_REPORT(c) OVER (PARTITION BY p) FROM t;
      - id: conditional_change_event
        sql: |-
          SELECT CONDITIONAL_CHANGE_EVENT(c) OVER (PARTITION BY p ORDER BY o) FROM t;
      - id: conditional_true_event
        sql: |-
          SELECT CONDITIONAL_TRUE_EVENT(c > 0) OVER (PARTITION BY p ORDER BY o DESC NULLS LAST) FROM t;
      - id: interpolate_linear
        sql: |-
          SELECT INTERPOLATE_LINEAR(c) OVER (PARTITION BY p ORDER BY ts) FROM t;
      - id: interpolate_ffill_bfill
        sql: |-
          SELECT INTERPOLATE_FFILL(c) OVER (ORDER BY ts), INTERPOLATE_BFILL(c) OVER (ORDER BY ts) FROM t;
      - id: aggregate_as_window_with_frame
        sql: |-
          SELECT AVG(c) OVER (PARTITION BY p ORDER BY o ROWS BETWEEN 2 PRECEDING AND CURRENT ROW) FROM t;
      - id: approx_percentile_over
        sql: |-
          SELECT APPROX_PERCENTILE(c, 0.5) OVER (PARTITION BY p) FROM t;
      - id: object_agg_over
        sql: |-
          SELECT OBJECT_AGG(k, v) OVER (PARTITION BY g) FROM t;
    examples:
      - |-
        SELECT emp_id, year, revenue,
               revenue - LAG(revenue, 1, 0) OVER (PARTITION BY emp_id ORDER BY year) AS diff_to_prev
          FROM sales
          ORDER BY emp_id, year;
      - |-
        SELECT col_1,
               col_2,
               LAG(col_2) IGNORE NULLS OVER (ORDER BY col_1)
          FROM t1
          ORDER BY col_1;
      - |-
        SELECT column1,
               column2,
               NTH_VALUE(column2, 2) OVER (PARTITION BY column1 ORDER BY column2) AS column2_2nd
          FROM VALUES
            (1, 10), (1, 11), (1, 12),
            (2, 20), (2, 21), (2, 22);

  - id: c_lambda_expressions
    name: Lambda expressions in higher-order functions
    doc: https://docs.snowflake.com/en/sql-reference/functions/transform
    tier: high
    probes:
      - id: transform_basic
        sql: |-
          SELECT TRANSFORM([1, 2, 3], a -> a * 2);
      - id: transform_typed_arg
        sql: |-
          SELECT TRANSFORM([1, 2, 3], a INT -> a * 2);
      - id: transform_structured_array
        sql: |-
          SELECT TRANSFORM([1, 2, 3]::ARRAY(INT), a INT -> a * 2);
      - id: transform_path_access
        sql: |-
          SELECT TRANSFORM(c, x -> x:value || ' is the number') FROM t;
      - id: transform_object_insert
        sql: |-
          SELECT TRANSFORM(o.detail, i -> OBJECT_INSERT(i, 'unit_price', (i:subtotal / i:quantity)::NUMERIC(10,2))) FROM t AS o;
      - id: transform_outer_column
        sql: |-
          SELECT TRANSFORM(col1, v INT -> v + col2) FROM t;
      - id: filter_basic
        sql: |-
          SELECT FILTER([1, NULL, 3, 5, NULL], a -> a IS NOT NULL);
      - id: filter_path_comparison
        sql: |-
          SELECT FILTER([{'name':'Pat', 'value': 50}, {'name':'Dana', 'value': 25}], a -> a:value >= 50);
      - id: filter_typed_arg
        sql: |-
          SELECT FILTER(col1, v INT -> v < col2) FROM t;
      - id: reduce_basic
        sql: |-
          SELECT REDUCE([1, 2, 3], 0, (acc, val) -> acc + val);
      - id: reduce_typed_args
        sql: |-
          SELECT REDUCE([1, 2, 3], 0, (acc INT, val INT) -> acc + val);
      - id: reduce_structured_array
        sql: |-
          SELECT REDUCE([1, 2, 3]::ARRAY(INT), 0, (acc, val) -> acc + val);
      - id: reduce_string_concat
        sql: |-
          SELECT REDUCE(['a', 'b', 'c'], '', (acc, val) -> acc || ' ' || val);
      - id: reduce_array_accumulator
        sql: |-
          SELECT REDUCE([1, 2, 3, 4], [], (acc, val) -> ARRAY_PREPEND(acc, val));
      - id: reduce_nested_function
        sql: |-
          SELECT REDUCE([1, NULL, 2], 0, (acc, val) -> acc + ZEROIFNULL(val));
      - id: reduce_iff
        sql: |-
          SELECT REDUCE([5, 10, 15], 0, (acc, val) -> IFF(val < 7, acc + val * val, acc + val));
      - id: reduce_path_access
        sql: |-
          SELECT REDUCE(o.detail, '', (acc, val) -> val:item || '\n' || acc) FROM t AS o;
      - id: nested_lambda
        sql: |-
          SELECT TRANSFORM(c, x -> FILTER(x, y -> y > 0)) FROM t;
      - id: lambda_in_where
        sql: |-
          SELECT c FROM t WHERE ARRAY_SIZE(FILTER(arr, x -> x > 1)) > 0;
    examples:
      - |-
        SELECT TRANSFORM([1, 2, 3], a INT -> a * 2) AS "Multiply by Two";
      - |-
        SELECT TRANSFORM([1, 2, 3]::ARRAY(INT), a INT -> a * 2) AS "Multiply by Two (Structured)";
      - |-
        SELECT REDUCE([1,2,3],
                      0,
                      (acc, val) -> acc + val
               ) AS sum_of_values;

  - id: c_semistructured_path_access
    name: Semi-structured path access
    doc: https://docs.snowflake.com/en/sql-reference/user-guide/querying-semistructured
    tier: high
    probes:
      - id: colon_dot
        sql: |-
          SELECT src:salesperson.name FROM car_sales;
      - id: colon_single
        sql: |-
          SELECT src:dealership FROM car_sales;
      - id: colon_quoted
        sql: |-
          SELECT src:"company name" FROM partners;
      - id: colon_quoted_digits
        sql: |-
          SELECT zipcode_info:"94987" FROM addresses;
      - id: colon_quoted_special
        sql: |-
          SELECT measurements:"#sPerSquareInch" FROM english_metrics;
      - id: colon_quoted_chain
        sql: |-
          SELECT v:"object_outer_key1"."object_inner_key1a" FROM t;
      - id: colon_quoted_colon_chain
        sql: |-
          SELECT v:"object_outer_key1":"object_inner_key1a" FROM t;
      - id: colon_colon_chain
        sql: |-
          SELECT v:object_outer_key1:object_inner_key1a FROM t;
      - id: bracket_string
        sql: |-
          SELECT src['salesperson']['name'] FROM car_sales;
      - id: bracket_index
        sql: |-
          SELECT v[0] FROM t;
      - id: bracket_index_chain
        sql: |-
          SELECT v[0][1] FROM t;
      - id: colon_array_index
        sql: |-
          SELECT src:vehicle[0] FROM car_sales;
      - id: colon_array_index_dot
        sql: |-
          SELECT src:customer[0].name, src:vehicle[0].price FROM car_sales;
      - id: colon_quoted_array_index
        sql: |-
          SELECT v:"array2"[0]."id3" FROM t;
      - id: colon_then_bracket_string
        sql: |-
          SELECT v:a['b'] FROM t;
      - id: qualified_column
        sql: |-
          SELECT t.v:a.b FROM t;
      - id: positional_column
        sql: |-
          SELECT S.$1:root[0].employees[0].firstName FROM t AS S;
      - id: cast_double_colon
        sql: |-
          SELECT src:vehicle[0].price::NUMBER * 0.10 AS tax FROM car_sales;
      - id: cast_varchar
        sql: |-
          SELECT src:dealership::VARCHAR FROM car_sales;
      - id: cast_structured
        sql: |-
          SELECT v:items::ARRAY(INT) FROM t;
      - id: path_in_where
        sql: |-
          SELECT * FROM car_sales WHERE src:dealership = 'Tindel Toyota';
      - id: path_in_function
        sql: |-
          SELECT ARRAY_SIZE(v:a) FROM t;
      - id: path_in_group_order
        sql: |-
          SELECT v:a::STRING, COUNT(*) FROM t GROUP BY 1 ORDER BY v:a::STRING;
      - id: path_on_function_result
        sql: |-
          SELECT PARSE_JSON('{"a": [1, 2]}'):a[1];
      - id: get_function
        sql: |-
          SELECT GET(v, ARRAY_SIZE(v) - 1) FROM colors;
      - id: get_object_key
        sql: |-
          SELECT GET(v, 'a') FROM t;
      - id: get_ignore_case
        sql: |-
          SELECT GET_IGNORE_CASE(v, 'A') FROM t;
      - id: get_path_function
        sql: |-
          SELECT GET_PATH(v, 'array2[0].id3') FROM t;
      - id: get_path_colon_separated
        sql: |-
          SELECT GET_PATH(v, 'object_outer_key1:object_inner_key1a') FROM t;
      - id: map_bracket_access
        sql: |-
          SELECT m['a_key'] FROM t;
    examples:
      - |-
        SELECT src:customer[0].name, src:vehicle[0].price
            FROM car_sales
            ORDER BY 1;
      - |-
        SELECT src:vehicle[0].price::NUMBER * 0.10 AS tax
            FROM car_sales
            ORDER BY tax;
      - |-
        SELECT id,
               v:"array2"[0]."id3" AS id3_in_array2
          FROM get_path_demo;

  - id: c_semistructured_constructors
    name: Array, object and VARIANT constructors
    doc: https://docs.snowflake.com/en/sql-reference/data-types-semistructured
    tier: high
    probes:
      - id: array_literal
        sql: |-
          SELECT [1, 2, 3];
      - id: array_literal_empty
        sql: |-
          SELECT [];
      - id: array_literal_mixed
        sql: |-
          SELECT [1, 'two', NULL, TRUE, [3, 4]];
      - id: array_literal_expressions
        sql: |-
          SELECT [a + 1, UPPER(b), c::INT] FROM t;
      - id: array_literal_index
        sql: |-
          SELECT [10, 20, 30][1];
      - id: object_literal
        sql: |-
          SELECT {'a': 1, 'b': 'BBBB', 'c': NULL};
      - id: object_literal_empty
        sql: |-
          SELECT {};
      - id: object_literal_nested
        sql: |-
          SELECT {'a': {'b': [1, 2]}, 'c': 3};
      - id: object_literal_expression_values
        sql: |-
          SELECT {'name': n, 'total': a + b} FROM t;
      - id: object_literal_wildcard
        sql: |-
          SELECT {*} FROM t;
      - id: object_literal_wildcard_exclude
        sql: |-
          SELECT {* EXCLUDE province} AS oc FROM demo_table_1;
      - id: object_literal_wildcard_qualified
        sql: |-
          SELECT {my_table1.*} FROM my_table1 INNER JOIN my_table2 ON my_table2.col1 = my_table1.col1;
      - id: object_literal_wildcard_exclude_list
        sql: |-
          SELECT {* EXCLUDE (col1, col2)} FROM my_table;
      - id: object_literal_wildcard_ilike
        sql: |-
          SELECT {* ILIKE 'prov%'} FROM t;
      - id: object_construct_pairs
        sql: |-
          SELECT OBJECT_CONSTRUCT('a', 1, 'b', 'BBBB', 'c', NULL);
      - id: object_construct_empty
        sql: |-
          SELECT OBJECT_CONSTRUCT();
      - id: object_construct_star
        sql: |-
          SELECT OBJECT_CONSTRUCT(*) AS oc FROM demo_table_1;
      - id: object_construct_qualified_star
        sql: |-
          SELECT OBJECT_CONSTRUCT(t.*) FROM t;
      - id: object_construct_star_ilike
        sql: |-
          SELECT OBJECT_CONSTRUCT(* ILIKE 'prov%') AS oc FROM demo_table_1;
      - id: object_construct_star_exclude
        sql: |-
          SELECT OBJECT_CONSTRUCT(* EXCLUDE province) AS oc FROM demo_table_1;
      - id: object_construct_subquery
        sql: |-
          SELECT OBJECT_CONSTRUCT('foo', 1234567, 'dataset_size', (SELECT COUNT(*) FROM demo_table_1)) FROM demo_table_1;
      - id: object_construct_keep_null
        sql: |-
          SELECT OBJECT_CONSTRUCT_KEEP_NULL('a', NULL, 'b', 2);
      - id: object_construct_variant_values
        sql: |-
          SELECT OBJECT_CONSTRUCT('name', 'Jones'::VARIANT, 'age', 42::VARIANT);
      - id: array_construct
        sql: |-
          SELECT ARRAY_CONSTRUCT(10, 20, 30);
      - id: array_construct_empty
        sql: |-
          SELECT ARRAY_CONSTRUCT();
      - id: array_construct_nulls
        sql: |-
          SELECT ARRAY_CONSTRUCT(NULL, PARSE_JSON('null'), 'hello', 3::DOUBLE, 4, 5);
      - id: array_construct_compact
        sql: |-
          SELECT ARRAY_CONSTRUCT_COMPACT(1, NULL, 3);
      - id: parse_json_object
        sql: |-
          SELECT PARSE_JSON('{"a": 1, "b": [1, 2]}');
      - id: try_parse_json
        sql: |-
          SELECT TRY_PARSE_JSON('{"a": 1}');
      - id: variant_cast_literal
        sql: |-
          SELECT 'Sample'::VARIANT, 'Sample'::VARIANT::VARCHAR;
      - id: to_variant_object_array
        sql: |-
          SELECT TO_VARIANT(c), TO_OBJECT(v), TO_ARRAY(c) FROM t;
      - id: to_json_cast
        sql: |-
          SELECT TO_JSON(v), TO_JSON(v)::VARIANT FROM t;
    examples:
      - |-
        SELECT OBJECT_CONSTRUCT('a', 1, 'b', 'BBBB', 'c', NULL);
      - |-
        SELECT OBJECT_CONSTRUCT(* EXCLUDE province) AS oc
          FROM demo_table_1
          ORDER BY oc['PROVINCE'];
      - |-
        SELECT ARRAY_CONSTRUCT(10, 20, 30);

  - id: c_structured_types
    name: Structured ARRAY, OBJECT and MAP types
    doc: https://docs.snowflake.com/en/sql-reference/data-types-structured
    tier: high
    probes:
      - id: cast_array_operator
        sql: |-
          SELECT [1, 2, 3]::ARRAY(NUMBER);
      - id: cast_array_function
        sql: |-
          SELECT CAST([1, 2, 3] AS ARRAY(NUMBER));
      - id: cast_array_precision
        sql: |-
          SELECT [1, 2, 3]::ARRAY(NUMBER(38, 0));
      - id: cast_array_not_null
        sql: |-
          SELECT [1, 2, 3]::ARRAY(INT NOT NULL);
      - id: cast_array_nested
        sql: |-
          SELECT [[1, 2], [3]]::ARRAY(ARRAY(INT));
      - id: cast_variant_to_array
        sql: |-
          SELECT [1, 2, 3]::VARIANT::ARRAY(NUMBER);
      - id: cast_object
        sql: |-
          SELECT {'str': 'test', 'num': 1}::OBJECT(str VARCHAR NOT NULL, num NUMBER);
      - id: cast_object_empty
        sql: |-
          SELECT {}::OBJECT();
      - id: cast_object_nested
        sql: |-
          SELECT {'a': {'b': 1}}::OBJECT(a OBJECT(b INT));
      - id: cast_object_array_field
        sql: |-
          SELECT {'k': [1, 2]}::OBJECT(k ARRAY(INT));
      - id: cast_map
        sql: |-
          SELECT {'a_key': 'a_val', 'b_key': 'b_val'}::MAP(VARCHAR, VARCHAR);
      - id: cast_map_not_null
        sql: |-
          SELECT {'a': 1}::MAP(VARCHAR, NUMBER NOT NULL);
      - id: cast_map_nested
        sql: |-
          SELECT {'a': [1]}::MAP(VARCHAR, ARRAY(INT));
      - id: cast_function_object
        sql: |-
          SELECT CAST({'city': 'SF', 'state': 'CA'} AS OBJECT(city VARCHAR, state VARCHAR));
      - id: column_array_type
        sql: |-
          CREATE TABLE t (c ARRAY(NUMBER));
      - id: column_object_type
        sql: |-
          CREATE TABLE t (c OBJECT(str VARCHAR NOT NULL, num NUMBER(38, 0)));
      - id: column_map_type
        sql: |-
          CREATE TABLE t (c MAP(VARCHAR, VARCHAR));
      - id: column_nested_structured_type
        sql: |-
          CREATE TABLE t (c ARRAY(OBJECT(a INT, b MAP(VARCHAR, ARRAY(INT)))));
      - id: structured_path_access
        sql: |-
          SELECT c:str, c['num'], d[0] FROM t;
      - id: typeof_system_function
        sql: |-
          SELECT SYSTEM$TYPEOF([1, 2, 3]::ARRAY(NUMBER)) AS structured_array;
    examples:
      - |-
        SELECT
          SYSTEM$TYPEOF(
            [1, 2, 3]::ARRAY(NUMBER)
          ) AS structured_array,
          SYSTEM$TYPEOF(
            [1, 2, 3]
          ) AS semi_structured_array;
      - |-
        SELECT
          SYSTEM$TYPEOF(
            {
              'a_key': 'a_val',
              'b_key': 'b_val'
            }::MAP(VARCHAR, VARCHAR)
          ) AS map_example;
      - |-
        SELECT
          SYSTEM$TYPEOF(
            CAST ([1,2,3] AS ARRAY(NUMBER))
          ) AS array_cast_type,
          SYSTEM$TYPEOF(
            CAST ([1,2,3]::VARIANT AS ARRAY(NUMBER))
          ) AS variant_cast_type;

