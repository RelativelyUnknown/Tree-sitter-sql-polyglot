  - id: create_view
    name: "CREATE VIEW"
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-view-transact-sql
    tier: high
    probes:
      - id: basic
        sql: "CREATE VIEW v AS SELECT c FROM t;"
      - id: schema_qualified
        sql: "CREATE VIEW dbo.v AS SELECT c FROM t;"
      - id: column_list
        sql: "CREATE VIEW v (a, b) AS SELECT c, d FROM t;"
      - id: or_alter
        sql: "CREATE OR ALTER VIEW v AS SELECT c FROM t;"
      - id: with_encryption
        sql: "CREATE VIEW v WITH ENCRYPTION AS SELECT c FROM t;"
      - id: with_schemabinding
        sql: "CREATE VIEW dbo.v WITH SCHEMABINDING AS SELECT c FROM dbo.t;"
      - id: with_view_metadata
        sql: "CREATE VIEW v WITH VIEW_METADATA AS SELECT c FROM t;"
      - id: multiple_attributes
        sql: "CREATE VIEW dbo.v WITH ENCRYPTION, SCHEMABINDING, VIEW_METADATA AS SELECT c FROM dbo.t;"
      - id: with_check_option
        sql: "CREATE VIEW v AS SELECT c FROM t WHERE c = 'Seattle' WITH CHECK OPTION;"
      - id: cte_body
        sql: "CREATE VIEW v AS WITH cte AS (SELECT c FROM t) SELECT c FROM cte;"
      - id: union_all_partitioned
        sql: "CREATE VIEW v AS SELECT * FROM db.dbo.t1 UNION ALL SELECT * FROM srv2.db.dbo.t2;"
      - id: top_order_by
        sql: "CREATE VIEW v AS SELECT TOP (100) PERCENT c FROM t ORDER BY c;"
    examples:
      - |-
        --Partitioned view as defined on Server1
        CREATE VIEW Customers
        AS
        --Select from local member table.
        SELECT *
        FROM CompanyData.dbo.Customers_33
        UNION ALL
        --Select from member table on Server2.
        SELECT *
        FROM Server2.CompanyData.dbo.Customers_66
        UNION ALL
        --Select from member table on Server3.
        SELECT *
        FROM Server3.CompanyData.dbo.Customers_99;
      - |-
        CREATE VIEW Purchasing.PurchaseOrderReject
        WITH ENCRYPTION
        AS
        SELECT PurchaseOrderID, ReceivedQty, RejectedQty,
            RejectedQty / ReceivedQty AS RejectRatio, DueDate
        FROM Purchasing.PurchaseOrderDetail
        WHERE RejectedQty / ReceivedQty > 0
        AND DueDate > CONVERT(DATETIME,'20010630',101) ;
      - |-
        CREATE VIEW dbo.SeattleOnly
        AS
        SELECT p.LastName, p.FirstName, e.JobTitle, a.City, sp.StateProvinceCode
        FROM HumanResources.Employee e
        INNER JOIN Person.Person p
        ON p.BusinessEntityID = e.BusinessEntityID
            INNER JOIN Person.BusinessEntityAddress bea
            ON bea.BusinessEntityID = e.BusinessEntityID
            INNER JOIN Person.Address a
            ON a.AddressID = bea.AddressID
            INNER JOIN Person.StateProvince sp
            ON sp.StateProvinceID = a.StateProvinceID
        WHERE a.City = 'Seattle'
        WITH CHECK OPTION ;
      - |-
        --Create the view that combines all supplier tables.
        CREATE VIEW dbo.all_supplier_view
        WITH SCHEMABINDING
        AS
        SELECT supplyID, supplier
          FROM dbo.SUPPLY1
        UNION ALL
        SELECT supplyID, supplier
          FROM dbo.SUPPLY2
        UNION ALL
        SELECT supplyID, supplier
          FROM dbo.SUPPLY3
        UNION ALL
        SELECT supplyID, supplier
          FROM dbo.SUPPLY4;

