dialect: db2
engine: IBM Db2 for Linux, UNIX and Windows
version: "11.5"
source: https://www.ibm.com/docs/en/db2/11.5.x?topic=reference-statements

statements: []

expressions:
  - id: c_aggregate_functions
    name: Aggregate functions
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=functions-aggregate
    tier: high
    probes:
      - { id: count_star, sql: "SELECT COUNT(*) FROM t;" }
      - { id: count_distinct, sql: "SELECT COUNT(DISTINCT c) FROM t;" }
      - { id: count_all, sql: "SELECT COUNT(ALL c) FROM t;" }
      - { id: sum_avg_min_max, sql: "SELECT SUM(c), AVG(c), MIN(c), MAX(c) FROM t;" }
      - { id: sum_distinct, sql: "SELECT SUM(DISTINCT c), AVG(DISTINCT c) FROM t;" }
      - { id: statistical, sql: "SELECT STDDEV(c), VARIANCE(c), STDDEV_SAMP(c), VAR_SAMP(c) FROM t;" }
      - { id: regression, sql: "SELECT CORRELATION(a, b), COVARIANCE(a, b), REGR_SLOPE(a, b), REGR_INTERCEPT(a, b) FROM t;" }
      - { id: grouped, sql: "SELECT c, COUNT(*) FROM t GROUP BY c HAVING COUNT(*) > 1;" }
    examples:
      - "SELECT COUNT(DISTINCT JOBCODE) FROM EMPLOYEE WHERE WORKDEPT = 'D01';"
  - id: c_listagg
    name: LISTAGG aggregate function
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=functions-listagg
    tier: high
    probes:
      - { id: basic, sql: "SELECT LISTAGG(c) FROM t;" }
      - { id: separator, sql: "SELECT LISTAGG(c, ', ') FROM t;" }
      - { id: distinct, sql: "SELECT LISTAGG(DISTINCT c, ', ') FROM t;" }
      - { id: within_group, sql: "SELECT LISTAGG(c, ', ') WITHIN GROUP (ORDER BY c) FROM t;" }
      - { id: within_group_desc_multi, sql: "SELECT LISTAGG(c, ', ') WITHIN GROUP (ORDER BY a DESC, b ASC) FROM t GROUP BY d;" }
    examples:
      - "SELECT workdept, LISTAGG (lastname, ', ') WITHIN GROUP ( ORDER BY lastname ) AS employees FROM emp GROUP BY workdept;"
  - id: c_array_agg
    name: ARRAY_AGG aggregate function
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=functions-array-agg
    tier: medium
    probes:
      - { id: basic, sql: "SELECT ARRAY_AGG(c) FROM t;" }
      - { id: order_by, sql: "SELECT ARRAY_AGG(c ORDER BY c DESC) FROM t;" }
      - { id: row_element, sql: "SELECT ARRAY_AGG((a, b, c) ORDER BY a) FROM t;" }
      - { id: associative, sql: "SELECT ARRAY_AGG(k, v) FROM t;" }
  - id: c_xmlagg
    name: XMLAGG aggregate function
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=functions-xmlagg
    tier: low
    probes:
      - { id: basic, sql: "SELECT XMLAGG(XMLELEMENT(NAME \"e\", c) ORDER BY c) FROM t;" }
  - id: c_olap_ranking
    name: OLAP ranking and numbering functions
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=expressions-olap-specification
    tier: high
    probes:
      - { id: row_number, sql: "SELECT ROW_NUMBER() OVER (ORDER BY c) FROM t;" }
      - { id: row_number_partition, sql: "SELECT ROW_NUMBER() OVER (PARTITION BY a, b ORDER BY c) FROM t;" }
      - { id: rank, sql: "SELECT RANK() OVER (ORDER BY c DESC) FROM t;" }
      - { id: dense_rank, sql: "SELECT DENSE_RANK() OVER (PARTITION BY a ORDER BY c) FROM t;" }
      - { id: ntile, sql: "SELECT NTILE(4) OVER (ORDER BY c) FROM t;" }
      - { id: cume_dist, sql: "SELECT CUME_DIST() OVER (PARTITION BY a ORDER BY c) FROM t;" }
      - { id: percent_rank, sql: "SELECT PERCENT_RANK() OVER (PARTITION BY a ORDER BY c) FROM t;" }
      - { id: nulls_ordering, sql: "SELECT RANK() OVER (ORDER BY c ASC NULLS LAST, d DESC NULLS FIRST) FROM t;" }
      - { id: order_of, sql: "SELECT ROW_NUMBER() OVER (ORDER BY ORDER OF x) FROM (SELECT c FROM t ORDER BY c) AS x;" }
    examples:
      - "SELECT EMPNO, LASTNAME, FIRSTNME, SALARY+BONUS AS TOTAL_SALARY, RANK() OVER (ORDER BY SALARY+BONUS DESC) AS RANK_SALARY FROM EMPLOYEE WHERE SALARY+BONUS > 30000 ORDER BY LASTNAME;"
      - "SELECT EMPNO, WORKDEPT, SALARY, CAST ( CUME_DIST () OVER ( PARTITION BY WORKDEPT ORDER BY SALARY) AS DECIMAL(4,3)) AS CUME_DIST, CAST ( PERCENT_RANK () OVER ( PARTITION BY WORKDEPT ORDER BY SALARY) AS DECIMAL (4,3)) AS PERCENT_RANK FROM EMP ORDER BY WORKDEPT, SALARY;"
  - id: c_olap_offset_value
    name: OLAP LAG, LEAD and value functions
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=expressions-olap-specification
    tier: high
    probes:
      - { id: lag, sql: "SELECT LAG(c) OVER (ORDER BY d) FROM t;" }
      - { id: lag_offset_default, sql: "SELECT LAG(c, 2, 0) OVER (PARTITION BY a ORDER BY d) FROM t;" }
      - { id: lead, sql: "SELECT LEAD(c, 1, 0) OVER (ORDER BY d) FROM t;" }
      - { id: lag_ignore_nulls, sql: "SELECT LAG(c, 1, 0, 'IGNORE NULLS') OVER (ORDER BY d) FROM t;" }
      - { id: lead_respect_nulls, sql: "SELECT LEAD(c, 1, 0, 'RESPECT NULLS') OVER (ORDER BY d) FROM t;" }
      - { id: first_value, sql: "SELECT FIRST_VALUE(c) OVER (PARTITION BY a ORDER BY d) FROM t;" }
      - { id: last_value_ignore_nulls, sql: "SELECT LAST_VALUE(c, 'IGNORE NULLS') OVER (ORDER BY d ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING) FROM t;" }
      - { id: nth_value, sql: "SELECT NTH_VALUE(c, 2) OVER (ORDER BY d) FROM t;" }
      - { id: nth_value_from_last, sql: "SELECT NTH_VALUE(c, 2) FROM LAST IGNORE NULLS OVER (ORDER BY d) FROM t;" }
      - { id: ratio_to_report, sql: "SELECT RATIO_TO_REPORT(c) OVER (PARTITION BY a) FROM t;" }
  - id: c_olap_aggregation
    name: OLAP aggregation with OVER and window frames
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=expressions-olap-specification
    tier: high
    probes:
      - { id: over_empty, sql: "SELECT SUM(c) OVER () FROM t;" }
      - { id: over_partition, sql: "SELECT SUM(c) OVER (PARTITION BY a) FROM t;" }
      - { id: over_order, sql: "SELECT SUM(c) OVER (ORDER BY d) FROM t;" }
      - { id: rows_start, sql: "SELECT AVG(c) OVER (ORDER BY d ROWS UNBOUNDED PRECEDING) FROM t;" }
      - { id: rows_preceding, sql: "SELECT AVG(c) OVER (ORDER BY d ROWS 2 PRECEDING) FROM t;" }
      - { id: rows_current_row, sql: "SELECT AVG(c) OVER (ORDER BY d ROWS CURRENT ROW) FROM t;" }
      - { id: rows_between_n, sql: "SELECT AVG(c) OVER (ORDER BY d ROWS BETWEEN 1 PRECEDING AND 1 FOLLOWING) FROM t;" }
      - { id: rows_between_unbounded, sql: "SELECT SUM(c) OVER (ORDER BY d ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) FROM t;" }
      - { id: rows_between_current_unbounded, sql: "SELECT SUM(c) OVER (ORDER BY d ROWS BETWEEN CURRENT ROW AND UNBOUNDED FOLLOWING) FROM t;" }
      - { id: range_between_unbounded, sql: "SELECT SUM(c) OVER (ORDER BY d RANGE BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING) FROM t;" }
      - { id: range_between_value, sql: "SELECT SUM(c) OVER (ORDER BY d RANGE BETWEEN 10 PRECEDING AND 10 FOLLOWING) FROM t;" }
      - { id: range_start, sql: "SELECT SUM(c) OVER (ORDER BY d RANGE UNBOUNDED PRECEDING) FROM t;" }
      - { id: count_over, sql: "SELECT COUNT(*) OVER (PARTITION BY a ORDER BY d) FROM t;" }
      - { id: partition_order_frame, sql: "SELECT MAX(c) OVER (PARTITION BY a ORDER BY d ROWS BETWEEN 3 PRECEDING AND CURRENT ROW) FROM t;" }
  - id: c_lambdas
    name: Lambda expressions
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=reference-statements
    tier: low
    status: not-applicable
    reason: "Db2 LUW 11.5 SQL reference documents no lambda expressions, and no named WINDOW clause or aggregate FILTER clause either."
  - id: c_array_constructor
    name: ARRAY constructor
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=expressions-array-constructor
    tier: medium
    probes:
      - { id: values_list, sql: "SET v = ARRAY[1, 2, 3];" }
      - { id: empty, sql: "SET v = ARRAY[];" }
      - { id: fullselect, sql: "SET v = ARRAY[SELECT c FROM t];" }
      - { id: with_cte, sql: "SET v = ARRAY[WITH x(c) AS (SELECT c FROM t) SELECT c FROM x];" }
      - { id: in_select, sql: "SELECT ARRAY[1, 2, 3] FROM t;" }
    examples:
      - "SET RECENT_CALLS = ARRAY[ 9055553907, 4165554213, 4085553678 ];"
      - "SET DEPT_PHONES = ARRAY[SELECT DECIMAL( AREA_CODE CONCAT '555' CONCAT EXTENSION,16 ) FROM DEPARTMENT_INFO WHERE DEPTID = 624 ];"
  - id: c_array_element_access
    name: ARRAY element specification
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=expressions-array-element-specification
    tier: medium
    probes:
      - { id: index, sql: "SET x = arr[1];" }
      - { id: expression_index, sql: "SET x = arr[i + 1];" }
      - { id: assign_element, sql: "SET arr[2] = 5;" }
      - { id: cast_marker, sql: "SET x = CAST(? AS intarray)[1];" }
  - id: c_array_functions
    name: Array functions
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=functions-cardinality
    tier: medium
    probes:
      - { id: cardinality, sql: "SET n = CARDINALITY(arr);" }
      - { id: max_cardinality, sql: "SET n = MAX_CARDINALITY(arr);" }
      - { id: array_delete, sql: "SET arr = ARRAY_DELETE(arr);" }
      - { id: array_first, sql: "SET n = ARRAY_FIRST(arr);" }
      - { id: array_next, sql: "SET n = ARRAY_NEXT(arr, 1);" }
      - { id: trim_array, sql: "SET arr = TRIM_ARRAY(arr, 2);" }
      - { id: unnest, sql: "SELECT u.x FROM UNNEST(ARRAY[1, 2, 3]) AS u(x);" }
      - { id: unnest_ordinality, sql: "SELECT u.x, u.i FROM UNNEST(ARRAY[1, 2, 3]) WITH ORDINALITY AS u(x, i);" }
      - { id: unnest_parallel, sql: "SELECT * FROM UNNEST(a1, a2) AS u(x, y);" }
  - id: c_row_constructor
    name: Row expressions and constructors
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=expressions-row-expression
    tier: medium
    probes:
      - { id: row_compare, sql: "SELECT * FROM t WHERE (a, b) = (1, 2);" }
      - { id: row_in, sql: "SELECT * FROM t WHERE (a, b) IN ((1, 2), (3, 4));" }
      - { id: row_in_subquery, sql: "SELECT * FROM t WHERE (a, b) IN (SELECT x, y FROM s);" }
      - { id: row_keyword, sql: "SET r = ROW(1, 'a');" }
      - { id: field_reference, sql: "SET x = r.f;" }
  - id: c_json_constructors
    name: JSON_OBJECT and JSON_ARRAY
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=functions-json-object
    tier: medium
    probes:
      - { id: object_empty, sql: "VALUES JSON_OBJECT();" }
      - { id: object_key_value, sql: "VALUES JSON_OBJECT(KEY 'first' VALUE 'John', KEY 'last' VALUE 'Doe');" }
      - { id: object_format_json, sql: "VALUES JSON_OBJECT(KEY 'a' VALUE '{\"x\":1}' FORMAT JSON);" }
      - { id: object_null_on_null, sql: "VALUES JSON_OBJECT(KEY 'a' VALUE NULL NULL ON NULL);" }
      - { id: object_absent_on_null, sql: "VALUES JSON_OBJECT(KEY 'a' VALUE NULL ABSENT ON NULL);" }
      - { id: object_unique_keys, sql: "VALUES JSON_OBJECT(KEY 'a' VALUE 1 WITH UNIQUE KEYS);" }
      - { id: object_returning, sql: "VALUES JSON_OBJECT(KEY 'a' VALUE 1 RETURNING VARCHAR(200));" }
      - { id: object_returning_clob, sql: "VALUES JSON_OBJECT(KEY 'a' VALUE 1 RETURNING CLOB(2G) FORMAT JSON);" }
      - { id: object_returning_bson, sql: "VALUES JSON_OBJECT(KEY 'a' VALUE 1 RETURNING BLOB(1M) FORMAT BSON);" }
      - { id: array_basic, sql: "VALUES JSON_ARRAY(1, 'a', NULL);" }
      - { id: array_empty, sql: "VALUES JSON_ARRAY();" }
      - { id: array_subquery, sql: "VALUES JSON_ARRAY(SELECT c FROM t);" }
      - { id: array_options, sql: "VALUES JSON_ARRAY(1, 2 ABSENT ON NULL RETURNING VARCHAR(100));" }
    examples:
      - "VALUES JSON_OBJECT(KEY 'first' VALUE 'John', KEY 'last' VALUE 'Doe');"
      - "SELECT JSON_OBJECT(KEY 'Last name' VALUE LASTNAME, KEY 'Hire date' VALUE HIREDATE, KEY 'Salary' VALUE SALARY) FROM EMPLOYEE WHERE EMPNO = '000020';"
  - id: c_json_query_functions
    name: JSON_VALUE, JSON_QUERY, JSON_EXISTS, JSON_TABLE and IS JSON
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=functions-json-value
    tier: medium
    probes:
      - { id: json_value, sql: "SELECT JSON_VALUE(j, '$.a') FROM t;" }
      - { id: json_value_returning, sql: "SELECT JSON_VALUE(j, '$.a' RETURNING INTEGER) FROM t;" }
      - { id: json_query, sql: "SELECT JSON_QUERY(j, '$.a') FROM t;" }
      - { id: json_query_wrapper, sql: "SELECT JSON_QUERY(j, '$.a' WITH ARRAY WRAPPER) FROM t;" }
      - { id: json_exists, sql: "SELECT * FROM t WHERE JSON_EXISTS(j, '$.a');" }
      - { id: is_json, sql: "SELECT * FROM t WHERE j IS JSON;" }
      - { id: is_not_json_object, sql: "SELECT * FROM t WHERE j IS NOT JSON OBJECT;" }
      - { id: is_json_unique_keys, sql: "SELECT * FROM t WHERE j IS JSON WITH UNIQUE KEYS;" }
      - { id: json_table, sql: "SELECT jt.x FROM t, JSON_TABLE(t.j, '$' COLUMNS (x INTEGER PATH '$.a')) AS jt;" }
      - { id: json_to_bson, sql: "SELECT SYSTOOLS.JSON2BSON(j), SYSTOOLS.BSON2JSON(b) FROM t;" }
  - id: c_xml_constructors
    name: XML publishing functions
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=functions-xmlelement
    tier: low
    probes:
      - { id: xmlelement, sql: "SELECT XMLELEMENT(NAME \"emp\", XMLATTRIBUTES(c AS \"id\"), d) FROM t;" }
      - { id: xmlforest, sql: "SELECT XMLFOREST(a, b AS \"bb\") FROM t;" }
      - { id: xmlquery, sql: "SELECT XMLQUERY('$d/a' PASSING x AS \"d\") FROM t;" }
      - { id: xmlexists, sql: "SELECT * FROM t WHERE XMLEXISTS('$d/a' PASSING x AS \"d\");" }
      - { id: xmlserialize, sql: "SELECT XMLSERIALIZE(x AS CLOB(1M)) FROM t;" }
      - { id: xmlparse, sql: "SELECT XMLPARSE(DOCUMENT c PRESERVE WHITESPACE) FROM t;" }
  - id: c_string_functions
    name: String functions
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=functions-scalar
    tier: high
    probes:
      - { id: basic, sql: "SELECT UPPER(c), LOWER(c), LENGTH(c), LTRIM(c), RTRIM(c), TRIM(c) FROM t;" }
      - { id: substr, sql: "SELECT SUBSTR(c, 2, 3), SUBSTRING(c, 2, 3) FROM t;" }
      - { id: substring_units, sql: "SELECT SUBSTRING(c, 2, 3, CODEUNITS32) FROM t;" }
      - { id: trim_both, sql: "SELECT TRIM(BOTH 'x' FROM c), TRIM(LEADING 'x' FROM c), TRIM(TRAILING FROM c) FROM t;" }
      - { id: replace_translate, sql: "SELECT REPLACE(c, 'a', 'b'), TRANSLATE(c, 'xy', 'ab') FROM t;" }
      - { id: concat_function, sql: "SELECT CONCAT(a, b), a || b, a CONCAT b FROM t;" }
      - { id: locate_posstr, sql: "SELECT LOCATE('a', c), POSSTR(c, 'a'), INSTR(c, 'a') FROM t;" }
      - { id: position, sql: "SELECT POSITION('a' IN c USING CODEUNITS32) FROM t;" }
      - { id: lpad_rpad, sql: "SELECT LPAD(c, 10, '0'), RPAD(c, 10, ' ') FROM t;" }
      - { id: left_right, sql: "SELECT LEFT(c, 2), RIGHT(c, 2), REPEAT(c, 3), SPACE(4) FROM t;" }
      - { id: overlay, sql: "SELECT OVERLAY(c PLACING 'xx' FROM 2 FOR 3) FROM t;" }
      - { id: regexp, sql: "SELECT REGEXP_LIKE(c, '^a'), REGEXP_REPLACE(c, 'a', 'b'), REGEXP_SUBSTR(c, 'a+'), REGEXP_COUNT(c, 'a') FROM t;" }
      - { id: regexp_where, sql: "SELECT * FROM t WHERE REGEXP_LIKE(c, '^a', 'i');" }
  - id: c_numeric_functions
    name: Numeric and mathematical functions
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=functions-scalar
    tier: high
    probes:
      - { id: abs_round, sql: "SELECT ABS(c), ROUND(c, 2), TRUNC(c, 1), TRUNCATE(c, 1), CEIL(c), CEILING(c), FLOOR(c) FROM t;" }
      - { id: power_sqrt, sql: "SELECT POWER(c, 2), SQRT(c), EXP(c), LN(c), LOG10(c), MOD(c, 3), SIGN(c) FROM t;" }
      - { id: trig, sql: "SELECT SIN(c), COS(c), TAN(c), ATAN2(a, b), DEGREES(c), RADIANS(c) FROM t;" }
      - { id: rand, sql: "SELECT RAND(), RAND(5) FROM t;" }
      - { id: greatest_least, sql: "SELECT GREATEST(a, b, c), LEAST(a, b, c) FROM t;" }
      - { id: bit_functions, sql: "SELECT BITAND(a, b), BITOR(a, b), BITXOR(a, b), BITNOT(a) FROM t;" }
      - { id: modulo_operator, sql: "SELECT a % b, a / b, a * b, a - b, -a FROM t;" }
  - id: c_datetime_functions
    name: Date and time functions and special registers
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=functions-scalar
    tier: high
    probes:
      - { id: special_registers, sql: "SELECT CURRENT DATE, CURRENT TIME, CURRENT TIMESTAMP, CURRENT_DATE, CURRENT_TIMESTAMP FROM t;" }
      - { id: current_timestamp_precision, sql: "SELECT CURRENT TIMESTAMP(6), CURRENT_TIMESTAMP(3) FROM t;" }
      - { id: current_zone, sql: "SELECT CURRENT TIMEZONE, CURRENT SCHEMA, CURRENT USER, SESSION_USER, USER FROM t;" }
      - { id: extract_parts, sql: "SELECT YEAR(d), MONTH(d), DAY(d), HOUR(ts), MINUTE(ts), SECOND(ts), MICROSECOND(ts) FROM t;" }
      - { id: extract_function, sql: "SELECT EXTRACT(YEAR FROM d), EXTRACT(EPOCH FROM ts) FROM t;" }
      - { id: date_arith, sql: "SELECT ADD_MONTHS(d, 3), LAST_DAY(d), NEXT_DAY(d, 'MONDAY'), DAYS(d), DAYOFWEEK(d), DAYOFYEAR(d) FROM t;" }
      - { id: timestampdiff, sql: "SELECT TIMESTAMPDIFF(16, CHAR(ts1 - ts2)), DAYS_BETWEEN(d1, d2), MONTHS_BETWEEN(d1, d2) FROM t;" }
      - { id: to_char_date, sql: "SELECT TO_CHAR(ts, 'YYYY-MM-DD HH24:MI:SS'), TO_DATE('2024-01-31', 'YYYY-MM-DD'), TO_TIMESTAMP('2024-01-31', 'YYYY-MM-DD') FROM t;" }
      - { id: trunc_round_date, sql: "SELECT TRUNC_TIMESTAMP(ts, 'MM'), ROUND_TIMESTAMP(ts, 'DD') FROM t;" }
      - { id: date_functions, sql: "SELECT DATE(ts), TIME(ts), TIMESTAMP(d, t2), VARCHAR_FORMAT(ts, 'YYYY'), TIMESTAMP_FORMAT('2024-01-31', 'YYYY-MM-DD') FROM t;" }
  - id: c_conversion_and_null_functions
    name: Conversion, NULL-handling and conditional functions
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=functions-scalar
    tier: high
    probes:
      - { id: coalesce, sql: "SELECT COALESCE(a, b, 0), VALUE(a, 0), IFNULL(a, 0), NVL(a, 0) FROM t;" }
      - { id: nullif, sql: "SELECT NULLIF(a, 0) FROM t;" }
      - { id: nvl2, sql: "SELECT NVL2(a, b, c) FROM t;" }
      - { id: decode, sql: "SELECT DECODE(a, 1, 'one', 2, 'two', 'other') FROM t;" }
      - { id: casts, sql: "SELECT CAST(a AS VARCHAR(10)), CAST(NULL AS INTEGER), CAST(? AS INTEGER) FROM t;" }
      - { id: scalar_conversions, sql: "SELECT INTEGER(a), BIGINT(a), DECIMAL(a, 10, 2), DOUBLE(a), CHAR(a), VARCHAR(a), HEX(a), CLOB(a) FROM t;" }
      - { id: case_searched, sql: "SELECT CASE WHEN a > 1 THEN 'x' WHEN a < 0 THEN 'y' ELSE 'z' END FROM t;" }
      - { id: case_simple, sql: "SELECT CASE a WHEN 1 THEN 'x' ELSE 'y' END FROM t;" }
      - { id: rid_functions, sql: "SELECT RID_BIT(t), RID(t), ROW CHANGE TOKEN FOR t FROM t;" }
  - id: c_misc_function_families
    name: Other scalar function families
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=functions-scalar
    tier: medium
    probes:
      - { id: schema_qualified, sql: "SELECT SYSIBM.UPPER(c), MYSCHEMA.MYFUNC(a, b) FROM t;" }
      - { id: named_arguments, sql: "SELECT MYFUNC(P1 => a, P2 => b) FROM t;" }
      - { id: hash_functions, sql: "SELECT HASH(c, 1), HASH4(c), HASH8(c), RAWTOHEX(c), GENERATE_UNIQUE() FROM t;" }
      - { id: sequence_refs, sql: "SELECT NEXT VALUE FOR s, PREVIOUS VALUE FOR s, NEXTVAL FOR s FROM t;" }
      - { id: table_function, sql: "SELECT * FROM TABLE(MYFUNC(1)) AS f;" }
      - { id: typed_constants, sql: "SELECT MYSCHEMA.MYTYPE(1), TREAT(c AS MYTYPE) FROM t;" }
      - { id: collation, sql: "SELECT COLLATION_KEY_BIT(c, 'UCA500R1_S2') FROM t;" }
