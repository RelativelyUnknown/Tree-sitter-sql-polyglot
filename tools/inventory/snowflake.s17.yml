      - { id: in_application_package, sql: "SHOW SCHEMAS IN APPLICATION PACKAGE pkg;" }
      - { id: starts_with, sql: "SHOW SCHEMAS STARTS WITH 'my';" }
      - { id: limit_from, sql: "SHOW SCHEMAS LIMIT 5 FROM 'a';" }
      - { id: with_privileges, sql: "SHOW SCHEMAS WITH PRIVILEGES USAGE;" }
      - { id: with_privileges_list, sql: "SHOW SCHEMAS WITH PRIVILEGES USAGE, CREATE TABLE;" }
    examples:
      - "SHOW SCHEMAS;"
      - "SHOW SCHEMAS HISTORY;"
      - "SHOW SCHEMAS IN DATABASE my_db;"

