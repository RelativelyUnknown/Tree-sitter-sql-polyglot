dialect: teradata
engine: Teradata Vantage (Enterprise IntelliFlex) and VantageCloud Lake
version: "20.00"
source: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/DXllu86_qUx3dJlXfCkc6Q

statements:
  - id: commit
    name: COMMIT
    doc: https://docs.teradata.com/reader/4_jiz05LXsLWBbfvKTLneg/fbhYTlrVH3vUNnyTy99Wcw
    tier: high
    probes:
      - { id: basic, sql: "COMMIT;" }
      - { id: work, sql: "COMMIT WORK;" }
      - { id: work_release, sql: "COMMIT WORK RELEASE;" }
    examples:
      - "COMMIT WORK;"

  - id: delete
    name: DELETE (DEL)
    doc: https://docs.teradata.com/reader/4_jiz05LXsLWBbfvKTLneg/PcZstkRrYY0uzL5x1d0vxg
    tier: high
    probes:
      - { id: basic, sql: "DELETE FROM t;" }
      - { id: del_abbreviation, sql: "DEL FROM t;" }
      - { id: where, sql: "DELETE FROM t WHERE c = 1;" }
      - { id: all, sql: "DELETE FROM t ALL;" }
      - { id: where_all, sql: "DELETE FROM t WHERE ALL;" }
      - { id: qualified_name, sql: "DELETE FROM db1.t WHERE c = 1;" }
      - { id: correlation_name, sql: "DELETE FROM t AS a WHERE a.c = 1;" }
      - { id: correlation_no_as, sql: "DELETE FROM t a WHERE a.c = 1;" }
      - { id: delete_table_name, sql: "DELETE t FROM t WHERE c = 1;" }
      - { id: delete_correlation_name, sql: "DELETE a FROM t AS a WHERE a.c = 1;" }
      - { id: isolated_loading, sql: "DELETE WITH ISOLATED LOADING FROM t WHERE c = 1;" }
      - { id: no_isolated_loading, sql: "DELETE WITH NO ISOLATED LOADING FROM t WHERE c = 1;" }
      - { id: concurrent_isolated_loading, sql: "DELETE WITH CONCURRENT ISOLATED LOADING FROM t WHERE c = 1;" }
      - { id: no_concurrent_isolated_loading, sql: "DELETE WITH NO CONCURRENT ISOLATED LOADING FROM t WHERE c = 1;" }
      - { id: subquery_condition, sql: "DELETE FROM t WHERE c IN (SELECT c FROM u);" }
      - { id: join_form_from_table, sql: "DELETE t FROM t, u WHERE t.c = u.c;" }
      - { id: join_form_from_alias, sql: "DELETE a FROM t AS a, u AS b WHERE a.c = b.c;" }
      - { id: join_form_no_from, sql: "DELETE t WHERE t.c = u.c;" }
      - { id: join_form_all, sql: "DELETE t FROM t, u ALL;" }
      - { id: del_join_form, sql: "DEL t FROM t, u WHERE t.c = u.c;" }
    examples:
      - |-
        DELETE FROM employee
        WHERE deptno=500;
      - "DELETE FROM employee ALL;"
      - |-
        DELETE FROM employee
        WHERE empno=10011;
