dialect: mariadb
engine: MariaDB Server
version: "11.x (current)"
source: https://mariadb.com/docs/server/reference/sql-statements

statements:
  - id: savepoint
    name: SAVEPOINT / ROLLBACK TO / RELEASE SAVEPOINT
    doc: https://mariadb.com/docs/server/reference/sql-statements/transactions/savepoint
    tier: high
    probes:
      - id: savepoint
        sql: "SAVEPOINT sp1;"
      - id: rollback_to
        sql: "ROLLBACK TO sp1;"
      - id: rollback_to_savepoint
        sql: "ROLLBACK TO SAVEPOINT sp1;"
      - id: rollback_work_to
        sql: "ROLLBACK WORK TO sp1;"
      - id: rollback_work_to_savepoint
        sql: "ROLLBACK WORK TO SAVEPOINT sp1;"
      - id: release_savepoint
        sql: "RELEASE SAVEPOINT sp1;"

  - id: set_transaction
    name: SET TRANSACTION
    doc: https://mariadb.com/docs/server/reference/sql-statements/transactions/set-transaction
    tier: high
    probes:
      - id: isolation_repeatable_read
        sql: "SET TRANSACTION ISOLATION LEVEL REPEATABLE READ;"
      - id: isolation_read_committed
        sql: "SET TRANSACTION ISOLATION LEVEL READ COMMITTED;"
      - id: isolation_read_uncommitted
        sql: "SET TRANSACTION ISOLATION LEVEL READ UNCOMMITTED;"
      - id: isolation_serializable
        sql: "SET TRANSACTION ISOLATION LEVEL SERIALIZABLE;"
      - id: read_write
        sql: "SET TRANSACTION READ WRITE;"
      - id: read_only
        sql: "SET TRANSACTION READ ONLY;"
      - id: global_isolation
        sql: "SET GLOBAL TRANSACTION ISOLATION LEVEL SERIALIZABLE;"
      - id: session_isolation
        sql: "SET SESSION TRANSACTION ISOLATION LEVEL READ COMMITTED;"
      - id: global_access_mode
        sql: "SET GLOBAL TRANSACTION READ ONLY;"
      - id: session_access_mode
        sql: "SET SESSION TRANSACTION READ WRITE;"
      - id: multiple_properties
        sql: "SET TRANSACTION ISOLATION LEVEL READ COMMITTED, READ ONLY;"
      - id: session_multiple_properties
        sql: "SET SESSION TRANSACTION READ WRITE, ISOLATION LEVEL SERIALIZABLE;"
    examples:
      - "SET SESSION TRANSACTION ISOLATION LEVEL READ COMMITTED;"
      - "SET GLOBAL TRANSACTION ISOLATION LEVEL SERIALIZABLE;"
      - "SET TRANSACTION ISOLATION LEVEL SERIALIZABLE;"
