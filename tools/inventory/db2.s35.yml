dialect: db2
engine: IBM Db2 for Linux, UNIX and Windows
version: "12.1"
source: https://www.ibm.com/docs/en/db2/12.1.x?topic=reference-statements

statements:
  - id: set_path
    name: SET PATH
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-set-path
    tier: medium
    probes:
      - { id: schema_list, sql: "SET PATH = s1, s2;" }
      - { id: current_path_keyword, sql: "SET CURRENT PATH = s1;" }
      - { id: system_path, sql: "SET PATH = SYSTEM PATH, s1;" }
      - { id: user_and_current, sql: "SET PATH = USER, CURRENT PATH;" }
      - { id: current_package_path, sql: "SET PATH = CURRENT PACKAGE PATH;" }
      - { id: string_constant, sql: "SET PATH = 'S1';" }
    examples:
      - 'SET PATH = FERMAT, "McDrw #8", SYSIBM;'

  - id: set_role
    name: SET ROLE
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-set-role
    tier: medium
    probes:
      - { id: basic, sql: "SET ROLE r;" }
      - { id: with_equals, sql: "SET ROLE = r;" }
    examples:
      - "SET ROLE EDITOR;"
      - "SET ROLE AUTHOR;"

  - id: set_schema
    name: SET SCHEMA
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-set-schema
    tier: medium
    probes:
      - { id: schema_name, sql: "SET SCHEMA s;" }
      - { id: current_schema_equals, sql: "SET CURRENT SCHEMA = s;" }
      - { id: user, sql: "SET SCHEMA USER;" }
      - { id: session_user, sql: "SET SCHEMA = SESSION_USER;" }
      - { id: system_user, sql: "SET SCHEMA SYSTEM_USER;" }
      - { id: current_user, sql: "SET SCHEMA CURRENT_USER;" }
      - { id: string_constant, sql: "SET SCHEMA 'S';" }
    examples:
      - "SET SCHEMA RICK;"

  - id: set_session_authorization
    name: SET SESSION AUTHORIZATION
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-set-session-authorization
    tier: medium
    probes:
      - { id: session_user_equals, sql: "SET SESSION_USER = u;" }
      - { id: session_authorization, sql: "SET SESSION AUTHORIZATION u;" }
      - { id: session_authorization_equals, sql: "SET SESSION AUTHORIZATION SESSION_USER = u;" }
      - { id: system_user, sql: "SET SESSION AUTHORIZATION SYSTEM_USER;" }
      - { id: string_constant, sql: "SET SESSION_USER = 'U';" }
      - { id: allow_administration, sql: "SET SESSION AUTHORIZATION u ALLOW ADMINISTRATION;" }
    examples:
      - "SET SESSION_USER = RAJIV;"
      - "SET SESSION AUTHORIZATION SYSTEM_USER;"

  - id: transfer_ownership
    name: TRANSFER OWNERSHIP
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-transfer-ownership
    tier: medium
    probes:
      - { id: table_preserve, sql: "TRANSFER OWNERSHIP OF TABLE s.t TO USER u PRESERVE PRIVILEGES;" }
      - { id: view_revoke, sql: "TRANSFER OWNERSHIP OF VIEW s.v TO USER u REVOKE PRIVILEGES;" }
      - { id: new_owner_session_user, sql: "TRANSFER OWNERSHIP OF SCHEMA s TO SESSION_USER PRESERVE PRIVILEGES;" }
      - { id: new_owner_system_user, sql: "TRANSFER OWNERSHIP OF SEQUENCE s.q TO SYSTEM_USER REVOKE PRIVILEGES;" }
      - { id: function_designator, sql: "TRANSFER OWNERSHIP OF FUNCTION s.f (INTEGER, VARCHAR(10)) TO USER u PRESERVE PRIVILEGES;" }
      - { id: specific_procedure, sql: "TRANSFER OWNERSHIP OF SPECIFIC PROCEDURE s.sp TO USER u REVOKE PRIVILEGES;" }
      - { id: public_alias, sql: "TRANSFER OWNERSHIP OF PUBLIC ALIAS a FOR TABLE TO USER u PRESERVE PRIVILEGES;" }
      - { id: constraint, sql: "TRANSFER OWNERSHIP OF CONSTRAINT s.t c1 TO USER u PRESERVE PRIVILEGES;" }
      - { id: distinct_type, sql: "TRANSFER OWNERSHIP OF DISTINCT TYPE s.ty TO USER u PRESERVE PRIVILEGES;" }
    examples:
      - "TRANSFER OWNERSHIP OF TABLE WALID.T1 TO USER PAUL PRESERVE PRIVILEGES;"

  - id: alter_audit_policy
    name: ALTER AUDIT POLICY
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-alter-audit-policy
    tier: low
    probes:
      - { id: categories, sql: "ALTER AUDIT POLICY p CATEGORIES EXECUTE STATUS BOTH, CONTEXT STATUS NONE ERROR TYPE AUDIT;" }

  - id: alter_bufferpool
    name: ALTER BUFFERPOOL
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-alter-bufferpool
    tier: low
    probes:
      - { id: size, sql: "ALTER BUFFERPOOL bp IMMEDIATE SIZE 1000;" }
      - { id: add_partition_group, sql: "ALTER BUFFERPOOL bp ADD DATABASE PARTITION GROUP g;" }

  - id: alter_database_partition_group
    name: ALTER DATABASE PARTITION GROUP
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-alter-database-partition-group
    tier: low
    probes:
      - { id: add_dbpartitionnum, sql: "ALTER DATABASE PARTITION GROUP g ADD DBPARTITIONNUM (3) LIKE DBPARTITIONNUM 1 WITHOUT TABLESPACES;" }
      - { id: drop_dbpartitionnums, sql: "ALTER DATABASE PARTITION GROUP g DROP DBPARTITIONNUMS (2 TO 4);" }

  - id: alter_event_monitor
    name: ALTER EVENT MONITOR
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-alter-event-monitor
    tier: low
    probes:
      - { id: add_logical_group, sql: "ALTER EVENT MONITOR em ADD LOGICAL GROUP g (TABLE t IN ts PCTDEACTIVATE 90);" }

  - id: alter_histogram_template
    name: ALTER HISTOGRAM TEMPLATE
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-alter-histogram-template
    tier: low
    probes:
      - { id: high_bin_value, sql: "ALTER HISTOGRAM TEMPLATE tpl HIGH BIN VALUE 100;" }

  - id: alter_mask
    name: ALTER MASK
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-alter-mask
    tier: low
    probes:
      - { id: enable, sql: "ALTER MASK m ENABLE;" }
      - { id: disable, sql: "ALTER MASK m DISABLE;" }

  - id: alter_method
    name: ALTER METHOD
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-alter-method
    tier: low
    probes:
      - { id: external_name, sql: "ALTER METHOD m (INTEGER) FOR ty EXTERNAL NAME 'lib!fn';" }
      - { id: specific_method, sql: "ALTER SPECIFIC METHOD sm EXTERNAL NAME 'lib!fn';" }

  - id: alter_nickname
    name: ALTER NICKNAME
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-alter-nickname
    tier: low
    probes:
      - { id: options, sql: "ALTER NICKNAME n OPTIONS (ADD o 'v');" }
      - { id: alter_column_local_type, sql: "ALTER NICKNAME n ALTER COLUMN c LOCAL TYPE VARCHAR(20);" }
      - { id: allow_caching, sql: "ALTER NICKNAME n ALLOW CACHING;" }

  - id: alter_package
    name: ALTER PACKAGE
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-alter-package
    tier: low
    probes:
      - { id: access_plan_reuse, sql: "ALTER PACKAGE s.p ACCESS PLAN REUSE YES;" }
      - { id: version_keep_dynamic, sql: "ALTER PACKAGE s.p VERSION v1 KEEP DYNAMIC NO;" }

  - id: alter_permission
    name: ALTER PERMISSION
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-alter-permission
    tier: low
    probes:
      - { id: enable, sql: "ALTER PERMISSION perm ENABLE;" }
      - { id: disable, sql: "ALTER PERMISSION perm DISABLE;" }

  - id: alter_security_label_component
    name: ALTER SECURITY LABEL COMPONENT
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-alter-security-label-component
    tier: low
    probes:
      - { id: add_array_element, sql: "ALTER SECURITY LABEL COMPONENT c ADD ELEMENT 'e' BEFORE 'f';" }
      - { id: add_tree_element, sql: "ALTER SECURITY LABEL COMPONENT c ADD ELEMENT 'e' UNDER 'p';" }

  - id: alter_security_policy
    name: ALTER SECURITY POLICY
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-alter-security-policy
    tier: low
    probes:
      - { id: add_component, sql: "ALTER SECURITY POLICY sp ADD SECURITY LABEL COMPONENT c OVERRIDE NOT AUTHORIZED WRITE SECURITY LABEL;" }
      - { id: group_authorizations, sql: "ALTER SECURITY POLICY sp USE GROUP AUTHORIZATIONS;" }

  - id: alter_server
    name: ALTER SERVER
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-alter-server
    tier: low
    probes:
      - { id: version, sql: "ALTER SERVER srv VERSION 12;" }
      - { id: options, sql: "ALTER SERVER srv OPTIONS (SET o 'v');" }

  - id: alter_service_class
    name: ALTER SERVICE CLASS
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-alter-service-class
    tier: low
    probes:
      - { id: cpu_shares, sql: "ALTER SERVICE CLASS sc UNDER sup SOFT CPU SHARES 500;" }
      - { id: disable, sql: "ALTER SERVICE CLASS sc DISABLE;" }

  - id: alter_stogroup
    name: ALTER STOGROUP
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-alter-stogroup
    tier: low
    probes:
      - { id: add_path, sql: "ALTER STOGROUP sg ADD '/path1', '/path2';" }
      - { id: overhead_set_default, sql: "ALTER STOGROUP sg OVERHEAD 6.725 SET AS DEFAULT;" }

  - id: alter_threshold
    name: ALTER THRESHOLD
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-alter-threshold
    tier: low
    probes:
      - { id: when_perform_action, sql: "ALTER THRESHOLD th WHEN TOTALMEMBERCONNECTIONS > 10 STOP EXECUTION;" }
      - { id: disable, sql: "ALTER THRESHOLD th DISABLE;" }

  - id: alter_trusted_context
    name: ALTER TRUSTED CONTEXT
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-alter-trusted-context
    tier: low
    probes:
      - { id: alter_system_authid, sql: "ALTER TRUSTED CONTEXT tc ALTER SYSTEM AUTHID u;" }
      - { id: add_attributes, sql: "ALTER TRUSTED CONTEXT tc ADD ATTRIBUTES (ADDRESS '9.26.113.204');" }
      - { id: enable, sql: "ALTER TRUSTED CONTEXT tc ENABLE;" }

  - id: alter_usage_list
    name: ALTER USAGE LIST
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-alter-usage-list
    tier: low
    probes:
      - { id: list_size_when_full, sql: "ALTER USAGE LIST ul LIST SIZE 100 WHEN FULL WRAP ACTIVE ON START DATABASE;" }

  - id: alter_user_mapping
    name: ALTER USER MAPPING
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-alter-user-mapping
    tier: low
    probes:
      - { id: for_user, sql: "ALTER USER MAPPING FOR u SERVER srv OPTIONS (SET REMOTE_PASSWORD 'p');" }
      - { id: for_public, sql: "ALTER USER MAPPING FOR PUBLIC SERVER srv OPTIONS (ADD o 'v');" }
