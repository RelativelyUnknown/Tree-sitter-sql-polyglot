dialect: snowflake
engine: Snowflake
version: "current (docs read 2026-10-04)"
source: https://docs.snowflake.com/en/sql-reference/sql-all

statements:
  - id: undrop_snapshot
    name: UNDROP SNAPSHOT
    doc: https://docs.snowflake.com/en/sql-reference/sql/undrop-snapshot
    tier: low
    probes:
      - id: basic
        sql: "UNDROP SNAPSHOT s;"
      - id: rename_to
        sql: "UNDROP SNAPSHOT s RENAME TO s2;"

  - id: undrop_streamlit
    name: UNDROP STREAMLIT
    doc: https://docs.snowflake.com/en/sql-reference/sql/undrop-streamlit
    tier: low
    probes:
      - id: basic
        sql: "UNDROP STREAMLIT s;"
