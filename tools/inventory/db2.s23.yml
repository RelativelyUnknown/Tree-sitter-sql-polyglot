dialect: db2
engine: IBM Db2 for Linux, UNIX and Windows
version: "11.5"
source: https://www.ibm.com/docs/en/db2/11.5.x?topic=reference-statements

statements:
  - id: return
    name: RETURN
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-return
    tier: high
    probes:
      - id: expression
        sql: "RETURN 0;"
      - id: expression_arithmetic
        sql: "RETURN a + 1;"
      - id: null_value
        sql: "RETURN NULL;"
      - id: fullselect
        sql: "RETURN SELECT c FROM t;"
      - id: fullselect_parenthesized
        sql: "RETURN (SELECT c FROM t);"
      - id: with_cte_fullselect
        sql: "RETURN WITH x (c) AS (SELECT 1 FROM sysibm.sysdummy1) SELECT c FROM x;"
      - id: with_multiple_ctes
        sql: "RETURN WITH x (c) AS (SELECT 1 FROM sysibm.sysdummy1), y (d) AS (SELECT c FROM x) SELECT d FROM y;"

  - id: rollback
    name: ROLLBACK
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-rollback
    tier: high
    probes:
      - id: basic
        sql: "ROLLBACK;"
      - id: work
        sql: "ROLLBACK WORK;"
      - id: to_savepoint
        sql: "ROLLBACK TO SAVEPOINT;"
      - id: to_savepoint_name
        sql: "ROLLBACK TO SAVEPOINT sp1;"
      - id: work_to_savepoint_name
        sql: "ROLLBACK WORK TO SAVEPOINT sp1;"
    examples:
      - "ROLLBACK WORK;"
