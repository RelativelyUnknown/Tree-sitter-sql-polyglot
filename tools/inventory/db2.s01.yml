dialect: db2
engine: IBM Db2 for Linux, UNIX and Windows
version: "11.5"
source: https://www.ibm.com/docs/en/db2/11.5.x?topic=reference-statements

statements:
  - id: alter_function
    name: ALTER FUNCTION
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-alter-function
    tier: high
    probes:
      - id: designator_empty_params
        sql: "ALTER FUNCTION f() NOT FENCED;"
      - id: designator_param_types
        sql: "ALTER FUNCTION s.f(INTEGER, VARCHAR(10)) FENCED;"
      - id: designator_name_only
        sql: "ALTER FUNCTION s.f FENCED;"
        note: "function-designator allows function-name without a parameter list"
      - id: designator_specific
        sql: "ALTER SPECIFIC FUNCTION s.f_spec NOT FENCED;"
      - id: external_name_string
        sql: "ALTER FUNCTION f(INTEGER) EXTERNAL NAME 'mylib!myfunc';"
      - id: external_name_identifier
        sql: "ALTER FUNCTION f(INTEGER) EXTERNAL NAME myfunc;"
      - id: fenced
        sql: "ALTER FUNCTION f(INTEGER) FENCED;"
      - id: not_fenced
        sql: "ALTER FUNCTION f(INTEGER) NOT FENCED;"
      - id: secured
        sql: "ALTER FUNCTION f(INTEGER) SECURED;"
      - id: not_secured
        sql: "ALTER FUNCTION f(INTEGER) NOT SECURED;"
      - id: threadsafe
        sql: "ALTER FUNCTION f(INTEGER) THREADSAFE;"
      - id: not_threadsafe
        sql: "ALTER FUNCTION f(INTEGER) NOT THREADSAFE;"
      - id: multiple_options
        sql: "ALTER FUNCTION f(INTEGER) EXTERNAL NAME 'mylib!myfunc' NOT FENCED THREADSAFE SECURED;"
    examples:
      - "ALTER FUNCTION MAIL() NOT FENCED;"

  - id: alter_index
    name: ALTER INDEX
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-alter-index
    tier: high
    probes:
      - id: compress_yes
        sql: "ALTER INDEX idx COMPRESS YES;"
      - id: compress_no
        sql: "ALTER INDEX idx COMPRESS NO;"
      - id: qualified_name
        sql: "ALTER INDEX s.idx COMPRESS YES;"
    examples:
      - "ALTER INDEX JOB_BY_DPT COMPRESS YES;"
