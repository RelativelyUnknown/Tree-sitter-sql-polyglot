  - id: declare_local_variable
    name: "DECLARE @local_variable"
    doc: https://learn.microsoft.com/en-us/sql/t-sql/language-elements/declare-local-variable-transact-sql
    tier: high
    probes:
      - id: scalar
        sql: "DECLARE @find VARCHAR(30);"
      - id: scalar_as
        sql: "DECLARE @find AS VARCHAR(30);"
      - id: initial_value
        sql: "DECLARE @find VARCHAR(30) = 'Man%';"
      - id: multiple
        sql: "DECLARE @Group AS NVARCHAR(50), @Sales AS MONEY = 2000000;"
      - id: subquery_initializer
        sql: "DECLARE @id INT = (SELECT MAX(id) FROM t);"
      - id: function_initializer
        sql: "DECLARE @d DATETIME2 = DATEADD(month, -12, SYSUTCDATETIME());"
      - id: cursor_variable
        sql: "DECLARE @cur CURSOR;"
      - id: table_variable
        sql: "DECLARE @t TABLE (EmpID INT NOT NULL, OldHours INT, Modified DATETIME);"
      - id: table_variable_as
        sql: "DECLARE @t AS TABLE (id INT);"
      - id: table_variable_constraints
        sql: "DECLARE @t TABLE (id INT IDENTITY(1, 1) PRIMARY KEY CLUSTERED, c NVARCHAR(10) COLLATE Latin1_General_CI_AS DEFAULT 'x' NOT NULL UNIQUE, g UNIQUEIDENTIFIER ROWGUIDCOL, total AS id * 2, CHECK (id > 0));"
      - id: table_variable_inline_indexes
        sql: "DECLARE @t TABLE (EmpID INT NOT NULL, PRIMARY KEY CLUSTERED (EmpID), UNIQUE NONCLUSTERED (EmpID), INDEX ix NONCLUSTERED (EmpID));"
      - id: table_variable_column_index
        sql: "DECLARE @t TABLE (a INT INDEX ix_a NONCLUSTERED, b INT, INDEX cci CLUSTERED COLUMNSTORE);"
      - id: user_defined_table_type
        sql: "DECLARE @LocationTVP AS LocationTableType;"
      - id: xml_typed
        sql: "DECLARE @x XML(dbo.sc) = N'<a/>';"
      - id: vector_and_json_types
        sql: "DECLARE @v VECTOR(3) = '[0.1, 2, 30]', @j JSON = N'{\"a\": 1}';"
        note: "vector and json data types are documented for Azure SQL Database."
    examples:
      - "DECLARE @find AS VARCHAR (30);"
      - "DECLARE @Group AS NVARCHAR (50), @Sales AS MONEY;"
      - |-
        DECLARE @MyTableVar TABLE (
            EmpID INT NOT NULL,
            OldVacationHours INT,
            NewVacationHours INT,
            ModifiedDate DATETIME);
      - |-
        DECLARE @MyTableVar TABLE (
            EmpID INT NOT NULL,
            PRIMARY KEY CLUSTERED (EmpID),
            UNIQUE NONCLUSTERED (EmpID),
            INDEX CustomNonClusteredIndex NONCLUSTERED (EmpID));
      - "DECLARE @LocationTVP AS LocationTableType;"

