dialect: databricks
engine: Databricks SQL / Databricks Runtime
version: "current (docs read 2026-10-04)"
source: https://docs.databricks.com/aws/en/sql/language-manual/

statements:
  - id: add_archive
    name: ADD ARCHIVE
    doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-aux-resource-mgmt-add-archive
    tier: low
    probes:
      - id: basic
        sql: "ADD ARCHIVE '/tmp/test.tar.gz';"
      - id: archives_multiple
        sql: "ADD ARCHIVES '/path/a.zip' '/path/b.tar';"

  - id: add_file
    name: ADD FILE
    doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-aux-resource-mgmt-add-file
    tier: low
    probes:
      - id: basic
        sql: "ADD FILE '/tmp/test';"
      - id: files_multiple
        sql: "ADD FILES '/path/to/directory' '/path/abc.txt';"

  - id: add_jar
    name: ADD JAR
    doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-aux-resource-mgmt-add-jar
    tier: low
    probes:
      - id: basic
        sql: "ADD JAR '/tmp/test.jar';"
      - id: jars_multiple
        sql: "ADD JARS '/path/abc.jar' '/path/def.jar';"

  - id: list_archive
    name: LIST ARCHIVE
    doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-aux-resource-mgmt-list-archive
    tier: low
    probes:
      - id: basic
        sql: "LIST ARCHIVE;"
      - id: with_names
        sql: "LIST ARCHIVES '/tmp/test.zip' '/some/random.tgz';"

  - id: list_file
    name: LIST FILE
    doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-aux-resource-mgmt-list-file
    tier: low
    probes:
      - id: basic
        sql: "LIST FILE;"
      - id: with_names
        sql: "LIST FILES '/tmp/test' '/some/random/file';"

  - id: list_jar
    name: LIST JAR
    doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-aux-resource-mgmt-list-jar
    tier: low
    probes:
      - id: basic
        sql: "LIST JAR;"
      - id: with_names
        sql: "LIST JARS '/tmp/test.jar' '/some/random.jar';"

  - id: get
    name: GET
    doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-aux-connector-get
    tier: low
    probes:
      - id: basic
        sql: "GET '/Volumes/c/s/v/file1.csv' TO '/home/bob/data.csv';"

  - id: put_into
    name: PUT INTO
    doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-aux-connector-put-into
    tier: low
    probes:
      - id: basic
        sql: "PUT '/home/bob/data.csv' INTO '/Volumes/c/s/v/file1.csv';"
      - id: overwrite
        sql: "PUT '/home/bob/data.csv' INTO '/Volumes/c/s/v/file1.csv' OVERWRITE;"

  - id: remove
    name: REMOVE
    doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-aux-connector-remove
    tier: low
    probes:
      - id: basic
        sql: "REMOVE '/Volumes/c/s/v/file1.csv';"

  - id: deny
    name: DENY
    doc: https://docs.databricks.com/aws/en/sql/language-manual/security-deny
    tier: low
    probes:
      - id: privilege_on_table
        sql: "DENY SELECT ON TABLE t TO `alf@melmak.et`;"
      - id: all_privileges
        sql: "DENY ALL PRIVILEGES ON TABLE t TO `alf@melmak.et`;"

  - id: grant_on_share
    name: GRANT ON SHARE
    doc: https://docs.databricks.com/aws/en/sql/language-manual/security-grant-share
    tier: low
    probes:
      - id: basic
        sql: "GRANT SELECT ON SHARE s TO RECIPIENT r;"

  - id: revoke_on_share
    name: REVOKE ON SHARE
    doc: https://docs.databricks.com/aws/en/sql/language-manual/security-revoke-share
    tier: low
    probes:
      - id: basic
        sql: "REVOKE SELECT ON SHARE s FROM RECIPIENT r;"

  - id: show_grants_on_share
    name: SHOW GRANTS ON SHARE
    doc: https://docs.databricks.com/aws/en/sql/language-manual/security-show-grant-on-share
    tier: low
    probes:
      - id: basic
        sql: "SHOW GRANTS ON SHARE s;"
      - id: grant_alternative
        sql: "SHOW GRANT ON SHARE s;"

  - id: show_grants_to_recipient
    name: SHOW GRANTS TO RECIPIENT
    doc: https://docs.databricks.com/aws/en/sql/language-manual/security-show-grant-to-recipient
    tier: low
    probes:
      - id: basic
        sql: "SHOW GRANTS TO RECIPIENT r;"
      - id: grant_alternative
        sql: "SHOW GRANT TO RECIPIENT r;"

  - id: create_group
    name: CREATE GROUP
    doc: https://docs.databricks.com/aws/en/sql/language-manual/security-create-group
    tier: low
    probes:
      - id: basic
        sql: "CREATE GROUP g;"
      - id: with_user_and_group
        sql: "CREATE GROUP g WITH USER `alf@melmak.et`, `thor@asgaard.et` GROUP sg;"

  - id: alter_group
    name: ALTER GROUP
    doc: https://docs.databricks.com/aws/en/sql/language-manual/security-alter-group
    tier: low
    probes:
      - id: add_group
        sql: "ALTER GROUP g ADD GROUP sg;"
      - id: drop_user
        sql: "ALTER GROUP g DROP USER `alf@melmak.et`;"

  - id: drop_group
    name: DROP GROUP
    doc: https://docs.databricks.com/aws/en/sql/language-manual/security-drop-group
    tier: low
    probes:
      - id: basic
        sql: "DROP GROUP g;"

  - id: msck_repair_privileges
    name: MSCK REPAIR PRIVILEGES
    doc: https://docs.databricks.com/aws/en/sql/language-manual/security-msck
    tier: low
    probes:
      - id: schema
        sql: "MSCK REPAIR SCHEMA s PRIVILEGES;"
      - id: anonymous_function
        sql: "MSCK REPAIR ANONYMOUS FUNCTION PRIVILEGES;"
