dialect: redshift
engine: Amazon Redshift
version: "current"
source: https://docs.aws.amazon.com/redshift/latest/dg/c_SQL_commands.html

statements:
  - id: call
    name: CALL
    doc: https://docs.aws.amazon.com/redshift/latest/dg/r_CALL_procedure.html
    tier: high
    probes:
      - id: no_args
        sql: "CALL sp();"
      - id: literal_args
        sql: "CALL sp(3, 'book');"
      - id: function_arg
        sql: "CALL sp(pg_last_query_id());"
      - id: schema_qualified
        sql: "CALL s.sp(1);"
    examples:
      - "call test_sp1(3,'book');"
      - "call test_sp2(2,'2019');"

  - id: commit
    name: COMMIT
    doc: https://docs.aws.amazon.com/redshift/latest/dg/r_COMMIT.html
    tier: high
    probes:
      - id: bare
        sql: "COMMIT;"
      - id: work
        sql: "COMMIT WORK;"
      - id: transaction
        sql: "COMMIT TRANSACTION;"
    examples:
      - "commit;"
      - "commit work;"
      - "commit transaction;"
