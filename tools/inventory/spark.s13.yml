dialect: spark
engine: Apache Spark SQL
version: "4.x (docs/latest)"
source: https://spark.apache.org/docs/latest/sql-ref-syntax.html

statements:
  - id: offset_clause
    name: OFFSET Clause
    doc: https://spark.apache.org/docs/latest/sql-ref-syntax-qry-select-offset.html
    tier: high
    probes:
      - id: offset_literal
        sql: "SELECT c FROM t ORDER BY c OFFSET 2;"
      - id: limit_offset
        sql: "SELECT c FROM t ORDER BY c LIMIT 3 OFFSET 2;"
      - id: offset_function_expression
        sql: "SELECT c FROM t ORDER BY c OFFSET length('SPARK');"
      - id: offset_without_order_by
        sql: "SELECT c FROM t OFFSET 1;"
    examples:
      - "SELECT name, age FROM person ORDER BY name OFFSET 2;"
      - "SELECT name, age FROM person ORDER BY name LIMIT 3 OFFSET 2;"
      - "SELECT name, age FROM person ORDER BY name OFFSET length('SPARK');"

  - id: order_by_clause
    name: ORDER BY Clause
    doc: https://spark.apache.org/docs/latest/sql-ref-syntax-qry-select-orderby.html
    tier: high
    probes:
      - id: order_by_expression
        sql: "SELECT c FROM t ORDER BY c;"
      - id: order_by_asc
        sql: "SELECT c FROM t ORDER BY c ASC;"
      - id: order_by_desc
        sql: "SELECT c FROM t ORDER BY c DESC;"
      - id: order_by_nulls_first
        sql: "SELECT c FROM t ORDER BY c NULLS FIRST;"
      - id: order_by_nulls_last
        sql: "SELECT c FROM t ORDER BY c NULLS LAST;"
      - id: order_by_asc_nulls_last
        sql: "SELECT c FROM t ORDER BY c ASC NULLS LAST;"
      - id: order_by_desc_nulls_first
        sql: "SELECT c FROM t ORDER BY c DESC NULLS FIRST;"
      - id: order_by_multiple
        sql: "SELECT c, d FROM t ORDER BY c ASC, d DESC;"
      - id: order_by_computed_expression
        sql: "SELECT c, d FROM t ORDER BY c + d DESC;"
      - id: order_by_ordinal
        sql: "SELECT c, d FROM t ORDER BY 2 DESC;"
    examples:
      - "SELECT name, age FROM person ORDER BY age;"
      - "SELECT name, age FROM person ORDER BY age NULLS LAST;"
      - "SELECT name, age FROM person ORDER BY age DESC;"
