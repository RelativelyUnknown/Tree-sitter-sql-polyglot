dialect: db2
engine: IBM Db2 for Linux, UNIX and Windows
version: "11.5"
source: https://www.ibm.com/docs/en/db2/11.5.x?topic=reference-statements

statements:
  - id: open
    name: OPEN
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-open
    tier: high
    probes:
      - id: basic
        sql: "OPEN c1;"
      - id: using_variable
        sql: "OPEN c1 USING v1;"
      - id: using_variables
        sql: "OPEN c1 USING v1, v2;"
      - id: using_expression
        sql: "OPEN c1 USING v1 + 1, 'abc';"
        note: An expression other than a variable can only be used in compiled compound statements.
      - id: using_descriptor
        sql: "OPEN c1 USING DESCRIPTOR sqlda1;"
      - id: cursor_variable
        sql: "OPEN cv1;"
      - id: cursor_variable_args
        sql: "OPEN cv1(1, 'a');"
        note: "Syntax block: cursor-variable-name ( expression , ... )"

  - id: release_savepoint
    name: RELEASE SAVEPOINT
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-release-savepoint
    tier: high
    probes:
      - id: basic
        sql: "RELEASE SAVEPOINT sp1;"
      - id: release_to_savepoint
        sql: "RELEASE TO SAVEPOINT sp1;"
    examples:
      - "RELEASE SAVEPOINT SAVEPOINT1;"
