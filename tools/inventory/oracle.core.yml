  - id: plsql_block
    name: PL/SQL block (anonymous block)
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/lnpls/block.html
    tier: high
    probes:
      - id: begin_end
        sql: "BEGIN NULL; END;"
      - id: declare_begin_end
        sql: "DECLARE v NUMBER := 1; BEGIN v := v + 1; END;"
      - id: exception_section
        sql: "DECLARE v NUMBER; BEGIN SELECT c INTO v FROM t WHERE id = 1; EXCEPTION WHEN NO_DATA_FOUND THEN v := 0; WHEN OTHERS THEN RAISE; END;"
      - id: labeled_block
        sql: "<<outer>> DECLARE v NUMBER := 1; BEGIN NULL; END outer;"
      - id: nested_block
        sql: "BEGIN DECLARE v NUMBER; BEGIN v := 1; END; END;"
      - id: end_with_name
        sql: "DECLARE v NUMBER; BEGIN v := 1; END blk;"
      - id: dml_in_block
        sql: "BEGIN INSERT INTO t (c) VALUES (1); UPDATE t SET c = 2 WHERE c = 1; DELETE FROM t WHERE c = 2; COMMIT; END;"
      - id: transaction_statements_in_block
        sql: "BEGIN SAVEPOINT sp1; UPDATE t SET c = 1; ROLLBACK TO SAVEPOINT sp1; SET TRANSACTION READ ONLY; COMMIT; END;"
      - id: merge_lock_in_block
        sql: "BEGIN LOCK TABLE t IN EXCLUSIVE MODE NOWAIT; MERGE INTO t USING u ON (t.id = u.id) WHEN MATCHED THEN UPDATE SET t.c = u.c; END;"
      - id: declare_types_cursor_items
        sql: "DECLARE TYPE num_tab IS TABLE OF NUMBER; CURSOR c IS SELECT id FROM t; v NUMBER; e EXCEPTION; BEGIN NULL; END;"
      - id: declare_nested_subprograms
        sql: "DECLARE FUNCTION f (a NUMBER) RETURN NUMBER IS BEGIN RETURN a * 2; END; PROCEDURE p IS BEGIN NULL; END; BEGIN p; END;"
      - id: subtype_definition
        sql: "DECLARE SUBTYPE balance IS NUMBER(8,2) NOT NULL; SUBTYPE small IS PLS_INTEGER RANGE 0 .. 9; b balance := 0; BEGIN NULL; END;"
      - id: statement_label
        sql: "BEGIN <<lbl>> NULL; END;"
      - id: slash_terminated
        sql: |-
          BEGIN
            NULL;
          END;
          /
        note: "In SQL*Plus and SQLcl scripts a PL/SQL block ends with a line containing only /."
      - id: block_then_sql_statement
        sql: |-
          BEGIN
            NULL;
          END;
          /
          SELECT 1 FROM DUAL;
        note: "A script mixing a PL/SQL block (ended by /) and a SQL statement (ended by ;)."
      - id: comments_in_block
        sql: |-
          DECLARE
            v NUMBER; -- counter
          BEGIN
            /* multi-line
               comment */
            v := 1;
          END;
    examples:
      - |-
        DECLARE
          acct_id INTEGER(4) NOT NULL := 9999;
          a NATURALN                  := 9999;
          b POSITIVEN                 := 9999;
          c SIMPLE_INTEGER            := 9999;
        BEGIN
          NULL;
        END;
        /
      - |-
        DECLARE
          PROCEDURE p (
            sales  NUMBER,
            quota  NUMBER,
            emp_id NUMBER
          )
          IS
            bonus    NUMBER := 0;
            updated  VARCHAR2(3) := 'No';
          BEGIN
            IF sales > (quota + 200) THEN
              bonus := (sales - quota)/4;
         
              UPDATE employees
              SET salary = salary + bonus 
              WHERE employee_id = emp_id;
         
              updated := 'Yes';
            END IF;
         
            DBMS_OUTPUT.PUT_LINE (
              'Table updated?  ' || updated || ', ' || 
              'bonus = ' || bonus || '.'
            );
          END p;
        BEGIN
          p(10100, 10000, 120);
          p(10500, 10000, 121);
        END;
        /

  - id: sqlplus_slash
    name: / (slash) terminator in SQL*Plus scripts
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqpug/slash.html
    tier: high
    probes:
      - id: after_block
        sql: |-
          BEGIN
            NULL;
          END;
          /
      - id: after_create_procedure
        sql: |-
          CREATE OR REPLACE PROCEDURE p IS
          BEGIN
            NULL;
          END p;
          /
      - id: two_units
        sql: |-
          CREATE OR REPLACE FUNCTION f RETURN NUMBER IS
          BEGIN
            RETURN 1;
          END;
          /
          BEGIN
            DBMS_OUTPUT.PUT_LINE(f);
          END;
          /
      - id: sql_statement_ended_by_slash
        sql: |-
          SELECT c
          FROM t
          /
        note: "A SQL statement entered without ; is sent from the buffer by the / line."
      - id: slash_between_sql_statements
        sql: |-
          DECLARE
            v NUMBER;
          BEGIN
            v := 1;
          END;
          /
          INSERT INTO t VALUES (1);
