expressions:
  - id: identifiers
    name: Identifiers and key words
    doc: https://www.postgresql.org/docs/17/sql-syntax-lexical.html
    tier: high
    probes:
      - { id: unquoted_mixed_case, sql: "SELECT MyColumn, my_col$1 FROM MyTable;" }
      - { id: quoted_identifier, sql: "SELECT \"Col Name\", \"select\" FROM \"My Table\";" }
      - { id: quoted_identifier_escaped_quote, sql: "SELECT 1 AS \"a\"\"b\";" }
      - { id: unicode_quoted_identifier, sql: "SELECT U&\"d\\0061t\\+000061\" FROM t;" }
      - { id: unicode_identifier_uescape, sql: "SELECT U&\"d!0061t!+000061\" UESCAPE '!' FROM t;" }
      - { id: qualified_names, sql: "SELECT s.t.c FROM db.s.t;" }
      - { id: non_reserved_keyword_as_identifier, sql: "SELECT name, comment, language, data FROM t;" }

  - id: string_constants
    name: String constants
    doc: https://www.postgresql.org/docs/17/sql-syntax-lexical.html
    tier: high
    probes:
      - { id: doubled_quote, sql: "SELECT 'Dianne''s horse';" }
      - id: continuation_across_lines
        sql: |-
          SELECT 'foo'
          'bar';
        note: Two string constants separated only by whitespace with at least one newline are concatenated (4.1.2.1).
      - { id: escape_string, sql: "SELECT E'line1\\nline2\\t\\x41\\101\\u0041\\U00000041\\'';" }
      - { id: escape_string_lowercase_prefix, sql: "SELECT e'it\\'s';" }
      - { id: unicode_escape_string, sql: "SELECT U&'d\\0061t\\+000061';" }
      - { id: unicode_escape_string_uescape, sql: "SELECT U&'d!0061t!+000061' UESCAPE '!';" }
      - { id: dollar_quoted, sql: "SELECT $$Dianne's horse$$;" }
      - { id: dollar_quoted_tag, sql: "SELECT $SomeTag$Dianne's horse$SomeTag$;" }
      - { id: dollar_quoted_nested, sql: "SELECT $function$ BEGIN RETURN ($1 ~ $q$[\\t\\r\\n\\v\\\\]$q$); END; $function$;" }

  - id: bit_string_constants
    name: Bit-string constants
    doc: https://www.postgresql.org/docs/17/sql-syntax-lexical.html
    tier: medium
    probes:
      - { id: binary, sql: "SELECT B'1001', b'0';" }
