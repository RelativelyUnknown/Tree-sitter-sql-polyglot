dialect: cockroachdb
engine: CockroachDB
version: "v26.3 (stable)"
source: https://www.cockroachlabs.com/docs/stable/sql-statements

statements:
  - id: alter_external_connection
    name: ALTER EXTERNAL CONNECTION
    doc: https://www.cockroachlabs.com/docs/stable/alter-external-connection
    tier: low
    probes:
      - { id: basic, sql: "ALTER EXTERNAL CONNECTION c AS 's3://bucket?AWS_ACCESS_KEY_ID=k&AWS_SECRET_ACCESS_KEY=s';" }
      - { id: if_exists, sql: "ALTER EXTERNAL CONNECTION IF EXISTS c AS 'nodelocal://1/path';" }

  - id: alter_partition
    name: ALTER PARTITION
    doc: https://www.cockroachlabs.com/docs/stable/alter-partition
    tier: low
    probes:
      - { id: configure_zone_table, sql: "ALTER PARTITION p OF TABLE t CONFIGURE ZONE USING num_replicas = 5;" }
      - { id: configure_zone_index, sql: "ALTER PARTITION p OF INDEX t@idx CONFIGURE ZONE USING constraints = '[+region=us-east]';" }
      - { id: configure_zone_all_indexes, sql: "ALTER PARTITION p OF INDEX t@* CONFIGURE ZONE USING gc.ttlseconds = 600;" }
      - { id: copy_from_parent, sql: "ALTER PARTITION p OF TABLE t CONFIGURE ZONE USING range_min_bytes = COPY FROM PARENT;" }
      - { id: discard, sql: "ALTER PARTITION p OF TABLE t CONFIGURE ZONE DISCARD;" }

  - id: alter_range
    name: ALTER RANGE
    doc: https://www.cockroachlabs.com/docs/stable/alter-range
    tier: low
    probes:
      - { id: configure_zone, sql: "ALTER RANGE default CONFIGURE ZONE USING num_replicas = 5;" }
      - { id: configure_zone_discard, sql: "ALTER RANGE meta CONFIGURE ZONE DISCARD;" }
      - { id: relocate_lease, sql: "ALTER RANGE 70 RELOCATE LEASE TO 4;" }
      - { id: relocate_lease_for_select, sql: "ALTER RANGE RELOCATE LEASE TO 2 FOR SELECT range_id FROM [SHOW RANGES FROM TABLE t WITH DETAILS];" }
      - { id: relocate_from_to, sql: "ALTER RANGE 45 RELOCATE FROM 2 TO 4;" }
      - { id: relocate_voters, sql: "ALTER RANGE RELOCATE VOTERS FROM 7 TO 2 FOR SELECT range_id FROM [SHOW RANGES FROM TABLE t WITH DETAILS];" }
      - { id: relocate_nonvoters, sql: "ALTER RANGE RELOCATE NONVOTERS FROM 7 TO 2 FOR SELECT range_id FROM [SHOW RANGES FROM TABLE t WITH DETAILS];" }

