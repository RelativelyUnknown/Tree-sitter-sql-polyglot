dialect: cockroachdb
engine: CockroachDB
version: "v26.3 (stable)"
source: https://www.cockroachlabs.com/docs/stable/sql-statements

statements:
  - id: alter_procedure
    name: ALTER PROCEDURE
    doc: https://www.cockroachlabs.com/docs/stable/alter-procedure
    tier: high
    probes:
      - { id: rename_to, sql: "ALTER PROCEDURE p RENAME TO q;" }
      - { id: owner_to, sql: "ALTER PROCEDURE p OWNER TO u;" }
      - { id: owner_to_current_user, sql: "ALTER PROCEDURE p OWNER TO CURRENT_USER;" }
      - { id: set_schema, sql: "ALTER PROCEDURE p SET SCHEMA s;" }
      - { id: qualified_name, sql: "ALTER PROCEDURE public.p RENAME TO q;" }
      - { id: with_param_types_rename, sql: "ALTER PROCEDURE p (INT, STRING) RENAME TO q;" }
      - { id: with_named_params_rename, sql: "ALTER PROCEDURE p (a INT, b STRING) RENAME TO q;" }
      - { id: with_argmode_rename, sql: "ALTER PROCEDURE p (IN a INT, OUT b STRING) RENAME TO q;" }
      - { id: empty_params_rename, sql: "ALTER PROCEDURE p () RENAME TO q;" }
      - { id: with_params_owner_to, sql: "ALTER PROCEDURE p (a INT) OWNER TO u;" }
      - { id: with_params_set_schema, sql: "ALTER PROCEDURE p (a INT) SET SCHEMA s;" }
    examples:
      - "ALTER PROCEDURE delete_earliest_histories RENAME TO delete_histories;"

  - id: alter_table
    name: ALTER TABLE
    doc: https://www.cockroachlabs.com/docs/stable/alter-table
    tier: high
    probes:
      - { id: add_column, sql: "ALTER TABLE t ADD COLUMN c INT;" }
      - { id: add_column_if_not_exists, sql: "ALTER TABLE t ADD COLUMN IF NOT EXISTS c INT;" }
      - { id: add_column_no_column_keyword, sql: "ALTER TABLE t ADD c INT;" }
      - { id: add_column_not_null_default, sql: "ALTER TABLE t ADD COLUMN c DECIMAL NOT NULL DEFAULT (DECIMAL '1.3');" }
      - { id: add_column_unique, sql: "ALTER TABLE t ADD COLUMN c STRING UNIQUE;" }
      - { id: add_column_references, sql: "ALTER TABLE t ADD COLUMN c INT REFERENCES u(id);" }
      - { id: add_column_check, sql: "ALTER TABLE t ADD COLUMN c INT CHECK (c > 0);" }
      - { id: add_column_collate, sql: "ALTER TABLE t ADD COLUMN c STRING COLLATE en;" }
      - { id: add_column_family, sql: "ALTER TABLE t ADD COLUMN c STRING FAMILY f1;" }
      - { id: add_column_create_family, sql: "ALTER TABLE t ADD COLUMN c STRING CREATE FAMILY f1;" }
      - { id: add_column_create_family_unnamed, sql: "ALTER TABLE t ADD COLUMN c STRING CREATE FAMILY;" }
      - { id: add_column_create_if_not_exists_family, sql: "ALTER TABLE t ADD COLUMN c STRING CREATE IF NOT EXISTS FAMILY f2;" }
      - { id: add_column_on_update, sql: "ALTER TABLE t ADD COLUMN c TIMESTAMPTZ DEFAULT now() ON UPDATE now();" }
      - { id: add_column_not_visible_stored, sql: "ALTER TABLE t ADD COLUMN c STRING FAMILY f1 NOT VISIBLE AS (d) STORED;" }
      - { id: add_column_computed_stored, sql: "ALTER TABLE t ADD COLUMN c INT AS (a // 2) STORED;" }
      - { id: add_column_computed_virtual, sql: "ALTER TABLE t ADD COLUMN c INT AS (a // 2) VIRTUAL;" }
      - { id: add_column_generated_always_identity, sql: "ALTER TABLE t ADD COLUMN c INT GENERATED ALWAYS AS IDENTITY;" }
      - { id: add_column_generated_by_default_identity, sql: "ALTER TABLE t ADD COLUMN c INT GENERATED BY DEFAULT AS IDENTITY;" }
      - { id: add_column_primary_key, sql: "ALTER TABLE t ADD COLUMN c INT PRIMARY KEY;" }
      - { id: add_constraint_unique, sql: "ALTER TABLE t ADD CONSTRAINT k UNIQUE (a, b);" }
      - { id: add_constraint_check, sql: "ALTER TABLE t ADD CONSTRAINT k CHECK (a >= 0);" }
      - { id: add_constraint_foreign_key, sql: "ALTER TABLE t ADD CONSTRAINT k FOREIGN KEY (a, b) REFERENCES u (a, b) ON DELETE CASCADE;" }
      - { id: add_constraint_primary_key, sql: "ALTER TABLE t ADD CONSTRAINT k PRIMARY KEY (a, b);" }
      - { id: add_constraint_if_not_exists, sql: "ALTER TABLE t ADD CONSTRAINT IF NOT EXISTS k UNIQUE (a);" }
      - { id: add_constraint_not_valid, sql: "ALTER TABLE t ADD CONSTRAINT k CHECK (a > 0) NOT VALID;" }
      - { id: add_constraint_fk_not_valid, sql: "ALTER TABLE t ADD CONSTRAINT k FOREIGN KEY (a) REFERENCES u (id) NOT VALID;" }
      - { id: add_unnamed_constraint, sql: "ALTER TABLE t ADD UNIQUE (a);" }
      - { id: add_constraint_unique_hash, sql: "ALTER TABLE t ADD CONSTRAINT k UNIQUE (a) USING HASH;" }
      - { id: alter_column_set_default, sql: "ALTER TABLE t ALTER COLUMN c SET DEFAULT true;" }
      - { id: alter_column_set_on_update, sql: "ALTER TABLE t ALTER COLUMN c SET ON UPDATE now();" }
      - { id: alter_column_set_visible, sql: "ALTER TABLE t ALTER COLUMN c SET VISIBLE;" }
      - { id: alter_column_set_not_visible, sql: "ALTER TABLE t ALTER COLUMN c SET NOT VISIBLE;" }
      - { id: alter_column_set_not_null, sql: "ALTER TABLE t ALTER COLUMN c SET NOT NULL;" }
      - { id: alter_column_drop_default, sql: "ALTER TABLE t ALTER COLUMN c DROP DEFAULT;" }
      - { id: alter_column_drop_on_update, sql: "ALTER TABLE t ALTER COLUMN c DROP ON UPDATE;" }
      - { id: alter_column_drop_not_null, sql: "ALTER TABLE t ALTER COLUMN c DROP NOT NULL;" }
      - { id: alter_column_drop_stored, sql: "ALTER TABLE t ALTER COLUMN c DROP STORED;" }
      - { id: alter_column_drop_identity, sql: "ALTER TABLE t ALTER COLUMN c DROP IDENTITY;" }
      - { id: alter_column_drop_identity_if_exists, sql: "ALTER TABLE t ALTER COLUMN c DROP IDENTITY IF EXISTS;" }
      - { id: alter_column_add_generated_always, sql: "ALTER TABLE t ALTER COLUMN c ADD GENERATED ALWAYS AS IDENTITY;" }
      - { id: alter_column_add_generated_by_default, sql: "ALTER TABLE t ALTER COLUMN c ADD GENERATED BY DEFAULT AS IDENTITY;" }
      - { id: alter_column_add_generated_with_options, sql: "ALTER TABLE t ALTER COLUMN c ADD GENERATED ALWAYS AS IDENTITY (START 10 INCREMENT 2);" }
      - { id: alter_column_set_generated_always, sql: "ALTER TABLE t ALTER COLUMN c SET GENERATED ALWAYS;" }
      - { id: alter_column_set_generated_by_default, sql: "ALTER TABLE t ALTER COLUMN c SET GENERATED BY DEFAULT;" }
      - { id: alter_column_set_data_type, sql: "ALTER TABLE t ALTER COLUMN c SET DATA TYPE DECIMAL(14,2);" }
      - { id: alter_column_type, sql: "ALTER TABLE t ALTER COLUMN c TYPE DECIMAL(14,2);" }
      - { id: alter_without_column_keyword_type, sql: "ALTER TABLE t ALTER c TYPE DECIMAL(14,2);" }
      - { id: alter_column_type_collate, sql: "ALTER TABLE t ALTER COLUMN c TYPE STRING COLLATE en;" }
      - { id: alter_column_type_using, sql: "ALTER TABLE t ALTER c TYPE STRING USING ((c * 100)::DECIMAL(4,2)::STRING || ' percent');" }
      - { id: alter_primary_key, sql: "ALTER TABLE t ALTER PRIMARY KEY USING COLUMNS (id);" }
      - { id: alter_primary_key_using_hash, sql: "ALTER TABLE t ALTER PRIMARY KEY USING COLUMNS (a, b) USING HASH;" }
      - { id: alter_primary_key_using_hash_with, sql: "ALTER TABLE t ALTER PRIMARY KEY USING COLUMNS (a, b) USING HASH WITH (bucket_count = 10);" }
      - { id: alter_primary_key_desc, sql: "ALTER TABLE t ALTER PRIMARY KEY USING COLUMNS (a DESC, b ASC);" }
      - { id: configure_zone_using, sql: "ALTER TABLE t CONFIGURE ZONE USING num_replicas = 5, gc.ttlseconds = 100000;" }
      - { id: configure_zone_range_sizes, sql: "ALTER TABLE t CONFIGURE ZONE USING range_min_bytes = 0, range_max_bytes = 90000, gc.ttlseconds = 89999, num_replicas = 4;" }
      - { id: configure_zone_using_default, sql: "ALTER TABLE t CONFIGURE ZONE USING DEFAULT;" }
      - { id: configure_zone_copy_from_parent, sql: "ALTER TABLE t CONFIGURE ZONE USING num_replicas = COPY FROM PARENT;" }
      - { id: configure_zone_discard, sql: "ALTER TABLE t CONFIGURE ZONE DISCARD;" }
      - { id: drop_column, sql: "ALTER TABLE t DROP COLUMN c;" }
      - { id: drop_column_if_exists, sql: "ALTER TABLE t DROP COLUMN IF EXISTS c;" }
      - { id: drop_column_no_column_keyword, sql: "ALTER TABLE t DROP c;" }
      - { id: drop_column_restrict, sql: "ALTER TABLE t DROP COLUMN c RESTRICT;" }
      - { id: drop_column_cascade, sql: "ALTER TABLE t DROP COLUMN c CASCADE;" }
      - { id: drop_constraint, sql: "ALTER TABLE t DROP CONSTRAINT k;" }
      - { id: drop_constraint_if_exists, sql: "ALTER TABLE t DROP CONSTRAINT IF EXISTS k;" }
      - { id: drop_constraint_cascade, sql: "ALTER TABLE t DROP CONSTRAINT k CASCADE;" }
      - { id: drop_constraint_restrict, sql: "ALTER TABLE t DROP CONSTRAINT k RESTRICT;" }
      - { id: validate_constraint, sql: "ALTER TABLE t VALIDATE CONSTRAINT k;" }
      - { id: experimental_audit_read_write, sql: "ALTER TABLE t EXPERIMENTAL_AUDIT SET READ WRITE;" }
      - { id: experimental_audit_off, sql: "ALTER TABLE t EXPERIMENTAL_AUDIT SET OFF;" }
      - { id: owner_to, sql: "ALTER TABLE t OWNER TO u;" }
      - { id: owner_to_current_user, sql: "ALTER TABLE t OWNER TO CURRENT_USER;" }
      - { id: partition_by_list, sql: "ALTER TABLE t PARTITION BY LIST (country) (PARTITION north_america VALUES IN ('CA','US'), PARTITION australia VALUES IN ('AU','NZ'), PARTITION DEFAULT VALUES IN (default));" }
      - { id: partition_by_range, sql: "ALTER TABLE t PARTITION BY RANGE (d) (PARTITION graduated VALUES FROM (MINVALUE) TO ('2017-08-15'), PARTITION current VALUES FROM ('2017-08-15') TO (MAXVALUE));" }
      - { id: partition_all_by_list, sql: "ALTER TABLE t PARTITION ALL BY LIST (country) (PARTITION p1 VALUES IN ('CA','US'));" }
      - { id: partition_all_by_range, sql: "ALTER TABLE t PARTITION ALL BY RANGE (d) (PARTITION p1 VALUES FROM (MINVALUE) TO (MAXVALUE));" }
      - { id: partition_by_nothing, sql: "ALTER TABLE t PARTITION BY NOTHING;" }
      - { id: rename_column, sql: "ALTER TABLE t RENAME COLUMN a TO b;" }
      - { id: rename_column_no_column_keyword, sql: "ALTER TABLE t RENAME a TO b;" }
      - { id: rename_constraint, sql: "ALTER TABLE t RENAME CONSTRAINT k TO k2;" }
      - { id: rename_to, sql: "ALTER TABLE t RENAME TO u;" }
      - { id: if_exists_rename_to, sql: "ALTER TABLE IF EXISTS t RENAME TO u;" }
      - { id: set_storage_parameter, sql: "ALTER TABLE t SET (exclude_data_from_backup = true);" }
      - { id: set_storage_parameter_multiple, sql: "ALTER TABLE t SET (ttl_expire_after = '3 months', ttl_job_cron = '@daily');" }
      - { id: reset_storage_parameter, sql: "ALTER TABLE t RESET (ttl);" }
      - { id: reset_storage_parameter_multiple, sql: "ALTER TABLE t RESET (ttl_expire_after, ttl_job_cron);" }
      - { id: enable_row_level_security, sql: "ALTER TABLE t ENABLE ROW LEVEL SECURITY;" }
      - { id: disable_row_level_security, sql: "ALTER TABLE t DISABLE ROW LEVEL SECURITY;" }
      - { id: force_row_level_security, sql: "ALTER TABLE t FORCE ROW LEVEL SECURITY;" }
      - { id: no_force_row_level_security, sql: "ALTER TABLE t NO FORCE ROW LEVEL SECURITY;" }
      - { id: enable_trigger, sql: "ALTER TABLE t ENABLE TRIGGER trg;" }
      - { id: enable_trigger_all, sql: "ALTER TABLE t ENABLE TRIGGER ALL;" }
      - { id: enable_trigger_user, sql: "ALTER TABLE t ENABLE TRIGGER USER;" }
      - { id: disable_trigger, sql: "ALTER TABLE t DISABLE TRIGGER trg;" }
      - { id: disable_trigger_all, sql: "ALTER TABLE t DISABLE TRIGGER ALL;" }
      - { id: disable_trigger_user, sql: "ALTER TABLE t DISABLE TRIGGER USER;" }
      - { id: set_locality_regional_by_table_primary, sql: "ALTER TABLE t SET LOCALITY REGIONAL BY TABLE IN PRIMARY REGION;" }
      - { id: set_locality_regional_by_table_region, sql: "ALTER TABLE t SET LOCALITY REGIONAL BY TABLE IN \"us-east-1\";" }
      - { id: set_locality_regional_by_table, sql: "ALTER TABLE t SET LOCALITY REGIONAL BY TABLE;" }
      - { id: set_locality_regional, sql: "ALTER TABLE t SET LOCALITY REGIONAL;" }
      - { id: set_locality_regional_in, sql: "ALTER TABLE t SET LOCALITY REGIONAL IN \"us-east-1\";" }
      - { id: set_locality_regional_by_row, sql: "ALTER TABLE t SET LOCALITY REGIONAL BY ROW;" }
      - { id: set_locality_regional_by_row_as, sql: "ALTER TABLE t SET LOCALITY REGIONAL BY ROW AS r;" }
      - { id: set_locality_global, sql: "ALTER TABLE t SET LOCALITY GLOBAL;" }
      - { id: set_schema, sql: "ALTER TABLE t SET SCHEMA s;" }
      - { id: if_exists_set_schema, sql: "ALTER TABLE IF EXISTS t SET SCHEMA s;" }
      - { id: scatter, sql: "ALTER TABLE t SCATTER;" }
      - { id: scatter_from_to, sql: "ALTER TABLE t SCATTER FROM (1) TO (10);", note: "alter_scatter_stmt in the synopsis; expr_list parameter is documented as the primary key values" }
      - { id: set_logged, sql: "ALTER TABLE t SET LOGGED;", note: "alter_table_logged_stmt in the synopsis" }
      - { id: set_unlogged, sql: "ALTER TABLE t SET UNLOGGED;", note: "alter_table_logged_stmt in the synopsis" }
      - { id: split_at_values, sql: "ALTER TABLE t SPLIT AT VALUES ('chicago'), ('new york'), ('seattle');" }
      - { id: split_at_select, sql: "ALTER TABLE t SPLIT AT SELECT 1;" }
      - { id: split_at_with_expiration, sql: "ALTER TABLE t SPLIT AT VALUES ('chicago'), ('new york') WITH EXPIRATION '2022-01-10 23:30:00+00:00';" }
      - { id: unsplit_at_values, sql: "ALTER TABLE t UNSPLIT AT VALUES ('new york', '3'), ('chicago', '7');" }
      - { id: unsplit_at_select, sql: "ALTER TABLE t UNSPLIT AT SELECT 1;" }
      - { id: unsplit_all, sql: "ALTER TABLE t UNSPLIT ALL;" }
      - { id: multiple_commands, sql: "ALTER TABLE t ADD COLUMN a STRING, ADD COLUMN b STRING;" }
      - { id: rename_and_add_column_atomically, sql: "ALTER TABLE t RENAME COLUMN name TO last_name, ADD COLUMN first_name STRING, ADD COLUMN name STRING AS (CONCAT(first_name, ' ', last_name)) STORED;" }
      - { id: drop_and_add_constraint, sql: "ALTER TABLE t DROP CONSTRAINT k, ADD CONSTRAINT k PRIMARY KEY (code, creation_time);" }
      - { id: qualified_table_name, sql: "ALTER TABLE db.public.t ADD COLUMN c INT;" }
      - { id: if_exists_add_column, sql: "ALTER TABLE IF EXISTS t ADD COLUMN c INT;" }
    examples:
      - "ALTER TABLE bank ADD COLUMN active BOOL;"
      - "ALTER TABLE users RENAME TO riders;"
      - "ALTER TABLE users CONFIGURE ZONE USING num_replicas = 5, gc.ttlseconds = 100000;"
