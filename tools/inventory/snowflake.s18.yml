dialect: snowflake
engine: Snowflake
version: "current (docs read 2026-10-04)"
source: https://docs.snowflake.com/en/sql-reference/sql-all

statements:
  - id: show_tasks
    name: SHOW TASKS
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-tasks
    tier: medium
    probes:
      - id: basic
        sql: "SHOW TASKS;"
      - id: terse
        sql: "SHOW TERSE TASKS;"
      - id: like
        sql: "SHOW TASKS LIKE '%t%';"
      - id: in_account
        sql: "SHOW TASKS IN ACCOUNT;"
      - id: in_database
        sql: "SHOW TASKS IN DATABASE d;"
      - id: in_schema
        sql: "SHOW TASKS IN SCHEMA d.s;"
      - id: in_application
        sql: "SHOW TASKS IN APPLICATION a;"
      - id: in_application_package
        sql: "SHOW TASKS IN APPLICATION PACKAGE a;"
      - id: starts_with_root_only
        sql: "SHOW TASKS STARTS WITH 't' ROOT ONLY;"
      - id: limit_from
        sql: "SHOW TASKS LIMIT 10 FROM 't';"
    examples:
      - "SHOW TASKS IN tpch.public;"
      - "SHOW TASKS LIKE 'line%' IN tpch.public;"

  - id: show_transactions
    name: SHOW TRANSACTIONS
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-transactions
    tier: medium
    probes:
      - id: basic
        sql: "SHOW TRANSACTIONS;"
      - id: in_account
        sql: "SHOW TRANSACTIONS IN ACCOUNT;"
    examples:
      - "SHOW TRANSACTIONS;"

  - id: show_types
    name: SHOW TYPES
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-types
    tier: medium
    probes:
      - id: basic
        sql: "SHOW TYPES;"
      - id: like
        sql: "SHOW TYPES LIKE 'age';"
      - id: in_account
        sql: "SHOW TYPES IN ACCOUNT;"
      - id: in_database
        sql: "SHOW TYPES IN DATABASE d;"
      - id: in_schema
        sql: "SHOW TYPES IN SCHEMA d.s;"
      - id: in_application
        sql: "SHOW TYPES IN s APPLICATION a;"
      - id: in_application_package
        sql: "SHOW TYPES IN APPLICATION PACKAGE a;"
      - id: starts_with
        sql: "SHOW TYPES STARTS WITH 't';"
    examples:
      - "SHOW TYPES LIKE 'age';"

  - id: show_user_functions
    name: SHOW USER FUNCTIONS
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-user-functions
    tier: medium
    probes:
      - id: basic
        sql: "SHOW USER FUNCTIONS;"
      - id: like
        sql: "SHOW USER FUNCTIONS LIKE 'f%';"
      - id: in_account
        sql: "SHOW USER FUNCTIONS IN ACCOUNT;"
      - id: in_database
        sql: "SHOW USER FUNCTIONS IN DATABASE d;"
      - id: in_schema
        sql: "SHOW USER FUNCTIONS IN SCHEMA d.s;"
      - id: in_application
        sql: "SHOW USER FUNCTIONS IN s APPLICATION a;"
      - id: in_application_package
        sql: "SHOW USER FUNCTIONS IN APPLICATION PACKAGE a;"
    examples:
      - "SHOW USER FUNCTIONS LIKE 'ALLOWED_REGIONS%' IN SCHEMA;"

  - id: show_user_key_pairs
    name: SHOW USER KEY PAIRS
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-user-key-pairs
    tier: medium
    probes:
      - id: basic
        sql: "SHOW USER KEY PAIRS;"
      - id: for_user
        sql: "SHOW USER KEY PAIRS FOR USER u;"
    examples:
      - "SHOW USER KEY PAIRS FOR USER example_user;"

  - id: show_user_procedures
    name: SHOW USER PROCEDURES
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-user-procedures
    tier: medium
    probes:
      - id: basic
        sql: "SHOW USER PROCEDURES;"
      - id: like
        sql: "SHOW USER PROCEDURES LIKE 'p%';"
      - id: in_account
        sql: "SHOW USER PROCEDURES IN ACCOUNT;"
      - id: in_database
        sql: "SHOW USER PROCEDURES IN DATABASE d;"
      - id: in_schema
        sql: "SHOW USER PROCEDURES IN SCHEMA d.s;"
      - id: in_application
        sql: "SHOW USER PROCEDURES IN s APPLICATION a;"
      - id: in_application_package
        sql: "SHOW USER PROCEDURES IN APPLICATION PACKAGE a;"
    examples:
      - "SHOW USER PROCEDURES LIKE 'GET_%' IN SCHEMA;"

  - id: show_users
    name: SHOW USERS
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-users
    tier: medium
    probes:
      - id: basic
