        sql: "CREATE TABLE t, WITH JOURNAL TABLE = db1.jt (c INTEGER);"
      - id: log
        sql: "CREATE TABLE t, NO LOG (c INTEGER);"
      - id: before_journal
        sql: "CREATE TABLE t, NO BEFORE JOURNAL (c INTEGER);"
      - id: dual_journal
        sql: "CREATE TABLE t, DUAL JOURNAL (c INTEGER);"
      - id: after_journal
        sql: "CREATE TABLE t, NO AFTER JOURNAL (c INTEGER);"
      - id: after_journal_local
        sql: "CREATE TABLE t, LOCAL AFTER JOURNAL (c INTEGER);"
      - id: after_journal_not_local
        sql: "CREATE TABLE t, NOT LOCAL AFTER JOURNAL (c INTEGER);"
      - id: checksum
        sql: "CREATE TABLE t, CHECKSUM = DEFAULT (c INTEGER);"
      - id: freespace
        sql: "CREATE TABLE t, FREESPACE = 10 PERCENT (c INTEGER);"
      - id: mergeblockratio
        sql: "CREATE TABLE t, MERGEBLOCKRATIO = 50 PERCENT (c INTEGER);"
      - id: default_mergeblockratio
        sql: "CREATE TABLE t, DEFAULT MERGEBLOCKRATIO (c INTEGER);"
      - id: no_mergeblockratio
        sql: "CREATE TABLE t, NO MERGEBLOCKRATIO (c INTEGER);"
      - id: datablocksize
        sql: "CREATE TABLE t, DATABLOCKSIZE = 64 KBYTES (c INTEGER);"
