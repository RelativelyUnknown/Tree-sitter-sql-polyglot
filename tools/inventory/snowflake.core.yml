  - id: create_semantic_view
    name: "CREATE SEMANTIC VIEW"
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-semantic-view
    tier: medium
    probes:
      - { id: tables_only, sql: "CREATE SEMANTIC VIEW sv TABLES (orders);" }
      - id: full
        sql: |-
          CREATE OR REPLACE SEMANTIC VIEW sv
            TABLES (o AS orders PRIMARY KEY (id) WITH SYNONYMS ('sales orders') COMMENT = 'orders', c AS customers PRIMARY KEY (cid))
            RELATIONSHIPS (orders_to_customers AS o (cid) REFERENCES c)
            FACTS (o.amount AS amount)
            DIMENSIONS (c.name AS customer_name WITH SYNONYMS = ('client name'))
            METRICS (o.total_revenue AS SUM(o.amount) COMMENT = 'revenue')
            COMMENT = 'sales semantic view';
      - { id: window_function_metric, sql: "CREATE SEMANTIC VIEW sv TABLES (t1 AS t) DIMENSIONS (t1.d1 AS d1, t1.d2 AS d2) METRICS (t1.m1 AS SUM(x), t1.m2 AS SUM(t1.m1) OVER (PARTITION BY EXCLUDING t1.d1 ORDER BY t1.d2));" }
      - { id: create_or_alter, sql: "CREATE OR ALTER SEMANTIC VIEW sv TABLES (orders) COMMENT = 'c';" }

  - id: alter_semantic_view
    name: "ALTER SEMANTIC VIEW"
    doc: https://docs.snowflake.com/en/sql-reference/sql/alter-semantic-view
    tier: medium
    probes:
      - { id: rename, sql: "ALTER SEMANTIC VIEW IF EXISTS sv RENAME TO sv2;" }
      - { id: set_comment, sql: "ALTER SEMANTIC VIEW sv SET COMMENT = 'my comment';" }
      - { id: set_max_staleness, sql: "ALTER SEMANTIC VIEW sv SET MAX_STALENESS = 7200;" }
      - { id: unset, sql: "ALTER SEMANTIC VIEW sv UNSET COMMENT;" }
      - { id: set_tag, sql: "ALTER SEMANTIC VIEW sv SET TAG tg = 'v';" }
      - { id: add_materialization, sql: "ALTER SEMANTIC VIEW sv ADD MATERIALIZATION m WAREHOUSE = wh REFRESH_MODE = AUTO IMMUTABLE WHERE (d < '2024-01-01') AS DIMENSIONS c.name METRICS o.total WHERE (o.region = 'EU');" }
      - { id: suspend_materialization, sql: "ALTER SEMANTIC VIEW sv SUSPEND MATERIALIZATION m;" }
      - { id: refresh_materialization, sql: "ALTER SEMANTIC VIEW sv REFRESH MATERIALIZATION m;" }
      - { id: drop_materialization, sql: "ALTER SEMANTIC VIEW sv DROP MATERIALIZATION m;" }
    examples:
      - "ALTER SEMANTIC VIEW sv RENAME TO sv_new_name;"
      - "ALTER SEMANTIC VIEW my_semantic_view SET COMMENT = 'my comment';"
      - "ALTER SEMANTIC VIEW revenue_analysis SET MAX_STALENESS = 7200;"
      - |-
        ALTER SEMANTIC VIEW revenue_analysis ADD MATERIALIZATION revenue_by_customer
          WAREHOUSE = my_wh
          IMMUTABLE WHERE (order_date < '2024-01-01')
          AS
            DIMENSIONS customers.customer_name
            METRICS orders.total_revenue;
      - "ALTER SEMANTIC VIEW revenue_analysis DROP MATERIALIZATION revenue_by_customer;"

