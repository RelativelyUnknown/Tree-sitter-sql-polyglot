dialect: tsql
engine: SQL Server 2022 / Azure SQL Database
version: "2022"
source: https://learn.microsoft.com/en-us/sql/t-sql/statements/statements

statements:
  - id: drop_fulltext_catalog
    name: DROP FULLTEXT CATALOG
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/drop-fulltext-catalog-transact-sql
    tier: low
    probes:
      - { id: basic, sql: "DROP FULLTEXT CATALOG ft_cat;" }
  - id: drop_fulltext_stoplist
    name: DROP FULLTEXT STOPLIST
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/drop-fulltext-stoplist-transact-sql
    tier: low
    probes:
      - { id: basic, sql: "DROP FULLTEXT STOPLIST sl;" }
  - id: drop_master_key
    name: DROP MASTER KEY
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/drop-master-key-transact-sql
    tier: low
    probes:
      - { id: basic, sql: "DROP MASTER KEY;" }
  - id: drop_message_type
    name: DROP MESSAGE TYPE
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/drop-message-type-transact-sql
    tier: low
    probes:
      - { id: basic, sql: "DROP MESSAGE TYPE mt;" }
  - id: drop_queue
    name: DROP QUEUE
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/drop-queue-transact-sql
    tier: low
    probes:
      - { id: basic, sql: "DROP QUEUE q;" }
      - { id: schema_qualified, sql: "DROP QUEUE s.q;" }
      - { id: fully_qualified, sql: "DROP QUEUE db.s.q;" }
  - id: drop_remote_service_binding
    name: DROP REMOTE SERVICE BINDING
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/drop-remote-service-binding-transact-sql
    tier: low
    probes:
      - { id: basic, sql: "DROP REMOTE SERVICE BINDING rsb;" }
  - id: drop_resource_pool
    name: DROP RESOURCE POOL
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/drop-resource-pool-transact-sql
    tier: low
    probes:
      - { id: basic, sql: "DROP RESOURCE POOL pool1;" }
  - id: drop_route
    name: DROP ROUTE
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/drop-route-transact-sql
    tier: low
    probes:
      - { id: basic, sql: "DROP ROUTE r;" }
  - id: drop_rule
    name: DROP RULE
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/drop-rule-transact-sql
    tier: low
    probes:
      - { id: basic, sql: "DROP RULE r;" }
      - { id: if_exists_list, sql: "DROP RULE IF EXISTS s.r1, r2;" }
  - id: drop_search_property_list
    name: DROP SEARCH PROPERTY LIST
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/drop-search-property-list-transact-sql
    tier: low
    probes:
      - { id: basic, sql: "DROP SEARCH PROPERTY LIST spl;" }
  - id: drop_security_policy
    name: DROP SECURITY POLICY
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/drop-security-policy-transact-sql
    tier: low
    probes:
      - { id: basic, sql: "DROP SECURITY POLICY sp;" }
      - { id: if_exists_schema, sql: "DROP SECURITY POLICY IF EXISTS s.sp;" }
  - id: drop_sensitivity_classification
    name: DROP SENSITIVITY CLASSIFICATION
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/drop-sensitivity-classification-transact-sql
    tier: low
    probes:
      - { id: basic, sql: "DROP SENSITIVITY CLASSIFICATION FROM t.c;" }
      - { id: multiple, sql: "DROP SENSITIVITY CLASSIFICATION FROM s.t.c1, s.t.c2;" }
  - id: drop_server_audit
    name: DROP SERVER AUDIT
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/drop-server-audit-transact-sql
    tier: low
    probes:
      - { id: basic, sql: "DROP SERVER AUDIT a;" }
  - id: drop_server_audit_specification
    name: DROP SERVER AUDIT SPECIFICATION
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/drop-server-audit-specification-transact-sql
    tier: low
    probes:
      - { id: basic, sql: "DROP SERVER AUDIT SPECIFICATION spec;" }
  - id: drop_server_role
    name: DROP SERVER ROLE
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/drop-server-role-transact-sql
    tier: low
    probes:
      - { id: basic, sql: "DROP SERVER ROLE r;" }
  - id: drop_service
    name: DROP SERVICE
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/drop-service-transact-sql
    tier: low
    probes:
      - { id: basic, sql: "DROP SERVICE svc;" }
  - id: drop_signature
    name: DROP SIGNATURE
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/drop-signature-transact-sql
    tier: low
    probes:
      - { id: certificate, sql: "DROP SIGNATURE FROM p BY CERTIFICATE c;" }
      - { id: counter_asymmetric_key, sql: "DROP COUNTER SIGNATURE FROM p BY ASYMMETRIC KEY k;" }
  - id: drop_symmetric_key
    name: DROP SYMMETRIC KEY
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/drop-symmetric-key-transact-sql
    tier: low
    probes:
      - { id: basic, sql: "DROP SYMMETRIC KEY k;" }
      - { id: remove_provider_key, sql: "DROP SYMMETRIC KEY k REMOVE PROVIDER KEY;" }
  - id: drop_workload_classifier
    name: DROP WORKLOAD CLASSIFIER
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/drop-workload-classifier-transact-sql
    tier: low
    status: not-applicable
    reason: "The page is scoped to Azure Synapse Analytics dedicated pools only (monikerRange =azure-sqldw-latest); it does not apply to SQL Server 2022 or Azure SQL Database."
  - id: drop_workload_group
    name: DROP WORKLOAD GROUP
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/drop-workload-group-transact-sql
    tier: low
    probes:
      - { id: basic, sql: "DROP WORKLOAD GROUP g;" }
  - id: drop_xml_schema_collection
    name: DROP XML SCHEMA COLLECTION
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/drop-xml-schema-collection-transact-sql
    tier: low
    probes:
      - { id: basic, sql: "DROP XML SCHEMA COLLECTION xsc;" }
      - { id: schema_qualified, sql: "DROP XML SCHEMA COLLECTION s.xsc;" }
  - id: add_signature
    name: ADD SIGNATURE
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/add-signature-transact-sql
    tier: low
    probes:
      - { id: certificate, sql: "ADD SIGNATURE TO OBJECT::p BY CERTIFICATE c;" }
      - { id: counter_asymmetric_key, sql: "ADD COUNTER SIGNATURE TO OBJECT::p BY ASYMMETRIC KEY k;" }
  - id: close_master_key
    name: CLOSE MASTER KEY
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/close-master-key-transact-sql
    tier: low
    probes:
      - { id: basic, sql: "CLOSE MASTER KEY;" }
  - id: close_symmetric_key
    name: CLOSE SYMMETRIC KEY
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/close-symmetric-key-transact-sql
    tier: low
    probes:
      - { id: basic, sql: "CLOSE SYMMETRIC KEY k;" }
      - { id: all, sql: "CLOSE ALL SYMMETRIC KEYS;" }
  - id: deny_assembly_permissions
    name: DENY Assembly Permissions
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/deny-assembly-permissions-transact-sql
    tier: low
    probes:
      - { id: basic, sql: "DENY EXECUTE ON ASSEMBLY::a TO u CASCADE AS dp;" }
  - id: deny_asymmetric_key_permissions
    name: DENY Asymmetric Key Permissions
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/deny-asymmetric-key-permissions-transact-sql
    tier: low
    probes:
      - { id: basic, sql: "DENY CONTROL ON ASYMMETRIC KEY::k TO u CASCADE AS dp;" }
  - id: deny_availability_group_permissions
    name: DENY Availability Group Permissions
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/deny-availability-group-permissions-transact-sql
    tier: low
    probes:
      - { id: basic, sql: "DENY CONTROL ON AVAILABILITY GROUP::ag TO l CASCADE AS l2;" }
  - id: deny_certificate_permissions
    name: DENY Certificate Permissions
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/deny-certificate-permissions-transact-sql
    tier: low
    probes:
      - { id: basic, sql: "DENY CONTROL ON CERTIFICATE::c TO u CASCADE AS dp;" }
  - id: deny_database_permissions
    name: DENY Database Permissions
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/deny-database-permissions-transact-sql
    tier: low
    probes:
      - { id: basic, sql: "DENY CREATE TABLE, CREATE VIEW TO u CASCADE AS dp;" }
      - { id: all_privileges, sql: "DENY ALL PRIVILEGES TO u;" }
  - id: deny_database_principal_permissions
    name: DENY Database Principal Permissions
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/deny-database-principal-permissions-transact-sql
    tier: low
    probes:
      - { id: user, sql: "DENY IMPERSONATE ON USER::u TO u2 CASCADE AS dp;" }
      - { id: role, sql: "DENY ALTER ON ROLE::r TO u;" }
      - { id: application_role, sql: "DENY ALTER ON APPLICATION ROLE::ar TO u;" }
  - id: deny_database_scoped_credential
    name: DENY Database Scoped Credential
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/deny-database-scoped-credential-transact-sql
    tier: low
    probes:
      - { id: basic, sql: "DENY CONTROL ON DATABASE SCOPED CREDENTIAL::cred TO u CASCADE AS dp;" }
  - id: deny_endpoint_permissions
    name: DENY Endpoint Permissions
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/deny-endpoint-permissions-transact-sql
    tier: low
    probes:
      - { id: basic, sql: "DENY CONNECT ON ENDPOINT::ep TO l CASCADE AS l2;" }
  - id: deny_full_text_permissions
    name: DENY Full-Text Permissions
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/deny-full-text-permissions-transact-sql
    tier: low
    probes:
      - { id: catalog, sql: "DENY CONTROL ON FULLTEXT CATALOG::fc TO u CASCADE AS dp;" }
      - { id: stoplist, sql: "DENY CONTROL ON FULLTEXT STOPLIST::sl TO u;" }
  - id: deny_object_permissions
    name: DENY Object Permissions
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/deny-object-permissions-transact-sql
    tier: low
    probes:
      - { id: basic, sql: "DENY SELECT ON OBJECT::s.t TO u CASCADE AS dp;" }
      - { id: unqualified, sql: "DENY SELECT ON t TO u;" }
      - { id: column_list, sql: "DENY SELECT ON s.t (c1, c2) TO u;" }
      - { id: column_level_permission, sql: "DENY UPDATE (c1) ON s.t TO u;" }
      - { id: all_privileges, sql: "DENY ALL PRIVILEGES ON t TO u;" }
  - id: deny_schema_permissions
    name: DENY Schema Permissions
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/deny-schema-permissions-transact-sql
    tier: low
    probes:
      - { id: basic, sql: "DENY SELECT ON SCHEMA::s TO u CASCADE AS dp;" }
  - id: deny_search_property_list_permissions
    name: DENY Search Property List Permissions
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/deny-search-property-list-permissions-transact-sql
    tier: low
    probes:
      - { id: basic, sql: "DENY CONTROL ON SEARCH PROPERTY LIST::spl TO u CASCADE AS dp;" }
  - id: deny_server_permissions
    name: DENY Server Permissions
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/deny-server-permissions-transact-sql
    tier: low
    probes:
      - { id: basic, sql: "DENY CREATE ANY DATABASE TO l CASCADE AS l2;" }
      - { id: multiple, sql: "DENY VIEW SERVER STATE, ALTER ANY LOGIN TO l1, l2;" }
  - id: deny_server_principal_permissions
    name: DENY Server Principal Permissions
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/deny-server-principal-permissions-transact-sql
    tier: low
    probes:
      - { id: login, sql: "DENY IMPERSONATE ON LOGIN::l TO l2 CASCADE AS l3;" }
      - { id: server_role, sql: "DENY ALTER ON SERVER ROLE::sr TO l;" }
  - id: deny_service_broker_permissions
    name: DENY Service Broker Permissions
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/deny-service-broker-permissions-transact-sql
    tier: low
    probes:
      - { id: contract, sql: "DENY CONTROL ON CONTRACT::c TO u CASCADE AS dp;" }
      - { id: message_type, sql: "DENY CONTROL ON MESSAGE TYPE::mt TO u;" }
      - { id: remote_service_binding, sql: "DENY CONTROL ON REMOTE SERVICE BINDING::rsb TO u;" }
      - { id: route, sql: "DENY CONTROL ON ROUTE::r TO u;" }
      - { id: service, sql: "DENY CONTROL ON SERVICE::svc TO u;" }
