      - { id: js_deterministic, sql: "CREATE FUNCTION f(x FLOAT64) RETURNS FLOAT64 DETERMINISTIC LANGUAGE js AS 'return x;';" }
      - { id: js_not_deterministic_options, sql: "CREATE FUNCTION f(x FLOAT64) RETURNS FLOAT64 NOT DETERMINISTIC LANGUAGE js OPTIONS (library = ['gs://b/lib.js']) AS 'return x;';" }
      - { id: python_udf, sql: "CREATE FUNCTION d.f(x FLOAT64) RETURNS FLOAT64 LANGUAGE python OPTIONS (entry_point = 'run', runtime_version = 'python-3.11') AS r'''def run(x): return x''';" }
