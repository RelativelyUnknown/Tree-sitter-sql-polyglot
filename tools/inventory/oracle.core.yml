  - id: plsql_collection_types
    name: PL/SQL collection type definition and variable declaration
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/lnpls/collection-variable.html
    tier: high
    probes:
      - id: associative_array_pls_integer
        sql: "DECLARE TYPE aa_t IS TABLE OF VARCHAR2(20) INDEX BY PLS_INTEGER; aa aa_t; BEGIN aa(1) := 'one'; END;"
      - id: associative_array_varchar2
        sql: "DECLARE TYPE pop_t IS TABLE OF NUMBER INDEX BY VARCHAR2(64); p pop_t; BEGIN p('Midland') := 750000; END;"
      - id: associative_array_binary_integer_not_null
        sql: "DECLARE TYPE aa_t IS TABLE OF NUMBER NOT NULL INDEX BY BINARY_INTEGER; BEGIN NULL; END;"
      - id: varray
        sql: "DECLARE TYPE v_t IS VARRAY(4) OF VARCHAR2(15); v v_t := v_t('a', 'b'); BEGIN NULL; END;"
      - id: varying_array
        sql: "DECLARE TYPE v_t IS VARYING ARRAY(10) OF NUMBER NOT NULL; BEGIN NULL; END;"
      - id: nested_table
        sql: "DECLARE TYPE nt_t IS TABLE OF VARCHAR2(10); nt nt_t := nt_t('a', 'b', 'c'); BEGIN NULL; END;"
      - id: nested_table_of_rowtype
        sql: "DECLARE TYPE rows_t IS TABLE OF t%ROWTYPE; r rows_t := rows_t(); BEGIN NULL; END;"
      - id: collection_variable_type_attribute
        sql: "DECLARE TYPE nt_t IS TABLE OF NUMBER; a nt_t; b a%TYPE; BEGIN NULL; END;"
      - id: element_access
        sql: "DECLARE TYPE nt_t IS TABLE OF NUMBER; nt nt_t := nt_t(1, 2); x NUMBER; BEGIN x := nt(2); nt(1) := x; END;"
      - id: multidimensional
        sql: "DECLARE TYPE t1 IS VARRAY(10) OF INTEGER; TYPE nt1 IS VARRAY(10) OF t1; va t1 := t1(2, 3, 5); nva nt1 := nt1(va, t1(55, 6, 73)); i INTEGER; BEGIN i := nva(2)(3); END;"
    examples:
      - |-
        DECLARE
          -- Associative array indexed by string:
          
          TYPE population IS TABLE OF NUMBER  -- Associative array type
            INDEX BY VARCHAR2(64);            -- Indexed by string
          
          city_population  population;        -- Associative array variable
          i  VARCHAR2(64);                    -- Scalar variable
          
        BEGIN
          -- Add elements (key-value pairs) to associative array:
         
          city_population('Smallville')  := 2000;
          city_population('Midland')     := 750000;
          city_population('Megalopolis') := 1000000;
         
          -- Change value associated with key 'Smallville':
         
          city_population('Smallville') := 2001;
         
          -- Print associative array:
         
          i := city_population.FIRST;  -- Get first element of array
         
          WHILE i IS NOT NULL LOOP
            DBMS_Output.PUT_LINE
              ('Population of ' || i || ' is ' || city_population(i));
            i := city_population.NEXT(i);  -- Get next element of array
          END LOOP;
        END;
        /
      - |-
        DECLARE
          TYPE My_AA IS TABLE OF VARCHAR2(20) INDEX BY PLS_INTEGER;
          v CONSTANT My_AA := My_AA(-10=>'-ten', 0=>'zero', 1=>'one', 2=>'two', 3 => 'three', 4 => 'four', 9 => 'nine');
        BEGIN
          DECLARE
            Idx PLS_INTEGER := v.FIRST();
          BEGIN
            WHILE Idx IS NOT NULL LOOP
              DBMS_OUTPUT.PUT_LINE(TO_CHAR(Idx, '999')||LPAD(v(Idx), 7));
              Idx := v.NEXT(Idx);
            END LOOP;
          END;
        END;
        /

