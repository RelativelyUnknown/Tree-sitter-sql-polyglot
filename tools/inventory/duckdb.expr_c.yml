      - { id: formatting, sql: "SELECT format('{}: {}', a, b), printf('%s=%d', a, b), format_bytes(1024) FROM t;" }
      - { id: hashing_encoding, sql: "SELECT md5(s), sha256(s), hash(s), hex(s), unhex(s), to_base(10, 2), strip_accents(s), nfc_normalize(s) FROM t;" }
      - { id: like_escape_functions, sql: "SELECT like_escape(s, 'a$%c', '$'), not_like_escape(s, 'a%', '$'), ilike_escape(s, 'a%', '$') FROM t;" }

  - id: c_regexp_functions
    name: Regular expression functions
    doc: https://duckdb.org/docs/stable/sql/functions/regular_expressions
    tier: medium
    probes:
      - { id: matches, sql: "SELECT regexp_matches('anabanana', 'an'), regexp_full_match('anabanana', '(an)*');" }
