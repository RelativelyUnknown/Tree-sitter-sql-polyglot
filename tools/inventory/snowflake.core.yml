    doc: https://docs.snowflake.com/en/sql-reference/constructs/sample
    tier: high
    probes:
      - { id: sample_probability, sql: "SELECT * FROM t SAMPLE (10);" }
      - { id: tablesample_probability, sql: "SELECT * FROM t TABLESAMPLE (100);" }
