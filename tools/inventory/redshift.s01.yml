dialect: redshift
engine: Amazon Redshift
version: "current"
source: https://docs.aws.amazon.com/redshift/latest/dg/c_SQL_commands.html

statements:
  - id: abort
    name: ABORT
    doc: https://docs.aws.amazon.com/redshift/latest/dg/r_ABORT.html
    tier: high
    probes:
      - id: basic
        sql: "ABORT;"
      - id: work
        sql: "ABORT WORK;"
      - id: transaction
        sql: "ABORT TRANSACTION;"
    examples:
      - "abort;"

  - id: alter_function
    name: ALTER FUNCTION
    doc: https://docs.aws.amazon.com/redshift/latest/dg/r_ALTER_FUNCTION.html
    tier: high
    probes:
      - id: rename_to
        sql: "ALTER FUNCTION f(bigint, numeric) RENAME TO f2;"
      - id: rename_schema_qualified
        sql: "ALTER FUNCTION s.f(int) RENAME TO f2;"
      - id: rename_no_args
        sql: "ALTER FUNCTION f() RENAME TO f2;"
      - id: rename_named_args
        sql: "ALTER FUNCTION f(a int, b varchar) RENAME TO f2;"
        note: Python UDF form with py_arg_name py_arg_data_type
      - id: owner_to_user
        sql: "ALTER FUNCTION f(bigint, numeric) OWNER TO u;"
      - id: owner_to_current_user
        sql: "ALTER FUNCTION f(int) OWNER TO CURRENT_USER;"
      - id: owner_to_session_user
        sql: "ALTER FUNCTION f(int) OWNER TO SESSION_USER;"
    examples:
      - "ALTER FUNCTION first_quarter_revenue(bigint, numeric, int) RENAME TO quarterly_revenue;"
      - "ALTER FUNCTION quarterly_revenue(bigint, numeric) OWNER TO etl_user;"
