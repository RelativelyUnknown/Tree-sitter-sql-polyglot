  - id: insert_on_duplicate
    name: INSERT ... ON DUPLICATE KEY UPDATE
    doc: https://dev.mysql.com/doc/refman/8.4/en/insert-on-duplicate.html
    tier: high
    probes:
      - { id: basic, sql: "INSERT INTO t (a, b, c) VALUES (1, 2, 3) ON DUPLICATE KEY UPDATE c = c + 1;" }
      - { id: values_function, sql: "INSERT INTO t (a, b, c) VALUES (1, 2, 3), (4, 5, 6) ON DUPLICATE KEY UPDATE c = VALUES(a) + VALUES(b);", note: "VALUES() in the UPDATE clause is deprecated but still accepted in 8.4" }
      - { id: row_alias, sql: "INSERT INTO t (a, b, c) VALUES (1, 2, 3), (4, 5, 6) AS new ON DUPLICATE KEY UPDATE c = new.a + new.b;" }
      - { id: row_and_column_alias, sql: "INSERT INTO t (a, b, c) VALUES (1, 2, 3) AS new (m, n, p) ON DUPLICATE KEY UPDATE c = m + n;" }
      - { id: set_form_alias, sql: "INSERT INTO t SET a = 1, b = 2, c = 3 AS new (m, n, p) ON DUPLICATE KEY UPDATE c = m + n;" }
      - { id: ignore_values_row, sql: "INSERT IGNORE INTO t VALUES ROW(2, 3), ROW(3, 3) ON DUPLICATE KEY UPDATE a = a + 1, b = b - 1;" }
      - { id: select_source, sql: "INSERT INTO t SELECT c, c + d FROM t2 ON DUPLICATE KEY UPDATE b = VALUES(b);" }
      - { id: table_source, sql: "INSERT INTO t TABLE t2 ON DUPLICATE KEY UPDATE b = 0;" }
    examples:
      - |-
        INSERT INTO t1 (a,b,c) VALUES (1,2,3)
          ON DUPLICATE KEY UPDATE c=c+1;
      - |-
        INSERT INTO t1 (a,b,c) VALUES (1,2,3),(4,5,6)
          ON DUPLICATE KEY UPDATE c=VALUES(a)+VALUES(b);
      - |-
        INSERT INTO t1 (a,b,c) VALUES (1,2,3),(4,5,6) AS new(m,n,p)
          ON DUPLICATE KEY UPDATE c = m+n;
      - |-
        INSERT INTO t1 SET a=1,b=2,c=3 AS new
          ON DUPLICATE KEY UPDATE c = new.a+new.b;
      - |-
        INSERT INTO t1 (a, b)
        SELECT * FROM
          (SELECT c, d FROM t2
           UNION
           SELECT e, f FROM t3) AS dt
        ON DUPLICATE KEY UPDATE b = b + c;

