name: Build/test
on:
  push:
    branches:
      - "main"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - 'main'

# Cancel superseded runs of the same PR/branch — a new push obsoletes the
# previous run, so don't pay for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Corpus tests, sharded by dialect group ──────────────────────────────────
  # Grammar corpus tests are OS-independent, so they run on ubuntu only.
  # The 19 grammars are split into shards that run in parallel; each shard
  # generates and tests only its own dialects. Dialects that extend another
  # grammar (spark→hive, databricks→spark, mariadb→mysql, athena→trino) are
  # kept in the same shard as their parents.
  #
  # Caching strategy: the exact key hashes every grammar source, but
  # restore-keys falls back to the shard's most recent cache on a miss.
  # scripts/generate.js then re-generates only the grammars whose own hash
  # (including ancestor-chain files) actually changed — so a postgres-only PR
  # regenerates 1 parser, not 19. ~/.cache/tree-sitter holds the compiled
  # test libraries so `tree-sitter test` skips recompiling unchanged parsers.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: base
            dialects: ""
          - shard: hive-chain
            dialects: "hive spark databricks oracle db2"
          - shard: pg-mysql
            dialects: "postgres mysql mariadb sqlite duckdb cockroachdb"
          - shard: warehouse
            dialects: "snowflake bigquery spanner tsql clickhouse flink"
          - shard: trino-chain
            dialects: "trino athena redshift teradata"
    steps:
      - uses: actions/checkout@v4
      - uses: tree-sitter/setup-action@v2
        with:
          install-lib: false

      - uses: actions/cache@v4
        with:
          path: |
            src/parser.c
            src/node-types.json
            src/tree_sitter/
            */src/parser.c
            */src/node-types.json
            */src/tree_sitter/
            .grammar-cache/
            ~/.cache/tree-sitter/
          key: parsers-${{ matrix.shard }}-${{ hashFiles('grammar.js', 'grammar/**', '*/grammar.js', '*/grammar/**') }}
          restore-keys: |
            parsers-${{ matrix.shard }}-

      # generate.js is hash-cached per grammar (including ancestor chains), so
      # on a warm restore only the changed grammars are regenerated.
      - name: Generate parsers
        run: |
          if [ -z "${{ matrix.dialects }}" ]; then
            node scripts/generate.js
          else
            for d in ${{ matrix.dialects }}; do
              node scripts/generate.js "$d"
            done
          fi

      # Rust build cache for the base parser-test-action (cargo test of the
      # Rust binding is the slowest part of the base shard).
      - uses: Swatinem/rust-cache@v2
        if: matrix.shard == 'base'

      - name: Run tests (base SQL)
        if: matrix.shard == 'base'
        uses: tree-sitter/parser-test-action@v3
        with:
          test-rust: true
          test-node: false
          test-python: true

      - name: Keyword/highlights sync check
        if: matrix.shard == 'base'
        run: scripts/test-keywords.sh

      - name: Run dialect corpus tests
        if: matrix.dialects != ''
        run: |
          for d in ${{ matrix.dialects }}; do
            echo "::group::tree-sitter test ($d)"
            (cd "$d" && tree-sitter test)
            echo "::endgroup::"
          done

  # ── Feature-completeness scorecard ──────────────────────────────────────────
  # Parses every feature probe in tools/features.yml with every dialect parser
  # and fails on coverage regressions (implemented → absent) or new ANSI
  # purity violations in the base grammar. Baseline: tools/coverage.json.
  scorecard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: tree-sitter/setup-action@v2
        with:
          install-lib: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: |
            src/parser.c
            src/node-types.json
            src/tree_sitter/
            */src/parser.c
            */src/node-types.json
            */src/tree_sitter/
            .grammar-cache/
            ~/.cache/tree-sitter/
          key: parsers-scorecard-${{ hashFiles('grammar.js', 'grammar/**', '*/grammar.js', '*/grammar/**') }}
          restore-keys: |
            parsers-scorecard-

      - name: Generate all parsers
        run: npm run generate:all

      - name: Evidence corroboration gate
        run: |
          pip install pyyaml
          python tools/corroborate.py

      - name: Scorecard regression check
        env:
          TREE_SITTER_BIN: tree-sitter
        run: python tools/scorecard.py --check

  # ── Node native binding (OS matrix) ─────────────────────────────────────────
  # node-gyp compiles parser.c to a native .node addon. The result is
  # platform-specific, so this job stays as a 3-OS matrix.
  test_node:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Re-use the base shard's parser cache so generation is skipped on a
      # warm restore. src/tree_sitter/ headers must be cached alongside
      # parser.c: they are generated together by tree-sitter generate and
      # required by node-gyp to compile binding.cc
      # (include_dirs: ["src"] → #include "tree_sitter/parser.h").
      - uses: actions/cache@v4
        with:
          path: |
            src/parser.c
            src/node-types.json
            src/tree_sitter/
            .grammar-cache/
          key: parsers-node-${{ runner.os }}-${{ hashFiles('grammar.js', 'grammar/**') }}
          restore-keys: |
            parsers-node-${{ runner.os }}-

      # npm ci runs the install hook: node scripts/generate.js && node-gyp-build
      # generate.js skips regeneration on cache hit; node-gyp-build compiles the
      # native addon from src/parser.c.
      - run: npm ci
      - run: node --test bindings/node/*_test.js

  # ── Validate corpus file integrity ──────────────────────────────────────────
  validate_tests:
    runs-on: ["ubuntu-latest"]
    strategy:
      fail-fast: true
    steps:
      - uses: actions/checkout@v4
      - run: |
          STATUS=0
          # Match tree-sitter error NODES in expected parse trees (the S-expression
          # forms "(ERROR", "(MISSING", "(UNEXPECTED") rather than the bare words,
          # which legitimately appear in valid SQL (e.g. EXCEPTION WHEN ERROR THEN,
          # ERROR_MESSAGE(), RAISERROR(...)). errors.txt holds intentional error tests.
          for dir in test spark/test databricks/test postgres/test mysql/test snowflake/test mariadb/test sqlite/test hive/test oracle/test db2/test duckdb/test trino/test athena/test redshift/test bigquery/test tsql/test clickhouse/test flink/test cockroachdb/test spanner/test teradata/test; do
            if [[ $(grep -rnE --exclude=errors.txt '\(ERROR' "$dir/" 2>/dev/null | wc -l) -gt 0 ]]; then
                echo "Found 'ERROR' in $dir: "
                grep -rnE --exclude=errors.txt '\(ERROR' "$dir/" | cut -f1,2 -d:
                STATUS=1
            fi
            if [[ $(grep -rnE --exclude=errors.txt '\(MISSING' "$dir/" 2>/dev/null | wc -l) -gt 0 ]]; then
                echo "Found 'MISSING' in $dir: "
                grep -rnE --exclude=errors.txt '\(MISSING' "$dir/" | cut -f1,2 -d:
                STATUS=1
            fi
            if [[ $(grep -rnE --exclude=errors.txt '\(UNEXPECTED' "$dir/" 2>/dev/null | wc -l) -gt 0 ]]; then
                echo "Found 'UNEXPECTED' in $dir: "
                grep -rnE --exclude=errors.txt '\(UNEXPECTED' "$dir/" | cut -f1,2 -d:
                STATUS=1
            fi
          done
          exit $STATUS
