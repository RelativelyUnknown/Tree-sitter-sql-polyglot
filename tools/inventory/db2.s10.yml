dialect: db2
engine: IBM Db2 for Linux, UNIX and Windows
version: "11.5"
source: https://www.ibm.com/docs/en/db2/11.5.x?topic=reference-statements

statements:
  - id: create_function_sourced_or_template
    name: CREATE FUNCTION (sourced or template)
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-create-function-sourced-template
    tier: high
    probes:
      - id: source_basic
        sql: "CREATE FUNCTION f (INTEGER, INTEGER) RETURNS FLOAT SOURCE s.g (INTEGER, FLOAT);"
      - id: source_named_params
        sql: "CREATE FUNCTION f (a INTEGER, b VARCHAR(10)) RETURNS INTEGER SOURCE g (INTEGER, VARCHAR(10));"
      - id: source_no_params
        sql: "CREATE FUNCTION f () RETURNS INTEGER SOURCE g ();"
      - id: parameter_default
        sql: "CREATE FUNCTION f (a INTEGER DEFAULT 0) RETURNS INTEGER SOURCE g (INTEGER);"
      - id: source_specific
        sql: "CREATE FUNCTION f (INTEGER) RETURNS INTEGER SOURCE SPECIFIC s.g_specific;"
      - id: specific_name
        sql: "CREATE FUNCTION f (INTEGER) RETURNS INTEGER SPECIFIC f_spec SOURCE g (INTEGER);"
      - id: source_parameter_ccsid_unicode
        sql: "CREATE FUNCTION f (VARCHAR(10)) RETURNS VARCHAR(10) SOURCE g (VARCHAR(10)) PARAMETER CCSID UNICODE;"
      - id: source_parameter_ccsid_ascii
        sql: "CREATE FUNCTION f (VARCHAR(10)) RETURNS VARCHAR(10) SOURCE g (VARCHAR(10)) PARAMETER CCSID ASCII;"
      - id: template_basic
        sql: "CREATE FUNCTION f (DOUBLE, DOUBLE) RETURNS DOUBLE AS TEMPLATE;"
      - id: template_deterministic_no_external_action
        sql: "CREATE FUNCTION f (DOUBLE, DOUBLE) RETURNS DOUBLE AS TEMPLATE DETERMINISTIC NO EXTERNAL ACTION;"
      - id: template_not_deterministic_external_action
        sql: "CREATE FUNCTION f (INTEGER) RETURNS INTEGER AS TEMPLATE NOT DETERMINISTIC EXTERNAL ACTION;"
      - id: template_no_params_decimal
        sql: "CREATE FUNCTION f () RETURNS DECIMAL(8,2) AS TEMPLATE DETERMINISTIC NO EXTERNAL ACTION;"
      - id: returns_char_for_bit_data
        sql: "CREATE FUNCTION f (a CHAR(8) FOR BIT DATA) RETURNS VARCHAR(20) FOR BIT DATA AS TEMPLATE;"
      - id: returns_lob_types
        sql: "CREATE FUNCTION f (a CLOB(1M), b BLOB(2K)) RETURNS DBCLOB(1G) AS TEMPLATE;"
      - id: returns_timestamp_precision
        sql: "CREATE FUNCTION f (a TIMESTAMP(9)) RETURNS TIMESTAMP(3) AS TEMPLATE;"
      - id: returns_distinct_type
        sql: "CREATE FUNCTION avg (hatsize) RETURNS hatsize SOURCE SYSIBM.AVG (INTEGER);"
    examples:
      - "CREATE FUNCTION MYCENTER ( INTEGER, INTEGER ) RETURNS FLOAT SOURCE PELLOW.CENTER ( INTEGER, FLOAT );"
      - "CREATE FUNCTION AVG (HATSIZE) RETURNS HATSIZE SOURCE SYSIBM.AVG ( INTEGER );"
      - "CREATE FUNCTION NOVA.STATS ( DOUBLE, DOUBLE ) RETURNS DOUBLE AS TEMPLATE DETERMINISTIC NO EXTERNAL ACTION;"

  - id: create_function_sql_scalar_table_or_row
    name: CREATE FUNCTION (SQL scalar, table, or row)
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-create-function-sql-scalar-table-row
    tier: high
    probes:
      - id: scalar_return
        sql: "CREATE FUNCTION f (x DOUBLE) RETURNS DOUBLE LANGUAGE SQL CONTAINS SQL NO EXTERNAL ACTION DETERMINISTIC RETURN sin(x) / cos(x);"
      - id: scalar_minimal
        sql: "CREATE FUNCTION f (x INTEGER) RETURNS INTEGER RETURN x + 1;"
      - id: or_replace
        sql: "CREATE OR REPLACE FUNCTION f (x INTEGER) RETURNS INTEGER RETURN x + 1;"
      - id: no_params
        sql: "CREATE FUNCTION f () RETURNS INTEGER RETURN 1;"
      - id: param_in
        sql: "CREATE FUNCTION f (IN x INTEGER) RETURNS INTEGER RETURN x;"
      - id: param_default
        sql: "CREATE FUNCTION f (x INTEGER DEFAULT 10, y VARCHAR(5) DEFAULT NULL) RETURNS INTEGER RETURN x;"
      - id: param_default_expression
        sql: "CREATE FUNCTION f (x INTEGER DEFAULT (1 + 2)) RETURNS INTEGER RETURN x;"
      - id: param_out_inout_compiled
        sql: |-
          CREATE FUNCTION f (INOUT r INTEGER, OUT o INTEGER, IN d INTEGER) RETURNS INTEGER
          BEGIN
            SET r = r + d;
            SET o = r;
            RETURN 0;
          END;
      - id: param_anchored_type
        sql: "CREATE FUNCTION f (x ANCHOR DATA TYPE TO t.c) RETURNS INTEGER RETURN 1;"
      - id: param_anchored_row_of
        sql: "CREATE FUNCTION f (x ANCHOR DATA TYPE TO ROW OF t) RETURNS INTEGER BEGIN RETURN 1; END;"
      - id: param_array_type
        sql: "CREATE FUNCTION f (x myarray) RETURNS INTEGER BEGIN RETURN CARDINALITY(x); END;"
      - id: param_cursor_type
        sql: "CREATE FUNCTION f (c CURSOR) RETURNS INTEGER BEGIN RETURN 1; END;"
      - id: param_boolean
        sql: "CREATE FUNCTION f (b BOOLEAN) RETURNS BOOLEAN RETURN b;"
      - id: param_ref_type
        sql: "CREATE FUNCTION f (r REF(person_t)) RETURNS INTEGER RETURN 1;"
      - id: returns_row
        sql: "CREATE FUNCTION f (p person) RETURNS ROW (name VARCHAR(10), firstname VARCHAR(10)) LANGUAGE SQL CONTAINS SQL NO EXTERNAL ACTION DETERMINISTIC RETURN VALUES (p..name, p..firstname);"
      - id: returns_table
        sql: "CREATE FUNCTION f (d CHAR(3)) RETURNS TABLE (empno CHAR(6), lastname VARCHAR(15)) LANGUAGE SQL READS SQL DATA NO EXTERNAL ACTION DETERMINISTIC RETURN SELECT empno, lastname FROM employee WHERE workdept = f.d;"
      - id: returns_row_type_name
        sql: "CREATE FUNCTION f (x INTEGER) RETURNS my_row_type BEGIN DECLARE r my_row_type; RETURN r; END;"
      - id: returns_anchored_row
        sql: "CREATE FUNCTION f (x INTEGER) RETURNS ANCHOR DATA TYPE TO ROW OF t BEGIN DECLARE r ROW ANCHOR DATA TYPE TO ROW OF t; RETURN r; END;"
      - id: returns_element_of_array
        sql: "CREATE FUNCTION f (a myarray) RETURNS TABLE (v INTEGER) BEGIN RETURN SELECT x.v FROM UNNEST(a) AS x(v); END;"
      - id: returns_table_row_type_name
        sql: "CREATE FUNCTION f (x INTEGER) RETURNS TABLE (a INTEGER, b REF(person_t), c INTEGER) BEGIN RETURN SELECT 1, NULL, 2 FROM sysibm.sysdummy1; END;"
      - id: returns_builtin_types
        sql: "CREATE FUNCTION f (a DECIMAL(10,2), b VARCHAR(10) FOR BIT DATA, c TIMESTAMP(6), d XML, e DECFLOAT(34)) RETURNS BIGINT RETURN 1;"
      - id: option_language_sql
        sql: "CREATE FUNCTION f (x INTEGER) RETURNS INTEGER LANGUAGE SQL RETURN x;"
      - id: option_parameter_ccsid
        sql: "CREATE FUNCTION f (x VARCHAR(10)) RETURNS VARCHAR(10) PARAMETER CCSID UNICODE RETURN x;"
      - id: option_specific
        sql: "CREATE FUNCTION f (x INTEGER) RETURNS INTEGER SPECIFIC f_spec RETURN x;"
      - id: option_not_deterministic_external_action
        sql: "CREATE FUNCTION f (x INTEGER) RETURNS INTEGER NOT DETERMINISTIC EXTERNAL ACTION RETURN x;"
      - id: option_reads_sql_data
        sql: "CREATE FUNCTION f (x INTEGER) RETURNS INTEGER READS SQL DATA RETURN (SELECT COUNT(*) FROM t);"
      - id: option_modifies_sql_data
        sql: |-
          CREATE FUNCTION f (x INTEGER) RETURNS TABLE (a INTEGER) MODIFIES SQL DATA
          BEGIN ATOMIC
            INSERT INTO audit VALUES (x);
            RETURN SELECT x FROM sysibm.sysdummy1;
          END;
      - id: option_disallow_parallel
        sql: "CREATE FUNCTION f (x INTEGER) RETURNS INTEGER DISALLOW PARALLEL RETURN x;"
      - id: option_allow_parallel
        sql: "CREATE FUNCTION f (x INTEGER) RETURNS INTEGER ALLOW PARALLEL RETURN x;"
      - id: option_static_dispatch
        sql: "CREATE FUNCTION f (x person) RETURNS INTEGER STATIC DISPATCH RETURN 1;"
      - id: option_called_on_null_input
        sql: "CREATE FUNCTION f (x INTEGER) RETURNS INTEGER CALLED ON NULL INPUT RETURN COALESCE(x, 0);"
      - id: option_inherit_special_registers
        sql: "CREATE FUNCTION f (x INTEGER) RETURNS INTEGER INHERIT SPECIAL REGISTERS RETURN x;"
      - id: option_predicates
        sql: "CREATE FUNCTION f (x INTEGER) RETURNS INTEGER PREDICATES (WHEN = 1 FILTER USING g(x)) RETURN x;"
      - id: option_inherit_isolation_level_without_lock_request
        sql: "CREATE FUNCTION f (x INTEGER) RETURNS INTEGER INHERIT ISOLATION LEVEL WITHOUT LOCK REQUEST RETURN x;"
      - id: option_inherit_isolation_level_with_lock_request
        sql: "CREATE FUNCTION f (x INTEGER) RETURNS INTEGER INHERIT ISOLATION LEVEL WITH LOCK REQUEST RETURN x;"
      - id: option_secured
        sql: "CREATE FUNCTION f (x INTEGER) RETURNS INTEGER SECURED RETURN x;"
      - id: option_not_secured
        sql: "CREATE FUNCTION f (x INTEGER) RETURNS INTEGER NOT SECURED RETURN x;"
      - id: body_compound_inlined
        sql: |-
          CREATE FUNCTION f (instr VARCHAR(100)) RETURNS VARCHAR(100)
          DETERMINISTIC NO EXTERNAL ACTION CONTAINS SQL
          BEGIN ATOMIC
            DECLARE revstr VARCHAR(100) DEFAULT '';
            DECLARE len INT;
            IF instr IS NULL THEN RETURN NULL; END IF;
            SET len = LENGTH(instr);
            WHILE len > 0 DO
              SET revstr = SUBSTR(instr, len, 1) CONCAT revstr;
              SET len = len - 1;
            END WHILE;
            RETURN revstr;
          END;
      - id: body_compound_compiled_handler
        sql: |-
          CREATE FUNCTION f (x INTEGER) RETURNS INTEGER
          BEGIN
            DECLARE code INTEGER DEFAULT 0;
            DECLARE CONTINUE HANDLER FOR SQLEXCEPTION
            BEGIN
              SET code = SQLCODE;
              RETURN code;
            END;
            RETURN code;
          END;
      - id: body_return_select_scalar
        sql: "CREATE FUNCTION f () RETURNS INTEGER RETURN (SELECT MAX(c) FROM t);"
      - id: body_return_values_row
        sql: "CREATE FUNCTION f (x INTEGER) RETURNS ROW (a INTEGER, b INTEGER) RETURN VALUES (x, x + 1);"
    examples:
      - "CREATE FUNCTION TAN (X DOUBLE) RETURNS DOUBLE LANGUAGE SQL CONTAINS SQL NO EXTERNAL ACTION DETERMINISTIC RETURN SIN(X)/COS(X);"
      - "CREATE FUNCTION FROMPERSON (P PERSON) RETURNS ROW (NAME VARCHAR(10), FIRSTNAME VARCHAR(10)) LANGUAGE SQL CONTAINS SQL NO EXTERNAL ACTION DETERMINISTIC RETURN VALUES (P..NAME, P..FIRSTNAME);"
      - "CREATE FUNCTION DEPTEMPLOYEES (DEPTNO CHAR(3)) RETURNS TABLE (EMPNO CHAR(6), LASTNAME VARCHAR(15), FIRSTNAME VARCHAR(12)) LANGUAGE SQL READS SQL DATA NO EXTERNAL ACTION DETERMINISTIC RETURN SELECT EMPNO, LASTNAME, FIRSTNME FROM EMPLOYEE WHERE EMPLOYEE.WORKDEPT = DEPTEMPLOYEES.DEPTNO;"
