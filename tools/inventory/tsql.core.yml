  - id: print
    name: "PRINT"
    doc: https://learn.microsoft.com/en-us/sql/t-sql/language-elements/print-transact-sql
    tier: high
    probes:
      - id: string
        sql: "PRINT 'Hello';"
      - id: unicode_expression
