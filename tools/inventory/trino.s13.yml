dialect: trino
engine: Trino
version: "483"
source: https://trino.io/docs/current/sql.html

statements:
  - id: start_transaction
    name: START TRANSACTION
    doc: https://trino.io/docs/current/sql/start-transaction.html
    tier: high
    probes:
      - id: basic
        sql: "START TRANSACTION;"
      - id: isolation_read_uncommitted
        sql: "START TRANSACTION ISOLATION LEVEL READ UNCOMMITTED;"
      - id: isolation_read_committed
        sql: "START TRANSACTION ISOLATION LEVEL READ COMMITTED;"
      - id: isolation_repeatable_read
        sql: "START TRANSACTION ISOLATION LEVEL REPEATABLE READ;"
      - id: isolation_serializable
        sql: "START TRANSACTION ISOLATION LEVEL SERIALIZABLE;"
      - id: read_only
        sql: "START TRANSACTION READ ONLY;"
      - id: read_write
        sql: "START TRANSACTION READ WRITE;"
      - id: multiple_modes
        sql: "START TRANSACTION ISOLATION LEVEL READ COMMITTED, READ ONLY;"
    examples:
      - "START TRANSACTION;"
      - "START TRANSACTION ISOLATION LEVEL REPEATABLE READ;"
      - "START TRANSACTION READ WRITE;"

  - id: truncate
    name: TRUNCATE
    doc: https://trino.io/docs/current/sql/truncate.html
    tier: high
    probes:
      - id: truncate_table
        sql: "TRUNCATE TABLE t;"
    examples:
      - "TRUNCATE TABLE orders;"
