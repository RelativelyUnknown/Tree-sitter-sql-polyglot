dialect: spanner
engine: Google Cloud Spanner (GoogleSQL dialect)
version: "current managed service (docs as of 2026-10)"
source: https://cloud.google.com/spanner/docs/reference/standard-sql/data-definition-language

statements:
  - id: drop_table
    name: DROP TABLE
    doc: https://cloud.google.com/spanner/docs/reference/standard-sql/data-definition-language#drop_table
    tier: high
    probes:
      - id: basic
        sql: "DROP TABLE t;"
      - id: if_exists
        sql: "DROP TABLE IF EXISTS t;"

  - id: rename_table
    name: RENAME TABLE
    doc: https://cloud.google.com/spanner/docs/reference/standard-sql/data-definition-language#rename_table
    tier: high
    probes:
      - id: single
        sql: "RENAME TABLE t TO t2;"
      - id: multiple
        sql: "RENAME TABLE t TO t2, s TO s2;"
    examples:
      - "RENAME TABLE Singers TO Artists, Albums TO Recordings;"
