  - id: cache_table
    name: "CACHE / UNCACHE TABLE"
    category: admin
    ansi: false
    weight: 1
    probe: "CACHE TABLE t1;"
    dialects:
      # CACHE/UNCACHE TABLE is Spark SQL's statement for pinning a relation in
      # the executor block manager; Databricks inherits it. No other engine
      # exposes cache residency as a statement — SQLGlot parses it everywhere
      # only because its dialects share one base parser.
      postgres:    { status: not-applicable, reason: "Buffer cache is not managed by statement" }
      cockroachdb: { status: not-applicable, reason: "Buffer cache is not managed by statement" }
      mysql:       { status: not-applicable, reason: "No CACHE TABLE (query cache removed in 8.0)" }
      mariadb:     { status: not-applicable, reason: "No CACHE TABLE statement" }
      tsql:        { status: not-applicable, reason: "Buffer pool is not managed by statement" }
      oracle:      { status: not-applicable, reason: "CACHE is a table attribute, not a statement" }
      sqlite:      { status: not-applicable, reason: "No CACHE TABLE statement" }
      duckdb:      { status: not-applicable, reason: "No CACHE TABLE statement" }
      db2:         { status: not-applicable, reason: "Bufferpools are objects, not a CACHE statement" }
      hana:        { status: not-applicable, reason: "LOAD/UNLOAD manage residency, not CACHE TABLE" }
      teradata:    { status: not-applicable, reason: "No CACHE TABLE statement" }
      hive:        { status: not-applicable, reason: "CACHE TABLE is a Spark statement, not Hive" }
      snowflake:   { status: not-applicable, reason: "Result/warehouse caches are automatic" }
      bigquery:    { status: not-applicable, reason: "Result cache is automatic" }
      spanner:     { status: not-applicable, reason: "No CACHE TABLE statement" }
      redshift:    { status: not-applicable, reason: "Result cache is automatic" }
      trino:       { status: not-applicable, reason: "Caching is connector configuration, not SQL" }
      athena:      { status: not-applicable, reason: "Caching is connector configuration, not SQL" }
      clickhouse:  { status: not-applicable, reason: "Caches are settings/SYSTEM commands, not CACHE TABLE" }
      flink:       { status: not-applicable, reason: "No CACHE TABLE statement" }

  # ── Vendor statement families added by the grammar/vendor-doc audit ──────
  # Every spelling below is transcribed from the vendor's own syntax block
  # (the same sources the grammar work used: Oracle SQL Language Reference,
  # BigQuery/Spanner GoogleSQL DDL, MySQL Reference Manual, SAP HANA SQL
  # Reference, ClickHouse docs, Db2 SQL Reference, Teradata SQL DML/DDL).
  # not-applicable is used ONLY where the engine demonstrably has no such
  # statement; where a dialect plausibly has one we have not implemented, the
  # probe stays scored so the gap is visible.

  - id: alter_set_options
    name: "Option list on ALTER TABLE"
    category: ddl
    ansi: false
    weight: 2
    probe: "ALTER TABLE t1 SET OPTIONS (description = 'x');"
    dialects:
      postgres:    { probe: "ALTER TABLE t1 SET (fillfactor = 70);" }
      cockroachdb: { probe: "ALTER TABLE t1 SET (ttl_expire_after = '1 day');" }
      mysql:       { probe: "ALTER TABLE t1 ENGINE = InnoDB;" }
      mariadb:     { probe: "ALTER TABLE t1 ENGINE = InnoDB;" }
      hive:        { probe: "ALTER TABLE t1 SET TBLPROPERTIES ('k' = 'v');" }
      spark:       { probe: "ALTER TABLE t1 SET TBLPROPERTIES ('k' = 'v');" }
      databricks:  { probe: "ALTER TABLE t1 SET TBLPROPERTIES ('k' = 'v');" }
      trino:       { probe: "ALTER TABLE t1 SET PROPERTIES format = 'ORC';" }
      athena:      { probe: "ALTER TABLE t1 SET TBLPROPERTIES ('k' = 'v');" }
      clickhouse:  { probe: "ALTER TABLE t1 MODIFY SETTING max_threads = 4;" }
      snowflake:   { probe: "ALTER TABLE t1 SET COMMENT = 'x';" }
      flink:       { probe: "ALTER TABLE t1 SET ('k' = 'v');" }
      # Each engine below has a per-table option list, but spells it its own
      # way; the default `SET OPTIONS (…)` is GoogleSQL's spelling and was
      # measuring vocabulary rather than the feature.
      tsql:        { probe: "ALTER TABLE t1 SET (LOCK_ESCALATION = AUTO);" }
      oracle:      { probe: "ALTER TABLE t1 PCTFREE 10;" }
      db2:         { probe: "ALTER TABLE t1 APPEND ON;" }
      hana:        { probe: "ALTER TABLE t1 UNLOAD PRIORITY 5;" }
      teradata:    { probe: "ALTER TABLE t1, NO FALLBACK;" }
      redshift:    { probe: "ALTER TABLE t1 SET TABLE PROPERTIES ('numRows' = '1000');" }
      duckdb:      { status: not-applicable, reason: "No per-table option list" }
      sqlite:      { status: not-applicable, reason: "No per-table option list" }

  - id: index_rebuild
    name: "ALTER INDEX … REBUILD"
    category: admin
    ansi: false
    weight: 1
    probe: "ALTER INDEX idx1 REBUILD;"
    dialects:
      tsql:        { probe: "ALTER INDEX idx1 ON t1 REBUILD;" }
      db2:         { probe: "REORG INDEXES ALL FOR TABLE t1;" }
      # Engines with no user-managed indexes, or none that can be rebuilt in
      # place — REINDEX (a separate probe) is the PostgreSQL-family spelling.
      postgres:    { status: not-applicable, reason: "REINDEX, not ALTER INDEX REBUILD" }
      cockroachdb: { status: not-applicable, reason: "REINDEX, not ALTER INDEX REBUILD" }
      sqlite:      { status: not-applicable, reason: "REINDEX, not ALTER INDEX REBUILD" }
      duckdb:      { status: not-applicable, reason: "No index maintenance statement" }
      hive:        { status: not-applicable, reason: "Indexes removed in Hive 3" }
      spark:       { status: not-applicable, reason: "No indexes" }
      databricks:  { status: not-applicable, reason: "No user indexes" }
      redshift:    { status: not-applicable, reason: "No indexes (sort/dist keys)" }
      bigquery:    { status: not-applicable, reason: "No user indexes to rebuild" }
      trino:       { status: not-applicable, reason: "Query engine, no index storage" }
      athena:      { status: not-applicable, reason: "Query engine, no index storage" }
      flink:       { status: not-applicable, reason: "Query engine, no index storage" }
      snowflake:   { status: not-applicable, reason: "No user indexes (micro-partitions)" }
      clickhouse:  { probe: "ALTER TABLE t1 MATERIALIZE INDEX idx1;" }
      # Indexes exist, but there is no statement that rebuilds one in place:
      # MySQL/MariaDB rebuild through OPTIMIZE TABLE or ALTER TABLE … ENGINE,
      # Spanner only through DROP + CREATE INDEX, Teradata not at all.
      mysql:       { status: not-applicable, reason: "OPTIMIZE TABLE / ALTER TABLE … ENGINE rebuilds, no ALTER INDEX" }
      mariadb:     { status: not-applicable, reason: "OPTIMIZE TABLE / ALTER TABLE … ENGINE rebuilds, no ALTER INDEX" }
      spanner:     { status: not-applicable, reason: "Index DDL is CREATE/DROP only" }
      teradata:    { status: not-applicable, reason: "No index rebuild statement" }

  - id: database_options
    name: "CREATE DATABASE with an option list"
    category: ddl
    ansi: false
    weight: 1
    probe: "CREATE DATABASE db1 CHARACTER SET utf8mb4;"
    dialects:
      postgres:    { probe: "CREATE DATABASE db1 WITH ENCODING 'UTF8';" }
      cockroachdb: { probe: "CREATE DATABASE db1 PRIMARY REGION 'us-east1';" }
      hive:        { probe: "CREATE DATABASE db1 WITH DBPROPERTIES ('k' = 'v');" }
      spark:       { probe: "CREATE DATABASE db1 WITH DBPROPERTIES ('k' = 'v');" }
      databricks:  { probe: "CREATE DATABASE db1 WITH DBPROPERTIES ('k' = 'v');" }
      athena:      { probe: "CREATE DATABASE db1 WITH DBPROPERTIES ('k' = 'v');" }
      snowflake:   { probe: "CREATE DATABASE db1 DATA_RETENTION_TIME_IN_DAYS = 1;" }
      bigquery:    { status: not-applicable, reason: "Datasets are schemas; CREATE SCHEMA … OPTIONS" }
      spanner:     { status: not-applicable, reason: "Databases are created by the instance API" }
      sqlite:      { status: not-applicable, reason: "One database per file; ATTACH instead" }
      trino:       { status: not-applicable, reason: "Catalogs are configured, not created" }
      flink:       { probe: "CREATE DATABASE db1 WITH ('k' = 'v');" }
      oracle:      { probe: "CREATE DATABASE db1 CHARACTER SET AL32UTF8;" }
      # CHARACTER SET is MySQL's spelling; these engines take an option list
      # of their own.
      tsql:        { probe: "CREATE DATABASE db1 COLLATE Latin1_General_CI_AS;" }
      redshift:    { probe: "CREATE DATABASE db1 WITH OWNER u1;" }
      clickhouse:  { probe: "CREATE DATABASE db1 ENGINE = Atomic;" }
      teradata:    { probe: "CREATE DATABASE db1 AS PERM = 1000000;" }
      hana:        { status: not-applicable, reason: "Tenant databases via ALTER SYSTEM, not CREATE DATABASE" }
      db2:         { status: not-applicable, reason: "CREATE DATABASE is a CLP command, not SQL" }
      duckdb:      { status: not-applicable, reason: "No CREATE DATABASE; databases are files reached via ATTACH" }

  - id: bulk_load
    name: "Bulk load from a file"
    category: dml
    ansi: false
    weight: 2
    probe: "LOAD DATA INFILE 'f.csv' INTO TABLE t1;"
    dialects:
      postgres:    { probe: "COPY t1 FROM 'f.csv';" }
      cockroachdb: { probe: "COPY t1 FROM STDIN;" }
      redshift:    { probe: "COPY t1 FROM 's3://b/f' IAM_ROLE 'arn';" }
      snowflake:   { probe: "COPY INTO t1 FROM @stage1;" }
      duckdb:      { probe: "COPY t1 FROM 'f.csv';" }
      bigquery:    { probe: "LOAD DATA INTO t1 FROM FILES (uris = ['gs://b/f']);" }
      hive:        { probe: "LOAD DATA INPATH '/f' INTO TABLE t1;" }
      spark:       { probe: "LOAD DATA INPATH '/f' INTO TABLE t1;" }
      databricks:  { probe: "COPY INTO t1 FROM '/f' FILEFORMAT = CSV;" }
      clickhouse:  { status: not-applicable, reason: "Ingest via INSERT … FROM INFILE / clickhouse-client" }
      trino:       { status: not-applicable, reason: "No load statement; INSERT … SELECT from a connector" }
      athena:      { status: not-applicable, reason: "No load statement; data is already in S3" }
      flink:       { status: not-applicable, reason: "No load statement; INSERT … SELECT from a connector" }
      spanner:     { status: not-applicable, reason: "Bulk load via the Dataflow/import API" }
      sqlite:      { status: not-applicable, reason: ".import is a shell command, not SQL" }
      # T-SQL and HANA do have a SQL-level file loader, each with its own
      # spelling. Oracle, Db2 and Teradata load through external utilities
      # (SQL*Loader, the LOAD/IMPORT CLP commands, FastLoad/TPT), so there is
      # no statement to parse.
      tsql:        { probe: "BULK INSERT t1 FROM 'f.csv';" }
      hana:        { probe: "IMPORT FROM CSV FILE '/f.csv' INTO t1;" }
      oracle:      { status: not-applicable, reason: "SQL*Loader / external tables, not a SQL statement" }
      db2:         { status: not-applicable, reason: "LOAD and IMPORT are CLP commands (ADMIN_CMD), not SQL" }
      teradata:    { status: not-applicable, reason: "FastLoad/MultiLoad/TPT utilities, not SQL" }

  - id: materialized_view_log
    name: "Materialized view log (incremental refresh source)"
    category: ddl
    ansi: false
