      - { id: using_positional, sql: "EXECUTE IMMEDIATE 'SELECT ? * (? + 2)' INTO y USING 1, 3;" }
      - { id: using_named, sql: "EXECUTE IMMEDIATE 'SELECT @a * (@b + 2)' INTO y USING 1 AS a, 3 AS b;" }
      - { id: into_multiple, sql: "EXECUTE IMMEDIATE 'SELECT 1, 2' INTO a, b;" }
      - { id: expression, sql: "EXECUTE IMMEDIATE CONCAT('INSERT INTO b (title) ', 'VALUES (''x'')');" }
      - { id: variable_using, sql: "EXECUTE IMMEDIATE q USING v1, v2;" }
    examples:
      - "EXECUTE IMMEDIATE \"SELECT ? * (? + 2)\" INTO y USING 1, 3;"
      - "EXECUTE IMMEDIATE \"SELECT @a * (@b + 2)\" INTO y USING 1 as a, 3 as b;"
      - |-
        EXECUTE IMMEDIATE
         "CREATE TEMP TABLE Books (title STRING, publish_date INT64)";
      - |-
        EXECUTE IMMEDIATE
         "INSERT INTO Books (title, publish_date) VALUES(@name, @year)"
         USING 1815 as year, "Emma" as name;
      - |-
