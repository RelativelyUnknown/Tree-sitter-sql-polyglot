      - id: opendatasource_target
        sql: "INSERT INTO OPENDATASOURCE('MSOLEDBSQL', 'Data Source=srv;Integrated Security=SSPI').db.dbo.t (c) VALUES ('x');"
      - id: openrowset_source
        sql: "INSERT INTO t WITH (IGNORE_TRIGGERS) (c, d) SELECT b.c, b.d FROM OPENROWSET (BULK 'C:\\data\\f.txt', FORMATFILE = 'C:\\data\\f.xml', ROWS_PER_BATCH = 15000) AS b;"
      - id: option_clause
        sql: "INSERT INTO t (c) SELECT c FROM u OPTION (MAXDOP 1);"
      - id: udt_value
        sql: "INSERT INTO t (p) VALUES (CONVERT(Point, '12.3:46.2'));"
      - id: insert_bulk
        sql: "INSERT BULK dbo.t (c INT NOT NULL, d NVARCHAR(10) COLLATE Latin1_General_CI_AS NULL) WITH (CHECK_CONSTRAINTS, FIRE_TRIGGERS, KEEP_NULLS, ROWS_PER_BATCH = 1000, ORDER (c ASC), TABLOCK);"
        note: "'External tool only syntax' block: INSERT BULK is sent by bulk-load clients (bcp, SqlBulkCopy) over TDS."
    examples:
