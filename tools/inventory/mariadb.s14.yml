dialect: mariadb
engine: MariaDB Server
version: "11.x (current)"
source: https://mariadb.com/docs/server/reference/sql-statements

statements:
  - id: alter_function
    name: ALTER FUNCTION
    doc: https://mariadb.com/docs/server/reference/sql-statements/data-definition/alter/alter-function
    tier: high
    probes:
      - id: contains_sql
        sql: "ALTER FUNCTION f CONTAINS SQL;"
      - id: no_sql
        sql: "ALTER FUNCTION f NO SQL;"
      - id: reads_sql_data
        sql: "ALTER FUNCTION f READS SQL DATA;"
      - id: modifies_sql_data
        sql: "ALTER FUNCTION f MODIFIES SQL DATA;"
      - id: sql_security_definer
        sql: "ALTER FUNCTION f SQL SECURITY DEFINER;"
      - id: sql_security_invoker
        sql: "ALTER FUNCTION f SQL SECURITY INVOKER;"
      - id: comment
        sql: "ALTER FUNCTION f COMMENT 'string';"
      - id: multiple_characteristics
        sql: "ALTER FUNCTION f READS SQL DATA SQL SECURITY INVOKER COMMENT 'string';"
      - id: schema_qualified_name
        sql: "ALTER FUNCTION s.f COMMENT 'string';"
      - id: no_characteristic
        sql: "ALTER FUNCTION f;"
        note: The syntax block shows characteristic as optional ([characteristic ...]).
    examples:
      - "ALTER FUNCTION hello SQL SECURITY INVOKER;"

  - id: drop_function
    name: DROP FUNCTION
    doc: https://mariadb.com/docs/server/server-usage/stored-routines/stored-functions/drop-function
    tier: high
    probes:
      - id: basic
        sql: "DROP FUNCTION f;"
      - id: if_exists
        sql: "DROP FUNCTION IF EXISTS f;"
      - id: schema_qualified_name
        sql: "DROP FUNCTION s.f;"
    examples:
      - "DROP FUNCTION hello;"
      - "DROP FUNCTION IF EXISTS hello;"
