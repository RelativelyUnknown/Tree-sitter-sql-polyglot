      - { id: select_into_variable, sql: "DECLARE x INT; BEGIN SELECT COUNT(*) INTO :x FROM t; RETURN x; END;" }
      - id: bind_variable_in_sql
        sql: "DECLARE x INT DEFAULT 5; BEGIN INSERT INTO t (id) VALUES (:x); RETURN x; END;"
        note: "The DECLARE page defines \"<variable_name> [<type>] [ { DEFAULT | := } <expression>]\"; assignment statements \"name := expression;\" and colon-prefixed references inside SQL appear throughout the DECLARE, LET and loop examples."

  - id: scripting_if
    name: "IF (Snowflake Scripting)"
    doc: https://docs.snowflake.com/en/sql-reference/snowflake-scripting/if
    tier: high
    probes:
      - { id: if_then, sql: "BEGIN IF (x = 1) THEN RETURN 'one'; END IF; END;" }
      - { id: if_else, sql: "BEGIN IF (x = 1) THEN RETURN 'one'; ELSE RETURN 'other'; END IF; END;" }
      - { id: if_elseif_else, sql: "BEGIN IF (flag = 1) THEN RETURN 'one'; ELSEIF (flag = 2) THEN RETURN 'two'; ELSE RETURN 'Unexpected input.'; END IF; END;" }
    examples:
      - |-
        CREATE OR REPLACE PROCEDURE example_if(flag INTEGER)
        RETURNS VARCHAR
        LANGUAGE SQL
        AS
        $$
        BEGIN
          IF (FLAG = 1) THEN
            RETURN 'one';
          ELSEIF (FLAG = 2) THEN
            RETURN 'two';
          ELSE
            RETURN 'Unexpected input.';
          END IF;
        END;
        $$
        ;

