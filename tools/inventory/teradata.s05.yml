dialect: teradata
engine: Teradata Vantage (Enterprise IntelliFlex) and VantageCloud Lake
version: "20.00"
source: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/DXllu86_qUx3dJlXfCkc6Q

statements:
  - id: drop_index
    name: DROP INDEX
    doc: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/ydR2O~9ENPIIQX2hBl3MvQ
    tier: high
    probes:
      - id: named_on_table
        sql: "DROP INDEX idx ON t;"
      - id: qualified_named_on_qualified_table
        sql: "DROP INDEX db.idx ON db.t;"
      - id: unnamed_single_column
        sql: "DROP INDEX (c) ON t;"
      - id: unnamed_composite
        sql: "DROP INDEX (c1, c2) ON t;"
      - id: on_temporary_table
        sql: "DROP INDEX idx ON TEMPORARY t;"
      - id: on_join_index
        sql: "DROP INDEX idx ON ji;"
      - id: order_by_values
        sql: "DROP INDEX idx ORDER BY VALUES (c) ON t;"
      - id: order_by_hash
        sql: "DROP INDEX (c1) ORDER BY HASH (c2) ON t;"
      - id: order_by_default
        sql: "DROP INDEX idx ORDER BY (c) ON t;"
      - id: no_semicolon
        sql: "DROP INDEX idx ON t"
    examples:
      - "DROP INDEX index_1 ON table_5;"
      - "DROP INDEX (name) ON Employee;"
      - "DROP INDEX (column_1, column_2) ON table_6;"

  - id: drop_join_index
    name: DROP JOIN INDEX
    doc: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/d4omNWkBMksz9yqQHoPRpQ
    tier: high
    probes:
      - id: basic
        sql: "DROP JOIN INDEX ji;"
      - id: qualified
        sql: "DROP JOIN INDEX db.ji;"
    examples:
      - "DROP JOIN INDEX ji_emp;"
