  - id: merge
    name: "MERGE"
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/merge-transact-sql
    tier: high
    probes:
      - id: matched_update_not_matched_insert
        sql: "MERGE t AS tgt USING u AS src ON tgt.id = src.id WHEN MATCHED THEN UPDATE SET tgt.c = src.c WHEN NOT MATCHED THEN INSERT (id, c) VALUES (src.id, src.c);"
      - id: into
        sql: "MERGE INTO t USING u ON t.id = u.id WHEN MATCHED THEN DELETE;"
      - id: matched_and_condition
        sql: "MERGE t USING u ON t.id = u.id WHEN MATCHED AND t.q - u.q <= 0 THEN DELETE WHEN MATCHED THEN UPDATE SET t.q = t.q - u.q;"
      - id: not_matched_by_target
        sql: "MERGE t USING u ON t.id = u.id WHEN NOT MATCHED BY TARGET THEN INSERT (id) VALUES (u.id);"
      - id: not_matched_and_condition
        sql: "MERGE t USING u ON t.id = u.id WHEN NOT MATCHED AND u.c > 0 THEN INSERT (id, c) VALUES (u.id, u.c);"
      - id: not_matched_by_source_delete
        sql: "MERGE t USING u ON t.id = u.id WHEN NOT MATCHED BY SOURCE THEN DELETE;"
      - id: not_matched_by_source_and_update
        sql: "MERGE t USING u ON t.id = u.id WHEN NOT MATCHED BY SOURCE AND t.c > 0 THEN UPDATE SET t.c = 0;"
      - id: insert_default_values
        sql: "MERGE t USING u ON t.id = u.id WHEN NOT MATCHED THEN INSERT DEFAULT VALUES;"
      - id: insert_without_column_list
        sql: "MERGE t USING u ON t.id = u.id WHEN NOT MATCHED THEN INSERT VALUES (u.id, u.c);"
      - id: all_three_clauses
        sql: "MERGE t USING u ON t.id = u.id WHEN MATCHED THEN UPDATE SET c = u.c WHEN NOT MATCHED BY TARGET THEN INSERT (id, c) VALUES (u.id, u.c) WHEN NOT MATCHED BY SOURCE THEN DELETE;"
      - id: top
        sql: "MERGE TOP (10) t USING u ON t.id = u.id WHEN MATCHED THEN DELETE;"
      - id: top_percent
        sql: "MERGE TOP (10) PERCENT INTO t USING u ON t.id = u.id WHEN MATCHED THEN DELETE;"
      - id: with_cte
        sql: "WITH src AS (SELECT id, c FROM u) MERGE t USING src ON t.id = src.id WHEN MATCHED THEN UPDATE SET c = src.c;"
      - id: cte_target
        sql: "WITH tgt AS (SELECT id, c FROM t WHERE c > 0) MERGE tgt USING u ON tgt.id = u.id WHEN MATCHED THEN UPDATE SET c = u.c;"
      - id: table_variable_target
        sql: "MERGE @tv AS tgt USING u ON tgt.id = u.id WHEN MATCHED THEN DELETE;"
      - id: merge_hint
        sql: "MERGE t WITH (HOLDLOCK) AS tgt USING u AS src ON tgt.id = src.id WHEN MATCHED THEN DELETE;"
      - id: merge_hint_index
        sql: "MERGE t WITH (SERIALIZABLE, INDEX (ix_id)) USING u ON t.id = u.id WHEN MATCHED THEN DELETE;"
      - id: merge_hint_index_equals
        sql: "MERGE t WITH (INDEX = ix_id) USING u ON t.id = u.id WHEN MATCHED THEN DELETE;"
      - id: values_source
        sql: "MERGE t USING (VALUES ('a', 'b'), ('c', 'd')) AS s (x, y) ON t.x = s.x WHEN NOT MATCHED BY TARGET THEN INSERT (x, y) VALUES (x, y);"
      - id: derived_table_source
        sql: "MERGE t USING (SELECT id, SUM(q) FROM u GROUP BY id) AS s (id, q) ON (t.id = s.id) WHEN MATCHED THEN UPDATE SET t.q = t.q - s.q;"
      - id: join_source
        sql: "MERGE t USING (u JOIN v ON u.id = v.id) ON t.id = u.id WHEN MATCHED THEN UPDATE SET t.c = v.c;"
      - id: output_action
        sql: "MERGE t USING u ON t.id = u.id WHEN MATCHED THEN UPDATE SET c = u.c WHEN NOT MATCHED THEN INSERT (id, c) VALUES (u.id, u.c) OUTPUT $action, INSERTED.*, DELETED.*;"
      - id: output_into
        sql: "MERGE t USING u ON t.id = u.id WHEN MATCHED THEN DELETE OUTPUT $action INTO @changes;"
      - id: option
        sql: "MERGE t USING u ON t.id = u.id WHEN MATCHED THEN DELETE OPTION (LOOP JOIN);"
      - id: graph_match_on
        sql: "MERGE livesIn USING ((SELECT @p, @c, @s) AS T (pid, cid, s) JOIN Person ON T.pid = Person.ID JOIN City ON T.cid = City.ID) ON MATCH (Person-(livesIn)->City) WHEN MATCHED THEN UPDATE SET StreetAddress = @s WHEN NOT MATCHED THEN INSERT ($from_id, $to_id, StreetAddress) VALUES (Person.$node_id, City.$node_id, @s);"
    examples:
      - |-
        MERGE INTO Sales.SalesReason AS tgt
        USING (
            VALUES ('Recommendation', 'Other'),
                ('Review', 'Marketing'),
                ('Internet', 'Promotion')
            ) AS src(NewName, NewReasonType)
            ON tgt.Name = src.NewName
        WHEN MATCHED
            THEN
                UPDATE
                SET ReasonType = src.NewReasonType
        WHEN NOT MATCHED BY TARGET
            THEN
                INSERT (Name, ReasonType)
                VALUES (NewName, NewReasonType)
        OUTPUT $action
        INTO @SummaryOfChanges;
      - |-
        CREATE PROCEDURE Production.usp_UpdateInventory @OrderDate DATETIME
        AS
        MERGE Production.ProductInventory AS tgt
        USING (
            SELECT ProductID,
                SUM(OrderQty)
            FROM Sales.SalesOrderDetail AS sod
            INNER JOIN Sales.SalesOrderHeader AS soh
                ON sod.SalesOrderID = soh.SalesOrderID
                    AND soh.OrderDate = @OrderDate
            GROUP BY ProductID
            ) AS src(ProductID, OrderQty)
            ON (tgt.ProductID = src.ProductID)
        WHEN MATCHED
            AND tgt.Quantity - src.OrderQty <= 0
            THEN
                DELETE
        WHEN MATCHED
            THEN
                UPDATE
                SET tgt.Quantity = tgt.Quantity - src.OrderQty,
                    tgt.ModifiedDate = GETDATE()
        OUTPUT $action,
            Inserted.ProductID,
            Inserted.Quantity,
            Inserted.ModifiedDate,
            Deleted.ProductID,
            Deleted.Quantity,
            Deleted.ModifiedDate;
      - |-
        INSERT INTO Production.UpdatedInventory
        SELECT ProductID, LocationID, NewQty, PreviousQty
        FROM (
            MERGE Production.ProductInventory AS pi
            USING (
                SELECT ProductID, SUM(OrderQty)
                FROM Sales.SalesOrderDetail AS sod
                INNER JOIN Sales.SalesOrderHeader AS soh
                    ON sod.SalesOrderID = soh.SalesOrderID
                        AND soh.OrderDate BETWEEN '20030701'
                            AND '20030731'
                GROUP BY ProductID
                ) AS src(ProductID, OrderQty)
                ON pi.ProductID = src.ProductID
            WHEN MATCHED
                AND pi.Quantity - src.OrderQty >= 0
                THEN
                    UPDATE SET pi.Quantity = pi.Quantity - src.OrderQty
            WHEN MATCHED
                AND pi.Quantity - src.OrderQty <= 0
                THEN
                    DELETE
            OUTPUT $action,
                Inserted.ProductID,
                Inserted.LocationID,
                Inserted.Quantity AS NewQty,
                Deleted.Quantity AS PreviousQty
            ) AS Changes(Action, ProductID, LocationID, NewQty, PreviousQty)
        WHERE Action = 'UPDATE';

