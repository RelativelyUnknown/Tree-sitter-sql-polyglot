dialect: teradata
engine: Teradata Vantage (Enterprise IntelliFlex) and VantageCloud Lake
version: "20.00"
source: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/DXllu86_qUx3dJlXfCkc6Q

statements: []

expressions:
  - id: a_integer_literals
    name: Integer literals
    doc: https://docs.teradata.com/reader/lRnURD5njdYWi5Bs8dw7og/_AEtGvWw9taKjoSE9IEjmg
    tier: high
    probes:
      - { id: unsigned, sql: "SELECT 127, 32767, 2147483647;" }
      - { id: signed, sql: "SELECT -128, +36, -2147483648;" }
    examples:
      - |-
        SELECT ProdID
        FROM PartsTbl
        WHERE CustID = CAST(9876543210 AS NUMBER);

  - id: a_hex_integer_literals
    name: Hexadecimal integer literals
    doc: https://docs.teradata.com/reader/lRnURD5njdYWi5Bs8dw7og/tjgBpU1Z~vZvl7qVhrc9bg
    tier: medium
    probes:
      - { id: default_x, sql: "SELECT '1F'X;" }
      - { id: xi, sql: "SELECT '1F'XI;" }
      - { id: x1, sql: "SELECT '7F'X1;" }
      - { id: x2, sql: "SELECT 'FFFF'X2;" }
      - { id: x4, sql: "SELECT '7FFFFFFF'X4;" }
      - { id: x8, sql: "SELECT '7FFFFFFFFFFFFFFF'X8;" }
    # Syntax block lists the suffix as X [ | [1|2|4|8] ]; XI, XI1, XI2, XI4, XI8 appear in the table on the same page.
  - id: a_decimal_literals
    name: Decimal literals
    doc: https://docs.teradata.com/reader/lRnURD5njdYWi5Bs8dw7og/NirVysg~lrdbt4kmK6ddYQ
    tier: high
    probes:
      - { id: n_dot_n, sql: "SELECT 3.14159, -88.234, +0.5;" }
      - { id: trailing_point, sql: "SELECT 253.;" }
      - { id: leading_point, sql: "SELECT .29;" }
      - { id: large_integer, sql: "SELECT 2147483650;" }

  - id: a_float_literals
    name: Floating point literals
    doc: https://docs.teradata.com/reader/lRnURD5njdYWi5Bs8dw7og/KqSqSmNLjf4HTX4kt9WDmA
    tier: high
    probes:
      - { id: ne, sql: "SELECT 1E1, 18E-3;" }
      - { id: n_dot_ne, sql: "SELECT 1.4E6, -2.5E+3;" }
      - { id: n_dot_e, sql: "SELECT 5.E2;" }
      - { id: dot_ne, sql: "SELECT .5E2;" }

  - id: a_hex_byte_literals
    name: Hexadecimal byte literals
