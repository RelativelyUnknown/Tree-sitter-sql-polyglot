dialect: cockroachdb
engine: CockroachDB
version: "v26.3 (stable)"
source: https://www.cockroachlabs.com/docs/stable/sql-statements

statements:
  - id: drop_index
    name: DROP INDEX
    doc: https://www.cockroachlabs.com/docs/stable/drop-index
    tier: high
    probes:
      - id: basic
        sql: "DROP INDEX t@idx;"
      - id: if_exists
        sql: "DROP INDEX IF EXISTS t@idx;"
      - id: multiple
        sql: "DROP INDEX t@idx, t2@idx2;"
      - id: cascade
        sql: "DROP INDEX t@idx CASCADE;"
      - id: restrict
        sql: "DROP INDEX t@idx RESTRICT;"
      - id: concurrently
        sql: "DROP INDEX CONCURRENTLY t@idx;"
      - id: index_name_only
        sql: "DROP INDEX idx;"
    examples:
      - "DROP INDEX users@users_name_city_idx;"

  - id: drop_procedure
    name: DROP PROCEDURE
    doc: https://www.cockroachlabs.com/docs/stable/drop-procedure
    tier: high
    probes:
      - id: basic
        sql: "DROP PROCEDURE p;"
      - id: if_exists
        sql: "DROP PROCEDURE IF EXISTS p;"
      - id: with_params
        sql: "DROP PROCEDURE p(INT, TEXT);"
      - id: multiple
        sql: "DROP PROCEDURE p1, p2;"
    examples:
      - "DROP PROCEDURE delete_earliest_histories;"
