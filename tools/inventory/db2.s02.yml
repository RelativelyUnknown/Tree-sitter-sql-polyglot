dialect: db2
engine: IBM Db2 for Linux, UNIX and Windows
version: "12.1"
source: https://www.ibm.com/docs/en/db2/12.1.x?topic=reference-statements

statements:
  - id: alter_procedure_external
    name: ALTER PROCEDURE (external)
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-alter-procedure-external
    tier: high
    probes:
      - id: external_name_string
        sql: "ALTER PROCEDURE p EXTERNAL NAME 'lib!proc';"
      - id: external_name_identifier
        sql: "ALTER PROCEDURE p EXTERNAL NAME proc1;"
      - id: fenced
        sql: "ALTER PROCEDURE p FENCED;"
      - id: not_fenced
        sql: "ALTER PROCEDURE p NOT FENCED;"
      - id: external_action
        sql: "ALTER PROCEDURE p EXTERNAL ACTION;"
      - id: no_external_action
        sql: "ALTER PROCEDURE p NO EXTERNAL ACTION;"
      - id: threadsafe
        sql: "ALTER PROCEDURE p THREADSAFE;"
      - id: not_threadsafe
        sql: "ALTER PROCEDURE p NOT THREADSAFE;"
      - id: new_savepoint_level
        sql: "ALTER PROCEDURE p NEW SAVEPOINT LEVEL;"
      - id: designator_with_types
        sql: "ALTER PROCEDURE s.p (INTEGER, VARCHAR(10)) NOT FENCED;"
      - id: designator_specific
        sql: "ALTER SPECIFIC PROCEDURE sp1 NOT FENCED;"
      - id: combined_options
        sql: "ALTER PROCEDURE p EXTERNAL NAME 'lib!proc' FENCED NO EXTERNAL ACTION NOT THREADSAFE NEW SAVEPOINT LEVEL;"
    examples:
      - "ALTER PROCEDURE PARTS_ON_HAND() NOT FENCED;"

  - id: alter_procedure_sourced
    name: ALTER PROCEDURE (sourced)
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-alter-procedure-sourced
    tier: high
    probes:
      - id: alter_parameter_set_data_type
        sql: "ALTER PROCEDURE p ALTER PARAMETER c SET DATA TYPE DECIMAL(5,2);"
      - id: alter_multiple_parameters
        sql: "ALTER PROCEDURE p ALTER PARAMETER a SET DATA TYPE INTEGER, ALTER PARAMETER b SET DATA TYPE VARCHAR(20);"
      - id: options_add
        sql: "ALTER PROCEDURE p OPTIONS (ADD opt 'val');"
      - id: options_set
        sql: "ALTER PROCEDURE p OPTIONS (SET opt 'val');"
      - id: options_drop
        sql: "ALTER PROCEDURE p OPTIONS (DROP opt);"
      - id: options_multiple
        sql: "ALTER PROCEDURE p OPTIONS (ADD a 'x', SET b 'y', DROP c);"
      - id: designator_with_types
        sql: "ALTER PROCEDURE s.p (INTEGER, VARCHAR(10)) OPTIONS (SET opt 'val');"
      - id: designator_specific
        sql: "ALTER SPECIFIC PROCEDURE sp1 ALTER PARAMETER c SET DATA TYPE INTEGER;"
    examples:
      - "ALTER PROCEDURE FEDEMPLOYEE ALTER PARAMETER SALARY SET DATA TYPE DECIMAL (5,2);"
