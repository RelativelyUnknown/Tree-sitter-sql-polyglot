dialect: db2
engine: IBM Db2 for Linux, UNIX and Windows
version: "11.5"
source: https://www.ibm.com/docs/en/db2/11.5.x?topic=reference-statements

statements:
  - id: update
    name: UPDATE
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-update
    tier: high
    probes:
      - { id: basic, sql: "UPDATE t SET c = 1 WHERE d = 2;" }
      - { id: no_where, sql: "UPDATE t SET c = 1;" }
      - { id: set_null_default, sql: "UPDATE t SET c = NULL, d = DEFAULT;" }
      - { id: set_multi_column, sql: "UPDATE t SET (a, b) = (1, NULL) WHERE d = 2;" }
      - { id: set_row_fullselect, sql: "UPDATE t SET (a, b) = (SELECT x, y FROM s WHERE s.k = t.k) WHERE d = 2;" }
      - { id: set_scalar_subquery, sql: "UPDATE t SET a = (SELECT MAX(x) FROM s) WHERE d = 2;" }
      - { id: set_attribute, sql: "UPDATE t SET c..radius = 5, c..center..x = 1 WHERE id = 9;" }
      - { id: set_multi_attribute, sql: "UPDATE t SET (o, c..radius, c..center..x) = ('B', 5, 1) WHERE id = 9;" }
      - { id: correlation_name, sql: "UPDATE t AS x SET x.c = 1 WHERE x.d = 2;" }
      - { id: correlation_columns, sql: "UPDATE t AS x (a, b) SET a = 1 WHERE b = 2;" }
      - { id: correlation_no_as, sql: "UPDATE t x SET x.c = 1;" }
      - { id: only, sql: "UPDATE ONLY (t) SET c = 1;" }
      - { id: view_target, sql: "UPDATE v SET c = 1 WHERE d = 2;" }
      - { id: fullselect_target, sql: "UPDATE (SELECT a, b FROM t) AS x (a, b) SET a = 1 WHERE b = 2;" }
      - { id: include_columns, sql: "UPDATE (SELECT a FROM t) INCLUDE (n INTEGER) SET n = 1, a = n;" }
      - { id: with_cte, sql: "UPDATE (WITH w AS (SELECT a, b FROM t) SELECT a, b FROM w) SET a = 1;" }
      - { id: from_clause, sql: "UPDATE t SET t.c = s.c FROM s WHERE t.k = s.k;" }
      - { id: from_join, sql: "UPDATE t SET t.c = s.c FROM u JOIN s ON u.k = s.k WHERE t.k = u.k;" }
      - { id: from_subquery, sql: "UPDATE t SET t.c = s.m FROM (SELECT k, MAX(x) m FROM u GROUP BY k) s WHERE t.k = s.k;" }
      - { id: for_portion_of_business_time, sql: "UPDATE t FOR PORTION OF BUSINESS_TIME FROM '2020-01-01' TO '2021-01-01' SET c = 1 WHERE d = 2;" }
      - { id: order_by_fetch_first, sql: "UPDATE t SET c = 1 ORDER BY d FETCH FIRST 10 ROWS ONLY;" }
      - { id: offset_fetch, sql: "UPDATE t SET c = 1 ORDER BY d OFFSET 5 ROWS FETCH FIRST 10 ROWS ONLY;" }
      - { id: fetch_first_only, sql: "UPDATE t SET c = 1 FETCH FIRST 10 ROWS ONLY;" }
      - { id: offset_only, sql: "UPDATE t SET c = 1 OFFSET 5 ROWS;" }
      - { id: isolation_ur, sql: "UPDATE t SET c = 1 WITH UR;" }
      - { id: isolation_cs, sql: "UPDATE t SET c = 1 WHERE d = 2 WITH CS;" }
      - { id: isolation_rs_skip_locked, sql: "UPDATE t SET c = 1 WITH RS SKIP LOCKED DATA;" }
      - { id: isolation_rr, sql: "UPDATE t SET c = 1 WITH RR;" }
      - { id: wait_for_outcome, sql: "UPDATE t SET c = 1 WAIT FOR OUTCOME;" }
      - { id: nowait, sql: "UPDATE t SET c = 1 NOWAIT;" }
      - { id: wait_time, sql: "UPDATE t SET c = 1 WAIT 5;" }
      - { id: positioned, sql: "UPDATE t SET c = 1 WHERE CURRENT OF cur;" }
      - { id: positioned_correlation, sql: "UPDATE t AS x SET x.c = 1 WHERE CURRENT OF cur;" }
    examples:
      - "UPDATE EMPLOYEE SET JOB = 'LABORER' WHERE EMPNO = '000290';"
      - "UPDATE PROJECT SET PRSTAFF = PRSTAFF + 1.5 WHERE DEPTNO = 'D21';"
      - "UPDATE EMPLOYEE SET ( JOB, SALARY, BONUS, COMM ) = (NULL , 0, 0, 0 ) WHERE WORKDEPT = 'E21' AND JOB <> 'MANAGER';"

  - id: values
    name: VALUES
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-values
    tier: high
    probes:
      - { id: single_value, sql: "VALUES 1;" }
      - { id: single_row_parens, sql: "VALUES (1, 'a', NULL);" }
      - { id: multi_row, sql: "VALUES (1, 'a'), (2, 'b');" }
      - { id: multi_row_scalar, sql: "VALUES 1, 2, 3;" }
      - { id: expression, sql: "VALUES CURRENT DATE;" }
      - { id: function_call, sql: "VALUES UPPER('a');" }
      - { id: union, sql: "VALUES 1 UNION ALL VALUES 2;" }
      - { id: order_by, sql: "VALUES (2), (1) ORDER BY 1;" }
      - { id: fetch_first, sql: "VALUES (1), (2) FETCH FIRST 1 ROW ONLY;" }
      - { id: isolation, sql: "VALUES (1), (2) WITH UR;" }
