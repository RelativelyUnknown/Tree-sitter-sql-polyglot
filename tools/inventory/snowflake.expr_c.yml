          SYSTEM$TYPEOF(
            [1, 2, 3]::ARRAY(NUMBER)
          ) AS structured_array,
          SYSTEM$TYPEOF(
            [1, 2, 3]
          ) AS semi_structured_array;
      - |-
        SELECT
          SYSTEM$TYPEOF(
            {
              'a_key': 'a_val',
              'b_key': 'b_val'
            }::MAP(VARCHAR, VARCHAR)
          ) AS map_example;
      - |-
