  - id: create_index
    name: CREATE INDEX
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/CREATE-INDEX.html
    tier: high
    probes:
      - id: basic
        sql: "CREATE INDEX idx ON t (c);"
      - id: unique
        sql: "CREATE UNIQUE INDEX s.idx ON s.t (c, d);"
      - id: if_not_exists
        sql: "CREATE INDEX IF NOT EXISTS idx ON t (c);"
      - id: bitmap
        sql: "CREATE BITMAP INDEX idx ON t (c);"
      - id: asc_desc
        sql: "CREATE INDEX idx ON t (c ASC, d DESC);"
      - id: function_based
        sql: "CREATE INDEX idx ON t (UPPER(c));"
      - id: expression
        sql: "CREATE INDEX idx ON t (c + (c * d));"
      - id: table_alias_expression
        sql: "CREATE INDEX idx ON t x (EXTRACTVALUE(VALUE(x), '/W/Area'));"
      - id: multivalue
        sql: "CREATE MULTIVALUE INDEX idx ON t x (x.jcol.credit_score.numberOnly());"
      - id: json_index
        sql: "CREATE JSON INDEX idx ON t (doc);"
        note: "26ai create_index syntax: CREATE [ JSON ] [ UNIQUE | BITMAP | MULTIVALUE | SPARSE | DENSE ] INDEX."
      - id: cluster_index
        sql: "CREATE INDEX idx ON CLUSTER cl;"
      - id: bitmap_join_index
        sql: "CREATE BITMAP INDEX idx ON t (u.c) FROM t, u WHERE t.id = u.id;"
      - id: compress
        sql: "CREATE INDEX idx ON t (c, d) COMPRESS 1;"
      - id: compress_advanced
        sql: "CREATE INDEX idx ON t (c) COMPRESS ADVANCED LOW;"
      - id: index_attributes
        sql: "CREATE INDEX idx ON t (c) TABLESPACE users PCTFREE 10 INITRANS 2 STORAGE (INITIAL 64K) NOLOGGING ONLINE PARALLEL 4;"
      - id: reverse_nosort
        sql: "CREATE INDEX idx ON t (c) REVERSE NOSORT;"
      - id: invisible
        sql: "CREATE INDEX idx ON t (c) INVISIBLE;"
      - id: unusable
        sql: "CREATE INDEX idx ON t (c) UNUSABLE;"
      - id: deferred_invalidation
        sql: "CREATE INDEX idx ON t (c) DEFERRED INVALIDATION;"
      - id: indexing_partial
        sql: "CREATE INDEX idx ON t (c) LOCAL INDEXING PARTIAL;"
      - id: local
        sql: "CREATE INDEX idx ON t (c) LOCAL;"
      - id: local_partitions
        sql: "CREATE BITMAP INDEX idx ON t (c) LOCAL (PARTITION p1 TABLESPACE ts1, PARTITION p2, PARTITION p3 TABLESPACE ts2) TABLESPACE ts3;"
      - id: local_store_in
        sql: "CREATE INDEX idx ON t (c) LOCAL STORE IN (ts1, ts2);"
      - id: global_partition_by_range
        sql: "CREATE INDEX idx ON t (c) GLOBAL PARTITION BY RANGE (c) (PARTITION p1 VALUES LESS THAN (1000), PARTITION p2 VALUES LESS THAN (MAXVALUE));"
      - id: global_partition_by_hash
        sql: "CREATE INDEX idx ON t (c) GLOBAL PARTITION BY HASH (c) PARTITIONS 4;"
      - id: domain_index
        sql: "CREATE INDEX idx ON t (doc) INDEXTYPE IS ctxsys.context PARAMETERS ('SYNC (ON COMMIT)');"
      - id: xmlindex
        sql: "CREATE INDEX idx ON t (x) INDEXTYPE IS XDB.XMLINDEX;"
      - id: annotations
        sql: "CREATE INDEX idx ON t (c) ANNOTATIONS (Display 'C index');"
      - id: ilm
        sql: "CREATE INDEX idx ILM (ADD POLICY SEGMENT TIER TO LOW_COST_TBS) ON t (c);"
    examples:
      - |-
        CREATE INDEX ord_customer_ix_demo
           ON orders (customer_id, sales_rep_id)
           COMPRESS 1;
      - "CREATE INDEX upper_ix ON employees (UPPER(last_name));"
      - |-
        CREATE INDEX cost_ix ON sales (amount_sold)
           GLOBAL PARTITION BY RANGE (amount_sold)
              (PARTITION p1 VALUES LESS THAN (1000),
               PARTITION p2 VALUES LESS THAN (2500),
               PARTITION p3 VALUES LESS THAN (MAXVALUE));
      - |-
        CREATE BITMAP INDEX product_bm_ix
           ON hash_products(list_price)
           LOCAL(PARTITION ix_p1 TABLESPACE tbs_01,
                 PARTITION ix_p2,
                 PARTITION ix_p3 TABLESPACE tbs_02,
                 PARTITION ix_p4 TABLESPACE tbs_03)
           TABLESPACE tbs_04;
      - |-
        CREATE MULTIVALUE INDEX mvi_1 ON mytable t
              (t.jcol.credit_score.numberOnly());

