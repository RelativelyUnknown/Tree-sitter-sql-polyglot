dialect: hive
engine: Apache Hive
version: "4.x"
source: https://hive.apache.org/docs/latest/language/languagemanual/

statements:
  - id: alter_view_properties
    name: ALTER VIEW SET TBLPROPERTIES
    doc: https://hive.apache.org/docs/latest/language/languagemanual-ddl/
    tier: high
    probes:
      - id: set_tblproperties
        sql: "ALTER VIEW v SET TBLPROPERTIES ('comment' = 'x', 'k' = 'v');"
      - id: set_tblproperties_qualified
        sql: "ALTER VIEW db.v SET TBLPROPERTIES ('k' = 'v');"

  - id: alter_view_as_select
    name: ALTER VIEW AS SELECT
    doc: https://hive.apache.org/docs/latest/language/languagemanual-ddl/
    tier: high
    probes:
      - id: as_select
        sql: "ALTER VIEW v AS SELECT a, b FROM t;"
      - id: as_select_qualified
        sql: "ALTER VIEW db.v AS SELECT * FROM t WHERE a > 1;"
