dialect: teradata
engine: Teradata Vantage (Enterprise IntelliFlex) and VantageCloud Lake
version: "20.00"
source: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/DXllu86_qUx3dJlXfCkc6Q

statements:
  - id: create_table
    name: CREATE TABLE / CREATE TABLE AS
    doc: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/RFxh4Af6w_Z9ZLMTiFoxrg
    tier: high
    probes:
      - id: basic
        sql: "CREATE TABLE t (c INTEGER, d VARCHAR(10));"
      - id: set_table
        sql: "CREATE SET TABLE t (c INTEGER);"
      - id: multiset_table
        sql: "CREATE MULTISET TABLE t (c INTEGER);"
      - id: global_temporary
        sql: "CREATE GLOBAL TEMPORARY TABLE t (c INTEGER) ON COMMIT PRESERVE ROWS;"
      - id: multiset_global_temporary
        sql: "CREATE MULTISET GLOBAL TEMPORARY TABLE t (c INTEGER) ON COMMIT DELETE ROWS;"
      - id: volatile
        sql: "CREATE VOLATILE TABLE t (c INTEGER) ON COMMIT PRESERVE ROWS;"
      - id: set_volatile
        sql: "CREATE SET VOLATILE TABLE t (c INTEGER);"
      - id: qualified_name
        sql: "CREATE TABLE db1.t (c INTEGER);"
      - id: map
        sql: "CREATE TABLE t, MAP = m1 (c INTEGER);"
      - id: map_colocate
        sql: "CREATE TABLE t, MAP = m1 COLOCATE USING colo1 (c INTEGER);"
