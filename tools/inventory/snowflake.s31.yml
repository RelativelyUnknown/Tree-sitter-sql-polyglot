dialect: snowflake
engine: Snowflake
version: "current (docs read 2026-10-04)"
source: https://docs.snowflake.com/en/sql-reference/sql-all

statements:
  - id: show_rules_in_event_routing_table
    name: "SHOW RULES IN EVENT ROUTING TABLE"
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-rules-in-event-routing-table
    tier: low
    probes:
      - id: basic
        sql: "SHOW RULES IN EVENT ROUTING TABLE (ert);"
  - id: show_run_in_experiment
    name: "SHOW RUN … IN EXPERIMENT"
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-run-in-experiment
    tier: low
    probes:
      - id: metrics
        sql: "SHOW RUN METRICS IN EXPERIMENT e;"
      - id: metrics_options
        sql: "SHOW RUN METRICS LIKE '%loss%' IN EXPERIMENT e RUN r LIMIT 10 FROM 'a';"
      - id: parameters
        sql: "SHOW RUN PARAMETERS IN EXPERIMENT e;"
      - id: parameters_options
        sql: "SHOW RUN PARAMETERS LIKE '%lr%' IN EXPERIMENT e RUN r LIMIT 10 FROM 'a';"
  - id: show_runs_in_experiment
    name: "SHOW RUNS IN EXPERIMENT"
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-runs-in-experiment
    tier: low
    probes:
      - id: basic
        sql: "SHOW RUNS IN EXPERIMENT e;"
      - id: like
        sql: "SHOW RUNS LIKE '%test%' IN EXPERIMENT e;"
  - id: show_semantic_dimensions
    name: "SHOW SEMANTIC DIMENSIONS"
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-semantic-dimensions
    tier: low
    probes:
      - id: basic
        sql: "SHOW SEMANTIC DIMENSIONS;"
      - id: like_in_view
        sql: "SHOW SEMANTIC DIMENSIONS LIKE '%x%' IN sv STARTS WITH 'a' LIMIT 10;"
      - id: in_account
        sql: "SHOW SEMANTIC DIMENSIONS IN ACCOUNT;"
      - id: in_database
        sql: "SHOW SEMANTIC DIMENSIONS IN DATABASE db;"
      - id: in_schema
        sql: "SHOW SEMANTIC DIMENSIONS IN SCHEMA db.s;"
  - id: show_semantic_dimensions_for_metric
    name: "SHOW SEMANTIC DIMENSIONS FOR METRIC"
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-semantic-dimensions-for-metric
    tier: low
    probes:
      - id: basic
        sql: "SHOW SEMANTIC DIMENSIONS IN sv FOR METRIC m;"
      - id: options
        sql: "SHOW SEMANTIC DIMENSIONS LIKE '%x%' IN sv FOR METRIC m STARTS WITH 'a' LIMIT 10;"
  - id: show_semantic_facts
    name: "SHOW SEMANTIC FACTS"
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-semantic-facts
    tier: low
    probes:
      - id: basic
        sql: "SHOW SEMANTIC FACTS;"
      - id: like_in_view
        sql: "SHOW SEMANTIC FACTS LIKE '%x%' IN sv STARTS WITH 'a' LIMIT 10;"
      - id: in_schema
        sql: "SHOW SEMANTIC FACTS IN SCHEMA db.s;"
  - id: show_semantic_metrics
    name: "SHOW SEMANTIC METRICS"
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-semantic-metrics
    tier: low
    probes:
      - id: basic
        sql: "SHOW SEMANTIC METRICS;"
      - id: like_in_view
        sql: "SHOW SEMANTIC METRICS LIKE '%x%' IN sv STARTS WITH 'a' LIMIT 10;"
      - id: in_schema
        sql: "SHOW SEMANTIC METRICS IN SCHEMA db.s;"
  - id: show_semantic_views
    name: "SHOW SEMANTIC VIEWS"
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-semantic-views
    tier: low
    probes:
      - id: basic
        sql: "SHOW SEMANTIC VIEWS;"
      - id: terse
        sql: "SHOW TERSE SEMANTIC VIEWS;"
      - id: options
        sql: "SHOW SEMANTIC VIEWS LIKE '%x%' IN SCHEMA db.s STARTS WITH 'a' LIMIT 10 FROM 'b';"
      - id: in_account
