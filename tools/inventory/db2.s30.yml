dialect: db2
engine: IBM Db2 for Linux, UNIX and Windows
version: "12.1"
source: https://www.ibm.com/docs/en/db2/12.1.x?topic=reference-statements

statements:
  - id: connect_type1
    name: CONNECT (type 1)
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-connect-type-1
    tier: medium
    probes:
      - { id: no_operand, sql: "CONNECT;" }
      - { id: reset, sql: "CONNECT RESET;" }
      - { id: to_server, sql: "CONNECT TO sample;" }
      - { id: to_host_variable, sql: "CONNECT TO :srv;" }
      - { id: user_using, sql: "CONNECT TO sample USER fermat USING theorem;" }
      - { id: new_confirm, sql: "CONNECT TO sample USER fermat USING theorem NEW newpw CONFIRM newpw;" }
      - { id: lock_share, sql: "CONNECT TO sample IN SHARE MODE;" }
      - { id: lock_exclusive_single_member, sql: "CONNECT TO sample IN EXCLUSIVE MODE ON SINGLE MEMBER;" }
      - { id: apikey, sql: "CONNECT TO sample APIKEY 'k';" }
      - { id: accesstoken, sql: "CONNECT TO sample ACCESSTOKEN 'tok' ACCESSTOKENTYPE jwt;" }
      - { id: user_only, sql: "CONNECT USER fermat USING theorem;" }

  - id: connect_type2
    name: CONNECT (type 2)
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-connect-type-2
    tier: medium
    probes:
      - { id: no_operand, sql: "CONNECT;" }
      - { id: reset, sql: "CONNECT RESET;" }
      - { id: to_server, sql: "CONNECT TO sample;" }
      - { id: user_using, sql: "CONNECT TO sample USER fermat USING theorem;" }
      - { id: new_confirm, sql: "CONNECT TO sample USER fermat USING theorem NEW newpw CONFIRM newpw;" }
      - { id: change_password, sql: "CONNECT TO sample USER fermat USING theorem CHANGE PASSWORD;" }
      - { id: lock_mode, sql: "CONNECT TO sample IN SHARE MODE ON SINGLE MEMBER;" }
      - { id: accesstoken, sql: "CONNECT TO sample ACCESSTOKEN 'tok' ACCESSTOKENTYPE jwt;" }

  - id: create_alias
    name: CREATE ALIAS
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-create-alias
    tier: medium
    probes:
      - { id: table_alias, sql: "CREATE ALIAS a1 FOR t1;" }
      - { id: qualified, sql: "CREATE ALIAS s.a1 FOR TABLE s2.t1;" }
      - { id: or_replace, sql: "CREATE OR REPLACE ALIAS a1 FOR t1;" }
      - { id: public_alias, sql: "CREATE PUBLIC ALIAS SYSPUBLIC.a1 FOR TABLE t1;" }
      - { id: module_alias, sql: "CREATE ALIAS a1 FOR MODULE m1;" }
      - { id: sequence_alias, sql: "CREATE ALIAS a1 FOR SEQUENCE seq1;" }
    examples:
      - "CREATE ALIAS A1 FOR T1;"
      - "CREATE ALIAS HEDGES.A1 FOR MCKNIGHT.T1;"

  - id: create_global_temporary_table
    name: CREATE GLOBAL TEMPORARY TABLE
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-create-global-temporary-table
    tier: medium
    probes:
      - { id: columns, sql: "CREATE GLOBAL TEMPORARY TABLE t (c1 INTEGER NOT NULL, c2 VARCHAR(10));" }
      - { id: on_commit_delete, sql: "CREATE GLOBAL TEMPORARY TABLE t (c1 INTEGER) ON COMMIT DELETE ROWS;" }
      - { id: on_commit_preserve, sql: "CREATE GLOBAL TEMPORARY TABLE t (c1 INTEGER) ON COMMIT PRESERVE ROWS;" }
      - { id: not_logged, sql: "CREATE GLOBAL TEMPORARY TABLE t (c1 INTEGER) NOT LOGGED ON ROLLBACK PRESERVE ROWS;" }
      - { id: in_tablespace, sql: "CREATE GLOBAL TEMPORARY TABLE t (c1 INTEGER) IN ts1;" }
      - { id: distribute_hash, sql: "CREATE GLOBAL TEMPORARY TABLE t (c1 INTEGER) DISTRIBUTE BY HASH (c1);" }
      - { id: like_table, sql: "CREATE GLOBAL TEMPORARY TABLE t LIKE t1 INCLUDING COLUMN DEFAULTS;" }
      - { id: as_fullselect, sql: "CREATE GLOBAL TEMPORARY TABLE t AS (SELECT c1 FROM t1) WITH NO DATA;" }
    examples:
      - "CREATE GLOBAL TEMPORARY TABLE CURRENTMAP (CODE INTEGER NOT NULL, MEANING VARCHAR(254) NOT NULL);"
      - "CREATE GLOBAL TEMPORARY TABLE TMPDEPT (TMPDEPTNO CHAR(3) NOT NULL, TMPDEPTNAME VARCHAR(36) NOT NULL, TMPMGRNO CHAR(6), TMPLOCATION CHAR(16));"

  - id: create_module
    name: CREATE MODULE
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-create-module
    tier: medium
    probes:
      - { id: basic, sql: "CREATE MODULE m;" }
      - { id: qualified, sql: "CREATE MODULE s.m;" }
      - { id: or_replace, sql: "CREATE OR REPLACE MODULE m;" }
    examples:
      - "CREATE MODULE salesModule;"

  - id: create_role
    name: CREATE ROLE
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-create-role
    tier: medium
    probes:
      - { id: basic, sql: "CREATE ROLE r;" }
    examples:
      - "CREATE ROLE DOCTOR;"

  - id: create_schema
    name: CREATE SCHEMA
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-create-schema
    tier: medium
    probes:
      - { id: name_only, sql: "CREATE SCHEMA s;" }
      - { id: authorization_only, sql: "CREATE SCHEMA AUTHORIZATION u;" }
      - { id: name_authorization, sql: "CREATE SCHEMA s AUTHORIZATION u;" }
      - { id: data_capture_none, sql: "CREATE SCHEMA s DATA CAPTURE NONE;" }
      - { id: data_capture_changes, sql: "CREATE SCHEMA s DATA CAPTURE CHANGES;" }
      - { id: row_modification_tracking, sql: "CREATE SCHEMA s ENABLE ROW MODIFICATION TRACKING;" }
      - { id: schema_sql_statement, sql: "CREATE SCHEMA s CREATE TABLE t (c INTEGER NOT NULL) CREATE INDEX i ON t (c) GRANT ALL ON t TO u;" }
    examples:
      - "CREATE SCHEMA RICK AUTHORIZATION RICK;"

  - id: create_sequence
    name: CREATE SEQUENCE
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-create-sequence
    tier: medium
    probes:
      - { id: basic, sql: "CREATE SEQUENCE seq;" }
      - { id: or_replace, sql: "CREATE OR REPLACE SEQUENCE seq;" }
      - { id: as_type, sql: "CREATE SEQUENCE seq AS BIGINT;" }
      - { id: as_decimal, sql: "CREATE SEQUENCE seq AS DECIMAL(10,0);" }
      - { id: start_increment, sql: "CREATE SEQUENCE seq START WITH 1 INCREMENT BY 5;" }
      - { id: min_max, sql: "CREATE SEQUENCE seq MINVALUE 1 MAXVALUE 100;" }
      - { id: no_min_max, sql: "CREATE SEQUENCE seq NO MINVALUE NO MAXVALUE;" }
      - { id: cycle, sql: "CREATE SEQUENCE seq CYCLE;" }
      - { id: no_cycle, sql: "CREATE SEQUENCE seq NO CYCLE;" }
      - { id: cache, sql: "CREATE SEQUENCE seq CACHE 24;" }
      - { id: no_cache, sql: "CREATE SEQUENCE seq NO CACHE;" }
      - { id: order, sql: "CREATE SEQUENCE seq ORDER;" }
      - { id: no_order, sql: "CREATE SEQUENCE seq NO ORDER;" }
    examples:
      - "CREATE SEQUENCE ORG_SEQ START WITH 1 INCREMENT BY 1 NO MAXVALUE NO CYCLE CACHE 24;"

  - id: create_synonym
    name: CREATE SYNONYM
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-create-synonym
    tier: medium
    probes:
      - { id: basic, sql: "CREATE SYNONYM syn FOR t1;" }
      - { id: qualified, sql: "CREATE SYNONYM s.syn FOR s2.t1;" }

  - id: create_table_external
    name: CREATE TABLE (EXTERNAL)
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-create-table-external
    tier: medium
    probes:
      - { id: columns_using, sql: "CREATE EXTERNAL TABLE t (a INT) USING (DATAOBJECT 'datafile1.dat');" }
      - { id: columns_not_null, sql: "CREATE EXTERNAL TABLE t (a INT NOT NULL, b VARCHAR(10)) USING (FILE_NAME 'f.dat' DELIMITER '|');" }
      - { id: like_table, sql: "CREATE EXTERNAL TABLE t LIKE t1 USING (DATAOBJECT 'datafile1.dat');" }
      - { id: as_fullselect, sql: "CREATE EXTERNAL TABLE t 'f.dat' USING (DELIMITER ',') AS SELECT * FROM t1;" }
      - { id: as_fullselect_dataobject, sql: "CREATE EXTERNAL TABLE t USING (DATAOBJECT 'f.dat') AS SELECT * FROM t1;" }
      - { id: transient_unload, sql: "CREATE EXTERNAL TABLE '/tmp/unload.txt' USING (DECPLUSBLANK PLUS) AS SELECT * FROM t1;" }
