      - { id: update_set, sql: "UPDATE t SET c = 1;" }
      - { id: update_where, sql: "UPDATE t SET c = c + 1, d = 'x' WHERE id = 1;" }
      - { id: update_qualified_set_column, sql: "UPDATE t SET t.c = 'ASDF' WHERE t.id = 1;" }
      - { id: update_from, sql: "UPDATE t SET v = s.v FROM s WHERE t.k = s.k;" }
      - { id: update_from_multiple, sql: "UPDATE t SET v = s.v + u.v FROM s, u WHERE t.k = s.k AND s.k = u.k;" }
