dialect: hana
engine: SAP HANA Platform
version: "2.0 SPS 08 (2.0.08)"
source: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/3bc1a0d4611d40c4a6e3fc7c8e80395d.html?version=2.0.08

statements:
  - id: drop_graph_workspace
    name: DROP GRAPH WORKSPACE
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/88c7091e96c64b819898476536f7a849.html?version=2.0.08
    tier: low
    probes:
      - id: basic
        sql: "DROP GRAPH WORKSPACE ws;"
      - id: with_schema
        sql: "DROP GRAPH WORKSPACE s.ws;"
  - id: drop_jwt_provider
    name: DROP JWT PROVIDER
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/e3caf68bb0b84b4cbcc0e3a7c022e92a.html?version=2.0.08
    tier: low
    probes:
      - id: basic
        sql: "DROP JWT PROVIDER jp;"
      - id: cascade
        sql: "DROP JWT PROVIDER jp CASCADE;"
  - id: drop_library
    name: DROP LIBRARY
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/d4160799a5564fc0b901e499c29dc5b4.html?version=2.0.08
    tier: low
    probes:
      - id: basic
        sql: "DROP LIBRARY mylib;"
      - id: with_schema
        sql: "DROP LIBRARY s.mylib;"
  - id: drop_ldap_provider
    name: DROP LDAP PROVIDER
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/340e913ae1d044d993dec2a7eff941c4.html?version=2.0.08
    tier: low
    probes:
      - id: basic
        sql: "DROP LDAP PROVIDER lp;"
  - id: drop_pse
    name: DROP PSE
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/25d67950e6614770aa98aec23ab117ee.html?version=2.0.08
    tier: low
    probes:
      - id: basic
        sql: "DROP PSE p;"
      - id: cascade
        sql: "DROP PSE p CASCADE;"
  - id: drop_public_key
    name: DROP PUBLIC KEY
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/1f935a3dff744f7bbf488271a6c869f4.html?version=2.0.08
    tier: low
    probes:
      - id: basic
        sql: "DROP PUBLIC KEY jwt_pubkey;"
  - id: drop_remote_source
    name: DROP REMOTE SOURCE
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/20d7332f75191014866fc4b83cfba146.html?version=2.0.08
    tier: low
    probes:
      - id: basic
        sql: "DROP REMOTE SOURCE rs;"
      - id: cascade
        sql: "DROP REMOTE SOURCE rs CASCADE;"
      - id: restrict
        sql: "DROP REMOTE SOURCE rs RESTRICT;"
  - id: drop_saml_provider
    name: DROP SAML PROVIDER
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/20d76c8675191014b9acc9697a367773.html?version=2.0.08
    tier: low
    probes:
      - id: cascade
        sql: "DROP SAML PROVIDER sp CASCADE;"
  - id: drop_workload_class
    name: DROP WORKLOAD CLASS
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/22f628bdb85d4ccd885cf642d3fd31c4.html?version=2.0.08
    tier: low
    probes:
      - id: basic
        sql: "DROP WORKLOAD CLASS \"MyWorkloadClass\";"
  - id: drop_workload_mapping
    name: DROP WORKLOAD MAPPING
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/8d90e94880924f7d957ba73db7e7db17.html?version=2.0.08
    tier: low
    probes:
      - id: basic
        sql: "DROP WORKLOAD MAPPING \"MyWorkloadMapping\";"
  - id: drop_x509_provider
    name: DROP X509 PROVIDER
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/f7a37e81a9b64a2cb6a6092a38b06c60.html?version=2.0.08
    tier: low
    probes:
      - id: basic
        sql: "DROP X509 PROVIDER xp;"
      - id: cascade
        sql: "DROP X509 PROVIDER xp CASCADE;"
  - id: recover_data
    name: RECOVER DATA
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/93637a07e3b544398aa02de1541b903c.html?version=2.0.08
    tier: low
    probes:
      - id: using_file
        sql: "RECOVER DATA USING FILE ('/backup/THURSDAY') CLEAR LOG;"
      - id: for_database
        sql: "RECOVER DATA FOR db USING FILE ('/backup/THURSDAY') CLEAR LOG;"
      - id: backint_source
        sql: "RECOVER DATA FOR db USING SOURCE 'PR1@db' USING BACKINT ('/usr/sap/backup') CLEAR LOG;"
      - id: snapshot
        sql: "RECOVER DATA USING SNAPSHOT CLEAR LOG;"
      - id: backup_id
        sql: "RECOVER DATA USING BACKUP_ID 1234567890 CLEAR LOG;"
  - id: recover_database
    name: RECOVER DATABASE
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/c4205f73bb571014ba46d209981bc1f5.html?version=2.0.08
    tier: low
    probes:
      - id: until_timestamp
        sql: "RECOVER DATABASE FOR db UNTIL TIMESTAMP '2020-10-21 15:00:00' CHECK ACCESS ALL;"
      - id: until_log_position
        sql: "RECOVER DATABASE UNTIL LOG POSITION 1000 AT VOLUME 3;"
      - id: clear_log
        sql: "RECOVER DATABASE UNTIL TIMESTAMP '2020-10-21 15:00:00' CLEAR LOG;"
      - id: using_paths
        sql: "RECOVER DATABASE UNTIL TIMESTAMP '2020-10-21 15:00:00' USING LOG PATH ('/log') USING DATA PATH ('/data');"
  - id: recover_encryption_root_keys
    name: RECOVER ENCRYPTION ROOT KEYS
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/c5a5107c45b343d3929751c12d1c3c58.html?version=2.0.08
    tier: low
    probes:
      - id: basic
        sql: "RECOVER ENCRYPTION ROOT KEYS FOR db USING FILE '/tmp/rootkeys.rkb' PASSWORD 'Passw0rd';"
      - id: and_settings
        sql: "RECOVER ENCRYPTION ROOT KEYS AND SETTINGS FOR db USING FILE '/tmp/rootkeys.rkb' PASSWORD 'Passw0rd';"
  - id: rename_database
    name: RENAME DATABASE
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/2c4e1a98b762477f8fe4ceeaf85d79af.html?version=2.0.08
    tier: low
    probes:
      - id: basic
        sql: "RENAME DATABASE db1 TO db2;"
  - id: set_history_session
    name: SET HISTORY SESSION
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/20fd261a751910149253bd03d73f520d.html?version=2.0.08
    tier: low
    probes:
      - id: now
        sql: "SET HISTORY SESSION TO NOW;"
      - id: commit_id
        sql: "SET HISTORY SESSION TO COMMIT ID 1000;"
      - id: utctimestamp
        sql: "SET HISTORY SESSION TO UTCTIMESTAMP '2020-01-01 00:00:00';"
  - id: set_pse
    name: SET PSE
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/10fe8070539649358c79955110311082.html?version=2.0.08
    tier: low
    probes:
      - id: purpose
        sql: "SET PSE p PURPOSE SSL;"
      - id: purpose_provider
        sql: "SET PSE p PURPOSE SAML FOR PROVIDER sp1, sp2;"
      - id: purpose_host
        sql: "SET PSE p PURPOSE SSL FOR HOST h1;"
      - id: purpose_remote_source
        sql: "SET PSE p PURPOSE REMOTE SOURCE FOR REMOTE SOURCE rs;"
  - id: set_system_license
    name: SET SYSTEM LICENSE
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/20fdca2375191014bde883db2af2cce6.html?version=2.0.08
    tier: low
    probes:
      - id: basic
        sql: "SET SYSTEM LICENSE 'license key text';"
  - id: unset_pse
    name: UNSET PSE
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/408255391bd043209a957830f8e87b65.html?version=2.0.08
    tier: low
    probes:
      - id: basic
        sql: "UNSET PSE p PURPOSE SSL;"
  - id: unset_system_license_all
    name: UNSET SYSTEM LICENSE ALL
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/20fef5c175191014b9daf2f2a9157a0f.html?version=2.0.08
    tier: low
    probes:
      - id: basic
        sql: "UNSET SYSTEM LICENSE ALL;"
  - id: validate_ldap_provider
    name: VALIDATE LDAP PROVIDER
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/4181217e3e104c57a5090431c1cd70b7.html?version=2.0.08
    tier: low
    probes:
      - id: basic
        sql: "VALIDATE LDAP PROVIDER lp;"
      - id: check_user
        sql: "VALIDATE LDAP PROVIDER lp CHECK USER u;"
      - id: check_user_password
        sql: "VALIDATE LDAP PROVIDER lp CHECK USER u PASSWORD 'pw';"
      - id: no_authorization_check
        sql: "VALIDATE LDAP PROVIDER lp CHECK USER u NO AUTHORIZATION CHECK;"
      - id: check_user_creation
        sql: "VALIDATE LDAP PROVIDER lp CHECK USER CREATION FOR LDAP USER u;"
  - id: validate_user
    name: VALIDATE USER
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/5e336347cb8444279b451c172ad00c75.html?version=2.0.08
    tier: low
    probes:
      - id: password
        sql: "VALIDATE USER u PASSWORD 'pw';"
      - id: assertion
        sql: "VALIDATE USER WITH ASSERTION 'assertion-text';"
