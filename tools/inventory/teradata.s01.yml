        sql: "CREATE TABLE t (a INTEGER DEFAULT 0, b VARCHAR(8) DEFAULT USER, c DATE DEFAULT DATE, d TIME DEFAULT TIME, e INTEGER DEFAULT NULL);"
      - id: with_default
        sql: "CREATE TABLE t (c INTEGER WITH DEFAULT);"
