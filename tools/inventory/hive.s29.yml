dialect: hive
engine: Apache Hive
version: "4.x"
source: https://hive.apache.org/docs/latest/language/languagemanual/

statements:
  - id: create_temporary_macro
    name: CREATE TEMPORARY MACRO
    doc: https://hive.apache.org/docs/latest/language/languagemanual-ddl/
    tier: high
    probes:
      - id: no_args
        sql: "CREATE TEMPORARY MACRO m() 42;"
      - id: one_arg
        sql: "CREATE TEMPORARY MACRO m(x string) length(x) + 2;"
      - id: multiple_args
        sql: "CREATE TEMPORARY MACRO m(x int, y int) x + y;"
    examples:
      - "CREATE TEMPORARY MACRO fixed_number() 42;"
      - "CREATE TEMPORARY MACRO string_len_plus_two(x string) length(x) + 2;"
      - "CREATE TEMPORARY MACRO simple_add (x int, y int) x + y;"

  - id: drop_temporary_macro
    name: DROP TEMPORARY MACRO
    doc: https://hive.apache.org/docs/latest/language/languagemanual-ddl/
    tier: high
    probes:
      - id: basic
        sql: "DROP TEMPORARY MACRO m;"
      - id: if_exists
        sql: "DROP TEMPORARY MACRO IF EXISTS m;"
