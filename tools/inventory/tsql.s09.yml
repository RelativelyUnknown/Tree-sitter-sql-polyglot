dialect: tsql
engine: SQL Server 2022 / Azure SQL Database
version: "2022"
source: https://learn.microsoft.com/en-us/sql/t-sql/statements/statements

statements:
  - id: set_concat_null_yields_null
    name: SET CONCAT_NULL_YIELDS_NULL
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/set-concat-null-yields-null-transact-sql
    tier: medium
    probes:
      - id: "on"
        sql: "SET CONCAT_NULL_YIELDS_NULL ON;"
      - id: "off"
        sql: "SET CONCAT_NULL_YIELDS_NULL OFF;"
    examples:
      - "SET CONCAT_NULL_YIELDS_NULL ON;"
      - "SET CONCAT_NULL_YIELDS_NULL OFF;"

  - id: set_cursor_close_on_commit
    name: SET CURSOR_CLOSE_ON_COMMIT
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/set-cursor-close-on-commit-transact-sql
    tier: medium
    probes:
      - id: "on"
        sql: "SET CURSOR_CLOSE_ON_COMMIT ON;"
      - id: "off"
        sql: "SET CURSOR_CLOSE_ON_COMMIT OFF;"
    examples:
      - "SET CURSOR_CLOSE_ON_COMMIT ON;"
      - "SET CURSOR_CLOSE_ON_COMMIT OFF;"

  - id: set_datefirst
    name: SET DATEFIRST
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/set-datefirst-transact-sql
    tier: medium
    probes:
      - id: number
        sql: "SET DATEFIRST 7;"
      - id: variable
        sql: "SET DATEFIRST @n;"
    examples:
      - "SET DATEFIRST 7;"
      - "SET DATEFIRST 3;"

  - id: set_dateformat
    name: SET DATEFORMAT
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/set-dateformat-transact-sql
    tier: medium
    probes:
      - id: format
        sql: "SET DATEFORMAT dmy;"
      - id: variable
        sql: "SET DATEFORMAT @f;"
    examples:
      - "SET DATEFORMAT dmy;"

  - id: set_deadlock_priority
    name: SET DEADLOCK_PRIORITY
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/set-deadlock-priority-transact-sql
    tier: medium
    probes:
      - id: low
        sql: "SET DEADLOCK_PRIORITY LOW;"
      - id: normal
        sql: "SET DEADLOCK_PRIORITY NORMAL;"
      - id: high
        sql: "SET DEADLOCK_PRIORITY HIGH;"
      - id: numeric_priority
        sql: "SET DEADLOCK_PRIORITY -5;"
      - id: variable
        sql: "SET DEADLOCK_PRIORITY @p;"
    examples:
      - "SET DEADLOCK_PRIORITY @deadlock_var;"
      - "SET DEADLOCK_PRIORITY NORMAL;"

  - id: set_fmtonly
    name: SET FMTONLY
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/set-fmtonly-transact-sql
    tier: medium
    probes:
      - id: "on"
        sql: "SET FMTONLY ON;"
      - id: "off"
        sql: "SET FMTONLY OFF;"
    examples:
      - "SET FMTONLY ON;"
      - "SET FMTONLY OFF;"

  - id: set_identity_insert
    name: SET IDENTITY_INSERT
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/set-identity-insert-transact-sql
    tier: medium
    probes:
      - id: table_on
        sql: "SET IDENTITY_INSERT t ON;"
      - id: table_off
        sql: "SET IDENTITY_INSERT t OFF;"
      - id: schema_qualified
        sql: "SET IDENTITY_INSERT dbo.t ON;"
      - id: database_qualified
        sql: "SET IDENTITY_INSERT db.dbo.t ON;"
    examples:
      - "SET IDENTITY_INSERT dbo.Tool ON;"

  - id: set_implicit_transactions
    name: SET IMPLICIT_TRANSACTIONS
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/set-implicit-transactions-transact-sql
    tier: medium
    probes:
      - id: "on"
        sql: "SET IMPLICIT_TRANSACTIONS ON;"
      - id: "off"
        sql: "SET IMPLICIT_TRANSACTIONS OFF;"
    examples:
      - "SET IMPLICIT_TRANSACTIONS OFF;"
      - "SET IMPLICIT_TRANSACTIONS ON;"

  - id: set_language
    name: SET LANGUAGE
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/set-language-transact-sql
    tier: medium
    probes:
      - id: name
        sql: "SET LANGUAGE Italian;"
      - id: string_literal
        sql: "SET LANGUAGE 'italian';"
      - id: unicode_string_literal
        sql: "SET LANGUAGE N'italian';"
      - id: variable
        sql: "SET LANGUAGE @lang;"
    examples:
      - "SET LANGUAGE Italian;"
      - "SET LANGUAGE us_english;"

  - id: set_lock_timeout
    name: SET LOCK_TIMEOUT
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/set-lock-timeout-transact-sql
    tier: medium
    probes:
      - id: milliseconds
        sql: "SET LOCK_TIMEOUT 1800;"
      - id: wait_forever
        sql: "SET LOCK_TIMEOUT -1;"
      - id: no_wait
        sql: "SET LOCK_TIMEOUT 0;"
    examples:
      - "SET LOCK_TIMEOUT 1800;"
      - "SET LOCK_TIMEOUT -1;"
