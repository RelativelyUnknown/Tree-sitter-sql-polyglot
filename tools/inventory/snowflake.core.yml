  - id: qualify
    name: "QUALIFY"
    doc: https://docs.snowflake.com/en/sql-reference/constructs/qualify
    tier: high
    probes:
      - { id: qualify_window, sql: "SELECT i, p, o FROM t QUALIFY ROW_NUMBER() OVER (PARTITION BY p ORDER BY o) = 1;" }
      - { id: qualify_alias, sql: "SELECT i, ROW_NUMBER() OVER (PARTITION BY p ORDER BY o) AS row_num FROM t QUALIFY row_num = 1;" }
      - { id: qualify_after_having, sql: "SELECT p, SUM(o) OVER (PARTITION BY p) AS r FROM t WHERE o < 4 GROUP BY p, o HAVING SUM(i) > 3 QUALIFY r IN (SELECT MIN(i) FROM t GROUP BY p HAVING MIN(i) > 3);" }
      - { id: qualify_without_where, sql: "SELECT * FROM t QUALIFY RANK() OVER (ORDER BY c DESC) <= 3 ORDER BY c;" }
    examples:
      - |-
        SELECT i, p, o
          FROM qt
          QUALIFY ROW_NUMBER() OVER (PARTITION BY p ORDER BY o) = 1;
      - |-
