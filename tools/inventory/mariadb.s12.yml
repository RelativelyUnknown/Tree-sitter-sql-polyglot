dialect: mariadb
engine: MariaDB Server
version: "11.x (current)"
source: https://mariadb.com/docs/server/reference/sql-statements

statements:
  - id: drop_view
    name: DROP VIEW
    doc: https://mariadb.com/docs/server/server-usage/views/drop-view
    tier: high
    probes:
      - id: basic
        sql: "DROP VIEW v;"
      - id: if_exists
        sql: "DROP VIEW IF EXISTS v;"
      - id: multiple_views
        sql: "DROP VIEW v, v2;"
      - id: qualified_name
        sql: "DROP VIEW db.v;"
      - id: restrict
        sql: "DROP VIEW v RESTRICT;"
      - id: cascade
        sql: "DROP VIEW v CASCADE;"
      - id: if_exists_multiple_cascade
        sql: "DROP VIEW IF EXISTS v, v2 CASCADE;"
    examples:
      - "DROP VIEW v,v2;"
      - "DROP VIEW v,v2,v3;"
      - "DROP VIEW IF EXISTS v,v2,v3;"

  - id: create_index
    name: CREATE INDEX
    doc: https://mariadb.com/docs/server/reference/sql-statements/data-definition/create/create-index
    tier: high
    probes:
      - id: basic
        sql: "CREATE INDEX idx ON t (c);"
      - id: multi_column
        sql: "CREATE INDEX idx ON t (c, d);"
      - id: or_replace
        sql: "CREATE OR REPLACE INDEX idx ON t (c);"
      - id: if_not_exists
        sql: "CREATE INDEX IF NOT EXISTS idx ON t (c);"
        sql: "CREATE UNIQUE INDEX idx ON t (c);"
      - id: fulltext
        sql: "CREATE FULLTEXT INDEX idx ON t (c);"
      - id: spatial
        sql: "CREATE SPATIAL INDEX idx ON t (c);"
      - id: vector
        sql: "CREATE VECTOR INDEX idx ON t (c);"
      - id: col_length
        sql: "CREATE INDEX idx ON t (c(10));"
      - id: col_asc_desc
        sql: "CREATE INDEX idx ON t (c ASC, d DESC);"
      - id: col_length_desc
        sql: "CREATE INDEX idx ON t (c(10) DESC);"
      - id: index_type_before_on
        sql: "CREATE INDEX idx USING BTREE ON t (c);"
      - id: using_btree
        sql: "CREATE INDEX idx ON t (c) USING BTREE;"
      - id: using_hash
        sql: "CREATE INDEX idx ON t (c) USING HASH;"
      - id: using_rtree
        sql: "CREATE SPATIAL INDEX idx ON t (c) USING RTREE;"
      - id: wait
        sql: "CREATE INDEX idx ON t (c) WAIT 5;"
      - id: nowait
        sql: "CREATE INDEX idx ON t (c) NOWAIT;"
      - id: key_block_size
        sql: "CREATE INDEX idx ON t (c) KEY_BLOCK_SIZE 8;"
      - id: key_block_size_eq
        sql: "CREATE INDEX idx ON t (c) KEY_BLOCK_SIZE = 8;"
      - id: with_parser
        sql: "CREATE FULLTEXT INDEX idx ON t (c) WITH PARSER p;"
      - id: comment
        sql: "CREATE INDEX idx ON t (c) COMMENT 'text';"
      - id: clustering_yes
        sql: "CREATE INDEX idx ON t (c) CLUSTERING = YES;"
      - id: clustering_no
        sql: "CREATE INDEX idx ON t (c) CLUSTERING = NO;"
      - id: ignored
        sql: "CREATE INDEX idx ON t (c) IGNORED;"
      - id: not_ignored
        sql: "CREATE INDEX idx ON t (c) NOT IGNORED;"
      - id: vector_distance_euclidean
        sql: "CREATE VECTOR INDEX idx ON t (c) DISTANCE = EUCLIDEAN;"
      - id: vector_distance_cosine
        sql: "CREATE VECTOR INDEX idx ON t (c) DISTANCE = COSINE;"
      - id: vector_m
        sql: "CREATE VECTOR INDEX idx ON t (c) M = 8;"
      - id: multiple_index_options
        sql: "CREATE INDEX idx ON t (c) KEY_BLOCK_SIZE = 8 COMMENT 'text' USING BTREE;"
      - id: algorithm_default
        sql: "CREATE INDEX idx ON t (c) ALGORITHM = DEFAULT;"
      - id: algorithm_inplace
        sql: "CREATE INDEX idx ON t (c) ALGORITHM INPLACE;"
      - id: algorithm_copy
        sql: "CREATE INDEX idx ON t (c) ALGORITHM = COPY;"
      - id: algorithm_nocopy
        sql: "CREATE INDEX idx ON t (c) ALGORITHM = NOCOPY;"
      - id: algorithm_instant
        sql: "CREATE INDEX idx ON t (c) ALGORITHM = INSTANT;"
      - id: lock_default
        sql: "CREATE INDEX idx ON t (c) LOCK = DEFAULT;"
      - id: lock_none
        sql: "CREATE INDEX idx ON t (c) LOCK = NONE;"
      - id: lock_shared
        sql: "CREATE INDEX idx ON t (c) LOCK SHARED;"
      - id: lock_exclusive
        sql: "CREATE INDEX idx ON t (c) LOCK = EXCLUSIVE;"
      - id: algorithm_and_lock
        sql: "CREATE INDEX idx ON t (c) ALGORITHM = INPLACE LOCK = NONE;"
      - id: all_clauses
        sql: "CREATE OR REPLACE UNIQUE INDEX idx USING BTREE ON t (c(10) DESC, d) WAIT 5 COMMENT 'text' ALGORITHM = INPLACE LOCK = NONE;"
      - id: without_overlaps
        sql: "CREATE UNIQUE INDEX u ON t (c, p WITHOUT OVERLAPS);"
      - id: qualified_table
        sql: "CREATE INDEX idx ON db.t (c);"
    examples:
      - "CREATE UNIQUE INDEX HomePhone ON Employees(Home_Phone);"
      - "CREATE OR REPLACE INDEX xi ON xx5 (x);"
      - "CREATE UNIQUE INDEX u ON rooms (room_number, p WITHOUT OVERLAPS);"
