dialect: mariadb
engine: MariaDB Server
version: "11.x (current)"
source: https://mariadb.com/docs/server/reference/sql-statements

statements:
  - id: except
    name: EXCEPT
    doc: https://mariadb.com/docs/server/reference/sql-statements/data-manipulation/selecting-data/set-operations/except
    tier: high
    probes:
      - id: basic
        sql: "SELECT a FROM t1 EXCEPT SELECT b FROM t2;"
      - id: except_all
        sql: "SELECT a FROM t1 EXCEPT ALL SELECT b FROM t2;"
      - id: except_distinct
        sql: "SELECT a FROM t1 EXCEPT DISTINCT SELECT b FROM t2;"
      - id: parenthesized_operands
        sql: "(SELECT a FROM t1) EXCEPT (SELECT b FROM t2);"
      - id: chained_with_union
        sql: "SELECT a FROM t1 UNION SELECT b FROM t2 EXCEPT SELECT c FROM t3;"
      - id: chained_with_intersect
        sql: "SELECT a FROM t1 EXCEPT SELECT b FROM t2 INTERSECT SELECT c FROM t3;"
      - id: parenthesized_precedence
        sql: "((SELECT a FROM t1) UNION (SELECT b FROM t2)) EXCEPT (SELECT c FROM t3);"
      - id: order_by
        sql: "SELECT a FROM t1 EXCEPT SELECT b FROM t2 ORDER BY a DESC;"
      - id: limit
        sql: "SELECT a FROM t1 EXCEPT SELECT b FROM t2 LIMIT 10;"
      - id: limit_offset_comma
        sql: "SELECT a FROM t1 EXCEPT SELECT b FROM t2 LIMIT 5, 10;"
      - id: limit_offset_keyword
        sql: "SELECT a FROM t1 EXCEPT SELECT b FROM t2 LIMIT 10 OFFSET 5;"
      - id: offset_rows
        sql: "SELECT a FROM t1 EXCEPT SELECT b FROM t2 OFFSET 5 ROWS;"
      - id: fetch_first_only
        sql: "SELECT a FROM t1 EXCEPT SELECT b FROM t2 ORDER BY a FETCH FIRST 3 ROWS ONLY;"
      - id: fetch_next_with_ties
        sql: "SELECT a FROM t1 EXCEPT SELECT b FROM t2 ORDER BY a FETCH NEXT 3 ROWS WITH TIES;"
      - id: except_values
        sql: "(SELECT seq FROM seq_1_to_10) EXCEPT VALUES (2), (3), (4);"
    examples:
      - |-
        (SELECT e_name AS name, email FROM customers)
        EXCEPT
        (SELECT c_name AS name, email FROM employees);
      - "SELECT i FROM seqs WHERE i <= 3 EXCEPT ALL SELECT i FROM seqs WHERE i>=3;"
      - "(SELECT a FROM t1) UNION ((SELECT b FROM t2) EXCEPT (SELECT c FROM t3));"

  - id: select_into
    name: SELECT ... INTO (variables)
    doc: https://mariadb.com/docs/server/reference/sql-statements/programmatic-compound-statements/selectinto
    tier: high
    probes:
      - id: into_user_variable
        sql: "SELECT a INTO @x FROM t;"
      - id: into_multiple_user_variables
        sql: "SELECT a, b INTO @x, @y FROM t;"
      - id: into_local_variable
        sql: "SELECT a, b INTO v1, v2 FROM t;"
      - id: into_with_where_limit
        sql: "SELECT a INTO @x FROM t WHERE b = 1 LIMIT 1;"
      - id: into_at_end
        sql: "SELECT a, b FROM t WHERE b = 1 LIMIT 1 INTO @x, @y;"
      - id: into_without_from
        sql: "SELECT 1 INTO @x;"
      - id: into_from_union_derived_table
        sql: "SELECT * INTO @x FROM (SELECT t1.a FROM t1 UNION SELECT t2.a FROM t2) dt;"
    examples:
      - |-
        SELECT id, data INTO @x,@y
        FROM test.t1 LIMIT 1;
      - "SELECT  * INTO @x FROM (SELECT t1.a FROM t1 UNION SELECT t2.a FROM t2) dt;"
