dialect: mariadb
engine: MariaDB Server
version: "11.x (current)"
source: https://mariadb.com/docs/server/reference/sql-statements

statements:
  - id: commit
    name: COMMIT
    doc: https://mariadb.com/docs/server/reference/sql-statements/transactions/commit
    tier: high
    probes:
      - id: basic
        sql: "COMMIT;"
      - id: work
        sql: "COMMIT WORK;"
      - id: and_chain
        sql: "COMMIT AND CHAIN;"
      - id: and_no_chain
        sql: "COMMIT AND NO CHAIN;"
      - id: release
        sql: "COMMIT RELEASE;"
      - id: no_release
        sql: "COMMIT NO RELEASE;"
      - id: work_and_chain_release
        sql: "COMMIT WORK AND CHAIN RELEASE;"

  - id: rollback
    name: ROLLBACK
    doc: https://mariadb.com/docs/server/reference/sql-statements/transactions/rollback
    tier: high
    probes:
      - id: basic
        sql: "ROLLBACK;"
      - id: work
        sql: "ROLLBACK WORK;"
      - id: and_chain
        sql: "ROLLBACK AND CHAIN;"
      - id: and_no_chain
        sql: "ROLLBACK AND NO CHAIN;"
      - id: to_savepoint
        sql: "ROLLBACK TO SAVEPOINT sp;"
      - id: to_without_savepoint_keyword
        sql: "ROLLBACK TO sp;"
      - id: work_to_savepoint
        sql: "ROLLBACK WORK TO SAVEPOINT sp;"
