name: Build/test

on:
  push:
    branches: ["main", "release/**"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["main", "release/**"]

# A new push obsoletes the previous run of the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  TREE_SITTER_REF: v0.26.3
  # tools/coverage.py and tools/inventory.py use this CLI (the one setup-action installs, same pin)
  # instead of fetching tree-sitter-cli through npx.
  TREE_SITTER_BIN: tree-sitter

jobs:
  # Decides which grammars this change needs (scripts/changed-grammars.js): a dialect and the
  # dialects that extend it, everything when the ANSI base or the build machinery changes, nothing
  # for docs. A push to main is diffed against the previous head, a PR against its base.
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.diff.outputs.matrix }}
      run_grammars: ${{ steps.diff.outputs.run_grammars }}
      run_bindings: ${{ steps.diff.outputs.run_bindings }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Select grammars
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            node scripts/changed-grammars.js "$PR_BASE" "$PR_HEAD"
          else
            node scripts/changed-grammars.js "$PUSH_BEFORE" "$PUSH_AFTER"
          fi

  # One job per grammar: the base and each of the 22 dialects is generated, tested and checked on
  # its own runner, so one grammar's memory use or failure never affects another's. Only the
  # grammars `changes` selected run.
  # Raise max-parallel if the account's runner budget allows.
  grammar:
    name: grammar (${{ matrix.lang }})
    needs: changes
    if: ${{ needs.changes.outputs.run_grammars == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: tree-sitter/setup-action@v2
        with:
          install-lib: false
          tree-sitter-ref: ${{ env.TREE_SITTER_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      # Large grammars need more than the runner's RAM while building the parse table. The swap
      # file goes on /mnt, the runner's large scratch disk.
      - name: Add swap
        run: |
          sudo swapoff -a || true
          avail_gb=$(df --output=avail -BG /mnt | tail -1 | tr -dc '0-9')
          size_gb=$(( avail_gb > 40 ? 32 : avail_gb - 4 ))
          sudo fallocate -l "${size_gb}G" /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      # Always a real `tree-sitter generate` (no hash cache), so what is tested is what is built.
      - name: Generate
        id: gen
        run: |
          if [ "${{ matrix.lang }}" = base ]; then
            tree-sitter generate grammar.js
          else
            cd "${{ matrix.lang }}" && tree-sitter generate grammar.js
          fi

      # The committed .br blobs are what the Node, Python, Rust, Go, C and Swift packages build
      # from, so they must match the grammar. On a mismatch the fresh blobs are uploaded below.
      - name: Committed parser blobs are current
        id: blobs
        if: ${{ !cancelled() && steps.gen.outcome == 'success' }}
        run: node scripts/check-blobs.js "${{ matrix.lang }}"

      - name: Upload fresh blobs when stale
        if: ${{ !cancelled() && steps.blobs.outcome == 'failure' }}
        run: |
          node scripts/compress-parsers.js "${{ matrix.lang }}"
          mkdir -p /tmp/blobs
          if [ "${{ matrix.lang }}" = base ]; then cp src/*.br /tmp/blobs/; else cp "${{ matrix.lang }}"/src/*.br /tmp/blobs/; fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.blobs.outcome == 'failure' }}
        with:
          name: fresh-blobs-${{ matrix.lang }}
          path: /tmp/blobs
          retention-days: 7

      - name: Corpus tests
        if: ${{ !cancelled() && steps.gen.outcome == 'success' }}
        run: |
          if [ "${{ matrix.lang }}" = base ]; then
            # --grammar-path implies a rebuild of every grammar tree-sitter.json declares; scope
            # the config to the base grammar for this run.
            jq '.grammars |= map(select(.path == "."))' tree-sitter.json > /tmp/tree-sitter.json
            cp /tmp/tree-sitter.json tree-sitter.json
            tree-sitter test --grammar-path .
            git checkout -- tree-sitter.json
          else
            cd "${{ matrix.lang }}" && tree-sitter test
          fi

      - name: Install Python tools
        if: ${{ !cancelled() && steps.gen.outcome == 'success' }}
        run: pip install -r tools/requirements.txt

      # Base only: every keyword needs a highlight capture, in the base and in every dialect's
      # bundled query.
      - name: Keyword and highlight sync
        if: ${{ !cancelled() && steps.gen.outcome == 'success' && matrix.lang == 'base' }}
        run: |
          scripts/test-keywords.sh
          node scripts/bundle-highlights.js --check

      # Dialect only: probes that used to parse in tools/inventory-results/ must still parse.
      - name: Statement inventory
        id: inventory
        if: ${{ !cancelled() && steps.gen.outcome == 'success' && matrix.lang != 'base' }}
        run: python tools/inventory.py --check --dialect "${{ matrix.lang }}"

      # Recompute the committed results (reference-parser verdicts are cached in them, so only new or
      # edited probes reach sqlfluff and friends). When they differ, the fresh file is uploaded: copy it
      # over tools/inventory-results/<dialect>.json and commit. Never fails the build, so a green run
      # with a notice means the baseline can ratchet up, not that anything is broken.
      - name: Refresh inventory results
        id: inventory_refresh
        if: ${{ !cancelled() && steps.inventory.outcome == 'success' && matrix.lang != 'base' }}
        continue-on-error: true
        run: |
          python tools/inventory.py --dialect "${{ matrix.lang }}" | tee /tmp/inventory.txt
          grep '^\[inventory\]' /tmp/inventory.txt >> "$GITHUB_STEP_SUMMARY" || true
          if git diff --quiet -- "tools/inventory-results/${{ matrix.lang }}.json"; then
            echo "Committed inventory results are current."
          else
            mkdir -p /tmp/inventory
            cp "tools/inventory-results/${{ matrix.lang }}.json" /tmp/inventory/
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Inventory results changed::tools/inventory-results/${{ matrix.lang }}.json differs from this run; download the fresh-inventory-${{ matrix.lang }} artifact and commit it."
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.inventory_refresh.outputs.stale == 'true' }}
        with:
          name: fresh-inventory-${{ matrix.lang }}
          path: /tmp/inventory
          retention-days: 7

      # Base only: ANSI purity and regressions against independent reference parsers.
      - uses: actions/setup-java@v4
        if: ${{ !cancelled() && steps.gen.outcome == 'success' && matrix.lang == 'base' }}
        with:
          distribution: temurin
          java-version: "17"
      - name: ANSI purity and reference-parser coverage
        if: ${{ !cancelled() && steps.gen.outcome == 'success' && matrix.lang == 'base' }}
        run: |
          bash tools/antlr/setup.sh
          # The root tree-sitter.json lists every dialect; scope it to the base so `tree-sitter parse`
          # cannot resolve .sql files to a dialect grammar that was not generated in this job.
          jq '.grammars |= map(select(.path == "."))' tree-sitter.json > /tmp/tree-sitter.json
          cp /tmp/tree-sitter.json tree-sitter.json
          python tools/coverage.py --check --dialect base
          git checkout -- tree-sitter.json

  # Language bindings build from the committed .br blobs (scripts/inflate-parsers.js), so they
  # never run tree-sitter generate.
  bindings:
    name: ${{ matrix.binding }} (${{ matrix.os }})
    # After the grammar jobs, so the two groups never compete for runners, and so the blobs they
    # build from have been checked. Runs even when a grammar job failed, and is skipped when the
    # change touches neither a grammar nor the bindings.
    needs: [changes, grammar]
    if: ${{ !cancelled() && needs.changes.outputs.run_bindings == 'true' }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        binding: [go, node, python, rust, c]
        os: [ubuntu-latest, macos-latest, windows-2025]
        include:
          - { binding: swift, os: macos-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/inflate-parsers.js

      - uses: actions/setup-go@v5
        if: matrix.binding == 'go'
        with:
          go-version: "1.23"
          cache-dependency-path: go.sum
      - uses: actions/setup-python@v5
        if: matrix.binding == 'python'
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.binding == 'rust'
      - uses: Swatinem/rust-cache@v2
        if: matrix.binding == 'rust'
      - uses: tree-sitter/setup-action/cli@v2
        if: matrix.binding == 'c'

      - name: Build and test
        run: |
          case "${{ matrix.binding }}" in
            go)
              if [ "${{ matrix.os }}" = ubuntu-latest ]; then
                go build ./bindings/go/... && go test ./bindings/go/...
              else
                go build ./bindings/go ./bindings/go/postgres && go test ./bindings/go ./bindings/go/postgres
              fi ;;
            node)
              npm ci
              node --test bindings/node/binding_test.js bindings/node/binding_postgres_test.js ;;
            python)
              pip install ".[core]"
              python -m unittest discover -s bindings/python/tests -p "test_*.py" -v ;;
            rust)
              cargo test --no-default-features --features postgres ;;
            c)
              cmake -S . -B build -DTREE_SITTER_SQL_POSTGRES=ON
              cmake --build build --config Release ;;
            swift)
              swift build --build-tests
              swift test --skip-build -q ;;
          esac

  # Expected parse trees must not contain error nodes (errors.txt holds the intentional error tests).
  corpus-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if grep -rnE --exclude=errors.txt '\((ERROR|MISSING|UNEXPECTED)' test */test; then
            echo "Error nodes found in expected parse trees (listed above)."
            exit 1
          fi

  # The single required check for branch protection (.github/branch-protection/main.json).
  ci-passed:
    if: always()
    needs: [changes, grammar, bindings, corpus-lint]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            exit 1
          fi
