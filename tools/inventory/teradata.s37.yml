dialect: teradata
engine: Teradata Vantage (Enterprise IntelliFlex) and VantageCloud Lake
version: "20.00"
source: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/DXllu86_qUx3dJlXfCkc6Q

statements:
  - id: show_map
    name: "SHOW MAP"
    doc: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/dM4OKfYJ1YwBk5eLUWBzdA
    tier: low
    probes:
      - id: basic
        sql: "SHOW MAP m1;"
      - id: in_xml
        sql: "SHOW IN XML MAP m1;"
  - id: begin_isolated_loading
    name: "BEGIN ISOLATED LOADING"
    doc: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/jlmwN_BRPkUn1m_3nRycUw
    tier: low
    probes:
      - id: basic
        sql: "BEGIN ISOLATED LOADING ON t USING QUERY BAND 'LDILoadGroup = grp1;';"
      - id: concurrent_single_session
        sql: "BEGIN CONCURRENT ISOLATED LOADING ON db1.t1, t2 USING QUERY BAND 'LDILoadGroup = grp1;' IN SINGLE SESSION;"
  - id: checkpoint_isolated_loading
    name: "CHECKPOINT ISOLATED LOADING"
    doc: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/eq7EkRsP3XSpqnrl7xzQug
    tier: low
    probes:
      - id: basic
        sql: "CHECKPOINT ISOLATED LOADING FOR QUERY BAND 'LDILoadGroup = grp1;';"
      - id: concurrent
        sql: "CHECKPOINT CONCURRENT ISOLATED LOADING FOR QUERY BAND 'LDILoadGroup = grp1;';"
  - id: end_isolated_loading
    name: "END ISOLATED LOADING"
    doc: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/eoDVZn97vUk0VvUzmaBc2A
    tier: low
    probes:
      - id: basic
        sql: "END ISOLATED LOADING FOR QUERY BAND 'LDILoadGroup = grp1;';"
      - id: concurrent_override
        sql: "END CONCURRENT ISOLATED LOADING FOR QUERY BAND 'LDILoadGroup = grp1;' OVERRIDE SESSION;"
  - id: create_zone
    name: "CREATE ZONE"
    doc: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/Vfkq2KpLTihF4ZDV~tBNJg
    tier: low
    probes:
      - id: basic
        sql: "CREATE ZONE z1;"
      - id: root
        sql: "CREATE ZONE z1 ROOT db1;"
  - id: alter_zone
    name: "ALTER ZONE"
    doc: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/5Ys650EtxIgXCe77oAi3eA
    tier: low
    probes:
      - id: add_root
        sql: "ALTER ZONE z1 ADD ROOT db1;"
      - id: drop_root
        sql: "ALTER ZONE z1 DROP ROOT;"
  - id: drop_zone
    name: "DROP ZONE"
    doc: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/D01qXk25Rnw8A9Y32pA7jA
    tier: low
    probes:
      - id: basic
        sql: "DROP ZONE z1;"
  - id: set_session_account
    name: "SET SESSION ACCOUNT"
    doc: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/RZKlURFD5nPerO_eTxqfUg
    tier: low
    probes:
      - id: for_session
        sql: "SET SESSION ACCOUNT = 'acct1' FOR SESSION;"
      - id: for_request_ss
        sql: "SS ACCOUNT = 'acct1' FOR REQUEST;"
  - id: set_session_calendar
    name: "SET SESSION CALENDAR"
    doc: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/AVd1wwP2y98vBqPVNQ1Hyw
    tier: low
    probes:
      - id: basic
        sql: "SET SESSION CALENDAR = COMPATIBLE;"
      - id: ss
        sql: "SS CALENDAR = ISO;"
  - id: set_session_character_set_unicode_pass_through
    name: "SET SESSION CHARACTER SET UNICODE PASS THROUGH"
    doc: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/9O9omOAZFrlfo4gxqbu7NQ
    tier: low
    probes:
      - id: "on_form"
        sql: "SET SESSION CHARACTER SET UNICODE PASS THROUGH ON;"
      - id: "off_form"
        sql: "SET SESSION CHARACTER SET UNICODE PASS THROUGH OFF;"
  - id: set_session_constraint
    name: "SET SESSION CONSTRAINT"
    doc: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/H9~6rbWtBdCBdJ_NrZ600w
    tier: low
    probes:
      - id: level
        sql: "SET SESSION CONSTRAINT = c1 (lvl1);"
      - id: categories_ss
        sql: "SS CONSTRAINT = c1 (cat1, cat2);"
      - id: "null_form"
        sql: "SET SESSION CONSTRAINT = c1 (NULL);"
  - id: set_session_debug_function
    name: "SET SESSION DEBUG FUNCTION"
    doc: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/~2W2RgdqpsS8oeb9~oVS3Q
    tier: low
    probes:
      - id: function_on
        sql: "SET SESSION DEBUG FUNCTION db1.f ON;"
      - id: procedure_off
        sql: "SS DEBUG PROCEDURE p OFF;"
      - id: method_on
        sql: "SET SESSION DEBUG METHOD m ON;"
  - id: set_session_dot_notation
    name: "SET SESSION DOT NOTATION"
    doc: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/EDBfqzSN87bUDHRJV2NA8A
    tier: low
    probes:
      - id: default
        sql: "SET SESSION DOT NOTATION DEFAULT ON ERROR;"
      - id: list
        sql: "SET SESSION DOT NOTATION LIST ON ERROR;"
      - id: "null_form"
        sql: "SET SESSION DOT NOTATION NULL ON ERROR;"
      - id: error
        sql: "SET SESSION DOT NOTATION ERROR ON ERROR;"
  - id: set_session_for_isolated_loading
    name: "SET SESSION FOR ISOLATED LOADING"
    doc: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/_1He5pQYeEEuGg9XuD99Pg
    tier: low
    probes:
      - id: basic
        sql: "SET SESSION FOR ISOLATED LOADING;"
      - id: no_concurrent
        sql: "SS FOR NO CONCURRENT ISOLATED LOADING;"
  - id: set_session_function_trace
    name: "SET SESSION FUNCTION TRACE"
    doc: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/704KAMddHMAdhnWRl9eTXQ
    tier: low
    probes:
      - id: using
        sql: "SET SESSION FUNCTION TRACE USING 'mask' FOR TRACE TABLE db1.tt;"
      - id: "off_form"
        sql: "SET SESSION FUNCTION TRACE OFF;"
  - id: set_session_json_ignore_errors
    name: "SET SESSION JSON IGNORE ERRORS"
    doc: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/NcqQuKyiiFM2yFPB5ncJHA
    tier: low
    probes:
      - id: "on_form"
        sql: "SET SESSION JSON IGNORE ERRORS ON;"
      - id: "off_form"
        sql: "SS JSON IGNORE ERRORS OFF;"
  - id: set_session_searchuifdbpath
    name: "SET SESSION SEARCHUIFDBPATH"
    doc: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/EON8JknPr9BbkRcLUmTR4w
    tier: low
    probes:
      - id: list
        sql: "SET SESSION SEARCHUIFDBPATH = db1, db2;"
      - id: empty
        sql: "SET SESSION SEARCHUIFDBPATH = ;"
  - id: set_session_udfsearchpath
    name: "SET SESSION UDFSEARCHPATH"
    doc: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/KK2KcxfbFOer2vW4nS_CEg
    tier: low
    probes:
      - id: basic
        sql: "SET SESSION UDFSEARCHPATH = db1, db2 FOR FUNCTION = f1, f2;"
  - id: begin_logging
    name: "BEGIN LOGGING"
    doc: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/wzjgaD31Cqd3OWf8pBLscg
    tier: low
    probes:
      - id: basic
        sql: "BEGIN LOGGING ON ALL;"
      - id: denials_text_each_by_on
        sql: "BEGIN LOGGING DENIALS WITH TEXT ON EACH SELECT, INSERT BY u1 ON TABLE db1.t;"
      - id: grant_constraint
        sql: "BEGIN LOGGING ON FOR CONSTRAINT c1 GRANT;"
  - id: begin_query_capture
    name: "BEGIN QUERY CAPTURE"
    doc: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/~9wElYLDgAxnpdrx9eaRXg
    tier: low
    probes:
      - id: basic
        sql: "BEGIN QUERY CAPTURE AS WORKLOAD w1;"
      - id: full
        sql: "BEGIN QUERY CAPTURE FOR INDEX ANALYSIS WITH VERBOSE, DETAILED STATSUSAGE INTO qcd1 AS WORKLOAD w1;"
  - id: begin_query_logging
    name: "BEGIN QUERY LOGGING"
    doc: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/Ia4ZsXBw0XYO4XMDu5PIAg
    tier: low
    probes:
      - id: on_all
        sql: "BEGIN QUERY LOGGING ON ALL;"
      - id: with_options
        sql: "BEGIN QUERY LOGGING WITH SQL, OBJECTS LIMIT SQLTEXT = 500 ON u1;"
      - id: mode_detaildiag
        sql: "BEGIN QUERY LOGGING MODE = 1 DETAILDIAG = 2 STEPETTHRESHOLD = 3 ON u1;"
      - id: limit_threshold
        sql: "BEGIN QUERY LOGGING LIMIT THRESHOLD = 10 CPUTIME ON u1, u2;"
      - id: account
        sql: "BEGIN QUERY LOGGING ON ALL ACCOUNT = ('acct1', 'acct2');"
      - id: applname
        sql: "BEGIN QUERY LOGGING ON APPLNAME = ('app1');"
  - id: flush_query_logging
    name: "FLUSH QUERY LOGGING"
    doc: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/0UHVA4SX02MydYmUFcg5QQ
    tier: low
    probes:
      - id: basic
        sql: "FLUSH QUERY LOGGING WITH ALL;"
      - id: multiple
        sql: "FLUSH QUERY LOGGING WITH DEFAULT, SQL;"
  - id: replace_query_logging
    name: "REPLACE QUERY LOGGING"
    doc: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/8HojJxyBqqYkE4qKLs55Zg
    tier: low
    probes:
      - id: on_all
        sql: "REPLACE QUERY LOGGING ON ALL;"
      - id: with_options
        sql: "REPLACE QUERY LOGGING WITH SQL, STEPINFO LIMIT SUMMARY = 1, 5, 10 ELAPSEDTIME ON u1;"
  - id: end_logging
    name: "END LOGGING"
    doc: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/fPBqzdfb83GiwoHtKE_v0w
    tier: low
    probes:
      - id: basic
        sql: "END LOGGING ON ALL;"
      - id: full
        sql: "END LOGGING DENIALS WITH TEXT ON SELECT, INSERT BY u1 ON TABLE db1.t;"
  - id: end_query_capture
    name: "END QUERY CAPTURE"
    doc: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/qVyLogjMGyU4OYG_mbwrHw
    tier: low
    probes:
      - id: basic
        sql: "END QUERY CAPTURE;"
  - id: end_query_logging
    name: "END QUERY LOGGING"
    doc: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/T7Sfc5HB~~zLcasJ3jRDuA
    tier: low
    probes:
      - id: on_all
        sql: "END QUERY LOGGING ON ALL;"
      - id: user_account
        sql: "END QUERY LOGGING ON u1 ACCOUNT = ('acct1', 'acct2');"
      - id: applname
        sql: "END QUERY LOGGING ON APPLNAME = 'app1';"
  - id: show_query_logging
    name: "SHOW QUERY LOGGING"
    doc: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/cj5pHkiMeENqqyx64Y4gRw
    tier: low
    probes:
      - id: on_all
        sql: "SHOW QUERY LOGGING ON ALL;"
      - id: user
        sql: "SHOW QUERY LOGGING ON u1, db1;"
      - id: applname
        sql: "SHOW QUERY LOGGING ON APPLNAME = ('app1');"
  - id: help_statistics_qcd
    name: "HELP STATISTICS (QCD Form)"
    doc: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/t0hA0yVCObW0ETw8jzJkqQ
    tier: low
    probes:
      - id: basic
        sql: "HELP STATISTICS t FROM qcd1;"
      - id: full
        sql: "HELP CURRENT STATISTICS ON db1.t FROM qcd1 FOR QUERY 1 SAMPLID 2 USING MODIFIED;"
  - id: create_constraint
    name: "CREATE CONSTRAINT (row-level security)"
    doc: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/JKTxuq~5PHhCAYcl2XnTIg
    tier: low
    probes:
      - id: basic
        sql: "CREATE CONSTRAINT c1 SMALLINT, NOT NULL, VALUES (lvl1:1, lvl2:2), INSERT SYSLIB.ins_fn, SELECT SYSLIB.sel_fn;"
  - id: alter_constraint
    name: "ALTER CONSTRAINT (row-level security)"
    doc: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/miID3tkL9FTDb24FbC0fTQ
    tier: low
    probes:
      - id: values
        sql: "ALTER CONSTRAINT c1 AS VALUES (lvl3:3);"
      - id: add_function
        sql: "ALTER CONSTRAINT c1 AS FUNCTION ADD SELECT SYSLIB.sel_fn;"
      - id: replace_function
        sql: "ALTER CONSTRAINT c1 AS FUNCTION REPLACE UPDATE SYSLIB.upd_fn;"
      - id: drop_function
        sql: "ALTER CONSTRAINT c1 AS FUNCTION DROP DELETE;"
  - id: drop_constraint
    name: "DROP CONSTRAINT (row-level security)"
    doc: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/_DNJnUCpo9LdFu5rbUTnfw
    tier: low
    probes:
      - id: basic
        sql: "DROP CONSTRAINT c1;"
  - id: help_online
    name: "HELP ONLINE"
    doc: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/dHqLHI20Ck6SY8O6qVjUuw
    tier: low
    probes:
      - id: help
        sql: "HELP 'HELP';"
      - id: sql_command
        sql: "HELP 'SQL SELECT';"
      - id: spl
        sql: "HELP 'SPL';"
  - id: show_request
    name: "SHOW request (SHOW SELECT/INSERT/...)"
    doc: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/A34BwMAmal6C3YglJMJwcQ
    tier: low
    probes:
      - id: select
        sql: "SHOW SELECT * FROM t;"
      - id: in_xml
        sql: "SHOW IN XML SELECT * FROM t;"
      - id: qualified
        sql: "SHOW QUALIFIED SELECT * FROM t;"
      - id: insert
        sql: "SHOW INSERT INTO t VALUES (1);"
  - id: checkpoint
    name: "CHECKPOINT"
    doc: https://docs.teradata.com/reader/4_jiz05LXsLWBbfvKTLneg/mCz4B9gv1Y9oLK9dnDbNhQ
    tier: low
    probes:
      - id: basic
        sql: "CHECKPOINT t;"
      - id: named
        sql: "CHECKPOINT t, NAMED cp1;"
  - id: comment_retrieving
    name: "COMMENT (Comment-Retrieving Form)"
    doc: https://docs.teradata.com/reader/4_jiz05LXsLWBbfvKTLneg/rXoAx9hqXSXFs_14P_ZBMw
    tier: low
    probes:
      - id: object
        sql: "COMMENT ON TABLE db1.t;"
      - id: no_on
        sql: "COMMENT t;"
      - id: column
        sql: "COMMENT ON COLUMN t.c;"
  - id: echo
    name: "ECHO"
    doc: https://docs.teradata.com/reader/4_jiz05LXsLWBbfvKTLneg/wsUvJBBf3C8YfbkIyPlKLg
    tier: low
    probes:
      - id: string
        sql: "ECHO 'hello';"
      - id: command
        sql: "ECHO '.SET WIDTH 80;';"
      - id: bare
        sql: "ECHO;"
  - id: execute_function
    name: "EXECUTE FUNCTION"
    doc: https://docs.teradata.com/reader/4_jiz05LXsLWBbfvKTLneg/czpJ4HTDtNKRedx1OZ~Uqw
    tier: low
    probes:
      - id: basic
        sql: "EXECUTE FUNCTION TD_ARIMA(t.c);"
  - id: null_statement
    name: "Null statement"
    doc: https://docs.teradata.com/reader/4_jiz05LXsLWBbfvKTLneg/UrmC1cfffwPIpFrp~_OBNA
    tier: low
    probes:
      - id: semicolon
        sql: ";"
      - id: comment
        sql: "/* c */ ;"
  - id: collect_demographics
    name: "COLLECT DEMOGRAPHICS"
    doc: https://docs.teradata.com/reader/4_jiz05LXsLWBbfvKTLneg/2OlF5m~alRdi1NEoW02exg
    tier: low
    probes:
      - id: basic
        sql: "COLLECT DEMOGRAPHICS FOR t INTO qcd1;"
      - id: multiple_all
        sql: "COLLECT DEMOGRAPHICS FOR (db1.t1, t2) INTO qcd1 ALL;"
      - id: no_index
        sql: "COLLECT DEMOGRAPHICS FOR t INTO qcd1 WITH NO INDEX;"
