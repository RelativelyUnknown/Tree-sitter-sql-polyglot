dialect: db2
engine: IBM Db2 for Linux, UNIX and Windows
version: "12.1"
source: https://www.ibm.com/docs/en/db2/12.1.x?topic=reference-statements

statements:
  - id: create_function_aggregate_interface
    name: CREATE FUNCTION (aggregate interface)
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-create-function-aggregate-interface
    tier: high
    probes:
      - id: basic
        sql: "CREATE FUNCTION f(DOUBLE) RETURNS DOUBLE AGGREGATE WITH (s DOUBLE, n INT) USING INITIALIZE PROCEDURE p_init ACCUMULATE PROCEDURE p_acc MERGE PROCEDURE p_merge FINALIZE FUNCTION f_fin;"
      - id: or_replace
        sql: "CREATE OR REPLACE FUNCTION f(DOUBLE) RETURNS DOUBLE AGGREGATE WITH (s DOUBLE) USING INITIALIZE PROCEDURE p_init ACCUMULATE PROCEDURE p_acc MERGE PROCEDURE p_merge FINALIZE FUNCTION f_fin;"
      - id: qualified_designators_with_types
        sql: "CREATE FUNCTION s.f(INT) RETURNS INT AGGREGATE WITH (a INT) USING INITIALIZE PROCEDURE s.p_init(INT) ACCUMULATE PROCEDURE s.p_acc(INT, INT) MERGE PROCEDURE s.p_merge(INT, INT) FINALIZE FUNCTION s.f_fin(INT);"
      - id: specific_designators
        sql: "CREATE FUNCTION f(DOUBLE) RETURNS DOUBLE AGGREGATE WITH (s DOUBLE, n INT) USING INITIALIZE SPECIFIC PROCEDURE p_init ACCUMULATE SPECIFIC PROCEDURE p_acc MERGE SPECIFIC PROCEDURE p_merge FINALIZE SPECIFIC FUNCTION f_fin;"
      - id: in_module
        sql: "CREATE FUNCTION f(DOUBLE) RETURNS DOUBLE AGGREGATE WITH (s DOUBLE) USING IN MODULE m INITIALIZE PROCEDURE p_init ACCUMULATE PROCEDURE p_acc MERGE PROCEDURE p_merge FINALIZE FUNCTION f_fin;"
      - id: parameter_in_name_default
        sql: "CREATE FUNCTION f(IN x DOUBLE DEFAULT 1.0) RETURNS DOUBLE AGGREGATE WITH (s DOUBLE) USING INITIALIZE PROCEDURE p_init ACCUMULATE PROCEDURE p_acc MERGE PROCEDURE p_merge FINALIZE FUNCTION f_fin;"
      - id: parameter_default_null
        sql: "CREATE FUNCTION f(x INT DEFAULT NULL) RETURNS INT AGGREGATE WITH (s INT) USING INITIALIZE PROCEDURE p_init ACCUMULATE PROCEDURE p_acc MERGE PROCEDURE p_merge FINALIZE FUNCTION f_fin;"
      - id: multiple_parameters
        sql: "CREATE FUNCTION f(a INT, b VARCHAR(10), c DECIMAL(5,2)) RETURNS INT AGGREGATE WITH (s INT) USING INITIALIZE PROCEDURE p_init ACCUMULATE PROCEDURE p_acc MERGE PROCEDURE p_merge FINALIZE FUNCTION f_fin;"
      - id: returns_cast_from
        sql: "CREATE FUNCTION f(DOUBLE) RETURNS DECIMAL(8,4) CAST FROM DOUBLE AGGREGATE WITH (s DOUBLE) USING INITIALIZE PROCEDURE p_init ACCUMULATE PROCEDURE p_acc MERGE PROCEDURE p_merge FINALIZE FUNCTION f_fin;"
      - id: state_variable_types
        sql: "CREATE FUNCTION f(DECFLOAT) RETURNS DECFLOAT(34) AGGREGATE WITH (sum DECFLOAT, count INT, tag VARCHAR(20), ts TIMESTAMP(6)) USING INITIALIZE PROCEDURE p_init ACCUMULATE PROCEDURE p_acc MERGE PROCEDURE p_merge FINALIZE FUNCTION f_fin;"
      - id: opt_specific
        sql: "CREATE FUNCTION f(INT) RETURNS INT SPECIFIC f_spec AGGREGATE WITH (s INT) USING INITIALIZE PROCEDURE p_init ACCUMULATE PROCEDURE p_acc MERGE PROCEDURE p_merge FINALIZE FUNCTION f_fin;"
      - id: opt_deterministic
        sql: "CREATE FUNCTION f(INT) RETURNS INT DETERMINISTIC AGGREGATE WITH (s INT) USING INITIALIZE PROCEDURE p_init ACCUMULATE PROCEDURE p_acc MERGE PROCEDURE p_merge FINALIZE FUNCTION f_fin;"
      - id: opt_not_deterministic
        sql: "CREATE FUNCTION f(INT) RETURNS INT NOT DETERMINISTIC AGGREGATE WITH (s INT) USING INITIALIZE PROCEDURE p_init ACCUMULATE PROCEDURE p_acc MERGE PROCEDURE p_merge FINALIZE FUNCTION f_fin;"
      - id: opt_called_on_null_input
        sql: "CREATE FUNCTION f(INT) RETURNS INT CALLED ON NULL INPUT AGGREGATE WITH (s INT) USING INITIALIZE PROCEDURE p_init ACCUMULATE PROCEDURE p_acc MERGE PROCEDURE p_merge FINALIZE FUNCTION f_fin;"
      - id: opt_external_action
        sql: "CREATE FUNCTION f(INT) RETURNS INT EXTERNAL ACTION AGGREGATE WITH (s INT) USING INITIALIZE PROCEDURE p_init ACCUMULATE PROCEDURE p_acc MERGE PROCEDURE p_merge FINALIZE FUNCTION f_fin;"
      - id: opt_no_external_action
        sql: "CREATE FUNCTION f(INT) RETURNS INT NO EXTERNAL ACTION AGGREGATE WITH (s INT) USING INITIALIZE PROCEDURE p_init ACCUMULATE PROCEDURE p_acc MERGE PROCEDURE p_merge FINALIZE FUNCTION f_fin;"
      - id: opt_no_scratchpad
        sql: "CREATE FUNCTION f(INT) RETURNS INT NO SCRATCHPAD AGGREGATE WITH (s INT) USING INITIALIZE PROCEDURE p_init ACCUMULATE PROCEDURE p_acc MERGE PROCEDURE p_merge FINALIZE FUNCTION f_fin;"
      - id: opt_no_final_call
        sql: "CREATE FUNCTION f(INT) RETURNS INT NO FINAL CALL AGGREGATE WITH (s INT) USING INITIALIZE PROCEDURE p_init ACCUMULATE PROCEDURE p_acc MERGE PROCEDURE p_merge FINALIZE FUNCTION f_fin;"
      - id: opt_allow_parallel
        sql: "CREATE FUNCTION f(INT) RETURNS INT ALLOW PARALLEL AGGREGATE WITH (s INT) USING INITIALIZE PROCEDURE p_init ACCUMULATE PROCEDURE p_acc MERGE PROCEDURE p_merge FINALIZE FUNCTION f_fin;"
      - id: opt_secured
        sql: "CREATE FUNCTION f(INT) RETURNS INT SECURED AGGREGATE WITH (s INT) USING INITIALIZE PROCEDURE p_init ACCUMULATE PROCEDURE p_acc MERGE PROCEDURE p_merge FINALIZE FUNCTION f_fin;"
      - id: opt_not_secured
        sql: "CREATE FUNCTION f(INT) RETURNS INT NOT SECURED AGGREGATE WITH (s INT) USING INITIALIZE PROCEDURE p_init ACCUMULATE PROCEDURE p_acc MERGE PROCEDURE p_merge FINALIZE FUNCTION f_fin;"
      - id: options_combined
        sql: "CREATE FUNCTION f(INT) RETURNS INT SPECIFIC f_spec DETERMINISTIC CALLED ON NULL INPUT NO EXTERNAL ACTION NO SCRATCHPAD NO FINAL CALL ALLOW PARALLEL NOT SECURED AGGREGATE WITH (s INT) USING INITIALIZE PROCEDURE p_init ACCUMULATE PROCEDURE p_acc MERGE PROCEDURE p_merge FINALIZE FUNCTION f_fin;"
    examples:
      - "CREATE OR REPLACE FUNCTION myavg(DOUBLE) RETURNS mydouble AGGREGATE WITH (sum DOUBLE, count INT) USING INITIALIZE SPECIFIC PROCEDURE myavg_initialize ACCUMULATE SPECIFIC PROCEDURE myavg_accumulate MERGE SPECIFIC PROCEDURE myavg_merge FINALIZE SPECIFIC FUNCTION myavg_finalize;"
      - "CREATE OR REPLACE FUNCTION myavg(DECFLOAT) RETURNS DECFLOAT(34) AGGREGATE WITH (sum DECFLOAT, count INT) USING INITIALIZE PROCEDURE myavg_initialize ACCUMULATE PROCEDURE myavg_accumulate MERGE PROCEDURE myavg_merge FINALIZE FUNCTION myavg_finalize;"

  - id: create_function_external_scalar
    name: CREATE FUNCTION (external scalar)
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-create-function-external-scalar
    tier: high
    probes:
      - id: basic
        sql: "CREATE FUNCTION f(INT) RETURNS INT EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL;"
      - id: or_replace
        sql: "CREATE OR REPLACE FUNCTION f(INT) RETURNS INT EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL;"
      - id: no_parameters
        sql: "CREATE FUNCTION f() RETURNS INT EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL;"
      - id: qualified_name
        sql: "CREATE FUNCTION s.f(INT) RETURNS INT EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL;"
      - id: parameter_named_default
        sql: "CREATE FUNCTION f(x INT DEFAULT 1) RETURNS INT EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL;"
      - id: parameter_in_out_inout
        sql: "CREATE FUNCTION f(IN a INT, OUT b INT, INOUT c INT) RETURNS INT EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL;"
      - id: parameter_as_locator
        sql: "CREATE FUNCTION f(x BLOB(1M) AS LOCATOR) RETURNS INT EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL;"
      - id: parameter_distinct_type
        sql: "CREATE FUNCTION f(x my_distinct) RETURNS INT EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL;"
      - id: parameter_ref_type
        sql: "CREATE FUNCTION f(x REF(emp_t)) RETURNS INT EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL;"
      - id: parameter_for_bit_data
        sql: "CREATE FUNCTION f(x VARCHAR(10) FOR BIT DATA) RETURNS INT EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL;"
      - id: returns_as_locator
        sql: "CREATE FUNCTION f(INT) RETURNS CLOB(1M) AS LOCATOR EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL;"
      - id: returns_cast_from
        sql: "CREATE FUNCTION f(INT) RETURNS DECIMAL(8,4) CAST FROM FLOAT EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL;"
      - id: returns_cast_from_locator
        sql: "CREATE FUNCTION f(INT) RETURNS BLOB(1M) CAST FROM BLOB(1M) AS LOCATOR EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL;"
      - id: lang_java
        sql: "CREATE FUNCTION f(INT) RETURNS INT EXTERNAL NAME 'Cls!meth' LANGUAGE JAVA PARAMETER STYLE JAVA;"
      - id: lang_clr
        sql: "CREATE FUNCTION f(INT) RETURNS INT EXTERNAL NAME 'asm!cls!meth' LANGUAGE CLR PARAMETER STYLE SQL;"
      - id: lang_ole
        sql: "CREATE FUNCTION f(INT) RETURNS INT EXTERNAL NAME 'progid!meth' LANGUAGE OLE PARAMETER STYLE SQL;"
      - id: lang_cpp
        sql: "CREATE FUNCTION f(INT) RETURNS INT EXTERNAL NAME 'mod!fn' LANGUAGE CPP PARAMETER STYLE SQL;"
      - id: lang_python
        sql: "CREATE FUNCTION f(INT) RETURNS INT EXTERNAL NAME 'mod!fn' LANGUAGE PYTHON PARAMETER STYLE SQL;"
      - id: external_name_identifier
        sql: "CREATE FUNCTION f(INT) RETURNS INT EXTERNAL NAME fn_ident LANGUAGE C PARAMETER STYLE SQL;"
      - id: external_without_name
        sql: "CREATE FUNCTION f(INT) RETURNS INT EXTERNAL LANGUAGE C PARAMETER STYLE SQL;"
      - id: specific
        sql: "CREATE FUNCTION f(INT) RETURNS INT SPECIFIC f_spec EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL;"
      - id: parameter_style_db2general
        sql: "CREATE FUNCTION f(INT) RETURNS INT EXTERNAL NAME 'Cls!meth' LANGUAGE JAVA PARAMETER STYLE DB2GENERAL;"
      - id: parameter_style_npsgeneric
        sql: "CREATE FUNCTION f(INT) RETURNS INT EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE NPSGENERIC;"
      - id: parameter_ccsid_ascii
        sql: "CREATE FUNCTION f(INT) RETURNS INT EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL PARAMETER CCSID ASCII;"
      - id: parameter_ccsid_unicode
        sql: "CREATE FUNCTION f(INT) RETURNS INT EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL PARAMETER CCSID UNICODE;"
      - id: not_deterministic
        sql: "CREATE FUNCTION f(INT) RETURNS INT EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL NOT DETERMINISTIC;"
      - id: deterministic
        sql: "CREATE FUNCTION f(INT) RETURNS INT EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL DETERMINISTIC;"
      - id: fenced
        sql: "CREATE FUNCTION f(INT) RETURNS INT EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL FENCED;"
      - id: fenced_threadsafe
        sql: "CREATE FUNCTION f(INT) RETURNS INT EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL FENCED THREADSAFE;"
      - id: fenced_not_threadsafe
        sql: "CREATE FUNCTION f(INT) RETURNS INT EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL FENCED NOT THREADSAFE;"
      - id: not_fenced
        sql: "CREATE FUNCTION f(INT) RETURNS INT EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL NOT FENCED;"
      - id: not_fenced_threadsafe
        sql: "CREATE FUNCTION f(INT) RETURNS INT EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL NOT FENCED THREADSAFE;"
      - id: returns_null_on_null_input
        sql: "CREATE FUNCTION f(INT) RETURNS INT EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL RETURNS NULL ON NULL INPUT;"
      - id: called_on_null_input
        sql: "CREATE FUNCTION f(INT) RETURNS INT EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL CALLED ON NULL INPUT;"
      - id: reads_sql_data
        sql: "CREATE FUNCTION f(INT) RETURNS INT EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL READS SQL DATA;"
      - id: no_sql
        sql: "CREATE FUNCTION f(INT) RETURNS INT EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL NO SQL;"
      - id: contains_sql
        sql: "CREATE FUNCTION f(INT) RETURNS INT EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL CONTAINS SQL;"
      - id: static_dispatch
        sql: "CREATE FUNCTION f(INT) RETURNS INT EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL STATIC DISPATCH;"
      - id: external_action
        sql: "CREATE FUNCTION f(INT) RETURNS INT EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL EXTERNAL ACTION;"
      - id: no_external_action
        sql: "CREATE FUNCTION f(INT) RETURNS INT EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL NO EXTERNAL ACTION;"
      - id: no_scratchpad
        sql: "CREATE FUNCTION f(INT) RETURNS INT EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL NO SCRATCHPAD;"
      - id: scratchpad
        sql: "CREATE FUNCTION f(INT) RETURNS INT EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL SCRATCHPAD;"
      - id: scratchpad_length
        sql: "CREATE FUNCTION f(INT) RETURNS INT EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL SCRATCHPAD 100;"
      - id: no_final_call
        sql: "CREATE FUNCTION f(INT) RETURNS INT EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL NO FINAL CALL;"
      - id: final_call
        sql: "CREATE FUNCTION f(INT) RETURNS INT EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL FINAL CALL;"
      - id: allow_parallel
        sql: "CREATE FUNCTION f(INT) RETURNS INT EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL ALLOW PARALLEL;"
      - id: disallow_parallel
        sql: "CREATE FUNCTION f(INT) RETURNS INT EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL DISALLOW PARALLEL;"
      - id: no_dbinfo
        sql: "CREATE FUNCTION f(INT) RETURNS INT EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL NO DBINFO;"
      - id: dbinfo
        sql: "CREATE FUNCTION f(INT) RETURNS INT EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL DBINFO;"
      - id: transform_group
        sql: "CREATE FUNCTION f(emp_t) RETURNS INT EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL TRANSFORM GROUP grp;"
      - id: inherit_special_registers
        sql: "CREATE FUNCTION f(INT) RETURNS INT EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL INHERIT SPECIAL REGISTERS;"
      - id: secured
        sql: "CREATE FUNCTION f(INT) RETURNS INT EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL SECURED;"
      - id: not_secured
        sql: "CREATE FUNCTION f(INT) RETURNS INT EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL NOT SECURED;"
      - id: stay_resident_yes
        sql: "CREATE FUNCTION f(INT) RETURNS INT EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL STAY RESIDENT YES;"
      - id: stay_resident_no
        sql: "CREATE FUNCTION f(INT) RETURNS INT EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL STAY RESIDENT NO;"
      - id: predicates_filter_using
        sql: "CREATE FUNCTION f(INT, INT) RETURNS INT EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL PREDICATES (WHEN = 1 FILTER USING g(a, b));"
      - id: predicates_expression_as
        sql: "CREATE FUNCTION f(INT, INT) RETURNS INT EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL PREDICATES (WHEN > 1 EXPRESSION AS e FILTER USING g(e));"
      - id: predicates_search_by_exact_index
        sql: "CREATE FUNCTION f(INT, INT) RETURNS INT EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL PREDICATES (WHEN <> 0 SEARCH BY EXACT INDEX EXTENSION ie WHEN KEY (a) USE sm(b));"
      - id: predicates_search_by_index
        sql: "CREATE FUNCTION f(INT, INT) RETURNS INT EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL PREDICATES (WHEN <= 5 SEARCH BY INDEX EXTENSION ie WHEN KEY (a) USE sm(b, c));"
      - id: options_combined
        sql: "CREATE FUNCTION s.f(FLOAT, FLOAT) RETURNS DECIMAL(8,4) CAST FROM FLOAT SPECIFIC f_spec EXTERNAL NAME 'mod!fn' LANGUAGE C PARAMETER STYLE SQL DETERMINISTIC FENCED THREADSAFE RETURNS NULL ON NULL INPUT NO SQL NO EXTERNAL ACTION SCRATCHPAD NO FINAL CALL DISALLOW PARALLEL NO DBINFO NOT SECURED;"
    examples:
      - "CREATE FUNCTION CENTER (INT,FLOAT) RETURNS FLOAT EXTERNAL NAME 'mod!middle' LANGUAGE C PARAMETER STYLE SQL DETERMINISTIC NO SQL NO EXTERNAL ACTION;"
      - "CREATE FUNCTION PELLOW.CENTER ( FLOAT, FLOAT, FLOAT ) RETURNS DECIMAL (8,4) CAST FROM FLOAT SPECIFIC FOCUS92 EXTERNAL NAME 'effects!focalpt' LANGUAGE C PARAMETER STYLE SQL DETERMINISTIC FENCED NOT NULL CALL NO SQL NO EXTERNAL ACTION SCRATCHPAD NO FINAL CALL DISALLOW PARALLEL;"
      - "CREATE FUNCTION ntest1 ( SMALLINT ) RETURNS SMALLINT EXTERNAL NAME 'ntest1!nudft1' LANGUAGE C PARAMETER STYLE SQL DETERMINISTIC NOT FENCED NULL CALL NO SQL NO EXTERNAL ACTION;"
