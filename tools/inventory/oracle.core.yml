              sysdate, 'PU_CLERK', 1.2E3, NULL);
      - |-
        INSERT INTO
           (SELECT employee_id, last_name, email, hire_date, job_id,
              salary, commission_pct FROM employees)
           VALUES (207, 'Gregory', 'pgregory@example.com',
              sysdate, 'PU_CLERK', 1.2E3, NULL);
      - |-
        INSERT INTO raises
           SELECT employee_id, salary*1.1 FROM employees
           WHERE commission_pct > .2
           LOG ERRORS INTO errlog ('my_bad') REJECT LIMIT 10;
      - |-
        INSERT INTO employees
              (employee_id, last_name, email, hire_date, job_id, salary)
           VALUES
           (employees_seq.nextval, 'Doe', 'john.doe@example.com',
               SYSDATE, 'SH_CLERK', 2400)
           RETURNING salary*12, job_id INTO :bnd1, :bnd2;
      - |-
        INSERT INTO employees SET
         (employee_id = 210, last_name = 'Smith', email = 'ASMITH', hire_date = SYSDATE, job_id = 'AD_ASST'),
         (employee_id = 211, last_name = 'Roddick', email = 'ARODDICK', hire_date = SYSDATE, job_id = 'IT_PROG');

  - id: insert_multitable
    name: INSERT (multi_table_insert)
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/INSERT.html
    tier: high
    probes:
      - id: insert_all_unconditional
        sql: "INSERT ALL INTO t (c, d) VALUES (a, b) INTO u (c) VALUES (a) SELECT a, b FROM v;"
      - id: insert_all_no_values
        sql: "INSERT ALL INTO t INTO u SELECT a, b FROM v;"
      - id: insert_all_when
        sql: "INSERT ALL WHEN a <= 100 THEN INTO t WHEN a > 100 THEN INTO u SELECT a, b FROM v;"
      - id: insert_all_when_else
        sql: "INSERT ALL WHEN a <= 100 THEN INTO t VALUES (a, b) ELSE INTO u VALUES (a, b) SELECT a, b FROM v;"
      - id: insert_first
        sql: "INSERT FIRST WHEN a <= 100 THEN INTO t VALUES (a, b) WHEN a <= 200 THEN INTO u VALUES (a, b) ELSE INTO w VALUES (a, b) SELECT a, b FROM v;"
      - id: when_multiple_into
        sql: "INSERT ALL WHEN a > 0 THEN INTO t (c) VALUES (a) INTO u (c) VALUES (b) SELECT a, b FROM v;"
      - id: conditional_without_all
        sql: "INSERT WHEN a > 0 THEN INTO t VALUES (a, b) SELECT a, b FROM v;"
      - id: log_errors
        sql: "INSERT ALL INTO t VALUES (a, b) LOG ERRORS INTO errlog REJECT LIMIT UNLIMITED INTO u VALUES (a, b) SELECT a, b FROM v;"
      - id: set_clause
        sql: "INSERT ALL INTO t SET c = a, d = b INTO u SET c = a SELECT a, b FROM v;"
      - id: hint
        sql: "INSERT /*+ APPEND */ ALL INTO t VALUES (a, b) SELECT a, b FROM v;"
      - id: insert_all_dual
        sql: "INSERT ALL INTO t (c, d) VALUES (1, 'a') INTO t (c, d) VALUES (2, 'b') SELECT * FROM DUAL;"
    examples:
      - |-
        INSERT ALL
              INTO sales (prod_id, cust_id, time_id, amount)
              VALUES (product_id, customer_id, weekly_start_date, sales_sun)
              INTO sales (prod_id, cust_id, time_id, amount)
              VALUES (product_id, customer_id, weekly_start_date+1, sales_mon)
              INTO sales (prod_id, cust_id, time_id, amount)
              VALUES (product_id, customer_id, weekly_start_date+2, sales_tue)
              INTO sales (prod_id, cust_id, time_id, amount)
              VALUES (product_id, customer_id, weekly_start_date+3, sales_wed)
              INTO sales (prod_id, cust_id, time_id, amount)
              VALUES (product_id, customer_id, weekly_start_date+4, sales_thu)
              INTO sales (prod_id, cust_id, time_id, amount)
              VALUES (product_id, customer_id, weekly_start_date+5, sales_fri)
              INTO sales (prod_id, cust_id, time_id, amount)
              VALUES (product_id, customer_id, weekly_start_date+6, sales_sat)
           SELECT product_id, customer_id, weekly_start_date, sales_sun,
              sales_mon, sales_tue, sales_wed, sales_thu, sales_fri, sales_sat
              FROM sales_input_table;
      - |-
        INSERT ALL
           WHEN order_total <= 100000 THEN
              INTO small_orders
           WHEN order_total > 1000000 AND order_total <= 200000 THEN
              INTO medium_orders
           WHEN order_total > 200000 THEN
              INTO large_orders
           SELECT order_id, order_total, sales_rep_id, customer_id
              FROM orders;
      - |-
        INSERT FIRST
           WHEN ottl <= 100000 THEN
              INTO small_orders
                 VALUES(oid, ottl, sid, cid)
           WHEN ottl > 100000 and ottl <= 200000 THEN
              INTO medium_orders
                 VALUES(oid, ottl, sid, cid)
           WHEN ottl > 290000 THEN
              INTO special_orders
           WHEN ottl > 200000 THEN
              INTO large_orders
                 VALUES(oid, ottl, sid, cid)
           SELECT o.order_id oid, o.customer_id cid, o.order_total ottl,
              o.sales_rep_id sid, c.credit_limit cl, c.cust_email cem
              FROM orders o, customers c
              WHERE o.customer_id = c.customer_id;

  - id: update
    name: UPDATE
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/UPDATE.html
    tier: high
    probes:
      - id: basic
        sql: "UPDATE t SET c = 1 WHERE id = 2;"
      - id: no_where
        sql: "UPDATE t SET c = NULL;"
      - id: multiple_columns
        sql: "UPDATE t SET c = c + 1, d = 'x', e = DEFAULT WHERE id = 2;"
      - id: alias
        sql: "UPDATE s.t x SET x.c = 1 WHERE x.id = 2;"
      - id: hint
        sql: "UPDATE /*+ INDEX(t idx) */ t SET c = 1 WHERE id = 2;"
      - id: scalar_subquery
        sql: "UPDATE t SET c = (SELECT MAX(c) FROM u WHERE u.id = t.id);"
      - id: column_list_subquery
        sql: "UPDATE t a SET (c, d) = (SELECT AVG(c), AVG(d) FROM u b WHERE a.id = b.id) WHERE a.k = 1;"
      - id: column_list_expressions
        sql: "UPDATE t SET (c, d) = (1, DEFAULT) WHERE id = 2;"
      - id: mixed_set
        sql: "UPDATE t SET c = 1, (d, e) = (SELECT d, e FROM u WHERE u.id = 1) WHERE id = 2;"
      - id: set_value
        sql: "UPDATE t p SET VALUE(p) = (SELECT VALUE(q) FROM u q WHERE p.id = q.id) WHERE p.id = 10;"
      - id: only
        sql: "UPDATE ONLY (v) SET c = 1;"
      - id: partition
        sql: "UPDATE t PARTITION (p1) x SET x.c = 1 WHERE d > 10;"
      - id: partition_for
        sql: "UPDATE t PARTITION FOR (100) SET c = 1;"
      - id: dblink
        sql: "UPDATE t@remote SET c = c * 1.1 WHERE d = 'x';"
      - id: subquery_target
        sql: "UPDATE (SELECT c FROM t WHERE d > 0) SET c = 1;"
      - id: subquery_target_check_option
        sql: "UPDATE (SELECT c, d FROM t WHERE d > 0 WITH CHECK OPTION) SET c = 1;"
      - id: table_collection
        sql: "UPDATE TABLE(SELECT h.people FROM h WHERE h.id = 1) p SET p.salary = p.salary + 100;"
      - id: from_clause
        sql: "UPDATE t SET t.c = u.c FROM u WHERE u.id = t.id;"
      - id: from_join
        sql: "UPDATE t SET t.c = u.c FROM u JOIN v ON u.id = v.id WHERE u.id = t.id;"
      - id: using_clause
        sql: "UPDATE t SET t.c = u.c USING u WHERE u.id = t.id;"
      - id: nowait
        sql: "UPDATE t SET c = 1 WHERE id = 2 NOWAIT;"
      - id: wait_seconds
        sql: "UPDATE t SET c = 1 WHERE id = 2 WAIT 10 SECONDS;"
      - id: order_by
        sql: "UPDATE t SET c = c + 1 WHERE d > 0 ORDER BY id;"
      - id: returning_into
        sql: "UPDATE t SET c = c + 1 WHERE id = 2 RETURNING c * 2, d INTO :b1, :b2;"
      - id: returning_aggregate
        sql: "UPDATE t SET c = c * 1.1 WHERE d = 100 RETURNING SUM(c) INTO :b1;"
      - id: returning_old_new
        sql: "UPDATE t SET c = c + 1 WHERE id = 2 RETURNING OLD c, NEW c INTO :b1, :b2;"
      - id: return_into
        sql: "UPDATE t SET c = 1 WHERE id = 2 RETURN c INTO :b1;"
      - id: log_errors
        sql: "UPDATE t SET c = c + 1 LOG ERRORS INTO errlog ('upd') REJECT LIMIT UNLIMITED;"
    examples:
      - |-
        UPDATE employees e
        SET    e.salary = j.max_salary
        FROM   jobs j
        WHERE  j.job_id = e.job_id;
      - |-
        UPDATE employees a
            SET department_id =
                (SELECT department_id
                    FROM departments
                    WHERE location_id = '2100'),
                (salary, commission_pct) =
                (SELECT 1.1*AVG(salary), 1.5*AVG(commission_pct)
                  FROM employees b
                  WHERE a.department_id = b.department_id)
            WHERE department_id IN
                (SELECT department_id
                  FROM departments
                  WHERE location_id = 2900
                      OR location_id = 2700);
      - |-
        UPDATE sales PARTITION (sales_q1_1999) s
           SET s.promo_id = 494
           WHERE amount_sold > 1000;
      - |-
        UPDATE employees
          SET job_id ='SA_MAN', salary = salary + 1000, department_id = 140
          WHERE last_name = 'Jones'
          RETURNING salary*0.25, last_name, department_id
            INTO :bnd1, :bnd2, :bnd3;
      - |-
        UPDATE hr.employees SET commission_pct = commission_pct + 1
          WHERE employee_id = 100 WAIT 10 seconds;

  - id: delete
    name: DELETE
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/DELETE.html
    tier: high
    probes:
      - id: basic
        sql: "DELETE FROM t WHERE c = 1;"
      - id: without_from
        sql: "DELETE t WHERE c = 1;"
      - id: all_rows
        sql: "DELETE FROM t;"
      - id: alias
        sql: "DELETE FROM s.t x WHERE x.c = 1;"
      - id: hint
        sql: "DELETE /*+ PARALLEL(t, 4) */ FROM t WHERE c = 1;"
      - id: only
        sql: "DELETE FROM ONLY (v) WHERE c = 1;"
      - id: partition
        sql: "DELETE FROM t PARTITION (p1) WHERE c > 1000;"
      - id: subpartition_for
        sql: "DELETE FROM t SUBPARTITION FOR (100, 'A');"
      - id: dblink
        sql: "DELETE FROM s.t@remote WHERE c > 3000;"
      - id: subquery_target
        sql: "DELETE FROM (SELECT * FROM t) WHERE c = 1;"
      - id: subquery_target_no_from
        sql: "DELETE (SELECT * FROM t WHERE d > 0) WHERE c = 1;"
      - id: table_collection
        sql: "DELETE TABLE(SELECT h.people FROM h WHERE h.id = 1) p WHERE p.salary > 1000;"
      - id: from_clause
        sql: "DELETE FROM t FROM u WHERE t.id = u.id;"
      - id: from_join
        sql: "DELETE FROM t x FROM u JOIN v ON u.id = v.id WHERE x.id = u.id;"
      - id: using_clause
        sql: "DELETE FROM t USING u WHERE t.id = u.id;"
      - id: tuple_in_subquery
        sql: "DELETE t x WHERE (x.c, x.d) IN (SELECT c, MAX(d) FROM t GROUP BY c);"
      - id: nowait
        sql: "DELETE FROM t WHERE c = 1 NOWAIT;"
      - id: wait
        sql: "DELETE FROM t WHERE c = 1 WAIT 10;"
      - id: returning_into
        sql: "DELETE FROM t WHERE c = 1 RETURNING d INTO :b1;"
      - id: returning_old
        sql: "DELETE FROM t WHERE c = 1 RETURNING OLD d INTO :b1;"
      - id: log_errors
        sql: "DELETE FROM t WHERE c = 1 LOG ERRORS INTO errlog REJECT LIMIT 10;"
    examples:
      - |-
        DELETE FROM t
        FROM s
        WHERE t.t1 = s.s1;
      - |-
        DELETE FROM employees
           WHERE job_id = 'SA_REP'
           AND commission_pct < .2;
      - |-
        DELETE FROM (SELECT * FROM employees)
           WHERE job_id = 'SA_REP'
           AND commission_pct < .2;
      - |-
        DELETE FROM employees
           WHERE job_id = 'SA_REP'
           AND hire_date + TO_YMINTERVAL('01-00') < SYSDATE
           RETURNING salary INTO :bnd1;
      - |-
        DELETE product_price_history pp
        WHERE  (product_id, currency_code, effective_from_date)
           IN (SELECT product_id, currency_code, Max(effective_from_date)
               FROM   product_price_history
               GROUP BY product_id, currency_code);

  - id: merge
    name: MERGE
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/MERGE.html
    tier: high
    probes:
      - id: update_and_insert
        sql: "MERGE INTO t USING u ON (t.id = u.id) WHEN MATCHED THEN UPDATE SET t.c = u.c WHEN NOT MATCHED THEN INSERT (t.id, t.c) VALUES (u.id, u.c);"
      - id: update_only
        sql: "MERGE INTO t USING u ON (t.id = u.id) WHEN MATCHED THEN UPDATE SET t.c = u.c, t.d = DEFAULT;"
      - id: insert_only
        sql: "MERGE INTO t USING u ON (t.id = u.id) WHEN NOT MATCHED THEN INSERT VALUES (u.id, u.c);"
      - id: aliases_schema
        sql: "MERGE INTO s.t d USING s.u x ON (d.id = x.id) WHEN MATCHED THEN UPDATE SET d.c = x.c;"
      - id: hint
        sql: "MERGE /*+ APPEND */ INTO t USING u ON (t.id = u.id) WHEN NOT MATCHED THEN INSERT (id) VALUES (u.id);"
      - id: using_subquery
        sql: "MERGE INTO t USING (SELECT id, c FROM u WHERE k = 80) x ON (t.id = x.id) WHEN MATCHED THEN UPDATE SET t.c = t.c + x.c * .01;"
      - id: using_values
        sql: "MERGE INTO t USING (VALUES (1, 'a'), (2, 'b')) v (id, c) ON (t.id = v.id) WHEN MATCHED THEN UPDATE SET t.c = v.c WHEN NOT MATCHED THEN INSERT (id, c) VALUES (v.id, v.c);"
      - id: without_using
        sql: "MERGE INTO t ON (id = :id) WHEN MATCHED THEN UPDATE SET c = :c WHEN NOT MATCHED THEN INSERT (id, c) VALUES (:id, :c);"
      - id: update_where
        sql: "MERGE INTO t USING u ON (t.id = u.id) WHEN MATCHED THEN UPDATE SET t.c = u.c WHERE u.k > 0;"
      - id: update_delete_where
        sql: "MERGE INTO t USING u ON (t.id = u.id) WHEN MATCHED THEN UPDATE SET t.c = u.c DELETE WHERE (u.c > 8000);"
      - id: update_column_list_subquery
        sql: "MERGE INTO t USING u ON (t.id = u.id) WHEN MATCHED THEN UPDATE SET (t.c, t.d) = (SELECT c, d FROM v WHERE v.id = u.id);"
      - id: insert_where
        sql: "MERGE INTO t USING u ON (t.id = u.id) WHEN NOT MATCHED THEN INSERT (t.id, t.c) VALUES (u.id, u.c) WHERE (u.c <= 8000);"
      - id: insert_default
        sql: "MERGE INTO t USING u ON (t.id = u.id) WHEN NOT MATCHED THEN INSERT (id, c) VALUES (u.id, DEFAULT);"
      - id: insert_set
        sql: "MERGE INTO t USING u ON (t.id = u.id) WHEN NOT MATCHED THEN INSERT SET id = u.id, c = u.c;"
      - id: insert_before_update
        sql: "MERGE INTO t USING u ON (t.id = u.id) WHEN NOT MATCHED THEN INSERT (id, c) VALUES (u.id, u.c) WHEN MATCHED THEN UPDATE SET t.c = u.c;"
        note: "The syntax lists merge_update_clause before merge_insert_clause; the semantics say the clauses can be specified in either order."
      - id: wait
        sql: "MERGE INTO t USING u ON (t.id = u.id) WHEN MATCHED THEN UPDATE SET t.c = u.c WAIT 10;"
      - id: nowait
        sql: "MERGE INTO t USING u ON (t.id = u.id) WHEN MATCHED THEN UPDATE SET t.c = u.c NOWAIT;"
      - id: log_errors
        sql: "MERGE INTO t USING u ON (t.id = u.id) WHEN MATCHED THEN UPDATE SET t.c = u.c LOG ERRORS INTO errlog ('m') REJECT LIMIT UNLIMITED;"
      - id: returning_into
        sql: "MERGE INTO t USING u ON (t.id = u.id) WHEN MATCHED THEN UPDATE SET t.c = u.c RETURNING NEW t.c INTO :b1;"
    examples:
      - |-
        MERGE INTO bonuses D
           USING (SELECT employee_id, salary, department_id FROM hr.employees
           WHERE department_id = 80) S
           ON (D.employee_id = S.employee_id)
           WHEN MATCHED THEN UPDATE SET D.bonus = D.bonus + S.salary*.01
             DELETE WHERE (S.salary > 8000)
           WHEN NOT MATCHED THEN INSERT (D.employee_id, D.bonus)
             VALUES (S.employee_id, S.salary*.01)
             WHERE (S.salary <= 8000);
      - |-
        MERGE INTO people_target pt
        USING people_source ps
        ON    (pt.person_id = ps.person_id)
        WHEN MATCHED THEN UPDATE
          SET pt.first_name = ps.first_name,
              pt.last_name = ps.last_name,
              pt.title = ps.title
          DELETE where pt.title  = 'Mrs.'
        WHEN NOT MATCHED THEN INSERT
          (pt.person_id, pt.first_name, pt.last_name, pt.title)
          VALUES (ps.person_id, ps.first_name, ps.last_name, ps.title)
          WHERE ps.title = 'Mr';
      - |-
        MERGE INTO people_target
          ON (person_id = :person_id)
        WHEN MATCHED THEN UPDATE
        SET first_name = :first_name,
            last_name = :last_name,
            title = :title
        WHEN NOT MATCHED THEN INSERT
            (person_id, first_name, last_name, title)
            VALUES (:person_id, :first_name, :last_name, :title);
      - |-
        MERGE INTO employees target USING employees_updates source
         ON(target.employee_id = source.employee_id )
         WHEN MATCHED THEN
           UPDATE SET
             target.first_name=source.first_name,
             target.last_name=source.last_name,
             target.salary=source.salary
        WHEN NOT MATCHED THEN
          INSERT (employee_id, first_name, last_name, salary)
          VALUES ( source.employee_id, source.first_name, source.last_name, source_salary)
          WAIT 10;

