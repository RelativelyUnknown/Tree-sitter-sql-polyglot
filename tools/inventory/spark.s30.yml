dialect: spark
engine: Apache Spark SQL
version: "4.x (docs/latest)"
source: https://spark.apache.org/docs/latest/sql-ref-syntax.html

statements:
  - id: show_views
    name: SHOW VIEWS
    doc: https://spark.apache.org/docs/latest/sql-ref-syntax-aux-show-views.html
    tier: medium
    probes:
      - { id: basic, sql: "SHOW VIEWS;" }
      - { id: from_database, sql: "SHOW VIEWS FROM db;" }
      - { id: in_database, sql: "SHOW VIEWS IN db;" }
      - { id: like_pattern, sql: "SHOW VIEWS LIKE 'v*';" }
      - { id: in_database_like, sql: "SHOW VIEWS IN db LIKE 'v*|w*';" }

  - id: uncache_table
    name: UNCACHE TABLE
    doc: https://spark.apache.org/docs/latest/sql-ref-syntax-aux-cache-uncache-table.html
    tier: medium
    probes:
      - { id: basic, sql: "UNCACHE TABLE t;" }
      - { id: if_exists, sql: "UNCACHE TABLE IF EXISTS t;" }
      - { id: qualified, sql: "UNCACHE TABLE db.t;" }

  - id: list_file
    name: LIST FILE
    doc: https://spark.apache.org/docs/latest/sql-ref-syntax-aux-resource-mgmt-list-file.html
    tier: low
    probes:
      - { id: list_file, sql: "LIST FILE;" }
      - { id: list_files_name, sql: "LIST FILES /tmp/test;" }

  - id: list_jar
    name: LIST JAR
    doc: https://spark.apache.org/docs/latest/sql-ref-syntax-aux-resource-mgmt-list-jar.html
    tier: low
    probes:
      - { id: list_jar, sql: "LIST JAR;" }
      - { id: list_jars_name, sql: "LIST JARS /tmp/test.jar;" }

  - id: refresh_function
    name: REFRESH FUNCTION
    doc: https://spark.apache.org/docs/latest/sql-ref-syntax-aux-cache-refresh-function.html
    tier: low
    probes:
      - { id: basic, sql: "REFRESH FUNCTION f;" }
      - { id: qualified, sql: "REFRESH FUNCTION db.f;" }

  - id: set_path
    name: SET PATH
    doc: https://spark.apache.org/docs/latest/sql-ref-syntax-aux-conf-mgmt-set-path.html
    tier: low
    probes:
      - { id: default_path, sql: "SET PATH = DEFAULT_PATH;" }
      - { id: schema_list, sql: "SET PATH = cat.s1, cat.s2;" }
      - { id: keywords, sql: "SET PATH = SYSTEM_PATH, CURRENT_SCHEMA;" }

  - id: show_collations
    name: SHOW COLLATIONS
    doc: https://spark.apache.org/docs/latest/sql-ref-syntax-aux-show-collations.html
    tier: low
    probes:
      - { id: basic, sql: "SHOW COLLATIONS;" }
      - { id: like_pattern, sql: "SHOW COLLATIONS LIKE 'UTF8*';" }
