  - id: set_operators_union
    name: "Set Operators - UNION"
    doc: https://learn.microsoft.com/en-us/sql/t-sql/language-elements/set-operators-union-transact-sql
    tier: high
    probes:
      - id: union
        sql: "SELECT c FROM t UNION SELECT c FROM u;"
      - id: union_all
        sql: "SELECT c FROM t UNION ALL SELECT c FROM u;"
      - id: chain
        sql: "SELECT c FROM t UNION ALL SELECT c FROM u UNION SELECT c FROM v;"
      - id: parenthesized_right
        sql: "SELECT c FROM t UNION ALL (SELECT c FROM u UNION SELECT c FROM v);"
      - id: parenthesized_left
        sql: "(SELECT c FROM t UNION SELECT c FROM u) UNION ALL SELECT c FROM v;"
      - id: order_by_result
        sql: "SELECT c FROM t UNION SELECT c FROM u ORDER BY c;"
      - id: into_first_query
        sql: "SELECT c INTO r FROM t UNION SELECT c FROM u;"
    examples:
      - |-
        -- Here is the simple union.
        -- Uses AdventureWorks

        SELECT ProductModelID, Name
        FROM Production.ProductModel
        WHERE ProductModelID NOT IN (3, 4)
        UNION
        SELECT ProductModelID, Name
        FROM dbo.Gloves
        ORDER BY Name;
      - |-
        -- Uses AdventureWorks

        SELECT ProductModelID, Name
        INTO dbo.ProductResults
        FROM Production.ProductModel
        WHERE ProductModelID NOT IN (3, 4)
        UNION
        SELECT ProductModelID, Name
        FROM dbo.Gloves;
      - |-
        -- Union ALL
        SELECT LastName, FirstName, JobTitle
        FROM dbo.EmployeeOne
        UNION ALL
        SELECT LastName, FirstName ,JobTitle
        FROM dbo.EmployeeTwo
        UNION ALL
        SELECT LastName, FirstName,JobTitle
        FROM dbo.EmployeeThree;
      - |-
        SELECT LastName, FirstName,JobTitle
        FROM dbo.EmployeeOne
        UNION ALL
        (
        SELECT LastName, FirstName, JobTitle
        FROM dbo.EmployeeTwo
        UNION
        SELECT LastName, FirstName, JobTitle
        FROM dbo.EmployeeThree
        );

  - id: set_operators_except_intersect
    name: "Set Operators - EXCEPT and INTERSECT"
    doc: https://learn.microsoft.com/en-us/sql/t-sql/language-elements/set-operators-except-and-intersect-transact-sql
    tier: high
    probes:
      - id: except
        sql: "SELECT c FROM t EXCEPT SELECT c FROM u;"
      - id: intersect
        sql: "SELECT c FROM t INTERSECT SELECT c FROM u;"
      - id: mixed_precedence
        sql: "SELECT c FROM t EXCEPT SELECT c FROM u INTERSECT SELECT c FROM v UNION SELECT c FROM w;"
      - id: parenthesized
        sql: "(SELECT c FROM t EXCEPT SELECT c FROM u) INTERSECT (SELECT c FROM v);"
      - id: order_by
        sql: "SELECT c FROM t INTERSECT SELECT c FROM u WHERE d = 'F' ORDER BY c;"
    examples:
      - |-
        -- Uses AdventureWorks

        SELECT ProductID
        FROM Production.Product
        INTERSECT
        SELECT ProductID
        FROM Production.WorkOrder ;
      - |-
        -- Uses AdventureWorks

        SELECT ProductID
        FROM Production.Product
        EXCEPT
        SELECT ProductID
        FROM Production.WorkOrder ;
      - |-
        -- Uses AdventureWorks

        SELECT ProductID
        FROM Production.WorkOrder
        EXCEPT
        SELECT ProductID
        FROM Production.Product ;
      - |-
        -- Uses AdventureWorks

        SELECT CustomerKey
        FROM FactInternetSales
        INTERSECT
