dialect: hana
engine: SAP HANA Platform
version: "2.0 SPS 08 (2.0.08)"
source: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/3bc1a0d4611d40c4a6e3fc7c8e80395d.html?version=2.0.08

statements:
  - id: drop_index
    name: DROP INDEX
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/20d6f4e575191014b333904458242bd7.html?version=2.0.08
    tier: high
    probes:
      - id: basic
        sql: "DROP INDEX idx;"
      - id: schema_qualified
        sql: "DROP INDEX s.idx;"
      - id: online
        sql: "DROP INDEX idx ONLINE;"
      - id: online_preferred
        sql: "DROP INDEX idx ONLINE PREFERRED;"
    examples:
      - "CREATE ROW TABLE A (a INT, b NVARCHAR(10), c NVARCHAR(20));"
      - "CREATE INDEX i ON A(b);"
      - "DROP INDEX i;"

  - id: drop_procedure
    name: DROP PROCEDURE
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/20d7165e75191014a7129ace03afebeb.html?version=2.0.08
    tier: high
    probes:
      - id: basic
        sql: "DROP PROCEDURE p;"
      - id: schema_qualified
        sql: "DROP PROCEDURE s.p;"
      - id: cascade
        sql: "DROP PROCEDURE p CASCADE;"
      - id: restrict
        sql: "DROP PROCEDURE p RESTRICT;"
    examples:
      - "DROP PROCEDURE my_proc;"
