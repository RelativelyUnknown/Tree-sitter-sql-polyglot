dialect: trino
engine: Trino
version: "483"
source: https://trino.io/docs/current/sql.html

statements:
  - id: drop_materialized_view
    name: DROP MATERIALIZED VIEW
    doc: https://trino.io/docs/current/sql/drop-materialized-view.html
    tier: high
    probes:
      - id: basic
        sql: "DROP MATERIALIZED VIEW v;"
      - id: if_exists
        sql: "DROP MATERIALIZED VIEW IF EXISTS v;"
      - id: qualified_name
        sql: "DROP MATERIALIZED VIEW c.s.v;"
    examples:
      - "DROP MATERIALIZED VIEW orders_by_date;"
      - "DROP MATERIALIZED VIEW IF EXISTS orders_by_date;"

  - id: drop_table
    name: DROP TABLE
    doc: https://trino.io/docs/current/sql/drop-table.html
    tier: high
    probes:
      - id: basic
        sql: "DROP TABLE t;"
      - id: if_exists
        sql: "DROP TABLE IF EXISTS t;"
      - id: qualified_name
        sql: "DROP TABLE c.s.t;"
    examples:
      - "DROP TABLE orders_by_date;"
      - "DROP TABLE IF EXISTS orders_by_date;"
