dialect: snowflake
engine: Snowflake
version: "current (docs read 2026-10-04)"
source: https://docs.snowflake.com/en/sql-reference/sql-all

statements:
  - id: show_roles
    name: SHOW ROLES
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-roles
    tier: medium
    probes:
      - { id: basic, sql: "SHOW ROLES;" }
      - { id: terse, sql: "SHOW TERSE ROLES;" }
      - { id: like, sql: "SHOW ROLES LIKE '%testing%';" }
      - { id: in_class, sql: "SHOW ROLES IN CLASS c;" }
      - { id: starts_with, sql: "SHOW ROLES STARTS WITH 'my';" }
      - { id: limit_from, sql: "SHOW ROLES LIMIT 10 FROM 'my_role2';" }
    examples:
      - "SHOW ROLES;"
      - "SHOW ROLES LIMIT 10 FROM 'my_role2';"

  - id: show_row_access_policies
    name: SHOW ROW ACCESS POLICIES
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-row-access-policies
    tier: medium
    probes:
      - { id: basic, sql: "SHOW ROW ACCESS POLICIES;" }
      - { id: like, sql: "SHOW ROW ACCESS POLICIES LIKE '%p%';" }
      - { id: limit_from, sql: "SHOW ROW ACCESS POLICIES LIMIT 5 FROM 'a';" }
      - { id: in_account, sql: "SHOW ROW ACCESS POLICIES IN ACCOUNT;" }
      - { id: in_database, sql: "SHOW ROW ACCESS POLICIES IN DATABASE db;" }
      - { id: in_schema, sql: "SHOW ROW ACCESS POLICIES IN SCHEMA db.s;" }
      - { id: in_schema_application, sql: "SHOW ROW ACCESS POLICIES IN s APPLICATION app;" }
      - { id: in_application_package, sql: "SHOW ROW ACCESS POLICIES IN APPLICATION PACKAGE pkg;" }
    examples:
      - "SHOW ROW ACCESS POLICIES;"

