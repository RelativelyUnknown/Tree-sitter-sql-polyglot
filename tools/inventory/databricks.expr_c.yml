      - { id: map_zip_with_lambda, sql: "SELECT map_zip_with(map(1, 'a', 2, 'b'), map(1, 'x', 2, 'y'), (k, v1, v2) -> concat(v1, v2));" }
      - { id: transform_keys_lambda, sql: "SELECT transform_keys(map_from_arrays(array(1, 2, 3), array(1, 2, 3)), (k, v) -> k + 1);" }
      - { id: transform_values_lambda, sql: "SELECT transform_values(map_from_arrays(array(1, 2, 3), array(1, 2, 3)), (k, v) -> v + 1);" }
      - { id: nested_lambda, sql: "SELECT transform(a, x -> transform(x, y -> y + 1)) FROM t;" }
      - { id: lambda_captures_column, sql: "SELECT transform(a, x -> x + b) FROM t;" }
      - { id: lambda_case, sql: "SELECT transform(a, x -> CASE WHEN x > 0 THEN 'pos' ELSE 'neg' END) FROM t;" }
      - { id: lambda_function_call, sql: "SELECT transform(a, x -> upper(x)) FROM t;" }
      - { id: lambda_in_where, sql: "SELECT * FROM t WHERE exists(a, x -> x > 0);" }
      - { id: lambda_in_case, sql: "SELECT CASE WHEN forall(a, x -> x > 0) THEN 1 ELSE 0 END FROM t;" }
    examples:
      - "SELECT array_sort(array('Hello', 'World'), (p1, p2) -> CASE WHEN p1 = p2 THEN 0 WHEN reverse(p1) < reverse(p2) THEN -1 ELSE 1 END);"
      - "SELECT transform(array(1, 2, 3), x -> x + 1);"
