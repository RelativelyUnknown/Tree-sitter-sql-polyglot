  - id: begin_end
    name: "BEGIN...END"
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/procedural-language#begin
    tier: high
    probes:
      - { id: basic, sql: "BEGIN SELECT 1; END;" }
      - { id: declare_inside, sql: "BEGIN DECLARE y INT64; SET y = 10; SELECT y; END;" }
      - { id: nested, sql: "BEGIN BEGIN SELECT 1; END; SELECT 2; END;" }
      - { id: labeled, sql: "label_1: BEGIN SELECT 1; BREAK label_1; END;" }
      - { id: labeled_end_label, sql: "label_1: BEGIN SELECT 1; LEAVE label_1; END label_1;" }
      - { id: quoted_path_label, sql: "`foo.bar`: BEGIN SELECT 1; END;" }
    examples:
      - |-
        BEGIN
         DECLARE y INT64;
         SET y = x;
         SELECT y;
        END;

  - id: begin_exception_end
    name: "BEGIN...EXCEPTION...END"
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/procedural-language#beginexceptionend
    tier: high
    probes:
      - { id: basic, sql: "BEGIN SELECT 1/0; EXCEPTION WHEN ERROR THEN SELECT @@error.message; END;" }
      - { id: error_variables, sql: "BEGIN SELECT 1/0; EXCEPTION WHEN ERROR THEN SELECT @@error.message, @@error.stack_trace, @@error.statement_text, @@error.formatted_stack_trace; END;" }
      - { id: empty_handler, sql: "BEGIN SELECT 1/0; EXCEPTION WHEN ERROR THEN END;" }
      - { id: nested_handlers, sql: "BEGIN BEGIN SELECT 1; EXCEPTION WHEN ERROR THEN SELECT 1/0; END; EXCEPTION WHEN ERROR THEN SELECT 2; END;" }
      - { id: labeled_break_in_handler, sql: "label_1: BEGIN SELECT 1; EXCEPTION WHEN ERROR THEN BREAK label_1; END;" }
    examples:
      - |-
        BEGIN
         CALL schema1.proc2();
        EXCEPTION WHEN ERROR THEN
         SELECT
         @@error.message,
         @@error.stack_trace,
         @@error.statement_text,
         @@error.formatted_stack_trace;
        END;
      - |-
        BEGIN
         BEGIN TRANSACTION;
         INSERT INTO myschema.NewArrivals
         VALUES ('top load washer', 100, 'warehouse #1');
         -- Trigger an error.
         SELECT 1/0;
         COMMIT TRANSACTION;
        EXCEPTION WHEN ERROR THEN
         -- Roll back the transaction inside the exception handler.
         SELECT @@error.message;
         ROLLBACK TRANSACTION;
        END;

  - id: case_statement
    name: "CASE"
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/procedural-language#case
    tier: high
    probes:
      - { id: searched, sql: "CASE WHEN x > 0 THEN SELECT 'pos'; WHEN x < 0 THEN SELECT 'neg'; END CASE;" }
      - { id: searched_else, sql: "CASE WHEN EXISTS(SELECT 1 FROM t WHERE a = 1) THEN SELECT 'found'; ELSE SELECT 'not found'; END CASE;" }
      - { id: multiple_statements, sql: "CASE WHEN x > 0 THEN SET y = 1; SELECT y; END CASE;" }
    examples:
      - |-
        CASE
         WHEN
         EXISTS(SELECT 1 FROM schema.products_a WHERE product_id = target_product_id)
         THEN SELECT 'found product in products_a table';
         WHEN
         EXISTS(SELECT 1 FROM schema.products_b WHERE product_id = target_product_id)
         THEN SELECT 'found product in products_b table';
         ELSE
         SELECT 'did not find product';
        END CASE;

