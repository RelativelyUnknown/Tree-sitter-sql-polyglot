  - id: create_view
    name: CREATE VIEW
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-create-view
    tier: high
    probes:
      - { id: basic, sql: "CREATE VIEW v AS SELECT * FROM t;" }
      - { id: or_replace, sql: "CREATE OR REPLACE VIEW v AS SELECT * FROM t;" }
      - { id: column_list, sql: "CREATE VIEW v (a, b) AS SELECT x, y FROM t;" }
