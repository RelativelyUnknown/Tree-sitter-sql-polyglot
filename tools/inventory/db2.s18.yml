dialect: db2
engine: IBM Db2 for Linux, UNIX and Windows
version: "11.5"
source: https://www.ibm.com/docs/en/db2/11.5.x?topic=reference-statements

statements:
  - id: insert
    name: INSERT
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-insert
    tier: high
    probes:
      - id: values_single
        sql: "INSERT INTO t VALUES (1, 'a');"
      - id: values_column_list
        sql: "INSERT INTO t (c1, c2) VALUES (1, 'a');"
      - id: values_multi_row
        sql: "INSERT INTO t (c1, c2) VALUES (1, 'a'), (2, 'b');"
      - id: values_null_default
        sql: "INSERT INTO t (c1, c2, c3) VALUES (1, NULL, DEFAULT);"
      - id: values_unparenthesized
        sql: "INSERT INTO t (c1, c2) VALUES 1, 'a';"
        note: "VALUES expression list without parentheses, per syntax diagram (single row)"
      - id: values_row_expression
        sql: "INSERT INTO t (c1, c2) VALUES ROW(1, 'a');"
        note: "row-expression form"
      - id: select
        sql: "INSERT INTO t SELECT * FROM s;"
      - id: select_column_list
        sql: "INSERT INTO t (c1, c2) SELECT c1, c2 FROM s;"
      - id: select_parenthesized_fullselect
        sql: "INSERT INTO t (c1) (SELECT c1 FROM s);"
      - id: select_fullselect_union
        sql: "INSERT INTO t SELECT c1 FROM s UNION ALL SELECT c1 FROM u;"
      - id: with_cte
        sql: "INSERT INTO t WITH x (c1) AS (SELECT c1 FROM s) SELECT c1 FROM x;"
      - id: with_cte_prefix
        sql: "WITH x (c1) AS (SELECT c1 FROM s) INSERT INTO t SELECT c1 FROM x;"
        note: "common-table-expression before INSERT, per syntax diagram"
      - id: target_view
        sql: "INSERT INTO v (c1) VALUES (1);"
      - id: target_fullselect
        sql: "INSERT INTO (SELECT c1, c2 FROM t) VALUES (1, 'a');"
        note: "target is an insertable fullselect"
      - id: target_schema_qualified
        sql: "INSERT INTO myschema.t (c1) VALUES (1);"
      - id: isolation_ur
        sql: "INSERT INTO t SELECT * FROM s WITH UR;"
      - id: isolation_cs
        sql: "INSERT INTO t SELECT * FROM s WITH CS;"
      - id: isolation_rs
        sql: "INSERT INTO t SELECT * FROM s WITH RS;"
      - id: isolation_rr
        sql: "INSERT INTO t SELECT * FROM s WITH RR;"
      - id: include_columns
        sql: "SELECT n FROM NEW TABLE (INSERT INTO t (c1) INCLUDE (n INTEGER) VALUES (1, 1), (2, 2)) AS i ORDER BY n;"
        note: "INCLUDE only valid when nested in FROM of a fullselect"
      - id: new_table_nested
        sql: "SELECT c1 FROM NEW TABLE (INSERT INTO t (c1) VALUES (1));"
      - id: final_table_nested
        sql: "SELECT c1 FROM FINAL TABLE (INSERT INTO t (c1) VALUES (1));"
      - id: current_special_register
        sql: "INSERT INTO t (c1, c2) VALUES (1, CURRENT DATE);"
    examples:
      - "INSERT INTO DEPARTMENT VALUES ('E31', 'ARCHITECTURE', '00390', 'E01');"
      - "INSERT INTO DEPARTMENT (DEPTNO, DEPTNAME, ADMRDEPT) VALUES ('E31', 'ARCHITECTURE', 'E01');"
      - "INSERT INTO DEPARTMENT (DEPTNO, DEPTNAME, ADMRDEPT) VALUES ('B11', 'PURCHASING', 'B01'), ('E41', 'DATABASE ADMINISTRATION', 'E01');"

  - id: iterate
    name: ITERATE
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-iterate
    tier: high
    probes:
      - id: iterate_label
        sql: |-
          CREATE PROCEDURE p() LANGUAGE SQL BEGIN
            DECLARE i INTEGER DEFAULT 0;
            lp: WHILE i < 10 DO
              SET i = i + 1;
              ITERATE lp;
            END WHILE;
          END;
      - id: iterate_in_loop
        sql: |-
          CREATE PROCEDURE p() LANGUAGE SQL BEGIN
            lp: LOOP
              ITERATE lp;
            END LOOP;
          END;
      - id: iterate_in_repeat
        sql: |-
          CREATE PROCEDURE p() LANGUAGE SQL BEGIN
            lp: REPEAT
              ITERATE lp;
            UNTIL 1 = 1 END REPEAT;
          END;
      - id: iterate_in_for
        sql: |-
          CREATE PROCEDURE p() LANGUAGE SQL BEGIN
            lp: FOR r AS SELECT c FROM t DO
              ITERATE lp;
            END FOR;
          END;
    examples:
      - |-
        CREATE PROCEDURE ITERATOR() LANGUAGE SQL BEGIN
          DECLARE v_dept CHAR(3);
          DECLARE v_deptname VARCHAR(29);
          DECLARE v_admdept CHAR(3);
          DECLARE at_end INTEGER DEFAULT 0;
          DECLARE not_found CONDITION FOR SQLSTATE '02000';
          DECLARE c1 CURSOR FOR SELECT deptno, deptname, admrdept FROM department ORDER BY deptno;
          DECLARE CONTINUE HANDLER FOR not_found SET at_end = 1;
          OPEN c1;
          ins_loop: LOOP
            FETCH c1 INTO v_dept, v_deptname, v_admdept;
            IF at_end = 1 THEN
              LEAVE ins_loop;
            ELSEIF v_dept = 'D11' THEN
              ITERATE ins_loop;
            END IF;
            INSERT INTO department (deptno, deptname, admrdept) VALUES ('NEW', v_deptname, v_admdept);
          END LOOP;
          CLOSE c1;
        END;
