  - id: a_quoted_identifiers
    name: Quoted object names
    doc: https://docs.teradata.com/reader/nBhFLNd2S0RbP2RWE_eByw/4D~2C0Z1QvQYv0r3R8M66Q
    tier: high
    probes:
      - { id: quoted_column, sql: "SELECT \"my col\" FROM t;" }
      - { id: quoted_table, sql: "SELECT c FROM \"my table\";" }
      - { id: quoted_qualified, sql: "SELECT \"my db\".\"my table\".\"my col\" FROM \"my db\".\"my table\";" }
      - { id: embedded_quote, sql: "SELECT \"a\"\"b\" FROM t;" }
      - { id: quoted_alias, sql: "SELECT c AS \"My Alias\" FROM t;" }
      - { id: reserved_word_quoted, sql: "SELECT \"select\" FROM \"table\";" }
      - { id: mixed_qualified, sql: "SELECT db.\"my table\".c FROM db.\"my table\";" }
      - { id: dollar_hash_chars, sql: "SELECT c#1, c$2, _c FROM t;" }

  - id: a_unicode_delimited_identifiers
    name: Unicode delimited identifiers
    doc: https://docs.teradata.com/reader/nBhFLNd2S0RbP2RWE_eByw/KStRl63f0Ga1jU6ZiGEIvw
    tier: low
    probes:
      - { id: u_amp_uescape, sql: "SELECT * FROM U&\"table_\\4E00_name\" UESCAPE '\\';" }
      - { id: column, sql: "SELECT U&\"c_\\4E00\" UESCAPE '\\' FROM t;" }
    examples:
      - |-
        Drop Table U&"table_\4E00_name" UEscape '\';

  - id: a_hex_name_literals
    name: Hexadecimal name literals
    doc: https://docs.teradata.com/reader/nBhFLNd2S0RbP2RWE_eByw/13ZD0ynAxlOUsagQAEYkMw
    tier: low
    probes:
      - { id: table, sql: "SELECT * FROM '0E42E342C142C242F10F'XN;" }
    examples:
      - "SELECT * FROM '0E42E342C142C242F10F'XN;"
      - "SELECT * FROM '8273826082618250'XN;"

  - id: a_comments
    name: Comments
    doc: https://docs.teradata.com/reader/nBhFLNd2S0RbP2RWE_eByw/MKtc40EKe4_1KJxv9W8eoQ
    tier: high
    probes:
      - { id: simple_end_of_line, sql: "SELECT c FROM t -- trailing comment\n;" }
      - { id: simple_own_line, sql: "SELECT c FROM t\n-- own line comment\nORDER BY c;" }
      - { id: simple_before_statement, sql: "-- leading comment\nSELECT c FROM t;" }
      - { id: bracketed_inline, sql: "SELECT c FROM /* in the middle */ t;" }
      - { id: bracketed_multiline, sql: "SELECT c FROM t /* spans\n   several lines */\nORDER BY c;" }
      - { id: bracketed_before_statement, sql: "/* leading\n   comment */\nSELECT c FROM t;" }
    examples:
      - |-
        SELECT EmpNo, Name FROM Payroll_Test
        ORDER BY Name -- Simple comment at the end of a line
        ;
      - |-
        SELECT EmpNo, Name
        FROM  /* This comment is in the middle of a line. */ Payroll_Test
        ORDER BY Name;

  - id: a_using_parameters
    name: USING request modifier variables
    doc: https://docs.teradata.com/reader/4_jiz05LXsLWBbfvKTLneg/jSJKGogypwrpbLvhXpsXJg
    tier: medium
    probes:
      - { id: single, sql: "USING (a INTEGER) SELECT :a FROM t;" }
      - { id: multiple, sql: "USING (emp_name CHARACTER(40), emp_number INTEGER) INSERT INTO employee (name, empno) VALUES (:emp_name, :emp_number);" }
      - { id: top_n, sql: "USING (a INTEGER) SELECT TOP :a * FROM employee;" }
      - { id: in_where, sql: "USING (v CHARACTER) UPDATE t SET c2 = c1 + 1 WHERE c1 = :v;" }
      - { id: attribute_casespecific, sql: "USING (v VARCHAR(10) CASESPECIFIC) SELECT * FROM t WHERE c = :v;" }
      - { id: deferred, sql: "USING (v BLOB(1M) AS DEFERRED) INSERT INTO t VALUES (:v);" }
      - { id: deferred_by_name, sql: "USING (v BLOB(1M) AS DEFERRED BY NAME) INSERT INTO t VALUES (:v);" }
      - { id: locator, sql: "USING (v CLOB(1M) AS LOCATOR) INSERT INTO t VALUES (:v);" }
      - { id: json_dot_notation, sql: "USING (j JSON) SELECT :j.name;" }
