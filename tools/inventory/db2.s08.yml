dialect: db2
engine: IBM Db2 for Linux, UNIX and Windows
version: "11.5"
source: https://www.ibm.com/docs/en/db2/11.5.x?topic=reference-statements

statements:
  - id: create_function_aggregate_interface
    name: CREATE FUNCTION (aggregate interface)
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-create-function-aggregate-interface
    tier: high
    probes:
      - id: basic
        sql: "CREATE FUNCTION myavg(DOUBLE) RETURNS DOUBLE AGGREGATE WITH (sum DOUBLE, count INT) USING INITIALIZE PROCEDURE myavg_initialize ACCUMULATE PROCEDURE myavg_accumulate MERGE PROCEDURE myavg_merge FINALIZE FUNCTION myavg_finalize;"
      - id: or_replace
        sql: "CREATE OR REPLACE FUNCTION myavg(DOUBLE) RETURNS DOUBLE AGGREGATE WITH (sum DOUBLE, count INT) USING INITIALIZE PROCEDURE myavg_initialize ACCUMULATE PROCEDURE myavg_accumulate MERGE PROCEDURE myavg_merge FINALIZE FUNCTION myavg_finalize;"
      - id: qualified_name_and_designators
        sql: "CREATE FUNCTION s.myavg(DOUBLE) RETURNS DOUBLE AGGREGATE WITH (sum DOUBLE, count INT) USING INITIALIZE PROCEDURE s.myavg_initialize(DOUBLE) ACCUMULATE PROCEDURE s.myavg_accumulate(DOUBLE, DOUBLE, INT) MERGE PROCEDURE s.myavg_merge(DOUBLE, INT, DOUBLE, INT) FINALIZE FUNCTION s.myavg_finalize(DOUBLE, INT);"
      - id: specific_designators
        sql: "CREATE FUNCTION myavg(DOUBLE) RETURNS DOUBLE AGGREGATE WITH (sum DOUBLE, count INT) USING INITIALIZE SPECIFIC PROCEDURE myavg_initialize1 ACCUMULATE SPECIFIC PROCEDURE myavg_accumulate1 MERGE SPECIFIC PROCEDURE myavg_merge1 FINALIZE SPECIFIC FUNCTION myavg_finalize1;"
      - id: parameter_in_name_default
        sql: "CREATE FUNCTION myavg(IN val DOUBLE DEFAULT NULL) RETURNS DOUBLE AGGREGATE WITH (sum DOUBLE, count INT) USING INITIALIZE PROCEDURE i ACCUMULATE PROCEDURE a MERGE PROCEDURE m FINALIZE FUNCTION f;"
      - id: parameter_default_expression
        sql: "CREATE FUNCTION myavg(val DOUBLE DEFAULT (1 + 2)) RETURNS DOUBLE AGGREGATE WITH (sum DOUBLE, count INT) USING INITIALIZE PROCEDURE i ACCUMULATE PROCEDURE a MERGE PROCEDURE m FINALIZE FUNCTION f;"
      - id: no_parameters
        sql: "CREATE FUNCTION cnt() RETURNS INTEGER AGGREGATE WITH (n INT) USING INITIALIZE PROCEDURE i ACCUMULATE PROCEDURE a MERGE PROCEDURE m FINALIZE FUNCTION f;"
      - id: state_variable_unnamed
        sql: "CREATE FUNCTION myavg(DOUBLE) RETURNS DOUBLE AGGREGATE WITH (DOUBLE, INT) USING INITIALIZE PROCEDURE i ACCUMULATE PROCEDURE a MERGE PROCEDURE m FINALIZE FUNCTION f;"
      - id: returns_cast_from
        sql: "CREATE FUNCTION myavg(DOUBLE) RETURNS DATE CAST FROM CHAR(10) AGGREGATE WITH (sum DOUBLE, count INT) USING INITIALIZE PROCEDURE i ACCUMULATE PROCEDURE a MERGE PROCEDURE m FINALIZE FUNCTION f;"
      - id: returns_decfloat
        sql: "CREATE FUNCTION myavg(DOUBLE) RETURNS DECFLOAT(34) AGGREGATE WITH (sum DOUBLE, count INT) USING INITIALIZE PROCEDURE i ACCUMULATE PROCEDURE a MERGE PROCEDURE m FINALIZE FUNCTION f;"
      - id: option_specific
        sql: "CREATE FUNCTION myavg(DOUBLE) RETURNS DOUBLE SPECIFIC myavg1 AGGREGATE WITH (sum DOUBLE, count INT) USING INITIALIZE PROCEDURE i ACCUMULATE PROCEDURE a MERGE PROCEDURE m FINALIZE FUNCTION f;"
      - id: option_not_deterministic
        sql: "CREATE FUNCTION myavg(DOUBLE) RETURNS DOUBLE NOT DETERMINISTIC AGGREGATE WITH (sum DOUBLE, count INT) USING INITIALIZE PROCEDURE i ACCUMULATE PROCEDURE a MERGE PROCEDURE m FINALIZE FUNCTION f;"
      - id: option_deterministic
        sql: "CREATE FUNCTION myavg(DOUBLE) RETURNS DOUBLE DETERMINISTIC AGGREGATE WITH (sum DOUBLE, count INT) USING INITIALIZE PROCEDURE i ACCUMULATE PROCEDURE a MERGE PROCEDURE m FINALIZE FUNCTION f;"
      - id: option_called_on_null_input
        sql: "CREATE FUNCTION myavg(DOUBLE) RETURNS DOUBLE CALLED ON NULL INPUT AGGREGATE WITH (sum DOUBLE, count INT) USING INITIALIZE PROCEDURE i ACCUMULATE PROCEDURE a MERGE PROCEDURE m FINALIZE FUNCTION f;"
      - id: option_external_action
        sql: "CREATE FUNCTION myavg(DOUBLE) RETURNS DOUBLE EXTERNAL ACTION AGGREGATE WITH (sum DOUBLE, count INT) USING INITIALIZE PROCEDURE i ACCUMULATE PROCEDURE a MERGE PROCEDURE m FINALIZE FUNCTION f;"
      - id: option_no_external_action
        sql: "CREATE FUNCTION myavg(DOUBLE) RETURNS DOUBLE NO EXTERNAL ACTION AGGREGATE WITH (sum DOUBLE, count INT) USING INITIALIZE PROCEDURE i ACCUMULATE PROCEDURE a MERGE PROCEDURE m FINALIZE FUNCTION f;"
      - id: option_no_scratchpad
        sql: "CREATE FUNCTION myavg(DOUBLE) RETURNS DOUBLE NO SCRATCHPAD AGGREGATE WITH (sum DOUBLE, count INT) USING INITIALIZE PROCEDURE i ACCUMULATE PROCEDURE a MERGE PROCEDURE m FINALIZE FUNCTION f;"
      - id: option_no_final_call
        sql: "CREATE FUNCTION myavg(DOUBLE) RETURNS DOUBLE NO FINAL CALL AGGREGATE WITH (sum DOUBLE, count INT) USING INITIALIZE PROCEDURE i ACCUMULATE PROCEDURE a MERGE PROCEDURE m FINALIZE FUNCTION f;"
      - id: option_allow_parallel
        sql: "CREATE FUNCTION myavg(DOUBLE) RETURNS DOUBLE ALLOW PARALLEL AGGREGATE WITH (sum DOUBLE, count INT) USING INITIALIZE PROCEDURE i ACCUMULATE PROCEDURE a MERGE PROCEDURE m FINALIZE FUNCTION f;"
      - id: option_secured
        sql: "CREATE FUNCTION myavg(DOUBLE) RETURNS DOUBLE SECURED AGGREGATE WITH (sum DOUBLE, count INT) USING INITIALIZE PROCEDURE i ACCUMULATE PROCEDURE a MERGE PROCEDURE m FINALIZE FUNCTION f;"
      - id: option_not_secured
        sql: "CREATE FUNCTION myavg(DOUBLE) RETURNS DOUBLE NOT SECURED AGGREGATE WITH (sum DOUBLE, count INT) USING INITIALIZE PROCEDURE i ACCUMULATE PROCEDURE a MERGE PROCEDURE m FINALIZE FUNCTION f;"
      - id: option_list_combined
        sql: "CREATE FUNCTION myavg(DOUBLE) RETURNS DOUBLE SPECIFIC myavg1 DETERMINISTIC CALLED ON NULL INPUT NO EXTERNAL ACTION NO SCRATCHPAD NO FINAL CALL ALLOW PARALLEL NOT SECURED AGGREGATE WITH (sum DOUBLE, count INT) USING INITIALIZE PROCEDURE i ACCUMULATE PROCEDURE a MERGE PROCEDURE m FINALIZE FUNCTION f;"
      - id: in_module
        sql: "CREATE FUNCTION myavg(DOUBLE) RETURNS DOUBLE AGGREGATE WITH (sum DOUBLE, count INT) USING IN MODULE mod INITIALIZE PROCEDURE i ACCUMULATE PROCEDURE a MERGE PROCEDURE m FINALIZE FUNCTION f;"
      - id: multiple_parameters
        sql: "CREATE FUNCTION wavg(val DOUBLE, wt INT) RETURNS DOUBLE AGGREGATE WITH (sum DOUBLE, wsum INT) USING INITIALIZE PROCEDURE i ACCUMULATE PROCEDURE a MERGE PROCEDURE m FINALIZE FUNCTION f;"
      - id: parameter_varchar_and_decimal
        sql: "CREATE FUNCTION agg1(VARCHAR(20), DECIMAL(10,2)) RETURNS VARCHAR(100) AGGREGATE WITH (s VARCHAR(100), n BIGINT) USING INITIALIZE PROCEDURE i ACCUMULATE PROCEDURE a MERGE PROCEDURE m FINALIZE FUNCTION f;"
    examples:
      - "CREATE OR REPLACE FUNCTION myavg(DOUBLE) RETURNS DECFLOAT(34) AGGREGATE WITH (sum DOUBLE, count INT) USING INITIALIZE PROCEDURE myavg_initialize ACCUMULATE PROCEDURE myavg_accumulate MERGE PROCEDURE myavg_merge FINALIZE FUNCTION myavg_finalize;"
      - "CREATE OR REPLACE FUNCTION myavg(DOUBLE) RETURNS DOUBLE AGGREGATE WITH (sum DOUBLE, count INT) USING INITIALIZE SPECIFIC PROCEDURE myavg_initialize1 ACCUMULATE SPECIFIC PROCEDURE myavg_accumulate1 MERGE SPECIFIC PROCEDURE myavg_merge1 FINALIZE SPECIFIC FUNCTION myavg_finalize1;"

  - id: create_function_external_scalar
    name: CREATE FUNCTION (external scalar)
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-create-function-external-scalar
    tier: high
    probes:
      - id: basic
        sql: "CREATE FUNCTION f(INT) RETURNS INT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL NO SQL;"
      - id: or_replace
        sql: "CREATE OR REPLACE FUNCTION f(INT) RETURNS INT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL NO SQL;"
      - id: no_parameters
        sql: "CREATE FUNCTION f() RETURNS INT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL NO SQL;"
      - id: param_in_name
        sql: "CREATE FUNCTION f(IN a INT) RETURNS INT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL NO SQL;"
      - id: param_out_inout
        sql: "CREATE FUNCTION f(IN a INT, OUT b INT, INOUT c INT) RETURNS INT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL NO SQL;"
      - id: param_default
        sql: "CREATE FUNCTION f(a INT DEFAULT 0, b VARCHAR(10) DEFAULT NULL) RETURNS INT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL NO SQL;"
      - id: param_default_special_register
        sql: "CREATE FUNCTION f(a VARCHAR(128) DEFAULT CURRENT SCHEMA) RETURNS INT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL NO SQL;"
      - id: param_default_expression
        sql: "CREATE FUNCTION f(a INT DEFAULT (1 + 2)) RETURNS INT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL NO SQL;"
      - id: param_as_locator
        sql: "CREATE FUNCTION f(a BLOB(1M) AS LOCATOR) RETURNS INT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL NO SQL;"
      - id: param_distinct_type
        sql: "CREATE FUNCTION f(a my_distinct) RETURNS INT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL NO SQL;"
      - id: param_ref_type
        sql: "CREATE FUNCTION f(a REF(emp_t)) RETURNS INT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL NO SQL;"
      - id: param_for_bit_data
        sql: "CREATE FUNCTION f(a VARCHAR(10) FOR BIT DATA) RETURNS INT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL NO SQL;"
      - id: param_string_units
        sql: "CREATE FUNCTION f(a VARCHAR(10 CODEUNITS32), b CHAR(5 OCTETS)) RETURNS INT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL NO SQL;"
      - id: returns_as_locator
        sql: "CREATE FUNCTION f(INT) RETURNS CLOB(1M) AS LOCATOR LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL NO SQL;"
      - id: returns_cast_from
        sql: "CREATE FUNCTION f(INT) RETURNS DECIMAL(8,4) CAST FROM FLOAT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL NO SQL;"
      - id: returns_cast_from_locator
        sql: "CREATE FUNCTION f(INT) RETURNS BLOB(1M) CAST FROM BLOB(1M) AS LOCATOR LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL NO SQL;"
      - id: language_java
        sql: "CREATE FUNCTION f(INT) RETURNS INT LANGUAGE JAVA EXTERNAL NAME 'myjar:UserFuncs.f' PARAMETER STYLE JAVA NO SQL;"
      - id: language_clr
        sql: "CREATE FUNCTION f(INT) RETURNS INT LANGUAGE CLR EXTERNAL NAME 'mydotnet.dll:Cls!f' PARAMETER STYLE SQL NO SQL;"
      - id: language_ole
        sql: "CREATE FUNCTION f(INT) RETURNS INT LANGUAGE OLE EXTERNAL NAME 'progid!f' PARAMETER STYLE SQL NO SQL;"
      - id: language_cpp
        sql: "CREATE FUNCTION f(INT) RETURNS INT LANGUAGE CPP EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL NO SQL;"
      - id: language_python
        sql: "CREATE FUNCTION f(INT) RETURNS INT LANGUAGE PYTHON EXTERNAL NAME 'mod.py!f' PARAMETER STYLE SQL NO SQL;"
      - id: external_name_identifier
        sql: "CREATE FUNCTION f(INT) RETURNS INT LANGUAGE C EXTERNAL NAME middle PARAMETER STYLE SQL NO SQL;"
      - id: external_without_name
        sql: "CREATE FUNCTION f(INT) RETURNS INT EXTERNAL LANGUAGE C PARAMETER STYLE SQL NO SQL;"
      - id: specific
        sql: "CREATE FUNCTION f(INT) RETURNS INT SPECIFIC f_spec LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL NO SQL;"
      - id: parameter_style_db2general
        sql: "CREATE FUNCTION f(INT) RETURNS INT LANGUAGE JAVA EXTERNAL NAME 'c.m' PARAMETER STYLE DB2GENERAL NO SQL;"
      - id: parameter_style_java
        sql: "CREATE FUNCTION f(INT) RETURNS INT LANGUAGE JAVA EXTERNAL NAME 'c.m' PARAMETER STYLE JAVA NO SQL;"
      - id: parameter_style_npsgeneral
        sql: "CREATE FUNCTION f(INT) RETURNS INT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE NPSGENERAL NO SQL;"
      - id: parameter_ccsid_ascii
        sql: "CREATE FUNCTION f(INT) RETURNS INT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL PARAMETER CCSID ASCII NO SQL;"
      - id: parameter_ccsid_unicode
        sql: "CREATE FUNCTION f(INT) RETURNS INT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL PARAMETER CCSID UNICODE NO SQL;"
      - id: not_deterministic
        sql: "CREATE FUNCTION f(INT) RETURNS INT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL NOT DETERMINISTIC NO SQL;"
      - id: deterministic
        sql: "CREATE FUNCTION f(INT) RETURNS INT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL DETERMINISTIC NO SQL;"
      - id: fenced_threadsafe
        sql: "CREATE FUNCTION f(INT) RETURNS INT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL FENCED THREADSAFE NO SQL;"
      - id: fenced_not_threadsafe
        sql: "CREATE FUNCTION f(INT) RETURNS INT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL FENCED NOT THREADSAFE NO SQL;"
      - id: not_fenced
        sql: "CREATE FUNCTION f(INT) RETURNS INT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL NOT FENCED NO SQL;"
      - id: not_fenced_threadsafe
        sql: "CREATE FUNCTION f(INT) RETURNS INT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL NOT FENCED THREADSAFE NO SQL;"
      - id: returns_null_on_null_input
        sql: "CREATE FUNCTION f(INT) RETURNS INT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL RETURNS NULL ON NULL INPUT NO SQL;"
      - id: called_on_null_input
        sql: "CREATE FUNCTION f(INT) RETURNS INT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL CALLED ON NULL INPUT NO SQL;"
      - id: null_call
        sql: "CREATE FUNCTION f(INT) RETURNS INT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL NULL CALL NO SQL;"
        note: NULL CALL and NOT NULL CALL appear in the doc's own examples as synonyms for CALLED ON NULL INPUT and RETURNS NULL ON NULL INPUT.
      - id: reads_sql_data
        sql: "CREATE FUNCTION f(INT) RETURNS INT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL READS SQL DATA;"
      - id: contains_sql
        sql: "CREATE FUNCTION f(INT) RETURNS INT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL CONTAINS SQL;"
      - id: static_dispatch
        sql: "CREATE FUNCTION f(INT) RETURNS INT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL NO SQL STATIC DISPATCH;"
      - id: external_action
        sql: "CREATE FUNCTION f(INT) RETURNS INT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL NO SQL EXTERNAL ACTION;"
      - id: no_external_action
        sql: "CREATE FUNCTION f(INT) RETURNS INT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL NO SQL NO EXTERNAL ACTION;"
      - id: scratchpad
        sql: "CREATE FUNCTION f(INT) RETURNS INT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL NO SQL SCRATCHPAD;"
      - id: scratchpad_length
        sql: "CREATE FUNCTION f(INT) RETURNS INT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL NO SQL SCRATCHPAD 200;"
      - id: no_scratchpad
        sql: "CREATE FUNCTION f(INT) RETURNS INT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL NO SQL NO SCRATCHPAD;"
      - id: final_call
        sql: "CREATE FUNCTION f(INT) RETURNS INT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL NO SQL SCRATCHPAD FINAL CALL;"
      - id: no_final_call
        sql: "CREATE FUNCTION f(INT) RETURNS INT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL NO SQL SCRATCHPAD NO FINAL CALL;"
      - id: allow_parallel
        sql: "CREATE FUNCTION f(INT) RETURNS INT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL NO SQL ALLOW PARALLEL;"
      - id: disallow_parallel
        sql: "CREATE FUNCTION f(INT) RETURNS INT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL NO SQL DISALLOW PARALLEL;"
      - id: no_dbinfo
        sql: "CREATE FUNCTION f(INT) RETURNS INT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL NO SQL NO DBINFO;"
      - id: dbinfo
        sql: "CREATE FUNCTION f(INT) RETURNS INT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL NO SQL DBINFO;"
      - id: transform_group
        sql: "CREATE FUNCTION f(emp_t) RETURNS INT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL NO SQL TRANSFORM GROUP grp;"
      - id: inherit_special_registers
        sql: "CREATE FUNCTION f(INT) RETURNS INT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL NO SQL INHERIT SPECIAL REGISTERS;"
      - id: secured
        sql: "CREATE FUNCTION f(INT) RETURNS INT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL NO SQL SECURED;"
      - id: not_secured
        sql: "CREATE FUNCTION f(INT) RETURNS INT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL NO SQL NOT SECURED;"
      - id: stay_resident
        sql: "CREATE FUNCTION f(INT) RETURNS INT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL NO SQL STAY RESIDENT YES;"
      - id: no_stay_resident
        sql: "CREATE FUNCTION f(INT) RETURNS INT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL NO SQL STAY RESIDENT NO;"
      - id: predicates_filter
        sql: "CREATE FUNCTION f(INT, INT) RETURNS INT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL NO SQL PREDICATES (WHEN = 1 FILTER USING g(x, y));"
      - id: predicates_expression_as
        sql: "CREATE FUNCTION f(INT, INT) RETURNS INT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL NO SQL PREDICATES (WHEN > 0 EXPRESSION AS ex FILTER USING g(x, y));"
      - id: predicates_search_by_index_extension
        sql: "CREATE FUNCTION f(INT, INT) RETURNS INT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL NO SQL PREDICATES (WHEN = 1 SEARCH BY EXACT INDEX EXTENSION ix WHEN KEY (a) USE m(b));"
      - id: predicates_comparison_operators
        sql: "CREATE FUNCTION f(INT, INT) RETURNS INT LANGUAGE C EXTERNAL NAME 'mod!f' PARAMETER STYLE SQL NO SQL PREDICATES (WHEN <= 1 FILTER USING g(x, y));"
      - id: option_list_combined
        sql: "CREATE FUNCTION PELLOW.CENTER (FLOAT, FLOAT, FLOAT) RETURNS DECIMAL(8,4) CAST FROM FLOAT SPECIFIC FOCUS92 EXTERNAL NAME 'effects!focalpt' LANGUAGE C PARAMETER STYLE SQL DETERMINISTIC FENCED NOT NULL CALL NO SQL NO EXTERNAL ACTION SCRATCHPAD NO FINAL CALL DISALLOW PARALLEL;"
    examples:
      - "CREATE FUNCTION CENTER (INT,FLOAT) RETURNS FLOAT EXTERNAL NAME 'mod!middle' LANGUAGE C PARAMETER STYLE SQL DETERMINISTIC NO SQL NO EXTERNAL ACTION;"
      - "CREATE FUNCTION PELLOW.CENTER ( FLOAT, FLOAT, FLOAT ) RETURNS DECIMAL (8,4) CAST FROM FLOAT SPECIFIC FOCUS92 EXTERNAL NAME 'effects!focalpt' LANGUAGE C PARAMETER STYLE SQL DETERMINISTIC FENCED NOT NULL CALL NO SQL NO EXTERNAL ACTION SCRATCHPAD NO FINAL CALL DISALLOW PARALLEL;"
      - "CREATE FUNCTION ntest1 ( SMALLINT ) RETURNS SMALLINT EXTERNAL NAME 'ntest1!nudft1' LANGUAGE C PARAMETER STYLE SQL DETERMINISTIC NOT FENCED NULL CALL NO SQL NO EXTERNAL ACTION;"
