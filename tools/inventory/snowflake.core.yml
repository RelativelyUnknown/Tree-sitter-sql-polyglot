      - { id: copy_tags, sql: "CREATE OR REPLACE VIEW v COPY TAGS AS SELECT b AS a, a AS b FROM t;" }
      - { id: comment, sql: "CREATE VIEW v COMMENT = 'Test view' AS SELECT a FROM t;" }
