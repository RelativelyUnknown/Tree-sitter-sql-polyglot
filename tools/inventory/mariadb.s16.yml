dialect: mariadb
engine: MariaDB Server
version: "11.x (current)"
source: https://mariadb.com/docs/server/reference/sql-statements

statements:
  - id: drop_procedure
    name: DROP PROCEDURE
    doc: https://mariadb.com/docs/server/server-usage/stored-routines/stored-procedures/drop-procedure
    tier: high
    probes:
      - id: basic
        sql: "DROP PROCEDURE sp;"
      - id: if_exists
        sql: "DROP PROCEDURE IF EXISTS sp;"
      - id: qualified_name
        sql: "DROP PROCEDURE db.sp;"
    examples:
      - "DROP PROCEDURE simpleproc;"
      - "DROP PROCEDURE IF EXISTS simpleproc;"

  - id: start_transaction
    name: START TRANSACTION / BEGIN
    doc: https://mariadb.com/docs/server/reference/sql-statements/transactions/start-transaction
    tier: high
    probes:
      - id: start_transaction
        sql: "START TRANSACTION;"
      - id: with_consistent_snapshot
        sql: "START TRANSACTION WITH CONSISTENT SNAPSHOT;"
      - id: read_write
        sql: "START TRANSACTION READ WRITE;"
      - id: read_only
        sql: "START TRANSACTION READ ONLY;"
      - id: multiple_properties
        sql: "START TRANSACTION WITH CONSISTENT SNAPSHOT, READ ONLY;"
      - id: begin
        sql: "BEGIN;"
      - id: begin_work
        sql: "BEGIN WORK;"
    examples:
      - "START TRANSACTION;"
      - "SELECT @A:=SUM(salary) FROM table1 WHERE type=1;"
      - "UPDATE table2 SET summary=@A WHERE type=1;"
