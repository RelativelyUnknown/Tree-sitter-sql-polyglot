dialect: databricks
engine: Databricks SQL / Databricks Runtime
version: "current (docs read 2026-10-04)"
source: https://docs.databricks.com/aws/en/sql/language-manual/

statements: []

expressions:
  - id: a_integer_literals
    name: Integral numeric literals (TINYINT, SMALLINT, INT, BIGINT)
    doc: https://docs.databricks.com/aws/en/sql/language-manual/data-types/bigint-type
    tier: high
    probes:
      - { id: int, sql: "SELECT 1, +1, -1, 2147483648;" }
      - { id: bigint_l_suffix, sql: "SELECT +1L, 5l;" }
      - { id: smallint_s_suffix, sql: "SELECT +1S, 5s;" }
      - { id: tinyint_y_suffix, sql: "SELECT +1Y, 5y;" }
    examples:
      - "SELECT +1L;"
      - "SELECT +1S;"
      - "SELECT +1Y;"

  - id: a_decimal_literals
    name: DECIMAL literals (BD suffix, exponent)
    doc: https://docs.databricks.com/aws/en/sql/language-manual/data-types/decimal-type
    tier: high
    probes:
      - { id: decimal_point, sql: "SELECT 6.45, -6.45, .5, 5.;" }
      - { id: bd_suffix, sql: "SELECT +1BD, 5.321BD, 1.5bd;" }
      - { id: exponent_bd, sql: "SELECT 5E3BD, 5.321E2BD, 1e-2bd;" }
    examples:
      - "SELECT +1BD;"
      - "SELECT 5E3BD;"
      - "SELECT 5.321E2BD;"

  - id: a_floating_point_literals
    name: FLOAT and DOUBLE literals (D and F suffix, exponent)
    doc: https://docs.databricks.com/aws/en/sql/language-manual/data-types/double-type
    tier: high
    probes:
      - { id: exponent, sql: "SELECT 5E10, 5.3E10, 1e-5, 1E+5;" }
      - { id: double_d_suffix, sql: "SELECT +1D, 2.D, -.1D, 5E10D, 1d;" }
      - { id: float_f_suffix, sql: "SELECT +1F, 2.F, -.1F, 5E10F, 1f;" }
    examples:
      - "SELECT +1D;"
      - "SELECT 5E10;"
      - "SELECT -.1D;"
      - "SELECT +1F;"
      - "SELECT 5.3E10F;"

  - id: a_special_floating_point_values
    name: Special floating point values (Inf, NaN)
    doc: https://docs.databricks.com/aws/en/sql/language-manual/data-types/special-floating-point-values
    tier: medium
    probes:
      - { id: cast_infinity, sql: "SELECT double('infinity'), CAST('-Inf' AS DOUBLE), CAST('NaN' AS FLOAT);" }
    examples:
      - "SELECT double('infinity');"

  - id: a_boolean_literals
    name: BOOLEAN and NULL literals
    doc: https://docs.databricks.com/aws/en/sql/language-manual/data-types/boolean-type
    tier: high
    probes:
      - { id: true_false, sql: "SELECT TRUE, FALSE, true, false;" }
      - { id: null_literal, sql: "SELECT NULL;" }
      - { id: cast_boolean, sql: "SELECT CAST(0 AS BOOLEAN), CAST(NULL AS BOOLEAN);" }
    examples:
      - "SELECT true;"
      - "SELECT CAST(0 AS BOOLEAN);"
      - "SELECT CAST(NULL AS BOOLEAN);"

  - id: a_string_literals
    name: STRING literals (quotes, escapes, raw prefix, chaining)
    doc: https://docs.databricks.com/aws/en/sql/language-manual/data-types/string-type
    tier: high
    probes:
      - { id: single_quoted, sql: "SELECT 'Spark', '';" }
      - { id: double_quoted, sql: "SELECT \"Spark\";" }
      - { id: backslash_escaped_quote, sql: "SELECT 'O\\'Connell';" }
      - { id: escape_sequences, sql: "SELECT 'Some \\nText', '\\\\', '\\t\\0';" }
      - { id: raw_prefix, sql: "SELECT r'Some \\nText', R'\\\\', r\"x\";" }
      - { id: unicode_content, sql: "SELECT '서울시';" }
      - { id: chained_literals, sql: "SELECT 'a' 'b' 'c';", note: "Chaining string literals needs Databricks Runtime 18.0 or later." }
    examples:
      - "SELECT 'Spark';"
      - "SELECT 'O\\'Connell';"
      - "SELECT r'Some \\nText';"
      - "SELECT '서울시';"
      - "SELECT '\\\\';"

  - id: a_binary_literals
    name: BINARY literals (X prefix)
    doc: https://docs.databricks.com/aws/en/sql/language-manual/data-types/binary-type
    tier: medium
    probes:
      - { id: hex_single_quoted, sql: "SELECT X'1ABF', x'1', X'';" }
      - { id: hex_double_quoted, sql: "SELECT X\"1ABF\";" }
    examples:
      - "SELECT X'1';"
      - "SELECT X'1ABF';"
      - "SELECT X'';"

  - id: a_date_literals
    name: DATE literals
    doc: https://docs.databricks.com/aws/en/sql/language-manual/data-types/date-type
    tier: high
    probes:
      - { id: date_year_month_day, sql: "SELECT DATE '2020-12-31', date '2021-7-1';" }
      - { id: date_year_only, sql: "SELECT DATE '0000', DATE '2021-07';" }
      - { id: date_trailing_t, sql: "SELECT DATE '2021-7-1T';" }
      - { id: date_signed_year, sql: "SELECT DATE '-10000-01-01', DATE '+10000-01-01';" }
    examples:
      - "SELECT DATE '0000';"
      - "SELECT DATE '2020-12-31';"
      - "SELECT DATE '2021-7-1T';"

  - id: a_timestamp_literals
    name: TIMESTAMP and TIMESTAMP_NTZ literals
    doc: https://docs.databricks.com/aws/en/sql/language-manual/data-types/timestamp-type
    tier: high
    probes:
      - { id: timestamp_date_only, sql: "SELECT TIMESTAMP '2020-12-31', TIMESTAMP '0000';" }
      - { id: timestamp_fraction, sql: "SELECT TIMESTAMP '2021-7-1T8:43:28.123456';" }
      - { id: timestamp_zone_offset, sql: "SELECT TIMESTAMP '2021-7-1T8:43:28UTC+3', TIMESTAMP '2021-07-01 08:43:28+05:30', TIMESTAMP '2021-07-01 08:43:28Z';" }
      - { id: timestamp_region_zone, sql: "SELECT TIMESTAMP '2021-07-01 08:43:28 Europe/Paris';" }
      - { id: timestamp_signed_year, sql: "SELECT TIMESTAMP '+10000';" }
      - { id: timestamp_ltz_prefix, sql: "SELECT TIMESTAMP_LTZ '2020-12-31 10:00:00';" }
      - { id: timestamp_ntz_prefix, sql: "SELECT TIMESTAMP_NTZ '2020-12-31', TIMESTAMP_NTZ '2021-7-1T8:43:28.123456';" }
    examples:
      - "SELECT TIMESTAMP '2020-12-31';"
      - "SELECT TIMESTAMP '2021-7-1T8:43:28.123456';"
      - "SELECT current_timezone(), TIMESTAMP '2021-7-1T8:43:28UTC+3';"

  - id: a_time_literals
    name: TIME literals
    doc: https://docs.databricks.com/aws/en/sql/language-manual/data-types/time-type
    tier: medium
    probes:
      - { id: time_hour_minute, sql: "SELECT TIME '08:15';" }
      - { id: time_seconds, sql: "SELECT TIME '10:30:00', TIME '23:59:59.123456';" }
      - { id: time_am_pm, sql: "SELECT TIME '8:15 PM', TIME '08:15:30 AM';" }
    examples:
      - "SELECT TIME '10:30:00';"
      - "SELECT TIME '08:15';"
      - "SELECT TIME '23:59:59.123456';"

  - id: a_interval_literals
    name: INTERVAL literals (year-month and day-time)
    doc: https://docs.databricks.com/aws/en/sql/language-manual/data-types/interval-type
    tier: high
    probes:
      - { id: year_to_month, sql: "SELECT INTERVAL '100-00' YEAR TO MONTH;" }
      - { id: year_only, sql: "SELECT INTERVAL '5' YEAR;" }
      - { id: month_only, sql: "SELECT INTERVAL '-3600' MONTH;" }
      - { id: day_only, sql: "SELECT INTERVAL '5' DAY;" }
      - { id: day_to_hour, sql: "SELECT INTERVAL '5 12' DAY TO HOUR;" }
      - { id: day_to_minute, sql: "SELECT INTERVAL '5 12:30' DAY TO MINUTE;" }
      - { id: day_to_second, sql: "SELECT INTERVAL '5 12:30:15.123' DAY TO SECOND;" }
      - { id: hour_to_second, sql: "SELECT INTERVAL '200:13:50.3' HOUR TO SECOND;" }
      - { id: hour_to_minute, sql: "SELECT INTERVAL '12:30' HOUR TO MINUTE;" }
      - { id: minute_to_second, sql: "SELECT INTERVAL '30:15' MINUTE TO SECOND;" }
      - { id: second_only, sql: "SELECT INTERVAL '45.5' SECOND;" }
      - { id: sign_before_string, sql: "SELECT INTERVAL -'200:13:50.3' HOUR TO SECOND, INTERVAL +'1' DAY;" }
    examples:
      - "SELECT INTERVAL '100-00' YEAR TO MONTH;"
      - "SELECT INTERVAL '-3600' MONTH;"
      - "SELECT INTERVAL -'200:13:50.3' HOUR TO SECOND;"

  - id: a_type_names_simple
    name: Simple data type names and synonyms
    doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-datatypes
    tier: high
    probes:
      - { id: integral_types, sql: "SELECT CAST(1 AS TINYINT), CAST(1 AS SMALLINT), CAST(1 AS INT), CAST(1 AS BIGINT);" }
      - { id: integral_synonyms, sql: "SELECT CAST(1 AS BYTE), CAST(1 AS SHORT), CAST(1 AS INTEGER), CAST(1 AS LONG);" }
      - { id: floating_types, sql: "SELECT CAST(1 AS FLOAT), CAST(1 AS REAL), CAST(1 AS DOUBLE);" }
      - { id: string_binary_boolean, sql: "SELECT CAST(1 AS STRING), CAST('a' AS BINARY), CAST(1 AS BOOLEAN);" }
      - { id: date_time_types, sql: "SELECT CAST('2020-01-01' AS DATE), CAST('2020-01-01' AS TIMESTAMP), CAST('2020-01-01' AS TIMESTAMP_LTZ), CAST('2020-01-01' AS TIMESTAMP_NTZ);" }
      - { id: timestamp_without_time_zone, sql: "SELECT CAST('1908-03-15 10:1:17' AS TIMESTAMP WITHOUT TIME ZONE);", note: "TIMESTAMP WITHOUT TIME ZONE needs Databricks Runtime 17.1 or later." }
      - { id: void_type, sql: "SELECT CAST(NULL AS VOID);" }
      - { id: variant_type, sql: "SELECT CAST(123.456 AS VARIANT);" }
    examples:
      - "SELECT CAST('5' AS BIGINT);"
      - "SELECT CAST('5' AS SMALLINT);"
      - "SELECT cast(NULL AS VOID);"
      - "SELECT CAST(123.456 AS VARIANT);"

  - id: a_type_names_parameterized
    name: Parameterized and complex data types
    doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-datatypes
    tier: high
    probes:
      - { id: decimal_precision_scale, sql: "SELECT CAST(5.345 AS DECIMAL(3, 2));" }
      - { id: decimal_precision_only, sql: "SELECT CAST(5.345 AS DECIMAL(2));" }
      - { id: decimal_bare, sql: "SELECT CAST(5.345 AS DECIMAL);" }
      - { id: dec_numeric_synonyms, sql: "SELECT CAST(1 AS DEC(5, 2)), CAST(1 AS NUMERIC(5, 2)), CAST(1 AS NUMERIC);" }
      - { id: time_precision, sql: "SELECT CAST('09:15:30.5' AS TIME(3)), CAST('14:30:00' AS TIME);" }
      - { id: array_type, sql: "SELECT CAST(ARRAY(1, 2, 3) AS ARRAY<TINYINT>);" }
      - { id: nested_array_type, sql: "SELECT CAST(ARRAY(ARRAY(1, 2), ARRAY(3, 4)) AS ARRAY<ARRAY<BIGINT>>);" }
      - { id: map_type, sql: "SELECT CAST(NULL AS MAP<TIMESTAMP, INT>);" }
      - { id: map_with_struct_type, sql: "SELECT CAST(map(struct('Hello', 'World'), 'Greeting') AS MAP<STRUCT<w1:string, w2:string>, string>);" }
      - { id: struct_with_colon, sql: "SELECT CAST(NULL AS STRUCT<a: INT, b: STRING>);" }
      - { id: struct_without_colon, sql: "SELECT CAST(NULL AS STRUCT<a INT, b STRING>);" }
      - { id: struct_not_null_comment, sql: "SELECT CAST(NULL AS STRUCT<Field1: INT NOT NULL COMMENT 'The first field.', Field2: ARRAY<INT>>);" }
      - { id: struct_collate, sql: "SELECT CAST(struct('hello') AS STRUCT<name STRING COLLATE UNICODE_CI>);" }
      - { id: empty_struct, sql: "SELECT CAST(NULL AS STRUCT<>);", note: "STRUCT syntax brackets the field list as optional and the page says any number of fields greater or equal to 0." }
      - { id: interval_type, sql: "SELECT CAST('11 23:4:0' AS INTERVAL DAY TO SECOND), CAST('1-2' AS INTERVAL YEAR TO MONTH);" }
      - { id: interval_single_unit, sql: "SELECT CAST('5' AS INTERVAL MONTH), CAST('5' AS INTERVAL HOUR);" }
      - { id: geography_type, sql: "SELECT CAST(NULL AS GEOGRAPHY(4326)), CAST(NULL AS GEOGRAPHY(ANY));", note: "GEOGRAPHY needs Databricks Runtime 17.1 or later." }
      - { id: geometry_type, sql: "SELECT CAST(NULL AS GEOMETRY(4326)), CAST(NULL AS GEOMETRY(ANY));", note: "GEOMETRY needs Databricks Runtime 17.1 or later." }
    examples:
      - "SELECT CAST(5.345 AS DECIMAL(3, 2));"
      - "SELECT CAST(ARRAY(1, 2, 3) AS ARRAY<TINYINT>);"
      - "SELECT typeof(CAST(NULL AS MAP<TIMESTAMP, INT>));"
      - "SELECT typeof(CAST(NULL AS STRUCT<Field1: INT NOT NULL COMMENT 'The first field.', Field2:ARRAY<INT>>));"
      - "SELECT CAST('09:15:30.5' AS TIME(3));"

  - id: a_cast_function
    name: CAST and TRY_CAST functions
    doc: https://docs.databricks.com/aws/en/sql/language-manual/functions/cast
    tier: high
    probes:
      - { id: cast, sql: "SELECT cast(5.6 AS INT), CAST(NULL AS INT);" }
      - { id: cast_to_decimal, sql: "SELECT cast(-5.6 AS DECIMAL(2, 0));" }
      - { id: cast_to_interval, sql: "SELECT cast(INTERVAL '1-2' YEAR TO MONTH AS INTEGER);" }
      - { id: cast_variant_to_int, sql: "SELECT cast('15'::VARIANT AS INT);" }
      - { id: cast_to_array_of_struct, sql: "SELECT CAST(c AS ARRAY<STRUCT<a: INT, b: STRING>>) FROM t;" }
      - { id: try_cast, sql: "SELECT try_cast('abc' AS INT), try_cast(5 AS DECIMAL(2, 1));" }
      - { id: nested_cast, sql: "SELECT CAST(CAST('1' AS INT) AS STRING);" }
    examples:
      - "SELECT cast(NULL AS INT);"
      - "SELECT cast(5.6 AS INT);"
      - "SELECT cast(5.6 AS DECIMAL(2, 0));"
      - "SELECT cast(INTERVAL '1-2' YEAR TO MONTH AS INTEGER);"
      - "SELECT cast('15'::VARIANT AS INT);"

  - id: a_cast_operator
    name: "Cast operators (:: and ?::)"
    doc: https://docs.databricks.com/aws/en/sql/language-manual/functions/coloncolonsign
    tier: high
    probes:
      - { id: double_colon, sql: "SELECT '20'::INTEGER, c::STRING FROM t;" }
      - { id: double_colon_parameterized, sql: "SELECT '1.5'::DECIMAL(5, 2), c::ARRAY<INT>;" }
      - { id: double_colon_chained, sql: "SELECT '1'::INT::STRING;" }
      - { id: double_colon_function_arg, sql: "SELECT typeof(NULL::STRING);" }
      - { id: double_colon_timestamp_ntz, sql: "SELECT '1908-03-15 10:1:17'::TIMESTAMP WITHOUT TIME ZONE;" }
      - { id: question_double_colon, sql: "SELECT 'abc' ?:: INT;", note: "The ?:: operator returns NULL instead of raising an error; it is named on the :: operator page." }
    examples:
      - "SELECT '20'::INTEGER;"
      - "SELECT typeof(NULL::STRING);"

  - id: a_array_literals
    name: ARRAY construction and element access
    doc: https://docs.databricks.com/aws/en/sql/language-manual/functions/array
    tier: high
    probes:
      - { id: array_function, sql: "SELECT array(1, 2, 3), array(1.0, 1, 'hello'), array();" }
      - { id: nested_arrays, sql: "SELECT array(array(1, 2), array(3, 4));" }
      - { id: bracket_index, sql: "SELECT a[2] FROM t;" }
      - { id: bracket_on_constructor, sql: "SELECT array(1, 2, 3)[1];" }
      - { id: chained_bracket, sql: "SELECT a[0][1] FROM t;" }
    examples:
      - "SELECT array(1, 2, 3);"
      - "SELECT array(1.0, 1, 'hello');"
      - "SELECT a[2] FROM VALUES (array(10, 20, 30)) AS T(a);"

  - id: a_map_literals
    name: MAP construction and key access
    doc: https://docs.databricks.com/aws/en/sql/language-manual/functions/map
    tier: high
    probes:
      - { id: map_function, sql: "SELECT map('red', 1, 'green', 2);" }
      - { id: empty_map, sql: "SELECT map();" }
      - { id: nested_map, sql: "SELECT map(array(1, 2), map('green', 5));" }
      - { id: bracket_key, sql: "SELECT m['red'] FROM t;" }
      - { id: dot_key, sql: "SELECT m.red FROM t;", note: "The dot sign operator reads a map value with a STRING key given an identifier." }
    examples:
      - "SELECT map(1.0, '2', 3.0, '4');"
      - "SELECT map(array(1, 2), map('green', 5));"
      - "SELECT m['red'] FROM VALUES (map('red', 1, 'green', 2)) AS T(m);"

  - id: a_struct_literals
    name: STRUCT construction and field access
    doc: https://docs.databricks.com/aws/en/sql/language-manual/functions/struct
    tier: high
    probes:
      - { id: struct_function, sql: "SELECT struct('Spark', 5), struct(c1, c2, c3) FROM t;" }
      - { id: struct_with_alias, sql: "SELECT struct(1, 2 AS two, 3);" }
      - { id: struct_alias_without_as, sql: "SELECT struct(1 one, 2 two);" }
      - { id: named_struct, sql: "SELECT named_struct('a', 1, 'b', 2, 'c', 3);" }
      - { id: field_dot_access, sql: "SELECT a.b FROM t;" }
      - { id: field_nested_dot_access, sql: "SELECT a.a.a.a FROM a.a;" }
      - { id: field_of_cast, sql: "SELECT collation(cast(struct('hello') AS STRUCT<name STRING COLLATE UNICODE_CI>).name);" }
    examples:
      - "SELECT struct('Spark', 5);"
      - "SELECT struct(1, 2 AS two, 3);"
      - "SELECT named_struct('a', 1, 'b', 2, 'c', 3);"
      - "SELECT a.b FROM a.a;"

  - id: a_json_path_expression
    name: JSON path expressions (colon operator)
    doc: https://docs.databricks.com/aws/en/sql/language-manual/functions/colonsign
    tier: high
    probes:
      - { id: field, sql: "SELECT c1:price FROM t;" }
      - { id: field_with_spaces, sql: "SELECT c1 : price FROM t;" }
      - { id: bracketed_field, sql: "SELECT c1:['price'] FROM t;" }
      - { id: delimited_field, sql: "SELECT raw:`zip code` FROM t;" }
      - { id: nested_dot, sql: "SELECT raw:store.bicycle FROM t;" }
      - { id: nested_brackets, sql: "SELECT raw:['store']['bicycle'] FROM t;" }
      - { id: array_index, sql: "SELECT raw:store.fruit[0], raw:store.fruit[1] FROM t;" }
      - { id: array_wildcard, sql: "SELECT raw:store.book[*].isbn FROM t;" }
      - { id: nested_array_wildcard, sql: "SELECT raw:store.basket[*][*], raw:store.basket[0][2].b FROM t;" }
      - { id: cast_extracted_value, sql: "SELECT raw:store.bicycle.price::double FROM t;" }
      - { id: bracketed_field_cast, sql: "SELECT c1:['price']::decimal(5, 2) FROM t;" }
      - { id: with_from_json, sql: "SELECT from_json(c1:item[*].price, 'ARRAY<DOUBLE>')[0] FROM t;" }
      - { id: on_function_result, sql: "SELECT parse_json('{\"price\": 5}'):price;" }
      - { id: in_predicate, sql: "SELECT '{\"key\":null}':key IS NULL AS sql_null;" }
    examples:
      - "SELECT c1:price FROM VALUES ('{ \"price\": 5 }') AS T(c1);"
      - "SELECT c1:['price']::decimal(5, 2) FROM VALUES ('{ \"price\": 5 }') AS T(c1);"
      - "SELECT PARSE_JSON('{ \"price\": 5 }'):price;"
      - "SELECT raw:store.bicycle FROM store_data;"
      - "SELECT raw:store.book[*].isbn FROM store_data;"

  - id: a_variant_literals
    name: VARIANT and JSON values
    doc: https://docs.databricks.com/aws/en/sql/language-manual/data-types/variant-type
    tier: medium
    probes:
      - { id: parse_json, sql: "SELECT parse_json('{\"key\": 123, \"data\": [4, 5, \"str\"]}');" }
      - { id: parse_json_null, sql: "SELECT parse_json(null);" }
      - { id: cast_to_variant, sql: "SELECT CAST(123.456 AS VARIANT);" }
      - { id: to_variant_object, sql: "SELECT to_variant_object(map('key', 'val')), to_variant_object(struct('field', 'val'));" }
      - { id: variant_extract_cast, sql: "SELECT v:a::INT FROM t;" }
    examples:
      - "SELECT parse_json('{\"key\": 123, \"data\": [4, 5, \"str\"]}');"
      - "SELECT parse_json(null);"
      - "SELECT to_variant_object(map('key', 'val'));"

  - id: a_collate_expression
    name: COLLATE expression
    doc: https://docs.databricks.com/aws/en/sql/language-manual/functions/collate
    tier: medium
    probes:
      - { id: collate, sql: "SELECT 'test' COLLATE UNICODE_CI;" }
      - { id: collate_in_function, sql: "SELECT collation('test' COLLATE UNICODE_CI);" }
    examples:
      - "SELECT collation('test' COLLATE UNICODE_CI);"

  - id: a_identifiers
    name: Identifier quoting (regular and backtick-delimited)
    doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-identifiers
    tier: high
    probes:
      - { id: regular, sql: "SELECT c, _c1, c_1 FROM t;" }
      - { id: starts_with_digit, sql: "SELECT 5 AS 1st;" }
      - { id: backtick_unicode, sql: "SELECT 5 AS `Ä`;" }
      - { id: backtick_dash, sql: "SELECT 5 AS `a-b`;" }
      - { id: backtick_space, sql: "SELECT 5 AS `a b`;" }
      - { id: backtick_special_char, sql: "SELECT 5 AS `a@b`;" }
      - { id: backtick_chinese, sql: "SELECT 5 AS `a中b`;" }
      - { id: backtick_escaped, sql: "SELECT 5 AS `a``b`;" }
      - { id: backtick_in_multipart, sql: "SELECT `a b`.`c d` FROM `my cat`.`my schema`.`my table` AS `a b`;" }
      - { id: three_part_name, sql: "SELECT * FROM main.default.t;" }
    examples:
      - "DESCRIBE SELECT 5 AS 1st;"
      - "DESCRIBE SELECT 5 AS `Ä`;"
      - "DESCRIBE SELECT 5 AS `a-b`;"
      - "DESCRIBE SELECT 5 AS `a``b`;"

  - id: a_identifier_clause
    name: IDENTIFIER clause
    doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-names-identifier-clause
    tier: medium
    probes:
      - { id: table_literal, sql: "SELECT * FROM IDENTIFIER('main.default.t');" }
      - { id: table_parameter_marker, sql: "SELECT * FROM IDENTIFIER(:mytab);" }
      - { id: concatenated_string, sql: "SELECT * FROM IDENTIFIER('default.' || :mytab);" }
      - { id: coalesced_strings, sql: "SELECT * FROM IDENTIFIER('default.' :mytab);", note: "Coalesced strings in IDENTIFIER need Databricks Runtime 18.0 or later." }
      - { id: column_reference, sql: "SELECT IDENTIFIER('c') FROM t;" }
      - { id: with_variable, sql: "SELECT * FROM IDENTIFIER(myview);" }
    examples:
      - "SELECT * FROM IDENTIFIER(view);"

  - id: a_comments
    name: Comments (line and bracketed)
    doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-comment
    tier: high
    probes:
      - { id: line_comment_before, sql: "-- This is a comment\nSELECT 1;" }
      - { id: line_comment_after, sql: "SELECT 1; -- This is also a comment" }
      - { id: line_comment_inside, sql: "SELECT -- This is a comment\n 1;" }
      - { id: line_comment_unicode, sql: "SELECT -- Comments are not limited to Latin characters: 评论 😊\n 1;" }
      - { id: bracketed_before, sql: "/* This is a comment */\nSELECT 1;" }
      - { id: bracketed_after, sql: "SELECT 1; /* This is also a comment */" }
      - { id: bracketed_inside, sql: "SELECT /* This is a comment */ 1;" }
      - { id: bracketed_multiline, sql: "SELECT /* This is a comment\n that spans multiple lines */ 1;" }
      - { id: bracketed_nested, sql: "SELECT /* Comments /* can be */ nested */ 1;" }
      - { id: bracketed_quotes_inside, sql: "SELECT /* Quotes in '/*' comments \"/*\" are not special */ */ */ 1;" }
      - { id: comment_marker_in_string, sql: "SELECT '-- This is not a comment', '/* This is not a comment */';" }
    examples:
      - "SELECT 1; -- This is also a comment"
      - "SELECT /* This is a comment that spans multiple lines */ 1;"
      - "SELECT '/* This is not a comment */';"

  - id: a_named_parameter_markers
    name: Named parameter markers
    doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-parameter-marker
    tier: high
    probes:
      - { id: in_select, sql: "SELECT :x * :x AS square;" }
      - { id: in_where, sql: "SELECT * FROM t WHERE c = :val;" }
      - { id: in_function_arg, sql: "SELECT current_timestamp() + :later;" }
      - { id: in_type_parameter, sql: "SELECT 1::DECIMAL(:precision, :scale);", note: "Parameter markers as type parameters need Databricks Runtime 18.0 or later." }
      - { id: in_limit, sql: "SELECT * FROM t LIMIT :n;" }
    examples:
      - "EXECUTE IMMEDIATE 'SELECT current_timestamp() + :later, :x * :x AS square' USING INTERVAL '3' HOURS AS later, 15.0 AS x;"
      - "EXECUTE IMMEDIATE 'SELECT 1::DECIMAL(:precision, :scale)' USING 6 AS precision, 4 AS scale;"

  - id: a_unnamed_parameter_markers
    name: Unnamed parameter markers
    doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-parameter-marker
    tier: high
    probes:
      - { id: in_select, sql: "SELECT ? * ? AS square;" }
      - { id: in_where, sql: "SELECT * FROM t WHERE c = ?;" }
      - { id: in_function_arg, sql: "SELECT current_timestamp() + ?;" }
    examples:
      - "EXECUTE IMMEDIATE 'SELECT current_timestamp() + ?, ? * ? AS square' USING INTERVAL '3' HOURS, 15.0, 15.0;"

  - id: a_session_variable_references
    name: Session variable references
    doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-variables
    tier: medium
    probes:
      - { id: bare_name, sql: "SELECT myvar;" }
      - { id: session_qualified, sql: "SELECT session.myvar;" }
      - { id: fully_qualified, sql: "SELECT system.session.myvar;" }
      - { id: struct_field, sql: "SELECT myvar, session.address.number;" }
      - { id: in_expression, sql: "SELECT * FROM t WHERE c = myvar + 1;" }
    examples:
      - "SELECT myvar, session.address.number;"
