dialect: flink
engine: Apache Flink SQL
version: "2.3"
source: https://nightlies.apache.org/flink/flink-docs-release-2.3/docs/sql/reference/

statements:
  - id: alter_view
    name: ALTER VIEW
    doc: https://nightlies.apache.org/flink/flink-docs-release-2.3/docs/sql/reference/ddl/alter/#alter-view
    tier: high
    probes:
      - id: rename_to
        sql: "ALTER VIEW v RENAME TO v2;"
      - id: rename_to_qualified
        sql: "ALTER VIEW cat.db.v RENAME TO v2;"
      - id: as_query
        sql: "ALTER VIEW v AS SELECT a, b FROM t;"
      - id: as_query_qualified
        sql: "ALTER VIEW cat.db.v AS SELECT a, b FROM t WHERE a > 1;"

  - id: alter_function
    name: ALTER FUNCTION
    doc: https://nightlies.apache.org/flink/flink-docs-release-2.3/docs/sql/reference/ddl/alter/#alter-function
    tier: high
    probes:
      - id: basic
        sql: "ALTER FUNCTION f AS 'com.example.MyUdf';"
      - id: if_exists
        sql: "ALTER FUNCTION IF EXISTS f AS 'com.example.MyUdf';"
      - id: qualified
        sql: "ALTER FUNCTION cat.db.f AS 'com.example.MyUdf';"
      - id: temporary
        sql: "ALTER TEMPORARY FUNCTION f AS 'com.example.MyUdf';"
      - id: temporary_system
        sql: "ALTER TEMPORARY SYSTEM FUNCTION f AS 'com.example.MyUdf';"
      - id: language_java
        sql: "ALTER FUNCTION f AS 'com.example.MyUdf' LANGUAGE JAVA;"
      - id: language_scala
        sql: "ALTER FUNCTION f AS 'com.example.MyUdf' LANGUAGE SCALA;"
      - id: language_python
        sql: "ALTER FUNCTION f AS 'pyflink.table.tests.test_udf.add' LANGUAGE PYTHON;"
      - id: all_options
        sql: "ALTER TEMPORARY FUNCTION IF EXISTS cat.db.f AS 'com.example.MyUdf' LANGUAGE JAVA;"
