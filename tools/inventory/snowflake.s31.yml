        sql: "SHOW JOB SERVICES;"
      - id: exclude_jobs
        sql: "SHOW SERVICES EXCLUDE JOBS;"
      - id: options
        sql: "SHOW SERVICES LIKE '%x%' IN SCHEMA db.s STARTS WITH 'a' LIMIT 10 FROM 'b';"
      - id: in_compute_pool
        sql: "SHOW SERVICES IN COMPUTE POOL cp;"
      - id: of_type
        sql: "SHOW SERVICES OF TYPE t1, t2;"
