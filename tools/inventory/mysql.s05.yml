dialect: mysql
engine: MySQL
version: "8.4"
source: https://dev.mysql.com/doc/refman/8.4/en/sql-statements.html

statements:
  - id: show_columns
    name: SHOW COLUMNS
    doc: https://dev.mysql.com/doc/refman/8.4/en/show-columns.html
    tier: medium
    probes:
      - { id: columns_from, sql: "SHOW COLUMNS FROM t;" }
      - { id: fields_in, sql: "SHOW FIELDS IN t;" }
      - { id: full_columns, sql: "SHOW FULL COLUMNS FROM t;" }
      - { id: extended_full, sql: "SHOW EXTENDED FULL COLUMNS FROM t;" }
      - { id: from_db, sql: "SHOW COLUMNS FROM t FROM db;" }
      - { id: qualified_in, sql: "SHOW COLUMNS IN db.t;" }
      - { id: like, sql: "SHOW COLUMNS FROM t LIKE 'c%';" }
      - { id: where, sql: "SHOW COLUMNS FROM t WHERE Field = 'c';" }
    examples:
      - "SHOW COLUMNS FROM City;"
      - "SHOW COLUMNS FROM mytable FROM mydb;"
      - "SHOW COLUMNS FROM mydb.mytable;"

  - id: show_create_database
    name: SHOW CREATE DATABASE
    doc: https://dev.mysql.com/doc/refman/8.4/en/show-create-database.html
    tier: medium
    probes:
      - { id: create_database, sql: "SHOW CREATE DATABASE db;" }
      - { id: create_schema, sql: "SHOW CREATE SCHEMA db;" }
      - { id: if_not_exists, sql: "SHOW CREATE DATABASE IF NOT EXISTS db;" }

  - id: show_create_event
    name: SHOW CREATE EVENT
    doc: https://dev.mysql.com/doc/refman/8.4/en/show-create-event.html
    tier: medium
    probes:
      - { id: event, sql: "SHOW CREATE EVENT e;" }
      - { id: qualified_event, sql: "SHOW CREATE EVENT db.e;" }

  - id: show_create_function
    name: SHOW CREATE FUNCTION
    doc: https://dev.mysql.com/doc/refman/8.4/en/show-create-function.html
    tier: medium
    probes:
      - { id: function, sql: "SHOW CREATE FUNCTION f;" }
      - { id: qualified_function, sql: "SHOW CREATE FUNCTION db.f;" }

  - id: show_create_procedure
    name: SHOW CREATE PROCEDURE
    doc: https://dev.mysql.com/doc/refman/8.4/en/show-create-procedure.html
    tier: medium
    probes:
      - { id: procedure, sql: "SHOW CREATE PROCEDURE p;" }
      - { id: qualified_procedure, sql: "SHOW CREATE PROCEDURE db.p;" }

  - id: show_create_table
    name: SHOW CREATE TABLE
    doc: https://dev.mysql.com/doc/refman/8.4/en/show-create-table.html
    tier: medium
    probes:
      - { id: table, sql: "SHOW CREATE TABLE t;" }
      - { id: qualified_table, sql: "SHOW CREATE TABLE db.t;" }

  - id: show_create_trigger
    name: SHOW CREATE TRIGGER
    doc: https://dev.mysql.com/doc/refman/8.4/en/show-create-trigger.html
    tier: medium
    probes:
      - { id: trigger, sql: "SHOW CREATE TRIGGER trg;" }
      - { id: qualified_trigger, sql: "SHOW CREATE TRIGGER db.trg;" }

  - id: show_create_user
    name: SHOW CREATE USER
    doc: https://dev.mysql.com/doc/refman/8.4/en/show-create-user.html
    tier: medium
    probes:
      - { id: user_host, sql: "SHOW CREATE USER 'u'@'localhost';" }
      - { id: user_only, sql: "SHOW CREATE USER u;" }
      - { id: current_user, sql: "SHOW CREATE USER CURRENT_USER;" }
      - { id: current_user_fn, sql: "SHOW CREATE USER CURRENT_USER();" }

  - id: show_create_view
    name: SHOW CREATE VIEW
    doc: https://dev.mysql.com/doc/refman/8.4/en/show-create-view.html
    tier: medium
    probes:
      - { id: view, sql: "SHOW CREATE VIEW v;" }
      - { id: qualified_view, sql: "SHOW CREATE VIEW db.v;" }

  - id: show_databases
    name: SHOW DATABASES
    doc: https://dev.mysql.com/doc/refman/8.4/en/show-databases.html
    tier: medium
    probes:
      - { id: databases, sql: "SHOW DATABASES;" }
      - { id: schemas, sql: "SHOW SCHEMAS;" }
      - { id: like, sql: "SHOW DATABASES LIKE 'd%';" }
      - { id: where, sql: "SHOW DATABASES WHERE `Database` = 'db';" }
