  - id: create_selective_xml_index
    name: "CREATE SELECTIVE XML INDEX"
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-selective-xml-index-transact-sql
    tier: low
    probes:
      - id: xquery_paths
        sql: "CREATE SELECTIVE XML INDEX sxi ON t (x) FOR (p1 = '/a/b' AS XQUERY 'node()', p2 = '/a/b/c' AS XQUERY 'xs:double', p3 = '/a/b/d/text()' AS XQUERY 'xs:string' MAXLENGTH(200) SINGLETON);"
      - id: sql_path
        sql: "CREATE SELECTIVE XML INDEX sxi ON t (x) FOR (p = '/a/b/e' AS SQL NVARCHAR(100));"
      - id: xmlnamespaces
        sql: "CREATE SELECTIVE XML INDEX sxi ON t (x) WITH XMLNAMESPACES ('https://www.tempuri.org/' AS myns) FOR (p1 = '/myns:book/myns:author/text()') WITH (PAD_INDEX = ON);"
      - id: untyped_path
        sql: "CREATE SELECTIVE XML INDEX sxi ON t (x) FOR (p = '/a/b');"
