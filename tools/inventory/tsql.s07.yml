dialect: tsql
engine: SQL Server 2022 / Azure SQL Database
version: "2022"
source: https://learn.microsoft.com/en-us/sql/t-sql/statements/statements

statements:
  - id: drop_fulltext_index
    name: DROP FULLTEXT INDEX
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/drop-fulltext-index-transact-sql
    tier: medium
    probes:
      - { id: basic, sql: "DROP FULLTEXT INDEX ON t;" }
      - { id: schema_qualified, sql: "DROP FULLTEXT INDEX ON dbo.t;" }
    examples:
      - "DROP FULLTEXT INDEX ON HumanResources.JobCandidate;"

  - id: drop_login
    name: DROP LOGIN
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/drop-login-transact-sql
    tier: medium
    probes:
      - { id: basic, sql: "DROP LOGIN lg;" }
      - { id: bracketed, sql: "DROP LOGIN [DOMAIN\\user1];" }
    examples:
      - "DROP LOGIN WilliJo;"

  - id: drop_partition_function
    name: DROP PARTITION FUNCTION
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/drop-partition-function-transact-sql
    tier: medium
    probes:
      - { id: basic, sql: "DROP PARTITION FUNCTION pf;" }
    examples:
      - "DROP PARTITION FUNCTION myRangePF;"

  - id: drop_partition_scheme
    name: DROP PARTITION SCHEME
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/drop-partition-scheme-transact-sql
    tier: medium
    probes:
      - { id: basic, sql: "DROP PARTITION SCHEME ps;" }
    examples:
      - "DROP PARTITION SCHEME myRangePS1;"

  - id: drop_role
    name: DROP ROLE
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/drop-role-transact-sql
    tier: medium
    probes:
      - { id: basic, sql: "DROP ROLE r;" }
      - { id: if_exists, sql: "DROP ROLE IF EXISTS r;" }
    examples:
      - "DROP ROLE purchasing;"

  - id: drop_sequence
    name: DROP SEQUENCE
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/drop-sequence-transact-sql
    tier: medium
    probes:
      - { id: basic, sql: "DROP SEQUENCE s;" }
      - { id: if_exists, sql: "DROP SEQUENCE IF EXISTS s;" }
      - { id: schema_qualified, sql: "DROP SEQUENCE dbo.s;" }
      - { id: database_qualified, sql: "DROP SEQUENCE db.dbo.s;" }
      - { id: multiple, sql: "DROP SEQUENCE s1, dbo.s2;" }
    examples:
      - "DROP SEQUENCE CountBy1 ;"

  - id: drop_statistics
    name: DROP STATISTICS
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/drop-statistics-transact-sql
    tier: medium
    probes:
      - { id: table_statistics, sql: "DROP STATISTICS t.st;" }
      - { id: schema_qualified, sql: "DROP STATISTICS dbo.t.st;" }
      - { id: multiple, sql: "DROP STATISTICS t1.st1, dbo.t2.st2;" }
    examples:
      - "DROP STATISTICS Purchasing.Vendor.VendorCredit, Sales.SalesOrderHeader.CustomerTotal;"
      - "DROP STATISTICS dbo.Customer.CustomerStats1;"

  - id: drop_synonym
    name: DROP SYNONYM
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/drop-synonym-transact-sql
    tier: medium
    probes:
      - { id: basic, sql: "DROP SYNONYM syn;" }
      - { id: if_exists, sql: "DROP SYNONYM IF EXISTS syn;" }
      - { id: schema_qualified, sql: "DROP SYNONYM IF EXISTS dbo.syn;" }
    examples:
      - "DROP SYNONYM MyProduct;"

  - id: drop_user
    name: DROP USER
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/drop-user-transact-sql
    tier: medium
    probes:
      - { id: basic, sql: "DROP USER u;" }
      - { id: if_exists, sql: "DROP USER IF EXISTS u;" }
    examples:
      - "DROP USER AbolrousHazem;"

  - id: deny
    name: DENY
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/deny-transact-sql
    tier: medium
    probes:
      - { id: permission_on_object, sql: "DENY SELECT ON t TO u;" }
      - { id: multiple_permissions_principals, sql: "DENY SELECT, INSERT ON t TO u1, u2;" }
      - { id: column_list, sql: "DENY SELECT (c1, c2) ON t TO u;" }
      - { id: class_securable, sql: "DENY EXECUTE ON OBJECT::dbo.p TO u;" }
      - { id: schema_class, sql: "DENY UPDATE ON SCHEMA::s TO u;" }
      - { id: database_permission, sql: "DENY CREATE TABLE TO u;" }
      - { id: cascade, sql: "DENY SELECT ON t TO u CASCADE;" }
      - { id: as_principal, sql: "DENY SELECT ON t TO u AS grantor;" }
      - { id: all_privileges, sql: "DENY ALL PRIVILEGES ON t TO u;" }
      - { id: all, sql: "DENY ALL ON t TO u;" }
