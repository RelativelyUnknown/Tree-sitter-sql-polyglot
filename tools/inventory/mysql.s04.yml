dialect: mysql
engine: MySQL
version: "8.4"
source: https://dev.mysql.com/doc/refman/8.4/en/sql-statements.html

statements:
  - id: set_role
    name: SET ROLE
    doc: https://dev.mysql.com/doc/refman/8.4/en/set-role.html
    tier: medium
    probes:
      - { id: default, sql: "SET ROLE DEFAULT;" }
      - { id: none, sql: "SET ROLE NONE;" }
      - { id: all, sql: "SET ROLE ALL;" }
      - { id: all_except, sql: "SET ROLE ALL EXCEPT 'role1', 'role2';" }
      - { id: role_list, sql: "SET ROLE 'role1', 'role2';" }
      - { id: role_with_host, sql: "SET ROLE 'app_read'@'%';" }
    examples:
      - "SET ROLE DEFAULT;"
      - "SET ROLE 'role1', 'role2';"
      - "SET ROLE ALL EXCEPT 'role1', 'role2';"

  - id: analyze_table
    name: ANALYZE TABLE
    doc: https://dev.mysql.com/doc/refman/8.4/en/analyze-table.html
    tier: medium
    probes:
      - { id: basic, sql: "ANALYZE TABLE t;" }
      - { id: multiple_tables, sql: "ANALYZE TABLE t1, t2;" }
      - { id: no_write_to_binlog, sql: "ANALYZE NO_WRITE_TO_BINLOG TABLE t;" }
      - { id: local, sql: "ANALYZE LOCAL TABLE t;" }
      - { id: update_histogram, sql: "ANALYZE TABLE t UPDATE HISTOGRAM ON c1, c2;" }
      - { id: update_histogram_buckets, sql: "ANALYZE TABLE t UPDATE HISTOGRAM ON c1, c2 WITH 10 BUCKETS;" }
      - { id: update_histogram_auto, sql: "ANALYZE TABLE t UPDATE HISTOGRAM ON c1 WITH 10 BUCKETS AUTO UPDATE;" }
      - { id: update_histogram_manual, sql: "ANALYZE TABLE t UPDATE HISTOGRAM ON c1 MANUAL UPDATE;" }
      - { id: update_histogram_using_data, sql: "ANALYZE TABLE t UPDATE HISTOGRAM ON c1 USING DATA '{\"buckets\": []}';" }
      - { id: drop_histogram, sql: "ANALYZE TABLE t DROP HISTOGRAM ON c1, c2;" }
    examples:
      - "ANALYZE TABLE t UPDATE HISTOGRAM ON c1, c2, c3 WITH 10 BUCKETS;"
      - "ANALYZE TABLE t UPDATE HISTOGRAM ON c1, c3 WITH 10 BUCKETS;"
      - "ANALYZE TABLE t DROP HISTOGRAM ON c2;"

  - id: check_table
    name: CHECK TABLE
    doc: https://dev.mysql.com/doc/refman/8.4/en/check-table.html
    tier: medium
    probes:
      - { id: basic, sql: "CHECK TABLE t;" }
      - { id: multiple_tables, sql: "CHECK TABLE t1, t2;" }
      - { id: for_upgrade, sql: "CHECK TABLE t FOR UPGRADE;" }
      - { id: quick, sql: "CHECK TABLE t QUICK;" }
      - { id: fast, sql: "CHECK TABLE t FAST;" }
      - { id: medium, sql: "CHECK TABLE t MEDIUM;" }
      - { id: extended, sql: "CHECK TABLE t EXTENDED;" }
      - { id: changed, sql: "CHECK TABLE t CHANGED;" }
      - { id: multiple_options, sql: "CHECK TABLE t FAST QUICK;" }
    examples:
      - "CHECK TABLE test_table FAST QUICK;"

  - id: checksum_table
    name: CHECKSUM TABLE
    doc: https://dev.mysql.com/doc/refman/8.4/en/checksum-table.html
    tier: medium
    probes:
      - { id: basic, sql: "CHECKSUM TABLE t;" }
      - { id: multiple_tables, sql: "CHECKSUM TABLE t1, t2;" }
      - { id: quick, sql: "CHECKSUM TABLE t QUICK;" }
      - { id: extended, sql: "CHECKSUM TABLE t EXTENDED;" }

  - id: optimize_table
    name: OPTIMIZE TABLE
    doc: https://dev.mysql.com/doc/refman/8.4/en/optimize-table.html
    tier: medium
    probes:
      - { id: basic, sql: "OPTIMIZE TABLE t;" }
      - { id: multiple_tables, sql: "OPTIMIZE TABLE t1, t2;" }
      - { id: no_write_to_binlog, sql: "OPTIMIZE NO_WRITE_TO_BINLOG TABLE t;" }
      - { id: local, sql: "OPTIMIZE LOCAL TABLE t;" }
    examples:
      - "OPTIMIZE TABLE foo;"

  - id: repair_table
    name: REPAIR TABLE
    doc: https://dev.mysql.com/doc/refman/8.4/en/repair-table.html
    tier: medium
    probes:
      - { id: basic, sql: "REPAIR TABLE t;" }
      - { id: multiple_tables, sql: "REPAIR TABLE t1, t2;" }
      - { id: no_write_to_binlog, sql: "REPAIR NO_WRITE_TO_BINLOG TABLE t;" }
      - { id: local, sql: "REPAIR LOCAL TABLE t;" }
      - { id: quick, sql: "REPAIR TABLE t QUICK;" }
      - { id: extended, sql: "REPAIR TABLE t EXTENDED;" }
      - { id: use_frm, sql: "REPAIR TABLE t USE_FRM;" }
      - { id: all_options, sql: "REPAIR TABLE t QUICK EXTENDED USE_FRM;" }

  - id: set_character_set
    name: SET CHARACTER SET
    doc: https://dev.mysql.com/doc/refman/8.4/en/set-character-set.html
    tier: medium
    probes:
      - { id: quoted, sql: "SET CHARACTER SET 'utf8mb4';" }
      - { id: unquoted, sql: "SET CHARACTER SET utf8mb4;" }
      - { id: default, sql: "SET CHARACTER SET DEFAULT;" }
      - { id: charset_synonym, sql: "SET CHARSET 'utf8mb4';" }
      - { id: charset_synonym_default, sql: "SET CHARSET DEFAULT;" }

  - id: set_names
    name: SET NAMES
    doc: https://dev.mysql.com/doc/refman/8.4/en/set-names.html
    tier: medium
    probes:
      - { id: quoted, sql: "SET NAMES 'utf8mb4';" }
      - { id: unquoted, sql: "SET NAMES utf8mb4;" }
      - { id: collate, sql: "SET NAMES 'utf8mb4' COLLATE 'utf8mb4_unicode_ci';" }
      - { id: collate_unquoted, sql: "SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci;" }
      - { id: default, sql: "SET NAMES DEFAULT;" }

  - id: show_character_set
    name: SHOW CHARACTER SET
    doc: https://dev.mysql.com/doc/refman/8.4/en/show-character-set.html
    tier: medium
    probes:
      - { id: basic, sql: "SHOW CHARACTER SET;" }
      - { id: like, sql: "SHOW CHARACTER SET LIKE 'latin%';" }
      - { id: where, sql: "SHOW CHARACTER SET WHERE Charset = 'latin1';" }
      - { id: charset_synonym, sql: "SHOW CHARSET;" }
      - { id: charset_synonym_like, sql: "SHOW CHARSET LIKE 'utf8%';" }
    examples:
      - "SHOW CHARACTER SET LIKE 'latin%';"

  - id: show_collation
    name: SHOW COLLATION
    doc: https://dev.mysql.com/doc/refman/8.4/en/show-collation.html
    tier: medium
    probes:
      - { id: basic, sql: "SHOW COLLATION;" }
      - { id: like, sql: "SHOW COLLATION LIKE 'latin1%';" }
      - { id: where, sql: "SHOW COLLATION WHERE Charset = 'latin1';" }
    examples:
      - "SHOW COLLATION WHERE Charset = 'latin1';"
