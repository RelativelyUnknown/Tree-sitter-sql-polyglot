dialect: db2
engine: IBM Db2 for Linux, UNIX and Windows
version: "11.5"
source: https://www.ibm.com/docs/en/db2/11.5.x?topic=reference-statements

statements:
  - id: create_table
    name: CREATE TABLE
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-create-table
    tier: high
    probes:
      - { id: basic, sql: "CREATE TABLE t (c INTEGER);" }
      - { id: if_not_exists, sql: "CREATE TABLE IF NOT EXISTS t (c INTEGER);" }
      - { id: multi_column_types, sql: "CREATE TABLE t (a SMALLINT, b BIGINT, c DECIMAL(9,2), d NUMERIC(5,0), e REAL, f DOUBLE PRECISION, g FLOAT(53), h DECFLOAT(16));" }
      - { id: char_types, sql: "CREATE TABLE t (a CHAR(3), b VARCHAR(10 OCTETS), c VARCHAR(10 CODEUNITS32), d CHARACTER VARYING(20), e CLOB(1M), f CHAR(5) FOR BIT DATA);" }
      - { id: graphic_types, sql: "CREATE TABLE t (a GRAPHIC(5), b VARGRAPHIC(10 CODEUNITS16), c DBCLOB(1M), d NCHAR(5), e NVARCHAR(10), f NCLOB(1K));" }
      - { id: binary_types, sql: "CREATE TABLE t (a BINARY(4), b VARBINARY(8), c BLOB(1M), d XML, e BOOLEAN);" }
      - { id: datetime_types, sql: "CREATE TABLE t (a DATE, b TIME, c TIMESTAMP(6));" }
      - { id: distinct_type_column, sql: "CREATE TABLE t (c my_type);" }
      - { id: not_null, sql: "CREATE TABLE t (c INTEGER NOT NULL);" }
      - { id: default_constant, sql: "CREATE TABLE t (c INTEGER NOT NULL WITH DEFAULT 0);" }
      - { id: default_special_register, sql: "CREATE TABLE t (c VARCHAR(128) DEFAULT CURRENT SCHEMA, d TIMESTAMP DEFAULT CURRENT TIMESTAMP);" }
      - { id: default_cast_function, sql: "CREATE TABLE t (c my_type DEFAULT my_type(1));" }
      - { id: default_empty_lob, sql: "CREATE TABLE t (c CLOB(1M) DEFAULT EMPTY_CLOB());" }
      - { id: column_primary_key, sql: "CREATE TABLE t (c INTEGER NOT NULL PRIMARY KEY);" }
      - { id: column_unique, sql: "CREATE TABLE t (c INTEGER NOT NULL UNIQUE);" }
      - { id: column_references, sql: "CREATE TABLE t (c INTEGER REFERENCES p (id) ON DELETE CASCADE ON UPDATE NO ACTION);" }
      - { id: column_check, sql: "CREATE TABLE t (c INTEGER CHECK (c BETWEEN 10 AND 100));" }
      - { id: column_named_constraint, sql: "CREATE TABLE t (c INTEGER CONSTRAINT cc CHECK (c > 0) NOT ENFORCED);" }
      - { id: column_constraint_attributes, sql: "CREATE TABLE t (c INTEGER REFERENCES p (id) NOT ENFORCED ENABLE QUERY OPTIMIZATION);" }
      - { id: generated_identity, sql: "CREATE TABLE t (id INTEGER GENERATED ALWAYS AS IDENTITY (START WITH 1 INCREMENT BY 1 NO MINVALUE NO MAXVALUE NO CYCLE CACHE 20 NO ORDER));" }
      - { id: generated_by_default_identity, sql: "CREATE TABLE t (id INTEGER GENERATED BY DEFAULT AS IDENTITY);" }
      - { id: generated_expression, sql: "CREATE TABLE t (a INTEGER, b INTEGER GENERATED ALWAYS AS (a * 2));" }
      - { id: generated_expression_no_type, sql: "CREATE TABLE t (a INTEGER, b GENERATED ALWAYS AS (a * 2));" }
      - { id: row_change_timestamp, sql: "CREATE TABLE t (c TIMESTAMP NOT NULL GENERATED ALWAYS FOR EACH ROW ON UPDATE AS ROW CHANGE TIMESTAMP);" }
      - { id: row_begin_end, sql: "CREATE TABLE t (rb TIMESTAMP(12) NOT NULL GENERATED ALWAYS AS ROW BEGIN, re TIMESTAMP(12) NOT NULL GENERATED ALWAYS AS ROW END);" }
      - { id: transaction_start_id, sql: "CREATE TABLE t (ts TIMESTAMP(12) GENERATED ALWAYS AS TRANSACTION START ID);" }
      - { id: column_compress_system_default, sql: "CREATE TABLE t (c INTEGER COMPRESS SYSTEM DEFAULT);" }
      - { id: column_secured_with, sql: "CREATE TABLE t (c INTEGER SECURED WITH sl);" }
      - { id: column_hidden, sql: "CREATE TABLE t (c INTEGER IMPLICITLY HIDDEN);" }
      - { id: column_inline_length, sql: "CREATE TABLE t (c emp_type INLINE LENGTH 300);" }
      - { id: lob_options, sql: "CREATE TABLE t (c BLOB(1M) NOT LOGGED COMPACT);" }
      - { id: scope_ref, sql: "CREATE TABLE t (r REF(emp_type) SCOPE emp);" }
      - { id: period_system_time, sql: "CREATE TABLE t (c INTEGER, rb TIMESTAMP(12) NOT NULL GENERATED ALWAYS AS ROW BEGIN, re TIMESTAMP(12) NOT NULL GENERATED ALWAYS AS ROW END, ts TIMESTAMP(12) GENERATED ALWAYS AS TRANSACTION START ID, PERIOD SYSTEM_TIME (rb, re));" }
      - { id: period_business_time, sql: "CREATE TABLE t (c INTEGER, bs DATE NOT NULL, be DATE NOT NULL, PERIOD BUSINESS_TIME (bs, be));" }
      - { id: table_primary_key, sql: "CREATE TABLE t (a INTEGER NOT NULL, b INTEGER NOT NULL, PRIMARY KEY (a, b));" }
      - { id: table_unique_named, sql: "CREATE TABLE t (a INTEGER NOT NULL, b INTEGER NOT NULL, CONSTRAINT u UNIQUE (a, b));" }
      - { id: table_unique_business_time, sql: "CREATE TABLE t (a INTEGER NOT NULL, bs DATE NOT NULL, be DATE NOT NULL, PERIOD BUSINESS_TIME (bs, be), UNIQUE (a, BUSINESS_TIME WITHOUT OVERLAPS));" }
      - { id: table_foreign_key, sql: "CREATE TABLE t (a INTEGER, CONSTRAINT fk FOREIGN KEY (a) REFERENCES p (id) ON DELETE SET NULL);" }
      - { id: table_foreign_key_restrict, sql: "CREATE TABLE t (a INTEGER, FOREIGN KEY (a) REFERENCES p (id) ON DELETE RESTRICT ON UPDATE RESTRICT);" }
      - { id: table_check, sql: "CREATE TABLE t (a INTEGER, CONSTRAINT ck CHECK (a > 0 OR a < -5) ENFORCED TRUSTED);" }
      - { id: constraint_not_trusted, sql: "CREATE TABLE t (a INTEGER, CHECK (a > 0) NOT ENFORCED NOT TRUSTED DISABLE QUERY OPTIMIZATION);" }
      - { id: of_type, sql: "CREATE TABLE t OF emp_type (REF IS oid USER GENERATED);" }
      - { id: of_type_hierarchy_under, sql: "CREATE TABLE t OF emp_type UNDER s INHERIT SELECT PRIVILEGES;" }
      - { id: of_type_hierarchy_name, sql: "CREATE TABLE t OF emp_type HIERARCHY h (REF IS oid USER GENERATED);" }
      - { id: typed_with_options, sql: "CREATE TABLE t OF emp_type (REF IS oid USER GENERATED, c WITH OPTIONS NOT NULL);" }
      - { id: like_table, sql: "CREATE TABLE t LIKE s;" }
      - { id: like_including_defaults, sql: "CREATE TABLE t LIKE s INCLUDING COLUMN DEFAULTS INCLUDING IDENTITY COLUMN ATTRIBUTES;" }
      - { id: like_excluding, sql: "CREATE TABLE t LIKE s EXCLUDING COLUMN DEFAULTS EXCLUDING IDENTITY COLUMN ATTRIBUTES;" }
      - { id: like_view, sql: "CREATE TABLE t LIKE v;" }
      - { id: as_select_with_no_data, sql: "CREATE TABLE t AS (SELECT a, b FROM s) WITH NO DATA;" }
      - { id: as_select_with_data, sql: "CREATE TABLE t (x, y) AS (SELECT a, b FROM s) WITH DATA;" }
      - { id: as_select_copy_options, sql: "CREATE TABLE t AS (SELECT a, b FROM s) WITH NO DATA INCLUDING COLUMN DEFAULTS;" }
      - { id: materialized_query_deferred, sql: "CREATE TABLE t AS (SELECT a, COUNT(*) AS n FROM s GROUP BY a) DATA INITIALLY DEFERRED REFRESH DEFERRED;" }
      - { id: materialized_query_immediate, sql: "CREATE TABLE t AS (SELECT a, COUNT(*) AS n FROM s GROUP BY a) DATA INITIALLY DEFERRED REFRESH IMMEDIATE;" }
      - { id: materialized_query_options, sql: "CREATE TABLE t AS (SELECT a FROM s) DATA INITIALLY DEFERRED REFRESH DEFERRED ENABLE QUERY OPTIMIZATION MAINTAINED BY USER;" }
      - { id: materialized_query_maintained_system, sql: "CREATE TABLE t AS (SELECT a FROM s) DATA INITIALLY DEFERRED REFRESH DEFERRED DISABLE QUERY OPTIMIZATION MAINTAINED BY SYSTEM;" }
      - { id: staging_table, sql: "CREATE TABLE st FOR mqt PROPAGATE IMMEDIATE;" }
      - { id: staging_table_columns, sql: "CREATE TABLE st (a, b) FOR mqt PROPAGATE IMMEDIATE;" }
      - { id: organize_by_row, sql: "CREATE TABLE t (c INTEGER) ORGANIZE BY ROW;" }
      - { id: organize_by_column, sql: "CREATE TABLE t (c INTEGER) ORGANIZE BY COLUMN;" }
      - { id: organize_by_dimensions, sql: "CREATE TABLE t (a INTEGER, b INTEGER, c INTEGER) ORGANIZE BY DIMENSIONS (a, (b, c));" }
      - { id: organize_by_row_using_dimensions, sql: "CREATE TABLE t (a INTEGER, b INTEGER) ORGANIZE BY ROW USING (a, b);" }
      - { id: organize_by_key_sequence, sql: "CREATE TABLE t (a INTEGER) ORGANIZE BY KEY SEQUENCE (a STARTING FROM 1 ENDING AT 100) ALLOW OVERFLOW;" }
      - { id: organize_by_key_sequence_pctfree, sql: "CREATE TABLE t (a INTEGER) ORGANIZE BY KEY SEQUENCE (a STARTING FROM 1 ENDING AT 100) DISALLOW OVERFLOW PCTFREE 10;" }
      - { id: organize_by_insert_time, sql: "CREATE TABLE t (a INTEGER) ORGANIZE BY INSERT TIME;" }
      - { id: data_capture_none, sql: "CREATE TABLE t (c INTEGER) DATA CAPTURE NONE;" }
      - { id: data_capture_changes, sql: "CREATE TABLE t (c INTEGER) DATA CAPTURE CHANGES;" }
      - { id: in_tablespace, sql: "CREATE TABLE t (c INTEGER) IN ts;" }
      - { id: in_tablespaces_list, sql: "CREATE TABLE t (c INTEGER) IN ts1, ts2;" }
      - { id: in_tablespace_cycle, sql: "CREATE TABLE t (c INTEGER) IN ts1, ts2 CYCLE;" }
      - { id: in_tablespace_no_cycle, sql: "CREATE TABLE t (c INTEGER) IN ts1, ts2 NO CYCLE;" }
      - { id: index_in, sql: "CREATE TABLE t (c INTEGER) IN ts INDEX IN ts_idx;" }
      - { id: long_in, sql: "CREATE TABLE t (c INTEGER, d CLOB(1M)) IN ts LONG IN ts_long;" }
      - { id: distribute_by_hash, sql: "CREATE TABLE t (a INTEGER, b INTEGER) DISTRIBUTE BY HASH (a, b);" }
      - { id: distribute_by_replication, sql: "CREATE TABLE t (a INTEGER) DISTRIBUTE BY REPLICATION;" }
      - { id: distribute_by_random, sql: "CREATE TABLE t (a INTEGER) DISTRIBUTE BY RANDOM;" }
      - { id: partition_by_range_explicit, sql: "CREATE TABLE t (a INTEGER) PARTITION BY RANGE (a) (PARTITION p1 STARTING FROM (1) ENDING AT (10), PARTITION p2 STARTING FROM (11) ENDING AT (20));" }
      - { id: partition_by_range_inclusive, sql: "CREATE TABLE t (a INTEGER) PARTITION BY RANGE (a NULLS FIRST) (PARTITION p1 STARTING FROM (MINVALUE) INCLUSIVE ENDING AT (10) EXCLUSIVE, PARTITION p2 STARTING (11) ENDING (MAXVALUE));" }
      - { id: partition_by_range_bare_boundary, sql: "CREATE TABLE t (a INTEGER) PARTITION BY RANGE (a NULLS LAST) (STARTING 1 ENDING 100 EVERY 10);" }
      - { id: partition_by_range_every_duration, sql: "CREATE TABLE t (d DATE) PARTITION BY RANGE (d) (STARTING '2020-01-01' ENDING '2020-12-31' EVERY 1 MONTH);" }
      - { id: partition_by_range_every_duration_paren, sql: "CREATE TABLE t (d DATE) PARTITION BY RANGE (d) (STARTING FROM ('2020-01-01') ENDING AT ('2020-12-31') EVERY (3 MONTHS));" }
      - { id: partition_by_range_tablespace_options, sql: "CREATE TABLE t (a INTEGER) PARTITION BY RANGE (a) (PARTITION p1 STARTING FROM (1) ENDING AT (10) IN ts1 INDEX IN ts_i1 LONG IN ts_l1);" }
      - { id: partition_by_range_multi_column, sql: "CREATE TABLE t (a INTEGER, b INTEGER) PARTITION BY RANGE (a, b) (PARTITION p1 STARTING FROM (1, 1) ENDING AT (10, 10));" }
      - { id: compress_yes, sql: "CREATE TABLE t (c INTEGER) COMPRESS YES;" }
      - { id: compress_yes_adaptive, sql: "CREATE TABLE t (c INTEGER) COMPRESS YES ADAPTIVE;" }
      - { id: compress_yes_static, sql: "CREATE TABLE t (c INTEGER) COMPRESS YES STATIC;" }
      - { id: compress_no, sql: "CREATE TABLE t (c INTEGER) COMPRESS NO;" }
      - { id: value_compression, sql: "CREATE TABLE t (c INTEGER) VALUE COMPRESSION;" }
      - { id: with_restrict_on_drop, sql: "CREATE TABLE t (c INTEGER) WITH RESTRICT ON DROP;" }
      - { id: not_logged_initially, sql: "CREATE TABLE t (c INTEGER) NOT LOGGED INITIALLY;" }
      - { id: ccsid_unicode, sql: "CREATE TABLE t (c INTEGER) CCSID UNICODE;" }
      - { id: ccsid_ascii, sql: "CREATE TABLE t (c INTEGER) CCSID ASCII;" }
      - { id: security_policy, sql: "CREATE TABLE t (c INTEGER, sl SYSPROC.DB2SECURITYLABEL) SECURITY POLICY pol;" }
      - { id: options_clause, sql: "CREATE TABLE t (c INTEGER) OPTIONS (opt1 'v1', opt2 'v2');" }
      - { id: combined_clauses, sql: "CREATE TABLE t (a INTEGER NOT NULL, PRIMARY KEY (a)) IN ts INDEX IN ts_i ORGANIZE BY ROW DATA CAPTURE NONE COMPRESS YES WITH RESTRICT ON DROP;" }
    examples:
      - "CREATE TABLE TDEPT (DEPTNO CHAR (3) NOT NULL , DEPTNAME VARCHAR (36) NOT NULL , MGRNO CHAR (6), ADMRDEPT CHAR (3) NOT NULL , PRIMARY KEY (DEPTNO)) IN DEPARTX;"
      - "CREATE TABLE EMPLOYEE_SALARY (DEPTNO CHAR (3) NOT NULL , DEPTNAME VARCHAR (36) NOT NULL , EMPNO CHAR (6) NOT NULL , SALARY DECIMAL (9,2) NOT NULL WITH DEFAULT );"
      - "CREATE TABLE EXCEPTION_EMPLOYEE AS ( SELECT EMPLOYEE.*, CURRENT TIMESTAMP AS TIMESTAMP, CAST ('' AS CLOB(32K)) AS MSG FROM EMPLOYEE ) WITH NO DATA;"

  - id: create_view
    name: CREATE VIEW
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-create-view
    tier: high
    probes:
      - { id: basic, sql: "CREATE VIEW v AS SELECT a FROM t;" }
      - { id: or_replace, sql: "CREATE OR REPLACE VIEW v AS SELECT a FROM t;" }
      - { id: column_list, sql: "CREATE VIEW v (x, y) AS SELECT a, b FROM t;" }
      - { id: with_cte, sql: "CREATE VIEW v AS WITH c (a) AS (SELECT a FROM t) SELECT a FROM c;" }
      - { id: with_multiple_ctes, sql: "CREATE VIEW v AS WITH c1 AS (SELECT a FROM t), c2 AS (SELECT a FROM c1) SELECT a FROM c2;" }
      - { id: fullselect_union, sql: "CREATE VIEW v AS SELECT a FROM t UNION ALL SELECT a FROM s;" }
      - { id: with_check_option, sql: "CREATE VIEW v AS SELECT a FROM t WHERE a > 0 WITH CHECK OPTION;" }
      - { id: with_cascaded_check_option, sql: "CREATE VIEW v AS SELECT a FROM t WHERE a > 0 WITH CASCADED CHECK OPTION;" }
      - { id: with_local_check_option, sql: "CREATE VIEW v AS SELECT a FROM t WHERE a > 0 WITH LOCAL CHECK OPTION;" }
      - { id: with_row_movement, sql: "CREATE VIEW v AS SELECT a FROM t WITH ROW MOVEMENT;" }
      - { id: with_no_row_movement, sql: "CREATE VIEW v AS SELECT a FROM t WITH NO ROW MOVEMENT;" }
      - { id: check_option_row_movement, sql: "CREATE VIEW v AS SELECT a FROM t WITH CASCADED CHECK OPTION WITH ROW MOVEMENT;" }
      - { id: typed_root_view, sql: "CREATE VIEW v OF emp_type MODE DB2SQL (REF IS oid USER GENERATED) AS SELECT * FROM t;" }
      - { id: typed_root_view_with_options, sql: "CREATE VIEW v OF emp_type MODE DB2SQL (REF IS oid USER GENERATED, c WITH OPTIONS READ ONLY) AS SELECT * FROM t;" }
      - { id: typed_root_view_scope, sql: "CREATE VIEW v OF emp_type MODE DB2SQL (REF IS oid USER GENERATED, r WITH OPTIONS SCOPE s) AS SELECT * FROM t;" }
      - { id: typed_view_no_mode, sql: "CREATE VIEW v OF emp_type (REF IS oid USER GENERATED) AS SELECT * FROM t;" }
      - { id: typed_view_oid_unchecked, sql: "CREATE VIEW v OF emp_type MODE DB2SQL (REF IS oid USER GENERATED UNCHECKED) AS SELECT * FROM t;" }
      - { id: typed_view_extend, sql: "CREATE VIEW v OF emp_type MODE DB2SQL EXTEND (REF IS oid USER GENERATED) AS SELECT * FROM t;" }
      - { id: subview_under, sql: "CREATE VIEW sub OF emp_type MODE DB2SQL UNDER sup INHERIT SELECT PRIVILEGES AS SELECT * FROM t;" }
      - { id: subview_with_options, sql: "CREATE VIEW sub OF emp_type MODE DB2SQL UNDER sup INHERIT SELECT PRIVILEGES (c WITH OPTIONS READ ONLY) AS SELECT * FROM t;" }
      - { id: subview_extend, sql: "CREATE VIEW sub OF emp_type MODE DB2SQL UNDER sup INHERIT SELECT PRIVILEGES EXTEND (a WITH OPTIONS SCOPE s) AS SELECT * FROM t;" }
    examples:
      - "CREATE VIEW MA_PROJ AS SELECT * FROM PROJECT WHERE SUBSTR( PROJNO, 1, 2 ) = 'MA';"
      - "CREATE VIEW MA_PROJ ( PROJNO, PROJNAME, IN_CHARGE ) AS SELECT PROJNO, PROJNAME, RESPEMP FROM PROJECT WHERE SUBSTR( PROJNO, 1, 2 ) = 'MA';"
      - "CREATE VIEW PRJ_LEADER ( PROJNO, PROJNAME, DEPTNO, RESPEMP, LASTNAME, TOTAL_PAY ) AS SELECT PROJNO, PROJNAME, DEPTNO, RESPEMP, LASTNAME, SALARY+BONUS+COMM FROM PROJECT, EMPLOYEE WHERE RESPEMP = EMPNO AND PRSTAFF > 1;"
