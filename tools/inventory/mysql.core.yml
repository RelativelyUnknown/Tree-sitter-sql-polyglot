  - id: lateral_derived_tables
    name: Lateral Derived Tables
    doc: https://dev.mysql.com/doc/refman/8.4/en/lateral-derived-tables.html
    tier: high
    probes:
      - { id: comma_lateral, sql: "SELECT * FROM t1, LATERAL (SELECT MAX(a) AS m FROM t2 WHERE t2.id = t1.id) AS dt;" }
      - { id: join_lateral_on, sql: "SELECT * FROM t1 JOIN LATERAL (SELECT a FROM t2 WHERE t2.id = t1.id) AS dt ON TRUE;" }
      - { id: cross_join_lateral, sql: "SELECT * FROM t1 CROSS JOIN LATERAL (SELECT a FROM t2 WHERE t2.id = t1.id) AS dt;" }
      - { id: left_join_lateral, sql: "SELECT * FROM t1 LEFT JOIN LATERAL (SELECT a FROM t2 WHERE t2.id = t1.id ORDER BY a DESC LIMIT 1) AS dt ON TRUE;" }
      - { id: lateral_column_list, sql: "SELECT * FROM t1, LATERAL (SELECT t1.a + 1, t1.a + 2) AS dt (x, y);" }
    examples:
      - |-
        SELECT
          salesperson.name,
          max_sale.amount,
          max_sale_customer.customer_name
        FROM
          salesperson,
          -- calculate maximum size, cache it in transient derived table max_sale
          LATERAL
          (SELECT MAX(amount) AS amount
            FROM all_sales
            WHERE all_sales.salesperson_id = salesperson.id)
          AS max_sale,
          -- find customer, reusing cached maximum size
          LATERAL
          (SELECT customer_name
            FROM all_sales
            WHERE all_sales.salesperson_id = salesperson.id
            AND all_sales.amount =
                -- the cached maximum size
                max_sale.amount)
          AS max_sale_customer;
      - |-
        SELECT
          salesperson.name,
          max_sale.amount,
          max_sale.customer_name
        FROM
          salesperson,
          -- find maximum size and customer at same time
          LATERAL
          (SELECT amount, customer_name
            FROM all_sales
            WHERE all_sales.salesperson_id = salesperson.id
            ORDER BY amount DESC LIMIT 1)
          AS max_sale;

