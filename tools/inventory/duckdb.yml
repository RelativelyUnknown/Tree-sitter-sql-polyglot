      - { id: map_value, sql: "SET VARIABLE my_map = MAP {'k1': 10, 'k2': 20};" }
      - { id: subquery_value, sql: "SET VARIABLE files = (SELECT list(file) FROM t);" }
      - { id: getvariable, sql: "SELECT 20 + getvariable('my_var') AS total;" }
    examples:
      - "SET VARIABLE my_date = DATE '2018-07-13';"
      - "SET VARIABLE my_string = 'Hello world';"
      - "SET VARIABLE my_map = MAP {'k1': 10, 'k2': 20};"
      - "SELECT getvariable('undefined_var') AS result;"

  - id: reset_variable
    name: RESET VARIABLE
    doc: https://duckdb.org/docs/stable/sql/statements/set_variable
    tier: medium
    probes:
      - { id: basic, sql: "RESET VARIABLE my_var;" }
    examples:
      - "RESET VARIABLE my_var;"

  - id: call
    name: CALL
    doc: https://duckdb.org/docs/stable/sql/statements/call
    tier: medium
    probes:
      - { id: no_args, sql: "CALL duckdb_functions();" }
      - { id: args, sql: "CALL pragma_table_info('pg_am');" }
      - { id: named_args, sql: "CALL dbgen(sf = 1);" }
    examples:
      - "CALL duckdb_functions();"
      - "CALL pragma_table_info('pg_am');"

  - id: checkpoint
    name: CHECKPOINT
    doc: https://duckdb.org/docs/stable/sql/statements/checkpoint
    tier: low
    probes:
      - { id: basic, sql: "CHECKPOINT;" }
      - { id: database, sql: "CHECKPOINT file_db;" }
      - { id: force, sql: "FORCE CHECKPOINT;" }

  - id: analyze
    name: ANALYZE
    doc: https://duckdb.org/docs/stable/sql/statements/analyze
    tier: low
    probes:
      - { id: basic, sql: "ANALYZE;" }

  - id: vacuum
    name: VACUUM
    doc: https://duckdb.org/docs/stable/sql/statements/vacuum
    tier: low
    probes:
      - { id: basic, sql: "VACUUM;" }
      - { id: analyze, sql: "VACUUM ANALYZE;" }
      - { id: table_columns, sql: "VACUUM ANALYZE t(c);" }

  - id: comment_on
    name: COMMENT ON
    doc: https://duckdb.org/docs/stable/sql/statements/comment_on
    tier: medium
    probes:
      - { id: table, sql: "COMMENT ON TABLE t IS 'very nice table';" }
      - { id: column, sql: "COMMENT ON COLUMN t.c IS 'very nice column';" }
      - { id: view, sql: "COMMENT ON VIEW v IS 'very nice view';" }
      - { id: index, sql: "COMMENT ON INDEX idx IS 'very nice index';" }
      - { id: sequence, sql: "COMMENT ON SEQUENCE seq IS 'very nice sequence';" }
      - { id: type, sql: "COMMENT ON TYPE typ IS 'very nice type';" }
      - { id: macro, sql: "COMMENT ON MACRO m IS 'very nice macro';" }
      - { id: macro_table, sql: "COMMENT ON MACRO TABLE m IS 'very nice table macro';" }
      - { id: is_null, sql: "COMMENT ON TABLE t IS NULL;" }
    examples:
      - "COMMENT ON TABLE test_table IS 'very nice table';"
      - "COMMENT ON COLUMN test_table.test_table_column IS 'very nice column';"
      - "COMMENT ON MACRO TABLE test_table_macro IS 'very nice table macro';"
      - "COMMENT ON TABLE test_table IS NULL;"

  - id: explain
    name: EXPLAIN / EXPLAIN ANALYZE
    doc: https://duckdb.org/docs/stable/sql/statements/profiling
    tier: medium
    probes:
      - { id: explain, sql: "EXPLAIN SELECT * FROM t;" }
      - { id: explain_analyze, sql: "EXPLAIN ANALYZE SELECT * FROM t;" }
      - id: explain_format
        sql: "EXPLAIN (FORMAT html) SELECT 42 AS x;"
        note: "FORMAT option documented in the EXPLAIN guide (guides/meta/explain)"
    examples:
      - "EXPLAIN\n    SELECT name\n    FROM students\n    JOIN exams USING (sid)\n    WHERE name LIKE 'Ma%';"


  - id: pragma
    name: PRAGMA
    doc: https://duckdb.org/docs/stable/configuration/pragmas
    tier: medium
    probes:
      - { id: bare, sql: "PRAGMA database_list;" }
      - { id: call_form, sql: "PRAGMA table_info('table_name');" }
      - { id: assignment, sql: "PRAGMA force_compression = 'bitpacking';" }
      - { id: enable_flag, sql: "PRAGMA enable_progress_bar;" }
      - { id: pragma_table_function, sql: "CALL pragma_table_info('table_name');" }
    examples:
      - "PRAGMA database_list;"
      - "PRAGMA table_info('table_name');"
      - "PRAGMA storage_info('table_name');"
      - "PRAGMA version;"
      - "PRAGMA disabled_compression_methods = 'fsst,rle';"

expressions:
  - id: case
    name: CASE expression
    doc: https://duckdb.org/docs/stable/sql/expressions/case
    tier: high
    probes:
      - { id: searched, sql: "SELECT CASE WHEN i > 2 THEN 1 ELSE 0 END FROM t;" }
      - { id: searched_multiple, sql: "SELECT CASE WHEN i = 1 THEN 10 WHEN i = 2 THEN 20 ELSE 0 END FROM t;" }
      - { id: no_else, sql: "SELECT CASE WHEN i = 1 THEN 10 END FROM t;" }
      - { id: simple, sql: "SELECT CASE i WHEN 1 THEN 10 WHEN 2 THEN 20 WHEN 3 THEN 30 END FROM t;" }
      - { id: if_function, sql: "SELECT IF(i > 2, 1, 0) FROM t;" }
      - { id: switch, sql: "SELECT SWITCH(i, MAP {1: 'one', 2: 'two'}, 'other') FROM t;" }
    examples:
      - "SELECT i, CASE WHEN i > 2 THEN 1 ELSE 0 END AS test\nFROM integers;"
      - "SELECT i, IF(i > 2, 1, 0) AS test\nFROM integers;"
      - "SELECT i, CASE i WHEN 1 THEN 10 WHEN 2 THEN 20 WHEN 3 THEN 30 END AS test\nFROM integers;"
      - "SELECT i, SWITCH(i, MAP {1: 'one', 2: 'two', 3: 'three'}) AS test\nFROM integers;"

  - id: cast
    name: Casting
    doc: https://duckdb.org/docs/stable/sql/expressions/cast
    tier: high
    probes:
      - { id: cast, sql: "SELECT CAST(i AS VARCHAR) FROM t;" }
      - { id: double_colon, sql: "SELECT i::DOUBLE FROM t;" }
      - { id: try_cast, sql: "SELECT TRY_CAST('hello' AS INTEGER) AS i;" }
      - { id: cast_parameterized, sql: "SELECT CAST(x AS DECIMAL(18, 3)), x::VARCHAR(10) FROM t;" }
      - { id: cast_nested_type, sql: "SELECT CAST(x AS INTEGER[]), y::STRUCT(a INTEGER, b VARCHAR), z::MAP(VARCHAR, INTEGER) FROM t;" }
      - { id: chained_casts, sql: "SELECT GROUPING_ID(y)::BIT::VARCHAR FROM t;" }
      - { id: null_cast, sql: "SELECT cast_to_type('42', NULL::INTEGER) AS result;" }
    examples:
      - "SELECT CAST(i AS VARCHAR) AS i\nFROM generate_series(1, 3) tbl(i);"
      - "SELECT i::DOUBLE AS i\nFROM generate_series(1, 3) tbl(i);"
      - "SELECT TRY_CAST('hello' AS INTEGER) AS i;"
      - "SELECT cast_to_type('42', NULL::INTEGER) AS result;"

  - id: try
    name: TRY expression
    doc: https://duckdb.org/docs/stable/sql/expressions/try
    tier: medium
    probes:
      - { id: try_cast_expression, sql: "SELECT TRY('abc'::INTEGER);" }
      - { id: try_function, sql: "SELECT TRY(ln(0));" }
    examples:
      - "SELECT TRY('abc'::INTEGER);"
      - "SELECT TRY(ln(0));"

  - id: collations
    name: Collations
    doc: https://duckdb.org/docs/stable/sql/expressions/collations
    tier: medium
    probes:
      - { id: collate, sql: "SELECT 'hello' COLLATE NOCASE = 'hElLO';" }
      - { id: chained_collation, sql: "SELECT 'hello' COLLATE NOCASE.NOACCENT = 'hElLO';" }
      - { id: column_collation, sql: "CREATE TABLE t (name VARCHAR COLLATE NOACCENT);" }
      - { id: where_collate, sql: "SELECT name FROM t WHERE name = 'hannes' COLLATE NOCASE;" }
      - { id: set_default_collation_ident, sql: "SET default_collation = NOCASE;" }
    examples:
      - "SELECT 'hello' COLLATE NOCASE = 'hElLO';"
      - "SELECT 'hello' COLLATE NOACCENT = 'hëllo';"
      - "SELECT 'hello' COLLATE NOCASE.NOACCENT = 'hElLÖ';"
      - "SELECT names.name AS name, other_names.name AS other_name\nFROM names, other_names\nWHERE names.name COLLATE NOACCENT.NOCASE = other_names.name COLLATE NOACCENT.NOCASE;"

  - id: comparison_operators
    name: Comparison operators
    doc: https://duckdb.org/docs/stable/sql/expressions/comparison_operators
    tier: high
    probes:
      - { id: basic, sql: "SELECT 2 < 3, 2 > 3, 2 <= 3, 4 >= 2;" }
      - { id: equals, sql: "SELECT a = b, a == b FROM t;" }
      - { id: not_equals, sql: "SELECT a <> b, a != b FROM t;" }
      - { id: is_distinct_from, sql: "SELECT 2 IS DISTINCT FROM NULL, NULL IS NOT DISTINCT FROM NULL;" }
      - { id: between, sql: "SELECT a BETWEEN 1 AND 10, a NOT BETWEEN 1 AND 10 FROM t;" }
      - { id: is_null, sql: "SELECT a IS NULL, a IS NOT NULL FROM t;" }
      - { id: isnull_notnull, sql: "SELECT a ISNULL, a NOTNULL FROM t;" }
    examples:
      - "SELECT 1 = true;"
      - "SELECT 1 = '1.1';"
      - "SELECT\n    'B' NOT BETWEEN ('A' COLLATE NOCASE) AND 'a' AS between_result,\n    'B' < ('A' COLLATE NOCASE) OR 'B' > 'a' AS separate_result;"

  - id: in
    name: IN operator
    doc: https://duckdb.org/docs/stable/sql/expressions/in
    tier: high
    probes:
      - { id: tuple, sql: "SELECT 'Math' IN ('CS', 'Math');" }
      - { id: not_in, sql: "SELECT 'Math' NOT IN ('CS', 'Math');" }
      - { id: list, sql: "SELECT 'Math' IN ['CS', 'Math', NULL];" }
      - { id: map, sql: "SELECT 'key1' IN MAP {'key1': 50, 'key2': 75};" }
      - { id: subquery, sql: "SELECT 42 IN (SELECT unnest([32, 42, 52]) AS x);" }
      - { id: string, sql: "SELECT 'Hello' IN 'Hello World';" }
    examples:
      - "SELECT 'Math' IN ('CS', 'Math', NULL);"
      - "SELECT 'Math' IN ['CS', 'Math', NULL];"
      - "SELECT 'key1' IN MAP {'key1': 50, 'key2': 75};"
      - "SELECT 42 IN (SELECT unnest([32, 42, 52]) AS x);"
      - "SELECT 'Hello' IN 'Hello World';"

  - id: logical_operators
    name: Logical operators
    doc: https://duckdb.org/docs/stable/sql/expressions/logical_operators
    tier: high
    probes:
      - { id: and_or_not, sql: "SELECT a AND b, a OR b, NOT a FROM t;" }

