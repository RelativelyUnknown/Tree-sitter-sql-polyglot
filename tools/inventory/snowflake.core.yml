  - id: resample
    name: "RESAMPLE"
    doc: https://docs.snowflake.com/en/sql-reference/constructs/resample
    tier: medium
    probes:
      - { id: resample, sql: "SELECT * FROM t RESAMPLE(USING ts INCREMENT BY INTERVAL '1 day');" }
      - { id: resample_partition, sql: "SELECT * FROM t RESAMPLE(USING ts INCREMENT BY INTERVAL '5 minutes' PARTITION BY city, county);" }
      - { id: resample_metadata_columns, sql: "SELECT * FROM t RESAMPLE(USING ts INCREMENT BY INTERVAL '5 minutes' METADATA_COLUMNS IS_GENERATED() AS generated_row, BUCKET_START());" }
      - { id: resample_numeric, sql: "SELECT * FROM t AS x RESAMPLE(USING unixtime INCREMENT BY 1) ORDER BY unixtime;" }
    examples:
      - |-
        SELECT * FROM sensor_data_unixtime
          RESAMPLE(USING unixtime INCREMENT BY 1) ORDER BY unixtime;
      - |-
        CREATE OR REPLACE TABLE march_temps_every_five_mins AS
          SELECT * FROM march_temps
            RESAMPLE(
              USING observed
              INCREMENT BY INTERVAL '5 minutes'
              PARTITION BY city, county
              METADATA_COLUMNS IS_GENERATED() AS generated_row, BUCKET_START()
              )
          ORDER BY observed;
      - |-
        SELECT bucket_start, county, COUNT(*)
          FROM march_temps
            RESAMPLE(
              USING observed
              INCREMENT BY INTERVAL '1 day'
              METADATA_COLUMNS IS_GENERATED(), BUCKET_START()
              )
          WHERE IS_GENERATED = 'False'
          GROUP BY bucket_start, county;

