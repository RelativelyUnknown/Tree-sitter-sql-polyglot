dialect: hana
engine: SAP HANA Platform
version: "2.0 SPS 08 (2.0.08)"
source: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/3bc1a0d4611d40c4a6e3fc7c8e80395d.html?version=2.0.08

statements:
  - id: drop_schema
    name: DROP SCHEMA
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/20d7891d751910149164f0d4ca73639d.html?version=2.0.08
    tier: medium
    probes:
      - { id: basic, sql: "DROP SCHEMA s;" }
      - { id: cascade, sql: "DROP SCHEMA s CASCADE;" }
      - { id: restrict, sql: "DROP SCHEMA s RESTRICT;" }
    examples:
      - "DROP SCHEMA my_schema CASCADE;"

  - id: drop_schema_synonym
    name: DROP SCHEMA SYNONYM
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/f8ac4d9c656049c29d80a9ba3a495001.html?version=2.0.08
    tier: medium
    probes:
      - { id: basic, sql: "DROP SCHEMA SYNONYM s;" }
    examples:
      - "DROP SCHEMA SYNONYM TEST_SCHEMA_SYN;"

  - id: drop_sequence
    name: DROP SEQUENCE
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/20d7a85b751910149482f673a4789209.html?version=2.0.08
    tier: medium
    probes:
      - { id: basic, sql: "DROP SEQUENCE seq;" }
      - { id: cascade, sql: "DROP SEQUENCE seq CASCADE;" }
      - { id: restrict, sql: "DROP SEQUENCE seq RESTRICT;" }
    examples:
      - "DROP SEQUENCE seq;"

  - id: drop_statistics
    name: DROP STATISTICS
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/20d7c595751910148307bf3bf4c745e6.html?version=2.0.08
    tier: medium
    probes:
      - { id: by_name, sql: "DROP STATISTICS s.st;" }
      - { id: by_name_list, sql: "DROP STATISTICS st1, st2;" }
      - { id: on_table, sql: "DROP STATISTICS ON t;" }
      - { id: on_columns, sql: "DROP STATISTICS ON t (a, b);" }
      - { id: on_columns_exact, sql: "DROP STATISTICS ON t (a, b) EXACT;" }
      - { id: on_columns_cascade, sql: "DROP STATISTICS ON t (a) CASCADE;" }

  - id: drop_structured_privilege
    name: DROP STRUCTURED PRIVILEGE
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/4742f573d0c24e9084a699d464bf20c7.html?version=2.0.08
    tier: medium
    probes:
      - { id: basic, sql: "DROP STRUCTURED PRIVILEGE p;" }

  - id: drop_synonym
    name: DROP SYNONYM
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/20d7e172751910148bccb49de92d9859.html?version=2.0.08
    tier: medium
    probes:
      - { id: basic, sql: "DROP SYNONYM syn;" }
      - { id: public, sql: "DROP PUBLIC SYNONYM syn;" }
      - { id: cascade, sql: "DROP SYNONYM syn CASCADE;" }
      - { id: restrict, sql: "DROP PUBLIC SYNONYM syn RESTRICT;" }
    examples:
      - "DROP SYNONYM a_synonym;"
      - "DROP PUBLIC SYNONYM pa_synonym;"

  - id: drop_trigger
    name: DROP TRIGGER
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/20d81ec9751910148fe6e1e072ac439e.html?version=2.0.08
    tier: medium
    probes:
      - { id: basic, sql: "DROP TRIGGER trg;" }
      - { id: cascade, sql: "DROP TRIGGER trg CASCADE;" }
      - { id: restrict, sql: "DROP TRIGGER trg RESTRICT;" }
      - { id: online, sql: "DROP TRIGGER trg ONLINE;" }
      - { id: restrict_online, sql: "DROP TRIGGER trg RESTRICT ONLINE;" }
    examples:
      - "DROP TRIGGER test;"
      - "DROP TRIGGER test ONLINE;"

  - id: drop_type
    name: DROP TYPE
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/20d83beb751910148651cebdf3564ad3.html?version=2.0.08
    tier: medium
    probes:
      - { id: basic, sql: "DROP TYPE ty;" }
      - { id: cascade, sql: "DROP TYPE ty CASCADE;" }
      - { id: restrict, sql: "DROP TYPE ty RESTRICT;" }
    examples:
      - 'DROP TYPE "my_type";'

  - id: drop_user
    name: DROP USER
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/20d8d33275191014adce9c099eeed35c.html?version=2.0.08
    tier: medium
    probes:
      - { id: basic, sql: "DROP USER u;" }
      - { id: cascade, sql: "DROP USER u CASCADE;" }
      - { id: restrict, sql: "DROP USER u RESTRICT;" }
    examples:
      - "DROP USER new_user CASCADE;"

  - id: drop_usergroup
    name: DROP USERGROUP
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/6dc0adae9f4c4ebaa46cbe6b5f636ee7.html?version=2.0.08
    tier: medium
    probes:
      - { id: basic, sql: "DROP USERGROUP g;" }
    examples:
      - "DROP USERGROUP MyUserGroup;"
