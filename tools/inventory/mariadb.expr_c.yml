      - { id: column_get_name, sql: "SELECT COLUMN_GET(dyncol_blob, 'a' AS CHAR) FROM t;" }
      - { id: column_get_number, sql: "SELECT COLUMN_GET(dyncol_blob, 1 AS INTEGER) FROM t;" }
      - { id: column_get_decimal, sql: "SELECT COLUMN_GET(dyncol_blob, 'a' AS DECIMAL(10,2)) FROM t;" }
