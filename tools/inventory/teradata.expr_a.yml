      - { id: function_operand, sql: "SELECT TYPE(NULL);" }
    examples:
      - "SELECT CAST (NULL AS DATE);"
      - "SELECT CASE WHEN orders = 10 THEN NULL END FROM sales_tbl;"
      - "SELECT TYPE(NULL);"

