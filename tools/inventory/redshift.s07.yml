dialect: redshift
engine: Amazon Redshift
version: "current"
source: https://docs.aws.amazon.com/redshift/latest/dg/c_SQL_commands.html

statements:
  - id: create_table
    name: CREATE TABLE
    doc: https://docs.aws.amazon.com/redshift/latest/dg/r_CREATE_TABLE_NEW.html
    tier: high
    probes:
      - { id: basic, sql: "CREATE TABLE t (c integer);" }
      - { id: temporary, sql: "CREATE TEMPORARY TABLE t (c integer);" }
      - { id: temp, sql: "CREATE TEMP TABLE t (c integer);" }
      - { id: local_temporary, sql: "CREATE LOCAL TEMPORARY TABLE t (c integer);" }
      - { id: local_temp, sql: "CREATE LOCAL TEMP TABLE t (c integer);" }
      - { id: hash_table, sql: "CREATE TABLE #t (id int);" }
      - { id: if_not_exists, sql: "CREATE TABLE IF NOT EXISTS t (c integer);" }
      - { id: qualified_name, sql: "CREATE TABLE dev.public.t (c integer);" }
      - { id: column_default, sql: "CREATE TABLE t (c integer DEFAULT 0);" }
      - { id: column_identity, sql: "CREATE TABLE t (c integer IDENTITY(0, 1));" }
      - { id: column_generated_identity, sql: "CREATE TABLE t (c bigint GENERATED BY DEFAULT AS IDENTITY(1, 1));" }
      - { id: column_encode, sql: "CREATE TABLE t (c integer ENCODE az64);" }
      - { id: column_distkey, sql: "CREATE TABLE t (c integer DISTKEY);" }
      - { id: column_sortkey, sql: "CREATE TABLE t (c integer SORTKEY);" }
      - { id: column_collate_case_sensitive, sql: "CREATE TABLE t (c varchar(20) COLLATE CASE_SENSITIVE);" }
      - { id: column_collate_cs, sql: "CREATE TABLE t (c varchar(20) COLLATE CS);" }
      - { id: column_collate_case_insensitive, sql: "CREATE TABLE t (c varchar(20) COLLATE CASE_INSENSITIVE);" }
      - { id: column_collate_ci, sql: "CREATE TABLE t (c varchar(20) COLLATE CI);" }
      - { id: column_not_null, sql: "CREATE TABLE t (c integer NOT NULL);" }
      - { id: column_null, sql: "CREATE TABLE t (c integer NULL);" }
      - { id: column_unique, sql: "CREATE TABLE t (c integer UNIQUE);" }
      - { id: column_primary_key, sql: "CREATE TABLE t (c integer PRIMARY KEY);" }
      - { id: column_references, sql: "CREATE TABLE t (c integer REFERENCES r);" }
      - { id: column_references_col, sql: "CREATE TABLE t (c integer REFERENCES r (rc));" }
      - { id: column_attributes_combined, sql: "CREATE TABLE t (c integer DEFAULT 0 ENCODE az64 DISTKEY SORTKEY NOT NULL PRIMARY KEY);" }
      - { id: table_unique, sql: "CREATE TABLE t (a integer, b integer, UNIQUE (a, b));" }
      - { id: table_primary_key, sql: "CREATE TABLE t (a integer, b integer, PRIMARY KEY (a, b));" }
      - { id: table_foreign_key, sql: "CREATE TABLE t (a integer, FOREIGN KEY (a) REFERENCES r (ra));" }
      - { id: table_foreign_key_no_refcol, sql: "CREATE TABLE t (a integer, FOREIGN KEY (a) REFERENCES r);" }
      - { id: like, sql: "CREATE TABLE t (LIKE p);" }
      - { id: like_including_defaults, sql: "CREATE TABLE t (LIKE p INCLUDING DEFAULTS);" }
      - { id: like_excluding_defaults, sql: "CREATE TABLE t (LIKE p EXCLUDING DEFAULTS);" }
      - { id: like_temp, sql: "CREATE TEMP TABLE t (LIKE p);" }
      - { id: backup_yes, sql: "CREATE TABLE t (c integer) BACKUP YES;" }
      - { id: backup_no, sql: "CREATE TABLE t (c integer) BACKUP NO;" }
      - { id: diststyle_auto, sql: "CREATE TABLE t (c integer) DISTSTYLE AUTO;" }
      - { id: diststyle_even, sql: "CREATE TABLE t (c integer) DISTSTYLE EVEN;" }
      - { id: diststyle_key, sql: "CREATE TABLE t (c integer) DISTSTYLE KEY DISTKEY (c);" }
      - { id: diststyle_all, sql: "CREATE TABLE t (c integer) DISTSTYLE ALL;" }
      - { id: distkey_table, sql: "CREATE TABLE t (c integer) DISTKEY (c);" }
      - { id: sortkey_table, sql: "CREATE TABLE t (a integer, b integer) SORTKEY (a, b);" }
      - { id: compound_sortkey, sql: "CREATE TABLE t (a integer, b integer) COMPOUND SORTKEY (a, b);" }
      - { id: interleaved_sortkey, sql: "CREATE TABLE t (a integer, b integer) INTERLEAVED SORTKEY (a, b);" }
      - { id: sortkey_auto, sql: "CREATE TABLE t (c integer) SORTKEY AUTO;" }
      - { id: encode_auto, sql: "CREATE TABLE t (c integer) ENCODE AUTO;" }
      - { id: table_attributes_combined, sql: "CREATE TABLE t (a integer, b integer) BACKUP NO DISTSTYLE KEY DISTKEY (a) COMPOUND SORTKEY (a, b) ENCODE AUTO;" }
    examples:
      - "create table sales(\n  salesid integer not null,\n  listid integer not null,\n  sellerid integer not null,\n  buyerid integer not null,\n  eventid integer not null encode mostly16,\n  dateid smallint not null,\n  qtysold smallint not null encode mostly8,\n  pricepaid decimal(8,2) encode delta32k,\n  commission decimal(8,2) encode delta32k,\n  saletime timestamp,\n  primary key(salesid),\n  foreign key(listid) references listing(listid),\n  foreign key(sellerid) references users(userid),\n  foreign key(buyerid) references users(userid),\n  foreign key(dateid) references date(dateid))\ndistkey(listid)\ncompound sortkey(listid,sellerid);"
      - "create table T1 (\n  col1 Varchar(20) collate case_insensitive\n );"
      - "create table customer_interleaved (\n  c_custkey     integer        not null,\n  c_name        varchar(25)    not null,\n  c_address     varchar(25)    not null,\n  c_city        varchar(10)    not null,\n  c_nation      varchar(15)    not null,\n  c_region      varchar(12)    not null,\n  c_phone       varchar(15)    not null,\n  c_mktsegment  varchar(10)    not null)\ndiststyle all\ninterleaved sortkey (c_custkey, c_city, c_mktsegment);"

  - id: create_table_as
    name: CREATE TABLE AS
    doc: https://docs.aws.amazon.com/redshift/latest/dg/r_CREATE_TABLE_AS.html
    tier: high
    probes:
      - { id: basic, sql: "CREATE TABLE t AS SELECT * FROM s;" }
      - { id: temporary, sql: "CREATE TEMPORARY TABLE t AS SELECT * FROM s;" }
      - { id: temp, sql: "CREATE TEMP TABLE t AS SELECT * FROM s;" }
      - { id: local_temporary, sql: "CREATE LOCAL TEMPORARY TABLE t AS SELECT * FROM s;" }
      - { id: local_temp, sql: "CREATE LOCAL TEMP TABLE t AS SELECT * FROM s;" }
      - { id: hash_table, sql: "CREATE TABLE #t (id) AS SELECT * FROM s;" }
      - { id: qualified_name, sql: "CREATE TABLE dev.public.t (c1) AS SELECT * FROM s;" }
      - { id: column_names, sql: "CREATE TABLE t (a, b) AS SELECT x, y FROM s;" }
      - { id: backup_yes, sql: "CREATE TABLE t BACKUP YES AS SELECT * FROM s;" }
      - { id: backup_no, sql: "CREATE TABLE t BACKUP NO AS SELECT * FROM s;" }
      - { id: diststyle_auto, sql: "CREATE TABLE t DISTSTYLE AUTO AS SELECT * FROM s;" }
      - { id: diststyle_even, sql: "CREATE TABLE t DISTSTYLE EVEN AS SELECT * FROM s;" }
      - { id: diststyle_all, sql: "CREATE TABLE t DISTSTYLE ALL AS SELECT * FROM s;" }
      - { id: diststyle_key, sql: "CREATE TABLE t DISTSTYLE KEY DISTKEY (a) AS SELECT a, b FROM s;" }
      - { id: distkey_name, sql: "CREATE TABLE t DISTKEY (a) AS SELECT a, b FROM s;" }
      - { id: distkey_ordinal, sql: "CREATE TABLE t DISTKEY (1) AS SELECT a, b FROM s;" }
      - { id: sortkey, sql: "CREATE TABLE t SORTKEY (a, b) AS SELECT a, b FROM s;" }
      - { id: sortkey_ordinal, sql: "CREATE TABLE t SORTKEY (1, 2) AS SELECT a, b FROM s;" }
      - { id: compound_sortkey, sql: "CREATE TABLE t COMPOUND SORTKEY (a, b) AS SELECT a, b FROM s;" }
      - { id: interleaved_sortkey, sql: "CREATE TABLE t INTERLEAVED SORTKEY (a, b) AS SELECT a, b FROM s;" }
      - { id: attributes_combined, sql: "CREATE TABLE t (a, b) BACKUP NO DISTSTYLE KEY DISTKEY (a) COMPOUND SORTKEY (a, b) AS SELECT x, y FROM s;" }
      - { id: with_query, sql: "CREATE TABLE t AS WITH c AS (SELECT 1 AS x) SELECT x FROM c;" }
      - { id: set_operation_query, sql: "CREATE TABLE t AS SELECT a FROM s UNION ALL SELECT a FROM u;" }
    examples:
      - "create table event_backup as select * from event;"
      - "create table eventdistsort\ndistkey (1)\nsortkey (1,3)\nas\nselect eventid, venueid, dateid, eventname\nfrom event;"
      - "create table eventdistsort1\ndistkey (eventid)\nsortkey (eventid, dateid)\nas\nselect eventid, venueid, dateid, eventname\nfrom event;"
