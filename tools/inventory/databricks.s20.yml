dialect: databricks
engine: Databricks SQL / Databricks Runtime
version: "current (docs read 2026-10-04)"
source: https://docs.databricks.com/aws/en/sql/language-manual/

statements:
  - id: commit
    name: COMMIT
    doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-txn-commit
    tier: high
    probes:
      - id: basic
        sql: "COMMIT;"
      - id: transaction
        sql: "COMMIT TRANSACTION;"
      - id: work
        sql: "COMMIT WORK;"
    examples:
      - "COMMIT TRANSACTION;"
      - "COMMIT;"

  - id: rollback
    name: ROLLBACK
    doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-txn-rollback
    tier: high
    probes:
      - id: basic
        sql: "ROLLBACK;"
      - id: transaction
        sql: "ROLLBACK TRANSACTION;"
      - id: work
        sql: "ROLLBACK WORK;"
    examples:
      - "ROLLBACK TRANSACTION;"
      - "ROLLBACK;"
