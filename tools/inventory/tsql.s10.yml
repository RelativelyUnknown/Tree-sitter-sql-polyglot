dialect: tsql
engine: SQL Server 2022 / Azure SQL Database
version: "2022"
source: https://learn.microsoft.com/en-us/sql/t-sql/statements/statements

statements:
  - id: set_nocount
    name: SET NOCOUNT
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/set-nocount-transact-sql
    tier: medium
    probes:
      - { id: "on", sql: "SET NOCOUNT ON;" }
      - { id: "off", sql: "SET NOCOUNT OFF;" }
    examples:
      - "SET NOCOUNT OFF;"
      - "SET NOCOUNT ON;"

  - id: set_noexec
    name: SET NOEXEC
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/set-noexec-transact-sql
    tier: medium
    probes:
      - { id: "on", sql: "SET NOEXEC ON;" }
      - { id: "off", sql: "SET NOEXEC OFF;" }
    examples:
      - "SET NOEXEC ON;"
      - "SET NOEXEC OFF;"

  - id: set_numeric_roundabort
    name: SET NUMERIC_ROUNDABORT
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/set-numeric-roundabort-transact-sql
    tier: medium
    probes:
      - { id: "on", sql: "SET NUMERIC_ROUNDABORT ON;" }
      - { id: "off", sql: "SET NUMERIC_ROUNDABORT OFF;" }
    examples:
      - "SET NUMERIC_ROUNDABORT ON;"

  - id: set_parseonly
    name: SET PARSEONLY
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/set-parseonly-transact-sql
    tier: medium
    probes:
      - { id: "on", sql: "SET PARSEONLY ON;" }
      - { id: "off", sql: "SET PARSEONLY OFF;" }

  - id: set_quoted_identifier
    name: SET QUOTED_IDENTIFIER
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/set-quoted-identifier-transact-sql
    tier: medium
    probes:
      - { id: "on", sql: "SET QUOTED_IDENTIFIER ON;" }
      - { id: "off", sql: "SET QUOTED_IDENTIFIER OFF;" }
    examples:
      - "SET QUOTED_IDENTIFIER OFF;"
      - "SET QUOTED_IDENTIFIER ON;"

  - id: set_rowcount
    name: SET ROWCOUNT
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/set-rowcount-transact-sql
    tier: medium
    probes:
      - { id: number, sql: "SET ROWCOUNT 10;" }
      - { id: variable, sql: "SET ROWCOUNT @n;" }
      - { id: reset, sql: "SET ROWCOUNT 0;", note: "SET ROWCOUNT 0 turns the option off (documented in Remarks)" }
    examples:
      - "SET ROWCOUNT 4;"

  - id: set_showplan_all
    name: SET SHOWPLAN_ALL
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/set-showplan-all-transact-sql
    tier: medium
    probes:
      - { id: "on", sql: "SET SHOWPLAN_ALL ON;" }
      - { id: "off", sql: "SET SHOWPLAN_ALL OFF;" }

  - id: set_showplan_text
    name: SET SHOWPLAN_TEXT
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/set-showplan-text-transact-sql
    tier: medium
    probes:
      - { id: "on", sql: "SET SHOWPLAN_TEXT ON;" }
      - { id: "off", sql: "SET SHOWPLAN_TEXT OFF;" }
    examples:
      - "SET SHOWPLAN_TEXT ON;"
      - "SET SHOWPLAN_TEXT OFF;"

  - id: set_showplan_xml
    name: SET SHOWPLAN_XML
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/set-showplan-xml-transact-sql
    tier: medium
    probes:
      - { id: "on", sql: "SET SHOWPLAN_XML ON;" }
      - { id: "off", sql: "SET SHOWPLAN_XML OFF;" }
    examples:
      - "SET SHOWPLAN_XML ON;"

  - id: set_statistics_io
    name: SET STATISTICS IO
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/set-statistics-io-transact-sql
    tier: medium
    probes:
      - { id: "on", sql: "SET STATISTICS IO ON;" }
      - { id: "off", sql: "SET STATISTICS IO OFF;" }
    examples:
      - "SET STATISTICS IO ON;"
      - "SET STATISTICS IO OFF;"
