  - id: create_aggregate_function
    name: "CREATE AGGREGATE FUNCTION (SQL)"
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/data-definition-language#sql-create-udaf-function
    tier: medium
    probes:
      - { id: basic, sql: "CREATE AGGREGATE FUNCTION d.f(x FLOAT64) RETURNS FLOAT64 AS (SUM(x));" }
      - { id: not_aggregate_param, sql: "CREATE AGGREGATE FUNCTION f(x FLOAT64, y FLOAT64 NOT AGGREGATE) RETURNS FLOAT64 AS (SUM(x) / y);" }
      - { id: or_replace_temp, sql: "CREATE OR REPLACE TEMP AGGREGATE FUNCTION f(x INT64) AS (COUNT(x));" }
      - { id: if_not_exists_options, sql: "CREATE AGGREGATE FUNCTION IF NOT EXISTS f(x INT64) AS (SUM(x)) OPTIONS (description = 'd');" }
    examples:
      - |-
        CREATE AGGREGATE FUNCTION myProject.myDataset.ScaledSum(
         dividend FLOAT64,
         divisor FLOAT64 NOT AGGREGATE)
        RETURNS FLOAT64
        AS (
         SUM(dividend) / divisor
        );

  - id: create_aggregate_function_js
    name: "CREATE AGGREGATE FUNCTION (JavaScript)"
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/data-definition-language#javascript-create-udaf-function
    tier: low
    probes:
      - { id: basic, sql: "CREATE TEMP AGGREGATE FUNCTION f(x FLOAT64) RETURNS FLOAT64 LANGUAGE js AS r'''export function initialState() { return {sum: 0} }''';" }
      - { id: not_aggregate_options, sql: "CREATE OR REPLACE AGGREGATE FUNCTION IF NOT EXISTS d.f(x FLOAT64, w FLOAT64 NOT AGGREGATE) RETURNS FLOAT64 LANGUAGE js OPTIONS (library = ['gs://b/lib.js']) AS 'export function finalize(s) { return s; }';" }
    examples:
      - |-
        CREATE TEMP AGGREGATE FUNCTION SumPositive(x FLOAT64)
        RETURNS FLOAT64
        LANGUAGE js
        AS r'''
         export function initialState() {
         return {sum: 0}
         }
         export function aggregate(state, x) {
         if (x > 0) {
         state.sum += x;
         }
         }
         export function merge(state, partialState) {
         state.sum += partialState.sum;
         }
         export function finalize(state) {
         return state.sum;
         }
        ''';

