  - id: with_xmlnamespaces
    name: "WITH XMLNAMESPACES"
    doc: https://learn.microsoft.com/en-us/sql/t-sql/xml/with-xmlnamespaces
    tier: high
    probes:
      - id: prefix
        sql: "WITH XMLNAMESPACES ('uri' AS ns1) SELECT c AS 'ns1:c' FROM t FOR XML RAW ('ns1:r'), ELEMENTS;"
      - id: multiple_prefixes
        sql: "WITH XMLNAMESPACES ('uri1' AS ns1, 'uri2' AS ns2) SELECT c AS 'ns1:c', d AS 'ns2:d' FROM t FOR XML PATH;"
      - id: default
        sql: "WITH XMLNAMESPACES (DEFAULT 'uri') SELECT c FROM t FOR XML AUTO;"
      - id: default_and_prefix
        sql: "WITH XMLNAMESPACES (DEFAULT 'uri', 'uri2' AS ns2) SELECT c FROM t FOR XML PATH;"
      - id: with_xml_method
        sql: "WITH XMLNAMESPACES ('uri' AS ns) SELECT x.value('(/ns:root/@id)[1]', 'int') FROM t;"
      - id: before_cte
