  - id: c_json_functions
    name: JSON functions and table operators
    doc: https://docs.teradata.com/reader/4BqY_HUMYnuRAUaL6SMEAA/VfhqJ1R7OgxY1DDtpNsPfw
    tier: medium
    probes:
      - { id: json_check, sql: "SELECT JSON_CHECK('{\"a\":1}');" }
      - { id: json_get_value, sql: "SELECT JSONGETVALUE(j, '$.age' AS INTEGER) FROM t;", note: "JSONGETVALUE ( jsonObject, jsonPath AS data_type )" }
      - { id: json_get_value_varchar, sql: "SELECT JSONGETVALUE(j, '$.name' AS VARCHAR(50)) FROM t;" }
      - { id: array_to_json, sql: "SELECT ARRAY_TO_JSON(arr) FROM t;" }
      - { id: array_to_json_returns, sql: "SELECT ARRAY_TO_JSON(arr) RETURNS JSON(1000) FROM t;", note: "( ARRAY_TO_JSON (ARRAY_expr) RETURNS returns_clause ); the parenthesised form is the call with RETURNS" }
      - { id: nvp2json, sql: "SELECT NVP2JSON(s) FROM t;" }
      - { id: nvp2json_delims, sql: "SELECT NVP2JSON(s, '&', '=') FROM t;" }
      - { id: json_keys, sql: "SELECT * FROM JSON_KEYS(ON (SELECT j FROM t)) AS k;" }
      - { id: json_keys_using, sql: "SELECT * FROM JSON_KEYS(ON (SELECT j FROM t) USING DEPTH(1) QUOTES('Y')) AS k;" }
      - { id: json_table, sql: "SELECT * FROM JSON_TABLE(ON (SELECT id, j FROM t) USING ROWEXPR('$.schools[*]') COLEXPR('[{\"jsonpath\":\"$.name\",\"type\":\"CHAR(20)\"}]')) AS jt(id, name);" }
      - { id: json_agg, sql: "SELECT JSON_AGG(a, b) FROM t;" }
      - { id: json_agg_named, sql: "SELECT JSON_AGG(a AS id, b AS name) FROM t;" }
      - { id: json_agg_format_returns, sql: "SELECT (JSON_AGG(a (FORMAT '999') AS id, b) RETURNS JSON(5000)) FROM t;" }
      - { id: json_compose, sql: "SELECT JSON_COMPOSE(a, b) FROM t;" }
      - { id: json_compose_named, sql: "SELECT JSON_COMPOSE(a AS id, b AS name) FROM t;" }
      - { id: json_compose_nested, sql: "SELECT JSON_COMPOSE(a, JSON_AGG(b)) FROM t GROUP BY a;" }
      - { id: json_publish, sql: "SELECT * FROM JSON_PUBLISH(ON (SELECT * FROM t)) AS jsondata;" }
      - { id: json_publish_do_aggregate, sql: "SELECT * FROM JSON_PUBLISH(ON (SELECT * FROM t) USING DO_AGGREGATE('N')) AS jsondata;" }
      - { id: select_as_json, sql: "SELECT AS JSON a, b FROM t;" }
      - { id: select_as_json_top, sql: "SELECT AS JSON TOP 2 a, b FROM t ORDER BY a DESC;" }
    examples:
      - |-
        SELECT * FROM JSON_Table
        (ON (SELECT id, jsonCol FROM my_table WHERE id=1)
        USING rowexpr('$.schools[*]')
                       colexpr('[ {"jsonpath" : "$.name",
                                   "type" : "CHAR(20)"},
                                  {"jsonpath" : "$.type",
                                   "type" : "VARCHAR(20)"}]')
        ) AS JT(id, schoolName, "type");
      - |-
        SELECT * FROM JSON_PUBLISH
        (
           ON (SELECT * FROM employeeTable)
        ) AS jsonData;
      - |-
        SELECT * FROM JSON_PUBLISH
        (
           ON (SELECT * FROM employeeTable)
           USING DO_AGGREGATE('N')
        ) AS jsonData ORDER BY data..empID;
      - "SELECT AS JSON a, b, j FROM MyTable;"
      - "SELECT AS JSON TOP 2 a, b FROM MyTable ORDER BY a DESC;"

