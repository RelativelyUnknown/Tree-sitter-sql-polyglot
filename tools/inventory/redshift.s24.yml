dialect: redshift
engine: Amazon Redshift
version: "current"
source: https://docs.aws.amazon.com/redshift/latest/dg/c_SQL_commands.html

statements:
  - id: drop_library
    name: DROP LIBRARY
    doc: https://docs.aws.amazon.com/redshift/latest/dg/r_DROP_LIBRARY.html
    tier: low
    probes:
      - { id: basic, sql: "DROP LIBRARY lib;" }

  - id: drop_model
    name: DROP MODEL
    doc: https://docs.aws.amazon.com/redshift/latest/dg/r_DROP_MODEL.html
    tier: low
    probes:
      - { id: basic, sql: "DROP MODEL demo_ml.m;" }
      - { id: if_exists, sql: "DROP MODEL IF EXISTS m;" }

  - id: drop_template
    name: DROP TEMPLATE
    doc: https://docs.aws.amazon.com/redshift/latest/dg/r_DROP_TEMPLATE.html
    tier: low
    probes:
      - { id: basic, sql: "DROP TEMPLATE tmpl;" }
      - { id: qualified, sql: "DROP TEMPLATE db.s.tmpl;" }

  - id: set_session_characteristics
    name: SET SESSION CHARACTERISTICS
    doc: https://docs.aws.amazon.com/redshift/latest/dg/r_SET_SESSION_CHARACTERISTICS.html
    tier: low
    status: not-applicable
    reason: "The page gives no syntax block and says only: This command is deprecated."

  - id: show_user_lockout
    name: SHOW USER LOCKOUT
    doc: https://docs.aws.amazon.com/redshift/latest/dg/r_SHOW_USER_LOCKOUT.html
    tier: low
    probes:
      - { id: basic, sql: "SHOW USER LOCKOUT;" }

  - id: show_model
    name: SHOW MODEL
    doc: https://docs.aws.amazon.com/redshift/latest/dg/r_SHOW_MODEL.html
    tier: low
    probes:
      - { id: all, sql: "SHOW MODEL ALL;" }
      - { id: named, sql: "SHOW MODEL demo_ml.m;" }

  - id: show_template
    name: SHOW TEMPLATE
    doc: https://docs.aws.amazon.com/redshift/latest/dg/r_SHOW_TEMPLATE.html
    tier: low
    probes:
      - { id: basic, sql: "SHOW TEMPLATE tmpl;" }
      - { id: qualified, sql: "SHOW TEMPLATE db.s.tmpl;" }

  - id: show_templates
    name: SHOW TEMPLATES
    doc: https://docs.aws.amazon.com/redshift/latest/dg/r_SHOW_TEMPLATES.html
    tier: low
    probes:
      - { id: from_schema, sql: "SHOW TEMPLATES FROM SCHEMA s;" }
      - { id: like_limit, sql: "SHOW TEMPLATES FROM SCHEMA db.s LIKE 'a%' LIMIT 10;" }
