  - id: insert_multi_table
    name: "INSERT (multi-table)"
    doc: https://docs.snowflake.com/en/sql-reference/sql/insert-multi-table
    tier: high
    probes:
      - { id: unconditional_all, sql: "INSERT ALL INTO t1 INTO t2 SELECT a, b, c FROM src;" }
      - { id: unconditional_columns_values, sql: "INSERT ALL INTO t1 (c1, c2, c3) VALUES (n2, n1, DEFAULT) INTO t2 VALUES (n3, n2, NULL) SELECT n1, n2, n3 FROM src;" }
      - { id: unconditional_overwrite, sql: "INSERT OVERWRITE ALL INTO t1 INTO t2 (c1, c2, c3) SELECT n1, n2, n3 FROM src;" }
      - { id: conditional_all, sql: "INSERT ALL WHEN n1 > 100 THEN INTO t1 WHEN n1 > 10 THEN INTO t1 INTO t2 ELSE INTO t2 SELECT n1 FROM src;" }
      - { id: conditional_first, sql: "INSERT FIRST WHEN n1 > 100 THEN INTO t1 WHEN n1 > 10 THEN INTO t1 INTO t2 ELSE INTO t2 SELECT n1 FROM src;" }
      - { id: conditional_overwrite_first, sql: "INSERT OVERWRITE FIRST WHEN a > 0 THEN INTO t1 (c1) VALUES (a) SELECT a FROM src;" }
      - { id: conditional_no_else, sql: "INSERT ALL WHEN c > 10 THEN INTO t1 (col1, col2) VALUES (a, b) SELECT a, b, c FROM src;" }
      - { id: values_positional_reference, sql: "INSERT ALL INTO t1 VALUES ($1, an_alias, \"10 + 20\") SELECT 1, 50 AS an_alias, 10 + 20;" }
    examples:
      - |-
        INSERT ALL
          WHEN n1 > 100 THEN
         INTO t1
          WHEN n1 > 10 THEN
         INTO t1
         INTO t2
          ELSE
         INTO t2
        SELECT n1 from src;
      - |-
        INSERT FIRST
          WHEN n1 > 100 THEN
            INTO t1
          WHEN n1 > 10 THEN
            INTO t1
            INTO t2
          ELSE
            INTO t2
        SELECT n1 from src;
      - |-
        INSERT ALL
          INTO t1 VALUES ($1, an_alias, "10 + 20")
        SELECT 1, 50 AS an_alias, 10 + 20;
      - |-
        INSERT ALL
          INTO t1
          INTO t1 (c1, c2, c3) VALUES (n2, n1, DEFAULT)
          INTO t2 (c1, c2, c3)
          INTO t2 VALUES (n3, n2, n1)
        SELECT n1, n2, n3 from src;
      - |-
        INSERT OVERWRITE ALL
          INTO t1
          INTO t1 (c1, c2, c3) VALUES (n2, n1, DEFAULT)
          INTO t2 (c1, c2, c3)
          INTO t2 VALUES (n3, n2, n1)
        SELECT n1, n2, n3 from src;

  - id: update
