  # Cursors are writable ANSI SQL (E121), so the base is scored on them. The
  # base grammar does implement DECLARE ... CURSOR FOR (declare_cursor_statement
  # in grammar/statements/index.js) — this is scored as implemented, not a gap.
  # Dialects with a procedural/embedded layer implement their own variants.
  - id: cursor
    name: "Cursors (DECLARE / OPEN / FETCH / CLOSE)"
    iso: E121
    category: procedural
    ansi: true
    weight: 1
    probe: "DECLARE c CURSOR FOR SELECT a FROM t1;"
    dialects:
      tsql:
        probe: "DECLARE c CURSOR FOR SELECT a FROM t1; OPEN c;"
      sqlite:     { status: not-applicable, reason: "Cursors are API-level only" }
      hive:       { status: not-applicable, reason: "No cursors" }
      spark:      { status: not-applicable, reason: "No cursors" }
      databricks: { status: not-applicable, reason: "No cursors" }
      trino:      { status: not-applicable, reason: "No cursors" }
      athena:     { status: not-applicable, reason: "No cursors" }
      duckdb:     { status: not-applicable, reason: "No cursors" }
      clickhouse: { status: not-applicable, reason: "No cursors" }
      bigquery:   { status: not-applicable, reason: "No cursors" }
      spanner:    { status: not-applicable, reason: "No cursors" }
      flink:      { status: not-applicable, reason: "No cursors" }
      oracle:     { probe: "DECLARE CURSOR c IS SELECT a FROM t1; BEGIN NULL; END;" }
      hana:       { probe: "DECLARE CURSOR c FOR SELECT a FROM t1;" }
      teradata:   { probe: "DECLARE c CURSOR FOR SELECT a FROM t1;" }

  # ── Vendor maintenance / object DDL ──────────────────────────────────────
  # Added alongside the statements implemented in this branch so they are
  # regression-protected. Each is scoped with not-applicable ONLY where the
  # engine demonstrably has no such statement; where a dialect plausibly has
  # it and we simply do not implement it, the probe is left scored so the gap
  # shows up as a real absence rather than being hidden by a guess. That is
  # the opposite of how the stale not-applicable entries corrected earlier in
  # this file came about.

  - id: reindex
    name: "REINDEX"
    category: admin
    ansi: false
    weight: 1
    probe: "REINDEX TABLE t1;"
    dialects:
      # SQLite spells it without the TABLE keyword: REINDEX
      # collation-name | table-name | index-name.
      sqlite:     { probe: "REINDEX t1;" }
      duckdb:     { status: not-applicable, reason: "No REINDEX; ART indexes are rebuilt on load" }
      # Engines with no user-managed indexes at all cannot have REINDEX.
      hive:       { status: not-applicable, reason: "Indexes removed in Hive 3" }
      spark:      { status: not-applicable, reason: "No indexes" }
      databricks: { status: not-applicable, reason: "No user indexes (Delta manages layout)" }
      redshift:   { status: not-applicable, reason: "No indexes (sort/dist keys)" }
      bigquery:   { status: not-applicable, reason: "No user indexes" }
      spanner:    { status: not-applicable, reason: "Index DDL only, no REINDEX" }
      trino:      { status: not-applicable, reason: "Query engine, no index storage" }
      athena:     { status: not-applicable, reason: "Query engine, no index storage" }
      flink:      { status: not-applicable, reason: "Query engine, no index storage" }
      snowflake:  { status: not-applicable, reason: "No user indexes (micro-partitions)" }
      # REINDEX is a PostgreSQL/SQLite spelling. These engines do rebuild
      # indexes, but through a different statement scored by index_rebuild
      # (ALTER INDEX … REBUILD, REORG INDEXES, MATERIALIZE INDEX) — counting
      # the PostgreSQL spelling against them measured the wrong thing.
      oracle:     { status: not-applicable, reason: "ALTER INDEX … REBUILD, not REINDEX" }
      tsql:       { status: not-applicable, reason: "ALTER INDEX … REBUILD, not REINDEX" }
      db2:        { status: not-applicable, reason: "REORG INDEXES, not REINDEX" }
      clickhouse: { status: not-applicable, reason: "ALTER TABLE … MATERIALIZE INDEX, not REINDEX" }
      hana:       { status: not-applicable, reason: "ALTER INDEX … REBUILD, not REINDEX" }
      mysql:      { status: not-applicable, reason: "No REINDEX; OPTIMIZE TABLE rebuilds indexes" }
      mariadb:    { status: not-applicable, reason: "No REINDEX; OPTIMIZE TABLE rebuilds indexes" }
      teradata:   { status: not-applicable, reason: "No REINDEX statement" }

  - id: cluster_table
    name: "CLUSTER table USING index"
    category: admin
    ansi: false
    weight: 1
    probe: "CLUSTER t1 USING idx1;"
    dialects:
      # A PostgreSQL storage statement. sqlfluff accepts it for the dialects
      # below because its grammars inherit ANSI/PostgreSQL, not because the
      # engines have it.
      tsql:       { status: not-applicable, reason: "No CLUSTER statement" }
      redshift:   { status: not-applicable, reason: "No CLUSTER statement (sort keys instead)" }
      duckdb:     { status: not-applicable, reason: "No CLUSTER statement" }
      hive:       { status: not-applicable, reason: "CLUSTER BY is a query clause, not this statement" }
      spark:      { status: not-applicable, reason: "CLUSTER BY is a query clause, not this statement" }
      databricks: { status: not-applicable, reason: "CLUSTER BY is liquid clustering, not this statement" }
      # CLUSTER … USING physically reorders a heap by an index — a
      # PostgreSQL-only maintenance statement. Oracle's CREATE CLUSTER
      # defines a different object (a shared-key storage cluster) and is not
      # this statement; the rest have no equivalent at all.
      oracle:     { status: not-applicable, reason: "CREATE CLUSTER defines a storage cluster; no CLUSTER … USING" }
      mysql:      { status: not-applicable, reason: "No CLUSTER statement (InnoDB is clustered by PK)" }
      mariadb:    { status: not-applicable, reason: "No CLUSTER statement (InnoDB is clustered by PK)" }
      sqlite:     { status: not-applicable, reason: "No CLUSTER statement" }
      db2:        { status: not-applicable, reason: "Clustering index + REORG, no CLUSTER statement" }
      hana:       { status: not-applicable, reason: "No CLUSTER statement" }
      teradata:   { status: not-applicable, reason: "No CLUSTER statement (primary index governs layout)" }
      snowflake:  { status: not-applicable, reason: "CLUSTER BY is a table property, not this statement" }
      bigquery:   { status: not-applicable, reason: "CLUSTER BY is a table property, not this statement" }
      spanner:    { status: not-applicable, reason: "INTERLEAVE governs layout; no CLUSTER statement" }
      clickhouse: { status: not-applicable, reason: "ORDER BY governs layout; no CLUSTER statement" }
      trino:      { status: not-applicable, reason: "Query engine, no owned storage to recluster" }
      athena:     { status: not-applicable, reason: "Query engine, no owned storage to recluster" }
      flink:      { status: not-applicable, reason: "Query engine, no owned storage to recluster" }

