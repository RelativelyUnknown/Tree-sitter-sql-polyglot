dialect: databricks
engine: Databricks SQL / Databricks Runtime
version: "current (docs read 2026-10-04)"
source: https://docs.databricks.com/aws/en/sql/language-manual/

statements:
  - id: join
    name: JOIN
    doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-qry-select-join
    tier: high
    probes:
      - { id: join_on, sql: "SELECT * FROM t1 JOIN t2 ON t1.a = t2.a;" }
      - { id: inner_join_on, sql: "SELECT * FROM t1 INNER JOIN t2 ON t1.a = t2.a;" }
      - { id: join_using, sql: "SELECT * FROM t1 JOIN t2 USING (a);" }
      - { id: join_using_multi, sql: "SELECT * FROM t1 JOIN t2 USING (a, b);" }
      - { id: left_join, sql: "SELECT * FROM t1 LEFT JOIN t2 ON t1.a = t2.a;" }
      - { id: left_outer_join, sql: "SELECT * FROM t1 LEFT OUTER JOIN t2 ON t1.a = t2.a;" }
      - { id: right_join, sql: "SELECT * FROM t1 RIGHT JOIN t2 ON t1.a = t2.a;" }
      - { id: right_outer_join, sql: "SELECT * FROM t1 RIGHT OUTER JOIN t2 ON t1.a = t2.a;" }
      - { id: full_join, sql: "SELECT * FROM t1 FULL JOIN t2 ON t1.a = t2.a;" }
      - { id: full_outer_join, sql: "SELECT * FROM t1 FULL OUTER JOIN t2 ON t1.a = t2.a;" }
      - { id: semi_join, sql: "SELECT * FROM t1 SEMI JOIN t2 ON t1.a = t2.a;" }
      - { id: left_semi_join, sql: "SELECT * FROM t1 LEFT SEMI JOIN t2 ON t1.a = t2.a;" }
      - { id: anti_join, sql: "SELECT * FROM t1 ANTI JOIN t2 ON t1.a = t2.a;" }
      - { id: left_anti_join, sql: "SELECT * FROM t1 LEFT ANTI JOIN t2 ON t1.a = t2.a;" }
      - { id: cross_join, sql: "SELECT * FROM t1 CROSS JOIN t2;" }
      - { id: join_no_criteria, sql: "SELECT * FROM t1 JOIN t2;" }
      - { id: natural_join, sql: "SELECT * FROM t1 NATURAL JOIN t2;" }
      - { id: natural_inner_join, sql: "SELECT * FROM t1 NATURAL INNER JOIN t2;" }
      - { id: natural_left_join, sql: "SELECT * FROM t1 NATURAL LEFT JOIN t2;" }
      - { id: natural_left_outer_join, sql: "SELECT * FROM t1 NATURAL LEFT OUTER JOIN t2;" }
      - { id: natural_right_join, sql: "SELECT * FROM t1 NATURAL RIGHT JOIN t2;" }
      - { id: natural_full_join, sql: "SELECT * FROM t1 NATURAL FULL OUTER JOIN t2;" }
      - { id: natural_left_semi_join, sql: "SELECT * FROM t1 NATURAL LEFT SEMI JOIN t2;" }
      - { id: natural_left_anti_join, sql: "SELECT * FROM t1 NATURAL LEFT ANTI JOIN t2;" }
      - { id: right_table_alias, sql: "SELECT * FROM t1 JOIN t2 AS b ON t1.a = b.a;" }
      - { id: right_table_alias_columns, sql: "SELECT * FROM t1 JOIN t2 AS b (x, y) ON t1.a = b.x;" }
      - { id: right_subquery, sql: "SELECT * FROM t1 JOIN (SELECT a FROM t2) AS b ON t1.a = b.a;" }
      - { id: join_lateral, sql: "SELECT * FROM t1 JOIN LATERAL (SELECT c FROM t2 WHERE t1.a = t2.a);" }
      - { id: left_join_lateral, sql: "SELECT * FROM t1 LEFT JOIN LATERAL (SELECT c FROM t2 WHERE t1.a = t2.a);" }
      - { id: cross_join_lateral, sql: "SELECT * FROM t1 CROSS JOIN LATERAL (SELECT c FROM t2 WHERE t1.a = t2.a) AS b;" }
      - { id: chained_joins, sql: "SELECT * FROM t1 JOIN t2 ON t1.a = t2.a LEFT JOIN t3 ON t2.b = t3.b CROSS JOIN t4;" }
    examples:
      - "SELECT id, name, employee.deptno, deptname FROM employee INNER JOIN department ON employee.deptno = department.deptno;"
      - "SELECT * FROM employee ANTI JOIN department ON employee.deptno = department.deptno;"
      - "SELECT id, name, deptno, deptname FROM employee LEFT JOIN LATERAL (SELECT deptname FROM department WHERE employee.deptno = department.deptno);"

  - id: where
    name: WHERE clause
    doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-qry-select-where
    tier: high
    probes:
      - { id: where_comparison, sql: "SELECT * FROM t WHERE a > 1;" }
      - { id: where_and_or, sql: "SELECT * FROM t WHERE a = 1 OR (b = 2 AND c = 3);" }
      - { id: where_is_null, sql: "SELECT * FROM t WHERE a IS NULL;" }
      - { id: where_between, sql: "SELECT * FROM t WHERE a BETWEEN 1 AND 2;" }
      - { id: where_function, sql: "SELECT * FROM t WHERE length(name) > 3;" }
      - { id: where_scalar_subquery, sql: "SELECT * FROM t WHERE a > (SELECT avg(a) FROM t);" }
      - { id: where_exists_correlated, sql: "SELECT * FROM t AS p WHERE EXISTS (SELECT 1 FROM t AS c WHERE p.a = c.a AND c.b IS NULL);" }
    examples:
      - "SELECT * FROM person WHERE id > 200 ORDER BY id;"
      - "SELECT * FROM person WHERE id BETWEEN 200 AND 300 ORDER BY id;"
      - "SELECT * FROM person AS parent WHERE EXISTS (SELECT 1 FROM person AS child WHERE parent.id = child.id AND child.age IS NULL);"
