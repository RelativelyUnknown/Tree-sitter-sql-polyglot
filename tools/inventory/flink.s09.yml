dialect: flink
engine: Apache Flink SQL
version: "2.3"
source: https://nightlies.apache.org/flink/flink-docs-release-2.3/docs/sql/reference/

statements:
  - id: drop_view
    name: DROP VIEW
    doc: https://nightlies.apache.org/flink/flink-docs-release-2.3/docs/sql/reference/ddl/drop/#drop-view
    tier: high
    probes:
      - id: basic
        sql: "DROP VIEW v;"
      - id: temporary
        sql: "DROP TEMPORARY VIEW v;"
      - id: if_exists
        sql: "DROP VIEW IF EXISTS v;"
      - id: temporary_if_exists
        sql: "DROP TEMPORARY VIEW IF EXISTS v;"
      - id: db_qualified
        sql: "DROP VIEW db.v;"
      - id: catalog_db_qualified
        sql: "DROP VIEW IF EXISTS cat.db.v;"

  - id: drop_function
    name: DROP FUNCTION
    doc: https://nightlies.apache.org/flink/flink-docs-release-2.3/docs/sql/reference/ddl/drop/#drop-function
    tier: high
    probes:
      - id: basic
        sql: "DROP FUNCTION f;"
      - id: temporary
        sql: "DROP TEMPORARY FUNCTION f;"
      - id: temporary_system
        sql: "DROP TEMPORARY SYSTEM FUNCTION f;"
      - id: if_exists
        sql: "DROP FUNCTION IF EXISTS f;"
      - id: temporary_if_exists
        sql: "DROP TEMPORARY FUNCTION IF EXISTS f;"
      - id: temporary_system_if_exists
        sql: "DROP TEMPORARY SYSTEM FUNCTION IF EXISTS f;"
      - id: db_qualified
        sql: "DROP FUNCTION db.f;"
      - id: catalog_db_qualified
        sql: "DROP FUNCTION IF EXISTS cat.db.f;"
