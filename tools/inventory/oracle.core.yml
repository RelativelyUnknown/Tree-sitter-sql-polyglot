        sql: "CREATE OR REPLACE PROCEDURE s.p (a IN NUMBER, b OUT VARCHAR2, c IN OUT NOCOPY NUMBER, d DATE DEFAULT SYSDATE) AS BEGIN b := TO_CHAR(a); END p;"
      - id: if_not_exists
        sql: "CREATE PROCEDURE IF NOT EXISTS p (id NUMBER) AS BEGIN DELETE FROM t WHERE t.id = p.id; END;"
      - id: editionable
        sql: "CREATE OR REPLACE EDITIONABLE PROCEDURE p IS BEGIN NULL; END;"
      - id: noneditionable
        sql: "CREATE NONEDITIONABLE PROCEDURE p IS BEGIN NULL; END;"
      - id: declare_section
        sql: "CREATE PROCEDURE p (id NUMBER) AS n NUMBER; CURSOR c IS SELECT c FROM t; BEGIN DELETE FROM t WHERE t.id = p.id; n := SQL%ROWCOUNT; END;"
      - id: exception_section
        sql: "CREATE PROCEDURE p IS BEGIN INSERT INTO t VALUES (1); EXCEPTION WHEN DUP_VAL_ON_INDEX THEN NULL; WHEN OTHERS THEN RAISE; END;"
      - id: authid_current_user
        sql: "CREATE PROCEDURE p AUTHID CURRENT_USER IS BEGIN NULL; END;"
      - id: accessible_by
        sql: "CREATE PROCEDURE p ACCESSIBLE BY (FUNCTION f, TRIGGER s.trg) IS BEGIN NULL; END;"
      - id: default_collation
        sql: "CREATE PROCEDURE p DEFAULT COLLATION USING_NLS_COMP IS BEGIN NULL; END;"
      - id: sharing
        sql: "CREATE PROCEDURE p SHARING = NONE IS BEGIN NULL; END;"
      - id: autonomous_transaction
        sql: "CREATE PROCEDURE p (m VARCHAR2) IS PRAGMA AUTONOMOUS_TRANSACTION; BEGIN INSERT INTO log_t VALUES (m); COMMIT; END;"
      - id: call_spec_c
        sql: "CREATE PROCEDURE p (x IN REAL) IS LANGUAGE C NAME c_find_root LIBRARY c_utils PARAMETERS (x BY REFERENCE);"
      - id: call_spec_java
        sql: "CREATE PROCEDURE p (a VARCHAR2) AS LANGUAGE JAVA NAME 'Util.p(java.lang.String)';"
      - id: call_spec_mle_module
        sql: "CREATE OR REPLACE PROCEDURE p (\"p_who\" VARCHAR2) AS MLE MODULE hello_mod SIGNATURE 'hello';"
      - id: call_spec_mle_inline
        sql: |-
          CREATE OR REPLACE PROCEDURE p ("who" VARCHAR2)
          AS MLE LANGUAGE JAVASCRIPT
          {{
            console.log(`Hello, ${who}`);
          }};
      - id: nested_subprograms
        sql: "CREATE PROCEDURE p IS PROCEDURE q (a NUMBER); PROCEDURE q (a NUMBER) IS BEGIN NULL; END; BEGIN q(1); END;"
      - id: slash_terminated
        sql: |-
          CREATE OR REPLACE PROCEDURE p IS
          BEGIN
            NULL;
          END;
          /
        note: "In SQL*Plus and SQLcl scripts a PL/SQL unit ends with a line containing only /."
    examples:
      - |-
        CREATE PROCEDURE IF NOT EXISTS remove_emp (employee_id NUMBER) AS
           tot_emps NUMBER;
           BEGIN
              DELETE FROM employees
              WHERE employees.employee_id = remove_emp.employee_id;
           tot_emps := tot_emps - 1;
           END;
        /
      - |-
        CREATE PROCEDURE find_root
           ( x IN REAL ) 
           IS LANGUAGE C
              NAME c_find_root
              LIBRARY c_utils
              PARAMETERS ( x BY REFERENCE );
      - |-
        CREATE OR REPLACE PROCEDURE hello_inline(
          "who" VARCHAR2
        )
        AS MLE LANGUAGE JAVASCRIPT
        {{
          console.log(`Hello, ${who}`);
        }};
        /
      - |-
        CREATE OR REPLACE PROCEDURE hello(
          "p_who" VARCHAR2
        )
        AS MLE MODULE hello_mod
        SIGNATURE 'hello';
        /

