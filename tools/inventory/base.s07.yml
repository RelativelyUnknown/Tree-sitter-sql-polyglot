dialect: base
engine: ISO SQL
version: "SQL:2016"
source: https://jakewheat.github.io/sql-overview/sql-2016-foundation-grammar.html

statements:
  - id: drop_routine
    name: DROP FUNCTION / PROCEDURE / ROUTINE
    doc: https://jakewheat.github.io/sql-overview/sql-2016-foundation-grammar.html#_11_62_drop_routine_statement
    tier: high
    probes:
      - id: drop_function_cascade
        sql: "DROP FUNCTION f CASCADE;"
      - id: drop_function_restrict
        sql: "DROP FUNCTION f RESTRICT;"
      - id: drop_function_qualified
        sql: "DROP FUNCTION s.f CASCADE;"
      - id: drop_function_arg_types
        sql: "DROP FUNCTION f (INTEGER, VARCHAR(10)) RESTRICT;"
      - id: drop_function_empty_args
        sql: "DROP FUNCTION f () CASCADE;"
      - id: drop_procedure
        sql: "DROP PROCEDURE p (INTEGER) RESTRICT;"
      - id: drop_routine
        sql: "DROP ROUTINE r (INTEGER) CASCADE;"
      - id: drop_specific_function
        sql: "DROP SPECIFIC FUNCTION f_specific CASCADE;"
      - id: drop_specific_procedure
        sql: "DROP SPECIFIC PROCEDURE p_specific RESTRICT;"
      - id: drop_specific_routine
        sql: "DROP SPECIFIC ROUTINE r_specific CASCADE;"
      - id: drop_method_for_type
        sql: "DROP METHOD m (INTEGER) FOR ty CASCADE;"
      - id: drop_instance_method
        sql: "DROP INSTANCE METHOD m (INTEGER) FOR ty RESTRICT;"
      - id: drop_static_method
        sql: "DROP STATIC METHOD m (INTEGER) FOR ty RESTRICT;"
      - id: drop_constructor_method
        sql: "DROP CONSTRUCTOR METHOD ty () FOR ty CASCADE;"
    examples: []

  - id: call
    name: CALL
    doc: https://jakewheat.github.io/sql-overview/sql-2016-foundation-grammar.html#_16_1_call_statement
    tier: high
    probes:
      - id: call_no_args
        sql: "CALL p();"
      - id: call_literal_args
        sql: "CALL p(1, 'a');"
      - id: call_qualified
        sql: "CALL s.p(1);"
      - id: call_expression_arg
        sql: "CALL p(1 + 2, c);"
      - id: call_named_arg
        sql: "CALL p(a => 1, b => 2);"
      - id: call_null_arg
        sql: "CALL p(NULL);"
    examples: []
