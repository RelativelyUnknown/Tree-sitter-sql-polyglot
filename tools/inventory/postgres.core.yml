      - { id: trim_comma_form, sql: "SELECT trim(BOTH FROM 'yxTomxx', 'xyz'), trim('  Tom  ');" }
      - { id: normalize, sql: "SELECT normalize(U&'\\0061\\0308bc', NFC), normalize('abc');" }
      - { id: is_normalized, sql: "SELECT U&'\\0061\\0308bc' IS NFD NORMALIZED, 'abc' IS NOT NORMALIZED;" }
      - { id: ordinary_functions, sql: "SELECT lower('TOM'), upper('tom'), char_length('jose'), character_length('jose'), octet_length('jose'), bit_length('jose'), concat('a', 1), format('%s-%I', 'a', 'b');" }
      - { id: collation_for, sql: "SELECT collation for (description) FROM pg_description LIMIT 1;" }

  - id: binary_string_functions
    name: Binary string functions and operators
    doc: https://www.postgresql.org/docs/17/functions-binarystring.html
    tier: medium
    probes:
      - { id: concatenation, sql: "SELECT '\\x123456'::bytea || '\\x789a00bcde'::bytea;" }
      - { id: special_forms, sql: "SELECT substring('\\x1234567890'::bytea FROM 3 FOR 2), position('\\x5678'::bytea IN '\\x1234567890'::bytea), trim('\\x9012'::bytea FROM '\\x1234567890'::bytea), overlay('\\x1234567890'::bytea PLACING '\\002\\003'::bytea FROM 2 FOR 3);" }

  - id: bit_string_operators
    name: Bit string functions and operators
    doc: https://www.postgresql.org/docs/17/functions-bitstring.html
    tier: low
    probes:
      - { id: operators, sql: "SELECT B'10001' || B'011', B'10001' & B'01101', B'10001' | B'01101', B'10001' # B'01101', ~ B'10001', B'10001' << 3, B'10001' >> 2;" }
      - { id: special_forms, sql: "SELECT substring(B'110010111111' FROM 3 FOR 2), position(B'010' IN B'000001101011'), overlay(B'01010101010101010' PLACING B'11111' FROM 2 FOR 3);" }

  - id: pattern_matching
    name: Pattern matching (LIKE, SIMILAR TO, POSIX regular expressions)
    doc: https://www.postgresql.org/docs/17/functions-matching.html
    tier: high
    probes:
      - { id: like, sql: "SELECT 'abc' LIKE 'a%', 'abc' NOT LIKE '_b_';" }
      - { id: like_escape, sql: "SELECT 'a_c' LIKE 'a$_c' ESCAPE '$';" }
      - { id: ilike, sql: "SELECT 'ABC' ILIKE 'a%', 'ABC' NOT ILIKE 'b%';" }
      - { id: like_operators, sql: "SELECT 'abc' ~~ 'a%', 'abc' ~~* 'A%', 'abc' !~~ 'b%', 'abc' !~~* 'B%';" }
      - { id: similar_to, sql: "SELECT 'abc' SIMILAR TO '%(b|d)%', 'abc' NOT SIMILAR TO '(b|c)%';" }
      - { id: similar_to_escape, sql: "SELECT 'a_c' SIMILAR TO 'a#_c' ESCAPE '#';" }
      - { id: posix_regex_operators, sql: "SELECT 'thomas' ~ 't.*ma', 'thomas' ~* 'T.*ma', 'thomas' !~ 't.*max', 'thomas' !~* 'T.*ma';" }
      - { id: regexp_functions, sql: "SELECT regexp_replace('foobarbaz', 'b..', 'X', 'g'), regexp_match('foobarbequebaz', 'ba.'), regexp_count('ABCABCAXYaxy', 'A.'), regexp_like('Hello World', 'world', 'i'), regexp_substr('ABCDEF', 'c(.)(..)', 1, 1, 'i', 2);" }
      - { id: regexp_set_returning, sql: "SELECT * FROM regexp_matches('foo', 'not there'), regexp_split_to_table('hello world', '\\s+');" }

  - id: datetime_functions
    name: Date/time functions and operators
    doc: https://www.postgresql.org/docs/17/functions-datetime.html
    tier: high
    probes:
      - { id: arithmetic, sql: "SELECT date '2001-09-28' + 7, date '2001-09-28' + interval '1 hour', timestamp '2001-09-29 03:00' - timestamp '2001-07-27 12:00', interval '1 hour' * 3.5;" }
      - { id: extract, sql: "SELECT EXTRACT(YEAR FROM ts), EXTRACT(EPOCH FROM INTERVAL '5 days 3 hours'), extract(dow FROM ts) FROM t;" }
      - { id: extract_quoted_field, sql: "SELECT EXTRACT('microseconds' FROM TIME '17:12:28.5');" }
      - { id: date_part_trunc_bin, sql: "SELECT date_part('hour', ts), date_trunc('hour', ts), date_trunc('day', tstz, 'Australia/Sydney'), date_bin('15 minutes', ts, TIMESTAMP '2001-01-01') FROM t;" }
      - { id: at_time_zone, sql: "SELECT TIMESTAMP '2001-02-16 20:38:40' AT TIME ZONE 'America/Denver', ts AT TIME ZONE INTERVAL '-08:00' FROM t;" }
      - { id: at_local, sql: "SELECT TIMESTAMP WITH TIME ZONE '2001-02-16 20:38:40-05' AT LOCAL;" }
      - { id: overlaps, sql: "SELECT (DATE '2001-02-16', DATE '2001-12-21') OVERLAPS (DATE '2001-10-30', DATE '2002-10-30'), (DATE '2001-02-16', INTERVAL '100 days') OVERLAPS (DATE '2001-10-30', DATE '2002-10-30');" }
      - { id: current_datetime_keywords, sql: "SELECT CURRENT_DATE, CURRENT_TIME, CURRENT_TIMESTAMP, LOCALTIME, LOCALTIMESTAMP;" }
      - { id: current_datetime_precision, sql: "SELECT CURRENT_TIME(2), CURRENT_TIMESTAMP(0), LOCALTIME(1), LOCALTIMESTAMP(3);" }
      - { id: constructors_and_now, sql: "SELECT now(), clock_timestamp(), make_date(2013, 7, 15), make_interval(days => 10), age(timestamp '2001-04-10', timestamp '1957-06-13'), to_timestamp(1284352323);" }

  - id: formatting_functions
    name: Data type formatting functions
    doc: https://www.postgresql.org/docs/17/functions-formatting.html
    tier: medium
    probes:
      - { id: to_char_and_parse, sql: "SELECT to_char(current_timestamp, 'HH12:MI:SS'), to_char(-125.8, '999D99S'), to_date('05 Dec 2000', 'DD Mon YYYY'), to_number('12,454.8-', '99G999D9S'), to_timestamp('05 Dec 2000', 'DD Mon YYYY');" }

  - id: enum_functions
    name: Enum support functions
    doc: https://www.postgresql.org/docs/17/functions-enum.html
    tier: low
    probes:
      - { id: functions, sql: "SELECT enum_first(null::rainbow), enum_last(null::rainbow), enum_range('orange'::rainbow, 'green'::rainbow);" }

  - id: geometric_operators
    name: Geometric functions and operators
    doc: https://www.postgresql.org/docs/17/functions-geometry.html
    tier: low
    probes:
      - { id: operators, sql: "SELECT box '(1,1),(0,0)' + point '(2,0)', point '(0,0)' <-> point '(3,4)', box '(2,2),(0,0)' && box '(3,3),(1,1)', circle '<(0,0),2>' @> point '(1,1)', @-@ path '[(0,0),(1,0),(1,1)]', @@ box '(2,2),(0,0)', # polygon '((1,0),(0,1),(-1,0))';" }
      - { id: relational_operators, sql: "SELECT box '(1,1),(0,0)' << box '(3,3),(2,2)', box '(3,3),(2,2)' &> box '(1,1),(0,0)', lseg '[(-1,0),(1,0)]' ?# box '(2,2),(-2,-2)', point '(1,0)' ?- point '(0,0)', lseg '[(0,0),(0,1)]' ?-| lseg '[(0,0),(1,0)]', point '(0,0)' ~= point '(0,0)';" }

  - id: network_operators
    name: Network address functions and operators
    doc: https://www.postgresql.org/docs/17/functions-net.html
    tier: low
    probes:
      - { id: containment, sql: "SELECT inet '192.168.1.5' << inet '192.168.1/24', inet '192.168.1/24' <<= inet '192.168.1/24', inet '192.168.1/24' >> inet '192.168.1.5', inet '192.168.1/24' >>= inet '192.168.1/24', inet '192.168.1/24' && inet '192.168.1.80/28';" }
      - { id: arithmetic_bitwise, sql: "SELECT ~ inet '192.168.1.6', inet '192.168.1.6' & inet '0.0.0.255', inet '192.168.1.6' | inet '0.0.0.255', inet '192.168.1.6' + 25, inet '192.168.1.43' - 36, inet '192.168.1.43' - inet '192.168.1.19';" }

  - id: text_search_operators
    name: Text search functions and operators
    doc: https://www.postgresql.org/docs/17/functions-textsearch.html
    tier: medium
    probes:
      - { id: match, sql: "SELECT to_tsvector('fat cats ate rats') @@ to_tsquery('cat & rat'), 'fat cats ate rats' @@ to_tsquery('cat & rat');" }
      - { id: tsvector_tsquery_operators, sql: "SELECT 'a:1 b:2'::tsvector || 'c:1'::tsvector, 'fat | rat'::tsquery && 'cat'::tsquery, 'fat'::tsquery || 'cat'::tsquery, !! 'cat'::tsquery, to_tsquery('fat') <-> to_tsquery('rat'), 'cat'::tsquery @> 'cat & rat'::tsquery;" }
      - { id: functions, sql: "SELECT to_tsvector('english', 'The Fat Rats'), plainto_tsquery('english', 'The Fat Rats'), websearch_to_tsquery('english', '\"sad cat\" or \"fat rat\"'), ts_rank(to_tsvector('x'), to_tsquery('x'));" }

  - id: xml_functions
    name: XML functions
    doc: https://www.postgresql.org/docs/17/functions-xml.html
    tier: medium
    probes:
      - { id: xmlelement_attributes, sql: "SELECT xmlelement(NAME foo, xmlattributes(current_date AS bar, 'x' AS \"a b\"), 'cont', 'ent');" }
      - { id: xmlelement_minimal, sql: "SELECT xmlelement(name foo);" }
      - { id: xmlforest, sql: "SELECT xmlforest('abc' AS foo, 123 AS bar), xmlforest(table_name, column_name) FROM information_schema.columns;" }
      - { id: xmlpi, sql: "SELECT xmlpi(name php, 'echo \"hello world\";');" }
      - { id: xmlroot, sql: "SELECT xmlroot(xmlparse(document '<?xml version=\"1.1\"?><content>abc</content>'), version '1.0', standalone yes);" }
      - { id: xmlroot_no_value, sql: "SELECT xmlroot(x, VERSION NO VALUE, STANDALONE NO VALUE) FROM t;" }
      - { id: xmltext_comment_concat, sql: "SELECT xmltext('< foo & bar >'), xmlcomment('hello'), xmlconcat('<abc/>', '<bar>foo</bar>');" }
      - { id: xmlagg_order_by, sql: "SELECT xmlagg(x ORDER BY y DESC) FROM test;" }
      - { id: xmlparse, sql: "SELECT XMLPARSE (DOCUMENT '<book><title>Manual</title></book>'), XMLPARSE (CONTENT 'abc<foo>bar</foo>');" }
      - { id: xmlserialize, sql: "SELECT XMLSERIALIZE (CONTENT x AS text), XMLSERIALIZE (DOCUMENT x AS varchar(100) INDENT), XMLSERIALIZE (CONTENT x AS text NO INDENT) FROM t;" }
      - { id: is_document, sql: "SELECT x IS DOCUMENT, x IS NOT DOCUMENT FROM t;" }
      - { id: xmlexists, sql: "SELECT xmlexists('//town[text() = ''Toronto'']' PASSING BY VALUE '<towns><town>Toronto</town></towns>');" }
      - { id: xmlexists_by_ref, sql: "SELECT xmlexists('//town' PASSING BY REF x BY REF) FROM t;" }
      - { id: xpath_functions, sql: "SELECT xpath('/my:a/text()', '<my:a xmlns:my=\"http://example.com\">test</my:a>', ARRAY[ARRAY['my', 'http://example.com']]), xml_is_well_formed('<a/>');" }
      - id: xmltable
        sql: "SELECT xmltable.* FROM xmldata, XMLTABLE('//ROWS/ROW' PASSING data COLUMNS id int PATH '@id', ordinality FOR ORDINALITY, \"COUNTRY_NAME\" text, country_id text PATH 'COUNTRY_ID', size_sq_km float PATH 'SIZE[@unit = \"sq_km\"]', premier_name text PATH 'PREMIER_NAME' DEFAULT 'not specified', region text NOT NULL);"
      - id: xmltable_namespaces
        sql: "SELECT xmltable.* FROM XMLTABLE(XMLNAMESPACES('http://example.com/myns' AS x, 'http://example.com/b' AS \"B\"), '/x:example/x:item' PASSING (SELECT data FROM xmldata) COLUMNS foo int PATH '@foo', bar int PATH '@B:bar');"
    examples:
      - "SELECT xmlforest('abc' AS foo, 123 AS bar);"
      - "SELECT xmlpi(name php, 'echo \"hello world\";');"
      - |-
        SELECT xmlroot(xmlparse(document '<?xml version="1.1"?><content>abc</content>'),
                       version '1.0', standalone yes);
      - "SELECT xmlconcat('<abc/>', '<bar>foo</bar>');"
      - "SELECT xmlcomment('hello');"

  - id: json_operators
    name: JSON operators
    doc: https://www.postgresql.org/docs/17/functions-json.html
    tier: high
    probes:
      - { id: extraction, sql: "SELECT j -> 'a', j -> 2, j ->> 'a', j ->> 2, j #> '{a,b}', j #>> '{a,2}' FROM t;" }
      - { id: jsonb_containment_existence, sql: "SELECT j @> '{\"b\":2}', '{\"b\":2}' <@ j, j ? 'a', j ?| array['b', 'd'], j ?& array['a', 'b'] FROM t;" }
      - { id: jsonb_modification, sql: "SELECT j || '{\"c\":3}', j - 'a', j - '{a,c}'::text[], j - 1, j #- '{1,b}' FROM t;" }
      - { id: jsonpath_operators, sql: "SELECT j @? '$.a[*] ? (@ > 2)', j @@ '$.a[*] > 2' FROM t;" }
      - { id: processing_functions, sql: "SELECT jsonb_build_object('a', 1), jsonb_set(j, '{a}', '1'), jsonb_path_query_array(j, '$.a[*] ? (@ >= $min)', '{\"min\": 2}'), to_jsonb(t) FROM t;" }
      - { id: set_returning_functions, sql: "SELECT * FROM jsonb_each('{\"a\":1}'), jsonb_to_recordset('[{\"a\":1,\"b\":\"foo\"}]') AS x (a int, b text);" }

  - id: sqljson_constructors
    name: SQL/JSON constructor functions
    doc: https://www.postgresql.org/docs/17/functions-json.html
    tier: medium
    probes:
      - { id: json_object_value, sql: "SELECT json_object('code' VALUE 'P123', 'title': 'Jaws');" }
      - { id: json_object_options, sql: "SELECT json_object('a' VALUE NULL ABSENT ON NULL WITH UNIQUE KEYS RETURNING jsonb);" }
      - { id: json_object_format_json, sql: "SELECT json_object('a' VALUE '{\"b\":1}' FORMAT JSON NULL ON NULL WITHOUT UNIQUE RETURNING text FORMAT JSON ENCODING UTF8);" }
      - { id: json_object_empty, sql: "SELECT json_object();" }
      - { id: json_array_values, sql: "SELECT json_array(1, true, json '{\"a\":null}', '[1]' FORMAT JSON ABSENT ON NULL RETURNING jsonb);" }
      - { id: json_array_query, sql: "SELECT json_array(SELECT * FROM (VALUES (1), (2)) t RETURNING json);" }
      - { id: json_function, sql: "SELECT json('{\"a\":123, \"b\":[true,\"foo\"], \"a\":\"bar\"}'), json('{\"a\":1}' FORMAT JSON WITH UNIQUE KEYS);" }
      - { id: json_scalar, sql: "SELECT json_scalar(123.45), json_scalar(CURRENT_TIMESTAMP);" }
      - { id: json_serialize, sql: "SELECT json_serialize('{ \"a\" : 1 } ' RETURNING bytea), json_serialize(j FORMAT JSON RETURNING text) FROM t;" }
      - { id: json_arrayagg, sql: "SELECT json_arrayagg(v ORDER BY v DESC NULL ON NULL RETURNING jsonb) FROM t;" }
      - { id: json_objectagg, sql: "SELECT json_objectagg(k VALUE v ABSENT ON NULL WITH UNIQUE KEYS RETURNING jsonb), json_objectagg(k: v) FROM t;" }

  - id: is_json_predicate
    name: IS JSON predicate
    doc: https://www.postgresql.org/docs/17/functions-json.html
    tier: medium
    probes:
      - { id: is_json, sql: "SELECT js IS JSON, js IS NOT JSON FROM t;" }
      - { id: item_types, sql: "SELECT js IS JSON VALUE, js IS JSON SCALAR, js IS JSON OBJECT, js IS NOT JSON ARRAY FROM t;" }
      - { id: unique_keys, sql: "SELECT js IS JSON OBJECT WITH UNIQUE KEYS, js IS JSON WITHOUT UNIQUE FROM t;" }

  - id: sqljson_query_functions
    name: SQL/JSON query functions
    doc: https://www.postgresql.org/docs/17/functions-json.html
    tier: medium
    probes:
      - { id: json_exists, sql: "SELECT JSON_EXISTS(jsonb '{\"key1\": [1,2,3]}', 'strict $.key1[*] ? (@ > $x)' PASSING 2 AS x);" }
      - { id: json_exists_on_error, sql: "SELECT JSON_EXISTS(jsonb '{\"a\": [1,2,3]}', 'lax $.a[5]' ERROR ON ERROR), JSON_EXISTS(j, '$.a' UNKNOWN ON ERROR) FROM t;" }
      - { id: json_query_wrapper, sql: "SELECT JSON_QUERY(jsonb '[1,[2,3],null]', 'lax $[*][$off]' PASSING 1 AS off WITH CONDITIONAL WRAPPER);" }
      - { id: json_query_quotes, sql: "SELECT JSON_QUERY(jsonb '{\"a\": \"[1, 2]\"}', 'lax $.a' RETURNING int[] OMIT QUOTES ON SCALAR STRING);" }
      - { id: json_query_on_empty_error, sql: "SELECT JSON_QUERY(jsonb '{\"a\": [1,2]}', '$.b' RETURNING jsonb WITH UNCONDITIONAL ARRAY WRAPPER KEEP QUOTES EMPTY ARRAY ON EMPTY NULL ON ERROR);" }
      - { id: json_query_default, sql: "SELECT JSON_QUERY(j, '$.b' WITHOUT WRAPPER DEFAULT '[]' ON EMPTY EMPTY OBJECT ON ERROR) FROM t;" }
      - { id: json_value, sql: "SELECT JSON_VALUE(jsonb '\"123.45\"', '$' RETURNING float);" }
      - { id: json_value_on_empty_error, sql: "SELECT JSON_VALUE(jsonb '[1,2]', 'strict $[$off]' PASSING 1 AS off), JSON_VALUE(jsonb '[1,2]', 'strict $[*]' DEFAULT 9 ON ERROR), JSON_VALUE(j, '$.x' NULL ON EMPTY ERROR ON ERROR) FROM t;" }

  - id: json_table
    name: JSON_TABLE
    doc: https://www.postgresql.org/docs/17/functions-json.html
    tier: medium
    probes:
      - { id: basic_path_columns, sql: "SELECT jt.* FROM t, JSON_TABLE(js, '$.favorites[*]' COLUMNS (kind text PATH '$.kind')) AS jt;" }
      - { id: for_ordinality, sql: "SELECT * FROM JSON_TABLE(jsonb '[1,2]', '$[*]' COLUMNS (id FOR ORDINALITY, v int PATH '$')) AS jt;" }
      - { id: implicit_path, sql: "SELECT * FROM JSON_TABLE(jsonb '{\"a\":1}', '$' COLUMNS (a int)) AS jt;" }
      - { id: path_name_and_passing, sql: "SELECT * FROM t, JSON_TABLE(js, '$.favorites[*] ? (@.films[*].director == $filter)' AS root PASSING 'Alfred Hitchcock' AS filter COLUMNS (kind text PATH '$.kind')) AS jt;" }
      - { id: format_json_wrapper_quotes, sql: "SELECT * FROM t, JSON_TABLE(js, '$.favorites[*]' COLUMNS (title text FORMAT JSON PATH '$.films[*].title' WITH WRAPPER, director text PATH '$.films[*].director' KEEP QUOTES, name text FORMAT JSON ENCODING UTF8 PATH '$.name' OMIT QUOTES ON SCALAR STRING)) AS jt;" }
      - { id: column_on_empty_on_error, sql: "SELECT * FROM t, JSON_TABLE(js, '$[*]' COLUMNS (a int PATH '$.a' DEFAULT 0 ON EMPTY NULL ON ERROR, b jsonb PATH '$.b' EMPTY OBJECT ON EMPTY ERROR ON ERROR)) AS jt;" }
      - { id: exists_column, sql: "SELECT * FROM t, JSON_TABLE(js, '$[*]' COLUMNS (has_a boolean EXISTS PATH '$.a' FALSE ON ERROR, has_b int EXISTS)) AS jt;" }
      - { id: nested_path, sql: "SELECT jt.* FROM t, JSON_TABLE(js, '$.favorites[*]' COLUMNS (id FOR ORDINALITY, kind text PATH '$.kind', NESTED PATH '$.films[*]' AS films COLUMNS (title text FORMAT JSON PATH '$.title' OMIT QUOTES, director text PATH '$.director' KEEP QUOTES))) AS jt;" }
      - { id: nested_without_path_keyword, sql: "SELECT * FROM t, JSON_TABLE(js, '$' COLUMNS (NESTED '$.items[*]' COLUMNS (x int PATH '$.x'))) AS jt;" }
      - { id: table_on_error, sql: "SELECT * FROM t, JSON_TABLE(js, '$.a' COLUMNS (x int PATH '$.x') EMPTY ARRAY ON ERROR) AS jt;" }
      - { id: lateral_left_join, sql: "SELECT * FROM t LEFT JOIN LATERAL JSON_TABLE(t.js, '$[*]' COLUMNS (x int PATH '$.x') ERROR ON ERROR) AS jt ON true;" }
    examples:
      - |-
        SELECT jt.* FROM
         my_films,
         JSON_TABLE (js, '$.favorites[*]' COLUMNS (
           id FOR ORDINALITY,
           kind text PATH '$.kind',
           title text PATH '$.films[*].title' WITH WRAPPER,
           director text PATH '$.films[*].director' WITH WRAPPER)) AS jt;
      - |-
        SELECT jt.* FROM
         my_films,
         JSON_TABLE (js, '$.favorites[*] ? (@.films[*].director == $filter)'
           PASSING 'Alfred Hitchcock' AS filter
             COLUMNS (
             id FOR ORDINALITY,
             kind text PATH '$.kind',
             title text FORMAT JSON PATH '$.films[*].title' OMIT QUOTES,
             director text PATH '$.films[*].director' KEEP QUOTES)) AS jt;
      - |-
        SELECT jt.* FROM
         my_films,
         JSON_TABLE ( js, '$.favorites[*]'
           COLUMNS (
            id FOR ORDINALITY,
            kind text PATH '$.kind',
            NESTED PATH '$.films[*]' COLUMNS (
              title text FORMAT JSON PATH '$.title' OMIT QUOTES,
              director text PATH '$.director' KEEP QUOTES))) AS jt;

