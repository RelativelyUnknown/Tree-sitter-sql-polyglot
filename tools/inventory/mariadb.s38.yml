dialect: mariadb
engine: MariaDB Server
version: "11.x (current)"
source: https://mariadb.com/docs/server/reference/sql-statements

statements:
  - id: start_replica
    name: START REPLICA
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/replication-statements/start-replica
    tier: low
    probes:
      - { id: basic, sql: "START REPLICA;" }
      - { id: slave_synonym_threads, sql: "START SLAVE IO_THREAD, SQL_THREAD;" }
      - { id: until_log_pos, sql: "START REPLICA SQL_THREAD UNTIL MASTER_LOG_FILE = 'log_name', MASTER_LOG_POS = 4;" }
      - { id: all_replicas, sql: "START ALL REPLICAS;" }

  - id: stop_replica
    name: STOP REPLICA
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/replication-statements/stop-replica
    tier: low
    probes:
      - { id: basic, sql: "STOP REPLICA;" }
      - { id: named_thread, sql: "STOP SLAVE 'c1' IO_THREAD;" }
      - { id: all_replicas, sql: "STOP ALL REPLICAS;" }

  - id: show_analyze
    name: SHOW ANALYZE
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-analyze
    tier: low
    probes:
      - { id: basic, sql: "SHOW ANALYZE FOR 5;" }
      - { id: format_json, sql: "SHOW ANALYZE FORMAT=JSON FOR 5;" }

  - id: show_authors
    name: SHOW AUTHORS
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-authors
    tier: low
    probes:
      - { id: basic, sql: "SHOW AUTHORS;" }

  - id: show_binary_logs
    name: SHOW BINARY LOGS
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-binary-logs
    tier: low
    probes:
      - { id: basic, sql: "SHOW BINARY LOGS;" }
      - { id: master_logs, sql: "SHOW MASTER LOGS;" }

  - id: show_binlog_events
    name: SHOW BINLOG EVENTS
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-binlog-events
    tier: low
    probes:
      - { id: basic, sql: "SHOW BINLOG EVENTS;" }
      - { id: in_from_limit, sql: "SHOW BINLOG EVENTS IN 'mysql-bin.000002' FROM 4 LIMIT 2, 10;" }

  - id: show_master_status
    name: SHOW MASTER STATUS
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-binlog-status
    tier: low
    probes:
      - { id: master, sql: "SHOW MASTER STATUS;" }
      - { id: binlog, sql: "SHOW BINLOG STATUS;" }

  - id: show_client_statistics
    name: SHOW CLIENT_STATISTICS
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-client-statistics
    tier: low
    probes:
      - { id: basic, sql: "SHOW CLIENT_STATISTICS;" }

  - id: show_contributors
    name: SHOW CONTRIBUTORS
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-contributors
    tier: low
    probes:
      - { id: basic, sql: "SHOW CONTRIBUTORS;" }

  - id: show_create_package_body
    name: SHOW CREATE PACKAGE BODY
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-create-package-body
    tier: low
    probes:
      - { id: basic, sql: "SHOW CREATE PACKAGE BODY p;" }
      - { id: qualified, sql: "SHOW CREATE PACKAGE BODY s.p;" }

  - id: show_create_package
    name: SHOW CREATE PACKAGE
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-create-package
    tier: low
    probes:
      - { id: basic, sql: "SHOW CREATE PACKAGE p;" }
      - { id: qualified, sql: "SHOW CREATE PACKAGE s.p;" }

  - id: show_create_server
    name: SHOW CREATE SERVER
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-create-server
    tier: low
    probes:
      - { id: basic, sql: "SHOW CREATE SERVER srv1;" }

  - id: show_engine_innodb_status
    name: SHOW ENGINE INNODB STATUS
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-engine-innodb-status
    tier: low
    probes:
      - { id: basic, sql: "SHOW ENGINE INNODB STATUS;" }

  - id: show_engine
    name: SHOW ENGINE
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-engine
    tier: low
    probes:
      - { id: status, sql: "SHOW ENGINE PERFORMANCE_SCHEMA STATUS;" }
      - { id: mutex, sql: "SHOW ENGINE INNODB MUTEX;" }

  - id: show_explain
    name: SHOW EXPLAIN
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-explain
    tier: low
    probes:
      - { id: basic, sql: "SHOW EXPLAIN FOR 2;" }
      - { id: format_json, sql: "SHOW EXPLAIN FORMAT=JSON FOR 2;" }
      - { id: explain_for_connection, sql: "EXPLAIN FORMAT=JSON FOR CONNECTION 2;" }

  - id: show_function_code
    name: SHOW FUNCTION CODE
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-function-code
    tier: low
    probes:
      - { id: basic, sql: "SHOW FUNCTION CODE f;" }

  - id: show_index_statistics
    name: SHOW INDEX_STATISTICS
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-index-statistics
    tier: low
    probes:
      - { id: basic, sql: "SHOW INDEX_STATISTICS;" }

  - id: show_locales
    name: SHOW LOCALES
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-locales
    tier: low
    probes:
      - { id: basic, sql: "SHOW LOCALES;" }

  - id: show_open_tables
    name: SHOW OPEN TABLES
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-open-tables
    tier: low
    probes:
      - { id: basic, sql: "SHOW OPEN TABLES;" }
      - { id: from_like, sql: "SHOW OPEN TABLES FROM db LIKE 't%';" }
      - { id: where, sql: "SHOW OPEN TABLES WHERE In_use > 0;" }

  - id: show_package_body_status
    name: SHOW PACKAGE BODY STATUS
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-package-body-status
    tier: low
    probes:
      - { id: basic, sql: "SHOW PACKAGE BODY STATUS;" }
      - { id: like, sql: "SHOW PACKAGE BODY STATUS LIKE 'p%';" }
      - { id: where, sql: "SHOW PACKAGE BODY STATUS WHERE Db = 'test';" }

  - id: show_package_status
    name: SHOW PACKAGE STATUS
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-package-status
    tier: low
    probes:
      - { id: basic, sql: "SHOW PACKAGE STATUS;" }
      - { id: like, sql: "SHOW PACKAGE STATUS LIKE 'p%';" }
      - { id: where, sql: "SHOW PACKAGE STATUS WHERE Db = 'test';" }

  - id: show_plugins_soname
    name: SHOW PLUGINS SONAME
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-plugins-soname
    tier: low
    probes:
      - { id: library, sql: "SHOW PLUGINS SONAME 'ha_example.so';" }
      - { id: like, sql: "SHOW PLUGINS SONAME LIKE 'ha%';" }
      - { id: where, sql: "SHOW PLUGINS SONAME WHERE Status = 'ACTIVE';" }

  - id: show_plugins
    name: SHOW PLUGINS
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-plugins
    tier: low
    probes:
      - { id: basic, sql: "SHOW PLUGINS;" }

  - id: show_procedure_code
    name: SHOW PROCEDURE CODE
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-procedure-code
    tier: low
    probes:
      - { id: basic, sql: "SHOW PROCEDURE CODE p;" }

  - id: show_profile
    name: SHOW PROFILE
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-profile
    tier: low
    probes:
      - { id: basic, sql: "SHOW PROFILE;" }
      - { id: types_for_query_limit, sql: "SHOW PROFILE CPU, BLOCK IO FOR QUERY 1 LIMIT 5 OFFSET 2;" }
      - { id: all, sql: "SHOW PROFILE ALL;" }

  - id: show_profiles
    name: SHOW PROFILES
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-profiles
    tier: low
    probes:
      - { id: basic, sql: "SHOW PROFILES;" }

  - id: show_query_response_time
    name: SHOW QUERY_RESPONSE_TIME
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-query_response_time
    tier: low
    probes:
      - { id: basic, sql: "SHOW QUERY_RESPONSE_TIME;" }

  - id: show_relaylog_events
    name: SHOW RELAYLOG EVENTS
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-relaylog-events
    tier: low
    probes:
      - { id: basic, sql: "SHOW RELAYLOG EVENTS;" }
      - { id: connection_in_from_limit, sql: "SHOW RELAYLOG 'c1' EVENTS IN 'relay-bin.000001' FROM 4 LIMIT 2, 10;" }
      - { id: for_channel, sql: "SHOW RELAYLOG EVENTS FOR CHANNEL 'c1';" }

  - id: show_replica_hosts
    name: SHOW REPLICA HOSTS
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-replica-hosts
    tier: low
    probes:
      - { id: replica, sql: "SHOW REPLICA HOSTS;" }
      - { id: slave, sql: "SHOW SLAVE HOSTS;" }

  - id: show_replica_status
    name: SHOW REPLICA STATUS
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-replica-status
    tier: low
    probes:
      - { id: basic, sql: "SHOW REPLICA STATUS;" }
      - { id: slave_connection, sql: "SHOW SLAVE 'c1' STATUS;" }
      - { id: all_replicas, sql: "SHOW ALL REPLICAS STATUS;" }
      - { id: for_channel, sql: "SHOW REPLICA STATUS FOR CHANNEL 'c1';" }

  - id: show_table_statistics
    name: SHOW TABLE_STATISTICS
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-table-statistics
    tier: low
    probes:
      - { id: basic, sql: "SHOW TABLE_STATISTICS;" }

  - id: show_user_statistics
    name: SHOW USER_STATISTICS
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-user-statistics
    tier: low
    probes:
      - { id: basic, sql: "SHOW USER_STATISTICS;" }

  - id: show_user_variables
    name: SHOW USER_VARIABLES
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-user_variables
    tier: low
    probes:
      - { id: basic, sql: "SHOW USER_VARIABLES;" }

  - id: show_wsrep_membership
    name: SHOW WSREP_MEMBERSHIP
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-wsrep_membership
    tier: low
    probes:
      - { id: basic, sql: "SHOW WSREP_MEMBERSHIP;" }

  - id: show_wsrep_status
    name: SHOW WSREP_STATUS
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-wsrep_status
    tier: low
    probes:
      - { id: basic, sql: "SHOW WSREP_STATUS;" }

