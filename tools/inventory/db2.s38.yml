dialect: db2
engine: IBM Db2 for Linux, UNIX and Windows
version: "12.1"
source: https://www.ibm.com/docs/en/db2/12.1.x?topic=reference-statements

statements:
  - id: set_current_federated_asynchrony
    name: SET CURRENT FEDERATED ASYNCHRONY
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-set-current-federated-asynchrony
    tier: low
    probes:
      - id: form_1
        sql: "SET CURRENT FEDERATED ASYNCHRONY = ANY;"
      - id: form_2
        sql: "SET CURRENT FEDERATED ASYNCHRONY = 4;"
  - id: set_current_implicit_xmlparse_option
    name: SET CURRENT IMPLICIT XMLPARSE OPTION
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-set-current-implicit-xmlparse-option
    tier: low
    probes:
      - id: form_1
        sql: "SET CURRENT IMPLICIT XMLPARSE OPTION = 'STRIP WHITESPACE';"
  - id: set_current_locale_lc_messages
    name: SET CURRENT LOCALE LC_MESSAGES
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-set-current-locale-lc-messages
    tier: low
    probes:
      - id: form_1
        sql: "SET CURRENT LOCALE LC_MESSAGES = 'en_US';"
  - id: set_current_locale_lc_time
    name: SET CURRENT LOCALE LC_TIME
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-set-current-locale-lc-time
    tier: low
    probes:
      - id: form_1
        sql: "SET CURRENT LOCALE LC_TIME = 'de_DE';"
  - id: set_current_maintained_table_types_for_optimization
    name: SET CURRENT MAINTAINED TABLE TYPES FOR OPTIMIZATION
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-set-current-maintained-table-types-optimization
    tier: low
    probes:
      - id: form_1
        sql: "SET CURRENT MAINTAINED TABLE TYPES FOR OPTIMIZATION = ALL;"
      - id: form_2
        sql: "SET CURRENT MAINTAINED TABLE TYPES FOR OPTIMIZATION = SYSTEM, USER;"
  - id: set_current_mdc_rollout_mode
    name: SET CURRENT MDC ROLLOUT MODE
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-set-current-mdc-rollout-mode
    tier: low
    probes:
      - id: form_1
        sql: "SET CURRENT MDC ROLLOUT MODE DEFERRED;"
      - id: form_2
        sql: "SET CURRENT MDC ROLLOUT MODE NONE;"
  - id: set_current_optimization_profile
    name: SET CURRENT OPTIMIZATION PROFILE
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-set-current-optimization-profile
    tier: low
    probes:
      - id: form_1
        sql: "SET CURRENT OPTIMIZATION PROFILE = 'S.PROF';"
      - id: form_2
        sql: "SET CURRENT OPTIMIZATION PROFILE = NULL;"
  - id: set_current_package_path
    name: SET CURRENT PACKAGE PATH
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-set-current-package-path
    tier: low
    probes:
      - id: form_1
        sql: "SET CURRENT PACKAGE PATH = s1, s2;"
      - id: form_2
        sql: "SET CURRENT PACKAGE PATH = CURRENT PACKAGE PATH, USER;"
  - id: set_current_packageset
    name: SET CURRENT PACKAGESET
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-set-current-packageset
    tier: low
    probes:
      - id: form_1
        sql: "SET CURRENT PACKAGESET = 'pkgs';"
  - id: set_current_query_optimization
    name: SET CURRENT QUERY OPTIMIZATION
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-set-current-query-optimization
    tier: low
    probes:
      - id: form_1
        sql: "SET CURRENT QUERY OPTIMIZATION = 5;"
  - id: set_current_refresh_age
    name: SET CURRENT REFRESH AGE
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-set-current-refresh-age
    tier: low
    probes:
      - id: form_1
        sql: "SET CURRENT REFRESH AGE = ANY;"
      - id: form_2
        sql: "SET CURRENT REFRESH AGE = 0;"
  - id: set_current_sql_ccflags
    name: SET CURRENT SQL_CCFLAGS
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-set-current-sql-ccflags
    tier: low
    probes:
      - id: form_1
        sql: "SET CURRENT SQL_CCFLAGS = 'debug:true,level:2';"
  - id: set_encryption_password
    name: SET ENCRYPTION PASSWORD
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-set-encryption-password
    tier: low
    probes:
      - id: form_1
        sql: "SET ENCRYPTION PASSWORD = 'secret1';"
  - id: set_event_monitor_state
    name: SET EVENT MONITOR STATE
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-set-event-monitor-state
    tier: low
    probes:
      - id: form_1
        sql: "SET EVENT MONITOR mon1 STATE = 1;"
      - id: form_2
        sql: "SET EVENT MONITOR mon1 STATE 0;"
  - id: set_passthru
    name: SET PASSTHRU
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-set-passthru
    tier: low
    probes:
      - id: form_1
        sql: "SET PASSTHRU srv1;"
      - id: form_2
        sql: "SET PASSTHRU RESET;"
  - id: set_server_option
    name: SET SERVER OPTION
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-set-server-option
    tier: low
    probes:
      - id: form_1
        sql: "SET SERVER OPTION TIMEOUT TO '30' FOR SERVER srv1;"
  - id: set_usage_list_state
    name: SET USAGE LIST STATE
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-set-usage-list-state
    tier: low
    probes:
      - id: form_1
        sql: "SET USAGE LIST ul1 STATE = ACTIVE;"
      - id: form_2
        sql: "SET USAGE LIST ul1 STATE = INACTIVE;"
  - id: whenever
    name: WHENEVER
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-whenever
    tier: low
    status: not-sql
    reason: Embedded-SQL precompiler directive (WHENEVER NOT FOUND/SQLERROR/SQLWARNING ... GOTO/CONTINUE/DO) handled by the host-language precompiler, not seen by the SQL parser.
