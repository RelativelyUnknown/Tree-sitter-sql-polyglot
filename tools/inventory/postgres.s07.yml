dialect: postgres
engine: PostgreSQL
version: "17"
source: https://www.postgresql.org/docs/17/sql-commands.html

statements:
  - id: drop_policy
    name: DROP POLICY
    doc: https://www.postgresql.org/docs/17/sql-droppolicy.html
    tier: medium
    probes:
      - id: basic
        sql: "DROP POLICY p ON t;"
      - id: if_exists
        sql: "DROP POLICY IF EXISTS p ON t;"
      - id: cascade
        sql: "DROP POLICY p ON t CASCADE;"
      - id: restrict
        sql: "DROP POLICY IF EXISTS p ON s.t RESTRICT;"
    examples:
      - "DROP POLICY p1 ON my_table;"

  - id: drop_role
    name: DROP ROLE
    doc: https://www.postgresql.org/docs/17/sql-droprole.html
    tier: medium
    probes:
      - id: basic
        sql: "DROP ROLE r;"
      - id: if_exists
        sql: "DROP ROLE IF EXISTS r;"
      - id: multiple
        sql: "DROP ROLE r1, r2, r3;"
      - id: if_exists_multiple
        sql: "DROP ROLE IF EXISTS r1, r2;"
    examples:
      - "DROP ROLE jonathan;"

  - id: drop_rule
    name: DROP RULE
    doc: https://www.postgresql.org/docs/17/sql-droprule.html
    tier: medium
    probes:
      - id: basic
        sql: "DROP RULE r ON t;"
      - id: if_exists
        sql: "DROP RULE IF EXISTS r ON t;"
      - id: cascade
        sql: "DROP RULE r ON t CASCADE;"
      - id: restrict
        sql: "DROP RULE IF EXISTS r ON s.t RESTRICT;"
    examples:
      - "DROP RULE newrule ON mytable;"

  - id: drop_sequence
    name: DROP SEQUENCE
    doc: https://www.postgresql.org/docs/17/sql-dropsequence.html
    tier: medium
    probes:
      - id: basic
        sql: "DROP SEQUENCE s;"
      - id: if_exists
        sql: "DROP SEQUENCE IF EXISTS s;"
      - id: multiple
        sql: "DROP SEQUENCE s1, s2;"
      - id: cascade
        sql: "DROP SEQUENCE s CASCADE;"
      - id: restrict
        sql: "DROP SEQUENCE IF EXISTS sch.s1, s2 RESTRICT;"
    examples:
      - "DROP SEQUENCE serial;"

  - id: drop_trigger
    name: DROP TRIGGER
    doc: https://www.postgresql.org/docs/17/sql-droptrigger.html
    tier: medium
    probes:
      - id: basic
        sql: "DROP TRIGGER trg ON t;"
      - id: if_exists
        sql: "DROP TRIGGER IF EXISTS trg ON t;"
      - id: cascade
        sql: "DROP TRIGGER trg ON t CASCADE;"
      - id: restrict
        sql: "DROP TRIGGER IF EXISTS trg ON s.t RESTRICT;"
    examples:
      - "DROP TRIGGER if_dist_exists ON films;"

  - id: drop_type
    name: DROP TYPE
    doc: https://www.postgresql.org/docs/17/sql-droptype.html
    tier: medium
    probes:
      - id: basic
        sql: "DROP TYPE ty;"
      - id: if_exists
        sql: "DROP TYPE IF EXISTS ty;"
      - id: multiple
        sql: "DROP TYPE ty1, s.ty2;"
      - id: cascade
        sql: "DROP TYPE ty CASCADE;"
      - id: restrict
        sql: "DROP TYPE IF EXISTS ty RESTRICT;"
    examples:
      - "DROP TYPE box;"

  - id: drop_user
    name: DROP USER
    doc: https://www.postgresql.org/docs/17/sql-dropuser.html
    tier: medium
    probes:
      - id: basic
        sql: "DROP USER u;"
      - id: if_exists
        sql: "DROP USER IF EXISTS u;"
      - id: multiple
        sql: "DROP USER u1, u2;"
      - id: if_exists_multiple
        sql: "DROP USER IF EXISTS u1, u2, u3;"

  - id: execute
    name: EXECUTE
    doc: https://www.postgresql.org/docs/17/sql-execute.html
    tier: medium
    probes:
      - id: no_parameters
        sql: "EXECUTE stmt;"
      - id: parameters
        sql: "EXECUTE stmt(1, 'a', true);"
      - id: expression_parameters
        sql: "EXECUTE stmt(1 + 2, current_date);"
    examples:
      - "EXECUTE usrrptplan(1, current_date);"

  - id: fetch
    name: FETCH
    doc: https://www.postgresql.org/docs/17/sql-fetch.html
    tier: medium
    probes:
      - id: cursor_only
        sql: "FETCH c;"
      - id: from_cursor
        sql: "FETCH FROM c;"
      - id: in_cursor
        sql: "FETCH IN c;"
      - id: next
        sql: "FETCH NEXT FROM c;"
      - id: prior
        sql: "FETCH PRIOR FROM c;"
      - id: first
        sql: "FETCH FIRST FROM c;"
      - id: last
        sql: "FETCH LAST IN c;"
      - id: absolute
        sql: "FETCH ABSOLUTE 5 FROM c;"
      - id: absolute_negative
        sql: "FETCH ABSOLUTE -1 FROM c;"
      - id: relative
        sql: "FETCH RELATIVE 2 FROM c;"
      - id: count
        sql: "FETCH 10 FROM c;"
      - id: all
        sql: "FETCH ALL FROM c;"
      - id: forward
        sql: "FETCH FORWARD FROM c;"
      - id: forward_count
        sql: "FETCH FORWARD 5 FROM c;"
      - id: forward_all
        sql: "FETCH FORWARD ALL IN c;"
      - id: backward
        sql: "FETCH BACKWARD FROM c;"
      - id: backward_count
        sql: "FETCH BACKWARD 5 FROM c;"
      - id: backward_all
        sql: "FETCH BACKWARD ALL FROM c;"
    examples:
      - "FETCH FORWARD 5 FROM liahona;"
      - "FETCH PRIOR FROM liahona;"

  - id: listen
    name: LISTEN
    doc: https://www.postgresql.org/docs/17/sql-listen.html
    tier: medium
    probes:
      - id: basic
        sql: "LISTEN ch;"
      - id: quoted_channel
        sql: 'LISTEN "My Channel";'
    examples:
      - "LISTEN virtual;"
