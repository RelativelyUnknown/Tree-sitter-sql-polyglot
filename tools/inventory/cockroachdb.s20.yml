dialect: cockroachdb
engine: CockroachDB
version: "v26.3 (stable)"
source: https://www.cockroachlabs.com/docs/stable/sql-statements

statements:
  - id: drop_sequence
    name: DROP SEQUENCE
    doc: https://www.cockroachlabs.com/docs/stable/drop-sequence
    tier: medium
    probes:
      - { id: basic, sql: "DROP SEQUENCE s;" }
      - { id: if_exists, sql: "DROP SEQUENCE IF EXISTS s;" }
      - { id: list, sql: "DROP SEQUENCE s1, s2;" }
      - { id: restrict, sql: "DROP SEQUENCE s RESTRICT;" }
    examples:
      - "DROP SEQUENCE even_numbers;"

  - id: drop_trigger
    name: DROP TRIGGER
    doc: https://www.cockroachlabs.com/docs/stable/drop-trigger
    tier: medium
    probes:
      - { id: basic, sql: "DROP TRIGGER trg ON t;" }
      - { id: qualified_table, sql: "DROP TRIGGER trg ON s.t;" }
    examples:
      - "DROP TRIGGER log_update_timestamp ON users;"

  - id: drop_type
    name: DROP TYPE
    doc: https://www.cockroachlabs.com/docs/stable/drop-type
    tier: medium
    probes:
      - { id: basic, sql: "DROP TYPE status;" }
      - { id: if_exists, sql: "DROP TYPE IF EXISTS status;" }
      - { id: list, sql: "DROP TYPE weekday, weekend;" }
      - { id: domain, sql: "DROP DOMAIN postal_code;" }
      - { id: domain_if_exists, sql: "DROP DOMAIN IF EXISTS postal_code;" }
    examples:
      - "DROP TYPE status;"
      - "DROP TYPE weekday, weekend;"
      - "DROP DOMAIN postal_code;"

  - id: refresh
    name: REFRESH
    doc: https://www.cockroachlabs.com/docs/stable/refresh
    tier: medium
    probes:
      - { id: basic, sql: "REFRESH MATERIALIZED VIEW v;" }
      - { id: concurrently, sql: "REFRESH MATERIALIZED VIEW CONCURRENTLY v;" }
      - { id: with_data, sql: "REFRESH MATERIALIZED VIEW v WITH DATA;" }
      - { id: with_no_data, sql: "REFRESH MATERIALIZED VIEW v WITH NO DATA;" }
      - { id: as_of_system_time, sql: "REFRESH MATERIALIZED VIEW v AS OF SYSTEM TIME '-10s';" }
    examples:
      - "REFRESH MATERIALIZED VIEW overdrawn_accounts;"

  - id: show_columns
    name: SHOW COLUMNS
    doc: https://www.cockroachlabs.com/docs/stable/show-columns
    tier: medium
    probes:
      - { id: basic, sql: "SHOW COLUMNS FROM t;" }
      - { id: with_comment, sql: "SHOW COLUMNS FROM t WITH COMMENT;" }
      - { id: qualified, sql: "SHOW COLUMNS FROM db.s.t;" }
    examples:
      - "SHOW COLUMNS FROM users;"
      - "SHOW COLUMNS FROM users WITH COMMENT;"

  - id: show_constraints
    name: SHOW CONSTRAINTS
    doc: https://www.cockroachlabs.com/docs/stable/show-constraints
    tier: medium
    probes:
      - { id: basic, sql: "SHOW CONSTRAINTS FROM t;" }
      - { id: with_comment, sql: "SHOW CONSTRAINTS FROM t WITH COMMENT;" }
      - { id: alias, sql: "SHOW CONSTRAINT FROM t;" }
    examples:
      - "SHOW CONSTRAINTS FROM orders;"

  - id: show_create
    name: SHOW CREATE
    doc: https://www.cockroachlabs.com/docs/stable/show-create
    tier: medium
    probes:
      - { id: object, sql: "SHOW CREATE t;" }
      - { id: table, sql: "SHOW CREATE TABLE t;" }
      - { id: view, sql: "SHOW CREATE VIEW v;" }
      - { id: sequence, sql: "SHOW CREATE SEQUENCE s;" }
      - { id: function, sql: "SHOW CREATE FUNCTION f;" }
      - { id: trigger, sql: "SHOW CREATE TRIGGER trg ON t;" }
      - { id: database, sql: "SHOW CREATE DATABASE d;" }
      - { id: all_tables, sql: "SHOW CREATE ALL TABLES;" }
      - { id: all_schemas, sql: "SHOW CREATE ALL SCHEMAS;" }
      - { id: all_types, sql: "SHOW CREATE ALL TYPES;" }
      - { id: with_redactable, sql: "SHOW CREATE TABLE t WITH REDACT;" }
    examples:
      - "SHOW CREATE TABLE drivers;"
      - "SHOW CREATE FUNCTION num_users;"
      - "SHOW CREATE TRIGGER log_update_timestamp ON users;"

  - id: show_databases
    name: SHOW DATABASES
    doc: https://www.cockroachlabs.com/docs/stable/show-databases
    tier: medium
    probes:
      - { id: basic, sql: "SHOW DATABASES;" }
      - { id: with_comment, sql: "SHOW DATABASES WITH COMMENT;" }
    examples:
      - "SHOW DATABASES;"
      - "SHOW DATABASES WITH COMMENT;"

  - id: show_enums
    name: SHOW ENUMS
    doc: https://www.cockroachlabs.com/docs/stable/show-enums
    tier: medium
    probes:
      - { id: basic, sql: "SHOW ENUMS;" }
      - { id: from_schema, sql: "SHOW ENUMS FROM s;" }
      - { id: from_db_schema, sql: "SHOW ENUMS FROM db.s;" }
    examples:
      - "SHOW ENUMS;"
      - "SHOW ENUMS FROM movr.public;"

  - id: show_index
    name: SHOW INDEX
    doc: https://www.cockroachlabs.com/docs/stable/show-index
    tier: medium
    probes:
      - { id: from_table, sql: "SHOW INDEX FROM t;" }
      - { id: indexes_from_table, sql: "SHOW INDEXES FROM t;" }
      - { id: keys_from_table, sql: "SHOW KEYS FROM t;" }
      - { id: from_database, sql: "SHOW INDEXES FROM DATABASE d;" }
      - { id: with_comment, sql: "SHOW INDEXES FROM t WITH COMMENT;" }
    examples:
      - "SHOW INDEX FROM users;"
      - "SHOW INDEXES FROM DATABASE movr;"
