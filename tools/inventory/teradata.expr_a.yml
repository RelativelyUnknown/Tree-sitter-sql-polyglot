      - { id: xbf, sql: "SELECT '7879'XBF;" }
      - { id: xbv, sql: "SELECT '7879'XBV;" }
      - { id: in_where, sql: "SELECT IDVal FROM bvalues WHERE CodeVal = '7879'XB;" }
    examples:
      - "INSERT bvalues (112193, '7879'XB) ;"
      - "SELECT IDVal FROM bvalues WHERE CodeVal = '7879'XB ;"

  - id: a_character_literals
