dialect: postgres
engine: PostgreSQL
version: "17"
source: https://www.postgresql.org/docs/17/sql-commands.html

statements:
  - id: select
    name: SELECT
    doc: https://www.postgresql.org/docs/17/sql-select.html
    tier: high
    probes:
      - { id: star, sql: "SELECT * FROM t;" }
      - { id: no_from, sql: "SELECT 1 + 1;" }
      - id: empty_select_list
        sql: "SELECT FROM t;"
        note: Compatibility section, "Empty SELECT Lists"; the output list may be empty.
      - { id: select_all, sql: "SELECT ALL c FROM t;" }
      - { id: distinct, sql: "SELECT DISTINCT c FROM t;" }
      - { id: distinct_on, sql: "SELECT DISTINCT ON (a) a, b FROM t ORDER BY a, b DESC;" }
      - { id: output_alias, sql: "SELECT a AS x, b y FROM t;" }
      - { id: qualified_star, sql: "SELECT t.*, u.c FROM t, u;" }
      - { id: from_only, sql: "SELECT * FROM ONLY t;" }
      - { id: from_table_star, sql: "SELECT * FROM t *;" }
      - { id: table_alias_columns, sql: "SELECT * FROM t AS x (a, b);" }
      - { id: tablesample_bernoulli, sql: "SELECT * FROM t TABLESAMPLE BERNOULLI (10);" }
      - { id: tablesample_system_repeatable, sql: "SELECT * FROM t TABLESAMPLE SYSTEM (10) REPEATABLE (42);" }
      - { id: subquery_alias, sql: "SELECT * FROM (SELECT 1, 2) AS s (a, b);" }
      - id: subquery_no_alias
        sql: "SELECT * FROM (SELECT 1);"
        note: The alias on a sub-SELECT in FROM is optional (from_item "( select ) [ [ AS ] alias ... ]").
      - { id: values_in_from, sql: "SELECT * FROM (VALUES (1, 'a'), (2, 'b')) AS v (n, s);" }
      - { id: lateral_subquery, sql: "SELECT * FROM t, LATERAL (SELECT * FROM u WHERE u.id = t.id) AS s;" }
      - { id: function_in_from, sql: "SELECT * FROM generate_series(1, 10) AS g (n);" }
      - { id: with_ordinality, sql: "SELECT * FROM unnest(ARRAY[1, 2]) WITH ORDINALITY AS u (v, n);" }
      - { id: function_alias_column_definition, sql: "SELECT * FROM f(1) AS x (a integer, b text);" }
      - { id: function_column_definition_no_alias, sql: "SELECT * FROM f(1) AS (a integer, b text);" }
      - { id: rows_from, sql: "SELECT * FROM ROWS FROM (generate_series(1, 3), unnest(ARRAY['a', 'b'])) WITH ORDINALITY AS r (a, b, n);" }
      - { id: rows_from_column_definition, sql: "SELECT * FROM ROWS FROM (f(1) AS (a integer, b text));" }
      - { id: lateral_function, sql: "SELECT * FROM t, LATERAL f(t.c) AS x;" }
      - { id: implicit_cross_join, sql: "SELECT * FROM t, u WHERE t.id = u.id;" }
      - { id: join, sql: "SELECT * FROM t JOIN u ON t.id = u.id;" }
      - { id: inner_join, sql: "SELECT * FROM t INNER JOIN u ON t.id = u.id;" }
      - { id: left_join, sql: "SELECT * FROM t LEFT JOIN u ON t.id = u.id;" }
      - { id: left_outer_join, sql: "SELECT * FROM t LEFT OUTER JOIN u ON t.id = u.id;" }
      - { id: right_outer_join, sql: "SELECT * FROM t RIGHT OUTER JOIN u ON t.id = u.id;" }
      - { id: full_outer_join, sql: "SELECT * FROM t FULL OUTER JOIN u ON t.id = u.id;" }
      - { id: full_join, sql: "SELECT * FROM t FULL JOIN u ON t.id = u.id;" }
      - { id: cross_join, sql: "SELECT * FROM t CROSS JOIN u;" }
      - { id: natural_join, sql: "SELECT * FROM t NATURAL JOIN u;" }
      - { id: natural_left_join, sql: "SELECT * FROM t NATURAL LEFT JOIN u;" }
      - { id: join_using, sql: "SELECT * FROM t JOIN u USING (id, k);" }
      - { id: join_using_alias, sql: "SELECT j.id FROM t JOIN u USING (id) AS j;" }
      - { id: left_join_lateral, sql: "SELECT * FROM t LEFT JOIN LATERAL f(t.c) AS x ON true;" }
      - { id: parenthesized_join, sql: "SELECT * FROM (t JOIN u ON t.id = u.id) JOIN v ON v.id = u.id;" }
      - { id: where, sql: "SELECT * FROM t WHERE a > 1 AND b IS NOT NULL;" }
      - { id: group_by, sql: "SELECT a, count(*) FROM t GROUP BY a;" }
      - { id: group_by_ordinal, sql: "SELECT a, count(*) FROM t GROUP BY 1;" }
      - { id: group_by_empty_set, sql: "SELECT count(*) FROM t GROUP BY ();" }
      - { id: group_by_rollup, sql: "SELECT a, b, sum(c) FROM t GROUP BY ROLLUP (a, b);" }
      - { id: group_by_cube, sql: "SELECT a, b, sum(c) FROM t GROUP BY CUBE (a, (b, c));" }
      - { id: group_by_grouping_sets, sql: "SELECT a, b, sum(c) FROM t GROUP BY GROUPING SETS ((a), (b), ());" }
      - { id: group_by_mixed, sql: "SELECT a, b, c, sum(d) FROM t GROUP BY a, CUBE (b, c), GROUPING SETS ((a), (b));" }
      - { id: group_by_distinct, sql: "SELECT a, b, c FROM t GROUP BY DISTINCT ROLLUP (a, b), ROLLUP (a, c);" }
      - { id: group_by_all_quantifier, sql: "SELECT a, b FROM t GROUP BY ALL ROLLUP (a, b);" }
      - { id: having, sql: "SELECT a, sum(b) FROM t GROUP BY a HAVING sum(b) > 10;" }
      - { id: having_no_group_by, sql: "SELECT sum(b) FROM t HAVING sum(b) > 10;" }
      - { id: window_clause, sql: "SELECT sum(c) OVER w FROM t WINDOW w AS (PARTITION BY a ORDER BY b);" }
      - { id: window_clause_existing_window, sql: "SELECT sum(c) OVER w2 FROM t WINDOW w1 AS (PARTITION BY a), w2 AS (w1 ORDER BY b);" }
      - { id: frame_rows_between, sql: "SELECT sum(c) OVER (ORDER BY b ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) FROM t;" }
      - { id: frame_rows_start_only, sql: "SELECT sum(c) OVER (ORDER BY b ROWS 2 PRECEDING) FROM t;" }
      - { id: frame_range_offset, sql: "SELECT sum(c) OVER (ORDER BY d RANGE BETWEEN INTERVAL '1 day' PRECEDING AND INTERVAL '1 day' FOLLOWING) FROM t;" }
      - { id: frame_groups, sql: "SELECT sum(c) OVER (ORDER BY b GROUPS BETWEEN 1 PRECEDING AND UNBOUNDED FOLLOWING) FROM t;" }
      - { id: frame_exclude_current_row, sql: "SELECT sum(c) OVER (ORDER BY b ROWS BETWEEN 1 PRECEDING AND 1 FOLLOWING EXCLUDE CURRENT ROW) FROM t;" }
      - { id: frame_exclude_group, sql: "SELECT sum(c) OVER (ORDER BY b RANGE BETWEEN CURRENT ROW AND UNBOUNDED FOLLOWING EXCLUDE GROUP) FROM t;" }
      - { id: frame_exclude_ties, sql: "SELECT sum(c) OVER (ORDER BY b GROUPS 1 PRECEDING EXCLUDE TIES) FROM t;" }
      - { id: frame_exclude_no_others, sql: "SELECT sum(c) OVER (ORDER BY b ROWS UNBOUNDED PRECEDING EXCLUDE NO OTHERS) FROM t;" }
      - { id: union, sql: "SELECT a FROM t UNION SELECT a FROM u;" }
      - { id: union_all, sql: "SELECT a FROM t UNION ALL SELECT a FROM u;" }
      - { id: union_distinct, sql: "SELECT a FROM t UNION DISTINCT SELECT a FROM u;" }
      - { id: intersect, sql: "SELECT a FROM t INTERSECT SELECT a FROM u;" }
      - { id: intersect_all, sql: "SELECT a FROM t INTERSECT ALL SELECT a FROM u;" }
      - { id: except, sql: "SELECT a FROM t EXCEPT SELECT a FROM u;" }
      - { id: except_all, sql: "SELECT a FROM t EXCEPT ALL SELECT a FROM u;" }
      - { id: parenthesized_set_operation, sql: "(SELECT a FROM t ORDER BY a LIMIT 1) UNION ALL (SELECT a FROM u) ORDER BY 1;" }
      - { id: order_by_asc_desc, sql: "SELECT * FROM t ORDER BY a ASC, b DESC;" }
      - { id: order_by_nulls, sql: "SELECT * FROM t ORDER BY a NULLS FIRST, b DESC NULLS LAST;" }
      - { id: order_by_using, sql: "SELECT * FROM t ORDER BY a USING >;" }
      - { id: order_by_ordinal, sql: "SELECT a, b FROM t ORDER BY 2;" }
      - { id: limit, sql: "SELECT * FROM t LIMIT 10;" }
      - { id: limit_all, sql: "SELECT * FROM t LIMIT ALL;" }
      - { id: limit_offset, sql: "SELECT * FROM t ORDER BY a LIMIT 10 OFFSET 20;" }
      - { id: offset_rows, sql: "SELECT * FROM t ORDER BY a OFFSET 5 ROWS;" }
      - { id: fetch_first_only, sql: "SELECT * FROM t ORDER BY a FETCH FIRST 10 ROWS ONLY;" }
      - { id: fetch_next_row_no_count, sql: "SELECT * FROM t ORDER BY a OFFSET 1 ROW FETCH NEXT ROW ONLY;" }
      - { id: fetch_with_ties, sql: "SELECT * FROM t ORDER BY a FETCH FIRST 3 ROWS WITH TIES;" }
      - { id: for_update, sql: "SELECT * FROM t FOR UPDATE;" }
      - { id: for_no_key_update, sql: "SELECT * FROM t FOR NO KEY UPDATE;" }
      - { id: for_share, sql: "SELECT * FROM t FOR SHARE;" }
      - { id: for_key_share, sql: "SELECT * FROM t FOR KEY SHARE;" }
      - { id: for_update_of_nowait, sql: "SELECT * FROM t JOIN u ON t.id = u.id FOR UPDATE OF t, u NOWAIT;" }
      - { id: for_share_skip_locked, sql: "SELECT * FROM t FOR SHARE SKIP LOCKED;" }
      - { id: multiple_locking_clauses, sql: "SELECT * FROM t JOIN u ON t.id = u.id FOR UPDATE OF t FOR SHARE OF u;" }
      - { id: with_cte, sql: "WITH s AS (SELECT a FROM t) SELECT * FROM s;" }
      - { id: with_column_list, sql: "WITH s (x, y) AS (SELECT a, b FROM t) SELECT x FROM s;" }
      - { id: with_multiple, sql: "WITH s AS (SELECT 1 AS a), r AS (SELECT a FROM s) SELECT * FROM r;" }
      - { id: with_materialized, sql: "WITH s AS MATERIALIZED (SELECT a FROM t) SELECT * FROM s;" }
      - { id: with_not_materialized, sql: "WITH s AS NOT MATERIALIZED (SELECT a FROM t) SELECT * FROM s WHERE a = 1;" }
      - { id: with_values, sql: "WITH v (a, b) AS (VALUES (1, 2), (3, 4)) SELECT * FROM v;" }
      - { id: with_recursive, sql: "WITH RECURSIVE r (n) AS (SELECT 1 UNION ALL SELECT n + 1 FROM r WHERE n < 10) SELECT n FROM r;" }
      - { id: with_recursive_search_depth, sql: "WITH RECURSIVE r (id, p) AS (SELECT id, p FROM t WHERE p IS NULL UNION ALL SELECT t.id, t.p FROM t JOIN r ON t.p = r.id) SEARCH DEPTH FIRST BY id SET ordercol SELECT * FROM r ORDER BY ordercol;" }
      - { id: with_recursive_search_breadth, sql: "WITH RECURSIVE r (id, p) AS (SELECT id, p FROM t WHERE p IS NULL UNION ALL SELECT t.id, t.p FROM t JOIN r ON t.p = r.id) SEARCH BREADTH FIRST BY id SET ordercol SELECT * FROM r ORDER BY ordercol;" }
      - { id: with_recursive_cycle, sql: "WITH RECURSIVE r (id, p) AS (SELECT id, p FROM t UNION ALL SELECT t.id, t.p FROM t JOIN r ON t.p = r.id) CYCLE id SET is_cycle USING path SELECT * FROM r;" }
      - { id: with_recursive_cycle_to_default, sql: "WITH RECURSIVE r (id, p) AS (SELECT id, p FROM t UNION ALL SELECT t.id, t.p FROM t JOIN r ON t.p = r.id) CYCLE id SET is_cycle TO 'Y' DEFAULT 'N' USING path SELECT * FROM r;" }
      - { id: with_insert_returning, sql: "WITH ins AS (INSERT INTO t (a) VALUES (1) RETURNING id) SELECT id FROM ins;" }
      - { id: with_update_returning, sql: "WITH upd AS (UPDATE t SET a = a + 1 RETURNING *) SELECT * FROM upd;" }
      - { id: with_delete_returning, sql: "WITH moved AS (DELETE FROM t WHERE a < 0 RETURNING *) INSERT INTO u SELECT * FROM moved;" }
      - { id: with_merge_returning, sql: "WITH m AS (MERGE INTO t USING s ON t.id = s.id WHEN MATCHED THEN DELETE RETURNING t.*) SELECT * FROM m;" }
      - { id: table_command, sql: "TABLE t;" }
      - { id: table_command_only, sql: "TABLE ONLY t;" }
    examples:
      - |-
        SELECT f.title, f.did, d.name, f.date_prod, f.kind
            FROM distributors d JOIN films f USING (did);
      - |-
        SELECT kind, sum(len) AS total
            FROM films
            GROUP BY kind
            HAVING sum(len) < interval '5 hours';
      - "SELECT * FROM unnest(ARRAY['a','b','c','d','e','f']) WITH ORDINALITY;"
      - |-
        WITH RECURSIVE employee_recursive(distance, employee_name, manager_name) AS (
            SELECT 1, employee_name, manager_name
            FROM employee
            WHERE manager_name = 'Mary'
          UNION ALL
            SELECT er.distance + 1, e.employee_name, e.manager_name
            FROM employee_recursive er, employee e
            WHERE er.employee_name = e.manager_name
          )
        SELECT distance, employee_name FROM employee_recursive;
      - |-
        SELECT m.name AS mname, pname
        FROM manufacturers m LEFT JOIN LATERAL get_product_names(m.id) pname ON true;

  - id: select_into
    name: SELECT INTO
    doc: https://www.postgresql.org/docs/17/sql-selectinto.html
    tier: medium
    probes:
      - { id: basic, sql: "SELECT * INTO t2 FROM t WHERE a > 0;" }
      - { id: temporary_table, sql: "SELECT a, b INTO TEMPORARY TABLE t2 FROM t;" }
      - { id: temp, sql: "SELECT a INTO TEMP t2 FROM t;" }
      - { id: unlogged, sql: "SELECT a INTO UNLOGGED t2 FROM t;" }
      - { id: with_cte_order_limit, sql: "WITH s AS (SELECT a FROM t) SELECT a INTO t2 FROM s ORDER BY a LIMIT 10;" }
    examples:
      - "SELECT * INTO films_recent FROM films WHERE date_prod >= '2002-01-01';"

  - id: values
    name: VALUES
    doc: https://www.postgresql.org/docs/17/sql-values.html
    tier: high
    probes:
      - { id: single_row, sql: "VALUES (1, 'one');" }
      - { id: multi_row, sql: "VALUES (1, 'one'), (2, 'two'), (3, 'three');" }
      - { id: order_by, sql: "VALUES (1, 'one'), (2, 'two') ORDER BY 1 DESC;" }
      - { id: order_by_using, sql: "VALUES (1), (2) ORDER BY column1 USING <;" }
      - { id: limit_offset, sql: "VALUES (1), (2), (3) LIMIT 2 OFFSET 1;" }
      - { id: limit_all, sql: "VALUES (1), (2) LIMIT ALL;" }
      - { id: offset_rows_fetch, sql: "VALUES (1), (2), (3) OFFSET 1 ROWS FETCH FIRST 1 ROW ONLY;" }
      - { id: fetch_next_no_count, sql: "VALUES (1), (2) FETCH NEXT ROWS ONLY;" }
      - { id: in_from_with_alias, sql: "SELECT * FROM (VALUES (1, 'a')) AS v (n, s);" }
      - { id: in_predicate, sql: "SELECT * FROM t WHERE c IN (VALUES (1), (2));" }
      - { id: union_with_select, sql: "VALUES (1) UNION ALL SELECT 2;" }
    examples:
      - "VALUES (1, 'one'), (2, 'two'), (3, 'three');"
      - |-
        SELECT 1 AS column1, 'one' AS column2
        UNION ALL
        SELECT 2, 'two'
        UNION ALL
        SELECT 3, 'three';
      - |-
        INSERT INTO films VALUES
            ('UA502', 'Bananas', 105, DEFAULT, 'Comedy', '82 minutes'),
            ('T_601', 'Yojimbo', 106, DEFAULT, 'Drama', DEFAULT);
      - |-
        UPDATE employees SET salary = salary * v.increase
          FROM (VALUES(1, 200000, 1.2), (2, 400000, 1.4)) AS v (depno, target, increase)
          WHERE employees.depno = v.depno AND employees.sales >= v.target;
      - |-
        SELECT * FROM machines
        WHERE ip_address IN (VALUES('192.168.0.1'::inet), ('192.168.0.10'), ('192.168.1.43'));

  - id: insert
    name: INSERT
    doc: https://www.postgresql.org/docs/17/sql-insert.html
    tier: high
    probes:
      - { id: values, sql: "INSERT INTO t VALUES (1, 'a');" }
      - { id: column_list, sql: "INSERT INTO t (a, b) VALUES (1, 'a');" }
      - { id: multi_row_values, sql: "INSERT INTO t (a, b) VALUES (1, 'a'), (2, 'b');" }
      - { id: default_in_values, sql: "INSERT INTO t (a, b) VALUES (DEFAULT, 'a');" }
      - { id: default_values, sql: "INSERT INTO t DEFAULT VALUES;" }
      - { id: query, sql: "INSERT INTO t SELECT * FROM u WHERE a > 0;" }
      - { id: query_table_command, sql: "INSERT INTO t TABLE u;" }
      - { id: table_alias, sql: "INSERT INTO t AS x (a) VALUES (1);" }
      - { id: subscripted_target_column, sql: "INSERT INTO t (a, arr[1:3]) VALUES (1, '{1,2,3}');" }
      - { id: field_target_column, sql: "INSERT INTO t (a, comp.f1) VALUES (1, 2);" }
      - { id: overriding_system_value, sql: "INSERT INTO t (id, a) OVERRIDING SYSTEM VALUE VALUES (1, 'a');" }
      - { id: overriding_user_value, sql: "INSERT INTO t (id, a) OVERRIDING USER VALUE SELECT id, a FROM u;" }
      - { id: with_cte, sql: "WITH s AS (SELECT a FROM u) INSERT INTO t (a) SELECT a FROM s;" }
      - { id: returning_star, sql: "INSERT INTO t (a) VALUES (1) RETURNING *;" }
      - { id: returning_expressions, sql: "INSERT INTO t (a) VALUES (1) RETURNING id, a * 2 AS doubled, a d;" }
      - { id: on_conflict_do_nothing, sql: "INSERT INTO t (a) VALUES (1) ON CONFLICT DO NOTHING;" }
      - { id: on_conflict_target_do_nothing, sql: "INSERT INTO t (a) VALUES (1) ON CONFLICT (a) DO NOTHING;" }
      - { id: on_conflict_expression_target, sql: "INSERT INTO t (a, b) VALUES (1, 'x') ON CONFLICT ((lower(b))) DO NOTHING;" }
      - { id: on_conflict_target_collate_opclass, sql: "INSERT INTO t (b) VALUES ('x') ON CONFLICT (b COLLATE \"C\" text_pattern_ops) DO NOTHING;" }
      - { id: on_conflict_target_where, sql: "INSERT INTO t (a) VALUES (1) ON CONFLICT (a) WHERE is_active DO NOTHING;" }
      - { id: on_conflict_on_constraint, sql: "INSERT INTO t (a) VALUES (1) ON CONFLICT ON CONSTRAINT t_pkey DO NOTHING;" }
      - { id: on_conflict_do_update, sql: "INSERT INTO t (a, b) VALUES (1, 'x') ON CONFLICT (a) DO UPDATE SET b = EXCLUDED.b;" }
      - { id: do_update_set_default, sql: "INSERT INTO t (a, b) VALUES (1, 'x') ON CONFLICT (a) DO UPDATE SET b = DEFAULT;" }
      - { id: do_update_multi_column_row, sql: "INSERT INTO t (a, b, c) VALUES (1, 'x', 2) ON CONFLICT (a) DO UPDATE SET (b, c) = ROW (EXCLUDED.b, EXCLUDED.c);" }
      - { id: do_update_multi_column, sql: "INSERT INTO t (a, b, c) VALUES (1, 'x', 2) ON CONFLICT (a) DO UPDATE SET (b, c) = (EXCLUDED.b, DEFAULT);" }
      - { id: do_update_multi_column_subselect, sql: "INSERT INTO t (a, b, c) VALUES (1, 'x', 2) ON CONFLICT (a) DO UPDATE SET (b, c) = (SELECT b, c FROM u WHERE u.a = t.a);" }
      - { id: do_update_where, sql: "INSERT INTO t AS x (a, b) VALUES (1, 'x') ON CONFLICT (a) DO UPDATE SET b = EXCLUDED.b WHERE x.b <> EXCLUDED.b;" }
      - { id: on_conflict_returning, sql: "INSERT INTO t (a, b) VALUES (1, 'x') ON CONFLICT (a) DO UPDATE SET b = EXCLUDED.b RETURNING *;" }
    examples:
      - |-
        INSERT INTO films (code, title, did, date_prod, kind)
            VALUES ('T_601', 'Yojimbo', 106, '1961-06-16', 'Drama');
      - "INSERT INTO films DEFAULT VALUES;"
      - "INSERT INTO films SELECT * FROM tmp_films WHERE date_prod < '2004-05-07';"
      - |-
        INSERT INTO distributors (did, dname)
            VALUES (5, 'Gizmo Transglobal'), (6, 'Associated Computing, Inc')
            ON CONFLICT (did) DO UPDATE SET dname = EXCLUDED.dname;
      - |-
        INSERT INTO distributors AS d (did, dname) VALUES (8, 'Anvil Distribution')
            ON CONFLICT (did) DO UPDATE
            SET dname = EXCLUDED.dname || ' (formerly ' || d.dname || ')'
            WHERE d.zipcode <> '21201';

  - id: update
    name: UPDATE
    doc: https://www.postgresql.org/docs/17/sql-update.html
    tier: high
    probes:
      - { id: basic, sql: "UPDATE t SET a = 1 WHERE b = 2;" }
      - { id: multiple_columns, sql: "UPDATE t SET a = a + 1, b = 'x';" }
      - { id: set_default, sql: "UPDATE t SET a = DEFAULT;" }
      - { id: only, sql: "UPDATE ONLY t SET a = 1;" }
      - { id: table_star, sql: "UPDATE t * SET a = 1;" }
      - { id: alias_as, sql: "UPDATE t AS x SET a = 1 WHERE x.b = 2;" }
      - { id: alias_bare, sql: "UPDATE t x SET a = 1 WHERE x.b = 2;" }
      - { id: multi_column_assignment, sql: "UPDATE t SET (a, b) = (1, DEFAULT);" }
      - { id: multi_column_row, sql: "UPDATE t SET (a, b) = ROW (1, 2);" }
      - { id: multi_column_subselect, sql: "UPDATE t SET (a, b) = (SELECT x, y FROM u WHERE u.id = t.id);" }
      - { id: subscript_target, sql: "UPDATE t SET arr[1] = 5, arr[2:3] = '{6,7}';" }
      - { id: field_target, sql: "UPDATE t SET comp.f1 = 1;" }
      - { id: from, sql: "UPDATE t SET a = u.a FROM u WHERE t.id = u.id;" }
      - { id: from_multiple, sql: "UPDATE t SET a = u.a FROM u JOIN v ON u.id = v.id, w WHERE t.id = u.id;" }
      - { id: where_current_of, sql: "UPDATE t SET a = 1 WHERE CURRENT OF c;" }
      - { id: returning_star, sql: "UPDATE t SET a = 1 RETURNING *;" }
      - { id: returning_expressions, sql: "UPDATE t SET a = 1 RETURNING id, a AS new_a;" }
      - { id: with_cte, sql: "WITH s AS (SELECT id FROM u) UPDATE t SET a = 1 FROM s WHERE t.id = s.id;" }
      - { id: with_recursive, sql: "WITH RECURSIVE r (id) AS (SELECT 1 UNION ALL SELECT id + 1 FROM r WHERE id < 5) UPDATE t SET a = 0 WHERE id IN (SELECT id FROM r);" }
    examples:
      - "UPDATE films SET kind = 'Dramatic' WHERE kind = 'Drama';"
      - |-
        UPDATE weather SET temp_lo = temp_lo+1, temp_hi = temp_lo+15, prcp = DEFAULT
          WHERE city = 'San Francisco' AND date = '2003-07-03'
          RETURNING temp_lo, temp_hi, prcp;
      - |-
        UPDATE weather SET (temp_lo, temp_hi, prcp) = (temp_lo+1, temp_lo+15, DEFAULT)
          WHERE city = 'San Francisco' AND date = '2003-07-03';
      - |-
        UPDATE accounts SET (contact_first_name, contact_last_name) =
            (SELECT first_name, last_name FROM employees
             WHERE employees.id = accounts.sales_person);
      - |-
        WITH exceeded_max_retries AS (
          SELECT w.ctid FROM work_item AS w
            WHERE w.status = 'active' AND w.num_retries > 10
            ORDER BY w.retry_timestamp
            FOR UPDATE
            LIMIT 5000
        )
        UPDATE work_item SET status = 'failed'
          FROM exceeded_max_retries AS emr
          WHERE work_item.ctid = emr.ctid;

  - id: delete
    name: DELETE
    doc: https://www.postgresql.org/docs/17/sql-delete.html
    tier: high
    probes:
      - { id: all_rows, sql: "DELETE FROM t;" }
      - { id: where, sql: "DELETE FROM t WHERE a <> 'x';" }
      - { id: only, sql: "DELETE FROM ONLY t WHERE a = 1;" }
      - { id: table_star, sql: "DELETE FROM t * WHERE a = 1;" }
      - { id: alias_as, sql: "DELETE FROM t AS x WHERE x.a = 1;" }
      - { id: alias_bare, sql: "DELETE FROM t x WHERE x.a = 1;" }
      - { id: using, sql: "DELETE FROM t USING u WHERE t.id = u.id AND u.flag;" }
      - { id: using_multiple, sql: "DELETE FROM t USING u JOIN v ON u.id = v.id, w WHERE t.id = u.id;" }
      - { id: where_current_of, sql: "DELETE FROM t WHERE CURRENT OF c;" }
      - { id: returning_star, sql: "DELETE FROM t WHERE a = 1 RETURNING *;" }
      - { id: returning_expressions, sql: "DELETE FROM t WHERE a = 1 RETURNING id, a AS old_a;" }
      - { id: with_cte, sql: "WITH s AS (SELECT id FROM u) DELETE FROM t WHERE id IN (SELECT id FROM s);" }
    examples:
      - "DELETE FROM films WHERE kind <> 'Musical';"
      - "DELETE FROM films;"
      - "DELETE FROM tasks WHERE status = 'DONE' RETURNING *;"
      - "DELETE FROM tasks WHERE CURRENT OF c_tasks;"
      - |-
        WITH delete_batch AS (
          SELECT l.ctid FROM user_logs AS l
            WHERE l.status = 'archived'
            ORDER BY l.creation_date
            FOR UPDATE
            LIMIT 10000
        )
        DELETE FROM user_logs AS dl
          USING delete_batch AS del
