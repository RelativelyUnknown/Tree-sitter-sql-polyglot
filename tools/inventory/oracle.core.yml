  - id: create_materialized_view
    name: CREATE MATERIALIZED VIEW
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/CREATE-MATERIALIZED-VIEW.html
    tier: high
    probes:
      - id: basic
        sql: "CREATE MATERIALIZED VIEW mv AS SELECT * FROM t;"
      - id: if_not_exists
        sql: "CREATE MATERIALIZED VIEW IF NOT EXISTS s.mv AS SELECT c FROM t;"
      - id: column_aliases
        sql: "CREATE MATERIALIZED VIEW mv (a, b) AS SELECT c, d FROM t;"
      - id: column_alias_encrypt
        sql: "CREATE MATERIALIZED VIEW mv (a ENCRYPT, b) AS SELECT c, d FROM t;"
      - id: of_object_type
        sql: "CREATE MATERIALIZED VIEW mv OF s.person_t AS SELECT * FROM persons;"
      - id: on_prebuilt_table
        sql: "CREATE MATERIALIZED VIEW mv ON PREBUILT TABLE WITH REDUCED PRECISION ENABLE QUERY REWRITE AS SELECT c, SUM(d) AS s FROM t GROUP BY c;"
      - id: physical_properties
        sql: "CREATE MATERIALIZED VIEW mv PCTFREE 5 PCTUSED 60 TABLESPACE users STORAGE (INITIAL 50K) AS SELECT * FROM t;"
      - id: build_immediate_refresh_complete
        sql: "CREATE MATERIALIZED VIEW mv TABLESPACE users PARALLEL 4 BUILD IMMEDIATE REFRESH COMPLETE ENABLE QUERY REWRITE AS SELECT c, SUM(d) s FROM t GROUP BY c;"
      - id: build_deferred
        sql: "CREATE MATERIALIZED VIEW mv BUILD DEFERRED REFRESH FORCE ON DEMAND AS SELECT * FROM t;"
      - id: refresh_fast_on_commit
        sql: "CREATE MATERIALIZED VIEW mv REFRESH FAST ON COMMIT AS SELECT c, COUNT(*) n FROM t GROUP BY c;"
      - id: refresh_on_statement
        sql: "CREATE MATERIALIZED VIEW mv REFRESH FAST ON STATEMENT AS SELECT t.c, u.d FROM t, u WHERE t.id = u.id;"
      - id: refresh_start_with_next
        sql: "CREATE MATERIALIZED VIEW mv REFRESH FAST START WITH SYSDATE NEXT SYSDATE + 1/4096 WITH PRIMARY KEY AS SELECT * FROM t;"
      - id: refresh_with_rowid
        sql: "CREATE MATERIALIZED VIEW mv REFRESH WITH ROWID AS SELECT * FROM t;"
      - id: refresh_using_trusted_constraints
        sql: "CREATE MATERIALIZED VIEW mv REFRESH COMPLETE USING TRUSTED CONSTRAINTS AS SELECT * FROM t;"
      - id: never_refresh
        sql: "CREATE MATERIALIZED VIEW mv NEVER REFRESH AS SELECT * FROM t;"
      - id: using_index
        sql: "CREATE MATERIALIZED VIEW mv USING INDEX TABLESPACE idx_ts STORAGE (INITIAL 25K) AS SELECT * FROM t;"
      - id: using_no_index
        sql: "CREATE MATERIALIZED VIEW mv USING NO INDEX AS SELECT * FROM t;"
      - id: partitioned
        sql: "CREATE MATERIALIZED VIEW mv PARTITION BY RANGE (d) (PARTITION p1 VALUES LESS THAN (DATE '2024-01-01'), PARTITION p2 VALUES LESS THAN (MAXVALUE)) AS SELECT d, SUM(c) s FROM t GROUP BY d;"
      - id: cache_nologging_compress
        sql: "CREATE MATERIALIZED VIEW mv NOLOGGING COMPRESS CACHE AS SELECT * FROM t;"
      - id: on_query_computation
        sql: "CREATE MATERIALIZED VIEW mv REFRESH FAST ON DEMAND ENABLE ON QUERY COMPUTATION ENABLE QUERY REWRITE AS SELECT c, COUNT(*) n FROM t GROUP BY c;"
      - id: concurrent_refresh
        sql: "CREATE MATERIALIZED VIEW mv REFRESH FAST ON COMMIT ENABLE CONCURRENT REFRESH AS SELECT c, COUNT(*) n FROM t GROUP BY c;"
      - id: disable_query_rewrite
        sql: "CREATE MATERIALIZED VIEW mv DISABLE QUERY REWRITE AS SELECT * FROM t;"
      - id: evaluate_using
        sql: "CREATE MATERIALIZED VIEW mv EVALUATE USING CURRENT EDITION AS SELECT * FROM t;"
      - id: default_collation
        sql: "CREATE MATERIALIZED VIEW mv DEFAULT COLLATION BINARY_CI AS SELECT * FROM t;"
      - id: annotations
        sql: "CREATE MATERIALIZED VIEW mv (c ANNOTATIONS (Hidden)) ANNOTATIONS (Title 'MV', ADD Snapshot) AS SELECT c FROM t;"
      - id: remote_source
        sql: "CREATE MATERIALIZED VIEW mv AS SELECT * FROM s.t@remote x WHERE EXISTS (SELECT * FROM s.u@remote y WHERE y.id = x.id);"
    examples:
      - "CREATE MATERIALIZED VIEW mv1 AS SELECT * FROM hr.employees;"
      - |-
        CREATE MATERIALIZED VIEW sales_by_month_by_state
             TABLESPACE example
             PARALLEL 4
             BUILD IMMEDIATE
             REFRESH COMPLETE
             ENABLE QUERY REWRITE
             AS SELECT t.calendar_month_desc, c.cust_state_province,
                SUM(s.amount_sold) AS sum_sales
                FROM times t, sales s, customers c
                WHERE s.time_id = t.time_id AND s.cust_id = c.cust_id
                GROUP BY t.calendar_month_desc, c.cust_state_province;
      - |-
        CREATE MATERIALIZED VIEW catalog
           REFRESH FAST START WITH SYSDATE NEXT SYSDATE + 1/4096
           WITH PRIMARY KEY
           AS SELECT * FROM product_information;
      - |-
        CREATE MATERIALIZED VIEW all_customers
           PCTFREE 5 PCTUSED 60
           TABLESPACE example
           STORAGE (INITIAL 50K)
           USING INDEX STORAGE (INITIAL 25K)
           REFRESH START WITH ROUND(SYSDATE + 1) + 11/24
           NEXT NEXT_DAY(TRUNC(SYSDATE), 'MONDAY') + 15/24
           AS SELECT * FROM sh.customers@remote
                 UNION
              SELECT * FROM sh.customers@local;
      - |-
        CREATE MATERIALIZED VIEW sales_sum_table
           ON PREBUILT TABLE WITH REDUCED PRECISION
           ENABLE QUERY REWRITE
           AS SELECT t.calendar_month_desc AS month,
                     c.cust_state_province AS state,
                     SUM(s.amount_sold) AS sales
              FROM times t, customers c, sales s
              WHERE s.time_id = t.time_id AND s.cust_id = c.cust_id
              GROUP BY t.calendar_month_desc, c.cust_state_province;

