  - id: alter_index
    name: "ALTER INDEX"
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/alter-index-transact-sql
    tier: high
    probes:
      - id: rebuild
        sql: "ALTER INDEX ix ON t REBUILD;"
      - id: rebuild_all
        sql: "ALTER INDEX ALL ON dbo.t REBUILD;"
      - id: rebuild_with_options
        sql: "ALTER INDEX ALL ON t REBUILD WITH (FILLFACTOR = 80, SORT_IN_TEMPDB = ON, STATISTICS_NORECOMPUTE = ON, PAD_INDEX = ON, IGNORE_DUP_KEY = OFF, STATISTICS_INCREMENTAL = OFF, ALLOW_ROW_LOCKS = ON, ALLOW_PAGE_LOCKS = ON, MAXDOP = 4);"
      - id: rebuild_online_low_priority
        sql: "ALTER INDEX ix ON t REBUILD WITH (ONLINE = ON (WAIT_AT_LOW_PRIORITY (MAX_DURATION = 10 MINUTES, ABORT_AFTER_WAIT = SELF)));"
      - id: rebuild_resumable
        sql: "ALTER INDEX ix ON t REBUILD WITH (ONLINE = ON, RESUMABLE = ON, MAX_DURATION = 240);"
      - id: rebuild_partition_all
        sql: "ALTER INDEX ix ON t REBUILD PARTITION = ALL WITH (DATA_COMPRESSION = PAGE ON PARTITIONS (1, 3 TO 5));"
      - id: rebuild_single_partition
        sql: "ALTER INDEX ix ON t REBUILD PARTITION = 5 WITH (ONLINE = ON (WAIT_AT_LOW_PRIORITY (MAX_DURATION = 10 MINUTES, ABORT_AFTER_WAIT = SELF)));"
      - id: rebuild_columnstore_archive
        sql: "ALTER INDEX cci ON t REBUILD WITH (DATA_COMPRESSION = COLUMNSTORE_ARCHIVE);"
      - id: rebuild_xml_compression
        sql: "ALTER INDEX ix ON t REBUILD WITH (XML_COMPRESSION = ON);"
      - id: disable
        sql: "ALTER INDEX ix ON t DISABLE;"
      - id: reorganize
        sql: "ALTER INDEX ix ON t REORGANIZE;"
      - id: reorganize_partition_options
        sql: "ALTER INDEX cci ON t REORGANIZE PARTITION = 0 WITH (COMPRESS_ALL_ROW_GROUPS = ON);"
      - id: reorganize_lob_compaction
        sql: "ALTER INDEX ix ON t REORGANIZE WITH (LOB_COMPACTION = ON);"
      - id: set_options
        sql: "ALTER INDEX ix ON t SET (STATISTICS_NORECOMPUTE = ON, IGNORE_DUP_KEY = ON, ALLOW_PAGE_LOCKS = ON, ALLOW_ROW_LOCKS = OFF, OPTIMIZE_FOR_SEQUENTIAL_KEY = ON);"
      - id: set_compression_delay
        sql: "ALTER INDEX cci ON t SET (COMPRESSION_DELAY = 30 MINUTES);"
      - id: resume
        sql: "ALTER INDEX ix ON t RESUME;"
      - id: resume_with_options
        sql: "ALTER INDEX ix ON t RESUME WITH (MAXDOP = 2, MAX_DURATION = 240 MINUTES, WAIT_AT_LOW_PRIORITY (MAX_DURATION = 10, ABORT_AFTER_WAIT = BLOCKERS));"
      - id: pause
        sql: "ALTER INDEX ix ON t PAUSE;"
      - id: abort
        sql: "ALTER INDEX ix ON t ABORT;"
    examples:
      - |-
        ALTER INDEX ALL ON Production.Product
        REBUILD WITH (FILLFACTOR = 80, SORT_IN_TEMPDB = ON, STATISTICS_NORECOMPUTE = ON);
