dialect: db2
engine: IBM Db2 for Linux, UNIX and Windows
version: "11.5"
source: https://www.ibm.com/docs/en/db2/11.5.x?topic=reference-statements

statements:
  - id: create_procedure_sourced
    name: CREATE PROCEDURE (sourced)
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-create-procedure-sourced
    tier: high
    probes:
      - id: basic
        sql: "CREATE PROCEDURE p SOURCE s.pkg.src FOR SERVER srv;"
      - id: or_replace
        sql: "CREATE OR REPLACE PROCEDURE p SOURCE s.pkg.src FOR SERVER srv;"
      - id: source_name_only
        sql: "CREATE PROCEDURE p SOURCE src FOR SERVER srv;"
      - id: source_schema_name
        sql: "CREATE PROCEDURE p SOURCE s.src FOR SERVER srv;"
      - id: source_param_list_empty
        sql: "CREATE PROCEDURE p SOURCE s.pkg.src () FOR SERVER srv;"
      - id: number_of_parameters
        sql: "CREATE PROCEDURE p SOURCE s.pkg.src NUMBER OF PARAMETERS 2 FOR SERVER srv;"
      - id: unique_id
        sql: "CREATE PROCEDURE p SOURCE s.pkg.src UNIQUE ID 'u1' FOR SERVER srv;"
      - id: specific
        sql: "CREATE PROCEDURE p SOURCE s.pkg.src FOR SERVER srv SPECIFIC sp1;"
      - id: return_to_caller
        sql: "CREATE PROCEDURE p SOURCE s.pkg.src FOR SERVER srv WITH RETURN TO CALLER ALL;"
      - id: return_to_client_all
        sql: "CREATE PROCEDURE p SOURCE s.pkg.src FOR SERVER srv WITH RETURN TO CLIENT ALL;"
      - id: return_to_client_list
        sql: "CREATE PROCEDURE p SOURCE s.pkg.src FOR SERVER srv WITH RETURN TO CLIENT (1, 3);"
      - id: no_sql
        sql: "CREATE PROCEDURE p SOURCE s.pkg.src FOR SERVER srv NO SQL;"
      - id: contains_sql
        sql: "CREATE PROCEDURE p SOURCE s.pkg.src FOR SERVER srv CONTAINS SQL;"
      - id: modifies_sql_data
        sql: "CREATE PROCEDURE p SOURCE s.pkg.src FOR SERVER srv MODIFIES SQL DATA;"
      - id: reads_sql_data
        sql: "CREATE PROCEDURE p SOURCE s.pkg.src FOR SERVER srv READS SQL DATA;"
      - id: not_deterministic
        sql: "CREATE PROCEDURE p SOURCE s.pkg.src FOR SERVER srv NOT DETERMINISTIC;"
      - id: deterministic
        sql: "CREATE PROCEDURE p SOURCE s.pkg.src FOR SERVER srv DETERMINISTIC;"
      - id: external_action
        sql: "CREATE PROCEDURE p SOURCE s.pkg.src FOR SERVER srv EXTERNAL ACTION;"
      - id: no_external_action
        sql: "CREATE PROCEDURE p SOURCE s.pkg.src FOR SERVER srv NO EXTERNAL ACTION;"
      - id: combined_options
        sql: "CREATE OR REPLACE PROCEDURE p SOURCE s.pkg.src NUMBER OF PARAMETERS 1 UNIQUE ID 'u1' FOR SERVER srv SPECIFIC sp1 WITH RETURN TO CALLER ALL READS SQL DATA DETERMINISTIC NO EXTERNAL ACTION;"
    examples:
      - "CREATE PROCEDURE FEDEMPLOYEE SOURCE USER1.P1.EMPLOYEE FOR SERVER S1 WITH RETURN TO CLIENT ALL;"
      - "CREATE OR REPLACE PROCEDURE FEDSALARYSTAT SOURCE USER1.P1.SALARYSTAT FOR SERVER S1 WITH RETURN TO CLIENT( 1,3 );"

  - id: create_procedure_sql
    name: CREATE PROCEDURE (SQL)
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-create-procedure-sql
    tier: high
    probes:
      - id: basic
        sql: "CREATE PROCEDURE p () LANGUAGE SQL BEGIN END;"
      - id: no_option_list
        sql: "CREATE PROCEDURE p () BEGIN END;"
      - id: single_statement_body
        sql: "CREATE PROCEDURE p () LANGUAGE SQL RETURN 0;"
      - id: or_replace
        sql: "CREATE OR REPLACE PROCEDURE p () LANGUAGE SQL BEGIN END;"
      - id: qualified_name
        sql: "CREATE PROCEDURE s.p () LANGUAGE SQL BEGIN END;"
      - id: param_in
        sql: "CREATE PROCEDURE p (IN a INTEGER) LANGUAGE SQL BEGIN END;"
      - id: param_out
        sql: "CREATE PROCEDURE p (OUT a INTEGER) LANGUAGE SQL BEGIN END;"
      - id: param_inout
        sql: "CREATE PROCEDURE p (INOUT a INTEGER) LANGUAGE SQL BEGIN END;"
      - id: param_no_mode
        sql: "CREATE PROCEDURE p (a INTEGER, b VARCHAR(10)) LANGUAGE SQL BEGIN END;"
      - id: param_default_constant
        sql: "CREATE PROCEDURE p (IN a INTEGER DEFAULT 5) LANGUAGE SQL BEGIN END;"
      - id: param_default_null
        sql: "CREATE PROCEDURE p (IN a INTEGER DEFAULT NULL) LANGUAGE SQL BEGIN END;"
      - id: param_default_special_register
        sql: "CREATE PROCEDURE p (IN a VARCHAR(128) DEFAULT CURRENT SCHEMA) LANGUAGE SQL BEGIN END;"
      - id: param_default_expression
        sql: "CREATE PROCEDURE p (IN a INTEGER DEFAULT (1 + 2)) LANGUAGE SQL BEGIN END;"
      - id: param_type_decimal
        sql: "CREATE PROCEDURE p (IN a DECIMAL(10,2), IN b DECFLOAT(16)) LANGUAGE SQL BEGIN END;"
      - id: param_type_char_codeunits
        sql: "CREATE PROCEDURE p (IN a VARCHAR(10 CODEUNITS32), IN b CHAR(4 OCTETS)) LANGUAGE SQL BEGIN END;"
      - id: param_type_for_bit_data
        sql: "CREATE PROCEDURE p (IN a VARCHAR(10) FOR BIT DATA) LANGUAGE SQL BEGIN END;"
      - id: param_type_lob
        sql: "CREATE PROCEDURE p (IN a CLOB(1M), IN b BLOB(2G), IN c DBCLOB(1K)) LANGUAGE SQL BEGIN END;"
      - id: param_type_datetime_xml_boolean
        sql: "CREATE PROCEDURE p (IN a DATE, IN b TIMESTAMP(6), IN c XML, IN d BOOLEAN) LANGUAGE SQL BEGIN END;"
      - id: param_type_graphic_binary
        sql: "CREATE PROCEDURE p (IN a GRAPHIC(5), IN b VARGRAPHIC(5), IN c BINARY(4), IN d VARBINARY(4)) LANGUAGE SQL BEGIN END;"
      - id: param_type_float_double
        sql: "CREATE PROCEDURE p (IN a REAL, IN b DOUBLE PRECISION, IN c FLOAT(53), IN d BIGINT, IN e SMALLINT) LANGUAGE SQL BEGIN END;"
      - id: param_type_cursor
        sql: "CREATE PROCEDURE p (IN a CURSOR) LANGUAGE SQL BEGIN END;"
      - id: param_type_anchor_column
        sql: "CREATE PROCEDURE p (IN a ANCHOR DATA TYPE TO t.c) LANGUAGE SQL BEGIN END;"
      - id: param_type_anchor_row_of_table
        sql: "CREATE PROCEDURE p (IN a ANCHOR DATA TYPE TO ROW OF t) LANGUAGE SQL BEGIN END;"
      - id: param_type_distinct_or_array
        sql: "CREATE PROCEDURE p (IN a s.mytype, IN b s.myarray) LANGUAGE SQL BEGIN END;"
      - id: specific
        sql: "CREATE PROCEDURE p () LANGUAGE SQL SPECIFIC sp1 BEGIN END;"
      - id: dynamic_result_sets_zero
        sql: "CREATE PROCEDURE p () LANGUAGE SQL DYNAMIC RESULT SETS 0 BEGIN END;"
      - id: dynamic_result_sets
        sql: "CREATE PROCEDURE p () LANGUAGE SQL DYNAMIC RESULT SETS 2 BEGIN END;"
      - id: modifies_sql_data
        sql: "CREATE PROCEDURE p () LANGUAGE SQL MODIFIES SQL DATA BEGIN END;"
      - id: contains_sql
        sql: "CREATE PROCEDURE p () LANGUAGE SQL CONTAINS SQL BEGIN END;"
      - id: reads_sql_data
        sql: "CREATE PROCEDURE p () LANGUAGE SQL READS SQL DATA BEGIN END;"
      - id: not_deterministic
        sql: "CREATE PROCEDURE p () LANGUAGE SQL NOT DETERMINISTIC BEGIN END;"
      - id: deterministic
        sql: "CREATE PROCEDURE p () LANGUAGE SQL DETERMINISTIC BEGIN END;"
      - id: called_on_null_input
        sql: "CREATE PROCEDURE p () LANGUAGE SQL CALLED ON NULL INPUT BEGIN END;"
      - id: commit_on_return_yes
        sql: "CREATE PROCEDURE p () LANGUAGE SQL COMMIT ON RETURN YES BEGIN END;"
      - id: commit_on_return_no
        sql: "CREATE PROCEDURE p () LANGUAGE SQL COMMIT ON RETURN NO BEGIN END;"
      - id: autonomous
        sql: "CREATE PROCEDURE p () LANGUAGE SQL AUTONOMOUS BEGIN END;"
      - id: inherit_special_registers
        sql: "CREATE PROCEDURE p () LANGUAGE SQL INHERIT SPECIAL REGISTERS BEGIN END;"
      - id: old_savepoint_level
        sql: "CREATE PROCEDURE p () LANGUAGE SQL OLD SAVEPOINT LEVEL BEGIN END;"
      - id: new_savepoint_level
        sql: "CREATE PROCEDURE p () LANGUAGE SQL NEW SAVEPOINT LEVEL BEGIN END;"
      - id: external_action
        sql: "CREATE PROCEDURE p () LANGUAGE SQL EXTERNAL ACTION BEGIN END;"
      - id: no_external_action
        sql: "CREATE PROCEDURE p () LANGUAGE SQL NO EXTERNAL ACTION BEGIN END;"
      - id: parameter_ccsid_ascii
        sql: "CREATE PROCEDURE p () LANGUAGE SQL PARAMETER CCSID ASCII BEGIN END;"
      - id: parameter_ccsid_unicode
        sql: "CREATE PROCEDURE p () LANGUAGE SQL PARAMETER CCSID UNICODE BEGIN END;"
      - id: multiple_options
        sql: "CREATE PROCEDURE p (IN a INTEGER, OUT b INTEGER) SPECIFIC sp1 LANGUAGE SQL DYNAMIC RESULT SETS 1 MODIFIES SQL DATA NOT DETERMINISTIC CALLED ON NULL INPUT COMMIT ON RETURN NO NO EXTERNAL ACTION BEGIN SET b = a; END;"
      - id: body_declare_cursor_with_return
        sql: "CREATE PROCEDURE p () LANGUAGE SQL BEGIN DECLARE c1 CURSOR WITH RETURN FOR SELECT 1 FROM sysibm.sysdummy1; OPEN c1; END;"
    examples:
      - |-
        CREATE PROCEDURE MEDIAN_RESULT_SET ( OUT medianSalary DOUBLE )
          RESULT SETS 1
          LANGUAGE SQL
        BEGIN
          DECLARE v_numRecords INT DEFAULT 1;
          DECLARE v_counter INT DEFAULT 0;
          DECLARE c1 CURSOR FOR
            SELECT CAST (salary AS DOUBLE )
              FROM staff
              ORDER BY salary;
          DECLARE c2 CURSOR WITH RETURN FOR
            SELECT name, job, CAST (salary AS INTEGER )
              FROM staff
              WHERE salary > medianSalary
              ORDER BY salary;
          DECLARE EXIT HANDLER FOR NOT FOUND
            SET medianSalary = 6666;
          SET medianSalary = 0;
          SELECT COUNT(*) INTO v_numRecords
            FROM STAFF ;
          OPEN c1;
          WHILE v_counter < (v_numRecords / 2 + 1) DO
            FETCH c1 INTO medianSalary;
            SET v_counter = v_counter + 1;
          END WHILE ;
          CLOSE c1;
          OPEN c2;
        END;
