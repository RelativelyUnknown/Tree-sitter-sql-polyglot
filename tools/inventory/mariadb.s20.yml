dialect: mariadb
engine: MariaDB Server
version: "11.x (current)"
source: https://mariadb.com/docs/server/reference/sql-statements

statements:
  - id: if
    name: IF
    doc: https://mariadb.com/docs/server/reference/sql-statements/programmatic-compound-statements/if
    tier: high
    probes:
      - id: if_then
        sql: "IF 1 = 1 THEN SELECT 1; END IF;"
      - id: if_else
        sql: "IF 1 = 1 THEN SELECT 1; ELSE SELECT 2; END IF;"
      - id: if_elseif
        sql: "IF 1 = 1 THEN SELECT 1; ELSEIF 2 = 2 THEN SELECT 2; END IF;"
      - id: if_elseif_else
        sql: "IF 1 = 1 THEN SELECT 1; ELSEIF 2 = 2 THEN SELECT 2; ELSEIF 3 = 3 THEN SELECT 3; ELSE SELECT 4; END IF;"
      - id: if_multiple_statements
        sql: "IF 1 = 1 THEN SELECT 1; SELECT 2; END IF;"

  - id: loop
    name: LOOP
    doc: https://mariadb.com/docs/server/reference/sql-statements/programmatic-compound-statements/loop
    tier: high
    probes:
      - id: loop_basic
        sql: "LOOP SELECT 1; END LOOP;"
      - id: loop_begin_label
        sql: "lbl: LOOP SELECT 1; LEAVE lbl; END LOOP;"
      - id: loop_begin_and_end_label
        sql: "lbl: LOOP SELECT 1; LEAVE lbl; END LOOP lbl;"
      - id: loop_multiple_statements
        sql: "lbl: LOOP SELECT 1; SELECT 2; LEAVE lbl; END LOOP;"
