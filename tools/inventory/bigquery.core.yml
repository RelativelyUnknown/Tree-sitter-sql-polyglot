        END CASE;

  - id: if
    name: "IF"
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/procedural-language#if
    tier: high
    probes:
      - { id: if_then, sql: "IF x > 0 THEN SELECT 'pos'; END IF;" }
      - { id: else, sql: "IF x > 0 THEN SELECT 'pos'; ELSE SELECT 'non-pos'; END IF;" }
      - { id: elseif, sql: "IF x > 0 THEN SELECT 1; ELSEIF x < 0 THEN SELECT -1; ELSEIF x IS NULL THEN SELECT NULL; ELSE SELECT 0; END IF;" }
      - { id: empty_then, sql: "IF EXISTS(SELECT 1 FROM t WHERE a = 1) THEN ELSE SELECT 'missing'; END IF;" }
      - { id: nested, sql: "IF x > 0 THEN IF y > 0 THEN SELECT 1; END IF; END IF;" }
    examples:
      - |-
        IF EXISTS(SELECT 1 FROM schema.products
         WHERE product_id = target_product_id) THEN
         SELECT CONCAT('found product ', CAST(target_product_id AS STRING));
         ELSEIF EXISTS(SELECT 1 FROM schema.more_products
         WHERE product_id = target_product_id) THEN
         SELECT CONCAT('found product from more_products table',
         CAST(target_product_id AS STRING));
        ELSE
         SELECT CONCAT('did not find product ', CAST(target_product_id AS STRING));
        END IF;

