dialect: hive
engine: Apache Hive
version: "4.x"
source: https://hive.apache.org/docs/latest/language/languagemanual/

statements:
  - id: truncate_table
    name: TRUNCATE TABLE
    doc: https://hive.apache.org/docs/latest/language/languagemanual-ddl/
    tier: high
    probes:
      - id: basic
        sql: "TRUNCATE TABLE t;"
      - id: table_optional
        sql: "TRUNCATE t;"
        note: "Hive 4.0 (HIVE-23183) made the TABLE token optional"
      - id: partition
        sql: "TRUNCATE TABLE t PARTITION (ds = '2024-01-01');"
      - id: partial_partition
        sql: "TRUNCATE TABLE t PARTITION (ds = '2024-01-01', hr = 12);"

  - id: alter_table_rename
    name: ALTER TABLE RENAME TO
    doc: https://hive.apache.org/docs/latest/language/languagemanual-ddl/
    tier: high
    probes:
      - id: basic
        sql: "ALTER TABLE t RENAME TO t2;"
      - id: qualified
        sql: "ALTER TABLE db1.t RENAME TO db1.t2;"
