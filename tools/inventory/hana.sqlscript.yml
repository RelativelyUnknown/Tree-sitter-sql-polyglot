dialect: hana
engine: SAP HANA Platform
version: "2.0 SPS 08 (2.0.08)"
source: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/3bc1a0d4611d40c4a6e3fc7c8e80395d.html?version=2.0.08

statements:
  - id: sqlscript_anonymous_block
    name: Anonymous Block (DO BEGIN ... END)
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/de2486ee947e43e684d39702027f8a94/dec9d68044bd49bcbb45c990ba49c81d.html?version=2.0.08
    tier: high
    probes:
      - id: do_begin_end
        sql: "DO BEGIN SELECT * FROM dummy; END;"
      - id: sequential_execution
        sql: "DO BEGIN SEQUENTIAL EXECUTION SELECT * FROM dummy; END;"
      - id: parameter_clause_in_out
        sql: "DO (IN in_var NVARCHAR(24) => 'A', OUT outtab TABLE (J INT, K INT) => ?) BEGIN T1 = SELECT I, 10 AS J FROM tab WHERE z = :in_var; T2 = SELECT I, 20 AS K FROM tab WHERE z = :in_var; T3 = SELECT J, K FROM :T1 AS a, :T2 AS b WHERE a.I = b.I; outtab = SELECT * FROM :T3; END;"
      - id: parameter_clause_bound_by_placeholder
        sql: "DO (IN in_var NVARCHAR(24) => ?, OUT outtab TABLE (J INT, K INT) => ?) BEGIN outtab = SELECT I AS J, I AS K FROM tab WHERE z = :in_var; END;"
      - id: with_hint
        sql: "DO BEGIN SELECT * FROM dummy; END WITH HINT(ignore_plan_cache);"
      - id: nested_block
        sql: "DO BEGIN DECLARE i INT; BEGIN DECLARE j INT; j = 1; END; END;"
    examples:
      - |-
        DO BEGIN
         DECLARE i INT;
         FOR i in 1..5 DO
         SELECT * FROM dummy;
         END FOR;
        END WITH HINT(ignore_plan_cache);
      - |-
        DO
        BEGIN
         DECLARE I INTEGER;
         CREATE TABLE TAB1 (I INTEGER);
         FOR I IN 1..10 DO
         INSERT INTO TAB1 VALUES (:I);
         END FOR;
        END;
      - |-
        DO (IN J INTEGER => ?)
        BEGIN
         DECLARE I, J INTEGER;
         BEGIN
         DECLARE EXIT HANDLER FOR SQLEXCEPTION
         IF ::SQL_ERROR_CODE = 288 THEN
         DROP TABLE TAB;
         CREATE TABLE TAB (I INTEGER PRIMARY KEY);
         ELSE
         RESIGNAL;
         END IF;
         CREATE TABLE TAB (I INTEGER PRIMARY KEY);
         END;
         FOR I in 1..3 DO
         INSERT INTO TAB VALUES (:I);
         END FOR;
         IF :J <> 3 THEN
         SIGNAL SQL_ERROR_CODE 10001;
         END IF;
        END;

  - id: sqlscript_declare_scalar
    name: DECLARE (scalar variables)
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/de2486ee947e43e684d39702027f8a94/66b38a60ab3b475f925c224038511c51.html?version=2.0.08
    tier: high
    probes:
      - id: declare_type
        sql: "DO BEGIN DECLARE a INT; END;"
      - id: declare_multiple
        sql: "DO BEGIN DECLARE a, b, c INT; END;"
      - id: declare_default
        sql: "DO BEGIN DECLARE c INT DEFAULT 0; END;"
      - id: declare_equals_default
        sql: "DO BEGIN DECLARE b INT = 0; END;"
      - id: declare_constant
        sql: "DO BEGIN DECLARE CONSTANT k INT = 1; END;"
      - id: declare_not_null
        sql: "DO BEGIN DECLARE n INT NOT NULL DEFAULT 1; END;"
      - id: declare_expression_default
        sql: "DO BEGIN DECLARE n INT = (SELECT COUNT(*) FROM t) + 1; END;"
      - id: declare_auto
        sql: "DO BEGIN DECLARE n AUTO = 1; END;"
      - id: declare_varchar_type
        sql: "DO BEGIN DECLARE s NVARCHAR(100) DEFAULT 'abc'; END;"
      - id: assign_equals
        sql: "DO BEGIN DECLARE b INT; b = 1; END;"
      - id: assign_walrus
        sql: "DO BEGIN DECLARE b INT; b := 1; END;"
      - id: assign_variable_reference
        sql: "DO BEGIN DECLARE a INT = 1; DECLARE b INT; b = :a + 1; END;"
      - id: assign_udf_result
        sql: "DO BEGIN DECLARE i INTEGER DEFAULT 0; i = SUDF_ADD(1, 2); END;"
      - id: assign_udf_multiple_outputs
        sql: "DO BEGIN DECLARE i INTEGER DEFAULT 0; DECLARE j NVARCHAR(5); (i, j) = SUDF_EXPR(1); END;"
      - id: assign_udf_output_member
        sql: "DO BEGIN DECLARE a INTEGER DEFAULT 0; a = SUDF_EXPR(1).x; END;"
      - id: quoted_variable_reference
        sql: "DO BEGIN DECLARE myvar INT = 0; DECLARE \"MyVar\" INT = 1; SELECT :myvar, :\"MyVar\" FROM dummy; END;"

  - id: sqlscript_select_into
    name: SELECT INTO (with DEFAULT values)
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/de2486ee947e43e684d39702027f8a94/8c738274a3e44694b0d5f709e7db531f.html?version=2.0.08
    tier: high
    probes:
      - id: select_into_scalars
        sql: "DO BEGIN DECLARE a INT; DECLARE b VARCHAR(10); SELECT A, B INTO a, b FROM t; END;"
      - id: select_into_default
        sql: "DO BEGIN DECLARE a INT; DECLARE b VARCHAR(10); SELECT A, B INTO a, b DEFAULT -2+1, NULL FROM t; END;"
      - id: select_into_where
        sql: "DO BEGIN DECLARE a INT; SELECT COUNT(*) INTO a FROM t WHERE c = 1; END;"
      - id: select_into_group_having_order_limit
        sql: "DO BEGIN DECLARE a INT; SELECT A INTO a FROM t GROUP BY A HAVING COUNT(*) > 0 ORDER BY A LIMIT 1; END;"
      - id: select_into_set_operator
        sql: "DO BEGIN DECLARE a INT; SELECT A INTO a FROM t1 UNION ALL SELECT A FROM t2; END;"
      - id: select_into_array_element
        sql: "DO BEGIN DECLARE A_COPY INT ARRAY; DECLARE B_COPY VARCHAR(10) ARRAY; SELECT A, B INTO A_COPY[1], B_COPY[1] DEFAULT -2+1, NULL FROM T1; END;"
      - id: select_into_row_variable
        sql: "DO BEGIN DECLARE x ROW (a INT, b VARCHAR(10)); SELECT 2, 'b' INTO x FROM dummy; END;"
    examples:
      - |-
        DO BEGIN
         DECLARE A_COPY INT;
         DECLARE B_COPY VARCHAR(10);
         CREATE ROW TABLE T1 (A INT NOT NULL, B VARCHAR(10));
         SELECT A, B INTO A_COPY, B_COPY DEFAULT -2+1, NULL FROM T1;
         --(A_COPY,B_COPY) = (-1,?), use default value
         EXEC 'SELECT A FROM T1' INTO A_COPY DEFAULT 2;
         --(A_COPY) = (2), exec into statement with default value
         INSERT INTO T1 VALUES (0, 'sample0');
         SELECT A, B INTO A_COPY, B_COPY DEFAULT 5, NULL FROM T1;
         --(A_COPY,B_COPY) = (0,'sample0'), executed as-is
        END;

  - id: sqlscript_scalar_subquery_expression
    name: SQL in scalar expressions
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/de2486ee947e43e684d39702027f8a94/958a7607ec5a4605a4246a658abc6879.html?version=2.0.08
    tier: high
    probes:
      - id: subquery_in_assignment
        sql: "DO BEGIN DECLARE x INT; x = (SELECT TOP 1 val FROM mytab) * 10; END;"
      - id: subquery_in_condition
        sql: "DO BEGIN IF (SELECT MAX(val) FROM mytab) > 100 THEN SELECT 1 FROM dummy; END IF; END;"
      - id: subquery_in_declare_default
        sql: "DO BEGIN DECLARE n INT = (SELECT * FROM empty_tab) + 1; END;"
    examples:
      - |-
        do begin
         declare n int = (select * from empty_tab) + 1; -- n has null value
        end;

  - id: sqlscript_declare_table_variable
    name: DECLARE (table variables) and table variable assignment
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/de2486ee947e43e684d39702027f8a94/ea5065d06d14426799d879234d8e3e7b.html?version=2.0.08
    tier: high
    probes:
      - id: declare_table_columns
        sql: "DO BEGIN DECLARE temp TABLE (n INT); END;"
      - id: declare_table_type
        sql: "DO BEGIN DECLARE temp MY_TABLE_TYPE; END;"
      - id: declare_table_multiple
        sql: "DO BEGIN DECLARE t1, t2 TABLE (n INT, m VARCHAR(10)); END;"
      - id: declare_table_default_select
        sql: "DO BEGIN DECLARE temp MY_TABLE_TYPE DEFAULT SELECT * FROM t; END;"
      - id: declare_table_equals_select
        sql: "DO BEGIN DECLARE temp TABLE (n INT) = SELECT 1 AS n FROM dummy; END;"
      - id: declare_table_default_unnest
        sql: "DO BEGIN DECLARE arr INT ARRAY = ARRAY(1, 2); DECLARE temp MY_TABLE_TYPE = UNNEST(:arr) AS (i); END;"
      - id: declare_table_default_apply_filter
        sql: "DO BEGIN DECLARE temp TABLE (n INT) = APPLY_FILTER(tab, 'n > 1'); END;"
      - id: declare_table_constant
        sql: "DO BEGIN DECLARE temp CONSTANT TABLE (I INT) DEFAULT SELECT * FROM t; END;"
      - id: declare_table_not_null_pk
        sql: "DO BEGIN DECLARE lt2 TABLE (a INT, b INT, c INT NOT NULL, PRIMARY KEY(a, b)); END;"
      - id: declare_table_like_variable
        sql: "DO BEGIN DECLARE lt1 TABLE (a INT); DECLARE lt2 TABLE LIKE :lt1; END;"
      - id: declare_table_like_table
        sql: "DO BEGIN DECLARE lt TABLE LIKE t; END;"
      - id: declare_table_like_default
        sql: "DO BEGIN DECLARE lt TABLE LIKE t DEFAULT SELECT * FROM t; END;"
      - id: declare_like_column
        sql: "DO BEGIN DECLARE v LIKE t.c NOT NULL DEFAULT 1; END;"
        note: "second DECLARE ... LIKE form on the page: DECLARE <names> [CONSTANT] LIKE {table | :var}.<column> [NOT NULL] [default]"
      - id: declare_table_auto_select
        sql: "DO BEGIN DECLARE tab1 AUTO = SELECT 1 AS x FROM dummy; END;"
      - id: assign_select
        sql: "DO BEGIN t1 = SELECT * FROM t; END;"
      - id: assign_from_table_variable
        sql: "DO BEGIN lt_expensive_books = SELECT title, price, crcy FROM :it_books WHERE price > :minPrice AND crcy = :currency; END;"
      - id: assign_parenthesized_select
        sql: "DO BEGIN t1 = (SELECT * FROM t); END;"
      - id: assign_with_hint_no_inline
        sql: "DO BEGIN tab = SELECT A, B, C FROM T WHERE A = 1 WITH HINT(NO_INLINE); tab2 = SELECT C FROM :tab WHERE C = 0; END;"
      - id: assign_with_hint_inline
        sql: "DO BEGIN tab2 = SELECT I FROM T WITH HINT (INLINE); END;"
      - id: assign_table_variable
        sql: "DO BEGIN DECLARE a TABLE (i INT); DECLARE b TABLE (i INT); a = SELECT 1 AS i FROM dummy; b = :a; END;"
      - id: assign_union_of_variables
        sql: "DO BEGIN ret_tab = SELECT * FROM :out_tab UNION SELECT * FROM :ret_tab; END;"
      - id: from_table_variable_alias
        sql: "DO BEGIN T3 = SELECT J, K FROM :T1 AS a, :T2 AS b WHERE a.I = b.I; END;"

  - id: sqlscript_declare_row_variable
    name: DECLARE (row-type variables)
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/de2486ee947e43e684d39702027f8a94/869b4b1c5c7847cba246eb8e210d72bb.html?version=2.0.08
    tier: high
    probes:
      - id: row_element_list
        sql: "DO BEGIN DECLARE x ROW (a INT, b VARCHAR(16), c TIMESTAMP); END;"
      - id: row_multiple_names
        sql: "DO BEGIN DECLARE x, y ROW (a INT, b VARCHAR(16)); END;"
      - id: row_like_table
        sql: "DO BEGIN DECLARE x ROW LIKE t; END;"
      - id: row_like_variable
        sql: "DO BEGIN DECLARE CURSOR cur FOR SELECT 1 AS a FROM dummy; DECLARE x ROW LIKE :cur; END;"
      - id: row_constant_default
        sql: "DO BEGIN DECLARE CONSTANT x ROW (a INT, b VARCHAR(16)) DEFAULT ROW(1, 'a'); END;"
      - id: row_equals_default_variable
        sql: "DO BEGIN DECLARE x ROW (a INT); DECLARE y ROW (a INT) = :x; END;"
      - id: row_constructor_assign
        sql: "DO BEGIN DECLARE x ROW (a INT, b VARCHAR(16), c TIMESTAMP); x = ROW(1, 'a', '2000-01-01'); END;"
      - id: row_field_assign
        sql: "DO BEGIN DECLARE x ROW (a INT); x.a = 2; END;"
      - id: row_assign_variable
        sql: "DO BEGIN DECLARE x, y ROW (a INT); y = :x; END;"
      - id: row_field_read
        sql: "DO BEGIN DECLARE y ROW (a INT, b VARCHAR(16)); SELECT :y.a, :y.b FROM dummy; END;"
      - id: row_fetch_into
        sql: "DO BEGIN DECLARE CURSOR cur FOR SELECT 1 AS a FROM dummy; DECLARE x ROW LIKE :cur; OPEN cur; FETCH cur INTO x; END;"
    examples:
      - |-
        DO BEGIN
         DECLARE x, y ROW (a INT, b VARCHAR(16), c TIMESTAMP);
         x = ROW(1, 'a', '2000-01-01');
         x.a = 2;
         y = :x;
         SELECT :y.a, :y.b, :y.c FROM DUMMY;
         -- Returns [2, 'a', '2000-01-01']
        END;
      - |-
        DO BEGIN
         DECLARE CURSOR cur FOR SELECT 1 as a, 'a' as b, to_timestamp('2000-01-01') as c FROM DUMMY;
         DECLARE x ROW LIKE :cur;
         OPEN cur;
         FETCH cur INTO x;
         SELECT :x.a, :x.b, :x.c FROM DUMMY;
         -- Returns [1, 'a', '2000-01-01']
         SELECT 2, 'b', '2000-02-02' INTO x FROM DUMMY;
         SELECT :x.a, :x.b, :x.c FROM DUMMY;
         -- Returns [2, 'b', '2000-02-02']
        END;

  - id: sqlscript_table_variable_cell_access
    name: Index-based cell access to table variables
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/de2486ee947e43e684d39702027f8a94/a94ea1e47d734191be3df6c2ce5f32d6.html?version=2.0.08
    tier: high
    probes:
      - id: write_cell
        sql: "DO BEGIN DECLARE intab TABLE (A INT, B VARCHAR(20)); intab.A[2] = 5; END;"
      - id: read_cell
        sql: "DO BEGIN DECLARE intab TABLE (A INT, B VARCHAR(20)); DECLARE outvar VARCHAR(20); outvar = :intab.B[100]; END;"
      - id: cell_index_variable
        sql: "DO BEGIN DECLARE intab TABLE (A INT); DECLARE i INT = 1; DECLARE v INT; v = :intab.A[:i]; END;"
      - id: cell_index_expression
        sql: "DO BEGIN DECLARE intab TABLE (A INT); DECLARE i INT = 1; DECLARE v INT; v = :intab.A[:i + 1]; END;"
      - id: cell_quoted_column
        sql: "DO BEGIN DECLARE lt TABLE (\"Val1\" INT); DECLARE v INT; v = :lt.\"Val1\"[1]; END;"
      - id: cell_in_loop_condition
        sql: "DO BEGIN DECLARE OT TABLE (K VARCHAR(10)); DECLARE IDX INT = 0; WHILE :OT.K[IDX + 1] IS NOT NULL DO IDX = IDX + 1; END WHILE; END;"

  - id: sqlscript_table_variable_insert
    name: Table variable operators - INSERT
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/de2486ee947e43e684d39702027f8a94/36f718be73e745ceae0530aa80850ce3.html?version=2.0.08
    tier: high
    probes:
      - id: insert_row_append
        sql: "DO BEGIN DECLARE OT TABLE (K VARCHAR(20), V INT); :OT.INSERT(('Sum', 1)); END;"
      - id: insert_row_at_index
        sql: "DO BEGIN DECLARE OT TABLE (K VARCHAR(20), V INT); :OT.INSERT(('Sum', 1), 2); END;"
      - id: insert_row_with_expressions
        sql: "DO BEGIN DECLARE OT TABLE (K VARCHAR(20), V INT); DECLARE K VARCHAR(20) = 'a'; DECLARE VSUM INT = 0; DECLARE IDX INT = 1; :OT.INSERT(('Sum ' || K, VSUM), IDX); END;"
      - id: insert_row_column_list
        sql: "DO BEGIN DECLARE tv TABLE (c1 INT, c2 INT); :tv.(c1, c2).INSERT((1, 2), 1); END;"
      - id: insert_row_column_list_append
        sql: "DO BEGIN DECLARE tv TABLE (c1 INT, c2 INT); :tv.(c1).INSERT((1)); END;"
      - id: insert_table_variable
        sql: "DO BEGIN DECLARE tab_a TABLE (c INT); DECLARE tab_b TABLE (c INT); :tab_a.insert(:tab_b); END;"
      - id: insert_table_variable_column_list
        sql: "DO BEGIN DECLARE tab_a TABLE (col1 INT, COL2 INT); DECLARE tab_b TABLE (x INT, y INT); :tab_a.(col1, COL2).insert(:tab_b); END;"
      - id: insert_table_variable_position
        sql: "DO BEGIN DECLARE tab_a TABLE (c INT); DECLARE tab_b TABLE (c INT); :tab_a.INSERT(:tab_b, 5); END;"
      - id: insert_table_variable_quoted_columns_index_variable
        sql: "DO BEGIN DECLARE tab_a TABLE (\"a\" INT, \"b\" INT); DECLARE tab_b TABLE (x INT, y INT); DECLARE index_to_insert INT = 1; :tab_a.(\"a\",\"b\").insert(:tab_b, :index_to_insert); END;"
    examples:
      - |-
        DO BEGIN
         DECLARE I INT;
         LT0 = SELECT DISTINCT K FROM DATA;
         FOR I IN 1..RECORD_COUNT(:LT0) DO
         DECLARE K VARCHAR = :LT0.K[I];
         LT1 = SELECT K, V + 1000 * :I AS V FROM DATA WHERE K = :K;
         :OT.INSERT(:LT1, 1);
         END FOR;
        END;

  - id: sqlscript_table_variable_update
    name: Table variable operators - UPDATE and cell assignment
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/de2486ee947e43e684d39702027f8a94/36f718be73e745ceae0530aa80850ce3.html?version=2.0.08
    tier: high
    probes:
      - id: update_operator
        sql: "DO BEGIN DECLARE tv TABLE (a INT, b INT); :tv.UPDATE((1, 2), 3); END;"
      - id: update_operator_column_list
        sql: "DO BEGIN DECLARE tv TABLE (a INT, b INT); :tv.(a).UPDATE((1), 3); END;"
      - id: assign_row_at_index
        sql: "DO BEGIN DECLARE tv TABLE (a INT, b INT); tv[3] = (1, 2); END;"
      - id: assign_row_at_index_expression
        sql: "DO BEGIN DECLARE OT TABLE (V1 INT, V2 INT); DECLARE MAXIDX INT = 5; DECLARE IDX INT = 1; OT[MAXIDX-IDX+1] = (:IT.V2[:IDX], :IT.V1[:IDX]); END;"
      - id: assign_row_at_index_column_list
        sql: "DO BEGIN DECLARE tv TABLE (a INT, b INT); tv.(a)[3] = (1); END;"

  - id: sqlscript_table_variable_delete
    name: Table variable operators - DELETE
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/de2486ee947e43e684d39702027f8a94/36f718be73e745ceae0530aa80850ce3.html?version=2.0.08
    tier: high
    probes:
      - id: delete_all
        sql: "DO BEGIN DECLARE tv TABLE (a INT); :tv.DELETE(); END;"
      - id: delete_index
        sql: "DO BEGIN DECLARE tv TABLE (a INT); :tv.DELETE(1); END;"
      - id: delete_range
        sql: "DO BEGIN DECLARE tv TABLE (a INT); :tv.DELETE(1..3); END;"
      - id: delete_range_cell_expressions
        sql: "DO BEGIN DECLARE OT_RESULT TABLE (a INT); DECLARE INTERVALS TABLE (FROM_IDX INT, TO_IDX INT); DECLARE IDX INT = 1; :OT_RESULT.DELETE(:INTERVALS.FROM_IDX[IDX] .. :INTERVALS.TO_IDX[IDX]); END;"
      - id: delete_array_of_indexes
        sql: "DO BEGIN DECLARE tv TABLE (a INT); DECLARE DEL_IDX INT ARRAY; :tv.DELETE(:DEL_IDX); END;"

  - id: sqlscript_table_variable_search
    name: Table variable operators - SEARCH
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/de2486ee947e43e684d39702027f8a94/1eb7673ed88b4aa9b2cb43959bbbbde0.html?version=2.0.08
    tier: high
    probes:
      - id: search_columns_values
        sql: "DO BEGIN DECLARE LT1 TABLE (\"Key1\" VARCHAR(10), \"Key2\" INT, \"Val1\" VARCHAR(10)); DECLARE pos INT; pos = :LT1.SEARCH((\"Key1\", \"Key2\"), ('I', 3)); END;"
      - id: search_single_column
        sql: "DO BEGIN DECLARE LT TABLE (B INT, A INT); DECLARE pos INT; pos = :LT.SEARCH(B, 1); END;"
      - id: search_start_position
        sql: "DO BEGIN DECLARE LT TABLE (B INT, A INT); DECLARE pos INT; pos = :LT.SEARCH((B, A), (1, 2), 3); END;"
      - id: search_result_as_index
        sql: "DO BEGIN DECLARE LT1 TABLE (\"Key1\" VARCHAR(10), \"Key2\" INT, \"Val1\" VARCHAR(10)); DECLARE val VARCHAR(10); val = :LT1.\"Val1\"[:LT1.SEARCH((\"Key1\", \"Key2\"), ('E', 5))]; END;"
      - id: search_then_delete
        sql: "DO BEGIN DECLARE LT1 TABLE (\"Key1\" VARCHAR(10), \"Key2\" INT); DECLARE pos INT; pos = :LT1.SEARCH((\"Key1\", \"Key2\"), ('M', 3)); :LT1.DELETE(pos); END;"

  - id: sqlscript_table_emptiness_and_count
    name: IS_EMPTY and RECORD_COUNT
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/de2486ee947e43e684d39702027f8a94/3905f921a16f41d6addcf8d7979560c2.html?version=2.0.08
    tier: high
    probes:
      - id: is_empty_in_if
        sql: "DO BEGIN DECLARE tabvar TABLE (ID INTEGER); IF IS_EMPTY(:tabvar) THEN RETURN; END IF; END;"
      - id: is_empty_table_name
        sql: "DO BEGIN IF IS_EMPTY(t) THEN RETURN; END IF; END;"
      - id: not_is_empty_in_while
        sql: "DO BEGIN DECLARE STACK TABLE (NODE VARCHAR(30), L INT); WHILE NOT IS_EMPTY(:STACK) DO :STACK.DELETE(1); END WHILE; END;"
      - id: is_empty_scalar_assignment
        sql: "DO BEGIN DECLARE tv TABLE (a INT); DECLARE b BOOLEAN; b = IS_EMPTY(:tv); END;"
        note: "page: IS_EMPTY can also be used in scalar variable assignments"
      - id: record_count_assignment
        sql: "DO BEGIN DECLARE tv TABLE (a INT); DECLARE n BIGINT; n = RECORD_COUNT(:tv); END;"
      - id: record_count_table_name
        sql: "DO BEGIN DECLARE n BIGINT; n = RECORD_COUNT(t); END;"
      - id: record_count_for_loop_bound
        sql: "DO BEGIN DECLARE i INT; DECLARE v INT = 0; DECLARE inTab TABLE (col_a INT); FOR i IN 1 .. RECORD_COUNT(:inTab) DO v = :v + :inTab.col_a[:i]; END FOR; END;"
    examples:
      - |-
        DO (IN inTab TABLE(col_a int) => TAB, OUT v INT => ?)
         BEGIN
         DECLARE i int;
         v = 0;
         FOR i IN 1 .. RECORD_COUNT(:inTab)
         DO
         v = :v + :inTab.col_a[:i];
         END FOR;
        END;

  - id: sqlscript_unnest
    name: UNNEST function
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/de2486ee947e43e684d39702027f8a94/4f12887c7941410d802a36c3f1a87a59.html?version=2.0.08
    tier: high
    probes:
      - id: unnest_arrays
        sql: "DO BEGIN DECLARE arr_id INTEGER ARRAY = ARRAY(1, 2); DECLARE arr_name NVARCHAR(10) ARRAY = ARRAY('name1', 'name2', 'name3'); rst = UNNEST(:arr_id, :arr_name); END;"
      - id: unnest_as_columns
        sql: "DO BEGIN DECLARE arr_id INTEGER ARRAY = ARRAY(1, 2); DECLARE arr_name NVARCHAR(10) ARRAY = ARRAY('name1'); rst = UNNEST(:arr_id, :arr_name) AS (ID, NAME); END;"
      - id: unnest_with_ordinality
        sql: "DO BEGIN DECLARE amount INTEGER ARRAY = ARRAY(10, 20); rst = UNNEST(:amount) WITH ORDINALITY AS (\"AMOUNT\", \"SEQ\"); END;"
      - id: unnest_table_variables_star
        sql: "DO BEGIN t0 = SELECT * FROM tab0 ORDER BY a ASC; t1 = SELECT * FROM tab0 ORDER BY a DESC; lt = UNNEST(:t0, :t1) AS (*, (a AS b)); END;"
      - id: unnest_table_variables_aliasing_list
        sql: "DO BEGIN t0 = SELECT * FROM tab0 ORDER BY a ASC; t1 = SELECT * FROM tab0 ORDER BY a DESC; lt = UNNEST(:t0, :t1) AS (*, (a AS b, a AS c)); END;"
      - id: unnest_array_function
