      - { id: add_materialized_query_immediate, sql: "ALTER TABLE t ADD MATERIALIZED QUERY (SELECT a FROM s) DATA INITIALLY DEFERRED REFRESH IMMEDIATE ENABLE QUERY OPTIMIZATION MAINTAINED BY SYSTEM;" }
      - { id: add_materialized_query_user_maintained, sql: "ALTER TABLE t ADD MATERIALIZED QUERY (SELECT a FROM s) DATA INITIALLY DEFERRED REFRESH DEFERRED DISABLE QUERY OPTIMIZATION MAINTAINED BY USER;" }
      - { id: add_period_system_time, sql: "ALTER TABLE t ADD PERIOD SYSTEM_TIME (sb, se);" }
