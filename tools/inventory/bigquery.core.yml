      - { id: add_column, sql: "ALTER SEARCH INDEX idx ON t ADD COLUMN IF NOT EXISTS b OPTIONS (data_types = ['INT64'], index_granularity = 'COLUMN');" }
      - { id: alter_column, sql: "ALTER SEARCH INDEX IF EXISTS idx ON t ALTER COLUMN IF EXISTS s SET OPTIONS (data_types = ['STRING', 'INT64']);" }
      - { id: drop_column, sql: "ALTER SEARCH INDEX idx ON t DROP COLUMN IF EXISTS a;" }
      - { id: multiple_actions_rebuild, sql: "ALTER SEARCH INDEX idx ON t ADD COLUMN b, DROP COLUMN a REBUILD;" }
    examples:
      - |-
        ALTER SEARCH INDEX my_index ON dataset.complex_table
        ADD COLUMN b OPTIONS (data_types = ['INT64'],
         index_granularity = 'COLUMN');
      - |-
        ALTER SEARCH INDEX my_index ON dataset.complex_table
        ALTER COLUMN my_struct SET OPTIONS(data_types = ['STRING', 'INT64']);
      - |-
        ALTER SEARCH INDEX my_index ON dataset.complex_table
        SET OPTIONS(data_types = ['STRING', 'INT64']);
      - |-
        ALTER SEARCH INDEX my_index ON dataset.complex_table
        DROP COLUMN a;
      - |-
        ALTER SEARCH INDEX my_index ON dataset.complex_table
         ADD COLUMN b OPTIONS(data_types = ['INT64'], index_granularity = 'COLUMN'),
         ALTER COLUMN my_struct SET OPTIONS(data_types = ['STRING', 'INT64']),
         DROP COLUMN a,
         SET OPTIONS(default_index_column_granularity = 'GLOBAL'),
         REBUILD;

