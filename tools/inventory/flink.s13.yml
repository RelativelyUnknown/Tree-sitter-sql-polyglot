dialect: flink
engine: Apache Flink SQL
version: "2.3"
source: https://nightlies.apache.org/flink/flink-docs-release-2.3/docs/sql/reference/

statements:
  - id: show_create_view
    name: SHOW CREATE VIEW
    doc: https://nightlies.apache.org/flink/flink-docs-release-2.3/docs/sql/reference/utility/show/#show-create-view
    tier: medium
    probes:
      - { id: basic, sql: "SHOW CREATE VIEW v;" }
      - { id: qualified, sql: "SHOW CREATE VIEW c.db.v;" }
    examples:
      - "SHOW CREATE VIEW my_view;"

  - id: show_materialized_tables
    name: SHOW MATERIALIZED TABLES
    doc: https://nightlies.apache.org/flink/flink-docs-release-2.3/docs/sql/reference/utility/show/#show-materialized-tables
    tier: medium
    probes:
      - { id: basic, sql: "SHOW MATERIALIZED TABLES;" }
      - { id: from_db, sql: "SHOW MATERIALIZED TABLES FROM c.db;" }
      - { id: in_db, sql: "SHOW MATERIALIZED TABLES IN db;" }
      - { id: like, sql: "SHOW MATERIALIZED TABLES LIKE 'mt%';" }
      - { id: not_like, sql: "SHOW MATERIALIZED TABLES FROM db NOT LIKE 'mt%';" }

  - id: show_create_materialized_table
    name: SHOW CREATE [OR ALTER] MATERIALIZED TABLE
    doc: https://nightlies.apache.org/flink/flink-docs-release-2.3/docs/sql/reference/utility/show/#show-create-or-alter-materialized-table
    tier: medium
    probes:
      - { id: basic, sql: "SHOW CREATE MATERIALIZED TABLE mt;" }
      - { id: qualified, sql: "SHOW CREATE MATERIALIZED TABLE c.db.mt;" }
      - { id: or_alter, sql: "SHOW CREATE OR ALTER MATERIALIZED TABLE mt;" }
      - { id: or_alter_qualified, sql: "SHOW CREATE OR ALTER MATERIALIZED TABLE c.db.mt;" }

  - id: show_functions
    name: SHOW FUNCTIONS
    doc: https://nightlies.apache.org/flink/flink-docs-release-2.3/docs/sql/reference/utility/show/#show-functions
    tier: medium
    probes:
      - { id: basic, sql: "SHOW FUNCTIONS;" }
      - { id: user, sql: "SHOW USER FUNCTIONS;" }
      - { id: from_db, sql: "SHOW FUNCTIONS FROM c.db;" }
      - { id: in_db, sql: "SHOW FUNCTIONS IN db;" }
      - { id: like, sql: "SHOW FUNCTIONS LIKE 'f%';" }
      - { id: not_ilike, sql: "SHOW USER FUNCTIONS IN db NOT ILIKE 'f%';" }
    examples:
      - "SHOW FUNCTIONS;"

  - id: show_modules
    name: SHOW MODULES
    doc: https://nightlies.apache.org/flink/flink-docs-release-2.3/docs/sql/reference/utility/show/#show-modules
    tier: medium
    probes:
      - { id: basic, sql: "SHOW MODULES;" }
      - { id: full, sql: "SHOW FULL MODULES;" }
    examples:
      - "SHOW MODULES;"
      - "SHOW FULL MODULES;"

  - id: show_models
    name: SHOW MODELS
    doc: https://nightlies.apache.org/flink/flink-docs-release-2.3/docs/sql/reference/utility/show/#show-models
    tier: medium
    probes:
      - { id: basic, sql: "SHOW MODELS;" }
      - { id: from_db, sql: "SHOW MODELS FROM c.db;" }
      - { id: in_db, sql: "SHOW MODELS IN db;" }
      - { id: like, sql: "SHOW MODELS LIKE 'm%';" }
      - { id: not_ilike, sql: "SHOW MODELS FROM db NOT ILIKE 'm%';" }

  - id: show_create_model
    name: SHOW CREATE MODEL
    doc: https://nightlies.apache.org/flink/flink-docs-release-2.3/docs/sql/reference/utility/show/#show-create-model
    tier: medium
    probes:
      - { id: basic, sql: "SHOW CREATE MODEL m;" }
      - { id: qualified, sql: "SHOW CREATE MODEL c.db.m;" }

  - id: add_jar
    name: ADD JAR
    doc: https://nightlies.apache.org/flink/flink-docs-release-2.3/docs/sql/reference/utility/jar/#add-jar
    tier: low
    probes:
      - { id: basic, sql: "ADD JAR '/path/to/f.jar';" }

  - id: remove_jar
    name: REMOVE JAR
    doc: https://nightlies.apache.org/flink/flink-docs-release-2.3/docs/sql/reference/utility/jar/#remove-jar
    tier: low
    probes:
      - { id: basic, sql: "REMOVE JAR '/path/to/f.jar';" }

  - id: show_jars
    name: SHOW JARS
    doc: https://nightlies.apache.org/flink/flink-docs-release-2.3/docs/sql/reference/utility/jar/#show-jars
    tier: low
    probes:
      - { id: basic, sql: "SHOW JARS;" }

  - id: show_jobs
    name: SHOW JOBS
    doc: https://nightlies.apache.org/flink/flink-docs-release-2.3/docs/sql/reference/utility/job/#show-jobs
    tier: low
    probes:
      - { id: basic, sql: "SHOW JOBS;" }

  - id: describe_job
    name: DESCRIBE JOB
    doc: https://nightlies.apache.org/flink/flink-docs-release-2.3/docs/sql/reference/utility/job/#describe-job
    tier: low
    probes:
      - { id: describe, sql: "DESCRIBE JOB 'abc123';" }
      - { id: desc, sql: "DESC JOB 'abc123';" }

  - id: stop_job
    name: STOP JOB
    doc: https://nightlies.apache.org/flink/flink-docs-release-2.3/docs/sql/reference/utility/job/#stop-job
    tier: low
    probes:
      - { id: basic, sql: "STOP JOB 'abc123';" }
      - { id: savepoint_drain, sql: "STOP JOB 'abc123' WITH SAVEPOINT WITH DRAIN;" }
