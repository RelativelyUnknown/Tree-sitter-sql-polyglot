dialect: spark
engine: Apache Spark SQL
version: "4.x (docs/latest)"
source: https://spark.apache.org/docs/latest/sql-ref-syntax.html

statements:
  - id: like_predicate
    name: LIKE Predicate
    doc: https://spark.apache.org/docs/latest/sql-ref-syntax-qry-select-like.html
    tier: high
    probes:
      - id: like
        sql: "SELECT * FROM t WHERE c LIKE 'M%';"
      - id: not_like
        sql: "SELECT * FROM t WHERE c NOT LIKE 'M_ry';"
      - id: like_escape
        sql: "SELECT * FROM t WHERE c LIKE '%$_%' ESCAPE '$';"
      - id: rlike
        sql: "SELECT * FROM t WHERE c RLIKE 'M+';"
      - id: not_rlike
        sql: "SELECT * FROM t WHERE c NOT RLIKE 'M+';"
      - id: regexp
        sql: "SELECT * FROM t WHERE c REGEXP 'M+';"
      - id: not_regexp
        sql: "SELECT * FROM t WHERE c NOT REGEXP 'M+';"
      - id: like_all
        sql: "SELECT * FROM t WHERE c LIKE ALL ('%an%', '%an');"
      - id: like_any
        sql: "SELECT * FROM t WHERE c LIKE ANY ('%an%', '%an');"
      - id: like_some
        sql: "SELECT * FROM t WHERE c LIKE SOME ('%an%', '%an');"
      - id: not_like_all
        sql: "SELECT * FROM t WHERE c NOT LIKE ALL ('%an%', '%an');"
      - id: not_like_any
        sql: "SELECT * FROM t WHERE c NOT LIKE ANY ('%an%', '%an');"
      - id: not_like_some
        sql: "SELECT * FROM t WHERE c NOT LIKE SOME ('%an%', '%an');"
    examples:
      - "SELECT * FROM person WHERE name LIKE 'M%';"
      - "SELECT * FROM person WHERE name LIKE '%$_%' ESCAPE '$';"
      - "SELECT * FROM person WHERE name NOT LIKE ANY ('%an%', '%an');"

  - id: limit_clause
    name: LIMIT Clause
    doc: https://spark.apache.org/docs/latest/sql-ref-syntax-qry-select-limit.html
    tier: high
    probes:
      - id: limit_integer
        sql: "SELECT c FROM t ORDER BY c LIMIT 2;"
      - id: limit_all
        sql: "SELECT c FROM t ORDER BY c LIMIT ALL;"
      - id: limit_expression
        sql: "SELECT c FROM t ORDER BY c LIMIT length('SPARK');"
    examples:
      - "SELECT name, age FROM person ORDER BY name LIMIT 2;"
      - "SELECT name, age FROM person ORDER BY name LIMIT ALL;"
      - "SELECT name, age FROM person ORDER BY name LIMIT length('SPARK');"
