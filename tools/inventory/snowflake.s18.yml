        sql: "SHOW TERSE USERS;"
      - id: like
        sql: "SHOW USERS LIKE 'u%';"
      - id: starts_with
        sql: "SHOW USERS STARTS WITH 'u';"
      - id: limit_from
        sql: "SHOW USERS LIMIT 10 FROM 'u';"
    examples:
      - "SHOW USERS;"

  - id: show_variables
    name: SHOW VARIABLES
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-variables
    tier: medium
    probes:
      - id: basic
        sql: "SHOW VARIABLES;"
      - id: like
        sql: "SHOW VARIABLES LIKE 'v%';"

  - id: show_views
    name: SHOW VIEWS
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-views
    tier: medium
    probes:
      - id: basic
        sql: "SHOW VIEWS;"
      - id: terse
        sql: "SHOW TERSE VIEWS;"
      - id: like
        sql: "SHOW VIEWS LIKE 'v%';"
      - id: in_account
        sql: "SHOW VIEWS IN ACCOUNT;"
      - id: in_database
        sql: "SHOW VIEWS IN DATABASE d;"
      - id: in_schema
        sql: "SHOW VIEWS IN SCHEMA d.s;"
      - id: in_application
        sql: "SHOW VIEWS IN APPLICATION a;"
      - id: in_application_package
        sql: "SHOW VIEWS IN APPLICATION PACKAGE a;"
      - id: starts_with
        sql: "SHOW VIEWS STARTS WITH 'v';"
      - id: limit_from
        sql: "SHOW VIEWS LIMIT 10 FROM 'v';"
    examples:
      - "SHOW VIEWS LIKE 'line%' IN mydb.public;"

  - id: show_warehouses
    name: SHOW WAREHOUSES
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-warehouses
    tier: medium
    probes:
      - id: basic
        sql: "SHOW WAREHOUSES;"
      - id: like
        sql: "SHOW WAREHOUSES LIKE 'w%';"
      - id: with_privileges
        sql: "SHOW WAREHOUSES WITH PRIVILEGES MODIFY, OPERATE;"
    examples:
      - "SHOW WAREHOUSES;"
      - "SHOW WAREHOUSES LIKE 'test%';"
      - "SHOW WAREHOUSES WITH PRIVILEGES MODIFY, OPERATE;"
