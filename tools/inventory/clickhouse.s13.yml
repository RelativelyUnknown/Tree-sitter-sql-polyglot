dialect: clickhouse
engine: ClickHouse
version: "current docs (2026)"
source: https://clickhouse.com/docs/sql-reference/statements/

statements:
  - id: alter_table_sample_by
    name: ALTER TABLE ... MODIFY/REMOVE SAMPLE BY
    doc: https://clickhouse.com/docs/sql-reference/statements/alter/sample-by
    tier: high
    probes:
      - id: modify_sample_by
        sql: "ALTER TABLE t MODIFY SAMPLE BY c;"
      - id: modify_sample_by_db_qualified
        sql: "ALTER TABLE db.t MODIFY SAMPLE BY c;"
      - id: modify_sample_by_on_cluster
        sql: "ALTER TABLE t ON CLUSTER cl MODIFY SAMPLE BY intHash32(c);"
      - id: modify_sample_by_tuple
        sql: "ALTER TABLE t MODIFY SAMPLE BY (a, b);"
      - id: remove_sample_by
        sql: "ALTER TABLE t REMOVE SAMPLE BY;"
      - id: remove_sample_by_on_cluster
        sql: "ALTER TABLE db.t ON CLUSTER cl REMOVE SAMPLE BY;"

  - id: alter_table_comment
    name: ALTER TABLE ... MODIFY COMMENT
    doc: https://clickhouse.com/docs/sql-reference/statements/alter/comment
    tier: high
    probes:
      - id: modify_comment
        sql: "ALTER TABLE t MODIFY COMMENT 'Comment';"
      - id: modify_comment_db_qualified
        sql: "ALTER TABLE db.t MODIFY COMMENT 'Comment';"
      - id: modify_comment_on_cluster
        sql: "ALTER TABLE db.t ON CLUSTER cl MODIFY COMMENT 'Comment';"
      - id: modify_comment_empty
        sql: "ALTER TABLE t MODIFY COMMENT '';"
    examples:
      - "ALTER TABLE table_with_comment MODIFY COMMENT 'new comment on a table';"
      - "ALTER TABLE table_with_comment MODIFY COMMENT '';"
