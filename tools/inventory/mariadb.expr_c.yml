  - id: c_json_table
    name: JSON_TABLE
    doc: https://mariadb.com/docs/server/reference/sql-functions/special-functions/json-functions/json_table
    tier: high
    probes:
      - { id: basic, sql: "SELECT * FROM JSON_TABLE('[{\"a\":1},{\"a\":2}]', '$[*]' COLUMNS (a INT PATH '$.a')) AS jt;" }
      - { id: without_as, sql: "SELECT * FROM JSON_TABLE('[1,2]', '$[*]' COLUMNS (a INT PATH '$')) jt;" }
      - { id: multiple_columns, sql: "SELECT * FROM JSON_TABLE('[{\"a\":1,\"b\":\"x\"}]', '$[*]' COLUMNS (a INT PATH '$.a', b VARCHAR(10) PATH '$.b')) AS jt;" }
      - { id: for_ordinality, sql: "SELECT * FROM JSON_TABLE('[{\"a\":1},{\"a\":2}]', '$[*]' COLUMNS (id FOR ORDINALITY, a INT PATH '$.a')) AS jt;" }
      - { id: format_json, sql: "SELECT * FROM JSON_TABLE('[{\"sizes\":[1,2]}]', '$[*]' COLUMNS (sizes VARCHAR(100) FORMAT JSON PATH '$.sizes')) AS jt;" }
      - { id: exists_path, sql: "SELECT * FROM JSON_TABLE('[{\"a\":1},{\"b\":2}]', '$[*]' COLUMNS (has_a INT EXISTS PATH '$.a')) AS jt;" }
      - { id: nested_path, sql: "SELECT * FROM JSON_TABLE('[{\"name\":\"Jeans\",\"sizes\":[32,34]}]', '$[*]' COLUMNS (name VARCHAR(10) PATH '$.name', NESTED PATH '$.sizes[*]' COLUMNS (size INT PATH '$'))) AS jt;" }
      - { id: nested_path_sibling, sql: "SELECT * FROM JSON_TABLE('[{\"a\":[1],\"b\":[2]}]', '$[*]' COLUMNS (NESTED PATH '$.a[*]' COLUMNS (x INT PATH '$'), NESTED PATH '$.b[*]' COLUMNS (y INT PATH '$'))) AS jt;" }
      - { id: on_empty_null, sql: "SELECT * FROM JSON_TABLE('[{\"a\":1}]', '$[*]' COLUMNS (b INT PATH '$.b' NULL ON EMPTY)) AS jt;" }
      - { id: on_empty_default, sql: "SELECT * FROM JSON_TABLE('[{\"a\":1}]', '$[*]' COLUMNS (b INT PATH '$.b' DEFAULT '0' ON EMPTY)) AS jt;" }
      - { id: on_empty_error, sql: "SELECT * FROM JSON_TABLE('[{\"a\":1}]', '$[*]' COLUMNS (b INT PATH '$.b' ERROR ON EMPTY)) AS jt;" }
      - { id: on_error_null, sql: "SELECT * FROM JSON_TABLE('[{\"a\":\"x\"}]', '$[*]' COLUMNS (a INT PATH '$.a' NULL ON ERROR)) AS jt;" }
      - { id: on_error_default, sql: "SELECT * FROM JSON_TABLE('[{\"a\":\"x\"}]', '$[*]' COLUMNS (a INT PATH '$.a' DEFAULT '0' ON ERROR)) AS jt;" }
      - { id: on_error_error, sql: "SELECT * FROM JSON_TABLE('[{\"a\":\"x\"}]', '$[*]' COLUMNS (a INT PATH '$.a' ERROR ON ERROR)) AS jt;" }
      - { id: on_empty_and_on_error, sql: "SELECT * FROM JSON_TABLE('[{\"a\":1}]', '$[*]' COLUMNS (b INT PATH '$.b' DEFAULT '0' ON EMPTY ERROR ON ERROR)) AS jt;" }
      - { id: user_variable_doc, sql: "SELECT * FROM JSON_TABLE(@json, '$[*]' COLUMNS (name VARCHAR(10) PATH '$.name', sizes VARCHAR(100) FORMAT JSON PATH '$.sizes')) AS jt;" }
      - { id: correlated_column, sql: "SELECT jt.a FROM t, JSON_TABLE(t.j, '$[*]' COLUMNS (a INT PATH '$.a')) AS jt;" }
      - { id: join_with_table, sql: "SELECT t.id, jt.a FROM t JOIN JSON_TABLE(t.j, '$[*]' COLUMNS (a INT PATH '$.a')) AS jt ON jt.a = t.id;" }
    examples:
      - "SELECT * FROM JSON_TABLE('{\"foo\": [1,2,3,4]}','$' columns( jscol json path '$.foo') ) AS T;"

  - id: c_dynamic_columns
