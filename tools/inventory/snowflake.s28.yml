dialect: snowflake
engine: Snowflake
version: "current (docs read 2026-10-04)"
source: https://docs.snowflake.com/en/sql-reference/sql-all

statements:
  - id: drop_snapshot_set_deprecated
    name: DROP SNAPSHOT SET
    doc: https://docs.snowflake.com/en/sql-reference/sql/drop-snapshot-set
    tier: low
    probes:
      - id: basic
        sql: "DROP SNAPSHOT SET s;"
    note: "Deprecated"

  - id: drop_storage_lifecycle_policy
    name: DROP STORAGE LIFECYCLE POLICY
    doc: https://docs.snowflake.com/en/sql-reference/sql/drop-storage-lifecycle-policy
    tier: low
    probes:
      - id: basic
        sql: "DROP STORAGE LIFECYCLE POLICY p;"
      - id: if_exists
        sql: "DROP STORAGE LIFECYCLE POLICY IF EXISTS db.sch.p;"

  - id: drop_streamlit
    name: DROP STREAMLIT
    doc: https://docs.snowflake.com/en/sql-reference/sql/drop-streamlit
    tier: low
    probes:
      - id: basic
        sql: "DROP STREAMLIT s;"
      - id: if_exists
        sql: "DROP STREAMLIT IF EXISTS db.sch.s;"

  - id: execute_dbt_project
    name: EXECUTE DBT PROJECT
    doc: https://docs.snowflake.com/en/sql-reference/sql/execute-dbt-project
    tier: low
    probes:
      - id: basic
        sql: "EXECUTE DBT PROJECT p;"
      - id: options
        sql: "EXECUTE DBT PROJECT IF EXISTS p ARGS = 'run --target dev' DBT_VERSION = '1.9.4' EXTERNAL_ACCESS_INTEGRATIONS = (eai1, eai2) ENVIRONMENT = 'dev' ENV_VARS = ('k' = 'v') IMPORTS = ('@stg/file.zip' AS 'f') WRITEBACK = TRUE;"
      - id: from_workspace
        sql: "EXECUTE DBT PROJECT FROM WORKSPACE w ARGS = 'build' PROJECT_ROOT = 'sub/dir';"

  - id: execute_dcm_project
    name: EXECUTE DCM PROJECT
    doc: https://docs.snowflake.com/en/sql-reference/sql/execute-dcm-project
    tier: low
    probes:
      - id: plan
        sql: "EXECUTE DCM PROJECT p PLAN FROM '@stg/src';"
      - id: plan_delta_using
        sql: "EXECUTE DCM PROJECT p PLAN DELTA USING CONFIGURATION cfg (x => 1) FROM '@stg/src' OUTPUT_PATH '@stg/out';"
      - id: deploy
        sql: "EXECUTE DCM PROJECT p DEPLOY AS \"dep1\" USING CONFIGURATION cfg FROM '@stg/src';"
      - id: test_all
        sql: "EXECUTE DCM PROJECT p TEST ALL;"
      - id: preview
        sql: "EXECUTE DCM PROJECT p PREVIEW db.sch.t USING CONFIGURATION cfg FROM '@stg/src' LIMIT 10;"
      - id: purge
        sql: "EXECUTE DCM PROJECT p PURGE AS \"dep1\";"

  - id: execute_inference_job_service
    name: EXECUTE INFERENCE JOB SERVICE
    doc: https://docs.snowflake.com/en/sql-reference/sql/execute-inference-job-service
    tier: low
    probes:
      - id: basic
        sql: "EXECUTE INFERENCE JOB SERVICE IN COMPUTE POOL cp WITH SPECIFICATION 'spec' FROM (SELECT 1) MODEL = m;"
      - id: options
        sql: "EXECUTE INFERENCE JOB SERVICE IN COMPUTE POOL cp WITH SPECIFICATION 'spec' FROM @db.sch.stg/path MODEL = db.sch.m VERSION = v1 FUNCTION = 'predict' NAME = db.sch.job ASYNC = TRUE REPLICAS = 2;"

  - id: execute_job_service
    name: EXECUTE JOB SERVICE
    doc: https://docs.snowflake.com/en/sql-reference/sql/execute-job-service
    tier: low
    probes:
      - id: spec_file
        sql: "EXECUTE JOB SERVICE IN COMPUTE POOL cp FROM @stg SPECIFICATION_FILE = 'spec.yaml' NAME = db.sch.job;"
      - id: inline_spec
        sql: "EXECUTE JOB SERVICE IN COMPUTE POOL cp FROM SPECIFICATION $$ spec: {} $$ ASYNC = TRUE QUERY_WAREHOUSE = wh COMMENT = 'c' EXTERNAL_ACCESS_INTEGRATIONS = (eai1, eai2);"
      - id: template_file
        sql: "EXECUTE JOB SERVICE IN COMPUTE POOL cp FROM @stg SPECIFICATION_TEMPLATE_FILE = 'spec.yaml' USING (k => 'v');"

  - id: execute_notebook
    name: EXECUTE NOTEBOOK
    doc: https://docs.snowflake.com/en/sql-reference/sql/execute-notebook
    tier: low
    probes:
      - id: basic
        sql: "EXECUTE NOTEBOOK nb();"
      - id: with_params
        sql: "EXECUTE NOTEBOOK db.sch.nb('a', 'b');"

  - id: execute_notebook_project
    name: EXECUTE NOTEBOOK PROJECT
    doc: https://docs.snowflake.com/en/sql-reference/sql/execute-notebook-project
    tier: low
    probes:
      - id: basic
        sql: "EXECUTE NOTEBOOK PROJECT db.sch.proj MAIN_FILE = 'notebook.ipynb' COMPUTE_POOL = 'cp' QUERY_WAREHOUSE = 'wh' RUNTIME = 'v1';"
      - id: options
        sql: "EXECUTE NOTEBOOK PROJECT db.sch.proj MAIN_FILE = 'notebook.ipynb' COMPUTE_POOL = 'cp' QUERY_WAREHOUSE = 'wh' RUNTIME = 'v1' ARGUMENTS = 'a b' REQUIREMENTS_FILE = 'requirements.txt' ARTIFACT_REPOSITORIES = (r1) EXTERNAL_ACCESS_INTEGRATIONS = (eai1) SECRETS = (db.sch.sec1);"

  - id: execute_code_bundle
    name: EXECUTE CODE BUNDLE
    doc: https://docs.snowflake.com/en/sql-reference/sql/execute-code-bundle
    tier: low
    probes:
      - id: basic
        sql: "EXECUTE CODE BUNDLE b ENTRYPOINT = 'main.py';"
      - id: args_spec
        sql: "EXECUTE CODE BUNDLE db.sch.b ENTRYPOINT = 'main.py' ARGUMENTS = ('a', 'b') WITH SPECIFICATION $$ spec: {} $$;"

  - id: experiment_create_execute_show_drop
    name: EXPERIMENT (CREATE / EXECUTE / SHOW / DROP)
    doc: https://docs.snowflake.com/en/sql-reference/sql/experiment
    tier: low
    probes:
      - id: create
        sql: "CREATE EXPERIMENT e;"
      - id: create_options
        sql: "CREATE OR REPLACE EXPERIMENT IF NOT EXISTS db.sch.e TYPE = 'AI_FUNCTION_EVALUATION' FROM SPECIFICATION $$ spec: {} $$;"
      - id: execute
        sql: "EXECUTE EXPERIMENT e;"
      - id: show
        sql: "SHOW EXPERIMENTS LIKE '%x%' IN SCHEMA db.sch;"
      - id: drop
        sql: "DROP EXPERIMENT e;"

  - id: show_accounts
    name: SHOW ACCOUNTS
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-accounts
    tier: low
    probes:
      - id: basic
        sql: "SHOW ACCOUNTS;"
      - id: history_like
        sql: "SHOW ACCOUNTS HISTORY LIKE 'a%';"

  - id: show_agents
    name: SHOW AGENTS
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-agents
    tier: low
    probes:
      - id: basic
        sql: "SHOW AGENTS;"
      - id: full
        sql: "SHOW AGENTS LIKE '%a%' IN SCHEMA db.sch STARTS WITH 'a' LIMIT 10 FROM 'b';"
      - id: in_account
        sql: "SHOW AGENTS IN ACCOUNT;"

  - id: show_aggregation_policies
    name: SHOW AGGREGATION POLICIES
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-aggregation-policies
    tier: low
    probes:
      - id: basic
        sql: "SHOW AGGREGATION POLICIES;"
      - id: like_in
        sql: "SHOW AGGREGATION POLICIES LIKE '%p%' IN DATABASE db;"

  - id: show_application_packages
    name: SHOW APPLICATION PACKAGES
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-application-packages
    tier: low
    probes:
      - id: basic
        sql: "SHOW APPLICATION PACKAGES;"
      - id: full
        sql: "SHOW APPLICATION PACKAGES LIKE '%p%' STARTS WITH 'p' LIMIT 10 FROM 'q';"

  - id: show_application_roles
    name: SHOW APPLICATION ROLES
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-application-roles
    tier: low
    probes:
      - id: basic
        sql: "SHOW APPLICATION ROLES IN APPLICATION app;"
      - id: full
        sql: "SHOW APPLICATION ROLES LIKE '%r%' IN APPLICATION app LIMIT 10 FROM 'r';"

  - id: show_application_services
    name: SHOW APPLICATION SERVICES
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-application-services
    tier: low
    probes:
      - id: basic
        sql: "SHOW APPLICATION SERVICES;"
      - id: full
        sql: "SHOW APPLICATION SERVICES LIKE '%s%' IN SCHEMA db.sch LIMIT 5;"

  - id: show_applications
    name: SHOW APPLICATIONS
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-applications
    tier: low
    probes:
      - id: basic
        sql: "SHOW APPLICATIONS;"
      - id: full
        sql: "SHOW APPLICATIONS LIKE '%a%' STARTS WITH 'a' LIMIT 10 FROM 'b';"

  - id: show_artifact_repositories
    name: SHOW ARTIFACT REPOSITORIES
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-artifact-repositories
    tier: low
    probes:
      - id: basic
        sql: "SHOW ARTIFACT REPOSITORIES;"
      - id: full
        sql: "SHOW ARTIFACT REPOSITORIES LIKE '%r%' IN ACCOUNT LIMIT 5;"

  - id: show_authentication_policies
    name: SHOW AUTHENTICATION POLICIES
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-authentication-policies
    tier: low
    probes:
      - id: basic
        sql: "SHOW AUTHENTICATION POLICIES;"
      - id: in_schema
        sql: "SHOW AUTHENTICATION POLICIES LIKE '%p%' IN SCHEMA db.sch STARTS WITH 'p' LIMIT 10;"
      - id: in_application
        sql: "SHOW AUTHENTICATION POLICIES IN APPLICATION app;"
      - id: on_user
        sql: "SHOW AUTHENTICATION POLICIES ON USER u;"
      - id: on_account
        sql: "SHOW AUTHENTICATION POLICIES ON ACCOUNT;"

  - id: show_available_listings
    name: SHOW AVAILABLE LISTINGS
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-available-listings
    tier: low
    probes:
      - id: basic
        sql: "SHOW AVAILABLE LISTINGS;"
      - id: terse
        sql: "SHOW TERSE AVAILABLE LISTINGS LIMIT 10 IS_IMPORTED = TRUE IS_ORGANIZATION = TRUE IS_SHARED_WITH_ME = TRUE;"

  - id: show_available_offers
    name: SHOW AVAILABLE OFFERS
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-available-offers
    tier: low
    probes:
      - id: basic
        sql: "SHOW AVAILABLE OFFERS IN LISTING l;"
      - id: like
        sql: "SHOW AVAILABLE OFFERS LIKE '%o%' IN LISTING l;"

  - id: show_available_organization_profiles
    name: SHOW AVAILABLE ORGANIZATION PROFILES
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-available-organization-profiles
    tier: low
    probes:
      - id: basic
        sql: "SHOW AVAILABLE ORGANIZATION PROFILES;"

  - id: show_backup_policies
    name: SHOW BACKUP POLICIES
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-backup-policies
    tier: low
    probes:
      - id: basic
        sql: "SHOW BACKUP POLICIES;"
      - id: full
        sql: "SHOW BACKUP POLICIES LIKE '%p%' IN SCHEMA db.sch STARTS WITH 'p' LIMIT 10;"

  - id: show_backup_sets
    name: SHOW BACKUP SETS
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-backup-sets
    tier: low
    probes:
      - id: basic
        sql: "SHOW BACKUP SETS;"
      - id: full
        sql: "SHOW BACKUP SETS LIKE '%s%' IN DATABASE db STARTS WITH 's' LIMIT 10;"

  - id: show_backups_in_backup_set
    name: SHOW BACKUPS IN BACKUP SET
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-backups-in-backup-set
    tier: low
    probes:
      - id: basic
        sql: "SHOW BACKUPS IN BACKUP SET s;"
      - id: limit
        sql: "SHOW BACKUPS IN BACKUP SET db.sch.s LIMIT 10;"

  - id: show_catalog_integrations
    name: SHOW CATALOG INTEGRATIONS
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-catalog-integrations
    tier: low
    probes:
      - id: basic
        sql: "SHOW CATALOG INTEGRATIONS;"
      - id: like
        sql: "SHOW CATALOG INTEGRATIONS LIKE '%c%';"

  - id: show_channels
    name: SHOW CHANNELS
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-channels
    tier: low
    probes:
      - id: basic
        sql: "SHOW CHANNELS;"
      - id: in_table
        sql: "SHOW CHANNELS LIKE '%c%' IN TABLE t;"
      - id: in_pipe
        sql: "SHOW CHANNELS IN PIPE p;"

  - id: show_classes
    name: SHOW CLASSES
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-classes
    tier: low
    probes:
      - id: basic
        sql: "SHOW CLASSES;"
      - id: full
        sql: "SHOW CLASSES LIKE '%c%' IN DATABASE db LIMIT 10 FROM 'c';"

  - id: show_compute_pool_instance_families
    name: SHOW COMPUTE POOL INSTANCE FAMILIES
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-compute-pool-instance-families
    tier: low
    probes:
      - id: basic
        sql: "SHOW COMPUTE POOL INSTANCE FAMILIES;"

  - id: show_compute_pools
    name: SHOW COMPUTE POOLS
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-compute-pools
    tier: low
    probes:
      - id: basic
        sql: "SHOW COMPUTE POOLS;"
      - id: full
        sql: "SHOW COMPUTE POOLS LIKE '%p%' STARTS WITH 'p' LIMIT 10 FROM 'q';"

  - id: show_configurations
    name: SHOW CONFIGURATIONS
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-configurations
    tier: low
    probes:
      - id: basic
        sql: "SHOW CONFIGURATIONS;"
      - id: in_app
        sql: "SHOW CONFIGURATIONS IN APPLICATION app;"

  - id: show_connections
    name: SHOW CONNECTIONS
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-connections
    tier: low
    probes:
      - id: basic
        sql: "SHOW CONNECTIONS;"
      - id: like
        sql: "SHOW CONNECTIONS LIKE '%c%';"

  - id: show_contacts
    name: SHOW CONTACTS
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-contacts
    tier: low
    probes:
      - id: basic
        sql: "SHOW CONTACTS;"
      - id: full
        sql: "SHOW CONTACTS LIKE '%c%' IN SCHEMA db.sch STARTS WITH 'c' LIMIT 10;"

  - id: show_cortex_base_models
    name: SHOW CORTEX BASE MODELS
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-cortex-base-models
    tier: low
    probes:
      - id: basic
        sql: "SHOW CORTEX BASE MODELS;"
      - id: full
        sql: "SHOW CORTEX BASE MODELS LIKE '%m%' IN SCHEMA SNOWFLAKE.MODELS STARTS WITH 'm' LIMIT 10;"

  - id: show_cortex_search_services
    name: SHOW CORTEX SEARCH SERVICES
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-cortex-search
    tier: low
    probes:
      - id: basic
        sql: "SHOW CORTEX SEARCH SERVICES;"
      - id: full
        sql: "SHOW CORTEX SEARCH SERVICES LIKE PATTERN '%s%' STARTS WITH 's' LIMIT 10 FROM 't';"

  - id: show_data_movement_policies
    name: SHOW DATA MOVEMENT POLICIES
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-data-movement-policies
    tier: low
    probes:
      - id: basic
        sql: "SHOW DATA MOVEMENT POLICIES;"
      - id: like_in
        sql: "SHOW DATA MOVEMENT POLICIES LIKE '%p%' IN SCHEMA db.sch;"

  - id: show_data_movement_rules
    name: SHOW DATA MOVEMENT RULES
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-data-movement-rules
    tier: low
    probes:
      - id: basic
        sql: "SHOW DATA MOVEMENT RULES;"
      - id: like_in
        sql: "SHOW DATA MOVEMENT RULES LIKE '%r%' IN DATABASE db;"

  - id: show_databases_in_failover_group
    name: SHOW DATABASES IN FAILOVER GROUP
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-databases-in-failover-group
    tier: low
    probes:
      - id: basic
        sql: "SHOW DATABASES IN FAILOVER GROUP fg;"

