dialect: cockroachdb
engine: CockroachDB
version: "v26.3 (stable)"
source: https://www.cockroachlabs.com/docs/stable/sql-statements

statements:
  - id: upsert
    name: UPSERT
    doc: https://www.cockroachlabs.com/docs/stable/upsert
    tier: high
    probes:
      - { id: basic_values, sql: "UPSERT INTO t (a, b) VALUES (1, 2);" }
      - { id: no_column_list, sql: "UPSERT INTO t VALUES (1, 2);" }
      - { id: multi_row, sql: "UPSERT INTO t (a, b) VALUES (1, 2), (3, 4);" }
      - { id: qualified_table, sql: "UPSERT INTO s.t (a, b) VALUES (1, 2);" }
      - { id: table_alias, sql: "UPSERT INTO t AS x (a, b) VALUES (1, 2);" }
      - { id: select_source, sql: "UPSERT INTO t (a, b) SELECT a, b FROM u;" }
      - { id: parenthesized_select, sql: "UPSERT INTO t (a, b) (SELECT DISTINCT ON (a) a, b FROM u);" }
      - { id: default_values, sql: "UPSERT INTO t DEFAULT VALUES;" }
      - { id: default_in_values, sql: "UPSERT INTO t (a, b) VALUES (1, DEFAULT);" }
      - { id: with_cte, sql: "WITH c AS (SELECT 1 AS a, 2 AS b) UPSERT INTO t (a, b) SELECT a, b FROM c;" }
      - { id: returning_columns, sql: "UPSERT INTO t (a, b) VALUES (1, 2) RETURNING a, b;" }
      - { id: returning_star, sql: "UPSERT INTO t (a, b) VALUES (1, 2) RETURNING *;" }
      - { id: returning_nothing, sql: "UPSERT INTO t (a, b) VALUES (1, 2) RETURNING NOTHING;" }
    examples:
      - "UPSERT INTO accounts (id, balance) VALUES (3, 6325.20);"
      - "UPSERT INTO accounts (id, balance) VALUES (4, 1970.4), (5, 2532.9), (6, 4473.0);"
      - "UPSERT INTO accounts (id, balance) (SELECT DISTINCT ON (id) id, balance FROM inputrows);"

  - id: values
    name: VALUES
    doc: https://www.cockroachlabs.com/docs/stable/selection-queries#values-clause
    tier: high
    probes:
      - { id: single_row, sql: "VALUES (1, 2, 3);" }
      - { id: multi_row, sql: "VALUES (1, 2, 3), (4, 5, 6);" }
      - { id: as_subquery_alias, sql: "SELECT * FROM (VALUES (1, 'a'), (2, 'b')) AS v (x, y);" }
      - { id: with_order_limit, sql: "VALUES (1), (2) ORDER BY 1 LIMIT 1;" }
      - { id: in_union, sql: "VALUES (1) UNION VALUES (2);" }
      - { id: in_insert, sql: "INSERT INTO t VALUES (1, 2);" }
    examples:
      - "VALUES (1, 2, 3), (4, 5, 6);"
