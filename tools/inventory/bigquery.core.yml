      - |-
        GRANT `roles/bigquery.dataViewer` ON SCHEMA `myProject`.myDataset
        TO "user:raha@example-pet-store.com", "user:sasha@example-pet-store.com";
      - |-
        GRANT `roles/aiplatform.user`, `roles/run.invoker`
        ON PROJECT `my-vertex-project`
        TO "connection:my-bq-project.us.my-connection", "connection:another-bq-project.eu.other-connection";

  - id: revoke
    name: "REVOKE"
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/data-control-language#revoke_statement
    tier: medium
    probes:
      - id: on_schema
        sql: |-
          REVOKE `roles/bigquery.admin` ON SCHEMA `p`.d FROM "group:team@example.com", "serviceAccount:user@test-project.iam.gserviceaccount.com";
      - id: on_project
        sql: |-
          REVOKE `roles/run.invoker` ON PROJECT `my-project` FROM "connection:my-project.us.my-connection";
      - id: on_table
        sql: |-
          REVOKE `roles/bigquery.dataViewer`, `roles/bigquery.dataEditor` ON TABLE d.t FROM "user:a@example.com";
      - id: on_view
        sql: |-
          REVOKE `roles/bigquery.dataViewer` ON VIEW d.v FROM "specialGroup:allUsers";
      - id: on_external_table
        sql: |-
          REVOKE `roles/bigquery.dataViewer` ON EXTERNAL TABLE d.t FROM "domain:example.com";
    examples:
      - |-
        REVOKE `roles/bigquery.admin` ON SCHEMA `myProject`.myDataset
        FROM "group:example-team@example-pet-store.com", "serviceAccount:user@test-project.iam.gserviceaccount.com";
      - |-
        REVOKE `roles/run.invoker`
        ON PROJECT `my-vertex-project`
        FROM "connection:my-bq-project.us.my-connection";

expressions:
  - id: identifiers
    name: "Identifiers and path expressions"
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/lexical#identifiers
    tier: high
    probes:
      - { id: unquoted, sql: "SELECT _5abc.dataField FROM t AS _5abc;" }
      - { id: quoted_leading_digit, sql: "SELECT `5abc`.dataField FROM t AS `5abc`;" }
      - { id: quoted_reserved_word, sql: "SELECT `GROUP`.dataField FROM t AS `GROUP`;" }
      - { id: reserved_word_after_dot, sql: "SELECT abc5.GROUP FROM t AS abc5;" }
      - { id: quoted_column_with_dash, sql: "SELECT `column-a`, `287column` FROM t;" }
      - { id: quoted_escape, sql: "SELECT 1 AS `a\\`b`;" }
      - { id: dashed_project_unquoted, sql: "SELECT * FROM my-project.mydataset.mytable;" }
      - { id: dashed_table_name, sql: "SELECT * FROM my-table;" }
      - { id: quoted_full_path, sql: "SELECT * FROM `myproject.mydataset.mytable`;" }
      - { id: quoted_table_leading_digit, sql: "SELECT * FROM `287mytable`;" }
      - { id: function_result_field, sql: "SELECT foo().dataField;" }
      - { id: parameter_field, sql: "SELECT @param.dataField;" }
      - { id: case_insensitive_keywords, sql: "select a FrOm t wHeRe b = 1;" }

  - id: string_bytes_literals
    name: "String and bytes literals"
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/lexical#string_and_bytes_literals
    tier: high
    probes:
      - { id: double_quoted, sql: "SELECT \"abc\", \"it's\";" }
      - { id: single_quoted_escape, sql: "SELECT 'it\\'s', 'Title: \"Boy\"';" }
      - id: triple_quoted
        sql: |-
          SELECT """abc""", '''it's''', '''Title:"Boy"''', '''two
          lines''', '''why\?''';
      - { id: raw_strings, sql: "SELECT r\"abc+\", r'''abc+''', r\"\"\"abc+\"\"\", r'f\\(abc,(.*),def\\)';" }
      - { id: bytes, sql: "SELECT B\"abc\", B'''abc''', b\"\"\"abc\"\"\";" }
      - { id: raw_bytes, sql: "SELECT br'abc+', RB\"abc+\", RB'''abc''', rb'abc*', rB'abc*';" }
      - { id: escape_sequences, sql: "SELECT '\\a\\b\\f\\n\\r\\t\\v\\\\\\?\\\"\\'\\`';" }
      - { id: numeric_escapes, sql: "SELECT '\\101', '\\x41', '\\X41', '\\u0041', '\\U00000041';" }
      - { id: adjacent_literal_concatenation, sql: "SELECT 'a' \"b\" '''c''';" }
      - { id: concatenation_with_comments, sql: "SELECT r'\\n' /*raw*/ '\\n' \"b\";" }
    examples:
      - |-
        SELECT
         r'\n' /*Only the prev is raw!*/ '\n' "b" """c"d"e""" '''f'g'h''' "1" "2",
         br'\n'/*Only the prev is raw!*/ b'\n' b"b" b"""c"d"e""" b'''f'g'h''' b"1" b"2",
         NUMERIC "1" r'2',
         DECIMAL /*whole:*/ '1' /*fractional:*/ ".23" /*exponent=*/ "e+6",
         BIGNUMERIC '1' r"2",
         BIGDECIMAL /*sign*/ '-' /*whole:*/ '1' /*fractional:*/ ".23" /*exponent=*/ "e+6",
         RANGE<DATE> '[2014-01-01,' /*comment*/ "2015-01-01)",
         DATE '2014' "-01-01",
         DATETIME '2016-01-01 ' r"12:00:00",
         TIMESTAMP '2018-10-01 ' "12:00:00+08";
      - |-
        SELECT
         "\\n\nbc\"d\"ef'g'h12",
         b"\\n\nbc\"d\"ef'g'h12",
         NUMERIC "12",
         DECIMAL '1.23e+6',
         BIGNUMERIC '12',
         BIGDECIMAL "-1.23e+6",
         RANGE<DATE> '[2014-01-01 2015-01-01)',
         DATE '2014-01-01',
         DATETIME '2016-01-01 12:00:00',
         TIMESTAMP "2018-10-01 12:00:00+08";

  - id: numeric_literals
    name: "Integer, NUMERIC, BIGNUMERIC and floating point literals"
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/lexical#integer_literals
    tier: high
    probes:
      - { id: integers, sql: "SELECT 123, -123;" }
      - { id: hex_integer, sql: "SELECT 0xABC, 0x1f;" }
      - { id: numeric, sql: "SELECT NUMERIC '-3.14', NUMERIC '1.23456e05';" }
      - { id: decimal_alias, sql: "SELECT DECIMAL '1.23e+6';" }
      - { id: bignumeric, sql: "SELECT BIGNUMERIC '-9.876e-3';" }
      - { id: bigdecimal_alias, sql: "SELECT BIGDECIMAL '-1.23e+6';" }
      - { id: floats, sql: "SELECT 123.456e-67, .1E4, 58., 4e2;" }
      - { id: float_special_values, sql: "SELECT CAST('NaN' AS FLOAT64), CAST('-inf' AS FLOAT64);" }
    examples:
      - "SELECT NUMERIC '0';"
      - "SELECT NUMERIC '-9.876e-3';"
      - "SELECT BIGNUMERIC '1.23456e05';"

  - id: datetime_literals
    name: "Date, time, datetime and timestamp literals"
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/lexical#date_literals
    tier: high
    probes:
      - { id: date, sql: "SELECT DATE '2014-09-27';" }
      - { id: time, sql: "SELECT TIME '12:30:00.45';" }
      - { id: datetime, sql: "SELECT DATETIME '2014-09-27 12:30:00.45', DATETIME '2014-09-27T12:30:00.45';" }
      - { id: timestamp, sql: "SELECT TIMESTAMP '2014-09-27 12:30:00.45-08', TIMESTAMP '2017-01-18T12:34:56.123456Z';" }
      - { id: timestamp_named_zone, sql: "SELECT TIMESTAMP '2014-09-27 12:30:00 America/Argentina/Buenos_Aires';" }
      - { id: string_coercion, sql: "SELECT * FROM t WHERE date_col = '2014-09-27';" }

  - id: interval_literals
    name: "Interval literals"
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/lexical#interval_literals
    tier: high
    probes:
      - { id: single_part, sql: "SELECT INTERVAL 5 DAY, INTERVAL -25 MONTH, INTERVAL 1 SECOND;" }
      - { id: single_part_expression, sql: "SELECT INTERVAL n * 2 HOUR FROM t;" }
      - { id: range_hour_to_second, sql: "SELECT INTERVAL '10:20:30.52' HOUR TO SECOND;" }
      - { id: range_year_to_month, sql: "SELECT INTERVAL '1-2' YEAR TO MONTH;" }
      - { id: range_year_to_minute, sql: "SELECT INTERVAL '-23-2 10 -12:30' YEAR TO MINUTE;" }
      - { id: range_day_to_minute, sql: "SELECT INTERVAL '1 5:30' DAY TO MINUTE, INTERVAL '1 -15' MONTH TO DAY;" }
    examples:
      - "SELECT INTERVAL '-23-2 10 -0:30' YEAR TO MINUTE;"

  - id: range_literals
    name: "Range literals"
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/lexical#range_literals
    tier: medium
    probes:
      - { id: date_range, sql: "SELECT RANGE<DATE> '[2020-01-01, 2020-12-31)';" }
      - { id: datetime_timestamp_range, sql: "SELECT RANGE<DATETIME> '[2020-01-01 12:00:00, 2020-12-31 12:00:00)', RANGE<TIMESTAMP> '[2020-10-01 12:00:00+08, 2020-12-31 12:00:00+08)';" }
      - { id: unbounded, sql: "SELECT RANGE<DATE> '[UNBOUNDED, 2020-12-31)', RANGE<DATE> '[2020-01-01, NULL)';" }

  - id: json_literals
    name: "JSON literals"
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/lexical#json_literals
    tier: high
    probes:
      - { id: object, sql: "SELECT JSON '{\"id\": 10, \"name\": \"apple\", \"on_menu\": true}';" }
      - id: multiline
        sql: |-
          SELECT JSON '
          {
           "recipes": {"salads": [{ "id": 2001 }]}
          }
          ';

  - id: array_literals
    name: "Array literals"
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/lexical#array_literals
    tier: high
    probes:
      - { id: brackets, sql: "SELECT [1, 2, 3], ['x', 'y', 'xy'];" }
      - { id: array_keyword, sql: "SELECT ARRAY[1, 2, 3];" }
      - { id: typed, sql: "SELECT ARRAY<STRING>['x', 'y', 'xy'];" }
      - { id: typed_empty, sql: "SELECT ARRAY<INT64>[];" }
      - { id: empty, sql: "SELECT [];" }
      - { id: nested_struct_elements, sql: "SELECT [STRUCT(1 AS a, 'x' AS b), (2, 'y')];" }

  - id: struct_literals
    name: "Struct literals and constructors"
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/lexical#struct_literals
    tier: high
    probes:
      - { id: tuple, sql: "SELECT (1, 2, 3), (1, 'abc');" }
      - { id: struct_named_fields, sql: "SELECT STRUCT(1 AS foo, 'abc' AS bar);" }
      - { id: typed_struct, sql: "SELECT STRUCT<INT64, STRING>(1, 'abc');" }
      - { id: typed_named_struct, sql: "SELECT STRUCT<x INT64, y STRING>(1, 'abc');" }
      - { id: single_field, sql: "SELECT STRUCT(1), STRUCT<INT64>(1);" }
      - { id: nested, sql: "SELECT STRUCT(1 AS a, STRUCT(2 AS c, [3] AS d) AS b);" }
      - { id: struct_of_columns, sql: "SELECT STRUCT(a, b) FROM t;" }

  - id: query_parameters
    name: "Query parameters"
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/lexical#query_parameters
    tier: high
    probes:
      - { id: named, sql: "SELECT * FROM t WHERE c = @myparam;" }
      - { id: named_quoted, sql: "SELECT * FROM t WHERE c = @`my param`;" }
      - { id: named_reserved_keyword, sql: "SELECT * FROM t WHERE c = @select;" }
      - { id: positional, sql: "SELECT * FROM t WHERE a = ? AND b = ?;" }
    examples:
      - "SELECT * FROM Roster WHERE LastName = @myparam;"
      - "SELECT * FROM Roster WHERE FirstName = ? and LastName = ?;"

  - id: system_variables
    name: "System variables"
    doc: https://cloud.google.com/bigquery/docs/reference/system-variables
    tier: medium
    probes:
      - { id: read, sql: "SELECT @@project_id, @@dataset_id, @@time_zone;" }
      - { id: nested_field, sql: "SELECT @@error.message, @@script.job_id;" }

  - id: comments
    name: "Comments"
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/lexical#comments
    tier: high
    probes:
      - id: hash_comment
        sql: |-
          # this is a single-line comment
          SELECT book FROM library;
      - id: dash_comment
        sql: |-
          -- this is a single-line comment
          SELECT book FROM library;
      - { id: block_comment_inline, sql: "SELECT book FROM library /* inline */ WHERE book = 'Ulysses';" }
      - { id: trailing_hash_comment, sql: "SELECT book FROM library; # this is an inline comment" }
      - id: multiline_block
        sql: |-
          SELECT book FROM library
          /*
           This is a multiline comment
           on multiple lines
          */
          WHERE book = 'Ulysses';
    examples:
      - |-
        SELECT book FROM library
        /* this is a single-line comment */
        WHERE book = "Ulysses";
      - "SELECT book FROM library /* this is an inline comment */ WHERE book = \"Ulysses\";"

  - id: trailing_commas
    name: "Trailing commas"
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/lexical#trailing_commas
    tier: medium
    probes:
      - { id: select_list, sql: "SELECT name, release_date, FROM Books;" }
    examples:
      - "SELECT name, release_date, FROM Books;"

  - id: field_access
    name: "Field access operator"
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/operators#field_access_operator
    tier: high
    probes:
      - { id: struct_field, sql: "SELECT s.address.country FROM t;" }
      - { id: constructor_field, sql: "SELECT STRUCT(STRUCT('Yonge Street' AS street, 'Canada' AS country) AS address).address.country;" }
      - { id: json_field, sql: "SELECT j.class.students FROM t;" }
    examples:
      - |-
        SELECT
         STRUCT(
         STRUCT('Yonge Street' AS street, 'Canada' AS country)
         AS address).address.country;

  - id: subscript_operators
    name: "Array, struct and JSON subscript operators"
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/operators#array_subscript_operator
    tier: high
    probes:
      - { id: array_index, sql: "SELECT arr[0] FROM t;" }
      - { id: array_offset, sql: "SELECT arr[OFFSET(0)], arr[SAFE_OFFSET(6)] FROM t;" }
      - { id: array_ordinal, sql: "SELECT arr[ORDINAL(1)], arr[SAFE_ORDINAL(1)] FROM t;" }
      - { id: literal_array_subscript, sql: "SELECT ['coffee', 'tea', 'milk'][OFFSET(1)];" }
      - { id: struct_subscript, sql: "SELECT STRUCT<INT64, STRING, BOOL>(23, 'tea', FALSE)[OFFSET(0)], STRUCT<INT64, STRING, BOOL>(23, 'tea', FALSE)[ORDINAL(1)];" }
      - { id: json_subscript, sql: "SELECT j.class.students[0]['name'] FROM t;" }
      - { id: subscript_then_field, sql: "SELECT items[OFFSET(3)].dataField FROM t;" }
    examples:
      - |-
        SELECT
         ["coffee", "tea", "milk"] AS item_array,
         ["coffee", "tea", "milk"][0] AS item_index,
         ["coffee", "tea", "milk"][OFFSET(0)] AS item_offset,
         ["coffee", "tea", "milk"][ORDINAL(1)] AS item_ordinal,
         ["coffee", "tea", "milk"][SAFE_OFFSET(6)] AS item_safe_offset;
      - |-
        SELECT
         STRUCT<INT64, STRING, BOOL>(23, "tea", FALSE)[0] AS field_index,
         STRUCT<INT64, STRING, BOOL>(23, "tea", FALSE)[OFFSET(0)] AS field_offset,
         STRUCT<INT64, STRING, BOOL>(23, "tea", FALSE)[ORDINAL(1)] AS field_ordinal;
      - |-
        SELECT json_value.class.students[0]['name'] AS first_student
        FROM
         UNNEST(
         [
         JSON '{"class" : {"students" : [{"name" : "Jane"}]}}',
         JSON '{"class" : {"students" : []}}',
         JSON '{"class" : {"students" : [{"name" : "John"}, {"name": "Jamie"}]}}'])
         AS json_value;

  - id: arithmetic_operators
    name: "Arithmetic, date and interval arithmetic operators"
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/operators#arithmetic_operators
    tier: high
    probes:
      - { id: binary, sql: "SELECT a + b, a - b, a * b, a / b FROM t;" }
      - { id: unary, sql: "SELECT +a, -a, - -a FROM t;" }
      - { id: date_plus_int, sql: "SELECT DATE '2020-09-22' + 1, DATE '2020-09-22' - 7;" }
      - { id: datetime_subtraction, sql: "SELECT DATE '2021-05-20' - DATE '2020-04-19', TIMESTAMP '2021-06-01 12:34:56.789' - TIMESTAMP '2021-05-31 00:00:00';" }
      - { id: interval_arithmetic, sql: "SELECT DATE '2021-04-20' + INTERVAL 25 HOUR, TIMESTAMP '2021-05-02 00:01:02.345+00' - INTERVAL 10 SECOND;" }
      - { id: interval_multiply_divide, sql: "SELECT INTERVAL '1:2:3' HOUR TO SECOND * 10, INTERVAL 10 YEAR / 3;" }
    examples:
      - "SELECT DATE \"2020-09-22\" + 1 AS day_later, DATE \"2020-09-22\" - 7 AS week_ago;"
      - |-
        SELECT
         DATE "2021-04-20" + INTERVAL 25 HOUR AS date_plus,
         TIMESTAMP "2021-05-02 00:01:02.345+00" - INTERVAL 10 SECOND AS time_minus;
      - |-
        SELECT
         INTERVAL '1:2:3' HOUR TO SECOND * 10 AS mul1,
         INTERVAL 35 SECOND * 4 AS mul2,
         INTERVAL 10 YEAR / 3 AS div1,
         INTERVAL 1 MONTH / 12 AS div2;

  - id: bitwise_operators
    name: "Bitwise operators"
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/operators#bitwise_operators
    tier: medium
    probes:
      - { id: not_and_or_xor, sql: "SELECT ~a, a | b, a ^ b, a & b FROM t;" }
      - { id: shifts, sql: "SELECT a << 2, a >> 1 FROM t;" }

  - id: logical_operators
    name: "Logical operators"
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/operators#logical_operators
    tier: high
    probes:
      - { id: and_or_not, sql: "SELECT * FROM t WHERE NOT a AND (b OR c);" }
      - { id: not_precedence, sql: "SELECT NOT a = b FROM t;" }

  - id: comparison_operators
    name: "Comparison operators"
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/operators#comparison_operators
    tier: high
    probes:
      - { id: relational, sql: "SELECT a < b, a <= b, a > b, a >= b, a = b, a != b, a <> b FROM t;" }
      - { id: between, sql: "SELECT * FROM t WHERE a BETWEEN 1 AND 10 AND b NOT BETWEEN 2 AND 3;" }
      - { id: struct_comparison, sql: "SELECT * FROM t WHERE (a, b) = (1, 'x');" }
      - { id: is_distinct_from, sql: "SELECT 1 IS DISTINCT FROM 2, NULL IS NOT DISTINCT FROM NULL;" }
    examples:
      - "SELECT 1 IS DISTINCT FROM NULL;"
      - "SELECT 1 IS NOT DISTINCT FROM 1;"

  - id: is_operators
    name: "IS operators"
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/operators#is_operators
    tier: high
    probes:
      - { id: is_null, sql: "SELECT a IS NULL, a IS NOT NULL FROM t;" }
      - { id: is_true_false, sql: "SELECT a IS TRUE, a IS NOT TRUE, a IS FALSE, a IS NOT FALSE FROM t;" }
      - { id: is_unknown, sql: "SELECT a IS UNKNOWN, a IS NOT UNKNOWN FROM t;" }

  - id: in_operator
    name: "IN operator"
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/operators#in_operators
    tier: high
    probes:
      - { id: list, sql: "SELECT * FROM t WHERE c IN ('Intend', 'Secure');" }
      - { id: not_in, sql: "SELECT * FROM t WHERE c NOT IN ('Intend');" }
      - { id: subquery, sql: "SELECT * FROM t WHERE c IN (SELECT c FROM u);" }
      - { id: subquery_in_list, sql: "SELECT * FROM t WHERE c IN ((SELECT 'Intend'), 'Clarity');" }
      - { id: unnest, sql: "SELECT * FROM t WHERE c IN UNNEST(['Secure', 'Clarity']);" }
      - { id: unnest_parameter, sql: "SELECT * FROM t WHERE c IN UNNEST(@array_parameter);" }
      - { id: multi_part_key, sql: "SELECT * FROM t WHERE (k1, k2) IN ((12, 34), (56, 78));" }
      - { id: multi_part_key_subquery, sql: "SELECT * FROM t WHERE (k1, k2) IN (SELECT (u.a, u.b) FROM u);" }
    examples:
      - "SELECT * FROM Words WHERE value IN ('Intend', 'Secure');"
      - "SELECT * FROM Words WHERE value IN ((SELECT 'Intend'), 'Clarity');"
      - "SELECT * FROM Words WHERE value IN UNNEST(['Secure', 'Clarity']);"

  - id: like_operators
    name: "LIKE and quantified LIKE operators"
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/operators#like_operator
    tier: high
    probes:
      - { id: like, sql: "SELECT 'apple' LIKE 'a%', 'apple' NOT LIKE 'a%';" }
      - { id: like_any, sql: "SELECT * FROM t WHERE c LIKE ANY ('Intend%', '%intention%');" }
      - { id: like_some, sql: "SELECT * FROM t WHERE c LIKE SOME ('a%', 'b%');" }
      - { id: like_all, sql: "SELECT * FROM t WHERE c LIKE ALL ('%ity%');" }
      - { id: not_like_any, sql: "SELECT * FROM t WHERE c NOT LIKE ANY ('a%', 'b%');" }
      - { id: like_any_unnest, sql: "SELECT * FROM t WHERE c LIKE ANY UNNEST(['%ion%', '%and%']);" }
    examples:
      - "SELECT 'apple' LIKE 'a%';"
      - "SELECT * FROM Words WHERE value LIKE ANY ('Intend%', '%intention%');"
      - "SELECT * FROM Words WHERE value LIKE ALL ('%ity%');"
      - "SELECT * FROM Words WHERE value LIKE ANY UNNEST(['%ion%', '%and%']);"

  - id: exists_operator
    name: "EXISTS operator"
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/operators#exists_operator
    tier: high
    probes:
      - { id: exists, sql: "SELECT EXISTS(SELECT c FROM t WHERE d = 'south') AS result;" }
      - { id: not_exists, sql: "SELECT * FROM t WHERE NOT EXISTS (SELECT 1 FROM u WHERE u.a = t.a);" }

  - id: concatenation_operator
    name: "Concatenation operator"
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/operators#concatenation_operator
    tier: high
    probes:
      - { id: strings, sql: "SELECT 'A' || 'B' || 'C';" }
      - { id: bytes, sql: "SELECT b'a' || b'b';" }
      - { id: arrays, sql: "SELECT [1, 2] || [3];" }

  - id: with_expression
    name: "WITH expression"
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/operators#with_expression
    tier: medium
    probes:
      - { id: basic, sql: "SELECT WITH(a AS RAND(), a - a);" }
      - { id: chained_variables, sql: "SELECT WITH(a AS 1, b AS a + 1, a * b);" }
      - { id: aggregate_variables, sql: "SELECT WITH(s AS SUM(x), c AS COUNT(x), s / c) FROM UNNEST([1.0, 2.0, 3.0]) AS x;" }
    examples:
      - "SELECT WITH(a AS RAND(), a - a);"
      - |-
        SELECT WITH(s AS SUM(input), c AS COUNT(input), s/c)
        FROM UNNEST([1.0, 2.0, 3.0]) AS input;

