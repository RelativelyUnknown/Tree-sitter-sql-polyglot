  - id: scripting_break
    name: "BREAK (Snowflake Scripting)"
    doc: https://docs.snowflake.com/en/sql-reference/snowflake-scripting/break
    tier: high
    probes:
      - { id: break, sql: "DECLARE i INT DEFAULT 0; BEGIN LOOP i := i + 1; BREAK; END LOOP; RETURN i; END;" }
      - { id: exit_label, sql: "DECLARE i INT DEFAULT 0; BEGIN WHILE (i < 4) DO i := i + 1; EXIT outer_loop; END WHILE outer_loop; RETURN i; END;" }
    examples:
      - |-
        DECLARE
          i INTEGER;
          j INTEGER;
        BEGIN
          i := 1;
          j := 1;
          WHILE (i <= 4) DO
            WHILE (j <= 4) DO
              -- Exit when j is 3, even if i is still 1.
              IF (j = 3) THEN
                BREAK outer_loop;
              END IF;
              j := j + 1;
            END WHILE inner_loop;
            i := i + 1;
          END WHILE outer_loop;
          -- Execution resumes here after the BREAK executes.
          RETURN i;
        END;

  - id: scripting_continue
    name: "CONTINUE (Snowflake Scripting)"
    doc: https://docs.snowflake.com/en/sql-reference/snowflake-scripting/continue
    tier: high
    probes:
      - { id: continue, sql: "DECLARE c INT DEFAULT 0; BEGIN WHILE (c < 3) DO c := c + 1; CONTINUE; END WHILE; RETURN c; END;" }
      - { id: iterate_label, sql: "DECLARE c INT DEFAULT 0; BEGIN WHILE (c < 3) DO c := c + 1; ITERATE my_loop; END WHILE my_loop; RETURN c; END;" }
    examples:
      - |-
        DECLARE
          counter1 NUMBER(8, 0);
          counter2 NUMBER(8, 0);
        BEGIN
          counter1 := 0;
          counter2 := 0;
          WHILE (counter1 < 3) DO
            counter1 := counter1 + 1;
            CONTINUE;
            counter2 := counter2 + 1;
          END WHILE;
          RETURN counter2;
        END;

  - id: scripting_exception
    name: "EXCEPTION (Snowflake Scripting)"
    doc: https://docs.snowflake.com/en/sql-reference/snowflake-scripting/exception
    tier: high
    probes:
      - { id: when_named, sql: "DECLARE e1 EXCEPTION (-20001, 'msg'); BEGIN RAISE e1; EXCEPTION WHEN e1 THEN RETURN SQLERRM; END;" }
      - { id: when_or, sql: "BEGIN RETURN 1; EXCEPTION WHEN e1 OR e2 OR e3 THEN RETURN 123; WHEN e4 THEN RETURN 4; WHEN OTHER THEN RETURN 99; END;" }
      - { id: when_continue, sql: "DECLARE e1 EXCEPTION (-20001, 'x'); BEGIN LET c := 0; RAISE e1; RETURN c; EXCEPTION WHEN e1 CONTINUE THEN c := c + 1; END;" }
      - { id: when_exit, sql: "BEGIN RETURN 1; EXCEPTION WHEN STATEMENT_ERROR EXIT THEN RETURN SQLCODE; END;" }
      - { id: when_other_continue, sql: "BEGIN RETURN 1; EXCEPTION WHEN OTHER CONTINUE THEN INSERT INTO log SELECT 'continue', :SQLERRM; END;" }
      - { id: builtin_variables, sql: "BEGIN RETURN 1; EXCEPTION WHEN EXPRESSION_ERROR THEN RETURN OBJECT_CONSTRUCT('SQLCODE', SQLCODE, 'SQLERRM', SQLERRM, 'SQLSTATE', SQLSTATE); END;" }
    examples:
      - |-
        DECLARE
          result VARCHAR;
          exception_1 EXCEPTION (-20001, 'I caught the expected exception.');
          exception_2 EXCEPTION (-20002, 'Not the expected exception!');
        BEGIN
          result := 'If you see this, I did not catch any exception.';
          IF (TRUE) THEN
            RAISE exception_1;
          END IF;
          RETURN result;
        EXCEPTION
          WHEN exception_2 THEN
            RETURN SQLERRM;
          WHEN exception_1 THEN
            RETURN SQLERRM;
        END;
      - |-
        DECLARE
          exception_1 EXCEPTION (-20001, 'Catch and continue');
        BEGIN
          LET counter := 0;
          IF (TRUE) THEN
            RAISE exception_1;
          END IF;
          counter := counter + 10;
          RETURN 'Counter value: ' || counter;
        EXCEPTION
          WHEN exception_1 CONTINUE THEN
            counter := counter +1;
        END;
      - |-
        DECLARE
          e1 EXCEPTION (-20001, 'Exception e1');
        BEGIN
          -- Inner block.
          DECLARE
            e2 EXCEPTION (-20002, 'Exception e2');
            selector BOOLEAN DEFAULT TRUE;
          BEGIN
            IF (selector) THEN
              RAISE e1;
            ELSE
              RAISE e2;
            END IF;
          END;
        EXCEPTION
          WHEN e1 THEN
            RETURN SQLERRM || ' caught in outer block.';
        END;
      - |-
        DECLARE
          MY_EXCEPTION EXCEPTION (-20001, 'Sample message');
        BEGIN
          RAISE MY_EXCEPTION;
        EXCEPTION
          WHEN STATEMENT_ERROR THEN
            RETURN OBJECT_CONSTRUCT('Error type', 'STATEMENT_ERROR',
                                    'SQLCODE', SQLCODE,
                                    'SQLERRM', SQLERRM,
                                    'SQLSTATE', SQLSTATE);
          WHEN EXPRESSION_ERROR THEN
            RETURN OBJECT_CONSTRUCT('Error type', 'EXPRESSION_ERROR',
                                    'SQLCODE', SQLCODE,
                                    'SQLERRM', SQLERRM,
                                    'SQLSTATE', SQLSTATE);
          WHEN OTHER THEN
            RETURN OBJECT_CONSTRUCT('Error type', 'Other error',
                                    'SQLCODE', SQLCODE,
                                    'SQLERRM', SQLERRM,
                                    'SQLSTATE', SQLSTATE);
        END;

