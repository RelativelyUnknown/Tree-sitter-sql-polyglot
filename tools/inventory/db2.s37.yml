dialect: db2
engine: IBM Db2 for Linux, UNIX and Windows
version: "12.1"
source: https://www.ibm.com/docs/en/db2/12.1.x?topic=reference-statements

statements:
  - id: create_workload
    name: CREATE WORKLOAD
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-create-workload
    tier: low
    probes:
      - id: form1
        sql: "CREATE WORKLOAD w APPLNAME('app1');"
      - id: form2
        sql: "CREATE WORKLOAD w SYSTEM_USER('u1') SERVICE CLASS sc POSITION LAST;"
  - id: create_wrapper
    name: CREATE WRAPPER
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-create-wrapper
    tier: low
    probes:
      - id: form1
        sql: "CREATE WRAPPER drda;"
      - id: form2
        sql: "CREATE WRAPPER w LIBRARY 'libdb2drda.so' OPTIONS (DB2_FENCED 'N');"
  - id: end_declare_section
    name: END DECLARE SECTION
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-end-declare-section
    tier: low
    status: not-sql
    reason: Embedded-SQL host-language precompiler construct, not seen by a SQL parser.
  - id: flush_bufferpools
    name: FLUSH BUFFERPOOLS
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-flush-bufferpools
    tier: low
    probes:
      - id: form1
        sql: "FLUSH BUFFERPOOLS ALL;"
      - id: form2
        sql: "FLUSH BUFFERPOOL ALL;"
  - id: flush_event_monitor
    name: FLUSH EVENT MONITOR
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-flush-event-monitor
    tier: low
    probes:
      - id: form1
        sql: "FLUSH EVENT MONITOR em;"
      - id: form2
        sql: "FLUSH EVENT MONITOR em BUFFER;"
  - id: flush_federated_cache
    name: FLUSH FEDERATED CACHE
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-flush-federated-cache
    tier: low
    probes:
      - id: form1
        sql: "FLUSH FEDERATED CACHE FOR ALL;"
      - id: form2
        sql: "FLUSH FEDERATED CACHE FOR SERVER s;"
  - id: flush_optimization_profile_cache
    name: FLUSH OPTIMIZATION PROFILE CACHE
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-flush-optimization-profile-cache
    tier: low
    probes:
      - id: form1
        sql: "FLUSH OPTIMIZATION PROFILE CACHE ALL;"
      - id: form2
        sql: "FLUSH OPTIMIZATION PROFILE CACHE prof;"
  - id: flush_package_cache
    name: FLUSH PACKAGE CACHE
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-flush-package-cache
    tier: low
    probes:
      - id: form1
        sql: "FLUSH PACKAGE CACHE DYNAMIC;"
  - id: flush_authentication_cache
    name: FLUSH AUTHENTICATION CACHE
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-flush-authentication-cache
    tier: low
    probes:
      - id: form1
        sql: "FLUSH AUTHENTICATION CACHE FOR ALL;"
  - id: grant_exemption
    name: GRANT (exemption)
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-grant-exemption
    tier: low
    probes:
      - id: form1
        sql: "GRANT EXEMPTION ON RULE DB2LBACREADARRAY FOR pol TO USER u;"
      - id: form2
        sql: "GRANT EXEMPTION ON RULE ALL FOR pol TO ROLE r;"
  - id: grant_global_variable_privileges
    name: GRANT (global variable privileges)
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-grant-global-variable-privileges
    tier: low
    probes:
      - id: form1
        sql: "GRANT READ ON VARIABLE v TO USER u;"
      - id: form2
        sql: "GRANT ALL PRIVILEGES ON VARIABLE v TO PUBLIC WITH GRANT OPTION;"
  - id: grant_index_privileges
    name: GRANT (index privileges)
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-grant-index-privileges
    tier: low
    probes:
      - id: form1
        sql: "GRANT CONTROL ON INDEX idx TO USER u;"
  - id: grant_module_privileges
    name: GRANT (module privileges)
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-grant-module-privileges
    tier: low
    probes:
      - id: form1
        sql: "GRANT EXECUTE ON MODULE m TO USER u WITH GRANT OPTION;"
  - id: grant_package_privileges
    name: GRANT (package privileges)
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-grant-package-privileges
    tier: low
    probes:
      - id: form1
        sql: "GRANT BIND, EXECUTE ON PACKAGE p TO USER u;"
      - id: form2
        sql: "GRANT CONTROL ON PACKAGE p TO PUBLIC WITH GRANT OPTION;"
  - id: grant_security_label
    name: GRANT (security label)
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-grant-security-label
    tier: low
    probes:
      - id: form1
        sql: "GRANT SECURITY LABEL pol.lbl TO USER u FOR ALL ACCESS;"
  - id: grant_server_privileges
    name: GRANT (server privileges)
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-grant-server-privileges
    tier: low
    probes:
      - id: form1
        sql: "GRANT PASSTHRU ON SERVER s TO USER u;"
  - id: grant_setsessionuser_privilege
    name: GRANT (SETSESSIONUSER privilege)
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-grant-setsessionuser-privilege
    tier: low
    probes:
      - id: form1
        sql: "GRANT SETSESSIONUSER ON USER u1 TO USER u2;"
      - id: form2
        sql: "GRANT SETSESSIONUSER ON PUBLIC TO GROUP g;"
  - id: grant_table_space_privileges
    name: GRANT (table space privileges)
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-grant-table-space-privileges
    tier: low
    probes:
      - id: form1
        sql: "GRANT USE OF TABLESPACE ts TO USER u WITH GRANT OPTION;"
  - id: grant_workload_privileges
    name: GRANT (workload privileges)
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-grant-workload-privileges
    tier: low
    probes:
      - id: form1
        sql: "GRANT USAGE ON WORKLOAD w TO USER u;"
  - id: grant_xsr_object_privileges
    name: GRANT (XSR object privileges)
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-grant-xsr-object-privileges
    tier: low
    probes:
      - id: form1
        sql: "GRANT USAGE ON XSROBJECT x TO PUBLIC;"
  - id: include
    name: INCLUDE
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-include
    tier: low
    status: not-sql
    reason: Embedded-SQL host-language precompiler construct, not seen by a SQL parser.
  - id: rename_stogroup
    name: RENAME STOGROUP
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-rename-stogroup
    tier: low
    probes:
      - id: form1
        sql: "RENAME STOGROUP sg1 TO sg2;"
  - id: rename_tablespace
    name: RENAME TABLESPACE
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-rename-tablespace
    tier: low
    probes:
      - id: form1
        sql: "RENAME TABLESPACE ts1 TO ts2;"
  - id: revoke_exemption
    name: REVOKE (exemption)
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-revoke-exemption
    tier: low
    probes:
      - id: form1
        sql: "REVOKE EXEMPTION ON RULE DB2LBACREADARRAY FOR pol FROM USER u;"
  - id: revoke_global_variable_privileges
    name: REVOKE (global variable privileges)
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-revoke-global-variable-privileges
    tier: low
    probes:
      - id: form1
        sql: "REVOKE READ ON VARIABLE v FROM USER u;"
      - id: form2
        sql: "REVOKE ALL PRIVILEGES ON VARIABLE v FROM PUBLIC;"
  - id: revoke_index_privileges
    name: REVOKE (index privileges)
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-revoke-index-privileges
    tier: low
    probes:
      - id: form1
        sql: "REVOKE CONTROL ON INDEX idx FROM USER u;"
  - id: revoke_module_privileges
    name: REVOKE (module privileges)
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-revoke-module-privileges
    tier: low
    probes:
      - id: form1
        sql: "REVOKE EXECUTE ON MODULE m FROM USER u;"
  - id: revoke_package_privileges
    name: REVOKE (package privileges)
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-revoke-package-privileges
    tier: low
    probes:
      - id: form1
        sql: "REVOKE BIND, EXECUTE ON PACKAGE p FROM USER u;"
  - id: revoke_security_label
    name: REVOKE (security label)
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-revoke-security-label
    tier: low
    probes:
      - id: form1
        sql: "REVOKE SECURITY LABEL pol.lbl FROM USER u;"
  - id: revoke_server_privileges
    name: REVOKE (server privileges)
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-revoke-server-privileges
    tier: low
    probes:
      - id: form1
        sql: "REVOKE PASSTHRU ON SERVER s FROM USER u;"
  - id: revoke_setsessionuser_privilege
    name: REVOKE (SETSESSIONUSER privilege)
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-revoke-setsessionuser-privilege
    tier: low
    probes:
      - id: form1
        sql: "REVOKE SETSESSIONUSER ON USER u1 FROM USER u2;"
  - id: revoke_table_space_privileges
    name: REVOKE (table space privileges)
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-revoke-table-space-privileges
    tier: low
    probes:
      - id: form1
        sql: "REVOKE USE OF TABLESPACE ts FROM USER u;"
  - id: revoke_workload_privileges
    name: REVOKE (workload privileges)
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-revoke-workload-privileges
    tier: low
    probes:
      - id: form1
        sql: "REVOKE USAGE ON WORKLOAD w FROM USER u;"
  - id: revoke_xsr_object_privileges
    name: REVOKE (XSR object privileges)
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-revoke-xsr-object-privileges
    tier: low
    probes:
      - id: form1
        sql: "REVOKE USAGE ON XSROBJECT x FROM PUBLIC;"
  - id: set_compilation_environment
    name: SET COMPILATION ENVIRONMENT
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-set-compilation-environment
    tier: low
    probes:
      - id: form1
        sql: "SET COMPILATION ENVIRONMENT = :hv;"
  - id: set_current_decfloat_rounding_mode
    name: SET CURRENT DECFLOAT ROUNDING MODE
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-set-current-decfloat-rounding-mode
    tier: low
    probes:
      - id: form1
        sql: "SET CURRENT DECFLOAT ROUNDING MODE = ROUND_HALF_EVEN;"
  - id: set_current_default_transform_group
    name: SET CURRENT DEFAULT TRANSFORM GROUP
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-set-current-default-transform-group
    tier: low
    probes:
      - id: form1
        sql: "SET CURRENT DEFAULT TRANSFORM GROUP = grp;"
  - id: set_current_explain_mode
    name: SET CURRENT EXPLAIN MODE
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-set-current-explain-mode
    tier: low
    probes:
      - id: form1
        sql: "SET CURRENT EXPLAIN MODE = YES;"
      - id: form2
        sql: "SET CURRENT EXPLAIN MODE = EXPLAIN;"
  - id: set_current_explain_snapshot
    name: SET CURRENT EXPLAIN SNAPSHOT
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-set-current-explain-snapshot
    tier: low
    probes:
      - id: form1
        sql: "SET CURRENT EXPLAIN SNAPSHOT = YES;"
