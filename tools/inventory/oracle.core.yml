  - id: plsql_procedure_call
    name: PL/SQL procedure call
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/lnpls/block.html
    tier: high
    probes:
      - id: no_arguments
        sql: "BEGIN p; END;"
      - id: empty_parentheses
        sql: "BEGIN p(); END;"
      - id: positional
        sql: "BEGIN p(1, 'a'); END;"
      - id: named_notation
        sql: "BEGIN p(amount => 50, emp_id => 120); END;"
      - id: mixed_notation
        sql: "BEGIN p(120, amount => 50); END;"
      - id: package_qualified
        sql: "BEGIN DBMS_OUTPUT.PUT_LINE('x'); s.pkg.p(1); END;"
      - id: function_call_in_expression
        sql: "DECLARE v NUMBER; BEGIN v := f(1) + s.pkg.g; END;"
      - id: dblink_call
        sql: "BEGIN p@remote(1); END;"
    examples:
      - |-
        DECLARE
          emp_num NUMBER(6) := 120;
          bonus   NUMBER(6) := 50;

          PROCEDURE raise_salary (
            emp_id NUMBER,
            amount NUMBER
          ) IS
          BEGIN
            UPDATE employees
            SET salary = salary + amount
            WHERE employee_id = emp_id;
          END raise_salary;

        BEGIN
          -- Equivalent invocations:

          raise_salary(emp_num, bonus);                      -- positional notation
          raise_salary(amount => bonus, emp_id => emp_num);  -- named notation
          raise_salary(emp_id => emp_num, amount => bonus);  -- named notation
          raise_salary(emp_num, amount => bonus);            -- mixed notation
        END;
        /

  - id: plsql_if_statement
    name: PL/SQL IF statement
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/lnpls/IF-statement.html
    tier: high
    probes:
      - id: if_then
        sql: "BEGIN IF x > 0 THEN y := 1; END IF; END;"
      - id: if_then_else
        sql: "BEGIN IF x > 0 THEN y := 1; ELSE y := 0; END IF; END;"
      - id: elsif
        sql: "BEGIN IF x > 50000 THEN y := 1500; ELSIF x > 35000 THEN y := 500; ELSIF x > 0 THEN y := 100; ELSE y := 0; END IF; END;"
      - id: nested
        sql: "BEGIN IF a THEN IF b THEN NULL; END IF; END IF; END;"
      - id: multiple_statements
        sql: "BEGIN IF x > 0 THEN UPDATE t SET c = c + x; y := 'Yes'; END IF; END;"
    examples:
      - |-
        DECLARE
          PROCEDURE p (sales NUMBER)
          IS
            bonus  NUMBER := 0;
          BEGIN 
            IF sales > 50000 THEN
              bonus := 1500;
            ELSIF sales > 35000 THEN
              bonus := 500;
            ELSE
              bonus := 100;
            END IF;
         
            DBMS_OUTPUT.PUT_LINE (
              'Sales = ' || sales || ', bonus = ' || bonus || '.'
            );
          END p;
        BEGIN
          p(55000);
          p(40000);
          p(30000);
        END;
        /
      - |-
        DECLARE
          grade CHAR(1);
        BEGIN
          grade := 'B';
          
          IF grade = 'A' THEN
            DBMS_OUTPUT.PUT_LINE('Excellent');
          ELSIF grade = 'B' THEN
            DBMS_OUTPUT.PUT_LINE('Very Good');
          ELSIF grade = 'C' THEN
            DBMS_OUTPUT.PUT_LINE('Good');
          ELSIF grade = 'D' THEN
            DBMS_OUTPUT. PUT_LINE('Fair');
          ELSIF grade = 'F' THEN
            DBMS_OUTPUT.PUT_LINE('Poor');
          ELSE
            DBMS_OUTPUT.PUT_LINE('No such grade');
          END IF;
        END;
        /

  - id: plsql_case_statement
    name: PL/SQL CASE statement
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/lnpls/CASE-statement.html
    tier: high
    probes:
      - id: simple_case
        sql: "BEGIN CASE g WHEN 'A' THEN r := 1; WHEN 'B' THEN r := 2; ELSE r := 0; END CASE; END;"
      - id: simple_case_multiple_values
        sql: "BEGIN CASE g WHEN 'A', 'B' THEN r := 1; END CASE; END;"
      - id: simple_case_dangling_predicates
        sql: "BEGIN CASE g WHEN < 0, > 100 THEN r := 'X'; WHEN > 89 THEN r := 'A'; WHEN IS NULL THEN r := '?'; ELSE r := 'F'; END CASE; END;"
      - id: searched_case
        sql: "BEGIN CASE WHEN g = 'A' THEN r := 1; WHEN g = 'B' THEN r := 2; ELSE r := 0; END CASE; END;"
      - id: labeled_case
        sql: "BEGIN <<c1>> CASE WHEN x > 0 THEN NULL; END CASE c1; END;"
    examples:
      - |-
        DECLARE
          grade CHAR(1);
        BEGIN
          grade := 'B';

          CASE grade
            WHEN 'A' THEN DBMS_OUTPUT.PUT_LINE('Excellent');
            WHEN 'B' THEN DBMS_OUTPUT.PUT_LINE('Very Good');
            WHEN 'C' THEN DBMS_OUTPUT.PUT_LINE('Good');
            WHEN 'D' THEN DBMS_OUTPUT.PUT_LINE('Fair');
            WHEN 'F' THEN DBMS_OUTPUT.PUT_LINE('Poor');
            ELSE DBMS_OUTPUT.PUT_LINE('No such grade');
          END CASE;
        END;
        /
      - |-
        DECLARE
          grade NUMBER;
        BEGIN
          grade := '85';

          CASE grade
            WHEN < 0, > 100 THEN DBMS_OUTPUT.PUT_LINE('No such grade');
            WHEN > 89 THEN DBMS_OUTPUT.PUT_LINE('A');
            WHEN > 79 THEN DBMS_OUTPUT.PUT_LINE('B');
            WHEN > 69 THEN DBMS_OUTPUT.PUT_LINE('C');
            WHEN > 59 THEN DBMS_OUTPUT.PUT_LINE('D');
            ELSE DBMS_OUTPUT.PUT_LINE('F');
          END CASE;
        END;
        /
      - |-
        DECLARE
          grade CHAR(1);
        BEGIN
          grade := 'B';
          
          CASE
            WHEN grade = 'A' THEN DBMS_OUTPUT.PUT_LINE('Excellent');
            WHEN grade = 'B' THEN DBMS_OUTPUT.PUT_LINE('Very Good');
            WHEN grade = 'C' THEN DBMS_OUTPUT.PUT_LINE('Good');
            WHEN grade = 'D' THEN DBMS_OUTPUT.PUT_LINE('Fair');
            WHEN grade = 'F' THEN DBMS_OUTPUT.PUT_LINE('Poor');
            ELSE DBMS_OUTPUT.PUT_LINE('No such grade');
          END CASE;
        END;
        /

  - id: plsql_basic_loop
    name: PL/SQL basic LOOP statement
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/lnpls/basic-LOOP-statement.html
    tier: high
    probes:
      - id: loop_exit_when
        sql: "BEGIN LOOP x := x + 1; EXIT WHEN x > 3; END LOOP; END;"
      - id: labeled_loops
        sql: "BEGIN <<outer>> LOOP <<inner>> LOOP EXIT outer WHEN x > 3; EXIT inner; END LOOP inner; END LOOP outer; END;"
    examples:
      - |-
        DECLARE
          s  PLS_INTEGER := 0;
          i  PLS_INTEGER := 0;
          j  PLS_INTEGER;
        BEGIN
          <<outer_loop>>
          LOOP
            i := i + 1;
            j := 0;
            <<inner_loop>>
            LOOP
              j := j + 1;
              s := s + i * j; -- Sum several products
              EXIT inner_loop WHEN (j > 5);
              EXIT outer_loop WHEN ((i * j) > 15);
            END LOOP inner_loop;
          END LOOP outer_loop;
          DBMS_OUTPUT.PUT_LINE
            ('The sum of products equals: ' || TO_CHAR(s));
        END;
        /

  - id: plsql_while_loop
    name: PL/SQL WHILE LOOP statement
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/lnpls/WHILE-LOOP-statement.html
    tier: high
    probes:
      - id: while
        sql: "BEGIN WHILE x < 10 LOOP x := x + 1; END LOOP; END;"
      - id: while_not_labeled
        sql: "BEGIN <<w>> WHILE NOT done LOOP done := TRUE; END LOOP w; END;"
    examples:
      - |-
        DECLARE
          done  BOOLEAN := FALSE;
        BEGIN
          WHILE done LOOP
            DBMS_OUTPUT.PUT_LINE ('This line does not print.');
            done := TRUE;  -- This assignment is not made.
          END LOOP;

          WHILE NOT done LOOP
            DBMS_OUTPUT.PUT_LINE ('Hello, world!');
            done := TRUE;
          END LOOP;
        END;
        /

  - id: plsql_for_loop
    name: PL/SQL FOR LOOP statement (and iterator)
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/lnpls/FOR-LOOP-statement.html
    tier: high
    probes:
      - id: numeric_range
        sql: "BEGIN FOR i IN 1 .. 10 LOOP x := x + i; END LOOP; END;"
      - id: range_no_spaces
        sql: "BEGIN FOR i IN 1..3 LOOP NULL; END LOOP; END;"
      - id: reverse
        sql: "BEGIN FOR i IN REVERSE 1 .. 10 LOOP NULL; END LOOP; END;"
      - id: expression_bounds
        sql: "BEGIN FOR j IN 2 .. ROUND(SQRT(n)) LOOP NULL; END LOOP; END;"
      - id: stepped_by
        sql: "BEGIN FOR i IN 1 .. 10 BY 2 LOOP NULL; END LOOP; END;"
      - id: typed_iterand
        sql: "BEGIN FOR n NUMBER(5,1) IN 1.0 .. 3.0 BY 0.5 LOOP NULL; END LOOP; END;"
      - id: mutable_iterand
        sql: "BEGIN FOR i MUTABLE PLS_INTEGER IN 1 .. 10 LOOP i := i + 1; END LOOP; END;"
      - id: single_expression
        sql: "BEGIN FOR i IN 1 LOOP NULL; END LOOP; END;"
      - id: multiple_controls
        sql: "BEGIN FOR i IN 1 .. 3, REVERSE 10 .. 12, 20 LOOP NULL; END LOOP; END;"
      - id: repeat_while
        sql: "BEGIN FOR p IN 1, REPEAT p * 2 WHILE p <= 64 LOOP NULL; END LOOP; END;"
      - id: when_filter
        sql: "BEGIN FOR i IN 1 .. 10 WHEN MOD(i, 2) = 0 LOOP NULL; END LOOP; END;"
      - id: values_of
        sql: "DECLARE TYPE v_t IS TABLE OF PLS_INTEGER INDEX BY PLS_INTEGER; v v_t := v_t(3 => 10, 1 => 11); BEGIN FOR i IN VALUES OF v LOOP NULL; END LOOP; END;"
      - id: indices_of
        sql: "DECLARE TYPE v_t IS TABLE OF PLS_INTEGER INDEX BY PLS_INTEGER; v v_t := v_t(3 => 10, 1 => 11); BEGIN FOR i IN INDICES OF v LOOP NULL; END LOOP; END;"
      - id: pairs_of
        sql: "DECLARE TYPE v_t IS TABLE OF PLS_INTEGER INDEX BY PLS_INTEGER; v v_t := v_t(3 => 10, 1 => 11); BEGIN FOR i, j IN PAIRS OF v LOOP NULL; END LOOP; END;"
      - id: values_of_dynamic_sql
        sql: "DECLARE TYPE r_t IS RECORD (n VARCHAR2(25), id NUMBER); BEGIN FOR r r_t IN VALUES OF (EXECUTE IMMEDIATE 'SELECT n, id FROM t') WHEN r.id < 103 LOOP NULL; END LOOP; END;"
      - id: values_of_sql_statement
        sql: "BEGIN FOR r t%ROWTYPE IN VALUES OF (SELECT * FROM t) LOOP NULL; END LOOP; END;"
      - id: labeled_qualified_index
        sql: "BEGIN <<outer>> FOR i IN 1 .. 3 LOOP <<inner>> FOR i IN 1 .. 3 LOOP x := outer.i + inner.i; END LOOP inner; END LOOP outer; END;"
    examples:
      - |-
        BEGIN
          FOR i IN 1..3 LOOP
             DBMS_OUTPUT.PUT_LINE (i);
          END LOOP;
        END;
        /
      - |-
        BEGIN
           FOR n NUMBER(5,1) IN 1.0 .. 3.0 BY 0.5 LOOP
              DBMS_OUTPUT.PUT_LINE(n);
           END LOOP;
        END;
        /
      - |-
        DECLARE
           TYPE intvec_t IS TABLE OF PLS_INTEGER INDEX BY PLS_INTEGER;
           vec  intvec_t := intvec_t(3 => 10, 1 => 11, 100 => 34);
           result intvec_t;
        BEGIN
           result := intvec_t(FOR i,j IN PAIRS OF vec INDEX j => i);
           FOR i,j IN PAIRS OF result LOOP
              DBMS_OUTPUT.PUT_LINE(i || '=>'|| j);
           END LOOP;
        END;
        /
      - |-
        DECLARE
           cursor_str VARCHAR2(500) := 'SELECT last_name, employee_id FROM hr.employees ORDER BY last_name';
           TYPE rec_t IS RECORD (last_name VARCHAR2(25),
                                 employee_id NUMBER);
        BEGIN
           FOR r rec_t IN VALUES OF (EXECUTE IMMEDIATE cursor_str) WHEN r.employee_id < 103 LOOP
              DBMS_OUTPUT.PUT_LINE(r.last_name || ', ' || r.employee_id);
           END LOOP;
        END;
        /
      - |-
        BEGIN
           FOR power IN 1, REPEAT power*2 WHILE power <= 64 LOOP
              DBMS_OUTPUT.PUT_LINE(power);
           END LOOP;
        END;
        /

  - id: plsql_exit_statement
    name: PL/SQL EXIT statement
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/lnpls/EXIT-statement.html
    tier: high
    probes:
      - id: exit
        sql: "BEGIN LOOP IF x > 3 THEN EXIT; END IF; END LOOP; END;"
      - id: exit_when
        sql: "BEGIN LOOP x := x + 1; EXIT WHEN x > 3; END LOOP; END;"
      - id: exit_label_when
        sql: "BEGIN <<l>> LOOP EXIT l WHEN x > 3; END LOOP l; END;"
    examples:
      - |-
        DECLARE
          x NUMBER := 0;
        BEGIN
          LOOP
            DBMS_OUTPUT.PUT_LINE ('Inside loop:  x = ' || TO_CHAR(x));
            x := x + 1;
            IF x > 3 THEN
              EXIT;
            END IF;
          END LOOP;
          -- After EXIT, control resumes here
          DBMS_OUTPUT.PUT_LINE(' After loop:  x = ' || TO_CHAR(x));
        END;
        /
      - |-
        DECLARE
          x NUMBER := 0;
        BEGIN
          LOOP
            DBMS_OUTPUT.PUT_LINE('Inside loop:  x = ' || TO_CHAR(x));
            x := x + 1;  -- prevents infinite loop
            EXIT WHEN x > 3;
          END LOOP;
          -- After EXIT statement, control resumes here
          DBMS_OUTPUT.PUT_LINE('After loop:  x = ' || TO_CHAR(x));
        END;
        /

  - id: plsql_continue_statement
    name: PL/SQL CONTINUE statement
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/lnpls/CONTINUE-statement.html
    tier: high
    probes:
      - id: continue
        sql: "BEGIN LOOP x := x + 1; IF x < 3 THEN CONTINUE; END IF; EXIT WHEN x = 5; END LOOP; END;"
      - id: continue_when
        sql: "BEGIN LOOP x := x + 1; CONTINUE WHEN x < 3; EXIT WHEN x = 5; END LOOP; END;"
      - id: continue_label_when
        sql: "BEGIN <<o>> FOR i IN 1 .. 3 LOOP FOR j IN 1 .. 3 LOOP CONTINUE o WHEN j = 2; END LOOP; END LOOP o; END;"
    examples:
      - |-
        DECLARE
          x NUMBER := 0;
        BEGIN
          LOOP -- After CONTINUE statement, control resumes here
            DBMS_OUTPUT.PUT_LINE ('Inside loop:  x = ' || TO_CHAR(x));
            x := x + 1;
            CONTINUE WHEN x < 3;
            DBMS_OUTPUT.PUT_LINE
              ('Inside loop, after CONTINUE:  x = ' || TO_CHAR(x));
            EXIT WHEN x = 5;
          END LOOP;
          DBMS_OUTPUT.PUT_LINE (' After loop:  x = ' || TO_CHAR(x));
        END;
        /

  - id: plsql_goto_statement
    name: PL/SQL GOTO statement
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/lnpls/GOTO-statement.html
    tier: medium
    probes:
      - id: goto_label
        sql: "BEGIN IF x = 0 THEN GOTO done; END IF; x := 1; <<done>> NULL; END;"
      - id: goto_out_of_loop
        sql: "BEGIN FOR j IN 1 .. 10 LOOP IF j = 5 THEN GOTO after_loop; END IF; END LOOP; <<after_loop>> x := 1; END;"
    examples:
      - |-
        DECLARE
          p  VARCHAR2(30);
          n  PLS_INTEGER := 37;
        BEGIN
          FOR j in 2..ROUND(SQRT(n)) LOOP
            IF n MOD j = 0 THEN
              p := ' is not a prime number';
              GOTO print_now;
            END IF;
          END LOOP;

          p := ' is a prime number';
         
          <<print_now>>
          DBMS_OUTPUT.PUT_LINE(TO_CHAR(n) || p);
        END;
        /

  - id: plsql_null_statement
    name: PL/SQL NULL statement
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/lnpls/NULL-statement.html
    tier: high
    probes:
      - id: null_only
        sql: "BEGIN NULL; END;"
      - id: null_in_branch
