dialect: snowflake
engine: Snowflake
version: "current (docs read 2026-10-04)"
source: https://docs.snowflake.com/en/sql-reference/sql-all

statements:
  - id: drop_row_access_policy
    name: DROP ROW ACCESS POLICY
    doc: https://docs.snowflake.com/en/sql-reference/sql/drop-drop-row-access-policy
    tier: medium
    probes:
      - id: basic
        sql: "DROP ROW ACCESS POLICY rap;"
      - id: if_exists
        sql: "DROP ROW ACCESS POLICY IF EXISTS rap;"
      - id: qualified_name
        sql: "DROP ROW ACCESS POLICY db.sch.rap;"
  - id: drop_secret
    name: DROP SECRET
    doc: https://docs.snowflake.com/en/sql-reference/sql/drop-drop-secret
    tier: medium
    probes:
      - id: basic
        sql: "DROP SECRET s;"
      - id: if_exists
        sql: "DROP SECRET IF EXISTS s;"
      - id: qualified_name
        sql: "DROP SECRET db.sch.s;"
    examples:
      - "DROP SECRET service_now_creds;"
  - id: drop_sequence
    name: DROP SEQUENCE
    doc: https://docs.snowflake.com/en/sql-reference/sql/drop-drop-sequence
    tier: medium
    probes:
      - id: basic
        sql: "DROP SEQUENCE seq;"
      - id: if_exists
        sql: "DROP SEQUENCE IF EXISTS seq;"
      - id: cascade
        sql: "DROP SEQUENCE seq CASCADE;"
      - id: restrict
        sql: "DROP SEQUENCE seq RESTRICT;"
      - id: qualified_name
        sql: "DROP SEQUENCE db.sch.seq;"
    examples:
      - "DROP SEQUENCE IF EXISTS invoice_sequence_number;"
  - id: drop_share
    name: DROP SHARE
    doc: https://docs.snowflake.com/en/sql-reference/sql/drop-drop-share
    tier: medium
    probes:
      - id: basic
        sql: "DROP SHARE sh;"
    examples:
      - "DROP SHARE sales_s;"
  - id: drop_stage
    name: DROP STAGE
    doc: https://docs.snowflake.com/en/sql-reference/sql/drop-drop-stage
    tier: medium
    probes:
      - id: basic
        sql: "DROP STAGE my_stage;"
      - id: if_exists
        sql: "DROP STAGE IF EXISTS my_stage;"
      - id: qualified_name
        sql: "DROP STAGE db.sch.my_stage;"
    examples:
      - "DROP STAGE my_stage;"
  - id: drop_stream
    name: DROP STREAM
    doc: https://docs.snowflake.com/en/sql-reference/sql/drop-drop-stream
    tier: medium
    probes:
      - id: basic
        sql: "DROP STREAM t2;"
      - id: if_exists
        sql: "DROP STREAM IF EXISTS t2;"
      - id: qualified_name
        sql: "DROP STREAM db.sch.t2;"
    examples:
      - "DROP STREAM t2;"
      - "DROP STREAM IF EXISTS t2;"
  - id: drop_tag
    name: DROP TAG
    doc: https://docs.snowflake.com/en/sql-reference/sql/drop-drop-tag
    tier: medium
    probes:
      - id: basic
        sql: "DROP TAG tg;"
      - id: if_exists
        sql: "DROP TAG IF EXISTS tg;"
      - id: qualified_name
        sql: "DROP TAG db.sch.tg;"
  - id: drop_task
    name: DROP TASK
    doc: https://docs.snowflake.com/en/sql-reference/sql/drop-drop-task
    tier: medium
    probes:
      - id: basic
        sql: "DROP TASK t2;"
      - id: if_exists
        sql: "DROP TASK IF EXISTS t2;"
      - id: qualified_name
        sql: "DROP TASK db.sch.t2;"
    examples:
      - "DROP TASK t2;"
      - "DROP TASK IF EXISTS t2;"
  - id: drop_type
    name: DROP TYPE
    doc: https://docs.snowflake.com/en/sql-reference/sql/drop-drop-type
    tier: medium
    probes:
      - id: basic
        sql: "DROP TYPE age;"
      - id: qualified_name
        sql: "DROP TYPE db.sch.age;"
    examples:
      - "DROP TYPE age;"
  - id: drop_user
    name: DROP USER
    doc: https://docs.snowflake.com/en/sql-reference/sql/drop-drop-user
    tier: medium
    probes:
      - id: basic
        sql: "DROP USER user1;"
      - id: if_exists
        sql: "DROP USER IF EXISTS user1;"
    examples:
      - "DROP USER user1;"
