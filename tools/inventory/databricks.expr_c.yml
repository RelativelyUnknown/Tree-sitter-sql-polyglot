      - { id: explode, sql: "SELECT explode(array(10, 20));" }
      - { id: explode_map, sql: "SELECT explode(map(1, 'a', 2, 'b'));" }
      - { id: posexplode, sql: "SELECT posexplode(array(10, 20));" }
      - { id: inline_array_of_struct, sql: "SELECT inline(array(struct(1, 'a'), struct(2, 'b')));" }
