      - { id: range_between_interval_following, sql: "SELECT sum(c) OVER (ORDER BY ts RANGE BETWEEN INTERVAL 1 DAY PRECEDING AND INTERVAL 1 DAY FOLLOWING) FROM t;" }
      - { id: frame_with_partition, sql: "SELECT sum(c) OVER (PARTITION BY d ORDER BY e ROWS BETWEEN 1 PRECEDING AND 1 FOLLOWING) FROM t;" }
