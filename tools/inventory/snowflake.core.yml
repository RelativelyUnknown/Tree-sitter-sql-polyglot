  - id: create_external_table
    name: "CREATE EXTERNAL TABLE"
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-external-table
    tier: medium
    probes:
      - { id: basic, sql: "CREATE EXTERNAL TABLE et LOCATION = @s/logs/ FILE_FORMAT = (TYPE = PARQUET);" }
      - { id: columns_partition_auto_refresh, sql: "CREATE OR REPLACE EXTERNAL TABLE IF NOT EXISTS et (d DATE AS TO_DATE(SPLIT_PART(metadata$filename, '/', 3), 'YYYY'), ts BIGINT AS (value:timestamp::BIGINT)) PARTITION BY (d) LOCATION = @s/logs/ AUTO_REFRESH = TRUE PATTERN = '.*[.]parquet' FILE_FORMAT = (TYPE = PARQUET) AWS_SNS_TOPIC = 'arn:aws:sns:us-west-2:001234567890:s3_mybucket';" }
      - { id: integration_with_location, sql: "CREATE EXTERNAL TABLE et (c VARCHAR AS (value:c::VARCHAR)) INTEGRATION = 'MY_INT' WITH LOCATION = @s/ REFRESH_ON_CREATE = FALSE FILE_FORMAT = (FORMAT_NAME = 'ff') COPY GRANTS COMMENT = 'c';" }
      - { id: user_specified_partitions, sql: "CREATE EXTERNAL TABLE et (c1 DATE AS (PARSE_JSON(metadata$external_table_partition):COL1::DATE)) PARTITION BY (c1) LOCATION = @s2/logs/ PARTITION_TYPE = USER_SPECIFIED FILE_FORMAT = (TYPE = PARQUET);" }
      - { id: delta, sql: "CREATE EXTERNAL TABLE et (c VARCHAR AS (value:c::VARCHAR)) LOCATION = @s/ PARTITION_TYPE = USER_SPECIFIED FILE_FORMAT = (TYPE = PARQUET) TABLE_FORMAT = DELTA;" }
      - { id: format_options_policies, sql: "CREATE EXTERNAL TABLE et LOCATION = @s/ FILE_FORMAT = (TYPE = CSV SKIP_HEADER = 1 FIELD_DELIMITER = '|' NULL_IF = ('NULL', '')) WITH ROW ACCESS POLICY rap ON (VALUE) WITH TAG (tg = 'v');" }
      - { id: using_template, sql: "CREATE EXTERNAL TABLE et USING TEMPLATE (SELECT ARRAY_AGG(OBJECT_CONSTRUCT(*)) FROM TABLE(INFER_SCHEMA(LOCATION => '@s', FILE_FORMAT => 'ff'))) LOCATION = @s/ FILE_FORMAT = (FORMAT_NAME = 'ff');" }
    examples:
      - |-
        CREATE EXTERNAL TABLE et1(
          date_part date AS TO_DATE(SPLIT_PART(metadata$filename, '/', 3)
         || '/' || SPLIT_PART(metadata$filename, '/', 4)
         || '/' || SPLIT_PART(metadata$filename, '/', 5), 'YYYY/MM/DD'),
          timestamp bigint AS (value:timestamp::bigint),
          col2 varchar AS (value:col2::varchar))
          PARTITION BY (date_part)
          LOCATION=@s1/logs/
          AUTO_REFRESH = true
          FILE_FORMAT = (TYPE = PARQUET);
      - |-
        CREATE EXTERNAL TABLE et1(
          date_part date AS TO_DATE(SPLIT_PART(metadata$filename, '/', 3)
         || '/' || SPLIT_PART(metadata$filename, '/', 4)
         || '/' || SPLIT_PART(metadata$filename, '/', 5), 'YYYY/MM/DD'),
          timestamp bigint AS (value:timestamp::bigint),
          col2 varchar AS (value:col2::varchar))
          PARTITION BY (date_part)
          INTEGRATION = 'MY_INT'
          LOCATION=@s1/logs/
          AUTO_REFRESH = true
          FILE_FORMAT = (TYPE = PARQUET);
      - |-
        create external table et2(
          col1 date as (parse_json(metadata$external_table_partition):COL1::date),
          col2 varchar as (parse_json(metadata$external_table_partition):COL2::varchar),
          col3 number as (parse_json(metadata$external_table_partition):COL3::number))
          partition by (col1,col2,col3)
          location=@s2/logs/
          partition_type = user_specified
          file_format = (type = parquet);
      - |-
        CREATE OR REPLACE EXTERNAL TABLE daily_tweets
          WITH LOCATION = @twitter_feed/daily/;

