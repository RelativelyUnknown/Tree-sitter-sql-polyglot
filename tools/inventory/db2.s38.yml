dialect: db2
engine: IBM Db2 for Linux, UNIX and Windows
version: "11.5"
source: https://www.ibm.com/docs/en/db2/11.5.x?topic=reference-statements

statements:
  - id: set_current_federated_asynchrony
    name: SET CURRENT FEDERATED ASYNCHRONY
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-set-current-federated-asynchrony
    tier: low
    probes:
      - { id: any, sql: "SET CURRENT FEDERATED ASYNCHRONY = ANY;" }
      - { id: integer, sql: "SET CURRENT FEDERATED ASYNCHRONY = 4;" }

  - id: set_current_implicit_xmlparse_option
    name: SET CURRENT IMPLICIT XMLPARSE OPTION
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-set-current-implicit-xmlparse-option
    tier: low
    probes:
      - { id: strip, sql: "SET CURRENT IMPLICIT XMLPARSE OPTION = 'STRIP WHITESPACE';" }
      - { id: preserve, sql: "SET CURRENT IMPLICIT XMLPARSE OPTION = 'PRESERVE WHITESPACE';" }

  - id: set_current_locale_lc_messages
    name: SET CURRENT LOCALE LC_MESSAGES
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-set-current-locale-lc-messages
    tier: low
    probes:
      - { id: string_constant, sql: "SET CURRENT LOCALE LC_MESSAGES = 'en_US';" }

  - id: set_current_locale_lc_time
    name: SET CURRENT LOCALE LC_TIME
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-set-current-locale-lc-time
    tier: low
    probes:
      - { id: string_constant, sql: "SET CURRENT LOCALE LC_TIME = 'en_US';" }

  - id: set_current_maintained_table_types_for_optimization
    name: SET CURRENT MAINTAINED TABLE TYPES FOR OPTIMIZATION
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-set-current-maintained-table-types-optimization
    tier: low
    probes:
      - { id: all, sql: "SET CURRENT MAINTAINED TABLE TYPES FOR OPTIMIZATION = ALL;" }
      - { id: none, sql: "SET CURRENT MAINTAINED TABLE TYPES FOR OPTIMIZATION = NONE;" }
      - { id: type_list, sql: "SET CURRENT MAINTAINED TABLE TYPES FOR OPTIMIZATION = SYSTEM, USER;" }

  - id: set_current_mdc_rollout_mode
    name: SET CURRENT MDC ROLLOUT MODE
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-set-current-mdc-rollout-mode
    tier: low
    probes:
      - { id: immediate, sql: "SET CURRENT MDC ROLLOUT MODE IMMEDIATE;" }
      - { id: deferred_equals, sql: "SET CURRENT MDC ROLLOUT MODE = DEFERRED;" }
      - { id: none, sql: "SET CURRENT MDC ROLLOUT MODE NONE;" }

  - id: set_current_optimization_profile
    name: SET CURRENT OPTIMIZATION PROFILE
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-set-current-optimization-profile
    tier: low
    probes:
      - { id: name, sql: "SET CURRENT OPTIMIZATION PROFILE = s.prof;" }
      - { id: string_constant, sql: "SET CURRENT OPTIMIZATION PROFILE = 's.prof';" }
      - { id: null_value, sql: "SET CURRENT OPTIMIZATION PROFILE = NULL;" }

  - id: set_current_package_path
    name: SET CURRENT PACKAGE PATH
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-set-current-package-path
    tier: low
    probes:
      - { id: schema_list, sql: "SET CURRENT PACKAGE PATH = s1, s2;" }
      - { id: special_register, sql: "SET CURRENT PACKAGE PATH = CURRENT USER, CURRENT PATH;" }
      - { id: string_constant, sql: "SET CURRENT PACKAGE PATH = 's1';" }

  - id: set_current_packageset
    name: SET CURRENT PACKAGESET
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-set-current-packageset
    tier: low
    probes:
      - { id: string_constant, sql: "SET CURRENT PACKAGESET = 'pkg';" }

  - id: set_current_query_optimization
    name: SET CURRENT QUERY OPTIMIZATION
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-set-current-query-optimization
    tier: low
    probes:
      - { id: class, sql: "SET CURRENT QUERY OPTIMIZATION = 5;" }
      - { id: class_no_equals, sql: "SET CURRENT QUERY OPTIMIZATION 9;" }

  - id: set_current_refresh_age
    name: SET CURRENT REFRESH AGE
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-set-current-refresh-age
    tier: low
    probes:
      - { id: any, sql: "SET CURRENT REFRESH AGE = ANY;" }
      - { id: numeric, sql: "SET CURRENT REFRESH AGE = 0;" }

  - id: set_current_sql_ccflags
    name: SET CURRENT SQL_CCFLAGS
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-set-current-sql-ccflags
    tier: low
    probes:
      - { id: string_constant, sql: "SET CURRENT SQL_CCFLAGS = 'DEBUG:1, LEVEL:2';" }

  - id: set_encryption_password
    name: SET ENCRYPTION PASSWORD
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-set-encryption-password
    tier: low
    probes:
      - { id: string_constant, sql: "SET ENCRYPTION PASSWORD = 'Ben123';" }

  - id: set_event_monitor_state
    name: SET EVENT MONITOR STATE
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-set-event-monitor-state
    tier: low
    probes:
      - { id: activate, sql: "SET EVENT MONITOR evmon STATE = 1;" }
      - { id: deactivate, sql: "SET EVENT MONITOR evmon STATE 0;" }

  - id: set_passthru
    name: SET PASSTHRU
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-set-passthru
    tier: low
    probes:
      - { id: server, sql: "SET PASSTHRU srv;" }
      - { id: reset, sql: "SET PASSTHRU RESET;" }

  - id: set_server_option
    name: SET SERVER OPTION
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-set-server-option
    tier: low
    probes:
      - { id: basic, sql: "SET SERVER OPTION plan_hints TO 'Y' FOR SERVER srv;" }

  - id: set_usage_list_state
    name: SET USAGE LIST STATE
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-set-usage-list-state
    tier: low
    probes:
      - { id: active, sql: "SET USAGE LIST ul STATE = ACTIVE;" }
      - { id: inactive, sql: "SET USAGE LIST s.ul STATE = INACTIVE;" }
      - { id: released, sql: "SET USAGE LIST ul STATE = RELEASED;" }

  - id: whenever
    name: WHENEVER
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-whenever
    tier: low
    status: not-sql
    reason: Embedded-SQL host construct handled by the precompiler (WHENEVER ... GOTO host-label / DO function-name()); never reaches the server's SQL parser.
