name: Windows Oracle addon experiment
# Throwaway: builds only the Oracle node addon on Windows in several configurations. Delete after use.
on:
  push:
    branches: ["ccr-7b871ec0-wgknnh"]
    paths: [".github/experiments/win-oracle-1/**"]

jobs:
  variant:
    name: win oracle (${{ matrix.variant }})
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        variant: [default_a, default_b, default_c]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.variant == 'x64env'
        with:
          arch: x64
      - run: node scripts/inflate-parsers.js oracle
      - run: npm ci --ignore-scripts
      - name: Apply variant
        run: |
          # the binding.gyp and toolchain env as they were when Oracle last compiled on Windows (before bc38693)
          git show bc38693^:binding.gyp > binding.gyp
          grep -c '"Optimization"' binding.gyp || true
          echo "--- runner image:"; echo "ImageVersion=$ImageVersion ImageOS=$ImageOS"
      - name: Configure and build the Oracle addon only
        run: |
          npx node-gyp configure
          P="build/tree_sitter_sql_oracle_binding.vcxproj"
          ls "$P"
          START=$(date +%s)
          "C:/Program Files/Microsoft Visual Studio/18/Enterprise/MSBuild/Current/Bin/MSBuild.exe" "$P" -p:Configuration=Release -p:Platform=x64 -v:minimal -m:1 2>&1 | grep -vE "warning C6|warning C4" | tail -15
          echo "RESULT variant=${{ matrix.variant }} image=$ImageVersion exit=${PIPESTATUS[0]} seconds=$(( $(date +%s) - START ))"
