      # A change-capture object that only the Oracle family spells this way;
      # elsewhere incremental refresh is either automatic or unavailable.
      postgres:    { status: not-applicable, reason: "Full refresh only; no MV log object" }
      cockroachdb: { status: not-applicable, reason: "No materialized view log" }
      mysql:       { status: not-applicable, reason: "No materialized views" }
      mariadb:     { status: not-applicable, reason: "No materialized views" }
      sqlite:      { status: not-applicable, reason: "No materialized views" }
      duckdb:      { status: not-applicable, reason: "No materialized views" }
      tsql:        { status: not-applicable, reason: "Indexed views refresh implicitly" }
      db2:         { status: not-applicable, reason: "MQT staging tables, not a MV log" }
      hive:        { status: not-applicable, reason: "No materialized view log" }
      spark:       { status: not-applicable, reason: "No materialized view log" }
      databricks:  { status: not-applicable, reason: "No materialized view log" }
      snowflake:   { status: not-applicable, reason: "Materialized views refresh automatically" }
      bigquery:    { status: not-applicable, reason: "Materialized views refresh automatically" }
      spanner:     { status: not-applicable, reason: "No materialized views" }
      redshift:    { status: not-applicable, reason: "No materialized view log" }
      trino:       { status: not-applicable, reason: "No materialized view log" }
      athena:      { status: not-applicable, reason: "No materialized views" }
      clickhouse:  { status: not-applicable, reason: "Materialized views are insert triggers" }
      flink:       { status: not-applicable, reason: "No materialized view log" }
      teradata:    { status: not-applicable, reason: "Join indexes refresh implicitly" }
      hana:        { status: not-applicable, reason: "No materialized view log" }

  - id: database_link
    name: "Remote database link / connection object"
    category: ddl
    ansi: false
    weight: 1
    probe: "CREATE DATABASE LINK dl1 CONNECT TO u1 IDENTIFIED BY p1 USING 'svc';"
    dialects:
      postgres:    { probe: "CREATE SERVER srv1 FOREIGN DATA WRAPPER fdw1;" }
      cockroachdb: { probe: "CREATE EXTERNAL CONNECTION ec1 AS 's3://b';" }
      mariadb:     { probe: "CREATE SERVER srv1 FOREIGN DATA WRAPPER mysql OPTIONS (HOST 'h');" }
      mysql:       { probe: "CREATE SERVER srv1 FOREIGN DATA WRAPPER mysql OPTIONS (HOST 'h');" }
      bigquery:    { probe: "CREATE CONNECTION `p.r.c1` OPTIONS (type = 'CLOUD_SQL');" }
      flink:       { probe: "CREATE CATALOG c1 WITH ('type' = 'hive');" }
      # Every engine below has a first-class remote-connection object; only
      # the Oracle family spells it CREATE DATABASE LINK.
      db2:         { probe: "CREATE SERVER srv1 WRAPPER drda OPTIONS (NODE 'n1');" }
      hana:        { probe: "CREATE REMOTE SOURCE rs1 ADAPTER odbc CONFIGURATION 'dsn=d1';" }
      trino:       { probe: "CREATE CATALOG c1 USING postgresql;" }
      snowflake:   { probe: "CREATE STORAGE INTEGRATION si1 TYPE = EXTERNAL_STAGE STORAGE_PROVIDER = 'S3';" }
      tsql:        { probe: "CREATE EXTERNAL DATA SOURCE ds1 WITH (LOCATION = 'sqlserver://h');" }
      redshift:    { probe: "CREATE EXTERNAL SCHEMA s1 FROM POSTGRES DATABASE 'db1' URI 'h' IAM_ROLE 'arn';" }
      sqlite:      { status: not-applicable, reason: "ATTACH DATABASE, not a link object" }
      duckdb:      { status: not-applicable, reason: "ATTACH, not a link object" }
      spanner:     { status: not-applicable, reason: "No remote link object" }
      hive:        { status: not-applicable, reason: "No remote link object" }
      spark:       { status: not-applicable, reason: "No remote link object" }
      databricks:  { status: not-applicable, reason: "Foreign catalogs are Unity Catalog objects" }
      athena:      { status: not-applicable, reason: "Federation via Lambda connectors, not SQL" }
      clickhouse:  { status: not-applicable, reason: "Remote access via table/database engines, no link object" }
      teradata:    { status: not-applicable, reason: "QueryGrid links are configured, not created in SQL" }

  - id: optimize_table
    name: "Storage compaction / reorganisation"
    category: admin
    ansi: false
    weight: 1
    probe: "OPTIMIZE TABLE t1;"
    dialects:
      clickhouse:  { probe: "OPTIMIZE TABLE t1 FINAL;" }
      # OPTIMIZE is Delta Lake's compaction statement, available in open
      # source Delta since 2.0 — not a Databricks-only extension.
      spark:       { probe: "OPTIMIZE t1;" }
      # Hive compacts ACID tables through ALTER TABLE … COMPACT.
      hive:        { probe: "ALTER TABLE t1 COMPACT 'major';" }
      databricks:  { probe: "OPTIMIZE t1 ZORDER BY (a);" }
      hana:        { probe: "MERGE DELTA OF t1;" }
      db2:         { probe: "REORG TABLE t1;" }
      oracle:      { probe: "ALTER TABLE t1 SHRINK SPACE;" }
      postgres:    { status: not-applicable, reason: "VACUUM (a separate maintenance model)" }
      cockroachdb: { status: not-applicable, reason: "Compaction is automatic" }
      duckdb:      { status: not-applicable, reason: "CHECKPOINT/VACUUM, no compaction statement" }
      sqlite:      { probe: "VACUUM;" }
      snowflake:   { status: not-applicable, reason: "Micro-partitions are maintained automatically" }
      bigquery:    { status: not-applicable, reason: "Storage is managed automatically" }
      spanner:     { status: not-applicable, reason: "Storage is managed automatically" }
      redshift:    { probe: "VACUUM t1;" }
      trino:       { status: not-applicable, reason: "Query engine, no owned storage" }
      athena:      { status: not-applicable, reason: "Query engine, no owned storage" }
      flink:       { status: not-applicable, reason: "Query engine, no owned storage" }
      tsql:        { status: not-applicable, reason: "Index rebuild is the maintenance path" }
      teradata:    { status: not-applicable, reason: "No compaction statement" }

