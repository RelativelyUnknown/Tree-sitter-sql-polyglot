      - { id: python_inline, sql: "CREATE OR REPLACE FUNCTION f () RETURNS VARIANT LANGUAGE PYTHON RUNTIME_VERSION = '3.10' PACKAGES = ('numpy', 'pandas', 'xgboost==1.5.0') HANDLER = 'udf' AS $$ def udf(): return 1 $$;" }
      - { id: python_staged, sql: "CREATE OR REPLACE FUNCTION f (i INT) RETURNS VARIANT LANGUAGE PYTHON RUNTIME_VERSION = '3.10' HANDLER = 'sleepy.snore' IMPORTS = ('@my_stage/sleepy.py');" }
      - { id: python_aggregate, sql: "CREATE AGGREGATE FUNCTION f (a INT) RETURNS INT LANGUAGE PYTHON RUNTIME_VERSION = '3.11' ARTIFACT_REPOSITORY = 'snowflake.snowpark.pypi_shared_repository' HANDLER = 'Agg' AS $$ class Agg: pass $$;" }
      - { id: python_udtf, sql: "CREATE FUNCTION f (s VARCHAR) RETURNS TABLE (w VARCHAR) LANGUAGE PYTHON RUNTIME_VERSION = '3.10' HANDLER = 'Splitter' AS $$ class Splitter: pass $$;" }
      - { id: scala, sql: "CREATE OR REPLACE FUNCTION f (x VARCHAR) RETURNS VARCHAR LANGUAGE SCALA RUNTIME_VERSION = 2.12 HANDLER = 'Echo.echoVarchar' AS $$ class Echo { def echoVarchar(x : String): String = { return x } } $$;" }
      - { id: scala_staged, sql: "CREATE OR REPLACE FUNCTION f (x VARCHAR) RETURNS VARCHAR LANGUAGE SCALA RUNTIME_VERSION = 2.13 IMPORTS = ('@udf_libs/echohandler.jar') HANDLER = 'Echo.echoVarchar';" }
    examples:
      - |-
        CREATE FUNCTION pi_udf()
          RETURNS FLOAT
          AS '3.141592654::FLOAT'
          ;
      - |-
        CREATE FUNCTION simple_table_function ()
          RETURNS TABLE (x INTEGER, y INTEGER)
          AS
          $$
            SELECT 1, 2
            UNION ALL
            SELECT 3, 4
          $$
          ;
      - |-
        CREATE OR REPLACE FUNCTION js_factorial(d double)
          RETURNS double
          LANGUAGE JAVASCRIPT
          STRICT
          AS '
          if (D <= 0) {
            return 1;
          } else {
            var result = 1;
            for (var i = 2; i <= D; i++) {
              result = result * i;
            }
            return result;
          }
          ';
      - |-
        CREATE OR REPLACE FUNCTION py_udf()
          RETURNS VARIANT
          LANGUAGE PYTHON
          RUNTIME_VERSION = '3.10'
          PACKAGES = ('numpy','pandas','xgboost==1.5.0')
          HANDLER = 'udf'
        AS $$
        import numpy as np
        import pandas as pd
        import xgboost as xgb
        def udf():
            return [np.__version__, pd.__version__, xgb.__version__]
        $$;
      - |-
        CREATE OR REPLACE FUNCTION get_countries_for_user ( id NUMBER )
          RETURNS TABLE (country_code CHAR, country_name VARCHAR)
          AS 'SELECT DISTINCT c.country_code, c.country_name
              FROM user_addresses a, countries c
              WHERE a.user_id = id
              AND c.country_code = a.country_code';

