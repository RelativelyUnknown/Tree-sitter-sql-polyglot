    tier: medium
    probes:
      - { id: u_amp, sql: "SELECT U&'abc \\0041' UESCAPE '\\';" }
      - { id: u_amp_plus, sql: "SELECT U&'abc \\+000041' UESCAPE '\\';" }
      - { id: with_charset_prefix, sql: "SELECT _Unicode U&'abc \\0041' UESCAPE '\\';" }
      - { id: custom_escape, sql: "SELECT U&'abc !0041' UESCAPE '!';" }
      - { id: multiple_bodies, sql: "SELECT U&'abc' 'def' UESCAPE '\\';" }

