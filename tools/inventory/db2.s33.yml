dialect: db2
engine: IBM Db2 for Linux, UNIX and Windows
version: "11.5"
source: https://www.ibm.com/docs/en/db2/11.5.x?topic=reference-statements

statements:
  - id: grant_sequence_privileges
    name: GRANT (sequence privileges)
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-grant-sequence-privileges
    tier: medium
    probes:
      - { id: usage, sql: "GRANT USAGE ON SEQUENCE s TO u;" }
      - { id: alter, sql: "GRANT ALTER ON SEQUENCE s TO u;" }
      - { id: usage_alter_list, sql: "GRANT USAGE, ALTER ON SEQUENCE s TO USER u1, GROUP g1, ROLE r1;" }
      - { id: to_public, sql: "GRANT USAGE ON SEQUENCE s TO PUBLIC;" }
      - { id: with_grant_option, sql: "GRANT ALTER ON SEQUENCE s TO u WITH GRANT OPTION;" }
    examples:
      - "GRANT USAGE ON SEQUENCE ORG_SEQ TO PUBLIC;"
      - "GRANT ALTER ON SEQUENCE GENERATE_ID TO BOBBY WITH GRANT OPTION;"

  - id: grant_table_view_or_nickname_privileges
    name: GRANT (table, view, or nickname privileges)
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-grant-table-view-nickname-privileges
    tier: medium
    probes:
      - { id: all, sql: "GRANT ALL ON t TO PUBLIC;" }
      - { id: all_privileges, sql: "GRANT ALL PRIVILEGES ON TABLE t TO u;" }
      - { id: select_insert, sql: "GRANT SELECT, INSERT ON t TO USER u1, USER u2;" }
      - { id: alter_control_delete_index, sql: "GRANT ALTER, CONTROL, DELETE, INDEX ON TABLE t TO ROLE r;" }
      - { id: references_columns, sql: "GRANT REFERENCES (c1, c2) ON t TO GROUP g;" }
      - { id: update_columns, sql: "GRANT UPDATE (c1, c2) ON t TO u;" }
      - { id: with_grant_option, sql: "GRANT ALL ON t TO USER u WITH GRANT OPTION;" }
    examples:
      - "GRANT ALL ON WESTERN_CR TO PUBLIC;"
      - "GRANT SELECT, INSERT ON CALENDAR TO USER PHIL, USER CLAIRE;"
      - "GRANT ALL ON COUNCIL TO USER FRANK WITH GRANT OPTION;"

  - id: pipe
    name: PIPE
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-pipe
    tier: medium
    probes:
      - { id: expression_list, sql: "PIPE (1, 'a');", note: "Inside a pipelined table function body" }
      - { id: null_in_list, sql: "PIPE (1, NULL);" }
      - { id: row_fullselect, sql: "PIPE (SELECT c1, c2 FROM t FETCH FIRST 1 ROW ONLY);" }
      - { id: scalar_expression, sql: "PIPE 1;" }
      - { id: null_value, sql: "PIPE NULL;" }

  - id: prepare
    name: PREPARE
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-prepare
    tier: medium
    probes:
      - { id: from_variable, sql: "PREPARE s FROM v;" }
      - { id: from_string_expression, sql: "PREPARE s FROM 'SELECT c FROM t WHERE c = ?';" }
      - { id: from_concat_expression, sql: "PREPARE s FROM 'DELETE FROM ' || tabname;" }
      - { id: output_into, sql: "PREPARE s OUTPUT INTO d FROM v;" }
      - { id: input_into, sql: "PREPARE s INPUT INTO d FROM v;" }

  - id: refresh_table
    name: REFRESH TABLE
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-refresh-table
    tier: medium
    probes:
      - { id: basic, sql: "REFRESH TABLE t;" }
      - { id: table_list, sql: "REFRESH TABLE t1, t2;" }
      - { id: incremental, sql: "REFRESH TABLE t INCREMENTAL;" }
      - { id: not_incremental, sql: "REFRESH TABLE t NOT INCREMENTAL;" }
      - { id: allow_no_access, sql: "REFRESH TABLE t ALLOW NO ACCESS;" }
      - { id: allow_read_access, sql: "REFRESH TABLE t ALLOW READ ACCESS;" }
      - { id: allow_write_access, sql: "REFRESH TABLE t ALLOW WRITE ACCESS;" }
      - { id: allow_query_optimization, sql: "REFRESH TABLE t ALLOW QUERY OPTIMIZATION USING REFRESH DEFERRED TABLES WITH REFRESH AGE ANY;", note: "query-optimization-options" }

  - id: release_connection
    name: RELEASE (connection)
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-release-connection
    tier: medium
    probes:
      - { id: server_name, sql: "RELEASE srv;" }
      - { id: host_variable, sql: "RELEASE :hv;" }
      - { id: current, sql: "RELEASE CURRENT;" }
      - { id: all, sql: "RELEASE ALL;" }
      - { id: all_sql, sql: "RELEASE ALL SQL;" }
    examples:
      - "RELEASE IBMSTHDB;"
      - "RELEASE CURRENT;"
      - "RELEASE ALL;"

  - id: rename
    name: RENAME
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-rename
    tier: medium
    probes:
      - { id: rename_table, sql: "RENAME TABLE t TO t2;" }
      - { id: rename_table_qualified, sql: "RENAME TABLE s.t TO t2;" }
      - { id: rename_without_table_keyword, sql: "RENAME t TO t2;", note: "The TABLE keyword is optional" }
      - { id: rename_index, sql: "RENAME INDEX idx TO idx2;" }
      - { id: rename_index_qualified, sql: "RENAME INDEX s.idx TO idx2;" }
    examples:
      - "RENAME TABLE EMP TO EMPLOYEE;"
      - "RENAME TABLE ABC.EMP TO EMPLOYEE;"
      - "RENAME INDEX ABC.NEW-IND TO IND;"

  - id: revoke_database_authorities
    name: REVOKE (database authorities)
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-revoke-database-authorities
    tier: medium
    probes:
      - { id: single, sql: "REVOKE CREATETAB ON DATABASE FROM u;" }
      - { id: authority_list, sql: "REVOKE ACCESSCTRL, BINDADD, CONNECT, DATAACCESS, EXPLAIN, IMPLICIT_SCHEMA, LOAD ON DATABASE FROM USER u1, GROUP g1, ROLE r1;" }
      - { id: admin_authorities, sql: "REVOKE DBADM, SECADM, SQLADM, WLMADM ON DATABASE FROM PUBLIC;" }
      - { id: routine_and_secure_authorities, sql: "REVOKE CREATE_EXTERNAL_ROUTINE, CREATE_NOT_FENCED_ROUTINE, CREATE_SECURE_OBJECT, QUIESCE_CONNECT ON DATABASE FROM u;" }
      - { id: by_all, sql: "REVOKE BINDADD ON DATABASE FROM u BY ALL;" }
    examples:
      - "REVOKE CREATETAB ON DATABASE FROM USER6;"
      - "REVOKE BINDADD ON DATABASE FROM GROUP D024;"
      - "REVOKE SECADM ON DATABASE FROM USER Walid;"

  - id: revoke_role
    name: REVOKE (role)
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-revoke-role
    tier: medium
    probes:
      - { id: role_from_user, sql: "REVOKE ROLE r FROM USER u;" }
      - { id: role_list, sql: "REVOKE ROLE r1, r2 FROM u;" }
      - { id: from_group_and_role, sql: "REVOKE ROLE r FROM USER u, GROUP g, ROLE r2;" }
      - { id: from_public, sql: "REVOKE ROLE r FROM PUBLIC;" }
      - { id: admin_option_for, sql: "REVOKE ADMIN OPTION FOR ROLE r FROM USER u;" }
      - { id: by_all, sql: "REVOKE ROLE r FROM USER u BY ALL;" }
    examples:
      - "REVOKE ROLE INTERN FROM ROLE DOCTOR;"
      - "REVOKE ROLE INTERN FROM PUBLIC;"
      - "REVOKE ROLE SPECIALIST FROM USER BOB, GROUP TORONTO BY ALL;"

  - id: revoke_routine_privileges
    name: REVOKE (routine privileges)
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-revoke-routine-privileges
    tier: medium
    probes:
      - { id: function, sql: "REVOKE EXECUTE ON FUNCTION f FROM u RESTRICT;" }
      - { id: function_with_signature, sql: "REVOKE EXECUTE ON FUNCTION f (INTEGER, CHAR(10)) FROM u RESTRICT;" }
      - { id: specific_function, sql: "REVOKE EXECUTE ON SPECIFIC FUNCTION sf FROM u RESTRICT;" }
      - { id: all_functions_in_schema, sql: "REVOKE EXECUTE ON FUNCTION s.* FROM u RESTRICT;" }
      - { id: procedure, sql: "REVOKE EXECUTE ON PROCEDURE p FROM PUBLIC RESTRICT;" }
      - { id: specific_procedure, sql: "REVOKE EXECUTE ON SPECIFIC PROCEDURE sp FROM USER u RESTRICT;" }
      - { id: all_procedures_in_schema, sql: "REVOKE EXECUTE ON PROCEDURE s.* FROM GROUP g BY ALL RESTRICT;" }
      - { id: method, sql: "REVOKE EXECUTE ON METHOD m FOR ty FROM u RESTRICT;" }
      - { id: all_methods_for_type, sql: "REVOKE EXECUTE ON METHOD * FOR ty FROM ROLE r RESTRICT;" }
      - { id: specific_method, sql: "REVOKE EXECUTE ON SPECIFIC METHOD sm FROM u RESTRICT;" }
    examples:
      - "REVOKE EXECUTE ON FUNCTION CALC_SALARY FROM JONES RESTRICT;"
      - "REVOKE EXECUTE ON PROCEDURE VACATION_ACCR FROM PUBLIC RESTRICT;"
      - "REVOKE EXECUTE ON FUNCTION NEW_DEPT_HIRES (INTEGER, CHAR(10)) FROM HR RESTRICT;"
