dialect: teradata
engine: Teradata Vantage (Enterprise IntelliFlex) and VantageCloud Lake
version: "20.00"
source: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/DXllu86_qUx3dJlXfCkc6Q

statements:
  - id: alter_function
    name: ALTER FUNCTION
    doc: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/My0jVtFmAgnkBtlUnAlVsw
    tier: high
    probes:
      - { id: function_execute_protected, sql: "ALTER FUNCTION f EXECUTE PROTECTED;" }
      - { id: function_execute_not_protected, sql: "ALTER FUNCTION f EXECUTE NOT PROTECTED;" }
      - { id: function_compile, sql: "ALTER FUNCTION f COMPILE;" }
      - { id: function_compile_only, sql: "ALTER FUNCTION f COMPILE ONLY;" }
      - { id: function_qualified, sql: "ALTER FUNCTION db1.f COMPILE;" }
      - { id: function_no_semicolon, sql: "ALTER FUNCTION f COMPILE" }
      - { id: function_with_types, sql: "ALTER FUNCTION f (INTEGER, VARCHAR(10)) EXECUTE PROTECTED;" }
      - { id: function_with_udt, sql: "ALTER FUNCTION f (SYSUDTLIB.my_udt, DECIMAL(10,2)) COMPILE;" }
      - { id: function_with_numeric_types, sql: "ALTER FUNCTION f (SMALLINT, BIGINT, BYTEINT, DATE, REAL, DOUBLE PRECISION, FLOAT(53), NUMBER(10,2)) EXECUTE PROTECTED;" }
      - { id: function_with_time_types, sql: "ALTER FUNCTION f (TIME(3) WITH TIME ZONE, TIMESTAMP(6), INTERVAL DAY(2) TO SECOND(3), PERIOD(DATE)) COMPILE;" }
      - { id: function_with_lob_types, sql: "ALTER FUNCTION f (CLOB(1M), BLOB(10K), VARBYTE(100), CHAR VARYING(20)) COMPILE;" }
      - { id: function_with_json_type, sql: "ALTER FUNCTION f (JSON(1M) STORAGE FORMAT BSON) COMPILE;" }
      - { id: specific_execute_protected, sql: "ALTER SPECIFIC FUNCTION sf EXECUTE PROTECTED;" }
      - { id: specific_execute_not_protected, sql: "ALTER SPECIFIC FUNCTION sf EXECUTE NOT PROTECTED;" }
      - { id: specific_compile, sql: "ALTER SPECIFIC FUNCTION sf COMPILE;" }
      - { id: specific_compile_only_qualified, sql: "ALTER SPECIFIC FUNCTION db1.sf COMPILE ONLY;" }
    examples:
      - "ALTER FUNCTION TransXML EXECUTE NOT PROTECTED;"
      - "ALTER FUNCTION XPathValue COMPILE;"
      - "ALTER FUNCTION XPathValue EXECUTE NOT PROTECTED;"

  - id: drop_function
    name: DROP FUNCTION
    doc: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/52aYLc~Hrh2XgKvwVfS_GQ
    tier: high
    probes:
      - { id: function, sql: "DROP FUNCTION f;" }
      - { id: function_qualified, sql: "DROP FUNCTION db1.f;" }
      - { id: function_no_semicolon, sql: "DROP FUNCTION f" }
      - { id: function_with_types, sql: "DROP FUNCTION f (INTEGER, VARCHAR(10));" }
      - { id: function_with_numeric_types, sql: "DROP FUNCTION f (SMALLINT, BIGINT, BYTEINT, DATE, REAL, DOUBLE PRECISION, FLOAT(53), NUMBER(10,2), DECIMAL(10,2));" }
      - { id: function_with_time_types, sql: "DROP FUNCTION f (TIME(3) WITH TIME ZONE, TIMESTAMP(6), INTERVAL DAY(2) TO SECOND(3), PERIOD(DATE));" }
      - { id: function_with_lob_types, sql: "DROP FUNCTION f (CLOB(1M), BLOB(10K), VARBYTE(100), CHAR VARYING(20));" }
      - { id: function_with_udt, sql: "DROP FUNCTION f (SYSUDTLIB.my_udt);" }
      - { id: function_with_json_type, sql: "DROP FUNCTION f (JSON(1M) STORAGE FORMAT BSON);" }
      - { id: specific_function, sql: "DROP SPECIFIC FUNCTION sf;" }
      - { id: specific_function_qualified, sql: "DROP SPECIFIC FUNCTION db1.sf;" }
    examples:
      - "DROP FUNCTION udf2 (INTEGER, INTEGER);"
      - "DROP SPECIFIC FUNCTION specific_udf2;"
      - "DROP FUNCTION Finger_print_Match(VARBYTE, VARBYTE);"
