dialect: spark
engine: Apache Spark SQL
version: "4.x (docs/latest)"
source: https://spark.apache.org/docs/latest/sql-ref-syntax.html

statements: []

expressions:
  - id: b_arithmetic_operators
    name: Arithmetic operators
    doc: https://spark.apache.org/docs/latest/sql-ref-functions-builtin.html
    tier: high
    probes:
      - { id: add_sub, sql: "SELECT a + b, a - b FROM t;" }
      - { id: mul_div, sql: "SELECT a * b, a / b FROM t;" }
      - { id: modulo, sql: "SELECT a % b FROM t;" }
      - { id: integral_div, sql: "SELECT a div b FROM t;" }
      - { id: unary_sign, sql: "SELECT -a, +a FROM t;" }
      - { id: interval_div, sql: "SELECT INTERVAL '1-1' YEAR TO MONTH div INTERVAL '-1' MONTH;" }
      - { id: precedence_parens, sql: "SELECT (a + b) * c - d / e FROM t;" }
    examples:
      - "SELECT 3 div 2;"

  - id: b_comparison_operators
    name: Comparison operators
    doc: https://spark.apache.org/docs/latest/sql-ref-functions-builtin.html
    tier: high
    probes:
      - { id: eq, sql: "SELECT a = b FROM t;" }
      - { id: eq_double, sql: "SELECT a == b FROM t;" }
      - { id: ne_angle, sql: "SELECT a <> b FROM t;" }
      - { id: ne_bang, sql: "SELECT a != b FROM t;" }
      - { id: lt_le, sql: "SELECT a < b, a <= b FROM t;" }
      - { id: gt_ge, sql: "SELECT a > b, a >= b FROM t;" }
      - { id: null_safe_eq, sql: "SELECT a <=> b FROM t;" }
      - { id: null_safe_eq_null, sql: "SELECT NULL <=> NULL;" }

  - id: b_logical_operators
    name: Logical operators
    doc: https://spark.apache.org/docs/latest/sql-ref-functions-builtin.html
    tier: high
    probes:
      - { id: and_or, sql: "SELECT * FROM t WHERE a = 1 AND b = 2 OR c = 3;" }
      - { id: not, sql: "SELECT NOT a FROM t;" }
      - { id: bang_not, sql: "SELECT !a FROM t;" }
      - { id: not_paren, sql: "SELECT * FROM t WHERE NOT (a = 1 OR b = 2);" }
    examples:
      - "SELECT true and NULL;"
      - "SELECT not true;"

  - id: b_bitwise_operators
    name: Bitwise operators
    doc: https://spark.apache.org/docs/latest/sql-ref-functions-builtin.html
    tier: medium
    probes:
      - { id: bit_and, sql: "SELECT a & b FROM t;" }
      - { id: bit_or, sql: "SELECT a | b FROM t;" }
      - { id: bit_xor, sql: "SELECT a ^ b FROM t;" }
      - { id: bit_not, sql: "SELECT ~a FROM t;" }
      - { id: shift_left, sql: "SELECT a << 1 FROM t;" }
      - { id: shift_right, sql: "SELECT a >> 1 FROM t;" }
      - { id: shift_right_unsigned, sql: "SELECT a >>> 1 FROM t;" }
    examples:
      - "SELECT 3 & 5;"
      - "SELECT 2 << 1;"

  - id: b_concat_operator
    name: String concatenation operator
    doc: https://spark.apache.org/docs/latest/sql-ref-functions-builtin.html
    tier: high
    probes:
      - { id: concat_pipes, sql: "SELECT a || b || 'x' FROM t;" }

  - id: b_cast_operators
    name: Cast operators
    doc: https://spark.apache.org/docs/latest/sql-ref-functions-builtin.html
    tier: high
    probes:
      - { id: cast_as, sql: "SELECT CAST(a AS INT) FROM t;" }
      - { id: cast_double_colon, sql: "SELECT a::int FROM t;" }
      - { id: cast_parameterized, sql: "SELECT CAST(a AS DECIMAL(10, 2)) FROM t;" }
      - { id: cast_complex_type, sql: "SELECT CAST(a AS ARRAY<STRUCT<x: INT, y: STRING>>) FROM t;" }
      - { id: try_cast, sql: "SELECT TRY_CAST(a AS INT) FROM t;" }
      - { id: cast_interval, sql: "SELECT CAST(a AS INTERVAL DAY TO SECOND) FROM t;" }
    examples:
      - "SELECT cast('10' as int);"
      - "SELECT '10'::int;"

  - id: b_like_predicate
    name: LIKE / ILIKE predicates
    doc: https://spark.apache.org/docs/latest/sql-ref-functions-builtin.html
    tier: high
    probes:
      - { id: like, sql: "SELECT * FROM t WHERE a LIKE 'x%';" }
      - { id: not_like, sql: "SELECT * FROM t WHERE a NOT LIKE 'x%';" }
      - { id: like_escape, sql: "SELECT * FROM t WHERE a LIKE 'x/%' ESCAPE '/';" }
      - { id: ilike, sql: "SELECT * FROM t WHERE a ILIKE 'x%';" }
      - { id: not_ilike, sql: "SELECT * FROM t WHERE a NOT ILIKE 'x%';" }
      - { id: ilike_escape, sql: "SELECT * FROM t WHERE a ILIKE 'x/%' ESCAPE '/';" }
      - { id: like_any, sql: "SELECT * FROM t WHERE a LIKE ANY ('x%', 'y%');" }
      - { id: like_some, sql: "SELECT * FROM t WHERE a LIKE SOME ('x%', 'y%');" }
      - { id: like_all, sql: "SELECT * FROM t WHERE a LIKE ALL ('x%', '%y');" }
      - { id: not_like_any, sql: "SELECT * FROM t WHERE a NOT LIKE ANY ('x%', 'y%');" }
      - { id: ilike_any, sql: "SELECT * FROM t WHERE a ILIKE ANY ('x%', 'y%');" }
      - { id: like_function, sql: "SELECT like('Spark', '_park');" }
    examples:
      - "SELECT like('Spark', '_park');"
      - "SELECT ilike('Spark', '_Park');"

  - id: b_regex_predicate
    name: RLIKE / REGEXP predicates
    doc: https://spark.apache.org/docs/latest/sql-ref-functions-builtin.html
    tier: medium
    probes:
      - { id: rlike, sql: "SELECT * FROM t WHERE a RLIKE '^x.*';" }
      - { id: not_rlike, sql: "SELECT * FROM t WHERE a NOT RLIKE '^x.*';" }
      - { id: regexp, sql: "SELECT * FROM t WHERE a REGEXP '^x.*';" }
      - { id: not_regexp, sql: "SELECT * FROM t WHERE a NOT REGEXP '^x.*';" }
      - { id: regexp_like, sql: "SELECT regexp_like(a, '^x.*') FROM t;" }

  - id: b_between_predicate
    name: BETWEEN predicate
    doc: https://spark.apache.org/docs/latest/sql-ref-functions-builtin.html
    tier: high
    probes:
      - { id: between, sql: "SELECT * FROM t WHERE a BETWEEN 1 AND 10;" }
      - { id: not_between, sql: "SELECT * FROM t WHERE a NOT BETWEEN 1 AND 10;" }
      - { id: between_exprs, sql: "SELECT * FROM t WHERE a + 1 BETWEEN b - 1 AND b * 2;" }
    examples:
      - "SELECT 0.5 between 0.1 AND 1.0;"

  - id: b_in_predicate
    name: IN predicate
    doc: https://spark.apache.org/docs/latest/sql-ref-functions-builtin.html
    tier: high
    probes:
      - { id: in_list, sql: "SELECT * FROM t WHERE a IN (1, 2, 3);" }
      - { id: not_in_list, sql: "SELECT * FROM t WHERE a NOT IN (1, 2, 3);" }
      - { id: in_subquery, sql: "SELECT * FROM t WHERE a IN (SELECT b FROM s);" }
      - { id: not_in_subquery, sql: "SELECT * FROM t WHERE a NOT IN (SELECT b FROM s);" }
      - { id: in_row_list, sql: "SELECT * FROM t WHERE (a, b) IN ((1, 2), (3, 4));" }
      - { id: in_row_subquery, sql: "SELECT * FROM t WHERE (a, b) IN (SELECT c, d FROM s);" }
      - { id: in_struct, sql: "SELECT named_struct('a', 1, 'b', 2) in (named_struct('a', 1, 'b', 1), named_struct('a', 1, 'b', 3));" }
    examples:
      - "SELECT 1 in(1, 2, 3);"
      - "SELECT 1 in(2, 3, 4);"

  - id: b_is_predicates
    name: IS predicates
    doc: https://spark.apache.org/docs/latest/sql-ref-null-semantics.html
    tier: high
    probes:
      - { id: is_null, sql: "SELECT * FROM t WHERE a IS NULL;" }
      - { id: is_not_null, sql: "SELECT * FROM t WHERE a IS NOT NULL;" }
      - { id: is_true, sql: "SELECT * FROM t WHERE a IS TRUE;" }
      - { id: is_not_true, sql: "SELECT * FROM t WHERE a IS NOT TRUE;" }
      - { id: is_false, sql: "SELECT * FROM t WHERE a IS FALSE;" }
      - { id: is_not_false, sql: "SELECT * FROM t WHERE a IS NOT FALSE;" }
      - { id: is_unknown, sql: "SELECT * FROM t WHERE a IS UNKNOWN;" }
      - { id: is_not_unknown, sql: "SELECT * FROM t WHERE a IS NOT UNKNOWN;" }
      - { id: is_distinct_from, sql: "SELECT * FROM t WHERE a IS DISTINCT FROM b;" }
      - { id: is_not_distinct_from, sql: "SELECT * FROM t WHERE a IS NOT DISTINCT FROM b;" }
      - { id: isnull_function, sql: "SELECT isnull(a), isnotnull(a) FROM t;" }

  - id: b_exists_predicate
    name: EXISTS predicate
    doc: https://spark.apache.org/docs/latest/sql-ref-null-semantics.html
    tier: high
    probes:
      - { id: exists, sql: "SELECT * FROM t WHERE EXISTS (SELECT 1 FROM s WHERE s.a = t.a);" }
      - { id: not_exists, sql: "SELECT * FROM t WHERE NOT EXISTS (SELECT 1 FROM s WHERE s.a = t.a);" }
      - { id: exists_select_list, sql: "SELECT EXISTS (SELECT 1 FROM s) FROM t;" }
    examples:
      - "SELECT * FROM person WHERE EXISTS (SELECT null);"

  - id: b_subquery_expressions
    name: Scalar subqueries
    doc: https://spark.apache.org/docs/latest/sql-ref-null-semantics.html
    tier: high
    probes:
      - { id: scalar_select_list, sql: "SELECT (SELECT max(b) FROM s) FROM t;" }
      - { id: scalar_where, sql: "SELECT * FROM t WHERE a > (SELECT avg(b) FROM s);" }
      - { id: scalar_correlated, sql: "SELECT * FROM t WHERE a = (SELECT max(b) FROM s WHERE s.k = t.k);" }

  - id: b_case_expression
    name: CASE expression
    doc: https://spark.apache.org/docs/latest/sql-ref-functions-builtin.html
    tier: high
    probes:
      - { id: searched_case, sql: "SELECT CASE WHEN a > 0 THEN 1 WHEN a < 0 THEN -1 ELSE 0 END FROM t;" }
      - { id: simple_case, sql: "SELECT CASE a WHEN 1 THEN 'one' WHEN 2 THEN 'two' ELSE 'many' END FROM t;" }
      - { id: case_no_else, sql: "SELECT CASE WHEN a > 0 THEN 1 END FROM t;" }
      - { id: nested_case, sql: "SELECT CASE WHEN a > 0 THEN CASE WHEN b > 0 THEN 1 ELSE 2 END ELSE 3 END FROM t;" }
      - { id: case_in_where, sql: "SELECT * FROM t WHERE CASE WHEN a > 0 THEN b ELSE c END = 1;" }
    examples:
      - "SELECT CASE WHEN 1 > 0 THEN 1 WHEN 2 > 0 THEN 2.0 ELSE 1.2 END;"
      - "SELECT CASE WHEN 1 < 0 THEN 1 WHEN 2 > 0 THEN 2.0 ELSE 1.2 END;"

  - id: b_conditional_functions
    name: Conditional functions
    doc: https://spark.apache.org/docs/latest/sql-ref-functions-builtin.html
    tier: medium
    probes:
      - { id: coalesce, sql: "SELECT coalesce(a, b, 0) FROM t;" }
      - { id: if, sql: "SELECT if(a > 0, 'pos', 'neg') FROM t;" }
      - { id: nullif, sql: "SELECT nullif(a, 0) FROM t;" }
      - { id: nvl2, sql: "SELECT nvl2(a, b, c) FROM t;" }

  - id: b_extract
    name: EXTRACT
    doc: https://spark.apache.org/docs/latest/sql-ref-functions-builtin.html
    tier: high
    probes:
      - { id: extract_year, sql: "SELECT extract(YEAR FROM d) FROM t;" }
      - { id: extract_month, sql: "SELECT extract(MONTH FROM ts) FROM t;" }
      - { id: extract_week, sql: "SELECT extract(week FROM ts) FROM t;" }
      - { id: extract_doy, sql: "SELECT extract(doy FROM d) FROM t;" }
      - { id: extract_dayofweek, sql: "SELECT extract(DAYOFWEEK FROM d) FROM t;" }
      - { id: extract_second, sql: "SELECT extract(SECOND FROM ts) FROM t;" }
      - { id: extract_interval, sql: "SELECT extract(MONTH FROM INTERVAL '2021-11' YEAR TO MONTH);" }
      - { id: extract_literal, sql: "SELECT extract(YEAR FROM TIMESTAMP '2019-08-12 01:00:00.123456');" }
      - { id: date_part, sql: "SELECT date_part('YEAR', ts) FROM t;" }
    examples:
      - "SELECT extract(YEAR FROM TIMESTAMP '2019-08-12 01:00:00.123456');"
      - "SELECT extract(week FROM timestamp '2019-08-12 01:00:00.123456');"

  - id: b_substring
    name: SUBSTRING / SUBSTR
    doc: https://spark.apache.org/docs/latest/sql-ref-functions-builtin.html
    tier: high
    probes:
      - { id: substring_comma, sql: "SELECT substring(a, 5) FROM t;" }
      - { id: substring_comma_len, sql: "SELECT substring(a, 5, 1) FROM t;" }
      - { id: substring_from, sql: "SELECT substring(a FROM 5) FROM t;" }
      - { id: substring_from_for, sql: "SELECT substring(a FROM 5 FOR 1) FROM t;" }
      - { id: substr_comma, sql: "SELECT substr(a, 5, 1) FROM t;" }
      - { id: substr_from_for, sql: "SELECT substr(a FROM 5 FOR 1) FROM t;" }
    examples:
      - "SELECT substring('Spark SQL', 5);"
      - "SELECT substring('Spark SQL' FROM 5);"

  - id: b_trim
    name: TRIM
    doc: https://spark.apache.org/docs/latest/sql-ref-functions-builtin.html
    tier: high
    probes:
      - { id: trim_plain, sql: "SELECT trim(a) FROM t;" }
      - { id: trim_both_from, sql: "SELECT trim(BOTH FROM a) FROM t;" }
      - { id: trim_leading_from, sql: "SELECT trim(LEADING FROM a) FROM t;" }
      - { id: trim_trailing_from, sql: "SELECT trim(TRAILING FROM a) FROM t;" }
      - { id: trim_chars_from, sql: "SELECT trim('SL' FROM a) FROM t;" }
      - { id: trim_both_chars_from, sql: "SELECT trim(BOTH 'SL' FROM a) FROM t;" }
      - { id: trim_leading_chars_from, sql: "SELECT trim(LEADING 'SL' FROM a) FROM t;" }
      - { id: trim_trailing_chars_from, sql: "SELECT trim(TRAILING 'SL' FROM a) FROM t;" }
      - { id: ltrim_rtrim_btrim, sql: "SELECT ltrim(a), rtrim(a), btrim(a, 'SL') FROM t;" }
    examples:
      - "SELECT trim('    SparkSQL   ');"
      - "SELECT trim(BOTH FROM '    SparkSQL   ');"
      - "SELECT trim(LEADING FROM '    SparkSQL   ');"

  - id: b_position
    name: POSITION
    doc: https://spark.apache.org/docs/latest/sql-ref-functions-builtin.html
    tier: medium
    probes:
      - { id: position_in, sql: "SELECT POSITION('bar' IN a) FROM t;" }
      - { id: position_comma, sql: "SELECT position('bar', a) FROM t;" }
      - { id: position_comma_pos, sql: "SELECT position('bar', a, 5) FROM t;" }
    examples:
      - "SELECT POSITION('bar' IN 'foobarbar');"
      - "SELECT position('bar', 'foobarbar', 5);"

  - id: b_overlay
    name: OVERLAY
    doc: https://spark.apache.org/docs/latest/sql-ref-functions-builtin.html
    tier: medium
    probes:
      - { id: overlay_placing_from, sql: "SELECT overlay(a PLACING '_' FROM 6) FROM t;" }
      - { id: overlay_placing_from_for, sql: "SELECT overlay(a PLACING 'CORE' FROM 7 FOR 2) FROM t;" }
      - { id: overlay_comma, sql: "SELECT overlay(a, '_', 6) FROM t;" }
      - { id: overlay_comma_len, sql: "SELECT overlay(a, '_', 6, 2) FROM t;" }
    examples:
      - "SELECT overlay('Spark SQL' PLACING '_' FROM 6);"
      - "SELECT overlay('Spark SQL' PLACING 'ANSI ' FROM 7 FOR 0);"
