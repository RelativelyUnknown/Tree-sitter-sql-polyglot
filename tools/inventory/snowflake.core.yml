      - { id: row_method, sql: "SELECT * FROM t SAMPLE ROW (0);" }
      - { id: fixed_rows, sql: "SELECT * FROM t SAMPLE (10 ROWS);" }
      - { id: bernoulli_rows, sql: "SELECT * FROM t SAMPLE BERNOULLI (10 ROWS);" }
      - { id: system_seed, sql: "SELECT * FROM t SAMPLE SYSTEM (3) SEED (82);" }
