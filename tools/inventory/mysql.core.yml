      - { id: fetch_next_from, sql: "CREATE PROCEDURE p() BEGIN DECLARE a INT; DECLARE cur CURSOR FOR SELECT x FROM t; OPEN cur; FETCH NEXT FROM cur INTO a; CLOSE cur; END;" }

