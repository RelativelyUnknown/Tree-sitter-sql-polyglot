dialect: teradata
engine: Teradata Vantage (Enterprise IntelliFlex) and VantageCloud Lake
version: "20.00"
source: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/DXllu86_qUx3dJlXfCkc6Q

statements:
  - id: drop_profile
    name: DROP PROFILE
    doc: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/~qe5lMUQ9Keidgjwwjl75Q
    tier: medium
    probes:
      - { id: basic, sql: "DROP PROFILE p;" }

  - id: drop_role
    name: DROP ROLE
    doc: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/wzgsPv8x91dZdMMRVowd5w
    tier: medium
    probes:
      - { id: basic, sql: "DROP ROLE r;" }
      - { id: external, sql: "DROP EXTERNAL ROLE r;" }
      - { id: qualified, sql: "DROP ROLE db.r;" }
    examples:
      - "DROP ROLE temp_admin;"
      - "DROP EXTERNAL ROLE rhh;"

  - id: drop_user
    name: DROP USER
    doc: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/nengCPdTAAgIoJGCa~Wldw
    tier: medium
    probes:
      - { id: basic, sql: "DROP USER u;" }
    examples:
      - "DROP USER Jones;"

  - id: help_user
    name: HELP USER
    doc: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/uJrmZ_k0hNv8_Y02UaZ~yQ
    tier: medium
    probes:
      - { id: basic, sql: "HELP USER u;" }

  - id: set_session
    name: SET SESSION
    doc: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/TxCqEfYkTH5JkZrP95vqSg
    tier: medium
    probes:
      - { id: set_session_keyword, sql: "SET SESSION CALENDAR = COMPATIBLE;" }
      - { id: ss_abbreviation, sql: "SS CALENDAR = COMPATIBLE;" }

  - id: set_session_collation
    name: SET SESSION COLLATION
    doc: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/Fdymx4hpzDZOr5c3Ts8kCg
    tier: medium
    probes:
      - { id: ascii, sql: "SET SESSION COLLATION ASCII;" }
      - { id: multinational, sql: "SET SESSION COLLATION MULTINATIONAL;" }
      - { id: ss_abbreviation, sql: "SS COLLATION EBCDIC;" }

  - id: set_session_database
    name: SET SESSION DATABASE
    doc: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/C63ZVkz3T7WhjrhPAb2mXw
    tier: medium
    probes:
      - { id: basic, sql: "SET SESSION DATABASE db;" }
      - { id: ss_abbreviation, sql: "SS DATABASE db;" }

  - id: set_session_dateform
    name: SET SESSION DATEFORM
    doc: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/nWChdqeluw36yqc5ZZwlEg
    tier: medium
    probes:
      - { id: ansidate, sql: "SET SESSION DATEFORM = ANSIDATE;" }
      - { id: integerdate, sql: "SET SESSION DATEFORM = INTEGERDATE;" }
      - { id: ss_abbreviation, sql: "SS DATEFORM = ANSIDATE;" }
    examples:
      - "SET SESSION DATEFORM = INTEGERDATE;"
      - "SET SESSION DATEFORM = ANSIDATE;"

  - id: set_session_transaction_isolation_level
    name: SET SESSION TRANSACTION ISOLATION LEVEL
    doc: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/tXbZqhbS2Eq~VWCbXzrMvQ
    tier: medium
    probes:
      - { id: read_uncommitted, sql: "SET SESSION CHARACTERISTICS AS TRANSACTION ISOLATION LEVEL READ UNCOMMITTED;" }
      - { id: ru, sql: "SET SESSION CHARACTERISTICS AS TRANSACTION ISOLATION LEVEL RU;" }
      - { id: serializable, sql: "SET SESSION CHARACTERISTICS AS TRANSACTION ISOLATION LEVEL SERIALIZABLE;" }
      - { id: sr, sql: "SET SESSION CHARACTERISTICS AS TRANSACTION ISOLATION LEVEL SR;" }
    examples:
      - "SET SESSION CHARACTERISTICS AS TRANSACTION ISOLATION LEVEL RU;"
      - "SET SESSION CHARACTERISTICS AS TRANSACTION ISOLATION LEVEL READ UNCOMMITTED;"
      - "SET SESSION CHARACTERISTICS AS TRANSACTION ISOLATION LEVEL SR;"

  - id: set_query_band
    name: SET QUERY_BAND
    doc: https://docs.teradata.com/reader/X~2C1PifIMPUALz40wgyxQ/aTjt12oYwpXhc~Ptziqq5A
    tier: medium
    probes:
      - { id: for_session, sql: "SET QUERY_BAND = 'org=Finance;report=Fin123;' FOR SESSION;" }
      - { id: for_session_volatile, sql: "SET QUERY_BAND = 'org=Finance;' FOR SESSION VOLATILE;" }
      - { id: for_transaction, sql: "SET QUERY_BAND = 'cat=asta;tree=palm;' FOR TRANSACTION;" }
      - { id: update, sql: "SET QUERY_BAND = 'org=Finance;' UPDATE FOR SESSION;" }
      - { id: none, sql: "SET QUERY_BAND = NONE FOR SESSION;" }
