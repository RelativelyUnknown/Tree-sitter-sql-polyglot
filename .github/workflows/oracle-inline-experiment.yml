name: Oracle inline experiment
# Throwaway: counts symbols and large states of the Oracle parser with hidden rules inlined. Delete after use.
on:
  push:
    branches: ["ccr-7b871ec0-wgknnh"]
    paths: [".github/experiments/oracle-inline-1/**"]

jobs:
  variant:
    name: oracle (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: [D, E, T]
    steps:
      - uses: actions/checkout@v4
      - uses: tree-sitter/setup-action@v2
        with:
          install-lib: false
          tree-sitter-ref: v0.27.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Add swap
        run: |
          sudo swapoff -a || true
          avail_gb=$(df --output=avail -BG /mnt | tail -1 | tr -dc '0-9')
          size_gb=$(( avail_gb > 40 ? 32 : avail_gb - 4 ))
          sudo fallocate -l "${size_gb}G" /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
      - name: Apply variant
        run: python3 .github/experiments/oracle-inline-1/apply.py "${{ matrix.variant }}"
      - name: Generate and measure
        run: |
          cd oracle && tree-sitter generate grammar.js 2>&1 | tail -4
          g() { grep -m1 "define $1 " src/parser.c | tr -dc 0-9; }
          A=$(grep -o 'ACTIONS([0-9]*)' src/parser.c | sed 's/[^0-9]//g' | sort -n | tail -1)
          S=$(g SYMBOL_COUNT); L=$(g LARGE_STATE_COUNT)
          echo "RESULT variant=${{ matrix.variant }} max_action=$A states=$(g STATE_COUNT) symbols=$S large=$L cells_M=$(awk -v s=$S -v l=$L "BEGIN{printf \"%.2f\", s*l/1e6}")"
