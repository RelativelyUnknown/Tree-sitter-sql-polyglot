dialect: db2
engine: IBM Db2 for Linux, UNIX and Windows
version: "11.5"
source: https://www.ibm.com/docs/en/db2/11.5.x?topic=reference-statements

statements:
  - id: set_path
    name: SET PATH
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-set-path
    tier: medium
    probes:
      - id: schema_list
        sql: "SET PATH = s1, s2;"
      - id: current_path
        sql: "SET CURRENT PATH = SYSTEM PATH, s1;"
      - id: user_and_current_path
        sql: "SET PATH = USER, CURRENT PATH;"
      - id: current_package_path
        sql: "SET CURRENT_PATH = CURRENT PACKAGE PATH;"
      - id: string_constant
        sql: "SET PATH = 'S1', 'S2';"
  - id: set_role
    name: SET ROLE
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-set-role
    tier: medium
    probes:
      - id: basic
        sql: "SET ROLE r;"
      - id: with_equals
        sql: "SET ROLE = r;"
    examples:
      - "SET ROLE EDITOR;"
      - "SET ROLE AUTHOR;"
  - id: set_schema
    name: SET SCHEMA
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-set-schema
    tier: medium
    probes:
      - id: schema_name
        sql: "SET SCHEMA s;"
      - id: current_schema_equals
        sql: "SET CURRENT SCHEMA = s;"
      - id: user
        sql: "SET SCHEMA = USER;"
      - id: session_user
        sql: "SET SCHEMA SESSION_USER;"
      - id: system_user
        sql: "SET SCHEMA SYSTEM_USER;"
      - id: current_user
        sql: "SET SCHEMA CURRENT_USER;"
      - id: string_constant
        sql: "SET SCHEMA 'S';"
  - id: set_session_authorization
    name: SET SESSION AUTHORIZATION
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-set-session-authorization
    tier: medium
    probes:
      - id: authorization_name
        sql: "SET SESSION AUTHORIZATION = u1;"
      - id: session_user_keyword
        sql: "SET SESSION_USER = u1;"
      - id: user
        sql: "SET SESSION AUTHORIZATION USER;"
      - id: current_user
        sql: "SET SESSION AUTHORIZATION CURRENT_USER;"
      - id: system_user
        sql: "SET SESSION AUTHORIZATION SYSTEM_USER;"
      - id: string_constant
        sql: "SET SESSION AUTHORIZATION 'U1';"
      - id: allow_administration
        sql: "SET SESSION AUTHORIZATION u1 ALLOW ADMINISTRATION;"
  - id: transfer_ownership
    name: TRANSFER OWNERSHIP
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-transfer-ownership
    tier: medium
    probes:
      - id: table_revoke
        sql: "TRANSFER OWNERSHIP OF TABLE s.t TO USER u1 REVOKE PRIVILEGES;"
      - id: view_preserve
        sql: "TRANSFER OWNERSHIP OF VIEW s.v TO USER u1 PRESERVE PRIVILEGES;"
      - id: schema_session_user
        sql: "TRANSFER OWNERSHIP OF SCHEMA s TO SESSION_USER PRESERVE PRIVILEGES;"
      - id: function_with_signature
        sql: "TRANSFER OWNERSHIP OF FUNCTION s.f (INTEGER, VARCHAR(10)) TO USER u1 REVOKE PRIVILEGES;"
      - id: specific_procedure
        sql: "TRANSFER OWNERSHIP OF SPECIFIC PROCEDURE s.sp TO SYSTEM_USER PRESERVE PRIVILEGES;"
      - id: public_alias
        sql: "TRANSFER OWNERSHIP OF PUBLIC ALIAS a FOR TABLE TO USER u1 REVOKE PRIVILEGES;"
      - id: constraint
        sql: "TRANSFER OWNERSHIP OF CONSTRAINT t c1 TO USER u1 REVOKE PRIVILEGES;"
      - id: package_version
        sql: "TRANSFER OWNERSHIP OF PACKAGE s.p VERSION v1 TO USER u1 PRESERVE PRIVILEGES;"
    examples:
      - "TRANSFER OWNERSHIP OF TABLE s.t TO USER u1 PRESERVE PRIVILEGES;"
  - id: alter_audit_policy
    name: ALTER AUDIT POLICY
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-alter-audit-policy
    tier: low
    probes:
      - id: categories
        sql: "ALTER AUDIT POLICY p CATEGORIES EXECUTE STATUS BOTH, CONTEXT STATUS NONE ERROR TYPE AUDIT;"
      - id: all_status
        sql: "ALTER AUDIT POLICY p CATEGORIES ALL STATUS FAILURE;"
  - id: alter_bufferpool
    name: ALTER BUFFERPOOL
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-alter-bufferpool
    tier: low
    probes:
      - id: size
        sql: "ALTER BUFFERPOOL bp IMMEDIATE SIZE 2000;"
      - id: automatic
        sql: "ALTER BUFFERPOOL bp SIZE AUTOMATIC;"
  - id: alter_database_partition_group
    name: ALTER DATABASE PARTITION GROUP
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-alter-database-partition-group
    tier: low
    probes:
      - id: add
        sql: "ALTER DATABASE PARTITION GROUP g ADD DBPARTITIONNUMS (1, 2 TO 4) LIKE DBPARTITIONNUM 0;"
      - id: drop
        sql: "ALTER DATABASE PARTITION GROUP g DROP DBPARTITIONNUM (3);"
  - id: alter_event_monitor
    name: ALTER EVENT MONITOR
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-alter-event-monitor
    tier: low
    probes:
      - id: add_logical_group
        sql: "ALTER EVENT MONITOR em ADD LOGICAL GROUP g (TABLE tt IN ts PCTDEACTIVATE 100);"
  - id: alter_histogram_template
    name: ALTER HISTOGRAM TEMPLATE
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-alter-histogram-template
    tier: low
    probes:
      - id: high_bin_value
        sql: "ALTER HISTOGRAM TEMPLATE tmpl HIGH BIN VALUE 100;"
  - id: alter_mask
    name: ALTER MASK
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-alter-mask
    tier: low
    probes:
      - id: enable
        sql: "ALTER MASK m ENABLE;"
      - id: disable
        sql: "ALTER MASK m DISABLE;"
  - id: alter_method
    name: ALTER METHOD
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-alter-method
    tier: low
    probes:
      - id: external_name
        sql: "ALTER METHOD m (INTEGER) FOR s.ty EXTERNAL NAME 'lib!func';"
      - id: specific_method
        sql: "ALTER SPECIFIC METHOD s.sm EXTERNAL NAME 'lib!func';"
  - id: alter_nickname
    name: ALTER NICKNAME
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-alter-nickname
    tier: low
    probes:
      - id: options
        sql: "ALTER NICKNAME n OPTIONS (ADD opt 'v');"
      - id: alter_column_local_type
        sql: "ALTER NICKNAME n ALTER COLUMN c LOCAL TYPE VARCHAR(20);"
  - id: alter_package
    name: ALTER PACKAGE
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-alter-package
    tier: low
    probes:
      - id: access_plan_reuse
        sql: "ALTER PACKAGE s.p ACCESS PLAN REUSE YES;"
      - id: version_profile_keep_dynamic
        sql: "ALTER PACKAGE s.p VERSION v1 OPTIMIZATION PROFILE s.prof KEEP DYNAMIC NO;"
  - id: alter_permission
    name: ALTER PERMISSION
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-alter-permission
    tier: low
    probes:
      - id: enable
        sql: "ALTER PERMISSION perm ENABLE;"
      - id: disable
        sql: "ALTER PERMISSION perm DISABLE;"
  - id: alter_security_label_component
    name: ALTER SECURITY LABEL COMPONENT
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-alter-security-label-component
    tier: low
    probes:
      - id: add_element_array
        sql: "ALTER SECURITY LABEL COMPONENT c ADD ELEMENT 'e1' BEFORE 'e2';"
      - id: add_element_tree
        sql: "ALTER SECURITY LABEL COMPONENT c ADD ELEMENT 'e1' UNDER 'e0';"
  - id: alter_security_policy
    name: ALTER SECURITY POLICY
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-alter-security-policy
    tier: low
    probes:
      - id: add_component
        sql: "ALTER SECURITY POLICY sp ADD SECURITY LABEL COMPONENT c;"
      - id: options
        sql: "ALTER SECURITY POLICY sp OVERRIDE NOT AUTHORIZED WRITE SECURITY LABEL USE GROUP AUTHORIZATIONS IGNORE ROLE AUTHORIZATIONS;"
  - id: alter_server
    name: ALTER SERVER
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-alter-server
    tier: low
    probes:
      - id: version
        sql: "ALTER SERVER srv VERSION 12;"
      - id: options
        sql: "ALTER SERVER srv OPTIONS (SET opt 'v', DROP opt2);"
  - id: alter_service_class
    name: ALTER SERVICE CLASS
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-alter-service-class
    tier: low
    probes:
      - id: cpu_shares
        sql: "ALTER SERVICE CLASS sc CPU SHARES 500 SOFT;"
      - id: disable
        sql: "ALTER SERVICE CLASS sc DISABLE;"
  - id: alter_stogroup
    name: ALTER STOGROUP
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-alter-stogroup
    tier: low
    probes:
      - id: add_drop
        sql: "ALTER STOGROUP sg ADD '/path1', '/path2' DROP '/path3';"
      - id: attributes
        sql: "ALTER STOGROUP sg OVERHEAD 6.7 DEVICE READ RATE 100 DATA TAG 2 SET AS DEFAULT;"
  - id: alter_threshold
    name: ALTER THRESHOLD
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-alter-threshold
    tier: low
    probes:
      - id: when_stop
        sql: "ALTER THRESHOLD th WHEN TOTALMEMBERCONNECTIONS > 10 STOP EXECUTION;"
      - id: enable
        sql: "ALTER THRESHOLD th ENABLE;"
  - id: alter_trusted_context
    name: ALTER TRUSTED CONTEXT
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-alter-trusted-context
    tier: low
    probes:
      - id: alter_system_authid
        sql: "ALTER TRUSTED CONTEXT tc ALTER SYSTEM AUTHID u1 ALTER ATTRIBUTES (ADDRESS '9.26.113.204');"
      - id: add_user
        sql: "ALTER TRUSTED CONTEXT tc ADD USE FOR u2 WITHOUT AUTHENTICATION;"
  - id: alter_usage_list
    name: ALTER USAGE LIST
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-alter-usage-list
    tier: low
    probes:
      - id: list_size
        sql: "ALTER USAGE LIST ul LIST SIZE 1000 WHEN FULL WRAP;"
      - id: active_on_start
        sql: "ALTER USAGE LIST ul ACTIVE ON START DATABASE;"
  - id: alter_user_mapping
    name: ALTER USER MAPPING
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-alter-user-mapping
    tier: low
    probes:
      - id: for_user
        sql: "ALTER USER MAPPING FOR u1 SERVER srv OPTIONS (SET REMOTE_PASSWORD 'pw');"
      - id: for_public
        sql: "ALTER USER MAPPING FOR PUBLIC SERVER srv OPTIONS (ADD REMOTE_AUTHID 'a');"
