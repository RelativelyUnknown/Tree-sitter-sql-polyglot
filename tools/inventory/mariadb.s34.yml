dialect: mariadb
engine: MariaDB Server
version: "11.x (current)"
source: https://mariadb.com/docs/server/reference/sql-statements

statements:
  - id: show_collation
    name: SHOW COLLATION
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-collation
    tier: medium
    probes:
      - id: basic
        sql: "SHOW COLLATION;"
      - id: like
        sql: "SHOW COLLATION LIKE 'latin1%';"
      - id: where
        sql: "SHOW COLLATION WHERE Charset = 'latin1';"
    examples:
      - "SHOW COLLATION LIKE 'latin1%';"

  - id: show_columns
    name: SHOW COLUMNS
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-columns
    tier: medium
    probes:
      - id: columns_from
        sql: "SHOW COLUMNS FROM t;"
      - id: fields_from
        sql: "SHOW FIELDS FROM t;"
      - id: full
        sql: "SHOW FULL COLUMNS FROM t;"
      - id: from_db
        sql: "SHOW COLUMNS FROM t FROM db;"
      - id: qualified_table
        sql: "SHOW COLUMNS FROM db.t;"
      - id: like
        sql: "SHOW COLUMNS FROM t LIKE 'c%';"
      - id: where
        sql: "SHOW COLUMNS FROM t WHERE Type = 'int(11)';"
    examples:
      - "SHOW COLUMNS FROM mytable FROM mydb;"
      - "SHOW COLUMNS FROM mydb.mytable;"
      - "SHOW COLUMNS FROM city;"

  - id: show_create_database
    name: SHOW CREATE DATABASE
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-create-database
    tier: medium
    probes:
      - id: database
        sql: "SHOW CREATE DATABASE db;"
      - id: schema
        sql: "SHOW CREATE SCHEMA db;"
    examples:
      - "SHOW CREATE DATABASE test;"
      - "SHOW CREATE SCHEMA test;"

  - id: show_create_event
    name: SHOW CREATE EVENT
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-create-event
    tier: medium
    probes:
      - id: basic
        sql: "SHOW CREATE EVENT e;"
      - id: qualified
        sql: "SHOW CREATE EVENT test.e_daily;"

  - id: show_create_function
    name: SHOW CREATE FUNCTION
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-create-function
    tier: medium
    probes:
      - id: basic
        sql: "SHOW CREATE FUNCTION f;"
      - id: qualified
        sql: "SHOW CREATE FUNCTION db.f;"

  - id: show_create_procedure
    name: SHOW CREATE PROCEDURE
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-create-procedure
    tier: medium
    probes:
      - id: basic
        sql: "SHOW CREATE PROCEDURE p;"
      - id: qualified
        sql: "SHOW CREATE PROCEDURE db.p;"

  - id: show_create_sequence
    name: SHOW CREATE SEQUENCE
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-create-sequence
    tier: medium
    probes:
      - id: basic
        sql: "SHOW CREATE SEQUENCE s;"
      - id: qualified
        sql: "SHOW CREATE SEQUENCE db.s;"

  - id: show_create_table
    name: SHOW CREATE TABLE
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-create-table
    tier: medium
    probes:
      - id: basic
        sql: "SHOW CREATE TABLE t;"
      - id: qualified
        sql: "SHOW CREATE TABLE db.t;"

  - id: show_create_trigger
    name: SHOW CREATE TRIGGER
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-create-trigger
    tier: medium
    probes:
      - id: basic
        sql: "SHOW CREATE TRIGGER trg;"
      - id: qualified
        sql: "SHOW CREATE TRIGGER db.trg;"

  - id: show_create_user
    name: SHOW CREATE USER
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-create-user
    tier: medium
    probes:
      - id: current_user
        sql: "SHOW CREATE USER;"
      - id: named_user
        sql: "SHOW CREATE USER foo4@test;"
      - id: quoted_user
        sql: "SHOW CREATE USER 'foo4'@'test';"
