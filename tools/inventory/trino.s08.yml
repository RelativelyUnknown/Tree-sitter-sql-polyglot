dialect: trino
engine: Trino
version: "483"
source: https://trino.io/docs/current/sql.html

statements:
  - id: drop_view
    name: DROP VIEW
    doc: https://trino.io/docs/current/sql/drop-view.html
    tier: high
    probes:
      - id: basic
        sql: "DROP VIEW v;"
      - id: if_exists
        sql: "DROP VIEW IF EXISTS v;"
    examples:
      - "DROP VIEW orders_by_date;"
      - "DROP VIEW IF EXISTS orders_by_date;"

  - id: execute
    name: EXECUTE
    doc: https://trino.io/docs/current/sql/execute.html
    tier: high
    probes:
      - id: basic
        sql: "EXECUTE s;"
      - id: using_one
        sql: "EXECUTE s USING 1;"
      - id: using_many
        sql: "EXECUTE s USING 1, 3;"
    examples:
      - "EXECUTE my_select1;"
      - "EXECUTE my_select2 USING 1, 3;"
