dialect: hana
engine: SAP HANA Platform
version: "2.0 SPS 08 (2.0.08)"
source: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/3bc1a0d4611d40c4a6e3fc7c8e80395d.html?version=2.0.08

statements:
  - id: drop_table
    name: DROP TABLE
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/20d7fd287519101480afbce1b997e4b9.html?version=2.0.08
    tier: high
    probes:
      - id: basic
        sql: "DROP TABLE t;"
      - id: schema_qualified
        sql: "DROP TABLE s.t;"
      - id: database_schema_qualified
        sql: "DROP TABLE db.s.t;"
      - id: cascade
        sql: "DROP TABLE t CASCADE;"
      - id: restrict
        sql: "DROP TABLE t RESTRICT;"
      - id: with_remote
        sql: "DROP TABLE t WITH REMOTE;"
      - id: cascade_with_remote
        sql: "DROP TABLE s.t CASCADE WITH REMOTE;"
    examples:
      - "DROP TABLE A;"

  - id: drop_view
    name: DROP VIEW
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/20d9c05f75191014b24fca55a8534531.html?version=2.0.08
    tier: high
    probes:
      - id: basic
        sql: "DROP VIEW v;"
      - id: schema_qualified
        sql: "DROP VIEW s.v;"
      - id: cascade
        sql: "DROP VIEW v CASCADE;"
      - id: restrict
        sql: "DROP VIEW v RESTRICT;"
    examples:
      - "DROP VIEW v;"
