dialect: mariadb
engine: MariaDB Server
version: "11.x (current)"
source: https://mariadb.com/docs/server/reference/sql-statements

statements:
  - id: show_create_view
    name: SHOW CREATE VIEW
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-create-view
    tier: medium
    probes:
      - id: basic
        sql: "SHOW CREATE VIEW v;"
      - id: qualified
        sql: "SHOW CREATE VIEW db.v;"

  - id: show_databases
    name: SHOW DATABASES
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-databases
    tier: medium
    probes:
      - id: basic
        sql: "SHOW DATABASES;"
      - id: schemas_synonym
        sql: "SHOW SCHEMAS;"
      - id: like
        sql: "SHOW DATABASES LIKE 'm%';"
      - id: where
        sql: "SHOW DATABASES WHERE `Database` = 'test';"
    examples:
      - "SHOW DATABASES;"
      - "SHOW DATABASES LIKE 'm%';"

  - id: show_engines
    name: SHOW ENGINES
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-engines
    tier: medium
    probes:
      - id: basic
        sql: "SHOW ENGINES;"
      - id: storage
        sql: "SHOW STORAGE ENGINES;"

  - id: show_errors
    name: SHOW ERRORS
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-errors
    tier: medium
    probes:
      - id: basic
        sql: "SHOW ERRORS;"
      - id: limit_row_count
        sql: "SHOW ERRORS LIMIT 5;"
      - id: limit_offset_comma
        sql: "SHOW ERRORS LIMIT 2, 5;"
      - id: limit_offset_keyword
        sql: "SHOW ERRORS LIMIT 5 OFFSET 2;"
      - id: count
        sql: "SHOW COUNT(*) ERRORS;"
    examples:
      - "SHOW COUNT(*) ERRORS;"
      - "SHOW ERRORS;"

  - id: show_events
    name: SHOW EVENTS
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-events
    tier: medium
    probes:
      - id: basic
        sql: "SHOW EVENTS;"
      - id: from_schema
        sql: "SHOW EVENTS FROM test;"
      - id: in_schema
        sql: "SHOW EVENTS IN test;"
      - id: like
        sql: "SHOW EVENTS LIKE 'e_%';"
      - id: where
        sql: "SHOW EVENTS FROM test WHERE Status = 'ENABLED';"
    examples:
      - "SHOW EVENTS FROM test;"

  - id: show_function_status
    name: SHOW FUNCTION STATUS
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-function-status
    tier: medium
    probes:
      - id: basic
        sql: "SHOW FUNCTION STATUS;"
      - id: like
        sql: "SHOW FUNCTION STATUS LIKE 'V%';"
      - id: where
        sql: "SHOW FUNCTION STATUS WHERE Security_type LIKE 'DEFINER';"

  - id: show_grants
    name: SHOW GRANTS
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-grants
    tier: medium
    probes:
      - id: basic
        sql: "SHOW GRANTS;"
      - id: for_user
        sql: "SHOW GRANTS FOR 'alice'@'localhost';"
      - id: for_user_name_only
        sql: "SHOW GRANTS FOR alice;"
      - id: for_role
        sql: "SHOW GRANTS FOR journalist;"
      - id: for_current_user
        sql: "SHOW GRANTS FOR CURRENT_USER;"
      - id: for_current_user_parens
        sql: "SHOW GRANTS FOR CURRENT_USER();"
      - id: for_current_role
        sql: "SHOW GRANTS FOR CURRENT_ROLE;"
      - id: for_public
        sql: "SHOW GRANTS FOR PUBLIC;"
        note: FOR PUBLIC is available from MariaDB 10.11.
    examples:
      - "SHOW GRANTS FOR 'alice'@'localhost';"
      - "SHOW GRANTS FOR journalist;"

  - id: show_index
    name: SHOW INDEX
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-index
    tier: medium
    probes:
      - id: basic
        sql: "SHOW INDEX FROM t;"
      - id: indexes_synonym
        sql: "SHOW INDEXES FROM t;"
      - id: keys_synonym
        sql: "SHOW KEYS FROM t;"
      - id: from_db
        sql: "SHOW INDEX FROM t FROM db;"
      - id: qualified_table
        sql: "SHOW INDEX FROM db.t;"
      - id: where
        sql: "SHOW INDEX FROM t WHERE Key_name = 'PRIMARY';"
    examples:
      - "SHOW INDEX FROM mydb.mytable;"
      - "SHOW INDEX FROM mytable FROM mydb;"

  - id: show_privileges
    name: SHOW PRIVILEGES
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-privileges
    tier: medium
    probes:
      - id: basic
        sql: "SHOW PRIVILEGES;"
    examples:
      - "SHOW PRIVILEGES;"

  - id: show_procedure_status
    name: SHOW PROCEDURE STATUS
    doc: https://mariadb.com/docs/server/reference/sql-statements/administrative-sql-statements/show/show-procedure-status
    tier: medium
    probes:
      - id: basic
        sql: "SHOW PROCEDURE STATUS;"
      - id: like
        sql: "SHOW PROCEDURE STATUS LIKE 'p1';"
      - id: where
        sql: "SHOW PROCEDURE STATUS WHERE Db = 'test';"
