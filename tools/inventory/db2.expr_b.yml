dialect: db2
engine: IBM Db2 for Linux, UNIX and Windows
version: "11.5"
source: https://www.ibm.com/docs/en/db2/11.5.x?topic=reference-statements

statements: []

expressions:
  - id: b_arithmetic_operators
    name: Arithmetic operators
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=elements-expressions
    tier: high
    probes:
      - { id: add_sub, sql: "SELECT c1 + c2, c1 - c2 FROM t;" }
      - { id: mul_div, sql: "SELECT c1 * c2, c1 / c2 FROM t;" }
      - { id: power, sql: "SELECT c1 ** 2 FROM t;" }
      - { id: modulo, sql: "SELECT c1 % 3 FROM t;" }
      - { id: unary_minus, sql: "SELECT -c1, +c1 FROM t;" }
      - { id: parenthesized, sql: "SELECT (c1 + c2) * (c1 - c2) FROM t;" }
      - { id: precedence, sql: "SELECT 1 + 2 * 3 - 4 / 2 FROM sysibm.sysdummy1;" }

  - id: b_bitwise_operators
    name: Bitwise operators
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=elements-expressions
    tier: medium
    probes:
      - { id: and_or, sql: "SELECT c1 & c2, c1 | c2 FROM t;" }
      - { id: xor, sql: "SELECT c1 ^ c2 FROM t;" }
      - { id: not, sql: "SELECT ~c1 FROM t;" }

  - id: b_concatenation
    name: Concatenation operators
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=elements-expressions
    tier: high
    probes:
      - { id: pipes, sql: "SELECT c1 || c2 FROM t;" }
      - { id: concat_keyword, sql: "SELECT c1 CONCAT c2 FROM t;" }
      - { id: chained, sql: "SELECT 'a' || c1 || 'b' CONCAT 'c' FROM t;" }

  - id: b_labeled_durations
    name: Labeled durations and datetime arithmetic
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=expressions-datetime-operations-durations
    tier: medium
    probes:
      - { id: years, sql: "SELECT d + 1 YEAR FROM t;" }
      - { id: months_plural, sql: "SELECT d - 3 MONTHS FROM t;" }
      - { id: days, sql: "SELECT d + 10 DAYS FROM t;" }
      - { id: hours, sql: "SELECT ts + 2 HOURS FROM t;" }
      - { id: minutes, sql: "SELECT ts + 30 MINUTES FROM t;" }
      - { id: seconds, sql: "SELECT ts - 15 SECONDS FROM t;" }
      - { id: microseconds, sql: "SELECT ts + 500 MICROSECONDS FROM t;" }
      - { id: expression_duration, sql: "SELECT d + (c1 + 1) DAYS FROM t;" }
      - { id: column_duration, sql: "SELECT d + c1 MONTHS FROM t;" }
      - { id: chained_durations, sql: "SELECT d + 1 YEAR + 2 MONTHS - 3 DAYS FROM t;" }
      - { id: date_difference, sql: "SELECT d1 - d2 FROM t;" }
      - { id: current_date_arith, sql: "SELECT CURRENT DATE + 1 DAY FROM sysibm.sysdummy1;" }

  - id: b_comparison_predicate
    name: Basic predicate
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=predicates-basic-predicate
    tier: high
    probes:
      - { id: eq, sql: "SELECT * FROM t WHERE c1 = 1;" }
      - { id: ne, sql: "SELECT * FROM t WHERE c1 <> 1;" }
      - { id: lt_gt, sql: "SELECT * FROM t WHERE c1 < 1 OR c2 > 2;" }
      - { id: le_ge, sql: "SELECT * FROM t WHERE c1 <= 1 AND c2 >= 2;" }
      - { id: bang_eq, sql: "SELECT * FROM t WHERE c1 != 1;" }
      - { id: caret_eq, sql: "SELECT * FROM t WHERE c1 ^= 1;" }
      - { id: bang_lt_gt, sql: "SELECT * FROM t WHERE c1 !< 1 AND c2 !> 2;" }
      - { id: caret_lt_gt, sql: "SELECT * FROM t WHERE c1 ^< 1 AND c2 ^> 2;" }
      - { id: scalar_subquery, sql: "SELECT * FROM t WHERE c1 > (SELECT AVG(c1) FROM t2);" }
      - { id: row_value, sql: "SELECT * FROM t WHERE (c1, c2) >= (2009, 10);" }
      - { id: boolean_expression, sql: "SELECT * FROM t WHERE (c1 > 1) = (c2 > 2);" }

  - id: b_quantified_predicate
    name: Quantified predicate
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=predicates-quantified-predicate
    tier: high
    probes:
      - { id: eq_any, sql: "SELECT c1 FROM t WHERE c1 = ANY (SELECT c2 FROM t2);" }
      - { id: gt_some, sql: "SELECT c1 FROM t WHERE c1 > SOME (SELECT c2 FROM t2);" }
      - { id: gt_all, sql: "SELECT c1 FROM t WHERE c1 > ALL (SELECT c2 FROM t2 WHERE c2 < 0);" }
      - { id: ne_all, sql: "SELECT c1 FROM t WHERE c1 <> ALL (SELECT c2 FROM t2);" }
      - { id: le_ge_any, sql: "SELECT c1 FROM t WHERE c1 <= ANY (SELECT c2 FROM t2) AND c1 >= ANY (SELECT c3 FROM t2);" }
      - { id: lt_any, sql: "SELECT c1 FROM t WHERE c1 < ANY (SELECT c2 FROM t2);" }
      - { id: row_value_any, sql: "SELECT c1 FROM t WHERE (c1, c2) = ANY (SELECT c3, c4 FROM t2);" }
      - { id: bang_eq_all, sql: "SELECT c1 FROM t WHERE c1 != ALL (SELECT c2 FROM t2);" }
    examples:
      - "SELECT COLA FROM TBLAB WHERE COLA = ANY(SELECT COLX FROM TBLXY );"
      - "SELECT COLA FROM TBLAB WHERE COLA > ANY(SELECT COLX FROM TBLXY );"
      - "SELECT COLA FROM TBLAB WHERE COLA > ALL(SELECT COLX FROM TBLXY );"

  - id: b_between_predicate
    name: BETWEEN predicate
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=predicates-between-predicate
    tier: high
    probes:
      - { id: between, sql: "SELECT * FROM t WHERE c1 BETWEEN 1 AND 10;" }
      - { id: not_between, sql: "SELECT * FROM t WHERE c1 NOT BETWEEN 1 AND 10;" }
      - { id: expression_bounds, sql: "SELECT * FROM t WHERE c1 BETWEEN c2 + 1 AND c3 * 2;" }
      - { id: date_bounds, sql: "SELECT * FROM t WHERE d BETWEEN '2020-01-01' AND '2020-12-31';" }

  - id: b_in_predicate
    name: IN predicate
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=predicates-in-predicate
    tier: high
    probes:
      - { id: in_list, sql: "SELECT * FROM t WHERE c1 IN (1, 2, 3);" }
      - { id: not_in_list, sql: "SELECT * FROM t WHERE c1 NOT IN ('a', 'b');" }
      - { id: in_subquery, sql: "SELECT * FROM t WHERE c1 IN (SELECT c2 FROM t2);" }
      - { id: not_in_subquery, sql: "SELECT * FROM t WHERE c1 NOT IN (SELECT c2 FROM t2 WHERE c3 = 1);" }
      - { id: in_single_expression, sql: "SELECT * FROM t WHERE c1 IN (c2);" }
      - { id: row_in_subquery, sql: "SELECT * FROM t WHERE (c1, c2) IN (SELECT c3, c4 FROM t2);" }
      - { id: row_in_values, sql: "SELECT * FROM t WHERE (c1, c2) IN (VALUES (1, 2), (3, 4));" }
      - { id: expression_in_list, sql: "SELECT * FROM t WHERE YEAR(d) IN (1999, 2000, 2001);" }
    examples:
      - "SELECT * FROM t WHERE EMPNO IN (SELECT EMPNO FROM EMPLOYEE WHERE WORKDEPT = 'E11' );"

  - id: b_like_predicate
    name: LIKE predicate
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=predicates-like-predicate
    tier: high
    probes:
      - { id: like, sql: "SELECT * FROM t WHERE c1 LIKE '%SYSTEMS%';" }
      - { id: not_like, sql: "SELECT * FROM t WHERE c1 NOT LIKE 'J_';" }
      - { id: like_escape, sql: "SELECT * FROM t WHERE c1 LIKE '\\_\\\\%' ESCAPE '\\';" }
      - { id: not_like_escape, sql: "SELECT * FROM t WHERE c1 NOT LIKE '!%%' ESCAPE '!';" }
      - { id: like_expression_pattern, sql: "SELECT * FROM t WHERE c1 LIKE c2 || '%';" }
      - { id: like_special_register, sql: "SELECT * FROM t WHERE c1 LIKE CURRENT SERVER;" }
      - { id: like_binary_escape, sql: "SELECT * FROM t WHERE c1 LIKE c2 ESCAPE BX'0E';" }
    examples:
      - "SELECT PROJNAME FROM PROJECT WHERE PROJECT.PROJNAME LIKE '%SYSTEMS%';"
      - "SELECT FIRSTNME FROM EMPLOYEE WHERE EMPLOYEE.FIRSTNME LIKE 'J_';"
      - "SELECT FIRSTNME FROM EMPLOYEE WHERE EMPLOYEE.FIRSTNME LIKE 'J%';"

  - id: b_regexp_like_predicate
    name: REGEXP_LIKE predicate
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=predicates-regexp-like-predicate
    tier: medium
    probes:
      - { id: basic, sql: "SELECT * FROM t WHERE REGEXP_LIKE(c1, 'a+b');" }
      - { id: with_flags, sql: "SELECT * FROM t WHERE REGEXP_LIKE(c1, 'luc+?hes+?i', 'i');" }
      - { id: with_start, sql: "SELECT * FROM t WHERE REGEXP_LIKE(c1, 'abc', 3);" }
      - { id: with_start_flags_units, sql: "SELECT * FROM t WHERE REGEXP_LIKE(c1, 'abc', 3, 'i', CODEUNITS32);" }
      - { id: with_octets, sql: "SELECT * FROM t WHERE REGEXP_LIKE(c1, 'abc', 1, 'c', OCTETS);" }
      - { id: negated, sql: "SELECT * FROM t WHERE NOT REGEXP_LIKE(pid, '[0-9]{3}-[0-9]{3}-[0-9]{2}');" }
    examples:
      - "SELECT EMPNO FROM EMPLOYEE WHERE REGEXP_LIKE (LASTNAME,'luc+?hes+?i','i');"
      - "SELECT PID FROM PRODUCT WHERE NOT REGEXP_LIKE (pid,'[0-9]{3}-[0-9]{3}-[0-9]{2}');"

  - id: b_null_predicate
    name: NULL predicate
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=predicates-null-predicate
    tier: high
    probes:
      - { id: is_null, sql: "SELECT * FROM t WHERE c1 IS NULL;" }
      - { id: is_not_null, sql: "SELECT * FROM t WHERE c1 IS NOT NULL;" }
      - { id: isnull_synonym, sql: "SELECT * FROM t WHERE c1 ISNULL;" }
      - { id: notnull_synonym, sql: "SELECT * FROM t WHERE c1 NOTNULL;" }
      - { id: expression_is_null, sql: "SELECT * FROM t WHERE c1 + c2 IS NULL;" }

  - id: b_distinct_predicate
    name: DISTINCT predicate
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=predicates-distinct-predicate
    tier: medium
    probes:
      - { id: is_distinct_from, sql: "SELECT * FROM t WHERE c1 IS DISTINCT FROM c2;" }
      - { id: is_not_distinct_from, sql: "SELECT * FROM t WHERE c1 IS NOT DISTINCT FROM 2;" }

  - id: b_exists_predicate
    name: EXISTS predicate
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=predicates-exists-predicate
    tier: high
    probes:
      - { id: exists, sql: "SELECT * FROM t WHERE EXISTS (SELECT * FROM t2 WHERE t2.c1 = t.c1);" }
      - { id: not_exists, sql: "SELECT * FROM t WHERE NOT EXISTS (SELECT 1 FROM t2 WHERE t2.c1 = t.c1);" }
      - { id: exists_values, sql: "SELECT * FROM t WHERE EXISTS (VALUES 1);" }

  - id: b_type_predicate
    name: TYPE predicate
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=predicates-type-predicate
    tier: low
    probes:
      - { id: is_of, sql: "SELECT * FROM t WHERE c1 IS OF (employee_t);" }
      - { id: is_not_of_only, sql: "SELECT * FROM t WHERE c1 IS NOT OF (ONLY employee_t, manager_t);" }
      - { id: is_of_dynamic_type, sql: "SELECT * FROM t WHERE DEREF(r) IS OF DYNAMIC TYPE (employee_t);" }

  - id: b_xmlexists_predicate
    name: XMLEXISTS predicate
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=predicates-xmlexists-predicate
    tier: medium
    probes:
      - { id: basic, sql: "SELECT * FROM t WHERE XMLEXISTS('$d/a/b' PASSING x AS \"d\");" }
      - { id: passing_by_ref, sql: "SELECT * FROM t WHERE XMLEXISTS('$d/a' PASSING BY REF x AS \"d\");" }
      - { id: multiple_args, sql: "SELECT * FROM t WHERE XMLEXISTS('$d/a[b=$v]' PASSING x AS \"d\", c1 AS \"v\");" }
      - { id: context_item, sql: "SELECT * FROM t WHERE XMLEXISTS('/a/b' PASSING x);" }
      - { id: negated, sql: "SELECT * FROM t WHERE NOT XMLEXISTS('$d/a' PASSING x AS \"d\");" }

  - id: b_search_conditions
    name: Search conditions
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=predicates-search-conditions
    tier: high
    probes:
      - { id: and, sql: "SELECT * FROM t WHERE c1 = 1 AND c2 = 2;" }
      - { id: or, sql: "SELECT * FROM t WHERE c1 = 1 OR c2 = 2;" }
      - { id: not, sql: "SELECT * FROM t WHERE NOT c1 = 1;" }
      - { id: not_parenthesized, sql: "SELECT * FROM t WHERE NOT (c1 = 1 OR c2 = 2);" }
      - { id: mixed_precedence, sql: "SELECT * FROM t WHERE c1 = 1 OR c2 = 2 AND NOT c3 = 3;" }
      - { id: selectivity, sql: "SELECT * FROM t WHERE c1 = 1 SELECTIVITY 0.001;" }
      - { id: selectivity_with_and, sql: "SELECT * FROM t WHERE c1 = 1 SELECTIVITY 0.5 AND c2 = 2 SELECTIVITY 0.1;" }
      - { id: boolean_column, sql: "SELECT * FROM t WHERE flag;" }
      - { id: boolean_literal, sql: "SELECT * FROM t WHERE TRUE AND NOT FALSE;" }

  - id: b_case_expression
    name: CASE expression
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=expressions-case-expression
    tier: high
    probes:
      - { id: searched, sql: "SELECT CASE WHEN c1 < 15 THEN 'a' WHEN c1 < 19 THEN 'b' ELSE 'c' END FROM t;" }
      - { id: searched_no_else, sql: "SELECT CASE WHEN c1 < 15 THEN 'a' END FROM t;" }
      - { id: simple, sql: "SELECT CASE c1 WHEN 'A' THEN 'Admin' WHEN 'B' THEN 'HR' END FROM t;" }
      - { id: simple_else, sql: "SELECT CASE SUBSTR(c1, 1, 1) WHEN 'A' THEN 1 ELSE 0 END FROM t;" }
      - { id: then_null, sql: "SELECT CASE WHEN c1 = 0 THEN NULL ELSE c2 / c1 END FROM t;" }
      - { id: else_null, sql: "SELECT CASE WHEN c1 = 0 THEN 1 ELSE NULL END FROM t;" }
      - { id: in_where, sql: "SELECT * FROM t WHERE (CASE WHEN c1 = 0 THEN NULL ELSE c2 / c1 END) > 0.25;" }
      - { id: nested, sql: "SELECT CASE WHEN c1 > 0 THEN CASE WHEN c2 > 0 THEN 1 ELSE 2 END ELSE 3 END FROM t;" }
      - { id: compound_condition, sql: "SELECT CASE WHEN c1 > 0 AND c2 IS NOT NULL OR c3 IN (1, 2) THEN 1 ELSE 0 END FROM t;" }
      - { id: in_order_by, sql: "SELECT c1 FROM t ORDER BY CASE WHEN c1 IS NULL THEN 1 ELSE 0 END, c1;" }
    examples:
      - "SELECT EMPNO, LASTNAME, CASE SUBSTR(WORKDEPT,1,1) WHEN 'A' THEN 'Administration' WHEN 'B' THEN 'Human Resources' WHEN 'C' THEN 'Accounting' WHEN 'D' THEN 'Design' WHEN 'E' THEN 'Operations' END FROM EMPLOYEE;"
      - "SELECT EMPNO, FIRSTNME, MIDINIT, LASTNAME, CASE WHEN EDLEVEL < 15 THEN 'SECONDARY' WHEN EDLEVEL < 19 THEN 'COLLEGE' ELSE 'POST GRADUATE' END FROM EMPLOYEE;"
      - "SELECT EMPNO, WORKDEPT, SALARY+COMM FROM EMPLOYEE WHERE ( CASE WHEN SALARY=0 THEN NULL ELSE COMM/SALARY END ) > 0.25;"

  - id: b_extract_function
    name: EXTRACT function
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=functions-extract
    tier: medium
    probes:
      - { id: year, sql: "SELECT EXTRACT(YEAR FROM d) FROM t;" }
      - { id: month, sql: "SELECT EXTRACT(MONTH FROM d) FROM t;" }
      - { id: day, sql: "SELECT EXTRACT(DAY FROM ts) FROM t;" }
      - { id: epoch, sql: "SELECT EXTRACT(EPOCH FROM ts) FROM t;" }
      - { id: millennium_century_decade, sql: "SELECT EXTRACT(MILLENNIUM FROM d), EXTRACT(CENTURY FROM d), EXTRACT(DECADE FROM d) FROM t;" }
      - { id: quarter_week, sql: "SELECT EXTRACT(QUARTER FROM d), EXTRACT(WEEK FROM d) FROM t;" }
      - { id: dow_doy, sql: "SELECT EXTRACT(DOW FROM d), EXTRACT(DOY FROM d) FROM t;" }
      - { id: plural_date_fields, sql: "SELECT EXTRACT(YEARS FROM d), EXTRACT(MONTHS FROM d), EXTRACT(DAYS FROM d) FROM t;" }
      - { id: hour_minute_second, sql: "SELECT EXTRACT(HOUR FROM tm), EXTRACT(MINUTE FROM tm), EXTRACT(SECOND FROM tm) FROM t;" }
      - { id: milli_micro, sql: "SELECT EXTRACT(MILLISECOND FROM ts), EXTRACT(MICROSECONDS FROM ts) FROM t;" }
      - { id: from_duration_expression, sql: "SELECT EXTRACT(DAY FROM ts1 - ts2) FROM t;" }
    examples:
      - "SELECT EXTRACT ( MONTH FROM col1) FROM PROJECT;"
      - "SELECT EXTRACT ( MILLISECONDS FROM col2) FROM PROJECT;"
      - "SELECT EXTRACT ( DECADE FROM col3) FROM PROJECT;"

  - id: b_substring_function
    name: SUBSTRING function
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=functions-substring
    tier: medium
    probes:
      - { id: from, sql: "SELECT SUBSTRING(c1 FROM 2) FROM t;" }
      - { id: from_for, sql: "SELECT SUBSTRING(c1 FROM 2 FOR 3) FROM t;" }
      - { id: from_for_using_codeunits32, sql: "SELECT SUBSTRING(c1 FROM 2 FOR 3 USING CODEUNITS32) FROM t;" }
      - { id: from_using_codeunits16, sql: "SELECT SUBSTRING(c1 FROM 2 USING CODEUNITS16) FROM t;" }
      - { id: from_for_using_octets, sql: "SELECT SUBSTRING(c1 FROM 2 FOR 3 USING OCTETS) FROM t;" }
      - { id: comma_form, sql: "SELECT SUBSTRING(c1, 2) FROM t;" }
      - { id: comma_form_length, sql: "SELECT SUBSTRING(c1, 2, 3) FROM t;" }
      - { id: comma_form_codeunits, sql: "SELECT SUBSTRING(c1, 2, 3, CODEUNITS32) FROM t;" }
      - { id: comma_form_octets, sql: "SELECT SUBSTRING(c1, 1, 4, OCTETS) FROM t;" }
      - { id: expression_args, sql: "SELECT SUBSTRING(c1 || c2 FROM c3 + 1 FOR LENGTH(c1)) FROM t;" }

  - id: b_trim_function
    name: TRIM function
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=functions-trim
    tier: medium
    probes:
      - { id: plain, sql: "SELECT TRIM(c1) FROM t;" }
      - { id: from_only, sql: "SELECT TRIM(FROM c1) FROM t;" }
      - { id: both, sql: "SELECT TRIM(BOTH FROM c1) FROM t;" }
      - { id: leading, sql: "SELECT TRIM(LEADING FROM c1) FROM t;" }
      - { id: trailing, sql: "SELECT TRIM(TRAILING FROM c1) FROM t;" }
      - { id: both_strip_char, sql: "SELECT TRIM(BOTH '0' FROM c1) FROM t;" }
      - { id: leading_strip_char, sql: "SELECT TRIM(LEADING 'x' FROM c1) FROM t;" }
      - { id: trailing_strip_char, sql: "SELECT TRIM(TRAILING '.' FROM c1) FROM t;" }
      - { id: abbreviated_b, sql: "SELECT TRIM(B ' ' FROM c1) FROM t;" }
      - { id: abbreviated_l, sql: "SELECT TRIM(L '0' FROM c1) FROM t;" }
      - { id: abbreviated_t, sql: "SELECT TRIM(T '0' FROM c1) FROM t;" }
      - { id: strip_char_no_keyword, sql: "SELECT TRIM('0' FROM c1) FROM t;" }

  - id: b_position_function
    name: POSITION function
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=functions-position
    tier: medium
    probes:
      - { id: in, sql: "SELECT POSITION('b' IN c1) FROM t;" }
      - { id: in_using_codeunits32, sql: "SELECT POSITION('b' IN c1 USING CODEUNITS32) FROM t;" }
      - { id: in_using_codeunits16, sql: "SELECT POSITION(c2 IN c1 USING CODEUNITS16) FROM t;" }
      - { id: in_using_octets, sql: "SELECT POSITION('b' IN c1 USING OCTETS) FROM t;" }
      - { id: comma_form, sql: "SELECT POSITION('b', c1, CODEUNITS32) FROM t;" }
      - { id: comma_form_octets, sql: "SELECT POSITION(c2, c1, OCTETS) FROM t;" }
      - { id: comma_form_codeunits16, sql: "SELECT POSITION(c2, c1, CODEUNITS16) FROM t;" }

  - id: b_overlay_function
    name: OVERLAY function
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=functions-overlay
    tier: medium
    probes:
      - { id: placing_from, sql: "SELECT OVERLAY(c1 PLACING 'IS' FROM 4) FROM t;" }
      - { id: placing_from_for, sql: "SELECT OVERLAY(c1 PLACING 'IS' FROM 4 FOR 2) FROM t;" }
      - { id: placing_from_for_codeunits32, sql: "SELECT OVERLAY(c1 PLACING 'IS' FROM 4 FOR 2 USING CODEUNITS32) FROM t;" }
      - { id: placing_from_using_octets, sql: "SELECT OVERLAY(c1 PLACING c2 FROM 4 USING OCTETS) FROM t;" }
      - { id: comma_form, sql: "SELECT OVERLAY(c1, 'IS', 4) FROM t;" }
      - { id: comma_form_length, sql: "SELECT OVERLAY(c1, 'IS', 4, 2) FROM t;" }
      - { id: comma_form_codeunits, sql: "SELECT OVERLAY(c1, 'IS', 4, 2, CODEUNITS16) FROM t;" }
      - { id: comma_form_octets, sql: "SELECT OVERLAY('INSERTING', 'IS', 4, 2, OCTETS) FROM SYSIBM.SYSDUMMY1;" }
    examples:
      - "SELECT OVERLAY ('INSERTING','IS',4,2, OCTETS ), OVERLAY ('INSERTING','IS',4,0, OCTETS ), OVERLAY ('INSERTING','',4,2, OCTETS ) FROM SYSIBM.SYSDUMMY1;"

  - id: b_cast_specification
    name: CAST specification
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=expressions-cast-specification
    tier: high
    probes:
      - { id: integer, sql: "SELECT CAST(c1 AS INTEGER) FROM t;" }
      - { id: decimal_precision_scale, sql: "SELECT CAST(c1 AS DECIMAL(9,2)) FROM t;" }
      - { id: decimal_precision, sql: "SELECT CAST(c1 AS DECIMAL(9)) FROM t;" }
      - { id: varchar, sql: "SELECT CAST(c1 AS VARCHAR(30)) FROM t;" }
      - { id: varchar_octets, sql: "SELECT CAST(c1 AS VARCHAR(30 OCTETS)) FROM t;" }
      - { id: varchar_codeunits32, sql: "SELECT CAST(c1 AS VARCHAR(30 CODEUNITS32)) FROM t;" }
      - { id: char_for_bit_data, sql: "SELECT CAST(c1 AS CHAR(8) FOR BIT DATA) FROM t;" }
      - { id: clob, sql: "SELECT CAST(c1 AS CLOB(1M)) FROM t;" }
      - { id: char_large_object, sql: "SELECT CAST(c1 AS CHARACTER LARGE OBJECT(10K)) FROM t;" }
      - { id: graphic_types, sql: "SELECT CAST(c1 AS VARGRAPHIC(20)), CAST(c2 AS GRAPHIC(5)) FROM t;" }
      - { id: dbclob, sql: "SELECT CAST(c1 AS DBCLOB(1G)) FROM t;" }
      - { id: national_types, sql: "SELECT CAST(c1 AS NCHAR(5)), CAST(c2 AS NVARCHAR(10)) FROM t;" }
      - { id: binary_types, sql: "SELECT CAST(c1 AS BINARY(4)), CAST(c2 AS VARBINARY(10)), CAST(c3 AS BLOB(1M)) FROM t;" }
      - { id: float_types, sql: "SELECT CAST(c1 AS REAL), CAST(c2 AS DOUBLE PRECISION), CAST(c3 AS FLOAT(24)) FROM t;" }
      - { id: decfloat, sql: "SELECT CAST(c1 AS DECFLOAT(16)) FROM t;" }
      - { id: datetime_types, sql: "SELECT CAST(c1 AS DATE), CAST(c2 AS TIME), CAST(c3 AS TIMESTAMP) FROM t;" }
      - { id: timestamp_precision, sql: "SELECT CAST(c1 AS TIMESTAMP(6)) FROM t;" }
      - { id: bigint_smallint, sql: "SELECT CAST(c1 AS BIGINT), CAST(c2 AS SMALLINT) FROM t;" }
      - { id: boolean, sql: "SELECT CAST(c1 AS BOOLEAN) FROM t;" }
      - { id: xml, sql: "SELECT CAST(c1 AS XML) FROM t;" }
      - { id: null_operand, sql: "SELECT CAST(NULL AS INTEGER) FROM t;" }
      - { id: parameter_marker, sql: "SELECT * FROM t WHERE c1 = CAST(? AS INTEGER);" }
      - { id: distinct_type, sql: "SELECT CAST(c1 AS myschema.t_age) FROM t;" }
      - { id: ref_scope, sql: "SELECT CAST(c1 AS REF(emp_t) SCOPE emp_tab) FROM t;" }
      - { id: cursor_cast, sql: "SELECT CAST(? AS CURSOR cur_type) FROM t;" }
      - { id: row_cast, sql: "SELECT CAST(ROW(1, 'a') AS row_type_name) FROM t;" }
      - { id: interval_cast, sql: "SELECT CAST('1' AS INTERVAL DAY) FROM t;" }
      - { id: array_type_cast, sql: "SELECT CAST(? AS int_array) FROM t;" }
    examples:
      - "SELECT EMPNO, CAST( SALARY AS INTEGER ) FROM EMPLOYEE;"
      - "UPDATE PERSONNEL SET RETIRE_YEAR = ? WHERE AGE = CAST( ? AS T_AGE );"

  - id: b_xmlcast_specification
    name: XMLCAST specification
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=expressions-xmlcast-specification
    tier: low
    probes:
      - { id: to_varchar, sql: "SELECT XMLCAST(x AS VARCHAR(20)) FROM t;" }
      - { id: null_to_xml, sql: "SELECT XMLCAST(NULL AS XML) FROM t;" }
      - { id: parameter_marker, sql: "SELECT XMLCAST(? AS XML) FROM t;" }

  - id: b_array_expressions
    name: Array constructor and element specification
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=elements-array-constructor
    tier: low
    probes:
      - { id: constructor_list, sql: "SELECT ARRAY[1, 2, 3] FROM sysibm.sysdummy1;" }
      - { id: constructor_with_null, sql: "SELECT ARRAY[1, NULL, 3] FROM sysibm.sysdummy1;" }
      - { id: constructor_fullselect, sql: "SELECT ARRAY[SELECT c1 FROM t ORDER BY c1] FROM sysibm.sysdummy1;" }
      - { id: constructor_with_cte, sql: "SELECT ARRAY[WITH x(a) AS (SELECT c1 FROM t) SELECT a FROM x] FROM sysibm.sysdummy1;" }
      - { id: element, sql: "SELECT arr[1] FROM t;" }
      - { id: element_expression, sql: "SELECT arr[c1 + 1] FROM t;" }
      - { id: element_cast_parameter_marker, sql: "SELECT CAST(? AS int_array)[1] FROM t;" }

  - id: b_row_change_expression
    name: ROW CHANGE expression
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=expressions-row-change-expression
    tier: low
    probes:
      - { id: token, sql: "SELECT ROW CHANGE TOKEN FOR t FROM t;" }
      - { id: timestamp, sql: "SELECT ROW CHANGE TIMESTAMP FOR t FROM t;" }
      - { id: in_where, sql: "SELECT c1 FROM t WHERE ROW CHANGE TOKEN FOR t = 1;" }

  - id: b_scalar_fullselect
    name: Scalar fullselect and row value expressions
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=elements-expressions
    tier: medium
    probes:
      - { id: scalar_subquery_select_list, sql: "SELECT (SELECT MAX(c1) FROM t2) FROM t;" }
      - { id: scalar_subquery_arith, sql: "SELECT c1 + (SELECT MIN(c2) FROM t2) FROM t;" }
      - { id: row_expression, sql: "SELECT * FROM t WHERE (c1, c2) = (1, 2);" }
      - { id: row_expression_subquery, sql: "SELECT * FROM t WHERE (c1, c2) = (SELECT c3, c4 FROM t2 WHERE c5 = 1);" }
      - { id: row_constructor, sql: "SELECT * FROM t WHERE ROW(c1, c2) = ROW(1, 2);" }
