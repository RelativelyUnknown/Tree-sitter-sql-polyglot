dialect: snowflake
engine: Snowflake
version: "current (docs read 2026-10-04)"
source: https://docs.snowflake.com/en/sql-reference/sql-all

statements:
  - id: show_mfa_methods
    name: SHOW MFA METHODS
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-mfa-methods
    tier: low
    probes:
      - id: basic
        sql: "SHOW MFA METHODS;"
      - id: for_user
        sql: "SHOW MFA METHODS FOR USER u;"
  - id: show_model_monitors
    name: SHOW MODEL MONITORS
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-model-monitors
    tier: low
    probes:
      - id: basic
        sql: "SHOW MODEL MONITORS;"
      - id: like_in_schema
        sql: "SHOW MODEL MONITORS LIKE '%m%' IN SCHEMA s;"
      - id: in_gateway
        sql: "SHOW MODEL MONITORS IN GATEWAY g;"
  - id: show_models
    name: SHOW MODELS
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-models
    tier: low
    probes:
      - id: basic
        sql: "SHOW MODELS;"
      - id: like_in_schema
        sql: "SHOW MODELS LIKE '%m%' IN SCHEMA s;"
  - id: show_multi_party_approval_policies
    name: SHOW MULTI PARTY APPROVAL POLICIES
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-multi-party-approval-policies
    tier: low
    probes:
      - id: basic
        sql: "SHOW MULTI PARTY APPROVAL POLICIES;"
      - id: filters
        sql: "SHOW MULTI PARTY APPROVAL POLICIES LIKE '%p%' IN ACCOUNT STARTS WITH 'a' LIMIT 10;"
      - id: on_account
        sql: "SHOW MULTI PARTY APPROVAL POLICIES ON ACCOUNT;"
