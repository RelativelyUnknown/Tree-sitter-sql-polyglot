dialect: snowflake
engine: Snowflake
version: "current (docs read 2026-10-04)"
source: https://docs.snowflake.com/en/sql-reference/sql-all

statements:
  - id: copy_into_location
    name: COPY INTO <location>
    doc: https://docs.snowflake.com/en/sql-reference/sql/copy-into-location
    tier: high
    probes:
      - id: table_stage_from_table
        sql: "COPY INTO @%t FROM t;"
      - id: named_stage_from_table
        sql: "COPY INTO @s FROM t;"
      - id: named_stage_path
        sql: "COPY INTO @s/result/data_ FROM t;"
      - id: namespace_stage
        sql: "COPY INTO @db.sch.s/path FROM db.sch.t;"
      - id: user_stage
        sql: "COPY INTO @~ FROM t;"
      - id: user_stage_path
        sql: "COPY INTO @~/unload/ FROM t;"
      - id: from_query
        sql: "COPY INTO @s FROM (SELECT * FROM t);"
      - id: from_query_limit
        sql: "COPY INTO @s FROM (SELECT * FROM t LIMIT 5);"
      - id: partition_by
        sql: "COPY INTO @%t FROM t PARTITION BY ('date=' || to_varchar(dt, 'YYYY-MM-DD')) FILE_FORMAT = (TYPE = parquet);"
      - id: file_format_name
        sql: "COPY INTO @s FROM t FILE_FORMAT = (FORMAT_NAME = 'myformat');"
      - id: file_format_name_namespace
        sql: "COPY INTO @s FROM t FILE_FORMAT = (FORMAT_NAME = 'db.sch.myformat');"
      - id: file_format_name_unquoted
        sql: "COPY INTO @s FROM t FILE_FORMAT = (FORMAT_NAME = my_csv_format);"
      - id: file_format_csv
        sql: "COPY INTO @s FROM t FILE_FORMAT = (TYPE = CSV);"
      - id: file_format_json
        sql: "COPY INTO @s FROM t FILE_FORMAT = (TYPE = JSON);"
      - id: file_format_parquet
        sql: "COPY INTO @s FROM t FILE_FORMAT = (TYPE = PARQUET);"
      - id: csv_compression
        sql: "COPY INTO @s FROM t FILE_FORMAT = (TYPE = CSV COMPRESSION = GZIP);"
      - id: csv_delimiters
        sql: "COPY INTO @s FROM t FILE_FORMAT = (TYPE = CSV RECORD_DELIMITER = '\\n' FIELD_DELIMITER = '|');"
      - id: csv_delimiters_none
        sql: "COPY INTO @s FROM t FILE_FORMAT = (TYPE = CSV RECORD_DELIMITER = NONE FIELD_DELIMITER = NONE);"
      - id: csv_file_extension
        sql: "COPY INTO @s FROM t FILE_FORMAT = (TYPE = CSV FILE_EXTENSION = 'csv');"
      - id: csv_escape
        sql: "COPY INTO @s FROM t FILE_FORMAT = (TYPE = CSV ESCAPE = '\\\\' ESCAPE_UNENCLOSED_FIELD = '\\\\');"
      - id: csv_formats
        sql: "COPY INTO @s FROM t FILE_FORMAT = (TYPE = CSV DATE_FORMAT = 'YYYY-MM-DD' TIME_FORMAT = AUTO TIMESTAMP_FORMAT = 'YYYY-MM-DD HH24:MI:SS');"
      - id: csv_binary_format
        sql: "COPY INTO @s FROM t FILE_FORMAT = (TYPE = CSV BINARY_FORMAT = BASE64);"
      - id: csv_enclosed_by
        sql: "COPY INTO @s FROM t FILE_FORMAT = (TYPE = CSV FIELD_OPTIONALLY_ENCLOSED_BY = '\"');"
      - id: csv_null_if_empty_as_null
        sql: "COPY INTO @~ FROM t FILE_FORMAT = (TYPE = csv NULL_IF = ('NULL', 'null') EMPTY_FIELD_AS_NULL = false);"
      - id: json_compression_extension
        sql: "COPY INTO @s FROM t FILE_FORMAT = (TYPE = JSON COMPRESSION = BZ2 FILE_EXTENSION = 'json');"
      - id: parquet_compression
        sql: "COPY INTO @s FROM t FILE_FORMAT = (TYPE = PARQUET COMPRESSION = SNAPPY);"
      - id: parquet_snappy_compression
        sql: "COPY INTO @s FROM t FILE_FORMAT = (TYPE = PARQUET SNAPPY_COMPRESSION = TRUE);"
      - id: copy_option_overwrite
        sql: "COPY INTO @s FROM t OVERWRITE = TRUE;"
      - id: copy_option_single
        sql: "copy into @~ from t single = true;"
      - id: copy_option_max_file_size
        sql: "COPY INTO @s FROM t MAX_FILE_SIZE = 32000000;"
      - id: copy_option_include_query_id
        sql: "COPY INTO @%t FROM t FILE_FORMAT = (TYPE = parquet) INCLUDE_QUERY_ID = true;"
      - id: copy_option_detailed_output
        sql: "COPY INTO @s FROM t DETAILED_OUTPUT = TRUE;"
      - id: copy_options_combined
        sql: "COPY INTO @s FROM t OVERWRITE = TRUE SINGLE = FALSE MAX_FILE_SIZE = 5000000 INCLUDE_QUERY_ID = TRUE DETAILED_OUTPUT = FALSE;"
      - id: header
        sql: "COPY INTO @s FROM t FILE_FORMAT = (TYPE = CSV) HEADER = TRUE;"
      - id: validation_mode
        sql: "COPY INTO @s FROM (SELECT * FROM t LIMIT 5) VALIDATION_MODE = 'RETURN_ROWS';"
      - id: validation_mode_unquoted
        sql: "COPY INTO @s FROM (SELECT * FROM t) VALIDATION_MODE = RETURN_ROWS;"
      - id: s3_storage_integration
        sql: "COPY INTO 's3://mybucket/unload/' FROM t STORAGE_INTEGRATION = myint FILE_FORMAT = (FORMAT_NAME = my_csv_format);"
      - id: s3_credentials
        sql: "COPY INTO 's3://mybucket/unload/' FROM t CREDENTIALS = (AWS_KEY_ID = 'xxxx' AWS_SECRET_KEY = 'xxxxx' AWS_TOKEN = 'xxxxxx') FILE_FORMAT = (FORMAT_NAME = my_csv_format);"
      - id: s3_encryption_cse
        sql: "COPY INTO 's3://mybucket/unload/' FROM t STORAGE_INTEGRATION = myint ENCRYPTION = (TYPE = 'AWS_CSE' MASTER_KEY = 'eSxX0jzYfIamtnBKOEOwq80Au6NbSgPH5r4BDDwOaO8=');"
      - id: s3_encryption_sse_s3
        sql: "COPY INTO 's3://mybucket/unload/' FROM t STORAGE_INTEGRATION = myint ENCRYPTION = (TYPE = 'AWS_SSE_S3');"
      - id: s3_encryption_sse_kms
        sql: "COPY INTO 's3://mybucket/unload/' FROM t STORAGE_INTEGRATION = myint ENCRYPTION = (TYPE = 'AWS_SSE_KMS' KMS_KEY_ID = '1234abcd-12ab-34cd-56ef-1234567890ab');"
      - id: s3_encryption_none
        sql: "COPY INTO 's3://mybucket/unload/' FROM t STORAGE_INTEGRATION = myint ENCRYPTION = (TYPE = 'NONE');"
      - id: gcs_storage_integration
        sql: "COPY INTO 'gcs://mybucket/unload/' FROM t STORAGE_INTEGRATION = myint FILE_FORMAT = (FORMAT_NAME = my_csv_format);"
      - id: gcs_encryption_kms
        sql: "COPY INTO 'gcs://mybucket/unload/' FROM t STORAGE_INTEGRATION = myint ENCRYPTION = (TYPE = 'GCS_SSE_KMS' KMS_KEY_ID = 'key1');"
      - id: azure_storage_integration
        sql: "COPY INTO 'azure://myaccount.blob.core.windows.net/unload/' FROM t STORAGE_INTEGRATION = myint FILE_FORMAT = (FORMAT_NAME = my_csv_format);"
      - id: azure_credentials
        sql: "COPY INTO 'azure://myaccount.blob.core.windows.net/mycontainer/unload/' FROM t CREDENTIALS = (AZURE_SAS_TOKEN = 'xxxx') FILE_FORMAT = (FORMAT_NAME = my_csv_format);"
      - id: azure_encryption
        sql: "COPY INTO 'azure://myaccount.blob.core.windows.net/unload/' FROM t STORAGE_INTEGRATION = myint ENCRYPTION = (TYPE = 'AZURE_CSE' MASTER_KEY = 'kPxX0jzYfIamtnBKOEOwq80Au6NbSgPH5r4BDDwOaO8=');"
    examples:
      - "COPY INTO @%orderstiny/result/data_ FROM orderstiny FILE_FORMAT = (FORMAT_NAME = 'myformat' COMPRESSION = 'GZIP');"
      - "COPY INTO @my_stage/result/data_ FROM (SELECT * FROM orderstiny) file_format =(format_name = 'myformat' compression = 'gzip');"
      - "COPY INTO @%t1 FROM t1 PARTITION BY ('date=' || to_varchar(dt, 'YYYY-MM-DD') || '/hour=' || to_varchar(date_part(hour, ts))) FILE_FORMAT = (TYPE = parquet) MAX_FILE_SIZE = 32000000 HEADER = true;"

  - id: copy_into_table
    name: COPY INTO <table>
    doc: https://docs.snowflake.com/en/sql-reference/sql/copy-into-table
    tier: high
    probes:
      - id: from_named_stage
        sql: "COPY INTO t FROM @s;"
      - id: from_named_stage_path
        sql: "COPY INTO t FROM @s/tutorials/dataloading/contacts1.csv;"
      - id: from_namespace_stage
        sql: "COPY INTO db.sch.t FROM @db.sch.s/path;"
      - id: from_table_stage
        sql: "COPY INTO t FROM @%t/data1/;"
      - id: from_user_stage
        sql: "COPY INTO t FROM @~/staged;"
      - id: from_user_stage_root
        sql: "COPY INTO t FROM @~;"
      - id: from_omitted
        sql: "COPY INTO t FILE_FORMAT = (TYPE = CSV);"
      - id: from_omitted_bare
        sql: "COPY INTO t;"
      - id: files
        sql: "COPY INTO t FROM @%t/data1/ FILES = ('test1.csv', 'test2.csv');"
      - id: pattern
        sql: "COPY INTO t FILE_FORMAT = (TYPE = 'CSV') PATTERN = '.*/.*/.*[.]csv[.]gz';"
      - id: files_and_pattern
        sql: "COPY INTO t FROM @s FILES = ('a.csv') PATTERN = '.*[.]csv';"
      - id: file_format_name
        sql: "COPY INTO t FROM @s FILE_FORMAT = (FORMAT_NAME = 'mycsv');"
      - id: file_format_name_unquoted
        sql: "COPY INTO t FROM @s FILE_FORMAT = (FORMAT_NAME = my_csv_format);"
      - id: file_format_csv
        sql: "COPY INTO t FROM @s FILE_FORMAT = (TYPE = CSV);"
      - id: file_format_json
        sql: "COPY INTO t FROM @s FILE_FORMAT = (TYPE = 'JSON');"
      - id: file_format_avro
        sql: "COPY INTO t FROM @s FILE_FORMAT = (TYPE = AVRO);"
      - id: file_format_orc
        sql: "COPY INTO t FROM @s FILE_FORMAT = (TYPE = ORC);"
      - id: file_format_parquet
        sql: "COPY INTO t FROM @s FILE_FORMAT = (TYPE = PARQUET);"
      - id: file_format_xml
        sql: "COPY INTO t FROM @s FILE_FORMAT = (TYPE = XML);"
      - id: csv_compression
        sql: "COPY INTO t FROM @s FILE_FORMAT = (TYPE = CSV COMPRESSION = GZIP);"
      - id: csv_delimiters
        sql: "COPY INTO t FROM @s FILE_FORMAT = (TYPE = CSV RECORD_DELIMITER = '\\n' FIELD_DELIMITER = ',');"
      - id: csv_delimiters_none
        sql: "COPY INTO t FROM @s FILE_FORMAT = (TYPE = CSV RECORD_DELIMITER = NONE FIELD_DELIMITER = NONE);"
      - id: csv_header_options
        sql: "COPY INTO t FROM @s FILE_FORMAT = (TYPE = CSV SKIP_HEADER = 1 SKIP_BLANK_LINES = TRUE);"
      - id: csv_parse_header
        sql: "COPY INTO t FROM @s FILE_FORMAT = (TYPE = CSV PARSE_HEADER = TRUE) MATCH_BY_COLUMN_NAME = CASE_INSENSITIVE;"
      - id: csv_multi_line
        sql: "COPY INTO t FROM @s FILE_FORMAT = (TYPE = CSV MULTI_LINE = FALSE);"
      - id: csv_formats
        sql: "COPY INTO t FROM @s FILE_FORMAT = (TYPE = CSV DATE_FORMAT = 'YYYY-MM-DD' TIME_FORMAT = AUTO TIMESTAMP_FORMAT = 'YYYY-MM-DD HH24:MI:SS' BINARY_FORMAT = HEX);"
      - id: csv_escape
        sql: "COPY INTO t FROM @s FILE_FORMAT = (TYPE = CSV ESCAPE = '\\\\' ESCAPE_UNENCLOSED_FIELD = NONE);"
      - id: csv_trim_space_enclosed
        sql: "COPY INTO t FROM @s FILE_FORMAT = (TYPE = CSV TRIM_SPACE = TRUE FIELD_OPTIONALLY_ENCLOSED_BY = '\"');"
      - id: csv_null_if
        sql: "COPY INTO t FROM @s FILE_FORMAT = (TYPE = CSV NULL_IF = ('NULL', 'null', ''));"
      - id: csv_null_if_empty
        sql: "COPY INTO t FROM @s FILE_FORMAT = (TYPE = CSV NULL_IF = ());"
      - id: csv_mismatch_invalid_chars
        sql: "COPY INTO t FROM @s FILE_FORMAT = (TYPE = CSV ERROR_ON_COLUMN_COUNT_MISMATCH = FALSE REPLACE_INVALID_CHARACTERS = TRUE EMPTY_FIELD_AS_NULL = FALSE);"
      - id: csv_bom_encoding
        sql: "COPY INTO t FROM @s FILE_FORMAT = (TYPE = CSV SKIP_BYTE_ORDER_MARK = TRUE ENCODING = 'ISO-8859-1');"
      - id: json_options
        sql: "COPY INTO t FROM @s FILE_FORMAT = (TYPE = JSON STRIP_OUTER_ARRAY = TRUE STRIP_NULL_VALUES = TRUE ALLOW_DUPLICATE = FALSE ENABLE_OCTAL = FALSE);"
      - id: json_utf8_options
        sql: "COPY INTO t FROM @s FILE_FORMAT = (TYPE = JSON IGNORE_UTF8_ERRORS = TRUE SKIP_BYTE_ORDER_MARK = TRUE MULTI_LINE = TRUE);"
      - id: avro_options
        sql: "COPY INTO t FROM @s FILE_FORMAT = (TYPE = AVRO COMPRESSION = AUTO TRIM_SPACE = TRUE NULL_IF = ('null'));"
      - id: orc_options
        sql: "COPY INTO t FROM @s FILE_FORMAT = (TYPE = ORC TRIM_SPACE = TRUE REPLACE_INVALID_CHARACTERS = FALSE);"
      - id: parquet_options
        sql: "COPY INTO t FROM @s FILE_FORMAT = (TYPE = PARQUET COMPRESSION = SNAPPY BINARY_AS_TEXT = FALSE USE_LOGICAL_TYPE = TRUE USE_VECTORIZED_SCANNER = TRUE);"
      - id: xml_options
        sql: "COPY INTO t FROM @s FILE_FORMAT = (TYPE = XML PRESERVE_SPACE = TRUE STRIP_OUTER_ELEMENT = TRUE DISABLE_AUTO_CONVERT = TRUE);"
      - id: copy_option_cluster_at_ingest_time
        sql: "COPY INTO t FROM @s CLUSTER_AT_INGEST_TIME = TRUE;"
      - id: copy_option_enforce_length
        sql: "COPY INTO t FROM @s ENFORCE_LENGTH = FALSE;"
      - id: copy_option_truncatecolumns
        sql: "COPY INTO t FROM @s TRUNCATECOLUMNS = TRUE;"
      - id: copy_option_force
        sql: "COPY INTO load1 FROM @%load1/data1/ FILES = ('test1.csv', 'test2.csv') FORCE = TRUE;"
      - id: copy_option_include_metadata
        sql: "COPY INTO t FROM @s INCLUDE_METADATA = (filename = METADATA$FILENAME, row_num = METADATA$FILE_ROW_NUMBER) MATCH_BY_COLUMN_NAME = CASE_INSENSITIVE;"
      - id: copy_option_load_mode
        sql: "COPY INTO t FROM @s FILE_FORMAT = (TYPE = PARQUET) LOAD_MODE = ADD_FILES_COPY;"
      - id: copy_option_load_uncertain_files
        sql: "COPY INTO t FROM @s LOAD_UNCERTAIN_FILES = TRUE;"
      - id: copy_option_match_by_column_name
        sql: "COPY INTO t FROM @s/sales.json.gz FILE_FORMAT = (TYPE = 'JSON') MATCH_BY_COLUMN_NAME = 'CASE_INSENSITIVE';"
      - id: copy_option_on_error_continue
        sql: "COPY INTO t FROM @s ON_ERROR = CONTINUE;"
      - id: copy_option_on_error_skip_file
        sql: "COPY INTO t FROM @s ON_ERROR = SKIP_FILE;"
      - id: copy_option_on_error_skip_file_num
        sql: "COPY INTO t FROM @s ON_ERROR = SKIP_FILE_3;"
      - id: copy_option_on_error_skip_file_pct
        sql: "COPY INTO t FROM @s ON_ERROR = 'SKIP_FILE_10%';"
      - id: copy_option_on_error_abort
        sql: "COPY INTO t FROM @s ON_ERROR = ABORT_STATEMENT;"
      - id: copy_option_purge
        sql: "COPY INTO t PURGE = TRUE;"
      - id: copy_option_return_failed_only
        sql: "COPY INTO t FROM @s RETURN_FAILED_ONLY = TRUE;"
      - id: copy_option_size_limit
        sql: "COPY INTO t FROM @s SIZE_LIMIT = 25000000;"
      - id: validation_mode_return_n_rows
        sql: "COPY INTO t VALIDATION_MODE = 'RETURN_2_ROWS';"
      - id: validation_mode_return_errors
        sql: "COPY INTO t VALIDATION_MODE = 'RETURN_ERRORS';"
      - id: validation_mode_return_all_errors
        sql: "COPY INTO t FROM @s VALIDATION_MODE = RETURN_ALL_ERRORS;"
      - id: transform_basic
        sql: "COPY INTO t FROM (SELECT $1, $2 FROM @s);"
      - id: transform_column_list
        sql: "COPY INTO t (a, b) FROM (SELECT $1, $2 FROM @s/path);"
      - id: transform_alias_prefix
        sql: "COPY INTO t (a, b) FROM (SELECT x.$1, x.$2 FROM @s x);"
      - id: transform_element_access
        sql: "COPY INTO t (a, b) FROM (SELECT $1:name, $1:price FROM @s);"
      - id: transform_cast_function
        sql: "COPY INTO t (a, b) FROM (SELECT $1::NUMBER, UPPER($2) FROM @s) FILE_FORMAT = (TYPE = CSV);"
      - id: transform_files_pattern_options
        sql: "COPY INTO t (a) FROM (SELECT $1 FROM @s) FILES = ('a.csv') PATTERN = '.*[.]csv' FILE_FORMAT = (FORMAT_NAME = 'mycsv') ON_ERROR = SKIP_FILE;"
      - id: s3_storage_integration
        sql: "COPY INTO t FROM 's3://mybucket/data/files' STORAGE_INTEGRATION = myint FILE_FORMAT = (FORMAT_NAME = my_csv_format);"
      - id: s3_unquoted_url
        sql: "COPY INTO t FROM s3://mybucket/data/files STORAGE_INTEGRATION = myint ENCRYPTION = (MASTER_KEY = 'eSx...') FILE_FORMAT = (FORMAT_NAME = my_csv_format);"
      - id: s3_credentials
        sql: "COPY INTO t FROM 's3://mybucket/data/files' CREDENTIALS = (AWS_KEY_ID = 'xxxx' AWS_SECRET_KEY = 'xxxxx' AWS_TOKEN = 'xxxxxx') FILE_FORMAT = (FORMAT_NAME = my_csv_format);"
      - id: s3_encryption_cse
        sql: "COPY INTO t FROM 's3://mybucket/data/files' STORAGE_INTEGRATION = myint ENCRYPTION = (TYPE = 'AWS_CSE' MASTER_KEY = 'eSx...');"
      - id: s3_encryption_sse_kms
        sql: "COPY INTO t FROM 's3://mybucket/data/files' STORAGE_INTEGRATION = myint ENCRYPTION = (TYPE = 'AWS_SSE_KMS' KMS_KEY_ID = 'key1');"
      - id: gcs_storage_integration
        sql: "COPY INTO t FROM 'gcs://mybucket/data/files' STORAGE_INTEGRATION = myint FILE_FORMAT = (FORMAT_NAME = my_csv_format);"
      - id: gcs_encryption_kms
        sql: "COPY INTO t FROM 'gcs://mybucket/data/files' STORAGE_INTEGRATION = myint ENCRYPTION = (TYPE = 'GCS_SSE_KMS' KMS_KEY_ID = 'key1');"
      - id: azure_storage_integration
        sql: "COPY INTO t FROM 'azure://myaccount.blob.core.windows.net/data/files' STORAGE_INTEGRATION = myint ENCRYPTION = (TYPE = 'AZURE_CSE' MASTER_KEY = 'kPx...') FILE_FORMAT = (FORMAT_NAME = my_csv_format);"
      - id: azure_credentials
        sql: "COPY INTO t FROM 'azure://myaccount.blob.core.windows.net/mycontainer/data/files' CREDENTIALS = (AZURE_SAS_TOKEN = '?sv=2016-05-31') FILE_FORMAT = (FORMAT_NAME = my_csv_format);"
    examples:
      - "COPY INTO mytable FROM @my_int_stage;"
      - "COPY INTO mytable FROM @my_ext_stage/tutorials/dataloading/sales.json.gz FILE_FORMAT = (TYPE = 'JSON') MATCH_BY_COLUMN_NAME = 'CASE_INSENSITIVE';"
      - "COPY INTO mytable FILE_FORMAT = (FORMAT_NAME = myformat) PATTERN = '.*sales.*[.]csv';"
