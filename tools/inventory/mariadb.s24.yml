dialect: mariadb
engine: MariaDB Server
version: "11.x (current)"
source: https://mariadb.com/docs/server/reference/sql-statements

statements:
  - id: declare_variable
    name: DECLARE Variable
    doc: https://mariadb.com/docs/server/reference/sql-statements/programmatic-compound-statements/declare-variable
    tier: high
    probes:
      - id: basic
        sql: "DECLARE v INT;"
      - id: default
        sql: "DECLARE v VARCHAR(5) DEFAULT 'monty';"
      - id: default_expression
        sql: "DECLARE v INT DEFAULT 1 + 2;"
      - id: default_subquery
        sql: "DECLARE v INT DEFAULT (SELECT COUNT(*) FROM t);"
      - id: multiple_names
        sql: "DECLARE a, b, c INT DEFAULT 0;"
      - id: type_of
        sql: "DECLARE v TYPE OF t.c;"
      - id: row_type_of_table
        sql: "DECLARE r ROW TYPE OF t;"
      - id: row_type_of_cursor
        sql: "DECLARE r ROW TYPE OF cur;"
    examples:
      - "DECLARE name VARCHAR(5) DEFAULT 'monty';"
      - "DECLARE x INT DEFAULT 10;"
      - "DECLARE Y SMALLINT;"

  - id: declare_condition
    name: DECLARE CONDITION
    doc: https://mariadb.com/docs/server/reference/sql-statements/programmatic-compound-statements/declare-condition
    tier: high
    probes:
      - id: sqlstate
        sql: "DECLARE cond CONDITION FOR SQLSTATE '45000';"
      - id: sqlstate_value
        sql: "DECLARE cond CONDITION FOR SQLSTATE VALUE '45000';"
      - id: error_code
        sql: "DECLARE cond CONDITION FOR 1051;"
