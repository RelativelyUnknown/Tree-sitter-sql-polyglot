dialect: snowflake
engine: Snowflake
version: "current (docs read 2026-10-04)"
source: https://docs.snowflake.com/en/sql-reference/sql-all

statements:
  - id: show_locks
    name: SHOW LOCKS
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-locks
    tier: medium
    probes:
      - id: basic
        sql: "SHOW LOCKS;"
      - id: in_account
        sql: "SHOW LOCKS IN ACCOUNT;"

  - id: show_masking_policies
    name: SHOW MASKING POLICIES
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-masking-policies
    tier: medium
    probes:
      - id: basic
        sql: "SHOW MASKING POLICIES;"
      - id: like
        sql: "SHOW MASKING POLICIES LIKE '%mask%';"
      - id: in_account
        sql: "SHOW MASKING POLICIES IN ACCOUNT;"
      - id: in_database
        sql: "SHOW MASKING POLICIES IN DATABASE db;"
      - id: in_schema
        sql: "SHOW MASKING POLICIES IN SCHEMA db.s;"
      - id: in_application
        sql: "SHOW MASKING POLICIES IN s APPLICATION app;"
      - id: in_application_package
        sql: "SHOW MASKING POLICIES IN APPLICATION PACKAGE pkg;"

  - id: show_materialized_views
    name: SHOW MATERIALIZED VIEWS
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-materialized-views
    tier: medium
    probes:
      - id: basic
        sql: "SHOW MATERIALIZED VIEWS;"
      - id: like
        sql: "SHOW MATERIALIZED VIEWS LIKE 'mv%';"
      - id: in_account
        sql: "SHOW MATERIALIZED VIEWS IN ACCOUNT;"
      - id: in_database
        sql: "SHOW MATERIALIZED VIEWS IN DATABASE db;"
      - id: in_schema
        sql: "SHOW MATERIALIZED VIEWS IN SCHEMA db.s;"
      - id: in_application
        sql: "SHOW MATERIALIZED VIEWS IN s APPLICATION app;"
      - id: in_application_package
        sql: "SHOW MATERIALIZED VIEWS IN APPLICATION PACKAGE pkg;"

  - id: show_network_policies
    name: SHOW NETWORK POLICIES
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-network-policies
    tier: medium
    probes:
      - id: basic
        sql: "SHOW NETWORK POLICIES;"

  - id: show_network_rules
    name: SHOW NETWORK RULES
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-network-rules
    tier: medium
    probes:
      - id: basic
        sql: "SHOW NETWORK RULES;"
      - id: like
        sql: "SHOW NETWORK RULES LIKE 'r%';"
      - id: in_account
        sql: "SHOW NETWORK RULES IN ACCOUNT;"
      - id: in_database
        sql: "SHOW NETWORK RULES IN DATABASE db;"
      - id: in_schema_name_only
        sql: "SHOW NETWORK RULES IN db.s;"
      - id: starts_with
        sql: "SHOW NETWORK RULES STARTS WITH 'r';"
      - id: limit_from
        sql: "SHOW NETWORK RULES LIMIT 10 FROM 'r';"

  - id: show_objects
    name: SHOW OBJECTS
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-objects
    tier: medium
    probes:
      - id: basic
        sql: "SHOW OBJECTS;"
      - id: terse
        sql: "SHOW TERSE OBJECTS;"
      - id: like
        sql: "SHOW OBJECTS LIKE '%t%';"
      - id: in_account
        sql: "SHOW OBJECTS IN ACCOUNT;"
      - id: in_database
        sql: "SHOW OBJECTS IN DATABASE db;"
      - id: in_schema
        sql: "SHOW OBJECTS IN SCHEMA db.s;"
      - id: in_application_package
        sql: "SHOW OBJECTS IN APPLICATION PACKAGE pkg;"
      - id: starts_with
        sql: "SHOW OBJECTS STARTS WITH 't';"
      - id: limit_from
        sql: "SHOW OBJECTS LIMIT 10 FROM 't';"

  - id: show_parameters
    name: SHOW PARAMETERS
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-parameters
    tier: medium
    probes:
      - id: basic
        sql: "SHOW PARAMETERS;"
      - id: like
        sql: "SHOW PARAMETERS LIKE 'query%';"
      - id: in_session
        sql: "SHOW PARAMETERS IN SESSION;"
      - id: in_account
        sql: "SHOW PARAMETERS IN ACCOUNT;"
      - id: for_user
        sql: "SHOW PARAMETERS FOR USER u;"
      - id: in_warehouse
        sql: "SHOW PARAMETERS IN WAREHOUSE w;"
      - id: in_database
        sql: "SHOW PARAMETERS IN DATABASE db;"
      - id: in_schema
        sql: "SHOW PARAMETERS IN SCHEMA s;"
      - id: in_task
        sql: "SHOW PARAMETERS IN TASK tk;"
      - id: in_table
        sql: "SHOW PARAMETERS IN TABLE t;"
      - id: like_in_session
        sql: "SHOW PARAMETERS LIKE 'timezone' IN SESSION;"

  - id: show_pipes
    name: SHOW PIPES
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-pipes
    tier: medium
    probes:
      - id: basic
        sql: "SHOW PIPES;"
      - id: like
        sql: "SHOW PIPES LIKE 'p%';"
      - id: in_account
        sql: "SHOW PIPES IN ACCOUNT;"
      - id: in_database
        sql: "SHOW PIPES IN DATABASE db;"
      - id: in_schema
        sql: "SHOW PIPES IN SCHEMA db.s;"
      - id: in_application
        sql: "SHOW PIPES IN s APPLICATION app;"
      - id: in_application_package
        sql: "SHOW PIPES IN APPLICATION PACKAGE pkg;"

  - id: show_primary_keys
    name: SHOW PRIMARY KEYS
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-primary-keys
    tier: medium
    probes:
      - id: basic
        sql: "SHOW PRIMARY KEYS;"
      - id: terse
        sql: "SHOW TERSE PRIMARY KEYS;"
      - id: in_account
        sql: "SHOW PRIMARY KEYS IN ACCOUNT;"
      - id: in_database
        sql: "SHOW PRIMARY KEYS IN DATABASE db;"
      - id: in_schema
        sql: "SHOW PRIMARY KEYS IN SCHEMA db.s;"
      - id: in_table
        sql: "SHOW PRIMARY KEYS IN TABLE t;"
      - id: in_table_name_only
        sql: "SHOW PRIMARY KEYS IN t;"

  - id: show_procedures
    name: SHOW PROCEDURES
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-procedures
    tier: medium
    probes:
      - id: basic
        sql: "SHOW PROCEDURES;"
      - id: like
        sql: "SHOW PROCEDURES LIKE 'p%';"
      - id: in_account
        sql: "SHOW PROCEDURES IN ACCOUNT;"
      - id: in_class
        sql: "SHOW PROCEDURES IN CLASS c;"
      - id: in_database
        sql: "SHOW PROCEDURES IN DATABASE db;"
      - id: in_schema
        sql: "SHOW PROCEDURES IN SCHEMA db.s;"
      - id: in_application
        sql: "SHOW PROCEDURES IN s APPLICATION app;"
      - id: in_application_package
        sql: "SHOW PROCEDURES IN APPLICATION PACKAGE pkg;"
