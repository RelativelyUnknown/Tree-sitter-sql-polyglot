dialect: redshift
engine: Amazon Redshift
version: "current"
source: https://docs.aws.amazon.com/redshift/latest/dg/c_SQL_commands.html

statements:
  - id: drop_function
    name: DROP FUNCTION
    doc: https://docs.aws.amazon.com/redshift/latest/dg/r_DROP_FUNCTION.html
    tier: high
    probes:
      - id: basic
        sql: "DROP FUNCTION f(int);"
      - id: arg_name
        sql: "DROP FUNCTION f(x int, y varchar);"
      - id: no_args
        sql: "DROP FUNCTION f();"
      - id: multiple_args
        sql: "DROP FUNCTION f(int, float, varchar);"
      - id: schema_qualified
        sql: "DROP FUNCTION s.f(int);"
      - id: cascade
        sql: "DROP FUNCTION f(int) CASCADE;"
      - id: restrict
        sql: "DROP FUNCTION f(int) RESTRICT;"
    examples:
      - "drop function f_sqrt(int);"
      - "drop function f_sqrt(int)cascade;"

  - id: drop_materialized_view
    name: DROP MATERIALIZED VIEW
    doc: https://docs.aws.amazon.com/redshift/latest/dg/materialized-view-drop-sql-command.html
    tier: high
    probes:
      - id: basic
        sql: "DROP MATERIALIZED VIEW mv;"
      - id: if_exists
        sql: "DROP MATERIALIZED VIEW IF EXISTS mv;"
      - id: schema_qualified
        sql: "DROP MATERIALIZED VIEW s.mv;"
      - id: multiple
        sql: "DROP MATERIALIZED VIEW mv1, mv2;"
      - id: cascade
        sql: "DROP MATERIALIZED VIEW mv CASCADE;"
      - id: restrict
        sql: "DROP MATERIALIZED VIEW mv RESTRICT;"
      - id: if_exists_multiple_cascade
        sql: "DROP MATERIALIZED VIEW IF EXISTS mv1, mv2 CASCADE;"
    examples:
      - "DROP MATERIALIZED VIEW tickets_mv;"
