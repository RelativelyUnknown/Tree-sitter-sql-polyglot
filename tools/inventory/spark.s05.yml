dialect: spark
engine: Apache Spark SQL
version: "4.x (docs/latest)"
source: https://spark.apache.org/docs/latest/sql-ref-syntax.html

statements:
  - id: drop_function
    name: DROP FUNCTION
    doc: https://spark.apache.org/docs/latest/sql-ref-syntax-ddl-drop-function.html
    tier: high
    probes:
      - id: basic
        sql: "DROP FUNCTION f;"
      - id: if_exists
        sql: "DROP FUNCTION IF EXISTS f;"
      - id: temporary
        sql: "DROP TEMPORARY FUNCTION f;"
      - id: temporary_if_exists
        sql: "DROP TEMPORARY FUNCTION IF EXISTS f;"
      - id: qualified_db
        sql: "DROP FUNCTION db.f;"
      - id: qualified_catalog_db
        sql: "DROP FUNCTION IF EXISTS cat.db.f;"
      - id: temporary_session_qualified
        sql: "DROP TEMPORARY FUNCTION session.f;"
    examples:
      - "DROP FUNCTION test_avg;"
      - "DROP TEMPORARY FUNCTION IF EXISTS test_avg;"

  - id: drop_table
    name: DROP TABLE
    doc: https://spark.apache.org/docs/latest/sql-ref-syntax-ddl-drop-table.html
    tier: high
    probes:
      - id: basic
        sql: "DROP TABLE t;"
      - id: if_exists
        sql: "DROP TABLE IF EXISTS t;"
      - id: qualified
        sql: "DROP TABLE db.t;"
      - id: purge
        sql: "DROP TABLE t PURGE;"
      - id: if_exists_purge
        sql: "DROP TABLE IF EXISTS db.t PURGE;"
    examples:
      - "DROP TABLE employeetable;"
      - "DROP TABLE userdb.employeetable;"
      - "DROP TABLE IF EXISTS employeetable;"
