dialect: spark
engine: Apache Spark SQL
version: "4.x (docs/latest)"
source: https://spark.apache.org/docs/latest/sql-ref-syntax.html

statements:
  - id: reset
    name: RESET
    doc: https://spark.apache.org/docs/latest/sql-ref-syntax-aux-conf-mgmt-reset.html
    tier: medium
    probes:
      - id: reset_all
        sql: "RESET;"
      - id: reset_key
        sql: "RESET spark.abc;"
    examples:
      - "RESET;"
      - "RESET spark.abc;"

  - id: set
    name: SET
    doc: https://spark.apache.org/docs/latest/sql-ref-syntax-aux-conf-mgmt-set.html
    tier: medium
    probes:
      - id: set_all
        sql: "SET;"
      - id: set_verbose
        sql: "SET -v;"
      - id: set_get_key
        sql: "SET spark.sql.variable.substitute;"
      - id: set_key_value
        sql: "SET spark.sql.variable.substitute = false;"
    examples:
      - "SET spark.sql.variable.substitute=false;"
      - "SET -v;"
      - "SET;"

  - id: show_columns
    name: SHOW COLUMNS
    doc: https://spark.apache.org/docs/latest/sql-ref-syntax-aux-show-columns.html
    tier: medium
    probes:
      - id: in_table
        sql: "SHOW COLUMNS IN t;"
      - id: from_table
        sql: "SHOW COLUMNS FROM t;"
      - id: qualified_table
        sql: "SHOW COLUMNS IN db.t;"
      - id: in_table_in_database
        sql: "SHOW COLUMNS IN t IN db;"
      - id: from_table_from_database
        sql: "SHOW COLUMNS FROM t FROM db;"
    examples:
      - "SHOW COLUMNS IN customer;"
      - "SHOW COLUMNS IN salesdb.customer;"
      - "SHOW COLUMNS IN customer IN salesdb;"

  - id: show_create_table
    name: SHOW CREATE TABLE
    doc: https://spark.apache.org/docs/latest/sql-ref-syntax-aux-show-create-table.html
    tier: medium
    probes:
      - id: basic
        sql: "SHOW CREATE TABLE t;"
      - id: qualified
        sql: "SHOW CREATE TABLE db.t;"
      - id: as_serde
        sql: "SHOW CREATE TABLE t AS SERDE;"
    examples:
      - "SHOW CREATE TABLE test;"
      - "SHOW CREATE TABLE test AS SERDE;"

  - id: show_databases
    name: SHOW DATABASES
    doc: https://spark.apache.org/docs/latest/sql-ref-syntax-aux-show-databases.html
    tier: medium
    probes:
      - id: databases
        sql: "SHOW DATABASES;"
      - id: schemas
        sql: "SHOW SCHEMAS;"
      - id: databases_like
        sql: "SHOW DATABASES LIKE 'pay*';"
      - id: schemas_like
        sql: "SHOW SCHEMAS LIKE 'pay*';"
    examples:
      - "SHOW DATABASES;"
      - "SHOW DATABASES LIKE 'pay*';"
      - "SHOW SCHEMAS;"

  - id: show_functions
    name: SHOW FUNCTIONS
    doc: https://spark.apache.org/docs/latest/sql-ref-syntax-aux-show-functions.html
    tier: medium
    probes:
      - id: basic
        sql: "SHOW FUNCTIONS;"
      - id: function_name
        sql: "SHOW FUNCTIONS trim;"
      - id: function_kind
        sql: "SHOW SYSTEM FUNCTIONS;"
      - id: user_kind
        sql: "SHOW USER FUNCTIONS;"
      - id: all_kind
        sql: "SHOW ALL FUNCTIONS;"
      - id: from_database
        sql: "SHOW FUNCTIONS FROM db;"
      - id: in_database
        sql: "SHOW FUNCTIONS IN db;"
      - id: like
        sql: "SHOW FUNCTIONS LIKE 't*';"
      - id: kind_from_like
        sql: "SHOW SYSTEM FUNCTIONS FROM db LIKE 'max';"
    examples:
      - "SHOW FUNCTIONS trim;"
      - "SHOW SYSTEM FUNCTIONS concat;"
      - "SHOW SYSTEM FUNCTIONS FROM salesdb LIKE 'max';"

  - id: show_partitions
    name: SHOW PARTITIONS
    doc: https://spark.apache.org/docs/latest/sql-ref-syntax-aux-show-partitions.html
    tier: medium
    probes:
      - id: basic
        sql: "SHOW PARTITIONS t;"
      - id: qualified
        sql: "SHOW PARTITIONS db.t;"
      - id: partition_spec
        sql: "SHOW PARTITIONS t PARTITION (state = 'CA', city = 'Fremont');"
      - id: partial_partition_spec
        sql: "SHOW PARTITIONS t PARTITION (state = 'CA');"
    examples:
      - "SHOW PARTITIONS customer;"
      - "SHOW PARTITIONS salesdb.customer;"
      - "SHOW PARTITIONS customer PARTITION (state = 'CA', city = 'Fremont');"

  - id: show_table_extended
    name: SHOW TABLE EXTENDED
    doc: https://spark.apache.org/docs/latest/sql-ref-syntax-aux-show-table.html
    tier: medium
    probes:
      - id: like
        sql: "SHOW TABLE EXTENDED LIKE 'employee';"
      - id: in_database
        sql: "SHOW TABLE EXTENDED IN db LIKE 'employee';"
      - id: from_database
        sql: "SHOW TABLE EXTENDED FROM db LIKE 'employee';"
      - id: partition_spec
        sql: "SHOW TABLE EXTENDED IN db LIKE 'employee' PARTITION (grade = 1);"
    examples:
      - "SHOW TABLE EXTENDED LIKE 'employee';"
      - "SHOW TABLE EXTENDED LIKE 'employe*';"
      - "SHOW TABLE EXTENDED IN default LIKE 'employee' PARTITION (grade = 1);"

  - id: show_tables
    name: SHOW TABLES
    doc: https://spark.apache.org/docs/latest/sql-ref-syntax-aux-show-tables.html
    tier: medium
    probes:
      - id: basic
        sql: "SHOW TABLES;"
      - id: from_database
        sql: "SHOW TABLES FROM db;"
      - id: in_database
        sql: "SHOW TABLES IN db;"
      - id: like
        sql: "SHOW TABLES LIKE 'sam*|suj';"
      - id: from_database_like
        sql: "SHOW TABLES FROM db LIKE 'sam*';"
    examples:
      - "SHOW TABLES;"
      - "SHOW TABLES FROM userdb;"
      - "SHOW TABLES IN userdb;"

  - id: show_tblproperties
    name: SHOW TBLPROPERTIES
    doc: https://spark.apache.org/docs/latest/sql-ref-syntax-aux-show-tblproperties.html
    tier: medium
    probes:
      - id: basic
        sql: "SHOW TBLPROPERTIES t;"
      - id: qualified
        sql: "SHOW TBLPROPERTIES db.t;"
      - id: unquoted_key
        sql: "SHOW TBLPROPERTIES t (created.by.user);"
      - id: string_key
        sql: "SHOW TBLPROPERTIES t ('created.date');"
    examples:
      - "SHOW TBLPROPERTIES customer;"
      - "SHOW TBLPROPERTIES salesdb.customer;"
      - "SHOW TBLPROPERTIES customer (created.by.user);"
