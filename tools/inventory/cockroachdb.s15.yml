dialect: cockroachdb
engine: CockroachDB
version: "v26.3 (stable)"
source: https://www.cockroachlabs.com/docs/stable/sql-statements

statements:
  - id: commit
    name: COMMIT
    doc: https://www.cockroachlabs.com/docs/stable/commit-transaction
    tier: high
    probes:
      - { id: basic, sql: "COMMIT;" }
      - { id: commit_transaction, sql: "COMMIT TRANSACTION;" }
      - { id: end_alias, sql: "END;" }
      - { id: end_transaction, sql: "END TRANSACTION;" }
    examples:
      - "COMMIT;"

  - id: savepoint
    name: SAVEPOINT
    doc: https://www.cockroachlabs.com/docs/stable/savepoint
    tier: high
    probes:
      - { id: basic, sql: "SAVEPOINT foo;" }
      - { id: retry_savepoint, sql: "SAVEPOINT cockroach_restart;" }
      - { id: quoted_name, sql: "SAVEPOINT \"Foo\";" }
    examples:
      - "SAVEPOINT foo;"
      - "SAVEPOINT cockroach_restart;"
