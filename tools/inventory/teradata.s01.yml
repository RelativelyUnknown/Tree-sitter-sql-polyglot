        sql: "CREATE TABLE t (a INTEGER, b INTEGER) PRIMARY INDEX (a) PARTITION BY CASE_N(b < 10, b < 100, NO CASE, UNKNOWN);"
      - id: partition_by_multilevel
        sql: "CREATE TABLE t (a INTEGER, b INTEGER, d DATE) PRIMARY INDEX (a) PARTITION BY (RANGE_N(b BETWEEN 1 AND 10 EACH 1), CASE_N(b < 10, b < 100));"
