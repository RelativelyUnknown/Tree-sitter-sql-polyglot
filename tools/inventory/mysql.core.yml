dialect: mysql
engine: MySQL
version: "8.4"
source: https://dev.mysql.com/doc/refman/8.4/en/sql-statements.html

statements:
  - id: select
    name: SELECT
    doc: https://dev.mysql.com/doc/refman/8.4/en/select.html
    tier: high
    probes:
      - { id: no_from, sql: "SELECT 1 + 1;" }
      - { id: from_dual, sql: "SELECT 1 + 1 FROM DUAL;" }
      - { id: star, sql: "SELECT * FROM t;" }
      - { id: qualified_star, sql: "SELECT t.*, c FROM t;" }
      - { id: alias_as, sql: "SELECT c AS a FROM t;" }
      - { id: alias_no_as, sql: "SELECT c a FROM t;" }
      - { id: table_alias, sql: "SELECT x.c FROM t AS x, t2 y WHERE x.c = y.c;" }
      - { id: all, sql: "SELECT ALL c FROM t;" }
      - { id: distinct, sql: "SELECT DISTINCT c FROM t;" }
      - { id: distinctrow, sql: "SELECT DISTINCTROW c FROM t;" }
      - { id: high_priority, sql: "SELECT HIGH_PRIORITY c FROM t;" }
      - { id: straight_join_modifier, sql: "SELECT STRAIGHT_JOIN c FROM t, t2;" }
      - { id: sql_small_result, sql: "SELECT SQL_SMALL_RESULT c FROM t GROUP BY c;" }
      - { id: sql_big_result, sql: "SELECT SQL_BIG_RESULT c FROM t GROUP BY c;" }
      - { id: sql_buffer_result, sql: "SELECT SQL_BUFFER_RESULT c FROM t;" }
      - { id: sql_no_cache, sql: "SELECT SQL_NO_CACHE c FROM t;" }
      - { id: sql_calc_found_rows, sql: "SELECT SQL_CALC_FOUND_ROWS c FROM t LIMIT 10;" }
      - { id: combined_modifiers, sql: "SELECT DISTINCT HIGH_PRIORITY STRAIGHT_JOIN SQL_SMALL_RESULT SQL_BUFFER_RESULT SQL_CALC_FOUND_ROWS c FROM t;" }
      - { id: partition, sql: "SELECT * FROM t PARTITION (p0, p1);" }
      - { id: where, sql: "SELECT c FROM t WHERE c > 0;" }
      - { id: group_by, sql: "SELECT c, COUNT(*) FROM t GROUP BY c;" }
      - { id: group_by_position, sql: "SELECT c, COUNT(*) FROM t GROUP BY 1;" }
      - { id: group_by_with_rollup, sql: "SELECT a, b, SUM(c) FROM t GROUP BY a, b WITH ROLLUP;" }
      - { id: group_by_rollup_function, sql: "SELECT a, b, SUM(c) FROM t GROUP BY ROLLUP (a, b);" }
      - { id: having, sql: "SELECT c, COUNT(*) FROM t GROUP BY c HAVING COUNT(*) > 1;" }
      - { id: having_without_group_by, sql: "SELECT c FROM t HAVING c > 0;" }
      - { id: window_clause, sql: "SELECT SUM(c) OVER w FROM t WINDOW w AS (PARTITION BY a ORDER BY b);" }
      - { id: window_clause_multiple, sql: "SELECT SUM(c) OVER w1, AVG(c) OVER w2 FROM t WINDOW w1 AS (PARTITION BY a), w2 AS (w1 ORDER BY b);" }
      - { id: order_by, sql: "SELECT c FROM t ORDER BY c;" }
      - { id: order_by_asc_desc, sql: "SELECT a, b FROM t ORDER BY a ASC, b DESC;" }
      - { id: order_by_position, sql: "SELECT a, b FROM t ORDER BY 2, 1;" }
      - { id: order_by_with_rollup, sql: "SELECT a, SUM(c) FROM t GROUP BY a ORDER BY a WITH ROLLUP;", note: "From the syntax block: [ORDER BY {col_name | expr | position} [ASC | DESC], ... [WITH ROLLUP]]" }
      - { id: limit, sql: "SELECT c FROM t LIMIT 5;" }
      - { id: limit_offset_comma, sql: "SELECT c FROM t LIMIT 5, 10;" }
      - { id: limit_offset_keyword, sql: "SELECT c FROM t LIMIT 10 OFFSET 5;" }
      - { id: into_vars_after_select_list, sql: "SELECT c, d INTO @x, @y FROM t LIMIT 1;" }
      - { id: into_vars_before_locking, sql: "SELECT c FROM t LIMIT 1 INTO @x;" }
      - { id: into_vars_after_locking, sql: "SELECT c FROM t LIMIT 1 FOR UPDATE INTO @x;" }
      - { id: into_outfile, sql: "SELECT * FROM t INTO OUTFILE '/tmp/t.txt';" }
      - id: into_outfile_options
        sql: |-
          SELECT * FROM t INTO OUTFILE '/tmp/t.txt' CHARACTER SET utf8mb4 FIELDS TERMINATED BY ',' OPTIONALLY ENCLOSED BY '"' ESCAPED BY '\\' LINES STARTING BY '>' TERMINATED BY '\n';
      - { id: into_outfile_columns, sql: "SELECT * FROM t INTO OUTFILE '/tmp/t.txt' COLUMNS TERMINATED BY ',' ENCLOSED BY '\"';" }
      - { id: into_dumpfile, sql: "SELECT c FROM t LIMIT 1 INTO DUMPFILE '/tmp/c.bin';" }
      - { id: for_update, sql: "SELECT c FROM t WHERE c = 1 FOR UPDATE;" }
      - { id: for_share, sql: "SELECT c FROM t WHERE c = 1 FOR SHARE;" }
      - { id: for_update_of, sql: "SELECT * FROM t, t2 FOR UPDATE OF t;" }
      - { id: for_share_of_multiple, sql: "SELECT * FROM t, t2, t3 FOR SHARE OF t, t2;" }
      - { id: for_update_nowait, sql: "SELECT c FROM t FOR UPDATE NOWAIT;" }
      - { id: for_share_skip_locked, sql: "SELECT c FROM t FOR SHARE SKIP LOCKED;" }
      - { id: multiple_locking_clauses, sql: "SELECT * FROM t1, t2 FOR SHARE OF t1 FOR UPDATE OF t2 NOWAIT;" }
      - { id: lock_in_share_mode, sql: "SELECT c FROM t LOCK IN SHARE MODE;" }
      - { id: full_clause_order, sql: "SELECT DISTINCT a, SUM(b) OVER w AS s FROM t PARTITION (p0) WHERE a > 0 GROUP BY a, b HAVING SUM(b) > 1 WINDOW w AS (ORDER BY a) ORDER BY a DESC LIMIT 1, 10 FOR UPDATE SKIP LOCKED;" }
    examples:
      - "SELECT 1 + 1 FROM DUAL;"
      - |-
        SELECT CONCAT(last_name,', ',first_name) AS full_name
          FROM mytable ORDER BY full_name;
      - |-
        SELECT college, region AS r, seed AS s FROM tournament
          ORDER BY r, s;
      - |-
        SELECT user, MAX(salary) FROM users
          GROUP BY user HAVING MAX(salary) > 10;
      - "SELECT * FROM t1, t2 FOR SHARE OF t1 FOR UPDATE OF t2;"

  - id: select_into
    name: SELECT ... INTO
    doc: https://dev.mysql.com/doc/refman/8.4/en/select-into.html
    tier: high
    probes:
      - { id: into_before_from, sql: "SELECT c INTO @x FROM t LIMIT 1;" }
      - { id: into_before_locking_clause, sql: "SELECT c FROM t LIMIT 1 INTO @x FOR UPDATE;", note: "Documented position, deprecated but still accepted in 8.4" }
      - { id: into_at_end, sql: "SELECT c FROM t LIMIT 1 FOR UPDATE INTO @x;" }
      - { id: into_var_list, sql: "SELECT a, b INTO @x, @y FROM t LIMIT 1;" }
      - { id: table_statement_into, sql: "TABLE t ORDER BY c LIMIT 1 INTO @x, @y;" }
      - { id: values_derived_into, sql: "SELECT * FROM (VALUES ROW(1,2,3)) AS t(a,b,c) INTO @x, @y, @z;" }
      - id: into_outfile_before_from
        sql: |-
          SELECT a, b INTO OUTFILE '/tmp/result.txt' FIELDS TERMINATED BY ',' OPTIONALLY ENCLOSED BY '"' LINES TERMINATED BY '\n' FROM t;
      - { id: table_statement_into_outfile, sql: "TABLE t ORDER BY c LIMIT 1000 INTO OUTFILE '/tmp/t.txt';" }
      - { id: into_dumpfile, sql: "SELECT c INTO DUMPFILE '/tmp/c.bin' FROM t LIMIT 1;" }
    examples:
      - "SELECT * INTO @myvar FROM t1;"
      - "SELECT * FROM t1 INTO @myvar FOR UPDATE;"
      - "SELECT * FROM t1 FOR UPDATE INTO @myvar;"
      - "SELECT id, data INTO @x, @y FROM test.t1 LIMIT 1;"
      - |-
        SELECT a,b,a+b INTO OUTFILE '/tmp/result.txt'
          FIELDS TERMINATED BY ',' OPTIONALLY ENCLOSED BY '"'
          LINES TERMINATED BY '\n'
          FROM test_table;

  - id: join
    name: JOIN clause
    doc: https://dev.mysql.com/doc/refman/8.4/en/join.html
    tier: high
    probes:
      - { id: comma_join, sql: "SELECT * FROM t1, t2 WHERE t1.a = t2.a;" }
      - { id: inner_join_on, sql: "SELECT * FROM t1 INNER JOIN t2 ON t1.a = t2.a;" }
      - { id: join_on, sql: "SELECT * FROM t1 JOIN t2 ON t1.a = t2.a;" }
      - { id: join_without_condition, sql: "SELECT * FROM t1 JOIN t2;" }
      - { id: cross_join, sql: "SELECT * FROM t1 CROSS JOIN t2;" }
      - { id: cross_join_on, sql: "SELECT * FROM t1 CROSS JOIN t2 ON t1.a = t2.a;", note: "joined_table: table_reference {[INNER | CROSS] JOIN | STRAIGHT_JOIN} table_factor [join_specification]" }
      - { id: inner_join_using, sql: "SELECT * FROM t1 INNER JOIN t2 USING (a, b);" }
      - { id: straight_join, sql: "SELECT * FROM t1 STRAIGHT_JOIN t2;" }
      - { id: straight_join_on, sql: "SELECT * FROM t1 STRAIGHT_JOIN t2 ON t1.a = t2.a;" }
      - { id: left_join, sql: "SELECT * FROM t1 LEFT JOIN t2 ON t1.a = t2.a;" }
      - { id: left_outer_join, sql: "SELECT * FROM t1 LEFT OUTER JOIN t2 ON t1.a = t2.a;" }
      - { id: right_join, sql: "SELECT * FROM t1 RIGHT JOIN t2 ON t1.a = t2.a;" }
      - { id: right_outer_join_using, sql: "SELECT * FROM t1 RIGHT OUTER JOIN t2 USING (a);" }
      - { id: natural_join, sql: "SELECT * FROM t1 NATURAL JOIN t2;" }
      - { id: natural_inner_join, sql: "SELECT * FROM t1 NATURAL INNER JOIN t2;" }
      - { id: natural_left_join, sql: "SELECT * FROM t1 NATURAL LEFT JOIN t2;" }
      - { id: natural_left_outer_join, sql: "SELECT * FROM t1 NATURAL LEFT OUTER JOIN t2;" }
      - { id: natural_right_join, sql: "SELECT * FROM t1 NATURAL RIGHT JOIN t2;" }
      - { id: chained_joins, sql: "SELECT * FROM t1 LEFT JOIN t2 ON t1.a = t2.a LEFT JOIN t3 ON t2.a = t3.a;" }
      - { id: nested_join_list, sql: "SELECT * FROM t1 LEFT JOIN (t2, t3, t4) ON (t2.a = t1.a AND t3.b = t1.b AND t4.c = t1.c);" }
      - { id: nested_join_parenthesized, sql: "SELECT * FROM t1 LEFT JOIN (t2 CROSS JOIN t3) ON (t2.a = t1.a AND t3.b = t1.b);" }
      - { id: parenthesized_table_references, sql: "SELECT * FROM (t1, t2) JOIN t3 ON (t1.a = t3.a);" }
      - { id: odbc_oj_escape, sql: "SELECT * FROM { OJ t1 LEFT OUTER JOIN t2 ON t1.a = t2.a };" }
      - { id: derived_table, sql: "SELECT * FROM (SELECT 1, 2, 3) AS t1;" }
      - { id: derived_table_no_as, sql: "SELECT * FROM (SELECT 1 AS a) t1;" }
      - { id: derived_table_column_list, sql: "SELECT * FROM (SELECT 1, 2) AS t1 (a, b);" }
      - { id: lateral_derived_table, sql: "SELECT * FROM t1, LATERAL (SELECT t2.c FROM t2 WHERE t2.a = t1.a) AS dt;" }
      - { id: partition_in_join, sql: "SELECT * FROM t1 PARTITION (p0) AS x JOIN t2 PARTITION (p1, p2) AS y ON x.a = y.a;" }
    examples:
      - |-
        SELECT t1.name, t2.salary
          FROM employee AS t1 INNER JOIN info AS t2 ON t1.name = t2.name;
      - |-
        SELECT left_tbl.*
          FROM left_tbl LEFT JOIN right_tbl ON left_tbl.id = right_tbl.id
          WHERE right_tbl.id IS NULL;
      - |-
        SELECT left_tbl.*
            FROM { OJ left_tbl LEFT OUTER JOIN right_tbl
                   ON left_tbl.id = right_tbl.id }
            WHERE right_tbl.id IS NULL;
      - |-
        SELECT * FROM table1 LEFT JOIN table2 ON table1.id = table2.id
          LEFT JOIN table3 ON table2.id = table3.id;
      - "SELECT * FROM t1, t2 JOIN t3 ON (t1.i1 = t3.i3);"

  - id: index_hints
    name: Index hints
    doc: https://dev.mysql.com/doc/refman/8.4/en/index-hints.html
    tier: high
    probes:
      - { id: use_index, sql: "SELECT * FROM t USE INDEX (i1, i2) WHERE a = 1;" }
      - { id: use_key, sql: "SELECT * FROM t USE KEY (i1);" }
      - { id: use_index_empty, sql: "SELECT * FROM t USE INDEX ();" }
      - { id: ignore_index, sql: "SELECT * FROM t IGNORE INDEX (i1);" }
      - { id: force_index, sql: "SELECT * FROM t FORCE INDEX (i1);" }
      - { id: force_key, sql: "SELECT * FROM t FORCE KEY (i1);" }
      - { id: for_join, sql: "SELECT * FROM t USE INDEX FOR JOIN (i1);" }
      - { id: for_order_by, sql: "SELECT * FROM t IGNORE INDEX FOR ORDER BY (i1) ORDER BY a;" }
      - { id: for_group_by, sql: "SELECT a FROM t FORCE INDEX FOR GROUP BY (i1) GROUP BY a;" }
      - { id: hint_list, sql: "SELECT * FROM t USE INDEX (i1) IGNORE INDEX FOR ORDER BY (i2) ORDER BY a;" }
      - { id: with_alias, sql: "SELECT * FROM t AS x FORCE INDEX (i1) JOIN t2 y USE INDEX (i2) ON x.a = y.a;" }
      - { id: in_delete_multi_table, sql: "DELETE t.* FROM t USE INDEX (i1) WHERE a BETWEEN 1 AND 100;" }
      - { id: in_update, sql: "UPDATE t FORCE INDEX (i1) SET a = 1 WHERE b = 2;" , note: "UPDATE table_references accept index hints (update.html: table_references as in SELECT)" }
    examples:
      - |-
        SELECT * FROM table1 USE INDEX (col1_index,col2_index)
          WHERE col1=1 AND col2=2 AND col3=3;
      - "SELECT * FROM t1 USE INDEX (i1) IGNORE INDEX FOR ORDER BY (i2) ORDER BY a;"
      - "SELECT * FROM t1 USE INDEX FOR JOIN (i1) FORCE INDEX FOR JOIN (i2);"
      - |-
        SELECT * FROM t1
          USE INDEX () IGNORE INDEX (i2) USE INDEX (i1) USE INDEX (i2);
      - "SELECT * FROM t1 USE INDEX (i1) USE INDEX (i1,i1);"

  - id: optimizer_hints
    name: Optimizer hints
    doc: https://dev.mysql.com/doc/refman/8.4/en/optimizer-hints.html
    tier: medium
    probes:
      - { id: select_hint, sql: "SELECT /*+ BKA(t1) NO_BKA(t2) */ * FROM t1 INNER JOIN t2 ON t1.a = t2.a;" }
      - { id: index_level_hint, sql: "SELECT /*+ NO_RANGE_OPTIMIZATION(t PRIMARY, i1) */ c FROM t WHERE c > 30;" }
      - { id: query_block_name, sql: "SELECT /*+ QB_NAME(qb1) */ c FROM t;" }
      - { id: table_at_query_block, sql: "SELECT /*+ JOIN_ORDER(t4@subq1, t3) */ COUNT(*) FROM t3 WHERE t3.a IN (SELECT /*+ QB_NAME(subq1) */ a FROM t4);" }
      - { id: max_execution_time, sql: "SELECT /*+ MAX_EXECUTION_TIME(1000) */ * FROM t;" }
      - { id: set_var, sql: "SELECT /*+ SET_VAR(sort_buffer_size = 16M) */ c FROM t ORDER BY c;" }
      - { id: insert_hint, sql: "INSERT /*+ SET_VAR(foreign_key_checks=OFF) */ INTO t VALUES (2);" }
      - { id: replace_hint, sql: "REPLACE /*+ NO_ICP(t) */ INTO t VALUES (2);" }
      - { id: update_hint, sql: "UPDATE /*+ NO_MERGE(t) */ t SET c = 1;" }
      - { id: delete_hint, sql: "DELETE /*+ MAX_EXECUTION_TIME(1000) */ FROM t WHERE c = 1;" }
      - { id: subquery_hint, sql: "SELECT * FROM t WHERE a IN (SELECT /*+ SUBQUERY(MATERIALIZATION) */ a FROM t2);" }
    examples:
      - |-
        SELECT /*+ NO_RANGE_OPTIMIZATION(t3 PRIMARY, f2_idx) */ f1
          FROM t3 WHERE f1 > 30 AND f1 < 33;
      - "SELECT /*+ MERGE(dt) */ * FROM (SELECT * FROM t1) AS dt;"
      - "INSERT /*+ SET_VAR(foreign_key_checks=OFF) */ INTO t2 VALUES(2);"
      - |-
        SELECT
        /*+ JOIN_PREFIX(t2, t5@subq2, t4@subq1)
            JOIN_ORDER(t4@subq1, t3)
            JOIN_SUFFIX(t1) */
        COUNT(*) FROM t1 JOIN t2 JOIN t3
                   WHERE t1.f1 IN (SELECT /*+ QB_NAME(subq1) */ f1 FROM t4)
                     AND t2.f1 IN (SELECT /*+ QB_NAME(subq2) */ f1 FROM t5);
      - "SELECT /*+ NO_BNL() BKA(t1) */ t1.* FROM t1 INNER JOIN t2 INNER JOIN t3;"

  - id: set_operations
    name: Set Operations with UNION, INTERSECT, and EXCEPT
    doc: https://dev.mysql.com/doc/refman/8.4/en/set-operations.html
    tier: high
    probes:
      - { id: select_union_select, sql: "SELECT a FROM t1 UNION SELECT a FROM t2;" }
      - { id: table_union_select, sql: "TABLE t1 UNION SELECT * FROM t2;" }
      - { id: values_union_table, sql: "VALUES ROW(4,-2), ROW(5,9) UNION TABLE t2;" }
      - { id: select_union_values, sql: "SELECT * FROM t1 UNION VALUES ROW(4,-2), ROW(5,9);" }
      - { id: parenthesized_blocks_order_limit, sql: "(SELECT a FROM t1 WHERE a = 10 ORDER BY a LIMIT 10) UNION (SELECT a FROM t2 WHERE a = 11 ORDER BY a LIMIT 10);" }
      - { id: trailing_order_limit, sql: "SELECT a FROM t1 EXCEPT SELECT a FROM t2 ORDER BY a LIMIT 10;" }
      - { id: parenthesized_with_trailing_order, sql: "(SELECT a FROM t1) EXCEPT (SELECT a FROM t2) ORDER BY a LIMIT 10;" }
      - { id: nested_parentheses, sql: "TABLE r EXCEPT (TABLE s INTERSECT TABLE t);" }
      - { id: mixed_precedence, sql: "TABLE r EXCEPT TABLE s INTERSECT TABLE t;" }
      - { id: with_clause_body, sql: "WITH cte AS (SELECT 1 AS a) SELECT a FROM cte UNION SELECT a FROM t;" }
      - { id: into_after_union, sql: "SELECT a FROM t1 UNION SELECT a FROM t2 INTO OUTFILE '/tmp/u.txt';" }
      - { id: derived_table_column_list_union, sql: "SELECT * FROM (TABLE t2) AS t(x, y) UNION TABLE t1;" }
    examples:
      - |-
        (SELECT a FROM t1 WHERE a=10 AND b=1 ORDER BY a LIMIT 10)
        UNION
        (SELECT a FROM t2 WHERE a=11 AND b=2 ORDER BY a LIMIT 10);
      - |-
        (TABLE t1 ORDER BY x LIMIT 10) 
        INTERSECT 
        (TABLE t2 ORDER BY a LIMIT 10);
      - |-
        SELECT a FROM t1
        EXCEPT
        SELECT a FROM t2 WHERE a=11 AND b=2
        ORDER BY a LIMIT 10;
      - "VALUES ROW(4,-2), ROW(5,9) UNION VALUES ROW(4,-2),ROW(5,9);"
      - |-
        (TABLE t1 ORDER BY a LIMIT 10) 
        UNION 
        TABLE t2 
        ORDER BY a LIMIT 10;

  - id: union
    name: UNION clause
    doc: https://dev.mysql.com/doc/refman/8.4/en/union.html
    tier: high
    probes:
      - { id: union, sql: "SELECT a FROM t1 UNION SELECT a FROM t2;" }
      - { id: union_all, sql: "SELECT a FROM t1 UNION ALL SELECT a FROM t2;" }
      - { id: union_distinct, sql: "SELECT a FROM t1 UNION DISTINCT SELECT a FROM t2;" }
      - { id: union_chain, sql: "SELECT 1 UNION ALL SELECT 2 UNION DISTINCT SELECT 3;" }
    examples:
      - "SELECT 1, 2 UNION SELECT 'a', 'b';"

  - id: intersect
    name: INTERSECT clause
    doc: https://dev.mysql.com/doc/refman/8.4/en/intersect.html
    tier: high
    probes:
      - { id: intersect, sql: "TABLE a INTERSECT TABLE b;" }
      - { id: intersect_all, sql: "SELECT m FROM a INTERSECT ALL SELECT m FROM b;" }
      - { id: intersect_distinct, sql: "SELECT m FROM a INTERSECT DISTINCT SELECT m FROM b;" }
    examples:
      - "TABLE a INTERSECT TABLE b;"
      - "TABLE c INTERSECT DISTINCT TABLE c;"
      - "TABLE c INTERSECT ALL TABLE c;"
      - "TABLE r EXCEPT TABLE s INTERSECT TABLE t;"
      - "TABLE r EXCEPT (TABLE s INTERSECT TABLE t);"

  - id: except
    name: EXCEPT clause
    doc: https://dev.mysql.com/doc/refman/8.4/en/except.html
    tier: high
    probes:
      - { id: except, sql: "TABLE a EXCEPT TABLE b;" }
      - { id: except_all, sql: "SELECT m FROM a EXCEPT ALL SELECT m FROM b;" }
      - { id: except_distinct, sql: "SELECT m FROM a EXCEPT DISTINCT SELECT m FROM b;" }
    examples:
      - "TABLE a EXCEPT TABLE b;"
      - "TABLE c EXCEPT DISTINCT TABLE a;"
      - "TABLE c EXCEPT ALL TABLE a;"

  - id: parenthesized_query_expressions
    name: Parenthesized Query Expressions
    doc: https://dev.mysql.com/doc/refman/8.4/en/parenthesized-query-expressions.html
    tier: high
    probes:
      - { id: parenthesized_select, sql: "(SELECT 1);" }
      - { id: parenthesized_union_limit, sql: "(SELECT 1 AS r UNION SELECT 2) LIMIT 1 OFFSET 1;" }
      - { id: parenthesized_order_limit, sql: "(SELECT 1 AS r UNION SELECT 2) ORDER BY r DESC LIMIT 1;" }
      - { id: inner_and_outer_limit, sql: "(SELECT 'a' UNION SELECT 'b' LIMIT 2) LIMIT 3;" }
      - { id: parenthesized_into, sql: "(SELECT 1 AS r UNION SELECT 2) ORDER BY r LIMIT 1 INTO @v;" }
      - { id: parenthesized_table_order, sql: "(TABLE t1 ORDER BY a) UNION (TABLE t2 ORDER BY b) ORDER BY a;" }
      - { id: parenthesized_values_limit, sql: "(VALUES ROW(1), ROW(2) LIMIT 2) EXCEPT (SELECT 2 LIMIT 1);" }
      - { id: nested_parentheses, sql: "((SELECT 1) UNION (SELECT 2));" }
    examples:
      - "(SELECT 1);"
      - "(SELECT * FROM INFORMATION_SCHEMA.SCHEMATA WHERE SCHEMA_NAME = 'mysql');"
      - "SELECT a FROM t1 EXCEPT (SELECT b FROM t2 INTERSECT SELECT c FROM t3);"
      - "(SELECT 1 LIMIT 1) UNION (SELECT 2 LIMIT 1) LIMIT 1;"
      - "VALUES ROW(1), ROW(2) INTERSECT VALUES ROW(2), ROW(1) LIMIT 1;"

  - id: with
    name: WITH (Common Table Expressions)
    doc: https://dev.mysql.com/doc/refman/8.4/en/with.html
    tier: high
    probes:
      - { id: single_cte, sql: "WITH cte AS (SELECT a FROM t) SELECT a FROM cte;" }
      - { id: multiple_ctes, sql: "WITH c1 AS (SELECT a FROM t1), c2 AS (SELECT b FROM t2) SELECT a, b FROM c1 JOIN c2 ON c1.a = c2.b;" }
      - { id: column_list, sql: "WITH cte (c1, c2) AS (SELECT 1, 2 UNION ALL SELECT 3, 4) SELECT c1, c2 FROM cte;" }
      - { id: recursive, sql: "WITH RECURSIVE cte (n) AS (SELECT 1 UNION ALL SELECT n + 1 FROM cte WHERE n < 5) SELECT * FROM cte;" }
      - { id: recursive_with_limit, sql: "WITH RECURSIVE cte (n) AS (SELECT 1 UNION ALL SELECT n + 1 FROM cte LIMIT 100) SELECT * FROM cte;" }
      - { id: with_update, sql: "WITH cte AS (SELECT a FROM t2) UPDATE t, cte SET t.b = 1 WHERE t.a = cte.a;" }
      - { id: with_delete, sql: "WITH cte AS (SELECT a FROM t2) DELETE t FROM t JOIN cte ON t.a = cte.a;" }
      - { id: in_subquery, sql: "SELECT * FROM t WHERE a IN (WITH cte AS (SELECT a FROM t2) SELECT a FROM cte);" }
      - { id: in_derived_table, sql: "SELECT * FROM (WITH cte AS (SELECT 1 AS a) SELECT a FROM cte) AS dt;" }
      - { id: insert_with_select, sql: "INSERT INTO t (a) WITH cte AS (SELECT 1 AS a) SELECT a FROM cte;" }
      - { id: create_table_with_select, sql: "CREATE TABLE t2 WITH cte AS (SELECT 1 AS a) SELECT a FROM cte;" }
      - { id: create_view_with_select, sql: "CREATE VIEW v AS WITH cte AS (SELECT 1 AS a) SELECT a FROM cte;" }
      - { id: explain_with_select, sql: "EXPLAIN WITH cte AS (SELECT 1 AS a) SELECT a FROM cte;" }
      - { id: with_table_statement, sql: "WITH cte AS (SELECT 1 AS a) TABLE cte;", note: "query_expression: [with_clause] query_expression_body, and query_block includes TABLE (set-operations.html)" }
    examples:
      - |-
        WITH
          cte1 AS (SELECT a, b FROM table1),
          cte2 AS (SELECT c, d FROM table2)
        SELECT b, d FROM cte1 JOIN cte2
        WHERE cte1.a = cte2.c;
      - |-
        WITH cte (col1, col2) AS
        (
          SELECT 1, 2
          UNION ALL
          SELECT 3, 4
        )
        SELECT col1, col2 FROM cte;
      - |-
        WITH cte1 AS (SELECT 1)
        SELECT * FROM (WITH cte2 AS (SELECT 2) SELECT * FROM cte2 JOIN cte1) AS dt;
      - |-
        WITH RECURSIVE cte (n) AS
        (
          SELECT 1
          UNION ALL
          SELECT n + 1 FROM cte
        )
        SELECT /*+ SET_VAR(cte_max_recursion_depth = 1M) */ * FROM cte;
      - |-
        WITH RECURSIVE dates (date) AS
        (
          SELECT MIN(date) FROM sales
          UNION ALL
          SELECT date + INTERVAL 1 DAY FROM dates
          WHERE date + INTERVAL 1 DAY <= (SELECT MAX(date) FROM sales)
        )
        SELECT dates.date, COALESCE(SUM(price), 0) AS sum_price
        FROM dates LEFT JOIN sales ON dates.date = sales.date
        GROUP BY dates.date
        ORDER BY dates.date;

