dialect: redshift
engine: Amazon Redshift
version: "current"
source: https://docs.aws.amazon.com/redshift/latest/dg/c_SQL_commands.html

statements:
  - id: drop_view
    name: DROP VIEW
    doc: https://docs.aws.amazon.com/redshift/latest/dg/r_DROP_VIEW.html
    tier: high
    probes:
      - id: basic
        sql: "DROP VIEW v;"
      - id: if_exists
        sql: "DROP VIEW IF EXISTS v;"
      - id: multiple
        sql: "DROP VIEW v1, v2;"
      - id: cascade
        sql: "DROP VIEW v CASCADE;"
      - id: restrict
        sql: "DROP VIEW v RESTRICT;"
      - id: if_exists_multiple_cascade
        sql: "DROP VIEW IF EXISTS v1, v2 CASCADE;"
      - id: schema_qualified
        sql: "DROP VIEW s.v;"
    examples:
      - "drop view event;"
      - "drop view eventview cascade;"
      - "drop view if exists eventview;"

  - id: end
    name: END
    doc: https://docs.aws.amazon.com/redshift/latest/dg/r_END.html
    tier: high
    probes:
      - id: basic
        sql: "END;"
      - id: work
        sql: "END WORK;"
      - id: transaction
        sql: "END TRANSACTION;"
    examples:
      - "end;"
      - "end work;"
      - "end transaction;"
