      - { id: sqlstate_set, sql: "CREATE PROCEDURE p() BEGIN DECLARE EXIT HANDLER FOR SQLEXCEPTION BEGIN RESIGNAL SQLSTATE '45000' SET MYSQL_ERRNO = 5; END; DROP TABLE xx; END;" }
      - { id: condition_name, sql: "CREATE PROCEDURE p() BEGIN DECLARE c CONDITION FOR SQLSTATE VALUE '45000'; DECLARE EXIT HANDLER FOR SQLEXCEPTION RESIGNAL c; DROP TABLE xx; END;" }
      - { id: procedure_body, sql: "CREATE PROCEDURE p() RESIGNAL;" }
    examples:
