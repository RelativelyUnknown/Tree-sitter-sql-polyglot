dialect: databricks
engine: Databricks SQL / Databricks Runtime
version: "current (docs read 2026-10-04)"
source: https://docs.databricks.com/aws/en/sql/language-manual/

statements:
  - id: drop_procedure
    name: DROP PROCEDURE
    doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-ddl-drop-procedure
    tier: high
    probes:
      - id: basic
        sql: "DROP PROCEDURE p;"
      - id: if_exists
        sql: "DROP PROCEDURE IF EXISTS p;"
      - id: qualified_name
        sql: "DROP PROCEDURE s.p;"
      - id: if_exists_qualified
        sql: "DROP PROCEDURE IF EXISTS c.s.p;"
    examples:
      - "DROP PROCEDURE hello;"
      - "DROP PROCEDURE IF EXISTS hello;"

  - id: truncate_table
    name: TRUNCATE TABLE
    doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-ddl-truncate-table
    tier: high
    probes:
      - id: basic
        sql: "TRUNCATE TABLE t;"
      - id: qualified_name
        sql: "TRUNCATE TABLE s.t;"
      - id: partition
        sql: "TRUNCATE TABLE t PARTITION (age = 10);"
      - id: partition_multi
        sql: "TRUNCATE TABLE t PARTITION (a = 1, b = 'x');"
    examples:
      - "TRUNCATE TABLE Student partition (age = 10);"
      - "TRUNCATE TABLE Student;"
