  - id: create_index
    name: "CREATE INDEX"
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-index-transact-sql
    tier: high
    probes:
      - id: basic
        sql: "CREATE INDEX ix ON t (c);"
      - id: unique
        sql: "CREATE UNIQUE INDEX ix ON t (c);"
      - id: clustered
        sql: "CREATE CLUSTERED INDEX ix ON db.dbo.t (c);"
      - id: unique_nonclustered
        sql: "CREATE UNIQUE NONCLUSTERED INDEX ix ON dbo.t (c);"
      - id: asc_desc
        sql: "CREATE INDEX ix ON t (a DESC, b ASC, c DESC);"
      - id: omitted_schema
        sql: "CREATE INDEX ix ON db..t (c);"
      - id: include
        sql: "CREATE NONCLUSTERED INDEX ix ON t (a) INCLUDE (b, c);"
      - id: filtered
        sql: "CREATE NONCLUSTERED INDEX ix ON t (a, b) WHERE c IS NOT NULL;"
      - id: filtered_in_and
        sql: "CREATE INDEX ix ON t (a) WHERE b IN (533, 324) AND c > '20000101' AND d <= '20000630';"
      - id: on_view
        sql: "CREATE UNIQUE CLUSTERED INDEX ix ON dbo.v (a, b);"
      - id: on_filegroup
        sql: "CREATE INDEX ix ON t (c) ON [PRIMARY];"
      - id: on_default
        sql: "CREATE INDEX ix ON t (c) ON \"default\";"
      - id: on_partition_scheme
        sql: "CREATE NONCLUSTERED INDEX ix ON t (a) ON ps (d);"
      - id: filestream_on
        sql: "CREATE UNIQUE CLUSTERED INDEX ix ON t (id) FILESTREAM_ON fs_fg;"
      - id: with_basic_options
        sql: "CREATE INDEX ix ON t (c) WITH (PAD_INDEX = ON, FILLFACTOR = 80, SORT_IN_TEMPDB = ON, STATISTICS_NORECOMPUTE = OFF, STATISTICS_INCREMENTAL = ON);"
      - id: ignore_dup_key
        sql: "CREATE UNIQUE INDEX ix ON #t (c) WITH (IGNORE_DUP_KEY = ON);"
      - id: drop_existing
        sql: "CREATE NONCLUSTERED INDEX ix ON t (c) WITH (FILLFACTOR = 80, PAD_INDEX = ON, DROP_EXISTING = ON);"
      - id: online_low_priority
        sql: "CREATE CLUSTERED INDEX ix ON dbo.t (a) WITH (ONLINE = ON (WAIT_AT_LOW_PRIORITY (MAX_DURATION = 5 MINUTES, ABORT_AFTER_WAIT = SELF)));"
      - id: resumable
        sql: "CREATE INDEX ix ON t (c) WITH (ONLINE = ON, RESUMABLE = ON, MAX_DURATION = 240 MINUTES, MAXDOP = 1);"
      - id: locks_sequential_key
        sql: "CREATE INDEX ix ON t (c) WITH (ALLOW_ROW_LOCKS = ON, ALLOW_PAGE_LOCKS = OFF, OPTIMIZE_FOR_SEQUENTIAL_KEY = ON);"
      - id: data_compression_partitions
        sql: "CREATE CLUSTERED INDEX ix ON t (c) WITH (DATA_COMPRESSION = PAGE ON PARTITIONS (1), DATA_COMPRESSION = ROW ON PARTITIONS (2 TO 4));"
      - id: xml_compression
        sql: "CREATE NONCLUSTERED INDEX ix ON t (c) WITH (XML_COMPRESSION = ON);"
      - id: backward_compatible_options
        sql: "CREATE INDEX ix ON t (c) WITH PAD_INDEX, FILLFACTOR = 80, IGNORE_DUP_KEY, DROP_EXISTING;"
        note: "'Backward compatible relational index' syntax block: options without '= ON' and without parentheses."
      - id: backward_compatible_owner
        sql: "CREATE INDEX ix ON db.owner1.t (c) ON \"default\";"
    examples:
      - "CREATE UNIQUE INDEX index1 ON schema1.table1 (column1 DESC, column2 ASC, column3 DESC);"
      - |-
        CREATE NONCLUSTERED INDEX IX_WorkOrder_ProductID
          ON Production.WorkOrder(ProductID)
            WITH (FILLFACTOR = 80,
              PAD_INDEX = ON,
              DROP_EXISTING = ON);
      - |-
        CREATE NONCLUSTERED INDEX IX_Address_PostalCode
          ON Person.Address (PostalCode)
          INCLUDE (AddressLine1, AddressLine2, City, StateProvinceID);
      - |-
        CREATE NONCLUSTERED INDEX "FIBillOfMaterialsWithEndDate"
          ON Production.BillOfMaterials (ComponentID, StartDate)
          WHERE EndDate IS NOT NULL;
      - |-
        CREATE CLUSTERED INDEX IX_PartTab2Col1
          ON PartitionTable1 (Col1)
          WITH (
            DATA_COMPRESSION = PAGE ON PARTITIONS(1),
            DATA_COMPRESSION = ROW ON PARTITIONS (2 TO 4)
          );

  - id: create_columnstore_index
    name: "CREATE COLUMNSTORE INDEX"
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-columnstore-index-transact-sql
    tier: high
    probes:
      - id: clustered
        sql: "CREATE CLUSTERED COLUMNSTORE INDEX cci ON dbo.t;"
      - id: clustered_order
        sql: "CREATE CLUSTERED COLUMNSTORE INDEX cci ON t ORDER (a, b);"
      - id: clustered_drop_existing
        sql: "CREATE CLUSTERED COLUMNSTORE INDEX cci ON t WITH (DROP_EXISTING = ON);"
      - id: clustered_options
        sql: "CREATE CLUSTERED COLUMNSTORE INDEX cci ON t WITH (MAXDOP = 2, ONLINE = ON, COMPRESSION_DELAY = 10 MINUTES);"
      - id: clustered_archive_partitions
        sql: "CREATE CLUSTERED COLUMNSTORE INDEX cci ON t WITH (DATA_COMPRESSION = COLUMNSTORE_ARCHIVE ON PARTITIONS (1, 2 TO 4));"
      - id: clustered_on_partition_scheme
        sql: "CREATE CLUSTERED COLUMNSTORE INDEX cci ON t ON ps (d);"
      - id: nonclustered
        sql: "CREATE NONCLUSTERED COLUMNSTORE INDEX ncci ON t (a, b, c);"
      - id: columnstore_without_nonclustered
        sql: "CREATE COLUMNSTORE INDEX ncci ON t (a, b) WITH (ONLINE = ON);"
      - id: nonclustered_order
        sql: "CREATE NONCLUSTERED COLUMNSTORE INDEX ncci ON t (a, b) ORDER (a);"
      - id: nonclustered_filtered
        sql: "CREATE NONCLUSTERED COLUMNSTORE INDEX ncci ON t (a, b) WHERE c IS NOT NULL AND d IN (1, 2);"
      - id: nonclustered_on_filegroup
        sql: "CREATE NONCLUSTERED COLUMNSTORE INDEX ncci ON t (a) WITH (COMPRESSION_DELAY = 0) ON \"default\";"
    examples:
      - |-
        CREATE CLUSTERED COLUMNSTORE INDEX cci
            ON Sales.OrderLines WITH (COMPRESSION_DELAY = 10 MINUTES);
      - |-
        CREATE COLUMNSTORE INDEX ncci
            ON Sales.OrderLines(StockItemID, Quantity, UnitPrice, TaxRate) WITH (ONLINE = ON);
      - |-
        CREATE NONCLUSTERED COLUMNSTORE INDEX csindx_simple
            ON dbo.SimpleTable(OrderDateKey, DueDateKey, ShipDateKey);
      - |-
        CREATE NONCLUSTERED COLUMNSTORE INDEX csindx_simple
            ON SimpleTable(OrderDateKey, DueDateKey, ShipDateKey) WITH (DROP_EXISTING = ON, MAXDOP = 2)
            ON "DEFAULT";
      - |-
        CREATE CLUSTERED COLUMNSTORE INDEX cci
            ON Sales.OrderLines ORDER(SHIPDATE);

