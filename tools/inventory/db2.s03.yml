      - { id: add_column_not_hidden, sql: "ALTER TABLE t ADD COLUMN c INTEGER NOT HIDDEN;" }
      - { id: add_column_generated_identity, sql: "ALTER TABLE t ADD COLUMN c INTEGER GENERATED ALWAYS AS IDENTITY (START WITH 1 INCREMENT BY 1 NO CYCLE CACHE 20);" }
      - { id: add_column_generated_by_default_identity, sql: "ALTER TABLE t ADD COLUMN c INTEGER GENERATED BY DEFAULT AS IDENTITY;" }
      - { id: add_column_generated_expression, sql: "ALTER TABLE t ADD COLUMN c INTEGER GENERATED ALWAYS AS (a + b);" }
      - { id: add_column_generated_no_type, sql: "ALTER TABLE t ADD COLUMN c GENERATED ALWAYS AS (a + b);" }
      - { id: add_column_row_change_timestamp, sql: "ALTER TABLE t ADD COLUMN c TIMESTAMP NOT NULL GENERATED ALWAYS FOR EACH ROW ON UPDATE AS ROW CHANGE TIMESTAMP;" }
      - { id: add_column_row_begin, sql: "ALTER TABLE t ADD COLUMN sb TIMESTAMP(12) NOT NULL GENERATED ALWAYS AS ROW BEGIN;" }
