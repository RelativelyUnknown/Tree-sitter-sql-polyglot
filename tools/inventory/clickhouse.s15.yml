dialect: clickhouse
engine: ClickHouse
version: "current docs (2026)"
source: https://clickhouse.com/docs/sql-reference/statements/

statements:
  - id: drop_view
    name: DROP VIEW
    doc: https://clickhouse.com/docs/sql-reference/statements/drop
    tier: high
    probes:
      - id: basic
        sql: "DROP VIEW v;"
      - id: if_exists
        sql: "DROP VIEW IF EXISTS v;"
      - id: qualified
        sql: "DROP VIEW db.v;"
      - id: on_cluster
        sql: "DROP VIEW v ON CLUSTER c;"
      - id: sync
        sql: "DROP VIEW v SYNC;"
      - id: all_clauses
        sql: "DROP VIEW IF EXISTS db.v ON CLUSTER c SYNC;"

  - id: drop_function
    name: DROP FUNCTION
    doc: https://clickhouse.com/docs/sql-reference/statements/drop
    tier: high
    probes:
      - id: basic
        sql: "DROP FUNCTION f;"
      - id: if_exists
        sql: "DROP FUNCTION IF EXISTS f;"
      - id: on_cluster
        sql: "DROP FUNCTION f ON CLUSTER c;"
      - id: all_clauses
        sql: "DROP FUNCTION IF EXISTS f ON CLUSTER c;"
    examples:
      - "DROP FUNCTION linear_equation;"
