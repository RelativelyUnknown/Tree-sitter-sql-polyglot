        sql: "CREATE TABLE t (a INTEGER, b INTEGER) PRIMARY INDEX (a);"
      - id: unique_primary_index_named
        sql: "CREATE TABLE t (a INTEGER, b INTEGER) UNIQUE PRIMARY INDEX pi1 (a, b);"
      - id: no_primary_index
        sql: "CREATE TABLE t (a INTEGER) NO PRIMARY INDEX;"
      - id: primary_amp_index
        sql: "CREATE TABLE t (a INTEGER, b INTEGER) PRIMARY AMP INDEX (a);"
