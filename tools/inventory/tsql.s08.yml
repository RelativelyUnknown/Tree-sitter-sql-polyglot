dialect: tsql
engine: SQL Server 2022 / Azure SQL Database
version: "2022"
source: https://learn.microsoft.com/en-us/sql/t-sql/statements/statements

statements:
  - id: execute_as
    name: EXECUTE AS
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/execute-as-transact-sql
    tier: medium
    probes:
      - id: login
        sql: "EXECUTE AS LOGIN = 'login1';"
      - id: user
        sql: "EXECUTE AS USER = 'user1';"
      - id: exec_keyword
        sql: "EXEC AS USER = 'user1';"
      - id: no_revert
        sql: "EXECUTE AS USER = 'user1' WITH NO REVERT;"
      - id: cookie_into
        sql: "EXECUTE AS USER = 'user1' WITH COOKIE INTO @cookie;"
      - id: caller
        sql: "EXECUTE AS CALLER;"
    examples:
      - "EXECUTE AS LOGIN = 'login1';"
      - "EXECUTE AS USER = 'user2';"
      - "EXECUTE AS USER = 'user1' WITH COOKIE INTO @cookie;"

  - id: revert
    name: REVERT
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/revert-transact-sql
    tier: medium
    probes:
      - id: basic
        sql: "REVERT;"
      - id: with_cookie
        sql: "REVERT WITH COOKIE = @cookie;"
    examples:
      - "REVERT;"
      - "REVERT WITH COOKIE = @cookie;"

  - id: set_ansi_defaults
    name: SET ANSI_DEFAULTS
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/set-ansi-defaults-transact-sql
    tier: medium
    probes:
      - id: "on"
        sql: "SET ANSI_DEFAULTS ON;"
      - id: "off"
        sql: "SET ANSI_DEFAULTS OFF;"
    examples:
      - "SET ANSI_DEFAULTS ON;"
      - "SET ANSI_DEFAULTS OFF;"

  - id: set_ansi_null_dflt_off
    name: SET ANSI_NULL_DFLT_OFF
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/set-ansi-null-dflt-off-transact-sql
    tier: medium
    probes:
      - id: "on"
        sql: "SET ANSI_NULL_DFLT_OFF ON;"
      - id: "off"
        sql: "SET ANSI_NULL_DFLT_OFF OFF;"
    examples:
      - "SET ANSI_NULL_DFLT_OFF ON;"
      - "SET ANSI_NULL_DFLT_OFF OFF;"

  - id: set_ansi_null_dflt_on
    name: SET ANSI_NULL_DFLT_ON
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/set-ansi-null-dflt-on-transact-sql
    tier: medium
    probes:
      - id: "on"
        sql: "SET ANSI_NULL_DFLT_ON ON;"
      - id: "off"
        sql: "SET ANSI_NULL_DFLT_ON OFF;"
    examples:
      - "SET ANSI_NULL_DFLT_ON ON;"
      - "SET ANSI_NULL_DFLT_ON OFF;"

  - id: set_ansi_nulls
    name: SET ANSI_NULLS
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/set-ansi-nulls-transact-sql
    tier: medium
    probes:
      - id: "on"
        sql: "SET ANSI_NULLS ON;"
      - id: "off"
        sql: "SET ANSI_NULLS OFF;"

  - id: set_ansi_padding
    name: SET ANSI_PADDING
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/set-ansi-padding-transact-sql
    tier: medium
    probes:
      - id: "on"
        sql: "SET ANSI_PADDING ON;"
      - id: "off"
        sql: "SET ANSI_PADDING OFF;"
    examples:
      - "SET ANSI_PADDING ON;"
      - "SET ANSI_PADDING OFF;"

  - id: set_ansi_warnings
    name: SET ANSI_WARNINGS
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/set-ansi-warnings-transact-sql
    tier: medium
    probes:
      - id: "on"
        sql: "SET ANSI_WARNINGS ON;"
      - id: "off"
        sql: "SET ANSI_WARNINGS OFF;"
    examples:
      - "SET ANSI_WARNINGS ON;"
      - "SET ANSI_WARNINGS OFF;"

  - id: set_arithabort
    name: SET ARITHABORT
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/set-arithabort-transact-sql
    tier: medium
    probes:
      - id: "on"
        sql: "SET ARITHABORT ON;"
      - id: "off"
        sql: "SET ARITHABORT OFF;"
    examples:
      - "SET ARITHABORT ON;"
      - "SET ARITHABORT OFF;"

  - id: set_arithignore
    name: SET ARITHIGNORE
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/set-arithignore-transact-sql
    tier: medium
    probes:
      - id: "on"
        sql: "SET ARITHIGNORE ON;"
      - id: "off"
        sql: "SET ARITHIGNORE OFF;"
    examples:
      - "SET ARITHIGNORE ON;"
