dialect: spark
engine: Apache Spark SQL
version: "4.x (docs/latest)"
source: https://spark.apache.org/docs/latest/sql-ref-syntax.html

statements:
  - id: select
    name: SELECT
    doc: https://spark.apache.org/docs/latest/sql-ref-syntax-qry-select.html
    tier: high
    probes:
      - { id: basic, sql: "SELECT a, b FROM t;" }
      - { id: select_all, sql: "SELECT ALL a FROM t;" }
      - { id: distinct, sql: "SELECT DISTINCT a FROM t;" }
      - { id: star, sql: "SELECT * FROM t;" }
      - { id: qualified_star, sql: "SELECT t.* FROM t;" }
      - { id: alias, sql: "SELECT a AS x, b y FROM t;" }
      - { id: no_from, sql: "SELECT 1;" }
      - { id: hint_single, sql: "SELECT /*+ BROADCAST(t2) */ * FROM t1 JOIN t2 ON t1.a = t2.a;" }
      - { id: hint_multiple, sql: "SELECT /*+ COALESCE(3), REPARTITION(c) */ * FROM t;" }
      - id: regex_column_names
        sql: "SELECT `(a|b)?+.+` FROM (SELECT 1 AS a, 2 AS b, 3 AS c);"
        note: Requires spark.sql.parser.quotedRegexColumnNames=true; syntactically a backtick identifier.
      - { id: transform, sql: "SELECT TRANSFORM (a, b) USING 'cat' AS (c, d) FROM t;" }
      - { id: from_multiple, sql: "SELECT * FROM t1, t2;" }
      - { id: from_alias, sql: "SELECT x.a FROM t AS x;" }
      - { id: from_subquery, sql: "SELECT * FROM (SELECT a FROM t) s;" }
      - { id: from_lateral_subquery, sql: "SELECT * FROM t1, LATERAL (SELECT * FROM t2 WHERE t2.a = t1.a);" }
      - { id: from_inline_table, sql: "SELECT * FROM VALUES (1, 'a'), (2, 'b') AS tab(x, y);" }
      - { id: from_table_valued_function, sql: "SELECT * FROM range(10);" }
      - { id: from_file, sql: "SELECT * FROM parquet.`/path/to/data`;" }
      - { id: join_inner, sql: "SELECT * FROM t1 INNER JOIN t2 ON t1.a = t2.a;" }
      - { id: join_left_outer, sql: "SELECT * FROM t1 LEFT OUTER JOIN t2 ON t1.a = t2.a;" }
      - { id: join_right, sql: "SELECT * FROM t1 RIGHT JOIN t2 ON t1.a = t2.a;" }
      - { id: join_full, sql: "SELECT * FROM t1 FULL OUTER JOIN t2 ON t1.a = t2.a;" }
      - { id: join_cross, sql: "SELECT * FROM t1 CROSS JOIN t2;" }
      - { id: join_semi, sql: "SELECT * FROM t1 LEFT SEMI JOIN t2 ON t1.a = t2.a;" }
      - { id: join_anti, sql: "SELECT * FROM t1 LEFT ANTI JOIN t2 ON t1.a = t2.a;" }
      - { id: join_natural, sql: "SELECT * FROM t1 NATURAL JOIN t2;" }
      - { id: join_using, sql: "SELECT * FROM t1 JOIN t2 USING (a);" }
      - { id: tablesample_percent, sql: "SELECT * FROM t TABLESAMPLE (50 PERCENT);" }
      - { id: tablesample_rows, sql: "SELECT * FROM t TABLESAMPLE (5 ROWS);" }
      - { id: tablesample_bucket, sql: "SELECT * FROM t TABLESAMPLE (BUCKET 4 OUT OF 10);" }
      - { id: pivot, sql: "SELECT * FROM t PIVOT (SUM(x) AS s FOR y IN ('a', 'b'));" }
      - { id: unpivot, sql: "SELECT * FROM t UNPIVOT (v FOR k IN (a, b));" }
      - { id: lateral_view, sql: "SELECT * FROM t LATERAL VIEW EXPLODE(arr) e AS x;" }
      - { id: lateral_view_outer, sql: "SELECT * FROM t LATERAL VIEW OUTER EXPLODE(arr) e AS x;" }
      - { id: lateral_view_multiple, sql: "SELECT * FROM t LATERAL VIEW EXPLODE(a) e1 AS x LATERAL VIEW EXPLODE(b) e2 AS y;" }
      - { id: where, sql: "SELECT * FROM t WHERE a > 1 AND b < 2;" }
      - { id: group_by, sql: "SELECT a, COUNT(*) FROM t GROUP BY a;" }
      - { id: group_by_all, sql: "SELECT a, COUNT(*) FROM t GROUP BY ALL;" }
      - { id: group_by_rollup, sql: "SELECT a, b, SUM(c) FROM t GROUP BY a, b WITH ROLLUP;" }
      - { id: group_by_cube, sql: "SELECT a, b, SUM(c) FROM t GROUP BY a, b WITH CUBE;" }
      - { id: group_by_grouping_sets, sql: "SELECT a, b, SUM(c) FROM t GROUP BY GROUPING SETS ((a), (b));" }
      - { id: group_by_rollup_func, sql: "SELECT a, b, SUM(c) FROM t GROUP BY ROLLUP (a, b);" }
      - { id: group_by_cube_func, sql: "SELECT a, b, SUM(c) FROM t GROUP BY CUBE (a, b);" }
      - { id: aggregate_filter, sql: "SELECT COUNT(*) FILTER (WHERE a > 1) FROM t;" }
      - { id: having, sql: "SELECT a, COUNT(*) FROM t GROUP BY a HAVING COUNT(*) > 1;" }
      - { id: having_no_group_by, sql: "SELECT COUNT(*) FROM t HAVING COUNT(*) > 1;" }
      - { id: window_clause, sql: "SELECT SUM(a) OVER w FROM t WINDOW w AS (PARTITION BY b ORDER BY c);" }
      - { id: window_multiple, sql: "SELECT SUM(a) OVER w1, SUM(a) OVER w2 FROM t WINDOW w1 AS (PARTITION BY b), w2 AS (ORDER BY c);" }
      - { id: qualify, sql: "SELECT a FROM t QUALIFY ROW_NUMBER() OVER (PARTITION BY a ORDER BY b) = 1;" }
      - { id: union, sql: "SELECT a FROM t1 UNION SELECT a FROM t2;" }
      - { id: union_all, sql: "SELECT a FROM t1 UNION ALL SELECT a FROM t2;" }
      - { id: union_distinct, sql: "SELECT a FROM t1 UNION DISTINCT SELECT a FROM t2;" }
      - { id: intersect, sql: "SELECT a FROM t1 INTERSECT SELECT a FROM t2;" }
      - { id: intersect_all, sql: "SELECT a FROM t1 INTERSECT ALL SELECT a FROM t2;" }
      - { id: except, sql: "SELECT a FROM t1 EXCEPT SELECT a FROM t2;" }
      - { id: except_all, sql: "SELECT a FROM t1 EXCEPT ALL SELECT a FROM t2;" }
      - { id: order_by, sql: "SELECT * FROM t ORDER BY a;" }
      - { id: order_by_asc_desc, sql: "SELECT * FROM t ORDER BY a ASC, b DESC;" }
      - { id: order_by_nulls, sql: "SELECT * FROM t ORDER BY a NULLS FIRST, b DESC NULLS LAST;" }
      - { id: order_by_all, sql: "SELECT * FROM t ORDER BY ALL;" }
      - { id: sort_by, sql: "SELECT * FROM t SORT BY a DESC NULLS LAST;" }
      - { id: cluster_by, sql: "SELECT * FROM t CLUSTER BY a, b;" }
      - { id: distribute_by, sql: "SELECT * FROM t DISTRIBUTE BY a, b;" }
      - { id: distribute_by_sort_by, sql: "SELECT * FROM t DISTRIBUTE BY a SORT BY b;" }
      - { id: limit, sql: "SELECT * FROM t LIMIT 10;" }
      - { id: limit_all, sql: "SELECT * FROM t LIMIT ALL;" }
      - { id: limit_expression, sql: "SELECT * FROM t LIMIT 5 + 5;" }
      - { id: offset, sql: "SELECT * FROM t ORDER BY a LIMIT 10 OFFSET 5;" }
      - { id: with_cte, sql: "WITH c AS (SELECT 1 AS a) SELECT * FROM c;" }
      - { id: with_multiple_ctes, sql: "WITH c1 AS (SELECT 1 AS a), c2 AS (SELECT 2 AS a) SELECT * FROM c1, c2;" }
      - { id: subquery_in_where, sql: "SELECT * FROM t WHERE a IN (SELECT a FROM t2);" }
      - { id: values_query, sql: "VALUES (1, 'a'), (2, 'b');" }
      - { id: table_query, sql: "TABLE t;" }

  - id: common_table_expression
    name: Common Table Expression
    doc: https://spark.apache.org/docs/latest/sql-ref-syntax-qry-select-cte.html
    tier: high
    probes:
      - { id: basic, sql: "WITH t AS (SELECT 1) SELECT * FROM t;" }
      - { id: column_list, sql: "WITH t (x, y) AS (SELECT 1, 2) SELECT * FROM t;" }
      - { id: without_as, sql: "WITH t (SELECT 1) SELECT * FROM t;" }
      - { id: multiple, sql: "WITH t1 AS (SELECT 1), t2 AS (SELECT 2) SELECT * FROM t1, t2;" }
      - { id: nested_in_cte, sql: "WITH t AS (WITH t2 AS (SELECT 1) SELECT * FROM t2) SELECT * FROM t;" }
      - { id: in_subquery, sql: "SELECT max(c) FROM (WITH t (c) AS (SELECT 1) SELECT * FROM t);" }
      - { id: in_scalar_subquery, sql: "SELECT (WITH t AS (SELECT 1) SELECT * FROM t);" }
      - { id: in_create_view, sql: "CREATE VIEW v AS WITH t (a, b) AS (SELECT 1, 2) SELECT * FROM t;" }
      - { id: with_set_operation, sql: "WITH t AS (SELECT 1 AS a) SELECT a FROM t UNION ALL SELECT a FROM t;" }
    examples:
      - "WITH t(x, y) AS (SELECT 1, 2) SELECT * FROM t WHERE x = 1 AND y = 2;"
      - "WITH t AS (WITH t2 AS (SELECT 1) SELECT * FROM t2) SELECT * FROM t;"
      - "SELECT max(c) FROM (WITH t(c) AS (SELECT 1) SELECT * FROM t);"
