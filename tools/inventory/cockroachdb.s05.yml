      - |-
        CREATE TABLE users (
                id UUID PRIMARY KEY,
                city STRING,
                name STRING,
                address STRING,
                credit_card STRING,
                dl STRING
        );
      - |-
        CREATE TABLE table2 (LIKE table1 INCLUDING ALL EXCLUDING CONSTRAINTS, c INT, INDEX(b,c));
      - |-
        CREATE TABLE promo_codes (
            code STRING PRIMARY KEY,
            description STRING,
            creation_time TIMESTAMP,
            expiration_time TIMESTAMP,
            rules JSONB)
            LOCALITY GLOBAL;

  - id: create_table_as
    name: CREATE TABLE AS
    doc: https://www.cockroachlabs.com/docs/stable/create-table-as
    tier: high
    probes:
      - { id: basic, sql: "CREATE TABLE t AS SELECT * FROM s;" }
      - { id: if_not_exists, sql: "CREATE TABLE IF NOT EXISTS t AS SELECT * FROM s;" }
      - { id: qualified_name, sql: "CREATE TABLE db.s.t AS SELECT * FROM src;" }
      - { id: temporary, sql: "CREATE TEMPORARY TABLE t AS SELECT * FROM s;" }
      - { id: temp, sql: "CREATE TEMP TABLE t AS SELECT * FROM s;" }
      - { id: unlogged, sql: "CREATE UNLOGGED TABLE t AS SELECT * FROM s;" }
      - { id: column_names, sql: "CREATE TABLE t (a, b) AS SELECT x, y FROM s;" }
      - { id: column_primary_key, sql: "CREATE TABLE t (a, b PRIMARY KEY) AS SELECT x, y FROM s;" }
      - { id: column_primary_key_storage_parameter, sql: "CREATE TABLE t (a, b PRIMARY KEY WITH (bucket_count = 4)) AS SELECT x, y FROM s;" }
      - { id: column_family, sql: "CREATE TABLE t (a FAMILY f1, b FAMILY f2) AS SELECT x, y FROM s;" }
      - { id: column_primary_key_family, sql: "CREATE TABLE t (a PRIMARY KEY FAMILY f1, b) AS SELECT x, y FROM s;" }
      - { id: table_family_def, sql: "CREATE TABLE t (a, b, FAMILY f1 (a), FAMILY f2 (b)) AS SELECT x, y FROM s;" }
      - { id: table_primary_key, sql: "CREATE TABLE t (a, b, PRIMARY KEY (a)) AS SELECT x, y FROM s;" }
      - { id: table_primary_key_composite, sql: "CREATE TABLE t (a, b, PRIMARY KEY (a, b)) AS SELECT x, y FROM s;" }
      - { id: table_primary_key_storage_parameter, sql: "CREATE TABLE t (a, b, PRIMARY KEY (a) WITH (bucket_count = 4)) AS SELECT x, y FROM s;" }
      - { id: with_storage_parameter, sql: "CREATE TABLE t WITH (exclude_data_from_backup = true) AS SELECT * FROM s;" }
      - { id: with_storage_parameter_and_columns, sql: "CREATE TABLE t (a, b) WITH (fillfactor = 70) AS SELECT x, y FROM s;" }
      - { id: on_commit_preserve_rows, sql: "CREATE TEMP TABLE t AS SELECT * FROM s ON COMMIT PRESERVE ROWS;" }
      - { id: as_values, sql: "CREATE TABLE t (a, b) AS VALUES (1, 'x'), (2, 'y');" }
      - { id: as_table, sql: "CREATE TABLE t AS TABLE s;" }
      - { id: as_select_where, sql: "CREATE TABLE t AS SELECT * FROM s WHERE c = 1;" }
      - { id: as_select_union, sql: "CREATE TABLE t AS SELECT a FROM s UNION SELECT a FROM u;" }
      - { id: as_select_as_of_system_time, sql: "CREATE TABLE t AS SELECT * FROM s AS OF SYSTEM TIME '-10s';" }
      - { id: as_with_query, sql: "CREATE TABLE t AS WITH c AS (SELECT 1 AS x) SELECT * FROM c;" }
      - { id: as_parenthesized_select, sql: "CREATE TABLE t AS (SELECT * FROM s);" }
    examples:
      - "CREATE TABLE users_ny AS SELECT * FROM users WHERE city = 'new york';"
      - "CREATE TABLE users_ny_names (user_id, user_name) AS SELECT id, name FROM users WHERE city = 'new york';"
      - "CREATE TABLE drivers (id, city, name) AS VALUES (gen_random_uuid(), 'new york', 'Harry Potter'), (gen_random_uuid(), 'seattle', 'Evelyn Martin');"
