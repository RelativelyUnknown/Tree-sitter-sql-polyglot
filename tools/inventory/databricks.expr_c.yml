      - { id: rows_between_n_following_n_following, sql: "SELECT sum(c) OVER (ORDER BY e ROWS BETWEEN 1 FOLLOWING AND 3 FOLLOWING) FROM t;" }
      - { id: rows_between_current_current, sql: "SELECT sum(c) OVER (ORDER BY e ROWS BETWEEN CURRENT ROW AND CURRENT ROW) FROM t;" }
      - { id: range_between_unbounded_current, sql: "SELECT sum(c) OVER (ORDER BY e RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) FROM t;" }
      - { id: range_between_unbounded_unbounded, sql: "SELECT sum(c) OVER (ORDER BY e RANGE BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING) FROM t;" }
