dialect: hana
engine: SAP HANA Platform
version: "2.0 SPS 08 (2.0.08)"
source: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/3bc1a0d4611d40c4a6e3fc7c8e80395d.html?version=2.0.08

statements:
  - id: set_transaction
    name: SET TRANSACTION
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/20fdf9cb75191014b85aaa9dec841291.html?version=2.0.08
    tier: high
    probes:
      - { id: isolation_read_committed, sql: "SET TRANSACTION ISOLATION LEVEL READ COMMITTED;" }
      - { id: isolation_repeatable_read, sql: "SET TRANSACTION ISOLATION LEVEL REPEATABLE READ;" }
      - { id: isolation_serializable, sql: "SET TRANSACTION ISOLATION LEVEL SERIALIZABLE;" }
      - { id: access_read_only, sql: "SET TRANSACTION READ ONLY;" }
      - { id: access_read_write, sql: "SET TRANSACTION READ WRITE;" }
      - { id: lock_wait_timeout, sql: "SET TRANSACTION LOCK WAIT TIMEOUT 60000;" }
      - { id: ddl_off, sql: "SET TRANSACTION DDL OFF;" }
      - { id: ddl_on, sql: "SET TRANSACTION DDL ON;" }
    examples:
      - "SET TRANSACTION ISOLATION LEVEL READ COMMITTED;"
      - "SET TRANSACTION LOCK WAIT TIMEOUT 60000;"
      - "SET TRANSACTION DDL OFF;"

  - id: truncate_table
    name: TRUNCATE TABLE
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/20fe29f0751910149904f0c5c3201cfa.html?version=2.0.08
    tier: high
    probes:
      - { id: basic, sql: "TRUNCATE TABLE t;" }
      - { id: schema_qualified, sql: "TRUNCATE TABLE s.t;" }
      - { id: database_schema_qualified, sql: "TRUNCATE TABLE db.s.t;" }
      - { id: partition_single, sql: "TRUNCATE TABLE t PARTITION (2);" }
      - { id: partition_list, sql: "TRUNCATE TABLE t PARTITION (2, 3);" }
    examples:
      - "TRUNCATE TABLE A;"
      - "TRUNCATE TABLE T1 PARTITION (2,3);"
