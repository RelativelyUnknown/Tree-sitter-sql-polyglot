      - { id: aggregate_struct_acc, sql: "SELECT aggregate(array(1, 2, 3, 4), named_struct('sum', 0, 'cnt', 0), (acc, x) -> named_struct('sum', acc.sum + x, 'cnt', acc.cnt + 1), acc -> acc.sum / acc.cnt) AS avg;" }
      - { id: array_sort_lambda, sql: "SELECT array_sort(array('Hello', 'World'), (p1, p2) -> CASE WHEN p1 = p2 THEN 0 WHEN reverse(p1) < reverse(p2) THEN -1 ELSE 1 END);" }
      - { id: zip_with_lambda, sql: "SELECT zip_with(array(1, 2, 3), array(4, 5, 6), (x, y) -> x + y);" }
