dialect: db2
engine: IBM Db2 for Linux, UNIX and Windows
version: "12.1"
source: https://www.ibm.com/docs/en/db2/12.1.x?topic=reference-statements

statements:
  - id: create_function_external_table
    name: CREATE FUNCTION (external table)
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-create-function-external-table
    tier: high
    probes:
      - id: basic
        sql: "CREATE FUNCTION f (INTEGER) RETURNS TABLE (c INTEGER) EXTERNAL NAME 'lib!fn' LANGUAGE C PARAMETER STYLE SQL NO SQL;"
      - id: or_replace
        sql: "CREATE OR REPLACE FUNCTION f (INTEGER) RETURNS TABLE (c INTEGER) EXTERNAL NAME 'lib!fn' LANGUAGE C PARAMETER STYLE SQL;"
      - id: no_parameters
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) EXTERNAL NAME 'lib!fn' LANGUAGE C PARAMETER STYLE SQL;"
      - id: named_parameter
        sql: "CREATE FUNCTION f (p1 VARCHAR(30), p2 INTEGER) RETURNS TABLE (c INTEGER) EXTERNAL NAME 'lib!fn' LANGUAGE C PARAMETER STYLE SQL;"
      - id: parameter_default
        sql: "CREATE FUNCTION f (p1 INTEGER DEFAULT 0) RETURNS TABLE (c INTEGER) EXTERNAL NAME 'lib!fn' LANGUAGE C PARAMETER STYLE SQL;"
      - id: parameter_as_locator
        sql: "CREATE FUNCTION f (p1 CLOB(1M) AS LOCATOR) RETURNS TABLE (c INTEGER) EXTERNAL NAME 'lib!fn' LANGUAGE C PARAMETER STYLE SQL;"
      - id: parameter_ref_type
        sql: "CREATE FUNCTION f (p1 REF(t)) RETURNS TABLE (c INTEGER) EXTERNAL NAME 'lib!fn' LANGUAGE C PARAMETER STYLE SQL;"
      - id: multiple_columns
        sql: "CREATE FUNCTION f () RETURNS TABLE (c1 INTEGER, c2 VARCHAR(10), c3 DECIMAL(9,2), c4 TIMESTAMP) EXTERNAL NAME 'lib!fn' LANGUAGE C PARAMETER STYLE SQL;"
      - id: column_as_locator
        sql: "CREATE FUNCTION f () RETURNS TABLE (c BLOB(1M) AS LOCATOR) EXTERNAL NAME 'lib!fn' LANGUAGE C PARAMETER STYLE SQL;"
      - id: returns_generic_table
        sql: "CREATE FUNCTION f (INTEGER) RETURNS GENERIC TABLE EXTERNAL NAME 'lib!fn' LANGUAGE C PARAMETER STYLE SQL;"
      - id: language_java
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) EXTERNAL NAME 'myJar:UserFuncs.method' LANGUAGE JAVA PARAMETER STYLE DB2GENERAL;"
      - id: language_clr
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) EXTERNAL NAME 'asm:cls!meth' LANGUAGE CLR PARAMETER STYLE SQL;"
      - id: language_ole
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) EXTERNAL NAME 'prog.obj!meth' LANGUAGE OLE PARAMETER STYLE SQL;"
      - id: language_cpp
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) EXTERNAL NAME 'lib!fn' LANGUAGE CPP PARAMETER STYLE SQL;"
      - id: specific
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) SPECIFIC f_spec EXTERNAL NAME 'lib!fn' LANGUAGE C PARAMETER STYLE SQL;"
      - id: external_name_identifier
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) EXTERNAL NAME fn_id LANGUAGE C PARAMETER STYLE SQL;"
      - id: parameter_style_npsgeneral
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) EXTERNAL NAME 'lib!fn' LANGUAGE C PARAMETER STYLE NPSGENERIC;"
      - id: parameter_ccsid_ascii
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) EXTERNAL NAME 'lib!fn' LANGUAGE C PARAMETER STYLE SQL PARAMETER CCSID ASCII;"
      - id: parameter_ccsid_unicode
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) EXTERNAL NAME 'lib!fn' LANGUAGE C PARAMETER STYLE SQL PARAMETER CCSID UNICODE;"
      - id: deterministic
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) EXTERNAL NAME 'lib!fn' LANGUAGE C PARAMETER STYLE SQL DETERMINISTIC;"
      - id: not_deterministic
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) EXTERNAL NAME 'lib!fn' LANGUAGE C PARAMETER STYLE SQL NOT DETERMINISTIC;"
      - id: fenced
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) EXTERNAL NAME 'lib!fn' LANGUAGE C PARAMETER STYLE SQL FENCED;"
      - id: fenced_threadsafe
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) EXTERNAL NAME 'lib!fn' LANGUAGE C PARAMETER STYLE SQL FENCED THREADSAFE;"
      - id: fenced_not_threadsafe
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) EXTERNAL NAME 'lib!fn' LANGUAGE C PARAMETER STYLE SQL FENCED NOT THREADSAFE;"
      - id: not_fenced
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) EXTERNAL NAME 'lib!fn' LANGUAGE C PARAMETER STYLE SQL NOT FENCED;"
      - id: not_fenced_threadsafe
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) EXTERNAL NAME 'lib!fn' LANGUAGE C PARAMETER STYLE SQL NOT FENCED THREADSAFE;"
      - id: returns_null_on_null_input
        sql: "CREATE FUNCTION f (INTEGER) RETURNS TABLE (c INTEGER) EXTERNAL NAME 'lib!fn' LANGUAGE C PARAMETER STYLE SQL RETURNS NULL ON NULL INPUT;"
      - id: called_on_null_input
        sql: "CREATE FUNCTION f (INTEGER) RETURNS TABLE (c INTEGER) EXTERNAL NAME 'lib!fn' LANGUAGE C PARAMETER STYLE SQL CALLED ON NULL INPUT;"
      - id: reads_sql_data
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) EXTERNAL NAME 'lib!fn' LANGUAGE C PARAMETER STYLE SQL READS SQL DATA;"
      - id: no_sql
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) EXTERNAL NAME 'lib!fn' LANGUAGE C PARAMETER STYLE SQL NO SQL;"
      - id: contains_sql
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) EXTERNAL NAME 'lib!fn' LANGUAGE C PARAMETER STYLE SQL CONTAINS SQL;"
      - id: static_dispatch
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) EXTERNAL NAME 'lib!fn' LANGUAGE C PARAMETER STYLE SQL STATIC DISPATCH;"
      - id: external_action
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) EXTERNAL NAME 'lib!fn' LANGUAGE C PARAMETER STYLE SQL EXTERNAL ACTION;"
      - id: no_external_action
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) EXTERNAL NAME 'lib!fn' LANGUAGE C PARAMETER STYLE SQL NO EXTERNAL ACTION;"
      - id: no_scratchpad
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) EXTERNAL NAME 'lib!fn' LANGUAGE C PARAMETER STYLE SQL NO SCRATCHPAD;"
      - id: scratchpad
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) EXTERNAL NAME 'lib!fn' LANGUAGE C PARAMETER STYLE SQL SCRATCHPAD;"
      - id: scratchpad_length
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) EXTERNAL NAME 'lib!fn' LANGUAGE C PARAMETER STYLE SQL SCRATCHPAD 100;"
      - id: no_final_call
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) EXTERNAL NAME 'lib!fn' LANGUAGE C PARAMETER STYLE SQL NO FINAL CALL;"
      - id: final_call
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) EXTERNAL NAME 'lib!fn' LANGUAGE C PARAMETER STYLE SQL FINAL CALL;"
      - id: disallow_parallel
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) EXTERNAL NAME 'lib!fn' LANGUAGE C PARAMETER STYLE SQL DISALLOW PARALLEL;"
      - id: allow_parallel
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) EXTERNAL NAME 'lib!fn' LANGUAGE C PARAMETER STYLE SQL ALLOW PARALLEL;"
      - id: execute_on_all_database_partitions
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) EXTERNAL NAME 'lib!fn' LANGUAGE C PARAMETER STYLE SQL ALLOW PARALLEL EXECUTE ON ALL DATABASE PARTITIONS;"
      - id: execute_on_all_result_table_distributed
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) EXTERNAL NAME 'lib!fn' LANGUAGE C PARAMETER STYLE SQL ALLOW PARALLEL EXECUTE ON ALL DATABASE PARTITIONS RESULT TABLE DISTRIBUTED;"
      - id: no_dbinfo
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) EXTERNAL NAME 'lib!fn' LANGUAGE C PARAMETER STYLE SQL NO DBINFO;"
      - id: dbinfo
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) EXTERNAL NAME 'lib!fn' LANGUAGE C PARAMETER STYLE SQL DBINFO;"
      - id: cardinality
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) EXTERNAL NAME 'lib!fn' LANGUAGE C PARAMETER STYLE SQL CARDINALITY 20;"
      - id: transform_group
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) EXTERNAL NAME 'lib!fn' LANGUAGE C PARAMETER STYLE SQL TRANSFORM GROUP g;"
      - id: inherit_special_registers
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) EXTERNAL NAME 'lib!fn' LANGUAGE C PARAMETER STYLE SQL INHERIT SPECIAL REGISTERS;"
      - id: not_secured
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) EXTERNAL NAME 'lib!fn' LANGUAGE C PARAMETER STYLE SQL NOT SECURED;"
      - id: secured
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) EXTERNAL NAME 'lib!fn' LANGUAGE C PARAMETER STYLE SQL SECURED;"
      - id: stay_resident_yes
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) EXTERNAL NAME 'lib!fn' LANGUAGE C PARAMETER STYLE SQL STAY RESIDENT YES;"
      - id: stay_resident_no
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) EXTERNAL NAME 'lib!fn' LANGUAGE C PARAMETER STYLE SQL STAY RESIDENT NO;"
      - id: qualified_name
        sql: "CREATE FUNCTION s.f () RETURNS TABLE (c INTEGER) EXTERNAL NAME 'lib!fn' LANGUAGE C PARAMETER STYLE SQL;"
    examples:
      - |-
        CREATE FUNCTION DOCMATCH (VARCHAR(30), VARCHAR(255))
          RETURNS TABLE (DOC_ID CHAR(16))
          EXTERNAL NAME '/common/docfuncs/rajiv/udfmatch'
          LANGUAGE C PARAMETER STYLE SQL
          NO SQL DETERMINISTIC
          NO EXTERNAL ACTION NOT FENCED
          SCRATCHPAD FINAL CALL
          DISALLOW PARALLEL
          CARDINALITY 20;
      - |-
        CREATE FUNCTION MAIL()
          RETURNS TABLE (TIMERECEIVED DATE,
                         SUBJECT VARCHAR(15),
                         SIZE INTEGER,
                         TEXT VARCHAR(30))
          EXTERNAL NAME 'tfmail.header!list'
          LANGUAGE OLE
          PARAMETER STYLE SQL
          NOT DETERMINISTIC
          FENCED
          CALLED ON NULL INPUT
          SCRATCHPAD
          FINAL CALL
          NO SQL
          EXTERNAL ACTION
          DISALLOW PARALLEL;

  - id: create_function_ole_db_external_table
    name: CREATE FUNCTION (OLE DB external table)
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-create-function-ole-db-external-table
    tier: high
    probes:
      - id: basic
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) LANGUAGE OLEDB EXTERNAL NAME '!rowset!Provider=p';"
      - id: with_parameter
        sql: "CREATE FUNCTION f (VARCHAR(600)) RETURNS TABLE (c INTEGER) LANGUAGE OLEDB EXTERNAL NAME '!!Provider=p';"
      - id: named_parameter_default
        sql: "CREATE FUNCTION f (p1 INTEGER DEFAULT 0) RETURNS TABLE (c INTEGER) LANGUAGE OLEDB EXTERNAL NAME 'srv!tbl';"
      - id: multiple_columns
        sql: "CREATE FUNCTION f () RETURNS TABLE (c1 INTEGER, c2 CHAR(5), c3 DECIMAL(19,4), c4 TIMESTAMP) LANGUAGE OLEDB EXTERNAL NAME 'srv!tbl';"
      - id: qualified_name
        sql: "CREATE FUNCTION s.f () RETURNS TABLE (c INTEGER) LANGUAGE OLEDB EXTERNAL NAME 'srv!tbl';"
      - id: specific
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) SPECIFIC f_spec LANGUAGE OLEDB EXTERNAL NAME 'srv!tbl';"
      - id: deterministic
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) LANGUAGE OLEDB EXTERNAL NAME 'srv!tbl' DETERMINISTIC;"
      - id: not_deterministic
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) LANGUAGE OLEDB EXTERNAL NAME 'srv!tbl' NOT DETERMINISTIC;"
      - id: static_dispatch
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) LANGUAGE OLEDB EXTERNAL NAME 'srv!tbl' STATIC DISPATCH;"
      - id: returns_null_on_null_input
        sql: "CREATE FUNCTION f (INTEGER) RETURNS TABLE (c INTEGER) LANGUAGE OLEDB EXTERNAL NAME 'srv!tbl' RETURNS NULL ON NULL INPUT;"
      - id: called_on_null_input
        sql: "CREATE FUNCTION f (INTEGER) RETURNS TABLE (c INTEGER) LANGUAGE OLEDB EXTERNAL NAME 'srv!tbl' CALLED ON NULL INPUT;"
      - id: no_external_action
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) LANGUAGE OLEDB EXTERNAL NAME 'srv!tbl' NO EXTERNAL ACTION;"
      - id: external_action
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) LANGUAGE OLEDB EXTERNAL NAME 'srv!tbl' EXTERNAL ACTION;"
      - id: cardinality
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) LANGUAGE OLEDB EXTERNAL NAME 'srv!tbl' CARDINALITY 100;"
      - id: not_secured
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) LANGUAGE OLEDB EXTERNAL NAME 'srv!tbl' NOT SECURED;"
      - id: secured
        sql: "CREATE FUNCTION f () RETURNS TABLE (c INTEGER) LANGUAGE OLEDB EXTERNAL NAME 'srv!tbl' SECURED;"
    examples:
      - |-
        CREATE FUNCTION orders ()
          RETURNS TABLE (orderid INTEGER,
                         customerid CHAR(5),
                         employeeid INTEGER,
                         orderdate TIMESTAMP,
                         requireddate TIMESTAMP,
                         shippeddate TIMESTAMP,
                         shipvia INTEGER,
                         freight dec(19,4))
          LANGUAGE OLEDB
          EXTERNAL NAME '!orders!Provider=Microsoft.Jet.OLEDB.3.51;Data Source=c:\sqllib\samples\oledb\nwind.mdb!COLLATING_SEQUENCE=Y';
      - |-
        CREATE FUNCTION customers ()
          RETURNS TABLE (customer_id INTEGER,
                         name VARCHAR(20),
                         address VARCHAR(20),
                         city VARCHAR(20),
                         state VARCHAR(5),
                         zip_code INTEGER)
          LANGUAGE OLEDB
          EXTERNAL NAME 'spirit!demo.customer';
      - |-
        CREATE FUNCTION favorites (varchar(600))
          RETURNS TABLE (store_id CHAR(4),
                         name VARCHAR(41),
                         sales INTEGER)
          SPECIFIC favorites
          LANGUAGE OLEDB
          EXTERNAL NAME '!!Provider=SQLOLEDB.1;Persist Security Info=False;User ID=sa;Initial Catalog=pubs;Data Source=WALTZ;Locale Identifier=1033;Use Procedure for Prepare=1;Auto Translate=False;Packet Size=4096;Workstation ID=WALTZ;OLE DB Services=CLIENTCURSOR;';
