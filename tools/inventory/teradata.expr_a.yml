    tier: high
    probes:
      - { id: plain, sql: "SELECT 'abc';" }
      - { id: empty, sql: "SELECT '';" }
      - { id: embedded_apostrophe, sql: "SELECT 'it''s';" }
      - { id: multiline, sql: "SELECT 'line one\nline two';" }
      - { id: adjacent_concatenated, sql: "SELECT 'abc' 'def';" }
      - { id: latin, sql: "SELECT _Latin 'abc';" }
      - { id: unicode, sql: "SELECT _Unicode 'abc';" }
      - { id: kanjisjis, sql: "SELECT _KanjiSJIS 'abc';" }
      - { id: graphic, sql: "SELECT _Graphic 'abc';" }

