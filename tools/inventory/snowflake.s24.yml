dialect: snowflake
engine: Snowflake
version: "current (docs read 2026-10-04)"
source: https://docs.snowflake.com/en/sql-reference/sql-all

statements:
  - id: create_notification_integration_queue_outbound_aws
    name: CREATE NOTIFICATION INTEGRATION (outbound to an Amazon SNS topic)
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-notification-integration-queue-outbound-aws
    tier: low
    probes:
      - id: basic
        sql: "CREATE NOTIFICATION INTEGRATION ni ENABLED = TRUE TYPE = QUEUE DIRECTION = OUTBOUND NOTIFICATION_PROVIDER = AWS_SNS AWS_SNS_TOPIC_ARN = 'arn:aws:sns:us-east-1:111111111111:topic' AWS_SNS_ROLE_ARN = 'arn:aws:iam::111111111111:role/r' COMMENT = 'c';"
      - id: or_replace_if_not_exists
        sql: "CREATE OR REPLACE NOTIFICATION INTEGRATION IF NOT EXISTS ni ENABLED = FALSE TYPE = QUEUE DIRECTION = OUTBOUND NOTIFICATION_PROVIDER = AWS_SNS AWS_SNS_TOPIC_ARN = 'arn:aws:sns:us-east-1:111111111111:topic' AWS_SNS_ROLE_ARN = 'arn:aws:iam::111111111111:role/r';"

  - id: create_notification_integration_queue_outbound_azure
    name: CREATE NOTIFICATION INTEGRATION (outbound to an Azure Event Grid topic)
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-notification-integration-queue-outbound-azure
    tier: low
    probes:
      - id: basic
        sql: "CREATE NOTIFICATION INTEGRATION ni ENABLED = TRUE TYPE = QUEUE DIRECTION = OUTBOUND NOTIFICATION_PROVIDER = AZURE_EVENT_GRID AZURE_EVENT_GRID_TOPIC_ENDPOINT = 'https://topic.eastus-1.eventgrid.azure.net/api/events' AZURE_TENANT_ID = 'tenant-id' COMMENT = 'c';"

  - id: create_notification_integration_queue_outbound_gcp
    name: CREATE NOTIFICATION INTEGRATION (outbound to a Google Pub/Sub topic)
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-notification-integration-queue-outbound-gcp
    tier: low
    probes:
      - id: basic
        sql: "CREATE NOTIFICATION INTEGRATION ni ENABLED = TRUE TYPE = QUEUE DIRECTION = OUTBOUND NOTIFICATION_PROVIDER = GCP_PUBSUB GCP_PUBSUB_TOPIC_NAME = 'projects/p/topics/t' COMMENT = 'c';"

  - id: create_notification_integration_webhooks
    name: CREATE NOTIFICATION INTEGRATION (webhooks)
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-notification-integration-webhooks
    tier: low
    probes:
      - id: basic
        sql: "CREATE NOTIFICATION INTEGRATION ni TYPE = WEBHOOK ENABLED = TRUE WEBHOOK_URL = 'https://example.com/hook';"
      - id: secret_body_headers
        sql: "CREATE NOTIFICATION INTEGRATION IF NOT EXISTS ni TYPE = WEBHOOK ENABLED = TRUE WEBHOOK_URL = 'https://example.com/hook' WEBHOOK_SECRET = db.sch.sec WEBHOOK_BODY_TEMPLATE = '{\"text\": \"SNOWFLAKE_WEBHOOK_MESSAGE\"}' WEBHOOK_HEADERS = ('Content-Type' = 'application/json', 'X-Key' = 'v') COMMENT = 'c';"

  - id: create_openflow_connector
    name: CREATE OPENFLOW CONNECTOR
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-openflow-connector
    tier: low
    probes:
      - id: from_definition
        sql: "CREATE OPENFLOW CONNECTOR IF NOT EXISTS c IN RUNTIME rt FROM DEFINITION def1 DISPLAY_NAME = 'Conn' COMMENT = 'c';"
      - id: from_stage
        sql: "CREATE OPENFLOW CONNECTOR IF NOT EXISTS c IN RUNTIME rt FROM '@s/path/connector.json' COMMENT = 'c';"

  - id: create_openflow_deployment
    name: CREATE OPENFLOW DEPLOYMENT
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-openflow-deployment
    tier: low
    probes:
      - id: basic
        sql: "CREATE OPENFLOW DEPLOYMENT IF NOT EXISTS d DEPLOYMENT_TYPE = BYOC VPC_TYPE = 'MANAGED' USE_PRIVATE_LINK = TRUE USE_USER_AUTH_OVER_PRIVATE_LINK = FALSE CUSTOM_INGRESS_HOSTNAME = 'host.example.com' DISPLAY_NAME = 'D' COMMENT = 'c' EVENT_TABLE = 'db.sch.events';"

  - id: create_openflow_runtime
    name: CREATE OPENFLOW RUNTIME
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-openflow-runtime
    tier: low
    probes:
      - id: basic
        sql: "CREATE OPENFLOW RUNTIME IF NOT EXISTS db.sch.rt IN DEPLOYMENT d NODE_TYPE = SMALL NODE_TYPE_TIER = 'S1' MIN_NODES = 1 MAX_NODES = 2 EXECUTE_AS_ROLE = r EXTERNAL_ACCESS_INTEGRATIONS = (eai1, eai2) DISPLAY_NAME = 'RT' COMMENT = 'c';"

  - id: create_organization_account
    name: CREATE ORGANIZATION ACCOUNT
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-organization-account
    tier: low
    probes:
      - id: admin_password
        sql: "CREATE ORGANIZATION ACCOUNT a ADMIN_NAME = admin ADMIN_PASSWORD = 'p4ssw0rd' FIRST_NAME = 'A' LAST_NAME = 'B' EMAIL = 'a@example.com' MUST_CHANGE_PASSWORD = TRUE EDITION = ENTERPRISE REGION_GROUP = PUBLIC REGION = AWS_US_WEST_2 COMMENT = 'c';"
      - id: admin_rsa_key
        sql: "CREATE ORGANIZATION ACCOUNT a ADMIN_NAME = admin ADMIN_RSA_PUBLIC_KEY = 'MIIBIjANBgkqh' EMAIL = 'a@example.com' EDITION = BUSINESS_CRITICAL;"

  - id: create_organization_listing
    name: CREATE ORGANIZATION LISTING
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-organization-listing
    tier: low
    probes:
      - id: share_as_manifest
        sql: "CREATE ORGANIZATION LISTING IF NOT EXISTS l SHARE sh AS 'title: t' PUBLISH = TRUE;"
      - id: application_package_from_stage
        sql: "CREATE ORGANIZATION LISTING IF NOT EXISTS l APPLICATION PACKAGE pkg FROM '@s/manifest.yml' PUBLISH = FALSE;"

  - id: create_organization_profile
    name: CREATE ORGANIZATION PROFILE
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-organization-profile
    tier: low
    probes:
      - id: basic
        sql: "CREATE ORGANIZATION PROFILE IF NOT EXISTS p;"
      - id: as_manifest
        sql: "CREATE ORGANIZATION PROFILE IF NOT EXISTS p AS 'title: t' VERSION v1 PUBLISH = TRUE;"
      - id: from_stage
        sql: "CREATE ORGANIZATION PROFILE IF NOT EXISTS p FROM @s/dir VERSION v1 PUBLISH = FALSE;"

  - id: create_organization_user
    name: CREATE ORGANIZATION USER
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-organization-user
    tier: low
    probes:
      - id: basic
        sql: "CREATE ORGANIZATION USER IF NOT EXISTS u EMAIL = 'u@example.com' LOGIN_NAME = 'u' DISPLAY_NAME = 'U' FIRST_NAME = 'F' MIDDLE_NAME = 'M' LAST_NAME = 'L' TYPE = PERSON COMMENT = 'c';"

  - id: create_organization_user_group
    name: CREATE ORGANIZATION USER GROUP
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-organization-user-group
    tier: low
    probes:
      - id: basic
        sql: "CREATE ORGANIZATION USER GROUP IF NOT EXISTS g IS_GRANTABLE = TRUE;"

  - id: create_packages_policy
    name: CREATE PACKAGES POLICY
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-packages-policy
    tier: low
    probes:
      - id: basic
        sql: "CREATE PACKAGES POLICY IF NOT EXISTS pp LANGUAGE PYTHON ALLOWLIST = ('numpy', 'pandas==2.0.0') BLOCKLIST = ('scipy') ADDITIONAL_CREATION_BLOCKLIST = ('torch') COMMENT = 'c';"

  - id: create_password_policy
    name: CREATE PASSWORD POLICY
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-password-policy
    tier: low
    probes:
      - id: basic
        sql: "CREATE OR REPLACE PASSWORD POLICY IF NOT EXISTS pwp PASSWORD_MIN_LENGTH = 12 PASSWORD_MAX_LENGTH = 24 PASSWORD_MIN_UPPER_CASE_CHARS = 2 PASSWORD_MIN_LOWER_CASE_CHARS = 2 PASSWORD_MIN_NUMERIC_CHARS = 2 PASSWORD_MIN_SPECIAL_CHARS = 2 PASSWORD_MIN_AGE_DAYS = 1 PASSWORD_MAX_AGE_DAYS = 30 PASSWORD_MAX_RETRIES = 3 PASSWORD_LOCKOUT_TIME_MINS = 30 PASSWORD_HISTORY = 5 COMMENT = 'c';"

  - id: create_postgres_instance
    name: CREATE POSTGRES INSTANCE
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-postgres-instance
    tier: low
    probes:
      - id: basic
        sql: "CREATE POSTGRES INSTANCE IF NOT EXISTS pg COMPUTE_FAMILY = 'STANDARD_M' STORAGE_SIZE_GB = 100 AUTHENTICATION_AUTHORITY = POSTGRES POSTGRES_VERSION = 17 NETWORK_POLICY = 'np' HIGH_AVAILABILITY = TRUE STORAGE_INTEGRATION = 'si' POSTGRES_SETTINGS = '{\"a\": \"b\"}' COMMENT = 'c' WITH TAG (t = 'v');"
      - id: fork
        sql: "CREATE POSTGRES INSTANCE IF NOT EXISTS pg2 FORK pg AT (TIMESTAMP => '2026-01-01 00:00:00'::TIMESTAMP_LTZ) COMPUTE_FAMILY = 'STANDARD_M' STORAGE_SIZE_GB = 100 HIGH_AVAILABILITY = FALSE POSTGRES_SETTINGS = '{}' COMMENT = 'c' TAG (t = 'v');"

  - id: create_privacy_policy
    name: CREATE PRIVACY POLICY
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-privacy-policy
    tier: low
    probes:
      - id: basic
        sql: "CREATE PRIVACY POLICY IF NOT EXISTS pr AS () RETURNS PRIVACY_BUDGET -> PRIVACY_BUDGET(BUDGET_NAME => 'b') COMMENT = 'c';"

  - id: create_projection_policy
    name: CREATE PROJECTION POLICY
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-projection-policy
    tier: low
    probes:
      - id: basic
        sql: "CREATE PROJECTION POLICY IF NOT EXISTS pj AS () RETURNS PROJECTION_CONSTRAINT -> PROJECTION_CONSTRAINT(ALLOW => true) COMMENT = 'c';"

  - id: create_provisioned_throughput
    name: CREATE PROVISIONED THROUGHPUT
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-provisioned-throughput
    tier: low
    probes:
      - id: basic
        sql: "CREATE OR REPLACE PROVISIONED THROUGHPUT pt CLOUD_PROVIDER = 'AWS' MODEL = 'claude-3-5-sonnet' PTUS = 10 TERM_START = '2026-01-01' TERM_END = '2026-12-31';"

  - id: create_replication_group
    name: CREATE REPLICATION GROUP
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-replication-group
    tier: low
    probes:
      - id: primary
        sql: "CREATE REPLICATION GROUP IF NOT EXISTS rg OBJECT_TYPES = DATABASES, SHARES ALLOWED_DATABASES = db1, db2 ALLOWED_EXTERNAL_VOLUMES = ev1 ALLOWED_SHARES = sh1 ALLOWED_INTEGRATION_TYPES = SECURITY INTEGRATIONS ALLOWED_ACCOUNTS = myorg.acct2 IGNORE EDITION CHECK REPLICATION_SCHEDULE = '10 MINUTE' WITH TAG (t = 'v') ERROR_INTEGRATION = ei;"
      - id: cron_schedule
        sql: "CREATE REPLICATION GROUP rg OBJECT_TYPES = DATABASES ALLOWED_DATABASES = db1 ALLOWED_ACCOUNTS = myorg.acct2 REPLICATION_SCHEDULE = 'USING CRON 0 0 * * * UTC';"
      - id: secondary
        sql: "CREATE REPLICATION GROUP IF NOT EXISTS rg2 AS REPLICA OF myorg.acct1.rg;"

  - id: create_resource_monitor
    name: CREATE RESOURCE MONITOR
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-resource-monitor
    tier: low
    probes:
      - id: full
        sql: "CREATE OR REPLACE RESOURCE MONITOR IF NOT EXISTS rm WITH CREDIT_QUOTA = 100 FREQUENCY = MONTHLY START_TIMESTAMP = IMMEDIATELY END_TIMESTAMP = '2027-01-01 00:00' NOTIFY_USERS = (u1, u2) TRIGGERS ON 75 PERCENT DO NOTIFY ON 100 PERCENT DO SUSPEND ON 110 PERCENT DO SUSPEND_IMMEDIATE;"

  - id: create_restricted_session_scope
    name: CREATE RESTRICTED SESSION SCOPE
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-restricted-session-scope
    tier: low
    probes:
      - id: basic
        sql: |-
          CREATE RESTRICTED SESSION SCOPE IF NOT EXISTS rss1 COMMENT = 'c' AS $$
          version: 1
          $$;
      - id: rss_alias_or_alter
        sql: |-
          CREATE OR ALTER RSS rss1 AS $$
          version: 1
          $$;

  - id: create_security_integration
    name: CREATE SECURITY INTEGRATION
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-security-integration
    tier: low
    probes:
      - id: or_replace_if_not_exists
        sql: "CREATE OR REPLACE SECURITY INTEGRATION IF NOT EXISTS si TYPE = SCIM ENABLED = TRUE SCIM_CLIENT = 'OKTA' RUN_AS_ROLE = 'OKTA_PROVISIONER';"
        note: The generic page only gives the CREATE [ OR REPLACE ] SECURITY INTEGRATION [ IF NOT EXISTS ] <name> TYPE = ... prefix; the body is a concrete type from the per-type pages.

  - id: create_security_integration_external_api_authentication
    name: CREATE SECURITY INTEGRATION (External API Authentication)
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-security-integration-api-auth
    tier: low
    probes:
      - id: oauth_client_credentials
        sql: "CREATE SECURITY INTEGRATION si TYPE = API_AUTHENTICATION AUTH_TYPE = OAUTH2 ENABLED = TRUE OAUTH_TOKEN_ENDPOINT = 'https://example.com/token' OAUTH_CLIENT_AUTH_METHOD = CLIENT_SECRET_POST OAUTH_CLIENT_ID = 'id' OAUTH_CLIENT_SECRET = 'secret' OAUTH_GRANT = 'CLIENT_CREDENTIALS' OAUTH_ACCESS_TOKEN_VALIDITY = 3600 OAUTH_ALLOWED_SCOPES = ('s1', 's2') COMMENT = 'c';"
      - id: oauth_authorization_code
        sql: "CREATE SECURITY INTEGRATION si TYPE = API_AUTHENTICATION AUTH_TYPE = OAUTH2 ENABLED = TRUE OAUTH_AUTHORIZATION_ENDPOINT = 'https://example.com/auth' OAUTH_TOKEN_ENDPOINT = 'https://example.com/token' OAUTH_CLIENT_AUTH_METHOD = CLIENT_SECRET_BASIC OAUTH_CLIENT_ID = 'id' OAUTH_CLIENT_SECRET = 'secret' OAUTH_GRANT = 'AUTHORIZATION_CODE' OAUTH_ACCESS_TOKEN_VALIDITY = 3600 OAUTH_REFRESH_TOKEN_VALIDITY = 86400 COMMENT = 'c';"
      - id: oauth_jwt_bearer
        sql: "CREATE SECURITY INTEGRATION si TYPE = API_AUTHENTICATION AUTH_TYPE = OAUTH2 ENABLED = TRUE OAUTH_TOKEN_ENDPOINT = 'https://example.com/token' OAUTH_CLIENT_ID = 'id' OAUTH_CLIENT_SECRET = 'secret' OAUTH_GRANT = 'JWT_BEARER' OAUTH_REFRESH_TOKEN_VALIDITY = 86400;"

  - id: create_security_integration_external_secret_provider
    name: CREATE SECURITY INTEGRATION (External secret provider)
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-security-integration-api-auth-external-secret-provider
    tier: low
    probes:
      - id: aws_secrets_manager
        sql: "CREATE OR REPLACE SECURITY INTEGRATION IF NOT EXISTS si TYPE = API_AUTHENTICATION AUTH_TYPE = WORKLOAD_IDENTITY_FEDERATION API_PROVIDER = AWS_SECRETS_MANAGER ENABLED = TRUE AWS_ROLE_ARN = 'arn:aws:iam::111111111111:role/r' AWS_REGION = 'us-east-1' COMMENT = 'c';"
      - id: azure_key_vault
        sql: "CREATE SECURITY INTEGRATION si TYPE = API_AUTHENTICATION AUTH_TYPE = WORKLOAD_IDENTITY_FEDERATION API_PROVIDER = AZURE_KEY_VAULT ENABLED = TRUE AZURE_TENANT_ID = 'tenant' AZURE_AD_APPLICATION_ID = 'app' AZURE_KEY_VAULT_URI = 'https://kv.vault.azure.net';"
      - id: gcp_secret_manager
        sql: "CREATE SECURITY INTEGRATION si TYPE = API_AUTHENTICATION AUTH_TYPE = WORKLOAD_IDENTITY_FEDERATION API_PROVIDER = GCP_SECRET_MANAGER ENABLED = TRUE GCP_SECRET_MANAGER_PROJECT = 'proj' GCP_WIF_PROVIDER = 'prov' GCP_SERVICE_ACCOUNT_EMAIL = 'sa@proj.iam.gserviceaccount.com';"

  - id: create_security_integration_aws_iam_authentication
    name: CREATE SECURITY INTEGRATION (AWS IAM Authentication)
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-security-integration-aws-iam
    tier: low
    probes:
      - id: basic
        sql: "CREATE SECURITY INTEGRATION si TYPE = API_AUTHENTICATION AUTH_TYPE = AWS_IAM AWS_ROLE_ARN = 'arn:aws:iam::111111111111:role/r' ENABLED = TRUE COMMENT = 'c';"

  - id: create_security_integration_external_oauth
    name: CREATE SECURITY INTEGRATION (External OAuth)
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-security-integration-oauth-external
    tier: low
    probes:
      - id: basic
        sql: "CREATE OR REPLACE SECURITY INTEGRATION IF NOT EXISTS si TYPE = EXTERNAL_OAUTH ENABLED = TRUE EXTERNAL_OAUTH_TYPE = OKTA EXTERNAL_OAUTH_ISSUER = 'https://example.okta.com' EXTERNAL_OAUTH_TOKEN_USER_MAPPING_CLAIM = 'sub' EXTERNAL_OAUTH_SNOWFLAKE_USER_MAPPING_ATTRIBUTE = 'LOGIN_NAME' EXTERNAL_OAUTH_JWS_KEYS_URL = 'https://example.okta.com/keys' EXTERNAL_OAUTH_BLOCKED_ROLES_LIST = ('r1') EXTERNAL_OAUTH_ALLOWED_ROLES_LIST = ('r2') EXTERNAL_OAUTH_AUDIENCE_LIST = ('aud') EXTERNAL_OAUTH_ANY_ROLE_MODE = ENABLE EXTERNAL_OAUTH_SCOPE_DELIMITER = ',' EXTERNAL_OAUTH_SCOPE_MAPPING_ATTRIBUTE = 'scp' IS_AGENTIC = FALSE NETWORK_POLICY = 'np' COMMENT = 'c';"
      - id: list_valued_mapping_and_rsa_key
        sql: "CREATE SECURITY INTEGRATION si TYPE = EXTERNAL_OAUTH ENABLED = TRUE EXTERNAL_OAUTH_TYPE = CUSTOM EXTERNAL_OAUTH_ISSUER = 'https://issuer' EXTERNAL_OAUTH_TOKEN_USER_MAPPING_CLAIM = ('upn', 'email') EXTERNAL_OAUTH_SNOWFLAKE_USER_MAPPING_ATTRIBUTE = 'EMAIL_ADDRESS' EXTERNAL_OAUTH_JWS_KEYS_URL = ('https://k1', 'https://k2') EXTERNAL_OAUTH_RSA_PUBLIC_KEY = 'MIIBIjANBgkqh' EXTERNAL_OAUTH_RSA_PUBLIC_KEY_2 = 'MIIBIjANBgkqh2';"

  - id: create_security_integration_snowflake_oauth
    name: CREATE SECURITY INTEGRATION (Snowflake OAuth)
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-security-integration-oauth-snowflake
    tier: low
    probes:
      - id: partner_application
        sql: "CREATE OR REPLACE SECURITY INTEGRATION IF NOT EXISTS si TYPE = OAUTH OAUTH_CLIENT = LOOKER OAUTH_REDIRECT_URI = 'https://example.com/cb' ENABLED = TRUE OAUTH_ISSUE_REFRESH_TOKENS = TRUE OAUTH_ACCESS_TOKEN_VALIDITY = 600 OAUTH_REFRESH_TOKEN_VALIDITY = 86400 OAUTH_SINGLE_USE_REFRESH_TOKENS_REQUIRED = FALSE OAUTH_USE_SECONDARY_ROLES = IMPLICIT NETWORK_POLICY = 'np' ALLOWED_ROLES_LIST = ('r1') BLOCKED_ROLES_LIST = ('SYSADMIN') USE_PRIVATELINK_FOR_AUTHORIZATION_ENDPOINT = FALSE COMMENT = 'c';"
      - id: custom_client
        sql: "CREATE SECURITY INTEGRATION si TYPE = OAUTH OAUTH_CLIENT = CUSTOM OAUTH_CLIENT_TYPE = 'CONFIDENTIAL' OAUTH_REDIRECT_URI = 'https://example.com/cb' ENABLED = TRUE OAUTH_ALLOW_NON_TLS_REDIRECT_URI = FALSE OAUTH_ENFORCE_PKCE = TRUE OAUTH_ENABLE_ROLE_SELECTION = FALSE OAUTH_CLIENT_RSA_PUBLIC_KEY = 'MIIBIjANBgkqh' OAUTH_CLIENT_RSA_PUBLIC_KEY_2 = 'MIIBIjANBgkqh2' IS_AGENTIC = FALSE;"

  - id: create_security_integration_oidc
    name: CREATE SECURITY INTEGRATION (OIDC)
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-security-integration-oidc
    tier: low
    probes:
      - id: custom_provider
        sql: "CREATE OR REPLACE SECURITY INTEGRATION IF NOT EXISTS si TYPE = OIDC ENABLED = TRUE OIDC_PROVIDER = 'CUSTOM' OIDC_ISSUER = 'https://issuer' OIDC_CLIENT_ID = 'id' OIDC_CLIENT_SECRET = 'secret' OIDC_TOKEN_USER_MAPPING_CLAIM = 'email' OIDC_SNOWFLAKE_USER_MAPPING_ATTRIBUTE = 'EMAIL_ADDRESS' OIDC_LOGIN_PAGE_LABEL = 'Sign in' OIDC_ENABLE_SSO_LOGIN_PAGE = TRUE OIDC_SCOPES = ('openid', 'email') OIDC_AUTHORIZATION_ENDPOINT = 'https://issuer/auth' OIDC_TOKEN_ENDPOINT = 'https://issuer/token' OIDC_JWKS_URI = 'https://issuer/jwks' OIDC_USERINFO_ENDPOINT = 'https://issuer/userinfo' ALLOWED_USER_DOMAINS = ('example.com') ALLOWED_EMAIL_PATTERNS = ('.*@example.com') COMMENT = 'c';"
      - id: managed_google
        sql: "CREATE SECURITY INTEGRATION si TYPE = OIDC ENABLED = TRUE OIDC_PROVIDER = 'GOOGLE' OIDC_ALLOWED_GOOGLE_HOSTED_DOMAINS = ('example.com') OIDC_ENABLE_SSO_LOGIN_PAGE = TRUE;"
      - id: managed_microsoft
        sql: "CREATE SECURITY INTEGRATION si TYPE = OIDC ENABLED = TRUE OIDC_PROVIDER = 'MICROSOFT' OIDC_ALLOWED_MSFT_TENANTS = ('tenant-id') OIDC_ENABLE_SSO_LOGIN_PAGE = FALSE;"

  - id: create_security_integration_saml2
    name: CREATE SECURITY INTEGRATION (SAML2)
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-security-integration-saml2
    tier: low
    probes:
      - id: idp_parameters
        sql: "CREATE OR REPLACE SECURITY INTEGRATION IF NOT EXISTS si TYPE = SAML2 ENABLED = TRUE SAML2_ISSUER = 'https://idp' SAML2_SSO_URL = 'https://idp/sso' SAML2_PROVIDER = 'CUSTOM' SAML2_X509_CERT = 'MIIDdzCC' ALLOWED_USER_DOMAINS = ('example.com') ALLOWED_EMAIL_PATTERNS = ('.*@example.com') SAML2_SP_INITIATED_LOGIN_PAGE_LABEL = 'IdP' SAML2_ENABLE_SP_INITIATED = TRUE SAML2_SNOWFLAKE_X509_CERT = 'MIIDdzCC' SAML2_SIGN_REQUEST = TRUE SAML2_REQUESTED_NAMEID_FORMAT = 'urn:oasis:names:tc:SAML:1.1:nameid-format:emailAddress' SAML2_POST_LOGOUT_REDIRECT_URL = 'https://logout' SAML2_FORCE_AUTHN = FALSE SAML2_SNOWFLAKE_ISSUER_URL = 'https://acct.snowflakecomputing.com' SAML2_SNOWFLAKE_ACS_URL = 'https://acct.snowflakecomputing.com/fed/login' COMMENT = 'c';"
      - id: metadata_url
        sql: "CREATE SECURITY INTEGRATION si TYPE = SAML2 ENABLED = TRUE METADATA_URL = 'https://idp/metadata';"

  - id: create_security_integration_scim
    name: CREATE SECURITY INTEGRATION (SCIM)
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-security-integration-scim
    tier: low
    probes:
      - id: basic
        sql: "CREATE OR REPLACE SECURITY INTEGRATION IF NOT EXISTS si TYPE = SCIM ENABLED = TRUE SCIM_CLIENT = 'OKTA' RUN_AS_ROLE = 'OKTA_PROVISIONER' NETWORK_POLICY = 'np' SYNC_PASSWORD = FALSE COMMENT = 'c';"

  - id: create_service
    name: CREATE SERVICE
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-service
    tier: low
    probes:
      - id: from_stage_specification_file
        sql: "CREATE SERVICE IF NOT EXISTS svc IN COMPUTE POOL cp FROM @s SPECIFICATION_FILE = 'spec.yaml' AUTO_SUSPEND_SECS = 600 EXTERNAL_ACCESS_INTEGRATIONS = (eai1, eai2) AUTO_RESUME = TRUE MIN_INSTANCES = 1 MIN_READY_INSTANCES = 1 MAX_INSTANCES = 2 LOG_LEVEL = 'INFO' QUERY_WAREHOUSE = wh WITH TAG (t = 'v') COMMENT = 'c';"
      - id: from_inline_specification
        sql: |-
          CREATE SERVICE svc IN COMPUTE POOL cp FROM SPECIFICATION $$
          spec:
            containers:
            - name: main
              image: /db/sch/repo/img:latest
          $$;
      - id: from_specification_template_file
        sql: "CREATE SERVICE svc IN COMPUTE POOL cp FROM @s SPECIFICATION_TEMPLATE_FILE = 'spec.yaml' USING (tag => 'latest', port => 8080);"
      - id: from_inline_specification_template
        sql: |-
          CREATE SERVICE svc IN COMPUTE POOL cp FROM SPECIFICATION_TEMPLATE $$
          spec:
            containers:
            - name: main
              image: /db/sch/repo/img:{{ tag }}
          $$ USING (tag => 'latest');

  - id: create_session_policy
    name: CREATE SESSION POLICY
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-session-policy
    tier: low
    probes:
      - id: basic
        sql: "CREATE OR REPLACE SESSION POLICY IF NOT EXISTS sp SESSION_IDLE_TIMEOUT_MINS = 60 SESSION_UI_IDLE_TIMEOUT_MINS = 30 SESSION_MAX_LIFESPAN_MINS = 480 SESSION_UI_MAX_LIFESPAN_MINS = 240 ALLOWED_SECONDARY_ROLES = ('ALL') BLOCKED_SECONDARY_ROLES = (r1, r2) AGENT_RESTRICTED_SESSION_SCOPE = 'rss_obj' COMMENT = 'c';"
      - id: agent_scope_inline_yaml
        sql: |-
          CREATE SESSION POLICY sp AGENT_RESTRICTED_SESSION_SCOPE = $$
          version: 1
          $$;

  - id: create_snapshot
    name: CREATE SNAPSHOT
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-snapshot
    tier: low
    probes:
      - id: basic
        sql: "CREATE OR REPLACE SNAPSHOT IF NOT EXISTS snap FROM SERVICE svc VOLUME \"vol\" INSTANCE 0 COMMENT = 'c' WITH TAG (t = 'v');"

  - id: create_snapshot_policy_deprecated
    name: CREATE SNAPSHOT POLICY — Deprecated
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-snapshot-policy
    tier: low
    probes:
      - id: basic
        sql: "CREATE OR REPLACE SNAPSHOT POLICY IF NOT EXISTS spol WITH TAG (t = 'v') WITH RETENTION LOCK SCHEDULE = '60 MINUTE' EXPIRE_AFTER_DAYS = 7 COMMENT = 'c';"

  - id: create_snapshot_set_deprecated
    name: CREATE SNAPSHOT SET — Deprecated
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-snapshot-set
    tier: low
    probes:
      - id: for_table
        sql: "CREATE OR REPLACE SNAPSHOT SET IF NOT EXISTS ss FOR DYNAMIC TABLE t WITH TAG (t1 = 'v') WITH SNAPSHOT POLICY spol COMMENT = 'c';"
      - id: for_schema
        sql: "CREATE SNAPSHOT SET ss FOR SCHEMA sch WITH SNAPSHOT POLICY spol;"
      - id: for_database
        sql: "CREATE SNAPSHOT SET ss FOR DATABASE db COMMENT = 'c';"

  - id: create_storage_lifecycle_policy
    name: CREATE STORAGE LIFECYCLE POLICY
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-storage-lifecycle-policy
    tier: low
    probes:
      - id: basic
        sql: "CREATE OR REPLACE STORAGE LIFECYCLE POLICY IF NOT EXISTS slp AS (d DATE) RETURNS BOOLEAN -> d < DATEADD(DAY, -30, CURRENT_DATE()) ARCHIVE_TIER = COOL ARCHIVE_FOR_DAYS = 90 COMMENT = 'c' WITH TAG (t = 'v');"

  - id: create_streamlit
    name: CREATE STREAMLIT
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-streamlit
    tier: low
    probes:
      - id: basic
        sql: "CREATE OR REPLACE STREAMLIT IF NOT EXISTS app FROM @s/dir MAIN_FILE = 'app.py' QUERY_WAREHOUSE = wh RUNTIME_NAME = 'rt' COMPUTE_POOL = cp COMMENT = 'c' TITLE = 'App' IMPORTS = ('@s/lib.zip') EXTERNAL_ACCESS_INTEGRATIONS = (eai) SECRETS = ('k' = db.sch.sec);"
      - id: legacy_root_location
        sql: "CREATE STREAMLIT IF NOT EXISTS app ROOT_LOCATION = '@s/dir' MAIN_FILE = 'app.py' QUERY_WAREHOUSE = wh COMMENT = 'c' TITLE = 'App' IMPORTS = ('@s/lib.zip') EXTERNAL_ACCESS_INTEGRATIONS = (eai);"

  - id: describe_agent
    name: DESCRIBE AGENT
    doc: https://docs.snowflake.com/en/sql-reference/sql/desc-agent
    tier: low
    probes:
      - id: desc
        sql: "DESC AGENT a;"
      - id: describe_as_resource
        sql: "DESCRIBE AS RESOURCE AGENT a;"

  - id: describe_aggregation_policy
    name: DESCRIBE AGGREGATION POLICY
    doc: https://docs.snowflake.com/en/sql-reference/sql/desc-aggregation-policy
    tier: low
    probes:
      - id: desc
        sql: "DESC AGGREGATION POLICY ap;"
      - id: describe
        sql: "DESCRIBE AGGREGATION POLICY ap;"
