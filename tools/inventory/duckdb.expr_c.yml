      - { id: search_replace, sql: "SELECT replace(s, 'a', 'b'), translate(s, 'abc', 'xyz'), contains(s, 'a'), starts_with(s, 'a'), ends_with(s, 'a'), instr(s, 'a') FROM t;" }
      - { id: split, sql: "SELECT string_split(s, ','), str_split(s, ','), split_part(s, ',', 1), string_to_array(s, ',') FROM t;" }
      - { id: length_functions, sql: "SELECT length(s), len(s), char_length(s), bit_length(s), octet_length(s), strlen(s) FROM t;" }
