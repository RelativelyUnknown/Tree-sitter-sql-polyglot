    name: CREATE FUNCTION
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/lnpls/CREATE-FUNCTION-statement.html
    tier: high
    probes:
      - id: basic
        sql: "CREATE FUNCTION f RETURN NUMBER IS BEGIN RETURN 1; END;"
      - id: or_replace_params
        sql: "CREATE OR REPLACE FUNCTION s.f (a IN NUMBER, b VARCHAR2 DEFAULT 'x') RETURN VARCHAR2 AS BEGIN RETURN b || a; END f;"
      - id: if_not_exists
        sql: "CREATE FUNCTION IF NOT EXISTS f (a NUMBER) RETURN NUMBER IS BEGIN RETURN a; END;"
      - id: editionable
        sql: "CREATE OR REPLACE EDITIONABLE FUNCTION f RETURN NUMBER IS BEGIN RETURN 1; END;"
      - id: noneditionable
        sql: "CREATE NONEDITIONABLE FUNCTION f RETURN NUMBER IS BEGIN RETURN 1; END;"
      - id: declare_section
        sql: "CREATE FUNCTION f (acc_no IN NUMBER) RETURN NUMBER IS acc_bal NUMBER(11,2); BEGIN SELECT c INTO acc_bal FROM t WHERE id = acc_no; RETURN acc_bal; END;"
      - id: out_in_out_nocopy_params
        sql: "CREATE FUNCTION f (a IN NUMBER, b OUT NUMBER, c IN OUT NOCOPY VARCHAR2, d NUMBER := 0) RETURN NUMBER IS BEGIN b := a; RETURN a; END;"
      - id: anchored_types
        sql: "CREATE FUNCTION f (a t.c%TYPE) RETURN t%ROWTYPE IS r t%ROWTYPE; BEGIN SELECT * INTO r FROM t WHERE c = a; RETURN r; END;"
      - id: exception_section
        sql: "CREATE FUNCTION f (a NUMBER) RETURN NUMBER IS BEGIN RETURN 1 / a; EXCEPTION WHEN ZERO_DIVIDE THEN RETURN NULL; END;"
      - id: deterministic
        sql: "CREATE OR REPLACE FUNCTION f (a CLOB) RETURN NUMBER DETERMINISTIC IS BEGIN RETURN DBMS_LOB.GETLENGTH(a); END;"
      - id: authid_current_user
        sql: "CREATE FUNCTION f RETURN NUMBER AUTHID CURRENT_USER IS BEGIN RETURN 1; END;"
      - id: authid_definer
        sql: "CREATE FUNCTION f RETURN NUMBER AUTHID DEFINER AS BEGIN RETURN 1; END;"
      - id: accessible_by
        sql: "CREATE FUNCTION f RETURN NUMBER ACCESSIBLE BY (PACKAGE s.pkg, PROCEDURE p) IS BEGIN RETURN 1; END;"
      - id: default_collation
        sql: "CREATE FUNCTION f RETURN VARCHAR2 DEFAULT COLLATION USING_NLS_COMP IS BEGIN RETURN 'x'; END;"
      - id: result_cache
        sql: "CREATE FUNCTION f (a NUMBER) RETURN NUMBER RESULT_CACHE IS BEGIN RETURN a; END;"
      - id: result_cache_relies_on
        sql: "CREATE FUNCTION f (a NUMBER) RETURN NUMBER RESULT_CACHE RELIES_ON (t, u) IS BEGIN RETURN a; END;"
      - id: parallel_enable
        sql: "CREATE FUNCTION f (c SYS_REFCURSOR) RETURN num_tab PIPELINED PARALLEL_ENABLE (PARTITION c BY ANY) IS BEGIN RETURN; END;"
      - id: parallel_enable_hash_streaming
        sql: "CREATE FUNCTION f (c ref_cur_t) RETURN num_tab PIPELINED PARALLEL_ENABLE (PARTITION c BY HASH (id)) ORDER c BY (id) IS BEGIN RETURN; END;"
      - id: pipelined
        sql: "CREATE FUNCTION f RETURN num_tab PIPELINED IS BEGIN FOR i IN 1 .. 3 LOOP PIPE ROW (i); END LOOP; RETURN; END;"
      - id: pipelined_using
        sql: "CREATE FUNCTION f (x NUMBER) RETURN num_tab PIPELINED USING s.impl_t;"
      - id: polymorphic_table_function
        sql: "CREATE FUNCTION f (tab TABLE, cols COLUMNS) RETURN TABLE PIPELINED ROW POLYMORPHIC USING ptf_pkg;"
      - id: aggregate_using
        sql: "CREATE FUNCTION f (input NUMBER) RETURN NUMBER PARALLEL_ENABLE AGGREGATE USING s.impl_t;"
      - id: sql_macro_table
        sql: "CREATE FUNCTION f (job VARCHAR2) RETURN VARCHAR2 SQL_MACRO IS BEGIN RETURN q'{SELECT * FROM emp WHERE job = f.job}'; END;"
      - id: sql_macro_scalar
        sql: "CREATE FUNCTION f (a NUMBER) RETURN VARCHAR2 SQL_MACRO(SCALAR) IS BEGIN RETURN 'a * 2'; END;"
      - id: sql_macro_type_named
        sql: "CREATE FUNCTION f RETURN VARCHAR2 SQL_MACRO(TYPE => TABLE) IS BEGIN RETURN 'SELECT 1 FROM DUAL'; END;"
      - id: shard_enable
        sql: "CREATE FUNCTION f (a NUMBER) RETURN NUMBER SHARD_ENABLE IS BEGIN RETURN a; END;"
      - id: sharing
        sql: "CREATE FUNCTION f SHARING = METADATA RETURN NUMBER IS BEGIN RETURN 1; END;"
      - id: call_spec_java
        sql: "CREATE FUNCTION f (a VARCHAR2) RETURN VARCHAR2 AS LANGUAGE JAVA NAME 'Util.f(java.lang.String) return java.lang.String';"
      - id: call_spec_c
        sql: "CREATE FUNCTION f (x BINARY_INTEGER) RETURN BINARY_INTEGER AS LANGUAGE C NAME \"c_f\" LIBRARY c_utils WITH CONTEXT PARAMETERS (CONTEXT, x INT, RETURN INT);"
      - id: call_spec_external
        sql: "CREATE FUNCTION f (x BINARY_INTEGER) RETURN BINARY_INTEGER AS EXTERNAL LIBRARY c_utils NAME \"c_f\";"
      - id: call_spec_mle_module
        sql: "CREATE OR REPLACE FUNCTION f (\"p_who\" VARCHAR2) RETURN VARCHAR2 AS MLE MODULE hello_mod SIGNATURE 'hello';"
      - id: call_spec_mle_inline
        sql: |-
          CREATE OR REPLACE FUNCTION f ("who" VARCHAR2) RETURN VARCHAR2
          AS MLE LANGUAGE JAVASCRIPT
          {{
            return `Hello, ${who}`;
          }};
      - id: nested_subprogram
        sql: "CREATE FUNCTION f (a NUMBER) RETURN NUMBER IS FUNCTION g (b NUMBER) RETURN NUMBER IS BEGIN RETURN b * 2; END; BEGIN RETURN g(a); END;"
      - id: slash_terminated
        sql: |-
          CREATE OR REPLACE FUNCTION f RETURN NUMBER IS
          BEGIN
            RETURN 1;
          END;
          /
        note: "In SQL*Plus and SQLcl scripts a PL/SQL unit ends with a line containing only /."
    examples:
      - |-
        CREATE FUNCTION IF NOT EXISTS get_bal(acc_no IN NUMBER) 
           RETURN NUMBER 
           IS acc_bal NUMBER(11,2);
           BEGIN 
              SELECT order_total 
              INTO acc_bal 
              FROM orders 
              WHERE customer_id = acc_no; 
              RETURN(acc_bal); 
            END;
        /
      - |-
        CREATE FUNCTION SecondMax (input NUMBER) RETURN NUMBER
            PARALLEL_ENABLE AGGREGATE USING SecondMaxImpl;
      - |-
        CREATE OR REPLACE FUNCTION text_length(a CLOB) 
           RETURN NUMBER DETERMINISTIC IS
        BEGIN 
          RETURN DBMS_LOB.GETLENGTH(a);
        END;
      - |-
        CREATE OR REPLACE FUNCTION hello_inline(
          "who" VARCHAR2
        ) RETURN VARCHAR2
        AS MLE LANGUAGE JAVASCRIPT
        {{
          return `Hello, ${who}`;
        }};
        /
      - |-
        CREATE OR REPLACE FUNCTION hello(
          "p_who" VARCHAR2
        ) RETURN VARCHAR2
        AS MLE MODULE hello_mod
        SIGNATURE 'hello';
        /

