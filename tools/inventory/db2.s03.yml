      - { id: add_unique_unnamed, sql: "ALTER TABLE t ADD UNIQUE (a);" }
      - { id: add_primary_key, sql: "ALTER TABLE t ADD PRIMARY KEY (a, b);" }
      - { id: add_primary_key_business_time, sql: "ALTER TABLE t ADD PRIMARY KEY (a, BUSINESS_TIME WITHOUT OVERLAPS);" }
