name: Publish Packages
on:
  release:
    types: [published]

# Deny-by-default; each job grants only what it needs.
permissions: {}

jobs:
  # OIDC trusted publishing: no NPM_TOKEN exists anywhere. npm exchanges the
  # short-lived GitHub Actions OIDC token (id-token: write) for a publish
  # token scoped to this exact repo/workflow/run, valid for minutes only.
  # Requires a Trusted Publisher configured on npmjs.com for this package
  # (org=RelativelyUnknown, repo=tree-sitter-sql-polyglot, workflow=publish.yml).
  npm-publish:
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@relativelyunknown/tree-sitter-sql-polyglot
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      # OIDC trusted publishing needs npm CLI >=11.5.1; don't rely on whatever
      # ships with the setup-node version pin.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm publish --access public --provenance

  # Same OIDC pattern via crates-io-auth-action: no CARGO_REGISTRY_TOKEN
  # secret exists. Requires a Trusted Publisher linked on the crate's
  # crates.io settings page for this repo/workflow.
  cargo-publish:
    runs-on: ubuntu-latest
    environment:
      name: crates
      url: https://crates.io/crates/tree-sitter-sql-polyglot
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Generates src/parser.c (and friends), which bindings/rust/build.rs
      # compiles; cargo publish fails without it.
      - run: npm ci
      # actions-rs/toolchain is unmaintained (archived, no updates since
      # 2020) and a supply-chain liability; dtolnay/rust-toolchain is the
      # actively maintained replacement.
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # PyPI: can't get OIDC by calling tree-sitter/workflows' reusable
  # package-pypi.yml (as we do for npm/cargo) because PyPI validates the
  # OIDC token's job_workflow_ref against the *actual* workflow file that
  # runs the publish step. Inside a called reusable workflow that's
  # tree-sitter/workflows' own file, not this repo's — it can never match a
  # trusted publisher configured for this project, so PyPI rejects it. The
  # build_sdist/build_wheels/pypi-publish jobs below are vendored from
  # https://github.com/tree-sitter/workflows/blob/main/.github/workflows/package-pypi.yml
  # (as of 2026-08) so the publish step runs directly in *this* workflow
  # file and can use OIDC. Re-diff against that source occasionally in case
  # upstream changes the build matrix, cibuildwheel version, or ABI default.
  build_sdist:
    name: Build source dist
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: tree-sitter/setup-action/cli@v2
      - name: Install dependencies
        run: |-
          if jq -e "$JQ_SCRIPT" package.json >/dev/null; then
            npm i --ignore-scripts --omit peer --omit optional
          fi
        env:
          JQ_SCRIPT: >-
            .dependencies + .devDependencies |
            with_entries(select(
            (.key | startswith("tree-sitter-"))
            and (.key != "tree-sitter-cli")
            )) | length > 0
      # ClickHouse's generate step can peak near the runner's memory limit;
      # swap gives it headroom instead of an OOM kill ("the runner has
      # received a shutdown signal"). Same issue and fix as ci.yml's
      # clickhouse shard - this job regenerates every grammar sequentially
      # on the same runner, so it hits the identical ceiling.
      - name: Increase swap (ClickHouse generate is memory-bound)
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
      - name: Regenerate parser
        shell: bash
        run: |
          while read -r grammar_dir; do
            pushd "$grammar_dir"
            tree-sitter generate
            popd > /dev/null
          done < <(jq -r '.grammars[].path // "."' tree-sitter.json)
        env:
          TREE_SITTER_ABI_VERSION: 15
      - run: pip install --upgrade pip build setuptools wheel
      - run: python -mbuild -n -s
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sources
          path: dist/*.tar.gz
          retention-days: 2

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      # A single arch OOMing during generate shouldn't cancel the others -
      # they're independent wheels, and cancelling them wastes a full
      # rebuild on the next retry.
      fail-fast: false
      matrix:
        os:
          - windows-2025
          - windows-11-arm
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: tree-sitter/setup-action/cli@v2
      - name: Install dependencies
        shell: bash
        run: |-
          if jq -e "$JQ_SCRIPT" package.json >/dev/null; then
            npm i --ignore-scripts --omit peer --omit optional
          fi
        env:
          JQ_SCRIPT: >-
            .dependencies + .devDependencies |
            with_entries(select(
            (.key | startswith("tree-sitter-"))
            and (.key != "tree-sitter-cli")
            )) | length > 0
      # Linux-only: fallocate/mkswap/swapon need sudo and a Linux kernel.
      # ClickHouse's generate step is the one that peaks near the runner's
      # memory limit (see ci.yml's clickhouse shard); swap gives it headroom
      # instead of an OOM kill ("the runner has received a shutdown signal").
      - name: Increase swap (ClickHouse generate is memory-bound)
        if: runner.os == 'Linux'
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
      - name: Regenerate parser
        shell: bash
        run: |
          while read -r grammar_dir; do
            grammar_dir="${grammar_dir%$'\r'}"
            pushd "$grammar_dir"
            tree-sitter generate
            popd > /dev/null
          done < <(jq -r '.grammars[].path // "."' tree-sitter.json)
        env:
          TREE_SITTER_ABI_VERSION: 15
      - uses: pypa/cibuildwheel@v4.1
        with:
          output-dir: dist
        env:
          CIBW_ARCHS: native
      - uses: actions/upload-artifact@v4
        with:
          path: dist/*.whl
          name: dist-wheels-${{ matrix.os }}
          retention-days: 2

  pypi-publish:
    name: Publish Python package
    needs: [build_sdist, build_wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tree-sitter-sql-polyglot/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
