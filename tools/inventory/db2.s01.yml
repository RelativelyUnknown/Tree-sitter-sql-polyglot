dialect: db2
engine: IBM Db2 for Linux, UNIX and Windows
version: "12.1"
source: https://www.ibm.com/docs/en/db2/12.1.x?topic=reference-statements

statements:
  - id: alter_function
    name: ALTER FUNCTION
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-alter-function
    tier: high
    probes:
      - id: external_name_string
        sql: "ALTER FUNCTION f(INTEGER) EXTERNAL NAME 'mylib!myfunc';"
      - id: external_name_identifier
        sql: "ALTER FUNCTION f(INTEGER) EXTERNAL NAME myfunc;"
      - id: fenced
        sql: "ALTER FUNCTION f(INTEGER) FENCED;"
      - id: not_fenced
        sql: "ALTER FUNCTION f(INTEGER) NOT FENCED;"
      - id: secured
        sql: "ALTER FUNCTION f(INTEGER) SECURED;"
      - id: not_secured
        sql: "ALTER FUNCTION f(INTEGER) NOT SECURED;"
      - id: threadsafe
        sql: "ALTER FUNCTION f(INTEGER) THREADSAFE;"
      - id: not_threadsafe
        sql: "ALTER FUNCTION f(INTEGER) NOT THREADSAFE;"
      - id: no_parameters
        sql: "ALTER FUNCTION f() NOT FENCED;"
      - id: multiple_parameters_qualified
        sql: "ALTER FUNCTION s.f(INTEGER, VARCHAR(10)) NOT FENCED;"
      - id: specific_function
        sql: "ALTER SPECIFIC FUNCTION s.spec1 NOT FENCED;"
      - id: multiple_options
        sql: "ALTER FUNCTION f(INTEGER) EXTERNAL NAME 'mylib!myfunc' NOT FENCED THREADSAFE;"
    examples:
      - "ALTER FUNCTION MAIL() NOT FENCED;"

  - id: alter_index
    name: ALTER INDEX
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-alter-index
    tier: high
    probes:
      - id: compress_yes
        sql: "ALTER INDEX idx COMPRESS YES;"
      - id: compress_no
        sql: "ALTER INDEX idx COMPRESS NO;"
      - id: qualified_name
        sql: "ALTER INDEX s.idx COMPRESS YES;"
    examples:
      - "ALTER INDEX JOB_BY_DPT COMPRESS YES;"
