dialect: cockroachdb
engine: CockroachDB
version: "v26.3 (stable)"
source: https://www.cockroachlabs.com/docs/stable/sql-statements

statements:
  - id: drop_table
    name: DROP TABLE
    doc: https://www.cockroachlabs.com/docs/stable/drop-table
    tier: high
    probes:
      - id: basic
        sql: "DROP TABLE t;"
      - id: if_exists
        sql: "DROP TABLE IF EXISTS t;"
      - id: table_list
        sql: "DROP TABLE t1, t2;"
      - id: qualified_name
        sql: "DROP TABLE s.t;"
      - id: cascade
        sql: "DROP TABLE t CASCADE;"
      - id: restrict
        sql: "DROP TABLE t RESTRICT;"
      - id: if_exists_list_cascade
        sql: "DROP TABLE IF EXISTS t1, t2 CASCADE;"
    examples:
      - "DROP TABLE promo_codes ;"
      - "DROP TABLE users ;"
      - "DROP TABLE users CASCADE ;"

  - id: drop_view
    name: DROP VIEW
    doc: https://www.cockroachlabs.com/docs/stable/drop-view
    tier: high
    probes:
      - id: basic
        sql: "DROP VIEW v;"
      - id: materialized
        sql: "DROP MATERIALIZED VIEW v;"
      - id: if_exists
        sql: "DROP VIEW IF EXISTS v;"
      - id: view_list
        sql: "DROP VIEW v1, v2;"
      - id: qualified_name
        sql: "DROP VIEW s.v;"
      - id: cascade
        sql: "DROP VIEW v CASCADE;"
      - id: restrict
        sql: "DROP VIEW v RESTRICT;"
      - id: materialized_if_exists_cascade
        sql: "DROP MATERIALIZED VIEW IF EXISTS v1, v2 CASCADE;"
    examples:
      - "DROP VIEW bank.user_emails;"
      - "DROP VIEW bank.user_accounts CASCADE;"
