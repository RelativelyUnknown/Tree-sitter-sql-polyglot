  - id: scripting_block
    name: "BEGIN … END (Snowflake Scripting)"
    doc: https://docs.snowflake.com/en/sql-reference/snowflake-scripting/begin
    tier: high
    probes:
      - { id: anonymous_block, sql: "BEGIN CREATE TABLE parent (id INTEGER); RETURN 'Completed'; END;" }
      - { id: declare_block, sql: "DECLARE x INTEGER; BEGIN x := 1; RETURN x; END;" }
      - { id: block_with_transaction, sql: "BEGIN BEGIN TRANSACTION; TRUNCATE TABLE child; COMMIT; RETURN ''; END;" }
      - { id: nested_block, sql: "BEGIN BEGIN LET x := 1; END; RETURN 'ok'; END;" }
      - { id: block_with_exception, sql: "BEGIN SELECT 1 / 0; EXCEPTION WHEN OTHER THEN RETURN SQLERRM; END;" }
      - { id: execute_immediate_wrapped, sql: "EXECUTE IMMEDIATE $$ BEGIN RETURN 'Completed'; END; $$;" }
    examples:
      - |-
        EXECUTE IMMEDIATE $$
        BEGIN
            CREATE TABLE parent (ID INTEGER);
            CREATE TABLE child (ID INTEGER, parent_ID INTEGER);
            RETURN 'Completed';
        END;
        $$
        ;
      - |-
        EXECUTE IMMEDIATE $$
        BEGIN
            BEGIN TRANSACTION;
            TRUNCATE TABLE child;
            TRUNCATE TABLE parent;
            COMMIT;
            RETURN '';
        END;
        $$
        ;

  - id: scripting_declare
    name: "DECLARE (Snowflake Scripting)"
    doc: https://docs.snowflake.com/en/sql-reference/snowflake-scripting/declare
    tier: high
    probes:
      - { id: variable_type_default, sql: "DECLARE profit NUMBER(38, 2) DEFAULT 0.0; BEGIN RETURN profit; END;" }
      - { id: variable_assign_operator, sql: "DECLARE profit NUMBER(38, 2) := 0; BEGIN RETURN profit; END;" }
      - { id: variable_no_type, sql: "DECLARE v DEFAULT 'x'; BEGIN RETURN v; END;" }
      - { id: variable_type_only, sql: "DECLARE v VARCHAR; BEGIN v := 'a'; RETURN v; END;" }
      - { id: cursor, sql: "DECLARE c1 CURSOR FOR SELECT id, price FROM invoices; BEGIN OPEN c1; CLOSE c1; RETURN 1; END;" }
      - { id: cursor_with_bind, sql: "DECLARE c2 CURSOR FOR SELECT COUNT(*) FROM invoices WHERE price = ?; BEGIN OPEN c2 USING (11.11); RETURN 1; END;" }
      - { id: resultset_default, sql: "DECLARE res RESULTSET DEFAULT (SELECT col1 FROM mytable ORDER BY col1); BEGIN RETURN TABLE(res); END;" }
      - { id: resultset_async, sql: "DECLARE res RESULTSET := ASYNC (SELECT * FROM t); BEGIN AWAIT res; RETURN TABLE(res); END;" }
      - { id: resultset_no_default, sql: "DECLARE res RESULTSET; BEGIN res := (SELECT 1); RETURN TABLE(res); END;" }
      - { id: exception_declaration, sql: "DECLARE e1 EXCEPTION (-20003, 'ERROR: Could not create table.'); BEGIN RAISE e1; END;" }
      - { id: exception_no_number, sql: "DECLARE my_exception EXCEPTION; BEGIN RAISE my_exception; END;" }
      - { id: nested_procedure, sql: "DECLARE myproc PROCEDURE (a INT) RETURNS INT AS BEGIN RETURN a + 1; END; BEGIN CALL myproc(1); RETURN 1; END;" }
    examples:
      - |-
        DECLARE
          profit number(38, 2) DEFAULT 0.0;
        BEGIN
          LET cost number(38, 2) := 100.0;
          LET revenue number(38, 2) DEFAULT 110.0;

          profit := revenue - cost;
          RETURN profit;
        END;

