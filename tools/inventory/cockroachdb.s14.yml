dialect: cockroachdb
engine: CockroachDB
version: "v26.3 (stable)"
source: https://www.cockroachlabs.com/docs/stable/sql-statements

statements:
  - id: begin
    name: BEGIN
    doc: https://www.cockroachlabs.com/docs/stable/begin-transaction
    tier: high
    probes:
      - { id: basic, sql: "BEGIN;" }
      - { id: begin_transaction, sql: "BEGIN TRANSACTION;" }
      - { id: start_transaction, sql: "START TRANSACTION;" }
      - { id: priority_low, sql: "BEGIN PRIORITY LOW;" }
      - { id: priority_normal, sql: "BEGIN PRIORITY NORMAL;" }
      - { id: priority_high, sql: "BEGIN PRIORITY HIGH;" }
      - { id: read_only, sql: "BEGIN READ ONLY;" }
      - { id: read_write, sql: "BEGIN READ WRITE;" }
      - { id: as_of_system_time, sql: "BEGIN AS OF SYSTEM TIME '2019-04-09 18:02:52.0+00:00';" }
      - { id: not_deferrable, sql: "BEGIN NOT DEFERRABLE;" }
      - { id: isolation_serializable, sql: "BEGIN TRANSACTION ISOLATION LEVEL SERIALIZABLE;" }
      - { id: isolation_read_committed, sql: "BEGIN TRANSACTION ISOLATION LEVEL READ COMMITTED;" }
      - { id: combined_modes, sql: "BEGIN TRANSACTION ISOLATION LEVEL SERIALIZABLE, PRIORITY HIGH, READ ONLY;" }
    examples:
      - "BEGIN;"
      - "BEGIN TRANSACTION ISOLATION LEVEL READ COMMITTED;"
      - "BEGIN PRIORITY HIGH;"

  - id: call
    name: CALL
    doc: https://www.cockroachlabs.com/docs/stable/call
    tier: high
    probes:
      - { id: no_args, sql: "CALL p();" }
      - { id: with_args, sql: "CALL p(5, 'cursor_name');" }
      - { id: qualified_name, sql: "CALL s.p(1, 2);" }
    examples:
      - "CALL delete_earliest_histories (5, 'rides_left');"
