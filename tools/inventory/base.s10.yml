dialect: base
engine: ISO SQL
version: "SQL:2016"
source: https://jakewheat.github.io/sql-overview/sql-2016-foundation-grammar.html

statements:
  - id: commit
    name: COMMIT
    doc: https://jakewheat.github.io/sql-overview/sql-2016-foundation-grammar.html#_17_7_commit_statement
    tier: high
    probes:
      - id: basic
        sql: "COMMIT;"
      - id: work
        sql: "COMMIT WORK;"
      - id: and_chain
        sql: "COMMIT AND CHAIN;"
      - id: and_no_chain
        sql: "COMMIT AND NO CHAIN;"
      - id: work_and_chain
        sql: "COMMIT WORK AND CHAIN;"
      - id: work_and_no_chain
        sql: "COMMIT WORK AND NO CHAIN;"

  - id: rollback
    name: ROLLBACK
    doc: https://jakewheat.github.io/sql-overview/sql-2016-foundation-grammar.html#_17_8_rollback_statement
    tier: high
    probes:
      - id: basic
        sql: "ROLLBACK;"
      - id: work
        sql: "ROLLBACK WORK;"
      - id: and_chain
        sql: "ROLLBACK AND CHAIN;"
      - id: and_no_chain
        sql: "ROLLBACK AND NO CHAIN;"
      - id: work_and_chain
        sql: "ROLLBACK WORK AND CHAIN;"
      - id: to_savepoint
        sql: "ROLLBACK TO SAVEPOINT sp;"
      - id: work_to_savepoint
        sql: "ROLLBACK WORK TO SAVEPOINT sp;"
      - id: and_chain_to_savepoint
        sql: "ROLLBACK AND NO CHAIN TO SAVEPOINT sp;"
