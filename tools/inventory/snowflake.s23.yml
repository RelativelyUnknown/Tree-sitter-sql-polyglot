dialect: snowflake
engine: Snowflake
version: "current (docs read 2026-10-04)"
source: https://docs.snowflake.com/en/sql-reference/sql-all

statements:
  - id: create_catalog_integration_object_storage
    name: CREATE CATALOG INTEGRATION (Object storage)
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-catalog-integration-object-storage
    tier: low
    probes:
      - id: basic
        sql: "CREATE CATALOG INTEGRATION ci CATALOG_SOURCE = OBJECT_STORE TABLE_FORMAT = ICEBERG ENABLED = TRUE;"
      - id: all_options
        sql: "CREATE CATALOG INTEGRATION IF NOT EXISTS ci CATALOG_SOURCE = OBJECT_STORE TABLE_FORMAT = DELTA ENABLED = FALSE REFRESH_INTERVAL_SECONDS = 60 COMMENT = 'c';"

  - id: create_catalog_integration_snowflake_open_catalog
    name: CREATE CATALOG INTEGRATION (Snowflake Open Catalog)
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-catalog-integration-open-catalog
    tier: low
    probes:
      - id: public
        sql: |-
          CREATE CATALOG INTEGRATION ci
            CATALOG_SOURCE = POLARIS
            TABLE_FORMAT = ICEBERG
            CATALOG_NAMESPACE = 'ns'
            REST_CONFIG = (
              CATALOG_URI = 'https://acct.snowflakecomputing.com/polaris/api/catalog'
              CATALOG_API_TYPE = PUBLIC
              CATALOG_NAME = 'cat'
              ACCESS_DELEGATION_MODE = VENDED_CREDENTIALS
            )
            REST_AUTHENTICATION = (
              TYPE = OAUTH
              OAUTH_TOKEN_URI = 'https://t.example.com/token'
              OAUTH_CLIENT_ID = 'id'
              OAUTH_CLIENT_SECRET = 'secret'
              OAUTH_ALLOWED_SCOPES = ('PRINCIPAL_ROLE:ALL', 'scope2')
            )
            ENABLED = TRUE
            REFRESH_INTERVAL_SECONDS = 120
            COMMENT = 'c';
      - id: private
        sql: |-
          CREATE CATALOG INTEGRATION IF NOT EXISTS ci
            CATALOG_SOURCE = POLARIS
            TABLE_FORMAT = ICEBERG
            REST_CONFIG = (
              CATALOG_URI = 'https://acct.privatelink.snowflakecomputing.com/polaris/api/catalog'
              CATALOG_API_TYPE = PRIVATE
              CATALOG_NAME = 'cat'
            )
            REST_AUTHENTICATION = (
              TYPE = OAUTH
              OAUTH_CLIENT_ID = 'id'
              OAUTH_CLIENT_SECRET = 'secret'
              OAUTH_ALLOWED_SCOPES = ('PRINCIPAL_ROLE:ALL', 'scope2')
            )
            ENABLED = TRUE;

  - id: create_catalog_integration_apache_iceberg_rest
    name: CREATE CATALOG INTEGRATION (Apache Iceberg™ REST)
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-catalog-integration-rest
    tier: low
    probes:
      - id: oauth
        sql: |-
          CREATE CATALOG INTEGRATION ci
            CATALOG_SOURCE = ICEBERG_REST
            TABLE_FORMAT = ICEBERG
            CATALOG_NAMESPACE = 'ns'
            REST_CONFIG = (
              CATALOG_URI = 'https://rest.example.com/api'
              PREFIX = 'p'
              CATALOG_NAME = 'cat'
              CATALOG_API_TYPE = PUBLIC
              ACCESS_DELEGATION_MODE = EXTERNAL_VOLUME_CREDENTIALS
            )
            REST_AUTHENTICATION = (
              TYPE = OAUTH
              OAUTH_TOKEN_URI = 'https://t.example.com/token'
              OAUTH_CLIENT_ID = 'id'
              OAUTH_CLIENT_SECRET = 'secret'
              OAUTH_ALLOWED_SCOPES = ('s1', 's2')
            )
            ENABLED = TRUE
            REFRESH_INTERVAL_SECONDS = 60
            COMMENT = 'c';
      - id: bearer
        sql: |-
          CREATE CATALOG INTEGRATION ci
            CATALOG_SOURCE = ICEBERG_REST
            TABLE_FORMAT = ICEBERG
            REST_CONFIG = (CATALOG_URI = 'https://rest.example.com/api')
            REST_AUTHENTICATION = (TYPE = BEARER BEARER_TOKEN = 'tok')
            ENABLED = TRUE;
      - id: sigv4
        sql: |-
          CREATE CATALOG INTEGRATION ci
            CATALOG_SOURCE = ICEBERG_REST
            TABLE_FORMAT = ICEBERG
            REST_CONFIG = (CATALOG_URI = 'https://glue.us-west-2.amazonaws.com/iceberg' CATALOG_API_TYPE = AWS_GLUE)
            REST_AUTHENTICATION = (
              TYPE = SIGV4
              SIGV4_IAM_ROLE = 'arn:aws:iam::123456789012:role/r'
              SIGV4_SIGNING_REGION = 'us-west-2'
              SIGV4_EXTERNAL_ID = 'ext'
            )
            ENABLED = TRUE;

  - id: create_catalog_integration_snowflake_postgres
    name: CREATE CATALOG INTEGRATION (Snowflake Postgres)
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-catalog-integration-snowflake-postgres
    tier: low
    probes:
      - id: basic
        sql: |-
          CREATE CATALOG INTEGRATION ci
            CATALOG_SOURCE = SNOWFLAKE_POSTGRES
            TABLE_FORMAT = ICEBERG
            CATALOG_NAMESPACE = 'ns'
            REST_CONFIG = (
              POSTGRES_INSTANCE = 'inst'
              ACCESS_DELEGATION_MODE = VENDED_CREDENTIALS
              CATALOG_NAME = 'db'
            )
            ENABLED = TRUE
            COMMENT = 'c';

  - id: create_compute_pool
    name: CREATE COMPUTE POOL
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-compute-pool
    tier: low
    probes:
      - id: basic
        sql: "CREATE COMPUTE POOL IF NOT EXISTS cp MIN_NODES = 1 MAX_NODES = 2 INSTANCE_FAMILY = CPU_X64_XS;"
      - id: all_options
        sql: "CREATE COMPUTE POOL cp FOR APPLICATION app MIN_NODES = 1 MAX_NODES = 2 INSTANCE_FAMILY = CPU_X64_XS AUTO_RESUME = TRUE INITIALLY_SUSPENDED = FALSE AUTO_SUSPEND_SECS = 600 WITH TAG (tg = 'v') COMMENT = 'c' PLACEMENT_GROUP = 'pg' BACKUP_INSTANCE_FAMILIES = ('CPU_X64_S', 'CPU_X64_M');"

  - id: create_connection
    name: CREATE CONNECTION
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-connection
    tier: low
    probes:
      - id: primary
        sql: "CREATE CONNECTION IF NOT EXISTS conn COMMENT = 'c';"
      - id: secondary
        sql: "CREATE CONNECTION IF NOT EXISTS conn AS REPLICA OF myorg.myaccount.conn COMMENT = 'c';"

  - id: create_contact
    name: CREATE CONTACT
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-contact
    tier: low
    probes:
      - id: users
        sql: "CREATE CONTACT IF NOT EXISTS ct USERS = ('u1', 'u2') COMMENT = 'c';"
      - id: email_distribution_list
        sql: "CREATE CONTACT ct EMAIL_DISTRIBUTION_LIST = 'a@example.com';"
      - id: url
        sql: "CREATE CONTACT ct URL = 'https://example.com/contact';"

  - id: create_cortex_search_service
    name: CREATE CORTEX SEARCH SERVICE
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-cortex-search
    tier: low
    probes:
      - id: single_index
        sql: "CREATE CORTEX SEARCH SERVICE IF NOT EXISTS svc ON txt PRIMARY KEY (id) ATTRIBUTES a, b WAREHOUSE = wh TARGET_LAG = '1 hour' EMBEDDING_MODEL = 'snowflake-arctic-embed-l-v2.0' REFRESH_MODE = INCREMENTAL INITIALIZE = ON_CREATE FULL_INDEX_BUILD_INTERVAL_DAYS = 7 REQUEST_LOGGING = TRUE AUTO_SUSPEND = 600 COMMENT = 'c' AS (SELECT txt, id, a, b FROM t);"
      - id: multi_index
        sql: "CREATE OR REPLACE CORTEX SEARCH SERVICE svc TEXT INDEXES txt1, txt2 VECTOR INDEXES txt1 (model='snowflake-arctic-embed-m-v1.5'), vec_col PRIMARY KEY (id) ATTRIBUTES a WAREHOUSE = wh TARGET_LAG = '1 day' AS (SELECT * FROM t);"
        note: "VECTOR INDEXES column_specification forms (text_column (model='...') and vector_column) are from the Parameters section of the same page"

  - id: create_data_movement_policy
    name: CREATE DATA MOVEMENT POLICY
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-data-movement-policy
    tier: low
    probes:
      - id: basic
        sql: "CREATE DATA MOVEMENT POLICY IF NOT EXISTS dmp ENFORCE_RULES = (r1, r2) ALERT_RULES = (r3) COMMENT = 'c';"

  - id: create_data_movement_rule
    name: CREATE DATA MOVEMENT RULE
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-data-movement-rule
    tier: low
    probes:
      - id: basic
        sql: "CREATE DATA MOVEMENT RULE IF NOT EXISTS dmr TYPE = 'COPY_INTO_LOCATION' MAX_ROWS AS () RETURNS INTEGER -> (1000) COMMENT = 'c';"

  - id: create_dataset
    name: CREATE DATASET
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-dataset
    tier: low
    probes:
      - id: basic
        sql: "CREATE IF NOT EXISTS DATASET ds;"

  - id: create_dbt_project
    name: CREATE DBT PROJECT
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-dbt-project
    tier: low
    probes:
      - id: basic
        sql: "CREATE DBT PROJECT p FROM '@db.sch.stg/path';"
      - id: all_options
        sql: "CREATE DBT PROJECT IF NOT EXISTS p FROM '@db.sch.stg/path' DBT_VERSION = '1.9.4' DEFAULT_TARGET = 'dev' DEFAULT_ENVIRONMENT = 'env' EXTERNAL_ACCESS_INTEGRATIONS = (eai1, eai2) AUTO_COMPILE = TRUE DEFAULT_WRITEBACK = FALSE COMMENT = 'c';"

  - id: create_dcm_project
    name: CREATE DCM PROJECT
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-dcm-project
    tier: low
    probes:
      - id: basic
        sql: "CREATE DCM PROJECT IF NOT EXISTS p LOG_LEVEL = INFO COMMENT = 'c';"

  - id: create_experiment
    name: CREATE EXPERIMENT
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-experiment
    tier: low
    probes:
      - id: basic
        sql: "CREATE EXPERIMENT IF NOT EXISTS exp;"

  - id: create_external_agent
    name: CREATE EXTERNAL AGENT
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-external-agent
    tier: low
    probes:
      - id: basic
        sql: "CREATE EXTERNAL AGENT IF NOT EXISTS ag WITH VERSION v1 COMMENT = 'c';"

  - id: create_external_consumer
    name: CREATE EXTERNAL CONSUMER
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-external-consumer
    tier: low
    probes:
      - id: basic
        sql: "CREATE EXTERNAL CONSUMER IF NOT EXISTS ec COMMENT = 'c' EMAIL = 'a@example.com';"

  - id: create_external_volume
    name: CREATE EXTERNAL VOLUME
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-external-volume
    tier: low
    probes:
      - id: s3
        sql: "CREATE EXTERNAL VOLUME IF NOT EXISTS ev STORAGE_LOCATIONS = ((NAME = 'loc1' STORAGE_PROVIDER = 'S3' STORAGE_AWS_ROLE_ARN = 'arn:aws:iam::123456789012:role/r' STORAGE_BASE_URL = 's3://bkt/path/' STORAGE_AWS_ACCESS_POINT_ARN = 'arn:aws:s3:us-west-2:123456789012:accesspoint/ap' STORAGE_AWS_EXTERNAL_ID = 'ext' ENCRYPTION = (TYPE = 'AWS_SSE_KMS' KMS_KEY_ID = 'k') USE_PRIVATELINK_ENDPOINT = TRUE)) ALLOW_WRITES = TRUE COMMENT = 'c';"
      - id: gcs
        sql: "CREATE EXTERNAL VOLUME ev STORAGE_LOCATIONS = ((NAME = 'loc1' STORAGE_PROVIDER = 'GCS' STORAGE_BASE_URL = 'gcs://bkt/path/' ENCRYPTION = (TYPE = 'GCS_SSE_KMS' KMS_KEY_ID = 'k')));"
      - id: azure_multiple_locations
        sql: "CREATE EXTERNAL VOLUME ev STORAGE_LOCATIONS = ((NAME = 'loc1' STORAGE_PROVIDER = 'AZURE' AZURE_TENANT_ID = 'tid' STORAGE_BASE_URL = 'azure://acct.blob.core.windows.net/c/p/'), (NAME = 'loc2' STORAGE_PROVIDER = 'AZURE' AZURE_TENANT_ID = 'tid' STORAGE_BASE_URL = 'azure://acct.blob.core.windows.net/c2/p/'));"
      - id: s3_compatible
        sql: "CREATE EXTERNAL VOLUME ev STORAGE_LOCATIONS = ((NAME = 'loc1' STORAGE_PROVIDER = 'S3COMPAT' STORAGE_BASE_URL = 's3compat://bkt/path/' CREDENTIALS = (AWS_KEY_ID = 'k' AWS_SECRET_KEY = 's') STORAGE_ENDPOINT = 'https://s3.example.com'));"

  - id: create_failover_group
    name: CREATE FAILOVER GROUP
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-failover-group
    tier: low
    probes:
      - id: primary
        sql: "CREATE FAILOVER GROUP IF NOT EXISTS fg OBJECT_TYPES = USERS, ROLES, WAREHOUSES, RESOURCE MONITORS, DATABASES, INTEGRATIONS ALLOWED_DATABASES = db1, db2 ALLOWED_EXTERNAL_VOLUMES = ev1 ALLOWED_SHARES = sh1 ALLOWED_INTEGRATION_TYPES = SECURITY INTEGRATIONS, API INTEGRATIONS ALLOWED_ACCOUNTS = myorg.acct2, myorg.acct3 IGNORE EDITION CHECK REPLICATION_SCHEDULE = '10 MINUTE' OPTIMIZED_REFRESH = TRUE WITH TAG (tg = 'v') ERROR_INTEGRATION = ei;"
      - id: cron_schedule
        sql: "CREATE FAILOVER GROUP fg OBJECT_TYPES = DATABASES ALLOWED_DATABASES = db1 ALLOWED_ACCOUNTS = myorg.acct2 REPLICATION_SCHEDULE = 'USING CRON 0 0 * * * UTC';"
      - id: secondary
        sql: "CREATE FAILOVER GROUP IF NOT EXISTS fg AS REPLICA OF myorg.acct1.fg;"

  - id: create_feature_policy
    name: CREATE FEATURE POLICY
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-feature-policy
    tier: low
    probes:
      - id: blocked_types
        sql: "CREATE FEATURE POLICY IF NOT EXISTS fp BLOCKED_OBJECT_TYPES_FOR_CREATION = (DATABASES, WAREHOUSES) COMMENT = 'c';"
      - id: yaml_body
        sql: |-
          CREATE FEATURE POLICY fp
            AS $$
            blocked_object_types_for_creation:
              - DATABASES
            $$;

  - id: create_gateway
    name: CREATE GATEWAY
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-gateway
    tier: low
    probes:
      - id: basic
        sql: |-
          CREATE GATEWAY IF NOT EXISTS gw
            FROM SPECIFICATION $$
            spec:
              type: traffic_split
            $$;

  - id: create_git_repository
    name: CREATE GIT REPOSITORY
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-git-repository
    tier: low
    probes:
      - id: basic
        sql: "CREATE GIT REPOSITORY IF NOT EXISTS repo ORIGIN = 'https://github.com/o/r.git' API_INTEGRATION = api_int GIT_CREDENTIALS = sec COMMENT = 'c' WITH TAG (tg = 'v');"

  - id: create_image_repository
    name: CREATE IMAGE REPOSITORY
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-image-repository
    tier: low
    probes:
      - id: basic
        sql: "CREATE IMAGE REPOSITORY IF NOT EXISTS repo ENCRYPTION = (TYPE = 'SNOWFLAKE_SSE') COMMENT = 'c' WITH TAG (tg = 'v');"

  - id: create_integration
    name: CREATE INTEGRATION
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-integration
    tier: low
    probes:
      - id: storage_integration
        sql: "CREATE STORAGE INTEGRATION IF NOT EXISTS si TYPE = EXTERNAL_STAGE STORAGE_PROVIDER = 'S3' ENABLED = TRUE STORAGE_AWS_ROLE_ARN = 'arn:aws:iam::123456789012:role/r' STORAGE_ALLOWED_LOCATIONS = ('s3://bkt/') COMMENT = 'c';"
        note: "The page is a generic stub (<integration_type> INTEGRATION) that links to the per-type pages; this is one concrete instance of the generic form."

  - id: create_interactive_warehouse
    name: CREATE INTERACTIVE WAREHOUSE
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-interactive-warehouse
    tier: low
    probes:
      - id: basic
        sql: "CREATE INTERACTIVE WAREHOUSE IF NOT EXISTS iw;"
      - id: tables_and_properties
        sql: "CREATE OR REPLACE INTERACTIVE WAREHOUSE iw TABLES (t1, t2) WITH WAREHOUSE_SIZE = XSMALL MAX_CLUSTER_COUNT = 2 MIN_CLUSTER_COUNT = 1 AUTO_SUSPEND = 600 AUTO_RESUME = TRUE INITIALLY_SUSPENDED = FALSE RESOURCE_MONITOR = rm COMMENT = 'c' WITH TAG (tg = 'v') MAX_CONCURRENCY_LEVEL = 8 STATEMENT_QUEUED_TIMEOUT_IN_SECONDS = 10 STATEMENT_TIMEOUT_IN_SECONDS = 60;"

  - id: create_join_policy
    name: CREATE JOIN POLICY
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-join-policy
    tier: low
    probes:
      - id: basic
        sql: "CREATE JOIN POLICY IF NOT EXISTS jp AS () RETURNS JOIN_CONSTRAINT -> JOIN_CONSTRAINT(JOIN_REQUIRED => TRUE) COMMENT = 'c';"

  - id: create_listing
    name: CREATE LISTING
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-listing
    tier: low
    probes:
      - id: inline_manifest_share
        sql: |-
          CREATE EXTERNAL LISTING IF NOT EXISTS lst
            SHARE sh
            AS $$
            title: "t"
            $$
            PUBLISH = TRUE
            REVIEW = FALSE
            COMMENT = 'c';
      - id: manifest_from_stage_application_package
        sql: "CREATE EXTERNAL LISTING IF NOT EXISTS lst APPLICATION PACKAGE pkg FROM '@db.sch.stg/manifest.yml' PUBLISH = FALSE REVIEW = TRUE;"

  - id: create_maintenance_policy
    name: CREATE MAINTENANCE POLICY
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-maintenance-policy
    tier: low
    probes:
      - id: basic
        sql: "CREATE MAINTENANCE POLICY IF NOT EXISTS mp SCHEDULE = 'USING CRON 0 2 * * SUN UTC' COMMENT = 'c';"

  - id: create_managed_account
    name: CREATE MANAGED ACCOUNT
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-managed-account
    tier: low
    probes:
      - id: basic
        sql: "CREATE MANAGED ACCOUNT reader1 ADMIN_NAME = 'admin1', ADMIN_PASSWORD = 'Sdfed43da!44', TYPE = READER, COMMENT = 'c';"

  - id: create_mcp_server
    name: CREATE MCP SERVER
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-mcp-server
    tier: low
    probes:
      - id: basic
        sql: |-
          CREATE MCP SERVER IF NOT EXISTS srv
            FROM SPECIFICATION $$
            tools:
              - name: "t1"
                type: "CORTEX_SEARCH_SERVICE_QUERY"
                identifier: "db.sch.svc"
            $$;

  - id: create_model
    name: CREATE MODEL
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-model
    tier: low
    probes:
      - id: from_model
        sql: "CREATE MODEL IF NOT EXISTS m WITH VERSION v2 FROM MODEL src_model VERSION v1;"
      - id: from_internal_stage
        sql: "CREATE MODEL m WITH VERSION v1 FROM @db.sch.stg/path;"

  - id: create_model_monitor
    name: CREATE MODEL MONITOR
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-model-monitor
    tier: low
    probes:
      - id: model_version_monitor
        sql: "CREATE MODEL MONITOR IF NOT EXISTS mm WITH MODEL = m VERSION = 'v1' FUNCTION = 'predict' SOURCE = src WAREHOUSE = wh REFRESH_INTERVAL = '1 hour' AGGREGATION_WINDOW = '1 days' TIMESTAMP_COLUMN = ts BASELINE = bl ID_COLUMNS = ('id') PREDICTION_CLASS_COLUMNS = ('pc') PREDICTION_SCORE_COLUMNS = ('ps') ACTUAL_CLASS_COLUMNS = ('ac') ACTUAL_SCORE_COLUMNS = ('as') SEGMENT_COLUMNS = ('seg') CUSTOM_METRIC_COLUMNS = ('cm') COMMENT = 'c';"
      - id: gateway_monitor
        sql: "CREATE MODEL MONITOR mm WITH MODEL = m GATEWAY = gw FUNCTION = 'predict' WAREHOUSE = wh REFRESH_INTERVAL = '1 day' AGGREGATION_WINDOW = '1 days' GROUND_TRUTH = gt ID_COLUMNS = ('id') PREDICTION_CLASS_COLUMNS = ('pc') PREDICTION_SCORE_COLUMNS = ('ps') ACTUAL_CLASS_COLUMNS = ('ac') ACTUAL_SCORE_COLUMNS = ('as') COMMENT = 'c';"

  - id: create_multi_party_approval_policy
    name: CREATE MULTI PARTY APPROVAL POLICY
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-multi-party-approval-policy
    tier: low
    probes:
      - id: basic
        sql: |-
          CREATE MULTI PARTY APPROVAL POLICY IF NOT EXISTS mpa
            AS $$
            description: 'p'
            rules:
              - name: r1
                description: 'd'
                operations: (DROP_TABLE)
                approvers:
                  users: ('u1', 'u2')
                required_approvals: 1
                request_duration_days: 7
                self_approval_allowed: false
            $$;

  - id: create_notebook
    name: CREATE NOTEBOOK
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-notebook
    tier: low
    probes:
      - id: basic
        sql: "CREATE NOTEBOOK IF NOT EXISTS nb;"
      - id: all_options
        sql: "CREATE OR REPLACE NOTEBOOK nb FROM '@db.sch.stg/nb' MAIN_FILE = 'nb.ipynb' COMMENT = 'c' QUERY_WAREHOUSE = wh IDLE_AUTO_SHUTDOWN_TIME_SECONDS = 3600 RUNTIME_NAME = 'SYSTEM$BASIC_RUNTIME' COMPUTE_POOL = 'cp' WAREHOUSE = wh2;"

  - id: create_notebook_project
    name: CREATE NOTEBOOK PROJECT
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-notebook-project
    tier: low
    probes:
      - id: from_workspace
        sql: "CREATE NOTEBOOK PROJECT db.sch.proj FROM 'snow://workspace/user$.public.\"ws\"/versions/live/dir' COMMENT = 'c';"
      - id: from_stage
        sql: "CREATE NOTEBOOK PROJECT IF NOT EXISTS db.sch.proj FROM '@db.sch.stg' COMMENT = 'c';"

  - id: create_code_bundle
    name: CREATE CODE BUNDLE
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-code-bundle
    tier: low
    probes:
      - id: from_workspace
        sql: "CREATE CODE BUNDLE IF NOT EXISTS db.sch.bundle FROM 'snow://workspace/user$.public.\"ws\"/versions/live/dir' COMMENT = 'c';"
      - id: from_stage
        sql: "CREATE CODE BUNDLE db.sch.bundle FROM '@db.sch.stg' COMMENT = 'c';"

  - id: create_notification_integration
    name: CREATE NOTIFICATION INTEGRATION
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-notification-integration
    tier: low
    probes:
      - id: email_type
        sql: "CREATE NOTIFICATION INTEGRATION IF NOT EXISTS ni TYPE = EMAIL ENABLED = TRUE;"
        note: "The page has no syntax block of its own; it indexes the per-type pages (email, queue inbound, SNS/Event Grid/Pub/Sub outbound, webhooks). This probe is one concrete instance of the family."

  - id: create_notification_integration_email
    name: CREATE NOTIFICATION INTEGRATION (email)
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-notification-integration-email
    tier: low
    probes:
      - id: basic
        sql: "CREATE NOTIFICATION INTEGRATION ni TYPE = EMAIL ENABLED = TRUE;"
      - id: all_options
        sql: "CREATE NOTIFICATION INTEGRATION IF NOT EXISTS ni TYPE = EMAIL ENABLED = FALSE ALLOWED_RECIPIENTS = ('a@example.com', 'b@example.com') DEFAULT_RECIPIENTS = ('a@example.com') DEFAULT_SUBJECT = 'subj' COMMENT = 'c';"

  - id: create_notification_integration_queue_inbound_azure
    name: CREATE NOTIFICATION INTEGRATION (inbound from an Azure Event Grid topic)
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-notification-integration-queue-inbound-azure
    tier: low
    probes:
      - id: basic
        sql: "CREATE NOTIFICATION INTEGRATION ni ENABLED = TRUE TYPE = QUEUE NOTIFICATION_PROVIDER = AZURE_STORAGE_QUEUE AZURE_STORAGE_QUEUE_PRIMARY_URI = 'https://acct.queue.core.windows.net/q' AZURE_TENANT_ID = 'tid';"
      - id: with_options
