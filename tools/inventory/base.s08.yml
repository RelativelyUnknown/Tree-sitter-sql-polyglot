dialect: base
engine: ISO SQL
version: "SQL:2016"
source: https://jakewheat.github.io/sql-overview/sql-2016-foundation-grammar.html

statements:
  - id: start_transaction
    name: START TRANSACTION
    doc: https://jakewheat.github.io/sql-overview/sql-2016-foundation-grammar.html#_17_1_start_transaction_statement
    tier: high
    probes:
      - id: basic
        sql: "START TRANSACTION;"
      - id: read_only
        sql: "START TRANSACTION READ ONLY;"
      - id: read_write
        sql: "START TRANSACTION READ WRITE;"
      - id: isolation_read_uncommitted
        sql: "START TRANSACTION ISOLATION LEVEL READ UNCOMMITTED;"
      - id: isolation_read_committed
        sql: "START TRANSACTION ISOLATION LEVEL READ COMMITTED;"
      - id: isolation_repeatable_read
        sql: "START TRANSACTION ISOLATION LEVEL REPEATABLE READ;"
      - id: isolation_serializable
        sql: "START TRANSACTION ISOLATION LEVEL SERIALIZABLE;"
      - id: diagnostics_size
        sql: "START TRANSACTION DIAGNOSTICS SIZE 5;"
      - id: multiple_modes
        sql: "START TRANSACTION ISOLATION LEVEL SERIALIZABLE, READ ONLY, DIAGNOSTICS SIZE 10;"

  - id: set_transaction
    name: SET TRANSACTION
    doc: https://jakewheat.github.io/sql-overview/sql-2016-foundation-grammar.html#_17_2_set_transaction_statement
    tier: high
    probes:
      - id: read_only
        sql: "SET TRANSACTION READ ONLY;"
      - id: read_write
        sql: "SET TRANSACTION READ WRITE;"
      - id: isolation_read_uncommitted
        sql: "SET TRANSACTION ISOLATION LEVEL READ UNCOMMITTED;"
      - id: isolation_read_committed
        sql: "SET TRANSACTION ISOLATION LEVEL READ COMMITTED;"
      - id: isolation_repeatable_read
        sql: "SET TRANSACTION ISOLATION LEVEL REPEATABLE READ;"
      - id: isolation_serializable
        sql: "SET TRANSACTION ISOLATION LEVEL SERIALIZABLE;"
      - id: diagnostics_size
        sql: "SET TRANSACTION DIAGNOSTICS SIZE 5;"
      - id: multiple_modes
        sql: "SET TRANSACTION ISOLATION LEVEL READ COMMITTED, READ WRITE, DIAGNOSTICS SIZE 10;"
      - id: local
        sql: "SET LOCAL TRANSACTION READ ONLY;"
