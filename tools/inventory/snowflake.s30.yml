    probes:
      - id: basic
        sql: "SHOW NODES IN COMPUTE POOL p;"
      - id: like_limit
        sql: "SHOW NODES IN COMPUTE POOL p LIKE '%n%' LIMIT 10;"
  - id: show_notebook_projects
    name: SHOW NOTEBOOK PROJECTS
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-notebook-projects
    tier: low
    probes:
      - id: basic
        sql: "SHOW NOTEBOOK PROJECTS;"
      - id: in_schema
        sql: "SHOW NOTEBOOK PROJECTS IN SCHEMA d.s;"
      - id: in_account
        sql: "SHOW NOTEBOOK PROJECTS IN ACCOUNT;"
  - id: show_code_bundles
    name: SHOW CODE BUNDLES
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-code-bundles
