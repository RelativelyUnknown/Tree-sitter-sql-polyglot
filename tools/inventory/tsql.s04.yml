dialect: tsql
engine: SQL Server 2022 / Azure SQL Database
version: "2022"
source: https://learn.microsoft.com/en-us/sql/t-sql/statements/statements

statements:
  - id: checkpoint
    name: CHECKPOINT
    doc: https://learn.microsoft.com/en-us/sql/t-sql/language-elements/checkpoint-transact-sql
    tier: medium
    probes:
      - { id: basic, sql: "CHECKPOINT;" }
      - { id: duration, sql: "CHECKPOINT 10;" }

  - id: use
    name: USE
    doc: https://learn.microsoft.com/en-us/sql/t-sql/language-elements/use-transact-sql
    tier: medium
    probes:
      - { id: basic, sql: "USE db;" }
      - { id: bracketed, sql: "USE [db];" }
    examples:
      - "USE AdventureWorks2022;"

  - id: bulk_insert
    name: BULK INSERT
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/bulk-insert-transact-sql
    tier: medium
    probes:
      - { id: basic, sql: "BULK INSERT t FROM 'data.csv';" }
      - { id: qualified_target, sql: "BULK INSERT db.dbo.t FROM 'data.csv';" }
      - id: text_format
        sql: "BULK INSERT t FROM 'data.csv' WITH (CODEPAGE = '65001', DATAFILETYPE = 'char', ROWTERMINATOR = '\\n', FIELDTERMINATOR = ',');"
      - id: csv_format
        sql: "BULK INSERT t FROM 'data.csv' WITH (FORMAT = 'CSV', FIELDQUOTE = '\"', FIRSTROW = 2, LASTROW = 100);"
      - id: data_source
        sql: "BULK INSERT t FROM 'data.csv' WITH (DATA_SOURCE = 'src', FORMATFILE = 'fmt.xml', FORMATFILE_DATA_SOURCE = 'src');"
      - id: error_handling
        sql: "BULK INSERT t FROM 'data.csv' WITH (MAXERRORS = 10, ERRORFILE = 'err.log', ERRORFILE_DATA_SOURCE = 'src');"
      - id: database_options
        sql: "BULK INSERT t FROM 'data.csv' WITH (KEEPIDENTITY, KEEPNULLS, FIRE_TRIGGERS, CHECK_CONSTRAINTS, TABLOCK);"
      - id: source_options
        sql: "BULK INSERT t FROM 'data.csv' WITH (ORDER (a ASC, b DESC), ROWS_PER_BATCH = 1000, KILOBYTES_PER_BATCH = 64, BATCHSIZE = 500);"
    examples:
      - |-
        BULK INSERT AdventureWorks2022.Sales.SalesOrderDetail
        FROM 'f:\orders\lineitem.tbl'
        WITH (FIELDTERMINATOR = ' |', ROWTERMINATOR = ' |\n');
      - |-
        BULK INSERT AdventureWorks2022.Sales.SalesOrderDetail
        FROM 'f:\orders\lineitem.tbl'
        WITH (FIELDTERMINATOR = ' |', ROWTERMINATOR = ':\n', FIRE_TRIGGERS);
      - |-
        BULK INSERT MyTable
        FROM 'D:\data.csv'
        WITH (CODEPAGE = '65001', DATAFILETYPE = 'char', FIELDTERMINATOR = ',');

  - id: disable_trigger
    name: DISABLE TRIGGER
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/disable-trigger-transact-sql
    tier: medium
    probes:
      - { id: on_object, sql: "DISABLE TRIGGER s.trg ON s.t;" }
      - { id: multiple, sql: "DISABLE TRIGGER trg1, s.trg2 ON t;" }
      - { id: all_on_object, sql: "DISABLE TRIGGER ALL ON t;" }
      - { id: on_database, sql: "DISABLE TRIGGER trg ON DATABASE;" }
      - { id: all_server, sql: "DISABLE TRIGGER ALL ON ALL SERVER;" }
    examples:
      - "DISABLE TRIGGER Person.uAddress ON Person.Address;"
      - "DISABLE Trigger ALL ON ALL SERVER;"

  - id: enable_trigger
    name: ENABLE TRIGGER
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/enable-trigger-transact-sql
    tier: medium
    probes:
      - { id: on_object, sql: "ENABLE TRIGGER s.trg ON s.t;" }
      - { id: multiple, sql: "ENABLE TRIGGER trg1, s.trg2 ON t;" }
      - { id: all_on_object, sql: "ENABLE TRIGGER ALL ON t;" }
      - { id: on_database, sql: "ENABLE TRIGGER trg ON DATABASE;" }
      - { id: all_server, sql: "ENABLE TRIGGER ALL ON ALL SERVER;" }
    examples:
      - "ENABLE Trigger Person.uAddress ON Person.Address;"
      - "ENABLE TRIGGER safety ON DATABASE;"
      - "ENABLE Trigger ALL ON ALL SERVER;"

  - id: update_statistics
    name: UPDATE STATISTICS
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/update-statistics-transact-sql
    tier: medium
    probes:
      - { id: table_only, sql: "UPDATE STATISTICS s.t;" }
      - { id: single_statistics, sql: "UPDATE STATISTICS s.t idx;" }
      - { id: parenthesized_statistics, sql: "UPDATE STATISTICS s.t (stat1, stat2);" }
      - { id: fullscan, sql: "UPDATE STATISTICS t (stat1) WITH FULLSCAN, PERSIST_SAMPLE_PERCENT = ON;" }
      - { id: sample_percent, sql: "UPDATE STATISTICS t (stat1) WITH SAMPLE 50 PERCENT;" }
      - { id: sample_rows, sql: "UPDATE STATISTICS t WITH SAMPLE 1000 ROWS;" }
      - { id: resample_partitions, sql: "UPDATE STATISTICS t WITH RESAMPLE ON PARTITIONS (1, 3 TO 5);" }
      - { id: stats_stream_options, sql: "UPDATE STATISTICS t WITH ROWCOUNT = 1000, PAGECOUNT = 100;" }
      - { id: scope_and_options, sql: "UPDATE STATISTICS t WITH FULLSCAN, ALL, NORECOMPUTE, INCREMENTAL = ON, MAXDOP = 4, AUTO_DROP = ON;" }
      - { id: columns_scope, sql: "UPDATE STATISTICS t WITH COLUMNS;" }
      - { id: index_scope, sql: "UPDATE STATISTICS t WITH INDEX;" }
    examples:
      - "UPDATE STATISTICS Sales.SalesOrderDetail;"
      - "UPDATE STATISTICS Sales.SalesOrderDetail (AK_SalesOrderDetail_rowguid);"
      - |-
        UPDATE STATISTICS Production.Product (Products)
            WITH SAMPLE 50 PERCENT;

  - id: alter_fulltext_index
    name: ALTER FULLTEXT INDEX
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/alter-fulltext-index-transact-sql
    tier: medium
    probes:
      - { id: enable, sql: "ALTER FULLTEXT INDEX ON t ENABLE;" }
      - { id: disable, sql: "ALTER FULLTEXT INDEX ON t DISABLE;" }
      - { id: set_change_tracking, sql: "ALTER FULLTEXT INDEX ON t SET CHANGE_TRACKING = AUTO;" }
      - { id: set_change_tracking_manual, sql: "ALTER FULLTEXT INDEX ON t SET CHANGE_TRACKING MANUAL;" }
      - { id: add_columns, sql: "ALTER FULLTEXT INDEX ON t ADD (c1 TYPE COLUMN tc LANGUAGE 1033 STATISTICAL_SEMANTICS, c2) WITH NO POPULATION;" }
      - { id: alter_column_add_semantics, sql: "ALTER FULLTEXT INDEX ON t ALTER COLUMN c ADD STATISTICAL_SEMANTICS WITH NO POPULATION;" }
      - { id: alter_column_drop_semantics, sql: "ALTER FULLTEXT INDEX ON t ALTER COLUMN c DROP STATISTICAL_SEMANTICS;" }
      - { id: drop_columns, sql: "ALTER FULLTEXT INDEX ON t DROP (c1, c2) WITH NO POPULATION;" }
      - { id: start_population, sql: "ALTER FULLTEXT INDEX ON t START INCREMENTAL POPULATION;" }
      - { id: stop_population, sql: "ALTER FULLTEXT INDEX ON t STOP POPULATION;" }
      - { id: pause_population, sql: "ALTER FULLTEXT INDEX ON t PAUSE POPULATION;" }
      - { id: resume_population, sql: "ALTER FULLTEXT INDEX ON t RESUME POPULATION;" }
      - { id: set_stoplist, sql: "ALTER FULLTEXT INDEX ON t SET STOPLIST = SYSTEM WITH NO POPULATION;" }
      - { id: set_search_property_list, sql: "ALTER FULLTEXT INDEX ON t SET SEARCH PROPERTY LIST = OFF WITH NO POPULATION;" }
    examples:
      - |-
        ALTER FULLTEXT INDEX ON HumanResources.JobCandidate
           SET CHANGE_TRACKING MANUAL;
      - |-
        ALTER FULLTEXT INDEX ON Production.Document
           SET SEARCH PROPERTY LIST DocumentPropertyList;
      - |-
        ALTER FULLTEXT INDEX ON HumanResources.JobCandidate
           START FULL POPULATION;

  - id: alter_login
    name: ALTER LOGIN
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/alter-login-transact-sql
    tier: medium
    probes:
      - { id: enable, sql: "ALTER LOGIN lg ENABLE;" }
      - { id: disable, sql: "ALTER LOGIN lg DISABLE;" }
      - { id: password, sql: "ALTER LOGIN lg WITH PASSWORD = 'pw';" }
      - { id: password_old, sql: "ALTER LOGIN lg WITH PASSWORD = 'new' OLD_PASSWORD = 'old';" }
      - { id: password_hashed, sql: "ALTER LOGIN lg WITH PASSWORD = 0x01000CF35567C60BFB41EBDE4CF700A985A13D773D6B45B90900 HASHED;" }
      - { id: password_must_change_unlock, sql: "ALTER LOGIN lg WITH PASSWORD = 'pw' MUST_CHANGE UNLOCK;" }
      - { id: default_database_language, sql: "ALTER LOGIN lg WITH DEFAULT_DATABASE = db, DEFAULT_LANGUAGE = us_english;" }
      - { id: name, sql: "ALTER LOGIN lg WITH NAME = lg2;" }
      - { id: check_policy_expiration, sql: "ALTER LOGIN lg WITH CHECK_POLICY = OFF, CHECK_EXPIRATION = ON;" }
      - { id: credential, sql: "ALTER LOGIN lg WITH CREDENTIAL = cred;" }
      - { id: no_credential, sql: "ALTER LOGIN lg WITH NO CREDENTIAL;" }
      - { id: add_credential, sql: "ALTER LOGIN lg ADD CREDENTIAL cred;" }
      - { id: drop_credential, sql: "ALTER LOGIN lg DROP CREDENTIAL cred;" }
    examples:
      - "ALTER LOGIN Mary5 ENABLE;"
      - "ALTER LOGIN Mary5 WITH NAME = John2;"
      - "ALTER LOGIN John2 WITH CREDENTIAL = Custodian04;"

  - id: alter_partition_function
    name: ALTER PARTITION FUNCTION
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/alter-partition-function-transact-sql
    tier: medium
    probes:
      - { id: split_range, sql: "ALTER PARTITION FUNCTION pf () SPLIT RANGE (500);" }
      - { id: merge_range, sql: "ALTER PARTITION FUNCTION pf () MERGE RANGE (100);" }
    examples:
      - |-
        ALTER PARTITION FUNCTION myRangePF1 ()
        SPLIT RANGE (500);
      - |-
        ALTER PARTITION FUNCTION myRangePF1 ()
        MERGE RANGE (100);

  - id: alter_partition_scheme
    name: ALTER PARTITION SCHEME
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/alter-partition-scheme-transact-sql
    tier: medium
    probes:
      - { id: next_used_filegroup, sql: "ALTER PARTITION SCHEME ps NEXT USED fg;" }
      - { id: next_used_bare, sql: "ALTER PARTITION SCHEME ps NEXT USED;" }
    examples:
      - |-
        ALTER PARTITION SCHEME MyRangePS1
        NEXT USED test5fg;
