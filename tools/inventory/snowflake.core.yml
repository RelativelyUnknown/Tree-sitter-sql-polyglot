  - id: create_iceberg_table_snowflake
    name: "CREATE ICEBERG TABLE (Snowflake as the Iceberg catalog)"
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-iceberg-table-snowflake
    tier: medium
    probes:
      - { id: basic, sql: "CREATE ICEBERG TABLE t (amount INT) CATALOG = 'SNOWFLAKE' EXTERNAL_VOLUME = 'ev' BASE_LOCATION = 't';" }
      - { id: transient_if_not_exists, sql: "CREATE OR REPLACE TRANSIENT ICEBERG TABLE IF NOT EXISTS t (a INT DEFAULT 0 NOT NULL, b STRING COMMENT 'b');" }
      - { id: partition_by_transforms, sql: "CREATE ICEBERG TABLE t (a INT, b STRING, d DATE, ts TIMESTAMP_NTZ(6)) PARTITION BY (a, BUCKET(16, b), TRUNCATE(4, b), YEAR(d), MONTH(d), DAY(d), HOUR(ts)) PATH_LAYOUT = HIERARCHICAL EXTERNAL_VOLUME = 'ev' CATALOG = 'SNOWFLAKE' BASE_LOCATION = 't';" }
      - { id: properties, sql: "CREATE ICEBERG TABLE t (a INT) CLUSTER BY (a) EXTERNAL_VOLUME = 'ev' CATALOG = 'SNOWFLAKE' BASE_LOCATION = 't' TARGET_FILE_SIZE = '64MB' CATALOG_SYNC = 'oc_int' STORAGE_SERIALIZATION_POLICY = OPTIMIZED DATA_RETENTION_TIME_IN_DAYS = 1 CHANGE_TRACKING = TRUE COMMENT = 'c' ICEBERG_VERSION = 3 ENABLE_DATA_COMPACTION = TRUE ENABLE_SCHEMA_EVOLUTION = FALSE;" }
      - { id: merge_on_read, sql: "CREATE ICEBERG TABLE t (a INT) CATALOG = 'SNOWFLAKE' ICEBERG_MERGE_ON_READ_BEHAVIOR = 'ENABLED' ENABLE_ICEBERG_MERGE_ON_READ = TRUE;" }
      - { id: policies, sql: "CREATE ICEBERG TABLE t (a INT WITH MASKING POLICY mp, b INT) CATALOG = 'SNOWFLAKE' WITH ROW ACCESS POLICY rap ON (b) WITH TAG (tg = 'v');" }
      - { id: ctas, sql: "CREATE OR REPLACE ICEBERG TABLE t (c INT) EXTERNAL_VOLUME = 'ev' CATALOG = 'SNOWFLAKE' BASE_LOCATION = 't' AS SELECT * FROM u;" }
      - { id: ctas_copy_tags, sql: "CREATE OR REPLACE ICEBERG TABLE t COPY TAGS AS SELECT b AS a, a AS b FROM u;" }
      - { id: like, sql: "CREATE OR REPLACE TRANSIENT ICEBERG TABLE t LIKE u CLUSTER BY (a) COPY GRANTS;" }
      - { id: clone, sql: "CREATE ICEBERG TABLE IF NOT EXISTS t CLONE u AT (OFFSET => -3600) COPY GRANTS;" }
    examples:
      - |-
        CREATE OR REPLACE ICEBERG TABLE customer_iceberg_partitioned (
          c_custkey INTEGER,
          c_name STRING,
          c_address STRING,
          c_nationkey INTEGER,
          c_phone STRING,
          c_acctbal INTEGER,
          c_mktsegment STRING,
          c_comment STRING
        )
          PARTITION BY (c_nationkey)
          PATH_LAYOUT = HIERARCHICAL
          EXTERNAL_VOLUME = 'my_ext_vol'
          CATALOG = 'SNOWFLAKE'
          BASE_LOCATION = 'customer_iceberg_partitioned';
      - |-
        CREATE OR REPLACE ICEBERG TABLE iceberg_table_copy (column1 int)
          EXTERNAL_VOLUME = 'my_external_volume'
          CATALOG = 'SNOWFLAKE'
          BASE_LOCATION = 'iceberg_table_copy'
          AS SELECT * FROM base_iceberg_table;
      - |-
        CREATE OR REPLACE ICEBERG TABLE table_with_quoted_external_volume
          EXTERNAL_VOLUME = '"external_volume_1"'
          CATALOG = 'SNOWFLAKE'
          BASE_LOCATION = 'my/relative/path/from/external_volume';
      - |-
        CREATE ICEBERG TABLE my_v3_iceberg_table (
          record VARIANT,
          event_timestamp TIMESTAMP_LTZ(6)
        )
          CATALOG = 'SNOWFLAKE'
          EXTERNAL_VOLUME = 'my_external_volume'
          BASE_LOCATION = 'my_iceberg_table'
          ICEBERG_VERSION = 3;

