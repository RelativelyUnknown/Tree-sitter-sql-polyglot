dialect: spanner
engine: Google Cloud Spanner (GoogleSQL dialect)
version: "current managed service (docs as of 2026-10)"
source: https://cloud.google.com/spanner/docs/reference/standard-sql/data-definition-language

statements:
  - id: create_table
    name: CREATE TABLE
    doc: https://cloud.google.com/spanner/docs/reference/standard-sql/data-definition-language#create_table
    tier: high
    probes:
      - { id: basic, sql: "CREATE TABLE t (c INT64) PRIMARY KEY (c);" }
      - { id: if_not_exists, sql: "CREATE TABLE IF NOT EXISTS t (c INT64) PRIMARY KEY (c);" }
      - { id: column_primary_key, sql: "CREATE TABLE t (c INT64 PRIMARY KEY);" }
      - { id: not_null, sql: "CREATE TABLE t (c INT64 NOT NULL) PRIMARY KEY (c);" }
      - { id: scalar_types, sql: "CREATE TABLE t (a BOOL, b INT64, c FLOAT32, d FLOAT64, e NUMERIC, f STRING(100), g JSON, h BYTES(100), i DATE, j TIMESTAMP) PRIMARY KEY (b);" }
      - { id: length_max, sql: "CREATE TABLE t (c INT64, s STRING(MAX), b BYTES(MAX)) PRIMARY KEY (c);" }
      - { id: length_hex, sql: "CREATE TABLE t (c INT64, s STRING(0x10)) PRIMARY KEY (c);" }
      - { id: array_type, sql: "CREATE TABLE t (c INT64, a ARRAY<INT64>, b ARRAY<STRING(MAX)>) PRIMARY KEY (c);" }
      - { id: array_not_null, sql: "CREATE TABLE t (c INT64, a ARRAY<INT64> NOT NULL) PRIMARY KEY (c);" }
      - { id: array_vector_length, sql: "CREATE TABLE t (c INT64, v ARRAY<FLOAT32>(vector_length=>128)) PRIMARY KEY (c);" }
      - { id: proto_type, sql: "CREATE TABLE t (c INT64, p examples.shipping.Order) PRIMARY KEY (c);" }
      - { id: default, sql: "CREATE TABLE t (c INT64, d INT64 DEFAULT (0)) PRIMARY KEY (c);" }
      - { id: default_not_null, sql: "CREATE TABLE t (c INT64, d INT64 NOT NULL DEFAULT (1)) PRIMARY KEY (c);" }
      - { id: default_on_update, sql: "CREATE TABLE t (c INT64, ts TIMESTAMP NOT NULL DEFAULT (PENDING_COMMIT_TIMESTAMP()) ON UPDATE (PENDING_COMMIT_TIMESTAMP()) OPTIONS (allow_commit_timestamp = true)) PRIMARY KEY (c);" }
      - { id: generated_column, sql: "CREATE TABLE t (c INT64, d INT64, g INT64 AS (c + d)) PRIMARY KEY (c);" }
      - { id: generated_stored, sql: "CREATE TABLE t (c INT64, d INT64, g INT64 AS (c + d) STORED) PRIMARY KEY (c);" }
      - { id: identity_column, sql: "CREATE TABLE t (c INT64 GENERATED BY DEFAULT AS IDENTITY) PRIMARY KEY (c);" }
      - { id: identity_bit_reversed, sql: "CREATE TABLE t (c INT64 GENERATED BY DEFAULT AS IDENTITY (BIT_REVERSED_POSITIVE)) PRIMARY KEY (c);" }
      - { id: identity_skip_range, sql: "CREATE TABLE t (c INT64 GENERATED BY DEFAULT AS IDENTITY (BIT_REVERSED_POSITIVE SKIP RANGE 1, 1000)) PRIMARY KEY (c);" }
      - { id: identity_start_counter, sql: "CREATE TABLE t (c INT64 GENERATED BY DEFAULT AS IDENTITY (BIT_REVERSED_POSITIVE START COUNTER WITH 100)) PRIMARY KEY (c);" }
      - { id: auto_increment, sql: "CREATE TABLE t (c INT64 AUTO_INCREMENT) PRIMARY KEY (c);" }
      - { id: hidden_column, sql: "CREATE TABLE t (c INT64, h STRING(MAX) HIDDEN) PRIMARY KEY (c);" }
      - { id: column_options_commit_timestamp, sql: "CREATE TABLE t (c INT64, ts TIMESTAMP OPTIONS (allow_commit_timestamp = true)) PRIMARY KEY (c);" }
      - { id: column_options_null, sql: "CREATE TABLE t (c INT64, ts TIMESTAMP OPTIONS (allow_commit_timestamp = null)) PRIMARY KEY (c);" }
      - { id: column_options_locality_group, sql: "CREATE TABLE t (c INT64, d STRING(MAX) OPTIONS (locality_group = 'lg')) PRIMARY KEY (c);" }
      - { id: placement_key, sql: "CREATE TABLE t (loc STRING(MAX) NOT NULL PLACEMENT KEY, c INT64) PRIMARY KEY (c);" }
      - { id: check_constraint, sql: "CREATE TABLE t (c INT64, CHECK (c > 0)) PRIMARY KEY (c);" }
      - { id: named_check_constraint, sql: "CREATE TABLE t (c INT64, CONSTRAINT ck CHECK (c > 0)) PRIMARY KEY (c);" }
      - { id: foreign_key, sql: "CREATE TABLE t (c INT64, r INT64, FOREIGN KEY (r) REFERENCES p (id)) PRIMARY KEY (c);" }
      - { id: named_foreign_key, sql: "CREATE TABLE t (c INT64, r INT64, CONSTRAINT fk FOREIGN KEY (r) REFERENCES p (id)) PRIMARY KEY (c);" }
      - { id: foreign_key_multi_column, sql: "CREATE TABLE t (c INT64, a INT64, b INT64, FOREIGN KEY (a, b) REFERENCES p (x, y)) PRIMARY KEY (c);" }
      - { id: foreign_key_on_delete_cascade, sql: "CREATE TABLE t (c INT64, r INT64, FOREIGN KEY (r) REFERENCES p (id) ON DELETE CASCADE) PRIMARY KEY (c);" }
      - { id: foreign_key_on_delete_no_action, sql: "CREATE TABLE t (c INT64, r INT64, FOREIGN KEY (r) REFERENCES p (id) ON DELETE NO ACTION) PRIMARY KEY (c);" }
      - { id: foreign_key_not_enforced, sql: "CREATE TABLE t (c INT64, r INT64, FOREIGN KEY (r) REFERENCES p (id) NOT ENFORCED) PRIMARY KEY (c);" }
      - { id: foreign_key_enforced, sql: "CREATE TABLE t (c INT64, r INT64, FOREIGN KEY (r) REFERENCES p (id) ON DELETE CASCADE ENFORCED) PRIMARY KEY (c);" }
      - { id: synonym_definition, sql: "CREATE TABLE t (c INT64, SYNONYM (s)) PRIMARY KEY (c);" }
      - { id: primary_key_asc_desc, sql: "CREATE TABLE t (a INT64, b INT64) PRIMARY KEY (a ASC, b DESC);" }
      - { id: primary_key_empty, sql: "CREATE TABLE t (c INT64) PRIMARY KEY ();" }
      - { id: interleave_in_parent, sql: "CREATE TABLE t (a INT64, b INT64) PRIMARY KEY (a, b), INTERLEAVE IN PARENT p;" }
      - { id: interleave_in_parent_cascade, sql: "CREATE TABLE t (a INT64, b INT64) PRIMARY KEY (a, b), INTERLEAVE IN PARENT p ON DELETE CASCADE;" }
      - { id: interleave_in_parent_no_action, sql: "CREATE TABLE t (a INT64, b INT64) PRIMARY KEY (a, b), INTERLEAVE IN PARENT p ON DELETE NO ACTION;" }
      - { id: interleave_in, sql: "CREATE TABLE t (a INT64, b INT64) PRIMARY KEY (a, b), INTERLEAVE IN p;" }
      - { id: row_deletion_policy, sql: "CREATE TABLE t (c INT64, ts TIMESTAMP) PRIMARY KEY (c), ROW DELETION POLICY (OLDER_THAN(ts, INTERVAL 30 DAY));" }
      - { id: table_options_locality_group, sql: "CREATE TABLE t (c INT64) PRIMARY KEY (c), OPTIONS (locality_group = 'lg');" }
      - { id: table_options_columnar_policy, sql: "CREATE TABLE t (c INT64) PRIMARY KEY (c), OPTIONS (columnar_policy = 'enabled');" }
      - { id: table_options_fulltext_dictionary_table, sql: "CREATE TABLE t (c INT64) PRIMARY KEY (c), OPTIONS (fulltext_dictionary_table = true);" }
      - { id: table_options_fulltext_dictionary_staleness, sql: "CREATE TABLE t (c INT64) PRIMARY KEY (c), OPTIONS (fulltext_dictionary_staleness = '5s');" }
      - { id: table_options_multiple, sql: "CREATE TABLE t (c INT64) PRIMARY KEY (c), OPTIONS (locality_group = 'lg', columnar_policy = 'enabled');" }
      - { id: interleave_row_deletion_options, sql: "CREATE TABLE t (a INT64, b INT64, ts TIMESTAMP) PRIMARY KEY (a, b), INTERLEAVE IN PARENT p ON DELETE CASCADE, ROW DELETION POLICY (OLDER_THAN(ts, INTERVAL 7 DAY)), OPTIONS (locality_group = 'lg');" }
    examples:
      - "CREATE TABLE MyTable ( col1 INT64 PRIMARY KEY );"
      - "CREATE TABLE Singers ( SingerId INT64 NOT NULL PRIMARY KEY, FirstName STRING(1024), LastName STRING(1024), SingerInfo BYTES(MAX), BirthDate DATE );"

  - id: alter_table
    name: ALTER TABLE
    doc: https://cloud.google.com/spanner/docs/reference/standard-sql/data-definition-language#alter_table
    tier: high
    probes:
      - { id: if_exists, sql: "ALTER TABLE IF EXISTS t DROP COLUMN c;" }
      - { id: add_synonym, sql: "ALTER TABLE t ADD SYNONYM s;" }
      - { id: drop_synonym, sql: "ALTER TABLE t DROP SYNONYM s;" }
      - { id: rename_to, sql: "ALTER TABLE t RENAME TO t2;" }
      - { id: rename_to_add_synonym, sql: "ALTER TABLE t RENAME TO t2, ADD SYNONYM t;" }
      - { id: add_column, sql: "ALTER TABLE t ADD COLUMN c INT64;" }
      - { id: add_column_no_keyword, sql: "ALTER TABLE t ADD c INT64;" }
      - { id: add_column_if_not_exists, sql: "ALTER TABLE t ADD COLUMN IF NOT EXISTS c INT64;" }
      - { id: add_column_not_null_default, sql: "ALTER TABLE t ADD COLUMN c INT64 NOT NULL DEFAULT (0);" }
      - { id: add_column_default_on_update, sql: "ALTER TABLE t ADD COLUMN ts TIMESTAMP DEFAULT (PENDING_COMMIT_TIMESTAMP()) ON UPDATE (PENDING_COMMIT_TIMESTAMP()) OPTIONS (allow_commit_timestamp = true);" }
      - { id: add_column_generated_stored, sql: "ALTER TABLE t ADD COLUMN g INT64 AS (a + b) STORED;" }
      - { id: add_column_not_null_generated_stored, sql: "ALTER TABLE t ADD COLUMN g INT64 NOT NULL AS (a + b) STORED;" }
      - { id: add_column_identity, sql: "ALTER TABLE t ADD COLUMN c INT64 GENERATED BY DEFAULT AS IDENTITY (BIT_REVERSED_POSITIVE);" }
      - { id: add_column_array, sql: "ALTER TABLE t ADD COLUMN a ARRAY<STRING(MAX)>;" }
      - { id: add_column_options, sql: "ALTER TABLE t ADD COLUMN ts TIMESTAMP OPTIONS (allow_commit_timestamp = true);" }
      - { id: add_column_options_locality_group, sql: "ALTER TABLE t ADD COLUMN c STRING(MAX) OPTIONS (locality_group = 'lg');" }
      - { id: drop_column, sql: "ALTER TABLE t DROP COLUMN c;" }
      - { id: drop_column_no_keyword, sql: "ALTER TABLE t DROP c;" }
      - { id: add_check_constraint, sql: "ALTER TABLE t ADD CHECK (c > 0);" }
      - { id: add_named_check_constraint, sql: "ALTER TABLE t ADD CONSTRAINT ck CHECK (c > 0);" }
      - { id: add_foreign_key, sql: "ALTER TABLE t ADD FOREIGN KEY (r) REFERENCES p (id);" }
      - { id: add_named_foreign_key, sql: "ALTER TABLE t ADD CONSTRAINT fk FOREIGN KEY (r) REFERENCES p (id);" }
      - { id: add_foreign_key_on_delete_cascade, sql: "ALTER TABLE t ADD CONSTRAINT fk FOREIGN KEY (r) REFERENCES p (id) ON DELETE CASCADE;" }
      - { id: add_foreign_key_not_enforced, sql: "ALTER TABLE t ADD CONSTRAINT fk FOREIGN KEY (r) REFERENCES p (id) NOT ENFORCED;" }
      - { id: drop_constraint, sql: "ALTER TABLE t DROP CONSTRAINT ck;" }
      - { id: set_on_delete_cascade, sql: "ALTER TABLE t SET ON DELETE CASCADE;" }
      - { id: set_on_delete_no_action, sql: "ALTER TABLE t SET ON DELETE NO ACTION;" }
      - { id: set_interleave_in_parent, sql: "ALTER TABLE t SET INTERLEAVE IN PARENT p;" }
      - { id: set_interleave_in_parent_cascade, sql: "ALTER TABLE t SET INTERLEAVE IN PARENT p ON DELETE CASCADE;" }
      - { id: set_interleave_in, sql: "ALTER TABLE t SET INTERLEAVE IN p;" }
      - { id: alter_column_type, sql: "ALTER TABLE t ALTER COLUMN c STRING(MAX);" }
      - { id: alter_column_type_keyword_optional, sql: "ALTER TABLE t ALTER c STRING(200);" }
      - { id: alter_column_not_null, sql: "ALTER TABLE t ALTER COLUMN c INT64 NOT NULL;" }
      - { id: alter_column_type_default, sql: "ALTER TABLE t ALTER COLUMN c INT64 DEFAULT (0);" }
      - { id: alter_column_type_default_on_update, sql: "ALTER TABLE t ALTER COLUMN ts TIMESTAMP DEFAULT (PENDING_COMMIT_TIMESTAMP()) ON UPDATE (PENDING_COMMIT_TIMESTAMP());" }
      - { id: alter_column_type_generated, sql: "ALTER TABLE t ALTER COLUMN g INT64 AS (a + b);" }
      - { id: alter_column_type_identity, sql: "ALTER TABLE t ALTER COLUMN c INT64 GENERATED BY DEFAULT AS IDENTITY (BIT_REVERSED_POSITIVE);" }
      - { id: alter_column_array, sql: "ALTER TABLE t ALTER COLUMN a ARRAY<FLOAT32>(vector_length=>128);" }
      - { id: alter_column_set_options, sql: "ALTER TABLE t ALTER COLUMN ts SET OPTIONS (allow_commit_timestamp = true);" }
      - { id: alter_column_set_options_null, sql: "ALTER TABLE t ALTER COLUMN ts SET OPTIONS (allow_commit_timestamp = null);" }
      - { id: alter_column_set_options_locality_group, sql: "ALTER TABLE t ALTER COLUMN c SET OPTIONS (locality_group = 'lg');" }
      - { id: alter_column_set_default, sql: "ALTER TABLE t ALTER COLUMN c SET DEFAULT (0);" }
      - { id: alter_column_drop_default, sql: "ALTER TABLE t ALTER COLUMN c DROP DEFAULT;" }
      - { id: alter_column_set_on_update, sql: "ALTER TABLE t ALTER COLUMN ts SET ON UPDATE (PENDING_COMMIT_TIMESTAMP());" }
      - { id: alter_column_drop_on_update, sql: "ALTER TABLE t ALTER COLUMN ts DROP ON UPDATE;" }
      - { id: alter_identity_set_skip_range, sql: "ALTER TABLE t ALTER COLUMN c ALTER IDENTITY SET SKIP RANGE 1, 1000;" }
      - { id: alter_identity_set_no_skip_range, sql: "ALTER TABLE t ALTER COLUMN c ALTER IDENTITY SET NO SKIP RANGE;" }
      - { id: alter_identity_restart_counter, sql: "ALTER TABLE t ALTER COLUMN c ALTER IDENTITY RESTART COUNTER WITH 1;" }
      - { id: add_row_deletion_policy, sql: "ALTER TABLE t ADD ROW DELETION POLICY (OLDER_THAN(ts, INTERVAL 30 DAY));" }
      - { id: drop_row_deletion_policy, sql: "ALTER TABLE t DROP ROW DELETION POLICY;" }
      - { id: replace_row_deletion_policy, sql: "ALTER TABLE t REPLACE ROW DELETION POLICY (OLDER_THAN(ts, INTERVAL 7 DAY));" }
      - { id: set_options_locality_group, sql: "ALTER TABLE t SET OPTIONS (locality_group = 'lg');" }
      - { id: set_options_columnar_policy, sql: "ALTER TABLE t SET OPTIONS (columnar_policy = 'enabled');" }
      - { id: set_options_columnar_policy_null, sql: "ALTER TABLE t SET OPTIONS (columnar_policy = null);" }
      - { id: set_options_fulltext_dictionary_staleness, sql: "ALTER TABLE t SET OPTIONS (fulltext_dictionary_staleness = '5s');" }
    examples: []
