dialect: clickhouse
engine: ClickHouse
version: "current docs (2026)"
source: https://clickhouse.com/docs/sql-reference/statements/

statements:
  - id: begin_transaction
    name: BEGIN TRANSACTION
    doc: https://clickhouse.com/docs/guides/developer/transactional
    tier: high
    probes:
      - id: begin_transaction
        sql: "BEGIN TRANSACTION;"
      - id: start_transaction
        sql: "START TRANSACTION;"
    examples:
      - "BEGIN TRANSACTION;"

  - id: commit
    name: COMMIT
    doc: https://clickhouse.com/docs/guides/developer/transactional
    tier: high
    probes:
      - id: commit
        sql: "COMMIT;"
    examples:
      - "COMMIT;"
