dialect: flink
engine: Apache Flink SQL
version: "2.3"
source: https://nightlies.apache.org/flink/flink-docs-release-2.3/docs/sql/reference/

statements:
  - id: analyze_table
    name: ANALYZE TABLE
    doc: https://nightlies.apache.org/flink/flink-docs-release-2.3/docs/sql/reference/utility/analyze/#syntax
    tier: medium
    probes:
      - id: basic
        sql: "ANALYZE TABLE t COMPUTE STATISTICS;"
      - id: qualified
        sql: "ANALYZE TABLE cat.db.t COMPUTE STATISTICS;"
      - id: partition
        sql: "ANALYZE TABLE t PARTITION (y = '2022', m = '1') COMPUTE STATISTICS;"
      - id: partition_dynamic
        sql: "ANALYZE TABLE t PARTITION (y, m) COMPUTE STATISTICS;"
      - id: for_columns
        sql: "ANALYZE TABLE t COMPUTE STATISTICS FOR COLUMNS c1, c2;"
      - id: for_all_columns
        sql: "ANALYZE TABLE t COMPUTE STATISTICS FOR ALL COLUMNS;"
    examples:
      - "ANALYZE TABLE Store COMPUTE STATISTICS;"
      - "ANALYZE TABLE Store COMPUTE STATISTICS FOR ALL COLUMNS;"
      - "ANALYZE TABLE Store COMPUTE STATISTICS FOR COLUMNS location;"

  - id: call
    name: CALL
    doc: https://nightlies.apache.org/flink/flink-docs-release-2.3/docs/sql/reference/utility/call/#syntax
    tier: medium
    probes:
      - id: no_args
        sql: "CALL p();"
      - id: with_args
        sql: "CALL p(1, 'a');"
      - id: qualified
        sql: "CALL cat.db.p(1 + 2);"
    examples:
      - "CALL `system`.generate_n(4);"

  - id: describe
    name: DESCRIBE / DESC (TABLE, CATALOG, FUNCTION, MODEL)
    doc: https://nightlies.apache.org/flink/flink-docs-release-2.3/docs/sql/reference/utility/describe/#syntax
    tier: medium
    probes:
      - id: describe_table
        sql: "DESCRIBE t;"
      - id: desc_table_qualified
        sql: "DESC cat.db.t;"
      - id: describe_catalog
        sql: "DESCRIBE CATALOG c;"
      - id: describe_catalog_extended
        sql: "DESC CATALOG EXTENDED c;"
      - id: describe_function
        sql: "DESCRIBE FUNCTION f;"
      - id: describe_function_extended
        sql: "DESC FUNCTION EXTENDED cat.db.f;"
      - id: describe_model
        sql: "DESCRIBE MODEL m;"
      - id: describe_model_extended
        sql: "DESC MODEL EXTENDED cat.db.m;"
      - id: describe_job
        sql: "DESCRIBE JOB '228d70913eab60dda85c5e7f78b5782c';"
    examples:
      - "DESCRIBE Orders;"
      - "DESC CATALOG EXTENDED cat2;"
      - "DESC FUNCTION EXTENDED MySum;"

  - id: explain
    name: EXPLAIN
    doc: https://nightlies.apache.org/flink/flink-docs-release-2.3/docs/sql/reference/utility/explain/#syntax
    tier: medium
    probes:
      - id: basic
        sql: "EXPLAIN SELECT a FROM t;"
      - id: plan_for
        sql: "EXPLAIN PLAN FOR SELECT a FROM t;"
      - id: details
        sql: "EXPLAIN (ESTIMATED_COST, CHANGELOG_MODE, JSON_EXECUTION_PLAN) SELECT a FROM t;"
      - id: insert
        sql: "EXPLAIN INSERT INTO t2 SELECT a FROM t;"
      - id: statement_set
        sql: "EXPLAIN STATEMENT SET BEGIN INSERT INTO t2 SELECT a FROM t; INSERT INTO t3 SELECT a FROM t; END;"

  - id: use
    name: USE [CATALOG] / USE MODULES
    doc: https://nightlies.apache.org/flink/flink-docs-release-2.3/docs/sql/reference/utility/use/
    tier: medium
    probes:
      - id: use_catalog
        sql: "USE CATALOG c;"
      - id: use_modules
        sql: "USE MODULES m1, m2;"
      - id: use_database
        sql: "USE db;"
      - id: use_database_qualified
        sql: "USE c.db;"
    examples:
      - "USE CATALOG cat1;"
      - "USE db1;"
      - "USE MODULES hive;"

  - id: set
    name: SET
    doc: https://nightlies.apache.org/flink/flink-docs-release-2.3/docs/sql/reference/utility/set/#syntax
    tier: medium
    probes:
      - id: list
        sql: "SET;"
      - id: key_value
        sql: "SET 'table.local-time-zone' = 'Europe/Berlin';"
    examples:
      - "SET 'table.local-time-zone' = 'Europe/Berlin';"

  - id: reset
    name: RESET
    doc: https://nightlies.apache.org/flink/flink-docs-release-2.3/docs/sql/reference/utility/reset/#syntax
    tier: medium
    probes:
      - id: all
        sql: "RESET;"
      - id: key
        sql: "RESET 'table.planner';"
    examples:
      - "RESET 'table.planner';"
      - "RESET;"

  - id: load_module
    name: LOAD MODULE
    doc: https://nightlies.apache.org/flink/flink-docs-release-2.3/docs/sql/reference/utility/load/#load-module
    tier: medium
    probes:
      - id: basic
        sql: "LOAD MODULE m;"
      - id: with_properties
        sql: "LOAD MODULE m WITH ('k1' = 'v1', 'k2' = 'v2');"
    examples:
      - "LOAD MODULE hive WITH ('hive-version' = '3.1.3');"

  - id: unload_module
    name: UNLOAD MODULE
    doc: https://nightlies.apache.org/flink/flink-docs-release-2.3/docs/sql/reference/utility/unload/#unload-module
    tier: medium
    probes:
      - id: basic
        sql: "UNLOAD MODULE m;"
    examples:
      - "UNLOAD MODULE core;"

  - id: show_catalogs
    name: SHOW CATALOGS
    doc: https://nightlies.apache.org/flink/flink-docs-release-2.3/docs/sql/reference/utility/show/#show-catalogs
    tier: medium
    probes:
      - id: basic
        sql: "SHOW CATALOGS;"
      - id: like
        sql: "SHOW CATALOGS LIKE '%log1';"
      - id: not_like
        sql: "SHOW CATALOGS NOT LIKE '%log1';"
      - id: ilike
        sql: "SHOW CATALOGS ILIKE '%log1';"
      - id: not_ilike
        sql: "SHOW CATALOGS NOT ILIKE '%LOG1';"
    examples:
      - "show catalogs;"
      - "show catalogs like '%log1';"
