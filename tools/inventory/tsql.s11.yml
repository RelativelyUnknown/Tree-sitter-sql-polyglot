dialect: tsql
engine: SQL Server 2022 / Azure SQL Database
version: "2022"
source: https://learn.microsoft.com/en-us/sql/t-sql/statements/statements

statements:
  - id: set_statistics_profile
    name: SET STATISTICS PROFILE
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/set-statistics-profile-transact-sql
    tier: medium
    probes:
      - { id: "on", sql: "SET STATISTICS PROFILE ON;" }
      - { id: "off", sql: "SET STATISTICS PROFILE OFF;" }

  - id: set_statistics_time
    name: SET STATISTICS TIME
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/set-statistics-time-transact-sql
    tier: medium
    probes:
      - { id: "on", sql: "SET STATISTICS TIME ON;" }
      - { id: "off", sql: "SET STATISTICS TIME OFF;" }
    examples:
      - "SET STATISTICS TIME ON;"
      - "SET STATISTICS TIME OFF;"

  - id: set_statistics_xml
    name: SET STATISTICS XML
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/set-statistics-xml-transact-sql
    tier: medium
    probes:
      - { id: "on", sql: "SET STATISTICS XML ON;" }
      - { id: "off", sql: "SET STATISTICS XML OFF;" }
    examples:
      - "SET STATISTICS XML ON;"
      - "SET STATISTICS XML OFF;"

  - id: set_textsize
    name: SET TEXTSIZE
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/set-textsize-transact-sql
    tier: medium
    probes:
      - { id: number, sql: "SET TEXTSIZE 2048;" }
      - { id: zero_default, sql: "SET TEXTSIZE 0;" }

  - id: set_time_zone
    name: SET TIME ZONE
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/set-time-zone-transact-sql
    tier: medium
    probes:
      - { id: time_zone_value, sql: "SET TIME ZONE 'Pacific Standard Time';" }
      - { id: local, sql: "SET TIME ZONE 'LOCAL';" }
    examples:
      - "SET TIME ZONE 'Pacific Standard Time';"
      - "SET TIME ZONE 'India Standard Time';"

  - id: set_xact_abort
    name: SET XACT_ABORT
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/set-xact-abort-transact-sql
    tier: medium
    probes:
      - { id: "on", sql: "SET XACT_ABORT ON;" }
      - { id: "off", sql: "SET XACT_ABORT OFF;" }
    examples:
      - "SET XACT_ABORT OFF;"
      - "SET XACT_ABORT ON;"

  - id: dbcc_checkalloc
    name: DBCC CHECKALLOC
    doc: https://learn.microsoft.com/en-us/sql/t-sql/database-console-commands/dbcc-checkalloc-transact-sql
    tier: low
    probes:
      - { id: basic, sql: "DBCC CHECKALLOC;" }
      - { id: with_options, sql: "DBCC CHECKALLOC (0, NOINDEX) WITH ALL_ERRORMSGS, NO_INFOMSGS;" }

  - id: dbcc_checkcatalog
    name: DBCC CHECKCATALOG
    doc: https://learn.microsoft.com/en-us/sql/t-sql/database-console-commands/dbcc-checkcatalog-transact-sql
    tier: low
    probes:
      - { id: basic, sql: "DBCC CHECKCATALOG;" }
      - { id: with_options, sql: "DBCC CHECKCATALOG (0) WITH NO_INFOMSGS;" }

  - id: dbcc_checkconstraints
    name: DBCC CHECKCONSTRAINTS
    doc: https://learn.microsoft.com/en-us/sql/t-sql/database-console-commands/dbcc-checkconstraints-transact-sql
    tier: low
    probes:
      - { id: basic, sql: "DBCC CHECKCONSTRAINTS;" }
      - { id: with_options, sql: "DBCC CHECKCONSTRAINTS ('t') WITH ALL_CONSTRAINTS, NO_INFOMSGS;" }

  - id: dbcc_checkdb
    name: DBCC CHECKDB
    doc: https://learn.microsoft.com/en-us/sql/t-sql/database-console-commands/dbcc-checkdb-transact-sql
    tier: low
    probes:
      - { id: basic, sql: "DBCC CHECKDB;" }
      - { id: with_options, sql: "DBCC CHECKDB (0, NOINDEX) WITH NO_INFOMSGS, PHYSICAL_ONLY, MAXDOP = 2;" }

  - id: dbcc_checkfilegroup
    name: DBCC CHECKFILEGROUP
    doc: https://learn.microsoft.com/en-us/sql/t-sql/database-console-commands/dbcc-checkfilegroup-transact-sql
    tier: low
    probes:
      - { id: basic, sql: "DBCC CHECKFILEGROUP;" }
      - { id: with_options, sql: "DBCC CHECKFILEGROUP (0, NOINDEX) WITH NO_INFOMSGS, PHYSICAL_ONLY;" }

  - id: dbcc_checkident
    name: DBCC CHECKIDENT
    doc: https://learn.microsoft.com/en-us/sql/t-sql/database-console-commands/dbcc-checkident-transact-sql
    tier: low
    probes:
      - { id: basic, sql: "DBCC CHECKIDENT ('t');" }
      - { id: reseed_with_value, sql: "DBCC CHECKIDENT ('t', RESEED, 100) WITH NO_INFOMSGS;" }

  - id: dbcc_checktable
    name: DBCC CHECKTABLE
    doc: https://learn.microsoft.com/en-us/sql/t-sql/database-console-commands/dbcc-checktable-transact-sql
    tier: low
    probes:
      - { id: basic, sql: "DBCC CHECKTABLE ('t');" }
      - { id: with_options, sql: "DBCC CHECKTABLE ('t', NOINDEX) WITH NO_INFOMSGS, PHYSICAL_ONLY;" }

  - id: dbcc_cleantable
    name: DBCC CLEANTABLE
    doc: https://learn.microsoft.com/en-us/sql/t-sql/database-console-commands/dbcc-cleantable-transact-sql
    tier: low
    probes:
      - { id: basic, sql: "DBCC CLEANTABLE (0, 't');" }
      - { id: batch_size, sql: "DBCC CLEANTABLE ('db', 't', 5000) WITH NO_INFOMSGS;" }

  - id: dbcc_clonedatabase
    name: DBCC CLONEDATABASE
    doc: https://learn.microsoft.com/en-us/sql/t-sql/database-console-commands/dbcc-clonedatabase-transact-sql
    tier: low
    probes:
      - { id: basic, sql: "DBCC CLONEDATABASE (src_db, clone_db);" }
      - { id: with_options, sql: "DBCC CLONEDATABASE (src_db, clone_db) WITH NO_STATISTICS, NO_QUERYSTORE;" }

  - id: dbcc_dbreindex
    name: DBCC DBREINDEX
    doc: https://learn.microsoft.com/en-us/sql/t-sql/database-console-commands/dbcc-dbreindex-transact-sql
    tier: low
    probes:
      - { id: basic, sql: "DBCC DBREINDEX ('t');" }
      - { id: index_fillfactor, sql: "DBCC DBREINDEX ('t', idx, 80) WITH NO_INFOMSGS;" }

  - id: dbcc_dllname_free
    name: DBCC dllname (FREE)
    doc: https://learn.microsoft.com/en-us/sql/t-sql/database-console-commands/dbcc-dllname-free-transact-sql
    tier: low
    probes:
      - { id: free, sql: "DBCC xp_sample (FREE);" }
      - { id: free_no_infomsgs, sql: "DBCC xp_sample (FREE) WITH NO_INFOMSGS;" }

  - id: dbcc_dropcleanbuffers
    name: DBCC DROPCLEANBUFFERS
    doc: https://learn.microsoft.com/en-us/sql/t-sql/database-console-commands/dbcc-dropcleanbuffers-transact-sql
    tier: low
    probes:
      - { id: basic, sql: "DBCC DROPCLEANBUFFERS;" }
      - { id: no_infomsgs, sql: "DBCC DROPCLEANBUFFERS WITH NO_INFOMSGS;" }

  - id: dbcc_dropresultsetcache
    name: DBCC DROPRESULTSETCACHE
    doc: https://learn.microsoft.com/en-us/sql/t-sql/database-console-commands/dbcc-dropresultsetcache-transact-sql
    tier: low
    probes:
      - { id: basic, sql: "DBCC DROPRESULTSETCACHE;" }

  - id: dbcc_flushauthcache
    name: DBCC FLUSHAUTHCACHE
    doc: https://learn.microsoft.com/en-us/sql/t-sql/database-console-commands/dbcc-flushauthcache-transact-sql
    tier: low
    probes:
      - { id: basic, sql: "DBCC FLUSHAUTHCACHE;" }

  - id: dbcc_freeproccache
    name: DBCC FREEPROCCACHE
    doc: https://learn.microsoft.com/en-us/sql/t-sql/database-console-commands/dbcc-freeproccache-transact-sql
    tier: low
    probes:
      - { id: basic, sql: "DBCC FREEPROCCACHE;" }
      - { id: pool_name, sql: "DBCC FREEPROCCACHE ('pool') WITH NO_INFOMSGS;" }
