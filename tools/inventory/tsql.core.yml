dialect: tsql
engine: SQL Server / Azure SQL Database (Transact-SQL)
version: "2022"
source: https://learn.microsoft.com/en-us/sql/t-sql/statements/statements

statements:
  - id: select
    name: "SELECT"
    doc: https://learn.microsoft.com/en-us/sql/t-sql/queries/select-transact-sql
    tier: high
    probes:
      - id: basic
        sql: "SELECT c FROM t;"
      - id: no_from
        sql: "SELECT 1;"
      - id: star
        sql: "SELECT * FROM t;"
      - id: all
        sql: "SELECT ALL c FROM t;"
      - id: distinct
        sql: "SELECT DISTINCT c FROM t;"
      - id: top
        sql: "SELECT TOP (10) c FROM t;"
      - id: top_percent_with_ties
        sql: "SELECT TOP (10) PERCENT WITH TIES c FROM t ORDER BY c;"
      - id: into
        sql: "SELECT c INTO t2 FROM t;"
      - id: from_list
        sql: "SELECT a.c, b.d FROM t AS a, u AS b WHERE a.c = b.c;"
      - id: where
        sql: "SELECT c FROM t WHERE c > 0;"
      - id: group_by_having
        sql: "SELECT c, COUNT(*) FROM t GROUP BY c HAVING COUNT(*) > 1;"
      - id: order_by
        sql: "SELECT c FROM t ORDER BY c DESC;"
      - id: for_clause
        sql: "SELECT c FROM t FOR XML AUTO;"
      - id: option_clause
        sql: "SELECT c FROM t OPTION (MAXDOP 1);"
      - id: with_cte
        sql: "WITH cte AS (SELECT c FROM t) SELECT c FROM cte;"
      - id: with_xmlnamespaces
        sql: "WITH XMLNAMESPACES ('urn:x' AS ns) SELECT c AS 'ns:c' FROM t FOR XML RAW;"
      - id: with_xmlnamespaces_and_cte
        sql: "WITH XMLNAMESPACES ('urn:x' AS ns), cte AS (SELECT c FROM t) SELECT c FROM cte FOR XML PATH;"
      - id: union
        sql: "SELECT c FROM t UNION SELECT c FROM u;"
      - id: except
        sql: "SELECT c FROM t EXCEPT SELECT c FROM u;"
      - id: intersect
        sql: "SELECT c FROM t INTERSECT SELECT c FROM u;"
      - id: parenthesized_query_expression
        sql: "(SELECT c FROM t) UNION (SELECT c FROM u) ORDER BY c;"
      - id: all_clauses
        sql: "SELECT DISTINCT TOP (5) c, COUNT(*) AS n FROM t WHERE c > 1 GROUP BY c HAVING COUNT(*) > 0 ORDER BY c OPTION (RECOMPILE);"
      - id: no_semicolon_batch
        sql: |-
          SELECT c FROM t
          SELECT d FROM u;
        note: "The statement terminator is optional ('[ ; ]' in the syntax block), so two statements can follow each other without one."
    examples:
      - |-
        SELECT p.Name AS ProductName,
            NonDiscountSales = (OrderQty * UnitPrice),
            Discounts = ((OrderQty * UnitPrice) * UnitPriceDiscount)
        FROM Production.Product AS p
        INNER JOIN Sales.SalesOrderDetail AS sod
            ON p.ProductID = sod.ProductID
        ORDER BY ProductName DESC;
      - |-
        SELECT *
        INTO #Bicycles
        FROM AdventureWorks2025.Production.Product
        WHERE ProductNumber LIKE 'BK%';
      - |-
        SELECT DISTINCT Name
        FROM Production.Product AS p
        WHERE EXISTS (
            SELECT *
            FROM Production.ProductModel AS pm
            WHERE p.ProductModelID = pm.ProductModelID
                AND pm.Name LIKE 'Long-Sleeve Logo Jersey%'
        );
      - |-
        SELECT pp.FirstName,
            pp.LastName,
            e.NationalIDNumber
        FROM HumanResources.Employee AS e WITH (INDEX (AK_Employee_NationalIDNumber))
        INNER JOIN Person.Person AS pp
            ON e.BusinessEntityID = pp.BusinessEntityID
        WHERE LastName = 'Johnson';
      - |-
        SELECT ProductID, OrderQty, SUM(LineTotal) AS Total
        FROM Sales.SalesOrderDetail
        WHERE UnitPrice < $5.00
        GROUP BY ProductID, OrderQty
        ORDER BY ProductID, OrderQty
        OPTION (HASH GROUP, FAST 10);

  - id: select_clause
    name: "SELECT clause"
    doc: https://learn.microsoft.com/en-us/sql/t-sql/queries/select-clause-transact-sql
    tier: high
    probes:
      - id: table_star
        sql: "SELECT t.* FROM t;"
      - id: qualified_column
        sql: "SELECT dbo.t.c FROM dbo.t;"
      - id: identity_column
        sql: "SELECT $IDENTITY FROM t;"
      - id: rowguid_column
        sql: "SELECT $ROWGUID FROM t;"
      - id: qualified_identity
        sql: "SELECT t.$IDENTITY, t.$ROWGUID FROM t;"
      - id: udt_property
        sql: "SELECT Location.X FROM Cities;"
      - id: udt_static_property
        sql: "SELECT Location::Lat FROM Cities;"
        note: "udt_column_name { . | :: } property_name form from the select_list syntax."
      - id: udt_method
        sql: "SELECT Location.Distance(@p) FROM Cities;"
      - id: expression
        sql: "SELECT c * 2 + 1 FROM t;"
      - id: alias_as
        sql: "SELECT c AS a FROM t;"
      - id: alias_no_as
        sql: "SELECT c a FROM t;"
      - id: alias_bracketed
        sql: "SELECT AVG(c) AS [Average Price] FROM t;"
      - id: alias_string
        sql: "SELECT c AS 'Column Alias' FROM t;"
      - id: alias_equals
        sql: "SELECT a = c * 2 FROM t;"
      - id: alias_bracketed_equals
        sql: "SELECT [Total Price] = c * 2 FROM t;"
    examples:
      - |-
        SELECT AVG(UnitPrice) AS [Average Price]
        FROM Sales.SalesOrderDetail;

  - id: select_into
    name: "SELECT - INTO clause"
    doc: https://learn.microsoft.com/en-us/sql/t-sql/queries/select-into-clause-transact-sql
    tier: high
    probes:
      - id: basic
        sql: "SELECT c, d INTO t2 FROM t;"
      - id: qualified_target
        sql: "SELECT * INTO db.dbo.t2 FROM t WHERE 1 = 0;"
      - id: temp_table
        sql: "SELECT * INTO #t FROM t;"
      - id: global_temp_table
        sql: "SELECT * INTO ##t FROM t;"
      - id: on_filegroup
        sql: "SELECT * INTO t2 ON FG2 FROM t;"
      - id: on_bracketed_filegroup
        sql: "SELECT * INTO t2 ON [PRIMARY] FROM t;"
      - id: identity_function
        sql: "SELECT IDENTITY(INT, 100, 5) AS id, c INTO t2 FROM t;"
      - id: four_part_source
        sql: "SELECT c INTO t2 FROM srv.db.dbo.t;"
      - id: union_into
        sql: "SELECT c INTO t2 FROM t UNION SELECT c FROM u;"
    examples:
      - |-
        SELECT c.FirstName,
               c.LastName,
               e.JobTitle,
               a.AddressLine1,
               a.City,
               sp.Name AS [State/Province],
               a.PostalCode
        INTO dbo.EmployeeAddresses
        FROM Person.Person AS c
             INNER JOIN HumanResources.Employee AS e
                 ON e.BusinessEntityID = c.BusinessEntityID
             INNER JOIN Person.BusinessEntityAddress AS bea
                 ON e.BusinessEntityID = bea.BusinessEntityID
             INNER JOIN Person.Address AS a
                 ON bea.AddressID = a.AddressID
             INNER JOIN Person.StateProvince AS sp
                 ON sp.StateProvinceID = a.StateProvinceID;
      - |-
        SELECT *
        INTO dbo.NewProducts
        FROM Production.Product
        WHERE ListPrice > $25
              AND ListPrice < $100;
      - |-
        -- Create a new table with columns from the existing table Person.Address.
        -- A new IDENTITY column is created by using the IDENTITY function.
        SELECT IDENTITY (INT, 100, 5) AS AddressID,
               a.AddressLine1,
               a.City,
               b.Name AS State,
               a.PostalCode
        INTO Person.USAddress
        FROM Person.Address AS a
             INNER JOIN Person.StateProvince AS b
                 ON a.StateProvinceID = b.StateProvinceID
        WHERE b.CountryRegionCode = N'US';
      - |-
        -- Use the OPENQUERY function to access the remote data source.
        SELECT DepartmentID,
               Name,
               GroupName,
               ModifiedDate
        INTO dbo.DepartmentsUsingOpenQuery
        FROM OPENQUERY (
            MyLinkServer,
            'SELECT * FROM AdventureWorks2025.HumanResources.Department'
        );
      - |-
        SELECT *
        INTO [dbo].[FactResellerSalesXL] ON FG2
        FROM [dbo].[FactResellerSales];

  - id: from
    name: "FROM clause plus JOIN, APPLY, PIVOT"
    doc: https://learn.microsoft.com/en-us/sql/t-sql/queries/from-transact-sql
    tier: high
    probes:
      - id: table_alias
        sql: "SELECT a.c FROM t AS a;"
      - id: table_alias_no_as
        sql: "SELECT a.c FROM t a;"
      - id: three_part_name
        sql: "SELECT c FROM db.dbo.t;"
      - id: four_part_name
        sql: "SELECT c FROM srv.db.dbo.t;"
      - id: default_schema_name
        sql: "SELECT c FROM db..t;"
        note: "database_name..object_name: the schema part of a multipart name may be omitted."
      - id: bracketed_names
        sql: "SELECT [c] FROM [db].[dbo].[my table];"
      - id: table_hint
        sql: "SELECT c FROM t WITH (NOLOCK);"
      - id: table_hints_list
        sql: "SELECT COUNT(*) FROM t WITH (TABLOCK, HOLDLOCK);"
      - id: alias_and_hint
        sql: "SELECT a.c FROM t AS a WITH (INDEX (idx));"
      - id: tablesample_percent
        sql: "SELECT * FROM t TABLESAMPLE (10 PERCENT);"
      - id: tablesample_system_rows
        sql: "SELECT * FROM t TABLESAMPLE SYSTEM (1000 ROWS);"
      - id: tablesample_repeatable
        sql: "SELECT * FROM t TABLESAMPLE (10 PERCENT) REPEATABLE (205);"
      - id: for_system_time_as_of
        sql: "SELECT c FROM t FOR SYSTEM_TIME AS OF '2014-01-01';"
      - id: for_system_time_from_to
        sql: "SELECT c FROM t FOR SYSTEM_TIME FROM '2013-01-01' TO '2014-01-01';"
      - id: for_system_time_between
        sql: "SELECT c FROM t FOR SYSTEM_TIME BETWEEN '2013-01-01' AND '2014-01-01';"
      - id: for_system_time_contained_in
        sql: "SELECT c FROM t FOR SYSTEM_TIME CONTAINED IN ('2013-01-01', '2014-01-01');"
      - id: for_system_time_all
        sql: "SELECT c FROM t FOR SYSTEM_TIME ALL AS h;"
      - id: for_system_time_variable
        sql: "SELECT c FROM t FOR SYSTEM_TIME AS OF @AsOf;"
      - id: rowset_function_column_aliases
        sql: "SELECT a.* FROM OPENROWSET(BULK 'C:\\data\\f.txt', SINGLE_CLOB) AS a(doc);"
      - id: table_valued_function
        sql: "SELECT * FROM dbo.f(1) AS x;"
      - id: derived_table
        sql: "SELECT d.c FROM (SELECT c FROM t) AS d;"
      - id: derived_table_column_aliases
        sql: "SELECT d.x FROM (SELECT c FROM t) AS d (x);"
      - id: values_derived_table
        sql: "SELECT v.a, v.b FROM (VALUES (1, 2), (3, 4)) AS v (a, b);"
      - id: table_variable
        sql: "SELECT c FROM @tv AS x;"
      - id: variable_function_call
        sql: "SELECT * FROM @x.nodes('/root/row') AS r(n);"
        note: "@variable.function_call ( expression ) [ AS ] table_alias ( column_alias ) form, as used with xml nodes()."
      - id: inner_join
        sql: "SELECT * FROM t INNER JOIN u ON t.c = u.c;"
      - id: join
        sql: "SELECT * FROM t JOIN u ON t.c = u.c;"
      - id: left_join
        sql: "SELECT * FROM t LEFT JOIN u ON t.c = u.c;"
      - id: left_outer_join
        sql: "SELECT * FROM t LEFT OUTER JOIN u ON t.c = u.c;"
      - id: right_outer_join
        sql: "SELECT * FROM t RIGHT OUTER JOIN u ON t.c = u.c;"
      - id: full_outer_join
        sql: "SELECT * FROM t FULL OUTER JOIN u ON t.c = u.c;"
      - id: full_join
        sql: "SELECT * FROM t FULL JOIN u ON t.c = u.c;"
      - id: cross_join
        sql: "SELECT * FROM t CROSS JOIN u;"
      - id: cross_apply
        sql: "SELECT * FROM t CROSS APPLY dbo.f(t.c);"
      - id: outer_apply
        sql: "SELECT * FROM t OUTER APPLY dbo.f(t.c) AS x;"
      - id: cross_apply_subquery
        sql: "SELECT * FROM t CROSS APPLY (SELECT TOP (1) d FROM u WHERE u.c = t.c ORDER BY d) AS x;"
      - id: inner_hash_join
        sql: "SELECT * FROM t INNER HASH JOIN u ON t.c = u.c;"
      - id: left_merge_join
        sql: "SELECT * FROM t LEFT OUTER MERGE JOIN u ON t.c = u.c;"
      - id: parenthesized_join
        sql: "SELECT * FROM t LEFT JOIN (u INNER JOIN v ON u.c = v.c) ON t.c = u.c;"
      - id: nested_join_on_order
        sql: "SELECT * FROM t JOIN u JOIN v ON u.c = v.c ON t.c = u.c;"
        note: "<joined_table> ::= <table_source> <join_type> <table_source> ON ...: the right table_source can itself be a joined_table, so ON clauses may nest."
      - id: pivot
        sql: "SELECT * FROM t PIVOT (SUM(v) FOR k IN ([a], [b])) AS p;"
      - id: unpivot
        sql: "SELECT * FROM t UNPIVOT (v FOR k IN (a, b)) AS u;"
    examples:
      - |-
        SELECT p.ProductID,
            v.BusinessEntityID
        FROM Production.Product AS p
        INNER JOIN Purchasing.ProductVendor AS v
            ON (p.ProductID = v.ProductID);
      - |-
        SELECT e.BusinessEntityID,
            d.Name AS Department
        FROM HumanResources.Employee AS e
        CROSS JOIN HumanResources.Department AS d
        ORDER BY e.BusinessEntityID,
            d.Name;
      - |-
        SELECT p.Name AS ProductName,
            v.Name AS VendorName
        FROM Production.Product AS p
        INNER MERGE JOIN Purchasing.ProductVendor AS pv
            ON p.ProductID = pv.ProductID
        INNER HASH JOIN Purchasing.Vendor AS v
            ON pv.BusinessEntityID = v.BusinessEntityID
        ORDER BY p.Name,
            v.Name;
      - |-
        SELECT *
        FROM Sales.Customer TABLESAMPLE SYSTEM(10 PERCENT);
      - |-
        SELECT DeptID,
            DeptName,
            DeptMgrID,
            EmpID,
            EmpLastName,
            EmpSalary
        FROM Departments d
        CROSS APPLY dbo.GetReports(d.DeptMgrID);

  - id: pivot_unpivot
    name: "FROM - Using PIVOT and UNPIVOT"
    doc: https://learn.microsoft.com/en-us/sql/t-sql/queries/from-using-pivot-and-unpivot
    tier: high
    probes:
      - id: pivot_derived_source
        sql: "SELECT 'c' AS x, [0], [1] FROM (SELECT k, v FROM t) AS s PIVOT (AVG(v) FOR k IN ([0], [1])) AS p;"
      - id: pivot_count
        sql: "SELECT id, [250] AS e1, [251] AS e2 FROM (SELECT o, e, id FROM t) p PIVOT (COUNT (o) FOR e IN ([250], [251])) AS pvt ORDER BY pvt.id;"
      - id: pivot_table_source
        sql: "SELECT * FROM t PIVOT (MAX(v) FOR k IN ([a], [b], [c])) AS p;"
      - id: unpivot_derived_source
        sql: "SELECT id, e, o FROM (SELECT id, e1, e2 FROM t) p UNPIVOT (o FOR e IN (e1, e2)) AS u;"
      - id: unpivot_no_alias
        sql: "SELECT id, e, o FROM t UNPIVOT (o FOR e IN (e1, e2)) u;"
      - id: pivot_then_join
        sql: "SELECT * FROM t PIVOT (SUM(v) FOR k IN ([a], [b])) AS p INNER JOIN u ON p.id = u.id;"
    examples:
      - |-
        -- Pivot table with one row and five columns
        SELECT 'AverageCost' AS CostSortedByProductionDays,
            [0], [1], [2], [3], [4]
        FROM (
            SELECT DaysToManufacture,
                StandardCost
            FROM Production.Product
        ) AS SourceTable
        PIVOT (
            AVG(StandardCost) FOR DaysToManufacture IN
            ([0], [1], [2], [3], [4])
        ) AS PivotTable;
      - |-
        SELECT VendorID,
            [250] AS Emp1,
            [251] AS Emp2,
            [256] AS Emp3,
            [257] AS Emp4,
            [260] AS Emp5
        FROM
        (
            SELECT PurchaseOrderID,
            EmployeeID, VendorID
            FROM Purchasing.PurchaseOrderHeader
        ) p
        PIVOT
        (
            COUNT (PurchaseOrderID)
            FOR EmployeeID IN ([250], [251], [256], [257], [260])
        ) AS pvt
        ORDER BY pvt.VendorID;
      - |-
        -- Unpivot the table.
        SELECT VendorID, Employee, Orders
        FROM (
            SELECT VendorID, Emp1, Emp2, Emp3, Emp4, Emp5
            FROM pvt
        ) p
        UNPIVOT
        (
            Orders FOR Employee IN (Emp1, Emp2, Emp3, Emp4, Emp5)
        ) AS unpvt;

  - id: where
    name: "WHERE"
    doc: https://learn.microsoft.com/en-us/sql/t-sql/queries/where-transact-sql
    tier: high
    probes:
      - id: equality
        sql: "SELECT c FROM t WHERE c = 'Smith';"
      - id: like
        sql: "SELECT c FROM t WHERE c LIKE '%Smi%';"
      - id: and_or_not
        sql: "SELECT c FROM t WHERE c = 1 OR (d <= 500 AND NOT e = 2);"
      - id: in_list
        sql: "SELECT c FROM t WHERE c IN ('Smith', 'Godfrey', 'Johnson');"
      - id: between
        sql: "SELECT c FROM t WHERE c BETWEEN 100 AND 200;"
      - id: is_null
        sql: "SELECT c FROM t WHERE c IS NULL;"
      - id: exists_subquery
        sql: "SELECT c FROM t WHERE EXISTS (SELECT * FROM u WHERE u.c = t.c);"
    examples:
      - |-
        -- Uses AdventureWorksDW
        SELECT EmployeeKey, LastName
        FROM DimEmployee
        WHERE LastName LIKE '%Smi%';
      - |-
        -- Uses AdventureWorksDW
        SELECT EmployeeKey, LastName
        FROM DimEmployee
        WHERE EmployeeKey = 1
              OR EmployeeKey = 8
              OR EmployeeKey = 12;
      - |-
        -- Uses AdventureWorksDW
        SELECT EmployeeKey, LastName
        FROM DimEmployee
        WHERE LastName IN ('Smith', 'Godfrey', 'Johnson');
      - |-
        -- Uses AdventureWorksDW
        SELECT EmployeeKey, LastName
        FROM DimEmployee
        WHERE EmployeeKey BETWEEN 100 AND 200;

  - id: group_by
    name: "SELECT - GROUP BY"
    doc: https://learn.microsoft.com/en-us/sql/t-sql/queries/select-group-by-transact-sql
    tier: high
    probes:
      - id: columns
        sql: "SELECT a, b, SUM(c) FROM t GROUP BY a, b;"
      - id: expression
        sql: "SELECT DATEPART(yyyy, d) AS y, SUM(c) FROM t GROUP BY DATEPART(yyyy, d);"
      - id: rollup
        sql: "SELECT a, b, SUM(c) FROM t GROUP BY ROLLUP (a, b);"
      - id: rollup_composite
        sql: "SELECT a, b, d, SUM(c) FROM t GROUP BY ROLLUP (a, (b, d));"
      - id: cube
        sql: "SELECT a, b, SUM(c) FROM t GROUP BY CUBE (a, b);"
      - id: grouping_sets
        sql: "SELECT a, b, SUM(c) FROM t GROUP BY GROUPING SETS ((a, b), a, ());"
      - id: grouping_sets_nested_rollup_cube
        sql: "SELECT a, b, SUM(c) FROM t GROUP BY GROUPING SETS (ROLLUP (a, b), CUBE (a, b));"
      - id: grand_total
        sql: "SELECT SUM(c) FROM t GROUP BY ();"
      - id: mixed_list
        sql: "SELECT a, b, SUM(c) FROM t GROUP BY a, ROLLUP (b), ();"
      - id: group_by_all
        sql: "SELECT a, SUM(c) FROM t WHERE c > 0 GROUP BY ALL a;"
        note: "Backward-compatible syntax: GROUP BY ALL column-expression [ ,...n ]."
      - id: with_rollup
        sql: "SELECT a, b, SUM(c) FROM t GROUP BY a, b WITH ROLLUP;"
      - id: with_cube
        sql: "SELECT a, b, SUM(c) FROM t GROUP BY a, b WITH CUBE;"
    examples:
      - |-
        SELECT Region,
               Territory,
               SUM(sales) AS TotalSales
        FROM Sales
        GROUP BY Region, Territory;
      - |-
        SELECT Region,
               Territory,
               SUM(Sales) AS TotalSales
        FROM Sales
        GROUP BY ROLLUP(Region, Territory);
      - |-
        SELECT Region,
               Territory,
               SUM(Sales) AS TotalSales
        FROM Sales
        GROUP BY CUBE(Region, Territory);
      - |-
        SELECT Region,
               SUM(Sales) AS TotalSales
        FROM Sales
        GROUP BY GROUPING SETS(Region, ());
      - |-
        SELECT DATEPART(yyyy, OrderDate) AS N'Year',
               SUM(TotalDue) AS N'Total Order Amount'
        FROM Sales.SalesOrderHeader
        GROUP BY DATEPART(yyyy, OrderDate)
        HAVING DATEPART(yyyy, OrderDate) >= N'2003'
        ORDER BY DATEPART(yyyy, OrderDate);

  - id: having
    name: "SELECT - HAVING"
    doc: https://learn.microsoft.com/en-us/sql/t-sql/queries/select-having-transact-sql
    tier: high
    probes:
      - id: aggregate
        sql: "SELECT c, SUM(d) FROM t GROUP BY c HAVING SUM(d) > 100000.00;"
      - id: compound
        sql: "SELECT c FROM t GROUP BY c HAVING SUM(d) > $1000000.00 AND AVG(e) < 3;"
      - id: without_group_by
        sql: "SELECT COUNT(*) FROM t HAVING COUNT(*) > 1;"
    examples:
      - |-
        SELECT SalesOrderID,
               SUM(LineTotal) AS SubTotal
        FROM Sales.SalesOrderDetail
        GROUP BY SalesOrderID
        HAVING SUM(LineTotal) > 100000.00
        ORDER BY SalesOrderID;
      - |-
        -- Uses AdventureWorks
        SELECT OrderDateKey,
               SUM(SalesAmount) AS TotalSales
        FROM FactInternetSales
        GROUP BY OrderDateKey
        HAVING SUM(SalesAmount) > 80000
        ORDER BY OrderDateKey;

  - id: order_by
    name: "SELECT - ORDER BY clause"
    doc: https://learn.microsoft.com/en-us/sql/t-sql/queries/select-order-by-clause-transact-sql
    tier: high
    probes:
      - id: column
        sql: "SELECT c FROM t ORDER BY c;"
      - id: asc_desc_list
        sql: "SELECT a, b FROM t ORDER BY a ASC, b DESC;"
      - id: ordinal
        sql: "SELECT a, b FROM t ORDER BY 2;"
      - id: expression
        sql: "SELECT a FROM t ORDER BY DATEPART(year, d);"
      - id: collate
        sql: "SELECT name FROM t ORDER BY name COLLATE Latin1_General_CS_AS;"
      - id: case_expression
        sql: "SELECT a FROM t ORDER BY CASE b WHEN 1 THEN a END DESC, CASE WHEN b = 0 THEN a END;"
      - id: offset_rows
        sql: "SELECT a FROM t ORDER BY a OFFSET 5 ROWS;"
      - id: offset_row
        sql: "SELECT a FROM t ORDER BY a OFFSET 1 ROW;"
      - id: offset_fetch_next
        sql: "SELECT a FROM t ORDER BY a OFFSET 0 ROWS FETCH NEXT 10 ROWS ONLY;"
      - id: offset_fetch_first_row
        sql: "SELECT a FROM t ORDER BY a OFFSET 0 ROWS FETCH FIRST 1 ROW ONLY;"
      - id: offset_fetch_variables
        sql: "SELECT a FROM t ORDER BY a OFFSET @skip ROWS FETCH NEXT @take ROWS ONLY;"
      - id: offset_fetch_expressions
        sql: "SELECT a FROM t ORDER BY a OFFSET @s - 1 ROWS FETCH NEXT @e - @s + 1 ROWS ONLY;"
      - id: offset_fetch_subquery
        sql: "SELECT a FROM t ORDER BY a OFFSET 0 ROWS FETCH NEXT (SELECT n FROM s WHERE id = 1) ROWS ONLY;"
      - id: set_operation
        sql: "SELECT a FROM t UNION SELECT a FROM u ORDER BY a;"
    examples:
      - |-
        SELECT ProductID,
               Name
        FROM Production.Product
        WHERE Name LIKE 'Lock Washer%'
        ORDER BY ProductID;
      - |-
        SELECT LastName,
               FirstName
        FROM Person.Person
        WHERE LastName LIKE 'R%'
        ORDER BY FirstName ASC, LastName DESC;
      - |-
        -- This query uses the collation specified in the ORDER BY clause for sorting.
        SELECT name
        FROM #t1
        ORDER BY name COLLATE Latin1_General_CS_AS;
      - |-
        SELECT BusinessEntityID,
               SalariedFlag
        FROM HumanResources.Employee
        ORDER BY
            CASE SalariedFlag
                WHEN 1 THEN BusinessEntityID
            END DESC,
            CASE
                WHEN SalariedFlag = 0 THEN BusinessEntityID
            END;
      - |-
        -- Skip 0 rows and return only the first 10 rows from the sorted result set.
        SELECT DepartmentID,
               Name,
               GroupName
        FROM HumanResources.Department
        ORDER BY DepartmentID OFFSET 0 ROWS
        FETCH NEXT 10 ROWS ONLY;

  - id: window_clause
    name: "SELECT - WINDOW clause"
    doc: https://learn.microsoft.com/en-us/sql/t-sql/queries/select-window-transact-sql
    tier: high
    probes:
      - id: partition_order
        sql: "SELECT ROW_NUMBER() OVER win AS rn, c FROM t WINDOW win AS (PARTITION BY c ORDER BY d DESC) ORDER BY c;"
      - id: partition_only
        sql: "SELECT SUM(c) OVER win FROM t WINDOW win AS (PARTITION BY d);"
      - id: frame
        sql: "SELECT SUM(c) OVER win FROM t WINDOW win AS (ORDER BY d ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW);"
      - id: range_frame
        sql: "SELECT SUM(c) OVER win FROM t WINDOW win AS (ORDER BY d RANGE UNBOUNDED PRECEDING);"
      - id: order_collate
        sql: "SELECT ROW_NUMBER() OVER win FROM t WINDOW win AS (ORDER BY c COLLATE Latin1_General_CS_AS ASC);"
      - id: reference_in_over
        sql: "SELECT SUM(c) OVER (win PARTITION BY d) FROM t WINDOW win AS (ORDER BY e);"
      - id: reference_with_frame
        sql: "SELECT COUNT(c) OVER (win ROWS BETWEEN UNBOUNDED PRECEDING AND 1 FOLLOWING) FROM t WINDOW win AS (ORDER BY e);"
      - id: multiple_windows_references
        sql: "SELECT SUM(c) OVER w2, AVG(c) OVER w1 FROM t WINDOW w1 AS (w3), w2 AS (ORDER BY d), w3 AS (w2 PARTITION BY e);"
    examples:
      - |-
        SELECT ROW_NUMBER() OVER win AS [Row Number],
               p.LastName,
               s.SalesYTD,
               a.PostalCode
        FROM Sales.SalesPerson AS s
             INNER JOIN Person.Person AS p
                 ON s.BusinessEntityID = p.BusinessEntityID
             INNER JOIN Person.Address AS a
                 ON a.AddressID = p.BusinessEntityID
        WHERE TerritoryID IS NOT NULL
              AND SalesYTD <> 0
        WINDOW win AS (
            PARTITION BY PostalCode ORDER BY SalesYTD DESC
        )
        ORDER BY PostalCode;
      - |-
        SELECT SalesOrderID,
               ProductID,
               OrderQty,
               SUM(OrderQty) OVER win AS [Total],
               AVG(OrderQty) OVER win AS [Avg],
               COUNT(OrderQty) OVER win AS [Count],
               MIN(OrderQty) OVER win AS [Min],
               MAX(OrderQty) OVER win AS [Max]
        FROM Sales.SalesOrderDetail
        WHERE SalesOrderID IN (43659, 43664)
        WINDOW win AS (PARTITION BY SalesOrderID);
      - |-
        SELECT SalesOrderID AS OrderNumber,
               ProductID,
               OrderQty AS Qty,
               SUM(OrderQty) OVER win AS Total,
               AVG(OrderQty) OVER (
                   win PARTITION BY SalesOrderID
               ) AS Avg,
               COUNT(OrderQty) OVER (
                   win ROWS BETWEEN UNBOUNDED PRECEDING AND 1 FOLLOWING
               ) AS Count
        FROM Sales.SalesOrderDetail
        WHERE SalesOrderID IN (43659, 43664)
              AND ProductID LIKE '71%'
        WINDOW win AS (
            ORDER BY SalesOrderID, ProductID
        );
      - |-
        SELECT SalesOrderID AS OrderNumber,
               ProductID,
               OrderQty AS Qty,
               SUM(OrderQty) OVER win2 AS Total,
               AVG(OrderQty) OVER win1 AS Avg
        FROM Sales.SalesOrderDetail
        WHERE SalesOrderID IN (43659, 43664)
              AND ProductID LIKE '71%'
        WINDOW win1 AS (win3),
               win2 AS (ORDER BY SalesOrderID, ProductID),
               win3 AS (win2 PARTITION BY SalesOrderID);

  - id: for_clause
    name: "SELECT - FOR clause (FOR BROWSE, FOR XML, FOR JSON)"
    doc: https://learn.microsoft.com/en-us/sql/t-sql/queries/select-for-clause-transact-sql
    tier: high
    probes:
      - id: browse
        sql: "SELECT c FROM t FOR BROWSE;"
      - id: xml_raw
        sql: "SELECT c FROM t FOR XML RAW;"
      - id: xml_raw_element_name
        sql: "SELECT c FROM t FOR XML RAW ('row');"
      - id: xml_auto
        sql: "SELECT c FROM t FOR XML AUTO;"
      - id: xml_explicit
        sql: "SELECT 1 AS Tag, NULL AS Parent, c AS [r!1!c] FROM t FOR XML EXPLICIT;"
      - id: xml_path
        sql: "SELECT c FROM t FOR XML PATH;"
      - id: xml_path_empty_name
        sql: "SELECT ',' + c FROM t FOR XML PATH ('');"
      - id: xml_binary_base64
        sql: "SELECT c FROM t FOR XML AUTO, BINARY BASE64;"
      - id: xml_type
        sql: "SELECT c FROM t FOR XML PATH, TYPE;"
      - id: xml_root
        sql: "SELECT c FROM t FOR XML PATH ('r'), ROOT ('rows');"
      - id: xml_root_no_name
        sql: "SELECT c FROM t FOR XML RAW, ROOT;"
      - id: xml_xmldata
        sql: "SELECT c FROM t FOR XML RAW, XMLDATA;"
      - id: xml_xmlschema
        sql: "SELECT c FROM t FOR XML AUTO, XMLSCHEMA ('urn:x');"
      - id: xml_elements_xsinil
        sql: "SELECT c FROM t FOR XML AUTO, TYPE, XMLSCHEMA, ELEMENTS XSINIL;"
      - id: xml_elements_absent
        sql: "SELECT c FROM t FOR XML PATH, ELEMENTS ABSENT;"
      - id: xml_explicit_xmldata
        sql: "SELECT 1 AS Tag, NULL AS Parent, c AS [r!1!c] FROM t FOR XML EXPLICIT, XMLDATA;"
      - id: json_auto
        sql: "SELECT c FROM t FOR JSON AUTO;"
      - id: json_path
        sql: "SELECT c AS 'a.b' FROM t FOR JSON PATH;"
      - id: json_root
        sql: "SELECT c FROM t FOR JSON PATH, ROOT ('info');"
      - id: json_include_null_values
        sql: "SELECT c FROM t FOR JSON AUTO, INCLUDE_NULL_VALUES;"
      - id: json_without_array_wrapper
        sql: "SELECT c FROM t FOR JSON PATH, WITHOUT_ARRAY_WRAPPER;"
      - id: json_all_options
        sql: "SELECT c FROM t FOR JSON PATH, ROOT, INCLUDE_NULL_VALUES;"
      - id: nested_for_json_subquery
        sql: "SELECT a, (SELECT b FROM u WHERE u.a = t.a FOR JSON PATH) AS items FROM t FOR JSON PATH;"
    examples:
      - |-
        SELECT tleft.c1
           FROM tleft
                RIGHT OUTER JOIN tright
                    ON tleft.c1 = tright.c1
           WHERE tright.c1 <> 2;
      - |-
        SELECT CAST (
            (SELECT column1,
                    column2
            FROM my_table
            FOR XML PATH ('')) AS VARCHAR (MAX)
        ) AS XMLDATA;
      - |-
        SELECT p.BusinessEntityID,
               FirstName,
               LastName,
               PhoneNumber AS Phone
        FROM Person.Person AS p
             INNER JOIN Person.PersonPhone AS pph
                 ON p.BusinessEntityID = pph.BusinessEntityID
        WHERE LastName LIKE 'G%'
        ORDER BY LastName, FirstName
        FOR XML AUTO, TYPE, XMLSCHEMA, ELEMENTS XSINIL;

  - id: option_clause
    name: "OPTION clause"
    doc: https://learn.microsoft.com/en-us/sql/t-sql/queries/option-clause-transact-sql
    tier: high
    probes:
      - id: select
        sql: "SELECT c FROM t OPTION (HASH GROUP, FAST 10);"
      - id: update
        sql: "UPDATE t SET c = 1 WHERE d = 2 OPTION (LOOP JOIN);"
      - id: delete
        sql: "DELETE FROM t WHERE c = 1 OPTION (MAXDOP 1);"
      - id: insert_select
        sql: "INSERT INTO t (c) SELECT c FROM u OPTION (RECOMPILE);"
      - id: merge
        sql: "MERGE t USING u ON t.c = u.c WHEN MATCHED THEN DELETE OPTION (LOOP JOIN);"
      - id: after_order_by
        sql: "SELECT c FROM t ORDER BY c OPTION (FORCE ORDER);"
    examples:
      - |-
        SELECT ProductID,
            OrderQty,
            SUM(LineTotal) AS Total
        FROM Sales.SalesOrderDetail
        WHERE UnitPrice < $5.00
        GROUP BY ProductID, OrderQty
        ORDER BY ProductID, OrderQty
        OPTION (HASH GROUP, FAST 10);
      - |-
        -- Uses AdventureWorks

        SELECT COUNT(*) FROM dbo.DimCustomer a
        INNER JOIN dbo.FactInternetSales b
            ON (a.CustomerKey = b.CustomerKey)
        OPTION (HASH JOIN);
      - |-
        SELECT COUNT(*)
        FROM dbo.CustomerView a
        INNER JOIN dbo.FactInternetSales b
            ON (a.CustomerKey = b.CustomerKey)
        OPTION (HASH JOIN);

  - id: query_hints
    name: "Hints - Query"
    doc: https://learn.microsoft.com/en-us/sql/t-sql/queries/hints-transact-sql-query
    tier: high
    probes:
      - id: hash_group
        sql: "SELECT c, COUNT(*) FROM t GROUP BY c OPTION (HASH GROUP);"
      - id: order_group
        sql: "SELECT c, COUNT(*) FROM t GROUP BY c OPTION (ORDER GROUP);"
      - id: concat_union
        sql: "SELECT c FROM t UNION SELECT c FROM u OPTION (CONCAT UNION);"
      - id: hash_union
        sql: "SELECT c FROM t UNION SELECT c FROM u OPTION (HASH UNION);"
      - id: merge_union
        sql: "SELECT c FROM t UNION SELECT c FROM u OPTION (MERGE UNION);"
      - id: loop_join
        sql: "SELECT * FROM t JOIN u ON t.c = u.c OPTION (LOOP JOIN);"
      - id: merge_join
        sql: "SELECT * FROM t JOIN u ON t.c = u.c OPTION (MERGE JOIN);"
      - id: hash_join
        sql: "SELECT * FROM t JOIN u ON t.c = u.c OPTION (HASH JOIN);"
      - id: disable_optimized_plan_forcing
        sql: "SELECT c FROM t OPTION (DISABLE_OPTIMIZED_PLAN_FORCING);"
      - id: expand_views
        sql: "SELECT c FROM v OPTION (EXPAND VIEWS);"
      - id: fast
        sql: "SELECT c FROM t OPTION (FAST 10);"
      - id: force_order
        sql: "SELECT * FROM t JOIN u ON t.c = u.c OPTION (FORCE ORDER);"
      - id: force_externalpushdown
        sql: "SELECT c FROM ext OPTION (FORCE EXTERNALPUSHDOWN);"
      - id: disable_externalpushdown
        sql: "SELECT c FROM ext OPTION (DISABLE EXTERNALPUSHDOWN);"
      - id: force_scaleoutexecution
        sql: "SELECT c FROM ext OPTION (FORCE SCALEOUTEXECUTION);"
      - id: ignore_nonclustered_columnstore_index
        sql: "SELECT c FROM t OPTION (IGNORE_NONCLUSTERED_COLUMNSTORE_INDEX);"
      - id: keep_plan
        sql: "SELECT c FROM t OPTION (KEEP PLAN);"
      - id: keepfixed_plan
        sql: "SELECT c FROM t OPTION (KEEPFIXED PLAN);"
      - id: max_grant_percent
        sql: "SELECT c FROM t OPTION (MAX_GRANT_PERCENT = 10);"
      - id: min_grant_percent
        sql: "SELECT c FROM t OPTION (MIN_GRANT_PERCENT = 5.5);"
      - id: maxdop
        sql: "SELECT c FROM t OPTION (MAXDOP 2);"
      - id: maxrecursion
        sql: "WITH r AS (SELECT 1 AS n UNION ALL SELECT n + 1 FROM r WHERE n < 200) SELECT n FROM r OPTION (MAXRECURSION 200);"
      - id: no_performance_spool
        sql: "SELECT c FROM t OPTION (NO_PERFORMANCE_SPOOL);"
      - id: optimize_for_value
        sql: "SELECT c FROM t WHERE c = @p OPTION (OPTIMIZE FOR (@p = 'Seattle'));"
      - id: optimize_for_variable_unknown
        sql: "SELECT c FROM t WHERE c = @p AND d = @q OPTION (OPTIMIZE FOR (@p UNKNOWN, @q = 98104));"
      - id: optimize_for_unknown
        sql: "SELECT c FROM t WHERE c = @p OPTION (OPTIMIZE FOR UNKNOWN);"
      - id: parameterization_simple
        sql: "SELECT c FROM t WHERE c = 1 OPTION (PARAMETERIZATION SIMPLE);"
      - id: parameterization_forced
        sql: "SELECT c FROM t WHERE c = 1 OPTION (PARAMETERIZATION FORCED);"
      - id: querytraceon
        sql: "SELECT c FROM t OPTION (QUERYTRACEON 4199);"
      - id: recompile
        sql: "SELECT c FROM t OPTION (RECOMPILE);"
      - id: robust_plan
        sql: "SELECT c FROM t OPTION (ROBUST PLAN);"
      - id: use_hint
        sql: "SELECT c FROM t OPTION (USE HINT ('ASSUME_MIN_SELECTIVITY_FOR_FILTER_ESTIMATES', 'DISABLE_PARAMETER_SNIFFING'));"
      - id: use_plan
        sql: "SELECT c FROM t OPTION (USE PLAN N'<ShowPlanXML xmlns=\"http://schemas.microsoft.com/sqlserver/2004/07/showplan\" Version=\"1.0\"></ShowPlanXML>');"
      - id: table_hint_index
        sql: "SELECT c FROM t AS a WHERE c = 1 OPTION (TABLE HINT (a, INDEX (ix_c)));"
      - id: table_hint_index_equals
        sql: "SELECT c FROM t AS a OPTION (TABLE HINT (a, INDEX = (ix_c)));"
      - id: table_hint_forceseek_columns
        sql: "SELECT c FROM t AS a OPTION (TABLE HINT (a, FORCESEEK (ix_c (c))));"
      - id: table_hint_multiple
        sql: "SELECT c FROM t AS a OPTION (TABLE HINT (a, NOLOCK, INDEX (ix_c), FORCESCAN));"
      - id: table_hint_no_hints
        sql: "SELECT c FROM t AS a WITH (INDEX (ix_c)) OPTION (TABLE HINT (a));"
        note: "TABLE HINT ( exposed_object_name ) with no table_hint clears the hints on that object."
      - id: table_hint_noexpand_index
        sql: "SELECT c FROM v OPTION (TABLE HINT (v, NOEXPAND, INDEX (ix_v)));"
      - id: table_hint_spatial_window_max_cells
        sql: "SELECT c FROM t OPTION (TABLE HINT (t, SPATIAL_WINDOW_MAX_CELLS = 512));"
      - id: multiple_hints
        sql: "SELECT c FROM t OPTION (RECOMPILE, MAXDOP 1, USE HINT ('QUERY_OPTIMIZER_COMPATIBILITY_LEVEL_110'));"
    examples:
      - |-
        SELECT *
        FROM Sales.Customer AS c
        INNER JOIN Sales.CustomerAddress AS ca ON c.CustomerID = ca.CustomerID
        WHERE TerritoryID = 5
        OPTION (MERGE JOIN);
      - |-
        --Creates an infinite loop
        WITH cte (CustomerID, PersonID, StoreID) AS
        (
            SELECT CustomerID, PersonID, StoreID
            FROM Sales.Customer
            WHERE PersonID IS NOT NULL
          UNION ALL
            SELECT cte.CustomerID, cte.PersonID, cte.StoreID
            FROM cte
            JOIN  Sales.Customer AS e
                ON cte.PersonID = e.CustomerID
        )
        --Uses MAXRECURSION to limit the recursive levels to 2
        SELECT CustomerID, PersonID, StoreID
        FROM cte
        OPTION (MAXRECURSION 2);
      - |-
        SELECT *
        FROM HumanResources.Employee AS e1
        UNION
        SELECT *
        FROM HumanResources.Employee AS e2
        OPTION (MERGE UNION);
      - |-
        SELECT * FROM Person.Address
        WHERE City = 'SEATTLE' AND PostalCode = 98104
        OPTION (RECOMPILE, USE HINT ('ASSUME_MIN_SELECTIVITY_FOR_FILTER_ESTIMATES', 'DISABLE_PARAMETER_SNIFFING'));
      - |-
        SELECT *
        FROM Person.Address
        WHERE City = 'SEATTLE'
              AND PostalCode = 98104
        OPTION (QUERYTRACEON 4199);

  - id: table_hints
    name: "Hints - Table"
    doc: https://learn.microsoft.com/en-us/sql/t-sql/queries/hints-transact-sql-table
    tier: high
    probes:
      - id: noexpand
        sql: "SELECT c FROM v WITH (NOEXPAND);"
      - id: forcescan
        sql: "SELECT c FROM t WITH (FORCESCAN);"
      - id: holdlock
        sql: "SELECT c FROM t WITH (HOLDLOCK);"
      - id: nolock
        sql: "SELECT c FROM t WITH (NOLOCK);"
      - id: nowait
        sql: "SELECT c FROM t WITH (NOWAIT);"
      - id: paglock
        sql: "SELECT c FROM t WITH (PAGLOCK);"
      - id: readcommitted
        sql: "SELECT c FROM t WITH (READCOMMITTED);"
      - id: readcommittedlock
        sql: "SELECT c FROM t WITH (READCOMMITTEDLOCK);"
      - id: readpast
        sql: "SELECT c FROM t WITH (READPAST);"
      - id: readuncommitted
        sql: "SELECT c FROM t WITH (READUNCOMMITTED);"
      - id: repeatableread
        sql: "SELECT c FROM t WITH (REPEATABLEREAD);"
      - id: rowlock
        sql: "SELECT c FROM t WITH (ROWLOCK);"
      - id: serializable
        sql: "SELECT c FROM t WITH (SERIALIZABLE);"
      - id: snapshot
        sql: "SELECT c FROM t WITH (SNAPSHOT);"
      - id: tablock
        sql: "SELECT c FROM t WITH (TABLOCK);"
      - id: tablockx
        sql: "SELECT c FROM t WITH (TABLOCKX);"
      - id: updlock
        sql: "SELECT c FROM t WITH (UPDLOCK);"
      - id: xlock
        sql: "SELECT c FROM t WITH (XLOCK);"
      - id: noexpand_index
        sql: "SELECT c FROM v WITH (NOEXPAND, INDEX (ix_v));"
      - id: index_list
        sql: "SELECT c FROM t WITH (INDEX (ix_a, ix_b));"
      - id: index_number
        sql: "SELECT c FROM t WITH (INDEX (0));"
      - id: index_equals
        sql: "SELECT c FROM t WITH (INDEX = ix_a);"
        note: "INDEX = ( index_value ); the Remarks and the SELECT examples also write it unparenthesized (WITH (INDEX = 0))."
      - id: index_equals_parenthesized
        sql: "SELECT c FROM t WITH (INDEX = (ix_a));"
      - id: forceseek
        sql: "SELECT c FROM t WITH (FORCESEEK);"
      - id: forceseek_index_columns
        sql: "SELECT c FROM t WITH (FORCESEEK (ix_a (c, d)));"
      - id: force_ann_only
        sql: "SELECT t.id FROM VECTOR_SEARCH(TABLE = dbo.t, COLUMN = v, SIMILAR_TO = @q, METRIC = 'cosine', TOP_N = 10) AS s WITH (FORCE_ANN_ONLY);"
      - id: spatial_window_max_cells
        sql: "SELECT c FROM t WITH (SPATIAL_WINDOW_MAX_CELLS = 512);"
      - id: hint_list_commas
        sql: "SELECT c FROM t WITH (TABLOCK, INDEX (myindex));"
      - id: hint_list_spaces
        sql: "SELECT c FROM t WITH (UPDLOCK HOLDLOCK);"
        note: "[ [ , ] ...n ]: the comma between table hints is optional."
      - id: legacy_without_with
        sql: "SELECT c FROM t (TABLOCK);"
        note: "Documented form 'FROM t (TABLOCK)'; omitting WITH is deprecated but still accepted for some hints."
      - id: update_target_hint
        sql: "UPDATE t WITH (ROWLOCK) SET c = 50 WHERE d = 150;"
      - id: delete_target_hint
        sql: "DELETE FROM t WITH (READPAST) WHERE c = 1;"
      - id: insert_target_hint
        sql: "INSERT INTO t WITH (TABLOCK) (c) VALUES (1);"
      - id: limited_keepidentity
        sql: "INSERT INTO t WITH (KEEPIDENTITY) (id, c) SELECT id, c FROM OPENROWSET(BULK 'C:\\data\\f.dat', FORMATFILE = 'C:\\data\\f.fmt') AS b;"
      - id: limited_keepdefaults
        sql: "INSERT INTO t WITH (KEEPDEFAULTS) (c) SELECT c FROM OPENROWSET(BULK 'C:\\data\\f.dat', FORMATFILE = 'C:\\data\\f.fmt') AS b;"
      - id: limited_ignore_constraints
        sql: "INSERT INTO t WITH (IGNORE_CONSTRAINTS) (c) SELECT c FROM OPENROWSET(BULK 'C:\\data\\f.dat', FORMATFILE = 'C:\\data\\f.fmt') AS b;"
      - id: limited_ignore_triggers
        sql: "INSERT INTO t WITH (IGNORE_TRIGGERS, TABLOCK) (c) SELECT c FROM OPENROWSET(BULK 'C:\\data\\f.dat', FORMATFILE = 'C:\\data\\f.fmt') AS b;"
    examples:
      - |-
        UPDATE [dbo].[FactResellerSalesXL_CCI] WITH (ROWLOCK)
            SET UnitPrice = 50
        WHERE ProductKey = 150;
      - |-
        SELECT *
        FROM dbo.Customers AS c WITH (SNAPSHOT)
             LEFT OUTER JOIN dbo.[Order History] AS oh
                 ON c.customer_id = oh.customer_id;
      - |-
        SELECT StartDate, ComponentID
        FROM Production.BillOfMaterials
        WITH (INDEX (FIBillOfMaterialsWithComponentID))
        WHERE ComponentID IN (533, 324, 753, 855, 924);
      - |-
        SELECT *
        FROM Sales.SalesOrderHeader AS h
             INNER JOIN Sales.SalesOrderDetail AS d WITH (FORCESEEK)
                 ON h.SalesOrderID = d.SalesOrderID
        WHERE h.TotalDue > 100
              AND (d.OrderQty > 5
                   OR d.LineTotal < 1000.00);
      - |-
        SELECT h.SalesOrderID,
               h.TotalDue,
               d.OrderQty
        FROM Sales.SalesOrderHeader AS h
             INNER JOIN Sales.SalesOrderDetail AS d
                 WITH (FORCESEEK (PK_SalesOrderDetail_SalesOrderID_SalesOrderDetailID (SalesOrderID)))
                 ON h.SalesOrderID = d.SalesOrderID
        WHERE h.TotalDue > 100
              AND (d.OrderQty > 5
                   OR d.LineTotal < 1000.00);

  - id: join_hints
    name: "Hints - Join"
    doc: https://learn.microsoft.com/en-us/sql/t-sql/queries/hints-transact-sql-join
    tier: high
    probes:
      - id: inner_loop
        sql: "SELECT * FROM t INNER LOOP JOIN u ON t.c = u.c;"
      - id: inner_hash
        sql: "SELECT * FROM t INNER HASH JOIN u ON t.c = u.c;"
      - id: inner_merge
        sql: "SELECT * FROM t INNER MERGE JOIN u ON t.c = u.c;"
      - id: inner_remote
        sql: "SELECT * FROM t INNER REMOTE JOIN srv.db.dbo.u AS u ON t.c = u.c;"
      - id: left_outer_hash
        sql: "SELECT * FROM t LEFT OUTER HASH JOIN u ON t.c = u.c;"
      - id: left_loop
        sql: "SELECT * FROM t LEFT LOOP JOIN u ON t.c = u.c;"
      - id: right_merge
        sql: "SELECT * FROM t RIGHT OUTER MERGE JOIN u ON t.c = u.c;"
      - id: full_hash
        sql: "SELECT * FROM t FULL OUTER HASH JOIN u ON t.c = u.c;"
      - id: in_delete
        sql: "DELETE FROM t FROM t AS a INNER LOOP JOIN u AS b ON a.c = b.c WHERE b.d > 2500000.00;"
    examples:
      - |-
        SELECT p.Name,
            pr.ProductReviewID
        FROM Production.Product AS p
        LEFT OUTER HASH JOIN Production.ProductReview AS pr
            ON p.ProductID = pr.ProductID
        ORDER BY ProductReviewID DESC;
      - |-
        DELETE
        FROM Sales.SalesPersonQuotaHistory
        FROM Sales.SalesPersonQuotaHistory AS spqh
        INNER LOOP JOIN Sales.SalesPerson AS sp
            ON spqh.SalesPersonID = sp.SalesPersonID
        WHERE sp.SalesYTD > 2500000.00;
      - |-
        SELECT poh.PurchaseOrderID,
            poh.OrderDate,
            pod.ProductID,
            pod.DueDate,
            poh.VendorID
        FROM Purchasing.PurchaseOrderHeader AS poh
        INNER MERGE JOIN Purchasing.PurchaseOrderDetail AS pod
            ON poh.PurchaseOrderID = pod.PurchaseOrderID;

  - id: with_common_table_expression
    name: "WITH common_table_expression"
    doc: https://learn.microsoft.com/en-us/sql/t-sql/queries/with-common-table-expression-transact-sql
    tier: high
    probes:
      - id: basic
        sql: "WITH cte AS (SELECT c FROM t) SELECT c FROM cte;"
      - id: column_list
        sql: "WITH cte (a, b) AS (SELECT c, d FROM t) SELECT a, b FROM cte;"
      - id: multiple
        sql: "WITH c1 AS (SELECT c FROM t), c2 AS (SELECT c FROM c1) SELECT c FROM c2;"
      - id: recursive
        sql: "WITH r (n) AS (SELECT 1 UNION ALL SELECT n + 1 FROM r WHERE n < 10) SELECT n FROM r;"
      - id: multiple_anchor_recursive_members
        sql: "WITH g (id) AS (SELECT a FROM t WHERE id = 1 UNION SELECT b FROM t WHERE id = 1 UNION ALL SELECT t.a FROM g INNER JOIN t ON g.id = t.id UNION ALL SELECT t.b FROM g INNER JOIN t ON g.id = t.id) SELECT id FROM g;"
      - id: leading_semicolon
        sql: ";WITH cte AS (SELECT c FROM t) SELECT c FROM cte;"
        note: "A CTE following another statement needs that statement terminated; scripts commonly write the terminator directly before WITH."
      - id: insert
        sql: "WITH cte AS (SELECT c FROM t) INSERT INTO u (c) SELECT c FROM cte;"
      - id: update
        sql: "WITH cte AS (SELECT c, d FROM t) UPDATE cte SET c = d;"
      - id: update_from
        sql: "WITH cte AS (SELECT c FROM t) UPDATE u SET d = 1 FROM u INNER JOIN cte ON u.c = cte.c;"
      - id: delete
        sql: "WITH cte AS (SELECT c, ROW_NUMBER() OVER (PARTITION BY c ORDER BY c) AS rn FROM t) DELETE FROM cte WHERE rn > 1;"
      - id: merge
        sql: "WITH src AS (SELECT c FROM u) MERGE t USING src ON t.c = src.c WHEN NOT MATCHED THEN INSERT (c) VALUES (src.c);"
      - id: create_view
        sql: "CREATE VIEW v AS WITH cte AS (SELECT c FROM t) SELECT c FROM cte;"
    examples:
      - |-
        -- Define the CTE expression name and column list.
        WITH Sales_CTE (SalesPersonID, SalesOrderID, SalesYear)
        AS
        -- Define the CTE query.
        (
            SELECT SalesPersonID, SalesOrderID, YEAR(OrderDate) AS SalesYear
            FROM Sales.SalesOrderHeader
            WHERE SalesPersonID IS NOT NULL
        )
        -- Define the outer query referencing the CTE name.
        SELECT SalesPersonID,
               COUNT(SalesOrderID) AS TotalSales,
               SalesYear
        FROM Sales_CTE
        GROUP BY SalesYear, SalesPersonID
        ORDER BY SalesPersonID, SalesYear;
      - |-
        WITH Sales_CTE (SalesPersonID, NumberOfOrders)
        AS
        (
            SELECT SalesPersonID, COUNT(*)
            FROM Sales.SalesOrderHeader
            WHERE SalesPersonID IS NOT NULL
            GROUP BY SalesPersonID
        )
        SELECT AVG(NumberOfOrders) AS "Average Sales Per Person"
        FROM Sales_CTE;
      - |-
        WITH DirectReports (ManagerID, EmployeeID, Title, EmployeeLevel) AS
        (
            SELECT ManagerID, EmployeeID, Title, 0 AS EmployeeLevel
            FROM dbo.MyEmployees
            WHERE ManagerID IS NULL
            UNION ALL
            SELECT e.ManagerID, e.EmployeeID, e.Title, EmployeeLevel + 1
            FROM dbo.MyEmployees AS e
                 INNER JOIN DirectReports AS d
                     ON e.ManagerID = d.EmployeeID
        )
        SELECT ManagerID, EmployeeID, Title, EmployeeLevel
        FROM DirectReports
        ORDER BY ManagerID;
      - |-
        WITH Parts (AssemblyID, ComponentID, PerAssemblyQty, EndDate, ComponentLevel) AS
        (
            SELECT b.ProductAssemblyID,
                   b.ComponentID,
                   b.PerAssemblyQty,
                   b.EndDate,
                   0 AS ComponentLevel
            FROM Production.BillOfMaterials AS b
            WHERE b.ProductAssemblyID = 800
                  AND b.EndDate IS NULL
            UNION ALL
            SELECT bom.ProductAssemblyID,
                   bom.ComponentID,
                   p.PerAssemblyQty,
                   bom.EndDate,
                   ComponentLevel + 1
            FROM Production.BillOfMaterials AS bom
                 INNER JOIN Parts AS p
                     ON bom.ProductAssemblyID = p.ComponentID
                    AND bom.EndDate IS NULL
        )
        UPDATE Production.BillOfMaterials
            SET PerAssemblyQty = c.PerAssemblyQty * 2
        FROM Production.BillOfMaterials AS c
             INNER JOIN Parts AS d
                 ON c.ProductAssemblyID = d.AssemblyID
        WHERE d.ComponentLevel = 0;

  - id: recursive_common_table_expression
    name: "Recursive common table expressions"
    doc: https://learn.microsoft.com/en-us/sql/t-sql/queries/recursive-common-table-expression-transact-sql
    tier: high
    probes:
      - id: anchor_recursive
        sql: "WITH r (a, b, lvl) AS (SELECT a, b, 0 FROM t WHERE b IS NULL UNION ALL SELECT t.a, t.b, lvl + 1 FROM t INNER JOIN r ON t.b = r.a) SELECT * FROM r;"
      - id: with_maxrecursion
        sql: "WITH r (n) AS (SELECT 1 UNION ALL SELECT n + 1 FROM r WHERE n < 1000) SELECT n FROM r OPTION (MAXRECURSION 0);"
    examples:
      - |-
        WITH DirectReports (ManagerID, EmployeeID, Title, DeptID, Level)
        AS (
        -- Anchor member definition
        SELECT e.ManagerID,
                   e.EmployeeID,
                   e.Title,
                   edh.DepartmentID,
                   0 AS Level
            FROM dbo.MyEmployees AS e
                 INNER JOIN HumanResources.EmployeeDepartmentHistory AS edh
                     ON e.EmployeeID = edh.BusinessEntityID
                    AND edh.EndDate IS NULL
            WHERE ManagerID IS NULL
            UNION ALL
        -- Recursive member definition
            SELECT e.ManagerID,
                   e.EmployeeID,
                   e.Title,
                   edh.DepartmentID,
                   Level + 1
            FROM dbo.MyEmployees AS e
                 INNER JOIN HumanResources.EmployeeDepartmentHistory AS edh
                     ON e.EmployeeID = edh.BusinessEntityID
                    AND edh.EndDate IS NULL
                 INNER JOIN DirectReports AS d
                     ON e.ManagerID = d.EmployeeID)
        -- Statement that executes the CTE
        SELECT ManagerID,
               EmployeeID,
               Title,
               DeptID,
               Level
        FROM DirectReports
             INNER JOIN HumanResources.Department AS dp
                 ON DirectReports.DeptID = dp.DepartmentID
        WHERE dp.GroupName = N'Sales and Marketing'
              OR Level = 0;

