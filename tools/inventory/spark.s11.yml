dialect: spark
engine: Apache Spark SQL
version: "4.x (docs/latest)"
source: https://spark.apache.org/docs/latest/sql-ref-syntax.html

statements:
  - id: file
    name: File
    doc: https://spark.apache.org/docs/latest/sql-ref-syntax-qry-select-file.html
    tier: high
    probes:
      - id: parquet_file
        sql: "SELECT * FROM parquet.`/path/to/file`;"
      - id: orc_file
        sql: "SELECT * FROM orc.`/path/to/file`;"
      - id: json_file
        sql: "SELECT * FROM json.`/path/to/file`;"
      - id: textfile
        sql: "SELECT * FROM textfile.`/path/to/file`;"
    examples:
      - "SELECT * FROM parquet.`examples/src/main/resources/users.parquet`;"
      - "SELECT * FROM orc.`examples/src/main/resources/users.orc`;"
      - "SELECT * FROM json.`examples/src/main/resources/people.json`;"

  - id: join
    name: JOIN
    doc: https://spark.apache.org/docs/latest/sql-ref-syntax-qry-select-join.html
    tier: high
    probes:
      - id: join_default
        sql: "SELECT * FROM t1 JOIN t2 ON t1.a = t2.a;"
      - id: inner_join
        sql: "SELECT * FROM t1 INNER JOIN t2 ON t1.a = t2.a;"
      - id: left_join
        sql: "SELECT * FROM t1 LEFT JOIN t2 ON t1.a = t2.a;"
      - id: left_outer_join
        sql: "SELECT * FROM t1 LEFT OUTER JOIN t2 ON t1.a = t2.a;"
      - id: right_join
        sql: "SELECT * FROM t1 RIGHT JOIN t2 ON t1.a = t2.a;"
      - id: right_outer_join
        sql: "SELECT * FROM t1 RIGHT OUTER JOIN t2 ON t1.a = t2.a;"
      - id: full_join
        sql: "SELECT * FROM t1 FULL JOIN t2 ON t1.a = t2.a;"
      - id: full_outer_join
        sql: "SELECT * FROM t1 FULL OUTER JOIN t2 ON t1.a = t2.a;"
      - id: cross_join
        sql: "SELECT * FROM t1 CROSS JOIN t2;"
      - id: cross_join_on
        sql: "SELECT * FROM t1 CROSS JOIN t2 ON t1.a = t2.a;"
        note: Syntax block shows CROSS JOIN relation [ join_criteria ]
      - id: semi_join
        sql: "SELECT * FROM t1 SEMI JOIN t2 ON t1.a = t2.a;"
      - id: left_semi_join
        sql: "SELECT * FROM t1 LEFT SEMI JOIN t2 ON t1.a = t2.a;"
      - id: anti_join
        sql: "SELECT * FROM t1 ANTI JOIN t2 ON t1.a = t2.a;"
      - id: left_anti_join
        sql: "SELECT * FROM t1 LEFT ANTI JOIN t2 ON t1.a = t2.a;"
      - id: using
        sql: "SELECT * FROM t1 JOIN t2 USING (a);"
      - id: using_multiple
        sql: "SELECT * FROM t1 JOIN t2 USING (a, b);"
      - id: natural_join
        sql: "SELECT * FROM t1 NATURAL JOIN t2;"
      - id: natural_left_join
        sql: "SELECT * FROM t1 NATURAL LEFT JOIN t2;"
      - id: natural_left_outer_join
        sql: "SELECT * FROM t1 NATURAL LEFT OUTER JOIN t2;"
      - id: natural_right_join
        sql: "SELECT * FROM t1 NATURAL RIGHT JOIN t2;"
      - id: natural_full_join
        sql: "SELECT * FROM t1 NATURAL FULL JOIN t2;"
      - id: natural_inner_join
        sql: "SELECT * FROM t1 NATURAL INNER JOIN t2;"
      - id: natural_cross_join
        sql: "SELECT * FROM t1 NATURAL CROSS JOIN t2;"
      - id: natural_left_semi_join
        sql: "SELECT * FROM t1 NATURAL LEFT SEMI JOIN t2;"
      - id: natural_anti_join
        sql: "SELECT * FROM t1 NATURAL ANTI JOIN t2;"
      - id: join_lateral
        sql: "SELECT * FROM t1 JOIN LATERAL (SELECT * FROM t2 WHERE t2.a = t1.a) s ON true;"
      - id: left_join_lateral
        sql: "SELECT * FROM t1 LEFT JOIN LATERAL (SELECT * FROM t2 WHERE t2.a = t1.a) s ON true;"
      - id: cross_join_lateral
        sql: "SELECT * FROM t1 CROSS JOIN LATERAL (SELECT * FROM t2 WHERE t2.a = t1.a) s;"
      - id: natural_join_lateral
        sql: "SELECT * FROM t1 NATURAL JOIN LATERAL (SELECT * FROM t2 WHERE t2.a = t1.a) s;"
      - id: nearest_approx_distance
        sql: "SELECT * FROM t1 JOIN t2 APPROX NEAREST BY DISTANCE abs(t1.v - t2.v);"
        note: nearest_by_clause with a ranking_expression; operator form is illustrative, any orderable scalar expression is valid
      - id: nearest_exact_similarity_n
        sql: "SELECT * FROM t1 JOIN t2 EXACT NEAREST 5 BY SIMILARITY cosine_similarity(t1.v, t2.v);"
      - id: nearest_left_outer
        sql: "SELECT * FROM t1 LEFT OUTER JOIN t2 APPROX NEAREST 3 BY DISTANCE abs(t1.x - t2.x);"
      - id: nearest_lateral
        sql: "SELECT * FROM t1 JOIN LATERAL (SELECT * FROM t2) s EXACT NEAREST BY DISTANCE abs(t1.x - s.x);"
    examples:
      - "SELECT id, name, employee.deptno, deptname FROM employee INNER JOIN department ON employee.deptno = department.deptno;"
      - "SELECT id, name, employee.deptno, deptname FROM employee LEFT JOIN department ON employee.deptno = department.deptno;"
      - "SELECT * FROM employee SEMI JOIN department ON employee.deptno = department.deptno;"
