        sql: "CREATE TABLE t (id UNIQUEIDENTIFIER ROWGUIDCOL NOT NULL UNIQUE, d VARBINARY(MAX) FILESTREAM) FILESTREAM_ON fs_fg;"
      - id: as_filetable
        sql: "CREATE TABLE ft AS FileTable WITH (FILETABLE_DIRECTORY = 'docs', FILETABLE_COLLATE_FILENAME = database_default);"
      - id: with_data_compression
        sql: "CREATE TABLE t (c1 INT, c2 NVARCHAR(200)) WITH (DATA_COMPRESSION = ROW);"
      - id: with_data_compression_partitions
        sql: "CREATE TABLE t (c1 INT, c2 INT) ON ps (c1) WITH (DATA_COMPRESSION = PAGE ON PARTITIONS (1, 3 TO 5), DATA_COMPRESSION = ROW ON PARTITIONS (2));"
      - id: with_xml_compression
        sql: "CREATE TABLE t (c1 INT, c2 XML) WITH (XML_COMPRESSION = ON);"
      - id: system_versioning_history_table
        sql: "CREATE TABLE t (id INT PRIMARY KEY, vf DATETIME2 GENERATED ALWAYS AS ROW START NOT NULL, vt DATETIME2 GENERATED ALWAYS AS ROW END NOT NULL, PERIOD FOR SYSTEM_TIME (vf, vt)) WITH (SYSTEM_VERSIONING = ON (HISTORY_TABLE = dbo.t_history, HISTORY_RETENTION_PERIOD = 6 MONTHS, DATA_CONSISTENCY_CHECK = ON));"
      - id: data_deletion
        sql: "CREATE TABLE t (id INT, d DATETIME2) WITH (DATA_DELETION = ON (FILTER_COLUMN = d, RETENTION_PERIOD = 1 YEAR));"
      - id: ledger
        sql: "CREATE TABLE t (id INT, c INT) WITH (SYSTEM_VERSIONING = ON, LEDGER = ON (LEDGER_VIEW = dbo.t_ledger (TRANSACTION_ID_COLUMN_NAME = tid, SEQUENCE_NUMBER_COLUMN_NAME = sn, OPERATION_TYPE_COLUMN_NAME = op, OPERATION_TYPE_DESC_COLUMN_NAME = op_desc)));"
      - id: remote_data_archive
        sql: "CREATE TABLE t (c INT) WITH (REMOTE_DATA_ARCHIVE = ON (MIGRATION_STATE = OUTBOUND));"
        note: "Stretch Database option; the feature is deprecated but the option is still in the CREATE TABLE syntax block."
      - id: memory_optimized
        sql: "CREATE TABLE t (id INT NOT NULL PRIMARY KEY NONCLUSTERED HASH WITH (BUCKET_COUNT = 1024), c NVARCHAR(50)) WITH (MEMORY_OPTIMIZED = ON, DURABILITY = SCHEMA_ONLY);"
      - id: memory_optimized_table_index_hash
        sql: "CREATE TABLE t (a INT NOT NULL, b INT NOT NULL, INDEX ix_hash HASH (a, b) WITH (BUCKET_COUNT = 64), CONSTRAINT pk PRIMARY KEY NONCLUSTERED (a)) WITH (MEMORY_OPTIMIZED = ON, DURABILITY = SCHEMA_AND_DATA);"
      - id: memory_optimized_column_index_hash
        sql: "CREATE TABLE t (a INT NOT NULL INDEX ix_a HASH WITH (BUCKET_COUNT = 64), b INT NOT NULL PRIMARY KEY NONCLUSTERED) WITH (MEMORY_OPTIMIZED = ON);"
    examples:
      - |-
        CREATE TABLE dbo.PurchaseOrderDetail
        (
            PurchaseOrderID INT NOT NULL FOREIGN KEY REFERENCES Purchasing.PurchaseOrderHeader (PurchaseOrderID),
            LineNumber SMALLINT NOT NULL,
            ProductID INT NULL FOREIGN KEY REFERENCES Production.Product (ProductID),
            UnitPrice MONEY NULL,
            OrderQty SMALLINT NULL,
            ReceivedQty FLOAT NULL,
            RejectedQty FLOAT NULL,
            DueDate DATETIME NULL,
            rowguid UNIQUEIDENTIFIER CONSTRAINT DF_PurchaseOrderDetail_rowguid DEFAULT (NEWID()) ROWGUIDCOL NOT NULL,
            ModifiedDate DATETIME CONSTRAINT DF_PurchaseOrderDetail_ModifiedDate DEFAULT (GETDATE()) NOT NULL,
            LineTotal AS ((UnitPrice * OrderQty)),
            StockedQty AS ((ReceivedQty - RejectedQty)),
            CONSTRAINT PK_PurchaseOrderDetail_PurchaseOrderID_LineNumber PRIMARY KEY CLUSTERED (PurchaseOrderID, LineNumber) WITH (IGNORE_DUP_KEY = OFF)
        ) ON [PRIMARY];
      - |-
        CREATE TABLE Department
        (
            DepartmentNumber CHAR (10) NOT NULL PRIMARY KEY CLUSTERED,
            DepartmentName VARCHAR (50) NOT NULL,
            ManagerID INT NULL,
            ParentDepartmentNumber CHAR (10) NULL,
            ValidFrom DATETIME2 GENERATED ALWAYS AS ROW START HIDDEN NOT NULL,
            ValidTo DATETIME2 GENERATED ALWAYS AS ROW END HIDDEN NOT NULL,
            PERIOD FOR SYSTEM_TIME (ValidFrom, ValidTo)
        )
        WITH (SYSTEM_VERSIONING = ON);
      - |-
        CREATE TABLE dbo.Department
        (
            DepartmentNumber CHAR (10) NOT NULL PRIMARY KEY NONCLUSTERED,
            DepartmentName VARCHAR (50) NOT NULL,
            ManagerID INT NULL,
            ParentDepartmentNumber CHAR (10) NULL,
            ValidFrom DATETIME2 GENERATED ALWAYS AS ROW START HIDDEN NOT NULL,
            ValidTo DATETIME2 GENERATED ALWAYS AS ROW END HIDDEN NOT NULL,
            PERIOD FOR SYSTEM_TIME (ValidFrom, ValidTo)
        )
        WITH (
            MEMORY_OPTIMIZED = ON,
            DURABILITY = SCHEMA_AND_DATA,
            SYSTEM_VERSIONING = ON (HISTORY_TABLE = History.DepartmentHistory)
        );
      - |-
        CREATE TABLE Customers
        (
            CustName NVARCHAR (60) ENCRYPTED WITH (
                COLUMN_ENCRYPTION_KEY = MyCEK,
                ENCRYPTION_TYPE = RANDOMIZED,
                ALGORITHM = 'AEAD_AES_256_CBC_HMAC_SHA_256'
            ),
            SSN VARCHAR (11) COLLATE Latin1_General_BIN2  ENCRYPTED WITH (
                COLUMN_ENCRYPTION_KEY = MyCEK,
                ENCRYPTION_TYPE = DETERMINISTIC,
                ALGORITHM = 'AEAD_AES_256_CBC_HMAC_SHA_256'
            ),
            Age INT NULL
        );
      - |-
        CREATE TABLE t1
        (
            c1 INT,
            INDEX IX1 (c1) WHERE c1 > 0
        );

