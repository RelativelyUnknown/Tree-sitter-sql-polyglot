dialect: databricks
engine: Databricks SQL / Databricks Runtime
version: "current (docs read 2026-10-04)"
source: https://docs.databricks.com/aws/en/sql/language-manual/

statements:
  - id: drop_view
    name: DROP VIEW
    doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-ddl-drop-view
    tier: high
    probes:
      - id: basic
        sql: "DROP VIEW v;"
      - id: if_exists
        sql: "DROP VIEW IF EXISTS v;"
      - id: qualified_name
        sql: "DROP VIEW s.v;"
      - id: materialized
        sql: "DROP MATERIALIZED VIEW v;"
      - id: materialized_if_exists
        sql: "DROP MATERIALIZED VIEW IF EXISTS s.v;"
    examples:
      - "DROP VIEW employeeView;"
      - "DROP VIEW usersc.employeeView;"
      - "DROP MATERIALIZED VIEW employeeView;"
      - "DROP VIEW IF EXISTS employeeView;"

  - id: drop_function
    name: DROP FUNCTION
    doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-syntax-ddl-drop-function
    tier: high
    probes:
      - id: basic
        sql: "DROP FUNCTION f;"
      - id: if_exists
        sql: "DROP FUNCTION IF EXISTS f;"
      - id: qualified_name
        sql: "DROP FUNCTION s.f;"
      - id: temporary
        sql: "DROP TEMPORARY FUNCTION f;"
      - id: temporary_if_exists
        sql: "DROP TEMPORARY FUNCTION IF EXISTS f;"
    examples:
      - "DROP FUNCTION hello;"
      - "DROP TEMPORARY FUNCTION IF EXISTS hello;"
