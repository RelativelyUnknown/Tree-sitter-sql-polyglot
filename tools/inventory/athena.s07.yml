dialect: athena
engine: Amazon Athena
version: "engine version 3 (Trino-based DML, Hive-style DDL)"
source: https://docs.aws.amazon.com/athena/latest/ug/ddl-reference.html ; https://docs.aws.amazon.com/athena/latest/ug/dml-queries-functions-operators.html

statements:
  - id: drop_table
    name: DROP TABLE
    doc: https://docs.aws.amazon.com/athena/latest/ug/drop-table.html
    tier: high
    probes:
      - id: basic
        sql: "DROP TABLE t;"
      - id: if_exists
        sql: "DROP TABLE IF EXISTS t;"
      - id: qualified_backticks
        sql: "DROP TABLE `my-athena-database-01.my-athena-table`;"
        note: Doc example for names with special characters in the console query editor
    examples:
      - "DROP TABLE fulfilled_orders;"
      - "DROP TABLE IF EXISTS fulfilled_orders;"
      - "DROP TABLE `my-athena-database-01.my-athena-table`;"

  - id: drop_view
    name: DROP VIEW
    doc: https://docs.aws.amazon.com/athena/latest/ug/drop-view.html
    tier: high
    probes:
      - id: basic
        sql: "DROP VIEW v;"
      - id: if_exists
        sql: "DROP VIEW IF EXISTS v;"
    examples:
      - "DROP VIEW orders_by_date;"
      - "DROP VIEW IF EXISTS orders_by_date;"
