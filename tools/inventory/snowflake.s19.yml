dialect: snowflake
engine: Snowflake
version: "current (docs read 2026-10-04)"
source: https://docs.snowflake.com/en/sql-reference/sql-all

statements:
  - id: undrop_database
    name: UNDROP DATABASE
    doc: https://docs.snowflake.com/en/sql-reference/sql/undrop-database
    tier: medium
    probes:
      - { id: undrop, sql: "UNDROP DATABASE d;" }
      - { id: undrop_by_id, sql: "UNDROP DATABASE IDENTIFIER(492);" }
    examples:
      - "UNDROP DATABASE mytestdb2;"
      - "UNDROP DATABASE IDENTIFIER(492);"

  - id: undrop_schema
    name: UNDROP SCHEMA
    doc: https://docs.snowflake.com/en/sql-reference/sql/undrop-schema
    tier: medium
    probes:
      - { id: undrop, sql: "UNDROP SCHEMA s;" }
      - { id: undrop_qualified, sql: "UNDROP SCHEMA d.s;" }
      - { id: undrop_by_id, sql: "UNDROP SCHEMA IDENTIFIER(798);" }
    examples:
      - "UNDROP SCHEMA myschema;"
      - "UNDROP SCHEMA IDENTIFIER(798);"

  - id: undrop_tag
    name: UNDROP TAG
    doc: https://docs.snowflake.com/en/sql-reference/sql/undrop-tag
    tier: medium
    probes:
      - { id: undrop, sql: "UNDROP TAG t;" }
      - { id: undrop_qualified, sql: "UNDROP TAG d.s.t;" }
    examples:
      - "UNDROP TAG cost_center;"

  - id: undrop_type
    name: UNDROP TYPE
    doc: https://docs.snowflake.com/en/sql-reference/sql/undrop-type
    tier: medium
    probes:
      - { id: undrop, sql: "UNDROP TYPE t;" }
      - { id: undrop_qualified, sql: "UNDROP TYPE d.s.t;" }
    examples:
      - "UNDROP TYPE age;"

  - id: unset
    name: UNSET
    doc: https://docs.snowflake.com/en/sql-reference/sql/unset
    tier: medium
    probes:
      - { id: single, sql: "UNSET v1;" }
      - { id: list, sql: "UNSET (v1, v2);" }
    examples:
      - "UNSET V1;"
      - "UNSET V2;"
      - "UNSET (V1, V2);"

  - id: use_database
    name: USE DATABASE
    doc: https://docs.snowflake.com/en/sql-reference/sql/use-database
    tier: medium
    probes:
      - { id: use_database, sql: "USE DATABASE d;" }
      - { id: use_without_keyword, sql: "USE d;" }
    examples:
      - "USE DATABASE mydb;"

  - id: use_role
    name: USE ROLE
    doc: https://docs.snowflake.com/en/sql-reference/sql/use-role
    tier: medium
    probes:
      - { id: use_role, sql: "USE ROLE r;" }
      - { id: use_role_quoted, sql: 'USE ROLE "My Role";' }
    examples:
      - "USE ROLE myrole;"

  - id: use_schema
    name: USE SCHEMA
    doc: https://docs.snowflake.com/en/sql-reference/sql/use-schema
    tier: medium
    probes:
      - { id: use_schema, sql: "USE SCHEMA s;" }
      - { id: use_schema_qualified, sql: "USE SCHEMA d.s;" }
      - { id: use_qualified_without_keyword, sql: "USE d.s;" }
    examples:
      - "USE SCHEMA myschema;"
      - "USE mydb.myschema;"

  - id: use_secondary_roles
    name: USE SECONDARY ROLES
    doc: https://docs.snowflake.com/en/sql-reference/sql/use-secondary-roles
    tier: medium
    probes:
      - { id: all, sql: "USE SECONDARY ROLES ALL;" }
      - { id: none, sql: "USE SECONDARY ROLES NONE;" }
      - { id: role_list, sql: "USE SECONDARY ROLES r1, r2;" }

  - id: use_warehouse
    name: USE WAREHOUSE
    doc: https://docs.snowflake.com/en/sql-reference/sql/use-warehouse
    tier: medium
    probes:
      - { id: use_warehouse, sql: "USE WAREHOUSE w;" }
      - { id: use_warehouse_identifier, sql: "USE WAREHOUSE IDENTIFIER($w);" }
    examples:
      - "USE WAREHOUSE mywarehouse;"
      - "USE WAREHOUSE IDENTIFIER($original_warehouse);"
