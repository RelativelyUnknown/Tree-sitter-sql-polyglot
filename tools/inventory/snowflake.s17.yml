      - { id: terse, sql: "SHOW TERSE SCHEMAS;" }
      - { id: history, sql: "SHOW SCHEMAS HISTORY;" }
      - { id: like, sql: "SHOW SCHEMAS LIKE '%s%';" }
      - { id: in_account, sql: "SHOW SCHEMAS IN ACCOUNT;" }
      - { id: in_database, sql: "SHOW SCHEMAS IN DATABASE;" }
