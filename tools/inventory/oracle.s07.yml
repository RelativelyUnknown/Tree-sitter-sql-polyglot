dialect: oracle
engine: Oracle AI Database
version: "26ai"
source: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/toc.htm

statements:
  - id: drop_profile
    name: DROP PROFILE
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/DROP-PROFILE.html
    tier: medium
    probes:
      - id: basic
        sql: "DROP PROFILE p;"
      - id: cascade
        sql: "DROP PROFILE p CASCADE;"
    examples:
      - "DROP PROFILE app_user CASCADE;"

  - id: drop_property_graph
    name: DROP PROPERTY GRAPH
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/drop-property-graph.html
    tier: medium
    probes:
      - id: basic
        sql: "DROP PROPERTY GRAPH g;"
      - id: schema_qualified
        sql: "DROP PROPERTY GRAPH s.g;"
      - id: if_exists
        sql: "DROP PROPERTY GRAPH IF EXISTS s.g;"

  - id: drop_role
    name: DROP ROLE
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/DROP-ROLE.html
    tier: medium
    probes:
      - id: basic
        sql: "DROP ROLE r;"
    examples:
      - "DROP ROLE dw_manager;"

  - id: drop_sequence
    name: DROP SEQUENCE
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/DROP-SEQUENCE.html
    tier: medium
    probes:
      - id: basic
        sql: "DROP SEQUENCE seq;"
      - id: schema_qualified
        sql: "DROP SEQUENCE s.seq;"
      - id: if_exists
        sql: "DROP SEQUENCE IF EXISTS s.seq;"
    examples:
      - "DROP SEQUENCE oe.customers_seq;"

  - id: drop_synonym
    name: DROP SYNONYM
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/DROP-SYNONYM.html
    tier: medium
    probes:
      - id: basic
        sql: "DROP SYNONYM syn;"
      - id: public
        sql: "DROP PUBLIC SYNONYM syn;"
      - id: schema_qualified
        sql: "DROP SYNONYM s.syn;"
      - id: if_exists
        sql: "DROP SYNONYM IF EXISTS s.syn;"
      - id: force
        sql: "DROP SYNONYM syn FORCE;"
      - id: public_if_exists_force
        sql: "DROP PUBLIC SYNONYM IF EXISTS syn FORCE;"

  - id: drop_tablespace
    name: DROP TABLESPACE
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/DROP-TABLESPACE.html
    tier: medium
    probes:
      - id: basic
        sql: "DROP TABLESPACE ts;"
      - id: if_exists
        sql: "DROP TABLESPACE IF EXISTS ts;"
      - id: including_contents
        sql: "DROP TABLESPACE ts INCLUDING CONTENTS;"
      - id: including_contents_and_datafiles
        sql: "DROP TABLESPACE ts INCLUDING CONTENTS AND DATAFILES;"
      - id: including_contents_keep_datafiles
        sql: "DROP TABLESPACE ts INCLUDING CONTENTS KEEP DATAFILES;"
      - id: cascade_constraints
        sql: "DROP TABLESPACE ts INCLUDING CONTENTS CASCADE CONSTRAINTS;"
    examples:
      - "DROP TABLESPACE tbs_01 INCLUDING CONTENTS CASCADE CONSTRAINTS;"
      - "DROP TABLESPACE tbs_02 INCLUDING CONTENTS AND DATAFILES;"

  - id: drop_trigger
    name: DROP TRIGGER
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/DROP-TRIGGER.html
    tier: medium
    probes:
      - id: basic
        sql: "DROP TRIGGER trg;"
      - id: schema_qualified
        sql: "DROP TRIGGER s.trg;"
      - id: if_exists
        sql: "DROP TRIGGER IF EXISTS s.trg;"
    examples:
      - "DROP TRIGGER hr.salary_check;"

  - id: drop_type
    name: DROP TYPE
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/DROP-TYPE.html
    tier: medium
    probes:
      - id: basic
        sql: "DROP TYPE typ;"
      - id: schema_qualified
        sql: "DROP TYPE s.typ;"
      - id: if_exists
        sql: "DROP TYPE IF EXISTS typ;"
      - id: force
        sql: "DROP TYPE typ FORCE;"
      - id: validate
        sql: "DROP TYPE typ VALIDATE;"
    examples:
      - "DROP TYPE person_t FORCE;"

  - id: drop_type_body
    name: DROP TYPE BODY
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/DROP-TYPE-BODY.html
    tier: medium
    probes:
      - id: basic
        sql: "DROP TYPE BODY typ;"
      - id: schema_qualified
        sql: "DROP TYPE BODY s.typ;"
      - id: if_exists
        sql: "DROP TYPE BODY IF EXISTS typ;"
    examples:
      - "DROP TYPE BODY data_typ1;"

  - id: drop_user
    name: DROP USER
    doc: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/DROP-USER.html
    tier: medium
    probes:
      - id: basic
        sql: "DROP USER u;"
      - id: if_exists
        sql: "DROP USER IF EXISTS u;"
      - id: cascade
        sql: "DROP USER u CASCADE;"
