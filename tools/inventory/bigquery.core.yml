  - id: create_materialized_view
    name: "CREATE MATERIALIZED VIEW"
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/data-definition-language#create_materialized_view_statement
    tier: high
    probes:
      - { id: basic, sql: "CREATE MATERIALIZED VIEW mv AS SELECT a, SUM(b) AS s FROM t GROUP BY a;" }
      - { id: or_replace, sql: "CREATE OR REPLACE MATERIALIZED VIEW mv AS SELECT a FROM t;" }
      - { id: if_not_exists, sql: "CREATE MATERIALIZED VIEW IF NOT EXISTS mv AS SELECT a FROM t;" }
      - { id: partition_by, sql: "CREATE MATERIALIZED VIEW mv PARTITION BY DATE(ts) AS SELECT ts, COUNT(1) AS n FROM t GROUP BY ts;" }
      - { id: cluster_by, sql: "CREATE MATERIALIZED VIEW mv CLUSTER BY a AS SELECT a, COUNT(1) AS n FROM t GROUP BY a;" }
      - { id: options, sql: "CREATE MATERIALIZED VIEW mv OPTIONS (enable_refresh = true, refresh_interval_minutes = 20) AS SELECT a FROM t;" }
      - { id: all_clauses, sql: "CREATE MATERIALIZED VIEW `p.d.mv` PARTITION BY DATE(ts) CLUSTER BY a OPTIONS (friendly_name = 'mv') AS SELECT a, ts, COUNT(1) AS n FROM t GROUP BY a, ts;" }
    examples:
      - |-
        CREATE MATERIALIZED VIEW `myproject.mydataset.new_mv`
        OPTIONS(
         expiration_timestamp=TIMESTAMP_ADD(CURRENT_TIMESTAMP(), INTERVAL 48 HOUR),
         friendly_name="new_mv",
         description="a materialized view that expires in 2 days",
         labels=[("org_unit", "development")],
         enable_refresh=true,
         refresh_interval_minutes=20
        )
        AS SELECT column_1, SUM(column_2) AS sum_2, AVG(column_3) AS avg_3
        FROM `myproject.mydataset.mytable`
        GROUP BY column_1;
      - |-
        CREATE MATERIALIZED VIEW IF NOT EXISTS `myproject.mydataset.new_mv`
        OPTIONS(
         expiration_timestamp=TIMESTAMP_ADD(CURRENT_TIMESTAMP(), INTERVAL 48 HOUR),
         friendly_name="new_mv",
         description="a view that expires in 2 days",
         labels=[("org_unit", "development")],
         enable_refresh=false
        )
        AS SELECT column_1, column_2, column_3 FROM `myproject.mydataset.mytable`;
      - |-
        CREATE MATERIALIZED VIEW `myproject.mydataset.new_mv`
        PARTITION BY DATE(col_datetime)
        CLUSTER BY col_int
        AS SELECT col_int, col_datetime, COUNT(1) as cnt
         FROM `myproject.mydataset.mv_base_table`
         GROUP BY col_int, col_datetime;

