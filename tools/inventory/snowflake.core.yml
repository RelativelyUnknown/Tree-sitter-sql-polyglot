      - { id: basic, sql: "CREATE OR REPLACE DYNAMIC TABLE dt TARGET_LAG = '20 minutes' WAREHOUSE = wh AS SELECT a, b FROM t;" }
      - { id: columns_cluster_by, sql: "CREATE DYNAMIC TABLE dt (d TIMESTAMP_NTZ, id NUMBER, content VARIANT) TARGET_LAG = '20 minutes' WAREHOUSE = wh CLUSTER BY (d, id) AS SELECT d, id, content FROM t;" }
      - { id: downstream_options, sql: "CREATE TRANSIENT DYNAMIC TABLE IF NOT EXISTS dt TARGET_LAG = DOWNSTREAM SCHEDULER = ENABLE WAREHOUSE = wh INITIALIZATION_WAREHOUSE = wh2 REFRESH_MODE = INCREMENTAL INITIALIZE = ON_SCHEDULE REQUIRE USER AS SELECT a FROM t;" }
      - { id: frozen_where, sql: "CREATE DYNAMIC TABLE dt TARGET_LAG = '1 hour' WAREHOUSE = wh FROZEN WHERE (ts < CURRENT_TIMESTAMP() - INTERVAL '1 day') AS SELECT * FROM t;" }
      - { id: execute_as_user, sql: "CREATE DYNAMIC TABLE dt TARGET_LAG = '1 hour' WAREHOUSE = wh EXECUTE AS USER u USE SECONDARY ROLES ALL AS SELECT * FROM t;" }
      - { id: refresh_using, sql: "CREATE DYNAMIC TABLE dt TARGET_LAG = '1 hour' WAREHOUSE = wh REFRESH_MODE = CUSTOM_INCREMENTAL BACKFILL FROM t0 START AT (OFFSET => -3600) REFRESH USING (INSERT INTO dt SELECT * FROM t);" }
      - { id: create_or_alter, sql: "CREATE OR ALTER DYNAMIC TABLE dt TARGET_LAG = DOWNSTREAM WAREHOUSE = wh AS SELECT a, b FROM t;" }
      - { id: clone, sql: "CREATE DYNAMIC TABLE dt2 CLONE dt AT (TIMESTAMP => TO_TIMESTAMP_TZ('04/05/2013 01:02:03', 'mm/dd/yyyy hh24:mi:ss'));" }
      - { id: dynamic_iceberg, sql: "CREATE DYNAMIC ICEBERG TABLE dt (d TIMESTAMP_NTZ, id NUMBER) TARGET_LAG = '20 minutes' WAREHOUSE = wh EXTERNAL_VOLUME = 'ev' CATALOG = 'SNOWFLAKE' BASE_LOCATION = 'dt' AS SELECT d, id FROM t;" }
      - { id: from_backup_set, sql: "CREATE DYNAMIC TABLE dt FROM BACKUP SET bs IDENTIFIER '5f8e5a7b-1234-4cd2-9876-0a1b2c3d4e5f';" }
    examples:
      - |-
        CREATE OR REPLACE DYNAMIC TABLE my_dynamic_table
          TARGET_LAG = '20 minutes'
          WAREHOUSE = mywh
          AS
            SELECT product_id, product_name FROM staging_table;
      - |-
        CREATE DYNAMIC TABLE my_dynamic_table (date TIMESTAMP_NTZ, id NUMBER, content VARIANT)
          TARGET_LAG = '20 minutes'
          WAREHOUSE = mywh
          CLUSTER BY (date, id)
          AS
            SELECT product_id, product_name FROM staging_table;
      - "CREATE DYNAMIC TABLE my_cloned_dynamic_table CLONE my_dynamic_table AT (TIMESTAMP => TO_TIMESTAMP_TZ('04/05/2013 01:02:03', 'mm/dd/yyyy hh24:mi:ss'));"
      - |-
        CREATE DYNAMIC TABLE my_dynamic_table
          TARGET_LAG = 'DOWNSTREAM'
          WAREHOUSE = mywh
          INITIALIZE = on_schedule
          REQUIRE USER
          AS
            SELECT product_id, product_name FROM staging_table;
      - |-
        CREATE DYNAMIC TABLE my_dynamic_table
          TARGET_LAG = '1 hour'
          WAREHOUSE = my_warehouse
          FROZEN WHERE (ts < CURRENT_TIMESTAMP() - INTERVAL '1 day')
        AS
          SELECT * FROM source_table;

