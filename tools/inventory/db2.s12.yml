dialect: db2
engine: IBM Db2 for Linux, UNIX and Windows
version: "12.1"
source: https://www.ibm.com/docs/en/db2/12.1.x?topic=reference-statements

statements:
  - id: create_procedure_sourced
    name: CREATE PROCEDURE (sourced)
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-create-procedure-sourced
    tier: high
    probes:
      - id: basic
        sql: "CREATE PROCEDURE p SOURCE s.pk.src FOR SERVER srv;"
      - id: or_replace
        sql: "CREATE OR REPLACE PROCEDURE p SOURCE s.pk.src FOR SERVER srv;"
      - id: source_unqualified
        sql: "CREATE PROCEDURE p SOURCE src FOR SERVER srv;"
      - id: source_schema_qualified
        sql: "CREATE PROCEDURE p SOURCE s.src FOR SERVER srv;"
      - id: number_of_parameters
        sql: "CREATE PROCEDURE p SOURCE s.pk.src NUMBER OF PARAMETERS 2 FOR SERVER srv;"
      - id: empty_parens
        sql: "CREATE PROCEDURE p SOURCE s.pk.src() FOR SERVER srv;"
      - id: unique_id
        sql: "CREATE PROCEDURE p SOURCE s.pk.src(1) UNIQUE ID 'u1' FOR SERVER srv;"
      - id: specific
        sql: "CREATE PROCEDURE p SOURCE s.pk.src FOR SERVER srv SPECIFIC sp1;"
      - id: return_to_caller_all
        sql: "CREATE PROCEDURE p SOURCE s.pk.src FOR SERVER srv WITH RETURN TO CALLER ALL;"
      - id: return_to_client_all
        sql: "CREATE PROCEDURE p SOURCE s.pk.src FOR SERVER srv WITH RETURN TO CLIENT ALL;"
      - id: return_to_client_list
        sql: "CREATE PROCEDURE p SOURCE s.pk.src FOR SERVER srv WITH RETURN TO CLIENT (1, 3);"
      - id: no_sql
        sql: "CREATE PROCEDURE p SOURCE s.pk.src FOR SERVER srv NO SQL;"
      - id: contains_sql
        sql: "CREATE PROCEDURE p SOURCE s.pk.src FOR SERVER srv CONTAINS SQL;"
      - id: modifies_sql_data
        sql: "CREATE PROCEDURE p SOURCE s.pk.src FOR SERVER srv MODIFIES SQL DATA;"
      - id: reads_sql_data
        sql: "CREATE PROCEDURE p SOURCE s.pk.src FOR SERVER srv READS SQL DATA;"
      - id: not_deterministic
        sql: "CREATE PROCEDURE p SOURCE s.pk.src FOR SERVER srv NOT DETERMINISTIC;"
      - id: deterministic
        sql: "CREATE PROCEDURE p SOURCE s.pk.src FOR SERVER srv DETERMINISTIC;"
      - id: external_action
        sql: "CREATE PROCEDURE p SOURCE s.pk.src FOR SERVER srv EXTERNAL ACTION;"
      - id: no_external_action
        sql: "CREATE PROCEDURE p SOURCE s.pk.src FOR SERVER srv NO EXTERNAL ACTION;"
      - id: options
        sql: "CREATE PROCEDURE p SOURCE s.pk.src FOR SERVER srv OPTIONS (opt1 'v1', opt2 'v2');"
    examples:
      - "CREATE PROCEDURE FEDEMPLOYEE SOURCE USER1.P1.EMPLOYEE FOR SERVER S1 WITH RETURN TO CLIENT ALL;"
      - "CREATE OR REPLACE PROCEDURE FEDSALARYSTAT SOURCE USER1.P1.SALARYSTAT FOR SERVER S1 WITH RETURN TO CLIENT( 1,3 );"

  - id: create_procedure_sql
    name: CREATE PROCEDURE (SQL)
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-create-procedure-sql
    tier: high
    probes:
      - id: basic
        sql: "CREATE PROCEDURE p() LANGUAGE SQL BEGIN END;"
      - id: single_statement_body
        sql: "CREATE PROCEDURE p() LANGUAGE SQL RETURN 0;"
      - id: or_replace
        sql: "CREATE OR REPLACE PROCEDURE p() LANGUAGE SQL BEGIN END;"
      - id: param_in
        sql: "CREATE PROCEDURE p(IN a INT) LANGUAGE SQL BEGIN END;"
      - id: param_out
        sql: "CREATE PROCEDURE p(OUT a INT) LANGUAGE SQL BEGIN SET a = 1; END;"
      - id: param_inout
        sql: "CREATE PROCEDURE p(INOUT a INT) LANGUAGE SQL BEGIN SET a = a + 1; END;"
      - id: param_no_mode
        sql: "CREATE PROCEDURE p(a INT, b VARCHAR(10)) LANGUAGE SQL BEGIN END;"
      - id: param_default_constant
        sql: "CREATE PROCEDURE p(IN a INT DEFAULT 5) LANGUAGE SQL BEGIN END;"
      - id: param_default_null
        sql: "CREATE PROCEDURE p(IN a INT DEFAULT NULL) LANGUAGE SQL BEGIN END;"
      - id: param_default_special_register
        sql: "CREATE PROCEDURE p(IN a VARCHAR(128) DEFAULT CURRENT SCHEMA) LANGUAGE SQL BEGIN END;"
      - id: param_default_expression
        sql: "CREATE PROCEDURE p(IN a INT DEFAULT (1 + 2)) LANGUAGE SQL BEGIN END;"
      - id: type_decimal
        sql: "CREATE PROCEDURE p(IN a DECIMAL(10, 2)) LANGUAGE SQL BEGIN END;"
      - id: type_varchar_octets
        sql: "CREATE PROCEDURE p(IN a VARCHAR(10 OCTETS)) LANGUAGE SQL BEGIN END;"
      - id: type_varchar_for_bit_data
        sql: "CREATE PROCEDURE p(IN a VARCHAR(10) FOR BIT DATA) LANGUAGE SQL BEGIN END;"
      - id: type_clob
        sql: "CREATE PROCEDURE p(IN a CLOB(1M)) LANGUAGE SQL BEGIN END;"
      - id: type_timestamp
        sql: "CREATE PROCEDURE p(IN a TIMESTAMP(6)) LANGUAGE SQL BEGIN END;"
      - id: type_boolean
        sql: "CREATE PROCEDURE p(IN a BOOLEAN) LANGUAGE SQL BEGIN END;"
      - id: type_xml
        sql: "CREATE PROCEDURE p(IN a XML) LANGUAGE SQL BEGIN END;"
      - id: type_vector
        sql: "CREATE PROCEDURE p(IN a VECTOR(3, FLOAT32)) LANGUAGE SQL BEGIN END;"
      - id: type_distinct
        sql: "CREATE PROCEDURE p(IN a s.mytype) LANGUAGE SQL BEGIN END;"
      - id: type_cursor
        sql: "CREATE PROCEDURE p(IN a CURSOR) LANGUAGE SQL BEGIN END;"
      - id: type_anchor_column
        sql: "CREATE PROCEDURE p(IN a ANCHOR DATA TYPE TO t.c) LANGUAGE SQL BEGIN END;"
      - id: type_anchor_row_of
        sql: "CREATE PROCEDURE p(IN a ANCHOR DATA TYPE TO ROW OF t) LANGUAGE SQL BEGIN END;"
      - id: language_sql
        sql: "CREATE PROCEDURE p() LANGUAGE SQL BEGIN END;"
      - id: specific
        sql: "CREATE PROCEDURE p() SPECIFIC sp1 LANGUAGE SQL BEGIN END;"
      - id: dynamic_result_sets
        sql: "CREATE PROCEDURE p() DYNAMIC RESULT SETS 1 LANGUAGE SQL BEGIN END;"
      - id: result_sets_synonym
        sql: "CREATE PROCEDURE p() RESULT SETS 1 LANGUAGE SQL BEGIN END;"
      - id: modifies_sql_data
        sql: "CREATE PROCEDURE p() MODIFIES SQL DATA LANGUAGE SQL BEGIN END;"
      - id: contains_sql
        sql: "CREATE PROCEDURE p() CONTAINS SQL LANGUAGE SQL BEGIN END;"
      - id: reads_sql_data
        sql: "CREATE PROCEDURE p() READS SQL DATA LANGUAGE SQL BEGIN END;"
      - id: not_deterministic
        sql: "CREATE PROCEDURE p() NOT DETERMINISTIC LANGUAGE SQL BEGIN END;"
      - id: deterministic
        sql: "CREATE PROCEDURE p() DETERMINISTIC LANGUAGE SQL BEGIN END;"
      - id: called_on_null_input
        sql: "CREATE PROCEDURE p() CALLED ON NULL INPUT LANGUAGE SQL BEGIN END;"
      - id: null_call_synonym
        sql: "CREATE PROCEDURE p() NULL CALL LANGUAGE SQL BEGIN END;"
      - id: commit_on_return_yes
        sql: "CREATE PROCEDURE p() COMMIT ON RETURN YES LANGUAGE SQL BEGIN END;"
      - id: commit_on_return_no
        sql: "CREATE PROCEDURE p() COMMIT ON RETURN NO LANGUAGE SQL BEGIN END;"
      - id: autonomous
        sql: "CREATE PROCEDURE p() AUTONOMOUS LANGUAGE SQL BEGIN END;"
      - id: inherit_special_registers
        sql: "CREATE PROCEDURE p() INHERIT SPECIAL REGISTERS LANGUAGE SQL BEGIN END;"
      - id: old_savepoint_level
        sql: "CREATE PROCEDURE p() OLD SAVEPOINT LEVEL LANGUAGE SQL BEGIN END;"
      - id: new_savepoint_level
        sql: "CREATE PROCEDURE p() NEW SAVEPOINT LEVEL LANGUAGE SQL BEGIN END;"
      - id: external_action
        sql: "CREATE PROCEDURE p() EXTERNAL ACTION LANGUAGE SQL BEGIN END;"
      - id: no_external_action
        sql: "CREATE PROCEDURE p() NO EXTERNAL ACTION LANGUAGE SQL BEGIN END;"
      - id: parameter_ccsid_ascii
        sql: "CREATE PROCEDURE p() PARAMETER CCSID ASCII LANGUAGE SQL BEGIN END;"
      - id: parameter_ccsid_unicode
        sql: "CREATE PROCEDURE p() PARAMETER CCSID UNICODE LANGUAGE SQL BEGIN END;"
      - id: multiple_options
        sql: "CREATE PROCEDURE p(IN a INT, OUT b INT) SPECIFIC sp1 DYNAMIC RESULT SETS 1 MODIFIES SQL DATA NOT DETERMINISTIC CALLED ON NULL INPUT LANGUAGE SQL BEGIN SET b = a; END;"
    examples:
      - |-
        CREATE PROCEDURE MEDIAN_RESULT_SET ( OUT medianSalary DOUBLE ) RESULT SETS 1 LANGUAGE SQL BEGIN DECLARE v_numRecords INT DEFAULT 1; DECLARE v_counter INT DEFAULT 0; DECLARE c1 CURSOR FOR SELECT CAST (salary AS DOUBLE ) FROM staff ORDER BY salary; DECLARE c2 CURSOR WITH RETURN FOR SELECT name, job, CAST (salary AS INTEGER ) FROM staff WHERE salary > medianSalary ORDER BY salary; DECLARE EXIT HANDLER FOR NOT FOUND SET medianSalary = 6666; SET medianSalary = 0; SELECT COUNT(*) INTO v_numRecords FROM STAFF ; OPEN c1; WHILE v_counter < (v_numRecords / 2 + 1) DO FETCH c1 INTO medianSalary; SET v_counter = v_counter + 1; END WHILE ; CLOSE c1; OPEN c2; END;
