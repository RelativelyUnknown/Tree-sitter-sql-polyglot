dialect: postgres
engine: PostgreSQL
version: "17"
source: https://www.postgresql.org/docs/17/sql-commands.html

statements:
  - id: drop_operator_family
    name: DROP OPERATOR FAMILY
    doc: https://www.postgresql.org/docs/17/sql-dropopfamily.html
    tier: low
    probes:
      - { id: basic, sql: "DROP OPERATOR FAMILY IF EXISTS f USING btree CASCADE;" }
      - { id: plain, sql: "DROP OPERATOR FAMILY s.f USING hash;" }
  - id: drop_owned
    name: DROP OWNED
    doc: https://www.postgresql.org/docs/17/sql-drop-owned.html
    tier: low
    probes:
      - { id: basic, sql: "DROP OWNED BY r1, CURRENT_USER CASCADE;" }
      - { id: restrict, sql: "DROP OWNED BY SESSION_USER RESTRICT;" }
  - id: drop_publication
    name: DROP PUBLICATION
    doc: https://www.postgresql.org/docs/17/sql-droppublication.html
    tier: low
    probes:
      - { id: basic, sql: "DROP PUBLICATION IF EXISTS p1, p2 CASCADE;" }
      - { id: plain, sql: "DROP PUBLICATION p;" }
  - id: drop_server
    name: DROP SERVER
    doc: https://www.postgresql.org/docs/17/sql-dropserver.html
    tier: low
    probes:
      - { id: basic, sql: "DROP SERVER IF EXISTS foo, bar RESTRICT;" }
      - { id: plain, sql: "DROP SERVER foo;" }
  - id: drop_statistics
    name: DROP STATISTICS
    doc: https://www.postgresql.org/docs/17/sql-dropstatistics.html
    tier: low
    probes:
      - { id: basic, sql: "DROP STATISTICS IF EXISTS s.st1, s.st2 CASCADE;" }
      - { id: plain, sql: "DROP STATISTICS st;" }
  - id: drop_subscription
    name: DROP SUBSCRIPTION
    doc: https://www.postgresql.org/docs/17/sql-dropsubscription.html
    tier: low
    probes:
      - { id: basic, sql: "DROP SUBSCRIPTION IF EXISTS sub CASCADE;" }
      - { id: plain, sql: "DROP SUBSCRIPTION sub;" }
  - id: drop_tablespace
    name: DROP TABLESPACE
    doc: https://www.postgresql.org/docs/17/sql-droptablespace.html
    tier: low
    probes:
      - { id: basic, sql: "DROP TABLESPACE IF EXISTS ts;" }
      - { id: plain, sql: "DROP TABLESPACE ts;" }
  - id: drop_text_search_configuration
    name: DROP TEXT SEARCH CONFIGURATION
    doc: https://www.postgresql.org/docs/17/sql-droptsconfig.html
    tier: low
    probes:
      - { id: basic, sql: "DROP TEXT SEARCH CONFIGURATION IF EXISTS s.cfg CASCADE;" }
      - { id: plain, sql: "DROP TEXT SEARCH CONFIGURATION cfg;" }
  - id: drop_text_search_dictionary
    name: DROP TEXT SEARCH DICTIONARY
    doc: https://www.postgresql.org/docs/17/sql-droptsdictionary.html
    tier: low
    probes:
      - { id: basic, sql: "DROP TEXT SEARCH DICTIONARY IF EXISTS s.d CASCADE;" }
      - { id: plain, sql: "DROP TEXT SEARCH DICTIONARY d;" }
  - id: drop_text_search_parser
    name: DROP TEXT SEARCH PARSER
    doc: https://www.postgresql.org/docs/17/sql-droptsparser.html
    tier: low
    probes:
      - { id: basic, sql: "DROP TEXT SEARCH PARSER IF EXISTS s.p CASCADE;" }
      - { id: plain, sql: "DROP TEXT SEARCH PARSER p;" }
  - id: drop_text_search_template
    name: DROP TEXT SEARCH TEMPLATE
    doc: https://www.postgresql.org/docs/17/sql-droptstemplate.html
    tier: low
    probes:
      - { id: basic, sql: "DROP TEXT SEARCH TEMPLATE IF EXISTS s.tmpl CASCADE;" }
      - { id: plain, sql: "DROP TEXT SEARCH TEMPLATE tmpl;" }
  - id: drop_transform
    name: DROP TRANSFORM
    doc: https://www.postgresql.org/docs/17/sql-droptransform.html
    tier: low
    probes:
      - { id: basic, sql: "DROP TRANSFORM IF EXISTS FOR hstore LANGUAGE plpython3u CASCADE;" }
      - { id: plain, sql: "DROP TRANSFORM FOR integer LANGUAGE sql;" }
  - id: drop_user_mapping
    name: DROP USER MAPPING
    doc: https://www.postgresql.org/docs/17/sql-dropusermapping.html
    tier: low
    probes:
      - { id: basic, sql: "DROP USER MAPPING IF EXISTS FOR bob SERVER foo;" }
      - { id: public, sql: "DROP USER MAPPING FOR PUBLIC SERVER foo;" }
      - { id: current_user, sql: "DROP USER MAPPING FOR CURRENT_USER SERVER foo;" }
  - id: import_foreign_schema
    name: IMPORT FOREIGN SCHEMA
    doc: https://www.postgresql.org/docs/17/sql-importforeignschema.html
    tier: low
    probes:
      - { id: basic, sql: "IMPORT FOREIGN SCHEMA remote_schema FROM SERVER srv INTO local_schema;" }
      - { id: limit_to, sql: "IMPORT FOREIGN SCHEMA remote_schema LIMIT TO (t1, t2) FROM SERVER srv INTO local_schema;" }
      - { id: except_options, sql: "IMPORT FOREIGN SCHEMA remote_schema EXCEPT (t1) FROM SERVER srv INTO local_schema OPTIONS (import_default 'true');" }
  - id: load
    name: LOAD
    doc: https://www.postgresql.org/docs/17/sql-load.html
    tier: low
    probes:
      - { id: basic, sql: "LOAD 'auto_explain';" }
  - id: reassign_owned
    name: REASSIGN OWNED
    doc: https://www.postgresql.org/docs/17/sql-reassign-owned.html
    tier: low
    probes:
      - { id: basic, sql: "REASSIGN OWNED BY old_role, CURRENT_USER TO new_role;" }
      - { id: to_current, sql: "REASSIGN OWNED BY SESSION_USER TO CURRENT_ROLE;" }
  - id: security_label
    name: SECURITY LABEL
    doc: https://www.postgresql.org/docs/17/sql-security-label.html
    tier: low
    probes:
      - { id: table, sql: "SECURITY LABEL ON TABLE t IS 'classified';" }
      - { id: for_provider_column, sql: "SECURITY LABEL FOR selinux ON COLUMN t.c IS 'system_u:object_r:sepgsql_table_t:s0';" }
      - { id: function_null, sql: "SECURITY LABEL ON FUNCTION f(integer) IS NULL;" }
