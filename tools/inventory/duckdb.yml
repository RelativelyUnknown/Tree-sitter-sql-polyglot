      - { id: multiple_matched, sql: "MERGE INTO t USING s USING (id) WHEN MATCHED AND t.v < 10 THEN UPDATE SET v = s.v WHEN MATCHED AND t.v > 10 THEN DELETE WHEN NOT MATCHED THEN INSERT BY NAME;" }
      - { id: not_matched_insert_values, sql: "MERGE INTO t USING s ON s.id = t.id WHEN NOT MATCHED THEN INSERT VALUES (s.id, s.name);" }
      - { id: not_matched_insert_columns, sql: "MERGE INTO t USING s ON s.id = t.id WHEN NOT MATCHED THEN INSERT (id, name) VALUES (s.id, s.name);" }
      - { id: not_matched_and, sql: "MERGE INTO t USING s ON s.id = t.id WHEN NOT MATCHED AND s.v > 0 THEN INSERT;" }
      - { id: insert_by_name, sql: "MERGE INTO t USING s ON s.id = t.id WHEN NOT MATCHED THEN INSERT BY NAME;" }
      - { id: not_matched_by_source, sql: "MERGE INTO t USING (SELECT 1 AS id) s USING (id) WHEN MATCHED THEN UPDATE WHEN NOT MATCHED BY SOURCE THEN DELETE;" }
      - { id: not_matched_by_target, sql: "MERGE INTO t USING s USING (id) WHEN NOT MATCHED BY TARGET THEN INSERT;" }
      - { id: returning, sql: "MERGE INTO t USING s USING (id) WHEN MATCHED THEN UPDATE RETURNING merge_action, *;" }
    examples:
      - "MERGE INTO people\n    USING (\n        SELECT\n            unnest([3, 1]) AS id,\n            unnest(['Sarah', 'John']) AS name,\n            unnest([95_000.0, 105_000.0]) AS salary\n    ) AS upserts\n    ON (upserts.id = people.id)\n    WHEN MATCHED THEN UPDATE\n    WHEN NOT MATCHED THEN INSERT;"
      - "MERGE INTO people\n    USING (\n        SELECT\n            1 AS id, \n            98_000.0 AS salary\n    ) AS salary_updates\n    USING (id)\n    WHEN MATCHED THEN UPDATE SET salary = salary_updates.salary;"
      - "MERGE INTO people\n    USING (\n        SELECT\n            unnest([3, 2]) AS id, \n    ) AS deletes\n    USING (id)\n    WHEN MATCHED AND people.salary >= 100_000.0 THEN DELETE;"
      - "MERGE INTO people\n    USING (\n        SELECT\n            unnest([3, 1]) AS id,\n            unnest([89_000.0, 70_000.0]) AS salary\n    ) AS upserts\n    USING (id)\n    WHEN MATCHED AND people.salary < 100_000.0 THEN UPDATE SET salary = upserts.salary\n    -- Second update or delete condition\n    WHEN MATCHED AND people.salary > 100_000.0 THEN DELETE\n    WHEN NOT MATCHED THEN INSERT BY NAME\n    RETURNING merge_action, *;"
      - "MERGE INTO target\n    USING (SELECT 1 AS id) source\n    USING (id)\n    WHEN MATCHED THEN UPDATE\n    WHEN NOT MATCHED BY SOURCE THEN DELETE\n    RETURNING merge_action, *;"

