dialect: cockroachdb
engine: CockroachDB
version: "v26.3 (stable)"
source: https://www.cockroachlabs.com/docs/stable/sql-statements

statements:
  - id: create_role
    name: CREATE ROLE
    doc: https://www.cockroachlabs.com/docs/stable/create-role
    tier: medium
    probes:
      - { id: basic, sql: "CREATE ROLE r;" }
      - { id: if_not_exists, sql: "CREATE ROLE IF NOT EXISTS r;" }
      - { id: with_option, sql: "CREATE ROLE r WITH CREATEDB;" }
      - { id: with_multiple_options, sql: "CREATE ROLE r WITH CREATEROLE CREATELOGIN;" }
      - { id: login_password_valid_until, sql: "CREATE ROLE r WITH LOGIN PASSWORD 'pw' VALID UNTIL '2030-01-01';" }
      - { id: password_null, sql: "CREATE ROLE r WITH PASSWORD NULL;" }
      - { id: negated_option, sql: "CREATE ROLE r WITH NOLOGIN NOCREATEDB;" }
      - { id: bypassrls, sql: "CREATE ROLE r WITH BYPASSRLS;" }
    examples:
      - "CREATE ROLE no_options;"
      - "CREATE ROLE can_login WITH LOGIN PASSWORD '$tr0nGpassW0rD' VALID UNTIL '2021-10-10';"
      - "CREATE ROLE can_bypassrls WITH BYPASSRLS;"

  - id: create_user
    name: CREATE USER
    doc: https://www.cockroachlabs.com/docs/stable/create-user
    tier: medium
    probes:
      - { id: basic, sql: "CREATE USER u;" }
      - { id: if_not_exists, sql: "CREATE USER IF NOT EXISTS u;" }
      - { id: with_option, sql: "CREATE USER u WITH CREATEDB;" }
      - { id: with_multiple_options, sql: "CREATE USER u WITH CREATEROLE CREATELOGIN;" }
      - { id: login_password_valid_until, sql: "CREATE USER u WITH LOGIN PASSWORD 'pw' VALID UNTIL '2030-01-01';" }
      - { id: password_null, sql: "CREATE USER u WITH PASSWORD NULL;" }
      - { id: negated_option, sql: "CREATE USER u WITH NOLOGIN NOSQLLOGIN;" }
    examples:
      - "CREATE USER no_options;"
      - "CREATE USER with_password WITH LOGIN PASSWORD '$tr0nGpassW0rD' VALID UNTIL '2021-10-10';"
      - "CREATE USER can_manage_queries WITH CANCELQUERY VIEWACTIVITY;"

  - id: drop_policy
    name: DROP POLICY
    doc: https://www.cockroachlabs.com/docs/stable/drop-policy
    tier: medium
    probes:
      - { id: basic, sql: "DROP POLICY p ON t;" }
      - { id: if_exists, sql: "DROP POLICY IF EXISTS p ON t;" }
      - { id: cascade, sql: "DROP POLICY p ON t CASCADE;" }
      - { id: restrict, sql: "DROP POLICY IF EXISTS p ON t RESTRICT;" }
    examples:
      - "DROP POLICY IF EXISTS your_policy ON orders;"

  - id: drop_role
    name: DROP ROLE
    doc: https://www.cockroachlabs.com/docs/stable/drop-role
    tier: medium
    probes:
      - { id: basic, sql: "DROP ROLE r;" }
      - { id: if_exists, sql: "DROP ROLE IF EXISTS r;" }
      - { id: multiple, sql: "DROP ROLE r1, r2;" }
    examples:
      - "DROP ROLE dev_ops;"

  - id: drop_user
    name: DROP USER
    doc: https://www.cockroachlabs.com/docs/stable/drop-user
    tier: medium
    probes:
      - { id: basic, sql: "DROP USER u;" }
      - { id: if_exists, sql: "DROP USER IF EXISTS u;" }
      - { id: multiple, sql: "DROP USER u1, u2;" }
    examples:
      - "DROP USER max;"

  - id: grant
    name: GRANT
    doc: https://www.cockroachlabs.com/docs/stable/grant
    tier: medium
    probes:
      - { id: table_privilege, sql: "GRANT SELECT ON TABLE t TO u;" }
      - { id: table_default_target, sql: "GRANT INSERT, UPDATE ON t TO u, r;" }
      - { id: all_privileges, sql: "GRANT ALL PRIVILEGES ON TABLE t TO u;" }
      - { id: with_grant_option, sql: "GRANT ALL ON DATABASE d TO u WITH GRANT OPTION;" }
      - { id: schema_target, sql: "GRANT USAGE ON SCHEMA s TO u;" }
      - { id: type_target, sql: "GRANT USAGE ON TYPE ty TO u;" }
      - { id: sequence_target, sql: "GRANT USAGE ON SEQUENCE seq TO u;" }
      - { id: function_target, sql: "GRANT EXECUTE ON FUNCTION f TO u;" }
      - { id: all_tables_in_schema, sql: "GRANT ALL ON ALL TABLES IN SCHEMA s TO u;" }
      - { id: all_sequences_in_schema, sql: "GRANT SELECT ON ALL SEQUENCES IN SCHEMA s TO u;" }
      - { id: all_functions_in_schema, sql: "GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA s TO u;" }
      - { id: system_privilege, sql: "GRANT SYSTEM MODIFYCLUSTERSETTING TO u;" }
      - { id: role_membership, sql: "GRANT r TO u;" }
      - { id: role_with_admin_option, sql: "GRANT r TO u WITH ADMIN OPTION;" }
    examples:
      - "GRANT ALL ON DATABASE movr TO max WITH GRANT OPTION;"
      - "GRANT DELETE ON TABLE rides TO max;"
      - "GRANT developer TO abbey WITH ADMIN OPTION;"

  - id: reassign_owned
    name: REASSIGN OWNED
    doc: https://www.cockroachlabs.com/docs/stable/reassign-owned
    tier: medium
    probes:
      - { id: basic, sql: "REASSIGN OWNED BY r1 TO r2;" }
      - { id: multiple_sources, sql: "REASSIGN OWNED BY r1, r2 TO r3;" }
    examples:
      - "REASSIGN OWNED BY cockroachlabs TO movrlabs;"

  - id: revoke
    name: REVOKE
    doc: https://www.cockroachlabs.com/docs/stable/revoke
    tier: medium
    probes:
      - { id: table_privilege, sql: "REVOKE SELECT ON TABLE t FROM u;" }
      - { id: table_default_target, sql: "REVOKE INSERT, UPDATE ON t FROM u, r;" }
      - { id: all_privileges, sql: "REVOKE ALL PRIVILEGES ON TABLE t FROM u;" }
      - { id: grant_option_for, sql: "REVOKE GRANT OPTION FOR SELECT ON TABLE t FROM u;" }
      - { id: schema_target, sql: "REVOKE USAGE ON SCHEMA s FROM u;" }
      - { id: type_target, sql: "REVOKE USAGE ON TYPE ty FROM u;" }
      - { id: function_target, sql: "REVOKE EXECUTE ON FUNCTION f FROM u;" }
      - { id: all_tables_in_schema, sql: "REVOKE ALL ON ALL TABLES IN SCHEMA s FROM u;" }
      - { id: all_functions_in_schema, sql: "REVOKE EXECUTE ON ALL FUNCTIONS IN SCHEMA s FROM u;" }
      - { id: system_privilege, sql: "REVOKE SYSTEM MODIFYCLUSTERSETTING FROM u;" }
      - { id: role_membership, sql: "REVOKE r FROM u;" }
      - { id: role_admin_option, sql: "REVOKE ADMIN OPTION FOR r FROM u;" }
    examples:
      - "REVOKE CREATE ON DATABASE movr FROM max;"
      - "REVOKE ALL ON TABLE rides FROM max;"
      - "REVOKE developer FROM abbey;"

  - id: show_grants
    name: SHOW GRANTS
    doc: https://www.cockroachlabs.com/docs/stable/show-grants
    tier: medium
    probes:
      - { id: all, sql: "SHOW GRANTS;" }
      - { id: for_user, sql: "SHOW GRANTS FOR u;" }
      - { id: on_database, sql: "SHOW GRANTS ON DATABASE d;" }
      - { id: on_table_for_user, sql: "SHOW GRANTS ON TABLE t FOR u;" }
      - { id: on_all_tables, sql: "SHOW GRANTS ON TABLE *;" }
      - { id: on_schema, sql: "SHOW GRANTS ON SCHEMA s;" }
      - { id: on_type, sql: "SHOW GRANTS ON TYPE ty;" }
      - { id: on_function, sql: "SHOW GRANTS ON FUNCTION f;" }
      - { id: on_external_connection, sql: "SHOW GRANTS ON EXTERNAL CONNECTION c;" }
      - { id: on_role, sql: "SHOW GRANTS ON ROLE r;" }
      - { id: on_role_for_user, sql: "SHOW GRANTS ON ROLE FOR u;" }
    examples:
      - "SHOW GRANTS FOR max;"
      - "SHOW GRANTS ON DATABASE movr FOR max;"
      - "SHOW GRANTS ON ROLE moderator;"

  - id: show_policies
    name: SHOW POLICIES
    doc: https://www.cockroachlabs.com/docs/stable/show-policies
    tier: medium
    probes:
      - { id: basic, sql: "SHOW POLICIES FOR t;" }
    examples:
      - "SHOW POLICIES FOR orders;"
