      - id: multiple_permissions_principals
        sql: "GRANT SELECT, INSERT, UPDATE ON dbo.t TO u1, r1;"
      - id: column_list
        sql: "GRANT SELECT (c1, c2) ON t TO u1;"
      - id: all_privileges
        sql: "GRANT ALL PRIVILEGES ON t TO u1;"
      - id: all
        sql: "GRANT ALL ON t TO u1;"
        note: "GRANT ALL is deprecated but remains in the syntax ({ ALL [ PRIVILEGES ] })."
      - id: class_qualified
        sql: "GRANT EXECUTE ON OBJECT::dbo.p TO r1;"
      - id: no_securable
        sql: "GRANT CREATE TABLE TO u1;"
      - id: with_grant_option
        sql: "GRANT EXECUTE ON TestProc TO TesterRole WITH GRANT OPTION;"
      - id: as_principal
        sql: "GRANT EXECUTE ON TestProc TO User2 AS TesterRole;"
      - id: bracketed_windows_principal
        sql: "GRANT CONNECT TO [Domain\\User];"
    examples:
      - |-
        -- Execute the following as a database owner
        GRANT EXECUTE ON TestProc TO TesterRole WITH GRANT OPTION;
      - |-
        -- Execute the following as User1
        -- The following fails because User1 does not have the permission as the User1
        GRANT EXECUTE ON TestProc TO User2;
      - |-
        -- The following succeeds because User1 invokes the TesterRole membership
        GRANT EXECUTE ON TestProc TO User2 AS TesterRole;

