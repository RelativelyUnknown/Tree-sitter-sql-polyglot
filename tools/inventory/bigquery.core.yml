    probes:
      - { id: basic, sql: "CREATE TABLE FUNCTION d.f(y INT64) AS SELECT a, b FROM t WHERE c = y;" }
      - { id: or_replace_if_not_exists, sql: "CREATE OR REPLACE TABLE FUNCTION f(y INT64) AS SELECT 1 AS x;" }
      - { id: if_not_exists, sql: "CREATE TABLE FUNCTION IF NOT EXISTS f() AS SELECT 1 AS x;" }
      - { id: returns_table, sql: "CREATE TABLE FUNCTION f(y INT64) RETURNS TABLE<name STRING, year INT64> AS SELECT name, year FROM t WHERE year = y;" }
      - { id: any_type_param, sql: "CREATE TABLE FUNCTION f(x ANY TYPE) AS SELECT x AS v;" }
      - { id: table_param, sql: "CREATE TABLE FUNCTION f(o TABLE<item STRING, sales INT64>, n STRING) AS (SELECT SUM(sales) AS s, item FROM o WHERE item = n GROUP BY item);" }
      - { id: options, sql: "CREATE TABLE FUNCTION f(y INT64) OPTIONS (description = 'd') AS SELECT y AS v;" }
    examples:
      - |-
        CREATE OR REPLACE TABLE FUNCTION mydataset.names_by_year(y INT64)
        AS
         SELECT year, name, SUM(number) AS total
         FROM `bigquery-public-data.usa_names.usa_1910_current`
         WHERE year = y
         GROUP BY year, name;
      - |-
        CREATE OR REPLACE TABLE FUNCTION mydataset.names_by_year(y INT64)
        RETURNS TABLE<name STRING, year INT64, total INT64>
        AS
         SELECT year, name, SUM(number) AS total
         FROM `bigquery-public-data.usa_names.usa_1910_current`
         WHERE year = y
         GROUP BY year, name;
      - |-
        CREATE TABLE FUNCTION mydataset.compute_sales (
         orders TABLE<item STRING, sales INT64>, item_name STRING)
        AS (
         SELECT SUM(sales) AS total_sales, item
         FROM orders
         WHERE item = item_name
         GROUP BY item
        );

  - id: create_procedure
    name: "CREATE PROCEDURE"
    doc: https://cloud.google.com/bigquery/docs/reference/standard-sql/data-definition-language#create_procedure
    tier: high
    probes:
      - { id: basic, sql: "CREATE PROCEDURE d.p(x INT64) BEGIN SELECT x; END;" }
      - { id: no_args, sql: "CREATE PROCEDURE p() BEGIN SELECT 1; END;" }
      - { id: or_replace, sql: "CREATE OR REPLACE PROCEDURE p() BEGIN SELECT 1; END;" }
      - { id: if_not_exists, sql: "CREATE PROCEDURE IF NOT EXISTS p() BEGIN SELECT 1; END;" }
      - { id: arg_modes, sql: "CREATE PROCEDURE p(IN a INT64, OUT b INT64, INOUT c INT64) BEGIN SET b = a; SET c = c + a; END;" }
      - { id: options, sql: "CREATE PROCEDURE p(x INT64) OPTIONS (strict_mode = FALSE, description = 'd') BEGIN SELECT x; END;" }
      - { id: multi_statement_body, sql: "CREATE PROCEDURE p(d DATE, OUT n INT64) BEGIN CREATE TEMP TABLE tt AS SELECT id FROM t WHERE dt = d; SET n = (SELECT COUNT(*) FROM tt); DROP TABLE tt; END;" }
      - { id: spark_inline, sql: "CREATE PROCEDURE d.sp() WITH CONNECTION `p.us.c` OPTIONS (engine = 'SPARK', runtime_version = '1.1') LANGUAGE PYTHON AS r'''print(1)''';" }
      - { id: spark_external_security, sql: "CREATE OR REPLACE PROCEDURE d.sp(x INT64) EXTERNAL SECURITY INVOKER WITH CONNECTION `p.us.c` OPTIONS (engine = 'SPARK', main_file_uri = 'gs://b/main.py') LANGUAGE PYTHON;" }
    examples:
      - |-
        CREATE PROCEDURE mydataset.AddDelta(INOUT x INT64, delta INT64)
        BEGIN
         SET x = x + delta;
        END;
      - |-
        CREATE PROCEDURE mydataset.SelectFromTablesAndAppend(
         target_date DATE, OUT rows_added INT64)
        BEGIN
         CREATE TEMP TABLE DataForTargetDate AS
         SELECT t1.id, t1.x, t2.y
         FROM dataset.partitioned_table1 AS t1
         JOIN dataset.partitioned_table2 AS t2
         ON t1.id = t2.id
         WHERE t1.date = target_date
         AND t2.date = target_date;
         SET rows_added = (SELECT COUNT(*) FROM DataForTargetDate);
         SELECT id, x, y, target_date -- note that target_date is a parameter
         FROM DataForTargetDate;
         DROP TABLE DataForTargetDate;
        END;

