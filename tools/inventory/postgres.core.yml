  - id: merge
    name: MERGE
    doc: https://www.postgresql.org/docs/17/sql-merge.html
    tier: high
    probes:
      - { id: matched_update, sql: "MERGE INTO t USING s ON t.id = s.id WHEN MATCHED THEN UPDATE SET a = s.a;" }
      - { id: target_alias, sql: "MERGE INTO t AS x USING s ON x.id = s.id WHEN MATCHED THEN DELETE;" }
      - { id: target_alias_bare, sql: "MERGE INTO t x USING s ON x.id = s.id WHEN MATCHED THEN DELETE;" }
      - { id: target_only_star, sql: "MERGE INTO ONLY t USING s * ON t.id = s.id WHEN MATCHED THEN DELETE;" }
      - { id: source_only, sql: "MERGE INTO t USING ONLY s AS src ON t.id = src.id WHEN MATCHED THEN DELETE;" }
      - { id: source_subquery, sql: "MERGE INTO t USING (SELECT id, a FROM u) AS s ON t.id = s.id WHEN MATCHED THEN UPDATE SET a = s.a;" }
      - { id: matched_and_condition, sql: "MERGE INTO t USING s ON t.id = s.id WHEN MATCHED AND s.a > 0 THEN UPDATE SET a = s.a;" }
      - { id: matched_update_default, sql: "MERGE INTO t USING s ON t.id = s.id WHEN MATCHED THEN UPDATE SET a = DEFAULT, b = s.b;" }
      - { id: matched_update_multi_column, sql: "MERGE INTO t USING s ON t.id = s.id WHEN MATCHED THEN UPDATE SET (a, b) = (s.a, DEFAULT);" }
      - { id: matched_update_row, sql: "MERGE INTO t USING s ON t.id = s.id WHEN MATCHED THEN UPDATE SET (a, b) = ROW (s.a, s.b);" }
      - { id: matched_update_subselect, sql: "MERGE INTO t USING s ON t.id = s.id WHEN MATCHED THEN UPDATE SET (a, b) = (SELECT a, b FROM u WHERE u.id = s.id);" }
      - { id: matched_delete, sql: "MERGE INTO t USING s ON t.id = s.id WHEN MATCHED THEN DELETE;" }
      - { id: matched_do_nothing, sql: "MERGE INTO t USING s ON t.id = s.id WHEN MATCHED THEN DO NOTHING;" }
      - { id: not_matched_insert, sql: "MERGE INTO t USING s ON t.id = s.id WHEN NOT MATCHED THEN INSERT (id, a) VALUES (s.id, s.a);" }
      - { id: not_matched_insert_no_columns, sql: "MERGE INTO t USING s ON t.id = s.id WHEN NOT MATCHED THEN INSERT VALUES (s.id, DEFAULT);" }
      - { id: not_matched_insert_default_values, sql: "MERGE INTO t USING s ON t.id = s.id WHEN NOT MATCHED THEN INSERT DEFAULT VALUES;" }
      - { id: not_matched_insert_overriding, sql: "MERGE INTO t USING s ON t.id = s.id WHEN NOT MATCHED THEN INSERT (id, a) OVERRIDING SYSTEM VALUE VALUES (s.id, s.a);" }
      - { id: not_matched_insert_overriding_user, sql: "MERGE INTO t USING s ON t.id = s.id WHEN NOT MATCHED THEN INSERT (id, a) OVERRIDING USER VALUE VALUES (s.id, s.a);" }
      - { id: not_matched_by_target, sql: "MERGE INTO t USING s ON t.id = s.id WHEN NOT MATCHED BY TARGET AND s.a > 0 THEN INSERT VALUES (s.id, s.a);" }
      - { id: not_matched_do_nothing, sql: "MERGE INTO t USING s ON t.id = s.id WHEN NOT MATCHED THEN DO NOTHING;" }
      - { id: not_matched_by_source_delete, sql: "MERGE INTO t USING s ON t.id = s.id WHEN NOT MATCHED BY SOURCE THEN DELETE;" }
      - { id: not_matched_by_source_update, sql: "MERGE INTO t USING s ON t.id = s.id WHEN NOT MATCHED BY SOURCE AND t.a > 0 THEN UPDATE SET a = 0;" }
      - { id: not_matched_by_source_do_nothing, sql: "MERGE INTO t USING s ON t.id = s.id WHEN NOT MATCHED BY SOURCE THEN DO NOTHING;" }
      - { id: multiple_when_clauses, sql: "MERGE INTO t USING s ON t.id = s.id WHEN MATCHED AND s.del THEN DELETE WHEN MATCHED THEN UPDATE SET a = s.a WHEN NOT MATCHED THEN INSERT VALUES (s.id, s.a);" }
      - { id: returning, sql: "MERGE INTO t USING s ON t.id = s.id WHEN MATCHED THEN DELETE RETURNING merge_action(), t.*;" }
      - { id: returning_star, sql: "MERGE INTO t USING s ON t.id = s.id WHEN MATCHED THEN UPDATE SET a = s.a RETURNING *;" }
      - { id: with_cte, sql: "WITH src AS (SELECT id, a FROM u) MERGE INTO t USING src ON t.id = src.id WHEN MATCHED THEN UPDATE SET a = src.a;" }
    examples:
      - |-
        MERGE INTO customer_account ca
        USING recent_transactions t
        ON t.customer_id = ca.customer_id
        WHEN MATCHED THEN
          UPDATE SET balance = balance + transaction_value
        WHEN NOT MATCHED THEN
          INSERT (customer_id, balance)
          VALUES (t.customer_id, t.transaction_value);
      - |-
        MERGE INTO customer_account ca
        USING (SELECT customer_id, transaction_value FROM recent_transactions) AS t
        ON t.customer_id = ca.customer_id
        WHEN MATCHED THEN
          UPDATE SET balance = balance + transaction_value
        WHEN NOT MATCHED THEN
          INSERT (customer_id, balance)
          VALUES (t.customer_id, t.transaction_value);
      - |-
        MERGE INTO wines w
        USING wine_stock_changes s
        ON s.winename = w.winename
        WHEN NOT MATCHED AND s.stock_delta > 0 THEN
          INSERT VALUES(s.winename, s.stock_delta)
        WHEN MATCHED AND w.stock + s.stock_delta > 0 THEN
          UPDATE SET stock = w.stock + s.stock_delta
        WHEN MATCHED THEN
          DELETE
        RETURNING merge_action(), w.*;
      - |-
        MERGE INTO wines w
        USING new_wine_list s
        ON s.winename = w.winename
        WHEN NOT MATCHED BY TARGET THEN
          INSERT VALUES(s.winename, s.stock)
        WHEN MATCHED AND w.stock != s.stock THEN
          UPDATE SET stock = s.stock
        WHEN NOT MATCHED BY SOURCE THEN
          DELETE;

