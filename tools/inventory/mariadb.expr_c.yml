      - { id: column_exists, sql: "SELECT COLUMN_EXISTS(dyncol_blob, 'a') FROM t;" }
      - { id: column_list, sql: "SELECT COLUMN_LIST(dyncol_blob) FROM t;" }
      - { id: column_json, sql: "SELECT COLUMN_JSON(dyncol_blob) FROM t;" }
      - { id: column_check, sql: "SELECT COLUMN_CHECK(dyncol_blob) FROM t;" }
    examples:
      - "INSERT INTO tbl SET dyncol_blob=COLUMN_CREATE(\"column_name\", \"value\");"

