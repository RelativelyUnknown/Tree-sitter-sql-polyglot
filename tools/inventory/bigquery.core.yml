      - { id: remote_function, sql: "CREATE FUNCTION d.f(x FLOAT64, y FLOAT64) RETURNS FLOAT64 REMOTE WITH CONNECTION us.c OPTIONS (endpoint = 'https://example.com/multiply');" }
