dialect: tsql
engine: SQL Server 2022 / Azure SQL Database
version: "2022"
source: https://learn.microsoft.com/en-us/sql/t-sql/statements/statements

statements:
  - id: drop_trigger
    name: DROP TRIGGER
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/drop-trigger-transact-sql
    tier: high
    probes:
      - id: dml_trigger
        sql: "DROP TRIGGER tr;"
      - id: dml_trigger_schema
        sql: "DROP TRIGGER s.tr;"
      - id: if_exists
        sql: "DROP TRIGGER IF EXISTS tr;"
      - id: multiple_triggers
        sql: "DROP TRIGGER s.tr1, s.tr2;"
      - id: ddl_trigger_on_database
        sql: "DROP TRIGGER tr ON DATABASE;"
      - id: ddl_trigger_on_all_server
        sql: "DROP TRIGGER tr ON ALL SERVER;"
      - id: ddl_trigger_if_exists_multiple
        sql: "DROP TRIGGER IF EXISTS tr1, tr2 ON DATABASE;"
      - id: logon_trigger
        sql: "DROP TRIGGER IF EXISTS tr ON ALL SERVER;"
    examples:
      - "DROP TRIGGER safety ON DATABASE;"

  - id: drop_type
    name: DROP TYPE
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/drop-type-transact-sql
    tier: high
    probes:
      - id: basic
        sql: "DROP TYPE t;"
      - id: schema_qualified
        sql: "DROP TYPE s.t;"
      - id: if_exists
        sql: "DROP TYPE IF EXISTS s.t;"
    examples:
      - "DROP TYPE ssn ;"
