dialect: db2
engine: IBM Db2 for Linux, UNIX and Windows
version: "12.1"
source: https://www.ibm.com/docs/en/db2/12.1.x?topic=reference-statements

statements:
  - id: open
    name: OPEN
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-open
    tier: high
    probes:
      - id: cursor_name
        sql: "OPEN c1;"
      - id: using_variable
        sql: "OPEN c1 USING v1;"
      - id: using_variable_list
        sql: "OPEN c1 USING v1, v2;"
      - id: using_host_variable
        sql: "OPEN c1 USING :hv1, :hv2;"
      - id: using_descriptor
        sql: "OPEN c1 USING DESCRIPTOR :sqlda;"
      - id: cursor_variable
        sql: "OPEN p1;"
      - id: using_expression
        sql: "OPEN c1 USING v1 + 1, 'abc';"
        note: An expression other than a variable can only be used in compiled compound statements.
    examples:
      - |-
        CREATE PROCEDURE PROC1 (OUT P1 CURSOR)
        LANGUAGE SQL
        BEGIN
          SET P1 = CURSOR FOR SELECT DEPTNO, DEPTNAME, MGRNO FROM DEPARTMENT WHERE ADMRDEPT = 'A00';
          OPEN P1;
        END;

  - id: release_savepoint
    name: RELEASE SAVEPOINT
    doc: https://www.ibm.com/docs/en/db2/12.1.x?topic=statements-release-savepoint
    tier: high
    probes:
      - id: release_savepoint
        sql: "RELEASE SAVEPOINT sp1;"
      - id: release_to_savepoint
        sql: "RELEASE TO SAVEPOINT sp1;"
    examples:
      - "RELEASE SAVEPOINT SAVEPOINT1;"
