dialect: flink
engine: Apache Flink SQL
version: "2.3"
source: https://nightlies.apache.org/flink/flink-docs-release-2.3/docs/sql/reference/

statements:
  - id: show_current_catalog
    name: SHOW CURRENT CATALOG
    doc: https://nightlies.apache.org/flink/flink-docs-release-2.3/docs/sql/reference/utility/show/#show-current-catalog
    tier: medium
    probes:
      - { id: basic, sql: "SHOW CURRENT CATALOG;" }

  - id: show_create_catalog
    name: SHOW CREATE CATALOG
    doc: https://nightlies.apache.org/flink/flink-docs-release-2.3/docs/sql/reference/utility/show/#show-create-catalog
    tier: medium
    probes:
      - { id: basic, sql: "SHOW CREATE CATALOG cat2;" }
    examples:
      - "show create catalog cat2;"

  - id: show_databases
    name: SHOW DATABASES
    doc: https://nightlies.apache.org/flink/flink-docs-release-2.3/docs/sql/reference/utility/show/#show-databases
    tier: medium
    probes:
      - { id: basic, sql: "SHOW DATABASES;" }
      - { id: from_catalog, sql: "SHOW DATABASES FROM c;" }
      - { id: in_catalog, sql: "SHOW DATABASES IN c;" }
      - { id: like, sql: "SHOW DATABASES LIKE '%db%';" }
      - { id: not_ilike, sql: "SHOW DATABASES FROM c NOT ILIKE '%db%';" }

  - id: show_current_database
    name: SHOW CURRENT DATABASE
    doc: https://nightlies.apache.org/flink/flink-docs-release-2.3/docs/sql/reference/utility/show/#show-current-database
    tier: medium
    probes:
      - { id: basic, sql: "SHOW CURRENT DATABASE;" }

  - id: show_tables
    name: SHOW TABLES
    doc: https://nightlies.apache.org/flink/flink-docs-release-2.3/docs/sql/reference/utility/show/#show-tables
    tier: medium
    probes:
      - { id: basic, sql: "SHOW TABLES;" }
      - { id: from_database, sql: "SHOW TABLES FROM db1;" }
      - { id: in_qualified_database, sql: "SHOW TABLES IN catalog1.db1;" }
      - { id: like, sql: "SHOW TABLES LIKE '%n';" }
      - { id: not_like, sql: "SHOW TABLES FROM db1 NOT LIKE '%n';" }
    examples:
      - "show tables from db1;"
      - "show tables from db1 like '%n';"
      - "show tables from db1 not like '%n';"

  - id: show_create_table
    name: SHOW CREATE TABLE
    doc: https://nightlies.apache.org/flink/flink-docs-release-2.3/docs/sql/reference/utility/show/#show-create-table
    tier: medium
    probes:
      - { id: basic, sql: "SHOW CREATE TABLE t;" }
      - { id: qualified, sql: "SHOW CREATE TABLE c.db.t;" }
    examples:
      - "show create table orders;"

  - id: show_columns
    name: SHOW COLUMNS
    doc: https://nightlies.apache.org/flink/flink-docs-release-2.3/docs/sql/reference/utility/show/#show-columns
    tier: medium
    probes:
      - { id: from_table, sql: "SHOW COLUMNS FROM t;" }
      - { id: in_table, sql: "SHOW COLUMNS IN db.t;" }
      - { id: qualified, sql: "SHOW COLUMNS FROM c.db.t;" }
      - { id: like, sql: "SHOW COLUMNS FROM t LIKE '%r';" }
      - { id: not_like, sql: "SHOW COLUMNS IN t NOT LIKE '%_r';" }
    examples:
      - "show columns from orders;"
      - "show columns from orders like '%r';"
      - "show columns from orders not like '%_r';"

  - id: show_partitions
    name: SHOW PARTITIONS
    doc: https://nightlies.apache.org/flink/flink-docs-release-2.3/docs/sql/reference/utility/show/#show-partitions
    tier: medium
    probes:
      - { id: basic, sql: "SHOW PARTITIONS t;" }
      - { id: qualified, sql: "SHOW PARTITIONS c.db.t;" }
      - { id: partition_spec, sql: "SHOW PARTITIONS t PARTITION (id = 1002);" }
      - { id: partition_spec_multi, sql: "SHOW PARTITIONS t PARTITION (id = 1002, dt = '2020-01-01');" }
    examples:
      - "show partitions table1;"
      - "show partitions table1 partition (id = 1002);"

  - id: show_procedures
    name: SHOW PROCEDURES
    doc: https://nightlies.apache.org/flink/flink-docs-release-2.3/docs/sql/reference/utility/show/#show-procedures
    tier: medium
    probes:
      - { id: basic, sql: "SHOW PROCEDURES;" }
      - { id: from_database, sql: "SHOW PROCEDURES FROM c.db;" }
      - { id: in_database, sql: "SHOW PROCEDURES IN db;" }
      - { id: like, sql: "SHOW PROCEDURES LIKE '%p%';" }
      - { id: not_ilike, sql: "SHOW PROCEDURES FROM db NOT ILIKE '%p%';" }

  - id: show_views
    name: SHOW VIEWS
    doc: https://nightlies.apache.org/flink/flink-docs-release-2.3/docs/sql/reference/utility/show/#show-views
    tier: medium
    probes:
      - { id: basic, sql: "SHOW VIEWS;" }
      - { id: from_database, sql: "SHOW VIEWS FROM c.db;" }
      - { id: in_database, sql: "SHOW VIEWS IN db;" }
      - { id: like, sql: "SHOW VIEWS LIKE '%v%';" }
      - { id: not_like, sql: "SHOW VIEWS FROM db NOT LIKE '%v%';" }
