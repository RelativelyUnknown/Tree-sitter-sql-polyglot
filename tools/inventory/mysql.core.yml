      - { id: sqlstate, sql: "CREATE PROCEDURE p() BEGIN DECLARE no_such_table CONDITION FOR SQLSTATE '42S02'; DECLARE EXIT HANDLER FOR no_such_table SET @e = 1; DROP TABLE missing_t; END;" }
      - { id: sqlstate_value, sql: "CREATE PROCEDURE p() BEGIN DECLARE c CONDITION FOR SQLSTATE VALUE '45000'; SIGNAL c; END;" }

  - id: declare_handler
    name: DECLARE ... HANDLER
    doc: https://dev.mysql.com/doc/refman/8.4/en/declare-handler.html
    tier: high
    probes:
      - { id: continue_error_code, sql: "CREATE PROCEDURE p() BEGIN DECLARE CONTINUE HANDLER FOR 1051 BEGIN END; DROP TABLE missing_t; END;" }
      - { id: continue_sqlstate, sql: "CREATE PROCEDURE p() BEGIN DECLARE CONTINUE HANDLER FOR SQLSTATE '23000' SET @x2 = 1; INSERT INTO t VALUES (1); END;" }
      - { id: sqlstate_value_keyword, sql: "CREATE PROCEDURE p() BEGIN DECLARE CONTINUE HANDLER FOR SQLSTATE VALUE '23000' SET @x2 = 1; INSERT INTO t VALUES (1); END;" }
      - { id: exit_sqlexception, sql: "CREATE PROCEDURE p() BEGIN DECLARE EXIT HANDLER FOR SQLEXCEPTION BEGIN ROLLBACK; RESIGNAL; END; START TRANSACTION; INSERT INTO t VALUES (1); COMMIT; END;" }
      - { id: sqlwarning, sql: "CREATE PROCEDURE p() BEGIN DECLARE CONTINUE HANDLER FOR SQLWARNING BEGIN END; INSERT INTO t VALUES (1); END;" }
      - { id: not_found, sql: "CREATE PROCEDURE p() BEGIN DECLARE done INT DEFAULT FALSE; DECLARE CONTINUE HANDLER FOR NOT FOUND SET done = TRUE; SELECT a INTO @a FROM t WHERE 1 = 0; END;" }
      - { id: condition_name, sql: "CREATE PROCEDURE p() BEGIN DECLARE c CONDITION FOR 1051; DECLARE EXIT HANDLER FOR c SET @e = 1; DROP TABLE missing_t; END;" }
      - { id: multiple_condition_values, sql: "CREATE PROCEDURE p() BEGIN DECLARE EXIT HANDLER FOR SQLWARNING, NOT FOUND, SQLEXCEPTION, 1051 SET @e = 1; DROP TABLE missing_t; END;" }
    examples:
      - |-
        CREATE PROCEDURE p ()
        BEGIN
          DECLARE i INT DEFAULT 3;
          retry:
            REPEAT
              BEGIN
                DECLARE CONTINUE HANDLER FOR SQLWARNING
                  BEGIN
                    ITERATE retry;    # illegal
                  END;
                IF i < 0 THEN
                  LEAVE retry;        # legal
                END IF;
                SET i = i - 1;
              END;
            UNTIL FALSE END REPEAT;
        END;
      - |-
        CREATE PROCEDURE p ()
        BEGIN
          DECLARE i INT DEFAULT 3;
          DECLARE done INT DEFAULT FALSE;
          retry:
            REPEAT
              BEGIN
                DECLARE CONTINUE HANDLER FOR SQLWARNING
                  BEGIN
                    SET done = TRUE;
                  END;
                IF done OR i < 0 THEN
                  LEAVE retry;
                END IF;
                SET i = i - 1;
              END;
            UNTIL FALSE END REPEAT;
        END;

  - id: get_diagnostics
    name: GET DIAGNOSTICS
    doc: https://dev.mysql.com/doc/refman/8.4/en/get-diagnostics.html
    tier: medium
    probes:
      - { id: statement_items, sql: "GET DIAGNOSTICS @p1 = NUMBER, @p2 = ROW_COUNT;" }
      - { id: condition_items, sql: "GET DIAGNOSTICS CONDITION 1 @p3 = RETURNED_SQLSTATE, @p4 = MESSAGE_TEXT;" }
      - { id: condition_variable_number, sql: "GET DIAGNOSTICS CONDITION @cno @errno = MYSQL_ERRNO;" }
      - { id: current, sql: "GET CURRENT DIAGNOSTICS @n = NUMBER;" }
      - { id: all_condition_items, sql: "GET DIAGNOSTICS CONDITION 1 @a = CLASS_ORIGIN, @b = SUBCLASS_ORIGIN, @c = CONSTRAINT_CATALOG, @d = CONSTRAINT_SCHEMA, @e = CONSTRAINT_NAME, @f = CATALOG_NAME, @g = SCHEMA_NAME, @h = TABLE_NAME, @i = COLUMN_NAME, @j = CURSOR_NAME;" }
      - { id: stacked_in_handler, sql: "CREATE PROCEDURE p() BEGIN DECLARE msg TEXT; DECLARE EXIT HANDLER FOR SQLEXCEPTION BEGIN GET STACKED DIAGNOSTICS CONDITION 1 msg = MESSAGE_TEXT; SELECT msg; END; DROP TABLE missing_t; END;" }
      - { id: local_variable_targets, sql: "CREATE PROCEDURE p() BEGIN DECLARE nrows INT; INSERT INTO t VALUES (1); GET DIAGNOSTICS nrows = ROW_COUNT; END;" }
    examples:
      - "GET DIAGNOSTICS @p1 = NUMBER, @p2 = ROW_COUNT;"
      - |-
        GET DIAGNOSTICS CONDITION 1
          @p3 = RETURNED_SQLSTATE, @p4 = MESSAGE_TEXT;
      - "GET DIAGNOSTICS CONDITION 1 @errno = MYSQL_ERRNO;"
      - "GET DIAGNOSTICS CONDITION @cno @errno = MYSQL_ERRNO;"
      - |-
        CREATE PROCEDURE do_insert(value INT)
        BEGIN
          -- Declare variables to hold diagnostics area information
          DECLARE code CHAR(5) DEFAULT '00000';
          DECLARE msg TEXT;
          DECLARE nrows INT;
          DECLARE result TEXT;
          -- Declare exception handler for failed insert
          DECLARE CONTINUE HANDLER FOR SQLEXCEPTION
            BEGIN
              GET DIAGNOSTICS CONDITION 1
                code = RETURNED_SQLSTATE, msg = MESSAGE_TEXT;
            END;

          -- Perform the insert
          INSERT INTO t1 (int_col) VALUES(value);
          -- Check whether the insert was successful
          IF code = '00000' THEN
            GET DIAGNOSTICS nrows = ROW_COUNT;
            SET result = CONCAT('insert succeeded, row count = ',nrows);
          ELSE
            SET result = CONCAT('insert failed, error = ',code,', message = ',msg);
          END IF;
          -- Say what happened
          SELECT result;
        END;

  - id: signal
    name: SIGNAL
    doc: https://dev.mysql.com/doc/refman/8.4/en/signal.html
    tier: medium
    probes:
      - { id: sqlstate, sql: "SIGNAL SQLSTATE '77777';" }
      - { id: sqlstate_value, sql: "SIGNAL SQLSTATE VALUE '45000';" }
      - { id: set_message_text, sql: "SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'An error occurred';" }
      - { id: set_multiple_items, sql: "SIGNAL SQLSTATE '01000' SET MESSAGE_TEXT = 'A warning occurred', MYSQL_ERRNO = 1000, TABLE_NAME = 't', CLASS_ORIGIN = 'x';" }
      - { id: condition_name, sql: "CREATE PROCEDURE p(divisor INT) BEGIN DECLARE divide_by_zero CONDITION FOR SQLSTATE '22012'; IF divisor = 0 THEN SIGNAL divide_by_zero; END IF; END;" }
      - { id: set_from_variable, sql: "CREATE PROCEDURE p(msg VARCHAR(100)) BEGIN SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = msg; END;" }
    examples:
      - |-
        CREATE PROCEDURE p (pval INT)
        BEGIN
          DECLARE specialty CONDITION FOR SQLSTATE '45000';
          IF pval = 0 THEN
            SIGNAL SQLSTATE '01000';
          ELSEIF pval = 1 THEN
            SIGNAL SQLSTATE '45000'
              SET MESSAGE_TEXT = 'An error occurred';
          ELSEIF pval = 2 THEN
            SIGNAL specialty
              SET MESSAGE_TEXT = 'An error occurred';
          ELSE
            SIGNAL SQLSTATE '01000'
              SET MESSAGE_TEXT = 'A warning occurred', MYSQL_ERRNO = 1000;
            SIGNAL SQLSTATE '45000'
              SET MESSAGE_TEXT = 'An error occurred', MYSQL_ERRNO = 1001;
          END IF;
        END;
      - "SIGNAL SQLSTATE '77777';"
      - |-
        CREATE PROCEDURE p (divisor INT)
        BEGIN
          DECLARE my_error CONDITION FOR SQLSTATE '45000';
          IF divisor = 0 THEN
            BEGIN
              DECLARE my_error CONDITION FOR SQLSTATE '22012';
              SIGNAL my_error;
            END;
          END IF;
          SIGNAL my_error;
        END;
      - |-
        CREATE PROCEDURE p ()
        BEGIN
          DECLARE EXIT HANDLER FOR SQLEXCEPTION
          BEGIN
            SIGNAL SQLSTATE VALUE '99999'
              SET MESSAGE_TEXT = 'An error occurred';
          END;
          DROP TABLE no_such_table;
        END;

  - id: resignal
