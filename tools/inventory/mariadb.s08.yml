dialect: mariadb
engine: MariaDB Server
version: "11.x (current)"
source: https://mariadb.com/docs/server/reference/sql-statements

statements:
  - id: truncate_table
    name: TRUNCATE TABLE
    doc: https://mariadb.com/docs/server/reference/sql-statements/table-statements/truncate-table
    tier: high
    probes:
      - id: truncate_table
        sql: "TRUNCATE TABLE t;"
      - id: truncate_without_table_keyword
        sql: "TRUNCATE t;"
        note: "Syntax block: TRUNCATE [TABLE] tbl_name."
      - id: truncate_qualified_name
        sql: "TRUNCATE TABLE db.t;"
        note: The page says tbl_name can also be written db_name.tbl_name.
      - id: truncate_wait
        sql: "TRUNCATE TABLE t WAIT 10;"
      - id: truncate_nowait
        sql: "TRUNCATE TABLE t NOWAIT;"
      - id: truncate_without_table_keyword_wait
        sql: "TRUNCATE t WAIT 5;"
    examples: []

  - id: call
    name: CALL
    doc: https://mariadb.com/docs/server/reference/sql-statements/stored-routine-statements/call
    tier: high
    probes:
      - id: call_with_arguments
        sql: "CALL p(1, 'a');"
      - id: call_empty_parentheses
        sql: "CALL p();"
      - id: call_without_parentheses
        sql: "CALL p;"
      - id: call_qualified_name
        sql: "CALL db.p(1);"
      - id: call_quoted_name
        sql: "CALL `db`.`p`(1);"
      - id: call_user_variable_argument
        sql: "CALL p(@v);"
        note: OUT and INOUT parameters are passed back through user-defined variables.
      - id: call_expression_argument
        sql: "CALL p(1 + 2, UPPER('a'));"
    examples: []
