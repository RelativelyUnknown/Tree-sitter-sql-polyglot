dialect: hana
engine: SAP HANA Platform
version: "2.0 SPS 08 (2.0.08)"
source: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/3bc1a0d4611d40c4a6e3fc7c8e80395d.html?version=2.0.08

statements:
  - id: release_savepoint
    name: RELEASE SAVEPOINT
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/445eb4d2202f4f29b67e9874a3c9acfb.html?version=2.0.08
    tier: high
    probes:
      - id: basic
        sql: "RELEASE SAVEPOINT sp1;"

  - id: replace
    name: REPLACE
    doc: https://help.sap.com/docs/SAP_HANA_PLATFORM/4fe29514fd584807ac9f2a04f6754767/20fc06a7751910149892c0d09be21a38.html?version=2.0.08
    tier: high
    probes:
      - id: values
        sql: "REPLACE t VALUES (1, 'a');"
      - id: schema_qualified
        sql: "REPLACE s.t VALUES (1, 'a');"
      - id: database_schema_qualified
        sql: "REPLACE db.s.t VALUES (1, 'a');"
      - id: column_list
        sql: "REPLACE t (a, b) VALUES (1, 'a');"
      - id: values_where
        sql: "REPLACE t (a, b) VALUES (1, 'a') WHERE a = 1;"
      - id: values_with_primary_key
        sql: "REPLACE t (a, b) VALUES (1, 'a') WITH PRIMARY KEY;"
      - id: subquery
        sql: "REPLACE t SELECT a, b FROM u;"
      - id: column_list_subquery
        sql: "REPLACE t (a, b) SELECT a, b FROM u;"
