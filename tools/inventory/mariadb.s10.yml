dialect: mariadb
engine: MariaDB Server
version: "11.x (current)"
source: https://mariadb.com/docs/server/reference/sql-statements

statements:
  - id: drop_table
    name: DROP TABLE
    doc: https://mariadb.com/docs/server/reference/sql-statements/data-definition/drop/drop-table
    tier: high
    probes:
      - { id: basic, sql: "DROP TABLE t;" }
      - { id: temporary, sql: "DROP TEMPORARY TABLE t;" }
      - { id: if_exists, sql: "DROP TABLE IF EXISTS t;" }
      - { id: multiple_tables, sql: "DROP TABLE t1, t2;" }
      - { id: qualified_name, sql: "DROP TABLE db.t;" }
      - { id: wait, sql: "DROP TABLE t WAIT 5;" }
      - { id: nowait, sql: "DROP TABLE t NOWAIT;" }
      - { id: restrict, sql: "DROP TABLE t RESTRICT;" }
      - { id: cascade, sql: "DROP TABLE t CASCADE;" }
      - { id: temporary_if_exists_multi, sql: "DROP TEMPORARY TABLE IF EXISTS t1, t2;" }
      - { id: if_exists_wait_cascade, sql: "DROP TABLE IF EXISTS t1, t2 WAIT 10 CASCADE;" }
    examples:
      - "DROP TABLE Employees, Customers;"

  - id: rename_table
    name: RENAME TABLE
    doc: https://mariadb.com/docs/server/reference/sql-statements/data-definition/rename-table
    tier: high
    probes:
      - { id: basic, sql: "RENAME TABLE t TO t2;" }
      - { id: tables_keyword, sql: "RENAME TABLES t TO t2;" }
      - { id: if_exists, sql: "RENAME TABLE IF EXISTS t TO t2;" }
      - { id: multiple, sql: "RENAME TABLE t1 TO t2, t3 TO t4;" }
      - { id: move_between_databases, sql: "RENAME TABLE db1.t TO db2.t;" }
      - { id: wait, sql: "RENAME TABLE t WAIT 5 TO t2;" }
      - { id: nowait, sql: "RENAME TABLE t NOWAIT TO t2;" }
      - { id: if_exists_wait, sql: "RENAME TABLE IF EXISTS t WAIT 5 TO t2;" }
    examples:
      - "RENAME TABLE db1.t TO db2.t;"
      - "RENAME TABLE old_table TO backup_table, new_table TO old_table;"
      - "RENAME TABLE t1 TO tmp_table, t2 TO t1, tmp_table TO t2;"
