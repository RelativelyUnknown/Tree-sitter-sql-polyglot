    examples:
      - "CREATE TABLE TDEPT (DEPTNO CHAR (3) NOT NULL , DEPTNAME VARCHAR (36) NOT NULL , MGRNO CHAR (6), ADMRDEPT CHAR (3) NOT NULL , PRIMARY KEY (DEPTNO)) IN DEPARTX;"
