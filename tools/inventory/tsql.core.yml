  - id: alter_table
    name: "ALTER TABLE"
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/alter-table-transact-sql
    tier: high
    probes:
      - id: alter_column_type
        sql: "ALTER TABLE t ALTER COLUMN c DECIMAL(5, 2);"
      - id: alter_column_not_null
        sql: "ALTER TABLE t ALTER COLUMN c NVARCHAR(20) NOT NULL;"
      - id: alter_column_collate
        sql: "ALTER TABLE t ALTER COLUMN c VARCHAR(50) COLLATE Latin1_General_BIN;"
      - id: alter_column_max
        sql: "ALTER TABLE t ALTER COLUMN c VARCHAR(MAX) NULL;"
      - id: alter_column_xml_schema
        sql: "ALTER TABLE t ALTER COLUMN c XML(dbo.sc);"
      - id: alter_column_sparse
        sql: "ALTER TABLE t ALTER COLUMN c INT NULL SPARSE;"
      - id: alter_column_add_sparse
        sql: "ALTER TABLE t ALTER COLUMN c ADD SPARSE;"
      - id: alter_column_drop_sparse
        sql: "ALTER TABLE t ALTER COLUMN c DROP SPARSE;"
      - id: alter_column_add_rowguidcol
        sql: "ALTER TABLE t ALTER COLUMN g ADD ROWGUIDCOL;"
      - id: alter_column_drop_persisted
        sql: "ALTER TABLE t ALTER COLUMN c DROP PERSISTED;"
      - id: alter_column_add_not_for_replication
        sql: "ALTER TABLE t ALTER COLUMN id ADD NOT FOR REPLICATION;"
      - id: alter_column_add_hidden
        sql: "ALTER TABLE t ALTER COLUMN vf ADD HIDDEN;"
      - id: alter_column_add_masked
        sql: "ALTER TABLE t ALTER COLUMN c ADD MASKED WITH (FUNCTION = 'partial(2, \"XX\", 0)');"
      - id: alter_column_drop_masked
        sql: "ALTER TABLE t ALTER COLUMN c DROP MASKED;"
      - id: alter_column_online
        sql: "ALTER TABLE t ALTER COLUMN c DECIMAL(5, 2) WITH (ONLINE = ON);"
      - id: alter_column_encrypted
        sql: "ALTER TABLE t ALTER COLUMN c VARCHAR(50) ENCRYPTED WITH (COLUMN_ENCRYPTION_KEY = key1, ENCRYPTION_TYPE = RANDOMIZED, ALGORITHM = 'AEAD_AES_256_CBC_HMAC_SHA_256') NULL;"
      - id: add_column
        sql: "ALTER TABLE t ADD c VARCHAR(20) NULL;"
      - id: add_column_constraint
        sql: "ALTER TABLE t ADD c VARCHAR(20) NULL CONSTRAINT uq_c UNIQUE;"
      - id: add_multiple_columns
        sql: "ALTER TABLE t ADD b INT IDENTITY CONSTRAINT b_pk PRIMARY KEY, c INT NULL CONSTRAINT c_fk FOREIGN KEY REFERENCES t (a), e DECIMAL(3, 3) CONSTRAINT e_default DEFAULT .081;"
      - id: add_column_default_with_values
        sql: "ALTER TABLE t ADD d SMALLDATETIME NULL CONSTRAINT df_d DEFAULT GETDATE() WITH VALUES;"
      - id: add_computed_column
        sql: "ALTER TABLE t ADD total AS (price * qty) PERSISTED;"
      - id: add_column_set
        sql: "ALTER TABLE t ADD cs XML COLUMN_SET FOR ALL_SPARSE_COLUMNS;"
      - id: add_constraint_check_nocheck
        sql: "ALTER TABLE t WITH NOCHECK ADD CONSTRAINT ck_a CHECK (a > 1);"
      - id: add_constraint_default_for
        sql: "ALTER TABLE t ADD CONSTRAINT df_b DEFAULT 50 FOR b;"
      - id: add_constraint_primary_key_options
        sql: "ALTER TABLE t WITH NOCHECK ADD CONSTRAINT pk_t PRIMARY KEY CLUSTERED (id) WITH (FILLFACTOR = 75, ONLINE = ON, PAD_INDEX = ON);"
      - id: add_constraint_primary_key_resumable
        sql: "ALTER TABLE t ADD CONSTRAINT pk_t PRIMARY KEY CLUSTERED (a) WITH (ONLINE = ON, MAXDOP = 2, RESUMABLE = ON, MAX_DURATION = 240);"
      - id: add_constraint_foreign_key
        sql: "ALTER TABLE t ADD CONSTRAINT fk_t FOREIGN KEY (pid) REFERENCES p (id) ON DELETE CASCADE ON UPDATE CASCADE;"
      - id: add_period_for_system_time
        sql: "ALTER TABLE t ADD vf DATETIME2 GENERATED ALWAYS AS ROW START HIDDEN DEFAULT SYSUTCDATETIME() NOT NULL, vt DATETIME2 GENERATED ALWAYS AS ROW END HIDDEN DEFAULT CONVERT(DATETIME2, '9999-12-31 23:59:59.9999999') NOT NULL, PERIOD FOR SYSTEM_TIME (vf, vt);"
      - id: add_period_only
        sql: "ALTER TABLE t ADD PERIOD FOR SYSTEM_TIME (vf, vt);"
      - id: drop_column
        sql: "ALTER TABLE t DROP COLUMN c;"
      - id: drop_columns
        sql: "ALTER TABLE t DROP COLUMN c, d;"
      - id: drop_column_if_exists
        sql: "ALTER TABLE t DROP COLUMN IF EXISTS c;"
      - id: drop_constraint_implicit
        sql: "ALTER TABLE t DROP my_constraint;"
      - id: drop_constraint
        sql: "ALTER TABLE t DROP CONSTRAINT ck_a;"
      - id: drop_constraint_if_exists
        sql: "ALTER TABLE t DROP CONSTRAINT IF EXISTS ck_a;"
      - id: drop_constraints_and_column
        sql: "ALTER TABLE t DROP CONSTRAINT c1, CONSTRAINT c2, COLUMN d;"
      - id: drop_clustered_constraint_online
        sql: "ALTER TABLE t DROP CONSTRAINT pk_t WITH (ONLINE = ON, MAXDOP = 4);"
      - id: drop_clustered_constraint_move_to
        sql: "ALTER TABLE t DROP CONSTRAINT pk_t WITH (MOVE TO fg2);"
      - id: drop_period
        sql: "ALTER TABLE t DROP PERIOD FOR SYSTEM_TIME;"
      - id: nocheck_constraint
        sql: "ALTER TABLE t NOCHECK CONSTRAINT ck_a;"
      - id: check_constraint_all
        sql: "ALTER TABLE t WITH CHECK CHECK CONSTRAINT ALL;"
      - id: disable_trigger
        sql: "ALTER TABLE t DISABLE TRIGGER trig1;"
      - id: enable_trigger_all
        sql: "ALTER TABLE t ENABLE TRIGGER ALL;"
      - id: enable_change_tracking
        sql: "ALTER TABLE t ENABLE CHANGE_TRACKING WITH (TRACK_COLUMNS_UPDATED = ON);"
      - id: disable_change_tracking
        sql: "ALTER TABLE t DISABLE CHANGE_TRACKING;"
      - id: switch_partition
        sql: "ALTER TABLE t SWITCH PARTITION 2 TO u;"
      - id: switch_partition_to_partition
        sql: "ALTER TABLE t SWITCH PARTITION 2 TO u PARTITION 2 WITH (WAIT_AT_LOW_PRIORITY (MAX_DURATION = 1 MINUTES, ABORT_AFTER_WAIT = BLOCKERS));"
      - id: switch_table
        sql: "ALTER TABLE staging SWITCH TO t;"
      - id: set_filestream_on
        sql: "ALTER TABLE t SET (FILESTREAM_ON = \"NULL\");"
      - id: set_system_versioning_on
        sql: "ALTER TABLE t SET (SYSTEM_VERSIONING = ON (HISTORY_TABLE = dbo.t_history, DATA_CONSISTENCY_CHECK = ON, HISTORY_RETENTION_PERIOD = 1 YEAR));"
      - id: set_system_versioning_off
        sql: "ALTER TABLE t SET (SYSTEM_VERSIONING = OFF);"
      - id: set_data_deletion
        sql: "ALTER TABLE t SET (DATA_DELETION = ON (FILTER_COLUMN = d, RETENTION_PERIOD = 1 DAY));"
      - id: set_lock_escalation
        sql: "ALTER TABLE t SET (LOCK_ESCALATION = AUTO);"
      - id: rebuild
        sql: "ALTER TABLE t REBUILD WITH (DATA_COMPRESSION = PAGE);"
      - id: rebuild_partition
        sql: "ALTER TABLE t REBUILD PARTITION = 1 WITH (DATA_COMPRESSION = COLUMNSTORE_ARCHIVE);"
      - id: rebuild_partition_all
        sql: "ALTER TABLE t REBUILD PARTITION = ALL WITH (DATA_COMPRESSION = PAGE ON PARTITIONS (1));"
      - id: rebuild_online_low_priority
        sql: "ALTER TABLE t REBUILD WITH (PAD_INDEX = ON, ONLINE = ON (WAIT_AT_LOW_PRIORITY (MAX_DURATION = 4 MINUTES, ABORT_AFTER_WAIT = BLOCKERS)));"
      - id: filetable_namespace
        sql: "ALTER TABLE ft DISABLE FILETABLE_NAMESPACE;"
      - id: filetable_directory
        sql: "ALTER TABLE ft SET (FILETABLE_DIRECTORY = 'docs2');"
      - id: remote_data_archive
        sql: "ALTER TABLE t SET (REMOTE_DATA_ARCHIVE (MIGRATION_STATE = INBOUND));"
      - id: memory_optimized_add_index
        sql: "ALTER TABLE t ADD INDEX ix_hash HASH (c) WITH (BUCKET_COUNT = 1024);"
      - id: memory_optimized_alter_index
        sql: "ALTER TABLE t ALTER INDEX ix_hash REBUILD WITH (BUCKET_COUNT = 2048);"
      - id: memory_optimized_drop_index
        sql: "ALTER TABLE t DROP INDEX IF EXISTS ix_hash;"
    examples:
      - |-
        ALTER TABLE dbo.doc_exe

            -- Add a PRIMARY KEY identity column.
            ADD column_b INT IDENTITY
                CONSTRAINT column_b_pk PRIMARY KEY,

            -- Add a column that references another column in the same table.
                column_c INT NULL
                    CONSTRAINT column_c_fk FOREIGN KEY REFERENCES doc_exe (column_a),

            -- Add a column with a constraint to enforce that
            -- nonnull data is in a valid telephone number format.
                column_d VARCHAR (16) NULL
                    CONSTRAINT column_d_chk CHECK (column_d LIKE '[0-9][0-9][0-9]-[0-9][0-9][0-9][0-9]'
                                               OR column_d LIKE '([0-9][0-9][0-9]) [0-9][0-9][0-9]-[0-9][0-9][0-9][0-9]'),

            -- Add a nonnull column with a default.
                column_e DECIMAL (3, 3)
                    CONSTRAINT column_e_default DEFAULT .081;
      - |-
        ALTER TABLE Production.TransactionHistoryArchive WITH NOCHECK
            ADD CONSTRAINT PK_TransactionHistoryArchive_TransactionID
                PRIMARY KEY CLUSTERED (TransactionID) WITH (FILLFACTOR = 75, ONLINE = ON, PAD_INDEX = ON);
      - |-
        ALTER TABLE table1
        ADD CONSTRAINT PK_Constrain PRIMARY KEY CLUSTERED (a)
        WITH (ONLINE = ON, MAXDOP = 2, RESUMABLE = ON, MAX_DURATION = 240);
      - |-
        ALTER TABLE T1 REBUILD WITH (
            PAD_INDEX = ON,
            ONLINE = ON (
                WAIT_AT_LOW_PRIORITY (MAX_DURATION = 4 MINUTES, ABORT_AFTER_WAIT = BLOCKERS)
            )
        );
      - |-
        --Alter non-temporal table to define periods for system versioning
        ALTER TABLE InsurancePolicy
            ADD ValidFrom DATETIME2 GENERATED ALWAYS AS ROW START HIDDEN
                    DEFAULT SYSUTCDATETIME() NOT NULL,
                ValidTo DATETIME2 GENERATED ALWAYS AS ROW END HIDDEN
                    DEFAULT CONVERT (DATETIME2, '9999-12-31 23:59:59.99999999') NOT NULL,
                PERIOD FOR SYSTEM_TIME (ValidFrom, ValidTo);

