dialect: flink
engine: Apache Flink SQL
version: "2.3"
source: https://nightlies.apache.org/flink/flink-docs-release-2.3/docs/sql/reference/

statements:
  - id: drop_table
    name: DROP TABLE
    doc: https://nightlies.apache.org/flink/flink-docs-release-2.3/docs/sql/reference/ddl/drop/#drop-table
    tier: high
    probes:
      - id: basic
        sql: "DROP TABLE t;"
      - id: if_exists
        sql: "DROP TABLE IF EXISTS t;"
      - id: temporary
        sql: "DROP TEMPORARY TABLE t;"
      - id: temporary_if_exists
        sql: "DROP TEMPORARY TABLE IF EXISTS t;"
      - id: db_qualified
        sql: "DROP TABLE db.t;"
      - id: catalog_qualified
        sql: "DROP TABLE IF EXISTS cat.db.t;"
    examples:
      - "DROP TABLE Orders;"

  - id: drop_materialized_table
    name: DROP MATERIALIZED TABLE
    doc: https://nightlies.apache.org/flink/flink-docs-release-2.3/docs/sql/materialized-table/statements/#drop-materialized-table
    tier: high
    probes:
      - id: basic
        sql: "DROP MATERIALIZED TABLE t;"
      - id: if_exists
        sql: "DROP MATERIALIZED TABLE IF EXISTS t;"
      - id: db_qualified
        sql: "DROP MATERIALIZED TABLE db.t;"
      - id: catalog_qualified
        sql: "DROP MATERIALIZED TABLE IF EXISTS cat.db.t;"
    examples:
      - "DROP MATERIALIZED TABLE IF EXISTS my_materialized_table;"
