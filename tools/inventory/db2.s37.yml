dialect: db2
engine: IBM Db2 for Linux, UNIX and Windows
version: "11.5"
source: https://www.ibm.com/docs/en/db2/11.5.x?topic=reference-statements

statements:
  - id: create_workload
    name: CREATE WORKLOAD
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-create-workload
    tier: low
    probes:
      - id: basic
        sql: "CREATE WORKLOAD wl APPLNAME ('app1');"
      - id: system_user
        sql: "CREATE WORKLOAD wl SYSTEM_USER ('user1', 'user2') ENABLE;"
      - id: session_user_group
        sql: "CREATE WORKLOAD wl SESSION_USER GROUP ('grp1') DISALLOW DB ACCESS;"
      - id: current_client_userid
        sql: "CREATE WORKLOAD wl CURRENT CLIENT_USERID ('u1') SERVICE CLASS sc UNDER sup POSITION LAST;"
      - id: position_before
        sql: "CREATE WORKLOAD wl ADDRESS ('9.1.1.1') POSITION BEFORE other_wl;"
      - id: collect_options
        sql: "CREATE WORKLOAD wl APPLNAME ('app1') COLLECT ACTIVITY DATA ON ALL MEMBERS WITH DETAILS, SECTION COLLECT LOCK WAIT DATA FOR LOCKS WAITING MORE THAN 5 SECONDS WITHOUT HISTORY;"
      - id: maximum_degree
        sql: "CREATE WORKLOAD wl APPLNAME ('app1') MAXIMUM DEGREE 4 ACTIVITY LIFETIME HISTOGRAM TEMPLATE SYSDEFAULTHISTOGRAM;"
  - id: create_wrapper
    name: CREATE WRAPPER
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-create-wrapper
    tier: low
    probes:
      - id: predefined
        sql: "CREATE WRAPPER NET8;"
      - id: library_options
        sql: "CREATE WRAPPER odbc LIBRARY 'db2rcodbc.so' OPTIONS (MODULE '/usr/lib/odbc.so');"
  - id: end_declare_section
    name: END DECLARE SECTION
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-end-declare-section
    tier: low
    status: not-sql
    reason: "Embedded-SQL host declaration construct, valid only inside a host-language precompiler program."
  - id: include
    name: INCLUDE
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-include
    tier: low
    status: not-sql
    reason: "Embedded-SQL precompiler directive (INCLUDE SQLCA/SQLDA/name) for host-language programs; not executable SQL."
  - id: flush_bufferpools
    name: FLUSH BUFFERPOOLS
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-flush-bufferpools
    tier: low
    probes:
      - id: all
        sql: "FLUSH BUFFERPOOLS ALL;"
      - id: singular
        sql: "FLUSH BUFFERPOOL ALL;"
  - id: flush_event_monitor
    name: FLUSH EVENT MONITOR
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-flush-event-monitor
    tier: low
    probes:
      - id: basic
        sql: "FLUSH EVENT MONITOR em;"
      - id: buffer
        sql: "FLUSH EVENT MONITOR em BUFFER;"
  - id: flush_federated_cache
    name: FLUSH FEDERATED CACHE
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-flush-federated-cache
    tier: low
    probes:
      - id: all
        sql: "FLUSH FEDERATED CACHE FOR ALL;"
      - id: remote_object
        sql: "FLUSH FEDERATED CACHE FOR ds.sch.t;"
      - id: schema
        sql: "FLUSH FEDERATED CACHE FOR ds.sch.*;"
      - id: server
        sql: "FLUSH FEDERATED CACHE FOR SERVER ds;"
  - id: flush_optimization_profile_cache
    name: FLUSH OPTIMIZATION PROFILE CACHE
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-flush-optimization-profile-cache
    tier: low
    probes:
      - id: all
        sql: "FLUSH OPTIMIZATION PROFILE CACHE ALL;"
      - id: named
        sql: "FLUSH OPTIMIZATION PROFILE CACHE s.prof;"
  - id: flush_package_cache
    name: FLUSH PACKAGE CACHE
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-flush-package-cache
    tier: low
    probes:
      - id: dynamic
        sql: "FLUSH PACKAGE CACHE DYNAMIC;"
      - id: executable_id
        sql: "FLUSH PACKAGE CACHE DYNAMIC FOR EXECUTABLE ID x'0100000000000000010000000000000000000000020020150101000000000000';"
      - id: hard_invalidation
        sql: "FLUSH PACKAGE CACHE DYNAMIC FOR EXECUTABLE ID x'0100000000000000010000000000000000000000020020150101000000000000' USING HARD INVALIDATION;"
  - id: flush_authentication_cache
    name: FLUSH AUTHENTICATION CACHE
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-flush-authentication-cache
    tier: low
    probes:
      - id: basic
        sql: "FLUSH AUTHENTICATION CACHE FOR ALL;"
  - id: grant_exemption
    name: GRANT (exemption)
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-grant-exemption
    tier: low
    probes:
      - id: rule
        sql: "GRANT EXEMPTION ON RULE DB2LBACREADARRAY FOR pol TO USER u;"
      - id: write_down
        sql: "GRANT EXEMPTION ON RULE DB2LBACWRITEARRAY WRITEDOWN FOR pol TO GROUP g, ROLE r;"
      - id: all
        sql: "GRANT EXEMPTION ON RULE ALL FOR pol TO u;"
  - id: grant_global_variable_privileges
    name: GRANT (global variable privileges)
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-grant-global-variable-privileges
    tier: low
    probes:
      - id: all
        sql: "GRANT ALL PRIVILEGES ON VARIABLE gv TO USER u WITH GRANT OPTION;"
      - id: read_write
        sql: "GRANT READ, WRITE ON VARIABLE gv TO PUBLIC;"
  - id: revoke_global_variable_privileges
    name: REVOKE (global variable privileges)
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-revoke-global-variable-privileges
    tier: low
    probes:
      - id: all
        sql: "REVOKE ALL PRIVILEGES ON VARIABLE gv FROM USER u BY ALL RESTRICT;"
      - id: read_write
        sql: "REVOKE READ, WRITE ON VARIABLE gv FROM PUBLIC;"
  - id: grant_index_privileges
    name: GRANT (index privileges)
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-grant-index-privileges
    tier: low
    probes:
      - id: control
        sql: "GRANT CONTROL ON INDEX idx TO USER u, GROUP g, ROLE r;"
  - id: revoke_index_privileges
    name: REVOKE (index privileges)
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-revoke-index-privileges
    tier: low
    probes:
      - id: control
        sql: "REVOKE CONTROL ON INDEX idx FROM USER u BY ALL;"
  - id: grant_module_privileges
    name: GRANT (module privileges)
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-grant-module-privileges
    tier: low
    probes:
      - id: execute
        sql: "GRANT EXECUTE ON MODULE m TO ROLE r WITH GRANT OPTION;"
  - id: revoke_module_privileges
    name: REVOKE (module privileges)
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-revoke-module-privileges
    tier: low
    probes:
      - id: execute
        sql: "REVOKE EXECUTE ON MODULE m FROM ROLE r BY ALL;"
  - id: grant_package_privileges
    name: GRANT (package privileges)
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-grant-package-privileges
    tier: low
    probes:
      - id: privs
        sql: "GRANT BIND, CONTROL, EXECUTE ON PACKAGE p TO USER u WITH GRANT OPTION;"
      - id: run_program
        sql: "GRANT RUN ON PROGRAM p TO PUBLIC;"
  - id: revoke_package_privileges
    name: REVOKE (package privileges)
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-revoke-package-privileges
    tier: low
    probes:
      - id: privs
        sql: "REVOKE BIND, CONTROL, EXECUTE ON PACKAGE p FROM USER u BY ALL;"
      - id: run_program
        sql: "REVOKE RUN ON PROGRAM p FROM PUBLIC;"
  - id: grant_security_label
    name: GRANT (security label)
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-grant-security-label
    tier: low
    probes:
      - id: all_access
        sql: "GRANT SECURITY LABEL pol.lbl TO USER u FOR ALL ACCESS;"
      - id: read_access
        sql: "GRANT SECURITY LABEL pol.lbl TO GROUP g FOR READ ACCESS;"
      - id: write_access
        sql: "GRANT SECURITY LABEL pol.lbl TO ROLE r FOR WRITE ACCESS;"
  - id: revoke_security_label
    name: REVOKE (security label)
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-revoke-security-label
    tier: low
    probes:
      - id: all_access
        sql: "REVOKE SECURITY LABEL pol.lbl FROM USER u;"
  - id: grant_server_privileges
    name: GRANT (server privileges)
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-grant-server-privileges
    tier: low
    probes:
      - id: passthru
        sql: "GRANT PASSTHRU ON SERVER srv TO USER u, GROUP g;"
      - id: public
        sql: "GRANT PASSTHRU ON SERVER srv TO PUBLIC;"
  - id: revoke_server_privileges
    name: REVOKE (server privileges)
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-revoke-server-privileges
    tier: low
    probes:
      - id: passthru
        sql: "REVOKE PASSTHRU ON SERVER srv FROM USER u BY ALL;"
      - id: public
        sql: "REVOKE PASSTHRU ON SERVER srv FROM PUBLIC;"
  - id: grant_setsessionuser_privilege
    name: GRANT (SETSESSIONUSER privilege)
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-grant-setsessionuser-privilege
    tier: low
    probes:
      - id: user
        sql: "GRANT SETSESSIONUSER ON USER u1, USER u2 TO USER u3, GROUP g;"
      - id: public
        sql: "GRANT SETSESSIONUSER ON PUBLIC TO USER u;"
  - id: revoke_setsessionuser_privilege
    name: REVOKE (SETSESSIONUSER privilege)
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-revoke-setsessionuser-privilege
    tier: low
    probes:
      - id: user
        sql: "REVOKE SETSESSIONUSER ON USER u1, USER u2 FROM USER u3, GROUP g;"
      - id: public
        sql: "REVOKE SETSESSIONUSER ON PUBLIC FROM USER u;"
  - id: grant_table_space_privileges
    name: GRANT (table space privileges)
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-grant-table-space-privileges
    tier: low
    probes:
      - id: use
        sql: "GRANT USE OF TABLESPACE ts TO USER u WITH GRANT OPTION;"
  - id: revoke_table_space_privileges
    name: REVOKE (table space privileges)
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-revoke-table-space-privileges
    tier: low
    probes:
      - id: use
        sql: "REVOKE USE OF TABLESPACE ts FROM USER u BY ALL;"
  - id: grant_workload_privileges
    name: GRANT (workload privileges)
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-grant-workload-privileges
    tier: low
    probes:
      - id: usage
        sql: "GRANT USAGE ON WORKLOAD wl TO USER u, ROLE r;"
      - id: public
        sql: "GRANT USAGE ON WORKLOAD wl TO PUBLIC;"
  - id: revoke_workload_privileges
    name: REVOKE (workload privileges)
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-revoke-workload-privileges
    tier: low
    probes:
      - id: usage
        sql: "REVOKE USAGE ON WORKLOAD wl FROM USER u BY ALL;"
      - id: public
        sql: "REVOKE USAGE ON WORKLOAD wl FROM PUBLIC;"
  - id: grant_xsr_object_privileges
    name: GRANT (XSR object privileges)
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-grant-xsr-object-privileges
    tier: low
    probes:
      - id: usage
        sql: "GRANT USAGE ON XSROBJECT xo TO PUBLIC;"
  - id: revoke_xsr_object_privileges
    name: REVOKE (XSR object privileges)
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-revoke-xsr-object-privileges
    tier: low
    probes:
      - id: usage
        sql: "REVOKE USAGE ON XSROBJECT xo FROM PUBLIC BY ALL;"
  - id: revoke_exemption
    name: REVOKE (exemption)
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-revoke-exemption
    tier: low
    probes:
      - id: rule
        sql: "REVOKE EXEMPTION ON RULE DB2LBACREADARRAY FOR pol FROM USER u;"
      - id: write_up
        sql: "REVOKE EXEMPTION ON RULE DB2LBACWRITEARRAY WRITEUP FOR pol FROM GROUP g, ROLE r;"
      - id: all
        sql: "REVOKE EXEMPTION ON RULE ALL FOR pol FROM u;"
  - id: rename_stogroup
    name: RENAME STOGROUP
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-rename-stogroup
    tier: low
    probes:
      - id: basic
        sql: "RENAME STOGROUP sg1 TO sg2;"
  - id: rename_tablespace
    name: RENAME TABLESPACE
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-rename-tablespace
    tier: low
    probes:
      - id: basic
        sql: "RENAME TABLESPACE ts1 TO ts2;"
  - id: set_compilation_environment
    name: SET COMPILATION ENVIRONMENT
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-set-compilation-environment
    tier: low
    probes:
      - id: host_var
        sql: "SET COMPILATION ENVIRONMENT = :hv;"
  - id: set_current_decfloat_rounding_mode
    name: SET CURRENT DECFLOAT ROUNDING MODE
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-set-current-decfloat-rounding-mode
    tier: low
    probes:
      - id: keyword
        sql: "SET CURRENT DECFLOAT ROUNDING MODE = ROUND_HALF_EVEN;"
      - id: string
        sql: "SET CURRENT DECFLOAT ROUNDING MODE = 'ROUND_DOWN';"
      - id: host_var
        sql: "SET CURRENT DECFLOAT ROUNDING MODE = :hv;"
  - id: set_current_default_transform_group
    name: SET CURRENT DEFAULT TRANSFORM GROUP
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-set-current-default-transform-group
    tier: low
    probes:
      - id: basic
        sql: "SET CURRENT DEFAULT TRANSFORM GROUP = grp;"
  - id: set_current_explain_mode
    name: SET CURRENT EXPLAIN MODE
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-set-current-explain-mode
    tier: low
    probes:
      - id: mode_no
        sql: "SET CURRENT EXPLAIN MODE = NO;"
      - id: mode_yes
        sql: "SET CURRENT EXPLAIN MODE YES;"
      - id: explain
        sql: "SET CURRENT EXPLAIN MODE = EXPLAIN;"
      - id: reopt
        sql: "SET CURRENT EXPLAIN MODE = REOPT;"
      - id: recommend_indexes
        sql: "SET CURRENT EXPLAIN MODE = RECOMMEND INDEXES;"
      - id: evaluate_partitionings
        sql: "SET CURRENT EXPLAIN MODE = EVALUATE PARTITIONINGS;"
      - id: host_var
        sql: "SET CURRENT EXPLAIN MODE = :hv;"
  - id: set_current_explain_snapshot
    name: SET CURRENT EXPLAIN SNAPSHOT
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-set-current-explain-snapshot
    tier: low
    probes:
      - id: mode_no
        sql: "SET CURRENT EXPLAIN SNAPSHOT = NO;"
      - id: mode_yes
        sql: "SET CURRENT EXPLAIN SNAPSHOT YES;"
      - id: explain
        sql: "SET CURRENT EXPLAIN SNAPSHOT = EXPLAIN;"
      - id: reopt
        sql: "SET CURRENT EXPLAIN SNAPSHOT = REOPT;"
      - id: host_var
        sql: "SET CURRENT EXPLAIN SNAPSHOT = :hv;"
