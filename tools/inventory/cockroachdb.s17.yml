dialect: cockroachdb
engine: CockroachDB
version: "v26.3 (stable)"
source: https://www.cockroachlabs.com/docs/stable/sql-statements

statements:
  - id: rollback
    name: ROLLBACK
    doc: https://www.cockroachlabs.com/docs/stable/rollback-transaction
    tier: high
    probes:
      - { id: basic, sql: "ROLLBACK;" }
      - { id: abort, sql: "ABORT;" }
      - { id: transaction, sql: "ROLLBACK TRANSACTION;" }
      - { id: to_savepoint_restart, sql: "ROLLBACK TO SAVEPOINT cockroach_restart;" }
      - { id: to_savepoint_name, sql: "ROLLBACK TO SAVEPOINT s;" }
      - { id: to_name, sql: "ROLLBACK TO s;" }
    examples:
      - "BEGIN;"
      - "ROLLBACK;"
      - "ROLLBACK TO SAVEPOINT cockroach_restart;"

  - id: set_transaction
    name: SET TRANSACTION
    doc: https://www.cockroachlabs.com/docs/stable/set-transaction
    tier: high
    probes:
      - { id: priority_low, sql: "SET TRANSACTION PRIORITY LOW;" }
      - { id: priority_normal, sql: "SET TRANSACTION PRIORITY NORMAL;" }
      - { id: priority_high, sql: "SET TRANSACTION PRIORITY HIGH;" }
      - { id: read_only, sql: "SET TRANSACTION READ ONLY;" }
      - { id: read_write, sql: "SET TRANSACTION READ WRITE;" }
      - { id: as_of_system_time, sql: "SET TRANSACTION AS OF SYSTEM TIME '2019-04-09 18:02:52.0+00:00';" }
      - { id: not_deferrable, sql: "SET TRANSACTION NOT DEFERRABLE;" }
      - { id: deferrable, sql: "SET TRANSACTION DEFERRABLE;" }
      - { id: isolation_serializable, sql: "SET TRANSACTION ISOLATION LEVEL SERIALIZABLE;" }
      - { id: isolation_read_committed, sql: "SET TRANSACTION ISOLATION LEVEL READ COMMITTED;" }
      - { id: multiple_modes, sql: "SET TRANSACTION PRIORITY HIGH, READ ONLY;" }
    examples:
      - "SET TRANSACTION ISOLATION LEVEL READ COMMITTED;"
      - "SET TRANSACTION PRIORITY HIGH;"
      - "SET TRANSACTION AS OF SYSTEM TIME '2019-04-09 18:02:52.0+00:00';"
