name: Build/test
on:
  push:
    branches:
      - "main"
      - "release/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - 'main'
      - 'release/**'

# Cancel superseded runs of the same PR/branch; a new push obsoletes the
# previous run, so don't pay for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Corpus tests, sharded by dialect group ──────────────────────────────────
  # Corpus tests are OS-independent, so this runs on ubuntu only. Shards run
  # in parallel, each generating and testing only its own dialects; a dialect
  # stays in its parent's shard (spark→hive, databricks→spark, mariadb→mysql,
  # athena→trino).
  #
  # generate.js hash-caches per grammar, including ancestor-chain files, so a
  # postgres-only change only regenerates postgres. ~/.cache/tree-sitter
  # caches compiled test libraries so `tree-sitter test` skips unchanged ones.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Running all 5 shards at once exceeds this account's concurrent-runner
      # capacity and gets one reclaimed mid-generate.
      max-parallel: 2
      matrix:
        include:
          - shard: base
            dialects: ""
          - shard: hive-chain
            dialects: "hive spark databricks oracle db2 hana"
          - shard: pg-mysql
            dialects: "postgres mysql mariadb sqlite duckdb cockroachdb"
          - shard: warehouse
            dialects: "snowflake bigquery spanner tsql flink"
          # ClickHouse alone can exceed the runner's memory ceiling during
          # generate (see tools/coverage-probes.yml); isolated so nothing
          # else competes for the budget.
          - shard: clickhouse
            dialects: "clickhouse"
          - shard: trino-chain
            dialects: "trino athena redshift teradata"
    steps:
      - uses: actions/checkout@v4
      - uses: tree-sitter/setup-action@v2
        with:
          install-lib: false
          tree-sitter-ref: v0.26.3

      - uses: actions/cache@v4
        with:
          path: |
            src/parser.c
            src/node-types.json
            src/grammar.json
            src/tree_sitter/
            */src/parser.c
            */src/node-types.json
            */src/grammar.json
            */src/tree_sitter/
            .grammar-cache/
            ~/.cache/tree-sitter/
          # Bumped v2 -> v3: some v2 entries had a hash marker newer than the
          # parser.c it described, so generate.js skipped regeneration and
          # served a stale parser.c (surfaced as coverage regressions once the
          # coverage job reused those artifacts).
          key: parsers-v3-${{ matrix.shard }}-${{ hashFiles('grammar.js', 'grammar/**', '*/grammar.js', '*/grammar/**') }}
          restore-keys: |
            parsers-v3-${{ matrix.shard }}-

      # ClickHouse's generate step can peak near the runner's memory limit;
      # swap gives it headroom instead of an OOM kill ("the runner has
      # received a shutdown signal").
      - name: Increase swap (ClickHouse generate is memory-bound)
        if: matrix.shard == 'clickhouse'
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Generate parsers
        # GENERATE_CONCURRENCY=1: two heavy grammars generating at once can
        # OOM the runner ("the runner has received a shutdown signal").
        env:
          GENERATE_CONCURRENCY: 1
        run: |
          if [ -z "${{ matrix.dialects }}" ]; then
            node scripts/generate.js
          else
            node scripts/generate-all.js ${{ matrix.dialects }}
          fi

      # Lets the coverage job reuse these parsers instead of regenerating all
      # 22 from scratch. Built with the same tree-sitter-cli pin coverage.py
      # uses, so they're ABI-compatible.
      - name: Upload parsers for coverage reuse
        uses: actions/upload-artifact@v4
        with:
          name: parsers-${{ matrix.shard }}
          # upload-artifact@v4 excludes dot-prefixed paths by default, which
          # would drop .grammar-cache/'s hash markers.
          include-hidden-files: true
          path: |
            src/parser.c
            src/*.json
            src/tree_sitter/
            */src/parser.c
            */src/*.json
            */src/tree_sitter/
            .grammar-cache/
          retention-days: 1
          if-no-files-found: warn

      # Rust build cache for the base parser-test-action (cargo test of the
      # Rust binding is the slowest part of the base shard).
      - uses: Swatinem/rust-cache@v2
        if: matrix.shard == 'base'

      - name: Run tests (base SQL)
        if: matrix.shard == 'base'
        uses: tree-sitter/parser-test-action@v3
        with:
          test-rust: true
          test-node: false
          test-python: true
          # generate: true (the default) would regenerate every grammar.js in
          # the checkout, not just base; base is already generated above.
          generate: false
          # --grammar-path implies --rebuild, which compiles every grammar
          # tree-sitter.json declares, not just the one selected; that needs
          # all 22 dialects' parser.c, which this shard never generates.
          # Scope tree-sitter.json itself to base for this run instead.
          test-parser-cmd: |
            jq '.grammars |= map(select(.path == "."))' tree-sitter.json > /tmp/tree-sitter.json
            cp /tmp/tree-sitter.json tree-sitter.json
            tree-sitter test --grammar-path .
            git checkout -- tree-sitter.json

      - name: Keyword/highlights sync check
        if: matrix.shard == 'base'
        run: scripts/test-keywords.sh

      - name: Run dialect corpus tests
        if: matrix.dialects != ''
        run: |
          for d in ${{ matrix.dialects }}; do
            echo "::group::tree-sitter test ($d)"
            (cd "$d" && tree-sitter test)
            echo "::endgroup::"
          done

  # ── Corroborated feature coverage ───────────────────────────────────────────
  # tools/coverage.py parses every probe in tools/coverage-probes.yml against
  # our parsers and independent reference parsers (SQLGlot, ANTLR grammars-v4,
  # pglast, sqlfluff), scoring against ISO Core. Fails on regressions, new
  # "suspect" probes, or ANSI purity violations. Baseline: tools/coverage.json.
  coverage:
    # Runs after the test matrix, not alongside it: both regenerating in
    # parallel exceeds this account's concurrent-runner capacity.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: tree-sitter/setup-action@v2
        with:
          install-lib: false
          tree-sitter-ref: v0.26.3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Caches only the ANTLR reference-parser build. Deliberately NOT caching
      # ~/.cache/tree-sitter/: tree-sitter reuses a compiled parser .so based
      # on source mtime, and a downloaded (not regenerated) parser.c has an
      # older mtime than a stale cached .so would, which would silently parse
      # with outdated features. Compiling parser.c fresh is cheap, so always
      # do that instead (see "Force fresh parser compilation" below).
      - uses: actions/cache@v4
        with:
          path: |
            tools/antlr/build/
            tools/antlr/*.jar
          key: coverage-deps-v2-${{ hashFiles('tools/antlr/setup.sh') }}
          restore-keys: |
            coverage-deps-v2-

      # Reuses parsers the test matrix already built. merge-multiple
      # reconstructs root src/ and every <dialect>/src/, plus the
      # .grammar-cache/*.hash markers, so generate:all below is a no-op.
      - name: Download parsers from test matrix
        uses: actions/download-artifact@v4
        with:
          pattern: parsers-*
          merge-multiple: true

      # Safety net for generate:all below: if an artifact failed to transport
      # and clickhouse needs a from-scratch regen, this avoids an OOM.
      - name: Increase swap (safety net for a clickhouse fallback regen)
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Generate all parsers (no-op when artifacts restored; safety net)
        # No-ops when every parser transported cleanly; regenerates only what
        # a failed artifact upload is missing.
        env:
          GENERATE_CONCURRENCY: 1
        run: npm run generate:all

      # Forces a recompile so coverage.py never parses with a stale cached
      # .so (see the cache step above).
      - name: Force fresh parser compilation
        run: |
          rm -rf ~/.cache/tree-sitter
          # only touch files that already exist; never create an empty scanner.c
          find . -type f \( -name parser.c -o -name scanner.c -o -name scanner.cc \) \
            -path '*src/*' -exec touch {} +

      # Log per-grammar parser size (src/parser.c bytes), STATE_COUNT /
      # LARGE_STATE_COUNT and declared-conflict count, ranked, so GLR
      # table growth is visible in every run without regenerating.
      - name: Log grammar/parser sizes
        run: python tools/glr_scan.py --no-generate --no-stress

      - name: Install corroborators
        run: |
          pip install -r tools/requirements.txt
          bash tools/antlr/setup.sh

      # No TREE_SITTER_BIN override: must stay pinned to the CLI version
      # generate.js used, or an ABI mismatch produces false regressions.
      - name: Coverage gate (regressions / suspects / purity)
        run: python tools/coverage.py --check

      # Full run for the human-readable report + job summary. Runs even if the
      # gate failed, so a red PR still gets a diagnosable report.
      - name: Build coverage report
        if: always()
        run: python tools/coverage.py

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            docs/coverage.md
            tools/coverage.json
          retention-days: 30

  # ── Node native binding (OS matrix) ─────────────────────────────────────────
  # node-gyp compiles parser.c to a native .node addon. The result is
  # platform-specific, so this job stays as a 3-OS matrix.
  test_node:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # npm ci runs the install hook: inflate-parsers.js decompresses the
      # committed .br blobs, then node-gyp-build compiles the native addons.
      - run: npm ci
      - run: node --test bindings/node/*_test.js

  # ── Go native binding (OS matrix) ────────────────────────────────────────────
  # cgo compiles each dialect's parser.c/scanner.c into its own subpackage.
  test_go:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # cgo needs the real parser.c/scanner.c on disk; inflate the committed
      # .br blobs the same way test_node does.
      - run: node scripts/inflate-parsers.js
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: go.sum
      - run: go build ./bindings/go/...
      - run: go test ./bindings/go/...

  # ── Swift native binding (macOS only) ───────────────────────────────────────
  test_swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Package.swift's targets compile parser.c/scanner.c directly; inflate
      # the committed .br blobs first, same as test_node/test_go.
      - run: node scripts/inflate-parsers.js
      - run: swift build --build-tests
      - run: swift test --skip-build -q

  # ── Validate corpus file integrity ──────────────────────────────────────────
  validate_tests:
    runs-on: ["ubuntu-latest"]
    strategy:
      fail-fast: true
    steps:
      - uses: actions/checkout@v4
      - run: |
          STATUS=0
          # Match tree-sitter error NODES in expected parse trees (the S-expression
          # forms "(ERROR", "(MISSING", "(UNEXPECTED") rather than the bare words,
          # which legitimately appear in valid SQL (e.g. EXCEPTION WHEN ERROR THEN,
          # ERROR_MESSAGE(), RAISERROR(...)). errors.txt holds intentional error tests.
          for dir in test spark/test databricks/test postgres/test mysql/test snowflake/test mariadb/test sqlite/test hive/test oracle/test db2/test duckdb/test trino/test athena/test redshift/test bigquery/test tsql/test clickhouse/test flink/test cockroachdb/test spanner/test teradata/test hana/test; do
            if [[ $(grep -rnE --exclude=errors.txt '\(ERROR' "$dir/" 2>/dev/null | wc -l) -gt 0 ]]; then
                echo "Found 'ERROR' in $dir: "
                grep -rnE --exclude=errors.txt '\(ERROR' "$dir/" | cut -f1,2 -d:
                STATUS=1
            fi
            if [[ $(grep -rnE --exclude=errors.txt '\(MISSING' "$dir/" 2>/dev/null | wc -l) -gt 0 ]]; then
                echo "Found 'MISSING' in $dir: "
                grep -rnE --exclude=errors.txt '\(MISSING' "$dir/" | cut -f1,2 -d:
                STATUS=1
            fi
            if [[ $(grep -rnE --exclude=errors.txt '\(UNEXPECTED' "$dir/" 2>/dev/null | wc -l) -gt 0 ]]; then
                echo "Found 'UNEXPECTED' in $dir: "
                grep -rnE --exclude=errors.txt '\(UNEXPECTED' "$dir/" | cut -f1,2 -d:
                STATUS=1
            fi
          done
          exit $STATUS
