dialect: db2
engine: IBM Db2 for Linux, UNIX and Windows
version: "11.5"
source: https://www.ibm.com/docs/en/db2/11.5.x?topic=reference-statements

statements:
  - id: loop
    name: LOOP
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-loop
    tier: high
    probes:
      - id: unlabeled
        sql: |-
          CREATE PROCEDURE p()
          LANGUAGE SQL
          BEGIN
            DECLARE i INTEGER DEFAULT 0;
            LOOP
              SET i = i + 1;
            END LOOP;
          END;
      - id: labeled
        sql: |-
          CREATE PROCEDURE p()
          LANGUAGE SQL
          BEGIN
            DECLARE i INTEGER DEFAULT 0;
            lbl: LOOP
              SET i = i + 1;
              IF i > 10 THEN LEAVE lbl; END IF;
            END LOOP lbl;
          END;
      - id: multiple_statements
        sql: |-
          CREATE PROCEDURE p()
          LANGUAGE SQL
          BEGIN
            DECLARE i INTEGER DEFAULT 0;
            lbl: LOOP
              SET i = i + 1;
              IF i < 5 THEN ITERATE lbl; END IF;
              INSERT INTO t VALUES (i);
              LEAVE lbl;
            END LOOP lbl;
          END;
      - id: in_inlined_compound
        sql: |-
          BEGIN ATOMIC
            DECLARE i INTEGER DEFAULT 0;
            lbl: LOOP
              SET i = i + 1;
              LEAVE lbl;
            END LOOP lbl;
          END;
    examples:
      - |-
        CREATE PROCEDURE LOOP_UNTIL_SPACE(OUT counter INTEGER)
        LANGUAGE SQL
        BEGIN
          DECLARE v_counter INTEGER DEFAULT 0;
          DECLARE v_firstnme VARCHAR(12);
          DECLARE v_midinit CHAR(1);
          DECLARE v_lastname VARCHAR(15);
          DECLARE c1 CURSOR FOR
            SELECT firstnme, midinit, lastname
            FROM employee;
          DECLARE CONTINUE HANDLER FOR NOT FOUND
            SET counter = -1;
          OPEN c1;
          fetch_loop:
          LOOP
            FETCH c1 INTO v_firstnme, v_midinit, v_lastname;
            IF v_midinit = ' ' THEN
              LEAVE fetch_loop;
            END IF;
            SET v_counter = v_counter + 1;
          END LOOP fetch_loop;
          SET counter = v_counter;
          CLOSE c1;
        END;

  - id: merge
    name: MERGE
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-merge
    tier: high
    probes:
      - id: update_insert
        sql: "MERGE INTO t USING s ON t.id = s.id WHEN MATCHED THEN UPDATE SET c = s.c WHEN NOT MATCHED THEN INSERT (id, c) VALUES (s.id, s.c);"
      - id: target_view
        sql: "MERGE INTO v USING s ON v.id = s.id WHEN MATCHED THEN UPDATE SET c = s.c;"
      - id: target_correlation
        sql: "MERGE INTO t AS tgt USING s ON tgt.id = s.id WHEN MATCHED THEN UPDATE SET c = s.c;"
      - id: target_correlation_columns
        sql: "MERGE INTO t AS tgt (a, b) USING s ON tgt.a = s.a WHEN MATCHED THEN UPDATE SET b = s.b;"
      - id: target_fullselect
        sql: "MERGE INTO (SELECT id, c FROM t) AS tgt USING s ON tgt.id = s.id WHEN MATCHED THEN UPDATE SET c = s.c;"
      - id: with_cte
        sql: "MERGE INTO t WITH cte (id, c) AS (SELECT id, c FROM s) USING cte ON t.id = cte.id WHEN MATCHED THEN UPDATE SET c = cte.c;"
        note: "Syntax block shows WITH common-table-expression after the target (table-name | view-name | (fullselect), optional WITH list)."
      - id: using_subselect
        sql: "MERGE INTO t USING (SELECT id, c FROM s) AS x ON t.id = x.id WHEN MATCHED THEN UPDATE SET c = x.c;"
      - id: using_table_values
        sql: "MERGE INTO t USING TABLE (VALUES (1, 2)) AS x (id, c) ON t.id = x.id WHEN MATCHED THEN UPDATE SET c = x.c;"
      - id: when_matched_and
        sql: "MERGE INTO t USING s ON t.id = s.id WHEN MATCHED AND s.flag = 1 THEN UPDATE SET c = s.c;"
      - id: when_not_matched_and
        sql: "MERGE INTO t USING s ON t.id = s.id WHEN NOT MATCHED AND s.flag = 1 THEN INSERT (id, c) VALUES (s.id, s.c);"
      - id: delete_operation
        sql: "MERGE INTO t USING s ON t.id = s.id WHEN MATCHED THEN DELETE;"
      - id: update_row_assignment
        sql: "MERGE INTO t USING s ON t.id = s.id WHEN MATCHED THEN UPDATE SET (a, b) = (s.a, s.b);"
      - id: update_row_fullselect
        sql: "MERGE INTO t USING s ON t.id = s.id WHEN MATCHED THEN UPDATE SET (a, b) = (SELECT 1, 2 FROM sysibm.sysdummy1);"
      - id: update_default_null
        sql: "MERGE INTO t USING s ON t.id = s.id WHEN MATCHED THEN UPDATE SET a = DEFAULT, b = NULL;"
      - id: update_row_default_null
        sql: "MERGE INTO t USING s ON t.id = s.id WHEN MATCHED THEN UPDATE SET (a, b) = (DEFAULT, NULL);"
      - id: insert_default_null
        sql: "MERGE INTO t USING s ON t.id = s.id WHEN NOT MATCHED THEN INSERT (a, b) VALUES (DEFAULT, NULL);"
      - id: insert_no_column_list
        sql: "MERGE INTO t USING s ON t.id = s.id WHEN NOT MATCHED THEN INSERT VALUES (s.a, s.b);"
      - id: insert_single_value
        sql: "MERGE INTO t USING s ON t.id = s.id WHEN NOT MATCHED THEN INSERT (a) VALUES s.a;"
      - id: update_period_clause
        sql: "MERGE INTO t USING s ON t.id = s.id WHEN MATCHED THEN UPDATE FOR PORTION OF BUSINESS_TIME FROM '2020-01-01' TO '2021-01-01' SET c = s.c;"
      - id: delete_period_clause
        sql: "MERGE INTO t USING s ON t.id = s.id WHEN MATCHED THEN DELETE FOR PORTION OF BUSINESS_TIME FROM '2020-01-01' TO '2021-01-01';"
      - id: signal_statement
        sql: "MERGE INTO t USING s ON t.id = s.id WHEN MATCHED AND s.d IS NULL THEN SIGNAL SQLSTATE '70001' SET MESSAGE_TEXT = 'unknown date';"
      - id: else_ignore
        sql: "MERGE INTO t USING s ON t.id = s.id WHEN MATCHED THEN UPDATE SET c = s.c ELSE IGNORE;"
      - id: multiple_when_clauses
        sql: "MERGE INTO t USING s ON t.id = s.id WHEN MATCHED AND s.d < CURRENT DATE THEN DELETE WHEN MATCHED THEN UPDATE SET c = s.c WHEN NOT MATCHED THEN INSERT (id, c) VALUES (s.id, s.c);"
      - id: isolation_ur
        sql: "MERGE INTO t USING s ON t.id = s.id WHEN MATCHED THEN UPDATE SET c = s.c WITH UR;"
      - id: isolation_rr
        sql: "MERGE INTO t USING s ON t.id = s.id WHEN MATCHED THEN UPDATE SET c = s.c WITH RR;"
    examples:
      - |-
        MERGE INTO archive ar
          USING (SELECT activity, description FROM activities) ac
          ON (ar.activity = ac.activity)
          WHEN MATCHED THEN
            UPDATE SET description = ac.description
          WHEN NOT MATCHED THEN
            INSERT (activity, description)
            VALUES (ac.activity, ac.description);
      - |-
        MERGE INTO employee_file AS e
          USING (SELECT empid, phone, office
                 FROM (SELECT empid, phone, office,
                              ROW_NUMBER() OVER (PARTITION BY empid ORDER BY transaction_time DESC) rn
                       FROM transaction_log) AS nt
                 WHERE rn = 1) AS t
          ON e.empid = t.empid
          WHEN MATCHED THEN
            UPDATE SET (phone, office) = (t.phone, t.office)
          WHEN NOT MATCHED THEN
            INSERT (empid, phone, office)
            VALUES (t.empid, t.phone, t.office);
      - |-
        MERGE INTO archive ar
          USING (SELECT activity, description, date, last_modified FROM activities_groupA) ac
          ON (ar.activity = ac.activity) AND ar.group = 'A'
          WHEN MATCHED AND ac.date IS NULL THEN
            SIGNAL SQLSTATE '70001'
            SET MESSAGE_TEXT = ac.activity CONCAT ' cannot be modified. Reason: Date is not known'
          WHEN MATCHED AND ac.date < CURRENT DATE THEN
            DELETE
          WHEN MATCHED AND ar.last_modified < ac.last_modified THEN
            UPDATE SET (description, date, last_modified) = (ac.description, ac.date, DEFAULT)
          WHEN NOT MATCHED AND ac.date IS NULL THEN
            SIGNAL SQLSTATE '70002'
            SET MESSAGE_TEXT = ac.activity CONCAT ' cannot be inserted. Reason: Date is not known'
          WHEN NOT MATCHED AND ac.date >= CURRENT DATE THEN
            INSERT (group, activity, description, date)
            VALUES ('A', ac.activity, ac.description, ac.date)
          ELSE IGNORE;
