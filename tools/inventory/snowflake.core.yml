  - id: create_hybrid_table
    name: "CREATE HYBRID TABLE"
    doc: https://docs.snowflake.com/en/sql-reference/sql/create-hybrid-table
    tier: medium
    probes:
      - { id: basic_index, sql: "CREATE HYBRID TABLE t (id INT AUTOINCREMENT PRIMARY KEY, name VARCHAR(255), email VARCHAR(255) UNIQUE, info VARIANT, INDEX idx_name (name));" }
      - { id: or_replace_if_not_exists, sql: "CREATE OR REPLACE HYBRID TABLE IF NOT EXISTS t (id INT PRIMARY KEY);" }
      - { id: out_of_line_pk_fk, sql: "CREATE HYBRID TABLE t (id INT PRIMARY KEY, team_id INT, FOREIGN KEY (team_id) REFERENCES team(team_id));" }
      - { id: index_include, sql: "CREATE HYBRID TABLE t (id INT PRIMARY KEY, a INT, b INT, INDEX idx_a (a) INCLUDE (b)) COMMENT = 'hybrid';" }
      - { id: check_constraint, sql: "CREATE HYBRID TABLE t (id INT PRIMARY KEY, q INT CHECK (q > 0), lp NUMBER(10,2), sp NUMBER(10,2), CONSTRAINT chk CHECK (sp <= lp));" }
      - { id: ctas, sql: "CREATE HYBRID TABLE t (id INT PRIMARY KEY, v VARCHAR) AS SELECT id, v FROM u;" }
      - { id: like, sql: "CREATE OR REPLACE HYBRID TABLE t LIKE u;" }
    examples:
      - |-
        CREATE HYBRID TABLE mytable (
          customer_id INT AUTOINCREMENT PRIMARY KEY,
          full_name VARCHAR(255),
          email VARCHAR(255) UNIQUE,
          extended_customer_info VARIANT,
          INDEX index_full_name (full_name)
        );
      - |-
        CREATE OR REPLACE HYBRID TABLE ht2pk (
          col1 INTEGER NOT NULL,
          col2 INTEGER NOT NULL,
          col3 VARCHAR,
          CONSTRAINT pkey_1 PRIMARY KEY (col1, col2)
          );
      - |-
        CREATE OR REPLACE HYBRID TABLE orders (
          order_id INTEGER PRIMARY KEY,
          quantity INTEGER CHECK (quantity > 0),
          list_price NUMBER(10,2),
          sale_price NUMBER(10,2),
          CONSTRAINT check_sale_price CHECK (sale_price <= list_price)
          );
      - |-
        CREATE OR REPLACE HYBRID TABLE ht2 (c1 INT PRIMARY KEY, c2 VARCHAR(10),
          INDEX idx_c2 (c2))
          DEFAULT_DDL_COLLATION = '';
      - |-
        CREATE OR REPLACE HYBRID TABLE player
          (player_id INT PRIMARY KEY,
          first_name VARCHAR(40),
          last_name VARCHAR(40),
          team_id INT,
          FOREIGN KEY (team_id) REFERENCES team(team_id));

