dialect: snowflake
engine: Snowflake
version: "current (docs read 2026-10-04)"
source: https://docs.snowflake.com/en/sql-reference/sql-all

statements:
  - id: describe_view
    name: DESCRIBE VIEW
    doc: https://docs.snowflake.com/en/sql-reference/sql/desc-view
    tier: medium
    probes:
      - { id: describe, sql: "DESCRIBE VIEW v;" }
      - { id: desc, sql: "DESC VIEW v;" }
      - { id: qualified, sql: "DESCRIBE VIEW db.s.v;" }
    examples:
      - "DESC VIEW emp_view;"

  - id: describe_warehouse
    name: DESCRIBE WAREHOUSE
    doc: https://docs.snowflake.com/en/sql-reference/sql/desc-warehouse
    tier: medium
    probes:
      - { id: describe, sql: "DESCRIBE WAREHOUSE w;" }
      - { id: desc, sql: "DESC WAREHOUSE w;" }
    examples:
      - "DESCRIBE WAREHOUSE temporary_warehouse;"

  - id: drop_alert
    name: DROP ALERT
    doc: https://docs.snowflake.com/en/sql-reference/sql/drop-alert
    tier: medium
    probes:
      - { id: basic, sql: "DROP ALERT a;" }
      - { id: if_exists, sql: "DROP ALERT IF EXISTS a;" }

  - id: drop_database_role
    name: DROP DATABASE ROLE
    doc: https://docs.snowflake.com/en/sql-reference/sql/drop-database-role
    tier: medium
    probes:
      - { id: basic, sql: "DROP DATABASE ROLE dr;" }
      - { id: if_exists, sql: "DROP DATABASE ROLE IF EXISTS db.dr;" }
    examples:
      - "DROP DATABASE ROLE d1.dr1;"

  - id: drop_file_format
    name: DROP FILE FORMAT
    doc: https://docs.snowflake.com/en/sql-reference/sql/drop-file-format
    tier: medium
    probes:
      - { id: basic, sql: "DROP FILE FORMAT ff;" }
      - { id: if_exists, sql: "DROP FILE FORMAT IF EXISTS ff;" }
    examples:
      - "DROP FILE FORMAT my_format;"

  - id: drop_masking_policy
    name: DROP MASKING POLICY
    doc: https://docs.snowflake.com/en/sql-reference/sql/drop-masking-policy
    tier: medium
    probes:
      - { id: basic, sql: "DROP MASKING POLICY mp;" }
    examples:
      - "DROP MASKING POLICY ssn_mask;"

  - id: drop_network_policy
    name: DROP NETWORK POLICY
    doc: https://docs.snowflake.com/en/sql-reference/sql/drop-network-policy
    tier: medium
    probes:
      - { id: basic, sql: "DROP NETWORK POLICY np;" }
      - { id: if_exists, sql: "DROP NETWORK POLICY IF EXISTS np;" }
    examples:
      - "DROP NETWORK POLICY mypolicy;"

  - id: drop_network_rule
    name: DROP NETWORK RULE
    doc: https://docs.snowflake.com/en/sql-reference/sql/drop-network-rule
    tier: medium
    probes:
      - { id: basic, sql: "DROP NETWORK RULE nr;" }
      - { id: if_exists, sql: "DROP NETWORK RULE IF EXISTS nr;" }
    examples:
      - "DROP NETWORK RULE myrule;"

  - id: drop_pipe
    name: DROP PIPE
    doc: https://docs.snowflake.com/en/sql-reference/sql/drop-pipe
    tier: medium
    probes:
      - { id: basic, sql: "DROP PIPE p;" }
      - { id: if_exists, sql: "DROP PIPE IF EXISTS p;" }
    examples:
      - "DROP PIPE mypipe;"

  - id: drop_role
    name: DROP ROLE
    doc: https://docs.snowflake.com/en/sql-reference/sql/drop-role
    tier: medium
    probes:
      - { id: basic, sql: "DROP ROLE r;" }
      - { id: if_exists, sql: "DROP ROLE IF EXISTS r;" }
    examples:
      - "DROP ROLE myrole;"
