dialect: db2
engine: IBM Db2 for Linux, UNIX and Windows
version: "11.5"
source: https://www.ibm.com/docs/en/db2/11.5.x?topic=reference-statements

statements:
  - id: alter_procedure_external
    name: ALTER PROCEDURE (external)
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-alter-procedure-external
    tier: high
    probes:
      - { id: external_name_string, sql: "ALTER PROCEDURE p EXTERNAL NAME 'lib!proc';" }
      - { id: external_name_identifier, sql: "ALTER PROCEDURE p EXTERNAL NAME proc_id;" }
      - { id: fenced, sql: "ALTER PROCEDURE p FENCED;" }
      - { id: not_fenced, sql: "ALTER PROCEDURE p NOT FENCED;" }
      - { id: external_action, sql: "ALTER PROCEDURE p EXTERNAL ACTION;" }
      - { id: no_external_action, sql: "ALTER PROCEDURE p NO EXTERNAL ACTION;" }
      - { id: threadsafe, sql: "ALTER PROCEDURE p THREADSAFE;" }
      - { id: not_threadsafe, sql: "ALTER PROCEDURE p NOT THREADSAFE;" }
      - { id: new_savepoint_level, sql: "ALTER PROCEDURE p NEW SAVEPOINT LEVEL;" }
      - { id: designator_with_types, sql: "ALTER PROCEDURE s.p (INTEGER, VARCHAR(10)) FENCED;" }
      - { id: designator_empty_params, sql: "ALTER PROCEDURE p () NOT FENCED;" }
      - { id: designator_specific, sql: "ALTER SPECIFIC PROCEDURE s.sp_1 NOT FENCED;" }
      - { id: multiple_options, sql: "ALTER PROCEDURE p EXTERNAL NAME 'lib!proc' NOT FENCED THREADSAFE NO EXTERNAL ACTION NEW SAVEPOINT LEVEL;" }

  - id: alter_procedure_sourced
    name: ALTER PROCEDURE (sourced)
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-alter-procedure-sourced
    tier: high
    probes:
      - { id: alter_parameter, sql: "ALTER PROCEDURE p ALTER PARAMETER a SET DATA TYPE VARCHAR(20);" }
      - { id: designator_with_types, sql: "ALTER PROCEDURE s.p (INTEGER, VARCHAR(10)) ALTER PARAMETER a SET DATA TYPE BIGINT;" }
      - { id: designator_specific, sql: "ALTER SPECIFIC PROCEDURE s.sp_1 ALTER PARAMETER a SET DATA TYPE DECIMAL(10,2);" }
