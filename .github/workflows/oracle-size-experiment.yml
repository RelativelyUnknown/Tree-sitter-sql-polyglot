name: Oracle size experiment

# Throwaway investigation (never a required check): generates the oracle parser once per variant from
# .github/experiments/oracle-size/variants.py, each removing one group of statements or expressions
# from the dispatch lists in the CI checkout only, and records STATE_COUNT, SYMBOL_COUNT, the largest
# ACTIONS() index (tree-sitter stores it in 16 bits) and the generate time.
on:
  push:
    branches: ["ccr-7b871ec0-wgknnh"]
    paths: [".github/experiments/oracle-size/**"]

concurrency:
  group: oracle-size-${{ github.ref }}
  cancel-in-progress: true

jobs:
  variant:
    name: size (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        variant: [multiset+domain+default, default+format, multiset+domain+format]
    steps:
      - uses: actions/checkout@v4
      - uses: tree-sitter/setup-action@v2
        with:
          install-lib: false
          tree-sitter-ref: v0.26.3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Add swap
        run: |
          sudo swapoff -a || true
          avail_gb=$(df --output=avail -BG /mnt | tail -1 | tr -dc '0-9')
          size_gb=$(( avail_gb > 40 ? 32 : avail_gb - 4 ))
          sudo fallocate -l "${size_gb}G" /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
      - name: Apply variant
        run: python3 .github/experiments/oracle-size/variants.py "${{ matrix.variant }}"
      - name: Generate and measure
        run: |
          cd oracle
          /usr/bin/time -v -o /tmp/time.txt tree-sitter generate grammar.js || true
          echo "variant=${{ matrix.variant }}"
          grep -E "Elapsed|Maximum resident" /tmp/time.txt
          for d in STATE_COUNT LARGE_STATE_COUNT SYMBOL_COUNT; do grep -m1 "#define $d" src/parser.c || echo "no parser"; done
          python3 - <<'PY'
          import re
          s = open('src/parser.c').read()
          print('MAX_ACTIONS', max(int(m) for m in re.findall(r'ACTIONS\((\d+)\)', s)))
          PY
