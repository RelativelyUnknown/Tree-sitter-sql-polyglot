dialect: mariadb
engine: MariaDB Server
version: "11.x (current)"
source: https://mariadb.com/docs/server/reference/sql-statements

statements:
  - id: open
    name: OPEN
    doc: https://mariadb.com/docs/server/reference/sql-statements/programmatic-compound-statements/programmatic-compound-statements-cursors/open
    tier: high
    probes:
      - id: basic
        sql: "OPEN cur;"
        note: "OPEN cursor_name; the USING/expression and FOR PREPARE/LOCAL forms on the page are Oracle-mode and need MariaDB 12.3 or 13.1.1, so they are not probed for 11.x."
  - id: fetch
    name: FETCH
    doc: https://mariadb.com/docs/server/reference/sql-statements/programmatic-compound-statements/programmatic-compound-statements-cursors/fetch
    tier: high
    probes:
      - id: single_variable
        sql: "FETCH cur INTO a;"
      - id: multiple_variables
        sql: "FETCH cur INTO a, b, c;"
