        );

  - id: create_spatial_index
    name: "CREATE SPATIAL INDEX"
    doc: https://learn.microsoft.com/en-us/sql/t-sql/statements/create-spatial-index-transact-sql
    tier: medium
    probes:
      - id: geometry_bounding_box
        sql: "CREATE SPATIAL INDEX sidx ON t (g) WITH (BOUNDING_BOX = (0, 0, 500, 200));"
      - id: geometry_auto_grid
        sql: "CREATE SPATIAL INDEX sidx ON t (g) USING GEOMETRY_AUTO_GRID WITH (BOUNDING_BOX = (0, 0, 500, 200), CELLS_PER_OBJECT = 8);"
      - id: geometry_grid_named_bbox
        sql: "CREATE SPATIAL INDEX sidx ON t (g) USING GEOMETRY_GRID WITH (BOUNDING_BOX = (xmin = 0, ymin = 0, xmax = 500, ymax = 200), GRIDS = (LOW, LOW, MEDIUM, HIGH), CELLS_PER_OBJECT = 64, PAD_INDEX = ON);"
      - id: grid_levels
        sql: "CREATE SPATIAL INDEX sidx ON t (g) WITH (BOUNDING_BOX = (0, 0, 500, 200), GRIDS = (LEVEL_4 = HIGH, LEVEL_3 = MEDIUM));"
      - id: geography_default
        sql: "CREATE SPATIAL INDEX sidx ON t (geo);"
      - id: geography_grid
        sql: "CREATE SPATIAL INDEX sidx ON t (geo) USING GEOGRAPHY_GRID WITH (GRIDS = (MEDIUM, LOW, MEDIUM, HIGH), CELLS_PER_OBJECT = 64, PAD_INDEX = ON);"
      - id: geography_auto_grid_on_filegroup
        sql: "CREATE SPATIAL INDEX sidx ON t (geo) USING GEOGRAPHY_AUTO_GRID WITH (CELLS_PER_OBJECT = 12, DATA_COMPRESSION = PAGE) ON [PRIMARY];"
    examples:
      - |-
        CREATE SPATIAL INDEX SIndx_SpatialTable_geometry_col2
           ON SpatialTable(geometry_col)
           USING GEOMETRY_GRID
           WITH (
            BOUNDING_BOX = ( xmin=0, ymin=0, xmax=500, ymax=200 ),
            GRIDS = (LOW, LOW, MEDIUM, HIGH),
            CELLS_PER_OBJECT = 64,
            PAD_INDEX  = ON );
      - |-
        CREATE SPATIAL INDEX SIndx_SpatialTable_geometry_col3
           ON SpatialTable(geometry_col)
           WITH (
            BOUNDING_BOX = ( 0, 0, 500, 200 ),
            GRIDS = ( LEVEL_4 = HIGH, LEVEL_3 = MEDIUM ) );
      - |-
        CREATE SPATIAL INDEX SIndx_SpatialTable_geography_col1
           ON SpatialTable2(object);
      - |-
        CREATE SPATIAL INDEX SIndx_SpatialTable_geography_col2
           ON SpatialTable2(object)
           USING GEOGRAPHY_GRID
           WITH (
            GRIDS = (MEDIUM, LOW, MEDIUM, HIGH ),
            CELLS_PER_OBJECT = 64,
            PAD_INDEX  = ON );
      - |-
        CREATE SPATIAL INDEX SIndx_SpatialTable_geography_col3
           ON SpatialTable2(object)
           WITH ( GRIDS = ( LEVEL_3 = HIGH, LEVEL_2 = HIGH ) );

