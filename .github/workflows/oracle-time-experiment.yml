name: Oracle time experiment

# Throwaway investigation (never a required check): generates the oracle parser once per variant from
# .github/experiments/oracle-time/variants.py, each dropping one group of rules from views_tx.js in the CI
# checkout only, and records generate time, STATE_COUNT and peak memory.
on:
  push:
    branches: ["ccr-7b871ec0-wgknnh"]
    paths: [".github/experiments/oracle-time/**"]

concurrency:
  group: oracle-time-${{ github.ref }}
  cancel-in-progress: true

jobs:
  variant:
    name: time (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        variant: [no_alter_view, no_view_constraints, no_view_column_props]
    steps:
      - uses: actions/checkout@v4
      - uses: tree-sitter/setup-action@v2
        with:
          install-lib: false
          tree-sitter-ref: v0.26.3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply variant
        run: python3 .github/experiments/oracle-time/variants.py "${{ matrix.variant }}"
      - name: Generate and measure
        run: |
          cd oracle
          /usr/bin/time -v -o /tmp/time.txt tree-sitter generate grammar.js || true
          echo "variant=${{ matrix.variant }}"
          grep -E "Elapsed|Maximum resident" /tmp/time.txt
          grep -m1 "#define STATE_COUNT" src/parser.c || echo "no parser (generate failed)"
