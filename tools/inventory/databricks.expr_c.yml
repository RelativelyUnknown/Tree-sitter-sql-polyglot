dialect: databricks
engine: Databricks SQL / Databricks Runtime
version: "current (docs read 2026-10-04)"
source: https://docs.databricks.com/aws/en/sql/language-manual/

statements: []

expressions:
  - id: c_aggregate_filter_distinct
    name: Aggregate functions (DISTINCT, ALL, FILTER)
    doc: https://docs.databricks.com/aws/en/sql/language-manual/functions/count
    tier: high
    probes:
      - { id: count_star, sql: "SELECT count(*) FROM t;" }
      - { id: count_all_star, sql: "SELECT count(ALL *) FROM t;" }
      - { id: count_distinct_star, sql: "SELECT count(DISTINCT *) FROM t;" }
      - { id: count_expr, sql: "SELECT count(c) FROM t;" }
      - { id: count_distinct, sql: "SELECT count(DISTINCT c) FROM t;" }
      - { id: count_distinct_multi, sql: "SELECT count(DISTINCT c1, c2) FROM t;" }
      - { id: count_all, sql: "SELECT count(ALL c) FROM t;" }
      - { id: count_filter, sql: "SELECT count(c) FILTER (WHERE c < 10) FROM t;" }
      - { id: count_star_filter, sql: "SELECT count(*) FILTER (WHERE c < 10) FROM t;" }
      - { id: count_distinct_filter, sql: "SELECT count(DISTINCT c) FILTER (WHERE c > 0) FROM t;" }
      - { id: sum_distinct, sql: "SELECT sum(DISTINCT c) FROM t;" }
      - { id: sum_all, sql: "SELECT sum(ALL c) FROM t;" }
      - { id: sum_filter, sql: "SELECT sum(c) FILTER (WHERE d = 'a') FROM t;" }
      - { id: multiple_filters, sql: "SELECT sum(c) FILTER (WHERE d = 'a') AS a_sum, sum(c) FILTER (WHERE d = 'b') AS b_sum FROM t;" }
      - { id: count_if_filter, sql: "SELECT count_if(c > 0) FILTER (WHERE d IS NOT NULL) FROM t;" }
      - { id: array_agg_distinct, sql: "SELECT array_agg(DISTINCT c) FROM t;" }
      - { id: collect_list_filter, sql: "SELECT collect_list(c) FILTER (WHERE c > 0) FROM t;" }
      - { id: collect_set_filter, sql: "SELECT collect_set(c) FILTER (WHERE c > 0) FROM t;" }
      - { id: approx_count_distinct_filter, sql: "SELECT approx_count_distinct(c, 0.05) FILTER (WHERE c > 0) FROM t;" }
      - { id: percentile_filter, sql: "SELECT percentile(DISTINCT c, 0.5, 1) FILTER (WHERE c > 0) FROM t;" }
      - { id: median_filter, sql: "SELECT median(DISTINCT c) FILTER (WHERE c > 0) FROM t;" }
      - { id: mode_filter, sql: "SELECT mode(c, true) FILTER (WHERE c > 0) FROM t;" }
      - { id: max_by_filter, sql: "SELECT max_by(a, b) FILTER (WHERE b > 0) FROM t;" }
      - { id: regr_slope_filter, sql: "SELECT regr_slope(DISTINCT y, x) FILTER (WHERE x > 0) FROM t;" }
      - { id: first_ignore_nulls, sql: "SELECT first(c) FILTER (WHERE c > 0) IGNORE NULLS FROM t;" }
      - { id: last_respect_nulls, sql: "SELECT last(c, false) RESPECT NULLS FROM t;" }
      - { id: any_value_ignore_nulls, sql: "SELECT any_value(c) IGNORE NULLS FROM t;" }
      - { id: first_value_ignore_nulls, sql: "SELECT first_value(c, true) FILTER (WHERE c > 0) IGNORE NULLS FROM t;" }
      - { id: last_value_respect_nulls, sql: "SELECT last_value(c) RESPECT NULLS FROM t;" }
      - { id: grouping, sql: "SELECT a, grouping(a) FROM t GROUP BY a WITH ROLLUP;" }
      - { id: grouping_id, sql: "SELECT a, b, grouping_id(a, b) FROM t GROUP BY a, b WITH CUBE;" }
    examples:
      - "SELECT count(*) FROM VALUES (NULL), (5), (5), (20) AS tab(col);"
      - "SELECT count(col) FILTER (WHERE col < 10) FROM VALUES (NULL), (5), (5), (20) AS tab(col);"
      - "SELECT count(DISTINCT col1, col2) FROM VALUES (NULL, NULL), (5, NULL), (5, 1), (5, 2), (NULL, 2), (20, 2) AS tab(col1, col2);"

  - id: c_aggregate_within_group
    name: Ordered-set aggregates (WITHIN GROUP)
    doc: https://docs.databricks.com/aws/en/sql/language-manual/functions/listagg
    tier: high
    probes:
      - { id: listagg_default, sql: "SELECT listagg(c) FROM t;" }
      - { id: listagg_delimiter, sql: "SELECT listagg(c, ', ') FROM t;" }
      - { id: listagg_distinct, sql: "SELECT listagg(DISTINCT c) FROM t;" }
      - { id: listagg_all, sql: "SELECT listagg(ALL c, ',') FROM t;" }
      - { id: listagg_within_group, sql: "SELECT listagg(c) WITHIN GROUP (ORDER BY c DESC) FROM t;" }
      - { id: listagg_within_group_delimiter, sql: "SELECT listagg(c, ', ') WITHIN GROUP (ORDER BY c) FROM t;" }
      - { id: listagg_within_group_asc_nulls, sql: "SELECT listagg(c) WITHIN GROUP (ORDER BY c ASC NULLS LAST) FROM t;" }
      - { id: listagg_within_group_multi, sql: "SELECT listagg(c) WITHIN GROUP (ORDER BY c DESC NULLS FIRST, d ASC) FROM t;" }
      - { id: listagg_within_group_filter, sql: "SELECT listagg(c, ',') WITHIN GROUP (ORDER BY c) FILTER (WHERE c IS NOT NULL) FROM t;" }
      - { id: listagg_filter, sql: "SELECT listagg(c) FILTER (WHERE c <> 'x') FROM t;" }
      - { id: string_agg_within_group, sql: "SELECT string_agg(c, ', ') WITHIN GROUP (ORDER BY c DESC NULLS LAST) FROM t;" }
      - { id: string_agg_distinct_filter, sql: "SELECT string_agg(DISTINCT c) FILTER (WHERE c IS NOT NULL) FROM t;" }
      - { id: percentile_cont, sql: "SELECT percentile_cont(0.5) WITHIN GROUP (ORDER BY c) FROM t;" }
      - { id: percentile_cont_desc, sql: "SELECT percentile_cont(0.5) WITHIN GROUP (ORDER BY c DESC) FROM t;" }
      - { id: percentile_cont_array, sql: "SELECT percentile_cont(array(0.5, 0.4, 0.1)) WITHIN GROUP (ORDER BY c) FROM t;" }
      - { id: percentile_disc, sql: "SELECT percentile_disc(0.5) WITHIN GROUP (ORDER BY c ASC) FROM t;" }
      - { id: percentile_disc_array, sql: "SELECT percentile_disc(array(0.25, 0.75)) WITHIN GROUP (ORDER BY c DESC) FROM t;" }
      - { id: percentile_cont_over, sql: "SELECT percentile_cont(0.5) WITHIN GROUP (ORDER BY c) OVER (PARTITION BY d) FROM t;" }
    examples:
      - "SELECT listagg(col) FROM VALUES ('a'), ('b'), ('c') AS tab(col);"
      - "SELECT listagg(col, ', ') FROM VALUES ('a'), ('b'), ('c') AS tab(col);"
      - "SELECT listagg(col) WITHIN GROUP (ORDER BY col DESC) FROM VALUES ('a'), ('b'), ('c') AS tab(col);"

  - id: c_window_over
    name: Window functions (OVER clause)
    doc: https://docs.databricks.com/aws/en/sql/language-manual/sql-ref-window-functions
    tier: high
    probes:
      - { id: over_empty, sql: "SELECT sum(c) OVER () FROM t;" }
      - { id: over_partition_by, sql: "SELECT sum(c) OVER (PARTITION BY d) FROM t;" }
      - { id: over_partition_by_multi, sql: "SELECT sum(c) OVER (PARTITION BY d, e) FROM t;" }
      - { id: over_order_by, sql: "SELECT sum(c) OVER (ORDER BY d) FROM t;" }
      - { id: over_order_by_multi, sql: "SELECT sum(c) OVER (ORDER BY d DESC NULLS LAST, e ASC NULLS FIRST) FROM t;" }
      - { id: over_partition_order, sql: "SELECT sum(c) OVER (PARTITION BY d ORDER BY e) FROM t;" }
      - { id: over_partition_order_frame, sql: "SELECT sum(c) OVER (PARTITION BY d ORDER BY e ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) FROM t;" }
      - { id: over_distribute_by, sql: "SELECT sum(c) OVER (DISTRIBUTE BY d) FROM t;" }
      - { id: over_distribute_by_sort_by, sql: "SELECT sum(c) OVER (DISTRIBUTE BY d SORT BY e) FROM t;" }
      - { id: over_distribute_by_multi, sql: "SELECT sum(c) OVER (DISTRIBUTE BY d, e SORT BY f DESC) FROM t;" }
      - { id: over_cluster_by, sql: "SELECT sum(c) OVER (CLUSTER BY d) FROM t;" }
      - { id: over_sort_by, sql: "SELECT sum(c) OVER (SORT BY e) FROM t;" }
      - { id: over_partition_by_sort_by, sql: "SELECT sum(c) OVER (PARTITION BY d SORT BY e) FROM t;" }
      - { id: row_number, sql: "SELECT row_number() OVER (PARTITION BY d ORDER BY e) FROM t;" }
      - { id: rank, sql: "SELECT rank() OVER (PARTITION BY d ORDER BY e) FROM t;" }
      - { id: dense_rank, sql: "SELECT dense_rank() OVER (ORDER BY e) FROM t;" }
      - { id: percent_rank, sql: "SELECT percent_rank() OVER (ORDER BY e) FROM t;" }
      - { id: ntile, sql: "SELECT ntile(4) OVER (ORDER BY e) FROM t;" }
      - { id: ntile_no_arg, sql: "SELECT ntile() OVER (ORDER BY e) FROM t;" }
      - { id: cume_dist_range, sql: "SELECT cume_dist() OVER (PARTITION BY d ORDER BY e RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) FROM t;" }
      - { id: lag, sql: "SELECT lag(c) OVER (PARTITION BY d ORDER BY e) FROM t;" }
      - { id: lag_offset_default, sql: "SELECT lag(c, 2, 0) OVER (PARTITION BY d ORDER BY e) FROM t;" }
      - { id: lead_offset_default, sql: "SELECT lead(c, 1, 0) OVER (PARTITION BY d ORDER BY e) FROM t;" }
      - { id: lag_ignore_nulls, sql: "SELECT lag(c, 1) IGNORE NULLS OVER (ORDER BY e) FROM t;" }
      - { id: lead_respect_nulls, sql: "SELECT lead(c) RESPECT NULLS OVER (ORDER BY e) FROM t;" }
      - { id: nth_value, sql: "SELECT nth_value(c, 2) OVER (ORDER BY e) FROM t;" }
      - { id: nth_value_ignore_nulls, sql: "SELECT nth_value(c, 2) IGNORE NULLS OVER (ORDER BY e) FROM t;" }
      - { id: first_value_ignore_nulls, sql: "SELECT first_value(c) IGNORE NULLS OVER (PARTITION BY d ORDER BY e) FROM t;" }
      - { id: first_value_ignorenull_arg, sql: "SELECT first_value(c, true) OVER (PARTITION BY d ORDER BY e) FROM t;" }
      - { id: last_value_respect_nulls, sql: "SELECT last_value(c) RESPECT NULLS OVER (PARTITION BY d ORDER BY e ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING) FROM t;" }
      - { id: first_over, sql: "SELECT first(c) OVER (PARTITION BY d ORDER BY e) FROM t;" }
      - { id: last_ignore_nulls_over, sql: "SELECT last(c) IGNORE NULLS OVER (ORDER BY e) FROM t;" }
      - { id: any_value_over, sql: "SELECT any_value(c) OVER (PARTITION BY d) FROM t;" }
      - { id: count_star_over, sql: "SELECT count(*) OVER (PARTITION BY d) FROM t;" }
      - { id: avg_over, sql: "SELECT avg(c) OVER (PARTITION BY d ORDER BY e) FROM t;" }
      - { id: min_max_over, sql: "SELECT min(c) OVER (PARTITION BY d), max(c) OVER (PARTITION BY d) FROM t;" }
      - { id: collect_list_over, sql: "SELECT collect_list(c) OVER (PARTITION BY d ORDER BY e) FROM t;" }
      - { id: median_over, sql: "SELECT median(c) OVER (PARTITION BY d) FROM t;" }
      - { id: listagg_over, sql: "SELECT listagg(c, ',') OVER (PARTITION BY d) FROM t;" }
      - { id: window_in_expression, sql: "SELECT c - avg(c) OVER (PARTITION BY d) AS diff FROM t;" }
      - { id: window_in_qualify, sql: "SELECT c FROM t QUALIFY row_number() OVER (PARTITION BY d ORDER BY e) = 1;" }
      - { id: window_in_order_by, sql: "SELECT c FROM t ORDER BY rank() OVER (ORDER BY e);" }
    examples:
      - "SELECT name, dept, RANK() OVER (PARTITION BY dept ORDER BY salary) AS rank FROM employees;"
      - "SELECT name, dept, DENSE_RANK() OVER (PARTITION BY dept ORDER BY salary ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS dense_rank FROM employees;"
      - "SELECT name, salary, LAG(salary) OVER (PARTITION BY dept ORDER BY salary) AS lag, LEAD(salary, 1, 0) OVER (PARTITION BY dept ORDER BY salary) AS lead FROM employees;"

