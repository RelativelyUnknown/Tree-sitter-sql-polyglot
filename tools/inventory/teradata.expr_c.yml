      - { id: width_bucket, sql: "SELECT WIDTH_BUCKET(x, 0, 100, 10) FROM t;", note: "Syntax block spells it WIDTH BUCKET; the function name is WIDTH_BUCKET" }
      - { id: nullifzero_zeroifnull, sql: "SELECT NULLIFZERO(x), ZEROIFNULL(x) FROM t;" }
      - { id: case_n, sql: "SELECT CASE_N(x < 10, x < 20, x < 30) FROM t;" }
      - { id: case_n_no_case_or_unknown, sql: "SELECT CASE_N(x < 10, x < 20, NO CASE) FROM t;", note: "case_spec: NO CASE / UNKNOWN forms" }
      - { id: case_n_no_case_or_unknown_both, sql: "SELECT CASE_N(x < 10, x < 20, NO CASE OR UNKNOWN) FROM t;" }
      - { id: case_n_unknown, sql: "SELECT CASE_N(x < 10, x < 20, UNKNOWN) FROM t;" }
      - { id: range_n_between, sql: "SELECT RANGE_N(x BETWEEN 1 AND 100 EACH 10) FROM t;" }
      - { id: range_n_ranges, sql: "SELECT RANGE_N(x BETWEEN *, 10, 20 AND 30, 40 AND * , NO RANGE OR UNKNOWN) FROM t;" }
      - { id: range_n_dates, sql: "SELECT RANGE_N(d BETWEEN DATE '2020-01-01' AND DATE '2020-12-31' EACH INTERVAL '1' MONTH) FROM t;" }

