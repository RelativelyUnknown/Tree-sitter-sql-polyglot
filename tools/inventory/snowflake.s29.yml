dialect: snowflake
engine: Snowflake
version: "current (docs read 2026-10-04)"
source: https://docs.snowflake.com/en/sql-reference/sql-all

statements:
  - id: show_databases_in_replication_group
    name: SHOW DATABASES IN REPLICATION GROUP
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-databases-in-replication-group
    tier: low
    probes:
      - { id: basic, sql: "SHOW DATABASES IN REPLICATION GROUP rg;" }
  - id: show_datasets
    name: SHOW DATASETS
    doc: https://docs.snowflake.com/en/sql-reference/sql/show-datasets
    tier: low
    probes:
      - { id: basic, sql: "SHOW DATASETS;" }
      - { id: like_in_schema, sql: "SHOW DATASETS LIKE '%x%' IN SCHEMA db.s STARTS WITH 'a' LIMIT 10 FROM 'b';" }
