dialect: redshift
engine: Amazon Redshift
version: "current"
source: https://docs.aws.amazon.com/redshift/latest/dg/c_SQL_commands.html

statements:
  - id: copy
    name: COPY
    doc: https://docs.aws.amazon.com/redshift/latest/dg/r_COPY.html
    tier: high
    probes:
      - id: s3_iam_role
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE 'arn:aws:iam::0123456789012:role/MyRole';"
      - id: iam_role_default
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default;"
      - id: iam_role_session
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE 'SESSION';"
      - id: column_list
        sql: "COPY t (c1, c2) FROM 's3://bucket/path' IAM_ROLE default;"
      - id: s3_manifest
        sql: "COPY t FROM 's3://bucket/cust.manifest' IAM_ROLE default MANIFEST;"
      - id: s3_encrypted
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default ENCRYPTED;"
      - id: s3_region
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default REGION 'us-east-1';"
      - id: s3_region_as
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default REGION AS 'us-east-1';"
      - id: emr_source
        sql: "COPY t FROM 'emr://j-SAMPLE2B500FC/myoutput/part-*' IAM_ROLE default;"
      - id: ssh_source
        sql: "COPY t FROM 's3://bucket/ssh_manifest' IAM_ROLE default SSH;"
      - id: dynamodb_readratio
        sql: "COPY t FROM 'dynamodb://Movies' IAM_ROLE default READRATIO 50;"
      - id: dynamodb_readratio_region
        sql: "COPY t FROM 'dynamodb://Movies' IAM_ROLE default READRATIO 50 REGION AS 'us-east-1';"
      - id: format_csv
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default FORMAT CSV;"
      - id: format_as_csv
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default FORMAT AS CSV;"
      - id: csv
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default CSV;"
      - id: csv_quote
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default CSV QUOTE AS '%';"
      - id: delimiter
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default DELIMITER '|';"
      - id: delimiter_as
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default DELIMITER AS ',';"
      - id: fixedwidth
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default FIXEDWIDTH 'c1:3,c2:25';"
      - id: shapefile
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default FORMAT SHAPEFILE;"
      - id: shapefile_simplify
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default FORMAT SHAPEFILE SIMPLIFY AUTO 1.1;"
      - id: avro_auto
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default FORMAT AS AVRO 'auto';"
      - id: avro_auto_ignorecase
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default FORMAT AS AVRO 'auto ignorecase';"
      - id: avro_paths
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default FORMAT AVRO 's3://bucket/avropath';"
      - id: json_auto
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default JSON 'auto';"
      - id: json_auto_ignorecase
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default JSON 'auto ignorecase';"
      - id: json_paths
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default JSON AS 's3://bucket/jsonpaths.json';"
      - id: format_json
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default FORMAT JSON 'auto';"
      - id: parquet
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default FORMAT AS PARQUET;"
      - id: orc
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default FORMAT AS ORC;"
      - id: gzip
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default GZIP DELIMITER '|';"
      - id: bzip2
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default BZIP2;"
      - id: lzop
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default LZOP;"
      - id: zstd
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default ZSTD;"
      - id: acceptanydate
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default ACCEPTANYDATE;"
      - id: acceptinvchars
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default ACCEPTINVCHARS AS '^';"
      - id: blanksasnull
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default BLANKSASNULL;"
      - id: dateformat
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default DATEFORMAT AS 'MM/DD/YYYY';"
      - id: dateformat_auto
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default DATEFORMAT 'auto';"
      - id: emptyasnull
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default EMPTYASNULL;"
      - id: encoding
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default ENCODING UTF16;"
      - id: escape
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default DELIMITER '|' ESCAPE;"
      - id: explicit_ids
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default EXPLICIT_IDS;"
      - id: fillrecord
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default FILLRECORD;"
      - id: ignoreblanklines
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default IGNOREBLANKLINES;"
      - id: ignoreheader
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default IGNOREHEADER 1;"
      - id: ignoreheader_as
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default IGNOREHEADER AS 1;"
      - id: null_as
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default NULL AS '\\0';"
      - id: removequotes
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default REMOVEQUOTES;"
      - id: roundec
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default ROUNDEC;"
      - id: timeformat
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default TIMEFORMAT 'YYYY-MM-DD HH:MI:SS';"
      - id: timeformat_epochsecs
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default TIMEFORMAT AS 'epochsecs';"
      - id: trimblanks
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default TRIMBLANKS;"
      - id: truncatecolumns
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default TRUNCATECOLUMNS;"
      - id: comprows
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default COMPROWS 1000000;"
      - id: compupdate_off
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default COMPUPDATE OFF;"
      - id: compupdate_preset
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default COMPUPDATE PRESET;"
      - id: compupdate_on
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default COMPUPDATE ON;"
      - id: ignoreallerrors
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default IGNOREALLERRORS;"
      - id: maxerror
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default MAXERROR 5;"
      - id: maxerror_as
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default MAXERROR AS 5;"
      - id: noload
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default NOLOAD;"
      - id: statupdate_off
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default STATUPDATE OFF;"
      - id: statupdate_true
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default STATUPDATE TRUE;"
      - id: combined_options
        sql: "COPY t FROM 's3://bucket/path' IAM_ROLE default REMOVEQUOTES EMPTYASNULL BLANKSASNULL MAXERROR 5 DELIMITER '|' TIMEFORMAT 'YYYY-MM-DD HH:MI:SS';"
    examples:
      - "copy customer from 's3://amzn-s3-demo-bucket/customer' iam_role 'arn:aws:iam::0123456789012:role/MyRedshiftRole';"
      - "copy customer from 's3://amzn-s3-demo-bucket/cust.manifest' iam_role 'arn:aws:iam::0123456789012:role/MyRedshiftRole' manifest;"
      - "copy favoritemovies from 'dynamodb://Movies' iam_role 'arn:aws:iam::0123456789012:role/MyRedshiftRole' readratio 50;"

  - id: create_function
    name: CREATE FUNCTION
    doc: https://docs.aws.amazon.com/redshift/latest/dg/r_CREATE_FUNCTION.html
    tier: high
    probes:
      - id: sql_udf
        sql: "CREATE FUNCTION f_f (float, float) RETURNS float STABLE AS $$ SELECT CASE WHEN $1 > $2 THEN $1 ELSE $2 END $$ LANGUAGE sql;"
      - id: or_replace
        sql: "CREATE OR REPLACE FUNCTION f_f (float, float) RETURNS float STABLE AS $$ SELECT $1 + $2 $$ LANGUAGE sql;"
      - id: no_args
        sql: "CREATE FUNCTION f_f () RETURNS int IMMUTABLE AS $$ SELECT 1 $$ LANGUAGE sql;"
      - id: python_udf
        sql: |-
          CREATE FUNCTION f_f (a float, b float) RETURNS float STABLE AS $$
            if a > b:
              return a
            return b
          $$ LANGUAGE plpythonu;
      - id: volatile
        sql: "CREATE FUNCTION f_f (int) RETURNS int VOLATILE AS $$ SELECT $1 $$ LANGUAGE sql;"
      - id: immutable
        sql: "CREATE FUNCTION f_f (int) RETURNS int IMMUTABLE AS $$ SELECT $1 $$ LANGUAGE sql;"
      - id: schema_qualified
        sql: "CREATE FUNCTION myschema.f_f (int) RETURNS int STABLE AS $$ SELECT $1 $$ LANGUAGE sql;"
      - id: tagged_dollar_quote
        sql: "CREATE FUNCTION f_f (int) RETURNS int STABLE AS $test$ SELECT $1 $test$ LANGUAGE sql;"
      - id: varchar_args
        sql: "CREATE FUNCTION f_f (varchar, decimal(10,2)) RETURNS varchar STABLE AS $$ SELECT $1 $$ LANGUAGE sql;"
      - id: anyelement
        sql: "CREATE FUNCTION f_f (a anyelement, b anyelement) RETURNS anyelement IMMUTABLE AS $$ return a $$ LANGUAGE plpythonu;"
      - id: python_double_precision
        sql: "CREATE FUNCTION f_f (x double precision) RETURNS double precision IMMUTABLE AS $$ return x $$ LANGUAGE plpythonu;"
      - id: nested_udf_call
        sql: "CREATE FUNCTION f_sql_commission (float, float) RETURNS float STABLE AS $$ SELECT f_sql_greater ($1, $2) $$ LANGUAGE sql;"
    examples:
      - |-
        create function f_py_greater (a float, b float)
          returns float
        stable
        as $$
          if a > b:
            return a
          return b
        $$ language plpythonu;
      - |-
        create function f_sql_greater (float, float)
          returns float
        stable
        as $$
          select case when $1 > $2 then $1 else $2 end
        $$ language sql;
      - |-
        create function f_sql_commission (float, float )
          returns float
        stable
        as $$
          select f_sql_greater ($1, $2)
        $$ language sql;
