    tier: high
    probes:
      - { id: scalar, sql: "CREATE MACRO add(a, b) AS a + b;" }
      - { id: or_replace, sql: "CREATE OR REPLACE MACRO add(a, b) AS a + b;" }
      - { id: if_not_exists, sql: "CREATE MACRO IF NOT EXISTS add(a, b) AS a + b;" }
      - { id: temporary, sql: "CREATE TEMPORARY MACRO add(a, b) AS a + b;" }
      - { id: temp, sql: "CREATE OR REPLACE TEMP MACRO add(a, b) AS a + b;" }
      - { id: function_keyword, sql: "CREATE FUNCTION main.my_avg(x) AS sum(x) / count(x);" }
      - { id: no_params, sql: "CREATE MACRO one() AS (SELECT 1);" }
      - { id: case_body, sql: "CREATE MACRO ifelse(a, b, c) AS CASE WHEN a THEN b ELSE c END;" }
      - { id: default_param, sql: "CREATE MACRO add_default(a, b := 5) AS a + b;" }
      - { id: typed_param, sql: "CREATE MACRO is_maximal(a INTEGER) AS a = 2^31 - 1;" }
      - { id: typed_default_param, sql: "CREATE MACRO m(a INTEGER, b INTEGER := 5) AS a + b;" }
      - { id: table_macro, sql: "CREATE MACRO static_table() AS TABLE SELECT 'Hello' AS column1, 'World' AS column2;" }
      - { id: table_macro_params, sql: "CREATE MACRO get_users(i) AS TABLE SELECT * FROM users WHERE uid IN (SELECT unnest(i));" }
      - { id: table_macro_from_first, sql: "CREATE MACRO tm(tbl) AS TABLE FROM query_table(tbl);" }
      - { id: overloads, sql: "CREATE MACRO add_x (a, b) AS a + b, (a, b, c) AS a + b + c;" }
      - { id: typed_overloads, sql: "CREATE OR REPLACE MACRO is_maximal (a TINYINT) AS a = 2^7 - 1, (a INT) AS a = 2^31 - 1;" }
      - { id: call_named_args, sql: "SELECT triple_add(40, c := 1, b := 1) AS x;" }
    examples:
      - "CREATE MACRO add_default(a, b := 5) AS a + b;"
      - "CREATE MACRO is_maximal(a INTEGER) AS a = 2^31 - 1;"
      - "CREATE OR REPLACE TEMP MACRO dynamic_table(col1_value, col2_value) AS TABLE\n    SELECT col1_value AS column1, col2_value AS column2\n    UNION ALL\n    SELECT 'Hello' AS col1_value, 456 AS col2_value;"
      - "CREATE MACRO add_x\n    (a, b) AS a + b,\n    (a, b, c) AS a + b + c;"
      - "CREATE FUNCTION main.my_avg(x) AS sum(x) / count(x);"

