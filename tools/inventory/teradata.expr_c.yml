    tier: medium
    probes:
      - { id: csum, sql: "SELECT CSUM(x, d) FROM t;" }
      - { id: csum_desc, sql: "SELECT CSUM(x, d DESC, e ASC) FROM t;" }
      - { id: mavg, sql: "SELECT MAVG(x, 6, d) FROM t;" }
      - { id: mavg_multi_sort, sql: "SELECT MAVG(Sale, 6, Region ASC, Store DESC) FROM t;" }
      - { id: msum, sql: "SELECT MSUM(x, 3, d DESC) FROM t;" }
      - { id: mdiff, sql: "SELECT MDIFF(x, 2, d) FROM t;" }
      - { id: mlinreg, sql: "SELECT MLINREG(x, 5, d ASC) FROM t;" }
      - { id: ordered_with_group_by, sql: "SELECT a, CSUM(SUM(x), a) FROM t GROUP BY a;" }
      - { id: ordered_with_qualify, sql: "SELECT a, x FROM t QUALIFY RANK(x DESC) <= 3;" }

  - id: c_arithmetic_functions
