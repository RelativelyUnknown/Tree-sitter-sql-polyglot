dialect: db2
engine: IBM Db2 for Linux, UNIX and Windows
version: "11.5"
source: https://www.ibm.com/docs/en/db2/11.5.x?topic=reference-statements

statements: []

expressions:
  - id: a_numeric_constants
    name: Numeric constants
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=elements-constants
    tier: high
    probes:
      - { id: integer, sql: "SELECT 64, -123, 0 FROM t;" }
      - { id: decimal, sql: "SELECT 123.45, 5., .5 FROM t;" }
      - { id: floating, sql: "SELECT 15E1, 2.E5, 2.2E-1, 5.E+2 FROM t;" }
      - { id: decfloat, sql: "SELECT DECFLOAT('6.0221415E23', 34) FROM t;" }
  - id: a_string_constants
    name: Character, graphic and binary string constants
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=elements-constants
    tier: high
    probes:
      - { id: character, sql: "SELECT 'text', 'O''Reilly', '' FROM t;" }
      - { id: hex_character, sql: "SELECT X'46' FROM t;" }
      - { id: graphic_gx, sql: "SELECT GX'005200690063006B' FROM t;" }
      - { id: graphic_ux, sql: "SELECT UX'0042006F006200620079' FROM t;" }
      - { id: national, sql: "SELECT N'double-byte text' FROM t;" }
      - { id: binary_bx, sql: "SELECT BX'C141C242' FROM t;" }
      - { id: unicode_escape, sql: "SELECT U&'\\0141ód\\017A is a city in Poland' FROM t;" }
      - { id: unicode_uescape, sql: "SELECT U&'@+01D11E' UESCAPE '@' FROM t;" }
  - id: a_datetime_constants
    name: Datetime constants
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=elements-constants
    tier: high
    probes:
      - { id: date, sql: "SELECT DATE '2024-01-31' FROM t;" }
      - { id: time, sql: "SELECT TIME '13:45:30' FROM t;" }
      - { id: timestamp, sql: "SELECT TIMESTAMP '2024-01-31 13:45:30.123456' FROM t;" }
      - { id: timestamp_dashed, sql: "SELECT TIMESTAMP '2024-01-31-13.45.30.123456' FROM t;" }
  - id: a_boolean_null_constants
    name: Boolean and null constants
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=elements-constants
    tier: medium
    probes:
      - { id: boolean, sql: "SELECT TRUE, FALSE FROM t;" }
      - { id: null_value, sql: "SELECT NULL FROM t;" }
  - id: a_labeled_durations
    name: Labeled durations
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=expressions-datetime-operations-durations
    tier: high
    probes:
      - { id: days, sql: "SELECT d + 1 DAY FROM t;" }
      - { id: plural_units, sql: "SELECT d + 3 MONTHS + 2 YEARS FROM t;" }
      - { id: time_units, sql: "SELECT ts - 30 MINUTES + 10 SECONDS FROM t;" }
      - { id: microseconds, sql: "SELECT ts + 5 MICROSECONDS FROM t;" }
      - { id: expression_duration, sql: "SELECT d + (c) DAYS FROM t;" }
  - id: a_builtin_types
    name: Built-in data type names
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=elements-data-types
    tier: high
    probes:
      - { id: integers, sql: "SELECT CAST(c AS SMALLINT), CAST(c AS INTEGER), CAST(c AS INT), CAST(c AS BIGINT) FROM t;" }
      - { id: decimal, sql: "SELECT CAST(c AS DECIMAL(10, 2)), CAST(c AS DEC(5)), CAST(c AS NUMERIC(8, 3)) FROM t;" }
      - { id: float, sql: "SELECT CAST(c AS REAL), CAST(c AS DOUBLE), CAST(c AS DOUBLE PRECISION), CAST(c AS FLOAT(24)) FROM t;" }
      - { id: decfloat, sql: "SELECT CAST(c AS DECFLOAT(16)), CAST(c AS DECFLOAT(34)) FROM t;" }
      - { id: character, sql: "SELECT CAST(c AS CHAR(10)), CAST(c AS CHARACTER(10)), CAST(c AS VARCHAR(100)), CAST(c AS CHAR VARYING(10)) FROM t;" }
      - { id: char_units, sql: "SELECT CAST(c AS VARCHAR(100 CODEUNITS32)), CAST(c AS CHAR(10 OCTETS)) FROM t;" }
      - { id: for_bit_data, sql: "SELECT CAST(c AS VARCHAR(10) FOR BIT DATA), CAST(c AS CHAR(10) FOR BIT DATA) FROM t;" }
      - { id: lobs, sql: "SELECT CAST(c AS CLOB(1M)), CAST(c AS BLOB(2G)), CAST(c AS DBCLOB(1K)), CAST(c AS CHARACTER LARGE OBJECT(10)) FROM t;" }
      - { id: graphic, sql: "SELECT CAST(c AS GRAPHIC(10)), CAST(c AS VARGRAPHIC(20)) FROM t;" }
      - { id: national, sql: "SELECT CAST(c AS NCHAR(10)), CAST(c AS NVARCHAR(10)), CAST(c AS NATIONAL CHARACTER(10)) FROM t;" }
      - { id: binary, sql: "SELECT CAST(c AS BINARY(10)), CAST(c AS VARBINARY(20)) FROM t;" }
      - { id: datetime, sql: "SELECT CAST(c AS DATE), CAST(c AS TIME), CAST(c AS TIMESTAMP), CAST(c AS TIMESTAMP(6)) FROM t;" }
      - { id: boolean, sql: "SELECT CAST(c AS BOOLEAN) FROM t;" }
      - { id: xml, sql: "SELECT CAST(c AS XML) FROM t;" }
  - id: a_user_defined_types
    name: User-defined type names
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=elements-data-types
    tier: medium
    probes:
      - { id: distinct_type, sql: "SELECT CAST(c AS myschema.money_t) FROM t;" }
      - { id: array_type, sql: "SELECT CAST(ARRAY[1, 2, 3] AS intarr) FROM t;" }
      - { id: row_type, sql: "SELECT CAST(ROW(1, 'a') AS myrow) FROM t;" }
  - id: a_cast_specification
    name: CAST specification
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=expressions-cast-specification
    tier: high
    probes:
      - { id: basic, sql: "SELECT CAST(c AS INTEGER) FROM t;" }
      - { id: null_cast, sql: "SELECT CAST(NULL AS VARCHAR(10)) FROM t;" }
      - { id: parameter_marker, sql: "SELECT CAST(? AS INTEGER) FROM t;" }
      - { id: scope, sql: "SELECT CAST(c AS REF(myschema.tt) SCOPE myschema.tab) FROM t;" }
      - { id: nested, sql: "SELECT CAST(CAST(c AS VARCHAR(10)) AS INTEGER) FROM t;" }
  - id: a_array_constructors
    name: Array constructors
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=expressions-array-constructor
    tier: medium
    probes:
      - { id: array_values, sql: "SELECT ARRAY[1, 2, 3] FROM t;" }
      - { id: array_empty, sql: "SELECT ARRAY[] FROM t;" }
      - { id: array_subquery, sql: "SELECT ARRAY[(SELECT c FROM t)] FROM t;" }
      - { id: array_element, sql: "SELECT a[1] FROM t;" }
  - id: a_row_expression
    name: ROW expression
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=expressions-row-expression
    tier: low
    probes:
      - { id: row_value, sql: "SELECT ROW(1, 'a') FROM t;" }
  - id: a_identifiers
    name: Identifiers and quoting
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=elements-identifiers
    tier: high
    probes:
      - { id: delimited, sql: 'SELECT "WKLY SAL" FROM t;' }
      - { id: reserved_delimited, sql: 'SELECT "UNION" FROM t;' }
      - { id: embedded_quote, sql: 'SELECT "a""b" FROM t;' }
      - { id: qualified, sql: 'SELECT s.t.c FROM s.t;' }
      - { id: delimited_qualified, sql: 'SELECT "s"."t"."c" FROM "s"."t";' }
  - id: a_comments
    name: Comments
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=elements-sql-comments
    tier: high
    probes:
      - { id: line_comment, sql: "SELECT 1 -- trailing comment\n FROM t;" }
      - { id: bracketed_comment, sql: "SELECT /* inline */ 1 FROM t;" }
      - { id: multiline_comment, sql: "/* line one\n   line two */\nSELECT 1 FROM t;" }
  - id: a_parameter_markers
    name: Parameter markers
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=elements-parameter-markers
    tier: high
    probes:
      - { id: question_mark, sql: "SELECT c FROM t WHERE c = ? AND d > ?;" }
      - { id: typed_marker, sql: "SELECT c FROM t WHERE c = CAST(? AS INTEGER);" }
  - id: a_host_and_sql_variables
    name: Host variables, SQL variables and global variables
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=elements-references-host-variables
    tier: high
    probes:
      - { id: host_variable, sql: "SELECT c FROM t WHERE c = :hv;" }
      - { id: indicator_variable, sql: "SELECT c FROM t WHERE c = :hv :ind;" }
      - { id: qualified_global_variable, sql: "SELECT myschema.gv FROM t;" }
  - id: a_special_registers
    name: Special registers
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=elements-special-registers
    tier: high
    probes:
      - { id: current_date, sql: "SELECT CURRENT DATE, CURRENT_DATE FROM t;" }
      - { id: current_time, sql: "SELECT CURRENT TIME, CURRENT_TIME FROM t;" }
      - { id: current_timestamp, sql: "SELECT CURRENT TIMESTAMP, CURRENT_TIMESTAMP, CURRENT TIMESTAMP(3) FROM t;" }
      - { id: current_schema, sql: "SELECT CURRENT SCHEMA, CURRENT_SCHEMA FROM t;" }
      - { id: current_user, sql: "SELECT CURRENT USER, CURRENT_USER, SESSION_USER, SYSTEM_USER, USER FROM t;" }
      - { id: current_path, sql: "SELECT CURRENT PATH, CURRENT_PATH FROM t;" }
      - { id: current_server, sql: "SELECT CURRENT SERVER, CURRENT_SERVER FROM t;" }
      - { id: current_isolation, sql: "SELECT CURRENT ISOLATION FROM t;" }
      - { id: current_timezone, sql: "SELECT CURRENT TIMEZONE, CURRENT_TIMEZONE FROM t;" }
      - { id: client_registers, sql: "SELECT CURRENT CLIENT_USERID, CURRENT CLIENT_APPLNAME, CURRENT CLIENT_ACCTNG FROM t;" }
