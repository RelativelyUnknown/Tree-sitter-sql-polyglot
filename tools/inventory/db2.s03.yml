dialect: db2
engine: IBM Db2 for Linux, UNIX and Windows
version: "11.5"
source: https://www.ibm.com/docs/en/db2/11.5.x?topic=reference-statements

statements:
  - id: alter_procedure_sql
    name: ALTER PROCEDURE (SQL)
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-alter-procedure-sql
    tier: high
    probes:
      - { id: external_action, sql: "ALTER PROCEDURE p EXTERNAL ACTION;" }
      - { id: no_external_action, sql: "ALTER PROCEDURE p NO EXTERNAL ACTION;" }
      - { id: new_savepoint_level, sql: "ALTER PROCEDURE p NEW SAVEPOINT LEVEL;" }
      - { id: with_signature, sql: "ALTER PROCEDURE s.p(DOUBLE, VARCHAR(10)) NO EXTERNAL ACTION;" }
      - { id: specific_procedure, sql: "ALTER SPECIFIC PROCEDURE sp1 EXTERNAL ACTION;" }
    examples:
      - "ALTER PROCEDURE MEDIAN_RESULT_SET( DOUBLE ) NO EXTERNAL ACTION;"

  - id: alter_table
    name: ALTER TABLE
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-alter-table
    tier: high
    probes:
      - { id: add_column, sql: "ALTER TABLE t ADD COLUMN c INTEGER;" }
      - { id: add_column_no_keyword, sql: "ALTER TABLE t ADD c CHAR(1);" }
      - { id: add_column_not_null_default, sql: "ALTER TABLE t ADD COLUMN c SMALLINT NOT NULL DEFAULT 1;" }
      - { id: add_column_with_default, sql: "ALTER TABLE t ADD COLUMN c VARCHAR(10) WITH DEFAULT 'x';" }
      - { id: add_column_default_special_register, sql: "ALTER TABLE t ADD COLUMN c VARCHAR(128) DEFAULT CURRENT SCHEMA;" }
      - { id: add_column_default_null, sql: "ALTER TABLE t ADD COLUMN c INTEGER DEFAULT NULL;" }
      - { id: add_column_for_bit_data, sql: "ALTER TABLE t ADD COLUMN c VARCHAR(1000) FOR BIT DATA;" }
      - { id: add_column_codeunits, sql: "ALTER TABLE t ADD COLUMN c VARCHAR(10 CODEUNITS32);" }
      - { id: add_column_decimal, sql: "ALTER TABLE t ADD COLUMN c DECIMAL(10,2);" }
      - { id: add_column_clob_lob_options, sql: "ALTER TABLE t ADD COLUMN c CLOB(1M) NOT LOGGED COMPACT;" }
      - { id: add_column_blob_default, sql: "ALTER TABLE t ADD COLUMN c BLOB(1M) DEFAULT BLOB(X'01');" }
      - { id: add_column_scope, sql: "ALTER TABLE t ADD COLUMN c REF(s) SCOPE tt;" }
      - { id: add_column_primary_key, sql: "ALTER TABLE t ADD COLUMN c INTEGER NOT NULL PRIMARY KEY;" }
      - { id: add_column_unique, sql: "ALTER TABLE t ADD COLUMN c INTEGER UNIQUE;" }
      - { id: add_column_named_constraint, sql: "ALTER TABLE t ADD COLUMN c INTEGER CONSTRAINT k UNIQUE;" }
      - { id: add_column_references, sql: "ALTER TABLE t ADD COLUMN c INTEGER REFERENCES p (id) ON DELETE CASCADE ON UPDATE NO ACTION;" }
      - { id: add_column_references_set_null, sql: "ALTER TABLE t ADD COLUMN c INTEGER REFERENCES p ON DELETE SET NULL;" }
      - { id: add_column_check, sql: "ALTER TABLE t ADD COLUMN c INTEGER CHECK (c > 0);" }
      - { id: add_column_constraint_attributes, sql: "ALTER TABLE t ADD COLUMN c INTEGER CHECK (c > 0) NOT ENFORCED ENABLE QUERY OPTIMIZATION;" }
      - { id: add_column_compress_system_default, sql: "ALTER TABLE t ADD COLUMN c INTEGER COMPRESS SYSTEM DEFAULT;" }
      - { id: add_column_secured_with, sql: "ALTER TABLE t ADD COLUMN c INTEGER SECURED WITH lbl;" }
