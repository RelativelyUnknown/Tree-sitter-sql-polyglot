dialect: db2
engine: IBM Db2 for Linux, UNIX and Windows
version: "11.5"
source: https://www.ibm.com/docs/en/db2/11.5.x?topic=reference-statements

statements:
  - id: for
    name: FOR
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-for
    tier: high
    probes:
      - id: basic
        sql: "BEGIN ATOMIC FOR v1 AS SELECT c FROM t DO INSERT INTO t2 VALUES (v1.c); END FOR; END;"
      - id: cursor_name
        sql: "BEGIN ATOMIC FOR v1 AS cur1 CURSOR FOR SELECT c FROM t DO INSERT INTO t2 VALUES (v1.c); END FOR; END;"
      - id: asensitive
        sql: "CREATE PROCEDURE p() LANGUAGE SQL BEGIN FOR v1 AS cur1 ASENSITIVE CURSOR FOR SELECT c FROM t DO INSERT INTO t2 VALUES (v1.c); END FOR; END;"
      - id: insensitive_with_hold
        sql: "CREATE PROCEDURE p() LANGUAGE SQL BEGIN FOR v1 AS cur1 INSENSITIVE CURSOR WITH HOLD FOR SELECT c FROM t DO INSERT INTO t2 VALUES (v1.c); END FOR; END;"
      - id: without_hold
        sql: "CREATE PROCEDURE p() LANGUAGE SQL BEGIN FOR v1 AS cur1 CURSOR WITHOUT HOLD FOR SELECT c FROM t DO INSERT INTO t2 VALUES (v1.c); END FOR; END;"
      - id: label
        sql: "CREATE PROCEDURE p() LANGUAGE SQL BEGIN lbl: FOR v1 AS SELECT c FROM t DO INSERT INTO t2 VALUES (v1.c); END FOR lbl; END;"
      - id: multiple_statements
        sql: "BEGIN ATOMIC DECLARE x INTEGER; FOR v1 AS SELECT c FROM t DO SET x = v1.c; INSERT INTO t2 VALUES (x); END FOR; END;"
      - id: leave_iterate
        sql: "CREATE PROCEDURE p() LANGUAGE SQL BEGIN lbl: FOR v1 AS SELECT c FROM t DO IF v1.c = 0 THEN ITERATE lbl; ELSEIF v1.c < 0 THEN LEAVE lbl; END IF; END FOR lbl; END;"
      - id: with_cte
        sql: "BEGIN ATOMIC FOR v1 AS WITH q AS (SELECT c FROM t) SELECT c FROM q DO INSERT INTO t2 VALUES (v1.c); END FOR; END;"
    examples:
      - "BEGIN ATOMIC DECLARE fullname CHAR(40); FOR vl AS SELECT firstnme, midinit, lastname FROM employee DO SET fullname = lastname CONCAT ',' CONCAT firstnme CONCAT ' ' CONCAT midinit; INSERT INTO tnames VALUES (fullname); END FOR; END;"

  - id: get_diagnostics
    name: GET DIAGNOSTICS
    doc: https://www.ibm.com/docs/en/db2/11.5.x?topic=statements-get-diagnostics
    tier: high
    probes:
      - id: row_count
        sql: "CREATE PROCEDURE p() LANGUAGE SQL BEGIN DECLARE rcount INTEGER; UPDATE t SET c = 1; GET DIAGNOSTICS rcount = ROW_COUNT; END;"
      - id: return_status
        sql: "CREATE PROCEDURE p() LANGUAGE SQL BEGIN DECLARE retval INTEGER DEFAULT 0; CALL q; GET DIAGNOSTICS retval = DB2_RETURN_STATUS; END;"
      - id: nesting_level
        sql: "CREATE PROCEDURE p() LANGUAGE SQL BEGIN DECLARE lvl INTEGER; GET DIAGNOSTICS lvl = DB2_SQL_NESTING_LEVEL; END;"
      - id: return_status_alt
        sql: "CREATE PROCEDURE p() LANGUAGE SQL BEGIN DECLARE retval INTEGER; CALL q; GET DIAGNOSTICS retval = RETURN_STATUS; END;"
      - id: exception_message_text
        sql: "CREATE PROCEDURE p() LANGUAGE SQL BEGIN DECLARE msg VARCHAR(255); DECLARE EXIT HANDLER FOR SQLEXCEPTION BEGIN GET DIAGNOSTICS EXCEPTION 1 msg = MESSAGE_TEXT; END; UPDATE t SET c = 1; END;"
      - id: exception_token_string
        sql: "CREATE PROCEDURE p() LANGUAGE SQL BEGIN DECLARE tok VARCHAR(1000); DECLARE EXIT HANDLER FOR SQLEXCEPTION BEGIN GET DIAGNOSTICS EXCEPTION 1 tok = DB2_TOKEN_STRING; END; UPDATE t SET c = 1; END;"
      - id: exception_multiple_items
        sql: "CREATE PROCEDURE p() LANGUAGE SQL BEGIN DECLARE msg VARCHAR(255); DECLARE tok VARCHAR(1000); DECLARE EXIT HANDLER FOR SQLEXCEPTION BEGIN GET DIAGNOSTICS EXCEPTION 1 msg = MESSAGE_TEXT, tok = DB2_TOKEN_STRING; END; UPDATE t SET c = 1; END;"
